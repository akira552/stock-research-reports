&lt;div class=&quot;front&quot; id=&quot;front&quot; data-layer=&quot;首頁&quot;&gt;&lt;header class=&quot;hero&quot;&gt;&lt;div&gt;&lt;span class=&quot;stance&quot;&gt;生意 A／價格偏貴&lt;/span&gt;&lt;span class=&quot;stance rating&quot;&gt;研究評等　生意 A ／ 價格偏貴（非買賣建議）&lt;/span&gt;&lt;h1&gt;生意品質頂尖，但現價已預付高於基準的成長，價格偏貴。&lt;/h1&gt;&lt;p class=&quot;summary&quot;&gt;微軟靠企業軟體訂閱與 Azure（微軟的公有雲平台）雲端賺錢，轉換成本與定價力都有證據，生意品質評 A。AI 資料中心投資讓資本支出吃掉大部分營運現金流，新增投資的報酬正在下降。合理價值約 284.40–456.09 美元（中點 352.24 美元），收盤 523.88 美元，價格位置 偏貴。市價隱含的營收成長高於我們的基準路徑（見第五題）。研究評等非買賣建議。&lt;/p&gt;&lt;/div&gt;&lt;aside class=&quot;pricebox&quot;&gt;&lt;div class=&quot;sub&quot;&gt;2026-11-13 收盤 523.88 美元&lt;/div&gt;&lt;div class=&quot;big&quot;&gt;523.88&lt;span style=&quot;font-size:18px&quot;&gt; 美元&lt;/span&gt;&lt;/div&gt;

&lt;div class=&quot;rows&quot;&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;股價 ÷ 合理價值中點&lt;/span&gt;&lt;span&gt;1.49 倍&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;10 年期美國公債&lt;/span&gt;&lt;span&gt;5.10%&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;r&quot;&gt;&lt;span&gt;市價隱含 5 年營收年增&lt;/span&gt;&lt;span&gt;18.9%&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;現金與證券（2026-09-30）&lt;/span&gt;&lt;span&gt;1,023 億美元&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;有息負債&lt;/span&gt;&lt;span&gt;355 億美元&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;淨現金&lt;/span&gt;&lt;span&gt;668 億美元&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;近四季回購&lt;/span&gt;&lt;span&gt;210 億美元&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;近四季公開市場回購均價（在合理價值區間內）&lt;/span&gt;&lt;span&gt;398.88 美元&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot; style=&quot;display:block&quot;&gt;&lt;span&gt;股東回報與權益（2022–2026）：&lt;/span&gt;&lt;span style=&quot;font-weight:400&quot;&gt;近五年平均 ROE 38%；股東權益 1,665→4,424 億美元；股利＋回購占自由現金流 66%（逐年表見第六題）&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; id=&quot;cont-note&quot; style=&quot;margin:10px 0 0&quot;&gt;這個數字只描述現價與本報告合理價值中點的距離，不改價格位置與研究評等。非買賣建議。&lt;/p&gt;&lt;/aside&gt;&lt;/header&gt;&lt;section class=&quot;note-box&quot; id=&quot;value-trio&quot; style=&quot;margin-top:18px&quot;&gt;&lt;h3&gt;合理價值與市價隱含第 10 年倍數&lt;/h3&gt;&lt;div class=&quot;zones&quot; style=&quot;grid-template-columns:repeat(2,1fr)&quot;&gt;&lt;div class=&quot;zone&quot;&gt;&lt;span&gt;合理價值（只含折現率）&lt;/span&gt;&lt;b&gt;284–456 美元&lt;/b&gt;&lt;small&gt;中點 352.24 美元；三情境機率加權&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;zone mkt&quot;&gt;&lt;span&gt;市價隱含第 10 年倍數（EV/EBIT，基準情境）&lt;/span&gt;&lt;b&gt;22.4 倍&lt;/b&gt;&lt;small&gt;模型假設 10.3 倍，市價隱含是模型的 2.2 倍；折現率區間 17.7–28.0 倍；參考帶（產業：Software (System &amp;amp; Application)，104 筆、5 家）中位 20.9 倍、四分位 12.4–35.4 倍、p90 54.5 倍（機械回測樣本，非市場全體；分產業的筆數與公司數少，僅供參考）；只描述，不進評等&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;參考帶中位（Software (System &amp;amp; Application)） 20.9 倍時，機率加權每股約 523 美元（條件式，非目標價、非買賣建議，不進評等；各倍數對照見計算底稿 5）。&lt;/p&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;&lt;b&gt;合理價值 vs 市價隱含倍數（作者判讀）：&lt;/b&gt;市價隱含第 10 年企業價值約為營業利益的 22.4 倍，模型基準只給 10.3 倍，相差 2.18 倍；換低折現率 8.86% 時仍為 17.7 對 12.6 倍。隱含倍數接近產業參考帶中位、低於 p75，無特例。差距可用較高成長、較高利潤率或較低折現率任一解釋（見計算底稿 5 三視角反推），本報告不判斷是哪一個；只描述，不進評等、非目標價。&lt;/p&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:10px;font-size:15px;line-height:1.7&quot;&gt;上面的合理價值只含折現率高低；三情境全幅 158～735（情境與折現率一起算，約中點的 164%）；寬主要來自情境（差距 109%），不是折現率（49%）。情境差距＝（樂觀－保守）÷基準，折現率寬度＝（高－低）÷中點；非買賣建議。&lt;/p&gt;&lt;div class=&quot;tw&quot; style=&quot;margin-top:14px&quot;&gt;&lt;table class=&quot;txt&quot; style=&quot;min-width:0;font-size:16px&quot;&gt;&lt;tr&gt;&lt;th style=&quot;padding:9px 12px;font-size:15px&quot;&gt;情境&lt;/th&gt;&lt;th style=&quot;padding:9px 12px;font-size:15px&quot;&gt;每股價值&lt;/th&gt;&lt;th style=&quot;padding:9px 12px;font-size:15px&quot;&gt;權重&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;padding:9px 12px&quot;&gt;保守&lt;/td&gt;&lt;td style=&quot;padding:9px 12px;font-size:20px;font-weight:700&quot;&gt;187.91&lt;/td&gt;&lt;td style=&quot;padding:9px 12px&quot;&gt;25%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;padding:9px 12px&quot;&gt;基準&lt;div style=&quot;font-size:13px;line-height:1.5;color:var(--muted);margin-top:2px&quot;&gt;與外部 DCF 單點同口徑；今天的現值，不是 12 個月目標價，非買賣建議&lt;/div&gt;&lt;/td&gt;&lt;td style=&quot;padding:9px 12px;font-size:20px;font-weight:700&quot;&gt;334.05&lt;/td&gt;&lt;td style=&quot;padding:9px 12px&quot;&gt;50%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;padding:9px 12px&quot;&gt;樂觀&lt;/td&gt;&lt;td style=&quot;padding:9px 12px;font-size:20px;font-weight:700&quot;&gt;552.96&lt;/td&gt;&lt;td style=&quot;padding:9px 12px&quot;&gt;25%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:10px;font-size:15px;line-height:1.7&quot;&gt;中點是三個情境的加權，上下緣是換折現率重算；算式見&lt;a href=&quot;#valuation&quot;&gt;第五題&lt;/a&gt;。情境表說明合理價值怎麼組成，不是單一目標價。&lt;/p&gt;&lt;/section&gt;&lt;!--目標區間:首頁--&gt;&lt;div class=&quot;note-box tgt&quot; id=&quot;target-front&quot;&gt;&lt;h3&gt;12 個月條件式目標區間&lt;/h3&gt;&lt;p style=&quot;margin:0 0 6px&quot;&gt;如果三種情境各自成真，一年後（至 2027-11-13）每股價值大約落在：保守 171.09–251.44、基準 295.58–470.12、樂觀 478.56–806.99 美元。這是條件式區間，不是股價預測，三段不合成單一數字。&lt;/p&gt;&lt;figure class=&quot;figure wide&quot;&gt;&lt;svg viewBox=&quot;0 0 860 232&quot; role=&quot;img&quot; aria-label=&quot;今天的價值區間與 12 個月後的條件式目標區間（條件式、非買賣建議）&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;178.8&quot; x2=&quot;178.8&quot; y1=&quot;24&quot; y2=&quot;198&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;178.8&quot; y=&quot;212&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;200&lt;/text&gt;&lt;line x1=&quot;295.3&quot; x2=&quot;295.3&quot; y1=&quot;24&quot; y2=&quot;198&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;295.3&quot; y=&quot;212&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;400&lt;/text&gt;&lt;line x1=&quot;411.8&quot; x2=&quot;411.8&quot; y1=&quot;24&quot; y2=&quot;198&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;411.8&quot; y=&quot;212&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;600&lt;/text&gt;&lt;line x1=&quot;528.3&quot; x2=&quot;528.3&quot; y1=&quot;24&quot; y2=&quot;198&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;528.3&quot; y=&quot;212&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;800&lt;/text&gt;&lt;text x=&quot;4&quot; y=&quot;16&quot; class=&quot;lab&quot; font-weight=&quot;700&quot;&gt;今天（依證據的價值；倍數列只作交叉核對）&lt;/text&gt;&lt;text x=&quot;142&quot; y=&quot;42.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;合理價值&lt;/text&gt;&lt;rect x=&quot;228.0&quot; y=&quot;30.0&quot; width=&quot;100.0&quot; height=&quot;16&quot; rx=&quot;8&quot; fill=&quot;var(--pos)&quot; opacity=&quot;0.8&quot;&gt;&lt;title&gt;合理價值：284.4–456.1&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;334.0&quot; y=&quot;42.0&quot; class=&quot;ax&quot;&gt;284.4–456.1；買入區上緣 211.3&lt;/text&gt;&lt;text x=&quot;142&quot; y=&quot;70.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;倍數交叉核對（不進評等）&lt;/text&gt;&lt;rect x=&quot;212.4&quot; y=&quot;58.0&quot; width=&quot;134.3&quot; height=&quot;16&quot; rx=&quot;8&quot; fill=&quot;var(--muted)&quot; opacity=&quot;0.35&quot;&gt;&lt;title&gt;倍數交叉核對（不進評等）：257.6–488.2&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;352.7&quot; y=&quot;70.0&quot; class=&quot;ax&quot;&gt;257.6–488.2&lt;/text&gt;&lt;text x=&quot;4&quot; y=&quot;96&quot; class=&quot;lab&quot; font-weight=&quot;700&quot;&gt;12 個月後（條件式目標區間，不進評等）&lt;/text&gt;&lt;text x=&quot;142&quot; y=&quot;122.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;保守 25%&lt;/text&gt;&lt;rect x=&quot;162.0&quot; y=&quot;110.0&quot; width=&quot;46.8&quot; height=&quot;16&quot; rx=&quot;8&quot; fill=&quot;var(--c5)&quot; opacity=&quot;0.85&quot;&gt;&lt;title&gt;保守 25%：171.1–251.4&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;214.8&quot; y=&quot;122.0&quot; class=&quot;ax&quot;&gt;171.09–251.44｜相對現價 −67%～−52%&lt;/text&gt;&lt;text x=&quot;142&quot; y=&quot;150.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;基準 50%&lt;/text&gt;&lt;rect x=&quot;234.5&quot; y=&quot;138.0&quot; width=&quot;101.7&quot; height=&quot;16&quot; rx=&quot;8&quot; fill=&quot;var(--c1)&quot; opacity=&quot;0.85&quot;&gt;&lt;title&gt;基準 50%：295.6–470.1&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;342.2&quot; y=&quot;150.0&quot; class=&quot;ax&quot;&gt;295.58–470.12｜相對現價 −44%～−10%&lt;/text&gt;&lt;text x=&quot;142&quot; y=&quot;178.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;樂觀 25%&lt;/text&gt;&lt;rect x=&quot;341.1&quot; y=&quot;166.0&quot; width=&quot;191.3&quot; height=&quot;16&quot; rx=&quot;8&quot; fill=&quot;var(--c2)&quot; opacity=&quot;0.85&quot;&gt;&lt;title&gt;樂觀 25%：478.6–807.0&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;538.4&quot; y=&quot;178.0&quot; class=&quot;ax&quot;&gt;478.56–806.99｜相對現價 −9%～+54%&lt;/text&gt;&lt;line x1=&quot;185.4&quot; x2=&quot;185.4&quot; y1=&quot;27&quot; y2=&quot;49&quot; class=&quot;buyline&quot;/&gt;&lt;line x1=&quot;367.5&quot; x2=&quot;367.5&quot; y1=&quot;24&quot; y2=&quot;198&quot; class=&quot;price&quot;/&gt;&lt;text x=&quot;367.5&quot; y=&quot;228&quot; class=&quot;pricelab&quot; text-anchor=&quot;middle&quot;&gt;現價 523.88&lt;/text&gt;&lt;/svg&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;條件式、非買賣建議；2026-11-13 至 2027-11-13；機率為政策權重，未經歷史校準；細節見第五題。&lt;/p&gt;&lt;/figure&gt;&lt;/div&gt;&lt;!--/目標區間:首頁--&gt;&lt;div class=&quot;kpis&quot;&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;l&quot;&gt;近四季營收年增&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;17.9%&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;一年前 15.6%，成長加速（截至 2026-09-30）&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;l&quot;&gt;商用未履約義務&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;6,770 億美元&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;年增 73%，約 30% 在 12 個月內認列（10-Q 2026-09-30）&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;l&quot;&gt;營業利益率（近四季）&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;47.1%&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;FY2023 為 41.8%；產業中位約 33%（Damodaran）&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;l&quot;&gt;每股自由現金流扣股權薪酬&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;6.36 美元&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;近四季；未扣為 8.05 美元，資本支出 1,359 億&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;note-box&quot; id=&quot;survival&quot; style=&quot;border-left-color:var(--pos)&quot;&gt;&lt;p style=&quot;margin:0&quot;&gt;&lt;b&gt;信用評級&lt;/b&gt;　機構 未揭露／推導 AAA（只看利息保障倍數，50.6 倍）｜依推導：投資等級　｜　&lt;a href=&quot;#survival-detail&quot;&gt;&lt;b&gt;存活檢查（12～24 個月）&lt;/b&gt;&lt;/a&gt;　&lt;b style=&quot;color:var(--pos)&quot;&gt;無明顯警訊&lt;/b&gt;（推導，非違約預測；理由見第六題計算底稿）&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;grid2 front-pts&quot;&gt;&lt;div&gt;&lt;h3&gt;三個論點&lt;/h3&gt;&lt;ol class=&quot;pts&quot;&gt;&lt;li&gt;轉換成本有實證：Microsoft 365 商用雲端營收增 17%，席次只增 5%，客戶接受漲價（MSFT-C13）。&lt;/li&gt;&lt;li&gt;需求超過供給：商用未履約義務 6,770 億美元、年增 73%，約三成在一年內認列（MSFT-C04、C05）。&lt;/li&gt;&lt;li&gt;資產負債表強：淨現金 66,836 百萬美元（2026-09-30），近四季淨還債；期後 2026-11-04 發行 250 億美元新債（含 20 億浮動利率），用途未載（8-K 2026-11-04 本文 §3；MSFT-C09）。&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;&lt;div&gt;&lt;h3&gt;三個風險&lt;/h3&gt;&lt;ol class=&quot;pts risk&quot;&gt;&lt;li&gt;AI 資本支出仍在高峰，新增投資報酬約 21%，逐年下降（MSFT-C02、C12）。&lt;/li&gt;&lt;li&gt;OpenAI 一季貢獻約 11% 營收，又是持股約 24% 的被投資公司（MSFT-C08）。&lt;/li&gt;&lt;li&gt;英國英國競爭與市場管理局（CMA）與美國美國聯邦貿易委員會（FTC）都在審查授權與綑綁，正對準護城河來源（MSFT-C11）。&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;note-box mv&quot;&gt;&lt;b&gt;市場價格隱含什麼、我們哪裡不同&lt;/b&gt;&lt;p&gt;市場押注 AI 需求能讓高成長延續得比我們的基準更久；我們認為需求真實，但資本密度上升會壓低每元營收換到的現金。&lt;/p&gt;&lt;/div&gt;&lt;div id=&quot;triggers&quot; class=&quot;tm&quot;&gt;&lt;h3&gt;風險與改變判斷&lt;/h3&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;risk-tbl&quot; style=&quot;min-width:0;width:100%&quot;&gt;&lt;tr&gt;&lt;th style=&quot;white-space:normal;width:64%&quot;&gt;情況（看哪個指標、門檻多少）&lt;/th&gt;&lt;th style=&quot;white-space:normal;width:22%&quot;&gt;會改變什麼判斷&lt;/th&gt;&lt;th style=&quot;white-space:normal;width:14%&quot;&gt;歷史基準比率&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;Azure 季營收年增連兩季低於 30%，基準成長路徑要下修&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;價格位置更偏貴&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;21%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;增量投入資本報酬跌到 12% 以下（接近資金成本），投入資本報酬降為中&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;生意品質重評&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;營業利益率連兩季低於 42%（扣耐用年限調整）&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;利潤率假設改向保守情境&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;OpenAI 相關季營收年減，或未履約義務年增低於 30%&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;成長能見度轉弱&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;CMA 或 FTC 正式限制 Microsoft 365 綑綁&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;護城河評等可能由強降為中&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;收盤價跌到買入區上緣 211.35 美元 以下&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;價格位置改為買入區&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;美國國稅局（IRS）移轉訂價爭議補稅 289 億美元另加利息，判決超過準備會扣減價值&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;未設門檻：持續觀察&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;3,646 億美元未起租資料中心租賃，需求轉弱時成固定負擔&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;未設門檻：持續觀察&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;資料中心零件、電力供應吃緊，產能跟不上需求會延後營收&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;未設門檻：持續觀察&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;公債殖利率每升 1 個百分點，合理價值中點約降 15%&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;未設門檻：持續觀察&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;歷史基準比率＝成功幾率口徑，是同規模公司歷史上做到的比例，不是這家公司的預測；「—」＝沒有可對照的歷史基準，不估機率。營收成長類的列：同規模（營收 500 億美元以上）公司 10 年實質年增做到模型基準 8.2% 的歷史比例（超額報酬期間檢查.json 基準比率；Base Rate Book）。&lt;/p&gt;&lt;/div&gt;&lt;p class=&quot;cap fnote&quot;&gt;資料日期：財報截至 2026-09-30；市場資料 2026-11-13 收盤 523.88 美元。本報告為研究用途，研究評等與條件式目標區間都不是買賣建議；數字截至 2026-11-13 收盤與 2026-09-30 財報。本研究只評估公司本身，不評估讀者自身的資金期限與等待能力。完整數字見正文&lt;a href=&quot;#numbers&quot;&gt;「完整數字」&lt;/a&gt;；名詞與每條判斷的證據狀態見&lt;a href=&quot;#more&quot;&gt;附錄&lt;/a&gt;。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;

&lt;main class=&quot;wrap&quot;&gt;&lt;div data-layer=&quot;正文&quot;&gt;&lt;section class=&quot;q&quot; id=&quot;business&quot;&gt;&lt;div class=&quot;qno&quot;&gt;問題 01&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;生意怎麼賺錢？&lt;/div&gt;&lt;h2&gt;賣企業軟體訂閱與雲端算力，雲端占營收約六成五。&lt;/h2&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;微軟的錢主要來自兩種訂閱：企業按人頭付 Microsoft 365，再按用量付 Azure 雲端與 AI 算力。&lt;/strong&gt;兩者 FY2026 合計約 2,314 億美元、約占營收 70%&lt;span class=&quot;src&quot;&gt;（10-K 2026-06-30 Item 8 ¶324，推導）&lt;/span&gt;；伺服器與雲端一條線就占 39%，是最大也成長最快的一塊。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;反方是傳統授權與裝置在縮：Windows OEM（電腦廠商預裝的 Windows 授權）與裝置一季年減 22%，遊戲也小幅衰退&lt;span class=&quot;src&quot;&gt;（10-Q 2026-09-30 Part I, Item 2 ¶15–¶16）&lt;/span&gt;。&lt;/strong&gt;這些線合計不到兩成，拖累有限，但代表成長越來越集中在雲端一個引擎。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;產品線營收占比（FY26，億美元；逐年金額與成長見下方明細表；圖的占比分母為圖中各線合計）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 480 280&quot; role=&quot;img&quot; aria-label=&quot;產品線營收&quot; class=&quot;chart&quot; style=&quot;max-width:624px&quot;&gt;&lt;path d=&quot;M240.0,52.0 A88,88 0 0 1 296.1,207.8 L274.4,181.6 A54,54 0 0 0 240.0,86.0 Z&quot; fill=&quot;var(--c1)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;伺服器與雲端（含 Azure）：1,294（39%）&lt;/title&gt;&lt;/path&gt;&lt;path d=&quot;M296.1,207.8 A88,88 0 0 1 156.8,168.6 L188.9,157.5 A54,54 0 0 0 274.4,181.6 Z&quot; fill=&quot;var(--c2)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;Microsoft 365 商用：1,020（31%）&lt;/title&gt;&lt;/path&gt;&lt;path d=&quot;M156.8,168.6 A88,88 0 0 1 152.3,132.8 L186.2,135.6 A54,54 0 0 0 188.9,157.5 Z&quot; fill=&quot;var(--c6)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;遊戲（XBOX）：218（7%）&lt;/title&gt;&lt;/path&gt;&lt;path d=&quot;M152.3,132.8 A88,88 0 0 1 161.0,101.1 L191.5,116.2 A54,54 0 0 0 186.2,135.6 Z&quot; fill=&quot;var(--c7)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;LinkedIn：198（6%）&lt;/title&gt;&lt;/path&gt;&lt;path d=&quot;M161.0,101.1 A88,88 0 0 1 240.0,52.0 L240.0,86.0 A54,54 0 0 0 191.5,116.2 Z&quot; fill=&quot;var(--muted)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;其他：588（18%）&lt;/title&gt;&lt;/path&gt;&lt;polyline points=&quot;326.6,108.8 334.1,102.7 346.0,102.7&quot; fill=&quot;none&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;1&quot;/&gt;&lt;text x=&quot;354.0&quot; y=&quot;99.7&quot; class=&quot;lab&quot; text-anchor=&quot;start&quot;&gt;伺服器與雲端（含 Azure）&lt;/text&gt;&lt;text x=&quot;354.0&quot; y=&quot;117.7&quot; class=&quot;val&quot; text-anchor=&quot;start&quot;&gt;39%&lt;tspan class=&quot;ax&quot; font-weight=&quot;400&quot;&gt;　1,294&lt;/tspan&gt;&lt;/text&gt;&lt;polyline points=&quot;215.1,228.6 212.9,245.9 134.0,245.9&quot; fill=&quot;none&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;1&quot;/&gt;&lt;text x=&quot;126.0&quot; y=&quot;242.9&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;Microsoft 365 商用&lt;/text&gt;&lt;text x=&quot;126.0&quot; y=&quot;260.9&quot; class=&quot;val&quot; text-anchor=&quot;end&quot;&gt;31%&lt;tspan class=&quot;ax&quot; font-weight=&quot;400&quot;&gt;　1,020&lt;/tspan&gt;&lt;/text&gt;&lt;polyline points=&quot;148.7,151.4 140.8,153.6 134.0,153.6&quot; fill=&quot;none&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;1&quot;/&gt;&lt;text x=&quot;126.0&quot; y=&quot;150.6&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;遊戲（XBOX）&lt;/text&gt;&lt;text x=&quot;126.0&quot; y=&quot;168.6&quot; class=&quot;val&quot; text-anchor=&quot;end&quot;&gt;7%&lt;tspan class=&quot;ax&quot; font-weight=&quot;400&quot;&gt;　218&lt;/tspan&gt;&lt;/text&gt;&lt;polyline points=&quot;151.3,115.5 143.6,110.7 134.0,110.7&quot; fill=&quot;none&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;1&quot;/&gt;&lt;text x=&quot;126.0&quot; y=&quot;107.7&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;LinkedIn&lt;/text&gt;&lt;text x=&quot;126.0&quot; y=&quot;125.7&quot; class=&quot;val&quot; text-anchor=&quot;end&quot;&gt;6%&lt;tspan class=&quot;ax&quot; font-weight=&quot;400&quot;&gt;　198&lt;/tspan&gt;&lt;/text&gt;&lt;polyline points=&quot;191.4,61.9 187.2,46.6 134.0,46.6&quot; fill=&quot;none&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;1&quot;/&gt;&lt;text x=&quot;126.0&quot; y=&quot;43.6&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;其他&lt;/text&gt;&lt;text x=&quot;126.0&quot; y=&quot;61.6&quot; class=&quot;val&quot; text-anchor=&quot;end&quot;&gt;18%&lt;tspan class=&quot;ax&quot; font-weight=&quot;400&quot;&gt;　588&lt;/tspan&gt;&lt;/text&gt;&lt;text x=&quot;240.0&quot; y=&quot;136.0&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY26&lt;/text&gt;&lt;text x=&quot;240.0&quot; y=&quot;158.0&quot; class=&quot;val&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:18px&quot;&gt;3,318&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;白話說&lt;/b&gt;每 100 元營收約 65 元來自 Microsoft Cloud（微軟雲端業務合計口徑），約 47 元留成營業利益（近四季）。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;要留意&lt;/b&gt;Microsoft Cloud 跨產品線，和產品線圖的分類不能相加。&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;產品線營收明細（億美元；占比為最近財年，分母為各線合計）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;產品線&lt;/th&gt;&lt;th&gt;FY24&lt;/th&gt;&lt;th&gt;FY25&lt;/th&gt;&lt;th&gt;FY26&lt;/th&gt;&lt;th&gt;近四季&lt;/th&gt;&lt;th&gt;最近財年年增&lt;/th&gt;&lt;th&gt;占比&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;伺服器與雲端（含 Azure）&lt;/td&gt;&lt;td&gt;798&lt;/td&gt;&lt;td&gt;984&lt;/td&gt;&lt;td&gt;1,294&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;31.5%&lt;/td&gt;&lt;td&gt;39%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Microsoft 365 商用&lt;/td&gt;&lt;td&gt;770&lt;/td&gt;&lt;td&gt;878&lt;/td&gt;&lt;td&gt;1,020&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;16.2%&lt;/td&gt;&lt;td&gt;31%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;遊戲（XBOX）&lt;/td&gt;&lt;td&gt;215&lt;/td&gt;&lt;td&gt;235&lt;/td&gt;&lt;td&gt;218&lt;/td&gt;&lt;td&gt;217&lt;/td&gt;&lt;td&gt;-7.1%&lt;/td&gt;&lt;td&gt;7%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;LinkedIn&lt;/td&gt;&lt;td&gt;164&lt;/td&gt;&lt;td&gt;178&lt;/td&gt;&lt;td&gt;198&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;11.3%&lt;/td&gt;&lt;td&gt;6%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Windows 與裝置&lt;/td&gt;&lt;td&gt;170&lt;/td&gt;&lt;td&gt;173&lt;/td&gt;&lt;td&gt;171&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;-1.3%&lt;/td&gt;&lt;td&gt;5%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;搜尋廣告&lt;/td&gt;&lt;td&gt;123&lt;/td&gt;&lt;td&gt;139&lt;/td&gt;&lt;td&gt;152&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;9.4%&lt;/td&gt;&lt;td&gt;5%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Dynamics&lt;/td&gt;&lt;td&gt;68&lt;/td&gt;&lt;td&gt;78&lt;/td&gt;&lt;td&gt;90&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;15.1%&lt;/td&gt;&lt;td&gt;3%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Microsoft 365 消費版&lt;/td&gt;&lt;td&gt;66&lt;/td&gt;&lt;td&gt;74&lt;/td&gt;&lt;td&gt;92&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;23.9%&lt;/td&gt;&lt;td&gt;3%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;企業與夥伴服務&lt;/td&gt;&lt;td&gt;76&lt;/td&gt;&lt;td&gt;78&lt;/td&gt;&lt;td&gt;83&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;6.4%&lt;/td&gt;&lt;td&gt;2%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;其他&lt;/td&gt;&lt;td&gt;0&lt;/td&gt;&lt;td&gt;1&lt;/td&gt;&lt;td&gt;1&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;51.4%&lt;/td&gt;&lt;td&gt;0%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;business-profile&quot;&gt;&lt;h3&gt;生意介紹：年報重點&lt;/h3&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;微軟把辦公軟體、作業系統與 Azure 雲端算力賣給企業與個人，近三分之二營收來自 Microsoft Cloud。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;賣什麼&lt;/p&gt;&lt;h4&gt;三大類：生產力軟體、雲端與伺服器、個人運算&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;生產力軟體以 Microsoft 365 商用訂閱為主，含 Teams 與 Copilot，FY2026 營收約 1,020 億美元&lt;span class=&quot;src&quot;&gt;（10-K 2026-06-30 Item 1 ¶37–¶38；Item 8 ¶324）&lt;/span&gt;。&lt;/strong&gt;伺服器產品與雲端服務以 Azure 為核心，FY2026 約 1,294 億美元、年增 31%，是最大產品線&lt;span class=&quot;src&quot;&gt;（同 ¶324）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;個人運算包括 Windows（微軟作業系統）授權與裝置、XBOX（微軟遊戲品牌）遊戲（約 218 億）、搜尋廣告（約 152 億）；LinkedIn（微軟旗下職場社群平台）約 198 億美元&lt;span class=&quot;src&quot;&gt;（10-K 2026-06-30 Item 8 ¶324）&lt;/span&gt;。&lt;/strong&gt;FY2027 起公司把分部改成「代理與基礎設施（Agents and Infra）」與「裝置與消費者（Devices and Consumer）」兩塊&lt;span class=&quot;src&quot;&gt;（8-K 2026-09-02 本文 §9）&lt;/span&gt;。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;誰付錢、怎麼賣&lt;/p&gt;&lt;h4&gt;企業與政府是主要付款人，沒有單一客戶超過一成&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;直接銷售服務跨國企業、公部門與中小企業，間接通路靠合作夥伴網絡；電腦廠商預裝 Windows 也是付款人&lt;span class=&quot;src&quot;&gt;（10-K 2026-06-30 Item 1 ¶119–¶121）&lt;/span&gt;。&lt;/strong&gt;企業多透過大量授權方案簽多年合約，所以有大額&lt;a class=&quot;term&quot; href=&quot;#g0&quot;&gt;未履約義務&lt;/a&gt;&lt;span class=&quot;src&quot;&gt;（10-K 2026-06-30 Item 1 ¶123）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;年報寫沒有單一客戶占營收 10% 以上&lt;span class=&quot;src&quot;&gt;（10-K 2026-06-30 Item 8 ¶320）&lt;/span&gt;；但 10-Q 揭露與 OpenAI 的商業安排一季營收約 100 億美元、約占 11%，屬關係人&lt;span class=&quot;src&quot;&gt;（10-Q 2026-09-30 Part I, Item 1 ¶34，MSFT-C08）&lt;/span&gt;。&lt;/strong&gt;作者判斷這是實質上最大的單一付款來源。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;營收結構：誰在拉動&lt;/p&gt;&lt;h4&gt;雲端是唯一成長引擎，傳統授權與裝置在縮&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;Microsoft Cloud FY2026 營收約 2,144 億美元，占總營收約 65%&lt;span class=&quot;src&quot;&gt;（10-K 2026-06-30 Item 8 ¶325，推導）&lt;/span&gt;。&lt;/strong&gt;最新一季 Microsoft Cloud 年增 30% 到 639 億，Azure 年增 48%&lt;span class=&quot;src&quot;&gt;（10-Q 2026-09-30 Part I, Item 2 ¶9–¶10）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;拖累的一邊：生產力與伺服器授權一季年減 3%，XBOX 內容與服務年減 2%，Windows OEM 與裝置年減 22%&lt;span class=&quot;src&quot;&gt;（10-Q 2026-09-30 Part I, Item 2 ¶15–¶16、¶61）&lt;/span&gt;。&lt;/strong&gt;營收成長幾乎全由雲端拉動。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;市場、地區與重點專案&lt;/p&gt;&lt;h4&gt;美國過半且成長更快；資料中心擴建是唯一重點專案&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;美國 FY2026 營收約 1,708 億美元，占 51%；最新一季美國 495 億、年增 23%，其他國家 428 億、年增 14%&lt;span class=&quot;src&quot;&gt;（10-K 2026-06-30 Item 8 ¶320–¶321；10-Q 2026-09-30 Part I, Item 1 ¶200，推導）&lt;/span&gt;。&lt;/strong&gt;美國含電腦廠商與跨國企業帳單，不完全等於客戶所在地&lt;span class=&quot;src&quot;&gt;（同 ¶201）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;重點專案是資料中心與 AI 伺服器擴建：FY2027 第一季資本支出書面指引超過 500 億美元、實際 452 億；2026-10-28 法說會財務長口頭說第二季逾 500 億、2026 曆年約 1,700 億，第一季低於指引是第三方產能交付延遲（新聞 N1 §2，管理層口頭說法）。&lt;/strong&gt;另有 3,646 億美元已簽但尚未開始的租賃，起租落在 FY2027–FY2034&lt;span class=&quot;src&quot;&gt;（8-K 2026-09-02 本文 §24；新聞 N1 §2；10-Q 2026-09-30 Part I, Item 1 ¶159）&lt;/span&gt;。個別地點與產能規模未揭露&lt;span class=&quot;src&quot;&gt;（查過 Item 1、Item 7）&lt;/span&gt;。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;跟誰競爭&lt;/p&gt;&lt;h4&gt;每條線都有強對手，優勢在綑綁與混合雲&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;Azure 面對其他雲端業者與開源方案，AI 對手同時也是合作夥伴；公司說優勢是混合雲與全球規模&lt;span class=&quot;src&quot;&gt;（10-K 2026-06-30 Item 1 ¶68）&lt;/span&gt;。&lt;/strong&gt;資安、LinkedIn、搜尋廣告各有專業對手，免費靠廣告的軟體也是威脅&lt;span class=&quot;src&quot;&gt;（同 ¶53–¶54、¶101；Item 1A ¶17）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;外部證據：Zoom 年報把附 Teams 的 Microsoft 365 綑綁列為主要競爭者，NetApp 把與 AWS、Azure、Google Cloud 三大雲的原生整合當成自身優勢（全文搜尋 Q2 Zoom Communications #0、Q2 NetApp #1）。&lt;/strong&gt;我們的判讀：Teams 綑綁是對手公認的優勢，是轉換成本的來源；NetApp 的整合並非 Azure 獨有，只說明 Azure 與其他大雲同列為企業必須支援的平台。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;管理層怎麼說&lt;/p&gt;&lt;h4&gt;公司說需求超過供給，實績目前對得上&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;公司說法：微軟定位為讓 AI 普及的平台公司，與 OpenAI 維持長期合作，持有其模型與基礎設施的智慧財產權並收分潤&lt;span class=&quot;src&quot;&gt;（10-Q 2026-09-30 Part I, Item 2 ¶5、¶19）&lt;/span&gt;。&lt;/strong&gt;財務長在法說會說需求仍超過供給，資本支出低於預期是第三方產能交付延遲（新聞 N1）。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;實績對照：FY2027 第一季營收 923 億美元，高於書面指引上緣 909.5 億，營業利益年增 21% 高於營收 19%&lt;span class=&quot;src&quot;&gt;（8-K 2026-09-02 本文 §24；8-K 2026-10-28#2 新聞稿 §0）&lt;/span&gt;。&lt;/strong&gt;書面指引樣本只有一次，可信度仍待累積（MSFT-C15）。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;年報列的主要風險&lt;/p&gt;&lt;h4&gt;風險因子中與估值最相關的四條&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;一、AI 投資可能不成功或被濫用，帶來聲譽與監管後果&lt;span class=&quot;src&quot;&gt;（10-Q 2026-09-30 Part II, Item 1A ¶33）&lt;/span&gt;。&lt;/strong&gt;二、資料中心關鍵零件、電力與冷卻設備供應吃緊，對手搶同一批供應商&lt;span class=&quot;src&quot;&gt;（同 ¶71）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;三、大量資金投入建造或租用資料中心，產能取決於能否及時取得設備&lt;span class=&quot;src&quot;&gt;（10-Q 2026-09-30 Part II, Item 1A ¶67）&lt;/span&gt;。&lt;/strong&gt;四、監管調查與資安事件會傷害聲譽與業務&lt;span class=&quot;src&quot;&gt;（10-Q 2026-09-30 Part II, Item 1A ¶82；10-K 2026-06-30 Item 1A ¶103）&lt;/span&gt;。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;moat&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;護城河與成長故事&lt;/p&gt;&lt;h3&gt;轉換成本與生態系是主要護城河，定價力有數字證據。&lt;/h3&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;護城河主要來自轉換成本：企業把郵件、文件、身分管理與 Teams（微軟的視訊會議與通訊軟體）綁在一起，換掉要重做整套流程（MSFT-C01）。&lt;/strong&gt;Microsoft 365 商用雲端營收增 17%、席次只增 5%，每用戶營收約多 11%&lt;span class=&quot;src&quot;&gt;（推導，10-Q 2026-09-30 Part I, Item 2 ¶60，MSFT-C13）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;生命週期上，微軟是進入第二波成長的成熟平台：營業利益率從 FY2023 41.8% 升到 FY2026 46.8%（長期財務.json）。&lt;/strong&gt;但 AI 資本支出擴大分母，投入資本報酬&lt;span class=&quot;src&quot;&gt;（財務投入資本口徑，含商譽、以法定稅率 21% 正規化）&lt;/span&gt;從 FY2022 的 80% 降到 FY2026 的 36%&lt;span class=&quot;src&quot;&gt;（推導；首頁與生意品質表的 53% 是營運投入資本口徑，分母不同）&lt;/span&gt;。市場規模與 Copilot（微軟的 AI 助理產品線）營收未揭露，跑道明細見第五題計算底稿。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;grid2 wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;護城河的變化：毛利率與高毛利業務占比&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 280&quot; role=&quot;img&quot; aria-label=&quot;護城河趨勢&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;246.0&quot; y2=&quot;246.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;250.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;0%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;201.2&quot; y2=&quot;201.2&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;205.2&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;20%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;156.4&quot; y2=&quot;156.4&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;160.4&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;40%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;111.6&quot; y2=&quot;111.6&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;115.6&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;60%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;66.8&quot; y2=&quot;66.8&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;70.8&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;80%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;22.0&quot; y2=&quot;22.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;26.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;100%&lt;/text&gt;&lt;text x=&quot;72.0&quot; y=&quot;268&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY23&lt;/text&gt;&lt;text x=&quot;218.0&quot; y=&quot;268&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY24&lt;/text&gt;&lt;text x=&quot;364.0&quot; y=&quot;268&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY25&lt;/text&gt;&lt;text x=&quot;510.0&quot; y=&quot;268&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY26&lt;/text&gt;&lt;polyline points=&quot;72.0,95.1 218.0,95.1 364.0,98.5 510.0,101.1&quot; fill=&quot;none&quot; stroke=&quot;var(--c1)&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;circle cx=&quot;72.0&quot; cy=&quot;95.1&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c1)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;Service and Other毛利率 FY23：67%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;218.0&quot; cy=&quot;95.1&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c1)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;Service and Other毛利率 FY24：67%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;364.0&quot; cy=&quot;98.5&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c1)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;Service and Other毛利率 FY25：66%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;510.0&quot; cy=&quot;101.1&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c1)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;Service and Other毛利率 FY26：65%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;518.0&quot; y=&quot;105.1&quot; class=&quot;val&quot; fill=&quot;var(--c1)&quot;&gt;65%&lt;/text&gt;&lt;polyline points=&quot;72.0,83.6 218.0,74.8 364.0,69.3 510.0,63.9&quot; fill=&quot;none&quot; stroke=&quot;var(--c2)&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;circle cx=&quot;72.0&quot; cy=&quot;83.6&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c2)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;Product毛利率 FY23：72%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;218.0&quot; cy=&quot;74.8&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c2)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;Product毛利率 FY24：76%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;364.0&quot; cy=&quot;69.3&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c2)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;Product毛利率 FY25：79%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;510.0&quot; cy=&quot;63.9&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c2)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;Product毛利率 FY26：81%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;518.0&quot; y=&quot;67.9&quot; class=&quot;val&quot; fill=&quot;var(--c2)&quot;&gt;81%&lt;/text&gt;&lt;polyline points=&quot;72.0,177.6 218.0,186.8 364.0,195.2 510.0,202.3&quot; fill=&quot;none&quot; stroke=&quot;var(--c6)&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;circle cx=&quot;72.0&quot; cy=&quot;177.6&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c6)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;Product占營收 FY23：31%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;218.0&quot; cy=&quot;186.8&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c6)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;Product占營收 FY24：26%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;364.0&quot; cy=&quot;195.2&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c6)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;Product占營收 FY25：23%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;510.0&quot; cy=&quot;202.3&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c6)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;Product占營收 FY26：19%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;518.0&quot; y=&quot;206.3&quot; class=&quot;val&quot; fill=&quot;var(--c6)&quot;&gt;19%&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c1)&quot;&gt;&lt;/i&gt;Service and Other毛利率&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c2)&quot;&gt;&lt;/i&gt;Product毛利率&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c6)&quot;&gt;&lt;/i&gt;Product占營收&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;外部證據：其他公司年報怎麼寫微軟&lt;/h4&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;出處：全文搜尋 Q2 Zoom Communications（視訊會議軟體公司） #0、Q2 NetApp（企業資料儲存公司） #1、Q3 APPLIED OPTOELECTRONICS INC. #1、Q4 IonQ（量子電腦公司） #0、Q4 Skkynet Cloud Systems（工業資料連線軟體公司） #1。&lt;/strong&gt;反方：英國 CMA 擬指定微軟具戰略市場地位，監管可能削弱綑綁（新聞 N2，MSFT-C11）。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;單一付款來源占營收比&lt;/p&gt;&lt;svg viewBox=&quot;0 0 500 62&quot; role=&quot;img&quot; aria-label=&quot;依賴度&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;250.0&quot; x2=&quot;250.0&quot; y1=&quot;6&quot; y2=&quot;56&quot; class=&quot;zero&quot;/&gt;&lt;text x=&quot;240&quot; y=&quot;23&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;OpenAI（客戶兼被投資公司）（其他）&lt;/text&gt;&lt;rect x=&quot;250.0&quot; y=&quot;9&quot; width=&quot;174.5&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;432.5&quot; y=&quot;23&quot; class=&quot;val&quot;&gt;11%&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;公司&lt;/th&gt;&lt;th&gt;文件&lt;/th&gt;&lt;th&gt;說什麼&lt;/th&gt;&lt;th&gt;代表什麼&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Zoom Communications&lt;/td&gt;&lt;td&gt;10-K 2026-02-27&lt;/td&gt;&lt;td&gt;把附 Teams 的 Microsoft 365 綑綁列為競爭者&lt;/td&gt;&lt;td&gt;綑綁是對手公認的優勢&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;NetApp&lt;/td&gt;&lt;td&gt;10-K 2026-06-05&lt;/td&gt;&lt;td&gt;與 AWS、Microsoft Azure、Google Cloud 三大雲原生整合，列為自身優勢&lt;/td&gt;&lt;td&gt;Azure 是企業必須支援的三大雲之一，不是 Azure 獨有&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Applied Optoelectronics（光通訊模組廠）&lt;/td&gt;&lt;td&gt;10-K 2026-02-26&lt;/td&gt;&lt;td&gt;微軟占其 2025 年營收 28.8%&lt;/td&gt;&lt;td&gt;供應商依賴微軟，議價在微軟&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;IonQ、Skkynet&lt;/td&gt;&lt;td&gt;10-K 2026&lt;/td&gt;&lt;td&gt;IonQ 經 AWS Braket、Azure Quantum（Azure 的量子運算服務）、Google Cloud Marketplace 銷售；Skkynet 經 Azure Marketplace（Azure 上的軟體市集）銷售&lt;/td&gt;&lt;td&gt;Azure 是第三方銷售通路之一，與其他大雲並列&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;supply&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;供應鏈與地區&lt;/p&gt;&lt;h3&gt;關鍵瓶頸在資料中心零件與電力，不在單一供應商。&lt;/h3&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;公司說關鍵資料中心零件供應商有限且短缺，電力與冷卻設備也曾吃緊&lt;span class=&quot;src&quot;&gt;（10-Q 2026-09-30 Part II, Item 1A ¶71）&lt;/span&gt;。&lt;/strong&gt;單一供應商占比未揭露；反向看，光通訊廠 Applied Optoelectronics 有 28.8% 營收來自微軟（全文搜尋 Q3 APPLIED OPTOELECTRONICS INC. #1），議價力在微軟。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;地區上最新一季（FY2027 第一季）美國以外約占 46%（FY2026 全年約 48.5%，見第一題），最新一季美國成長快於海外&lt;span class=&quot;src&quot;&gt;（10-Q 2026-09-30 Part I, Item 1 ¶200）&lt;/span&gt;。&lt;/strong&gt;新聞指公司正縮減第三方算力夥伴、轉向自建，屬未證實消息（新聞 N4）。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;grid2 wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;Other Countries：占全部營收 vs 占全部長期資產&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 280&quot; role=&quot;img&quot; aria-label=&quot;地區占比&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;246.0&quot; y2=&quot;246.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;250.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;30%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;201.2&quot; y2=&quot;201.2&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;205.2&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;40%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;156.4&quot; y2=&quot;156.4&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;160.4&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;50%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;111.6&quot; y2=&quot;111.6&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;115.6&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;60%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;66.8&quot; y2=&quot;66.8&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;70.8&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;70%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;22.0&quot; y2=&quot;22.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;26.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;80%&lt;/text&gt;&lt;text x=&quot;72.0&quot; y=&quot;268&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY23&lt;/text&gt;&lt;text x=&quot;218.0&quot; y=&quot;268&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY24&lt;/text&gt;&lt;text x=&quot;364.0&quot; y=&quot;268&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY25&lt;/text&gt;&lt;text x=&quot;510.0&quot; y=&quot;268&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY26&lt;/text&gt;&lt;polyline points=&quot;72.0,158.1 218.0,160.3 364.0,162.3 510.0,163.0&quot; fill=&quot;none&quot; stroke=&quot;var(--c2)&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;circle cx=&quot;72.0&quot; cy=&quot;158.1&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c2)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;占營收 FY23：50%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;218.0&quot; cy=&quot;160.3&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c2)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;占營收 FY24：49%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;364.0&quot; cy=&quot;162.3&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c2)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;占營收 FY25：49%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;510.0&quot; cy=&quot;163.0&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c2)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;占營收 FY26：49%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;518.0&quot; y=&quot;167.0&quot; class=&quot;val&quot; fill=&quot;var(--c2)&quot;&gt;49%&lt;/text&gt;&lt;polyline points=&quot;72.0,206.1 218.0,209.1 364.0,70.4 510.0,129.8&quot; fill=&quot;none&quot; stroke=&quot;var(--neg)&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;circle cx=&quot;72.0&quot; cy=&quot;206.1&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--neg)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;占長期資產 FY23：39%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;218.0&quot; cy=&quot;209.1&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--neg)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;占長期資產 FY24：38%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;364.0&quot; cy=&quot;70.4&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--neg)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;占長期資產 FY25：69%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;510.0&quot; cy=&quot;129.8&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--neg)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;占長期資產 FY26：56%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;518.0&quot; y=&quot;133.8&quot; class=&quot;val&quot; fill=&quot;var(--neg)&quot;&gt;56%&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c2)&quot;&gt;&lt;/i&gt;占營收&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--neg)&quot;&gt;&lt;/i&gt;占長期資產&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;growth&quot;&gt;&lt;div class=&quot;qno&quot;&gt;問題 02&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;成長從哪裡來？還能持續嗎？&lt;/div&gt;&lt;h2&gt;Azure 與 AI 帶動加速成長，未來一年有合約撐腰。&lt;/h2&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;近四季營收年增 17.9%，比一年前 15.6% 快，最新一季 19%（成長推估底稿.json）。&lt;/strong&gt;帶頭的是 Azure 一季年增 48%，Microsoft Cloud 年增 30%&lt;span class=&quot;src&quot;&gt;（10-Q 2026-09-30 Part I, Item 2 ¶9–¶10，MSFT-C04）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;未來一年的能見度高：商用未履約義務 6,770 億美元、年增 73%，約 30% 在 12 個月內認列，約 2,049 億&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;，約等於近四季營收的 59%&lt;span class=&quot;src&quot;&gt;（10-Q 2026-09-30 Part I, Item 1 ¶148，MSFT-C05）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;成長拆解見下方區塊：價格與用量是主力，新產品 Copilot 的貢獻未揭露。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;反方：OpenAI 一季貢獻約 100 億美元，未履約義務中 OpenAI 占比未揭露，若其採購放緩，合約存量的品質會打折（MSFT-C08）。&lt;/strong&gt;資本支出若跟不上，需求也轉不成營收（新聞 N1）。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;毛利率與營業利益率&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 280&quot; role=&quot;img&quot; aria-label=&quot;利潤率&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;246.0&quot; y2=&quot;246.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;250.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;30%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;201.2&quot; y2=&quot;201.2&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;205.2&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;40%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;156.4&quot; y2=&quo title&gt;&lt;/circle&gt;&lt;circle cx=&quot;291.0&quot; cy=&quot;72.1&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c2)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;毛利率 FY25：69%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;400.5&quot; cy=&quot;76.0&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c2)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;毛利率 FY26：68%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;510.0&quot; cy=&quot;77.3&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c2)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;毛利率 近四季：68%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;518.0&quot; y=&quot;81.3&quot; class=&quot;val&quot; fill=&quot;var(--c2)&quot;&gt;68%&lt;/text&gt;&lt;polyline points=&quot;72.0,193.3 181.5,180.4 291.0,176.0 400.5,170.8 510.0,169.4&quot; fill=&quot;none&quot; stroke=&quot;var(--c1)&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;circle cx=&quot;72.0&quot; cy=&quot;193.3&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c1)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;營業利益率 FY23：42%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;181.5&quot; cy=&quot;180.4&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c1)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;營業利益率 FY24：45%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;291.0&quot; cy=&quot;176.0&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c1)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;營業利益率 FY25：46%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;400.5&quot; cy=&quot;170.8&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c1)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;營業利益率 FY26：47%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;510.0&quot; cy=&quot;169.4&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c1)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;營業利益率 近四季：47%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;518.0&quot; y=&quot;173.4&quot; class=&quot;val&quot; fill=&quot;var(--c1)&quot;&gt;47%&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c2)&quot;&gt;&lt;/i&gt;毛利率&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c1)&quot;&gt;&lt;/i&gt;營業利益率&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;成長來源拆解（量、價、新產品、新市場、併購）&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;量：Microsoft 365 商用席次 +5%、消費訂戶 +7%；Azure 用量增 48% 但量價未分開揭露。&lt;/strong&gt;價：Microsoft 365 商用雲端每用戶營收約 +11%&lt;span class=&quot;src&quot;&gt;（17% 對 5% 推導）&lt;/span&gt;，來自升級到 Copilot、E5（Microsoft 365 高階企業方案）、E7（Microsoft 365 更高階企業方案），以及用量型服務（主要是 GitHub Copilot，寫程式用的 AI 助理）的消耗增加，不全是價格&lt;span class=&quot;src&quot;&gt;（10-Q 2026-09-30 Part I, Item 2 ¶60）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;新產品：Copilot 與 GitHub Copilot 營收未單獨揭露。&lt;/strong&gt;新市場：未揭露。併購：10-K 附註 7 只列 2023 年完成的 Activision Blizzard（遊戲公司，2023 年被微軟收購），近四季無新併購揭露，成長屬內生&lt;span class=&quot;src&quot;&gt;（10-K 2026-06-30 Item 8 ¶170）&lt;/span&gt;。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;投入與回報&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;投入在變重：近四季資本支出 1,359 億美元，占營運現金流約 69%&lt;span class=&quot;src&quot;&gt;（財務指標.json，推導）&lt;/span&gt;。&lt;/strong&gt;FY2024→FY2026 新增投入資本約 1,658 億，換來稅後營業利益增約 356 億，增量報酬約 21%，仍高於資金成本 10.2%，但比整體報酬低得多（MSFT-C02）。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;營運槓桿還在：FY2023→FY2026 每多 1 元營收多 0.56 元營業利益（MSFT-C14）。&lt;/strong&gt;若增量報酬跌近資金成本，代表 AI 投資只是維持地位，見改判訊號。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;研發與設備投資（億美元），上方為研發占營收&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 300&quot; role=&quot;img&quot; aria-label=&quot;投入&quot; class=&quot;chart&qu lt;span&gt;&lt;i style=&quot;background:var(--c1)&quot;&gt;&lt;/i&gt;營運現金流&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c2)&quot;&gt;&lt;/i&gt;自由現金流&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;錢從哪一層開始不夠：現金流分層&lt;/h3&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;現金流分層（近四季，至 2026-09-30）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;層次&lt;/th&gt;&lt;th&gt;金額&lt;/th&gt;&lt;th&gt;正負&lt;/th&gt;&lt;th&gt;完整度&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;一、營運現金流&lt;/td&gt;&lt;td&gt;1,959 億美元&lt;/td&gt;&lt;td&gt;正&lt;/td&gt;&lt;td&gt;完整&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;二、一般資本支出後&lt;/td&gt;&lt;td&gt;600 億美元&lt;/td&gt;&lt;td&gt;正&lt;/td&gt;&lt;td&gt;完整&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;三、回購與股利後&lt;/td&gt;&lt;td&gt;119 億美元&lt;/td&gt;&lt;td&gt;正&lt;/td&gt;&lt;td&gt;完整&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;延伸：再扣併購與員工代扣稅&lt;/td&gt;&lt;td&gt;已知部分 119 億美元&lt;/td&gt;&lt;td&gt;無法判定&lt;/td&gt;&lt;td&gt;缺併購、員工股票代扣稅&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;數值正負不等於安全或危險：第二層為負代表所列投入超過當期營運現金，不等於營業虧損；資本支出尚未區分維持與擴張。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;白話說&lt;/b&gt;每賺 100 元營運現金，約 69 元花在資料中心，剩 31 元。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;要留意&lt;/b&gt;自由現金流低是投資期現象，不代表本業變差，見改判訊號。&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;shareholders&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;股東拿回多少？&lt;/p&gt;&lt;h3&gt;股利加回購約八成自由現金流，股數幾乎不減。&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;近四季股利殖利率 0.7%、回購殖利率 0.5%（收盤 2026-11-13），股利加回購約占自由現金流 80%（價值判斷.json#/股東回報）。&lt;/strong&gt;股利連續成長 11 年，近十年每年都有回購。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;反方：回購主要抵銷股權薪酬，扣掉後淨回購殖利率只有 0.2%（回購扣股權薪酬；收盤 2026-11-13）；2026 財年稀釋股數 -0.2%（近一財年；股數期間 2016–2026），近十年每年 -0.7%（近十財年年化）（MSFT-C16）。&lt;/strong&gt;股東報酬主要靠每股盈餘成長，不靠縮股。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;股東回饋對自由現金流（億美元）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 300&quot; role=&quot;img&quot; aria-label=&quot;股東回饋&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;266.0&quot; y2=&quot;266.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;270.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;0.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;205.5&quot; y2=&quot;205.5&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;209.5&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;200&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;145.0&quot; y2=&quot;145.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;149.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;400&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;84.5&quot; y2=&quot;84.5&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;88.5&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;600&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;24.0&quot; y2=&quot;24.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;28.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;800&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;266.0&quot; y2=&quot;266.0&quot; class=&quot;zero&quot;/&gt;&lt;rect x=&quot;70.3&quot; y=&quot;213.8&quot; width=&quot;26.5&quot; height=&quot;52.2&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;回購 FY24：173&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;98.8&quot; y=&quot;200.1&quot; width=&quot;26.5&quot; height=&quot;65.9&quot; rx=&quot;2&quot; fill=&quot;var(--c3)&quot;&gt;&lt;title&gt;股利 FY24：218&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;127.2&quot; y= &quot;&gt;2026-11&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--ink)&quot;&gt;&lt;/i&gt;收盤價&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c3)&quot;&gt;&lt;/i&gt;200 日均線&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--pos)&quot;&gt;&lt;/i&gt;合理價值區間&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c7)&quot;&gt;&lt;/i&gt;同業與歷史倍數（交叉核對，不進評等）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;流動性、空單與參考值的資料日期與存檔（算法與完整表見&lt;a href=&quot;#wp-mkt&quot;&gt;計算底稿 市場背景&lt;/a&gt;）。&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;valuation&quot;&gt;&lt;div class=&quot;qno&quot;&gt;問題 05&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;現在的價格合理嗎？&lt;/div&gt;&lt;h2&gt;偏貴：現價高於合理價值上緣，需要高於基準的成長。&lt;/h2&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;合理價值約 284.40–456.09 美元，中點 352.24 美元；收盤 523.88 美元 高於區間上緣，只低於樂觀情境每股價值，價格位置 偏貴。&lt;/strong&gt;基準情境成真時，以現價買進的推算年報酬約 8.0%&lt;span class=&quot;src&quot;&gt;（基準情境成真時、以收盤 2026-11-13 股價買進的推算年報酬；條件式，非預期報酬、非買賣建議）&lt;/span&gt;，低於資金成本 10.2%（非預期報酬）。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;基準故事：雲端帶動營收年增從 16% 逐年降到 10%，營業利益率維持 45–47%，AI 投資高峰持續到第五年才放緩。&lt;/strong&gt;現價要求未來五年營收每年約 18.9%&lt;span class=&quot;src&quot;&gt;（市價反推未來 5 年營收年增；市價 523.88 美元、收盤 2026-11-13；折現率 10.19%，沿用 2026-11-12 無風險利率 5.10%；推導）&lt;/span&gt;，明顯高於基準五年平均約 12.6%&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;；換個說法，要把 16% 成長延續約 約 14 年&lt;span class=&quot;src&quot;&gt;（基準情境第 1 年營收成長 16.0% 延續；收盤 2026-11-13；推導）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;限制：結果對折現率很敏感，公債殖利率降 1 個百分點中點約升 20%。&lt;/strong&gt;計算核對後我們把投資高峰拉長，若沿用工具原口徑，中點約低 7%&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;；IRS 稅務爭議 306 億若全額扣除，中點再降約 1.2%，都不改價格位置。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;兩年股價走勢與估值區間（美元）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 680 3 &gt;公司特定事件（原文位置）&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;&amp;lt; 14.0%&lt;/td&gt;&lt;td&gt;&amp;lt; 46.50%&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;來自 OpenAI 商業安排的季營收（2026-09 季 100 億美元、約占 11%）年減，或 OpenAI 應收帳款增速持續高於營收；保守情境的成長快速放緩比較接近（10-Q 2026-09-30 Part I, Item 1 ¶34）；營業利益率連續兩季低於 42%（扣除資料中心耐用年限延長的折舊減少後），代表 AI 資本支出的折舊壓力超過基準路徑（8-K 2026-09-02 本文 §24；8-K 2026-10-28#2 新聞稿 §0）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;14.0%–18.0%&lt;/td&gt;&lt;td&gt;46.50%–47.25%&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;無&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;&amp;gt; 18.0%&lt;/td&gt;&lt;td&gt;&amp;gt; 47.25%&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;Azure 營收年增維持 40% 以上且管理層表示產能限制解除（需求不再超過供給），未履約義務年增維持 50% 以上；樂觀情境首年 20% 成長比較接近（8-K 2026-10-28#2 新聞稿 §5；10-Q 2026-09-30 Part I, Item 1 ¶148）&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;近四季營收年增 17.9%（2025-10-01～2026-09-30 對 2024-10-01～2025-09-30），較接近基準情境的第 1 年假設；近四季營業利益率 47.1%，較接近基準情境。門檻以相鄰情境第 1 年假設的中線為界，只描述哪個情境比較接近，不改機率與研究評等；近四季是未調整的報表數字，作者訂第 1 年假設時若扣除不外推的項目（見本題正文），扣除後可能較接近別的情境；下四季申報後對照，不自動重算目標區間。&lt;/p&gt;&lt;p class=&quot;cap&quot;&gt;算法、關鍵假設、各段需要的市場條件與失效事件（算法與完整表見&lt;a href=&quot;#wp-5&quot;&gt;計算底稿 5&lt;/a&gt;）。&lt;/p&gt;&lt;/div&gt;&lt;!--/目標區間:正文--&gt;&lt;div class=&quot;block&quot; id=&quot;market-demand&quot;&gt;&lt;h3&gt;市價在要求什麼：成長端與倍數端，對照過去實績與模型假設&lt;/h3&gt;&lt;div class=&quot;grid2 wide&quot;&gt;&lt;figure class=figure&gt;&lt;p class=cap&gt;成長端：市價要成立，未來 5 年營收每年要成長多少（紅點基準折現率、線段高低折現率），對照過去實績與模型基準假設（成長推估底稿.json 六、成長性四問並列；推導，只描述）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 190&quot; role=&quot;img&quot; aria-label=&quot;市價要求的成長&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;230.0&quot; x2=&quot;230.0&quot; y1=&quot;8&quot; y2=&quot;168&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;230.0&quot; y=&quot;184&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;0%&lt;/text&gt;&lt;line x1=&quot;316.7&quot; x2=&quot;316.7&quot; y1=&quot;8&quot; y2=&quot;168&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;316.7&quot; y=&quot;184&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;10%&lt;/text&gt;&lt;line x1=&quot;403.3&quot; x2=&quot;403.3&quot; y1=&quot;8&quot; y2=&quot;168&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;403.3&quot; y=&quot;184&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;20%&lt;/text&gt;&lt;line x1=&quot;490.0&quot; x2=&quot;490.0&quot; y1=&quot;8&quot; y2=&quot;168&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;490.0&quot; y=&quot;184&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;30%&lt;/text&gt;&lt;text x=&quot;220&quot; y=&quot;27&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;過去實績（2015–2026 年複合）&lt;/text&gt;&lt;circle cx=&quot;335.7&quot; cy=&quot;22&quot; r=&quot;7&quot; fill=&quot;var(--c3)&quot;&gt;&lt;title&gt;過去實績（2015–2026 年複合）：12%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;347.7&quot; y=&quot;27&quot; class=&quot;val&quot;&gt;12%&lt;/text&gt;&lt;text x=&quot;220&quot; y=&quot;67&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;過去實績（近四季年增）&lt;/text&gt;&lt;circle cx=&quot;385.3&quot; cy=&quot;62&quot; r=&quot;7&quot; fill=&quot;var(--c3)&quot;&gt;&lt;title&gt;過去實績（近四季年增）：18%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;397.3&quot; y=&quot;67&quot; class=&quot;val&quot;&gt;18%&lt;/text&gt;&lt;text x=&quot;220&quot; y=&quot;107&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;模型基準（未來 5 年平均）&lt;/text&gt;&lt;circle cx=&quot;339.2&quot; cy=&quot;102&quot; r=&quot;7&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;模型基準（未來 5 年平均）：13%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;351.2&quot; y=&quot;107&quot; class=&quot;val&quot;&gt;13%&lt;/text&gt;&lt;text x=&quot;220&quot; y=&quot;147&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;市價要求（未來 5 年年增）&lt;/text&gt;&lt;line x1=&quot;356.2&quot; x2=&quot;428.0&quot; y1=&quot;142&quot; y2=&quot;142&quot; stroke=&quot;var(--neg)&quot; stroke-width=&quot;3&quot; opacity=&quot;.55&quot;/&gt;&lt;circle cx=&quot;393.6&quot; cy=&quot;142&quot; r=&quot;7&quot; fill=&quot;var(--neg)&quot;&gt;&lt;title&gt;市價要求（未來 5 年年增）：19%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;440.0&quot; y=&quot;147&quot; class=&quot;val&quot;&gt;19%&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;figure class=figure&gt;&lt;p class=cap&gt;倍數端：市價要成立，第 10 年出場 EV/EBIT 要多少倍（紅點基準折現率、線段高低折現率），對照模型假設與分產業參考帶 p25–p75（灰帶，直線為中位；估值結果.json#/market_implied_terminal；只描述，不是目標價、不進評等）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 150&quot; role=&quot;img&quot; aria-label=&quot;市價隱含第 10 年倍數&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;180.0&quot; x2=&quot;180.0&quot; y1=&quot;8&quot; y2=&quot;128&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;180.0&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;0 倍&lt;/text&gt;&lt;line x1=&quot;257.5&quot; x2=&quot;257.5&quot; y1=&quot;8&quot; y2=&quot;128&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;257.5&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;10 倍&lt;/text&gt;&lt;line x1=&quot;335.0&quot; x2=&quot;335.0&quot; y1=&quot;8&quot; y2=&quot;128&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;335.0&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;20 倍&lt;/text&gt;&lt;line x1=&quot;412.5&quot; x2=&quot;412.5&quot; y1=&quot;8&quot; y2=&quot;128&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;412.5&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;30 倍&lt;/text&gt;&lt;line x1=&quot;490.0&quot; x2=&quot;490.0&quot; y1=&quot;8&quot; y2=&quot;128&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;490.0&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;40 倍&lt;/text&gt;&lt;rect x=&quot;276.1&quot; y=&quot;11&quot; width=&quot;178.2&quot; height=&quot;22&quot; rx=&quot;4&quot; fill=&quot;var(--line)&quot;&gt;&lt;title&gt;Software (System &amp;amp; Application) 參考帶 p25–p75（機械回測樣本，非市場全體；分產業的筆數與公司數少，僅供參考）&lt;/title&gt;&lt;/rect&gt;&lt;line x1=&quot;342.0&quot; x2=&quot;342.0&quot; y1=&quot;11&quot; y2=&quot;33&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;170&quot; y=&quot;27&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;參考帶（Software (Sy&lt;/text&gt;&lt;text x=&quot;462.4&quot; y=&quot;27&quot; class=&quot;val&quot;&gt;12 倍–35 倍&lt;/text&gt;&lt;text x=&quot;170&quot; y=&quot;67&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;模型假設（第 10 年）&lt;/text&gt;&lt;circle cx=&quot;259.9&quot; cy=&quot;62&quot; r=&quot;7&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;模型假設（第 10 年）：10 倍&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;271.9&quot; y=&quot;67&quot; class=&quot;val&quot;&gt;10 倍&lt;/text&gt;&lt;text x=&quot;170&quot; y=&quot;107&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;市價隱含（第 10 年）&lt;/text&gt;&lt;line x1=&quot;317.1&quot; x2=&quot;396.8&quot; y1=&quot;102&quot; y2=&quot;102&quot; stroke=&quot;var(--neg)&quot; stroke-width=&quot;3&quot; opacity=&quot;.55&quot;/&gt;&lt;circle cx=&quot;353.9&quot; cy=&quot;102&quot; r=&quot;7&quot; fill=&quot;var(--neg)&quot;&gt;&lt;title&gt;市價隱含（第 10 年）：22 倍&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;408.8&quot; y=&quot;107&quot; class=&quot;val&quot;&gt;22 倍&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;p&gt;&lt;b&gt;成長端：&lt;/b&gt;市價要求未來 5 年營收年增約 18.9%（折現率高低 14.6%～22.8%），高於模型基準 5 年平均 12.6%、高於過去（2015–2026）實績 12.2%。&lt;/p&gt;&lt;p&gt;&lt;b&gt;倍數端：&lt;/b&gt;市價隱含第 10 年 EV/EBIT 約 22.4 倍，高於模型 10.3 倍，在Software (System &amp;amp; Application)參考帶 p25–p75（12.4–35.4 倍）內。&lt;/p&gt;&lt;p&gt;成功幾率（歷史基準比率）：模型基準 10 年實質年增 8.2%，同規模（營收 500 億美元以上）公司歷史上做到的比例 21%（歷史基準比率，非預測）。&lt;/p&gt;&lt;p class=&quot;cap&quot;&gt;兩端是同一條「模型價值＝市價」換不同未知數反解，方向必然一致，不是兩個獨立證據；幅度才有資訊。只描述，不進研究評等、不改價格位置與合理價值，不是目標價，非買賣建議。成長性四問細表、三視角反推、長期倍數條件（算法與完整表見&lt;a href=&quot;#wp-5&quot;&gt;計算底稿 5&lt;/a&gt;）。&lt;/p&gt;&lt;div class=&quot;note-box&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;要撐住現價，營收每年需要成長多少 vs 實際成長（黑色橫線為不同折現率下的隱含營收年增範圍 15%–23%）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 500 262&quot; role=&quot;img&quot; aria-label=&quot;市價隱含成長&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;193.0&quot; x2=&quot;193.0&quot; y1=&quot;6&quot; y2=&quot;256&quot; class=&quot;zero&quot;/&gt;&lt;text x=&quot;183&quot; y=&quot;23&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;FY24 實際成長&lt;/text&gt;&lt;rect x=&quot;193.0&quot; y=&quot;9&quot; width=&quot;155.3&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;356.3&quot; y=&quot;23&quot; class=&quot;val&quot;&gt;15.7%&lt;/text&gt;&lt;text x=&quot;183&quot; y=&quot;63&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;FY25 實際成長&lt;/text&gt;&lt;rect x=&quot;193.0&quot; y=&quot;49&quot; width=&quot;148.0&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;349.0&quot; y=&quot;63&quot; class=&quot;val&quot;&gt;14.9%&lt;/text&gt;&lt;text x=&quot;183&quot; y=&quot;103&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;FY26 實際成長&lt;/text&gt;&lt;rect x=&quot;193.0&quot; y=&quot;89&quot; width=&quot;176.3&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;377.3&quot; y=&quot;103&quot; class=&quot;val&quot;&gt;17.8%&lt;/text&gt;&lt;text x=&quot;183&quot; y=&quot;143&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;FY23–FY26 年均&lt;/text&gt;&lt;rect x=&quot;193.0&quot; y=&quot;129&quot; width=&quot;159.8&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;360.8&quot; y=&quot;143&quot; class=&quot;val&quot;&gt;16.1%&lt;/text&gt;&lt;text x=&quot;183&quot; y=&quot;183&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;最近三季比去年同期&lt;/text&gt;&lt;rect x=&quot;193.0&quot; y=&quot;169&quot; width=&quot;181.2&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;382.2&quot; y=&quot;183&quot; class=&quot;val&quot;&gt;18.3%&lt;/text&gt;&lt;text x=&quot;183&quot; y=&quot;223&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot; font-weight=&amp;quot;700&amp;quot;&gt;市價隱含：未來 5 年每年&lt;/text&gt;&lt;rect x=&quot;193.0&quot; y=&quot;209&quot; width=&quot;187.0&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--neg)&quot;/&gt;&lt;line x1=&quot;337.3&quot; x2=&quot;419.4&quot; y1=&quot;218&quot; y2=&quot;218&quot; stroke=&quot;var(--ink)&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;line x1=&quot;337.3&quot; x2=&quot;337.3&quot; y1=&quot;212&quot; y2=&quot;224&quot; stroke=&quot;var(--ink)&quot;/&gt;&lt;line x1=&quot;419.4&quot; x2=&quot;419.4&quot; y1=&quot;212&quot; y2=&quot;224&quot; stroke=&quot;var(--ink)&quot;/&gt;&lt;text x=&quot;427.4&quot; y=&quot;223&quot; class=&quot;val&quot;&gt;18.9%&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:14px&quot;&gt;市價要求的成長 vs 我們的假設與歷史&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;未來五年營收年增&lt;/th&gt;&lt;th&gt;出處&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;市價反推（基準折現率）&lt;/td&gt;&lt;td&gt;18.9%（市價反推未來 5 年營收年增；市價 523.88 美元、收盤 2026-11-13；折現率 10.19%，沿用 2026-11-12 無風險利率 5.10%；推導）&lt;/td&gt;&lt;td&gt;估值結果.json#/reverse_dcf/基準&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;市價反推（低／高折現率）&lt;/td&gt;&lt;td&gt;14.6%（市價反推未來 5 年營收年增；市價 523.88 美元、收盤 2026-11-13；折現率 8.86%，沿用 2026-11-12 無風險利率 5.10%；推導）／22.8%（市價反推未來 5 年營收年增；市價 523.88 美元、收盤 2026-11-13；折現率 11.49%，沿用 2026-11-12 無風險利率 5.10%；推導）&lt;/td&gt;&lt;td&gt;估值結果.json#/reverse_dcf&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準情境&lt;/td&gt;&lt;td&gt;16% 逐年降到 10%&lt;/td&gt;&lt;td&gt;估值輸入.json 基準情境&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;近四季實績&lt;/td&gt;&lt;td&gt;17.9%&lt;/td&gt;&lt;td&gt;成長推估底稿.json&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;同類公司次年成長 p75（第 75 百分位）&lt;/td&gt;&lt;td&gt;17.7%&lt;/td&gt;&lt;td&gt;成長推估底稿.json 第七節&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p&gt;要撐住現價，市場等於要求未來 5 年營收每年成長約 18.9%（換折現率高低兩端約 14.6% 到 22.8%）。這個要求在同規模公司的歷史上屬「歷史罕見」。溢價訊號集中在基本面預期（隱含假設罕見度）。&lt;/p&gt;&lt;p class=&quot;cap&quot;&gt;三視角反推、假設對照實績、歷史基準比率與市價溢價來源（算法與完整表見&lt;a href=&quot;#wp-5&quot;&gt;計算底稿 5&lt;/a&gt;）。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;白話說&lt;/b&gt;現價每 100 元，約 67 元有合理價值中點支撐，其餘要靠高於基準的成長。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;要留意&lt;/b&gt;合理價值不是目標價；對公債殖利率很敏感，見改判訊號。&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;value&quot;&gt;&lt;div class=&quot;qno&quot;&gt;價值判斷&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;價值判斷：用彼得林奇的方法再看一次&lt;/div&gt;&lt;h2&gt;穩定成長型的好公司，但價格已反映好消息。&lt;/h2&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;林區分類&lt;/b&gt;穩定成長；兼具快速成長（近三年營收年複合約 16.1%，FY2023→FY2026，長期財務.json，推導）&lt;br&gt;穩定成長股看本益比相對成長率是否合理、經濟下行時的防禦性，以及成長是否開始放緩；漲 30–50% 就要重新檢查價格&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;研究評等&lt;/b&gt;&lt;span style=&quot;font-size:20px;font-weight:700&quot;&gt;生意 A ／ 價格偏貴&lt;/span&gt;&lt;br&gt;生意品質依五項證據評定；價格位置三級（買入區、合理、偏貴），依買入上限與合理價值高端判斷，同業與歷史倍數只作交叉核對。非買賣建議。&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;林區分類為穩定成長，兼具快速成長特徵&lt;span class=&quot;src&quot;&gt;（近三年營收年複合約 16%，推導）&lt;/span&gt;。&lt;/strong&gt;核心本益比 29.2 倍（扣非經常 EPS 17.93 美元；收盤 2026-11-13），基準情境推估的本益比對成長比 2.53&lt;span class=&quot;src&quot;&gt;（成長口徑 基準情境推估、稅後營業利益年增－股數年變化 11.6%；收盤 2026-11-13）&lt;/span&gt;，高於林區認為合理的 1 到 2（價值判斷.json）。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;生意品質 A：護城河強、投入資本報酬強、資產負債表強；自由現金流品質與治理評中，因資本支出吃掉大部分現金、OpenAI 關係人集中（MSFT-C01、C02、C03、C09、C16）。&lt;/strong&gt;好公司與好價格是兩件事，現價屬後者不足。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;grid2 wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;現金與證券 vs 有息負債（億美元），上方為淨現金&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 300&quot; role=&quot;img&quot; aria-label=&quot;資產負債&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;266.0&quot; y2=&quot;266.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;270.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;0.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;185.3&quot; y2=&quot;185.3&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;189.3&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;500&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;104.7&quot; y2=&quot;104.7&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;108.7&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;1,000&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;24.0&quot; y2=&quot;24.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;28.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;1,500&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;266.0&quot; y2=&quot;266.0&quot; class=&quot;zero&quot;/&gt;&lt;rect x=&quot;70.3&quot; y=&quot;120.6&quot; width=&quot;40.7&quot; height=&quot;145.4&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;現金與證券 FY24：901&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;113.0&quot; y=&quot;182.7&quot; width=&quot;40.7&quot; height=&quot;83.3&quot; rx=&quot;2&quot; fill=&quot;var(--c5)&quot;&gt;&lt;title&gt;有息負債 FY24：516&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;113.0&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY24&lt;/text&gt;&lt;text x=&quot;113.0&quot; y=&quot;16.0&quot; class=&quot;note&quot; text-anchor=&quot;middle&quot;&gt;淨 385&lt;/text&gt;&lt;rect x=&quot;192.3&quot; y=&quot;88.6&quot; width=&quot;40.7&quot; height=&quot;177.4&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;現金與證券 FY25：1,100&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;235.0&quot; y=&quot;196.4&quot; width=&quot;40.7&quot; height=&quot;69.6&quot; rx=&quot;2&quot; fill=&quot;var(--c5)&quot;&gt;&lt;title&gt;有息負債 FY25：432&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;235.0&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY25&lt;/text&gt;&lt;text x=&quot;235.0&quot; y=&quot;16.0&quot; class=&quot;note&quot; text-anchor=&quot;middle&quot;&gt;淨 668&lt;/text&gt;&lt;rect x=&quot;314.3&quot; y=&quot;83.4&quot; width=&quot;40.7&quot; height=&quot;182.6&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;現金與證券 FY26：1,132&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;357.0&quot; y=&quot;201.0&quot; width=&quot;40.7&quot; height=&quot;65.0&quot; rx=&quot;2&quot; fill=&quot;var(--c5)&quot;&gt;&lt;title&gt;有息負債 FY26：403&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;357.0&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY26&lt;/text&gt;&lt;text x=&quot;357.0&quot; y=&quot;16.0&quot; class=&quot;note&quot; text-anchor=&quot;middle&quot;&gt;淨 729&lt;/text&gt;&lt;rect x=&quot;436.3&quot; y=&quot;100.9&quot; width=&quot;40.7&quot; height=&quot;165.1&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;現金與證券 2026-09：1,023&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;479.0&quot; y=&quot;208.8&quot; width=&quot;40.7&quot; height=&quot;57.2&quot; rx=&quot;2&quot; fill=&quot;var(--c5)&quot;&gt;&lt;title&gt;有息負債 2026-09：355&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;479.0&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;2026-09&lt;/text&gt;&lt;text x=&quot;479.0&quot; y=&quot;16.0&quot; class=&quot;note&quot; text-anchor=&quot;middle&quot;&gt;淨 668&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c1)&quot;&gt;&lt;/i&gt;現金與證券&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c5)&quot;&gt;&lt;/i&gt;有息負債&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;2026-05-15 起申報（最早交易 2026-05-14）內部人公開市場買賣（百萬美元）；無任何買進&lt;/p&gt;&lt;svg viewBox=&quot;0 0 500 222&quot; role=&quot;img&quot; aria-label=&quot;內部人&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;197.0&quot; x2=&quot;197.0&quot; y1=&quot;6&quot; y2=&quot;216&quot; class=&quot;zero&quot;/&gt;&lt;text x=&quot;187&quot; y=&quot;23&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;Nadella（預設計畫賣出）&lt;/text&gt;&lt;rect x=&quot;197.0&quot; y=&quot;9&quot; width=&quot;222.7&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;427.7&quot; y=&quot;23&quot; class=&quot;val&quot;&gt;43&lt;/text&gt;&lt;text x=&quot;187&quot; y=&quot;63&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;Hood（預設計畫賣出）&lt;/text&gt;&lt;rect x=&quot;197.0&quot; y=&quot;49&quot; width=&quot;147.5&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;352.5&quot; y=&quot;63&quot; class=&quot;val&quot;&gt;29&lt;/text&gt;&lt;text x=&quot;187&quot; y=&quot;103&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;Althoff（非計畫賣出）&lt;/text&gt;&lt;rect x=&quot;197.0&quot; y=&quot;89&quot; width=&quot;61.7&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--neg)&quot;/&gt;&lt;text x=&quot;266.7&quot; y=&quot;103&quot; class=&quot;val&quot;&gt;12&lt;/text&gt;&lt;text x=&quot;187&quot; y=&quot;143&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;Numoto（非計畫賣出）&lt;/text&gt;&lt;rect x=&quot;197.0&quot; y=&quot;129&quot; width=&quot;40.5&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--neg)&quot;/&gt;&lt;text x=&quot;245.5&quot; y=&quot;143&quot; class=&quot;val&quot;&gt;7.9&lt;/text&gt;&lt;text x=&quot;187&quot; y=&quot;183&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;Coleman（非計畫賣出）&lt;/text&gt;&lt;rect x=&quot;197.0&quot; y=&quot;169&quot; width=&quot;2.7&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--neg)&quot;/&gt;&lt;text x=&quot;207.7&quot; y=&quot;183&quot; class=&quot;val&quot;&gt;0.5&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;生意品質：A（規則：無「弱」且至少三項「強」＝A）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;評等&lt;/th&gt;&lt;th&gt;理由&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;護城河&lt;/td&gt;&lt;td&gt;強&lt;/td&gt;&lt;td&gt;轉換成本與生態系（MSFT-C01、C13）：Microsoft 365 商用雲端營收 +17%、席次只 +5%，成長主要來自每用戶營收提升（10-Q 2026-09-30 Part I, Item 2 ¶60）；同業揭露 Zoom 10-K 把 Microsoft 365（含 Teams）綑綁套件列為競爭者（全文搜尋 Q2 Zoom Communications #0），NetApp 10-K 稱 Azure 為三大超大規模雲端之一（全文搜尋 Q2 NetApp #0）；英國 CMA 擬議決定認定其地位主要來自轉換的結構障礙（新聞 N2）。威脅：CMA 與 FTC 程序都針對授權與綑綁（MSFT-C11）。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;投入資本報酬與增量回報&lt;/td&gt;&lt;td&gt;強&lt;/td&gt;&lt;td&gt;MSFT-C02：ROIC_TTM 53.0%（營運投入資本口徑，財務指標.json），研發資本化後約 41.0%（研發資本化對照.json 主要方法與 5 年敏感度相同）；2024-06～2026-06 增量 ROIC 21.5%，因資料中心投資下降但仍高於 WACC 約 10.2%；增量營業利益率 FY23→FY26 55.6%（MSFT-C14）。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;自由現金流品質&lt;/td&gt;&lt;td&gt;中&lt;/td&gt;&lt;td&gt;MSFT-C03：近四季營運現金流 195,878、資本支出 135,921、自由現金流 59,957，只有淨利 142,631 的約 42%；另有融資租賃負債 70,973（10-Q 2026-09-30 Part I, Item 1 ¶158）不經資本支出科目，未開始租賃 3,646 億（¶159）；股權薪酬 12,556（財務指標.json）。投資高峰期壓低現金轉換；非 GAAP 口徑只排除 OpenAI 損益（MSFT-C07）。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;資產負債表&lt;/td&gt;&lt;td&gt;強&lt;/td&gt;&lt;td&gt;MSFT-C09、C10：長期無擔保債評級 AAA（10-Q 2026-09-30 Part I, Item 1 ¶98）；現金與證券 102,317 高於有息負債 35,481；含融資租賃 70,973 後仍接近淨現金；股利與回購後自由現金流仍有 11,924（融資償債底稿）。IRS 補稅爭議 289 億已大致反映在 306 億長期所得稅負債（¶142–143）。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;治理與資本配置&lt;/td&gt;&lt;td&gt;中&lt;/td&gt;&lt;td&gt;MSFT-C16：稀釋股數十年年均 −0.72%，回購大致抵銷股權薪酬，股利連續 11 年成長（價值判斷.json）；近四季股利 27,033、回購 21,000 由自由現金流支應。扣分：每季資本支出指引逾 500 億美元（8-K 2026-09-02 本文 §24）與 3,646 億美元未開始租賃的回報尚未驗證（MSFT-C12），且 OpenAI 一季貢獻 100 億美元營收、占約 11%（10-Q ¶34，MSFT-C08）；書面指引樣本只有一次（MSFT-C15）。&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;PEG 三口徑、林區資產負債表檢查與 F 分數等交叉檢查（算法與完整表見&lt;a href=&quot;#wp-value&quot;&gt;計算底稿 價值判斷&lt;/a&gt;）。&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;capital&quot;&gt;&lt;div class=&quot;qno&quot;&gt;問題 06&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;財務體質與資本配置穩健嗎？&lt;/div&gt;&lt;h2&gt;財務很穩，治理中上，主要變數是租賃承諾與稅務爭議。&lt;/h2&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;有息負債 35,481 百萬美元，現金與證券 102,317 百萬美元，淨現金 66,836 百萬美元；近四季借還款 淨償還 7,850 百萬美元&lt;span class=&quot;src&quot;&gt;（作者校正：原文 10-K 2026-06-30＋10-Q 2026-09-30；10-K Item 8 ¶11；10-Q Part I, Item 1 ¶11）&lt;/span&gt;，期間內未發新債（融資償債判讀.json）。&lt;/strong&gt;期後 2026-11-04 發行面額合計 250 億美元新債&lt;span class=&quot;src&quot;&gt;（固定利率 230 億、浮動利率 20 億，2028–2066 年到期；8-K 2026-11-04 本文 §3）&lt;/span&gt;，未反映在 2026-09-30 資產負債表，8-K 未載用途；所得若留在帳上，現金與負債同增、兩者淨額不變，估值仍用 2026-09-30 資產負債表、未改（作者判斷）。MSFT-C09 改判條件（股利與回購後現金轉負並開始淨發債）：發債已出現，是否淨發債待 FY2027 第二季現金流量表；股利與回購後現金仍為正，條件未全部成立。信用評級 機構 未揭露／推導 AAA（只看利息保障倍數，50.6 倍）｜依推導：投資等級，存活檢查 無明顯警訊。&lt;/p&gt;&lt;p&gt;反方：資料中心改用融資租賃擴張，租賃負債從 666 億增到 710 億美元，另有 3,646 億未起租承諾，實質槓桿比帳面債務高&lt;span class=&quot;src&quot;&gt;（10-Q 2026-09-30 Part I, Item 1 ¶156、¶159，MSFT-C09）&lt;/span&gt;。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;現金與證券 vs 有息負債（億美元），上方為淨現金&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 300&quot; role=&quot;img&quot; aria-label=&quot;資產負債&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;266.0&quot; y2=&quot;266.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;270.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;0.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;185.3&quot; y2=&quot;185.3&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;189.3&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;500
