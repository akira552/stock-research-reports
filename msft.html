var(--c2)&quot;&gt;&lt;title&gt;研發占營收 AAPL：10%&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;519.2&quot; y=&quot;263.0&quot; width=&quot;10.7&quot; height=&quot;3.0&quot; rx=&quot;2&quot; fill=&quot;var(--c3)&quot;&gt;&lt;title&gt;資本支出占營收 AAPL：2%&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;512.9&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;AAPL&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c1)&quot;&gt;&lt;/i&gt;營業利益率&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c2)&quot;&gt;&lt;/i&gt;研發占營收&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c3)&quot;&gt;&lt;/i&gt;資本支出占營收&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;我們的假設 vs 產業常見範圍&lt;/h4&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;對照 Damodaran 軟體（系統與應用）產業 309 家、2026 年 1 月資料（產業基準對照.json）：營業利益率 47% 高於產業 33%，資本報酬率 30% 與產業 29% 相近。&lt;/strong&gt;利潤率偏高有公司證據，FY2023–FY2026 增量營業利益率約 56%&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;。微軟占該產業比重大，產業數字含公司自己，不是完全獨立的檢查（作者判斷）。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;銷售對投入資本 0.52 倍遠低於產業 1.54 倍，反映 AI 資料中心與融資租賃拉高資本密度。&lt;/strong&gt;研發占營收 10.5%、股權薪酬占營收 3.6%，都低於產業的 16.0% 與 7.8%&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;此方法在本工作流的實例驗證：產業估值方法實例驗證表的訂閱軟體只有 CRM（有條件可用，待下一家驗證三條補充規則）；本家為第二家，資本密度遠高於 CRM，屬首次用在資本支出高峰期的公司（作者判斷）。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;details id=&quot;claims&quot;&gt;&lt;summary&gt;論點檢查：每條判斷的證據狀態&lt;/summary&gt;&lt;div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;依風險分類的主張（證據狀態：支持／部分支持／提出反證／資料不足）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;編號&lt;/th&gt;&lt;th&gt;風險類別&lt;/th&gt;&lt;th&gt;主張&lt;/th&gt;&lt;th&gt;角色&lt;/th&gt;&lt;th&gt;證據狀態&lt;/th&gt;&lt;th&gt;什麼會改變判斷&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;MSFT-C09&lt;/td&gt;&lt;td&gt;R1 資金與流動性&lt;/td&gt;&lt;td&gt;成長所需資金走得到：近四季自由現金流支付股利與回購後仍有 119 億，期間內未發新債（期後 2026-11-04 發行 250 億美元）；但資料中心以融資租賃擴張，另有 3,646 億美元未開始租賃。&lt;/td&gt;&lt;td&gt;支持論點&lt;/td&gt;&lt;td&gt;部分支持&lt;/td&gt;&lt;td&gt;股利與回購後的現金轉負並開始淨發債&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;MSFT-C10&lt;/td&gt;&lt;td&gt;R2 償債負擔與永久損失&lt;/td&gt;&lt;td&gt;IRS 對 2004–2013 年度移轉訂價要求補稅 289 億美元另加罰款利息，公司已列 306 億未認列稅務利益與其他所得稅負債，估值未另扣。&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;部分支持&lt;/td&gt;&lt;td&gt;IRS 上訴結果不利且公司增提準備超過 306 億&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;MSFT-C01&lt;/td&gt;&lt;td&gt;R3 成長退坡與競爭&lt;/td&gt;&lt;td&gt;護城河主要來自轉換成本與生態系：Microsoft 365 席次只增 5%、營收增 17%，客戶接受每用戶價格上升；同業年報也把套件綑綁與 Azure 規模列為競爭條件。&lt;/td&gt;&lt;td&gt;支持論點&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;Microsoft 365 商用雲端營收年增低於席次年增（每用戶營收下滑）連續兩季；英國 CMA 指定 SMS 後行為規則限制綑綁或強制雲端授權互通，或 FTC 調查轉為正式起訴&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;MSFT-C04&lt;/td&gt;&lt;td&gt;R3 成長退坡與競爭&lt;/td&gt;&lt;td&gt;成長主要來自雲端與 AI：Azure 一季成長 48%、Microsoft Cloud 30%，未履約義務 6,830 億美元、年增 73%。&lt;/td&gt;&lt;td&gt;支持論點&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;Azure 年增率連續兩季降到 30% 以下，或商業未履約義務年增轉為低於 20%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;MSFT-C05&lt;/td&gt;&lt;td&gt;R3 成長退坡與競爭&lt;/td&gt;&lt;td&gt;合約存量可以支撐未來一年成長：約 30% 的未履約義務（約 2,049 億美元，推導）在 12 個月內認列，基準首年成長 16% 低於近四季 17.9%。&lt;/td&gt;&lt;td&gt;支持論點&lt;/td&gt;&lt;td&gt;部分支持&lt;/td&gt;&lt;td&gt;近四季營收年增低於 12%（保守情境首年）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;MSFT-C13&lt;/td&gt;&lt;td&gt;R3 成長退坡與競爭&lt;/td&gt;&lt;td&gt;定價能力有證據：Microsoft 365 商用雲端營收增速是席次增速的三倍多。&lt;/td&gt;&lt;td&gt;支持論點&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;商用雲端營收年增減席次年增低於 5 個百分點&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;MSFT-C02&lt;/td&gt;&lt;td&gt;R4 投入回報不足&lt;/td&gt;&lt;td&gt;投入資本報酬仍遠高於資金成本，但 AI 資本密度上升使報酬率逐年下降，新增投資的報酬約 21%。&lt;/td&gt;&lt;td&gt;支持論點&lt;/td&gt;&lt;td&gt;部分支持&lt;/td&gt;&lt;td&gt;增量 ROIC 降到 WACC 10% 以下，或研發資本化後 ROIC 低於 25%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;MSFT-C12&lt;/td&gt;&lt;td&gt;R4 投入回報不足&lt;/td&gt;&lt;td&gt;AI 資本支出仍在高峰：FY27 Q1 指引單季逾 500 億美元，資料中心耐用年限延長到 25 年只讓折舊時點後移，不改總投入。&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;部分支持&lt;/td&gt;&lt;td&gt;營業利益率低於 42%（扣除耐用年限變更）連續兩季&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;MSFT-C14&lt;/td&gt;&lt;td&gt;R4 投入回報不足&lt;/td&gt;&lt;td&gt;營運槓桿延續：FY2023→FY2026 每多 1 元營收多 0.56 元營業利益，最新一季營業利益增速 21% 高於營收 19%。&lt;/td&gt;&lt;td&gt;支持論點&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;營業利益年增連續兩季低於營收年增&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;MSFT-C03&lt;/td&gt;&lt;td&gt;R5 收入與盈餘品質&lt;/td&gt;&lt;td&gt;盈餘能轉成現金，但資本支出吃掉大部分營運現金流：近四季營運現金流 1,959 億，扣資本支出後只剩 600 億。&lt;/td&gt;&lt;td&gt;支持論點&lt;/td&gt;&lt;td&gt;部分支持&lt;/td&gt;&lt;td&gt;近四季自由現金流轉負，或扣融資租賃本金後低於股利&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;MSFT-C07&lt;/td&gt;&lt;td&gt;R5 收入與盈餘品質&lt;/td&gt;&lt;td&gt;本益比用的每股盈餘是排除 OpenAI 權益法損益的非 GAAP 口徑 17.93，比申報近四季 19.15 低；兩者都沒有扣除股權薪酬以外的差異。&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;部分支持&lt;/td&gt;&lt;td&gt;OpenAI 權益法損益占淨利差距超過 10%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;MSFT-C08&lt;/td&gt;&lt;td&gt;R5 收入與盈餘品質&lt;/td&gt;&lt;td&gt;OpenAI 是最大的單一關係人：一季營收 100 億美元、約占 11%，Microsoft 同時持股約 24%，關係變化會同時影響營收與投資價值。&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;來自 OpenAI 的季營收年減，或應收帳款增加快於營收&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;MSFT-C15&lt;/td&gt;&lt;td&gt;R6 治理與資料可信度&lt;/td&gt;&lt;td&gt;指引可信度：FY27 Q1 實際營收 923 億高於書面指引上緣 909.5 億，但書面指引樣本只有一次。&lt;/td&gt;&lt;td&gt;支持論點&lt;/td&gt;&lt;td&gt;部分支持&lt;/td&gt;&lt;td&gt;下一季營收低於法說會指引下緣&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;MSFT-C06&lt;/td&gt;&lt;td&gt;R7 估值與市場預期&lt;/td&gt;&lt;td&gt;現價隱含的前提偏高：523.88 美元要求未來五年營收年增約 18.9%，高於基準 16%→10% 的路徑，隱含年報酬約 8.0%、低於資金成本 10.2%。&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;連續四季營收年增高於 19% 且營業利益率維持 45% 以上；股價跌到合理價值區間上緣 456 以下&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;MSFT-C11&lt;/td&gt;&lt;td&gt;R8 宏觀與共同曝險&lt;/td&gt;&lt;td&gt;監管是護城河的主要外部威脅：英國 CMA 擬指定 Microsoft 戰略市場地位，美國 FTC 調查擴及雲端授權與綑綁。&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;部分支持&lt;/td&gt;&lt;td&gt;CMA 行為規則限制 Microsoft 在其他雲端提高授權價格，或 FTC 調查轉為正式起訴&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;MSFT-C16&lt;/td&gt;&lt;td&gt;R9 稀釋與股東回饋&lt;/td&gt;&lt;td&gt;股東回報主要靠成長而非回購：近十年稀釋股數每年只減約 0.7%，回購大致抵銷股權薪酬。&lt;/td&gt;&lt;td&gt;支持論點&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;稀釋股數年增超過 1%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;並列：研究評等 生意 A ／ 價格偏貴；價格位置 偏貴；現價隱含年報酬（基準情境，非預期報酬） 8.0%。各列狀態與價格分開呈現，不合成分數，狀態件數也不代表強弱（非買賣建議）。&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;details id=&quot;glossary&quot;&gt;&lt;summary&gt;名詞小抄&lt;/summary&gt;&lt;dl class=&quot;gl&quot;&gt;&lt;dt id=&quot;g0&quot;&gt;未履約義務（RPO）&lt;/dt&gt;&lt;dd&gt;客戶已簽約、公司還沒交付的金額，可看成合約存量。&lt;/dd&gt;&lt;dt id=&quot;g1&quot;&gt;銷售對資本比&lt;/dt&gt;&lt;dd&gt;每投入 1 元資本能多帶來幾元營收；越低代表成長越吃資本。&lt;/dd&gt;&lt;dt id=&quot;g2&quot;&gt;增量投入資本報酬（增量 ROIC）&lt;/dt&gt;&lt;dd&gt;新增投入的資本，帶來多少新增稅後營業利益。&lt;/dd&gt;&lt;dt id=&quot;g3&quot;&gt;市價隱含第 10 年倍數&lt;/dt&gt;&lt;dd&gt;把現價倒推回去，第 10 年企業價值要是營業利益的幾倍才說得通。&lt;/dd&gt;&lt;dt id=&quot;g4&quot;&gt;融資租賃&lt;/dt&gt;&lt;dd&gt;長期租用資料中心或設備，會計上視同借錢買資產，要列負債。&lt;/dd&gt;&lt;/dl&gt;&lt;/details&gt;&lt;details id=&quot;numbers-table&quot;&gt;&lt;summary&gt;完整數字表格：三大報表摘要（年度與 8 季，供查；圖在正文「完整數字」）&lt;/summary&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:14px&quot;&gt;損益表（年度與近四季）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;億美元&lt;/th&gt;&lt;th&gt;FY23&lt;/th&gt;&lt;th&gt;FY24&lt;/th&gt;&lt;th&gt;FY25&lt;/th&gt;&lt;th&gt;FY26&lt;/th&gt;&lt;th&gt;近四季&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;營收&lt;/td&gt;&lt;td&gt;2,119&lt;/td&gt;&lt;td&gt;2,451&lt;/td&gt;&lt;td&gt;2,817&lt;/td&gt;&lt;td&gt;3,318&lt;/td&gt;&lt;td&gt;3,464&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;毛利&lt;/td&gt;&lt;td&gt;1,461&lt;/td&gt;&lt;td&gt;1,710&lt;/td&gt;&lt;td&gt;1,939&lt;/td&gt;&lt;td&gt;2,255&lt;/td&gt;&lt;td&gt;2,344&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;研發費用&lt;/td&gt;&lt;td&gt;272&lt;/td&gt;&lt;td &lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;div class=&quot;wrap&quot;&gt;&lt;div class=&quot;top&quot;&gt;&lt;span&gt;&lt;b&gt;微軟（MSFT）&lt;/b&gt;｜商業評估&lt;/span&gt;&lt;span&gt;資料截止 2026-11-13｜基準季 2026-09-30｜&lt;a href=&quot;報告.html&quot;&gt;估值報告（另頁）&lt;/a&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;hero&quot;&gt;&lt;div&gt;&lt;div class=&quot;eyebrow&quot;&gt;商業評估｜訂閱軟體／—&lt;/div&gt;&lt;h1&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;微軟靠企業多年期授權與訂閱守住高利潤的生產力軟體，再用 Azure 雲端消費量帶動第二波成長；成長幾乎全來自雲端，代價是資本支出占營收的比重一年內升到約四成。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src2&quot;&gt;[2]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src3&quot;&gt;[3]&lt;/a&gt;&lt;/sup&gt;&lt;/h1&gt;&lt;p class=&quot;lead&quot;&gt;本頁只用官方文件、財報與新聞，回答商業模式是否成立、成長點在哪、是否卡住、未來怎麼變、週期多久。&lt;b&gt;不含價格、估值或任何買賣建議&lt;/b&gt;，也不影響估值報告的研究評等。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;gradebox&quot;&gt;&lt;div class=&quot;lab&quot;&gt;商業評估等級（五級 A–E）&lt;span class=&quot;ruleok&quot;&gt;評分規則第一版，2026-11-07 使用者核定&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;g&quot;&gt;A&lt;small&gt;級&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;加權分 4.25／5｜相對同業：ORCL、GOOGL、CRM、ADBE、NOW、SAP&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;模式已被證明、成長未見卡點，在同業前段&lt;/div&gt;&lt;div class=&quot;note&quot;&gt;商業評估等級（A–E 五級）只看商業模式是否成立、成長是否卡住、週期在哪，相對同產業卡同業評比；它不是估值報告研究評等裡的「生意品質 A／B／C」（那是看護城河、投入資本報酬、現金流品質、資產負債表與治理的絕對標準），不進研究評等、不影響估值、不涉任何價格。&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;nav class=&quot;qnav&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;&lt;a href=&quot;#s0&quot;&gt;重點&lt;/a&gt;&lt;a href=&quot;#s1&quot;&gt;1 商業輪廓&lt;/a&gt;&lt;a href=&quot;#s2&quot;&gt;2 說的 vs 做的&lt;/a&gt;&lt;a href=&quot;#s3&quot;&gt;3 成長與卡點&lt;/a&gt;&lt;a href=&quot;#sa&quot;&gt;4 優勢與持續期間&lt;/a&gt;&lt;a href=&quot;#s4&quot;&gt;5 生命週期&lt;/a&gt;&lt;a href=&quot;#s5&quot;&gt;6 週期&lt;/a&gt;&lt;a href=&quot;#s6&quot;&gt;7 觀察清單&lt;/a&gt;&lt;a href=&quot;#sg&quot;&gt;等級明細&lt;/a&gt;&lt;a href=&quot;#src&quot;&gt;出處&lt;/a&gt;&lt;/div&gt;&lt;/nav&gt;&lt;div class=&quot;wrap&quot;&gt;&lt;section id=&quot;s0&quot;&gt;&lt;h2&gt;一眼看重點&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;先看等級怎麼來、這頁的證據有多扎實；細節在下面各節。&lt;/p&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;等級怎麼來：五個面向&lt;/figcaption&gt;&lt;svg viewBox=&quot;0 0 640 260&quot; role=&quot;img&quot; aria-label=&quot;商業評估等級五面向：作者分與機械建議分&quot;&gt;&lt;line x1=&quot;150.0&quot; x2=&quot;150.0&quot; y1=&quot;20&quot; y2=&quot;232&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;150.0&quot; y=&quot;250&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;1 分&lt;/text&gt;&lt;line x1=&quot;255.0&quot; x2=&quot;255.0&quot; y1=&quot;20&quot; y2=&quot;232&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;255.0&quot; y=&quot;250&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;2 分&lt;/text&gt;&lt;line x1=&quot;360.0&quot; x2=&quot;360.0&quot; y1=&quot;20&quot; y2=&quot;232&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;360.0&quot; y=&quot;250&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;3 分&lt;/text&gt;&lt;line x1=&quot;465.0&quot; x2=&quot;465.0&quot; y1=&quot;20&quot; y2=&quot;232&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;465.0&quot; y=&quot;250&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;4 分&lt;/text&gt;&lt;line x1=&quot;570.0&quot; x2=&quot;570.0&quot; y1=&quot;20&quot; y2=&quot;232&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;570.0&quot; y=&quot;250&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;5 分&lt;/text&gt;&lt;text x=&quot;140&quot; y=&quot;55.0&quot; class=&quot;lb&quot; text-anchor=&quot;end&quot;&gt;模式穩固度&lt;tspan class=&quot;ax&quot;&gt; 25%&lt;/tspan&gt;&lt;/text&gt;&lt;rect x=&quot;150.0&quot; y=&quot;43.0&quot; width=&quot;420.0&quot; height=&quot;14&quot; rx=&quot;3&quot; fill=&quot;var(--biz)&quot; opacity=&quot;.85&quot;/&gt;&lt;path d=&quot;M570 .2&quot; height=&quot;26&quot; fill=&quot;var(--neg)&quot;&gt;&lt;title&gt;待查 7&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;4&quot; y=&quot;52&quot; class=&quot;ax&quot;&gt;合計 110&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;lg&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--biz)&quot;&gt;&lt;/i&gt;事實 65&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--accent)&quot;&gt;&lt;/i&gt;推論 29&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c6)&quot;&gt;&lt;/i&gt;作者判斷 9&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--neg)&quot;&gt;&lt;/i&gt;待查 7&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;全頁句子依標記分類：事實（原文或財報直接寫的）占 59%；推論與作者判斷是從事實推出或取捨的結論，待查是找不到證據的地方。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估.json#/標記統計&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/section&gt;&lt;section id=&quot;s1&quot;&gt;&lt;h2&gt;1　商業輪廓：賣什麼、賣給誰、怎麼收錢&lt;/h2&gt;&lt;div&gt;&lt;span class=&quot;chip&quot;&gt;訂閱（Microsoft 365、Dynamics 365、LinkedIn 付費方案、Game Pass）&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;雲端消費量計費（Azure 基礎設施與平台服務）&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;授權（永久授權與大量授權含軟體保證）&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;廣告（搜尋廣告）&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;一次性商品銷售（Surface、XBOX 硬體）&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;分潤（OpenAI 商業安排）&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cards c3&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;賣什麼&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;FY2026 營收 3,318 億美元，最大兩項是伺服器產品與雲端服務（含 Azure）1,294 億、Microsoft 365 商用產品與雲端 1,020 億；其餘為 XBOX 218 億、LinkedIn 198 億、Windows 與裝置 171 億、搜尋廣告 152 億等。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src4&quot;&gt;[4]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;自 FY2027 起分部改為「代理與基礎設施（Agents and Infra）」與「裝置與消費者（Devices and Consumer）」兩塊；最新一季前者營收 768 億美元、後者 155 億美元。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src5&quot;&gt;[5]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;賣給誰&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;直接銷售對象從跨國企業、公部門到中小企業，間接通路靠合作夥伴網絡；大量授權方案服務大型企業、中型組織、小型企業、教育機構與政府。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src6&quot;&gt;[6]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src7&quot;&gt;[7]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;年報寫 FY2026 沒有單一客戶占營收 10% 以上；但最新一季來自 OpenAI 商業安排（含分潤）的營收 100 億美元，約占當季營收 923 億的 10.8%（推算），OpenAI 是持股約 24% 的關係人。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src8&quot;&gt;[8]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src9&quot;&gt;[9]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;怎麼收錢&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;客戶可買永久授權或訂閱授權，兩者功能相同、差在使用期間；企業合約（Enterprise Agreement）把地端授權與軟體保證綁在一起。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src10&quot;&gt;[10]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src11&quot;&gt;[11]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;多年期合約一般在每個年度保障期開始時開票、預收款依期間認列；第四季（4–6 月）營收因多年期合約集中簽約而偏高。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src12&quot;&gt;[12]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src13&quot;&gt;[13]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src14&quot;&gt;[14]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;Azure 營收主要受基礎設施即服務與平台即服務的用量計費影響，用多少付多少。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src15&quot;&gt;[15]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;營收從哪裡來（2026-06-30 (FY)）&lt;/figcaption&gt;&lt;div class=&quot;sub-t&quot;&gt;依產品（ProductOrService）&lt;/div&gt;&lt;svg viewBox=&quot;0 0 640 320&quot; role=&quot;img&quot; aria-label=&quot f=&quot;#src18&quot;&gt;[18]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;同一季服務與其他營收年增 25.7%、產品營收年減 8.1%，營收結構持續從一次性授權與硬體轉向訂閱與用量；這是兩種切法，與上一句的產品別不能相加。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src16&quot;&gt;[16]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;分部看，代理與基礎設施一季營收年增 25%、營業利益年增 24%；裝置與消費者營收年減 3%、營業利益只增 2%，成長幾乎全由前者撐起。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;費用率：本期對去年同期（2026-09-30 (Q1)）&lt;/figcaption&gt;&lt;svg viewBox=&quot;0 0 640 186&quot; role=&quot;img&quot; aria-label=&quot;費用率本期與去年同期&quot;&gt;&lt;line x1=&quot;110.0&quot; x2=&quot;110.0&quot; y1=&quot;16&quot; y2=&quot;162&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;110.0&quot; y=&quot;178&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;0%&lt;/text&gt;&lt;line x1=&quot;212.5&quot; x2=&quot;212.5&quot; y1=&quot;16&quot; y2=&quot;162&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;212.5&quot; y=&quot;178&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;20%&lt;/text&gt;&lt;line x1=&quot;315.0&quot; x2=&quot;315.0&quot; y1=&quot;16&quot; y2=&quot;162&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;315.0&quot; y=&quot;178&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;40%&lt;/text&gt;&lt;line x1=&quot;417.5&quot; x2=&quot;417.5&quot; y1=&quot;16&quot; y2=&quot;162&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;417.5&quot; y=&quot;178&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;60%&lt;/text&gt;&lt;line x1=&quot;520.0&quot; x2=&quot;520.0&quot; y1=&quot;16&quot; y2=&quot;162&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;520.0&quot; y=&quot;178&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;80%&lt;/text&gt;&lt;text x=&quot;102&quot; y=&quot;40.0&quot; class=&quot;lb s&quot; text-anchor=&quot;end&quot;&g t;&lt;/circle&gt;&lt;circle cx=&quot;152.2&quot; cy=&quot;103.0&quot; r=&quot;5.5&quot; fill=&quot;var(--biz)&quot;&gt;&lt;title&gt;本期 8.2%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;169.7&quot; y=&quot;108.0&quot; class=&quot;vl s&quot;&gt;8.2%&lt;tspan class=&quot;ax&quot;&gt; -1.5 點&lt;/tspan&gt;&lt;/text&gt;&lt;text x=&quot;102&quot; y=&quot;142.0&quot; class=&quot;lb s&quot; text-anchor=&quot;end&quot;&gt;研發率&lt;/text&gt;&lt;line x1=&quot;163.8&quot; x2=&quot;160.2&quot; y1=&quot;137.0&quot; y2=&quot;137.0&quot; stroke=&quot;var(--biz)&quot; stroke-width=&quot;3&quot; opacity=&quot;.5&quot;/&gt;&lt;circle cx=&quot;163.8&quot; cy=&quot;137.0&quot; r=&quot;5&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;去年同期 10.5%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;160.2&quot; cy=&quot;137.0&quot; r=&quot;5.5&quot; fill=&quot;var(--biz)&quot;&gt;&lt;title&gt;本期 9.8%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;173.8&quot; y=&quot;142.0&quot; class=&quot;vl s&quot;&gt;9.8%&lt;tspan class=&quot;ax&quot;&gt; -0.7 點&lt;/tspan&gt;&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;lg&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--biz)&quot;&gt;&lt;/i&gt;本期&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--muted)&quot;&gt;&lt;/i&gt;去年同期&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--neg)&quot;&gt;&lt;/i&gt;變差超過 1 點&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;空心點是去年同期、實心點是本期，右側是變化（百分點）；費用率升或毛利率降超過 1 點標紅。分母是含全部收入的營收。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估底稿.json#/費用率（財報/10-Q_2026-09-30_損益表.json）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/section&gt;&lt;section id=&quot;s2&quot;&gt;&lt;h2&gt;2　商業模式驗證：說的 vs 做的&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;管理層在 10-K、10-Q、8-K 的說法，對照財報數字。判定：已驗證／部分支持／說法未獲數字支持／待查。&lt;/p&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;說的 vs 做的：判定分布&lt;/figcaption&gt;&lt;svg viewBox=&quot;0 0 640 58&quot; role=&quot;img&quot; aria-label=&quot;說的vs做的判定&quot;&gt;&lt;rect x=&quot;4.0&quot; y=&quot;6&quot; width=&quot;316.0&quot; height=&quot;26&quot; fill=&quot;var(--pos)&quot;&gt;&lt;title&gt;已驗證 2&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;162.0&quot; y=&quot;24&quot; class=&quot;inb&quot; text-anchor=&quot;middle&quot;&gt;已驗證 2&lt;/text&gt;&lt;rect x=&quot;320.0&quot; y=&quot;6&quot; width=&quot;316.0&quot; height=&quot;26&quot; fill=&quot;var(--warn)&quot;&gt;&lt;title&gt;部分支持 2&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;478.0&quot; y=&quot;24&quot; class=&quot;inb&quot; text-anchor=&quot;middle&quot;&gt;部分支持 2&lt;/text&gt;&lt;text x=&quot;4&quot; y=&quot;52&quot; class=&quot;ax&quot;&gt;合計 4&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;lg&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--pos)&quot;&gt;&lt;/i&gt;已驗證 2&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--warn)&quot;&gt;&lt;/i&gt;部分支持 2&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;管理層 4 條說法對照財報數字的結果；2 條不是「已驗證」，下方用色框標出（有問題的證據）。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估.json#/內容/說的vs做的/判定&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;div class=&quot;callout warnc&quot;&gt;&lt;b&gt;有問題的證據（判定不是「已驗證」）&lt;/b&gt;&lt;ul class=&quot;badl&quot;&gt;&lt;li&gt;&lt;a href=&quot;#cl3&quot;&gt;需求超過供給、資本支出照計畫&lt;/a&gt; &lt;span class=&quot;v v-部分支持&quot;&gt;部分支持&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a href=&quot;#cl4&quot;&gt;商業積壓（RPO）的品質&lt;/a&gt; &lt;span class=&quot;v v-部分支持&quot;&gt;部分支持&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;div class=&quot;cards&quot;&gt;&lt;div class=&quot;card claim cv-已驗證&quot; id=&quot;cl1&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;季度指引的達成&lt;/b&gt;&lt;span class=&quot;v v-已驗證&quot;&gt;已驗證&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;管理層說法&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;2026-09-02 調整後的 FY2027 第一季指引：代理與基礎設施營收 751.5–757.5 億、裝置與消費者 147–152 億（合計 898.5–909.5 億美元），Azure 固定匯率年增 44%–45%，Windows OEM 與裝置年減二十出頭。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src19&quot;&gt;[19]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對照數字&lt;/div&gt;&lt;ul class=&quot;ev&quot;&gt;&lt;li class=&quot;s&quot;&gt;實際營收 923 億美元、年增 19%，高於指引上緣；代理與基礎設施 768 億、裝置與消費者 155 億，兩塊都高於各自上緣。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src20&quot;&gt;[20]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;li class=&quot;s&quot;&gt;Azure 報導口徑年增 48%（本季新聞稿與 10-Q 未揭露 Azure 固定匯率值；指引寫匯率對營收成長影響小於 1 點，推算固定匯率仍在 47% 以上），高於 44%–45% 固定匯率指引；Windows OEM 與裝置年減 22%，落在「年減二十出頭」之內。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src21&quot;&gt;[21]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src22&quot;&gt;[22]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src19&quot;&gt;[19]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src23&quot;&gt;[23]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;lbl&quot;&gt;說明&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;營收與主要產品線都落在或高於指引；但 Azure 等成長指標自 FY2027 起改了口徑（重新歸類部分元件），與舊口徑的歷史年增不能直接比，只能與同口徑的指引比。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src24&quot;&gt;[24]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src19&quot;&gt;[19]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card claim cv-已驗證&quot; id=&quot;cl2&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;Microsoft 365 靠每用戶營收成長&lt;/b&gt;&lt;span class=&quot;v v-已驗證&quot;&gt;已驗證&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;管理層說法&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;公司說 Microsoft 365 商用雲端營收年增 17% 是靠每用戶營收提高，反映往 Copilot、E5、E7 等高階方案升級與 GitHub Copilot 用量增加。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src17&quot;&gt;[17]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對照數字&lt;/div&gt;&lt;ul class=&quot;ev&quot;&gt;&lt;li class=&quot;s&quot;&gt;同一季 Microsoft 365 商用席次只增 5%，營收增 17%，每席營收約增 11%（推算：1.17÷1.05−1）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src17&quot;&gt;[17]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;li class=&quot;s&quot;&gt;席次指標自 FY2027 起納入付費 GitHub 席次，口徑變寬；FY2026 重編後席次年增 7%，最新一季 5%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src24&quot;&gt;[24]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src25&quot;&gt;[25]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;lbl&quot;&gt;說明&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;營收增速是席次增速的三倍多，升級帶動的說法有數字支持；Copilot 單獨的營收與付費席次未揭露，升級裡 AI 占多少待查。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src17&quot;&gt;[17]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card claim cv-部分支持&quot; id=&quot;cl3&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;需求超過供給、資本支出照計畫&lt;/b&gt;&lt;span class=&quot;v v-部分支持&quot;&gt;部分支持&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;管理層說法&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;財務長在 2026-10-28 法說會說「需求仍超過供給」，第一季資本支出 452 億美元偏低是因第三方產能交付延遲，2026 曆年資本支出約 1,700 億。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src26&quot;&gt;[26]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對照數字&lt;/div&gt;&lt;ul class=&quot;ev&quot;&gt;&lt;li class=&quot;s&quot;&gt;第一季書面指引寫資本支出超過 500 億美元，實際 452 億，低於指引。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src19&quot;&gt;[19]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src26&quot;&gt;[26]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;li class=&quot;s&quot;&gt;公司在風險因子寫部分資料中心關鍵零件供應商有限且短缺，對手也在擴產並用同一批供應商。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src27&quot;&gt;[27]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;li class=&quot;s&quot;&gt;需求面：Azure 年增 48%、商業未履約義務 6,770 億美元年增 73%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src22&quot;&gt;[22]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;lbl&quot;&gt;說明&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;Azure 加速與積壓擴大支持「需求強」；但「供給不足」的證據只有管理層口頭說法與風險因子的一般描述，產能缺口大小未揭露，所以只算部分支持。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src26&quot;&gt;[26]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src27&quot;&gt;[27]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card claim cv-部分支持&quot; id=&quot;cl4&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;商業積壓（RPO）的品質&lt;/b&gt;&lt;span class=&quot;v v-部分支持&quot;&gt;部分支持&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;管理層說法&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;公司說商業未履約義務年增 73% 到 6,770 億美元；指引也寫訂單在「扣掉去年 OpenAI 合約」後仍健康成長。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src28&quot;&gt;[28]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src19&quot;&gt;[19]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對照數字&lt;/div&gt;&lt;ul class=&quot;ev&quot;&gt;&lt;li class=&quot;s&quot;&gt;商業未履約義務逐季為 6,250 億（2025-12）、6,270 億（2026-03）、6,780 億（2026-06）、6,770 億美元（2026-09），年增率從 110% 降到 99%、84%、73%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src29&quot;&gt;[29]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src30&quot;&gt;[30]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src31&quot;&gt;[31]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src22&quot;&gt;[22]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;li class=&quot;s&quot;&gt;未履約義務加權平均期間約 2.3 年，約 30% 在 12 個月內認列。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src32&quot;&gt;[32]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;lbl&quot;&gt;說明&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;年增 73% 屬實，但最近一季積壓比上一季略減、年增率連續四季下降，主要是 OpenAI 大單的高基期；OpenAI 占積壓多少未揭露，扣掉後的真實訂單增速待查。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src31&quot;&gt;[31]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src22&quot;&gt;[22]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src19&quot;&gt;[19]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;s3&quot;&gt;&lt;h2&gt;3　成長引擎與卡點&lt;/h2&gt;&lt;h3&gt;成長從哪裡來（量、價、新產品、新市場、併購）&lt;/h3&gt;&lt;div class=&quot;cards&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;span class=&quot;chip&quot;&gt;量&lt;/span&gt;&lt;span class=&quot;qz&quot;&gt;能否量化：可量化&lt;/span&gt;&lt;/div&gt;&lt;b&gt;Azure 雲端與 AI 算力用量&lt;/b&gt;&lt;div class=&quot;lbl&quot;&gt;證據&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;Azure 一季營收 332 億美元、年增 48%（增加 108 億），公司說各類工作負載都在成長。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src33&quot;&gt;[33]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src16&quot;&gt;[16]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;Azure 一季增加的 108 億約占全公司營收增量 146 億的七成（推算）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src33&quot;&gt;[33]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;span class=&quot;chip&quot;&gt;價&lt;/span&gt;&lt;span class=&quot;qz&quot;&gt;能否量化：可量化&lt;/span&gt;&lt;/div&gt;&lt;b&gt;Microsoft 365 往高階方案升級&lt;/b&gt;&lt;div class=&quot;lbl&quot;&gt;證據&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;Microsoft 365 商用雲端營收增 17%、席次增 5%，差距來自每用戶營收提高（Copilot、E5、E7）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src17&quot;&gt;[17]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;消費端 Microsoft 365 雲端營收也增 17%，訂戶只增 7%，同樣是每用戶營收拉動。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src17&quot;&gt;[17]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;span class=&quot;chip&quot;&gt;新產品&lt;/span&gt;&lt;span class=&quot;qz&quot;&gt;能否量化：部分可量化&lt;/span&gt;&lt;/div&gt;&lt;b&gt;AI 產品（Copilot 系列、GitHub Copilot 用量、OpenAI 分潤）&lt;/b&gt;&lt;div class=&quot;lbl&quot;&gt;證據&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;公司持有 OpenAI 模型與基礎設施的智慧財產權可整合進自家產品，並持續收取分潤；一季來自 OpenAI 商業安排的營收 100 億美元。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src34&quot;&gt;[34]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src9&quot;&gt;[9]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-待查&quot;&gt;待查&lt;/span&gt;待查：Copilot 系列單獨營收、付費席次與 AI 營收年化規模，申報未揭露。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;近 12 季：營收年增與營業利益率&lt;/figcaption&gt;&lt;svg viewBox=&quot;0 0 680 250&quot; role=&quot;img&quot; aria-label=&quot;近幾季單季營收年增與營業利益率&quot;&gt;&lt;line x1=&quot;50&quot; x2=&quot;640&quot; y1=&quot;216.0&quot; y2=&quot;216.0&quot; class=&quot;zl&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;220.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;0%&lt;/text&gt;&lt;line x1=&quot;50&quot; x2=&quot;640&quot; y1=&quot;150.7&quot; y2=&quot;150.7&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;154.7&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;20%&lt;/text&gt;&lt;line x1=&quot;50&quot; x2=&quot;640&quot; y1=&quot;85.3&quot; y2=&quot;85.3&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;89.3&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;40%&lt;/text&gt;&lt;line x1=&quot;50&quot; x2=&quot;640&quot; y1=&quot;20.0&quot; y2=&quot;20.0&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;24.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;60%&lt;/text&gt;&lt;text x=&quot;113.6&quot; y=&quot;238&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;2024-03&lt;/text&gt;&lt;text x=&quot;212.9&quot; y=&quot;238&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;2024-09&lt;/text&gt;&lt;text x=&quot;312.2&quot; y=&quot;238&quot; class=&quot;ax&quot; text-
