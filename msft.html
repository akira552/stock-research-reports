quot;284.2&quot; y=&quot;210.0&quot; class=&quot;vl s&quot; text-anchor=&quot;start&quot; fill=&quot;var(--pos)&quot;&gt;-4.9 點&lt;/text&gt;&lt;rect x=&quot;308.1&quot; y=&quot;249.0&quot; width=&quot;331.9&quot; height=&quot;24&quot; fill=&quot;var(--neg)&quot; opacity=&quot;.10&quot;/&gt;&lt;line x1=&quot;308.1&quot; x2=&quot;308.1&quot; y1=&quot;247.0&quot; y2=&quot;275.0&quot; stroke=&quot;var(--neg)&quot; stroke-width=&quot;2&quot; stroke-dasharray=&quot;4 3&quot;/&gt;&lt;text x=&quot;180&quot; y=&quot;266.0&quot; class=&quot;lb s&quot; text-anchor=&quot;end&quot;&gt;S4 業務費用效率變差&lt;/text&gt;&lt;line x1=&quot;302.5&quot; x2=&quot;295.9&quot; y1=&quot;261.0&quot; y2=&quot;261.0&quot; stroke=&quot;var(--pos)&quot; stroke-width=&quot;3&quot;/&gt;&lt;circle cx=&quot;295.9&quot; cy=&quot;261.0&quot; r=&quot;6&quot; fill=&quot;var(--pos)&quot;&gt;&lt;title&gt;S4 業務費用效率變差：-1.2 點，門檻 &gt; +1.0 點&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;304.9&quot; y=&quot;252.0&quot; class=&quot;vl s&quot; text-anchor=&quot;start&quot; fill=&quot;var(--pos)&quot;&gt;-1.2 點&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;lg&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--neg)&quot;&gt;&lt;/i&gt;亮燈&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--pos)&quot;&gt;&lt;/i&gt;未亮&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--neg)&quot;&gt;&lt;/i&gt;亮燈門檻（虛線）&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;G4 另有條件「營收近四季年增低於一年前」：本期 17.9%、比較期 15.6%，兩個條件都成立才亮燈（目前未亮）。&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;每列一個用財報數字算的訊號：點是目前值，虛線是門檻，點落進淡紅色帶就亮燈；看離門檻還有多少餘裕。是非題型訊號（如連續放緩）不在此圖，見上方燈號。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估.json#/內容/卡住訊號（值、門檻、比較）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;div class=&quot;sub-h&quot;&gt;機械訊號（財報數字算得出）&lt;/div&gt;&lt;div class=&quot;cards&quot;&gt;&lt;div class=&quot;card sig&quot; id=&quot;sig-G1&quot; style=&quot;--tc:var(--lt-未亮, var(--muted))&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;G1　營收增速連續放緩&lt;/b&gt;&lt;span class=&quot;light l-未亮&quot;&gt;未亮&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;成長是不是一季比一季慢？&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;值&lt;/div&gt;&lt;div class=&quot;sv&quot;&gt;否&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;機械值，期末 2026-09-30；門檻  &lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;判讀&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;近四季單季營收年增為 16.7%、18.3%、17.8%、18.8%，最新一季反而加速，沒有連續放緩。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src35&quot;&gt;[35]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card sig&quot; id=&quot;sig-G2&quot; style=&quot;--tc:var(--lt-未亮, var(--muted))&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;G2　營業利益率走弱&lt;/b&gt;&lt;span class=&quot;light l-未亮&quot;&gt;未亮&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;規模變大，利潤率有沒有跟著變好？&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;值&lt;/div&gt;&lt;div class=&quot;sv&quot;&gt;+0.8 個百分點&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;機械值，期末 2026-09-30；門檻 &amp;lt; -1.0 個百分點&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;判讀&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;近四季營業利益率 47.1%，比一年前高 0.8 個百分點；但財務長口頭指引下一季營業利益率年比小降，折舊壓力正在逼近。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src36&quot;&gt;[36]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src37&quot;&gt;[37]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card sig&quot; id=&quot;sig-G3&quot; style=&quot;--tc:var(--lt-未亮, var(--muted))&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;G3　收款變慢&lt;/b&gt;&lt;span class=&quot;light l-未亮&quot;&gt;未亮&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;營收成長是不是靠放寬收款條件？&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;值&lt;/div&gt;&lt;div class=&quot;sv&quot;&gt;-0.5 個百分點&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;機械值，期末 2026-09-30；門檻 &amp;gt; +10.0 個百分點&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;判讀&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;應收增速比營收增速低 0.5 個百分點，收款沒有變慢；但應收 OpenAI 由 60 億增到 72 億美元，單一對手的應收值得追蹤。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src38&quot;&gt;[38]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src9&quot;&gt;[9]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card sig&quot; id=&quot;sig-G4&quot; style=&quot;--tc:var(--lt-未亮, var(--muted))&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;G4　投入換不到成長&lt;/b&gt;&lt;span class=&quot;light l-未亮&quot;&gt;未亮&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;資本支出加大，營收增速有沒有跟上？&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;值&lt;/div&gt;&lt;div class=&quot;sv&quot;&gt;+15.7 個百分點&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;機械值，期末 2026-09-30；門檻 &amp;gt; +1.0 個百分點；且 營收近四季年增低於一年前&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;判讀&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;近四季資本支出占營收 39.2%，一年內升 15.7 個百分點，遠超 1 個百分點門檻；未亮燈只因營收近四季年增 17.9% 仍高於一年前的 15.6%（「且」條件未成立）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src2&quot;&gt;[2]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src39&quot;&gt;[39]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src40&quot;&gt;[40]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;這條是七條機械訊號裡離亮燈最近的一條：只要營收增速回落到低於一年前、而資本支出強度沒降，就會亮。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src41&quot;&gt;[41]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card sig&quot; id=&quot;sig-S2&quot; style=&quot;--tc:var(--lt-未亮, var(--muted))&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;S2　RPO 跟不上營收&lt;/b&gt;&lt;span class=&quot;light l-未亮&quot;&gt;未亮&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;未來要認列的合約有沒有比營收長得慢？&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;值&lt;/div&gt;&lt;div class=&quot;sv&quot;&gt;+53.7 個百分點&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;機械值，期末 2026-09-30；門檻 &amp;lt; +0.0 個百分點&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;判讀&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;未履約義務年增約 71.6%，比近四季營收年增高 53.7 個百分點，沒有亮燈；但這段領先多半來自 OpenAI 大單，且最新一季積壓比上一季略減。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src42&quot;&gt;[42]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src31&quot;&gt;[31]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src22&quot;&gt;[22]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card sig&quot; id=&quot;sig-S3&quot; style=&quot;--tc:var(--lt-未亮, var(--muted))&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;S3　遞延收入放緩&lt;/b&gt;&lt;span class=&quot;light l-未亮&quot;&gt;未亮&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;預收款是不是比營收長得慢很多？&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;值&lt;/div&gt;&lt;div class=&quot;sv&quot;&gt;-4.9 個百分點&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;機械值，期末 2026-09-30；門檻 &amp;lt; -10.0 個百分點&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;判讀&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;合約負債（預收款）年增 13.0%，比營收增速慢 4.9 個百分點，未達 10 個百分點門檻；預收款增速落後，與成長來源轉向用量計費的 Azure（不預收）一致。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src43&quot;&gt;[43]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src15&quot;&gt;[15]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card sig&quot; id=&quot;sig-S4&quot; style=&quot;--tc:var(--lt-未亮, var(--muted))&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;S4　業務費用效率變差&lt;/b&gt;&lt;span class=&quot;light l-未亮&quot;&gt;未亮&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;買成長的成本有沒有變貴？&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;值&lt;/div&gt;&lt;div class=&quot;sv&quot;&gt;-1.2 個百分點&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;機械值，期末 2026-09-30；門檻 &amp;gt; +1.0 個百分點&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;判讀&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;業務行銷費用占營收由 7.4% 降到 6.2%，減少 1.2 個百分點；全公司員工數年減 2%，買成長的成本在下降。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src44&quot;&gt;[44]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src45&quot;&gt;[45]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub-h&quot;&gt;作者訊號（財報數字看不出，作者讀原文判斷）&lt;/div&gt;&lt;div class=&quot;cards&quot;&gt;&lt;div class=&quot;card sig&quot; id=&quot;sig-S1&quot; style=&quot;--tc:var(--lt-資料未取得, var(--muted))&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;S1　淨收入留存率下降&lt;/b&gt;&lt;span class=&quot;light l-資料未取得&quot;&gt;資料未取得&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;老客戶還在多付嗎？&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;值&lt;/div&gt;&lt;div class=&quot;sv&quot;&gt;未揭露&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;作者從原文填&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;判讀&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-待查&quot;&gt;待查&lt;/span&gt;待查：公司未揭露淨收入留存率（NRR／DBNRR）；可替代的是 Microsoft 365 商用雲端每席營收（營收增 17%、席次增 5%）。&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card sig&quot; id=&quot;sig-S5&quot; style=&quot;--tc:var(--lt-未亮, var(--muted))&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;S5　付費客戶增速放緩&lt;/b&gt;&lt;span class=&quot;light l-未亮&quot;&gt;未亮&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;新客戶還在進來嗎？&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;值&lt;/div&gt;&lt;div class=&quot;sv&quot;&gt;Microsoft 365 商用席次年增 5%（新口徑含 GitHub 付費席次）；FY2026 重編後 7%&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;作者從原文填&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;判讀&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;席次年增由 FY2026 全年 7%（重編新口徑）降到最新一季 5%；舊口徑 FY2026 第三季為 6%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src25&quot;&gt;[25]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src17&quot;&gt;[17]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src46&quot;&gt;[46]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;新口徑只有一個季度數字，無法確認「連兩季放緩」；判定未亮燈，但席次增速已在下滑，列入觀察清單。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src24&quot;&gt;[24]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src17&quot;&gt;[17]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;h3 id=&quot;ext&quot;&gt;外部驗證：競爭者、客戶、供應商怎麼描述這家公司&lt;/h3&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;外部驗證：誰支持、誰反駁&lt;/figcaption&gt;&lt;div class=&quot;emx&quot; style=&quot;grid-template-columns:repeat(3,1fr)&quot;&gt;&lt;div class=&quot;emc&quot; style=&quot;--tc:var(--pos)&quot;&gt;&lt;div class=&quot;emh&quot;&gt;支持 &lt;b&gt;1&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;emi&quot;&gt;&lt;b&gt;Zoom Communications&lt;/b&gt;&lt;span&gt;競爭者&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;emc&quot; style=&quot;--tc:var(--warn)&quot;&gt;&lt;div class=&quot;emh&quot;&gt;部分支持 &lt;b&gt;3&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;emi&quot;&gt;&lt;b&gt;Applied Optoelectronics&lt;/b&gt;&lt;span&gt;供應商&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;emi&quot;&gt;&lt;b&gt;NetApp&lt;/b&gt;&lt;span&gt;夥伴&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;emi&quot;&gt;&lt;b&gt;IonQ&lt;/b&gt;&lt;span&gt;夥伴&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;emc&quot; style=&quot;--tc:var(--neg)&quot;&gt;&lt;div class=&quot;emh&quot;&gt;反駁 &lt;b&gt;1&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;emi&quot;&gt;&lt;b&gt;英國競爭與市場管理局（CMA）&lt;/b&gt;&lt;span&gt;其他&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;5 個外部來源（競爭者、客戶、供應商、夥伴的申報或報導）怎麼描述本公司：支持 1、部分支持 3、反駁 1。依「對本公司說法」欄的開頭分類。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估.json#/內容/外部驗證（對方、關係、支持）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;div class=&quot;cards&quot;&gt;&lt;div class=&quot;card ext&quot; style=&quot;--tc:var(--pos)&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;Zoom Communications&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;競爭者&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;對方文件怎麼說&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;Zoom 年報把附 Teams 的 Microsoft 365 綑綁套件列為主要競爭者之一，與 Google Workspace 並列。對本公司說法：支持，單點視訊產品要對抗的是整套綑綁，與綑綁帶來競爭力的說法一致（作者解讀，原文只列為競爭者）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src47&quot;&gt;[47]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對本公司說法&lt;/div&gt;&lt;div class=&quot;stc&quot;&gt;支持&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card ext&quot; style=&quot;--tc:var(--warn)&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;Applied Optoelectronics&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;供應商&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;對方文件怎麼說&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;這家光通訊供應商 2025、2024、2023 年分別有 28.8%、43.7%、46.6% 營收來自微軟，微軟是其資料中心市場最大客戶。對本公司說法：部分支持，資料中心擴建採購量大到占供應商營收近三成；占比三年下降，顯示微軟採購來源在分散或該供應商客戶在擴大；議價力原文未提，待查。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src48&quot;&gt;[48]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src49&quot;&gt;[49]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對本公司說法&lt;/div&gt;&lt;div class=&quot;stc&quot;&gt;部分支持&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card ext&quot; style=&quot;--tc:var(--warn)&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;NetApp&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;夥伴&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;對方文件怎麼說&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;NetApp 年報寫與 AWS、Microsoft Azure、Google Cloud 三大雲原生整合是自身優勢。對本公司說法：部分支持，Azure 是企業必須支援的平台之一，但與另兩家並列、並非獨有。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src50&quot;&gt;[50]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對本公司說法&lt;/div&gt;&lt;div class=&quot;stc&quot;&gt;部分支持&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card ext&quot; style=&quot;--tc:var(--warn)&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;IonQ&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;夥伴&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;對方文件怎麼說&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;IonQ 透過 AWS Braket、Microsoft Azure Quantum、Google Cloud Marketplace 三大雲提供量子電腦存取。對本公司說法：部分支持，Azure 是三大雲端通路之一，與同業並列。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src51&quot;&gt;[51]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對本公司說法&lt;/div&gt;&lt;div class=&quot;stc&quot;&gt;部分支持&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card ext&quot; style=&quot;--tc:var(--neg)&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;英國競爭與市場管理局（CMA）&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;其他&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;對方文件怎麼說&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;報導指 CMA 認定轉換成本是微軟根深地位的結構來源，擬指定「戰略市場地位」，並列出改革 E5 安全綑綁與讓第三方 AI 與 Copilot 同條件接入的規則選項。對本公司說法：反駁綑綁優勢的持久性，雖同時印證轉換成本存在。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src52&quot;&gt;[52]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src53&quot;&gt;[53]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對本公司說法&lt;/div&gt;&lt;div class=&quot;stc&quot;&gt;反駁&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;sa&quot;&gt;&lt;h2&gt;4　優勢來源與持續期間&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;每種優勢都要同時有「好處」與「屏障」證據（Helmer《7 Powers》的檢驗）：只有好處、沒有屏障的優勢只算&lt;b&gt;暫時領先&lt;/b&gt;。再分兩維：超額報酬有多大、能撐多久（Mauboussin《Measuring the Moat》的問法）；Morningstar 五種來源只當分類參考。本節只談商業面的屏障，不含價格或估值，也不是估值報告的護城河評分，不進商業評估等級。&lt;/p&gt;&lt;div class=&quot;callout&quot;&gt;&lt;b&gt;總結&lt;/b&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;主要屏障是生產力套件的轉換成本（利潤差大、可撐 5–10 年，監管是最大變數），雲端規模是三家寡占共享的優勢；OpenAI 是目前最大單一收入來源，但權利期限不明，不能當成持久優勢。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src52&quot;&gt;[52]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src54&quot;&gt;[54]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src9&quot;&gt;[9]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;優勢地圖：多大、多久&lt;/figcaption&gt;&lt;div class=&quot;amx&quot;&gt;&lt;div class=&quot;amy&quot;&gt;持續期間 →&lt;/div&gt;&lt;div class=&quot;amg&quot;&gt;&lt;div class=&quot;amr&quot; style=&quot;grid-template-columns:80px repeat(4,1fr)&quot;&gt;&lt;div class=&quot;aml&quot;&gt;不明&lt;/div&gt;&lt;div class=&quot;amc unk&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amc unk&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amc unk&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amc unk&quot;&gt;&lt;span class=&quot;ab ab-有屏障證據&quot; title=&quot;OpenAI 智慧財產權與分潤：有屏障證據&quot;&gt;3&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;amr&quot; style=&quot;grid-template-columns:80px repeat(4,1fr)&quot;&gt;&lt;div class=&quot;aml&quot;&gt;10年以上&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amc unk&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;amr&quot; style=&quot;grid-template-columns:80px repeat(4,1fr)&quot;&gt;&lt;div class=&quot;aml&quot;&gt;5–10年&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;span class=&quot;ab ab-有屏障證據&quot; title=&quot;雲端資料中心規模：有屏障證據&quot;&gt;2&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;span class=&quot;ab ab-有屏障證據&quot; title=&quot;生產力套件綑綁的轉換成本：有屏障證據&quot;&gt;1&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;amc unk&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;amr&quot; style=&quot;grid-template-columns:80px repeat(4,1fr)&quot;&gt;&lt;div class=&quot;aml&quot;&gt;不足5年&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amc unk&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;amr&quot; style=&quot;grid-template-columns:80px repeat(4,1fr)&quot;&gt;&lt;div class=&quot;aml&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amx-l&quot;&gt;小&lt;/div&gt;&lt;div class=&quot;amx-l&quot;&gt;中&lt;/div&gt;&lt;div class=&quot;amx-l&quot;&gt;大&lt;/div&gt;&lt;div class=&quot;amx-l&quot;&gt;不明&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;amxt&quot;&gt;超額報酬大小 →&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;ol class=&quot;akey&quot;&gt;&lt;li&gt;&lt;span class=&quot;ab ab-有屏障證據&quot;&gt;1&lt;/span&gt;生產力套件綑綁的轉換成本（轉換成本；有屏障證據）&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;ab ab-有屏障證據&quot;&gt;2&lt;/span&gt;雲端資料中心規模（規模經濟；有屏障證據）&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;ab ab-有屏障證據&quot;&gt;3&lt;/span&gt;OpenAI 智慧財產權與分潤（獨占資源；有屏障證據）&lt;/li&gt;&lt;/ol&gt;&lt;div class=&quot;lg&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--pos)&quot;&gt;&lt;/i&gt;有屏障證據&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--warn)&quot;&gt;&lt;/i&gt;暫時領先&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;每個圓圈是一項優勢：越往右超額報酬越大、越往上能撐越久。綠＝屏障有事實證據；橘＝只有好處或屏障只有推論（暫時領先，持續期間最多不足 5 年）。作者寫「不明」的維度放在虛線格，不補值。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估.json#/內容/優勢來源/優勢（超額報酬大小、持續期間、判定）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;每項優勢有多少證據&lt;/figcaption&gt;&lt;svg viewBox=&quot;0 0 680 174&quot; role=&quot;img&quot; aria-label=&quot;優勢的證據數：好處與屏障&quot;&gt;&lt;text x=&quot;254&quot; y=&quot;170&quot; class=&quot;ax&quot;&gt;好處句數&lt;/text&gt;&lt;text x=&quot;459.0&quot; y=&quot;170&quot; class=&quot;ax&quot;&gt;屏障句數（事實／推論）&lt;/text&gt;&lt;text x=&quot;242&quot; y=&quot;32&quot; class=&quot;lb s&quot; text-anchor=&quot;end&quot;&gt;1 生產力套件綑綁的轉換成本&lt;title&gt;1 生產力套件綑綁的轉換成本&lt;/title&gt;&lt;/text&gt;&lt;rect x=&quot;250&quot; y=&quot;20&quot; width=&quot;55.0&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;310.0&quot; y=&quot;33&quot; class=&quot;vl s&quot;&gt;1&lt;/text&gt;&lt;rect x=&quot;455.0&quot; y=&quot;20&quot; width=&quot;165.0&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;var(--pos)&quot;/&gt;&lt;rect x=&quot;620.0&quot; y=&quot;20&quot; width=&quot;0.0&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;var(--accent)&quot; opacity=&quot;.7&quot;/&gt;&lt;text x=&quot;625.0&quot; y=&quot;33&quot; class=&quot;vl s&quot;&gt;3／0&lt;/text&gt;&lt;text x=&quot;242&quot; y=&quot;78&quot; class=&quot;lb s&quot; text-anchor=&quot;end&quot;&gt;2 雲端資料中心規模&lt;title&gt;2 雲端資料中心規模&lt;/title&gt;&lt;/text&gt;&lt;rect x=&quot;250&quot; y=&quot;66&quot; width=&quot;55.0&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;310.0&quot; y=&quot;79&quot; class=&quot;vl s&quot;&gt;1&lt;/text&gt;&lt;rect x=&quot;455.0&quot; y=&quot;66&quot; width=&quot;55.0&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;var(--pos)&quot;/&gt;&lt;rect x=&quot;510.0&quot; y=&quot;66&quot; width=&quot;110.0&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;var(--accent)&quot; opacity=&quot;.7&quot;/&gt;&lt;text x=&quot;625.0&quot; y=&quot;79&quot; class=&quot;vl s&quot;&gt;1／2&lt;/text&gt;&lt;text x=&quot;242&quot; y=&quot;124&quot; class=&quot;lb s&quot; text-anchor=&quot;end&quot;&gt;3 OpenAI 智慧財產權與分潤&lt;title&gt;3 OpenAI 智慧財產權與分潤&lt;/title&gt;&lt;/text&gt;&lt;rect x=&quot;250&quot; y=&quot;112&quot; width=&quot;55.0&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;310.0&quot; y=&quot;125&quot; class=&quot;vl s&quot;&gt;1&lt;/text&gt;&lt;rect x=&quot;455.0&quot; y=&quot;112&quot; width=&quot;110.0&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;var(--pos)&quot;/&gt;&lt;rect x=&quot;565.0&quot; y=&quot;112&quot; width=&quot;55.0&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;var(--accent)&quot; opacity=&quot;.7&quot;/&gt;&lt;text x=&quot;625.0&quot; y=&quot;125&quot; class=&quot;vl s&quot;&gt;2／1&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;lg&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c3)&quot;&gt;&lt;/i&gt;好處&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--pos)&quot;&gt;&lt;/i&gt;屏障：事實&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--accent)&quot;&gt;&lt;/i&gt;屏障：推論&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;左邊是「它帶來什麼」的句數，右邊是「為什麼對手拿不走」的句數；屏障至少一句是事實（綠）才算有屏障證據。句數多不等於優勢強，只表示證據量。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估.json#/內容/優勢來源/優勢（好處、屏障的標記）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;div class=&quot;card advc&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;&lt;span class=&quot;num-b 有屏障證據&quot;&gt;1&lt;/span&gt;生產力套件綑綁的轉換成本&lt;/b&gt;&lt;span class=&quot;vd vd-有屏障證據&quot;&gt;有屏障證據&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;轉換成本（Switching Costs）｜晨星：轉換成本&lt;/div&gt;&lt;div class=&quot;two&quot;&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;好處（它帶來什麼）&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;席次只增 5%、商用雲端營收增 17%，既有客戶願意升級到更高價方案，每席營收約增 11%（推算）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src17&quot;&gt;[17]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;屏障（為什麼對手拿不走）&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;報導引述 CMA 的認定：郵件、文件、視訊與資安綁在同一份授權合約，換掉要付新軟體、移轉資料與重新訓練的成本，轉換成本是微軟根深地位的結構來源，即使對手產品更好也難以施壓。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src55&quot;&gt;[55]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src52&quot;&gt;[52]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;企業合約把地端授權與軟體保證綁成多年期，期間內持續取得新版與升級。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src11&quot;&gt;[11]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;競爭者 Zoom 把附 Teams 的 Microsoft 365 套件列為主要對手，顯示單點產品要對抗的是整套綑綁。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src47&quot;&gt;[47]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;two&quot;&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;超額報酬大小&lt;/div&gt;&lt;span class=&quot;lv&quot;&gt;大&lt;/span&gt;&lt;div class=&quot;s&quot;&gt;近四季營業利益率 47.1%，近 20 季在 40.6%–47.1% 之間，在六家同業中最高（同業百分位 1.0）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src54&quot;&gt;[54]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;持續期間&lt;/div&gt;&lt;span class=&quot;lv&quot;&gt;5–10年&lt;/span&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;轉換成本有監管機構認定與多年期合約支撐，屏障本身堅固；但英國 CMA 擬訂綑綁與 Copilot 接入規則、美國 FTC 調查綑綁，監管可能在幾年內削弱綑綁效果，所以不給 10 年以上。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src53&quot;&gt;[53]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src56&quot;&gt;[56]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card advc&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;&lt;span class=&quot;num-b 有屏障證據&quot;&gt;2&lt;/span&gt;雲端資料中心規模&lt;/b&gt;&lt;span class=&quot;vd vd-有屏障證據&quot;&gt;有屏障證據&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;規模經濟（Scale Economies）｜晨星：成本優勢&lt;/div&gt;&lt;div class=&quot;two&quot;&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;好處（它帶來什麼）&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;Azure 一季營收年增 48%，Microsoft Cloud 毛利率 66%；公司說 Azure 產品層級利潤率在改善。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src33&quot;&gt;[33]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src57&quot;&gt;[57]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;屏障（為什麼對手拿不走）&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;近四季資本支出約 1,359 億美元（推算，四季加總），另有 3,646 億美元已簽未起租的租賃（主要是資料中心），FY2027–FY2034 陸續起租。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src58&quot;&gt;[58]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src59&quot;&gt;[59]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;新進者要追上同等產能得付出同等規模的資本支出與多年期租約，這是屏障所在；對已有規模的 AWS、Google 則不構成屏障。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src58&quot;&gt;[58]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src59&quot;&gt;[59]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;關鍵資料中心零件供應商有限且短缺，公司寫對手也在擴產並用同一批供應商；這是所有業者共同的限制，不是微軟專屬的屏障，只對尚無採購量的新進者門檻較高。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src27&quot;&gt;[27]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;two&quot;&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;超額報酬大小&lt;/div&gt;&lt;span class=&quot;lv&quot;&gt;中&lt;/span&gt;&lt;div class=&quot;s&quot;&gt;Microsoft Cloud 毛利率降到 66%，原因是組合轉向 Azure 與 AI 基礎設施投資；AWS 與 Google 也在同一批供應商擴產，規模優勢由三家分享。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src57&quot;&gt;[57]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src27&quot;&gt;[27]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;持續期間&lt;/div&gt;&lt;span class=&quot;lv&quot;&gt;5–10年&lt;/span&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;屏障證據只有資本支出與已簽租賃的規模：租賃延伸到 FY2034，規模在合約上鎖定多年；但同級對手同步擴產、零件短缺是共同限制，優勢是寡占而非獨占，取 5–10 年。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src58&quot;&gt;[58]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src59&quot;&gt;[59]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src27&quot;&gt;[27]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card advc&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;&lt;span class=&quot;num-b 有屏障證據&quot;&gt;3&lt;/span&gt;OpenAI 智慧財產權與分潤&lt;/b&gt;&lt;span class=&quot;vd vd-有屏障證據&quot;&gt;有屏障證據&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;獨占資源（Cornered Resource）｜晨星：無形資產&lt;/div&gt;&lt;div class=&quot;two&quot;&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;好處（它帶來什麼）&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;一季來自 OpenAI 商業安排的營收 100 億美元，約占營收 10.8%（推算），並收取分潤。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src9&quot;&gt;[9]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;屏障（為什麼對手拿不走）&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;公司持有 OpenAI 模型與基礎設施的智慧財產權，可整合進自家產品；持股約 24%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src34&quot;&gt;[34]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src9&quot;&gt;[9]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;報導指微軟未續 Oracle 的算力合約、縮減新興雲供應商並增加投資自建資料中心。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src60&quot;&gt;[60]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-待查&quot;&gt;待查&lt;/span&gt;待查：OpenAI 相關權利的期限與排他條件未揭露。&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;two&quot;&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;超額報酬大小&lt;/div&gt;&lt;span class=&quot;lv&quot;&gt;不明&lt;/span&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-待查&quot;&gt;待查&lt;/span&gt;待查：OpenAI 相關營收的利潤率與占積壓比例未揭露。&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;持續期間&lt;/div&gt;&lt;span class=&quot;lv&quot;&gt;不明&lt;/span&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-待查&quot;&gt;待查&lt;/span&gt;待查：智慧財產權的期限與排他條款未揭露。&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;超額報酬的機械參考：利潤率位置&lt;/figcaption&gt;&lt;svg viewBox=&quot;0 0 680 92&quot; role=&quot;img&quot; aria-label=&quot;近四季營業利益率在近20季範圍的位置&quot;&gt;&lt;line x1=&quot;30.0&quot; x2=&quot;30.0&quot; y1=&quot;18&quot; y2=&quot;64&quot; class=&quot;zl&quot;/&gt;&lt;text x=&quot;30.0&quot; y=&quot;84&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;0%&lt;/text&gt;&lt;line x1=&quot;154.0&quot; x2=&quot;154.0&quot; y1=&quot;18&quot; y2=&quot;64&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;154.0&quot; y=&quot;84&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;10%&lt;/text&gt;&lt;line x1=&quot;278.0&quot; x2=&quot;278.0&quot; y1=&quot;18&quot; y2=&quot;64&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;278.0&quot; y=&quot;84&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;20%&lt;/text&gt;&lt;line x1=&quot;402.0&quot; x2=&quot;402.0&quot; y1=&quot;18&quot; y2=&quot;64&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;402.0&quot; y=&quot;84&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;30%&lt;/text&gt;&lt;line x1=&quot;526.0&quot; x2=&quot;526.0&quot; y1=&quot;18&quot; y2=&quot;64&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;526.0&quot; y=&quot;84&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;40%&lt;/text&gt;&lt;line x1=&quot;650.0&quot; x2=&quot;650.0&quot; y1=&quot;18&quot; y2=&quot;64&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;650.0&quot; y=&quot;84&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;50%&lt;/text&gt;&lt;rect x=&quot;533.2&quot; y=&quot;30&quot; width=&quot;80.8&quot; height=&quot;22&quot; rx=&quot;4&quot; fill=&quot;var(--biz)&quot; opacity=&quot;.22&quot;/&gt;&lt;text x=&quot;533.2&quot; y=&quot;24&quot; class=&quot;ax&quot;&gt;近 20 季範圍 40.6%～47.1%&lt;/text&gt;&lt;circle cx=&quot;614.0&quot; cy=&quot;41&quot; r=&quot;7&quot; fill=&quot;var(--biz)&quot;/&gt;&lt;text x=&quot;614.0&quot; y=&quot;76&quot; class=&quot;vl s&quot; text-anchor=&quot;middle&quot;&gt;近四季 47.1%&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;藍帶是近 20 季的近四季營業利益率範圍，圓點是最新值；同業營業利益率百分位 1.0（1＝同業最高）。只供對照「超額報酬大小」，不是分數、不進等級，也不是估值報告的護城河評分。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估底稿.json#/優勢參考&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;p class=&quot;lead&quot;&gt;機械參考（供對照超額報酬，不是分數）：近四季營業利益率 47.1%，近 20 季範圍 40.6%～47.1%，同業營業利益率百分位 1.0。&lt;/p&gt;&lt;div class=&quot;note&quot;&gt;判定規則：屏障欄至少一句標「事實」並附出處才算「有屏障證據」；否則只算「暫時領先」，持續期間最多寫「不足5年」。&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;s4&quot;&gt;&lt;h2&gt;5　生命週期與未來變化&lt;/h2&gt;&lt;div class=&quot;stages&quot;&gt;&lt;div class=&quot;&quot;&gt;起步&lt;/div&gt;&lt;div class=&quot;on&quot;&gt;成長&lt;/div&gt;&lt;div class=&quot;&quot;&gt;成熟&lt;/div&gt;&lt;div class=&quot;&quot;&gt;衰退&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;lead&quot;&gt;估值報告的林區分類（引用，不重判）：穩定成長&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;營收近四季年增從 2023-06 的谷底 6.9% 回升到 17.9%，上行已 13 季；FY2023→FY2026 營收由 2,119 億增到 3,318 億美元。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src61&quot;&gt;[61]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src62&quot;&gt;[62]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;營業利益率由 FY2023 的 41.8% 升到 FY2026 的 46.8%（推算），規模變大利潤率仍在擴大。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src63&quot;&gt;[63]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src62&quot;&gt;[62]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;成熟的一面：生產力與伺服器授權年減 3%、XBOX 年減 2%、Windows OEM 與裝置年減 22%，傳統業務已停滯或縮小。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src18&quot;&gt;[18]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src64&quot;&gt;[64]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src23&quot;&gt;[23]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;研究報告的林區分類取「穩定成長」並註明兼具快速成長特徵；本頁以營收軌跡判為「成長」（成熟平台上的第二波成長），兩者看的是同一件事的兩面：林區看規模，本頁看增速方向，大致一致。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src65&quot;&gt;[65]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src66&quot;&gt;[66]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src61&quot;&gt;[61]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;callout&quot;&gt;&lt;b&gt;最可能的轉變：成長 → 成熟&lt;/b&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;若 Azure 年增連兩季低於 30%、且單季營收年增跌破 12%，雲端已不足以抵銷傳統業務的萎縮，轉向成熟。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src21&quot;&gt;[21]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src67&quot;&gt;[67]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;若資本支出占營收維持在近四成而營業利益率近四季跌破 45%，代表新成長要靠更高投入換取，利潤率擴張階段結束。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src2&quot;&gt;[2]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src3&quot;&gt;[3]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lead&quot;&gt;怎麼檢驗&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;每季對照 10-Q 的 Azure 年增與底稿的營收單季年增、營業利益率近四季；FY2027 年報（約 2027 年 7 月底）做年度檢查。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src67&quot;&gt;[67]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src3&quot;&gt;[3]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;s5&quot;&gt;&lt;h2&gt;6　週期推論&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;三種證據都寫成「區間＋條件」，不給單一日期。&lt;/p&gt;&lt;div class=&quot;callout&quot;&gt;&lt;b&gt;綜合：未來 3–7 季（2027 年第二季至 2028 年第二季）營收近四季年增可能見頂，之後進入下行段；見頂前仍有 15% 以上的增速&lt;/b&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;上行段已 13 季、比過去唯一完整上行段長 4 季；單季年增 16.7%–18.8% 之間波動，加速幅度有限，積壓年增率連四季下降。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src68&quot;&gt;[68]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src35&quot;&gt;[35]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src22&quot;&gt;[22]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;若新產能如期上線、Azure 年增維持 40% 以上，見頂延後到 7 季以後；若單季營收年增跌破 15%、或積壓連兩季比上一季減少，下行段大致確認。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src26&quot;&gt;[26]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src21&quot;&gt;[21]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src32&quot;&gt;[32]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;利潤率可能比營收更早轉折：財務長口頭指引下一季營業利益率年比小降，折舊隨資本支出上升；營業利益率近四季的見頂可能早於營收。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src37&quot;&gt;[37]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src39&quot;&gt;[39]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;h3&gt;① 自身歷史循環&lt;/h3&gt;&lt;div class=&quot;chart&quot;&gt;&lt;svg viewBox=&quot;0 0 720 240&quot; role=&quot;img&quot; aria-label=&quot;近四季營收年增（2018-06-30～2026-09-30（34 季））&quot;&gt;&lt;line x1=&quot;46&quot; x2=&quot;704&quot; y1=&quot;210.0&quot; y2=&quot;210.0&quot; stroke=&quot;var(--line)&quot; stroke-width=&quot;1.4&quot;/&gt;&lt;text x=&quot;40&quot; y=&quot;214.0&quot; font-size=&quot;11&quot; text-anchor=&quot;end&quot; fill=&quot;var(--muted)&quot;&gt;0%&lt;/text&gt;&lt;line x1=&quot;46&quot; x2=&quot;704&quot; y1=&quot;28.0&quot; y2=&quot;28.0&quot; stroke=&quot;var(--line)&quot; stroke-width=&quot;1&quot;/&gt;&lt;text x=&quot;40&quot; y=&quot;32.0&quot; font-size=&quot;11&quot; text-anchor=&quot;end&quot; fill=&quot;var(--muted)&quot;&gt;21%&lt;/text&gt;&lt;text x=&quot;46.0&quot; y=&quot;232&quot; font-size=&quot;11&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--muted)&quot;&gt;2018-06&lt;/text&gt;&lt;text x=&quot;145.7&quot; y=&quot;232&quot; font-size=&quot;11&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--muted)&quot;&gt;2019-09&lt;/text&gt;&lt;text x=&quot;245.4&quot; y=&quot;232&quot; font-size=&quot;11&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--muted)&quot;&gt;2020-12&lt;/text&gt;&lt;text x=&quot;345.1&quot; y=&quot;232&quot; font-size=&quot;11&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--muted)&quot;&gt;2022-03&lt;/text&gt;&lt;text x=&quot;444.8&quot; y=&quot;232&quot; font-size=&quot;11&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--muted)&quot;&gt;2023-06&lt;/text&gt;&lt;text x=&quot;544.5&quot; y=&quot;232&quot; font-size=&quot;11&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--muted)&quot;&gt;2024-09&lt;/text&gt;&lt;text x=&quot;644.2&quot; y=&quot;232&quot; font-size=&quot;11&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--muted)&quot;&gt;2025-12&lt;/text&gt;&lt;path d=&quot;M46.0,84.0 L65.9,70.2 L85.9,70.3 L105.8,74.0 L125.8,86.2 L145.7,95.6 L165.6,92.4 L185.6,91.0 L205.5,89.6 L225.5,92.4 L245.4,84.9 L265.3,74.7 L285.3,55.3 L305.2,35.2 L325.2,28.0 L345.1,30.3 L365.0,51.6 L385.0,75.7 L404.9,118.4 L424.8,141.1 L444.8,149.3 L464.7,143.8 L484.7,108.5 L504.6,86.8 L524.5,71.8 L544.5,65.0 L564.4,77.3 L584.4,85.3 L604.3,78.3 L624.2,72.5 L644.2,62.9 L664.1,52.3 L684.1,53.1 L704.0,52.0&quot; fill=&quot;none&quot; stroke=&quot;var(--biz)&quot; stroke-width=&quot;2&quot;/&gt;&lt;circle cx=&quot;145.7&quot; cy=&quot;95.6&quot; r=&quot;4.5&quot; fill=&quot;var(--pos)&quot;/&gt;&lt;text x=&quot;145.7&quot; y=&quot;112.6&quot; font-size=&quot;11&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--pos)&quot;&gt;谷 2019-09&lt;/text&gt;&lt;circle cx=&quot;325.2&quot; cy=&quot;28.0&quot; r=&quot;4.5&quot; fill=&quot;var(--neg)&quot;/&gt;&lt;text x=&quot;325.2&quot; y=&quot;19.0&quot; font-size=&quot;11&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--neg)&quot;&gt;峰 2021-12&lt;/text&gt;&lt;circle cx=&quot;444.8&quot; cy=&quot;149.3&quot; r=&quot;4.5&quot; fill=&quot;var(--pos)&quot;/&gt;&lt;text x=&quot;444.8&quot; y=&quot;166.3&quot; font-size=&quot;11&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--pos)&quot;&gt;谷 2023-06&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;線是近四季營收年增（2018-06-30～2026-09-30（34 季）），紅點是峰、綠點是谷；兩個轉折之間就是一段上行或下行。&lt;br&gt;近四季營收年增（2018-06-30～2026-09-30（34 季））；之字形門檻 5%（自上一轉折反向變動超過門檻才算轉折）。來源：SEC companyfacts 季度資料（第四季為全年減前三季推算）。&lt;/div&gt;&lt;/div&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;營收年增：每段上行、下行走了幾季&lt;/figcaption&gt;&lt;svg viewBox=&quot;0 0 680 106&quot; role=&quot;img&quot; aria-label=&quot;營收年增：每段上行、下行走了幾季&quot;&gt;&lt;line x1=&quot;170.0&quot; x2=&quot;170.0&quot; y1=&quot;8&quot; y2=&quot;84&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;170.0&quot; y=&quot;100&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;0 季&lt;/text&gt;&lt;line x1=&quot;323.8&quot; x2=&quot;323.8&quot; y1=&quot;8&quot; y2=&quot;84&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;323.8&quot; y=&quot;100&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;5 季&lt;/text&gt;&lt;line x1=&quot;477.7&quot; x2=&quot;477.7&quot; y1=&quot;8&quot; y2=&quot;84&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;477.7&quot; y=&quot;100&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;10 季&lt;/text&gt;&lt;line x1=&quot;354.6&quot; x2=&quot;354.6&quot; y1=&quot;8&quot; y2=&quot;84&quot; stroke=&quot;var(--neg)&quot; stroke-dasharray=&quot;5 4&quot; stroke-width=&quot;1.6&quot;&gt;&lt;title&gt;下行段中位 6 季&lt;/title&gt;&lt;/line&gt;&lt;line x1=&quot;446.9&quot; x2=&quot;446.9&quot; y1=&quot;8&quot; y2=&quot;84&quot; stroke=&quot;var(--pos)&quot; stroke-dasharray=&quot;5 4&quot; stroke-width=&quot;1.6&quot;&gt;&lt;title&gt;上行段中位 9 季&lt;/title&gt;&lt;/line&gt;&lt;text x=&quot;162&quot; y=&quot;23&quot; class=&quot;lb s&quot; text-anchor=&quot;end&quot;&gt;2019-09→2021-12&lt;/text&gt;&lt;rect x=&quot;170&quot; y=&quot;12&quot; width=&quot;276.9&quot; height=&quot;15&quot; rx=&quot;2&quot; fill=&quot;var(--pos)&quot; opacity=&quot;.85&quot;/&gt;&lt;text x=&quot;451.9&quot; y=&quot;24&quot; class=&quot;vl s&quot;&gt;9 季 上行&lt;/text&gt;&lt;text x=&quot;162&quot; y=&quot;47&quot; class=&quot;lb s&quot; text-anchor=&quot;end&quot;&gt;2021-12→2023-06&lt;/text&gt;&lt;rect x=&quot;170&quot; y=&quot;36&quot; width=&quot;184.6&quot; height=&quot;15&quot; rx=&quot;2&quot; fill=&quot;var(--neg)&quot; opacity=&quot;.85&quot;/&gt;&lt;text x=&quot;359.6&quot; y=&quot;48&quot; class=&quot;vl s&quot;&gt;6 季 下行&lt;/text&gt;&lt;text x=&quot;162&quot; y=&quot;71&quot; class=&quot;lb s&quot; text-anchor=&quot;end&quot;&gt;目前（2023-06 起）&lt;/text&gt;&lt;rect x=&quot;170&quot; y=&quot;60&quot; width=&quot;400.0&quot; height=&quot;15&quot; rx=&quot;2&quot; fill=&quot;var(--pos)&quot; opacity=&quot;.85&quot; stroke=&quot;var(--ink)&quot; stroke-width=&quot;1.5&quot; stroke-dasharray=&quot;3 2&quot;/&gt;&lt;text x=&quot;575.0&quot; y=&quot;72&quot; class=&quot;vl s&quot;&gt;13 季 上行&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;lg&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--neg)&quot;&gt;&lt;/i&gt;下行段&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--pos)&quot;&gt;&lt;/i&gt;上行段&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--ink)&quot;&gt;&lt;/i&gt;目前這一段（虛框，尚未結束）&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;每條是兩個轉折之間的一段有多長；虛線是歷史中位（下行 6 季、上行 9 季）。拿目前這段的長度對照中位，看走到哪；淡色段的起點是資料起點，不計入統計。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估底稿.json#/週期/營收近四季年增（之字形門檻 5%）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;details&gt;&lt;summary&gt;營收年增各段數字表&lt;/summary&gt;&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;從&lt;/th&gt;&lt;th&gt;到&lt;/th&gt;&lt;th&gt;方向&lt;/th&gt;&lt;th&gt;季數&lt;/th&gt;&lt;th&gt;幅度&lt;/th&gt;&lt;th&gt;起點為資料起點（不計入統計）&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;2019-09-30&lt;/td&gt;&lt;td&gt;2021-12-31&lt;/td&gt;&lt;td&gt;上行&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;num&quot;&gt;9&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;num&quot;&gt;+7.7 個百分點&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2021-12-31&lt;/td&gt;&lt;td&gt;2023-06-30&lt;/td&gt;&lt;td&gt;下行&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;num&quot;&gt;6&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;num&quot;&gt;-13.8 個百分點&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/details&gt;&lt;p class=&quot;lead&quot;&gt;目前：上行，距最近確認轉折 13 季；最新 2026-09-30 為 17.9%。歷史下行段中位 6 季、上行段中位 9 季。&lt;/p&gt;&lt;div class=&quot;chart&quot;&gt;&lt;svg viewBox=&quot;0 0 720 240&quot; role=&quot;img&quot; aria-label=&quot;近四季營業利益率（2017-06-30～2026-09-30（38 季））&quot;&gt;&lt;line x1=&quot;46&quot; x2=&quot;704&quot; y1=&quot;210.0&quot; y2=&quot;210.0&quot; stroke=&quot;var(--line)&quot; stroke-width=&quot;1.4&quot;/&gt;&lt;text x=&quot;40&quot; y=&quot;214.0&quot; font-size=&quot;11&quot; text-anchor=&quot;end&quot; fill=&quot;var(--muted)&quot;&gt;0%&lt;/text&gt;&lt;line x1=&quot;46&quot; x2=&quot;704&quot; y1=&quot;28.0&quot; y2=&quot;28.0&quot; stroke=&quot;var(--line)&quot; stroke-width=&quot;1&quot;/&gt;&lt;text x=&quot;40&quot; y=&quot;32.0&quot; font-size=&quot;11&quot; text-anchor=&quot;end&quot; fill=&quot;var(--muted)&quot;&gt;47%&lt;/text&gt;&lt;text x=&quot;46.0&quot; y=&quot;232&quot; font-size=&quot;11&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--muted)&quot;&gt;2017-06&lt;/text&gt;&lt;text x=&quot;152.7&quot; y=&quot;232&quot; font-size=&quot;11&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--muted)&quot;&gt;2018-12&lt;/text&gt;&lt;text x=&quot;259.4&quot; y=&quot;232&quot; font-size=&quot;11&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--muted)&quot;&gt;2020-06&lt;/text&gt;&lt;text x=&quot;366.1&quot; y=&quot;232&quot; font-size=&quot;11&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--muted)&quot;&gt;2021-12&lt;/text&gt;&lt;text x=&quot;472.8&quot; y=&quot;232&quot; font-size=&quot;11&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--muted)&quot;&gt;2023-06&lt;/text&gt;&lt;text x=&quot;579.5&quot; y=&quot;232&quot; font-size=&quot;11&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--muted)&quot;&gt;2024-12&lt;/text&gt;&lt;text x=&quot;686.2&quot; y=&quot;232&quot; font-size=&quot;11&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--muted)&quot;&gt;2026-06&lt;/text&gt;&lt;path d=&quot;M46.0,93.8 L63.8,93.0 L81.6,93.7 L99.4,91.9 L117.1,87.2 L134.9,84.5 L152.7,83.2 L170.5,80.6 L188.3,78.1 L206.1,74.0 L223.8,68.0 L241.6,65.3 L259.4,66.9 L277.2,62.5 L295.0,58.4 L312.8,54.9 L330.5,49.3 L348.3,47.2 L366.1,45.7 L383.9,45.5 L401.7,47.5 L419.5,48.9 L437.2,53.2 L455.0,52.2 L472.8,48.6 L490.6,43.8 L508.4,39.3 L526.2,37.3 L543.9,37.5 L561.7,38.1 L579.5,36.3 L597.3,35.2 L615.1,33.7 L632.9,31.2 L650.6,29.7 L668.4,29.2 L686.2,29.2 L704.0,28.0&quot; fill=&quot;none&quot; stroke=&quot;var(--biz)&quot; stroke-width=&quot;2&quot;/&gt;&lt;circle cx=&quot;46.0&quot; cy=&quot;93.8&quot; r=&quot;4.5&quot; fill=&quot;var(--pos)&quot;/&gt;&lt;text x=&quot;46.0&quot; y=&quot;110.8&quot; font-size=&quot;11&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--pos)&quot;&gt;谷 2017-06&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;線是近四季營業利益率（2017-06-30～2026-09-30（38 季）），紅點是峰、綠點是谷；兩個轉折之間就是一段上行或下行。&lt;br&gt;近四季營業利益率（2017-06-30～2026-09-30（38 季））；之字形門檻 2%（自上一轉折反向變動超過門檻才算轉折）。來源：SEC companyfacts 季度資料（第四季為全年減前三季推算）。&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;lead&quot;&gt;近四季營業利益率轉折：谷 2017-06（30.1%）；目前 上行。&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;2018 年中以來營收近四季年增有兩個完整段：2019-09 到 2021-12 上行 9 季（12.97%→20.63%）、2021-12 到 2023-06 下行 6 季（到 6.88%）；目前自 2023-06 起上行已 13 季。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src69&quot;&gt;[69]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;近十年只有 FY2016 營收年減；營業利益率近四季自 2017-06 的 30.1% 一路上行未出現 2 個百分點以上的回落。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src70&quot;&gt;[70]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src71&quot;&gt;[71]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;上一次下行段是疫情後個人電腦需求回落與企業雲端節約同時發生，比較像需求週期而非一次性事件；本輪上行已比唯一一次完整上行段長 4 季，屬上行後段。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src72&quot;&gt;[72]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src61&quot;&gt;[61]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;h3&gt;② 訂單能見度&lt;/h3&gt;&lt;p class=&quot;s&quot;&gt;未履約義務總額 6,830 億美元，相當於最近一季營收的 7.4 倍（總額口徑）；其中約 30% 在 12 個月內認列（約 2,049 億，推算，約最近一季營收的 2.2 倍）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src32&quot;&gt;[32]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src73&quot;&gt;[73]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;口徑註：卡住訊號 S2 的年增約 71.6% 是全公司總額口徑（底稿計算），說的 vs 做的引用的 73% 是商業部分（6,770 億美元）口徑。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src42&quot;&gt;[42]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src32&quot;&gt;[32]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src22&quot;&gt;[22]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;能見度高但集中：OpenAI 是最大單一付款來源，占積壓比例未揭露；最新一季積壓與上一季持平，往後的年增率會隨 OpenAI 大單滿一年而明顯回落。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src9&quot;&gt;[9]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src31&quot;&gt;[31]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src22&quot;&gt;[22]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;h3&gt;③ 公司特有週期&lt;/h3&gt;&lt;p class=&quot;s&quot;&gt;資料中心擴建：財務長說 2026 曆年資本支出約 1,700 億美元、下一季逾 500 億；另有 3,646 億美元租賃將在 FY2027–FY2034 起租。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src26&quot;&gt;[26]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src59&quot;&gt;[59]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;折舊年限：資料中心與辦公大樓耐用年限自 FY2027 由 15 年延長到 25 年，管理層稱對 FY2027 營業利益只有小幅助益。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src74&quot;&gt;[74]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;產能取得是近期節奏的主因：第一季資本支出低於指引是第三方產能交付延遲，營收認列速度受供給而不只受需求決定。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src26&quot;&gt;[26]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src27&quot;&gt;[27]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/section&gt;&lt;section id=&quot;s6&quot;&gt;&lt;h2&gt;7　觀察清單：下季要看什麼&lt;/h2&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;觀察清單：目前值離改判門檻多遠&lt;/figcaption&gt;&lt;div class=&quot;wg&quot;&gt;&lt;div class=&quot;wgt&quot;&gt;&lt;b&gt;近四季資本支出占營收&lt;/b&gt;&lt;span&gt;維持條件：資本支出強度_近四季 &amp;lt;= 45.0%&lt;/span&gt;&lt;/div&gt;&lt;svg viewBox=&quot;0 0 680 60&quot; role=&quot;img&quot; aria-label=&quot;近四季資本支出占營收&quot;&gt;&lt;rect x=&quot;14.0&quot; y=&quot;14&quot; width=&quot;567.0&quot; height=&quot;20&quot; fill=&quot;var(--pos)&quot; opacity=&quot;.12&quot;/&gt;&lt;line x1=&quot;14.0&quot; x2=&quot;666.0&quot; y1=&quot;24&quot; y2=&quot;24&quot; stroke=&quot;var(--line)&quot; stroke-width=&quot;2&quot;/&gt;&lt;line x1=&quot;581.0&quot; x2=&quot;581.0&quot; y1=&quot;8&quot; y2=&quot;40&quot; stroke=&quot;var(--ink)&quot; stroke-dasharray=&quot;4 3&quot; stroke-width=&quot;1.6&quot;/&gt;&lt;text x=&quot;581.0&quot; y=&quot;54&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;門檻 45.0%&lt;/text&gt;&lt;circle cx=&quot;508.3&quot; cy=&quot;24&quot; r=&quot;7&quot; fill=&quot;var(--pos)&quot;/&gt;&lt;text x=&quot;508.3&quot; y=&quot;9&quot; class=&quot;vl s&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--pos)&quot;&gt;目前 39.2%&lt;/text&gt;&lt;/svg&gt;&lt;/div&gt;&lt;div class=&quot;wg&quot;&gt;&lt;div class=&quot;wgt&quot;&gt;&lt;b&gt;近四季營業利益率&lt;/b&gt;&lt;span&gt;維持條件：營業利益率_近四季 &amp;gt;= 45.0%&lt;/span&gt;&lt;/div&gt;&lt;svg viewBox=&quot;0 0 680 60&quot; role=&quot;img&quot; aria-label=&quot;近四季營業利益率&quot;&gt;&lt;rect x=&quot;555.7&quot; y=&quot;14&quot; width=&quot;110.3&quot; height=&quot;20&quot; fill=&quot;var(--pos)&quot; opacity=&quot;.12&quot;/&gt;&lt;line x1=&quot;14.0&quot; x2=&quot;666.0&quot; y1=&quot;24&quot; y2=&quot;24&quot; stroke=&quot;var(--line)&quot; stroke-width=&quot;2&quot;/&gt;&lt;line x1=&quot;555.7&quot; x2=&quot;555.7&quot; y1=&quot;8&quot; y2=&quot;40&quot; stroke=&quot;var(--ink)&quot; stroke-dasharray=&quot;4 3&quot; stroke-width=&quot;1.6&quot;/&gt;&lt;text x=&quot;555.7&quot; y=&quot;54&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;門檻 45.0%&lt;/text&gt;&lt;circle cx=&quot;581.0&quot; cy=&quot;24&quot; r=&quot;7&quot; fill=&quot;var(--pos)&quot;/&gt;&lt;text x=&quot;581.0&quot; y=&quot;9&quot; class=&quot;vl s&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--pos)&quot;&gt;目前 47.1%&lt;/text&gt;&lt;/svg&gt;&lt;/div&gt;&lt;div class=&quot;wg&quot;&gt;&lt;div class=&quot;wgt&quot;&gt;&lt;b&gt;未履約義務可見季數&lt;/b&gt;&lt;span&gt;維持條件：RPO可見季數 &amp;gt;= 6.0 季&lt;/span&gt;&lt;/div&gt;&lt;svg viewBox=&quot;0 0 680 60&quot; role=&quot;img&quot; aria-label=&quot;未履約義務可見季數&quot;&gt;&lt;rect x=&quot;473.7&quot; y=&quot;14&quot; width=&quot;192.3&quot; height=&quot;20&quot; fill=&quot;var(--pos)&quot; opacity=&quot;.12&quot;/&gt;&lt;line x1=&quot;14.0&quot; x2=&quot;666.0&quot; y1=&quot;24&quot; y2=&quot;24&quot; stroke=&quot;var(--line)&quot; stroke-width=&quot;2&quot;/&gt;&lt;line x1=&quot;473.7&quot; x2=&quot;473.7&quot; y1=&quot;8&quot; y2=&quot;40&quot; stroke=&quot;var(--ink)&quot; stroke-dasharray=&quot;4 3&quot; stroke-width=&quot;1.6&quot;/&gt;&lt;text x=&quot;473.7&quot; y=&quot;54&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;門檻 6.0 季&lt;/text&gt;&lt;circle cx=&quot;581.0&quot; cy=&quot;24&quot; r=&quot;7&quot; fill=&quot;var(--pos)&quot;/&gt;&lt;text x=&quot;581.0&quot; y=&quot;9&quot; class=&quot;vl s&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--pos)&quot;&gt;目前 7.4 季&lt;/text&gt;&lt;/svg&gt;&lt;/div&gt;&lt;div class=&quot;lg&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--pos)&quot;&gt;&lt;/i&gt;仍在維持條件內&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--neg)&quot;&gt;&lt;/i&gt;已越過門檻&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;只畫能自動對照的觀察項（有檢驗鍵與門檻）：淡綠帶是維持目前判斷的範圍，虛線是門檻，圓點是底稿最新值；越過門檻就照表中「改判方向」重看。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估.json#/內容/觀察清單（檢驗鍵、比較、門檻）＋商業評估底稿.json#/指標（目前值）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;div class=&quot;cards&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;近四季資本支出占營收&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;自動對照&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;目前值&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;2026-09-30 近四季 39.2%，一年內升 15.7 個百分點&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src2&quot;&gt;[2]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src39&quot;&gt;[39]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;看什麼&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;投入是否繼續換得到營收加速&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;改判方向&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;若資本支出占營收升破 45%，且營收近四季年增低於一年前，則G4 亮燈，卡點風險與週期位置下修&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;近四季營業利益率&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;自動對照&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;目前值&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;2026-09-30 近四季 47.1%（單季 49.8%）&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src3&quot;&gt;[3]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src75&quot;&gt;[75]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;看什麼&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;折舊上升與產品層級效率能否互相抵銷&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;改判方向&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;若近四季營業利益率跌破 45%，則模式穩固度與週期位置下修，生命週期往成熟靠近&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;未履約義務可見季數&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;自動對照&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;目前值&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;2026-09-30 未履約義務為最近一季營收的 7.4 倍&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src73&quot;&gt;[73]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;看什麼&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;積壓是否隨營收擴大而同步補上&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;改判方向&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;若可見季數跌破 6 季，則訂單能見度下降，週期見頂的時點往前移&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;Azure 年增率（新口徑）&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;人工對照&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;目前值&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;FY2027 第一季 Azure 年增 48%&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src21&quot;&gt;[21]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;看什麼&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;唯一主要成長引擎是否降速&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;改判方向&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;若Azure 年增連兩季低於 35%，則成長動能下修，週期綜合改判為已見頂&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;Microsoft 365 商用席次年增（新口徑）&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;人工對照&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;目前值&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;FY2027 第一季 5%，FY2026 重編後 7%&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src17&quot;&gt;[17]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src25&quot;&gt;[25]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;看什麼&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;新客戶是否還在進來&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;改判方向&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;若席次年增再降一季（低於 5%），則S5 亮燈，成長更依賴升級漲價，卡點風險下修&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;h3&gt;推論紀錄（下一季財報後自動對照）&lt;/h3&gt;&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;推論&lt;/th&gt;&lt;th&gt;方法&lt;/th&gt;&lt;th&gt;檢驗指標&lt;/th&gt;&lt;th&gt;條件&lt;/th&gt;&lt;th&gt;基準季&lt;/th&gt;&lt;th&gt;檢驗時點&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;P1&lt;/td&gt;&lt;td&gt;FY2027 第二季（至 2026-12-31）單季營收年增在 17% 以上（口頭指引 960–971 億，對去年同季 812.7 億推算為 18.1%–19.5%）&lt;/td&gt;&lt;td&gt;訂單能見度&lt;/td&gt;&lt;td&gt;營收單季年增&lt;/td&gt;&lt;td&gt;&amp;gt;= 0.17&lt;/td&gt;&lt;td&gt;2026-09-30&lt;/td&gt;&lt;td&gt;FY2027 第二季 10-Q（約 2027 年 1 月底）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;P2&lt;/td&gt;&lt;td&gt;折舊上升下，營業利益率近四季到 FY2027 結束（2027-06-30）仍守在 45% 以上&lt;/td&gt;&lt;td&gt;公司特有&lt;/td&gt;&lt;td&gt;營業利益率_近四季&lt;/td&gt;&lt;td&gt;&amp;gt;= 0.45&lt;/td&gt;&lt;td&gt;2026-09-30&lt;/td&gt;&lt;td&gt;FY2027 年報（約 2027 年 7 月底）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;P3&lt;/td&gt;&lt;td&gt;上行段延續到 FY2027 結束：2027-06-30 營收近四季年增仍在 17% 以上&lt;/td&gt;&lt;td&gt;自身歷史&lt;/td&gt;&lt;td&gt;營收近四季年增&lt;/td&gt;&lt;td&gt;&amp;gt;= 0.17&lt;/td&gt;&lt;td&gt;2026-09-30&lt;/td&gt;&lt;td&gt;FY2027 年報（約 2027 年 7 月底）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;P4&lt;/td&gt;&lt;td&gt;OpenAI 大單滿一年後，未履約義務增速仍高於營收增速（S2 不亮燈）&lt;/td&gt;&lt;td&gt;訂單能見度&lt;/td&gt;&lt;td&gt;RPO增速減營收增速&lt;/td&gt;&lt;td&gt;&amp;gt;= 0.0&lt;/td&gt;&lt;td&gt;2026-09-30&lt;/td&gt;&lt;td&gt;FY2027 第二季 10-Q（約 2027 年 1 月底）&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;lead&quot;&gt;每條推論從檢驗期末起，每個新季度記一筆命中或落空（預測帳本，公司資料夾 商業評估檢驗.json）；方法準確度跨公司統計見 優化/商業評估預測帳本.json。&lt;/p&gt;&lt;/section&gt;&lt;section id=&quot;sg&quot;&gt;&lt;h2&gt;商業評估等級明細&lt;span class=&quot;ruleok&quot;&gt;評分規則第一版，2026-11-07 使用者核定&lt;/span&gt;&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;五個面向各 1–5 分，相對同產業卡同業評比；機械建議分由工具依同業位置、卡住訊號與驗證比例算出，作者可調整但要寫理由。加權分 4.25 → A 級。等級門檻：A ≥ 4.2、B ≥ 3.5、C ≥ 2.8、D ≥ 2.1、其餘 E。&lt;/p&gt;&lt;div class=&quot;cards&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;模式穩固度&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;權重 &lt;span class=&quot;num&quot;&gt;25%&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;fs&quot;&gt;&lt;span&gt;作者分 &lt;span class=&quot;num v&quot;&gt;5&lt;/span&gt;&lt;/span&gt;&lt;span&gt;機械建議 &lt;span class=&quot;num&quot;&gt;5&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;近四季營業利益率同業百分位 1.0&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;理由&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;近四季營業利益率 47.1%，近 20 季在 40.6%–47.1% 之間，FY2023 起逐年上升；營收約八成四來自服務與其他（訂閱、雲端），多年期合約預收。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src54&quot;&gt;[54]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src16&quot;&gt;[16]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src12&quot;&gt;[12]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;扣分因素是 OpenAI 一季營收占約 10.8%，集中度上升，但還不足以動搖整體模式。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src9&quot;&gt;[9]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;同業對照&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;近四季營業利益率：微軟 47.1%，ADBE 35.7%、ORCL 34.2%、GOOGL 33.3%、SAP 27.1%、CRM 21.5%、NOW 9.7%，同業百分位 1.0。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src76&quot;&gt;[76]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src77&quot;&gt;[77]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;成長動能&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;權重 &lt;span class=&quot;num&quot;&gt;25%&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;fs&quot;&gt;&lt;span&gt;作者分 &lt;span class=&quot;num v&quot;&gt;4&lt;/span&gt;&lt;/span&gt;&lt;span&gt;機械建議 &lt;span class=&quot;num&quot;&gt;3&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;最近一季營收年增同業百分位 0.5（yfinance 口徑）&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;理由&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;最新一季營收年增 18.8%，近四季年增由一年前 15.6% 升到 17.9%；Azure 年增 48%，未履約義務可撐 7.4 季營收。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src67&quot;&gt;[67]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src40&quot;&gt;[40]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src21&quot;&gt;[21]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src73&quot;&gt;[73]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;機械建議 3 分只看同業百分位 0.5；本頁加 1 分，因為以近 3,460 億美元的營收規模仍在加速、且有積壓支撐，與營收規模小得多的同業並列中位數不能反映這點。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src78&quot;&gt;[78]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src79&quot;&gt;[79]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;同業對照&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;最近一季營收年增（yfinance 口徑）：ORCL 29.6%、GOOGL 24.7%、NOW 20.5% 高於微軟 18.8%；SAP 13.2%、ADBE 12.9%、CRM 10.8% 低於微軟。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src80&quot;&gt;[80]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;卡點風險&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;權重 &lt;span class=&quot;num&quot;&gt;20%&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;fs&quot;&gt;&lt;span&gt;作者分 &lt;span class=&quot;num v&quot;&gt;4&lt;/span&gt;&lt;/span&gt;&lt;span&gt;機械建議 &lt;span class=&quot;num&quot;&gt;5&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;計分採用的亮燈 0 條（無）；資料未取得 1 條&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;理由&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;七條機械訊號零亮燈，作者訊號 S5 未亮、S1 未揭露。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src41&quot;&gt;[41]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;機械建議 5 分，本頁扣 1 分：G4 只因「且」條件未亮（資本支出強度一年升 15.7 個百分點），積壓與營收都集中在 OpenAI，席次增速下滑，且英國 CMA 與美國 FTC 都在針對綑綁。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src39&quot;&gt;[39]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src9&quot;&gt;[9]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src53&quot;&gt;[53]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src56&quot;&gt;[56]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;同業對照&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-待查&quot;&gt;待查&lt;/span&gt;待查：同業的卡住訊號亮燈數尚未逐家對照（GOOGL、ADBE、CRM 已有商業評估，可對照其機械訊號）。&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;同業營業利益率最低的 NOW 只有 9.7%，微軟 47.1% 的利潤緩衝最厚，同樣的卡點衝擊下承受力較大。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src76&quot;&gt;[76]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;週期位置&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;權重 &lt;span class=&quot;num&quot;&gt;15%&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;fs&quot;&gt;&lt;span&gt;作者分 &lt;span class=&quot;num v&quot;&gt;4&lt;/span&gt;&lt;/span&gt;&lt;span&gt;機械建議 &lt;span class=&quot;num&quot;&gt;4&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;營收近四季年增目前上行，距最近轉折 13 季；歷史下行段中位 6 季&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;理由&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;營收近四季年增目前上行、距 2023-06 谷底 13 季，歷史下行段中位 6 季；營業利益率近四季仍在上行。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src81&quot;&gt;[81]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src82&quot;&gt;[82]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;上行段已比唯一一次完整上行段長，處於上行後段；但積壓可撐 7.4 季，近幾季下行的機率低，維持機械建議的 4 分。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src68&quot;&gt;[68]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src73&quot;&gt;[73]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;同業對照&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;同業最近一季營收年增 ORCL 29.6%、GOOGL 24.7% 都在加速擴雲端，與微軟處在同一個 AI 基礎設施上行段；各家自身週期段的對照尚未逐家整理，待查。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src80&quot;&gt;[80]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;說法可信度&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;權重 &lt;span class=&quot;num&quot;&gt;15%&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;fs&quot;&gt;&lt;span&gt;作者分 &lt;span class=&quot;num v&quot;&gt;4&lt;/span&gt;&lt;/span&gt;&lt;span&gt;機械建議 &lt;span class=&quot;num&quot;&gt;4&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;已判定 4 條，驗證比例 0.75&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;理由&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;四條說的 vs 做的有兩條已驗證（營收與 Azure 高於指引、Microsoft 365 升級）、兩條部分支持（供給不足只有口頭說法、積壓的 OpenAI 占比未揭露）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src20&quot;&gt;[20]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src17&quot;&gt;[17]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src26&quot;&gt;[26]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src22&quot;&gt;[22]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;扣分：第一季資本支出 452 億低於「逾 500 億」的書面指引，且 Azure、席次等指標自 FY2027 改口徑，跨年比較要靠重編數字。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src19&quot;&gt;[19]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src26&quot;&gt;[26]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src24&quot;&gt;[24]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;同業對照&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-待查&quot;&gt;待查&lt;/span&gt;待查：同業說的 vs 做的判定尚未逐條對照（GOOGL、ADBE、CRM 已有商業評估）。&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;同業口徑也在變：微軟本季重編 Azure 與席次指標，對照時要先確認同業指標是否同口徑；同業的口徑變動待查。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src24&quot;&gt;[24]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;相對同業：成長與利潤率&lt;/figcaption&gt;&lt;svg viewBox=&quot;0 0 680 300&quot; role=&quot;img&quot; aria-label=&quot;同業位置：營收年增與營業利益率&quot;&gt;&lt;line x1=&quot;56.0&quot; x2=&quot;56.0&quot; y1=&quot;16&quot; y2=&quot;260&quot; class=&quot;zl&quot;/&gt;&lt;text x=&quot;56.0&quot; y=&quot;276&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;0%&lt;/text&gt;&lt;line x1=&quot;204.5&quot; x2=&quot;204.5&quot; y1=&quot;
