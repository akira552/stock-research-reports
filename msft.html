t;td&gt;118&lt;/td&gt;&lt;td&gt;118&lt;/td&gt;&lt;td&gt;75%&lt;/td&gt;&lt;td&gt;-2.3%&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2018&lt;/td&gt;&lt;td&gt;827&lt;/td&gt;&lt;td&gt;19.4%&lt;/td&gt;&lt;td&gt;10.61&lt;/td&gt;&lt;td&gt;127&lt;/td&gt;&lt;td&gt;107&lt;/td&gt;&lt;td&gt;73%&lt;/td&gt;&lt;td&gt;-0.5%&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2019&lt;/td&gt;&lt;td&gt;1,023&lt;/td&gt;&lt;td&gt;42.4%&lt;/td&gt;&lt;td&gt;13.20&lt;/td&gt;&lt;td&gt;138&lt;/td&gt;&lt;td&gt;195&lt;/td&gt;&lt;td&gt;87%&lt;/td&gt;&lt;td&gt;-0.5%&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2020&lt;/td&gt;&lt;td&gt;1,183&lt;/td&gt;&lt;td&gt;40.1%&lt;/td&gt;&lt;td&gt;15.40&lt;/td&gt;&lt;td&gt;151&lt;/td&gt;&lt;td&gt;230&lt;/td&gt;&lt;td&gt;84%&lt;/td&gt;&lt;td&gt;-0.9%&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2021&lt;/td&gt;&lt;td&gt;1,420&lt;/td&gt;&lt;td&gt;47.1%&lt;/td&gt;&lt;td&gt;18.66&lt;/td&gt;&lt;td&gt;165&lt;/td&gt;&lt;td&gt;274&lt;/td&gt;&lt;td&gt;78%&lt;/td&gt;&lt;td&gt;-1.0%&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2022&lt;/td&gt;&lt;td&gt;1,665&lt;/td&gt;&lt;td&gt;47.2%&lt;/td&gt;&lt;td&gt;22.09&lt;/td&gt;&lt;td&gt;181&lt;/td&gt;&lt;td&gt;327&lt;/td&gt;&lt;td&gt;78%&lt;/td&gt;&lt;td&gt;-0.9%&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2023&lt;/td&gt;&lt;td&gt;2,062&lt;/td&gt;&lt;td&gt;38.8%&lt;/td&gt;&lt;td&gt;27.60&lt;/td&gt;&lt;td&gt;198&lt;/td&gt;&lt;td&gt;222&lt;/td&gt;&lt;td&gt;71%&lt;/td&gt;&lt;td&gt;-0.9%&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2024&lt;/td&gt;&lt;td&gt;2,685&lt;/td&gt;&lt;td&gt;37.1%&lt;/td&gt;&lt;td&gt;35.95&lt;/td&gt;&lt;td&gt;218&lt;/td&gt;&lt;td&gt;173&lt;/td&gt;&lt;td&gt;53%&lt;/td&gt;&lt;td&gt;-0.0%&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2025&lt;/td&gt;&lt;td&gt;3,435&lt;/td&gt;&lt;td&gt;33.3%&lt;/td&gt;&lt;td&gt;46.01&lt;/td&gt;&lt;td&gt;241&lt;/td&gt;&lt;td&gt;184&lt;/td&gt;&lt;td&gt;59%&lt;/td&gt;&lt;td&gt;-0.1%&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2026&lt;/td&gt;&lt;td&gt;4,424&lt;/td&gt;&lt;td&gt;34.0%&lt;/td&gt;&lt;td&gt;59.36&lt;/td&gt;&lt;td&gt;264&lt;/td&gt;&lt;td&gt;223&lt;/td&gt;&lt;td&gt;73%&lt;/td&gt;&lt;td&gt;-0.2%&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;長期財務.json（股東權益、稀釋股數〔分割調整〕、總資產；每股帳面＝股東權益 ÷ 稀釋股數，推導；股利支付、回購、營運現金流、資本支出在財務歷史.json 沒有該年時用）；產業指標.json 逐年（ROE）；財務歷史.json annual（股利、回購、營運現金流、資本支出）。用到：財務歷史、長期財務。ROE 註記門檻：ROE 高於 60% 或股東權益 ÷ 總資產低於 10%；近三年回購合計達當年股東權益 50% 以上才歸因於回購。（股利＋回購）÷ 年底市值：專案沒有逐年年底市值資料，不列該欄。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;capital-plain&quot;&gt;&lt;h3&gt;融資與償債：還不還得起&lt;/h3&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;b&gt;信用評級&lt;/b&gt;　機構 未揭露（10-K、10-Q、8-K、SEC 全文搜尋 查無 S&amp;amp;P、Moody&amp;#x27;s、Fitch、KBRA 評級）／推導 AAA（Damodaran 合成評等，利息保障 50.6 倍，推導）｜依推導：投資等級（BBB-／Baa3 以上）&lt;/p&gt;&lt;p&gt;&lt;b&gt;存活檢查（12～24 個月，推導，非違約預測）&lt;/b&gt;　無明顯警訊（推導，非違約預測）：現金與流動證券 645 億美元，一年內到期債務 44 億美元（另利息 32 億美元），可付 8.5 倍（含非流動投資為 13.4 倍）；現金與流動證券 645 億美元，兩年內到期債務 92 億美元（另利息 64 億美元），可付 4.1 倍（含非流動投資為 6.5 倍）；利息保障 50.6 倍；會計師未提出繼續經營疑慮。&lt;/p&gt;&lt;p&gt;&lt;b&gt;利率壓力測試&lt;/b&gt;　+200bp 後利息保障 52.3 倍（目前 50.6 倍，推導）&lt;/p&gt;&lt;p&gt;&lt;b&gt;借款用途&lt;/b&gt;　無法判定（公司只寫一般企業用途；近四季只有償債，期後 2026-11-04 發行 250 億美元新債，8-K 未載用途）&lt;/p&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;償債指標、融資活動表、存活檢查明細與利率壓力測試（算法與完整表見&lt;a href=&quot;#wp-6&quot;&gt;計算底稿 6&lt;/a&gt;）。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;survival-charts&quot;&gt;&lt;h3&gt;存活檢查與利率壓力測試（圖）&lt;/h3&gt;&lt;div class=&quot;grid2 wide&quot;&gt;&lt;figure class=figure&gt;&lt;p class=cap&gt;存活檢查（12～24 個月）：手上的錢對到期債務加利息（億美元；可付 8.5 倍／4.1 倍；燈號 無明顯警訊；資料截至 2026-09-30；信用與存活.json；推導，非違約預測）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 500 182&quot; role=&quot;img&quot; aria-label=&quot;存活檢查&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;223.0&quot; x2=&quot;223.0&quot; y1=&quot;6&quot; y2=&quot;176&quot; class=&quot;zero&quot;/&gt;&lt;text x=&quot;213&quot; y=&quot;23&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;現金與流動證券&lt;/text&gt;&lt;rect x=&quot;223.0&quot; y=&quot;9&quot; width=&quot;199.1&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c1)&quot;/&gt;&lt;text x=&quot;430.1&quot; y=&quot;23&quot; class=&quot;val&quot;&gt;645&lt;/text&gt;&lt;text x=&quot;213&quot; y=&quot;63&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;12 個月要付：本金＋利息&lt;/text&gt;&lt;rect x=&quot;223.0&quot; y=&quot;49&quot; width=&quot;23.5&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--neg)&quot;/&gt;&lt;text x=&quot;254.5&quot; y=&quot;63&quot; class=&quot;val&quot;&gt;76.1&lt;/text&gt;&lt;text x=&quot;213&quot; y=&quot;103&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;24 個月要付：本金＋兩年利息&lt;/text&gt;&lt;rect x=&quot;223.0&quot; y=&quot;89&quot; width=&quot;48.4&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--neg)&quot;/&gt;&lt;text x=&quot;279.4&quot; y=&quot;103&quot; class=&quot;val&quot;&gt;157&lt;/text&gt;&lt;text x=&quot;213&quot; y=&quot;143&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;近四季自由現金流&lt;/text&gt;&lt;rect x=&quot;223.0&quot; y=&quot;129&quot; width=&quot;185.0&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;416.0&quot; y=&quot;143&quot; class=&quot;val&quot;&gt;600&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;figure class=figure&gt;&lt;p class=cap&gt;利率壓力測試：各固定情境下的利息保障（倍；紅色虛線 1.5 倍＝提示門檻；不預測聯準會；推導）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 500 222&quot; role=&quot;img&quot; aria-label=&quot;利率壓力測試&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;183.0&quot; x2=&quot;183.0&quot; y1=&quot;6&quot; y2=&quot;216&quot; class=&quot;zero&quot;/&gt;&lt;line x1=&quot;189.0&quot; x2=&quot;189.0&quot; y1=&quot;4&quot; y2=&quot;218&quot; class=&quot;price&quot;/&gt;&lt;text x=&quot;173&quot; y=&quot;23&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;目前&lt;/text&gt;&lt;rect x=&quot;183.0&quot; y=&quot;9&quot; width=&quot;203.3&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c1)&quot;/&gt;&lt;text x=&quot;394.3&quot; y=&quot;23&quot; class=&quot;val&quot;&gt;50.6 倍&lt;/text&gt;&lt;text x=&quot;173&quot; y=&quot;63&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;目前利率（只算再融資）&lt;/text&gt;&lt;rect x=&quot;183.0&quot; y=&quot;49&quot; width=&quot;226.3&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c1)&quot;/&gt;&lt;text x=&quot;417.3&quot; y=&quot;63&quot; class=&quot;val&quot;&gt;56.4 倍&lt;/text&gt;&lt;text x=&quot;173&quot; y=&quot;103&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;利率 +1 個百分點&lt;/text&gt;&lt;rect x=&quot;183.0&quot; y=&quot;89&quot; width=&quot;217.8&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c1)&quot;/&gt;&lt;text x=&quot;408.8&quot; y=&quot;103&quot; class=&quot;val&quot;&gt;54.2 倍&lt;/text&gt;&lt;text x=&quot;173&quot; y=&quot;143&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;利率 +2 個百分點&lt;/text&gt;&lt;rect x=&quot;183.0&quot; y=&quot;129&quot; width=&quot;210.0&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c1)&quot;/&gt;&lt;text x=&quot;401.0&quot; y=&quot;143&quot; class=&quot;val&quot;&gt;52.3 倍&lt;/text&gt;&lt;text x=&quot;173&quot; y=&quot;183&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;利率 −1 個百分點&lt;/text&gt;&lt;rect x=&quot;183.0&quot; y=&quot;169&quot; width=&quot;235.5&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c1)&quot;/&gt;&lt;text x=&quot;426.5&quot; y=&quot;183&quot; class=&quot;val&quot;&gt;58.6 倍&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;燈號規則寫死在程式（信用與存活.py）：現金＋未動用信貸要能付 12 個月本金與利息，否則看自由現金流；利率上升 2 個百分點後利息保障低於 1.5 倍才加一條理由。只顯示、不改研究評等；明細表、規則與限制（算法與完整表見&lt;a href=&quot;#wp-6&quot;&gt;計算底稿 6&lt;/a&gt;）。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;財務管理&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;債務到期分散（2026-06-30 年報到期表）：未來 12 個月 92.5 億、第 2 年 0、第 3 年 20 億、第 4 年 0、第 5 年 5 億、5 年以後 343.9 億美元&lt;span class=&quot;src&quot;&gt;（10-K 2026-06-30 債務附註，治理與附註/債務到期.json）&lt;/span&gt;，不含期後 2026-11-04 新發的 250 億。&lt;/strong&gt;以 2026-09-30 口徑：現金與流動證券 645 億（扣非流動投資 378 億；含之即段一的現金與證券 102,317 百萬美元），可付一年內到期債務 44 億（資產負債表一年內到期長債）加近四季利息 32 億約 8.5 倍（信用與存活.json），財務風險低。計算底稿 6 利率壓力測試的「原票面 9.08%」是工具以近四季利息費用 3,223 百萬 ÷ 帳面借款 35,481 百萬推導：分子是其他收益附註的利息費用、未拆分債券與租賃，分母不含融資租賃負債&lt;span class=&quot;src&quot;&gt;（FY2026 租賃負債利息 2,547 百萬，10-K 2026-06-30 Item 8 ¶245）&lt;/span&gt;，不代表公司債票面；年報債務表各批票面 1.35%–5.30%&lt;span class=&quot;src&quot;&gt;（10-K 2026-06-30 Item 8 ¶198）&lt;/span&gt;，以 9.08% 算出「再融資利息減少」的方向不可採。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;資產變化&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;廠房設備一年增 50%，遠快於營收 18%，原因已解釋：資料中心投資&lt;span class=&quot;src&quot;&gt;（10-Q 2026-09-30 Part I, Item 2 ¶65）&lt;/span&gt;。&lt;/strong&gt;存貨增 62% 但基期小，金額約 18 億美元，原因未揭露，影響有限；耐用年限延長到 25 年會讓折舊低於舊口徑（新聞 N5）。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;公司內部治理&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;委託書（2026-10-21）列 12 位董事提名人、11 位獨立，設首席獨立董事（委託書治理.json），數字截至委託書日期；Walmsley 2026-11-05 告知不連任後&lt;span class=&quot;src&quot;&gt;（8-K 2026-11-05 本文 §3）&lt;/span&gt;，提名人應剩 11 位、獨立 10 位&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;。&lt;/strong&gt;2026-05-15 起內部人公開市場賣出 26 筆、無人買進，賣出股數約 77% 屬 10b5-1（事先申報的預設交易計畫）預設計畫（內部人交易.json），屬常規減持，訊號弱。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;董事會異動：Reid Hoffman 與 Emma Walmsley 表示不在 2026 年股東會尋求連任&lt;span class=&quot;src&quot;&gt;（8-K 2026-06-05 本文 §3；8-K 2026-11-05 本文 §3）&lt;/span&gt;。&lt;/strong&gt;前安永全球董事長 Carmine Di Sibio 於 2026-05-13 起任董事，加入審計與薪酬委員會&lt;span class=&quot;src&quot;&gt;（8-K 2026-05-14 本文 §3、§9）&lt;/span&gt;。屬例行更替，未見與經營爭議相關的說明。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;業務治理&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;與 OpenAI 是最大關係人：一季營收約 100 億美元、持股約 24%，關係變化同時影響營收與投資價值&lt;span class=&quot;src&quot;&gt;（10-Q 2026-09-30 Part I, Item 1 ¶34，MSFT-C08）&lt;/span&gt;。&lt;/strong&gt;IRS 2004–2013 年移轉訂價爭議擬議補稅 289 億美元，公司上訴中&lt;span class=&quot;src&quot;&gt;（同 ¶143，MSFT-C10）&lt;/span&gt;。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;資產變化訊號（對去年同期季末）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;signals&quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;變化&lt;/th&gt;&lt;th&gt;同期營收&lt;/th&gt;&lt;th&gt;判讀&lt;/th&gt;&lt;th&gt;說明&lt;/th&gt;&lt;th&gt;出處&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;不動產廠房設備&lt;/td&gt;&lt;td&gt;+50.2%&lt;/td&gt;&lt;td&gt;+17.9%&lt;/td&gt;&lt;td class=&quot;st-已解釋&quot;&gt;已解釋&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;資料中心與 AI 伺服器投資，公司指引單季資本支出逾 500 億&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;8-K 2026-09-02 本文 §24；10-Q 2026-09-30 Part I, Item 2 ¶65&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;存貨&lt;/td&gt;&lt;td&gt;+62.4%&lt;/td&gt;&lt;td&gt;+17.9%&lt;/td&gt;&lt;td class=&quot;st-部分解釋&quot;&gt;部分解釋&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;金額 18 億、占營收不到 1%，裝置與零件為主；原因未單獨揭露&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;財務指標.json#/資產變化訊號&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;應付帳款&lt;/td&gt;&lt;td&gt;+30.8%&lt;/td&gt;&lt;td&gt;+17.9%&lt;/td&gt;&lt;td class=&quot;st-部分解釋&quot;&gt;部分解釋&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;與資本支出擴大同步，推導；公司未單獨說明&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;財務指標.json#/資產變化訊號&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;應收帳款&lt;/td&gt;&lt;td&gt;+17.4%&lt;/td&gt;&lt;td&gt;+17.9%&lt;/td&gt;&lt;td class=&quot;st-已解釋&quot;&gt;已解釋&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;與營收同步，應收天數約 65 天&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;成長推估底稿.json&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;白話說&lt;/b&gt;每 100 元有息負債，對應約 288 元現金與證券。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;要留意&lt;/b&gt;帳面債務低，但資料中心租賃承諾大，見改判訊號。&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;events&quot;&gt;&lt;div class=&quot;qno&quot;&gt;問題 07&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;接下來要追蹤哪些事件？&lt;/div&gt;&lt;h2&gt;看 Azure 成長、OpenAI 關係、利潤率與監管四件事。&lt;/h2&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;未來一年最重要的是 AI 需求能否持續轉成營收：Azure 年增若維持 40% 以上且產能限制解除，偏向樂觀情境；OpenAI 營收年減或利潤率連兩季低於 42%，偏向保守（目標區間輸入.json）。&lt;/p&gt;&lt;p&gt;監管是時程較長的變數：英國 CMA 與美國 FTC 的結論可能落在 12 個月之外；IRS 稅務爭議的判決若超過已列準備，會直接扣減價值&lt;span class=&quot;src&quot;&gt;（10-Q 2026-09-30 Part II, Item 1A ¶82；Part I, Item 1 ¶143）&lt;/span&gt;。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;事件表（本輪列出的主要追蹤事件，非完整清單）&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;條件式目標區間的情境觸發來自這些事件；區間由產生器印在第五題與首頁，條件式、非買賣建議。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;figure&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt signals&quot;&gt;&lt;tr&gt;&lt;th&gt;事件&lt;/th&gt;&lt;th&gt;可能時間&lt;/th&gt;&lt;th&gt;偏向情境&lt;/th&gt;&lt;th&gt;出處&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Azure 年增維持 40% 以上、產能限制解除&lt;/td&gt;&lt;td&gt;每季財報&lt;/td&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;8-K 2026-10-28#2 新聞稿 §5&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;OpenAI 相關營收年減或應收異常&lt;/td&gt;&lt;td&gt;每季 10-Q&lt;/td&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;10-Q 2026-09-30 Part I, Item 1 ¶34&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;營業利益率連兩季低於 42%&lt;/td&gt;&lt;td&gt;每季財報&lt;/td&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;8-K 2026-09-02 本文 §24&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;英國 CMA、美國 FTC 結論&lt;/td&gt;&lt;td&gt;可能超過 12 個月&lt;/td&gt;&lt;td&gt;延後（全部）&lt;/td&gt;&lt;td&gt;10-Q 2026-09-30 Part II, Item 1A ¶82&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;IRS 移轉訂價爭議判決或和解&lt;/td&gt;&lt;td&gt;時點未知&lt;/td&gt;&lt;td&gt;失效（全部）&lt;/td&gt;&lt;td&gt;10-Q 2026-09-30 Part I, Item 1 ¶143&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;白話說&lt;/b&gt;Azure 成長每季公布一次，是最快能驗證假設的數字。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;要留意&lt;/b&gt;事件表不是完整清單，監管結論可能超過一年，見改判訊號。&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;news&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;近期新聞查證&lt;/p&gt;&lt;h3&gt;新聞支持需求強勁，也提醒監管與資本支出壓力。&lt;/h3&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;我們從新聞候選中挑 5 則，引句都對過原文；付費牆與無法核對的報導不引用。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;新聞摘要（依日期排序）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;日期&lt;/th&gt;&lt;th&gt;來源&lt;/th&gt;&lt;th&gt;內容&lt;/th&gt;&lt;th&gt;我們的判讀&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2026-06-01&lt;/td&gt;&lt;td&gt;CIO&lt;/td&gt;&lt;td&gt;FTC 擴大調查雲端、AI 與軟體綑綁&lt;/td&gt;&lt;td&gt;與 CMA 方向一致，仍在調查、未起訴&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2026-07-29&lt;/td&gt;&lt;td&gt;ScanX&lt;/td&gt;&lt;td&gt;資料中心耐用年限延長到 25 年&lt;/td&gt;&lt;td&gt;折舊延後，總投入不變&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2026-10-19&lt;/td&gt;&lt;td&gt;Tech Times&lt;/td&gt;&lt;td&gt;英國 CMA 擬指定微軟戰略市場地位&lt;/td&gt;&lt;td&gt;同時證實轉換成本與監管對準它&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2026-10-28&lt;/td&gt;&lt;td&gt;Fortune&lt;/td&gt;&lt;td&gt;雲端成長加速、支出同步增加&lt;/td&gt;&lt;td&gt;需求超過供給，支持未來一年成長&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2026-11-09&lt;/td&gt;&lt;td&gt;Dataconomy&lt;/td&gt;&lt;td&gt;縮減第三方算力夥伴、改自建&lt;/td&gt;&lt;td&gt;未證實；若屬實，總投入不一定下降&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;numbers&quot;&gt;&lt;div class=&quot;qno&qu &lt;section class=&quot;q&quot; id=&quot;workpaper&quot; data-layer=&quot;計算底稿&quot;&gt;&lt;div class=&quot;qno&quot;&gt;計算底稿&lt;/div&gt;&lt;h2&gt;計算底稿：正文結果的算法與完整表（預設摺疊）&lt;/h2&gt;&lt;p class=&quot;wpnote&quot;&gt;正文每個估值、償債結果都從這裡算出；背景計算照做、送審照核。不讀也不影響理解結論；非買賣建議。&lt;/p&gt;&lt;details id=&quot;wp-3-4&quot;&gt;&lt;summary&gt;3・4 現金與股東：報表對帳與股東回報判讀&lt;/summary&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;股東回報判讀表&lt;/h3&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;股東回報（判讀依估值政策門檻，2026-10-14 核定；不影響估值與價格位置）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;數值&lt;/th&gt;&lt;th&gt;判讀&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股利殖利率&lt;/td&gt;&lt;td&gt;0.69%&lt;/td&gt;&lt;td&gt;不評好壞：依估值政策，股利殖利率高低不設門檻（高殖利率常因股價下跌）；占股東收益率 56%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;回購殖利率&lt;/td&gt;&lt;td&gt;0.54%&lt;/td&gt;&lt;td&gt;不評好壞：近四季回購約 210.0 億美元，是市值 39,008.1 億美元的 0.54%；划不划算看「股東收益率」「淨回購」「回購均價」&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股東收益率（股利＋回購）&lt;/td&gt;&lt;td&gt;1.23%（公債的 24%）&lt;/td&gt;&lt;td&gt;不評好壞：主要靠成長，1.23% 只有 10 年期公債 5.10% 的 24%；回饋低是成長型公司的常態，改看成長&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;淨回購殖利率&lt;/td&gt;&lt;td&gt;0.22%&lt;/td&gt;&lt;td&gt;好：回購 0.54% 裡約 0.3 個百分點用來抵銷發給員工的股票，扣掉後仍淨回購 0.22%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股數年變化（1／3／10 財年）&lt;/td&gt;&lt;td&gt;-0.2%／-0.1%／-0.7%&lt;/td&gt;&lt;td&gt;好：2026 財年對上一財年 -0.2%（減少）；近 3 財年平均每年 -0.1%（減少）；近 10 財年平均每年 -0.7%（減少）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;近十年有回購的年數&lt;/td&gt;&lt;td&gt;10／10&lt;/td&gt;&lt;td&gt;好：近十年有 10 年回購，達政策「穩定」（至少 8 年）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股利連續成長年數&lt;/td&gt;&lt;td&gt;11&lt;/td&gt;&lt;td&gt;好：連續 11 年調高股利，符合政策「近十年年年調高」&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股東回饋占自由現金流&lt;/td&gt;&lt;td&gt;80.11%&lt;/td&gt;&lt;td&gt;注意：股利＋回購用掉近四季自由現金流的 80%，接近政策 100% 警示線&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;近四季回購均價（公開市場）&lt;/td&gt;&lt;td&gt;398.88&lt;/td&gt;&lt;td&gt;中性：均價 398.88 在合理價值區間 284.40–456.09 內&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;details id=&quot;wp-mkt&quot;&gt;&lt;summary&gt;市場背景：大盤一句、流動性、空單與參考值的資料日期與存檔&lt;/summary&gt;&lt;p class=&quot;cap&quot;&gt;大盤狀態（市場總覽；只揭露，不進研究評等、價格位置與合理價值）：S&amp;amp;P 500（以 SPY 代表）前十大持股合計 37.3%，最大產業科技 38.2%；那斯達克 100（QQQ）科技占 58.0%；等權重 RSP 減市值加權 SPY 近3個月報酬差 1.7 個百分點，位在 2003 年以來第 79 分位（持平）。高收益債利差 3.30，位在 2023 年以來第 81 分位（偏高）；金融狀況指數 -0.46，位在 1971 年以來第 44 分位（中性）；VIX 18.70，位在 1990 年以來第 56 分位（中性）；融資推估（聯準會，推估）0.74 兆美元（2026-06-30），年增 46.6%（第 92 分位，偏高），占國內公司股權市值 0.68%（第 8 分位，偏低）。（市場總覽收盤日 2026-11-12，市場/市場總覽.json）。&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;流動性、空單與參考值（只列事實與資料日期，不判冷熱、不是買賣訊號；非買賣建議）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;類別&lt;/th&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;數值&lt;/th&gt;&lt;th&gt;資料日期&lt;/th&gt;&lt;th&gt;說明與存檔&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;流動性&lt;/td&gt;&lt;td&gt;20 日均成交量&lt;/td&gt;&lt;td&gt;26,238,120 股&lt;/td&gt;&lt;td&gt;2026-11-13 收盤&lt;/td&gt;&lt;td&gt;90 日均量 26,985,986 股（20 日 ÷ 90 日 0.97 倍）｜市場資料/市場溫度.json#/量能&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;流動性&lt;/td&gt;&lt;td&gt;20 日均成交金額&lt;/td&gt;&lt;td&gt;139.2 億美元&lt;/td&gt;&lt;td&gt;2026-11-13 收盤&lt;/td&gt;&lt;td&gt;市場資料/市場溫度.json#/流動性/20日均成交金額&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;流動性&lt;/td&gt;&lt;td&gt;20 日均周轉率（每日）&lt;/td&gt;&lt;td&gt;0.35%&lt;/td&gt;&lt;td&gt;2026-11-13 收盤&lt;/td&gt;&lt;td&gt;20 日均量 ÷ SEC 封面流通股數（當時可得，依分割換算）；自身近 5 年第 55% 百分位｜市場資料/市場溫度.json#/流動性/20日均換手率&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;空單&lt;/td&gt;&lt;td&gt;放空比率（空單占流通股）&lt;/td&gt;&lt;td&gt;0.82%&lt;/td&gt;&lt;td&gt;2026-10-30 結算&lt;/td&gt;&lt;td&gt;空單 60,941,334 股；前一期（2026-10-15）65,674,557 股，減少 7.2%；FINRA 每月兩次公布的合併空單，取得 2026-11-14｜市場資料/市場溫度.json#/流動性/空單&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;空單&lt;/td&gt;&lt;td&gt;回補天數&lt;/td&gt;&lt;td&gt;2.73 天&lt;/td&gt;&lt;td&gt;2026-10-30 結算&lt;/td&gt;&lt;td&gt;空單 ÷ 日均量（FINRA 自身日均量）；自算 ÷ 90 日均量 2.26 天｜市場資料/市場溫度.json#/流動性/空單&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;參考值&lt;/td&gt;&lt;td&gt;52 週區間位置&lt;/td&gt;&lt;td&gt;84%&lt;/td&gt;&lt;td&gt;2026-11-13 收盤&lt;/td&gt;&lt;td&gt;0%＝52 週低 352.17、100%＝52 週高 555.80（收盤，推算）｜市場資料/市場溫度.json#/趨勢&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;參考值&lt;/td&gt;&lt;td&gt;近 12 個月股價報酬&lt;/td&gt;&lt;td&gt;+3.3%&lt;/td&gt;&lt;td&gt;2026-11-13 收盤&lt;/td&gt;&lt;td&gt;同期 S&amp;amp;P 500 +11.6%｜市場資料/市場溫度.json#/動能&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;參考值&lt;/td&gt;&lt;td&gt;60 日歷史年化波動&lt;/td&gt;&lt;td&gt;27.6%&lt;/td&gt;&lt;td&gt;2026-11-13 收盤&lt;/td&gt;&lt;td&gt;日報酬標準差年化（收盤）｜市場資料/市場溫度.json#/波動&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;參考值&lt;/td&gt;&lt;td&gt;距 200 日均線&lt;/td&gt;&lt;td&gt;+18.9%&lt;/td&gt;&lt;td&gt;2026-11-13 收盤&lt;/td&gt;&lt;td&gt;200 日均線 440.49｜市場資料/市場溫度.json#/趨勢&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;wide&quot;&gt;&lt;/div&gt;&lt;/details&gt;&lt;details id=&quot;wp-5&quot;&gt;&lt;summary&gt;5 估值：情境算式、市價隱含第 10 年倍數、同業與歷史倍數交叉核對、條件式區間算法、市價反推、溢價來源與作者計算說明&lt;/summary&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;作者計算說明&lt;/h3&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;情境假設：保守營收年增 12%→5%、營業利益率 46%→36%；基準 16%→10%、47%→45%；樂觀 20%→13%、47.5%→52%。&lt;/strong&gt;三情境衰退期 10 年（寬護城河，B1 預設），永續期投入資本報酬率（ROIC）保守 25%、基準 30%、樂觀 36%（估值輸入.json#/超額報酬期間）。權重 25／50／25，情境差距約 109%，不確定性高。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;折現率：無風險利率 5.10%（FRED DGS10 2026-11-12，11-13 無資料）、beta 1.25（2 年週 beta，Blume 調整），加權平均資本成本（WACC）10.19%。&lt;/strong&gt;銷售對資本比：保守前三年 0.52、第四年 0.65、第五年 0.80；基準與樂觀前三年 0.52、第四年 0.69、第五年 0.85（evidence_notes.再投資）。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;計算核對（計算核對/計算核對.md）第 2 項過門檻：原設定第五年銷售對資本比回到 1.2，隱含增量報酬約 43%，高於永續期 ROIC 30%，且 10-Q ¶159 未起租租賃延續到 FY2034。&lt;/strong&gt;作者採用建議值 0.69、0.85，中點由 363.2 降到 352.2（−3.0%）。若全程沿用工具口徑 0.52，中點約 −7.3%&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;。第 1 項融資租賃計入債務 +0.8%，未過門檻，維持。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;股權橋未扣長期應付所得稅：10-Q 2026-09-30 Part I, Item 1 ¶142–¶143，未認列稅務利益與其他所得稅負債 306 億美元，IRS 移轉訂價擬議補稅 289 億另加罰款利息，公司上訴中。&lt;/strong&gt;若全額扣除每股約 −4.1&lt;span class=&quot;src&quot;&gt;（30,600 ÷ 7,446 百萬股，推導）&lt;/span&gt;，中點約 −1.2%，作者判斷不扣（MSFT-C10）。&lt;/p&gt;&lt;p&gt;成長跑道六項：市場空間未揭露，只有未履約義務 6,830 億旁證（部分）；定價能力有證據（席次 +5%、營收 +17%）；營運槓桿有證據（增量營業利益率 0.56）；指引達成 1/1（樣本少）；資金來源為自由現金流與融資租賃；新事業 Copilot 營收未揭露（evidence_notes.成長跑道）。&lt;/p&gt;&lt;p&gt;本益比口徑：扣非經常每股盈餘（EPS）17.93 美元排除 OpenAI 權益法損益，本益比 29.2 倍（扣非經常 EPS 17.93 美元；收盤 2026-11-13）；申報近四季 EPS 19.15 美元，本益比約 27.4 倍（價值判斷.json；MSFT-C07）。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;最新指引（2026-10-28 法說會，財務長口頭，新聞 N1 §2–§3、N8 §3）：FY2027 第二季營收 960–971 億美元，隱含年增約 18.1%–19.5%&lt;span class=&quot;src&quot;&gt;（÷去年同季 81,273 百萬，8-K 2026-01-28 新聞稿 §15，推導）&lt;/span&gt;，營業利益率年減小幅；本季資本支出逾 500 億、2026 曆年約 1,700 億。&lt;/strong&gt;第一季實際資本支出 452 億，低於書面指引逾 500 億。基準首年 16% 低於第二季指引隱含成長，理由見 evidence_notes.成長；未改估值。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;!--新圖表--&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;缺口判斷影響幅度&lt;/h3&gt;&lt;div class=&quot;wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;市價隱含第 10 年倍數（倍）：基準折現率下市價隱含 22.4 倍、模型 10.3 倍（約 2.2 倍差距）；參考帶 p25–p75 12.4–35.4 倍（機械回測樣本，非市場全體；分產業的筆數與公司數少，僅供參考）。只描述，不進評等、不是目標價（估值結果.json#/market_implied_terminal）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 620 242&quot; role=&quot;img&quot; aria-label=&quot;市價隱含第 10 年倍數&quot; class=&quot;chart&quot; style=&quot;max-width:775px&quot;&gt;&lt;line x1=&quot;334.0&quot; x2=&quot;334.0&quot; y1=&quot;22&quot; y2=&quot;216&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;334.0&quot; y=&quot;234&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;0&lt;/text&gt;&lt;line x1=&quot;398.0&quot; x2=&quot;398.0&quot; y1=&quot;22&quot; y2=&quot;216&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;398.0&quot; y=&quot;234&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;10&lt;/text&gt;&lt;line x1=&quot;462.0&quot; x2=&quot;462.0&quot; y1=&quot;22&quot; y2=&quot;216&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;462.0&quot; y=&quot;234&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;20&lt;/text&gt;&lt;line x1=&quot;526.0&quot; x2=&quot;526.0&quot; y1=&quot;22&quot; y2=&quot;216&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;526.0&quot; y=&quot;234&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;30&lt;/text&gt;&lt;line x1=&quot;590.0&quot; x2=&quot;590.0&quot; y1=&quot;22&quot; y2=&quot;216&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;590.0&quot; y=&quot;234&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;40&lt;/text&gt;&lt;text x=&quot;334&quot; y=&quot;16&quot; class=&quot;ax&quot;&gt;EV/EBIT（倍）&lt;/text&gt;&lt;text x=&quot;324&quot; y=&quot;66.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;市價隱含（第 10 年 EV/EBIT）&lt;/text&gt;&lt;rect x=&quot;447.2&quot; y=&quot;50.0&quot; width=&quot;65.9&quot; height=&quot;22&quot; rx=&quot;4&quot; fill=&quot;var(--neg)&quot; opacity=&quot;.28&quot;&gt;&lt;title&gt;高–低折現率：18–28&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;447.2&quot; y=&quot;87.0&quot; class=&quot;ax&quot; text-anchor=&quot;start&quot;&gt;高–低折現率 18–28&lt;/text&gt;&lt;circle cx=&quot;477.6&quot; cy=&quot;61.0&quot; r=&quot;7&quot; fill=&quot;var(--neg)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;1.5&quot;&gt;&lt;title&gt;基準：22&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;477.6&quot; y=&quot;47.0&quot; class=&quot;val&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--neg)&quot;&gt;基準 22&lt;/text&gt;&lt;text x=&quot;324&quot; y=&quot;128.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;模型假設（終值 ÷ 第 10 年 EBIT）&lt;/text&gt;&lt;rect x=&quot;389.9&quot; y=&quot;112.0&quot; width=&quot;25.0&quot; height=&quot;22&quot; rx=&quot;4&quot; fill=&quot;var(--c1)&quot; opacity=&quot;.28&quot;&gt;&lt;title&gt;高–低折現率：9–13&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;389.9&quot; y=&quot;149.0&quot; class=&quot;ax&quot; text-anchor=&quot;start&quot;&gt;高–低折現率 9–13&lt;/text&gt;&lt;circle cx=&quot;400.0&quot; cy=&quot;123.0&quot; r=&quot;7&quot; fill=&quot;var(--c1)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;1.5&quot;&gt;&lt;title&gt;基準：10&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;400.0&quot; y=&quot;109.0&quot; class=&quot;val&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--c1)&quot;&gt;基準 10&lt;/text&gt;&lt;text x=&quot;324&quot; y=&quot;190.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;參考帶（Software (System &amp;amp; Application)）&lt;/text&gt;&lt;rect x=&quot;413.4&quot; y=&quot;174.0&quot; width=&quot;147.2&quot; height=&quot;22&quot; rx=&quot;4&quot; fill=&quot;var(--c7)&quot; opacity=&quot;.28&quot;&gt;&lt;title&gt;p25–p75：12–35&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;413.4&quot; y=&quot;211.0&quot; class=&quot;ax&quot; text-anchor=&quot;start&quot;&gt;p25–p75 12–35&lt;/text&gt;&lt;circle cx=&quot;467.8&quot; cy=&quot;185.0&quot; r=&quot;6&quot; fill=&quot;var(--c7)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;1.5&quot;&gt;&lt;title&gt;中位：21&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;467.8&quot; y=&quot;171.0&quot; class=&quot;val&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--c7)&quot;&gt;中位 21&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;缺口判斷影響幅度：拿掉各項作者判斷、其他不變時，合理價值中點的變動（計算核對.json，2026-11-13）；紅色為過門檻（中點±10%或價格位置跨界或生意等級理由），2 項中 1 項過門檻；虛線為 ±10%。正值＝拿掉後中點變高&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 100&quot; role=&quot;img&quot; aria-label=&quot;缺口判斷影響幅度&quot; class=&quot;chart&quot; style=&quot;max-width:700px&quot;&gt;&lt;line x1=&quot;388.3&quot; x2=&quot;388.3&quot; y1=&quot;6&quot; y2=&quot;94&quot; class=&quot;zero&quot;/&gt;&lt;line x1=&quot;298.3&quot; x2=&quot;298.3&quot; y1=&quot;4&quot; y2=&quot;96&quot; class=&quot;price&quot;/&gt;&lt;line x1=&quot;478.3&quot; x2=&quot;478.3&quot; y1=&quot;4&quot; y2=&quot;96&quot; class=&quot;price&quot;/&gt;&lt;text x=&quot;266&quot; y=&quot;25&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;1. 融資租賃負債計入債務&lt;/text&gt;&lt;rect x=&quot;388.3&quot; y=&quot;11&quot; width=&quot;7.4&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;403.7&quot; y=&quot;25&quot; class=&quot;val&quot;&gt;+0.8%&lt;/text&gt;&lt;text x=&quot;266&quot; y=&quot;63&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;2. 銷售對資本比的長期值改用營運投入…&lt;/text&gt;&lt;rect x=&quot;297.7&quot; y=&quot;49&quot; width=&quot;90.6&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--neg)&quot;/&gt;&lt;text x=&quot;396.3&quot; y=&quot;63&quot; class=&quot;val&quot;&gt;-10.1%&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;/div&gt;&lt;!--/新圖表--&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;合理價值怎麼來：三個情境與權重&lt;/h3&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt&quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;每股價值（基準折現率 10.2%）&lt;/th&gt;&lt;th&gt;權重&lt;/th&gt;&lt;th&gt;折現率高端 11.5%&lt;/th&gt;&lt;th&gt;折現率低端 8.9%&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;187.91&lt;/td&gt;&lt;td&gt;25%&lt;/td&gt;&lt;td&gt;158.33&lt;/td&gt;&lt;td&gt;231.14&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;334.05&lt;/td&gt;&lt;td&gt;50%&lt;/td&gt;&lt;td&gt;271.15&lt;/td&gt;&lt;td&gt;429.31&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;552.96&lt;/td&gt;&lt;td&gt;25%&lt;/td&gt;&lt;td&gt;436.96&lt;/td&gt;&lt;td&gt;734.59&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;加權（合理價值）&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;b&gt;352.24&lt;/b&gt;&lt;/td&gt;&lt;td&gt;100%&lt;/td&gt;&lt;td&gt;&lt;b&gt;284.40&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;b&gt;456.09&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;中點是三個情境的加權：0.25×187.91＋0.5×334.05＋0.25×552.96≈352.24（一般權重組合）。區間上下緣是同樣三個情境、權重不變，只把折現率換成區間高端或低端重算後加權：高端約 11.5% → 284.40（下緣），低端約 8.9% → 456.09（上緣）。買入區上緣 211.35＝中點 × (1－安全邊際 40%，不確定性高)，股價在此以下才有 40% 安全邊際。情境表說明合理價值怎麼組成，不是單一目標價；非買賣建議。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;市價隱含第 10 年倍數（只描述，不進評等）&lt;/h3&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;基準情境：市價隱含 vs 模型假設的第 10 年 EV/EBIT（金額百萬美元）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;折現率&lt;/th&gt;&lt;th&gt;WACC&lt;/th&gt;&lt;th&gt;市場 EV&lt;/th&gt;&lt;th&gt;明示期現值&lt;/th&gt;&lt;th&gt;終值折現因子&lt;/th&gt;&lt;th&gt;第 10 年 EBIT&lt;/th&gt;&lt;th&gt;市價隱含倍數&lt;/th&gt;&lt;th&gt;模型終值倍數&lt;/th&gt;&lt;th&gt;隱含÷模型&lt;/th&gt;&lt;th&gt;現在 EV／次年 EBIT&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;低折現率&lt;/td&gt;&lt;td&gt;8.86%&lt;/td&gt;&lt;td&gt;3,904,947&lt;/td&gt;&lt;td&gt;1,432,007&lt;/td&gt;&lt;td&gt;0.280&lt;/td&gt;&lt;td&gt;499,809&lt;/td&gt;&lt;td&gt;17.7 倍&lt;/td&gt;&lt;td&gt;12.6 倍&lt;/td&gt;&lt;td&gt;1.40&lt;/td&gt;&lt;td&gt;20.7 倍&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;10.19%&lt;/td&gt;&lt;td&gt;3,904,947&lt;/td&gt;&lt;td&gt;1,289,431&lt;/td&gt;&lt;td&gt;0.233&lt;/td&gt;&lt;td&gt;499,809&lt;/td&gt;&lt;td&gt;22.4 倍&lt;/td&gt;&lt;td&gt;10.3 倍&lt;/td&gt;&lt;td&gt;2.18&lt;/td&gt;&lt;td&gt;20.7 倍&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;高折現率&lt;/td&gt;&lt;td&gt;11.49%&lt;/td&gt;&lt;td&gt;3,904,947&lt;/td&gt;&lt;td&gt;1,168,127&lt;/td&gt;&lt;td&gt;0.196&lt;/td&gt;&lt;td&gt;499,809&lt;/td&gt;&lt;td&gt;28.0 倍&lt;/td&gt;&lt;td&gt;8.7 倍&lt;/td&gt;&lt;td&gt;3.20&lt;/td&gt;&lt;td&gt;20.7 倍&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;算式：市場 EV＝模型 EV +（現價 − 模型每股價值）× 股數（股權橋與模型相同）；隱含倍數＝（市場 EV − 明示期現值）÷ 終值折現因子 ÷ 第 10 年 EBIT；模型終值倍數＝模型終值 ÷ 第 10 年 EBIT。參考帶：p25 12.4、中位 20.9、p75 35.4、p90 54.5 倍（機械回測樣本，非市場全體；分產業的筆數與公司數少，僅供參考；機械回測訓練期 2016–2021 全部回測日（審查工作區 回測資料/隱含倍數結果.json，1,810 筆中訓練期 1,046 筆；產業＝回測樣本的 Damodaran 產業）；重算：python3 程式/回測_隱含倍數參考帶.py &amp;lt;隱含倍數結果.json&amp;gt;）。只描述，不進價格位置、研究評等與合理價值。&lt;/p&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;&lt;b&gt;合理價值 vs 市價隱含倍數（作者判讀）：&lt;/b&gt;市價隱含第 10 年企業價值約為營業利益的 22.4 倍，模型基準只給 10.3 倍，相差 2.18 倍；換低折現率 8.86% 時仍為 17.7 對 12.6 倍。隱含倍數接近產業參考帶中位、低於 p75，無特例。差距可用較高成長、較高利潤率或較低折現率任一解釋（見計算底稿 5 三視角反推），本報告不判斷是哪一個；只描述，不進評等、非目標價。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;如果 10 年後倍數是 20.9 倍，機率加權每股約 523 美元（條件式，非目標價、非買賣建議，不進評等）&lt;/h3&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;第 10 年 EV/EBIT 倍數對照（三情境各用自己的明示期 FCFF 與第 10 年 EBIT；權重 一般：保守 25%／基準 50%／樂觀 25%；基準 WACC 10.19%）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;第 10 年倍數&lt;/th&gt;&lt;th&gt;機率加權每股（美元）&lt;/th&gt;&lt;th&gt;折現率低高區間&lt;/th&gt;&lt;th&gt;白話換算&lt;/th&gt;&lt;th&gt;現價相對&lt;/th&gt;&lt;th&gt;說明&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;模型假設倍數&lt;/td&gt;&lt;td&gt;10.3 倍&lt;/td&gt;&lt;td&gt;352.24&lt;/td&gt;&lt;td&gt;284.40–456.09&lt;/td&gt;&lt;td&gt;等於折現率減永續成長約 7.2%（模型 7.2%）&lt;/td&gt;&lt;td&gt;現價高於區間&lt;/td&gt;&lt;td&gt;各情境用自己的模型終值倍數（表列為基準情境）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;穩態理論上限&lt;/td&gt;&lt;td&gt;11.5 倍&lt;/td&gt;&lt;td&gt;366.66&lt;/td&gt;&lt;td&gt;319.38–424.27&lt;/td&gt;&lt;td&gt;等於折現率減永續成長約 6.5%（模型 7.2%）&lt;/td&gt;&lt;td&gt;現價高於區間&lt;/td&gt;&lt;td&gt;（1−t）（1+g）÷（WACC−g）：再投資為零（ROIC 無限大）時的上限；t＝第 10 年 1−NOPAT÷EBIT&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;參考帶中位（Software (System &amp;amp; Application)）&lt;/td&gt;&lt;td&gt;20.9 倍&lt;/td&gt;&lt;td&gt;522.72&lt;/td&gt;&lt;td&gt;450.36–611.48&lt;/td&gt;&lt;td&gt;等於折現率減永續成長約 3.5%（模型 7.2%）&lt;/td&gt;&lt;td&gt;現價在區間內&lt;/td&gt;&lt;td&gt;所選參考帶（產業）中位&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;同業今日 EV/EBIT 中位&lt;/td&gt;&lt;td&gt;22.0 倍&lt;/td&gt;&lt;td&gt;540.57&lt;/td&gt;&lt;td&gt;465.34–632.89&lt;/td&gt;&lt;td&gt;等於折現率減永續成長約 3.4%（模型 7.2%）&lt;/td&gt;&lt;td&gt;現價在區間內&lt;/td&gt;&lt;td&gt;估值結果 multiples.ev_ebit.peer_quartiles.p50（今天的倍數，不是 10 年後）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;參考帶 p75（Software (System &amp;amp; Application)）&lt;/td&gt;&lt;td&gt;35.4 倍&lt;/td&gt;&lt;td&gt;762.38&lt;/td&gt;&lt;td&gt;651.50–898.97&lt;/td&gt;&lt;td&gt;等於折現率減永續成長約 2.1%（模型 7.2%）&lt;/td&gt;&lt;td&gt;現價低於區間&lt;/td&gt;&lt;td&gt;所選參考帶（產業）p75&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;市價隱含&lt;/td&gt;&lt;td&gt;22.4 倍&lt;/td&gt;&lt;td&gt;548.14&lt;/td&gt;&lt;td&gt;471.69–641.96&lt;/td&gt;&lt;td&gt;等於折現率減永續成長約 3.3%（模型 7.2%）&lt;/td&gt;&lt;td&gt;現價在區間內&lt;/td&gt;&lt;td&gt;基準情境、基準折現率反推（只用基準情境，套到三情境後加權不必等於現價）&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;如果 10 年後倍數是 X，三情境各用自己的明示期 FCFF 與第 10 年 EBIT、以基準折現率折現，依政策情境機率權重加權的每股價值；區間只換折現率（①模型列為合理價值區間）。「折現率減永續成長」＝(1+g)(1−t)(1−g/ROIC)÷倍數（基準情境永續參數）。條件式，非目標價、非買賣建議，不進評等。模型假設倍數那一列等於合理價值（中點 352.24）。&lt;/p&gt;&lt;/div&gt;&lt;!--成長型價格參考--&gt;&lt;div class=&quot;block&quot; id=&quot;growth-ref&quot;&gt;&lt;h3&gt;成長型價格參考：報酬門檻價、五年報酬矩陣、林區比值（只描述，不進評等，非買賣建議）&lt;/h3&gt;&lt;p class=&quot;cap&quot;&gt;這一段只描述，不進研究評等、不改價格位置，也不是目標價；三種情境並列、不合成單一數字，數字是「該情境成真時」的條件式推算，不是預期報酬。非買賣建議。&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;一、報酬門檻價：收盤 2026-11-13 股價 523.88 美元（三情境並列；條件式推算，非目標價）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;年報酬 7% 的每股價格（美元）&lt;/th&gt;&lt;th&gt;年報酬 8% 的每股價格（美元）&lt;/th&gt;&lt;th&gt;年報酬 9% 的每股價格（美元）&lt;/th&gt;&lt;th&gt;年報酬 10% 的每股價格（美元）&lt;/th&gt;&lt;th&gt;現價隱含年報酬&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;335.73&lt;/td&gt;&lt;td&gt;270.65&lt;/td&gt;&lt;td&gt;225.84&lt;/td&gt;&lt;td&gt;193.18&lt;/td&gt;&lt;td&gt;5.5%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;674.65&lt;/td&gt;&lt;td&gt;519.57&lt;/td&gt;&lt;td&gt;417.43&lt;/td&gt;&lt;td&gt;345.45&lt;/td&gt;&lt;td&gt;8.0%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;1,234.64&lt;/td&gt;&lt;td&gt;913.12&lt;/td&gt;&lt;td&gt;711.55&lt;/td&gt;&lt;td&gt;574.32&lt;/td&gt;&lt;td&gt;10.5%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;算法：各情境的 10 年現金流與終值改用門檻當折現率，經同一股權橋換成每股；股價等於這個價格時，該情境成真的現價隱含年報酬就等於門檻（兩者互為反函數）。&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;二、五年報酬矩陣：現價買進、持有 5 年的年化報酬（三情境 × 三種第 5 年倍數；推導，條件式，非預期報酬）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;第 5 年 EBIT（估值輸入單位，推導）&lt;/th&gt;&lt;th&gt;維持現在 23.9 倍&lt;/th&gt;&lt;th&gt;縮四分之一 17.9 倍&lt;/th&gt;&lt;th&gt;回到參考帶中位（Software (System &amp;amp; Application)） 20.9 倍&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;171,376.2&lt;/td&gt;&lt;td&gt;3.3%&lt;/td&gt;&lt;td&gt;-2.0%&lt;/td&gt;&lt;td&gt;0.8%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;281,931.3&lt;/td&gt;&lt;td&gt;13.4%&lt;/td&gt;&lt;td&gt;7.4%&lt;/td&gt;&lt;td&gt;10.5%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;391,136.2&lt;/td&gt;&lt;td&gt;20.6%&lt;/td&gt;&lt;td&gt;14.2%&lt;/td&gt;&lt;td&gt;17.6%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;算法：現價買進、持有 5 年：第 1–5 年自由現金流與第 5 年企業價值（倍數 × 該情境第 5 年 EBIT）折回今天、經今日股權橋與股數換成每股，解出使每股等於現價的年報酬（與現價隱含年報酬同一算法，只是第 5 年改用倍數計價）；不另估 5 年後的淨債務與股數。企業價值 ÷ 當年 EBIT 口徑與市價隱含第 10 年倍數、參考帶相同。推導。現在倍數＝市場企業價值 3,904,947.5 ÷ 近四季營業利益 163,191.0（估值輸入 company_metrics.ebit）＝23.9 倍；縮四分之一＝現在倍數 × 0.75。參考帶：產業層「Software (System &amp;amp; Application)」中位 20.9 倍（機械回測樣本，非市場全體；分產業的筆數與公司數少，僅供參考）。&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;三、林區比值（只給比值與口徑；成長率與本益比的口徑同「PEG 與林區檢查」表的基準情境推估那一列）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;數值&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;林區分類&lt;/td&gt;&lt;td&gt;穩定成長&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;成長率（基準情境推估（稅後營業利益年增－股數年變化））&lt;/td&gt;&lt;td&gt;11.6%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;本益比&lt;/td&gt;&lt;td&gt;29.2 倍&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股息殖利率&lt;/td&gt;&lt;td&gt;0.7%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;本益比 ÷ 成長率&lt;/td&gt;&lt;td&gt;2.53&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;（成長率＋股息殖利率）÷ 本益比&lt;/td&gt;&lt;td&gt;0.42&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;林區以本益比約等於成長率為參考（二手來源轉述）；本表不設門檻。只給比值與口徑，不作便宜或昂貴的判斷，不進研究評等與價格位置。非買賣建議。&lt;/p&gt;&lt;/div&gt;&lt;!--/成長型價格參考--&gt;&lt;div class=&quot;note-box&quot;&gt;&lt;b&gt;同業與歷史倍數交叉核對（不進評等）：258–488 美元&lt;/b&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;依同業的本益比、企業價值／營業利益、企業價值／營收、企業價值／自由現金流倍數換算的每股價值，各法 25 百分位的中位數到 75 百分位的中位數；不是股價波動範圍，也不是合理價值。原稱「市場情緒區間」；2026-11-11 起只作交叉核對，不決定價格位置與研究評等（價格位置三級：買入區、合理、偏貴，只看買入區上緣與合理價值高端）。&lt;/p&gt;&lt;/div&gt;&lt;!--目標區間:第五題--&gt;&lt;div class=&quot;block&quot; id=&quot;target-body&quot;&gt;&lt;h3&gt;12 個月條件式目標區間：三種情境各自成真時的價值（條件式、非買賣建議）&lt;/h3&gt;&lt;p class=&quot;cap&quot;&gt;條件式目標區間：三種情境各自成真時的每股價值區間，不是股價預測，三段不合成單一數字；非買賣建議。不影響合理價值、價格位置與研究評等。&lt;/p&gt;&lt;p&gt;算法：各情境每股價值（折現率高低兩端）×（1＋股權成本 10.35%）− 未來 12 個月每股股利 3.63 美元（近四季實際每股股利 ＝ 價值判斷.json 股利殖利率 0.6926% × 現價 523.88（推導）；對照：價值判斷.json 每股股利（已調整）2026 年度 3.64（每股口徑；這裡是近四季股利總額 ÷ 估值股數，差在股數口徑與期間））；回購不加回。起點 2026-11-13 收盤，終點 2027-11-13。三段是各情境在折現率上下兩端的每股價值向前推 12 個月，不是價格機率分布的切片；段與段之間可能有空白，也可能重疊。區間主要寬度來自折現率不確定，不是 12 個月內的營運變化。&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt&quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;機率（政策權重，未經歷史校準）&lt;/th&gt;&lt;th&gt;目標區間（美元）&lt;/th&gt;&lt;th&gt;相對現價&lt;/th&gt;&lt;th&gt;關鍵假設（估值輸入）&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;25%&lt;/td&gt;&lt;td&gt;&lt;b&gt;171.09–251.44&lt;/b&gt;&lt;/td&gt;&lt;td&gt;−67%～−52%&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;第 1 年營收 +12.0%；營業利益率 46.0%；穩態 35.2%；永續成長 2.5%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;50%&lt;/td&gt;&lt;td&gt;&lt;b&gt;295.58–470.12&lt;/b&gt;&lt;/td&gt;&lt;td&gt;−44%～−10%&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;第 1 年營收 +16.0%；營業利益率 47.0%；穩態 44.0%；永續成長 3.0%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;25%&lt;/td&gt;&lt;td&gt;&lt;b&gt;478.56–806.99&lt;/b&gt;&lt;/td&gt;&lt;td&gt;−9%～+54%&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;第 1 年營收 +20.0%；營業利益率 47.5%；穩態 55.0%；永續成長 3.5%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;口徑：報告中「現價隱含年報酬（基準情境，非預期報酬）約 8.0%」是以現價買進、持有該情境全期現金流（含永續價值）的年化報酬；這裡的目標區間是 12 個月後各情境每股價值的前推，兩者口徑不同，不能互相換算（例如不能用前者推 12 個月後的價格）。&lt;/p&gt;&lt;h4 style=&quot;margin-top:14px&quot;&gt;每一段要成立，市場這一面需要什麼、正在顯示什麼&lt;/h4&gt;&lt;ul class=&quot;prose&quot;&gt;&lt;li&gt;保守段代表值 203.7（基準折現率前推）要成立，一年後EV／營業利益需約 8.5 倍（現在 23.9 倍，低於現在倍數）；過去一年逐日重建的交易日中，99% 以上高於這個倍數、不到 1% 低於這個倍數（推導）；同規模同成長低於 p25。這是把價值翻成倍數的讀法，不是預測市場會給這個倍數。&lt;/li&gt;&lt;li&gt;基準段代表值 365.0（基準折現率前推）要成立，一年後EV／營業利益需約 14.4 倍（現在 23.9 倍，低於現在倍數）；過去一年逐日重建的交易日中，99% 以上高於這個倍數、不到 1% 低於這個倍數（推導）；同規模同成長約第 42 百分位（p25–p75 間線性內插，推導）。這是把價值翻成倍數的讀法，不是預測市場會給這個倍數。&lt;/li&gt;&lt;li&gt;樂觀段代表值 606.6（基準折現率前推）要成立，一年後EV／營業利益需約 22.9 倍（現在 23.9 倍，低於現在倍數）；過去一年逐日重建的交易日中，48% 高於這個倍數、52% 低於這個倍數（推導）；同規模同成長約第 60 百分位（p25–p75 間線性內插，推導）。這是把價值翻成倍數的讀法，不是預測市場會給這個倍數。&lt;/li&gt;&lt;li&gt;以 2027-12-17 到期選擇權的價平隱含波動 33.0%（2026-11-14 14:48 UTC 取得；最近成交 2026-11-13，不在取得當天；取價時現價 523.88，起點價 523.88 為 2026-11-13 收盤）定價，12 個月後（2027-11-13）價格落在保守段 1.4%、基準段 34%、樂觀段 50%；低於最低端（171.09） 0.0%、高於最高端（806.99） 8.8%、段與段之間空白 5.2%、段與段重疊 0.0%。這是風險中立機率，不是真實機率；不改情境權重、不改估值與評等；選擇權定價含風險溢酬與波動偏態，與三段情境機率是兩回事。報價品質：買權 38.0%、賣權 28.0% 相差 10 個百分點，報價可能過時或含偏斜，只作參考。&lt;/li&gt;&lt;li&gt;公債殖利率下降 1 個百分點時，保守／基準／樂觀段代表值（基準折現率前推，不是區間兩端的平均）為 234.6／433.4／737.0；目前 203.7／365.0／606.6；上升 1 個百分點時為 179.9／313.5／510.6（美元，股權成本同幅變動，其他假設不變）。&lt;/li&gt;&lt;li&gt;分析師預估：本財年每股盈餘預估 20.01，較 30 天前 19.77 +1.2%（上修），近 30 天 25 家上修、3 家下修；下一財年每股盈餘預估 24.19，較 30 天前 23.69 +2.1%（上修），近 30 天 25 家上修、3 家下修。只描述預估修正的方向，不當證據，也不是目標區間的任一端。&lt;/li&gt;&lt;li&gt;券商目標價近 90 天有 23 家調整：上調 21、下調 0、持平 2（只揭露，不是本報告的目標價）。&lt;/li&gt;&lt;li&gt;上季（Sep 2026，10/28/2026 公布）每股盈餘 4.89，共識預估 4.71，驚奇 3.82%（Nasdaq）；yfinance 另列 2026-09-30 實際 4.89、預估 4.72、驚奇 +3.59%；兩個來源口徑可能不同（可能是調整後或一般會計準則），公司申報的每股盈餘可對照存檔 8-K 2026-10-28 財報新聞稿（本句未逐項比對），只描述、不當證據。&lt;/li&gt;&lt;/ul&gt;&lt;p class=&quot;cap&quot;&gt;以上只引用已存檔的數字描述條件與現況，不是預測；選擇權機率是風險中立機率、不是真實機率，不改情境權重；分析師預估與券商目標價不當證據；細節表在附錄估值細節。&lt;/p&gt;&lt;p&gt;&lt;b&gt;需要重算區間的事件：&lt;/b&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;IRS 2004–2013 年度移轉訂價爭議（擬議補稅 289 億美元另加罰款利息）若和解或判決金額超過已列 306 億長期所得稅負債，股權橋要重算；全額現金支付時每股約 −4.1（推導）（10-Q 2026-09-30 Part I, Item 1 ¶143）&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;b&gt;時程可能延後、落在 12 個月之外的事件：&lt;/b&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;英國 CMA 戰略市場地位與美國 FTC 調查的最終結果與行為規則，時程可能落在 12 個月之外；公司風險因子只寫主管機關持續審視其業務，未揭露時程（10-Q 2026-09-30 Part II, Item 1A ¶82）&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;!--/目標區間:第五題--&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;市價要求的成長：三視角反推、假設對照實績、歷史基準比率與市價溢價來源&lt;/h3&gt;&lt;p&gt;這一節把現價代回估值模型反解「市場要求什麼」，再和公司實績、同規模公司的歷史比例、市場面的過熱訊號對照；只揭露，不改合理價值、價格位置與研究評等。&lt;/p&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;市價隱含什麼、我們假設什麼、公司做到什麼&lt;/h4&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;視角（其他假設照基準，三者擇一）&lt;/th&gt;&lt;th&gt;市價隱含&lt;/th&gt;&lt;th&gt;本報告基準&lt;/th&gt;&lt;th&gt;實績或對照&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;成長&lt;/td&gt;&lt;td&gt;第 1–5 年營收每年約 18.9%&lt;/td&gt;&lt;td&gt;第 1–5 年平均約 12.6%（推算）&lt;/td&gt;&lt;td&gt;近四季 17.9%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;利潤率&lt;/td&gt;&lt;td&gt;第 1 年起每年（含穩態）營業利益率約 65.1%&lt;/td&gt;&lt;td&gt;第 1 年 47.0%、穩態 44.0%&lt;/td&gt;&lt;td&gt;19.4%–46.8%（近 12 年營業利益率）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;折現率&lt;/td&gt;&lt;td&gt;約 8.0%（使基準情境等於現價的折現率）&lt;/td&gt;&lt;td&gt;加權資本成本 10.2%&lt;/td&gt;&lt;td&gt;10 年期公債 5.10%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;市價隱含折現率約 8.0%，比加權資本成本 10.2% 低約 2.2 個百分點：照基準情境假設，現價隱含的長期報酬低於本報告採用的資金成本；市價要站得住，需要基準以外的假設成立（例如成長或利潤率高於基準，見上兩列），或投資人接受較低的報酬。隱含折現率不是預期報酬；V3 回測（2016–2025，含倖存者偏誤）中，之後一年實際報酬中位多高於隱含值。只揭露，不改研究評等與價格位置；非買賣建議。&lt;/p&gt;&lt;div style=&quot;margin-top:12px&quot;&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;第 1 年營收成長&lt;/th&gt;&lt;th&gt;穩態營業利益率&lt;/th&gt;&lt;th&gt;終端投入資本報酬率（ROIC）&lt;/th&gt;&lt;th&gt;永續成長&lt;/th&gt;&lt;th&gt;對照實績&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;12.0%&lt;/td&gt;&lt;td&gt;35.2%&lt;/td&gt;&lt;td&gt;25.0%&lt;/td&gt;&lt;td&gt;2.5%&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;16.0%&lt;/td&gt;&lt;td&gt;44.0%&lt;/td&gt;&lt;td&gt;30.0%&lt;/td&gt;&lt;td&gt;3.0%&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;20.0%&lt;/td&gt;&lt;td&gt;55.0%&lt;/td&gt;&lt;td&gt;36.0%&lt;/td&gt;&lt;td&gt;3.5%&lt;/td&gt;&lt;td&gt;高於歷史上限（穩態利潤率）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;公司實績&lt;/td&gt;&lt;td&gt;近四季 17.9%&lt;/td&gt;&lt;td&gt;近四季 47.1%；19.4%–46.8%（近 12 年營業利益率）&lt;/td&gt;&lt;td&gt;近四季 53.0%；研發資本化後約 41.0%（2026-06-30 財年，研發資本化對照.json）&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;p style=&quot;margin-top:8px&quot;&gt;&lt;b&gt;為何樂觀情境的穩態利潤率高於歷史上限（作者說明）：&lt;/b&gt;樂觀情境穩態營業利益率 55%（第 5 年 52%）高於近 12 年最高 46.8%：FY2023→FY2026 增量營業利益率約 56%（長期財務.json，推導），最新一季營業利益增 21% 快於營收 19%（8-K 2026-10-28#2 新聞稿 §0），規模持續擴大時平均利潤率可往增量利潤率靠攏；屬樂觀假設，作者判斷。&lt;/p&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;市價隱含三視角：把現價代回基準情境，一次只放開一個假設反解（成長、利潤率、折現率），三者擇一成立即可，不是同時需要；折現率視角就是第四題「現價隱含年報酬（基準情境，非預期報酬）」。假設對照：終端 ROIC 低於近四季一半時標「保守於實績」，括號寫原因：產業上限、公司近五年中位上限或等於資金成本是估值框架的上限設定（估值政策），作者選值的理由在估值輸入，都不是資料錯誤；穩態利潤率高於歷史上限標「高於歷史上限」；利潤率仍在改善中的公司（轉型、規模擴張期），歷史上限不一定是天花板，標記只提醒讀者對照，不代表假設錯誤。出處：估值結果.json（reverse_dcf、implied_return、discount）、估值輸入.json（scenarios）、財務指標.json（ROIC_TTM）、產業指標.json（景氣正常化）、成長推估底稿.json 與財務歷史.json（近四季）；推導，只揭露，不改合理價值、價格位置與研究評等。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;市價隱含的成長與歷史基準比率&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;市價隱含 MSFT 未來 10 年營收實質年增約 17.6%–18.1%（名目 20.1% 減通膨 2.0%–2.5% 的近似，推導）；1950–2015 年營收 500 億美元以上的公司中，10 年間做到實質年增 15% 以上的約 0.9%（Mauboussin 等，2016，表 4）。此為揭露，不是市價錯誤的證明。&lt;/p&gt;&lt;p&gt;現價要成立，需把基準情境第 1 年營收成長 16.0% 延續約 14 年（之後新投資報酬等於折現率，不再創造價值；推導，只揭露）。&lt;/p&gt;&lt;p&gt;&lt;b&gt;隱含假設罕見度：歷史罕見&lt;/b&gt;（同規模公司 10 年做到的歷史比例 ≥50% 一般、10%–50% 樂觀、&amp;lt;10% 歷史罕見；只揭露，不改研究評等與價格位置）&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;超額報酬期間&lt;/th&gt;&lt;th&gt;市價隱含營收年增（名目）&lt;/th&gt;&lt;th&gt;約實質（名目減通膨 2.0%–2.5% 的近似，推導）&lt;/th&gt;&lt;th&gt;歷史基準比率（1950–2015）&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;10 年&lt;/td&gt;&lt;td&gt;20.1%&lt;/td&gt;&lt;td&gt;17.6%–18.1%&lt;/td&gt;&lt;td&gt;營收 500 億美元以上：10 年實質年增 15% 以上約 0.9%（該組 10 年實質年增中位數 1.1%）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;15 年&lt;/td&gt;&lt;td&gt;14.9%&lt;/td&gt;&lt;td&gt;12.4%–12.9%&lt;/td&gt;&lt;td&gt;原文只有 10 年分布，15、20 年無對照&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;20 年&lt;/td&gt;&lt;td&gt;12.5%&lt;/td&gt;&lt;td&gt;10.0%–10.5%&lt;/td&gt;&lt;td&gt;原文只有 10 年分布，15、20 年無對照&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;做法：超額報酬期間內營收年增固定、利潤率與銷售對資本比取基準情境第 5 年；期間結束後新投資報酬等於折現率（不再創造價值）；永續成長照基準情境。折現率 10.19%、第 5 年利潤率 45.0%。來源：Mauboussin, Callahan &amp;amp; Majd（2016）〈The Base Rate Book〉表 4（第三方轉載，原表 1950–2015 年、實質成長、有存活偏差）。這張表只說明「市價需要多強、多久的成長才成立」，不改合理價值、買入區上緣與價格位置；歷史比例低代表市價需要少見的結果，不代表市價錯誤。通膨假設 2.0%–2.5% 依 Morningstar 2020-10 方法，實質年增為名目直接減通膨的近似。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;市價溢價來源&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;溢價訊號集中在基本面預期（隱含假設罕見度）。倍數重估、資金與情緒、總經與利率無訊號。只揭露，不改研究評等與價格位置，也不代表市價錯誤。&lt;/p&gt;&lt;p&gt;EPS 預估：+1y（財年未對應） 預估 90 天 2.6%（上修；判斷窗口為 90 天，±2% 內視為持平），近 30 天上修減下修 22 家；yfinance 預估是取得當下快照，股價 90 天變化以批次收盤日為終點，兩者日期可能差幾天；取得 2026-11-14，晚於收盤日 2026-11-13。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;來源類別&lt;/th&gt;&lt;th&gt;數值&lt;/th&gt;&lt;th&gt;過熱訊號&lt;/th&gt;&lt;th&gt;說明／存檔位置&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;隱含假設罕見度&lt;/td&gt;&lt;td&gt;基本面預期&lt;/td&gt;&lt;td&gt;歷史罕見&lt;/td&gt;&lt;td&gt;有&lt;/td&gt;&lt;td&gt;價值判斷.json#/市價隱含假設&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;倍數擴張&lt;/td&gt;&lt;td&gt;倍數重估&lt;/td&gt;&lt;td&gt;近 1 年（2025-11-13 起）股價 +4%：EPS +0.31、本益比 -0.27（對數）→ 獲利成長為主&lt;/td&gt;&lt;td&gt;無&lt;/td&gt;&lt;td&gt;EPS 與本益比貢獻方向相反且 EPS 變動大：起點或終點的申報 EPS 可能含一次性項目，倍數擴張的方向可能被基期扭曲，對照扣非經常 EPS 再讀&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;預估背離&lt;/td&gt;&lt;td&gt;倍數重估&lt;/td&gt;&lt;td&gt;+1y（財年未對應） EPS 預估 90 天 +2.6%（上修；90 天變化 ±2% 內視為持平），同期股價 +5.7% → 預估上修、股價上漲，方向一致（不判斷漲幅是否合理）&lt;/td&gt;&lt;td&gt;無&lt;/td&gt;&lt;td&gt;價值判斷.json#/預估修正&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;本益比水位&lt;/td&gt;&lt;td&gt;倍數重估&lt;/td&gt;&lt;td&gt;現在 27.4 倍，自身五年 p75 36.3 倍&lt;/td&gt;&lt;td&gt;無&lt;/td&gt;&lt;td&gt;市場資料/歷史本益比.json#/pe_p75&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股債利差&lt;/td&gt;&lt;td&gt;總經與利率&lt;/td&gt;&lt;td&gt;近期百分位 27%（0% 最貴）&lt;/td&gt;&lt;td&gt;無&lt;/td&gt;&lt;td&gt;市場資料/歷史本益比.json#/股債利差/近期百分位&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;整體市場風險溢價&lt;/td&gt;&lt;td&gt;總經與利率&lt;/td&gt;&lt;td&gt;Damodaran 隱含風險溢價 4.20%（2026-10-01）&lt;/td&gt;&lt;td&gt;不適用&lt;/td&gt;&lt;td&gt;只存當月值，沒有歷史序列可比中位數；要下載 Damodaran 歷史表需使用者同意&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;動能&lt;/td&gt;&lt;td&gt;資金與情緒&lt;/td&gt;&lt;td&gt;相對 200 日均線 +19%；12 個月（2025-11-12 起） +3% 對 S&amp;amp;P500 +12%&lt;/td&gt;&lt;td&gt;無&lt;/td&gt;&lt;td&gt;市場資料/市場溫度.json#/趨勢、#/動能&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;部位與衍生品&lt;/td&gt;&lt;td&gt;資金與情緒&lt;/td&gt;&lt;td&gt;選擇權賣權對買權量比 中性；空單分位 10%、回補天數分位 60%&lt;/td&gt;&lt;td&gt;無&lt;/td&gt;&lt;td&gt;市場資料/市場溫度.json#/選擇權情緒、#/流動性&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;擁擠度&lt;/td&gt;&lt;td&gt;資金與情緒&lt;/td&gt;&lt;td&gt;20 日均換手率在自身五年 55% 分位；被發現程度 高&lt;/td&gt;&lt;td&gt;無&lt;/td&gt;&lt;td&gt;市場資料/市場溫度.json#/流動性/20日均換手率_分位&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;股價漲跌拆解：EPS 成長 vs 本益比變化（年化對數點，推導；不含股利、申報 EPS）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;期間&lt;/th&gt;&lt;th&gt;股價年化&lt;/th&gt;&lt;th&gt;EPS 貢獻&lt;/th&gt;&lt;th&gt;本益比貢獻&lt;/th&gt;&lt;th&gt;本益比&lt;/th&gt;&lt;th&gt;主因&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;1年&lt;/td&gt;&lt;td&gt;4.1%&lt;/td&gt;&lt;td&gt;+0.31&lt;/td&gt;&lt;td&gt;-0.27&lt;/td&gt;&lt;td&gt;35.8 → 27.4&lt;/td&gt;&lt;td&gt;獲利成長為主&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;3年&lt;/td&gt;&lt;td&gt;12.6%&lt;/td&gt;&lt;td&gt;+0.21&lt;/td&gt;&lt;td&gt;-0.09&lt;/td&gt;&lt;td&gt;35.5 → 27.4&lt;/td&gt;&lt;td&gt;獲利成長為主&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;門檻：使用者 2026-11-04 照草案核定（程式/市場溢價來源.py 常數）。各列只描述市場面，不改合理價值、研究評等與價格位置，非買賣建議。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;multiple-conditions&quot;&gt;&lt;h3&gt;長期倍數條件：要漲 3／5／10 倍需要什麼&lt;/h3&gt;&lt;p&gt;反過來問：股價要在 5 年或 10 年內每股漲到 3、5、10 倍，期末營收、利潤率、估值倍數要做到多少，歷史上同規模公司有多少做到過。&lt;b&gt;條件反推，非預測、非機率、非目標價、非買賣建議&lt;/b&gt;；不改研究評等、價格位置與目標區間。&lt;/p&gt;&lt;p class=&quot;cap&quot;&gt;主列＝產業倍數＋基準穩態利潤率；括號是三種期末倍數口徑（不重估、產業、自身本益比 p25）的範圍。股數年稀釋率 -0.1%（推導）。罕見度：5 年用自有 SEC 名目分布、10 年用 Base Rate Book（1950–2015，實質）。&lt;/p&gt;&lt;ul&gt;&lt;li&gt;3 倍／5 年：營收年增約 17.7%（2 種期末倍數口徑 17.7%–26.2%），歷史罕見（營收 500 億美元以上的公司 5 年約 6.7% 做到）；資金自足&lt;/li&gt;&lt;li&gt;3 倍／10 年：營收年增約 8.4%（2 種期末倍數口徑 8.4%–12.3%），樂觀（營收 500 億美元以上的公司 10 年約 21.1% 做到）；資金自足&lt;/li&gt;&lt;li&gt;5 倍／5 年：營收年增約 30.4%（2 種期末倍數口徑 30.4%–39.7%），歷史罕見（營收 500 億美元以上的公司 5 年約 0% 做到）；資金自足&lt;/li&gt;&lt;li&gt;5 倍／10 年：營收年增約 14.1%（2 種期末倍數口徑 14.1%–18.2%），歷史罕見（營收 500 億美元以上的公司 10 年約 3.9% 做到）；資金自足&lt;/li&gt;&lt;li&gt;10 倍／5 年：營收年增約 49.8%（2 種期末倍數口徑 49.8%–60.5%），歷史罕見（營收 500 億美元以上的公司 5 年約 0% 做到）；資金有缺口&lt;/li&gt;&lt;li&gt;10 倍／10 年：營收年增約 22.3%（2 種期末倍數口徑 22.3%–26.6%），歷史罕見（營收 500 億美元以上的公司 10 年約 0.9%–0% 做到）；資金自足&lt;/li&gt;&lt;/ul&gt;&lt;details&gt;&lt;summary&gt;全部格子&lt;/summary&gt;&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;倍數／期間&lt;/th&gt;&lt;th&gt;期末倍數口徑&lt;/th&gt;&lt;th&gt;利潤率口徑&lt;/th&gt;&lt;th&gt;需要營收年增&lt;/th&gt;&lt;th&gt;期末營收為現在&lt;/th&gt;&lt;th&gt;罕見度&lt;/th&gt;&lt;th&gt;資金&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;3 倍／5 年&lt;/td&gt;&lt;td&gt;不重估（29.9）&lt;/td&gt;&lt;td&gt;近四季（47.1%）&lt;/td&gt;&lt;td&gt;24.4%&lt;/td&gt;&lt;td&gt;3.0 倍&lt;/td&gt;&lt;td&gt;歷史罕見&lt;/td&gt;&lt;td&gt;自足&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;3 倍／5 年&lt;/td&gt;&lt;td&gt;不重估（29.9）&lt;/td&gt;&lt;td&gt;基準穩態（44.0%）&lt;/td&gt;&lt;td&gt;26.2%&lt;/td&gt;&lt;td&gt;3.2 倍&lt;/td&gt;&lt;td&gt;歷史罕見&lt;/td&gt;&lt;td&gt;自足&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;3 倍／5 年&lt;/td&gt;&lt;td&gt;產業（42.3）&lt;/td&gt;&lt;td&gt;近四季（47.1%）&lt;/td&gt;&lt;td&gt;16.1%&lt;/td&gt;&lt;td&gt;2.1 倍&lt;/td&gt;&lt;td&gt;歷史罕見&lt;/td&gt;&lt;td&gt;自足&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;3 倍／5 年&lt;/td&gt;&lt;td&gt;產業（42.3）&lt;/td&gt;&lt;td&gt;基準穩態（44.0%）&lt;/td&gt;&lt;td&gt;17.7%&lt;/td&gt;&lt;td&gt;2.3 倍&lt;/td&gt;&lt;td&gt;歷史罕見&lt;/td&gt;&lt;td&gt;自足&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;3 倍／10 年&lt;/td&gt;&lt;td&gt;不重估（29.9）&lt;/td&gt;&lt;td&gt;近四季（47.1%）&lt;/td&gt;&lt;td&gt;11.5%&lt;/td&gt;&lt;td&gt;3.0 倍&lt;/td&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;自足&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;3 倍／10 年&lt;/td&gt;&lt;td&gt;不重估（29.9）&lt;/td&gt;&lt;td&gt;基準穩態（44.0%）&lt;/td&gt;&lt;td&gt;12.3%&lt;/td&gt;&lt;td&gt;3.2 倍&lt;/td&gt;&lt;td&gt;樂觀～歷史罕見&lt;/td&gt;&lt;td&gt;自足&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;3 倍／10 年&lt;/td&gt;&lt;td&gt;產業（42.3）&lt;/td&gt;&lt;td&gt;近四季（47.1%）&lt;/td&gt;&lt;td&gt;7.7%&lt;/td&gt;&lt;td&gt;2.1 倍&lt;/td&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;自足&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;3 倍／10 年&lt;/td&gt;&lt;td&g &lt;/h3&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt&quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;倍數區段&lt;/th&gt;&lt;th&gt;倍數（EV／營業利益）&lt;/th&gt;&lt;th&gt;第 1 年獲利（百萬美元）&lt;/th&gt;&lt;th&gt;核對區間（美元）&lt;/th&gt;&lt;th&gt;代表值需要倍數&lt;/th&gt;&lt;th&gt;主方法代表值對核對區間中點&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;同規模同成長 p25～中位&lt;/td&gt;&lt;td&gt;9.16–16.84&lt;/td&gt;&lt;td&gt;178,488&lt;/td&gt;&lt;td&gt;218.91–403.10&lt;/td&gt;&lt;td&gt;8.5&lt;/td&gt;&lt;td&gt;−34%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;現在倍數～自身近五年 p25&lt;/td&gt;&lt;td&gt;23.32–23.93&lt;/td&gt;&lt;td&gt;188,882&lt;/td&gt;&lt;td&gt;591.02–606.44&lt;/td&gt;&lt;td&gt;14.4&lt;/td&gt;&lt;td&gt;−39%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;自身近五年中位～p75&lt;/td&gt;&lt;td&gt;26.47–28.89&lt;/td&gt;&lt;td&gt;197,474&lt;/td&gt;&lt;td&gt;701.54–765.69&lt;/td&gt;&lt;td&gt;22.9&lt;/td&gt;&lt;td&gt;−17%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;各情境第 1 年營業利益（假設，推導；不是公司指引）。每股 =（倍數 × 獲利 − 股權橋 4,137）÷ 7,446.0 百萬股，與估值引擎同口徑。倍數維持現在倍數不變、只看獲利，每股 ＝（現在倍數 × 第 1 年獲利 − 股權橋）÷ 股數：保守 573.0、基準 606.4、樂觀 634.1（美元）。倍數核對回答「市場一年後照這種擔憂程度給倍數，價格會在哪」；與主方法的差距是價值與市場慣例的落差，不合成、不平均。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;目標區間的企業價值前推核對&lt;/h3&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt&quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;股權成本前推（每股，折現率基準）&lt;/th&gt;&lt;th&gt;企業價值前推（每股）&lt;/th&gt;&lt;th&gt;相對差距&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;203.73&lt;/td&gt;&lt;td&gt;203.49&lt;/td&gt;&lt;td&gt;0.12%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;365.00&lt;/td&gt;&lt;td&gt;364.53&lt;/td&gt;&lt;td&gt;0.13%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;606.56&lt;/td&gt;&lt;td&gt;605.74&lt;/td&gt;&lt;td&gt;0.14%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;EV₀×（1＋WACC）−股權橋 與 每股價值×（1＋股權成本）的差；差距≥1% 只標註（槓桿較高時前者未計利息），不改目標區間。最大相對差距 0.14%（小於 1%）。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;各段代表值需要的倍數與歷史位置&lt;/h3&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt&quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;需要倍數（EV／營業利益）&lt;/th&gt;&lt;th&gt;相對現在 23.9 倍&lt;/th&gt;&lt;th&gt;自身近一年高於／低於此倍數的交易日比例&lt;/th&gt;&lt;th&gt;自身近五年（存檔四分位內插）&lt;/th&gt;&lt;th&gt;同規模同成長&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;8.5&lt;/td&gt;&lt;td&gt;低於&lt;/td&gt;&lt;td&gt;99% 以上／不到 1%&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;低於 p25&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;低於 p25&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;14.4&lt;/td&gt;&lt;td&gt;低於&lt;/td&gt;&lt;td&gt;99% 以上／不到 1%&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;低於 p25&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;約第 42 百分位（p25–p75 間線性內插，推導）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;22.9&lt;/td&gt;&lt;td&gt;低於&lt;/td&gt;&lt;td&gt;48%／52%&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;低於 p25&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;約第 60 百分位（p25–p75 間線性內插，推導）&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;需要倍數＝（代表值×股數＋股權橋）÷ 情境第 1 年獲利（推導）；是把價值翻成倍數的讀法，不是預測市場會給這個倍數。自身近一年比例：近一年每日 EV／近四季獲利（申報日後才可用）重建，四分位與市場給價存檔一致；推導（2025-11-13 至 2026-11-13，252 個交易日）。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;約 12 個月選擇權隱含分布下，各段的風險中立機率&lt;/h3&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt&quot;&gt;&lt;tr&gt;&lt;th&gt;保守段&lt;/th&gt;&lt;th&gt;基準段&lt;/th&gt;&lt;th&gt;樂觀段&lt;/th&gt;&lt;th&gt;低於最低端&lt;/th&gt;&lt;th&gt;高於最高端&lt;/th&gt;&lt;th&gt;段與段空白&lt;/th&gt;&lt;th&gt;段與段重疊&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;1.4%&lt;/td&gt;&lt;td&gt;34%&lt;/td&gt;&lt;td&gt;50%&lt;/td&gt;&lt;td&gt;0.0%&lt;/td&gt;&lt;td&gt;8.8%&lt;/td&gt;&lt;td&gt;5.2%&lt;/td&gt;&lt;td&gt;0.0%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;風險中立機率，不是真實機率；不改情境權重、不改估值與評等。到期日 2027-12-17（離終點日 34 天）價平隱含波動 33.0%（買權 38%、賣權 28%），最近成交 2026-11-13 18:50:01+00:00（最近成交 2026-11-13，不在取得當天；取價時現價 523.88，起點價 523.88 為 2026-11-13 收盤）；無風險利率 4.65%（FRED DGS1，2026-11-12 觀測 4.65%，資料庫/利率_FRED.json）、股利率 0.69%；起點價格 523.88（2026-11-13 收盤）。對數常態；漂移＝無風險利率（固定用 1 年期 DGS1，期間固定 1 年，不依到期日做期限插補）−股利率；波動＝價平隱含波動（不含波動微笑與偏態）；以批次收盤價為起點、12 個月為期間。各段機率是價格落在該段價值區間內的機率，段與段重疊處在各段機率中重複計入。報價品質：買權 38.0%、賣權 28.0% 相差 10 個百分點，報價可能過時或含偏斜，只作參考。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;預估修正趨勢（只描述，不當證據）&lt;/h3&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt&quot;&gt;&lt;tr&gt;&lt;th&gt;期間&lt;/th&gt;&lt;th&gt;每股盈餘預估&lt;/th&gt;&lt;th&gt;7 天前&lt;/th&gt;&lt;th&gt;30 天前&lt;/th&gt;&lt;th&gt;60 天前&lt;/th&gt;&lt;th&gt;90 天前&lt;/th&gt;&lt;th&gt;較 30 天前&lt;/th&gt;&lt;th&gt;近 7 天上修／下修家數&lt;/th&gt;&lt;th&gt;近 30 天上修／下修家數&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;本季&lt;/td&gt;&lt;td&gt;4.86&lt;/td&gt;&lt;td&gt;4.86&lt;/td&gt;&lt;td&gt;4.82&lt;/td&gt;&lt;td&gt;4.83&lt;/td&gt;&lt;td&gt;4.83&lt;/td&gt;&lt;td&gt;持平&lt;/td&gt;&lt;td&gt;16／4&lt;/td&gt;&lt;td&gt;15／5&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;下一季&lt;/td&gt;&lt;td&gt;4.94&lt;/td&gt;&lt;td&gt;4.94&lt;/td&gt;&lt;td&gt;4.88&lt;/td&gt;&lt;td&gt;4.88&lt;/td&gt;&lt;td&gt;4.88&lt;/td&gt;&lt;td&gt;上修&lt;/td&gt;&lt;td&gt;18／3&lt;/td&gt;&lt;td&gt;19／3&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;本財年&lt;/td&gt;&lt;td&gt;20.01&lt;/td&gt;&lt;td&gt;20.01&lt;/td&gt;&lt;td&gt;19.77&lt;/td&gt;&lt;td&gt;19.75&lt;/td&gt;&lt;td&gt;19.73&lt;/td&gt;&lt;td&gt;上修&lt;/td&gt;&lt;td&gt;1／0&lt;/td&gt;&lt;td&gt;25／3&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;下一財年&lt;/td&gt;&lt;td&gt;24.19&lt;/td&gt;&lt;td&gt;24.20&lt;/td&gt;&lt;td&gt;23.69&lt;/td&gt;&lt;td&gt;23.57&lt;/td&gt;&lt;td&gt;23.57&lt;/td&gt;&lt;td&gt;上修&lt;/td&gt;&lt;td&gt;2／0&lt;/td&gt;&lt;td&gt;25／3&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;分析師預估與券商目標價只描述，不當證據，也不是目標區間任一端；上修／下修門檻為較 30 天前變動 ±1%（本工具設定；與「市價溢價來源」預估修正以 90 天 ±2% 判持平是兩個口徑）。資料取得 2026-11-14T22:32:19（台北時間）（yfinance eps_trend、eps_revisions）。券商目標價近 90 天 23 家調整：上調 21、下調 0、持平 2；上季財報驚奇（Nasdaq）：Sep 2026，10/28/2026 公布，每股盈餘 4.89、共識 4.71、驚奇 3.82%；（yfinance）：2026-09-30，實際 4.89、預估 4.72072。兩個來源口徑可能不同（可能是調整後或一般會計準則）；公司申報的每股盈餘可對照存檔 8-K 2026-10-28 財報新聞稿（事件/8K事件.json），本工具未逐項比對，只描述，不比較、不當證據。每批另存快照自建歷史：1 筆（2026-11-14 至 2026-11-14）。&lt;/p&gt;&lt;/div&gt;&lt;!--/目標區間:附錄--&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;估值方法與參數&lt;/h3&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;方法&lt;/th&gt;&lt;th&gt;低&lt;/th&gt;&lt;th&gt;中&lt;/th&gt;&lt;th&gt;高&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;DCF 保守&lt;/td&gt;&lt;td&gt;158&lt;/td&gt;&lt;td&gt;188&lt;/td&gt;&lt;td&gt;231&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;DCF 基準&lt;/td&gt;&lt;td&gt;271&lt;/td&gt;&lt;td&gt;334&lt;/td&gt;&lt;td&gt;429&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;DCF 樂觀&lt;/td&gt;&lt;td&gt;437&lt;/td&gt;&lt;td&gt;553&lt;/td&gt;&lt;td&gt;735&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;同業本益比&lt;/td&gt;&lt;td&gt;296&lt;/td&gt;&lt;td&gt;355&lt;/td&gt;&lt;td&gt;483&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;同業企業價值／營業利益&lt;/td&gt;&lt;td&gt;429&lt;/td&gt;&lt;td&gt;481&lt;/td&gt;&lt;td&gt;494&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;同業企業價值／營收&lt;/td&gt;&lt;td&gt;220&lt;/td&gt;&lt;td&gt;312&lt;/td&gt;&lt;td&gt;328&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;同業 EV/自由現金流&lt;/td&gt;&lt;td&gt;100&lt;/td&gt;&lt;td&gt;147&lt;/td&gt;&lt;td&gt;499&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p style=&quot;font-size:14px&quot;&gt;折現率基準 10.2%（區間 8.9%–11.5%）：無風險利率 5.10%、市場風險溢價 4.20%、beta 1.25。DCF 為 15 年：前 5 年依情境，後 10 年成長與利潤率逐步回到永續水準。&lt;/p&gt;&lt;p style=&quot;font-size:14px&quot;&gt;同業：ORCL（企業軟體＋雲端基礎設施，同樣處於 AI 資料中心投資期；自由現金流為負，EV/FCF 不適用）, GOOGL（三大雲端之一（Google Cloud）＋生產力套件（Workspace）；EV/FCF 179 倍因資本支出高峰失真，僅並列）, CRM（企業 SaaS，與 Dynamics 365 競爭；方向性理由：CRM 排除 MSFT 是因業務組合過廣；MSFT 的 Dynamics 365 與 CRM 直接競爭，取其企業 SaaS 定價，單向可比）, ADBE（訂閱軟體，高毛利；方向性理由：ADBE 排除 MSFT 是因 MSFT 規模與業務組合大得多；MSFT 這邊只取 ADBE 作訂閱軟體高毛利的定價參考，單向可比）, NOW（企業工作流程 SaaS 與 AI 代理）, SAP（企業應用軟體，雲端轉型；IFRS 申報人，無法確認營業租賃，EV 倍數不適用（共用_租賃口徑.py），只列 P/E）。排除：AMZN：A 業務組合差距過大：營收以線上零售與第三方賣家服務為主，AWS 只占一部分，整體倍數反映零售, AAPL：C 經營模式不同（純硬體為主）：營收以 iPhone 等硬體為主。方向性理由：AAPL 把 MSFT 列為同業是取其大型科技與服務業務；MSFT 以軟體與雲端訂閱為主，反過來以硬體為主的 AAPL 定價不可比。&lt;/p&gt;&lt;p style=&quot;font-size:14px&quot;&gt;產業公版：穩定現金流／訂閱軟體；驗證狀態：已驗證兩家（ADBE 可用、CRM 有條件可用；2026-11-07 使用者核定，A 案重跑兩家通過後）；本公司尚未列入實例。&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;details id=&quot;wp-value&quot;&gt;&lt;summary&gt;價值判斷：PEG、林區資產負債表檢查與交叉檢查&lt;/summary&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;PEG 與林區檢查&lt;/h3&gt;&lt;div class=&quot;wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;PEG：可計算的成長口徑（紅線為 1 與 2）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 500 102&quot; role=&quot;img&quot; aria-label=&quot;PEG&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;168.0&quot; x2=&quot;168.0&quot; y1=&quot;6&quot; y2=&quot;96&quot; class=&quot;zero&quot;/&gt;&lt;line x1=&quot;266.5&quot; x2=&quot;266.5&quot; y1=&quot;4&quot; y2=&quot;98&quot; class=&quot;price&quot;/&gt;&lt;line x1=&quot;365.0&quot; x2=&quot;365.0&quot; y1=&quot;4&quot; y2=&quot;98&quot; class=&quot;price&quot;/&gt;&lt;text x=&quot;158&quot; y=&quot;23&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;過去三年 EPS 年增&lt;/text&gt;&lt;rect x=&quot;168.0&quot; y=&quot;9&quot; width=&quot;125.9&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;301.9&quot; y=&quot;23&quot; class=&quot;val&quot;&gt;1.3&lt;/text&gt;&lt;text x=&quot;158&quot; y=&quot;63&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;基準情境推估&lt;/text&gt;&lt;rect x=&quot;168.0&quot; y=&quot;49&quot; width=&quot;249.1&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;425.1&quot; y=&quot;63&quot; class=&quot;val&quot;&gt;2.5&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;PEG 與林區加股利比率（可計算的成長口徑）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;成長口徑&lt;/th&gt;&lt;th&gt;成長率&lt;/th&gt;&lt;th&gt;PEG&lt;/th&gt;&lt;th&gt;判讀&lt;/th&gt;&lt;th&gt;加股利比率&lt;/th&gt;&lt;th&gt;判讀&lt;/th&gt;&lt;th&gt;加股東收益率比率（現代延伸）&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;過去三年 EPS 年增&lt;/td&gt;&lt;td&gt;22.9%&lt;/td&gt;&lt;td&gt;1.3&lt;/td&gt;&lt;td&gt;合理&lt;/td&gt;&lt;td&gt;0.81&lt;/td&gt;&lt;td&gt;差&lt;/td&gt;&lt;td&gt;0.81&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準情境推估（稅後營業利益年增－股數年變化）&lt;/td&gt;&lt;td&gt;11.6%&lt;/td&gt;&lt;td&gt;2.5&lt;/td&gt;&lt;td&gt;偏貴&lt;/td&gt;&lt;td&gt;0.42&lt;/td&gt;&lt;td&gt;差&lt;/td&gt;&lt;td&gt;0.43&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;加股東收益率比率＝（成長率＋股利殖利率＋淨回購殖利率）÷本益比，把回購也算進股東回饋、並扣掉發給員工的股票；這是現代延伸，不是林區原版，也沒有政策門檻，只列數字。 PEG 用的每股盈餘 17.93 美元：PEG 所用 EPS 可能排除股權薪酬，PEG 會偏低；成長率須與同口徑 EPS 一致（修正03、10）（近四季淨利每股 19.14、每股股權薪酬 1.69）。&lt;/p&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:4px&quot;&gt;PEG 的判讀標籤依估值政策門檻；高風險、成長極高或極低的公司，PEG 有系統性偏誤（同樣成長下風險越高 PEG 越低），不能只憑標籤判斷便宜或昂貴。&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;林區式資產負債表與市場檢查&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;數值&lt;/th&gt;&lt;th&gt;林區的看法&lt;/th&gt;&lt;th&gt;判讀&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;本益比&lt;/td&gt;&lt;td&gt;29.22&lt;/td&gt;&lt;td&gt;與自身歷史比較&lt;/td&gt;&lt;td&gt;資料限制：歷史第 21% 百分位是用申報 EPS（27.4 倍）算的，扣非經常 EPS 為 29.2 倍、口徑較貴，不能據此說相對歷史便宜&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;每股淨現金&lt;/td&gt;&lt;td&gt;8.98&lt;/td&gt;&lt;td&gt;淨現金可提供下檔保護（林區 O31、LAK02）&lt;/td&gt;&lt;td&gt;好：有淨現金，可提供下檔保護；占股價 1.7%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;負債對權益&lt;/td&gt;&lt;td&gt;0.08&lt;/td&gt;&lt;td&gt;一般越低越好（林區 L25）&lt;/td&gt;&lt;td&gt;不評好壞：有息負債約為股東權益的 0.08 倍；沒有公認門檻，償債能力見收現段償債指標&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;每股自由現金流（近四季）&lt;/td&gt;&lt;td&gt;8.05&lt;/td&gt;&lt;td&gt;比每股盈餘更接近現金（林區 O37、修正10）&lt;/td&gt;&lt;td&gt;不評好壞：自由現金流殖利率 1.5%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股數年變化（近三財年）&lt;/td&gt;&lt;td&gt;-0.1%&lt;/td&gt;&lt;td&gt;持續買回、且價格合理、資金來自本業現金時才是好訊號（林區 L16、O19）&lt;/td&gt;&lt;td&gt;好：近三財年平均每年 -0.1%；最近一季對去年同季 -0.3%（2025-09-30→2026-09-30）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;存貨增速 vs 營收增速&lt;/td&gt;&lt;td&gt;62%&lt;/td&gt;&lt;td&gt;存貨增速高於營收是警訊（林區 O50）&lt;/td&gt;&lt;td&gt;注意：存貨 +62%（2025-09-30→2026-09-30）vs 營收 +18%（近四季對前四季，各截至 2026-09-30、2025-09-30）：警訊，須查原因&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;內部人公開市場買進&lt;/td&gt;&lt;td&gt;0&lt;/td&gt;&lt;td&gt;內部人自掏腰包買進是強訊號&lt;/td&gt;&lt;td&gt;中性：近期無人買進；賣出原因多，訊號較弱&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;林區以外的交叉檢查（只揭露，不改研究評等與價格位置）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;檢查&lt;/th&gt;&lt;th&gt;結果&lt;/th&gt;&lt;th&gt;判讀&lt;/th&gt;&lt;th&gt;依據與限制&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Piotroski F 分數（財報是否在改善）&lt;/td&gt;&lt;td&gt;5 ／ 8 項（2025-06-30→2026-06-30）&lt;/td&gt;&lt;td&gt;中&lt;/td&gt;&lt;td&gt;未通過：毛利率比上年高、資產周轉率比上年高（營收 ÷ 期初總資產）、流動比率比上年高。Piotroski（2000）研究文獻/Piotroski2000_財報訊號.json 第 9–11、15 頁；8–9 分高分組、0–2 分低分組&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Beneish M 分數（盈餘被美化的機率）&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;不適用&lt;/td&gt;&lt;td&gt;缺 折舊攤銷、銷管費用&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Greenblatt 盈餘殖利率與資本報酬率&lt;/td&gt;&lt;td&gt;盈餘殖利率 4.3%；ROIC 53%&lt;/td&gt;&lt;td&gt;低於 10 年公債 5.1%；ROIC 53% 高於 WACC 10.2%&lt;/td&gt;&lt;td&gt;盈餘殖利率＝近四季營業利益 ÷（市值＋有息負債－現金與證券），推導；ROIC 為本專案稅後口徑，非 Greenblatt 原式稅前；不做排名&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;details id=&quot;wp-6&quot;&gt;&lt;summary&gt;6 財務：償債指標、融資活動、存活檢查與利率壓力測試（含判定規則與限制）&lt;/summary&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;融資活動與償債：錢還給誰、有沒有借錢、還不還得起&lt;/h3&gt;&lt;p class=&quot;cap&quot;&gt;利息保障改讀信用與存活的利息口徑（EBIT ÷ 近四季利息費用：us-gaap:InterestExpenseNonoperating，年度＋本期年初至今－去年同期；本機 SEC 事實），底稿的利息費用科目未對應。&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;償債能力指標（利息保障依 Damodaran 合成評等對照；其他沒有公認門檻，只寫事實）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;指標&lt;/th&gt;&lt;th&gt;數值&lt;/th&gt;&lt;th&gt;判讀&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;EBIT ÷ 利息費用&lt;/td&gt;&lt;td&gt;50.63&lt;/td&gt;&lt;td&gt;相當於 AAA 級：EBIT 是利息費用的 50.6 倍；依 Damodaran 合成評等大型公司對照表（2026 年 1 月；市值 39,008.1 億美元，在 50 億美元以上）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;（營運現金流＋實付利息）÷ 實付利息&lt;/td&gt;&lt;td&gt;未取得&lt;/td&gt;&lt;td&gt;資料限制：用實際現金算的付息能力無法計算（實付利息未取得：附註未申報此項或科目未對應）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;有息負債 ÷ EBITDA&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;資料限制：EBITDA 為負或缺，不算倍數&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;淨負債 ÷ EBITDA&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;資料限制：EBITDA 為負或缺，不算倍數&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;營運現金流 ÷ 有息負債&lt;/td&gt;&lt;td&gt;552.1%&lt;/td&gt;&lt;td&gt;不評好壞：一年的營運現金流約可還掉 552% 的有息負債（約 0.2 年還清）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;現金與證券 ÷ 一年內到期債務&lt;/td&gt;&lt;td&gt;23.30&lt;/td&gt;&lt;td&gt;不評好壞：現金與證券是一年內到期債務的 23.3 倍（已核對：10-Q 2026-09-30 Note 9 流動部分 4,391；資產負債表有息負債 35,481 與債務表合計相符）&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;可用授信與到期（作者判讀，融資償債判讀.json）：10-Q 未揭露循環信貸額度；債務面額 41,269（9/30/2026），一年內到期 4,391（帳面）&lt;/p&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;借款用途（研究判讀）：無法判定（公司只寫一般企業用途；近四季只有償債，期後 2026-11-04 發行 250 億美元新債，8-K 未載用途）；期間 FY2026 全年與 FY2027 Q1；缺口：公司未指定發債對應的特定用途；近四季現金流量表無債務發行列；期後 2026-11-04 新債的 8-K 未載用途；依據：10-Q 2026-09-30 Part I, Item 2 ¶121、10-Q 2026-09-30 Part I, Item 2 ¶119、10-K 2026-06-30 Item 8 ¶11、8-K 2026-11-04 本文 §3&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;survival-detail&quot;&gt;&lt;h3&gt;存活檢查：現金對債務（12～24 個月，推導，非違約預測）&lt;/h3&gt;&lt;p style=&quot;margin:0 0 6px&quot;&gt;&lt;b&gt;信用評級&lt;/b&gt;　機構 未揭露（10-K、10-Q、8-K、SEC 全文搜尋 查無 S&amp;amp;P、Moody&amp;#x27;s、Fitch、KBRA 評級）／推導 AAA（Damodaran 合成評等，利息保障 50.6 倍，推導）｜依推導：投資等級（BBB-／Baa3 以上）&lt;/p&gt;&lt;p style=&quot;margin:0 0 6px&quot;&gt;&lt;b&gt;存活檢查（完整理由）&lt;/b&gt;　無明顯警訊（推導，非違約預測）：現金與流動證券 645 億美元，一年內到期債務 44 億美元（另利息 32 億美元），可付 8.5 倍（含非流動投資為 13.4 倍）；現金與流動證券 645 億美元，兩年內到期債務 92 億美元（另利息 64 億美元），可付 4.1 倍（含非流動投資為 6.5 倍）；利息保障 50.6 倍；會計師未提出繼續經營疑慮。&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;燈號：無明顯警訊（一般公司：現金對債務；資料截至 2026-09-30，收盤日 2026-11-13）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;判定&lt;/th&gt;&lt;th&gt;內容與出處&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;會計師繼續經營疑慮&lt;/td&gt;&lt;td&gt;無明顯警訊&lt;/td&gt;&lt;td&gt;會計師與管理層未提出繼續經營疑慮（掃描 10-Q 2026-09-30、10-K 2026-06-30）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;流動性：12 個月&lt;/td&gt;&lt;td&gt;無明顯警訊&lt;/td&gt;&lt;td&gt;現金與流動證券 64,509.0（未動用信貸未取得，未計入），一年內到期本金 4,391.0，加利息 3,223.0，可付 8.5 倍（含非流動投資為 13.4 倍）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;流動性：24 個月&lt;/td&gt;&lt;td&gt;無明顯警訊&lt;/td&gt;&lt;td&gt;現金與流動證券 64,509.0（未動用信貸未取得，未計入），兩年內到期本金 9,250.0，加利息 6,446.0，可付 4.1 倍（含非流動投資為 6.5 倍）；跨窗口的到期桶 第3年 2,001.0（2028-06-30～2029-06-30） 未計入，到期月份看債務附註&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;利息保障&lt;/td&gt;&lt;td&gt;無明顯警訊&lt;/td&gt;&lt;td&gt;利息保障 50.6 倍&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Altman Z 分數&lt;/td&gt;&lt;td&gt;輔助（不改燈號）&lt;/td&gt;&lt;td&gt;Altman Z 9.40（安全區，只當輔助）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;回饋股東對自由現金流&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;近四季回購加股利 480 億美元，未超過自由現金流 600 億美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;信用評級（機構）&lt;/td&gt;&lt;td&gt;未揭露&lt;/td&gt;&lt;td&gt;公司申報查無 S&amp;amp;P、Moody&amp;#x27;s、Fitch、KBRA 評級&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;信用評級（推導）&lt;/td&gt;&lt;td&gt;投資等級&lt;/td&gt;&lt;td&gt;AAA：Damodaran 合成評等 2026 年 1 月（大型公司表），利息保障 50.6 倍（EBIT ÷ 近四季利息費用（us-gaap:InterestExpenseNonoperating，年度＋本期年初至今－去年同期；本機 SEC 事實））&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;債券市場參考&lt;/td&gt;&lt;td&gt;AAA 級&lt;/td&gt;&lt;td&gt;ICE BofA 公司債選擇權調整利差：投資等級整體 0.89 個百分點（2026-11-12，FRED BAMLC0A0CM）；BBB 級 1.11 個百分點（2026-11-12，FRED BAMLC0A4CBBB）；投機等級整體 3.20 個百分點（2026-11-12，FRED BAMLH0A0HYM2）；AAA 級 0.45 個百分點（2026-11-12，FRED BAMLC0A1CAAA）；個別債券殖利率與價格未取得（TRACE／FINRA 不在固定來源）&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;債務到期年度桶（10-K 2026-06-30，資料日 2026-06-30），桶結束日落在窗口內才計入；一年內取與資產負債表一年內到期債務較大者；12 個月改用較新申報 10-Q 2026-09-30 的未來 12 個月到期 0.0（24 個月仍用 10-K 2026-06-30 整份到期表：較新申報只更新部分年度，不拼湊）；利息口徑：近四季利息費用（us-gaap:InterestExpenseNonoperating，年度＋本期年初至今－去年同期；本機 SEC 事實）（出處：期間 2025-07-01～2026-06-30、2026-07-01～2026-09-30、2025-07-01～2025-09-30；申報 10-K 2026-07-29（0001193125-26-323660）、10-Q 2026-10-28（0001193125-26-436133））；未動用信貸：未取得（信用揭露.json 未填；不計入）&lt;/p&gt;&lt;h3 style=&quot;margin-top:14px&quot;&gt;利率壓力測試（固定情境：利率上升 1、2 個百分點與下降 1 個百分點，不預測聯準會；推導）&lt;/h3&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;單位百萬美元；狀態：已試算&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;浮動利率債利息變動&lt;/th&gt;&lt;th&gt;再融資利息變動&lt;/th&gt;&lt;th&gt;壓力後一年利息&lt;/th&gt;&lt;th&gt;利息保障&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;目前利率（只算再融資）&lt;/td&gt;&lt;td&gt;0.0&lt;/td&gt;&lt;td&gt;-326.9&lt;/td&gt;&lt;td&gt;2,896.1&lt;/td&gt;&lt;td&gt;56.4 倍&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;+1 個百分點&lt;/td&gt;&lt;td&gt;20.0&lt;/td&gt;&lt;td&gt;-234.4&lt;/td&gt;&lt;td&gt;3,008.6&lt;/td&gt;&lt;td&gt;54.2 倍&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;+2 個百分點&lt;/td&gt;&lt;td&gt;40.0&lt;/td&gt;&lt;td&gt;-141.9&lt;/td&gt;&lt;td&gt;3,121.1&lt;/td&gt;&lt;td&gt;52.3 倍&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;−1 個百分點&lt;/td&gt;&lt;td&gt;-20.0&lt;/td&gt;&lt;td&gt;-419.4&lt;/td&gt;&lt;td&gt;2,783.6&lt;/td&gt;&lt;td&gt;58.6 倍&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;目前利率：聯邦基金利率 3.88%（2026-11-12，FRED DFF）、SOFR 3.90%（2026-11-12，FRED SOFR）、十年期公債 5.10%（2026-11-12，FRED DGS10）；浮動利率債 2,000.0，占總債務 6%（8-K 2026-11-04 本文 §3、§127、§131；2026-09-30 債務表各批皆為固定票面，10-K 2026-06-30 Item 8 ¶198 票面 1.35%–5.30%，浮動利率債為期後 2026-11-04 發行的 2,000，Compounded SOFR 加 0.35%／0.53%；壓力測試以收盤日已存在的浮動利率債計，未扣避險。）；兩年內到期須再融資本金 9,250.0，原票面 9.08%（目前平均利率 9.08%（一年利息÷有息負債，推導）），再融資利率 5.55%（10 年期公債 5.10%（2026-11-12）＋ AAA 級 OAS 0.45 個百分點（推導評級），推導）；利息保障基準：利息保障（EBIT÷一年利息），目前 50.6 倍；利率上升 2 個百分點（+200bp，bp＝基點，100bp＝1 個百分點）後低於 1.5 倍才在燈號理由加一條（不改燈號、不改研究評等）；通膨、物價、消費者等間接影響不在此表&lt;/p&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;&lt;a href=&quot;#survival-rules&quot;&gt;判定規則與限制見本節下方&lt;/a&gt;（寫死在程式，不改研究評等）。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;survival-rules&quot;&gt;&lt;h3&gt;存活檢查與利率壓力測試：判定規則與限制&lt;/h3&gt;&lt;p class=&quot;cap&quot;&gt;規則版本：v1.1（2026-11-03 第二輪：加 KBRA、利率壓力測試、首頁精簡；仍只顯示提示、不改研究評等）&lt;/p&gt;&lt;ul class=&quot;cap&quot;&gt;&lt;li&gt;總燈號：各項取最嚴重：任一高風險→高風險；否則任一需留意→需留意；12 個月流動性或繼續經營無法判定→資料不足；其餘→無明顯警訊。Z 分數與推導評級只列理由、不改燈號。&lt;/li&gt;&lt;li&gt;繼續經營：最新年報或其後季報出現會計師或管理層「substantial doubt … going concern」肯定句 → 高風險（否定句、假設句只列出不計）；只出現在前一份年報 → 需留意&lt;/li&gt;&lt;li&gt;流動性_12個月：現金與證券＋未動用信貸 ≥ 一年內到期本金＋一年利息 → 無明顯警訊；不足但加近四季自由現金流（已扣實付利息）後 ≥ 一年內到期本金 → 需留意；仍不足 → 高風險&lt;/li&gt;&lt;li&gt;流動性_24個月：同上改兩年（本金、利息、自由現金流各計兩年）；不足但加兩年自由現金流 ≥ 本金的 50% → 需留意；更低 → 高風險&lt;/li&gt;&lt;li&gt;燒錢：近四季自由現金流為負：現金還能燒幾個月＝（現金與證券＋未動用信貸－一年內到期本金）÷ 每月燒錢；&amp;lt;12 個月 高風險、12～24 個月 需留意&lt;/li&gt;&lt;li&gt;利息保障：EBIT ÷ 利息費用 &amp;lt; 1.5 倍 → 需留意&lt;/li&gt;&lt;li&gt;契約：作者自 信用揭露.json 填公司揭露的契約門檻與實際值：已違反 → 高風險；餘裕 &amp;lt; 15% → 需留意；未揭露不判&lt;/li&gt;&lt;li&gt;信用評級：機構評級（S&amp;amp;P、Moody&amp;#x27;s、Fitch、KBRA，取各機構最新、以最低者判等級）低於 BBB-／Baa3 → 需留意；只有推導評級為投機等級 → 只列理由&lt;/li&gt;&lt;li&gt;利率壓力測試：固定情境 +100bp／+200bp／-100bp（不預測聯準會）：利息增加＝浮動利率債×利率變動（作者填 Item 7A 每 100bp 利息變動時改用該值）＋兩年內到期本金×（再融資利率＋利率變動－原票面利率）；再融資利率＝收盤日 10 年期公債殖利率＋該評級 ICE BofA OAS（推導）；壓力後利息保障＝EBIT÷（一年利息＋利息增加），EBIT 分母異常時改用現金利息保障。+200bp 後低於 1.5 倍 → 理由加一條、首頁也加（只列理由、不改燈號）；浮動利率債未揭露或未填 → 該情境未取得；金融業不套&lt;/li&gt;&lt;li&gt;金融業：銀行券商、保險不套現金對債務：研究評等輸入 監理紅線 低於門檻 → 高風險；高於門檻不到 20%（相對）→ 需留意；未填 → 資料不足&lt;/li&gt;&lt;/ul&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;使用限制&lt;/p&gt;&lt;ul class=&quot;cap&quot;&gt;&lt;li&gt;推導，非違約預測：燈號只看 12～24 個月付不付得出錢與已揭露的警訊，不是違約機率，也不改研究評等（第一版）。&lt;/li&gt;&lt;li&gt;Altman Z 分數會誤判兩類公司：權益為負（如舉債回購）與保留盈餘因長期回購或股利變負，所以只當輔助、不單獨下結論、不改燈號。&lt;/li&gt;&lt;li&gt;金融業（銀行券商、保險）的存款與保單負債是營業資金，改看監理資本（如 CET1），不套現金對債務。&lt;/li&gt;&lt;li&gt;超過 2～3 年的到期與再融資風險留在正文債務到期表，不進燈號。&lt;/li&gt;&lt;li&gt;到期年度桶以到期表資料日（年報）起算：桶的結束日落在窗口內才計入；跨窗口的桶另列，若作者在 信用揭露.json 填了近期到期明細就改用明細。&lt;/li&gt;&lt;li&gt;個別債券價格與殖利率（TRACE／FINRA）不在固定來源：未取得；市場參考只用 FRED 的 ICE BofA 各評級公司債利差（大盤層級）。&lt;/li&gt;&lt;li&gt;機構評級只認公司自己在 SEC 申報寫出的 S&amp;amp;P、Moody&amp;#x27;s、Fitch、KBRA 評級並附原句；沒揭露寫未揭露，不從新聞或記憶補。&lt;/li&gt;&lt;li&gt;利率壓力測試只用固定情境（+100bp、+200bp、−100bp），不預測聯準會；以 10 年期公債估再融資成本，實際年期與擔保結構不同會有誤差；浮動利率債若也在兩年內到期會重複計算（偏保守）；通膨、物價、消費者等間接影響不進燈號；金融業不套，維持看資本適足率。&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/details&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;more&quot; data-layer=&quot;附錄&quot;&gt;&lt;div class=&quot;qno&quot;&gt;附錄&lt;/div&gt;&lt;h2&gt;附錄：估值細節、論點檢查、名詞、表格與資料來源（預設摺疊）&lt;/h2&gt;&lt;details id=&quot;valdetail&quot;&gt;&lt;summary&gt;估值細節：利率、同業與產業對照、券商目標價&lt;/summary&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;利率的影響：公債殖利率變動與股債利差&lt;/h3&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;10 年期公債殖利率 5.10%（2026-11-12，FRED），折現率 10.2%。&lt;/strong&gt;公債殖利率下降 1 個百分點，合理價值中點從約 352 升到約 424；上升 1 個百分點則降到約 299（估值結果.json#/利率敏感度）。白話：股票的推算年報酬約 8%，比公債多不到 3 個百分點，對股票風險的補償偏薄。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;grid2 wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;公債殖利率每變動 1 個百分點，合理價值中點的變化（美元；紅色虛線為現價 523.88）&lt;/p&gt;&lt;svg viewBox=&qu 名目利率對實質盈餘有方法限制，不影響估值與研究評等。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;同業與產業對照&lt;/h3&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;與個別同業比較&lt;/h4&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;營業利益率微軟 47.1%（MSFT，資料商 yfinance，近四季截至 2026-09-30），高於 Oracle（甲骨文，資料庫與雲端公司）34.2%（ORCL，資料商 yfinance，近四季截至 2026-08-31）、Adobe（創意與文件軟體公司）35.7%（ADBE，資料商 yfinance，近四季截至 2026-08-31）、Salesforce（客戶管理雲端軟體公司）21.5%（CRM，資料商 yfinance，近四季截至 2026-07-31）。&lt;/strong&gt;同業今日 EV/EBIT（企業價值對營業利益倍數）中位約 22 倍，與微軟現在 23.9 倍（EV／營業利益，主尺；分母近四季營業利益 2025-12-31～2026-09-30、模型股權橋企業價值；收盤 2026-11-13） 相近；同業倍數只作交叉核對，不進評等（估值結果.json#/同業倍數明細）。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;與個別同業比較：利潤率與投入強度（近四季）。資料期間：本公司 SEC 近四季（截至 2026-09-30）；同業為資料商（yfinance 季報加總）近四季，截至 ORCL 2026-08-31、GOOGL 2026-09-30、CRM 2026-07-31、ADBE 2026-08-31＊、NOW 2026-09-30、SAP 2026-09-30、AMZN 2026-09-30、AAPL 2026-09-30＊；＊資料商「營收年增」是最新單季對去年同季（不是近四季），最新一季截止日與近四季不同；資料商查詢 2026-11-14（批次收盤 2026-11-13）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 300&quot; role=&quot;img&quot; aria-label=&quot;同業比較&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;266.0&quot; y2=&quot;266.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;270.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;0%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;185.3&quot; y2=&quot;185.3&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;189.3&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;50%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;104.7&quot; y2=&quot;104.7&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;108.7&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;100%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;24.0&quot; y2=&quot;24.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&q
