0&quot; class=&quot;vl s&quot; text-anchor=&quot;start&quot; fill=&quot;var(--pos)&quot;&gt;+0.6 點&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;lg&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--neg)&quot;&gt;&lt;/i&gt;亮燈&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--pos)&quot;&gt;&lt;/i&gt;未亮&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--neg)&quot;&gt;&lt;/i&gt;亮燈門檻（虛線）&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;G4 另有條件「營收近四季年增低於一年前」，兩個條件都成立才亮燈（目前未亮）。&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;每列一個用財報數字算的訊號：點是目前值，虛線是門檻，點落進淡紅色帶就亮燈；看離門檻還有多少餘裕。是非題型訊號（如連續放緩）不在此圖，見上方燈號。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估.json#/內容/卡住訊號（值、門檻、比較）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;div class=&quot;sub-h&quot;&gt;機械訊號（財報數字算得出）&lt;/div&gt;&lt;div class=&quot;cards&quot;&gt;&lt;div class=&quot;card sig&quot; id=&quot;sig-G1&quot; style=&quot;--tc:var(--lt-亮燈, var(--muted))&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;G1　營收增速連續放緩&lt;/b&gt;&lt;span class=&quot;light l-亮燈&quot;&gt;亮燈&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;成長是不是一季比一季慢？&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;值&lt;/div&gt;&lt;div class=&quot;sv&quot;&gt;是&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;機械值，期末 2026-08-31；門檻  &lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;判讀&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;單季營收年增 0.6%、0.1%、−1.1%、−4.3%，最近三季逐季下降。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src46&quot;&gt;[46]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;這是真實放緩，不是口徑因素：大中華區（−26%）、Converse（−28%）與 EMEA 直營（−12%）同時走弱，公司指引全年再衰退高個位數，計分採用。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src4&quot;&gt;[4]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src5&quot;&gt;[5]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src47&quot;&gt;[47]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src2&quot;&gt;[2]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card sig&quot; id=&quot;sig-G2&quot; style=&quot;--tc:var(--lt-資料未取得, var(--muted))&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;G2　營業利益率走弱&lt;/b&gt;&lt;span class=&quot;light l-資料未取得&quot;&gt;資料未取得&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;規模變大，利潤率有沒有跟著變好？&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;值&lt;/div&gt;&lt;div class=&quot;sv&quot;&gt;—&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;機械值，期末 2026-08-31；門檻 &amp;lt; -1.0 個百分點&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;判讀&lt;/div&gt;&lt;div&gt;近四季營業利益率減一年前的近四季&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;工具取不到 Nike 的季度營業利益（底稿值為空），所以這條是「資料未取得」；改用財務歷史推導：近四季營業利益率 8.2%，一年前 7.4%（推算）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src48&quot;&gt;[48]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src35&quot;&gt;[35]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src36&quot;&gt;[36]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;表面上利潤率升 0.8 個百分點，但含 9.86 億美元一次性關稅退款；扣除後約 6.0%，比一年前低約 1.4 個百分點，超過這條 −1 個百分點的門檻。實質上應視為亮燈，這個判斷併入卡點風險分數。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src37&quot;&gt;[37]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src35&quot;&gt;[35]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card sig&quot; id=&quot;sig-G3&quot; style=&quot;--tc:var(--lt-未亮, var(--muted))&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;G3　收款變慢&lt;/b&gt;&lt;span class=&quot;light l-未亮&quot;&gt;未亮&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;營收成長是不是靠放寬收款條件？&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;值&lt;/div&gt;&lt;div class=&quot;sv&quot;&gt;+6.8 個百分點&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;機械值，期末 2026-08-31；門檻 &amp;gt; +10.0 個百分點&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;判讀&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card sig&quot; id=&quot;sig-G4&quot; style=&quot;--tc:var(--lt-未亮, var(--muted))&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;G4　投入換不到成長&lt;/b&gt;&lt;span class=&quot;light l-未亮&quot;&gt;未亮&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;資本支出加大，營收增速有沒有跟上？&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;值&lt;/div&gt;&lt;div class=&quot;sv&quot;&gt;+0.4 個百分點&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;機械值，期末 2026-08-31；門檻 &amp;gt; +1.0 個百分點；且 營收近四季年增低於一年前&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;判讀&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card sig&quot; id=&quot;sig-B1&quot; style=&quot;--tc:var(--lt-未亮, var(--muted))&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;B1　存貨堆積&lt;/b&gt;&lt;span class=&quot;light l-未亮&quot;&gt;未亮&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;存貨是不是比營收長得快？&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;值&lt;/div&gt;&lt;div class=&quot;sv&quot;&gt;-2.1 個百分點&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;機械值，期末 2026-08-31；門檻 &amp;gt; +5.0 個百分點&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;判讀&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card sig&quot; id=&quot;sig-B2&quot; style=&quot;--tc:var(--lt-未亮, var(--muted))&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;B2　毛利率走弱&lt;/b&gt;&lt;span class=&quot;light l-未亮&quot;&gt;未亮&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;是不是靠折扣換營收？&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;值&lt;/div&gt;&lt;div class=&quot;sv&quot;&gt;+0.6 個百分點&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;機械值，期末 2026-08-31；門檻 &amp;lt; -1.0 個百分點&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;判讀&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;第一季毛利率 42.8%，年增 60 個基點，主要來自倉儲物流成本下降（約 +90 個基點）；折扣與通路組合使單價拖累約 30 個基點。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src49&quot;&gt;[49]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src50&quot;&gt;[50]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src51&quot;&gt;[51]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card sig&quot; id=&quot;sig-B4&quot; style=&quot;--tc:var(--lt-未亮, var(--muted))&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;B4　業務費用效率變差&lt;/b&gt;&lt;span class=&quot;light l-未亮&quot;&gt;未亮&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;行銷支出有沒有變沒效率？&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;值&lt;/div&gt;&lt;div class=&quot;sv&quot;&gt;+0.6 個百分點&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;機械值，期末 2026-08-31；門檻 &amp;gt; +1.0 個百分點&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;判讀&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub-h&quot;&gt;作者訊號（財報數字看不出，作者讀原文判斷）&lt;/div&gt;&lt;div class=&quot;cards&quot;&gt;&lt;div class=&quot;card sig&quot; id=&quot;sig-B3&quot; style=&quot;--tc:var(--lt-亮燈, var(--muted))&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;B3　通路庫存或批發訂單轉弱&lt;/b&gt;&lt;span class=&quot;light l-亮燈&quot;&gt;亮燈&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;下游還在補貨嗎？&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;值&lt;/div&gt;&lt;div class=&quot;sv&quot;&gt;公司未揭露期貨訂單或通路庫存數字；大中華區批發 −31%、市場庫存偏高，Converse 批發 −25%，北美批發 +9%&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;作者從原文填&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;判讀&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;公司說明有期貨訂單計畫，但 10-K 與 10-Q 沒有揭露期貨訂單金額。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src11&quot;&gt;[11]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;10-K 寫大中華區來客減少、促銷升高，整個市場的庫存水準偏高；第一季大中華區批發 −31%、Converse 批發 −25%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src44&quot;&gt;[44]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src4&quot;&gt;[4]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src52&quot;&gt;[52]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;北美批發仍在補貨，但合計約占 2026 財年營收 15% 的大中華區與 Converse 通路明顯在去庫存（推算），且全年指引衰退，從嚴亮燈；北美與大中華區批發轉向時重判。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src3&quot;&gt;[3]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src44&quot;&gt;[44]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src2&quot;&gt;[2]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src21&quot;&gt;[21]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src7&quot;&gt;[7]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;h3 id=&quot;ext&quot;&gt;外部驗證：競爭者、客戶、供應商怎麼描述這家公司&lt;/h3&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;外部驗證：誰支持、誰反駁&lt;/figcaption&gt;&lt;div class=&quot;emx&quot; style=&quot;grid-template-columns:repeat(3,1fr)&quot;&gt;&lt;div class=&quot;emc&quot; style=&quot;--tc:var(--pos)&quot;&gt;&lt;div class=&quot;emh&quot;&gt;支持 &lt;b&gt;2&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;emi&quot;&gt;&lt;b&gt;Dick&amp;#x27;s Sporting Goods&lt;/b&gt;&lt;span&gt;客戶（批發通路）&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;emi&quot;&gt;&lt;b&gt;Under Armour&lt;/b&gt;&lt;span&gt;競爭者&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;emc&quot; style=&quot;--tc:var(--warn)&quot;&gt;&lt;div class=&quot;emh&quot;&gt;部分支持 &lt;b&gt;1&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;emi&quot;&gt;&lt;b&gt;Shoe Carnival&lt;/b&gt;&lt;span&gt;客戶（批發通路）&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;emc&quot; style=&quot;--tc:var(--neg)&quot;&gt;&lt;div class=&quot;emh&quot;&gt;反駁 &lt;b&gt;1&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;emi&quot;&gt;&lt;b&gt;中國本土品牌（CNBC 報導）&lt;/b&gt;&lt;span&gt;競爭者&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;4 個外部來源（競爭者、客戶、供應商、夥伴的申報或報導）怎麼描述本公司：支持 2、部分支持 1、反駁 1。依「對本公司說法」欄的開頭分類。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估.json#/內容/外部驗證（對方、關係、支持）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;div class=&quot;cards&quot;&gt;&lt;div class=&quot;card ext&quot; style=&quot;--tc:var(--pos)&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;Dick&amp;#x27;s Sporting Goods&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;客戶（批發通路）&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;對方文件怎麼說&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;Dick&amp;#x27;s 10-K 寫 2025 財年向約 1,500 家供應商採購，Nike 是最大供應商，約占合併商品採購的 31%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src10&quot;&gt;[10]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對本公司說法&lt;/div&gt;&lt;div class=&quot;stc&quot;&gt;支持（Dick&amp;#x27;s 一家約 31% 的商品採購來自 Nike，代表至少這家美國大型運動零售商的貨架依賴 Nike；其他零售商的比例未揭露）&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card ext&quot; style=&quot;--tc:var(--warn)&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;Shoe Carnival&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;客戶（批發通路）&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;對方文件怎麼說&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;Shoe Carnival 10-K 寫 Nike、Skechers、Crocs 三家合計占其淨銷售約 46%（2025 財年）、48%（2024 財年）、45%（2023 財年），列為業務風險。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src53&quot;&gt;[53]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對本公司說法&lt;/div&gt;&lt;div class=&quot;stc&quot;&gt;部分支持（通路依賴主要品牌，但這個比例是三家合計，看不出 Nike 單獨占比）&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card ext&quot; style=&quot;--tc:var(--pos)&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;Under Armour&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;競爭者&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;對方文件怎麼說&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;Under Armour 10-K 把 NIKE、adidas、PUMA、lululemon 列為直接競爭者，形容它們是全球品牌知名度強、部分資源遠大於自己的大型品牌。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src54&quot;&gt;[54]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對本公司說法&lt;/div&gt;&lt;div class=&quot;stc&quot;&gt;支持（競爭者承認 Nike 的品牌與資源規模）&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card ext&quot; style=&quot;--tc:var(--neg)&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;中國本土品牌（CNBC 報導）&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;競爭者&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;對方文件怎麼說&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;CNBC 報導 Nike 大中華區營收連續八季年減、較 2021 年縮水約三成，而同期中國運動服市場五年擴大 51%（GlobalData），本土品牌與國潮搶走年輕消費者。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src55&quot;&gt;[55]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src56&quot;&gt;[56]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對本公司說法&lt;/div&gt;&lt;div class=&quot;stc&quot;&gt;反駁（市場在成長、Nike 卻在縮，品牌優勢在大中華區沒有守住）&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;sa&quot;&gt;&lt;h2&gt;4　優勢來源與持續期間&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;每種優勢都要同時有「好處」與「屏障」證據（Helmer《7 Powers》的檢驗）：只有好處、沒有屏障的優勢只算&lt;b&gt;暫時領先&lt;/b&gt;。再分兩維：超額報酬有多大、能撐多久（Mauboussin《Measuring the Moat》的問法）；Morningstar 五種來源只當分類參考。本節只談商業面的屏障，不含價格或估值，也不是估值報告的護城河評分，不進商業動能等級。&lt;/p&gt;&lt;div class=&quot;callout&quot;&gt;&lt;b&gt;總結&lt;/b&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;Nike 的優勢是品牌與行銷規模，屏障（商標、代言承諾）有申報證據、Dick&amp;#x27;s 一家約 31% 的採購依賴也有對方申報；但目前換到的利潤差小，且在大中華區已被侵蝕，屬「屏障仍在、超額報酬縮小」。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src57&quot;&gt;[57]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src58&quot;&gt;[58]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src59&quot;&gt;[59]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src56&quot;&gt;[56]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;優勢地圖：多大、多久&lt;/figcaption&gt;&lt;div class=&quot;amx&quot;&gt;&lt;div class=&quot;amy&quot;&gt;持續期間 →&lt;/div&gt;&lt;div class=&quot;amg&quot;&gt;&lt;div class=&quot;amr&quot; style=&quot;grid-template-columns:80px repeat(3,1fr)&quot;&gt;&lt;div class=&quot;aml&quot;&gt;10年以上&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;amr&quot; style=&quot;grid-template-columns:80px repeat(3,1fr)&quot;&gt;&lt;div class=&quot;aml&quot;&gt;5–10年&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;span class=&quot;ab ab-有屏障證據&quot; title=&quot;Nike／Swoosh／Jordan 品牌：有屏障證據&quot;&gt;1&lt;/span&gt;&lt;span class=&quot;ab ab-有屏障證據&quot; title=&quot;運動行銷與代言的規模：有屏障證據&quot;&gt;2&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;amr&quot; style=&quot;grid-template-columns:80px repeat(3,1fr)&quot;&gt;&lt;div class=&quot;aml&quot;&gt;不足5年&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;amr&quot; style=&quot;grid-template-columns:80px repeat(3,1fr)&quot;&gt;&lt;div class=&quot;aml&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amx-l&quot;&gt;小&lt;/div&gt;&lt;div class=&quot;amx-l&quot;&gt;中&lt;/div&gt;&lt;div class=&quot;amx-l&quot;&gt;大&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;amxt&quot;&gt;超額報酬大小 →&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;ol class=&quot;akey&quot;&gt;&lt;li&gt;&lt;span class=&quot;ab ab-有屏障證據&quot;&gt;1&lt;/span&gt;Nike／Swoosh／Jordan 品牌（品牌；有屏障證據）&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;ab ab-有屏障證據&quot;&gt;2&lt;/span&gt;運動行銷與代言的規模（規模經濟；有屏障證據）&lt;/li&gt;&lt;/ol&gt;&lt;div class=&quot;lg&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--pos)&quot;&gt;&lt;/i&gt;有屏障證據&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--warn)&quot;&gt;&lt;/i&gt;暫時領先&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;每個圓圈是一項優勢：越往右超額報酬越大、越往上能撐越久。綠＝屏障有事實證據；橘＝只有好處或屏障只有推論（暫時領先，持續期間最多不足 5 年）。作者寫「不明」的維度放在虛線格，不補值。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估.json#/內容/優勢來源/優勢（超額報酬大小、持續期間、判定）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;每項優勢有多少證據&lt;/figcaption&gt;&lt;svg viewBox=&quot;0 0 680 128&quot; role=&quot;img&quot; aria-label=&quot;優勢的證據數：好處與屏障&quot;&gt;&lt;text x=&quot;254&quot; y=&quot;124&quot; class=&quot;ax&quot;&gt;好處句數&lt;/text&gt;&lt;text x=&quot;459.0&quot; y=&quot;124&quot; class=&quot;ax&quot;&gt;屏障句數（事實／推論）&lt;/text&gt;&lt;text x=&quot;242&quot; y=&quot;32&quot; class=&quot;lb s&quot; text-anchor=&quot;end&quot;&gt;1 Nike／Swoosh／Jordan 品牌&lt;title&gt;1 Nike／Swoosh／Jordan 品牌&lt;/title&gt;&lt;/text&gt;&lt;rect x=&quot;250&quot; y=&quot;20&quot; width=&quot;110.0&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;365.0&quot; y=&quot;33&quot; class=&quot;vl s&quot;&gt;2&lt;/text&gt;&lt;rect x=&quot;455.0&quot; y=&quot;20&quot; width=&quot;110.0&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;var(--pos)&quot;/&gt;&lt;rect x=&quot;565.0&quot; y=&quot;20&quot; width=&quot;55.0&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;var(--accent)&quot; opacity=&quot;.7&quot;/&gt;&lt;text x=&quot;625.0&quot; y=&quot;33&quot; class=&quot;vl s&quot;&gt;2／1&lt;/text&gt;&lt;text x=&quot;242&quot; y=&quot;78&quot; class=&quot;lb s&quot; text-anchor=&quot;end&quot;&gt;2 運動行銷與代言的規模&lt;title&gt;2 運動行銷與代言的規模&lt;/title&gt;&lt;/text&gt;&lt;rect x=&quot;250&quot; y=&quot;66&quot; width=&quot;55.0&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;310.0&quot; y=&quot;79&quot; class=&quot;vl s&quot;&gt;1&lt;/text&gt;&lt;rect x=&quot;455.0&quot; y=&quot;66&quot; width=&quot;110.0&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;var(--pos)&quot;/&gt;&lt;rect x=&quot;565.0&quot; y=&quot;66&quot; width=&quot;55.0&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;var(--accent)&quot; opacity=&quot;.7&quot;/&gt;&lt;text x=&quot;625.0&quot; y=&quot;79&quot; class=&quot;vl s&quot;&gt;2／1&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;lg&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c3)&quot;&gt;&lt;/i&gt;好處&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--pos)&quot;&gt;&lt;/i&gt;屏障：事實&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--accent)&quot;&gt;&lt;/i&gt;屏障：推論&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;左邊是「它帶來什麼」的句數，右邊是「為什麼對手拿不走」的句數；屏障至少一句是事實（綠）才算有屏障證據。句數多不等於優勢強，只表示證據量。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估.json#/內容/優勢來源/優勢（好處、屏障的標記）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;div class=&quot;card advc&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;&lt;span class=&quot;num-b 有屏障證據&quot;&gt;1&lt;/span&gt;Nike／Swoosh／Jordan 品牌&lt;/b&gt;&lt;span class=&quot;vd vd-有屏障證據&quot;&gt;有屏障證據&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;品牌（Branding）｜晨星：無形資產&lt;/div&gt;&lt;div class=&quot;two&quot;&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;好處（它帶來什麼）&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;Dick&amp;#x27;s Sporting Goods 在 10-K 寫 Nike 是它最大的供應商，約占 2025 財年商品採購的 31%；這是單一零售商的數字，其他零售商的比例未揭露。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src10&quot;&gt;[10]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;2026 財年北美批發營收 +14%，公司說明來自擴大鋪貨與既有批發客戶加量；據此推論零售商在 Nike 回補時仍願意給出貨架（零售商意願本身原文未寫）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src24&quot;&gt;[24]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;屏障（為什麼對手拿不走）&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;公司把 NIKE 與 Swoosh 商標視為最有價值的資產之一，已在 190 多個司法管轄區註冊，並持續對侵權主張權利。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src57&quot;&gt;[57]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src60&quot;&gt;[60]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;Under Armour 自己在 10-K 寫 Nike 等大品牌有強大的全球知名度、部分資源遠大於它。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src54&quot;&gt;[54]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;品牌聯想要靠數十年的運動員與賽事累積，對手花同樣廣告費也不能在短期內複製；但在大中華區，本土品牌已在成長市場中拿走份額，代表屏障在部分地區正被侵蝕。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src54&quot;&gt;[54]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src56&quot;&gt;[56]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;two&quot;&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;超額報酬大小&lt;/div&gt;&lt;span class=&quot;lv&quot;&gt;小&lt;/span&gt;&lt;div class=&quot;s&quot;&gt;近四季營業利益率 8.2%，低於 DECK 23.6%、LULU 17.8%、ONON 15.3%，高於 VFC 7.1%、UAA −0.5%，同業百分位 0.4；毛利率 43.1% 是六家中最低（DECK 58.9%、ONON 66.8%）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src59&quot;&gt;[59]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src61&quot;&gt;[61]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src62&quot;&gt;[62]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src63&quot;&gt;[63]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;2015–2024 財年稅前利益率除 2020 年外都在約 12%–15%，2025、2026 財年降到約 8.4%（推算）；品牌過去換得中等利潤差，目前只剩小幅。毛利率偏低部分來自批發比重高，不全是品牌溢價消失。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src64&quot;&gt;[64]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src65&quot;&gt;[65]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src14&quot;&gt;[14]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;持續期間&lt;/div&gt;&lt;span class=&quot;lv&quot;&gt;5–10年&lt;/span&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;商標權（190 多個司法管轄區註冊）與 Dick&amp;#x27;s 一家約 31% 的採購依賴都有申報證據；據此推論北美與歐洲的品牌地位短期內不易被拿走。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src57&quot;&gt;[57]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src10&quot;&gt;[10]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;但大中華區連續八季下滑、跑步市場曾被 On 與 Hoka 搶走份額，顯示品牌偏好可以在幾年內轉移，所以給 5–10 年而不是 10 年以上。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src56&quot;&gt;[56]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src30&quot;&gt;[30]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card advc&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;&lt;span class=&quot;num-b 有屏障證據&quot;&gt;2&lt;/span&gt;運動行銷與代言的規模&lt;/b&gt;&lt;span class=&quot;vd vd-有屏障證據&quot;&gt;有屏障證據&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;規模經濟（Scale Economies）｜晨星：成本優勢&lt;/div&gt;&lt;div class=&quot;two&quot;&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;好處（它帶來什麼）&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;第一季需求創造費用 12.52 億美元（品牌行銷與運動行銷），約占營收 11%（推算）；這筆行銷支出由近四季 458.9 億美元營收攤提。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src66&quot;&gt;[66]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src67&quot;&gt;[67]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;屏障（為什麼對手拿不走）&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;截至 2026-05-31，Nike 對運動員、名人、球隊與聯盟的代言合約義務（含相關行銷承諾）約 155 億美元，其中約 17 億在 12 個月內支付。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src58&quot;&gt;[58]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;近四季營收 458.9 億美元，約為 adidas 的 1.7 倍、Under Armour 的 9.5 倍（推算）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src67&quot;&gt;[67]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src68&quot;&gt;[68]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src69&quot;&gt;[69]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;營收規模差距大，小品牌要簽同等規模的代言，費用占營收比例會高很多。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src67&quot;&gt;[67]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src58&quot;&gt;[58]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;two&quot;&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;超額報酬大小&lt;/div&gt;&lt;span class=&quot;lv&quot;&gt;小&lt;/span&gt;&lt;div class=&quot;s&quot;&gt;規模沒有轉成同業最高的利潤率：營業利益率 8.2% 只排在同業第 0.4 百分位，adidas 為 9.2%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src70&quot;&gt;[70]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src71&quot;&gt;[71]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;持續期間&lt;/div&gt;&lt;span class=&quot;lv&quot;&gt;5–10年&lt;/span&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;155 億美元的代言承諾多為多年期合約，鎖定了頂尖運動員與聯盟資源，對手要取得同等資源需要多年與相近的營收規模。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src58&quot;&gt;[58]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;規模屏障有申報事實支持；但規模在大中華區沒有擋住本土品牌，所以給 5–10 年。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src58&quot;&gt;[58]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src56&quot;&gt;[56]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;note&quot;&gt;判定規則：屏障欄至少一句標「事實」並附出處才算「有屏障證據」；否則只算「暫時領先」，持續期間最多寫「不足5年」。&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;s4&quot;&gt;&lt;h2&gt;5　生命週期與未來變化&lt;/h2&gt;&lt;div class=&quot;stages&quot;&gt;&lt;div class=&quot;&quot;&gt;起步&lt;/div&gt;&lt;div class=&quot;&quot;&gt;成長&lt;/div&gt;&lt;div class=&quot;on&quot;&gt;成熟&lt;/div&gt;&lt;div class=&quot;&quot;&gt;衰退&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;lead&quot;&gt;估值報告的林區分類（引用，不重判）：轉機股（Turnaround）&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;營收由 2015 財年 306 億美元增到 2024 財年 514 億美元後，2025、2026 財年都在 463 億美元左右；過去十二年有兩年營收下降（2020、2025）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src65&quot;&gt;[65]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src72&quot;&gt;[72]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;資本支出只占近四季營收 1.5%，生產全外包；成長靠既有品類與通路，不是新市場或新事業。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src73&quot;&gt;[73]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src8&quot;&gt;[8]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;規模已是全球最大、品類與地區都已鋪滿，成長回到品類與通路的消長，這是成熟期的型態；目前處在成熟期的低谷，不是新的成長期。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src65&quot;&gt;[65]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;研究報告的林區分類是「轉機股」，兼具「穩定成長股」（轉型前的長期特徵）；轉機股描述的是成熟公司在低谷中的處境，與本頁「成熟（低谷中）」一致，沒有衝突。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src74&quot;&gt;[74]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src75&quot;&gt;[75]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;callout&quot;&gt;&lt;b&gt;最可能的轉變：留在成熟期：2027–2028 財年由低谷回到低個位數成長；反向風險是大中華區與 Converse 持續縮小，使成熟期轉入衰退&lt;/b&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;若北美批發維持成長、大中華區跌幅收斂到 −10% 以內，且鞋類銷量止跌，營收可在 2028 財年回到正成長。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src3&quot;&gt;[3]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src4&quot;&gt;[4]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src27&quot;&gt;[27]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;若 2028 財年營收仍下降、北美也轉負，營收就是連三年縮水，成熟期轉向衰退。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src2&quot;&gt;[2]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src38&quot;&gt;[38]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lead&quot;&gt;怎麼檢驗&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;看 2027 財年各季 10-Q 的北美與大中華區幣別中性營收、鞋類銷量，以及 2027 財年 10-K 對 2028 財年的展望（觀察清單第 1、4、5 條）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src3&quot;&gt;[3]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src4&quot;&gt;[4]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;s5&quot;&gt;&lt;h2&gt;6　週期推論&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;三種證據都寫成「區間＋條件」，不給單一日期。&lt;/p&gt;&lt;div class=&quot;callout&quot;&gt;&lt;b&gt;綜合：未來 2–6 季（2027 財年第二季到 2028 財年第三季，約 2026-11 到 2028-02）近四季營收年增落底；在那之前營收仍在下行&lt;/b&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;全年指引衰退高個位數，近四季年增在 2027 財年第四季（2027-05）附近最低；若第二、三季單季年減超過 8%，低點落在這個區間的前段。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src2&quot;&gt;[2]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src76&quot;&gt;[76]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;若大中華區與 Converse 的跌幅到 2027 財年下半年仍沒有收斂，低點會延到 2028 財年下半年；歷史下行段最長 12 季，這是延後的上限參考。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src44&quot;&gt;[44]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src77&quot;&gt;[77]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;Nike 這一輪的週期主要是公司自己的轉型時程，不是整體運動鞋服景氣：同業 ONON 最近一季 +17.2%、adidas +9.4%，Nike −4.3%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src78&quot;&gt;[78]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src79&quot;&gt;[79]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;h3&gt;① 自身歷史循環&lt;/h3&gt;&lt;div class=&quot;chart&quot;&gt;&lt;svg viewBox=&quot;0 0 720 240&quot; role=&quot;img&quot; aria-label=&quot;近四季營收年增（2010-05-31～2026-08-31（66 季））&quot;&gt;&lt;line x1=&quot;46&quot; x2=&quot;704&quot; y1=&quot;210.0&quot; y2=&quot;210.0&quot; stroke=&quot;var(--line)&quot; stroke-width=&quot;1&quot;/&gt;&lt;text x=&quot;40&quot; y=&quot;214.0&quot; font-size=&quot;11&quot; text-anchor=&quot;end&quot; fill=&quot;var(--muted)&quot;&gt;-10%&lt;/text&gt;&lt;line x1=&quot;46&quot; x2=&quot;704&quot; y1=&quot;156.6&quot; y2=&quot;156. t;幅度&lt;/th&gt;&lt;th&gt;起點為資料起點（不計入統計）&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;2010-05-31&lt;/td&gt;&lt;td&gt;2012-05-31&lt;/td&gt;&lt;td&gt;上行&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;num&quot;&gt;8&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;num&quot;&gt;+17.8 個百分點&lt;/span&gt;&lt;/td&gt;&lt;td&gt;是&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2012-05-31&lt;/td&gt;&lt;td&gt;2013-05-31&lt;/td&gt;&lt;td&gt;下行&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;num&quot;&gt;4&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;num&quot;&gt;-9.3 個百分點&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2013-05-31&lt;/td&gt;&lt;td&gt;2014-11-30&lt;/td&gt;&lt;td&gt;上行&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;num&quot;&gt;6&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;num&quot;&gt;+5.6 個百分點&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2014-11-30&lt;/td&gt;&lt;td&gt;2017-11-30&lt;/td&gt;&lt;td&gt;下行&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;num&quot;&gt;12&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;num&quot;&gt;-9.6 個百分點&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2017-11-30&lt;/td&gt;&lt;td&gt;2019-02-28&lt;/td&gt;&lt;td&gt;上行&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;num&quot;&gt;5&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;num&quot;&gt;+6.1 個百分點&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2019-02-28&lt;/td&gt;&lt;td&gt;2021-02-28&lt;/td&gt;&lt;td&gt;下行&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;num&quot;&gt;8&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;num&quot;&gt;-16.4 個百分點&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2021-02-28&lt;/td&gt;&lt;td&gt;2021-08-31&lt;/td&gt;&lt;td&gt;上行&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;num&quot;&gt;2&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;num&quot;&gt;+30.4 個百分點&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2021-08-31&lt;/td&gt;&lt;td&gt;2022-08-31&lt;/td&gt;&lt;td&gt;下行&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;num&quot;&gt;4&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;num&quot;&gt;-21.6 個百分點&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2022-08-31&lt;/td&gt;&lt;td&gt;2023-05-31&lt;/td&gt;&lt;td&gt;上行&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;num&quot;&gt;3&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;num&quot;&gt;+7.6 個百分點&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2023-05-31&lt;/td&gt;&lt;td&gt;2025-05-31&lt;/td&gt;&lt;td&gt;下行&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;num&quot;&gt;8&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;num&quot;&gt;-19.5 個百分點&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/details&gt;&lt;p class=&quot;lead&quot;&gt;目前：上行，距最近確認轉折 5 季；最新 2026-08-31 為 -1.2%。歷史下行段中位 8 季、上行段中位 4.0 季。&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;營收近四季年增自 2010 年起有 5 段完整下行段，中位 8 季（4–12 季），上行段中位 4 季（2–6 季）；上一段下行從 2023-05（+9.7%）到 2025-05（−9.8%），共 8 季。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src77&quot;&gt;[77]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src80&quot;&gt;[80]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src81&quot;&gt;[81]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;2025-05 谷之後近四季年增回到 2026-05 的 +0.2%（候選峰），2026-08 又降到 −1.2%；工具目前判「上行、距轉折 5 季」，但候選峰後已回落 1.4 個百分點，還沒到確認轉折的 5 個百分點門檻。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src82&quot;&gt;[82]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;這不是新的上行段，而是同一個低谷的第二次探底：反彈幅度只有 10 個百分點、沒有回到正成長的水準就轉弱，加上全年指引衰退，近四季年增很可能在 2027 財年內跌破 −5%，屆時之字形會確認 2026-05 為峰。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src82&quot;&gt;[82]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src2&quot;&gt;[2]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;過去下行多與事件有關（2020 疫情、2021 後的中國與去庫存）；這一輪主要是公司自己的產品與通路調整，加上大中華區份額流失，比較接近公司特有的週期，而不是整體消費景氣。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src72&quot;&gt;[72]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src18&quot;&gt;[18]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src56&quot;&gt;[56]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;h3&gt;② 訂單能見度&lt;/h3&gt;&lt;p class=&quot;s&quot;&gt;公司沒有揭露 RPO 或合約負債（XBRL 無此科目），也沒有揭露期貨訂單金額；訂單能見度不適用工具指標。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src83&quot;&gt;[83]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src84&quot;&gt;[84]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src11&quot;&gt;[11]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;批發客戶提前五到六個月下單，所以公司給出的全年營收指引（衰退高個位數）大致已反映到 2027 年春季前的批發訂單；這是能見度的替代來源。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src11&quot;&gt;[11]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src2&quot;&gt;[2]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;h3&gt;③ 公司特有週期&lt;/h3&gt;&lt;p class=&quot;s&quot;&gt;產品、通路與品牌三項調整預計 2026 年 12 月底完成；大中華區與 Converse 的負面影響延續整個 2027 財年。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src23&quot;&gt;[23]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src44&quot;&gt;[44]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;Pace 計畫 2028 財年起改為三大地區，稅前費用約 3 億美元在 2027 財年、其餘到 2031 財年認列。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src45&quot;&gt;[45]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src32&quot;&gt;[32]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;2026 財年第四季的 9.86 億美元關稅退款不會重複，2027 財年的利潤率會比 2026 財年報表數字看起來弱。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src37&quot;&gt;[37]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/section&gt;&lt;section id=&quot;s6&quot;&gt;&lt;h2&gt;7　觀察清單：下季要看什麼&lt;/h2&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;觀察清單：目前值離改判門檻多遠&lt;/figcaption&gt;&lt;div class=&quot;wg&quot;&gt;&lt;div class=&quot;wgt&quot;&gt;&lt;b&gt;單季營收年增&lt;/b&gt;&lt;span&gt;維持條件：營收單季年增 &amp;gt;= -8.0%&lt;/span&gt;&lt;/div&gt;&lt;svg viewBox=&quot;0 0 680 60&quot; role=&quot;img&quot; aria-label=&quot;單季營收年增&quot;&gt;&lt;rect x=&quot;89.2&quot; y=&quot;14&quot; width=&quot;576.8&quot; height=&quot;20&quot; fill=&quot;var(--pos)&quot; opacity=&quot;.12&quot;/&gt;&lt;line x1=&quot;14.0&quot; x2=&quot;666.0&quot; y1=&quot;24&quot; y2=&quot;24&quot; stroke=&quot;var(--line)&quot; stroke-width=&quot;2&quot;/&gt;&lt;line x1=&quot;89.2&quot; x2=&quot;89.2&quot; y1=&quot;8&quot; y2=&quot;40&quot; stroke=&quot;var(--ink)&quot; stroke-dasharray=&quot;4 3&quot; stroke-width=&quot;1.6&quot;/&gt;&lt;text x=&quot;89.2&quot; y=&quot;54&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;門檻 -8.0%&lt;/text&gt;&lt;circle cx=&quot;590.8&quot; cy=&quot;24&quot; r=&quot;7&quot; fill=&quot;var(--pos)&quot;/&gt;&lt;text x=&quot;590.8&quot; y=&quot;9&quot; class=&quot;vl s&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--pos)&quot;&gt;目前 -4.3%&lt;/text&gt;&lt;/svg&gt;&lt;/div&gt;&lt;div class=&quot;wg&quot;&gt;&lt;div class=&quot;wgt&quot;&gt;&lt;b&gt;毛利率&lt;/b&gt;&lt;span&gt;維持條件：毛利率 &amp;gt;= 41.0%&lt;/span&gt;&lt;/div&gt;&lt;svg viewBox=&quot;0 0 680 60&quot; role=&quot;img&quot; aria-label=&quot;毛利率&quot;&gt;&lt;rect x=&quot;557.2&quot; y=&quot;14&quot; width=&quot;108.8&quot; height=&quot;20&quot; fill=&quot;var(--pos)&quot; opacity=&quot;.12&quot;/&gt;&lt;line x1=&quot;14.0&quot; x2=&quot;666.0&quot; y1=&quot;24&quot; y2=&quot;24&quot; stroke=&quot;var(--line)&quot; stroke-width=&quot;2&quot;/&gt;&lt;line x1=&quot;557.2&quot; x2=&quot;557.2&quot; y1=&quot;8&quot; y2=&quot;40&quot; stroke=&quot;var(--ink)&quot; stroke-dasharray=&quot;4 3&quot; stroke-width=&quot;1.6&quot;/&gt;&lt;text x=&quot;557.2&quot; y=&quot;54&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;門檻 41.0%&lt;/text&gt;&lt;circle cx=&quot;581.0&quot; cy=&quot;24&quot; r=&quot;7&quot; fill=&quot;var(--pos)&quot;/&gt;&lt;text x=&quot;581.0&quot; y=&quot;9&quot; class=&quot;vl s&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--pos)&quot;&gt;目前 42.8%&lt;/text&gt;&lt;/svg&gt;&lt;/div&gt;&lt;div class=&quot;wg&quot;&gt;&lt;div class=&quot;wgt&quot;&gt;&lt;b&gt;存貨增速減營收增速&lt;/b&gt;&lt;span&gt;維持條件：存貨增速減營收增速 &amp;lt;= 5.0%&lt;/span&gt;&lt;/div&gt;&lt;svg viewBox=&quot;0 0 680 60&quot; role=&quot;img&quot; aria-label=&quot;存貨增速減營收增速&quot;&gt;&lt;rect x=&quot;14.0&quot; y=&quot;14&quot; width=&quot;576.8&quot; height=&quot;20&quot; fill=&quot;var(--pos)&quot; opacity=&quot;.12&quot;/&gt;&lt;line x1=&quot;14.0&quot; x2=&quot;666.0&quot; y1=&quot;24&quot; y2=&quot;24&quot; stroke=&quot;var(--line)&quot; stroke-width=&quot;2&quot;/&gt;&lt;line x1=&quot;238.6&quot; x2=&quot;238.6&quot; y1=&quot;12&quot; y2=&quot;36&quot; class=&quot;zl&quot;/&gt;&lt;line x1=&quot;590.8&quot; x2=&quot;590.8&quot; y1=&quot;8&quot; y2=&quot;40&quot; stroke=&quot;var(--ink)&quot; stroke-dasharray=&quot;4 3&quot; stroke-width=&quot;1.6&quot;/&gt;&lt;text x=&quot;590.8&quot; y=&quot;54&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;門檻 5.0%&lt;/text&gt;&lt;circle cx=&quot;89.2&quot; cy=&quot;24&quot; r=&quot;7&quot; fill=&quot;var(--pos)&quot;/&gt;&lt;text x=&quot;89.2&quot; y=&quot;9&quot; class=&quot;vl s&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--pos)&quot;&gt;目前 -2.1%&lt;/text&gt;&lt;/svg&gt;&lt;/div&gt;&lt;div class=&quot;lg&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--pos)&quot;&gt;&lt;/i&gt;仍在維持條件內&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--neg)&quot;&gt;&lt;/i&gt;已越過門檻&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;只畫能自動對照的觀察項（有檢驗鍵與門檻）：淡綠帶是維持目前判斷的範圍，虛線是門檻，圓點是底稿最新值；越過門檻就照表中「改判方向」重看。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估.json#/內容/觀察清單（檢驗鍵、比較、門檻）＋商業評估底稿.json#/指標（目前值）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;div class=&quot;cards&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;單季營收年增&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;自動對照&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;目前值&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;2027 財年第一季（至 2026-08-31）−4.3%，前三季 0.6%、0.1%、−1.1%&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src46&quot;&gt;[46]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;看什麼&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;全年衰退高個位數的指引是否被下修&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;改判方向&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;若單季年減超過 8%，則低谷比指引更深，成長動能與週期位置維持低分&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;毛利率&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;自動對照&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;目前值&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;2027 財年第一季 42.8%，年增 0.6 個百分點&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src85&quot;&gt;[85]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src86&quot;&gt;[86]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;看什麼&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;折扣、關稅與通路組合對毛利的淨影響&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;改判方向&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;若單季毛利率低於 41%，則清庫存或關稅壓力重新出現，卡住訊號 B2 可能亮燈&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;存貨增速減營收增速&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;自動對照&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;目前值&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;2026-08-31 為 −2.1 個百分點（存貨增速低於營收增速）&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src87&quot;&gt;[87]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;看什麼&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;營收下滑時存貨有沒有跟著降&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;改判方向&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;若存貨增速高於營收增速 5 個百分點以上，則新一輪堆貨，之後又要靠折扣清貨&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;大中華區幣別中性營收年增&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;人工對照&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;目前值&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;2027 財年第一季 −26%（批發 −31%、直營 −18%）&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src4&quot;&gt;[4]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;看什麼&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;本土品牌競爭下的份額與市場庫存&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;改判方向&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;若跌幅收斂到 −10% 以內，則最大卡點減輕，B3 可改判未亮&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;北美批發幣別中性營收年增&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;人工對照&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;目前值&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;2027 財年第一季 +9%（北美整體 +2%）&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src3&quot;&gt;[3]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;看什麼&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;回補是否轉成終端銷售&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;改判方向&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;若北美批發轉為負成長，則唯一有財報證據的成長引擎熄火，生命週期轉向衰退的風險上升&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;h3&gt;推論紀錄（下一季財報後自動對照）&lt;/h3&gt;&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;推論&lt;/th&gt;&lt;th&gt;方法&lt;/th&gt;&lt;th&gt;檢驗指標&lt;/th&gt;&lt;th&gt;條件&lt;/th&gt;&lt;th&gt;基準季&lt;/th&gt;&lt;th&gt;檢驗時點&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;P1&lt;/td&gt;&lt;td&gt;2027 財年第二季（至 2026-11-30）單季營收年增仍為負（指引全年衰退高個位數）&lt;/td&gt;&lt;td&gt;公司特有&lt;/td&gt;&lt;td&gt;營收單季年增&lt;/td&gt;&lt;td&gt;&amp;lt; 0.0&lt;/td&gt;&lt;td&gt;2026-08-31&lt;/td&gt;&lt;td&gt;2027 財年第二季 10-Q（約 2027 年 1 月）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;P2&lt;/td&gt;&lt;td&gt;2027 財年第二季毛利率高於去年同季的 40.6%（關稅退款外，物流成本下降與關稅基期墊高後回升）&lt;/td&gt;&lt;td&gt;公司特有&lt;/td&gt;&lt;td&gt;毛利率&lt;/td&gt;&lt;td&gt;&amp;gt; 0.406&lt;/td&gt;&lt;td&gt;2026-08-31&lt;/td&gt;&lt;td&gt;2027 財年第二季 10-Q（約 2027 年 1 月）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;P3&lt;/td&gt;&lt;td&gt;2027 財年末（至 2027-05-31）近四季營收年增在 −5% 以下，之字形確認 2026-05 為峰&lt;/td&gt;&lt;td&gt;自身歷史&lt;/td&gt;&lt;td&gt;營收近四季年增&lt;/td&gt;&lt;td&gt;&amp;lt;= -0.05&lt;/td&gt;&lt;td&gt;2026-08-31&lt;/td&gt;&lt;td&gt;2027 財年 10-K（約 2027 年 7 月）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;P4&lt;/td&gt;&lt;td&gt;到 2027-11-30 近四季營收年增仍為負（低谷不會在 2027 年內結束）&lt;/td&gt;&lt;td&gt;自身歷史&lt;/td&gt;&lt;td&gt;營收近四季年增&lt;/td&gt;&lt;td&gt;&amp;lt; 0.0&lt;/td&gt;&lt;td&gt;2026-08-31&lt;/td&gt;&lt;td&gt;2028 財年第二季 10-Q（約 2028 年 1 月）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;P5&lt;/td&gt;&lt;td&gt;2027 財年第二季存貨增速不超過營收增速 5 個百分點（去庫存後沒有新的堆積）&lt;/td&gt;&lt;td&gt;其他&lt;/td&gt;&lt;td&gt;存貨增速減營收增速&lt;/td&gt;&lt;td&gt;&amp;lt;= 0.05&lt;/td&gt;&lt;td&gt;2026-08-31&lt;/td&gt;&lt;td&gt;2027 財年第二季 10-Q（約 2027 年 1 月）&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;lead&quot;&gt;每條推論從檢驗期末起，每個新季度記一筆命中或落空（預測帳本，公司資料夾 商業評估檢驗.json）；方法準確度跨公司統計見 優化/商業評估預測帳本.json。&lt;/p&gt;&lt;/section&gt;&lt;section id=&quot;sg&quot;&gt;&lt;h2&gt;商業動能明細&lt;span class=&quot;ruleok&quot;&gt;評分規則第一版，2026-11-07 使用者核定&lt;/span&gt;&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;五個面向各 1–5 分，相對同產業卡同業評比；機械建議分由工具依同業位置、卡住訊號與驗證比例算出，作者可調整但要寫理由。加權分 2.6 → D 級。等級門檻：A ≥ 4.2、B ≥ 3.5、C ≥ 2.8、D ≥ 2.1、其餘 E。&lt;/p&gt;&lt;div class=&quot;cards&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;模式穩固度&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;權重 &lt;span class=&quot;num&quot;&gt;25%&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;fs&quot;&gt;&lt;span&gt;作者分 &lt;span class=&quot;num v&quot;&gt;3&lt;/span&gt;&lt;/span&gt;&lt;span&gt;機械建議 &lt;span class=&quot;num&quot;&gt;3&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;近四季營業利益率同業百分位 0.4&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;理由&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;近四季營業利益率 8.2%，同業百分位 0.4，機械建議 3 分。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src88&quot;&gt;[88]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src59&quot;&gt;[59]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;品牌與通路屏障都還在、從未虧損，但利潤率約為過去十年水準的三分之二，模式成立而不突出，維持 3 分。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src64&quot;&gt;[64]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src57&quot;&gt;[57]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;同業對照&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;營業利益率 DECK 23.6%、LULU 17.8%、ONON 15.3%、NKE 8.2%、VFC 7.1%、UAA −0.5%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src59&quot;&gt;[59]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;成長動能&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;權重 &lt;span class=&quot;num&quot;&gt;25%&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;fs&quot;&gt;&lt;span&gt;作者分 &lt;span class=&quot;num v&quot;&gt;2&lt;/span&gt;&lt;/span&gt;&lt;span&gt;機械建議 &lt;span class=&quot;num&quot;&gt;2&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;最近一季營收年增同業百分位 0.2（yfinance 口徑）&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;理由&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;最近一季營收年增 −4.3%，同業百分位 0.2，機械建議 2 分；全年指引再衰退高個位數。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src89&quot;&gt;[89]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src2&quot;&gt;[2]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;北美批發與服飾調價有正貢獻，但被大中華區與 Converse 抵銷，維持 2 分。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src3&quot;&gt;[3]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src4&quot;&gt;[4]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src5&quot;&gt;[5]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;同業對照&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;最近一季營收年增 ONON 17.2%、DECK 3.5%、VFC −3.8%、LULU −4.3%、NKE −4.3%、UAA −6.9%；營運參考的 adidas 9.4%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src78&quot;&gt;[78]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src79&quot;&gt;[79]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;卡點風險&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;權重 &lt;span class=&quot;num&quot;&gt;20%&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;fs&quot;&gt;&lt;span&gt;作者分 &lt;span class=&quot;num v&quot;&gt;3&lt;/span&gt;&lt;/span&gt;&lt;span&gt;機械建議 &lt;span class=&quot;num&quot;&gt;3&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;計分採用的亮燈 2 條（G1、B3）；資料未取得 1 條&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;理由&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;計分亮燈 2 條：G1 營收增速連續放緩、B3 通路庫存或批發訂單轉弱；G2 工具取不到資料。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src90&quot;&gt;[90]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;G2 若以扣除關稅退款的營業利益率計，實質上也是亮燈；但存貨、應收、毛利率、費用率四條都未亮，卡點集中在需求面而不是營運資金，給 3 分。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src35&quot;&gt;[35]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src37&quot;&gt;[37]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src87&quot;&gt;[87]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;同業對照&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-待查&quot;&gt;待查&lt;/span&gt;待查：同業還沒做商業評估，沒有可對照的卡住訊號；同業中 UAA 營業利益率為負（−0.5%），卡點比 Nike 更重。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src59&quot;&gt;[59]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;週期位置&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;權重 &lt;span class=&quot;num&quot;&gt;15%&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;fs&quot;&gt;&lt;span&gt;作者分 &lt;span class=&quot;num v&quot;&gt;2&lt;/span&gt;&lt;/span&gt;&lt;span&gt;機械建議 &lt;span class=&quot;num&quot;&gt;4&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;營收近四季年增目前上行，距最近轉折 5 季；歷史下行段中位 8 季&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;理由&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;工具判營收近四季年增「上行、距 2025-05 谷 5 季」，機械建議 4 分；但 2026-05 的 +0.2% 之後已回落到 −1.2%，單季年增連三季下降，公司指引全年衰退高個位數。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src91&quot;&gt;[91]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src82&quot;&gt;[82]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src46&quot;&gt;[46]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src2&quot;&gt;[2]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;機械分只看之字形還沒確認新的峰；依公司自己的指引，近四季年增在 2027 財年內會跌破 −5% 的轉折門檻，Nike 實際上處在第二次探底的下行段，下調 2 分。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src82&quot;&gt;[82]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src2&quot;&gt;[2]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src38&quot;&gt;[38]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;同業對照&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;同業最近一季營收年增從 UAA −6.9% 到 ONON 17.2%，六家中三家為負；Nike 的下行主要是公司特有，不是同業共同的景氣下行。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src78&quot;&gt;[78]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-待查&quot;&gt;待查&lt;/span&gt;待查：yfinance 只有同業最近一季年增，看不出同業的增速方向與週期段長。&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;說法可信度&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;權重 &lt;span class=&quot;num&quot;&gt;15%&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;fs&quot;&gt;&lt;span&gt;作者分 &lt;span class=&quot;num v&quot;&gt;3&lt;/span&gt;&lt;/span&gt;&lt;span&gt;機械建議 &lt;span class=&quot;num&quot;&gt;3&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;已判定 5 條，驗證比例 0.5&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;理由&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;五條說的 vs 做的：一條已驗證（北美進度）、三條部分支持、一條說法未獲數字支持（為長期成長重新定位）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src23&quot;&gt;[23]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src39&quot;&gt;[39]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;管理層對壞消息有直接揭露（大中華區、Converse 延續整個 2027 財年；陣痛延到下一財年），指引與第一季結果一致；但連續三個重組計畫還沒看到利潤率改善，給 3 分。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src44&quot;&gt;[44]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src28&quot;&gt;[28]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src38&quot;&gt;[38]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;同業對照&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-待查&quot;&gt;待查&lt;/span&gt;待查：同業還沒做商業評估，沒有可比較的說法驗證比例。&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;相對同業：成長與利潤率&lt;/figcaption&gt;&lt;svg viewBox=&quot;0 0 680 300&quot; role=&quot;img&quot; aria-label=&quot;同業位置：營收年增與營業利益率&quot;&gt;&lt;line x1=&quot;56.0&quot; x2=&quot;56.0&quot; y1=&quot;16&quot; y2=&quot;260&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;56.0&quot; y=&quot;276&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;-10%&lt;/text&gt;&lt;line x1=&quot;155.0&quot; x2=&quot;155.0&quot; y1=&quot;16&quot; y2=&quot;260&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;155.0&quot; y=&quot;276&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;-5%&lt;/text&gt;&lt;line x1=&quot;254.0&quot; x2=&quot;254.0&quot; y1=&quot;16&quot; y2=&quot;260&quot; class=&quot;zl&quot;/&gt;&lt;text x=&quot;254.0&quot; y=&quot;276&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;0%&lt;/text&gt;&lt;line x1=&quot;353.0&quot; x2=&quot;353.0&quot; y1=&quot;16&quot; y2=&quot;260&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;353.0&quot; y=&quot;276&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;5%&lt;/text&gt;&lt;line x1=&quot;452.0&quot; x2=&quot;452.0&quot; y1=&quot;16&quot; y2=&quot;260&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;452.0&quot; y=&quot;276&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;10%&lt;/text&gt;&lt;line x1=&quot;551.0&quot; x2=&quot;551.0&quot; y1=&quot;16&quot; y2=&quot;260&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;551.0&quot; y=&quot;276&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;15%&lt;/text&gt;&lt;line x1=&quot;650.0&quot; x2=&quot;650.0&quot; y1=&quot;16&quot; y2=&quot;260&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;650.0&quot; y=&quot;276&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;20%&lt;/text&gt;&lt;line x1=&quot;56&quot; x2=&quot;650&quot; y1=&quot;260.0&quot; y2=&quot;260.0&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;50&quot; y=&quot;264.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;-10%&lt;/text&gt;&lt;line x1=&quot;56&quot; x2=&quot;650&quot; y1=&quot;199.0&quot; y2=&quot;199.0&quot; class=&quot;zl&quot;/&gt;&lt;text x=&quot;50&quot; y=&quot;203.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;0%&lt;/text&gt;&lt;line x1=&quot;56&quot; x2=&quot;650&quot; y1=&quot;138.0&quot; y2=&quot;138.0&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;50&quot; y=&quot;142.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;10%&lt;/text&gt;&lt;line x1=&quot;56&quot; x2=&quot;650&quot; y1=&quot;77.0&quot; y2=&quot;77.0&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;50&quot; y=&quot;81.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;20%&lt;/text&gt;&lt;line x1=&quot;56&quot; x2=&quot;650&quot; y1=&quot;16.0&quot; y2=&quot;16.0&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;50&quot; y=&quot;20.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;30%&lt;/text&gt;&lt;text x=&quot;650&quot; y=&quot;296&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;最近一季營收年增 →&lt;/text&gt;&lt;text x=&quot;60&quot; y=&quot;26&quot; class=&quot;ax&quot;&gt;↑ 營業利益率&lt;/text&gt;&lt;circle cx=&quot;168.9&quot; cy=&quot;149.0&quot; r=&quot;8&quot; fill=&quot;var(--biz)&quot; opacity=&quot;1&quot;&gt;&lt;title&gt;NKE：營收年增 -4.3%、營業利益率 8.2%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;158.9&quot; y=&quot;153.0&quot; class=&quot;vl s&quot; text-anchor=&quot;end&quot;&gt;NKE&lt;/text&gt;&lt;circle cx=&quot;323.3&quot; cy=&quot;55.1&quot; r=&quot;5.5&quot; fill=&quot;var(--muted)&quot; opacity=&quot;0.75&quot;&gt;&lt;title&gt;DECK：營收年增 3.5%、營業利益率 23.6%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;333.3&quot; y=&quot;59.1&quot; class=&quot;ax s&quot; text-anchor=&quot;start&quot;&gt;DECK&lt;/text&gt;&lt;circle cx=&quot;594.6&quot; cy=&quot;105.5&quot; r=&quot;5.5&quot; fill=&quot;var(--muted)&quot; opacity=&quot;0.75&quot;&gt;&lt;title&gt;ONON：營收年增 17.2%、營業利益率 15.3%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;604.6&quot; y=&quot;109.5&quot; class=&quot;ax s&quot; text-anchor=&quot;start&quot;&gt;ONON&lt;/text&gt;&lt;circle cx=&quot;168.9&quot; cy=&quot;90.2&quot; r=&quot;5.5&quot; fill=&quot;var(--muted)&quot; opacity=&quot;0.75&quot;&gt;&lt;title&gt;LULU：營收年增 -4.3%、營業利益率 17.8%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;178.9&quot; y=&quot;94.2&quot; class=&quot;ax s&quot; text-anchor=&quot;start&quot;&gt;LULU&lt;/text&gt;&lt;circle cx=&quot;178.8&quot; cy=&quot;155.8&quot; r=&quot;5.5&quot; fill=&quot;var(--muted)&quot; opacity=&quot;0.75&quot;&gt;&lt;title&gt;VFC：營收年增 -3.8%、營業利益率 7.1%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;188.8&quot; y=&quot;159.8&quot; class=&quot;ax s&quot; text-anchor=&quot;start&quot;&gt;VFC&lt;/text&gt;&lt;circle cx=&quot;117.4&quot; cy=&quot;202.0&quot; r=&quot;5.5&quot; fill=&quot;var(--muted)&quot; opacity=&quot;0.75&quot;&gt;&lt;title&gt;UAA：營收年增 -6.9%、營業利益率 -0.5%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;127.4&quot; y=&quot;206.0&quot; class=&quot;ax s&quot; text-anchor=&quot;start&quot;&gt;UAA&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;右上角＝成長快又賺得多。藍點是本公司，灰點是同產業卡同業；營收年增百分位 0.2、營業利益率百分位 0.4（成長動能、模式穩固度的機械建議分依此）。營收年增是最近一季對去年同季（yfinance 口徑），不是近四季合計。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估底稿.json#/同業位置（市場資料/同業營運比較.json＋估值輸入.json#/peers）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;div class=&quot;note&quot;&gt;商業評估等級（A–E 五級）只看商業模式是否成立、成長是否卡住、週期在哪，相對同產業卡同業評比；它不是估值報告研究評等裡的「生意品質 A／B／C」（那是看護城河、投入資本報酬、現金流品質、資產負債表與治理的絕對標準），不進研究評等、不影響估值、不涉任何價格。&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;src&quot;&gt;&lt;h2&gt;出處&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;標記統計：事實 66、推論 31、作者判斷 7、待查 4；原文位置可用 &lt;code&gt;python3 程式/原文索引.py 公司/&amp;lt;代號&amp;gt; --讀=&quot;位置&quot;&lt;/code&gt; 讀原文，JSON 欄位在公司資料夾。&lt;/p&gt;&lt;details open&gt;&lt;summary&gt;展開出處清單&lt;/summary&gt;&lt;ol class=&quot;src&quot;&gt;&lt;li id=&quot;src1&quot;&gt;10-Q 2026-08-31 Part I, Item 2 ¶2&lt;/li&gt;&lt;li id=&quot;src2&quot;&gt;8-K 2026-10-01 新聞稿 §9&lt;/li&gt;&lt;li id=&quot;src3&quot;&gt;10-Q 2026-08-31 Part I, Item 2 ¶87&lt;/li&gt;&lt;li id=&quot;src4&quot;&gt;10-Q 2026-08-31 Part I, Item 2 ¶109&lt;/li&gt;&lt;li id=&quot;src5&quot;&gt;10-Q 2026-08-31 Part I, Item 2 ¶138&lt;/li&gt;&lt;li id=&quot;src6&quot;&gt;商業評估底稿.json#/營收組成/表/0/軸/srt:ProductOrServiceAxis&lt;/li&gt;&lt;li id=&quot;src7&quot;&gt;商業評估底稿.json#/營收組成/表/0/軸/srt:ConsolidationItemsAxis/52&lt;/li&gt;&lt;li id=&quot;src8&quot;&gt;10-K 2026-05-31 Item 1 ¶40&lt;/li&gt;&lt;li id=&quot;src9&quot;&gt;10-K 2026-05-31 Item 1 ¶41&lt;/li&gt;&lt;li id=&quot;src10&quot;&gt;全文搜尋 Q1 DICK&amp;#x27;S SPORTING GOODS INC. #1&lt;/li&gt;&lt;li id=&quot;src11&quot;&gt;10-K 2026-05-
