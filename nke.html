.9&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c1)&quot;/&gt;&lt;text x=&quot;419.9&quot; y=&quot;63&quot; class=&quot;val&quot;&gt;1.0&lt;/text&gt;&lt;text x=&quot;221&quot; y=&quot;103&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;Swan（買進）&lt;/text&gt;&lt;rect x=&quot;231.0&quot; y=&quot;89&quot; width=&quot;90.4&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c1)&quot;/&gt;&lt;text x=&quot;329.4&quot; y=&quot;103&quot; class=&quot;val&quot;&gt;0.5&lt;/text&gt;&lt;text x=&quot;221&quot; y=&quot;143&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;Rogers（買進）&lt;/text&gt;&lt;rect x=&quot;231.0&quot; y=&quot;129&quot; width=&quot;31.3&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c1)&quot;/&gt;&lt;text x=&quot;270.3&quot; y=&quot;143&quot; class=&quot;val&quot;&gt;0.2&lt;/text&gt;&lt;text x=&quot;221&quot; y=&quot;183&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;Mccartney（預設計畫賣出）&lt;/text&gt;&lt;rect x=&quot;231.0&quot; y=&quot;169&quot; width=&quot;166.6&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;405.6&quot; y=&quot;183&quot; class=&quot;val&quot;&gt;0.9&lt;/text&gt;&lt;text x=&quot;221&quot; y=&quot;223&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;Montagne（非計畫賣出）&lt;/text&gt;&lt;rect x=&quot;231.0&quot; y=&quot;209&quot; width=&quot;37.0&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--neg)&quot;/&gt;&lt;text x=&quot;276.0&quot; y=&quot;223&quot; class=&quot;val&quot;&gt;0.2&lt;/text&gt;&lt;text x=&quot;221&quot; y=&quot;263&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;Alagirisamy（預設計畫賣出）&lt;/text&gt;&lt;rect x=&quot;231.0&quot; y=&quot;249&quot; width=&quot;31.6&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;270.6&quot; y=&quot;263&quot; class=&quot;val&quot;&gt;0.2&lt;/text&gt;&lt;text x=&quot;221&quot; y=&quot;303&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;Leinwand（預設計畫賣出）&lt;/text&gt;&lt;rect x=&quot;231.0&quot; y=&quot;289&quot; width=&quot;31.0&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;270.0&quot; y=&quot;303&quot; class=&quot;val&quot;&gt;0.2&lt;/text&gt;&lt;text x=&quot;221&quot; y=&quot;343&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;Friend（預設計畫賣出）&lt;/text&gt;&lt;rect x=&quot;231.0&quot; y=&quot;329&quot; width=&quot;18.5&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;257.5&quot; y=&quot;343&quot; class=&quot;val&quot;&gt;0.1&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;生意品質：B（規則：無「弱」且至少三項「強」＝A）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;評等&lt;/th&gt;&lt;th&gt;理由&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;護城河&lt;/td&gt;&lt;td&gt;窄&lt;/td&gt;&lt;td&gt;改善規格 v2 雙鑰匙：鑰匙一（不含商譽 ROIC 近五年都高於 WACC）與鑰匙二（第三方 SEC 申報：Dick&amp;#x27;s 10-K 揭露 Nike 占其商品採購約 31%，Shoe Carnival 揭露 Nike 約占淨銷售 24%）都通過，應為寬；但主分類轉機股、反轉未確認，依 O43 上限列窄（估值輸入.超額報酬期間.分級依據）。反方：大中華區連續多季衰退（第一季 −22%）、本土品牌崛起，Converse −28%，Modern Retail（美國零售業媒體）報導 On、Hoka 前幾年在跑步市場搶走市占。執行長在法說會表示跑步品類雙位數成長（財報未揭露品類數字）。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;投入資本報酬與增量回報&lt;/td&gt;&lt;td&gt;中&lt;/td&gt;&lt;td&gt;近四季 ROIC 約 21%（營業利益依毛利 − 營業費用計），但含非經常性關稅退款；扣除退款並加回遣散費後約 17%，仍高於資本成本約 9%。2024–2026 財年稅後營業利益減少約 23 億、投入資本反增，增量回報為負（NKE-C08）。Nike 不揭露研發費用，研發資本化對照不適用。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;自由現金流品質&lt;/td&gt;&lt;td&gt;弱&lt;/td&gt;&lt;td&gt;近四季一般資本支出後現金 21.05 億低於股利 24.26 億，回購與股利後為 −3.41 億（NKE-M-品質Q3）；淨利含關稅退款 9.86 億（NKE-C05），扣除退款現金、補回相關所得稅與遣散支出後約 16–17 億（保守口徑，推估），若近四季已付的 IEEPA 關稅現金也全數加回約 23–25 億（上限），最多與股利打平（詳第三題）；每股自由現金流兩年少約三分之二。2027 財年調整後 EPS 指引 1.15–1.35，也低於每年約 1.64 的股利。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;資產負債表&lt;/td&gt;&lt;td&gt;強&lt;/td&gt;&lt;td&gt;現金與短期投資 83.7 億，略多於有息負債 78.9 億（一年內到期 20 億），淨現金約 5 億；30 億美元承諾授信與 30 億商業本票計畫都未動用（NKE-C02）；有息負債約為近四季 EBITDA 的 1.75 倍（扣退款約 2.2 倍，推導），公司債到期分散至 2050 年（NKE-C03）；存貨 78 億較去年同期 −3%，去化正常。2025 年 S&amp;amp;P（標普信用評等機構）與 Moody&amp;#x27;s（穆迪信用評等機構）曾調降信評，仍為投資級（2026 財年 10-K 風險因素）；淨現金不能抵銷信評轉弱的風險。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;治理與資本配置&lt;/td&gt;&lt;td&gt;中&lt;/td&gt;&lt;td&gt;董事長、執行長、首席獨立董事分設，股東會 11 位提名人中 8 位獨立，另新增 LVMH（精品集團）的 Alexandre Arnault（獨立性未見判定）；4 月執行長 Hill（04-13 約 2.4 萬股、約 100 萬美元）與董事 Tim Cook（04-10 2.5 萬股）、董事 Robert Swan（B 股股東選出，04-07 約 1.2 萬股、約 50 萬美元）、John Rogers（Ariel Investments 創辦人；04-09 4,000 股，已於 9 月 8 日股東會後退休）在公開市場買進，是正面線索；同期 9 筆小額賣出多屬 10b5-1 預設計畫，屬弱訊號（NKE-C06）。反方：BNP（法國巴黎銀行）分析師指出這是 2024 財年以來第三個重組計畫、財務長與會計長更替（NKE-C06）；回購暫停、淨回購為負（NKE-C04）；五年股東總報酬落後同業（36 對 48，100 美元起算）。&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;PEG 三口徑、林區資產負債表檢查與 F 分數等交叉檢查（算法與完整表見&lt;a href=&quot;#wp-value&quot;&gt;計算底稿 價值判斷&lt;/a&gt;）。&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;capital&quot;&gt;&lt;div class=&quot;qno&quot;&gt;問題 06&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;管理層怎麼用錢、怎麼管資產？&lt;/div&gt;&lt;h2&gt;財務穩健、已停回購；重組接連推出，節省還沒變成利潤&lt;/h2&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;30 億美元承諾授信未動用，短期不缺錢；有息負債 7,893 百萬美元，淨現金 475 百萬美元。&lt;/strong&gt;Pace 計畫重整三大區域、精簡組織，預期至 2031 財年累計節省約 25 億美元。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;節省額未扣費用與再投資，代價是約 10 億美元重組費用、多數為現金。&lt;/strong&gt;BNP Paribas（法國巴黎銀行）分析師稱這是 2024 財年以來第三個重組計畫、尚未看到營運槓桿（Retail Dive 轉述）；要追蹤節省能否轉成利潤，以及股利是否繼續消耗存款。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;近四季營運現金流的去向（億美元）：第一列為營運現金流，往下逐項扣除，最後一列為剩餘或缺口；缺口由手上現金支應&lt;/p&gt;&lt;svg viewBox=&quot;0 0 500 218&quot; role=&quot;img&quot; aria-label=&quot;資金去向&quot; class=&quot;chart&quot; style=&quot;max-width:650px&quot;&gt;&lt;line x1=&quot;189.5&quot; x2=&quot;189.5&quot; y1=&quot;6&quot; y2=&quot;214&quot; class=&quot;zero&quot;/&gt;&lt;t 該欄。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;capital-plain&quot;&gt;&lt;h3&gt;融資與償債：還不還得起&lt;/h3&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;b&gt;信用評級&lt;/b&gt;　機構 Moody&amp;#x27;s A2、S&amp;amp;P A+（&lt;a class=&quot;term&quot; href=&quot;#g16&quot;&gt;10-Q&lt;/a&gt; 2026-08-31 Part I, Item 2 ¶175）／推導 AAA（Damodaran 合成評等，利息保障 11.6 倍，推導）｜投資等級（BBB-／Baa3 以上）；推導比機構高 5 級（推導只看利息保障，不含規模、產業與擔保結構，僅供對照）&lt;/p&gt;&lt;p&gt;&lt;b&gt;存活檢查（12～24 個月，推導，非違約預測）&lt;/b&gt;　無明顯警訊（推導，非違約預測）：現金加未動用信貸 114 億美元，一年內到期債務 20 億美元（另利息 323.0 百萬美元），可付 4.9 倍；現金加未動用信貸 114 億美元，兩年內到期債務 20 億美元（另利息 646.0 百萬美元），可付 4.3 倍；利息保障 11.6 倍；會計師未提出繼續經營疑慮。&lt;/p&gt;&lt;p&gt;&lt;b&gt;利率壓力測試&lt;/b&gt;　+200&lt;a class=&quot;term&quot; href=&quot;#g25&quot;&gt;bp&lt;/a&gt; 後利息保障 7.9 倍（目前 11.6 倍，推導）&lt;/p&gt;&lt;p&gt;&lt;b&gt;借款用途&lt;/b&gt;　近四季沒有新借款，也沒有償還債務；商業本票與承諾授信都未動用。股利 24.26 億美元與資本支出由營運現金與帳上現金支應，回購只有 0.20 億。公司表示未來回購的資金預期來自營運現金流&lt;/p&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;償債指標、融資活動表、存活檢查明細與利率壓力測試（算法與完整表見&lt;a href=&quot;#wp-6&quot;&gt;計算底稿 6&lt;/a&gt;）。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;survival-charts&quot;&gt;&lt;h3&gt;存活檢查與利率壓力測試（圖）&lt;/h3&gt;&lt;div class=&quot;grid2 wide&quot;&gt;&lt;figure class=figure&gt;&lt;p class=cap&gt;存活檢查（12～24 個月）：手上的錢對到期債務加利息（億美元；可付 4.9 倍／4.3 倍；燈號 無明顯警訊；資料截至 2026-08-31；信用與存活.json；推導，非違約預測）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 500 222&quot; role=&quot;img&quot; aria-label=&quot;存活檢查&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;223.0&quot; x2=&quot;223.0&quot; y1=&quot;6&quot; y2=&quot;216&quot; class=&quot;zero&quot;/&gt;&lt;text x=&quot;213&quot; y=&quot;23&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;現金與流動證券&lt;/text&gt;&lt;rect x=&quot;223.0&quot; y=&quot;9&quot; width=&quot;199.1&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c1)&quot;/&gt;&lt;text x=&quot;430.1&quot; y=&quot;23&quot; class=&quot;val&quot;&gt;83.7&lt;/text&gt;&lt;text x=&quot;213&quot; y=&quot;63&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;未動用信貸&lt;/text&gt;&lt;rect x=&quot;223.0&quot; y=&quot;49&quot; width=&quot;71.4&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c1)&quot;/&gt;&lt;text x=&quot;302.4&quot; y=&quot;63&quot; class=&quot;val&quot;&gt;30.0&lt;/text&gt;&lt;text x=&quot;213&quot; y=&quot;103&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;12 個月要付：本金＋利息&lt;/text&gt;&lt;rect x=&quot;223.0&quot; y=&quot;89&quot; width=&quot;55.3&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--neg)&quot;/&gt;&lt;text x=&quot;286.3&quot; y=&quot;103&quot; class=&quot;val&quot;&gt;23.2&lt;/text&gt;&lt;text x=&quot;213&quot; y=&quot;143&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;24 個月要付：本金＋兩年利息&lt;/text&gt;&lt;rect x=&quot;223.0&quot; y=&quot;129&quot; width=&quot;63.0&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--neg)&quot;/&gt;&lt;text x=&quot;294.0&quot; y=&quot;143&quot; class=&quot;val&quot;&gt;26.5&lt;/text&gt;&lt;text x=&quot;213&quot; y=&quot;183&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;近四季自由現金流&lt;/text&gt;&lt;rect x=&quot;223.0&quot; y=&quot;169&quot; width=&quot;50.1&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;281.1&quot; y=&quot;183&quot; class=&quot;val&quot;&gt;21.1&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;figure class=figure&gt;&lt;p class=cap&gt;利率壓力測試：各固定情境下的利息保障（倍；紅色虛線 1.5 倍＝提示門檻；不預測聯準會；推導）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 500 222&quot; role=&quot;img&quot; aria-label=&quot;利率壓力測試&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;183.0&quot; x2=&quot;183.0&quot; y1=&quot;6&quot; y2=&quot;216&quot; class=&quot;zero&quot;/&gt;&lt;line x1=&quot;213.4&quot; x2=&quot;213.4&quot; y1=&quot;4&quot; y2=&quot;218&quot; class=&quot;price&quot;/&gt;&lt;text x=&quot;173&quot; y=&quot;23&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;目前&lt;/text&gt;&lt;rect x=&quot;183.0&quot; y=&quot;9&quot; width=&quot;235.5&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c1)&quot;/&gt;&lt;text x=&quot;426.5&quot; y=&quot;23&quot; class=&quot;val&quot;&gt;11.6 倍&lt;/text&gt;&lt;text x=&quot;173&quot; y=&quot;63&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;目前利率（只算再融資）&lt;/text&gt;&lt;rect x=&quot;183.0&quot; y=&quot;49&quot; width=&quot;195.4&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c1)&quot;/&gt;&lt;text x=&quot;386.4&quot; y=&quot;63&quot; class=&quot;val&quot;&gt;9.7 倍&lt;/text&gt;&lt;text x=&quot;173&quot; y=&quot;103&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;利率 +1 個百分點&lt;/text&gt;&lt;rect x=&quot;183.0&quot; y=&quot;89&quot; width=&quot;175.5&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c1)&quot;/&gt;&lt;text x=&quot;366.5&quot; y=&quot;103&quot; class=&quot;val&quot;&gt;8.7 倍&lt;/text&gt;&lt;text x=&quot;173&quot; y=&quot;143&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;利率 +2 個百分點&lt;/text&gt;&lt;rect x=&quot;183.0&quot; y=&quot;129&quot; width=&quot;159.3&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c1)&quot;/&gt;&lt;text x=&quot;350.3&quot; y=&quot;143&quot; class=&quot;val&quot;&gt;7.9 倍&lt;/text&gt;&lt;text x=&quot;173&quot; y=&quot;183&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;利率 −1 個百分點&lt;/text&gt;&lt;rect x=&quot;183.0&quot; y=&quot;169&quot; width=&quot;220.3&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c1)&quot;/&gt;&lt;text x=&quot;411.3&quot; y=&quot;183&quot; class=&quot;val&quot;&gt;10.9 倍&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;燈號規則寫死在程式（信用與存活.py）：現金＋未動用信貸要能付 12 個月本金與利息，否則看自由現金流；利率上升 2 個百分點後利息保障低於 1.5 倍才加一條理由。只顯示、不改研究評等；明細表、規則與限制（算法與完整表見&lt;a href=&quot;#wp-6&quot;&gt;計算底稿 6&lt;/a&gt;）。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;財務管理：信用、償債與回購&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;2025 年 S&amp;amp;P 與 Moody&amp;#x27;s 曾調降信評，目前 Moody&amp;#x27;s A2、S&amp;amp;P A+，仍為投資等級&lt;span class=&quot;src&quot;&gt;（公司 10-Q 自述，非評級機構原文）&lt;/span&gt;；存活檢查「無明顯警訊」&lt;span class=&quot;src&quot;&gt;（推導，非違約預測）&lt;/span&gt;。&lt;/strong&gt;損益表只列淨利息、總利息費用未單獨揭露；工具以 10-K 揭露的 2026 財年支付利息 3.23 億美元&lt;span class=&quot;src&quot;&gt;（現金口徑）&lt;/span&gt;推算利息保障，+200bp 後利息保障 7.9 倍&lt;span class=&quot;src&quot;&gt;（目前 11.6 倍，推導）&lt;/span&gt;，只作量級參考。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;近四季營運現金流 27.8 億美元，扣資本支出、股利與回購後為負 3.4 億，由帳上現金支應，期間沒有新借款也沒有還債。&lt;/strong&gt;180 億美元回購授權已用約 121 億、均價 97.57 美元，剩約 59 億&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;；2026 財年第一季期間起暫停，授權餘額不等於未來必定回購。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;figure&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt signals&quot;&gt;&lt;tr&gt;&lt;th&gt;指標&lt;/th&gt;&lt;th&gt;數值&lt;/th&gt;&lt;th&gt;說明&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;有息負債÷息稅折舊攤銷前利益（EBITDA）&lt;/td&gt;&lt;td&gt;1.75 倍&lt;/td&gt;&lt;td&gt;淨負債為負；公司債皆無擔保&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;一年內到期公司債&lt;/td&gt;&lt;td&gt;20 億美元&lt;/td&gt;&lt;td&gt;2026-11-01、2027-03-27 各 10 億（2026-08-31 資產負債表；11-01 那筆償還情形待下一份 10-Q 確認）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;未動用承諾授信&lt;/td&gt;&lt;td&gt;30 億美元&lt;/td&gt;&lt;td&gt;364 天 10 億、五年期 20 億&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;營運資金天數（推導）&lt;/td&gt;&lt;td&gt;存貨 110／應收 42／應付 48 天&lt;/td&gt;&lt;td&gt;追蹤收款與採購&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;資產變化：存貨、應收與關稅退款&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;存貨 78 億美元、比去年同期 −3%，與營收同步，判讀正常。&lt;/strong&gt;應收帳款比去年同期 +5.6%（2026-08-31 對 2025-08-31），高於近四季營收年增 −1.2%；10-Q 只說明 5 月到 8 月減少（收回退款），年度增加未說明，列為未解釋。應付帳款 −9%，公司也未說明。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;關稅退款屬非經常項目，10-Q 說明餘款在第一季收回並繳付相關所得稅，已解釋。&lt;/strong&gt;線索（待查）：批發比重上升可能拉長收款、採購減少可能壓低應付，公司都未說明。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;figure&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt signals&quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;變化&lt;/th&gt;&lt;th&gt;判讀&lt;/th&gt;&lt;th&gt;出處&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;存貨&lt;/td&gt;&lt;td&gt;比去年同期 −3%&lt;/td&gt;&lt;td class=&quot;st-正常&quot;&gt;正常&lt;/td&gt;&lt;td&gt;10-Q 資產負債表&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;應收帳款&lt;/td&gt;&lt;td&gt;比去年同期 +6%&lt;/td&gt;&lt;td class=&quot;st-未解釋&quot;&gt;未解釋&lt;/td&gt;&lt;td&gt;10-Q 資產負債表與 MD&amp;amp;A&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;應付帳款&lt;/td&gt;&lt;td&gt;比去年同期 −9%&lt;/td&gt;&lt;td class=&quot;st-未解釋&quot;&gt;未解釋&lt;/td&gt;&lt;td&gt;10-Q 資產負債表&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;關稅退款&lt;/td&gt;&lt;td&gt;約 9.86 億（非經常）&lt;/td&gt;&lt;td class=&quot;st-已解釋&quot;&gt;已解釋&lt;/td&gt;&lt;td&gt;2026 財年 10-K、8-K（06-30）&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;公司內部治理：董事會、控制權與薪酬&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;Nike 採&lt;a class=&quot;term&quot; href=&quot;#g8&quot;&gt;雙重股權&lt;/a&gt;：A 股選出四分之三董事，Swoosh, LLC（創辦人 Philip Knight 為持有其 A 股而成立的公司，其子、董事 Travis Knight 參與管理）持有約 79% 的 A 股，對董事會組成有決定性影響。&lt;/strong&gt;董事長、執行長與首席獨立董事分設，股東會 11 位提名人中 8 位獨立。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;績效股以調整後營收與調整後每股盈餘各半計；五年前投入 100 美元，公司股東總報酬 36 美元、同業 48 美元。&lt;/strong&gt;4 人公開市場買進（2026-04-07～04-13，含執行長與 Tim Cook），加權均價約 42.4 美元&lt;span class=&quot;src&quot;&gt;（推算，Form 4）&lt;/span&gt;，目前帳面虧損；內部人窗口取 8 個月（2026-03-18 起）以涵蓋這四筆。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;figure&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt signals&quot;&gt;&lt;tr&gt;&lt;th&gt;治理指標&lt;/th&gt;&lt;th&gt;內容&lt;/th&gt;&lt;th&gt;出處&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;董事會&lt;/td&gt;&lt;td&gt;執行董事長 Mark Parker、執行長 Elliott Hill；9 月新增 LVMH 的 Alexandre Arnault（LVMH 旗下酒類事業 Moët Hennessy 副執行長、LVMH 董事），獨立性未公布&lt;/td&gt;&lt;td&gt;2026 委託書；8-K（09-16）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;內部人買進&lt;/td&gt;&lt;td&gt;執行長 Hill、董事 Tim Cook、Robert Swan、John Rogers（9 月已退休），2026-04-07～04-13&lt;/td&gt;&lt;td&gt;Form 4&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;內部人賣出&lt;/td&gt;&lt;td&gt;同期 9 筆公開市場賣出、約 157 萬美元，多屬預先排定交易計畫（10b5-1）&lt;/td&gt;&lt;td&gt;Form 4&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;業務治理：管理層更替與轉型計畫&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;財務團隊更替：前財務長 Matt Friend 卸任，David Denton 8 月 17 日接任；會計長 Johanna Nielsen 9 月 4 日離職、由 Denton 暫兼；11 月 9 日起由 7 月退休的 Dan McKenzie（55 歲）回任會計長，Denton 卸下暫代&lt;span class=&quot;src&quot;&gt;（8-K 2026-11-09 §3–§4）&lt;/span&gt;。&lt;/strong&gt;執行長推動以運動項目為核心的轉型策略（Sport Offense）：依運動項目重組團隊、修復批發、減少折扣。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;依 10 月 1 日 &lt;a class=&quot;term&quot; href=&quot;#g17&quot;&gt;8-K&lt;/a&gt; 附件推導的第一季分部息稅前利益率：北美 22.8%、歐洲中東非洲 22.9%、大中華區 21.0%（去年 24.9%）、亞太拉美 22.1%、Converse 9.5%。&lt;/strong&gt;分部未分攤全球品牌與公司費用，不能當集團利潤率。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;白話說&lt;/b&gt;像家庭收入減少後先停額外存股（回購）、照常給零用錢（股利），差額從存款付，同時又規劃一次縮減開支。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;要留意&lt;/b&gt;應收年增、應付年減，公司都未說明（未解釋，見改判訊號）；Pace 節省也未計再投資。&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;events&quot;&gt;&lt;div class=&quot;qno&quot;&gt;問題 07&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;近半年發生了什麼重大事件？&lt;/div&gt;&lt;h2&gt;下修今年營收、宣布重組；財務長與會計長換人、新增董事&lt;/h2&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;下表保留近 12 個月 7 項較相關的重大事件公告&lt;span class=&quot;src&quot;&gt;（8-K）&lt;/span&gt;。&lt;/strong&gt;10 月 1 日第一季營收 112 億美元、減少 4%，全年營收預期衰退高個位數、調整後每股盈餘 1.15–1.35 美元，是估值低谷假設的依據；同時宣布 Pace 計畫，稅前費用約 10 億美元。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;人事方面財務長與會計長更替（11 月 9 日 Dan McKenzie 回任會計長）、9 月新增董事（見第六題）；9 月股東會通過員工認股計畫增加 1,600 萬股，列為稀釋追蹤。&lt;/strong&gt;最新 10-Q 為 2026-08-31 季；2026-11-01 到期 10 億美元票據的償還情形待下一份 10-Q 確認。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;note-box&quot;&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:14px&quot;&gt;近 12 個月較相關的 7 項 8-K 事件（依關聯性排序；未標年份者為 2026 年；不是全部 8-K）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;申報日（事件日）&lt;/th&gt;&lt;th&gt;事件&lt;/th&gt;&lt;th&gt;內容重點&lt;/th&gt;&lt;th&gt;影響哪個判斷&lt;/th&gt;&lt;th&gt;關聯性&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;10-01（10-01）&lt;/td&gt;&lt;td&gt;第一季財報＋重組（Item 2.02、2.05）&lt;/td&gt;&lt;td&gt;營收 112 億 −4%；全年營收預期衰退高個位數；Pace 費用約 10 億&lt;/td&gt;&lt;td&gt;第二、五題&lt;/td&gt;&lt;td&gt;高&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;06-30（06-30）&lt;/td&gt;&lt;td&gt;2026 財年第四季財報（Item 2.02）&lt;/td&gt;&lt;td&gt;毛利率含約 9.86 億關稅退款&lt;/td&gt;&lt;td&gt;第三、五題&lt;/td&gt;&lt;td&gt;高&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;06-23（06-16）&lt;/td&gt;&lt;td&gt;初步財報＋新財務長（Item 2.02、5.02）&lt;/td&gt;&lt;td&gt;David Denton 8 月 17 日起任財務長（6 月 8-K 原寫 16 日）&lt;/td&gt;&lt;td&gt;第六題&lt;/td&gt;&lt;td&gt;中&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;08-10（08-04）&lt;/td&gt;&lt;td&gt;會計長離職（Item 5.02）&lt;/td&gt;&lt;td&gt;Johanna Nielsen 9 月 4 日離職；無歧見&lt;/td&gt;&lt;td&gt;第六題&lt;/td&gt;&lt;td&gt;中&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;09-16（09-15）&lt;/td&gt;&lt;td&gt;新任董事（Item 5.02）&lt;/td&gt;&lt;td&gt;Alexandre Arnault 加入董事會&lt;/td&gt;&lt;td&gt;第六題&lt;/td&gt;&lt;td&gt;中&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;11-09（11-09）&lt;/td&gt;&lt;td&gt;會計長任命（Item 5.02）&lt;/td&gt;&lt;td&gt;Dan McKenzie 回任會計長；財務長卸下暫代&lt;/td&gt;&lt;td&gt;第六題&lt;/td&gt;&lt;td&gt;中&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2025-12-02（12-02）&lt;/td&gt;&lt;td&gt;營運長任命、商務長職位撤銷（Item 5.02）&lt;/td&gt;&lt;td&gt;Venkatesh Alagirisamy 12 月 8 日起任營運長；Craig Williams 商務長職位撤銷，2026-04-06 離職&lt;/td&gt;&lt;td&gt;第六題&lt;/td&gt;&lt;td&gt;中&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;白話說&lt;/b&gt;全年指引像天氣預報：預期營收衰退，估值就反映低谷；指引若更改，再核對回升時程與利潤率。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;要留意&lt;/b&gt;下一份季報（預計 12 月，日期未公布）看大中華區是否止跌、批發訂單方向與是否再調指引。&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;news&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;與報告相關的近期新聞&lt;/p&gt;&lt;h3&gt;新聞印證轉型偏慢：大中華區與 Converse 拖累&lt;/h3&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;我們針對主張同時搜尋支持與反對的新聞，挑 6 則可靠且直接相關者，回到原文核對引句。&lt;/strong&gt;重點是公司預期營收衰退、分析師視 Pace 為第三個重組計畫，反方是跑步回升；估值依官方指引，不依新聞本身。&lt;/p&gt;&lt;p&gt;新聞於 2026-11-17 重抓 257 則：11-06～11-16 只有意見文、股價評論、產品測評、已知人事與裁員彙整，沒有新公司事實，未引用；11-17 起的報導晚於收盤日，不納入。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;新聞摘要（依日期排序）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;日期&lt;/th&gt;&lt;th&gt;新聞&lt;/th&gt;&lt;th&gt;來源&lt;/th&gt;&lt;th&gt;對應主張&lt;/th&gt;&lt;th&gt;方向&lt;/th&gt;&lt;th&gt;我們的判讀&lt;/th&gt;&lt;th&gt;原文網址&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;06-30&lt;/td&gt;&lt;td&gt;CNBC：2026 財年第四季毛利率因約 9.86 億美元關稅退款而大增；大中華區 −12%&lt;/td&gt;&lt;td&gt;CNBC（引述公司財報；一手出處為 8-K 2026-06-30 與 2026 財年 10-K）&lt;/td&gt;&lt;td&gt;C2&lt;/td&gt;&lt;td&gt;背景&lt;/td&gt;&lt;td&gt;關稅退款是非經常的成本沖回，使近四季每股盈餘與利潤率高估本業；扣除口徑見第三題。&lt;/td&gt;&lt;td class=&quot;link&quot;&gt;&lt;a href=&quot;https://www.cnbc.com/2026/06/30/nike-nke-q4-2026-earnings.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;原文&lt;/a&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;07-29&lt;/td&gt;&lt;td&gt;CNBC：Nike 大中華區營收連續八季年減，較 2021 年縮水約三成，本土品牌與「國潮」搶走年輕消費者&lt;/td&gt;&lt;td&gt;CNBC（含 GlobalData 數據與當地研究者訪談）&lt;/td&gt;&lt;td&gt;C4&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;支持大中華區是結構性問題，長期利潤率因此設 11.5%；第一季再跌 22%，尚無止跌證據。&lt;/td&gt;&lt;td class=&quot;link&quot;&gt;&lt;a href=&quot;https://www.cnbc.com/2026/07/29/nike-china-sales-decline.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;原文&lt;/a&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;09-16&lt;/td&gt;&lt;td&gt;Nike 官方：LVMH 的 Alexandre Arnault 加入董事會&lt;/td&gt;&lt;td&gt;NIKE, Inc. 投資人關係新聞稿（Business Wire）&lt;/td&gt;&lt;td&gt;C5&lt;/td&gt;&lt;td&gt;背景&lt;/td&gt;&lt;td&gt;增加品牌經營經驗的董事；獨立性尚未判定，對治理影響中性，不推測其他意圖。&lt;/td&gt;&lt;td class=&quot;link&quot;&gt;&lt;a href=&quot;https://investors.nike.com/news-events/press-releases/detail/574/alexandre-arnault-joins-nike-inc-board-of-directors&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;原文&lt;/a&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;10-01&lt;/td&gt;&lt;td&gt;Modern Retail：跑步品類雙位數成長、市占回升，是第一季少數亮點&lt;/td&gt;&lt;td&gt;Modern Retail（引述 Nike 電話會議）&lt;/td&gt;&lt;td&gt;C1/C4&lt;/td&gt;&lt;td&gt;反方&lt;/td&gt;&lt;td&gt;反駁轉型完全沒效：跑步與北美有回升跡象，但規模不足以抵銷大中華區與 Converse 下滑。&lt;/td&gt;&lt;td class=&quot;link&quot;&gt;&lt;a href=&quot;https://www.modernretail.co/operations/running-was-a-bright-spot-for-nike-in-an-otherwise-gloomy-quarter/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;原文&lt;/a&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;10-02&lt;/td&gt;&lt;td&gt;CNBC：2027 財年營收預期衰退高個位數，Pace 計畫至 2031 年節省 25 億美元並將裁員；Citi（花旗）：已成「降成本故事」&lt;/td&gt;&lt;td&gt;CNBC（引述公司新聞稿與 Citi 報告）&lt;/td&gt;&lt;td&gt;C1/C3&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;基準情境依據：第 1 年營收 −7%、利潤率 5.7%；Pace 費用約 10 億已列為其他負擔。&lt;/td&gt;&lt;td class=&quot;link&quot;&gt;&lt;a href=&quot;https://www.cnbc.com/2026/10/02/nike-nke-stock-q1-earnings-layoffs.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;原文&lt;/a&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;10-02&lt;/td&gt;&lt;td&gt;Retail Dive（美國零售業新聞網站）：大中華區與 Converse 占營收減少的約 86%；Pace 是 2024 財年以來第三個重組計畫，尚未看到營運槓桿&lt;/td&gt;&lt;td&gt;Retail Dive（引述 GlobalData、BNP Paribas）&lt;/td&gt;&lt;td&gt;C3&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;提醒 Pace 節省不一定落到利潤（分析師意見）；第 5 年利潤率 10.5% 主要靠營收與毛利恢復。&lt;/td&gt;&lt;td class=&quot;link&quot;&gt;&lt;a href=&quot;https://www.retaildive.c &lt;section class=&quot;q&quot; id=&quot;workpaper&quot; data-layer=&quot;計算底稿&quot;&gt;&lt;div class=&quot;qno&quot;&gt;計算底稿&lt;/div&gt;&lt;h2&gt;計算底稿：正文結果的算法與完整表（預設摺疊）&lt;/h2&gt;&lt;p class=&quot;wpnote&quot;&gt;正文每個估值、償債結果都從這裡算出；背景計算照做、送審照核。不讀也不影響理解結論；非買賣建議。&lt;/p&gt;&lt;details id=&quot;wp-3-4&quot;&gt;&lt;summary&gt;3・4 現金與股東：報表對帳與股東回報判讀&lt;/summary&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;現金流報表對帳&lt;/h3&gt;&lt;p&gt;報表對帳（10-Q 2026-08-31，現金、約當現金及受限現金）：期初 7,563.0＋營運 135.0＋投資 -192.0＋融資 -618.0＋其他 15.0＝期末 6,903.0 百萬美元｜完整&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;股東回報判讀表&lt;/h3&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;股東回報（判讀依估值政策門檻，2026-10-14 核定；不影響估值與價格位置）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;數值&lt;/th&gt;&lt;th&gt;判讀&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股利殖利率&lt;/td&gt;&lt;td&gt;4.28%&lt;/td&gt;&lt;td&gt;不評好壞：依估值政策，股利殖利率高低不設門檻（高殖利率常因股價下跌）；占股東收益率 99%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;回購殖利率&lt;/td&gt;&lt;td&gt;0.04%&lt;/td&gt;&lt;td&gt;不評好壞：近四季回購約 20.0 百萬美元，是市值 567.4 億美元的 0.04%；划不划算看「股東收益率」「淨回購」「回購均價」&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股東收益率（股利＋回購）&lt;/td&gt;&lt;td&gt;4.31%（公債的 84%）&lt;/td&gt;&lt;td&gt;中性：4.31% 是 10 年期公債 5.12% 的 84%，現金回饋只補上一部分，其餘要靠成長&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;淨回購殖利率&lt;/td&gt;&lt;td&gt;-1.18%&lt;/td&gt;&lt;td&gt;警示：回購少於發給員工的股票，只在抵銷稀釋（淨 -1.18%）；依政策「治理與資本配置」最高只能評「中」；本次該項評「中」，評等不受影響&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股數年變化（1／3／10 財年）&lt;/td&gt;&lt;td&gt;-0.4%／-1.9%／-1.6%&lt;/td&gt;&lt;td&gt;好：2026 財年對上一財年 -0.4%（減少）；近 3 財年平均每年 -1.9%（減少）；近 10 財年平均每年 -1.6%（減少）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;近十年有回購的年數&lt;/td&gt;&lt;td&gt;10／10&lt;/td&gt;&lt;td&gt;好：近十年有 10 年回購，達政策「穩定」（至少 8 年）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股利連續成長年數&lt;/td&gt;&lt;td&gt;11&lt;/td&gt;&lt;td&gt;好：連續 11 年調高股利，符合政策「近十年年年調高」&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股東回饋占自由現金流&lt;/td&gt;&lt;td&gt;116.20%&lt;/td&gt;&lt;td&gt;警示：股利＋回購是近四季自由現金流的 116%，超過當年賺到的現金；依政策「自由現金流品質」最高只能評「中」；本次該項評「弱」，評等不受影響&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;details id=&quot;wp-mkt&quot;&gt;&lt;summary&gt;市場背景：大盤一句、流動性、空單與參考值的資料日期與存檔&lt;/summary&gt;&lt;p class=&quot;cap&quot;&gt;大盤狀態（市場總覽；只揭露，不進研究評等、價格位置與合理價值）：S&amp;amp;P 500（以 SPY 代表）前十大持股合計 37.3%，最大產業科技 38.2%；那斯達克 100（QQQ）科技占 58.0%；等權重 RSP 減市值加權 SPY 近3個月報酬差 1.7 個百分點，位在 2003 年以來第 79 分位（持平）。高收益債利差 3.30，位在 2023 年以來第 81 分位（偏高）；金融狀況指數 -0.46，位在 1971 年以來第 44 分位（中性）；VIX 18.70，位在 1990 年以來第 56 分位（中性）；融資推估（聯準會，推估）0.74 兆美元（2026-06-30），年增 46.6%（第 92 分位，偏高），占國內公司股權市值 0.68%（第 8 分位，偏低）。（市場總覽收盤日 2026-11-12，市場/市場總覽.json）。&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;流動性、空單與參考值（只列事實與資料日期，不判冷熱、不是買賣訊號；非買賣建議）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;類別&lt;/th&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;數值&lt;/th&gt;&lt;th&gt;資料日期&lt;/th&gt;&lt;th&gt;說明與存檔&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;流動性&lt;/td&gt;&lt;td&gt;20 日均成交量&lt;/td&gt;&lt;td&gt;21,542,900 股&lt;/td&gt;&lt;td&gt;2026-11-16 收盤&lt;/td&gt;&lt;td&gt;90 日均量 29,004,412 股（20 日 ÷ 90 日 0.74 倍）｜市場資料/市場溫度.json#/量能&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;流動性&lt;/td&gt;&lt;td&gt;20 日均成交金額&lt;/td&gt;&lt;td&gt;8.3 億美元&lt;/td&gt;&lt;td&gt;2026-11-16 收盤&lt;/td&gt;&lt;td&gt;市場資料/市場溫度.json#/流動性/20日均成交金額&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;流動性&lt;/td&gt;&lt;td&gt;20 日均周轉率（每日）&lt;/td&gt;&lt;td&gt;1.45%&lt;/td&gt;&lt;td&gt;2026-11-16 收盤&lt;/td&gt;&lt;td&gt;20 日均量 ÷ SEC 封面流通股數（當時可得，依分割換算）；自身近 5 年第 85% 百分位｜市場資料/市場溫度.json#/流動性/20日均換手率&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;空單&lt;/td&gt;&lt;td&gt;放空比率（空單占流通股）&lt;/td&gt;&lt;td&gt;6.26%&lt;/td&gt;&lt;td&gt;2026-10-30 結算&lt;/td&gt;&lt;td&gt;空單 92,915,888 股；前一期（2026-10-15）103,692,118 股，減少 10.4%；FINRA 每月兩次公布的合併空單，取得 2026-11-17｜市場資料/市場溫度.json#/流動性/空單&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;空單&lt;/td&gt;&lt;td&gt;回補天數&lt;/td&gt;&lt;td&gt;4.08 天&lt;/td&gt;&lt;td&gt;2026-10-30 結算&lt;/td&gt;&lt;td&gt;空單 ÷ 日均量（FINRA 自身日均量）；自算 ÷ 90 日均量 3.20 天｜市場資料/市場溫度.json#/流動性/空單&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;參考值&lt;/td&gt;&lt;td&gt;52 週區間位置&lt;/td&gt;&lt;td&gt;14%&lt;/td&gt;&lt;td&gt;2026-11-16 收盤&lt;/td&gt;&lt;td&gt;0%＝52 週低 33.87、100%＝52 週高 66.04（收盤，推算）｜市場資料/市場溫度.json#/趨勢&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;參考值&lt;/td&gt;&lt;td&gt;近 12 個月股價報酬&lt;/td&gt;&lt;td&gt;-40.1%&lt;/td&gt;&lt;td&gt;2026-11-16 收盤&lt;/td&gt;&lt;td&gt;同期 S&amp;amp;P 500 +11.3%｜市場資料/市場溫度.json#/動能&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;參考值&lt;/td&gt;&lt;td&gt;60 日歷史年化波動&lt;/td&gt;&lt;td&gt;30.2%&lt;/td&gt;&lt;td&gt;2026-11-16 收盤&lt;/td&gt;&lt;td&gt;日報酬標準差年化（收盤）｜市場資料/市場溫度.json#/波動&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;參考值&lt;/td&gt;&lt;td&gt;距 200 日均線&lt;/td&gt;&lt;td&gt;-13.2%&lt;/td&gt;&lt;td&gt;2026-11-16 收盤&lt;/td&gt;&lt;td&gt;200 日均線 44.08｜市場資料/市場溫度.json#/趨勢&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;wide&quot;&gt;&lt;/div&gt;&lt;/details&gt;&lt;details id=&quot;wp-5&quot;&gt;&lt;summary&gt;5 估值：情境算式、市價隱含第 12 年倍數、同業與歷史倍數交叉核對、條件式區間算法、市價反推、溢價來源與作者計算說明&lt;/summary&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;作者計算說明&lt;/h3&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;情境參數（估值輸入.json）：基準第 1–5 年營收 −7%、0%、3%、5%、4%，營業利益率 5.7%、6.2%、7.5%、9.0%、10.5%，長期 11.5%；保守長期 7.5%、樂觀 14.0%。&lt;/strong&gt;第 1 年 −7% 是 8-K 2026-10-01 指引「衰退高個位數」取約 −8% 換算近四季基期&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;。衰退期三情境 7 年、永續成長 2.5%（窄分級預設）；銷售對投入資本 3.0（樂觀 3.2，衰退年 9.0）；Pace 稅後約 7.5 億列其他負擔。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;折現率：無風險利率 5.12%（財政部 10 年期 2026-11-16）、股權風險溢價 4.20%（Damodaran 2026-10-01）、beta 1.03&lt;span class=&quot;src&quot;&gt;（Damodaran 鞋類去槓桿 0.93 依不含租賃負債權益比 13.5% 重新加槓桿，推導）&lt;/span&gt;，加權平均資本成本（WACC）8.73%，區間 ±1 個百分點。&lt;/strong&gt;2 年週 beta 0.82 與產業值差 0.21 超過 0.2，中值取產業值；若取兩者平均約 0.93，中點約 +7%&lt;span class=&quot;src&quot;&gt;（約 35 美元，推導）&lt;/span&gt;，價格位置仍合理。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;價格位置由上一輪（2026-11-05）的偏貴改為合理，主因是方法更新而非看法改變：①營運保留現金由扣 34.9 億改為 0（公司未揭露不能分配的現金），每股約 +2.35 美元&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;；②beta 由 1.10 改為產業重新加槓桿 1.03，與公債由 4.84% 升到 5.12% 部分抵銷。&lt;/strong&gt;情境營收與利潤率路徑未改。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;計算核對（計算核對/計算核對.md）兩項過門檻。&lt;/strong&gt;第 1 項（保守情境永續期資本報酬率）採用：保守情境永續期資本報酬率 20% 改窄分級值 11.7%，中點約 −1.1%&lt;span class=&quot;src&quot;&gt;（32.74→32.37；採用前中點取自計算核對.md 試算，推導）&lt;/span&gt;；基準與樂觀維持 20%，理由是雙鑰匙兩把都過、寬分級公式值 19.8%、近四季投入資本報酬率（ROIC）20.8%。若三情境都用 11.7%，中點約 30.94（較採用前 32.74 約 −5.5%、較現行 32.37 約 −4.4%），上緣低於收盤價、價格位置會變偏貴。第 2 項（營運保留現金）不改：營運保留現金 0 有依據&lt;span class=&quot;src&quot;&gt;（10-K、10-Q 查無受限或最低營運現金揭露）&lt;/span&gt;；若改回扣 34.9 億（單項試算，不與上一項疊加），中點約 −7.2%&lt;span class=&quot;src&quot;&gt;（相對採用前中點 32.74，推導）&lt;/span&gt;，現價同樣高於上緣。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;護城河分級：檢查程式依雙鑰匙（不含商譽 ROIC 五年皆高於資本成本；Dick&amp;#x27;s、Shoe Carnival 等第三方申報）判「應為寬」，但林區主分類是轉機股、反轉未確認，依轉機股分級上限規則列窄（作者判斷）；程式同時列兩條互斥錯誤，已記工具待辦。&lt;/strong&gt;若照寬分級（衰退 10 年），只延長衰退期中點約 +1.1%。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;情境幅度：加權中點 ÷ 基準每股約 0.93，低於 0.97 是權重造成（轉型低谷組合 35／45／20）；若用預設 25／50／25，中點約 34.7&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;。&lt;/strong&gt;樂觀長期利潤率 14% 未放寬到參考幅度的 16.1%，因 16.1% 高於 2015–2026 財年最高 15.0%（FY2021）。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;!--新圖表--&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;缺口判斷影響幅度&lt;/h3&gt;&lt;div class=&quot;wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;市價隱含第 12 年倍數（倍）：基準折現率下市價隱含 13.3 倍、模型 11.4 倍（約 1.2 倍差距）；參考帶 p25–p75 12.3–24.0 倍（機械回測樣本，非市場全體；分產業的筆數與公司數少，僅供參考）；特例：明示期 12 年，參考帶是 10 年機械回測，倍數不直接比，僅供參考。只描述，不進評等、不是目標價（估值結果.json#/market_implied_terminal）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 620 242&quot; role=&quot;img&quot; aria-label=&quot;市價隱含第 12 年倍數&quot; class=&quot;chart&quot; style=&quot;max-width:775px&quot;&gt;&lt;line x1=&quot;252.0&quot; x2=&quot;252.0&quot; y1=&quot;22&quot; y2=&quot;216&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;252.0&quot; y=&quot;234&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;5&lt;/text&gt;&lt;line x1=&quot;319.6&quot; x2=&quot;319.6&quot; y1=&quot;22&quot; y2=&quot;216&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;319.6&quot; y=&quot;234&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;10&lt;/text&gt;&lt;line x1=&quot;387.2&quot; x2=&quot;387.2&quot; y1=&quot;22&quot; y2=&quot;216&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;387.2&quot; y=&quot;234&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;15&lt;/text&gt;&lt;line x1=&quot;454.8&quot; x2=&quot;454.8&quot; y1=&quot;22&quot; y2=&quot;216&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;454.8&quot; y=&quot;234&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;20&lt;/text&gt;&lt;line x1=&quot;522.4&quot; x2=&quot;522.4&quot; y1=&quot;22&quot; y2=&quot;216&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;522.4&quot; y=&quot;234&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;25&lt;/text&gt;&lt;line x1=&quot;590.0&quot; x2=&quot;590.0&quot; y1=&quot;22&quot; y2=&quot;216&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;590.0&quot; y=&quot;234&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;30&lt;/text&gt;&lt;text x=&quot;252&quot; y=&quot;16&quot; class=&quot;ax&quot;&gt;EV/EBIT（倍）&lt;/text&gt;&lt;text x=&quot;242&quot; y=&quot;66.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;市價隱含（第 12 年 EV/EBIT）&lt;/text&gt;&lt;rect x=&quot;338.4&quot; y=&quot;50.0&quot; width=&quot;55.0&quot; height=&quot;22&quot; rx=&quot;4&quot; fill=&quot;var(--neg)&quot; opacity=&quot;.28&quot;&gt;&lt;title&gt;高–低折現率：11–15&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;338.4&quot; y=&quot;87.0&quot; class=&quot;ax&quot; text-anchor=&quot;start&quot;&gt;高–低折現率 11–15&lt;/text&gt;&lt;circle cx=&quot;364.4&quot; cy=&quot;61.0&quot; r=&quot;7&quot; fill=&quot;var(--neg)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;1.5&quot;&gt;&lt;title&gt;基準：13&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;364.4&quot; y=&quot;47.0&quot; class=&quot;val&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--neg)&quot;&gt;基準 13&lt;/text&gt;&lt;text x=&quot;242&quot; y=&quot;128.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;模型假設（終值 ÷ 第 12 年 EBIT）&lt;/text&gt;&lt;rect x=&quot;317.0&quot; y=&quot;112.0&quot; width=&quot;50.7&quot; height=&quot;22&quot; rx=&quot;4&quot; fill=&quot;var(--c1)&quot; opacity=&quot;.28&quot;&gt;&lt;title&gt;高–低折現率：10–14&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;317.0&quot; y=&quot;149.0&quot; class=&quot;ax&quot; text-anchor=&quot;start&quot;&gt;高–低折現率 10–14&lt;/text&gt;&lt;circle cx=&quot;338.2&quot; cy=&quot;123.0&quot; r=&quot;7&quot; fill=&quot;var(--c1)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;1.5&quot;&gt;&lt;title&gt;基準：11&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;338.2&quot; y=&quot;109.0&quot; class=&quot;val&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--c1)&quot;&gt;基準 11&lt;/text&gt;&lt;text x=&quot;242&quot; y=&quot;190.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;參考帶（品牌消費）&lt;/text&gt;&lt;rect x=&quot;350.7&quot; y=&quot;174.0&quot; width=&quot;158.2&quot; height=&quot;22&quot; rx=&quot;4&quot; fill=&quot;var(--c7)&quot; opacity=&quot;.28&quot;&gt;&lt;title&gt;p25–p75：12–24&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;350.7&quot; y=&quot;211.0&quot; class=&quot;ax&quot; text-anchor=&quot;start&quot;&gt;p25–p75 12–24&lt;/text&gt;&lt;circle cx=&quot;418.3&quot; cy=&quot;185.0&quot; r=&quot;6&quot; fill=&quot;var(--c7)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;1.5&quot;&gt;&lt;title&gt;中位：17&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;418.3&quot; y=&quot;171.0&quot; class=&quot;val&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--c7)&quot;&gt;中位 17&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;缺口判斷影響幅度：拿掉各項作者判斷、其他不變時，合理價值中點的變動（計算核對.json，2026-11-16）；紅色為過門檻（中點±10%或價格位置跨界或生意等級理由），1 項中 1 項過門檻；虛線為 ±10%。正值＝拿掉後中點變高&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 62&quot; role=&quot;img&quot; aria-label=&quot;缺口判斷影響幅度&quot; class=&quot;chart&quot; style=&quot;max-width:700px&quot;&gt;&lt;line x1=&quot;330.0&quot; x2=&quot;330.0&quot; y1=&quot;6&quot; y2=&quot;56&quot; class=&quot;zero&quot;/&gt;&lt;line x1=&quot;192.9&quot; x2=&quot;192.9&quot; y1=&quot;4&quot; y2=&quot;58&quot; class=&quot;price&quot;/&gt;&lt;line x1=&quot;467.1&quot; x2=&quot;467.1&quot; y1=&quot;4&quot; y2=&quot;58&quot; class=&quot;price&quot;/&gt;&lt;text x=&quot;150&quot; y=&quot;25&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;G2. 營運保留現金改 0&lt;/text&gt;&lt;rect x=&quot;231.3&quot; y=&quot;11&quot; width=&quot;98.7&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--neg)&quot;/&gt;&lt;text x=&quot;338.0&quot; y=&quot;25&quot; class=&quot;val&quot;&gt;-7.2%&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;/div&gt;&lt;!--/新圖表--&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;合理價值怎麼來：三個情境與權重&lt;/h3&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt&quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;每股價值（基準折現率 8.7%）&lt;/th&gt;&lt;th&gt;權重&lt;/th&gt;&lt;th&gt;折現率高端 9.7%&lt;/th&gt;&lt;th&gt;折現率低端 7.7%&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;19.31&lt;/td&gt;&lt;td&gt;35%&lt;/td&gt;&lt;td&gt;16.65&lt;/td&gt;&lt;td&gt;22.97&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;34.98&lt;/td&gt;&lt;td&gt;45%&lt;/td&gt;&lt;td&gt;29.68&lt;/td&gt;&lt;td&gt;42.35&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;49.36&lt;/td&gt;&lt;td&gt;20%&lt;/td&gt;&lt;td&gt;41.82&lt;/td&gt;&lt;td&gt;59.84&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;加權（合理價值）&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;b&gt;32.37&lt;/b&gt;&lt;/td&gt;&lt;td&gt;100%&lt;/td&gt;&lt;td&gt;&lt;b&gt;27.55&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;b&gt;39.07&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;中點是三個情境的加權：0.35×19.31＋0.45×34.98＋0.2×49.36≈32.37（轉型或景氣低谷權重組合）。區間上下緣是同樣三個情境、權重不變，只把折現率換成區間高端或低端重算後加權：高端約 9.7% → 27.55（下緣），低端約 7.7% → 39.07（上緣）。買入上限 22.66＝中點 × (1－安全邊際 30%，不確定性中)，股價在此以下才有 30% 安全邊際。情境表說明合理價值怎麼組成，不是單一目標價；非買賣建議。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;市價隱含第 12 年倍數（只描述，不進評等）&lt;/h3&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;基準情境：市價隱含 vs 模型假設的第 12 年 EV/EBIT（金額百萬美元）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;折現率&lt;/th&gt;&lt;th&gt;WACC&lt;/th&gt;&lt;th&gt;市場 EV&lt;/th&gt;&lt;th&gt;明示期現值&lt;/th&gt;&lt;th&gt;終值折現因子&lt;/th&gt;&lt;th&gt;第 12 年 EBIT&lt;/th&gt;&lt;th&gt;市價隱含倍數&lt;/th&gt;&lt;th&gt;模型終值倍數&lt;/th&gt;&lt;th&gt;隱含÷模型&lt;/th&gt;&lt;th&gt;現在 EV／次年 EBIT&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;低折現率&lt;/td&gt;&lt;td&gt;7.73%&lt;/td&gt;&lt;td&gt;57,015&lt;/td&gt;&lt;td&gt;25,042&lt;/td&gt;&lt;td&gt;0.409&lt;/td&gt;&lt;td&gt;6,855&lt;/td&gt;&lt;td&gt;11.4 倍&lt;/td&gt;&lt;td&gt;13.6 倍&lt;/td&gt;&lt;td&gt;0.84&lt;/td&gt;&lt;td&gt;23.4 倍&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;8.73%&lt;/td&gt;&lt;td&gt;57,015&lt;/td&gt;&lt;td&gt;23,571&lt;/td&gt;&lt;td&gt;0.366&lt;/td&gt;&lt;td&gt;6,855&lt;/td&gt;&lt;td&gt;13.3 倍&lt;/td&gt;&lt;td&gt;11.4 倍&lt;/td&gt;&lt;td&gt;1.17&lt;/td&gt;&lt;td&gt;23.4 倍&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;高折現率&lt;/td&gt;&lt;td&gt;9.73%&lt;/td&gt;&lt;td&gt;57,015&lt;/td&gt;&lt;td&gt;22,220&lt;/td&gt;&lt;td&gt;0.328&lt;/td&gt;&lt;td&gt;6,855&lt;/td&gt;&lt;td&gt;15.5 倍&lt;/td&gt;&lt;td&gt;9.8 倍&lt;/td&gt;&lt;td&gt;1.58&lt;/td&gt;&lt;td&gt;23.4 倍&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;算式：市場 EV＝模型 EV +（現價 − 模型每股價值）× 股數（股權橋與模型相同）；隱含倍數＝（市場 EV − 明示期現值）÷ 終值折現因子 ÷ 第 12 年 EBIT；模型終值倍數＝模型終值 ÷ 第 12 年 EBIT。參考帶：p25 12.3、中位 17.3、p75 24.0、p90 32.0 倍（機械回測樣本，非市場全體；分產業的筆數與公司數少，僅供參考；機械回測訓練期 2016–2021 全部回測日（審查工作區 回測資料/隱含倍數結果.json，1,810 筆中訓練期 1,046 筆；產業＝回測樣本的 Damodaran 產業）；重算：python3 程式/回測_隱含倍數參考帶.py &amp;lt;隱含倍數結果.json&amp;gt;）。只描述，不進價格位置、研究評等與合理價值。&lt;/p&gt;&lt;p class=&quot;cap&quot;&gt;特例：明示期 12 年，參考帶是 10 年機械回測，倍數不直接比，僅供參考。&lt;/p&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;&lt;b&gt;合理價值 vs 市價隱含倍數（作者判讀）：&lt;/b&gt;市價隱含第 12 年 EV/EBIT 約 13.3 倍，高於模型終值倍數 11.4 倍（比 1.17），表示市場對長期獲利略比我們樂觀；特例：本模型明示期 12 年（5 年＋衰退 7 年），參考帶是 10 年機械回測，倍數不直接比。只描述，不進評等。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;如果 10 年後倍數是 17.3 倍，機率加權每股約 42 美元（條件式，非目標價、非買賣建議，不進評等）&lt;/h3&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;第 12 年 EV/EBIT 倍數對照（三情境各用自己的明示期 FCFF 與第 12 年 EBIT；權重 轉型或景氣低谷：保守 35%／基準 45%／樂觀 20%；基準 WACC 8.73%）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;第 12 年倍數&lt;/th&gt;&lt;th&gt;機率加權每股（美元）&lt;/th&gt;&lt;th&gt;折現率低高區間&lt;/th&gt;&lt;th&gt;白話換算&lt;/th&gt;&lt;th&gt;現價相對&lt;/th&gt;&lt;th&gt;說明&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;模型假設倍數&lt;/td&gt;&lt;td&gt;11.4 倍&lt;/td&gt;&lt;td&gt;32.37&lt;/td&gt;&lt;td&gt;27.55–39.07&lt;/td&gt;&lt;td&gt;等於折現率減永續成長約 6.2%（模型 6.2%）&lt;/td&gt;&lt;td&gt;現價在區間內&lt;/td&gt;&lt;td&gt;各情境用自己的模型終值倍數（表列為基準情境）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;穩態理論上限&lt;/td&gt;&lt;td&gt;13.0 倍&lt;/td&gt;&lt;td&gt;35.29&lt;/td&gt;&lt;td&gt;32.32–38.61&lt;/td&gt;&lt;td&gt;等於折現率減永續成長約 5.4%（模型 6.2%）&lt;/td&gt;&lt;td&gt;現價在區間內&lt;/td&gt;&lt;td&gt;（1−t）（1+g）÷（WACC−g）：再投資為零（ROIC 無限大）時的上限；t＝第 12 年 1−NOPAT÷EBIT&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;參考帶中位（品牌消費）&lt;/td&gt;&lt;td&gt;17.3 倍&lt;/td&gt;&lt;td&gt;42.01&lt;/td&gt;&lt;td&gt;38.34–46.11&lt;/td&gt;&lt;td&gt;等於折現率減永續成長約 4.1%（模型 6.2%）&lt;/td&gt;&lt;td&gt;現價低於區間&lt;/td&gt;&lt;td&gt;所選參考帶（大類）中位&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;同業今日 EV/EBIT 中位&lt;/td&gt;&lt;td&gt;7.5 倍&lt;/td&gt;&lt;td&gt;26.76&lt;/td&gt;&lt;td&gt;24.68–29.08&lt;/td&gt;&lt;td&gt;等於折現率減永續成長約 9.4%（模型 6.2%）&lt;/td&gt;&lt;td&gt;現價高於區間&lt;/td&gt;&lt;td&gt;估值結果 multiples.ev_ebit.peer_quartiles.p50（今天的倍數，不是 10 年後）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;參考帶 p75（品牌消費）&lt;/td&gt;&lt;td&gt;24.0 倍&lt;/td&gt;&lt;td&gt;52.48&lt;/td&gt;&lt;td&gt;47.72–57.81&lt;/td&gt;&lt;td&gt;等於折現率減永續成長約 3.0%（模型 6.2%）&lt;/td&gt;&lt;td&gt;現價低於區間&lt;/td&gt;&lt;td&gt;所選參考帶（大類）p75&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;市價隱含&lt;/td&gt;&lt;td&gt;13.3 倍&lt;/td&gt;&lt;td&gt;35.78&lt;/td&gt;&lt;td&gt;32.76–39.15&lt;/td&gt;&lt;td&gt;等於折現率減永續成長約 5.3%（模型 6.2%）&lt;/td&gt;&lt;td&gt;現價在區間內&lt;/td&gt;&lt;td&gt;基準情境、基準折現率反推（只用基準情境，套到三情境後加權不必等於現價）&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;如果 10 年後倍數是 X，三情境各用自己的明示期 FCFF 與第 12 年 EBIT、以基準折現率折現，依政策情境機率權重加權的每股價值；區間只換折現率（①模型列為合理價值區間）。「折現率減永續成長」＝(1+g)(1−t)(1−g/ROIC)÷倍數（基準情境永續參數）。條件式，非目標價、非買賣建議，不進評等。模型假設倍數那一列等於合理價值（中點 32.37）。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;合理性與一致性檢查（只顯示，不改估值與評等）&lt;/h3&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;每項都有反方向版本；「方向」是亮燈時模型偏保守還是偏積極&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;編號&lt;/th&gt;&lt;th&gt;檢查&lt;/th&gt;&lt;th&gt;燈號&lt;/th&gt;&lt;th&gt;方向&lt;/th&gt;&lt;th&gt;說明&lt;/th&gt;&lt;th&gt;反方向條件&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;S1&lt;/td&gt;&lt;td&gt;合理價中點隱含本益比對照營收成長&lt;/td&gt;&lt;td&gt;綠&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;合理價中點 ÷ 近四季 EPS（替代未來一年 EPS，資料未存遠期 EPS）＝18.7 倍；近四季營收年增 -1.2%&lt;/td&gt;&lt;td&gt;反方向：年增 &amp;lt; 5% 且 &amp;gt; 30 倍黃、&amp;gt; 40 倍紅&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;S2&lt;/td&gt;&lt;td&gt;DCF 中點與其他方法中點差距&lt;/td&gt;&lt;td&gt;綠&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;其他方法中點的中位數 33.03（2 法：自身・近五年（2021-11-16 起）〔EV／自由現金流〕、同業現行（DECK、ONON、LULU、VFC）〔EV／自由現金流〕）÷ DCF 中點 32.37&lt;/td&gt;&lt;td&gt;反方向：比值 &amp;lt; 0.67 黃、&amp;lt; 0.5 紅（DCF 比其他方法高很多）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;S3&lt;/td&gt;&lt;td&gt;折現率減市價反推折現率&lt;/td&gt;&lt;td&gt;綠&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;採用 8.73%，市價反推（基準情境現價隱含年報酬）8.24%，差 +0.5 個百分點&lt;/td&gt;&lt;td&gt;反方向：採用比反推低 2 點以上黃、3 點以上紅&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;S4&lt;/td&gt;&lt;td&gt;終值占總價值比例&lt;/td&gt;&lt;td&gt;綠&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;基準情境終值現值占企業價值 55%&lt;/td&gt;&lt;td&gt;反方向：&amp;lt; 25% 黃（價值幾乎全靠明示期）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;S5&lt;/td&gt;&lt;td&gt;終值倍數落點&lt;/td&gt;&lt;td&gt;紅&lt;/td&gt;&lt;td&gt;偏保守&lt;/td&gt;&lt;td&gt;模型最後一年 EV/EBIT 11.4 倍；參考帶（品牌消費）p25 12.3 中位 17.3 p75 24.0；護城河 窄；護城河窄卻低於參考帶 p25；明示期 12 年、參考帶是 10 年，僅供參考&lt;/td&gt;&lt;td&gt;反方向：高於 p75 紅、護城河無而高於中位黃（已含）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;S6&lt;/td&gt;&lt;td&gt;保守（或積極）假設疊加項數&lt;/td&gt;&lt;td&gt;黃&lt;/td&gt;&lt;td&gt;偏保守&lt;/td&gt;&lt;td&gt;保守：成長（基準首年比近四季 -5.8 點）、利潤率（首年比近四季 -2.5 點）、終值（護城河寬或窄卻低於參考帶中位）；積極：無&lt;/td&gt;&lt;td&gt;反方向：積極項數 3 黃、4 以上紅（已含）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;S9&lt;/td&gt;&lt;td&gt;樂觀情境低於現價要說明&lt;/td&gt;&lt;td&gt;綠&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;現價在保守與樂觀之間&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;S10&lt;/td&gt;&lt;td&gt;DCF 情境範圍與其他方法是否完全錯開&lt;/td&gt;&lt;td&gt;綠&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;樂觀 49.36、保守 19.31；其他方法最低下緣 12.55、最高上緣 57.84&lt;/td&gt;&lt;td&gt;反方向：保守高於所有其他方法上緣紅（已含）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;S7&lt;/td&gt;&lt;td&gt;折現率跨公司排序&lt;/td&gt;&lt;td&gt;黃&lt;/td&gt;&lt;td&gt;偏保守&lt;/td&gt;&lt;td&gt;BFAM（風險分 2 對 0，折現率 7.59% 低於本公司 8.76%）；FTDR（風險分 2 對 0，折現率 8.69% 低於本公司 8.76%）；NVO（風險分 2 對 0，折現率 8.49% 低於本公司 8.76%）；SFM（風險分 2 對 0，折現率 8.67% 低於本公司 8.76%）&lt;/td&gt;&lt;td&gt;反方向：本公司風險分高 2 以上、折現率卻較低時，記在對方公司（同一規則兩頭都檢）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;S8&lt;/td&gt;&lt;td&gt;品質倒掛&lt;/td&gt;&lt;td&gt;綠&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;反方向：生意 C 高於 B 中位（已含）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;C1&lt;/td&gt;&lt;td&gt;護城河用詞統一寬／窄／無&lt;/td&gt;&lt;td&gt;黃&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;出現強／中／弱用法&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;C2&lt;/td&gt;&lt;td&gt;兩頁不並存兩套字母評等&lt;/td&gt;&lt;td&gt;綠&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;C3&lt;/td&gt;&lt;td&gt;假設與自己的護城河評分一致（P4）&lt;/td&gt;&lt;td&gt;綠&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;C4&lt;/td&gt;&lt;td&gt;同一事件期間描述一致（指引達成連續季數）&lt;/td&gt;&lt;td&gt;綠&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;C5&lt;/td&gt;&lt;td&gt;同一指標不同段落同值&lt;/td&gt;&lt;td&gt;綠&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;比對 9 個指標、23 處，沒有對不上&lt;/td&gt;&lt;td&gt;不分方向：任一處寫高或寫低都會亮；條件句、敏感度試算、其他期間與情境的數字不比（寧可漏報）&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;!--成長型價格參考--&gt;&lt;div class=&quot;block&quot; id=&quot;growth-ref&quot;&gt;&lt;h3&gt;成長型價格參考：報酬門檻價、五年報酬矩陣、林區比值（只描述，不進評等，非買賣建議）&lt;/h3&gt;&lt;p class=&quot;cap&quot;&gt;這一段只描述，不進研究評等、不改價格位置，也不是目標價；三種情境並列、不合成單一數字，數字是「該情境成真時」的條件式推算，不是預期報酬。非買賣建議。&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;一、報酬門檻價：收盤 2026-11-16 股價 38.26 美元（三情境並列；條件式推算，非目標價）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;年報酬 7% 的每股價格（美元）&lt;/th&gt;&lt;th&gt;年報酬 8% 的每股價格（美元）&lt;/th&gt;&lt;th&gt;年報酬 9% 的每股價格（美元）&lt;/th&gt;&lt;th&gt;年報酬 10% 的每股價格（美元）&lt;/th&gt;&lt;th&gt;現價隱含年報酬&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;26.65&lt;/td&gt;&lt;td&gt;21.84&lt;/td&gt;&lt;td&gt;18.50&lt;/td&gt;&lt;td&gt;16.05&lt;/td&gt;&lt;td&gt;5.6%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;49.79&lt;/td&gt;&lt;td&gt;40.07&lt;/td&gt;&lt;td&gt;33.37&lt;/td&gt;&lt;td&gt;28.48&lt;/td&gt;&lt;td&gt;8.2%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;70.40&lt;/td&gt;&lt;td&gt;56.59&lt;/td&gt;&lt;td&gt;47.06&lt;/td&gt;&lt;td&gt;40.11&lt;/td&gt;&lt;td&gt;10.3%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;算法：各情境的 10 年現金流與終值改用門檻當折現率，經同一股權橋換成每股；股價等於這個價格時，該情境成真的現價隱含年報酬就等於門檻（兩者互為反函數）。&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;二、五年報酬矩陣：現價買進、持有 5 年的年化報酬（三情境 × 三種第 5 年倍數；推導，條件式，非預期報酬）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;第 5 年 EBIT（估值輸入單位，推導）&lt;/th&gt;&lt;th&gt;維持現在 18.6 倍&lt;/th&gt;&lt;th&gt;縮四分之一 13.9 倍&lt;/th&gt;&lt;th&gt;回到參考帶中位（品牌消費） 17.3 倍&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;3,191.8&lt;/td&gt;&lt;td&gt;4.1%&lt;/td&gt;&lt;td&gt;-1.2%&lt;/td&gt;&lt;td&gt;2.7%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;5,040.3&lt;/td&gt;&lt;td&gt;14.0%&lt;/td&gt;&lt;td&gt;8.2%&lt;/td&gt;&lt;td&gt;12.5%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;6,887.0&lt;/td&gt;&lt;td&gt;21.6%&lt;/td&gt;&lt;td&gt;15.6%&lt;/td&gt;&lt;td&gt;20.1%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;算法：現價買進、持有 5 年：第 1–5 年自由現金流與第 5 年企業價值（倍數 × 該情境第 5 年 EBIT）折回今天、經今日股權橋與股數換成每股，解出使每股等於現價的年報酬（與現價隱含年報酬同一算法，只是第 5 年改用倍數計價）；不另估 5 年後的淨債務與股數。企業價值 ÷ 當年 EBIT 口徑與市價隱含第 12 年倍數、參考帶相同。推導。現在倍數＝市場企業價值 57,014.6 ÷ 近四季營業利益 3,072.0（估值輸入 company_metrics.ebit）＝18.6 倍；縮四分之一＝現在倍數 × 0.75。參考帶：大類層「品牌消費」中位 17.3 倍（機械回測樣本，非市場全體；分產業的筆數與公司數少，僅供參考）。&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;三、林區比值（只給比值與口徑；成長率與本益比的口徑同「PEG 與林區檢查」表的基準情境推估那一列）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;數值&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;林區分類&lt;/td&gt;&lt;td&gt;轉機股（Turnaround）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;成長率（基準情境推估（稅後營業利益年增－股數年變化））&lt;/td&gt;&lt;td&gt;10.1%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;本益比&lt;/td&gt;&lt;td&gt;22.1 倍&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股息殖利率&lt;/td&gt;&lt;td&gt;4.3%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;本益比 ÷ 成長率&lt;/td&gt;&lt;td&gt;2.20&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;（成長率＋股息殖利率）÷ 本益比&lt;/td&gt;&lt;td&gt;0.65&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;林區以本益比約等於成長率為參考（二手來源轉述）；本表不設門檻。只給比值與口徑，不作便宜或昂貴的判斷，不進研究評等與價格位置。非買賣建議。&lt;/p&gt;&lt;/div&gt;&lt;!--/成長型價格參考--&gt;&lt;div class=&quot;note-box&quot;&gt;&lt;b&gt;同業與歷史倍數交叉核對（不進評等）：25–40 美元&lt;/b&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;依同業的本益比、企業價值／營業利益、企業價值／營收倍數與自身歷史本益比換算的每股價值，各法 25 百分位的中位數到 75 百分位的中位數；不是股價波動範圍，也不是合理價值。原稱「市場情緒區間」；2026-11-11 起只作交叉核對，不決定價格位置與研究評等（價格位置對稱四級：便宜、偏低、合理、偏貴，只看內在價值；同業與歷史倍數只作標註）。&lt;/p&gt;&lt;p class=&quot;cap&quot; id=&quot;peer-outliers&quot; style=&quot;margin-top:4px&quot;&gt;同業異常值：不計入分位：UAA 0.5 倍（ev_sales，低於同組中位數 1.1 倍的一半，不進分位（D4））。偏離但同組太少、仍計入：VFC 16.6 倍（ev_ebit，偏離同組中位數 7.5 倍超過 2 倍，但同業太少（排除後不足 3 家），只標註、仍進分位（D4））。&lt;/p&gt;&lt;/div&gt;&lt;!--目標區間:第五題--&gt;&lt;div class=&quot;block&quot; id=&quot;target-body&quot;&gt;&lt;h3&gt;各情境成真時的價值（一年後，條件式、非買賣建議）&lt;/h3&gt;&lt;p class=&quot;cap&quot;&gt;條件式目標區間：三種情境各自成真時的每股價值區間，不是股價預測，三段不合成單一數字；非買賣建議。不影響合理價值、價格位置與研究評等。&lt;/p&gt;&lt;p&gt;算法：各情境每股價值（折現率高低兩端）×（1＋股權成本 9.45%）− 未來 12 個月每股股利 1.64 美元（作者輸入：8-K 2026-10-01 新聞稿 §16：2027 財年第一季每股宣告股利 0.410 美元；0.41 × 4＝1.64（推導，未計 12 個月內可能的調升；股利已連續成長 11 年，價值判斷.json#/股東回報/股利連續成長年數））；回購不加回。起點 2026-11-16 收盤，終點 2027-11-16。三段是各情境在折現率上下兩端的每股價值向前推 12 個月，不是價格機率分布的切片；段與段之間可能有空白，也可能重疊。區間主要寬度來自折現率不確定，不是 12 個月內的營運變化。&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt&quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;機率（政策權重，未經歷史校準）&lt;/th&gt;&lt;th&gt;目標區間（美元）&lt;/th&gt;&lt;th&gt;相對現價&lt;/th&gt;&lt;th&gt;關鍵假設（估值輸入）&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;35%&lt;/td&gt;&lt;td&gt;&lt;b&gt;16.58–23.50&lt;/b&gt;&lt;/td&gt;&lt;td&gt;−57%～−39%&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;第 1 年營收 -9.0%；營業利益率 5.0%；穩態 7.5%；永續成長 2.5%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;45%&lt;/td&gt;&lt;td&gt;&lt;b&gt;30.84–44.71&lt;/b&gt;&lt;/td&gt;&lt;td&gt;−19%～+17%&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;第 1 年營收 -7.0%；營業利益率 5.7%；穩態 11.5%；永續成長 2.5%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;20%&lt;/td&gt;&lt;td&gt;&lt;b&gt;44.13–63.85&lt;/b&gt;&lt;/td&gt;&lt;td&gt;+15%～+67%&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;第 1 年營收 -5.0%；營業利益率 6.2%；穩態 14.0%；永續成長 2.5%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;口徑：報告中「現價隱含年報酬（基準情境，非預期報酬）約 8.2%」是以現價買進、持有該情境全期現金流（含永續價值）的年化報酬；這裡的目標區間是 12 個月後各情境每股價值的前推，兩者口徑不同，不能互相換算（例如不能用前者推 12 個月後的價格）。&lt;/p&gt;&lt;h4 style=&quot;margin-top:14px&quot;&gt;每一段要成立，市場這一面需要什麼、正在顯示什麼&lt;/h4&gt;&lt;ul class=&quot;prose&quot;&gt;&lt;li&gt;12 個月選擇權隱含分布：未取得（到期日 2027-12-17 價平附近沒有有效報價（盤前盤後或無成交時 Yahoo 常給佔位值））；不補值。&lt;/li&gt;&lt;li&gt;公債殖利率下降 1 個百分點時，保守／基準／樂觀段代表值（基準折現率前推，不是區間兩端的平均）為 22.7／43.2／61.6；目前 19.5／36.6／52.4；上升 1 個百分點時為 17.1／31.8／45.4（美元，股權成本同幅變動，其他假設不變）。&lt;/li&gt;&lt;li&gt;分析師預估：本財年每股盈餘預估 1.25，較 30 天前 1.31 −4.6%（下修），近 30 天 0 家上修、32 家下修；下一財年每股盈餘預估 1.53，較 30 天前 1.72 −11.2%（下修），近 30 天 0 家上修、33 家下修。只描述預估修正的方向，不當證據，也不是目標區間的任一端。&lt;/li&gt;&lt;li&gt;券商目標價近 90 天有 21 家調整：上調 1、下調 16、持平 4（只揭露，不是本報告的目標價）。&lt;/li&gt;&lt;li&gt;上季（Aug 2026，10/1/2026 公布）每股盈餘 0.48，共識預估 0.43，驚奇 11.63%（Nasdaq）；yfinance 另列 2026-08-31 實際 0.48、預估 0.44、驚奇 +9.87%；兩個來源口徑可能不同（可能是調整後或一般會計準則），公司申報的每股盈餘可對照存檔 8-K 2026-10-01 財報新聞稿（本句未逐項比對），只描述、不當證據。&lt;/li&gt;&lt;/ul&gt;&lt;p class=&quot;cap&quot;&gt;以上只引用已存檔的數字描述條件與現況，不是預測；選擇權機率是風險中立機率、不是真實機率，不改情境權重；分析師預估與券商目標價不當證據；細節表在附錄估值細節。&lt;/p&gt;&lt;p&gt;&lt;b&gt;需要重算區間的事件：&lt;/b&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;2027 財年指引大改：公司 2026-10-01 給的全年指引是營收衰退高個位數、有效稅率約 25%、調整後稀釋每股盈餘 1.15–1.35 美元（不含約 0.15 美元的 Pace 重組費用）；基準情境第 1 年營收 −7%、營業利益率 5.7% 是由這組指引推算，保守與樂觀也以它為中心上下設定。若第二季（2026-11-30 止）或第三季財報把全年營收或調整後每股盈餘指引改到上述範圍之外，三段的第 1 年假設都要重算；改動方向本報告不判斷（8-K 2026-10-01 新聞稿 §9；8-K 2026-10-01 新聞稿 §10；估值輸入.json#/evidence_notes/公司指引；估值輸入.json#/evidence_notes/轉型判斷）&lt;/li&gt;&lt;li&gt;Pace 重組計畫的費用或範圍改變：董事會核准的 Pace 計畫預計稅前費用約 10 億美元（主要是員工遣散與相關費用，約 3 億在 2027 財年認列、其餘至 2031 財年），另加 2026 財年已認列約 3 億的 3 月計畫遣散費；本報告把稅後約 7.5 億列為股權橋的其他負擔（每股約 0.51 美元，推導，7.5 億 ÷ 1,483 百萬股），利潤率假設不含重組費用。公司在年報表示可能再採取行動、帶來額外費用；若宣布新的重組計畫，或 Pace 費用估計明顯改變，股權橋與利潤率假設要重算（8-K 2026-10-01 本文 §5；8-K 2026-10-01 新聞稿 §8；10-K 2026-05-31 Item 7 ¶24；估值輸入.json#/bridge/other_claims_note）&lt;/li&gt;&lt;li&gt;關稅與 IEEPA 退款：最高法院 2026-02-20 判定依 IEEPA 課徵的關稅無效，公司在 2026 財年第四季把可望收回的 IEEPA 關稅 986 百萬美元列為銷貨成本減項（北美 965、Converse 21），大致抵銷 2026 財年本身的 IEEPA 關稅成本，2026-05-31 之後已收回幾乎全部剩餘應收；近四季營業利益率 8.2% 含這筆非經常性退款（約 2.1 個百分點，推導，986 ÷ 近四季營收 45,891），扣除退款並加回約 3 億遣散費後約 6.7%（推導）。公司表示持續關注美國與其他國家的進出口政策、退稅與相關訴訟；若對鞋類或服飾進口加徵新的關稅、或退款被追回，毛利率與營業利益率假設要重算（10-K 2026-05-31 Item 7 ¶26；10-Q 2026-08-31 Part I, Item 2 ¶13；10-Q 2026-08-31 Part I, Item 2 ¶165；估值輸入.json#/company_metrics/ebit_note）&lt;/li&gt;&lt;li&gt;比利時海關補稅主張：比利時海關就 2018 財年起進口的產品主張公司少繳關稅，公司有異議並已進入上訴程序、開立銀行保證；公司表示目前無法估計可能損失的範圍，若最終不利，應付金額（含罰款）可能對營運結果、財務狀況與現金流量有重大不利影響。公司未揭露金額，本報告股權橋沒有列入、不補值；若 12 個月內判決或和解並揭露金額，股權橋要重算（10-Q 2026-08-31 Part I, Item 1 ¶127）&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;b&gt;時程可能延後、落在 12 個月之外的事件：&lt;/b&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;比利時海關補稅主張的結案時點：公司表示可能要好幾年才會有結果，很可能落在目標區間終點 2027-11-16 之後（10-Q 2026-08-31 Part I, Item 1 ¶127）&lt;/li&gt;&lt;li&gt;Pace 節省的落地時點：公司預計 Pace 至 2031 財年累計節省約 25 億美元（扣除重組費用與未來再投資之前），未揭露各年分配；情境利潤率回升主要放在第 2–5 年，12 個月內可在申報看到的節省多少本報告無法判斷，節省是否落到利潤（而非再投資）大多要到終點之後的各期才能檢驗（8-K 2026-10-01 新聞稿 §8；8-K 2026-10-01 新聞稿 §9；估值輸入.json#/evidence_notes/轉型判斷）&lt;/li&gt;&lt;/ul&gt;&lt;ul class=&quot;cap&quot;&gt;&lt;li&gt;不列倍數核對：主尺 EV／自由現金流 沒有對應的情境第 1 年數字。&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;!--/目標區間:第五題--&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;市價要求的成長：三視角反推、假設對照實績、歷史基準比率與市價溢價來源&lt;/h3&gt;&lt;p&gt;這一節把現價代回估值模型反解「市場要求什麼」，再和公司實績、同規模公司的歷史比例、市場面的過熱訊號對照；只揭露，不改合理價值、價格位置與研究評等。&lt;/p&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;市價隱含什麼、我們假設什麼、公司做到什麼&lt;/h4&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;視角（其他假設照基準，三者擇一）&lt;/th&gt;&lt;th&gt;市價隱含&lt;/th&gt;&lt;th&gt;本報告基準&lt;/th&gt;&lt;th&gt;實績或對照&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;成長&lt;/td&gt;&lt;td&gt;第 1–5 年營收每年約 3.3%&lt;/td&gt;&lt;td&gt;第 1–5 年平均約 1.0%（推算）&lt;/td&gt;&lt;td&gt;近四季 -1.2%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;利潤率&lt;/td&gt;&lt;td&gt;第 1 年起每年（含穩態）營業利益率約 11.3%&lt;/td&gt;&lt;td&gt;第 1 年 5.70%、穩態 11.5%&lt;/td&gt;&lt;td&gt;7.72%–15.0%（近 12 年稅前利益率）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;折現率&lt;/td&gt;&lt;td&gt;約 8.2%（使基準情境等於現價的折現率）&lt;/td&gt;&lt;td&gt;加權資本成本 8.7%&lt;/td&gt;&lt;td&gt;10 年期公債 5.12%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;市價隱含折現率約 8.2%，與加權資本成本 8.7% 相差不到 1 個百分點：照基準情境假設，現價大致反映本報告採用的資金成本。隱含折現率不是預期報酬；V3 回測（2016–2025，含倖存者偏誤）中，之後一年實際報酬中位多高於隱含值。只揭露，不改研究評等與價格位置；非買賣建議。&lt;/p&gt;&lt;div style=&quot;margin-top:12px&quot;&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;第 1 年營收成長&lt;/th&gt;&lt;th&gt;穩態營業利益率&lt;/th&gt;&lt;th&gt;終端投入資本報酬率（ROIC）&lt;/th&gt;&lt;th&gt;永續成長&lt;/th&gt;&lt;th&gt;對照實績&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;-9.0%&lt;/td&gt;&lt;td&gt;7.50%&lt;/td&gt;&lt;td&gt;11.7%&lt;/td&gt;&lt;td&gt;2.5%&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;-7.0%&lt;/td&gt;&lt;td&gt;11.5%&lt;/td&gt;&lt;td&gt;20.0%&lt;/td&gt;&lt;td&gt;2.5%&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;-5.0%&lt;/td&gt;&lt;td&gt;14.0%&lt;/td&gt;&lt;td&gt;20.0%&lt;/td&gt;&lt;td&gt;2.5%&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;公司實績&lt;/td&gt;&lt;td&gt;近四季 -1.2%&lt;/td&gt;&lt;td&gt;近四季 8.19%；7.72%–15.0%（近 12 年稅前利益率）&lt;/td&gt;&lt;td&gt;近四季 20.8%&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;市價隱含三視角：把現價代回基準情境，一次只放開一個假設反解（成長、利潤率、折現率），三者擇一成立即可，不是同時需要；折現率視角就是第四題「現價隱含年報酬（基準情境，非預期報酬）」。假設對照：終端 ROIC 低於近四季一半時標「保守於實績」，括號寫原因：產業上限、公司近五年中位上限或等於資金成本是估值框架的上限設定（估值政策），作者選值的理由在估值輸入，都不是資料錯誤；穩態利潤率高於歷史上限標「高於歷史上限」；利潤率仍在改善中的公司（轉型、規模擴張期），歷史上限不一定是天花板，標記只提醒讀者對照，不代表假設錯誤。出處：估值結果.json（reverse_dcf、implied_return、discount）、估值輸入.json（scenarios）、財務指標.json（ROIC_TTM）、產業指標.json（景氣正常化）、成長推估底稿.json 與財務歷史.json（近四季）；推導，只揭露，不改合理價值、價格位置與研究評等。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;市價隱含的成長與歷史基準比率&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;市價隱含 NKE 未來 10 年營收實質年增約 2.5%–3.0%（名目 5.0% 減通膨 2.0%–2.5% 的近似，推導）；1950–2015 年營收 250 億美元以上的公司中，10 年間做到實質年增 0% 以上的約 64.6%（Mauboussin 等，2016，表 4）。此為揭露，不是市價錯誤的證明。&lt;/p&gt;&lt;p&gt;&lt;b&gt;隱含假設罕見度：一般&lt;/b&gt;（同規模公司 10 年做到的歷史比例 ≥50% 一般、10%–50% 樂觀、&amp;lt;10% 歷史罕見；只揭露，不改研究評等與價格位置）&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;超額報酬期間&lt;/th&gt;&lt;th&gt;市價隱含營收年增（名目）&lt;/th&gt;&lt;th&gt;約實質（名目減通膨 2.0%–2.5% 的近似，推導）&lt;/th&gt;&lt;th&gt;歷史基準比率（1950–2015）&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;10 年&lt;/td&gt;&lt;td&gt;5.0%&lt;/td&gt;&lt;td&gt;2.5%–3.0%&lt;/td&gt;&lt;td&gt;營收 250 億美元以上：10 年實質年增 0% 以上約 64.6%（該組 10 年實質年增中位數 1.8%）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;15 年&lt;/td&gt;&lt;td&gt;3.9%&lt;/td&gt;&lt;td&gt;1.4%–1.9%&lt;/td&gt;&lt;td&gt;原文只有 10 年分布，15、20 年無對照&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;20 年&lt;/td&gt;&lt;td&gt;3.4%&lt;/td&gt;&lt;td&gt;0.9%–1.4%&lt;/td&gt;&lt;td&gt;原文只有 10 年分布，15、20 年無對照&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;做法：超額報酬期間內營收年增固定、利潤率與銷售對資本比取基準情境第 5 年；期間結束後新投資報酬等於折現率（不再創造價值）；永續成長照基準情境。折現率 8.73%、第 5 年利潤率 10.5%。來源：Mauboussin, Callahan &amp;amp; Majd（2016）〈The Base Rate Book〉表 4（第三方轉載，原表 1950–2015 年、實質成長、有存活偏差）。這張表只說明「市價需要多強、多久的成長才成立」，不改合理價值、買入上限與價格位置；歷史比例低代表市價需要少見的結果，不代表市價錯誤。通膨假設 2.0%–2.5% 依 Morningstar 2020-10 方法，實質年增為名目直接減通膨的近似。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;市價溢價來源&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;現價未高於合理價值上緣，下表只描述市場面，不代表有溢價。有資料的列都沒有過熱訊號。基本面預期、倍數重估、資金與情緒、總經與利率無訊號。只揭露，不改研究評等與價格位置，也不代表市價錯誤。&lt;/p&gt;&lt;p&gt;EPS 預估：+1y（2028 財年，推導） 預估 90 天 -31.7%（下修；判斷窗口為 90 天，±2% 內視為持平），近 30 天上修減下修 -33 家；yfinance 預估是取得當下快照，股價 90 天變化以批次收盤日為終點，兩者日期可能差幾天；取得 2026-11-06。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;來源類別&lt;/th&gt;&lt;th&gt;數值&lt;/th&gt;&lt;th&gt;過熱訊號&lt;/th&gt;&lt;th&gt;說明／存檔位置&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;隱含假設罕見度&lt;/td&gt;&lt;td&gt;基本面預期&lt;/td&gt;&lt;td&gt;一般&lt;/td&gt;&lt;td&gt;無&lt;/td&gt;&lt;td&gt;價值判斷.json#/市價隱含假設&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;倍數擴張&lt;/td&gt;&lt;td&gt;倍數重估&lt;/td&gt;&lt;td&gt;近 1 年（2025-11-14 起）股價 -40%：EPS +0.07、本益比 -0.59（對數）→ 倍數收縮為主&lt;/td&gt;&lt;td&gt;無&lt;/td&gt;&lt;td&gt;價值判斷.json#/報酬拆解&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;預估背離&lt;/td&gt;&lt;td&gt;倍數重估&lt;/td&gt;&lt;td&gt;+1y（2028 財年，推導） EPS 預估 90 天 -31.7%（下修；90 天變化 ±2% 內視為持平），同期股價 -4.5% → 基本面轉弱帶動&lt;/td&gt;&lt;td&gt;無&lt;/td&gt;&lt;td&gt;價值判斷.json#/預估修正&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;本益比水位&lt;/td&gt;&lt;td&gt;倍數重估&lt;/td&gt;&lt;td&gt;現在 18.3 倍，自身五年 p75 33.8 倍&lt;/td&gt;&lt;td&gt;無&lt;/td&gt;&lt;td&gt;市場資料/歷史本益比.json#/pe_p75&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股債利差&lt;/td&gt;&lt;td&gt;總經與利率&lt;/td&gt;&lt;td&gt;近期百分位 71%（0% 最貴）&lt;/td&gt;&lt;td&gt;無&lt;/td&gt;&lt;td&gt;市場資料/歷史本益比.json#/股債利差/近期百分位&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;整體市場風險溢價&lt;/td&gt;&lt;td&gt;總經與利率&lt;/td&gt;&lt;td&gt;Damodaran 隱含風險溢價 4.20%（2026-10-01）&lt;/td&gt;&lt;td&gt;不適用&lt;/td&gt;&lt;td&gt;只存當月值，沒有歷史序列可比中位數；要下載 Damodaran 歷史表需使用者同意&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;動能&lt;/td&gt;&lt;td&gt;資金與情緒&lt;/td&gt;&lt;td&gt;相對 200 日均線 -13%；12 個月（2025-11-13 起） -40% 對 S&amp;amp;P500 +11%&lt;/td&gt;&lt;td&gt;無&lt;/td&gt;&lt;td&gt;市場資料/市場溫度.json#/趨勢、#/動能&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;部位與衍生品&lt;/td&gt;&lt;td&gt;資金與情緒&lt;/td&gt;&lt;td&gt;選擇權賣權對買權量比 中性；空單分位 76%、回補天數分位 95%（有軋空條件）&lt;/td&gt;&lt;td&gt;無&lt;/td&gt;&lt;td&gt;股價在 200 日均線下且 12 個月下跌，熱度不視為溢價來源&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;擁擠度&lt;/td&gt;&lt;td&gt;資金與情緒&lt;/td&gt;&lt;td&gt;20 日均換手率在自身五年 85% 分位；被發現程度 高&lt;/td&gt;&lt;td&gt;無&lt;/td&gt;&lt;td&gt;股價在 200 日均線下且 12 個月下跌，熱度不視為溢價來源&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;股價漲跌拆解：EPS 成長 vs 本益比變化（年化對數點，推導；不含股利、申報 EPS）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;期間&lt;/th&gt;&lt;th&gt;股價年化&lt;/th&gt;&lt;th&gt;EPS 貢獻&lt;/th&gt;&lt;th&gt;本益比貢獻&lt;/th&gt;&lt;th&gt;本益比&lt;/th&gt;&lt;th&gt;主因&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;1年&lt;/td&gt;&lt;td&gt;-40.4%&lt;/td&gt;&lt;td&gt;+0.07&lt;/td&gt;&lt;td&gt;-0.59&lt;/td&gt;&lt;td&gt;32.9 → 18.3&lt;/td&gt;&lt;td&gt;倍數收縮為主&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;3年&lt;/td&gt;&lt;td&gt;-29.2%&lt;/td&gt;&lt;td&gt;-0.15&lt;/td&gt;&lt;td&gt;-0.20&lt;/td&gt;&lt;td&gt;33.2 → 18.3&lt;/td&gt;&lt;td&gt;倍數收縮為主&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;門檻：使用者 2026-11-04 照草案核定（程式/市場溢價來源.py 常數）。各列只描述市場面，不改合理價值、研究評等與價格位置，非買賣建議。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;multiple-conditions&quot;&gt;&lt;h3&gt;長期倍數條件：要漲 3／5／10 倍需要什麼&lt;/h3&gt;&lt;p&gt;反過來問：股價要在 5 年或 10 年內每股漲到 3、5、10 倍，期末營收、利潤率、估值倍數要做到多少，歷史上同規模公司有多少做到過。&lt;b&gt;條件反推，非預測、非機率、非目標價、非買賣建議&lt;/b&gt;；不改研究評等、價格位置與目標區間。&lt;/p&gt;&lt;p class=&quot;cap&quot;&gt;主列＝產業倍數＋基準穩態利潤率；括號是三種期末倍數口徑（不重估、產業、自身本益比 p25）的範圍。股數年稀釋率 -1.9%（推導）。罕見度：5 年用自有 SEC 名目分布、10 年用 Base Rate Book（1950–2015，實質）。&lt;/p&gt;&lt;ul&gt;&lt;li&gt;3 倍／5 年：營收年增約 6.8%（3 種期末倍數口徑 6.8%–14.1%），樂觀（營收 250 億美元以上的公司 5 年約 44.6% 做到）；資金自足&lt;/li&gt;&lt;li&gt;3 倍／10 年：營收年增約 2.3%（3 種期末倍數口徑 2.3%–5.8%），一般（營收 250 億美元以上的公司 10 年約 87.5%–64.6% 做到）；資金自足&lt;/li&gt;&lt;li&gt;5 倍／5 年：營收年增約 18.2%（3 種期末倍數口徑 18.2%–26.3%），歷史罕見（營收 250 億美元以上的公司 5 年約 5.6% 做到）；資金自足&lt;/li&gt;&lt;li&gt;5 倍／10 年：營收年增約 7.7%（3 種期末倍數口徑 7.7%–11.3%），樂觀（營收 250 億美元以上的公司 10 年約 27.5% 做到）；資金自足&lt;/li&gt;&lt;li&gt;10 倍／5 年：營收年增約 35.8%（3 種期末倍數口徑 35.8%–45.1%），歷史罕見（營收 250 億美元以上的公司 5 年約 0.2% 做到）；資金自足&lt;/li&gt;&lt;li&gt;10 倍／10 年：營收年增約 15.4%（3 種期末倍數口徑 15.4%–19.3%），歷史罕見（營收 250 億美元以上的公司 10 年約 7.3% 做到）；資金自足&lt;/li&gt;&lt;/ul&gt;&lt;details&gt;&lt;summary&gt;全部格子&lt;/summary&gt;&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;倍數／期間&lt;/th&gt;&lt;th&gt;期末倍數口徑&lt;/th&gt;&lt;th&gt;利潤率口徑&lt;/th&gt;&lt;th&gt;需要營收年增&lt;/th&gt;&lt;th&gt;期末營收為現在&lt;/th&gt;&lt;th&gt;罕見度&lt;/th&gt;&lt;th&gt;資金&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;3 倍／5 年&lt;/td&gt;&lt;td&gt;不重估（19.2）&lt;/td&gt;&lt;td&gt;近四季（8.2%）&lt;/td&gt;&lt;td&gt;22.1%&lt;/td&gt;&lt;td&gt;2.7 倍&lt;/td&gt;&lt;td&gt;歷史罕見&lt;/td&gt;&lt;td&gt;自足&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;3 倍／5 年&lt;/td&gt;&lt;td&gt;不重估（19.2）&lt;/td&gt;&lt;td&gt;基準穩態（11.5%）&lt;/td&gt;&lt;td&gt;14.1%&lt;/td&gt;&lt;td&gt;1.9 倍&lt;/td&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;自足&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;3 倍／5 年&lt;/td&gt;&lt;td&gt;產業（26.8）&lt;/td&gt;&lt;td&gt;近四季（8.2%）&lt;/td&gt;&lt;td&gt;14.3%&lt;/td&gt;&lt;td&gt;1.9 倍&lt;/td&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;自足&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;3 倍／5 年&lt;/td&gt;&lt;td&gt;產業（26.8）&lt;/td&gt;&lt;td&gt;基準穩態（11.5%）&lt;/td&gt;&lt;td&gt;6.8%&lt;/td&gt;&lt;td&gt;1.4 倍&lt;/td&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;自足&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;3 倍／5 年&lt;/td&gt;&lt;td&gt;均值回歸（23.6）&lt;/td&gt;&lt;td&gt;近四季（8.2%）&lt;/td&gt;&lt;td&gt;17.2%&lt;/td&gt;&lt;td&gt;2.2 倍&lt;/td&gt;&lt;td&gt;歷史罕見&lt;/td&gt;&lt;td&gt;自足&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;
