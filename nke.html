&lt;div class=&quot;front&quot; id=&quot;front&quot; data-layer=&quot;首頁&quot;&gt;&lt;header class=&quot;hero&quot;&gt;&lt;div&gt;&lt;span class=&quot;stance&quot;&gt;生意品質良好／價格合理（在市場常態內）&lt;/span&gt;&lt;span class=&quot;stance rating&quot;&gt;研究評等　生意品質良好 ／ 價格合理（在市場常態內）（非買賣建議）&lt;/span&gt;&lt;h1&gt;品牌與財務撐得過低谷；現價要成立，各年營業利益率需約 11%（市價反推、固定口徑；目前約 7%）&lt;/h1&gt;&lt;p class=&quot;summary&quot;&gt;Nike 正處轉型低谷：2027 財年營收預期再衰退高個位數，扣退款、加回遣散費後近四季營業利益率約 6.7%（推導），約為過去平均的一半。合理價值 27.55–39.07 美元，2026-11-16 收盤 38.26 美元 落在區間上段、約為中點的 1.18 倍（收盤 2026-11-16 股價 38.26 美元 ÷ 合理價值中點 32.37 美元；只描述距離，非買賣建議）。基準情境成真時，以現價買進的年報酬約 8.2%（基準情境成真時、以收盤 2026-11-16 股價買進的推算年報酬；條件式，非預期報酬、非買賣建議），比 10 年期公債 5.12% 多約 3.1 個百分點（條件式推算，非買賣建議）。&lt;/p&gt;&lt;/div&gt;&lt;/header&gt;&lt;div class=&quot;layer&quot; id=&quot;layer-30s&quot; style=&quot;margin-top:22px&quot;&gt;&lt;div class=&quot;cap&quot; style=&quot;font-weight:700;letter-spacing:.1em&quot;&gt;30 秒版&lt;/div&gt;&lt;section class=&quot;note-box&quot; id=&quot;expected-return&quot; style=&quot;margin-top:18px&quot;&gt;&lt;h3&gt;以現價買進的預期年報酬&lt;/h3&gt;&lt;p style=&quot;font-size:20px;font-weight:700;margin:4px 0 8px&quot;&gt;基準情境成真時，每年約 8.2%&lt;/p&gt;&lt;div class=&quot;rows&quot;&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;10 年期美國公債&lt;/span&gt;&lt;span&gt;5.1%&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;本報告要求報酬（&lt;abbr title=&quot;WACC（Weighted Average Cost of Capital）&quot;&gt;資金成本&lt;/abbr&gt;）&lt;/span&gt;&lt;span&gt;8.7%&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;保守情境成真時&lt;/span&gt;&lt;span&gt;5.6%&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;樂觀情境成真時&lt;/span&gt;&lt;span&gt;10.3%&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin:8px 0 0&quot;&gt;條件式推算：各情境成真、以收盤價買進時的年化報酬（使估值等於現價的折現率）；不是機率加權結果，也不是預測；非買賣建議，不進研究評等。&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;note-box&quot; id=&quot;bet&quot; style=&quot;margin-top:18px&quot;&gt;&lt;h3&gt;你在賭什麼：要讓現價 38.26 合理，長期營業利益率得維持多少？&lt;/h3&gt;&lt;p class=&quot;cap&quot; style=&quot;margin:0&quot;&gt;欄是折現率，列是成長情境&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table style=&quot;min-width:0;font-size:14px&quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th style=&quot;white-space:nowrap;text-align:center&quot;&gt;8.7%&lt;br&gt;&lt;small&gt;本報告&lt;/small&gt;&lt;/th&gt;&lt;th style=&quot;white-space:nowrap;text-align:center&quot;&gt;10.0%&lt;/th&gt;&lt;th style=&quot;white-space:nowrap;text-align:center&quot;&gt;9.0%&lt;/th&gt;&lt;th style=&quot;white-space:nowrap;text-align:center&quot;&gt;8.2%&lt;br&gt;&lt;small&gt;市價反推&lt;/small&gt;&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td style=&quot;text-align:center&quot;&gt;&lt;b style=&quot;color:#b7791f&quot;&gt;17%&lt;/b&gt;&lt;/td&gt;&lt;td style=&quot;text-align:center&quot;&gt;&lt;b style=&quot;color:#b7791f&quot;&gt;21%&lt;/b&gt;&lt;/td&gt;&lt;td style=&quot;text-align:center&quot;&gt;&lt;b style=&quot;color:#b7791f&quot;&gt;17%&lt;/b&gt;&lt;/td&gt;&lt;td style=&quot;text-align:center&quot;&gt;&lt;b style=&quot;color:#b7791f&quot;&gt;15%&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td style=&quot;text-align:center&quot;&gt;&lt;b style=&quot;color:#b7791f&quot;&gt;13%&lt;/b&gt;&lt;/td&gt;&lt;td style=&quot;text-align:center&quot;&gt;&lt;b style=&quot;color:#b7791f&quot;&gt;17%&lt;/b&gt;&lt;/td&gt;&lt;td style=&quot;text-align:center&quot;&gt;&lt;b style=&quot;color:#b7791f&quot;&gt;14%&lt;/b&gt;&lt;/td&gt;&lt;td style=&quot;text-align:center&quot;&gt;&lt;b style=&quot;color:#b7791f&quot;&gt;12%&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td style=&quot;text-align:center&quot;&gt;&lt;b style=&quot;color:#b7791f&quot;&gt;11%&lt;/b&gt;&lt;/td&gt;&lt;td style=&quot;text-align:center&quot;&gt;&lt;b style=&quot;color:#b7791f&quot;&gt;14%&lt;/b&gt;&lt;/td&gt;&lt;td style=&quot;text-align:center&quot;&gt;&lt;b style=&quot;color:#b7791f&quot;&gt;12%&lt;/b&gt;&lt;/td&gt;&lt;td style=&quot;text-align:center&quot;&gt;&lt;b style=&quot;color:#b7791f&quot;&gt;10%&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;目前營業利益率 6.7%（近四季）。綠＝不高於目前，現在就做得到；黃＝要比現在更好；紅＝解不到或高於 80%。利潤率由目前逐年走到該值，其他假設照各情境；條件式推算，非預測、非買賣建議。&lt;/p&gt;&lt;/section&gt;&lt;section id=&quot;lights&quot; style=&quot;margin-top:18px&quot;&gt;&lt;h3&gt;四個面向&lt;/h3&gt;&lt;div class=&quot;kpis&quot;&gt;&lt;div class=&quot;kpi&quot; style=&quot;border-left:4px solid var(--pos)&quot;&gt;&lt;div class=&quot;l&quot;&gt;生意品質&lt;/div&gt;&lt;div class=&quot;v&quot; style=&quot;color:var(--pos)&quot;&gt;良好&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;護城河、投入資本報酬、現金流品質、資產負債表、治理五項合評&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot; style=&quot;border-left:4px solid var(--muted)&quot;&gt;&lt;div class=&quot;l&quot;&gt;商業動能&lt;/div&gt;&lt;div class=&quot;v&quot; style=&quot;color:var(--muted)&quot;&gt;未評估&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;商業評估另頁；金融業不涵蓋&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot; style=&quot;border-left:4px solid var(--pos)&quot;&gt;&lt;div class=&quot;l&quot;&gt;信用與存活&lt;/div&gt;&lt;div class=&quot;v&quot; style=&quot;color:var(--pos)&quot;&gt;無明顯警訊&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;機構 Moody&amp;#x27;s A2、S&amp;amp;P A+；12～24 個月存活檢查（推導，非違約預測）&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot; style=&quot;border-left:4px solid var(--muted)&quot;&gt;&lt;div class=&quot;l&quot;&gt;價格&lt;/div&gt;&lt;div class=&quot;v&quot; style=&quot;color:var(--muted)&quot;&gt;合理&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;在市場常態內；對照合理價值區間與買入上限，非買賣建議&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;/div&gt;&lt;div class=&quot;layer&quot; id=&quot;layer-try&quot; style=&quot;margin-top:22px&quot;&gt;&lt;div class=&quot;cap&quot; style=&quot;font-weight:700;letter-spacing:.1em&quot;&gt;自己試試看&lt;/div&gt;&lt;section class=&quot;note-box&quot; id=&quot;tool&quot; style=&quot;margin-top:18px&quot;&gt;&lt;h3&gt;調整假設，看每股值多少&lt;/h3&gt;&lt;div class=&quot;seg&quot; style=&quot;display:flex;gap:6px&quot;&gt;&lt;button type=&quot;button&quot; data-s=&quot;保守&quot; aria-pressed=&quot;false&quot; style=&quot;flex:1;padding:6px&quot;&gt;保守&lt;br&gt;&lt;small&gt;第 1 年 -9%&lt;/small&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; data-s=&quot;基準&quot; aria-pressed=&quot;true&quot; style=&quot;flex:1;padding:6px&quot;&gt;基準&lt;br&gt;&lt;small&gt;第 1 年 -7%&lt;/small&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; data-s=&quot;樂觀&quot; aria-pressed=&quot;false&quot; style=&quot;flex:1;padding:6px&quot;&gt;樂觀&lt;br&gt;&lt;small&gt;第 1 年 -5%&lt;/small&gt;&lt;/button&gt;&lt;/div&gt;&lt;label style=&quot;display:block;margin-top:10px&quot;&gt;10 年後的營業利益率 &lt;b id=&quot;t-mv&quot;&gt;&lt;/b&gt;&lt;input id=&quot;t-m&quot; type=&quot;range&quot; min=&quot;0.0&quot; max=&quot;29.0&quot; step=&quot;0.5&quot; style=&quot;width:100%&quot;&gt;&lt;/label&gt;&lt;small class=&quot;cap&quot;&gt;目前 6.7%；第 1～5 年照情境，之後逐年走到這個數字&lt;/small&gt;&lt;label style=&quot;display:block;margin-top:10px&quot;&gt;折現率（要求的報酬） &lt;b id=&quot;t-wv&quot;&gt;&lt;/b&gt;&lt;input id=&quot;t-w&quot; type=&quot;range&quot; min=&quot;5.7&quot; max=&quot;11.7&quot; step=&quot;0.1&quot; style=&quot;width:100%&quot;&gt;&lt;/label&gt;&lt;small class=&quot;cap&quot;&gt;本報告 8.7%；10 年期美國公債 5.12%&lt;/small&gt;&lt;div class=&quot;rows&quot; style=&quot;margin-top:10px&quot;&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;每股價值（這組假設）&lt;/span&gt;&lt;span&gt;&lt;b id=&quot;t-out&quot; style=&quot;font-size:22px&quot;&gt;&lt;/b&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;與現價 38.26 比&lt;/span&gt;&lt;span id=&quot;t-diff&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;p id=&quot;t-say&quot; style=&quot;margin:6px 0 0&quot;&gt;&lt;/p&gt;&lt;p class=&quot;cap&quot;&gt;簡化模型：同估值引擎的式子，只改這三項；預設值與引擎各情境一致，和完整報告的機率加權合理價值可能差 ±10%。本報告合理價值區間 27.55–39.07（三情境機率加權）。非目標價、非買賣建議。&lt;/p&gt;&lt;script type=&quot;application/json&quot; id=&quot;tool-data&quot;&gt;{&quot;base_revenue&quot;: 45891, &quot;bridge&quot;: {&quot;cash&quot;: 6903, &quot;securities&quot;: 1465, &quot;securities_haircut&quot;: 0, &quot;operating_cash_reserve&quot;: 0, &quot;debt&quot;: 7893, &quot;other_claims&quot;: 750, &quot;shares&quot;: 1483.0}, &quot;wacc&quot;: 0.08726584983429417, &quot;price&quot;: 38.26, &quot;情境&quot;: {&quot;保守&quot;: {&quot;growth&quot;: [-0.09, -0.03, 0.0, 0.02, 0.03], &quot;ebit_margin&quot;: [0.05, 0.05, 0.06, 0.07, 0.075], &quot;terminal_margin&quot;: 0.075, &quot;sales_to_capital&quot;: 3.0, &quot;tax&quot;: 0.24, &quot;terminal_g&quot;: 0.025, &quot;terminal_roic&quot;: 0.117, &quot;fade_years&quot;: 7, &quot;decline_sales_to_capital&quot;: 9.0}, &quot;基準&quot;: {&quot;growth&quot;: [-0.07, 0.0, 0.03, 0.05, 0.04], &quot;ebit_margin&quot;: [0.057, 0.062, 0.075, 0.09, 0.105], &quot;terminal_margin&quot;: 0.115, &quot;sales_to_capital&quot;: 3.0, &quot;tax&quot;: 0.21, &quot;terminal_g&quot;: 0.025, &quot;terminal_roic&quot;: 0.2, &quot;fade_years&quot;: 7, &quot;decline_sales_to_capital&quot;: 9.0}, &quot;樂觀&quot;: {&quot;growth&quot;: [-0.05, 0.03, 0.06, 0.06, 0.05], &quot;ebit_margin&quot;: [0.062, 0.08, 0.1, 0.12, 0.13], &quot;terminal_margin&quot;: 0.14, &quot;sales_to_capital&quot;: 3.2, &quot;tax&quot;: 0.19, &quot;terminal_g&quot;: 0.025, &quot;terminal_roic&quot;: 0.2, &quot;fade_years&quot;: 7, &quot;decline_sales_to_capital&quot;: 9.0}}}&lt;/script&gt;&lt;script&gt;
(function(){var P=JSON.parse(document.getElementById(&#x27;tool-data&#x27;).textContent);var $=function(i){return document.getElementById(i)};
function fade(a,b,n){var o=[];for(var i=0;i&lt;n;i++)o.push(a+(b-a)*(i+1)/n);return o}
function ext(x,n){if(!Array.isArray(x)){var o=[];for(var i=0;i&lt;n;i++)o.push(x);return o}var y=x.slice();while(y.length&lt;n)y.push(x[x.length-1]);return y.slice(0,n)}
function dcf(s,w){var nf=s.fade_years||5,g=s.growth.concat(fade(s.growth[s.growth.length-1],s.terminal_g,nf)),
 m=s.ebit_margin.concat(fade(s.ebit_margin[s.ebit_margin.length-1],s.terminal_margin,nf)),n=g.length,
 stc=Array.isArray(s.sales_to_capital)?s.sales_to_capital.concat(ext(s.sales_to_capital[s.sales_to_capital.length-1],nf)):ext(s.sales_to_capital,n),
 tx=ext(s.tax,n),rev=P.base_revenue,ev=0,last=null;
 for(var i=0;i&lt;n;i++){var prev=rev;rev=rev*(1+g[i]);var nop=rev*m[i]*(1-tx[i]);var d=s.decline_sales_to_capital;
  var re=(rev-prev)/((d&amp;&amp;rev&lt;prev)?d:stc[i]);ev+=(nop-re)/Math.pow(1+w,i+1);last={rev:rev,m:m[i],y:i+1}}
 var tt=Array.isArray(s.tax)?s.tax[s.tax.length-1]:s.tax,gg=s.terminal_g;if(!(w&gt;gg&amp;&amp;s.terminal_roic&gt;gg))return null;
 var tn=last.rev*(1+gg)*last.m*(1-tt),tv=tn*(1-gg/s.terminal_roic)/(w-gg);ev+=tv/Math.pow(1+w,last.y);
 var b=P.bridge,eq=ev-(b.debt||0)+(b.cash||0)+(b.securities||0)*(1-(b.securities_haircut||0))-(b.operating_cash_reserve||0)-(b.other_claims||0);return eq/b.shares}
var sc=&#x27;基準&#x27;,X=0,w=0;
function reset(){var s=P[&#x27;情境&#x27;][sc];X=s.terminal_margin;w=P.wacc;$(&#x27;t-m&#x27;).value=X*100;$(&#x27;t-w&#x27;).value=w*100;draw()}
function draw(){var s=JSON.parse(JSON.stringify(P[&#x27;情境&#x27;][sc]));
 s.terminal_margin=X;$(&#x27;t-mv&#x27;).textContent=(X*100).toFixed(1)+&#x27;%&#x27;;$(&#x27;t-wv&#x27;).textContent=(w*100).toFixed(1)+&#x27;%&#x27;;
 var v=dcf(s,w);if(v===null){$(&#x27;t-out&#x27;).textContent=&#x27;—&#x27;;$(&#x27;t-say&#x27;).textContent=&#x27;折現率要高於永續成長率&#x27;;return}
 var d=v/P.price-1;$(&#x27;t-out&#x27;).textContent=v.toFixed(2);
 $(&#x27;t-diff&#x27;).textContent=(d&gt;=0?&#x27;比現價高 &#x27;:&#x27;比現價低 &#x27;)+Math.abs(Math.round(d*100))+&#x27;%&#x27;;
 $(&#x27;t-say&#x27;).textContent=d&gt;=0?&#x27;在這組假設下，現價不需要更樂觀的前提。&#x27;:(d&gt;=-0.1?&#x27;在這組假設下，現價和估值差不到一成。&#x27;:&#x27;在這組假設下，現價需要比這組更樂觀的前提。&#x27;)}

&lt;/script&gt;&lt;/section&gt;&lt;section class=&quot;note-box&quot; id=&quot;ledger&quot; style=&quot;margin-top:18px&quot;&gt;&lt;h3&gt;上次預測對答案&lt;/h3&gt;&lt;p&gt;上次（通過版_20261107_收盤1105）以來改了：研究評等 生意 B ／ 價格偏貴 → 生意品質良好 ／ 價格合理（在市場常態內）；價格位置 偏貴 → 合理；合理價值中點 31.105883062021828 → 32.371812794857746；收盤價 39.56 → 38.26。本報告沒有商業評估，預測以下方&lt;a href=&quot;#triggers&quot;&gt;「風險與改變判斷」&lt;/a&gt;的 6 條改判條件為準：目前都在觀察中，下次財報重跑時逐條對照命中或落空。&lt;/p&gt;&lt;/section&gt;&lt;/div&gt;&lt;div class=&quot;layer&quot; id=&quot;layer-3min&quot; style=&quot;margin-top:22px&quot;&gt;&lt;div class=&quot;cap&quot; style=&quot;font-weight:700;letter-spacing:.1em&quot;&gt;3 分鐘版&lt;/div&gt;&lt;div class=&quot;grid2 front-pts&quot; style=&quot;margin-top:18px&quot;&gt;&lt;div&gt;&lt;h3&gt;三個看好的理由&lt;/h3&gt;&lt;ol class=&quot;pts&quot;&gt;&lt;li&gt;品牌與通路仍是護城河：Dick&amp;#x27;s 約三成採購來自 Nike；第一季北美批發 +9%（幣別中性），轉型已有財報證據&lt;/li&gt;&lt;li&gt;財務撐得過低谷：現金與短期投資約 84 億美元、30 億信貸未動用，一年內到期債務 20 億（8 月底）&lt;/li&gt;&lt;li&gt;價格合理但在上段：38.26 美元 落在合理價值 27.55–39.07 美元 內，接近上緣&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;&lt;div&gt;&lt;h3&gt;三個風險&lt;/h3&gt;&lt;ol class=&quot;pts risk&quot;&gt;&lt;li&gt;轉型延宕：2024 財年以來第三個重組計畫，利潤率回升若晚於 2029 財年，合理價值下修&lt;/li&gt;&lt;li&gt;股利壓力：扣除退款後自由現金流最多與 24 億股利打平，保守口徑下不足&lt;/li&gt;&lt;li&gt;大中華區與 Converse（Nike 旗下帆布鞋品牌）兩位數衰退，北美回升難帶動整體&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;note-box&quot; id=&quot;when-fair&quot;&gt;&lt;b&gt;什麼條件下現價算合理&lt;/b&gt;&lt;ul&gt;&lt;li&gt;高成長多撐兩年（第 1 年成長率多維持兩年，其他照基準）：每股約 28.60（比現價低 25%）&lt;/li&gt;&lt;li&gt;長期營業利益率維持目前 6.7%（其他照基準）：每股約 21.83（比現價低 43%）&lt;/li&gt;&lt;li&gt;成長照樂觀、利潤率照基準：每股約 38.38（比現價高 0%）&lt;/li&gt;&lt;/ul&gt;&lt;p class=&quot;cap&quot;&gt;用估值引擎同一條式子、本報告折現率 8.7% 算；每條只改一項假設，其他照基準情境。買入上限放在下方「完整底稿」的價格框。非目標價、非買賣建議。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;note-box mv&quot;&gt;&lt;b&gt;市場價格隱含什麼、我們哪裡不同&lt;/b&gt;&lt;p&gt;市價 38.26 美元 隱含（其他照基準）未來 5 年營收每年約 3.3%（市價反推未來 5 年營收年增；市價 38.26 美元、收盤 2026-11-16；折現率 8.73%；推導）（我們約 1.0%），或各年營業利益率一律約 11.3%（市價反推第 1 年起每年固定的營業利益率，含穩態；市價 38.26 美元、收盤 2026-11-16；折現率 8.73%；推導）（我們長期 11.5%），兩者擇一；差距在回升速度。&lt;/p&gt;&lt;/div&gt;&lt;div id=&quot;triggers&quot; class=&quot;tm&quot;&gt;&lt;h3&gt;風險與改變判斷&lt;/h3&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;risk-tbl&quot; style=&quot;min-width:0;width:100%&quot;&gt;&lt;tr&gt;&lt;th style=&quot;white-space:normal;width:64%&quot;&gt;情況（看哪個指標、門檻多少）&lt;/th&gt;&lt;th style=&quot;white-space:normal;width:22%&quot;&gt;會改變什麼判斷&lt;/th&gt;&lt;th style=&quot;white-space:normal;width:14%&quot;&gt;歷史基準比率&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;營收指引再下修（2027 財年衰退超過一成），下修基準情境&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;價格位置可能轉偏貴&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;扣退款與重組的營業利益率（2028 財年達 8% 以上）上修基準；低於 6% 則下修&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;—&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;毛利率不靠非經常項目回到 44% 以上&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;投入回報轉好；行銷續增而毛利率不升視為轉弱&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;每股自由現金流連兩年低於每股股利，股利成長可能停止&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;下修股東回報評估&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;大中華區或 Converse 持續兩位數衰退並出現處分或大額減損&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;重新評估護城河分級&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;收盤價低於合理價值低端（27.55 美元）&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;價格位置由合理轉偏低&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;轉型延宕：2024 財年以來第三個重組計畫；利潤率回升若晚於 2029 財年，合理價值下修&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;未設門檻：持續觀察&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;大中華區結構性衰退：本土品牌崛起，營收較 2021 年縮水約三成且仍在下滑&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;未設門檻：持續觀察&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;股利壓力：調整後自由現金流最多與 24 億股利打平，保守口徑下不足（詳第三題）&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;未設門檻：持續觀察&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;生產集中與關稅：鞋類過半在越南、四家代工商約六成，貿易政策直接影響供貨與毛利&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;未設門檻：持續觀察&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;歷史基準比率＝成功幾率口徑，是同規模公司歷史上做到的比例，不是這家公司的預測；「—」＝沒有可對照的歷史基準，不估機率。營收成長類的列：同規模（營收 250 億美元以上）公司 10 年實質年增做到模型基準 0.1% 的歷史比例（超額報酬期間檢查.json 基準比率；Base Rate Book）。&lt;/p&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; id=&quot;sanity-front&quot;&gt;&lt;b&gt;合理性檢查：&lt;/b&gt;紅燈 1、黃燈 3（紅：終值倍數落點）。只提醒、不改評等；逐項與作者說明見計算底稿 5。&lt;/p&gt;&lt;/div&gt;&lt;p class=&quot;cap fnote&quot;&gt;資料日期：財報截至 2027 財年第一季（2026-08-31）；市場資料 2026-11-16 收盤 38.26 美元。首家產業，公版待驗證（穩定現金流／品牌消費與硬體；產業公版的估值法與指標選擇尚未經兩家以上驗證）。本報告為研究用途，所有估值皆為明示假設下的條件結果；研究評等與合理價值區間非買賣建議。本研究只評估公司本身，不評估讀者自身的資金期限與等待能力。完整數字見正文&lt;a href=&quot;#numbers&quot;&gt;「完整數字」&lt;/a&gt;；名詞與每條判斷的證據狀態見&lt;a href=&quot;#more&quot;&gt;附錄&lt;/a&gt;。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;

&lt;main class=&quot;wrap&quot;&gt;&lt;details id=&quot;full&quot; class=&quot;fullwrap&quot;&gt;&lt;summary style=&quot;cursor:pointer;font-weight:700;font-size:18px;padding:14px 0&quot;&gt;完整底稿：價格框與買入上限、正文七題、計算底稿、附錄與出處（點開）&lt;/summary&gt;&lt;div data-layer=&quot;正文&quot;&gt;&lt;section class=&quot;q&quot; id=&quot;price-detail&quot; data-layer=&quot;完整底稿&quot;&gt;&lt;div class=&quot;qno&quot;&gt;價格&lt;/div&gt;&lt;h2&gt;價格框、合理價值與市價隱含倍數&lt;/h2&gt;&lt;div class=&quot;hero&quot;&gt;&lt;aside class=&quot;pricebox&quot;&gt;&lt;div class=&quot;sub&quot;&gt;2026-11-16 收盤 38.26 美元&lt;/div&gt;&lt;div class=&quot;big&quot;&gt;38.26&lt;span style=&quot;font-size:18px&quot;&gt; 美元&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;zones&quot;&gt;&lt;div class=&quot;zone buy&quot; style=&quot;grid-column:1/-1&quot;&gt;&lt;span&gt;買入上限（不確定性中）&lt;/span&gt;&lt;b&gt;23 美元&lt;/b&gt;&lt;small&gt;股價在此以下才有 30% 安全邊際；＝合理價值中點 32.37 ×（1−30%）。非買賣建議。&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;rows&quot;&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;股價 ÷ 合理價值中點&lt;/span&gt;&lt;span&gt;1.18 倍&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;10 年期美國公債&lt;/span&gt;&lt;span&gt;5.12%&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;r&quot;&gt;&lt;span&gt;市價隱含 5 年營收年增&lt;/span&gt;&lt;span&gt;3.3%&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;現金（2026-08-31）&lt;/span&gt;&lt;span&gt;69.0 億美元&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;流動有價證券&lt;/span&gt;&lt;span&gt;14.7 億美元&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;有息負債&lt;/span&gt;&lt;span&gt;78.9 億美元&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;淨現金（現金＋流動有價證券−有息負債）&lt;/span&gt;&lt;span&gt;4.8 億美元&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;近四季回購&lt;/span&gt;&lt;span&gt;0.2 億美元&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot; style=&quot;display:block&quot;&gt;&lt;span&gt;股東回報與權益（2022–2026）：&lt;/span&gt;&lt;span style=&quot;font-weight:400&quot;&gt;近五年平均 ROE 33%；股東權益 153→149 億美元；股利＋回購占自由現金流 129%（逐年表見第六題）&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; id=&quot;cont-note&quot; style=&quot;margin:10px 0 0&quot;&gt;這個數字只描述現價與本報告合理價值中點的距離，不改價格位置與研究評等。非買賣建議。&lt;/p&gt;&lt;/aside&gt;&lt;/div&gt;&lt;section class=&quot;note-box&quot; id=&quot;value-trio&quot; style=&quot;margin-top:18px&quot;&gt;&lt;h3&gt;合理價值與市價隱含第 12 年倍數&lt;/h3&gt;&lt;div class=&quot;zones&quot; style=&quot;grid-template-columns:repeat(2,1fr)&quot;&gt;&lt;div class=&quot;zone&quot;&gt;&lt;span&gt;合理價值（只含折現率）&lt;/span&gt;&lt;b&gt;28–39 美元&lt;/b&gt;&lt;small&gt;中點 32.37 美元；三情境機率加權&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;zone mkt&quot;&gt;&lt;span&gt;市價隱含第 12 年倍數（EV/EBIT，基準情境）&lt;/span&gt;&lt;b&gt;13.3 倍&lt;/b&gt;&lt;small&gt;模型假設 11.4 倍，市價隱含是模型的 1.2 倍；折現率區間 11.4–15.5 倍；參考帶（大類：品牌消費，87 筆、5 家）中位 17.3 倍、四分位 12.3–24.0 倍、p90 32.0 倍（機械回測樣本，非市場全體；分產業的筆數與公司數少，僅供參考）；只描述，不進評等&lt;br&gt;特例：明示期 12 年，參考帶是 10 年機械回測，倍數不直接比，僅供參考&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;參考帶中位（品牌消費） 17.3 倍時，機率加權每股約 42 美元（條件式，非目標價、非買賣建議，不進評等；各倍數對照見計算底稿 5）。&lt;/p&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;&lt;b&gt;合理價值 vs 市價隱含倍數（作者判讀）：&lt;/b&gt;市價隱含第 12 年 EV/EBIT 約 13.3 倍，高於模型終值倍數 11.4 倍（比 1.17），表示市場對長期獲利略比我們樂觀；特例：本模型明示期 12 年（5 年＋衰退 7 年），參考帶是 10 年機械回測，倍數不直接比。只描述，不進評等。&lt;/p&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:10px;font-size:15px;line-height:1.7&quot;&gt;上面的合理價值只含折現率高低；三情境全幅 17～60（情境與折現率一起算，約中點的 133%）；寬主要來自情境（差距 86%），不是折現率（36%）。情境差距＝（樂觀－保守）÷基準，折現率寬度＝（高－低）÷中點；非買賣建議。&lt;/p&gt;&lt;div class=&quot;tw&quot; style=&quot;margin-top:14px&quot;&gt;&lt;table class=&quot;txt&quot; style=&quot;min-width:0;font-size:16px&quot;&gt;&lt;tr&gt;&lt;th style=&quot;padding:9px 12px;font-size:15px&quot;&gt;情境&lt;/th&gt;&lt;th style=&quot;padding:9px 12px;font-size:15px&quot;&gt;每股價值&lt;/th&gt;&lt;th style=&quot;padding:9px 12px;font-size:15px&quot;&gt;權重&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;padding:9px 12px&quot;&gt;保守&lt;/td&gt;&lt;td style=&quot;padding:9px 12px;font-size:20px;font-weight:700&quot;&gt;19.31&lt;/td&gt;&lt;td style=&quot;padding:9px 12px&quot;&gt;35%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;padding:9px 12px&quot;&gt;基準&lt;div style=&quot;font-size:13px;line-height:1.5;color:var(--muted);margin-top:2px&quot;&gt;與外部 DCF 單點同口徑；今天的現值，不是 12 個月目標價，非買賣建議&lt;/div&gt;&lt;/td&gt;&lt;td style=&quot;padding:9px 12px;font-size:20px;font-weight:700&quot;&gt;34.98&lt;/td&gt;&lt;td style=&quot;padding:9px 12px&quot;&gt;45%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;padding:9px 12px&quot;&gt;樂觀&lt;/td&gt;&lt;td style=&quot;padding:9px 12px;font-size:20px;font-weight:700&quot;&gt;49.36&lt;/td&gt;&lt;td style=&quot;padding:9px 12px&quot;&gt;20%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:10px;font-size:15px;line-height:1.7&quot;&gt;中點是三個情境的加權，上下緣是換折現率重算；算式見&lt;a href=&quot;#valuation&quot;&gt;第五題&lt;/a&gt;。情境表說明合理價值怎麼組成，不是單一目標價。&lt;/p&gt;&lt;/section&gt;&lt;div class=&quot;kpis&quot;&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;l&quot;&gt;近四季營收年增&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;−1.2%&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;2027 財年指引再衰退高個位數&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;l&quot;&gt;營業利益率（近四季）&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;8.2%（推導）&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;含關稅退款；調整後約 6.7%&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;l&quot;&gt;股利殖利率&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;約 4.3%&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;2026-11-16 收盤；連續 11 年調高&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;l&quot;&gt;股東回饋占自由現金流&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;約 116%&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;近四季；依政策列警示&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;note-box&quot; id=&quot;survival&quot; style=&quot;border-left-color:var(--pos)&quot;&gt;&lt;p style=&quot;margin:0&quot;&gt;&lt;b&gt;信用評級&lt;/b&gt;　機構 Moody&amp;#x27;s A2、S&amp;amp;P A+（10-Q 2026-08-31 Part I, Item 2 ¶175）｜投資等級　｜　&lt;a href=&quot;#survival-detail&quot;&gt;&lt;b&gt;存活檢查（12～24 個月）&lt;/b&gt;&lt;/a&gt;　&lt;b style=&quot;color:var(--pos)&quot;&gt;無明顯警訊&lt;/b&gt;（推導，非違約預測；理由見第六題計算底稿）&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;business&quot;&gt;&lt;div class=&quot;qno&quot;&gt;問題 01&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;生意怎麼賺錢？&lt;/div&gt;&lt;h2&gt;設計與行銷運動鞋服，生產全外包；約六成靠批發、四成直營&lt;/h2&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;Nike 靠品牌、設計與行銷賺錢，生產幾乎全外包。&lt;/strong&gt;2026 財年鞋類約占營收 66%、服飾 29%、運動器材 5%（含 Converse）；修復零售通路是轉型重點，&lt;a class=&quot;term&quot; href=&quot;#g1&quot;&gt;批發&lt;/a&gt;成長、&lt;a class=&quot;term&quot; href=&quot;#g2&quot;&gt;直營&lt;/a&gt;減少（明細見上方生意介紹）。&lt;/p&gt;&lt;p&gt;衰退集中在生活風格鞋款、Jordan（Nike 旗下喬丹籃球品牌）、Converse 與大中華區：鞋類營收兩年減少 13%，第一季 Nike 品牌鞋類再減 6%、服飾成長 2%。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;產品線營收占比（近四季，億美元；逐年金額與成長見下方明細表；圖的占比分母為圖中各線合計）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 480 280&quot; role=&quot;img&quot; aria-label=&quot;產品線營收&quot; class=&quot;chart&quot; style=&quot;max-width:624px&quot;&gt;&lt;path d=&quot;M240.0,52.0 A88,88 0 1 1 167.7,190.2 L195.6,170.8 A54,54 0 1 0 240.0,86.0 Z&quot; fill=&quot;var(--c1)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;鞋類：300（65%）&lt;/title&gt;&lt;/path&gt;&lt;path d=&quot;M167.7,190.2 A88,88 0 0 1 212.3,56.5 L223.0,88.8 A54,54 0 0 0 195.6,170.8 Z&quot; fill=&quot;var(--c2)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;服飾：136（30%）&lt;/title&gt;&lt;/path&gt;&lt;path d=&quot;M212.3,56.5 A88,88 0 0 1 238.3,52.0 L239.0,86.0 A54,54 0 0 0 223.0,88.8 Z&quot; fill=&quot;var(--c6)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;運動器材：22.0（5%）&lt;/title&gt;&lt;/path&gt;&lt;path d=&quot;M238.3,52.0 A88,88 0 0 1 240.0,52.0 L240.0,86.0 A54,54 0 0 0 239.0,86.0 Z&quot; fill=&quot;var(--muted)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;其他：1.4（&amp;lt;1%）&lt;/title&gt;&lt;/path&gt;&lt;polyline points=&quot;321.5,182.6 328.6,191.0 346.0,191.0&quot; fill=&quot;none&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;1&quot;/&gt;&lt;text x=&quot;354.0&quot; y=&quot;188.0&quot; class=&quot;lab&quot; text-anchor=&quot;start&quot;&gt;鞋類&lt;/text&gt;&lt;text x=&quot;354.0&quot; y=&quot;206.0&quot; class=&quot;val&quot; text-anchor=&quot;start&quot;&gt;65%&lt;tspan class=&quot;ax&quot; font-weight=&quot;400&quot;&gt;　300&lt;/tspan&gt;&lt;/text&gt;&lt;polyline points=&quot;152.7,110.9 145.1,106.0 134.0,106.0&quot; fill=&quot;none&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;1&quot;/&gt;&lt;text x=&quot;126.0&quot; y=&quot;103.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;服飾&lt;/text&gt;&lt;text x=&quot;126.0&quot; y=&quot;121.0&quot; class=&quot;val&quot; text-anchor=&quot;end&quot;&gt;30%&lt;tspan class=&quot;ax&quot; font-weight=&quot;400&quot;&gt;　136&lt;/tspan&gt;&lt;/text&gt;&lt;polyline points=&quot;224.4,49.3 223.1,68.0 134.0,68.0&quot; fill=&quot;none&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;1&quot;/&gt;&lt;text x=&quot;126.0&quot; y=&quot;65.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;運動器材&lt;/text&gt;&lt;text x=&quot;126.0&quot; y=&quot;83.0&quot; class=&quot;val&quot; text-anchor=&quot;end&quot;&gt;5%&lt;tspan class=&quot;ax&quot; font-weight=&quot;400&quot;&gt;　22.0&lt;/tspan&gt;&lt;/text&gt;&lt;polyline points=&quot;239.1,48.0 239.0,30.0 134.0,30.0&quot; fill=&quot;none&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;1&quot;/&gt;&lt;text x=&quot;126.0&quot; y=&quot;27.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;其他&lt;/text&gt;&lt;text x=&quot;126.0&quot; y=&quot;45.0&quot; class=&quot;val&quot; text-anchor=&quot;end&quot;&gt;&amp;lt;1%&lt;tspan class=&quot;ax&quot; font-weight=&quot;400&quot;&gt;　1.4&lt;/tspan&gt;&lt;/text&gt;&lt;text x=&quot;240.0&quot; y=&quot;136.0&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;近四季&lt;/text&gt;&lt;text x=&quot;240.0&quot; y=&quot;158.0&quot; class=&quot;val&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:18px&quot;&gt;459&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;白話說&lt;/b&gt;每 100 美元營收約 61 美元賣給零售商、39 美元自己賣；扣生產成本約剩 41 美元，調整後營業利益約 7 美元。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;要留意&lt;/b&gt;大中華區與 Converse 合計占第一季營收減少約 86%；兩者不止跌，北美回升難帶動整體。&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;產品線營收明細（億美元；占比為最近財年，分母為各線合計）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;產品線&lt;/th&gt;&lt;th&gt;FY24&lt;/th&gt;&lt;th&gt;FY25&lt;/th&gt;&lt;th&gt;FY26&lt;/th&gt;&lt;th&gt;近四季&lt;/th&gt;&lt;th&gt;最近財年年增&lt;/th&gt;&lt;th&gt;占比&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;鞋類&lt;/td&gt;&lt;td&gt;352&lt;/td&gt;&lt;td&gt;310&lt;/td&gt;&lt;td&gt;305&lt;/td&gt;&lt;td&gt;300&lt;/td&gt;&lt;td&gt;-1.4%&lt;/td&gt;&lt;td&gt;66%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;服飾&lt;/td&gt;&lt;td&gt;139&lt;/td&gt;&lt;td&gt;130&lt;/td&gt;&lt;td&gt;135&lt;/td&gt;&lt;td&gt;136&lt;/td&gt;&lt;td&gt;3.5%&lt;/td&gt;&lt;td&gt;29%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;運動器材&lt;/td&gt;&lt;td&gt;21&lt;/td&gt;&lt;td&gt;22&lt;/td&gt;&lt;td&gt;22&lt;/td&gt;&lt;td&gt;22&lt;/td&gt;&lt;td&gt;-0.1%&lt;/td&gt;&lt;td&gt;5%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;其他（授權等）&lt;/td&gt;&lt;td&gt;2&lt;/td&gt;&lt;td&gt;1&lt;/td&gt;&lt;td&gt;1&lt;/td&gt;&lt;td&gt;1&lt;/td&gt;&lt;td&gt;93.2%&lt;/td&gt;&lt;td&gt;0%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;business-profile&quot;&gt;&lt;h3&gt;生意介紹：年報重點&lt;/h3&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;全球最大運動鞋服商，設計與行銷自己做、生產全外包；正處轉型低谷。&lt;/strong&gt;下面依序說明它賣什麼、誰付錢、營收結構、市場與專案、競爭、管理層說法與年報風險，每段附出處。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;賣什麼&lt;/p&gt;&lt;h4&gt;鞋類是本業，服飾與器材是配角&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;2026 財年營收 463.98 億美元：Nike 品牌鞋類 295.25 億、服飾 134.49 億、運動器材 21.99 億；Converse 11.74 億、年減 31%&lt;span class=&quot;src&quot;&gt;（10-K 2026-05-31 Item 7 ¶45）&lt;/span&gt;。&lt;/strong&gt;另有授權第三方用 Nike 商標生產部分商品，並提供 App、賽事與門市數位服務，金額未單獨揭露&lt;span class=&quot;src&quot;&gt;（10-K Item 1 ¶12–13）&lt;/span&gt;。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;誰付錢、怎麼賣&lt;/p&gt;&lt;h4&gt;零售商買走六成，消費者直購四成且在縮&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;2026 財年 Nike 品牌批發 274.53 億美元、成長 6%，直營（門市、網站與 App）177.20 億、減少 6%&lt;span class=&quot;src&quot;&gt;（10-K Item 7 ¶45）&lt;/span&gt;。&lt;/strong&gt;美國占總營收約 44%，前三大美國客戶約占美國營收 29%；美國以外占 56%，前三大客戶約占 16%&lt;span class=&quot;src&quot;&gt;（10-K Item 1 ¶23、¶28）&lt;/span&gt;。外部佐證：Dick&amp;#x27;s 揭露 Nike 約占其商品採購 31%&lt;span class=&quot;src&quot;&gt;（Dick&amp;#x27;s 10-K 2026-03-27）&lt;/span&gt;。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;營收結構：誰在拉動&lt;/p&gt;&lt;h4&gt;持平的營收裡，三塊在拖&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;2026 財年營收持平、&lt;a class=&quot;term&quot; href=&quot;#g3&quot;&gt;幣別中性&lt;/a&gt; −2%，大中華區、Converse 與歐洲中東非洲分別拖累約 2、1、1 個百分點&lt;span class=&quot;src&quot;&gt;（10-K Item 7 ¶5、¶54）&lt;/span&gt;。&lt;/strong&gt;2027 財年第一季 Nike 品牌鞋類 69.51 億、年減 6%，服飾 33.84 億、成長 2%&lt;span class=&quot;src&quot;&gt;（10-Q 2026-08-31 Part I, Item 2 ¶35）&lt;/span&gt;；鞋類是唯一大到能拉動整體的品類。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;市場、地區與重點專案&lt;/p&gt;&lt;h4&gt;北美在回升，大中華區還在掉；Pace 是唯一大型專案&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;Nike 品牌分北美、歐洲中東非洲、大中華區、亞太拉美四區，Converse 另列&lt;span class=&quot;src&quot;&gt;（10-K Item 1 ¶20–21）&lt;/span&gt;。&lt;/strong&gt;北美 2026 財年 205.11 億美元、成長 5%，批發 +14%&lt;span class=&quot;src&quot;&gt;（Item 7 ¶100）&lt;/span&gt;；大中華區 58.47 億、減少 11%&lt;span class=&quot;src&quot;&gt;（幣別中性 −13%，Item 7 ¶122、¶124）&lt;/span&gt;，第一季再跌 26%&lt;span class=&quot;src&quot;&gt;（10-Q Part I, Item 2 ¶109）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;重點專案是 Pace 重整計畫：稅前費用約 10 億美元、多為現金，2031 財年前累計節省約 25 億，節省額未扣費用與再投資&lt;span class=&quot;src&quot;&gt;（公司說法，10-Q Part I, Item 2 ¶22–23）&lt;/span&gt;。&lt;/strong&gt;沒有揭露新廠或新市場擴張專案&lt;span class=&quot;src&quot;&gt;（查過 Item 1、Item 7）&lt;/span&gt;。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;跟誰競爭&lt;/p&gt;&lt;h4&gt;對手多、門檻在品牌與貨架&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;年報說運動鞋服業「高度競爭」，對手包括運動與休閒鞋服公司、零售商自有品牌，新對手持續進入，也要和別人搶代工產能與原料&lt;span class=&quot;src&quot;&gt;（10-K Item 1A ¶19）&lt;/span&gt;。&lt;/strong&gt;&lt;a class=&quot;term&quot; href=&quot;#g0&quot;&gt;近四季&lt;/a&gt;&lt;a class=&quot;term&quot; href=&quot;#g6&quot;&gt;營業利益率&lt;/a&gt; Deckers 23.6%（DECK，資料商 yfinance，近四季截至 2026-09-30）、Lululemon 17.8%（LULU，資料商 yfinance，近四季截至 2026-07-31）、On 15.3%（ONON，資料商 yfinance，近四季截至 2026-09-30），Nike 8.2%（NKE，資料商 yfinance，近四季截至 2026-08-31）（資料商）；我們的判讀是 Nike 規模仍最大，但利潤率已掉到同業後段（作者判斷）。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;管理層怎麼說&lt;/p&gt;&lt;h4&gt;公司說要「以運動為先」，實績還只在北美&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;公司說法：策略是以運動項目帶頭、做「必買」產品、加深與消費者連結&lt;span class=&quot;src&quot;&gt;（10-K Item 7 ¶3）&lt;/span&gt;，2027 財年營收預期衰退高個位數、調整後每股盈餘 1.15–1.35 美元&lt;span class=&quot;src&quot;&gt;（8-K 2026-10-01 新聞稿）&lt;/span&gt;。&lt;/strong&gt;對照實績：北美批發已回升，但第一季全公司營收仍減 4%，回升尚未擴散到其他地區。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;年報列的主要風險&lt;/p&gt;&lt;h4&gt;四條和本公司最相關的年報風險&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;①消費者喜好轉移：沒跟上趨勢會傷營收與利潤&lt;span class=&quot;src&quot;&gt;（10-K Item 1A ¶45）&lt;/span&gt;。&lt;/strong&gt;②庫存：需求預估失準會造成跌價與折扣清貨，過去已發生&lt;span class=&quot;src&quot;&gt;（Item 1A ¶54–55）&lt;/span&gt;。③貿易政策：關稅與進出口限制會直接影響成本&lt;span class=&quot;src&quot;&gt;（Item 1A ¶107–109）&lt;/span&gt;。④競爭：對手多、新進者不斷&lt;span class=&quot;src&quot;&gt;（Item 1A ¶19）&lt;/span&gt;。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;規模與營運&lt;/p&gt;&lt;h4&gt;7.3 萬名員工、生產靠外包&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;2026-05-31 全球員工約 7.3 萬人，含門市與兼職&lt;span class=&quot;src&quot;&gt;（10-K Item 1 ¶79）&lt;/span&gt;。&lt;/strong&gt;美國有 8 個主要物流中心、美國以外 65 個&lt;span class=&quot;src&quot;&gt;（Item 1 ¶26、¶28）&lt;/span&gt;；鞋類由 15 家&lt;a class=&quot;term&quot; href=&quot;#g14&quot;&gt;代工商&lt;/a&gt;生產&lt;span class=&quot;src&quot;&gt;（Item 1 ¶41）&lt;/span&gt;，只有 Air 氣墊（Nike 鞋底緩震技術）零件由自有工廠在美國與越南製造&lt;span class=&quot;src&quot;&gt;（Item 2 ¶4）&lt;/span&gt;。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;moat&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;護城河與成長故事&lt;/p&gt;&lt;h3&gt;品牌與通路仍是窄護城河，但生活風格與大中華區在流失&lt;/h3&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;護城河是品牌與規模：頂尖運動員與賽事代言、遍布全球的通路。&lt;/strong&gt;證據來自零售商：Dick&amp;#x27;s 約三成採購來自 Nike，Shoe Carnival（美國鞋類零售商）揭露 Nike、Skechers（休閒鞋品牌）、Crocs（洞洞鞋品牌）合計占其營收約 46%；零售商很難不賣 Nike，修復批發後能較快拿回貨架。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;侵蝕有兩處：生活風格品類退燒、需要折扣清貨；大中華區營收較 2021 年縮水約三成，CNBC（美國財經電視台）引述業界指年輕消費者轉向本土品牌。&lt;/strong&gt;生命週期屬成熟品牌的再造期，成長要靠奪回市占與減少折扣；護城河列窄（&lt;a class=&quot;term&quot; href=&quot;#g5&quot;&gt;轉機股&lt;/a&gt;反轉確認前的上限），五年內假設利潤率回到接近過去平均。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;護城河來源與失效條件&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;優勢來源&lt;/th&gt;&lt;th&gt;證據&lt;/th&gt;&lt;th&gt;什麼情況代表失效&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;運動表現品牌&lt;/td&gt;&lt;td&gt;北美批發回升；跑步回升為執行長說法&lt;/td&gt;&lt;td&gt;跑步回升停滯、市占再流失&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;通路議價力&lt;/td&gt;&lt;td&gt;Dick&amp;#x27;s 約 31% 採購來自 Nike&lt;/td&gt;&lt;td&gt;主要零售商降低 Nike 占比&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;生活風格地位&lt;/td&gt;&lt;td&gt;Air Force 1（Nike 經典籃球鞋款）等經典款回穩&lt;/td&gt;&lt;td&gt;運動休閒服飾、Jordan 持續兩位數衰退&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;外部證據&lt;/h4&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;外部申報佐證：Dick&amp;#x27;s &lt;a class=&quot;term&quot; href=&quot;#g15&quot;&gt;10-K&lt;/a&gt; 揭露 Nike 約占其商品採購 31%，Shoe Carnival 10-K 揭露約占其淨銷售 24%，Caleres（Famous Footwear 的母公司）也列 Nike 為主要品牌；Under Armour（美國運動服飾品牌）列 Nike 為直接競爭者。&lt;/strong&gt;未找到揭露 Nike 占比的代工廠申報，供應端只能依 Nike 年報。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;零售商對 Nike 的依賴（第三方申報）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 500 102&quot; role=&quot;img&quot; aria-label=&quot;依賴度&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;250.0&quot; x2=&quot;250.0&quot; y1=&quot;6&quot; y2=&quot;96&quot; class=&quot;zero&quot;/&gt;&lt;text x=&quot;240&quot; y=&quot;23&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;Dick&amp;#x27;s Sporting Goods（美國大型運動用品零售商；商品採購占比）（通路商）&lt;/text&gt;&lt;rect x=&quot;250.0&quot; y=&quot;9&quot; width=&quot;174.5&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c2)&quot;/&gt;&lt;text x=&quot;432.5&quot; y=&quot;23&quot; class=&quot;val&quot;&gt;31%&lt;/text&gt;&lt;text x=&quot;240&quot; y=&quot;63&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;Shoe Carnival（淨銷售占比）（通路商）&lt;/text&gt;&lt;rect x=&quot;250.0&quot; y=&quot;49&quot; width=&quot;135.1&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c2)&quot;/&gt;&lt;text x=&quot;393.1&quot; y=&quot;63&quot; class=&quot;val&quot;&gt;24%&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;supply&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;供應鏈與生產地&lt;/p&gt;&lt;h3&gt;鞋類過半在越南生產，四家代工商約占六成&lt;/h3&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;生產持續往越南集中：Nike 品牌鞋類越南占比 2024–2026 財年約 50%、51%、52%，中國由 18% 降到 16%；鞋類 15 家代工商中四家合計約 60%、服飾前六大約 54%&lt;span class=&quot;src&quot;&gt;（10-K Item 1 ¶41–43）&lt;/span&gt;，年報沒有點名，我們不補值。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;風險是單一國家集中：針對越南的關稅或生產中斷會直接影響供貨與毛利；約 9.86 億美元&lt;a class=&quot;term&quot; href=&quot;#g4&quot;&gt;關稅退款&lt;/a&gt;（見第三題）也顯示貿易政策對成本影響很大。&lt;/strong&gt;美國以外的長期資產主要在英國、比利時與中國。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;grid2 wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;美國以外的長期資產（億美元），上方為中國占比&lt;/p&gt;&lt;svg viewBox=&quot; gure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;鞋類與服飾代工集中度（Nike 年報，未具名）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 500 102&quot; role=&quot;img&quot; aria-label=&quot;供應商依賴度&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;250.0&quot; x2=&quot;250.0&quot; y1=&quot;6&quot; y2=&quot;96&quot; class=&quot;zero&quot;/&gt;&lt;text x=&quot;240&quot; y=&quot;23&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;鞋類前四大代工商（合計，15 家中）（上游供應商）&lt;/text&gt;&lt;rect x=&quot;250.0&quot; y=&quot;9&quot; width=&quot;174.5&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c1)&quot;/&gt;&lt;text x=&quot;432.5&quot; y=&quot;23&quot; class=&quot;val&quot;&gt;60%&lt;/text&gt;&lt;text x=&quot;240&quot; y=&quot;63&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;服飾前六大代工商（合計，64 家中）（上游供應商）&lt;/text&gt;&lt;rect x=&quot;250.0&quot; y=&quot;49&quot; width=&quot;157.1&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c1)&quot;/&gt;&lt;text x=&quot;415.1&quot; y=&quot;63&quot; class=&quot;val&quot;&gt;54%&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;外部證據&lt;/h4&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;零售商對 Nike 的依賴（第三方申報）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 500 102&quot; role=&quot;img&quot; aria-label=&quot;依賴度&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;250.0&quot; x2=&quot;250.0&quot; y1=&quot;6&quot; y2=&quot;96&quot; class=&quot;zero&quot;/&gt;&lt;text x=&quot;240&quot; y=&quot;23&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;Dick&amp;#x27;s Sporting Goods（美國大型運動用品零售商；商品採購占比）（通路商）&lt;/text&gt;&lt;rect x=&quot;250.0&quot; y=&quot;9&quot; width=&quot;174.5&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c2)&quot;/&gt;&lt;text x=&quot;432.5&quot; y=&quot;23&quot; class=&quot;val&quot;&gt;31%&lt;/text&gt;&lt;text x=&quot;240&quot; y=&quot;63&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;Shoe Carnival（淨銷售占比）（通路商）&lt;/text&gt;&lt;rect x=&quot;250.0&quot; y=&quot;49&quot; width=&quot;135.1&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c2)&quot;/&gt;&lt;text x=&quot;393.1&quot; y=&quot;63&quot; class=&quot;val&quot;&gt;24%&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;growth&quot;&gt;&lt;div class=&quot;qno&quot;&gt;問題 02&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;還在成長嗎？&lt;/div&gt;&lt;h2&gt;沒有：營收三年縮水約一成、今年再減；北美回升&lt;/h2&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;營收從 2024 財年 514 億美元降到 2026 財年 464 億，2023–2026 財年年均約減少 3.2%；2027 財年第一季再減 4%，全年指引衰退高個位數。&lt;/strong&gt;壓力集中在大中華區（第一季幣別中性 −26%）、Converse（−28%）、運動休閒服飾與 Jordan。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;衰退主要來自量：2026 財年鞋類銷量減 1%、單價拖累約 1 個百分點，第一季鞋類銷量再減 5%&lt;span class=&quot;src&quot;&gt;（10-K Item 7 ¶56；10-Q Part I, Item 2 ¶44）&lt;/span&gt;。&lt;/strong&gt;新產品與新市場的貢獻未揭露，近年沒有併購。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;北美第一季成長 2%（幣別中性；批發 +9%），是轉型已有財報證據的部分。&lt;/strong&gt;近四季投入資本報酬率約 21%、調整後約 17%，仍高於約 8.7% 的資本成本；但兩年來稅後營業利益少約 23 億美元，增量回報為負。&lt;/p&gt;&lt;p&gt;反方是時間：管理層在電話會議表示（Retail Dive 轉述）陣痛延續本財年與下一財年；市價要求的營收年增 3.3%&lt;span class=&quot;src&quot;&gt;（市價反推未來 5 年營收年增；市價 38.26 美元、收盤 2026-11-16；折現率 8.73%；推導）&lt;/span&gt;，已高於近四季的 −1.2%（見第五題）。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;毛利率與營業利益率&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 280&quot; role=&quot;img&quot; aria-label=&quot;利潤率&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;246.0&quot; y2=&quot;246.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;250.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;0%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;201.2&quot; y2=&quot;201.2&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y= &lt;/text&gt;&lt;rect x=&quot;427.1&quot; y=&quot;89.0&quot; width=&quot;40.7&quot; height=&quot;177.0&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;單季營收 FY26 Q4：110&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;448.5&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY26 Q4&lt;/text&gt;&lt;text x=&quot;448.5&quot; y=&quot;16.0&quot; class=&quot;note&quot; text-anchor=&quot;middle&quot;&gt;-1%&lt;/text&gt;&lt;rect x=&quot;488.1&quot; y=&quot;85.1&quot; width=&quot;40.7&quot; height=&quot;180.9&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;單季營收 FY27 Q1：112&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;509.5&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY27 Q1&lt;/text&gt;&lt;text x=&quot;509.5&quot; y=&quot;16.0&quot; class=&quot;note&quot; text-anchor=&quot;middle&quot;&gt;-4%&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c1)&quot;&gt;&lt;/i&gt;單季營收&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;成長來源拆解：量、價、新產品、新市場、併購&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;可拆的只有量與價：鞋類掉在量，單價因通路組合與折扣小幅拖累；服飾在北美量價皆升&lt;span class=&quot;src&quot;&gt;（10-K Item 7 ¶104）&lt;/span&gt;、大中華區量減 8%&lt;span class=&quot;src&quot;&gt;（¶126）&lt;/span&gt;。&lt;/strong&gt;新產品、新市場的營收貢獻公司未揭露&lt;span class=&quot;src&quot;&gt;（查過 Item 7、10-Q Item 2）&lt;/span&gt;，不補值。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;figure&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt signals&quot;&gt;&lt;tr&gt;&lt;th&gt;來源&lt;/th&gt;&lt;th&gt;2026 財年&lt;/th&gt;&lt;th&gt;2027 財年第一季&lt;/th&gt;&lt;th&gt;出處&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;量（鞋類銷量）&lt;/td&gt;&lt;td&gt;−1%&lt;/td&gt;&lt;td&gt;−5%&lt;/td&gt;&lt;td&gt;10-K Item 7 ¶56；10-Q Item 2 ¶44&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;價（鞋類單價）&lt;/td&gt;&lt;td&gt;拖累約 1 個百分點&lt;/td&gt;&lt;td&gt;拖累約 1 個百分點&lt;/td&gt;&lt;td&gt;同上&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;新產品&lt;/td&gt;&lt;td&gt;未揭露&lt;/td&gt;&lt;td&gt;未揭露（跑步回升為執行長說法）&lt;/td&gt;&lt;td&gt;查過 Item 7&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;新市場&lt;/td&gt;&lt;td&gt;未揭露&lt;/td&gt;&lt;td&gt;未揭露&lt;/td&gt;&lt;td&gt;查過 Item 1、Item 7&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;併購&lt;/td&gt;&lt;td&gt;無&lt;/td&gt;&lt;td&gt;無&lt;/td&gt;&lt;td&gt;10-K、10-Q&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;投入與回報：設備投資很輕，問題在費用與定價&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;Nike 不揭露研發費用，資本支出近四季約 7 億美元、只占營收 1.5%。&lt;/strong&gt;主要投入是行銷：第一季行銷與代言費用（demand creation）約 12.5 億美元、年增 5%，公司說明是加碼重要賽事；同季營運費用減少 6%。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;所以投入回報要看行銷能否換回營收與毛利：過去兩年行銷沒有大減，營收卻下滑、折扣增加，每 1 元行銷換回的毛利在下降。&lt;/strong&gt;改判訊號以毛利率能否不靠非經常項目回到 44% 以上，作為投入回報轉好或轉弱的分界。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;!--新圖表--&gt;&lt;div class=&quot;grid2 wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;營收年增率逐季走勢（每季比去年同季；成長推估底稿.json）；底稿標示：加速（年增率上升）（近四季單季年增平均 -1.2% 對前四季平均 -7.0%（差 +5.8 個百分點；±1 個百分點內標持平，只是標示））&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 280&quot; role=&quot;img&quot; aria-label=&quot;營收年增率走勢&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;56&quot; x2=&quot;516&quot; y1=&quot;246.0&quot; y2=&quot;246.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;48&quot; y=&quot;250.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;-15%&lt;/text&gt;&lt;line x1=&quot;56&quot; x2=&quot;516&quot; y1=&quot;189.0&quot; y2=&quot;189.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;48&quot; y=&quot;193.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;-10%&lt;/text&gt;&lt;line x1=&quot;56&quot; x2=&quot;516&quot; y1=&quot;132.0&quot; y2=&quot;132.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;48&quot; y=&quot;136.0&quot; clas .8 496.0,124.3&quot; fill=&quot;none&quot; stroke=&quot;var(--c1)&quot; stroke-width=&quot;2.4&quot;/&gt;&lt;circle cx=&quot;68.0&quot; cy=&quot;163.0&quot; r=&quot;3.5&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c1)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;單季營收比去年同季 2024-11：-8%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;129.1&quot; cy=&quot;181.4&quot; r=&quot;3.5&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c1)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;單季營收比去年同季 2025-02：-9%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;190.3&quot; cy=&quot;211.5&quot; r=&quot;3.5&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c1)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;單季營收比去年同季 2025-05：-12%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;251.4&quot; cy=&quot;62.1&quot; r=&quot;3.5&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c1)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;單季營收比去年同季 2025-08：1%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;312.6&quot; cy=&quot;68.3&quot; r=&quot;3.5&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c1)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;單季營收比去年同季 2025-11：1%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;373.7&quot; cy=&quot;74.0&quot; r=&quot;3.5&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c1)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;單季營收比去年同季 2026-02：0%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;434.9&quot; cy=&quot;87.8&quot; r=&quot;3.5&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c1)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;單季營收比去年同季 2026-05：-1%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;496.0&quot; cy=&quot;124.3&quot; r=&quot;3.5&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c1)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;單季營收比去年同季 2026-08：-4%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;503.0&quot; y=&quot;128.3&quot; class=&quot;val&quot; fill=&quot;var(--c1)&quot;&gt;-4%&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c1)&quot;&gt;&lt;/i&gt;單季營收比去年同季&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c2)&quot;&gt;&lt;/i&gt;近四季合計&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/div&gt;&lt;!--/新圖表--&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;白話說&lt;/b&gt;像老字號餐廳：招牌菜（跑步）重新受歡迎，但分店（大中華區）與副品牌（Converse）持續流失，總營業額仍往下。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;要留意&lt;/b&gt;跑步回升是執行長說法，財報未揭露品類數字；回升若無法擴散到其他地區，轉型比基準慢（見改判訊號）。&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;cash&quot;&gt;&lt;div class=&quot;qno&quot;&gt;問題 03・04&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;賺的錢是真的嗎？股東實際拿到什麼？&lt;/div&gt;&lt;h2&gt;獲利與現金被關稅退款墊高；扣除後最多與股利打平&lt;/h2&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;近四季淨利 30.9 億美元，含約 9.86 億關稅退款，這是沖回先前多付的成本，不是本業多賺。&lt;/strong&gt;扣退款、加回遣散費後每股盈餘約 1.73 美元&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;，&lt;a class=&quot;term&quot; href=&quot;#g10&quot;&gt;本益比&lt;/a&gt;用這個口徑；申報稀釋每股盈餘 2.09 美元，兩者差約 17%，報告不混用。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;近四季&lt;a class=&quot;term&quot; href=&quot;#g7&quot;&gt;自由現金流&lt;/a&gt;約 21 億美元。&lt;/strong&gt;扣退款現金、補回相關稅款與遣散支出後約 16–17 億&lt;span class=&quot;src&quot;&gt;（推估，保守口徑）&lt;/span&gt;；若把已付的 IEEPA（美國《國際緊急經濟權力法》，川普政府據以加徵關稅的法律）關稅也視為不再發生而加回，約 23–25 億&lt;span class=&quot;src&quot;&gt;（上限口徑）&lt;/span&gt;。對照股利 24.3 億，保守口徑不足、上限大致打平。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;淨利、營運現金流與自由現金流（億美元）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 300&quot; role=&quot;img&quot; aria-label=&quot;現金品質&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;266.0&quot; y2=&quot;266.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;270.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;0.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;205.5&quot; y2=&quot;205.5&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;209.5&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;20.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;145.0&quot; y2=&quot;145.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;149.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;40.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;84.5&quot; y2=&quot;84.5&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;88.5&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;60.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;24.0&quot; y2=&quot;24.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;28.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;80.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;266.0&quot; y2=&quot;266.0&quot; class=&quot;zero&quot;/&gt;&lt;rect x=&quot;70.3&quot; y=&quot;93.6&quot; width=&quot;26.5&quot; height=&quot;172.4&quot; rx=&quot;2&quot; fill=&quot;var(--c4)&quot;&gt;&lt;title&gt;淨利 FY24：57.0&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;98.8&quot; y=&quot;41.3&quot; width=&quot;26.5&quot; height=&quot;224.7&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;營運現金流 FY24：74.3&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;127.2&quot; y=&quot;65.8&quot; width=&quot;26.5&quot; height=&quot;200.2&quot; rx=&quot;2&quot; fill=&quot;var(--c2)&quot;&gt;&lt;title&gt;自由現金流 FY24：66.2&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;113.0&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY24&lt;/text&gt;&lt;rect x=&quot;192.3&quot; y=&quot;168.6&quot; width=&quot;26.5&quot; height=&quot;97.4&quot; rx=&quot;2&quot; fill=&quot;var(--c4)&quot;&gt;&lt;title&gt;淨利 FY25：32.2&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;220.8&quot; y=&quot;154.1&quot; width=&quot;26.5&quot; height=&quot;111.9&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;營運現金流 FY25：37.0&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;249.2&quot; y=&quot;167.1&quot; width=&quot;26.5&quot; height=&quot;98.9&quot; rx=&quot;2&quot; fill=&quot;var(--c2)&quot;&gt;&lt;title&gt;自由現金流 FY25：32.7&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;235.0&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY25&lt;/text&gt;&lt;rect x=&quot;314.3&quot; y=&quot;172.0&quot; width=&quot;26.5&quot; height=&quot;94.0&quot; rx=&quot;2&quot; fill=&quot;var(--c4)&quot;&gt;&lt;title&gt;淨利 FY26：31.1&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;342.8&quot; y=&quot;179.2&quot; width=&quot;26.5&quot; height=&quot;86.8&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;營運現金流 FY26：28.7&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;371.2&quot; y=&quot;199.9&quot; width=&quot;26.5&quot; height=&quot;66.1&quot; rx=&quot;2&quot; fill=&quot;var(--c2)&quot;&gt;&lt;title&gt;自由現金流 FY26：21.8&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;357.0&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY26&lt;/text&gt;&lt;rect x=&quot;436.3&quot; y=&quot;172.4&quot; width=&quot;26.5&quot; height=&quot;93.6&quot; rx=&quot;2&quot; fill=&quot;var(--c4)&quot;&gt;&lt;title&gt;淨利 近四季：30.9&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;464.8&quot; y=&quot;181.9&quot; width=&quot;26.5&quot; height=&quot;84.1&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;營運現金流 近四季：27.8&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;493.2&quot; y=&quot;202.3&quot; width=&quot;26.5&quot; height=&quot;63.7&quot; rx=&quot;2&quot; fill=&quot;var(--c2)&quot;&gt;&lt;title&gt;自由現金流 近四季：21.1&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;479.0&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;近四季&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c4)&quot;&gt;&lt;/i&gt;淨利&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c1)&quot;&gt;&lt;/i&gt;營運現金流&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c2)&quot;&gt;&lt;/i&gt;自由現金流&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;錢從哪一層開始不夠：現金流分層&lt;/h3&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;現金流分層（近四季，至 2026-08-31）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;層次&lt;/th&gt;&lt;th&gt;金額&lt;/th&gt;&lt;th&gt;正負&lt;/th&gt;&lt;th&gt;完整度&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;一、營運現金流&lt;/td&gt;&lt;td&gt;27.8 億美元&lt;/td&gt;&lt;td&gt;正&lt;/td&gt;&lt;td&gt;完整&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;二、一般資本支出後&lt;/td&gt;&lt;td&gt;21.1 億美元&lt;/td&gt;&lt;td&gt;正&lt;/td&gt;&lt;td&gt;完整&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;三、回購與股利後&lt;/td&gt;&lt;td&gt;-3.4 億美元&lt;/td&gt;&lt;td&gt;負&lt;/td&gt;&lt;td&gt;完整&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;延伸：再扣併購與員工代扣稅&lt;/td&gt;&lt;td&gt;已知部分 -3.4 億美元&lt;/td&gt;&lt;td&gt;無法判定&lt;/td&gt;&lt;td&gt;缺併購、員工股票代扣稅&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;數值正負不等於安全或危險：第二層為負代表所列投入超過當期營運現金，不等於營業虧損；資本支出尚未區分維持與擴張。&lt;/p&gt;&lt;p class=&quot;cap&quot;&gt;（算法與完整表見&lt;a href=&quot;#wp-3-4&quot;&gt;計算底稿 3・4&lt;/a&gt;）&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;調整明細：推導與未揭露項目&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;退款每股約 0.52 美元，10-K 說明它大致抵銷該財年自身的關稅成本；遣散費取 3 月計畫相關約 3 億（每股約 0.16）。&lt;/strong&gt;公司未揭露各季關稅成本，1.73 仍含近四季多數這類成本，屬保守口徑；全數加回的上限約 2.2 美元（以 22% 稅率粗估）。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;未揭露、未調整：退款相關稅款（以 21% 推估約 2 億）與遣散現金的分季金額、2027 財年第一季外國稅務審計和解、Converse 庫存陳舊準備。&lt;/strong&gt;因此獲利與現金都保留區間，不把推估當申報值。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;白話說&lt;/b&gt;每 100 美元淨利收進約 90 美元營運現金、扣設備投資剩約 68 美元，其中約 32 美元是退款現金；股利約 78 美元。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;要留意&lt;/b&gt;退款現金已收完；股利承受力要看調整後自由現金流，最好也只是打平（見改判訊號）。&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;shareholders&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;股東實際拿到什麼？&lt;/p&gt;&lt;h3&gt;股利仍增、回購停止；每股自由現金流兩年少約三分之二&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;Nike 在 2016–2026 財年每年調高股利，目前每季 0.41 美元，殖利率約 4.3%（2026-11-16 收盤），部分來自股價下跌。&lt;/strong&gt;回購從 2023 財年 55 億美元降至 2026 財年 1.5 億，近四季僅 0.2 億，低於約 7 億股權薪酬，股數不再減少。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;每股自由現金流從 2024 財年約 4.3 美元降到近四季約 1.4 美元，且含約 0.67 美元退款現金；調整後約 1.1–1.7 美元（推估）。&lt;/strong&gt;保守口徑下股利靠帳上現金補足，高殖利率要靠獲利回升才能長期維持。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;每股自由現金流（美元）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 300&quot; role=&quot;img&quot; aria-label=&quot;每股自由現金流&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;266.0&quot; y2=&quot;266.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;270.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;0.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;185.3&quot; y2=&quot;185.3&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;189.3&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;2.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;104.7&quot; y2=&quot;104.7&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;108.7&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;4.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;24.0&quot; y2=&quot;24.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;28.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;6.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;266.0&quot; y2=&quot;266.0&quot; class=&quot;zero&quot;/&gt;&lt;rect x=&quot;66.6&quot; y=&quot;140.8&quot; width=&quot;32.2&quot; height=&quot;125.2&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;每股自由現金流 FY23：3.1&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;100.8&quot; y=&quot;160.2&quot; width=&quot;32.2&quot; height=&quot;105.8&quot; rx=&quot;2&quot; fill=&quot;var(--c4)&quot;&gt;&lt;title&gt;扣除股權薪酬後 FY23：2.6&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;100.8&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY23&lt;/text&gt;&lt;rect x=&quot;164.2&quot; y=&quot;91.5&quot; width=&quot;32.2&quot; height=&quot;174.5&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;每股自由現金流 FY24：4.3&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;198.4&quot; y=&quot;112.7&quot; width=&quot;32.2&quot; height=&quot;153.3&quot; rx=&quot;2&quot; fill=&quot;var(--c4)&quot;&gt;&lt;title&gt;扣除股權薪酬後 FY24：3.8&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;198.4&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY24&lt;/text&gt;&lt;rect x=&quot;261.8&quot; y=&quot;177.4&quot; width=&quot;32.2&quot; height=&quot;88.6&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;每股自由現金流 FY25：2.2&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;296.0&quot; y=&quot;196.6&quot; width=&quot;32.2&quot; height=&quot;69.4&quot; rx=&quot;2&quot; fill=&quot;var(--c4)&quot;&gt;&lt;title&gt;扣除股權薪酬後 FY25：1.7&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;296.0&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY25&lt;/text&gt;&lt;rect x=&quot;359.4&quot; y=&quot;206.5&quot; width=&quot;32.2&quot; height=&quot;59.5&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;每股自由現金流 FY26：1.5&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;393.6&quot; y=&quot;226.0&quot; width=&quot;32.2&quot; height=&quot;40.0&quot; rx=&quot;2&quot; fill=&quot;var(--c4)&quot;&gt;&lt;title&gt;扣除股權薪酬後 FY26：1.0&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;393.6&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY26&lt;/text&gt;&lt;rect x=&quot;457.0&quot; y=&quot;208.7&quot; width=&quot;32.2&quot; height=&quot;57.3&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;每股自由現金流 近四季：1.4&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;491.2&quot; y=&quot;227.4&quot; width=&quot;32.2&quot; height=&quot;38.6&quot; rx=&quot;2&quot; fill=&quot;var(--c4)&quot;&gt;&lt;title&gt;扣除股權薪酬後 近四季：1.0&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;491.2&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;近四季&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c1)&quot;&gt;&lt;/i&gt;每股自由現金流&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c4)&quot;&gt;&lt;/i&gt;扣除股權薪酬後&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;白話說&lt;/b&gt;持有 100 股每年約領 164 美元股利；公司近四季每股自由現金流約 142 美元，調整後約 110–170 美元（推估）。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;要留意&lt;/b&gt;每股自由現金流若持續低於每股股利，股利可能停止成長（見改判訊號）。&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;股東回報與市價隱含報酬拆解&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;以現價買進，基準年報酬約 8.2%＝股利 4.3%＋回購 0（2026 財年第一季起暫停）＋每股成長與其他 3.9%&lt;span class=&quot;src&quot;&gt;（推算，假設倍數不變）&lt;/span&gt;。&lt;/strong&gt;&lt;a class=&quot;term&quot; href=&quot;#g12&quot;&gt;股東收益率&lt;/a&gt;約 4.3%，約是公債 5.12% 的 84%；現在拿得到的現金低於公債，其餘要靠獲利回升。&lt;/p&gt;&lt;p&gt;回報品質：股利加回購占近四季自由現金流約 116%、淨回購為負，依政策兩項都列警示；警示把相關生意品質上限壓到「中」，不改估值與價格位置。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;現價隱含年報酬（基準情境，非預期報酬）從哪裡來：股利、回購是現在拿到的現金，其餘要靠每股成長（紅色虛線為 10 年期美國公債 5.12%）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 500 196&quot; role=&quot;img&quot; aria-label=&quot;市價隱含報酬拆解&quot; class=&quot;chart&quot; style=&quot;max-width:650px&quot;&gt;&lt;line x1=&quot;250.0&quot; x2=&quot;250.0&quot; y1=&quot;24&quot; y2=&quot;192&quot; class=&quot;zero&quot;/&gt;&lt;line x1=&quot;361.2&quot; x2=&quot;361.2&quot; y1=&quot;22&quot; y2=&quot;192&quot; class=&quot;price&quot;/&gt;&lt;text x=&quot;361.2&quot; y=&quot;16&quot; class=&quot;pricelab&quot; text-anchor=&quot;middle&quot;&gt;公債 5.12%&lt;/text&gt;&lt;text x=&quot;240&quot; y=&quot;55.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;股利殖利率&lt;/text&gt;&lt;rect x=&quot;250.0&quot; y=&quot;40.0&quot; width=&quot;92.9&quot; height=&quot;20&quot; rx=&quot;4&quot; fill=&quot;var(--c2)&quot;&gt;&lt;title&gt;股利殖利率：4.28%&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;350.9&quot; y=&quot;55.0&quot; class=&quot;val&quot;&gt;4.28%&lt;/text&gt;&lt;line x1=&quot;342.9&quot; x2=&quot;342.9&quot; y1=&quot;60.0&quot; y2=&quot;80.0&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;1&quot; stroke-dasharray=&quot;2 3&quot;/&gt;&lt;text x=&quot;240&quot; y=&quot;95.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;回購殖利率&lt;/text&gt;&lt;rect x=&quot;342.9&quot; y=&quot;80.0&quot; width=&quot;2.0&quot; height=&quot;20&quot; rx=&quot;4&quot; fill=&quot;var(--c6)&quot;&gt;&lt;title&gt;回購殖利率：+0.04%&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;351.6&quot; y=&quot;95.0&quot; class=&quot;val&quot;&gt;+0.04%&lt;/text&gt;&lt;line x1=&quot;343.6&quot; x2=&quot;343.6&quot; y1=&quot;100.0&quot; y2=&quot;120.0&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;1&quot; stroke-dasharray=&quot;2 3&quot;/&gt;&lt;text x=&quot;240&quot; y=&quot;135.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;每股成長與其他（推算）&lt;/text&gt;&lt;rect x=&quot;343.6&quot; y=&quot;120.0&quot; width=&quot;85.2&quot; height=&quot;20&quot; rx=&quot;4&quot; fill=&quot;var(--c3)&quot;&gt;&lt;title&gt;每股成長與其他（推算）：+3.92%&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;436.8&quot; y=&quot;135.0&quot; class=&quot;val&quot;&gt;+3.92%&lt;/text&gt;&lt;line x1=&quot;428.8&quot; x2=&quot;428.8&quot; y1=&quot;140.0&quot; y2=&quot;160.0&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;1&quot; stroke-dasharray=&quot;2 3&quot;/&gt;&lt;text x=&quot;240&quot; y=&quot;175.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;合計：現價隱含年報酬（基準情境，非預期報酬）&lt;/text&gt;&lt;rect x=&quot;250.0&quot; y=&quot;160.0&quot; width=&quot;178.8&quot; height=&quot;20&quot; rx=&quot;4&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;合計：現價隱含年報酬（基準情境，非預期報酬）：8.24%&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;436.8&quot; y=&quot;175.0&quot; class=&quot;val&quot;&gt;8.24%&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;股利、回購、股數變化與政策門檻的逐項判讀（算法與完整表見&lt;a href=&quot;#wp-3-4&quot;&gt;計算底稿 3・4&lt;/a&gt;）。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;market&quot;&gt;&lt;div class=&quot;qno&quot;&gt;市場背景&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;看價格之前：大盤與這檔股票現在的市場狀態&lt;/div&gt;&lt;h2&gt;大盤 2 個面向相對歷史偏高；股價近 12 個月落後大盤（-40% 對 +11%）&lt;/h2&gt;&lt;style&gt;.mkt-cards{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:14px 0}.mkt-cards .kpi{padding:10px 12px}.mkt-cards .v{font-size:20px}.mkt-cards .l,.mkt-cards .n{font-size:12px}&lt;/style&gt;&lt;div class=&quot;kpis mkt-cards&quot;&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;l&quot;&gt;大盤｜估值&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;偏高&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;偏高 1／有分位 2 項&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;l&quot;&gt;大盤｜信用&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;中性&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;偏高 0／有分位 3 項&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;l&quot;&gt;大盤｜槓桿&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;偏高&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;偏高 1／有分位 1 項&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;l&quot;&gt;大盤｜情緒&lt;/div&gt;&lt;div class=&quot;v&quot;&g &quot;312&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;2026-11&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--ink)&quot;&gt;&lt;/i&gt;收盤價&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c3)&quot;&gt;&lt;/i&gt;200 日均線&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--pos)&quot;&gt;&lt;/i&gt;合理價值區間&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c7)&quot;&gt;&lt;/i&gt;同業與歷史倍數（交叉核對，不進評等）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;流動性、空單與參考值的資料日期與存檔（算法與完整表見&lt;a href=&quot;#wp-mkt&quot;&gt;計算底稿 市場背景&lt;/a&gt;）。&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;valuation&quot;&gt;&lt;div class=&quot;qno&quot;&gt;問題 05&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;現在的價格貴不貴？&lt;/div&gt;&lt;h2&gt;合理價值 27.55–39.07 美元，現價在區間上段&lt;/h2&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;合理價值 27.55–39.07 美元、中點 32.37 美元。&lt;/strong&gt;2026-11-16 收盤 38.26 美元 落在區間內，價格位置合理；買入上限 22.66 美元。基準情境成真時年報酬約 8.2%&lt;span class=&quot;src&quot;&gt;（基準情境成真時、以收盤 2026-11-16 股價買進的推算年報酬；條件式，非預期報酬、非買賣建議）&lt;/span&gt;，高於 10 年期公債 5.12%（條件式，非買賣建議）。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;基準故事是「先探底、再慢慢修回」：依公司指引今年營收再減約 7%、利潤率約 5.7%，明年持平，之後靠北美批發與 Pace（Nike 的成本精簡與組織重整計畫）節省，第五年利潤率回到約 10.5%、長期 11.5%，仍低於過去平均。&lt;/strong&gt;保守與樂觀分別假設回升失敗與較快恢復，權重 35%／45%／20%。&lt;/p&gt;&lt;p&gt;反方或限制：保守情境的長期資本報酬率改用 11.7% 已使中點下降約 1.1%；兩項各自單獨試算：三情境都用這個值，中點約 30.94 美元（較現行中點約 −4.4%）；或改扣約一個月營運現金，中點約 −7.2%（相對採用前中點 32.74）；任一項都會使現價高於上緣&lt;span class=&quot;src&quot;&gt;（推導，見計算底稿）&lt;/span&gt;。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;現價隱含年報酬（各情境成真時，非預期報酬）；紅色虛線為公債殖利率 5.12%。基準情境下，現價隱含的年報酬只比公債高 3.1 個百分點，模型的加權資本成本（基準）比公債高 3.6 個百分點，兩者的差距對應市價與合理價值的落差&lt;/p&gt;&lt;svg viewBox=&quot;0 0 500 182&quot; role=&quot;img&quot; aria-label=&quot;現價隱含年報酬對公債&quot; class=&quot;chart&quot;&gt;&l 議。成長性四問細表、三視角反推、長期倍數條件（算法與完整表見&lt;a href=&quot;#wp-5&quot;&gt;計算底稿 5&lt;/a&gt;）。&lt;/p&gt;&lt;div class=&quot;note-box&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;要撐住現價，營收每年需要成長多少 vs 實際成長（黑色橫線為不同折現率下的隱含營收年增範圍 -0%–7%）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 500 262&quot; role=&quot;img&quot; aria-label=&quot;市價隱含成長&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;335.7&quot; x2=&quot;335.7&quot; y1=&quot;6&quot; y2=&quot;256&quot; class=&quot;zero&quot;/&gt;&lt;text x=&quot;183&quot; y=&quot;23&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;FY24 實際成長&lt;/text&gt;&lt;rect x=&quot;335.7&quot; y=&quot;9&quot; width=&quot;4.1&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;347.8&quot; y=&quot;23&quot; class=&quot;val&quot;&gt;0.3%&lt;/text&gt;&lt;text x=&quot;183&quot; y=&quot;63&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;FY25 實際成長&lt;/text&gt;&lt;rect x=&quot;193.0&quot; y=&quot;49&quot; width=&quot;142.7&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;343.7&quot; y=&quot;63&quot; class=&quot;val&quot;&gt;-9.8%&lt;/text&gt;&lt;text x=&quot;183&quot; y=&quot;103&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;FY26 實際成長&lt;/text&gt;&lt;rect x=&quot;335.7&quot; y=&quot;89&quot; width=&quot;2.8&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;346.5&quot; y=&quot;103&quot; class=&quot;val&quot;&gt;0.2%&lt;/text&gt;&lt;text x=&quot;183&quot; y=&quot;143&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;FY23–FY26 年均&lt;/text&gt;&lt;rect x=&quot;288.7&quot; y=&quot;129&quot; width=&quot;47.0&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;343.7&quot; y=&quot;143&quot; class=&quot;val&quot;&gt;-3.2%&lt;/text&gt;&lt;text x=&quot;183&quot; y=&quot;183&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;最近三季比去年同期&lt;/text&gt;&lt;rect x=&quot;309.3&quot; y=&quot;169&quot; width=&quot;26.5&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;343.7&quot; y=&quot;183&quot; class=&quot;val&quot;&gt;-1.8%&lt;/text&gt;&lt;text x=&quot;183&quot; y=&quot;223&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot; font-weight=&amp;quot;700&amp;quot;&gt;市價隱含：未來 5 年每年&lt;/text&gt;&lt;rect x=&quot;335.7&quot; y=&quot;209&quot; width=&quot;47.9&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--neg)&quot;/&gt;&lt;line x1=&quot;332.8&quot; x2=&quot;432.3&quot; y1=&quot;218&quot; y2=&quot;218&quot; stroke=&quot;var(--ink)&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;line x1=&quot;332.8&quot; x2=&quot;332.8&quot; y1=&quot;212&quot; y2=&quot;224&quot; stroke=&quot;var(--ink)&quot;/&gt;&lt;line x1=&quot;432.3&quot; x2=&quot;432.3&quot; y1=&quot;212&quot; y2=&quot;224&quot; stroke=&quot;var(--ink)&quot;/&gt;&lt;text x=&quot;440.3&quot; y=&quot;223&quot; class=&quot;val&quot;&gt;3.3%&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:14px&quot;&gt;備註：市價要求的成長 vs Nike 實際營收成長&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;期間&lt;/th&gt;&lt;th&gt;營收成長&lt;/th&gt;&lt;th&gt;說明&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2024 財年&lt;/td&gt;&lt;td&gt;+0.3%&lt;/td&gt;&lt;td&gt;營收高點 514 億&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2025 財年&lt;/td&gt;&lt;td&gt;−9.8%&lt;/td&gt;&lt;td&gt;庫存調整、直營衰退&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2026 財年&lt;/td&gt;&lt;td&gt;+0.2%&lt;/td&gt;&lt;td&gt;北美回升、大中華區 −11%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2023–2026 財年年均&lt;/td&gt;&lt;td&gt;−3.2%&lt;/td&gt;&lt;td&gt;三年複合&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2027 財年第一季&lt;/td&gt;&lt;td&gt;−4.3%&lt;/td&gt;&lt;td&gt;大中華區 −22%、Converse −28%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2027 財年公司指引&lt;/td&gt;&lt;td&gt;高個位數衰退&lt;/td&gt;&lt;td&gt;8-K（2026-10-01）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;市價要求：未來 5 年每年&lt;/td&gt;&lt;td&gt;-0.2%（市價反推未來 5 年營收年增；市價 38.26 美元、收盤 2026-11-16；折現率 7.73%；推導）～6.7%（市價反推未來 5 年營收年增；市價 38.26 美元、收盤 2026-11-16；折現率 9.73%；推導）&lt;/td&gt;&lt;td&gt;依折現率 7.7%–9.7%（我們的利潤率路徑下；或各年營業利益率一律約 9.6%（市價反推第 1 年起每年固定的營業利益率，含穩態；市價 38.26 美元、收盤 2026-11-16；折現率 7.73%；推導）–13.0%（市價反推第 1 年起每年固定的營業利益率，含穩態；市價 38.26 美元、收盤 2026-11-16；折現率 9.73%；推導），兩者擇一）&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p&gt;要撐住現價，市場等於要求未來 5 年營收每年成長約 3.3%（換折現率高低兩端約 -0.2% 到 6.7%）。這個要求在同規模公司的歷史上屬「一般」。現價未高於合理價值上緣，下表只描述市場面，不代表有溢價。&lt;/p&gt;&lt;p class=&quot;cap&quot;&gt;三視角反推、假設對照實績、歷史基準比率與市價溢價來源（算法與完整表見&lt;a href=&quot;#wp-5&quot;&gt;計算底稿 5&lt;/a&gt;）。&lt;/p&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;作者的計算核對、方法限制與口徑說明：「市價反推：兩種解法擇一」、「股權橋與租賃口徑」、「方法限制：產業公版與倍數核對」（算法與完整表見&lt;a href=&quot;#wp-5&quot;&gt;計算底稿 5&lt;/a&gt;）。&lt;/p&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;白話說&lt;/b&gt;今天付 38.26 美元，等於押注各年營業利益率一律約 11.3%（市價反推第 1 年起每年固定的營業利益率，含穩態；市價 38.26 美元、收盤 2026-11-16；折現率 8.73%；推導）；我們的基準路徑只值 34.98 美元。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;要留意&lt;/b&gt;這是條件估值；指引再下修或利潤率回升晚於 2029 財年，合理價值會再降（見改判訊號）。&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;value&quot;&gt;&lt;div class=&quot;qno&quot;&gt;價值判斷&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;價值判斷：用彼得林奇的方法再看一次&lt;/div&gt;&lt;h2&gt;生意品質良好／價格合理（在市場常態內）：轉機股，現價已預付部分回升&lt;/h2&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;林區分類&lt;/b&gt;轉機股（Turnaround）；兼具穩定成長股（轉型前的長期特徵）&lt;br&gt;轉機股先看公司能否撐過低谷（負債與現金）、再看轉機的具體證據（哪些業務已回升）；不要用低谷時的低獲利算出的高本益比否定它，也不要在轉機證據出現前預付溢價。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;研究評等&lt;/b&gt;&lt;span style=&quot;font-size:20px;font-weight:700&quot;&gt;生意品質良好 ／ 價格合理（在市場常態內）&lt;/span&gt;&lt;br&gt;生意品質依五項證據評定；價格位置三級（買入區、合理、偏貴），依買入上限與合理價值高端判斷，同業與歷史倍數只作交叉核對。非買賣建議。&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;林區會先分類：Nike 過去是穩定成長股，現在更像轉機股，營收再衰退、扣退款後利潤率只有過去平均的一半。&lt;/strong&gt;看轉機股先看能否撐過低谷：現金充足、短期不缺錢，但每年約 24 億美元股利要靠獲利回升；轉機證據目前只有北美回升。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;林區也提醒：不要用低谷的低獲利否定轉機股，也不要在證據出現前預付太多。&lt;/strong&gt;現價落在合理價值區間上段，已預付部分回升，所以價格判為合理而非偏低。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;本益比對成長比（&lt;a class=&quot;term&quot; href=&quot;#g11&quot;&gt;PEG&lt;/a&gt;）在低谷意義有限：以扣非經常每股盈餘&lt;span class=&quot;src&quot;&gt;（推導：扣關稅退款、加回遣散費）&lt;/span&gt;計本益比 22.1 倍（扣非經常 EPS 1.73 美元；收盤 2026-11-16），申報每股盈餘（EPS）2.09 美元口徑約 18.3 倍，PEG 2.20&lt;span class=&quot;src&quot;&gt;（本益比 ÷ 成長率；成長口徑 基準情境推估（稅後營業利益年增－股數年變化） 10.1%、本益比 22.1 倍；只給比值，不作判斷，非買賣建議）&lt;/span&gt;。&lt;/strong&gt;以 2027 財年調整後每股盈餘指引 1.15–1.35 美元計，前瞻本益比約 28–33 倍&lt;span class=&quot;src&quot;&gt;（推算）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;生意品質五項中資產負債表強、自由現金流品質弱、其餘三項中，整體良好（B）。&lt;/strong&gt;4 位內部人 4 月以加權均價約 42.4 美元公開市場買進，比現價高約 11%&lt;span class=&quot;src&quot;&gt;（推算）&lt;/span&gt;，只是線索。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;grid2 wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;現金與證券 vs 有息負債（億美元），上方為淨現金&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 300&quot; role=&quot;img&quot; aria-label=&quot;資產負債&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;266.0&quot; y2=&quot;266.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;270.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;0.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;185.3&quot; y2=&quot;185.3&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;189.3&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;50.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;104.7&quot; y2=&quot;104.7&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;108.7&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;100&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&
