ss=&quot;txt&quot;&gt;&lt;tr&gt;&lt;th&gt;期間&lt;/th&gt;&lt;th&gt;每股盈餘預估&lt;/th&gt;&lt;th&gt;7 天前&lt;/th&gt;&lt;th&gt;30 天前&lt;/th&gt;&lt;th&gt;60 天前&lt;/th&gt;&lt;th&gt;90 天前&lt;/th&gt;&lt;th&gt;較 30 天前&lt;/th&gt;&lt;th&gt;近 7 天上修／下修家數&lt;/th&gt;&lt;th&gt;近 30 天上修／下修家數&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;本季&lt;/td&gt;&lt;td&gt;0.37&lt;/td&gt;&lt;td&gt;0.37&lt;/td&gt;&lt;td&gt;0.38&lt;/td&gt;&lt;td&gt;0.53&lt;/td&gt;&lt;td&gt;0.53&lt;/td&gt;&lt;td&gt;下修&lt;/td&gt;&lt;td&gt;0／2&lt;/td&gt;&lt;td&gt;0／20&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;下一季&lt;/td&gt;&lt;td&gt;0.25&lt;/td&gt;&lt;td&gt;0.25&lt;/td&gt;&lt;td&gt;0.27&lt;/td&gt;&lt;td&gt;0.44&lt;/td&gt;&lt;td&gt;0.44&lt;/td&gt;&lt;td&gt;下修&lt;/td&gt;&lt;td&gt;1／0&lt;/td&gt;&lt;td&gt;0／20&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;本財年（2027 財年，推導）&lt;/td&gt;&lt;td&gt;1.25&lt;/td&gt;&lt;td&gt;1.25&lt;/td&gt;&lt;td&gt;1.31&lt;/td&gt;&lt;td&gt;1.72&lt;/td&gt;&lt;td&gt;1.72&lt;/td&gt;&lt;td&gt;下修&lt;/td&gt;&lt;td&gt;0／3&lt;/td&gt;&lt;td&gt;0／32&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;下一財年（2028 財年，推導）&lt;/td&gt;&lt;td&gt;1.53&lt;/td&gt;&lt;td&gt;1.53&lt;/td&gt;&lt;td&gt;1.72&lt;/td&gt;&lt;td&gt;2.24&lt;/td&gt;&lt;td&gt;2.24&lt;/td&gt;&lt;td&gt;下修&lt;/td&gt;&lt;td&gt;0／5&lt;/td&gt;&lt;td&gt;0／33&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;分析師預估與券商目標價只描述，不當證據，也不是目標區間任一端；上修／下修門檻為較 30 天前變動 ±1%（本工具設定；與「市價溢價來源」預估修正以 90 天 ±2% 判持平是兩個口徑）。資料取得 2026-11-06T01:21:09（台北時間）（yfinance eps_trend、eps_revisions）。券商目標價近 90 天 21 家調整：上調 1、下調 16、持平 4；上季財報驚奇（Nasdaq）：Aug 2026，10/1/2026 公布，每股盈餘 0.48、共識 0.43、驚奇 11.63%；（yfinance）：2026-08-31，實際 0.48、預估 0.43689。兩個來源口徑可能不同（可能是調整後或一般會計準則）；公司申報的每股盈餘可對照存檔 8-K 2026-10-01 財報新聞稿（事件/8K事件.json），本工具未逐項比對，只描述，不比較、不當證據。每批另存快照自建歷史：1 筆（2026-11-06 至 2026-11-06）。&lt;/p&gt;&lt;/div&gt;&lt;!--/目標區間:附錄--&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;成長性四問（細表）&lt;/h3&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;成長性四問：過去、品質、股價要求、模型假設&lt;/h4&gt;&lt;p&gt;&lt;b&gt;一句話：&lt;/b&gt;成長穩定但在衰退；成長品質弱；股價要求的成長不高；本報告的基準假設貼近最新單季。&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt&quot;&gt;&lt;tr&gt;&lt;th&gt;面向&lt;/th&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;數字&lt;/th&gt;&lt;th&gt;判讀&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;實績&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;長期營收年複合（2015～2026）&lt;/td&gt;&lt;td&gt;+3.9%&lt;/td&gt;&lt;td rowspan=&quot;2&quot; style=&quot;text-align:left;vertical-align:top&quot;&gt;&lt;span style=&quot;color:#8a6d1f;font-weight:700&quot;&gt;● 穩定但在衰退&lt;/span&gt;&lt;br&gt;&lt;span style=&quot;font-size:12px;color:#7a7f7c&quot;&gt;近 8 季單季年增波動 4.7 個百分點，長期年複合 +3.9%，近四季 -1.2%&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;實績&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;近四季營收年增（一年前）&lt;/td&gt;&lt;td&gt;-1.2%（-7.1%）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;品質&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;新增投資的回報（增量 ROIC）&lt;/td&gt;&lt;td&gt;-439.6%&lt;/td&gt;&lt;td rowspan=&quot;3&quot; style=&quot;text-align:left;vertical-align:top&quot;&gt;&lt;span style=&quot;color:#a33a2b;font-weight:700&quot;&gt;● 弱：新增投入沒有帶來更多獲利&lt;/span&gt;&lt;br&gt;&lt;span style=&quot;font-size:12px;color:#7a7f7c&quot;&gt;增量 ROIC -439.6%&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;品質&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;存貨、應收增速減營收增速&lt;/td&gt;&lt;td&gt;-2.1%、+6.8%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;品質&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;再投資能支撐的成長&lt;/td&gt;&lt;td&gt;+2.7%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股價要求&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;現價隱含的未來 5 年營收年增&lt;/td&gt;&lt;td&gt;+3.3%（折現率高低 +6.7%～-0.2%）&lt;/td&gt;&lt;td rowspan=&quot;2&quot; style=&quot;text-align:left;vertical-align:top&quot;&gt;&lt;span style=&quot;color:#2f6b4f;font-weight:700&quot;&gt;● 不高：過去的成長就做得到&lt;/span&gt;&lt;br&gt;&lt;span style=&quot;font-size:12px;color:#7a7f7c&quot;&gt;市價要求每年 +3.3%&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股價要求&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;本益比在自身近五年的位置&lt;/td&gt;&lt;td&gt;介於最低與p25之間（申報 EPS 本益比 18.3 倍，近五年中位 29.9 倍；扣非經常本益比 22.1 倍口徑不同，口徑較貴，不能據此說相對歷史便宜）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;模型假設&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;基準情境第 1 年營收成長&lt;/td&gt;&lt;td&gt;-7.0%&lt;/td&gt;&lt;td rowspan=&quot;3&quot; style=&quot;text-align:left;vertical-align:top&quot;&gt;&lt;span style=&quot;color:#2f6b4f;font-weight:700&quot;&gt;● 貼近最新單季&lt;/span&gt;&lt;br&gt;&lt;span style=&quot;font-size:12px;color:#7a7f7c&quot;&gt;基準首年 -7.0%，同規模公司 -2.9%～+6.0%，最新單季年增 -4.3%&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;模型假設&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;同類公司次年營收成長（中間一半）&lt;/td&gt;&lt;td&gt;-2.1%～+9.1%，中位 +3.1%；同規模（n=600）-2.9%～+6.0%，中位 +1.8%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;模型假設&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;同規模公司十年實質營收年增中位&lt;/td&gt;&lt;td&gt;+1.8%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;判讀由固定規則從表內數字算出，不影響估值與研究評等：實績看近 8 季單季年增的波動（6 個百分點內為穩定、超過 12 為不穩定）與長期方向；品質看新增投入與近五年的回報是否高於資金成本（虧損或增量回報為負為弱）；股價要求看市價隱含的未來 5 年年增是否超過過去實績、是否超過同類公司次年的 p75；模型假設看基準第 1 年是否落在同類公司 p25–p75 或貼近最新單季年增；股價要求與模型假設的同類公司，用同成長組再依規模或產業細分、樣本至少 300 家的最細一組。「同類公司」是本工作流回溯 2014–2025 年約 2,000 家美股、近一年成長相近者次年的實際分布，只是參考，不是預測；存貨或應收增得比營收快不代表成長轉弱，不列入判讀。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;市價反推：兩種解法擇一&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;反過來算（兩種解法擇一，不是同時要求）：在我們的利潤率路徑下，未來五年營收每年要成長 3.3%&lt;span class=&quot;src&quot;&gt;（市價反推未來 5 年營收年增；市價 38.26 美元、收盤 2026-11-16；折現率 8.73%；推導）&lt;/span&gt;&lt;span class=&quot;src&quot;&gt;（折現率 7.7%–9.7% 時 -0.2%（市價反推未來 5 年營收年增；市價 38.26 美元、收盤 2026-11-16；折現率 7.73%；推導） 到 6.7%（市價反推未來 5 年營收年增；市價 38.26 美元、收盤 2026-11-16；折現率 9.73%；推導））&lt;/span&gt;，我們的基準約 1.0%；或在我們的營收路徑下，營業利益率各年一律約 11.3%&lt;span class=&quot;src&quot;&gt;（市價反推第 1 年起每年固定的營業利益率，含穩態；市價 38.26 美元、收盤 2026-11-16；折現率 8.73%；推導）&lt;/span&gt;，我們長期 11.5%。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;差距主要在回升速度而非終點：市價隱含的長期利潤率與我們相近，但要求營收比指引更快恢復。&lt;/strong&gt;市價隱含折現率約 8.2%，比資本成本 8.73% 低約 0.5 個百分點；這是市價隱含折現率，不是預期報酬。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;股權橋與租賃口徑&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;約 32 億美元營運租賃負債未從股權價值扣除，因預測營業利益已扣租金；同業企業價值（EV）倍數也用不含營業租賃的口徑，兩邊一致。&lt;/strong&gt;未把租金加回後資本化，避免重複扣減，不代表租賃沒有負擔。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;方法限制：產業公版與倍數核對&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;本次用「品牌消費與硬體」產業公版：品牌商品子型只有 Nike 一家，標為首家產業、公版待驗證。&lt;/strong&gt;同業與歷史倍數只作交叉核對（約 25–40 美元），2026-11-11 起不進價格位置與研究評等。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;公版列 EV/營收的兩個條件本次不符合（同業營業利益率高低差超過 3 倍、Under Armour 近四季營業虧損），交叉核對仍含 EV/營收；因不進評等，對價格位置沒有影響。&lt;/strong&gt;VF 本益比用資料商數值，我們的 SEC 每股盈餘核對未含其最新兩份 10-Q，未對上、未重做。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;估值方法與參數&lt;/h3&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;方法&lt;/th&gt;&lt;th&gt;低&lt;/th&gt;&lt;th&gt;中&lt;/th&gt;&lt;th&gt;高&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;DCF 保守&lt;/td&gt;&lt;td&gt;17&lt;/td&gt;&lt;td&gt;19&lt;/td&gt;&lt;td&gt;23&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;DCF 基準&lt;/td&gt;&lt;td&gt;30&lt;/td&gt;&lt;td&gt;35&lt;/td&gt;&lt;td&gt;42&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;DCF 樂觀&lt;/td&gt;&lt;td&gt;42&lt;/td&gt;&lt;td&gt;49&lt;/td&gt;&lt;td&gt;60&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;歷史本益比&lt;/td&gt;&lt;td&gt;41&lt;/td&gt;&lt;td&gt;52&lt;/td&gt;&lt;td&gt;58&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;同業本益比&lt;/td&gt;&lt;td&gt;18&lt;/td&gt;&lt;td&gt;27&lt;/td&gt;&lt;td&gt;35&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;同業企業價值／營業利益&lt;/td&gt;&lt;td&gt;13&lt;/td&gt;&lt;td&gt;15&lt;/td&gt;&lt;td&gt;25&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;同業企業價值／營收&lt;/td&gt;&lt;td&gt;32&lt;/td&gt;&lt;td&gt;36&lt;/td&gt;&lt;td&gt;45&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p style=&quot;font-size:14px&quot;&gt;折現率基準 8.7%（區間 7.7%–9.7%）：無風險利率 5.12%、市場風險溢價 4.20%、beta 1.03。DCF 為 12 年：前 5 年依情境，後 7 年成長與利潤率逐步回到永續水準。&lt;/p&gt;&lt;p style=&quot;font-size:14px&quot;&gt;同業：DECK（運動與休閒鞋品牌 HOKA、UGG，直營與批發並行）, ONON（高端跑鞋品牌，成長快、倍數高；EV 倍數不列（G：2026-11-16 快照企業價值 199.3 億高於市值 109.6 億，與 11-05 快照 EV 低於市值、公司淨現金不符，疑資料商 EV 口徑錯誤））, LULU（運動服飾品牌，直營為主；近期倍數被壓低）, VFC（服飾鞋類品牌集團，旗下有 Vans、The North Face，同樣處於轉型）, UAA（運動服飾與鞋，轉型中且虧損）。排除：ADDYY：F：愛迪達在美國只有場外交易 ADR，資料不完整。&lt;/p&gt;&lt;p style=&quot;font-size:14px&quot;&gt;產業公版：穩定現金流／品牌消費與硬體／品牌商品；驗證狀態：待驗證（兩家，分屬兩個子型）；本公司是第 1 家實例。首家產業，公版的估值法與指標選擇尚未經兩家以上驗證，審查與讀者請多看適用性。&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;details id=&quot;wp-value&quot;&gt;&lt;summary&gt;價值判斷：PEG、林區資產負債表檢查與交叉檢查&lt;/summary&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;PEG 與林區檢查&lt;/h3&gt;&lt;div class=&quot;wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;PEG：可計算的成長口徑（紅線為 1 與 2）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 500 62&quot; role=&quot;img&quot; aria-label=&quot;PEG&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;168.0&quot; x2=&quot;168.0&quot; y1=&quot;6&quot; y2=&quot;56&quot; class=&quot;zero&quot;/&gt;&lt;line x1=&quot;281.3&quot; x2=&quot;281.3&quot; y1=&quot;4&quot; y2=&quot;58&quot; class=&quot;price&quot;/&gt;&lt;line x1=&quot;394.6&quot; x2=&quot;394.6&quot; y1=&quot;4&quot; y2=&quot;58&quot; class=&quot;price&quot;/&gt;&lt;text x=&quot;158&quot; y=&quot;23&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;基準情境推估&lt;/text&gt;&lt;rect x=&quot;168.0&quot; y=&quot;9&quot; width=&quot;249.1&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;425.1&quot; y=&quot;23&quot; class=&quot;val&quot;&gt;2.2&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;PEG 與林區加股利比率（可計算的成長口徑）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;成長口徑&lt;/th&gt;&lt;th&gt;成長率&lt;/th&gt;&lt;th&gt;PEG&lt;/th&gt;&lt;th&gt;判讀&lt;/th&gt;&lt;th&gt;加股利比率&lt;/th&gt;&lt;th&gt;判讀&lt;/th&gt;&lt;th&gt;加股東收益率比率（現代延伸）&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準情境推估（稅後營業利益年增－股數年變化）&lt;/td&gt;&lt;td&gt;10.1%&lt;/td&gt;&lt;td&gt;2.2&lt;/td&gt;&lt;td&gt;偏貴&lt;/td&gt;&lt;td&gt;0.65&lt;/td&gt;&lt;td&gt;差&lt;/td&gt;&lt;td&gt;0.59&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;加股東收益率比率＝（成長率＋股利殖利率＋淨回購殖利率）÷本益比，把回購也算進股東回饋、並扣掉發給員工的股票；這是現代延伸，不是林區原版，也沒有政策門檻，只列數字。 PEG 用的每股盈餘 1.73 美元：PEG 所用 EPS 為一般會計 EPS 扣非經常項目，含股權薪酬（近四季淨利每股 2.09、每股股權薪酬 0.46）。&lt;/p&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:4px&quot;&gt;PEG 的判讀標籤依估值政策門檻；高風險、成長極高或極低的公司，PEG 有系統性偏誤（同樣成長下風險越高 PEG 越低），不能只憑標籤判斷便宜或昂貴。&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;林區式資產負債表與市場檢查&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;數值&lt;/th&gt;&lt;th&gt;林區的看法&lt;/th&gt;&lt;th&gt;判讀&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;本益比&lt;/td&gt;&lt;td&gt;22.12&lt;/td&gt;&lt;td&gt;與自身歷史比較&lt;/td&gt;&lt;td&gt;資料限制：歷史第 4% 百分位是用申報 EPS（18.3 倍）算的，扣非經常 EPS 為 22.1 倍、口徑較貴，不能據此說相對歷史便宜&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;每股淨現金&lt;/td&gt;&lt;td&gt;0.32&lt;/td&gt;&lt;td&gt;淨現金可提供下檔保護（林區 O31、LAK02）&lt;/td&gt;&lt;td&gt;好：有淨現金，可提供下檔保護；占股價 0.8%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;負債對權益&lt;/td&gt;&lt;td&gt;0.52&lt;/td&gt;&lt;td&gt;一般越低越好（林區 L25）&lt;/td&gt;&lt;td&gt;不評好壞：有息負債約為股東權益的 0.52 倍；沒有公認門檻，償債能力見收現段償債指標&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;每股自由現金流（近四季）&lt;/td&gt;&lt;td&gt;1.42&lt;/td&gt;&lt;td&gt;比每股盈餘更接近現金（林區 O37、修正10）&lt;/td&gt;&lt;td&gt;不評好壞：自由現金流殖利率 3.7%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股數年變化（近三財年）&lt;/td&gt;&lt;td&gt;-1.9%&lt;/td&gt;&lt;td&gt;持續買回、且價格合理、資金來自本業現金時才是好訊號（林區 L16、O19）&lt;/td&gt;&lt;td&gt;好：近三財年平均每年 -1.9%；最近一季對去年同季 +0.4%（2025-08-31→2026-08-31）：近期轉為增加，PEG 推估改用近期變化&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;存貨增速 vs 營收增速&lt;/td&gt;&lt;td&gt;-3%&lt;/td&gt;&lt;td&gt;存貨增速高於營收是警訊（林區 O50）&lt;/td&gt;&lt;td&gt;好：存貨 -3%（2025-08-31→2026-08-31）vs 營收 -1%（近四季對前四季，各截至 2026-08-31、2025-08-31）：正常&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;內部人公開市場買進&lt;/td&gt;&lt;td&gt;4&lt;/td&gt;&lt;td&gt;內部人自掏腰包買進是強訊號&lt;/td&gt;&lt;td&gt;好：近期有 4 人自掏腰包買進，依林區屬強訊號&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;林區以外的交叉檢查（只揭露，不改研究評等與價格位置）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;檢查&lt;/th&gt;&lt;th&gt;結果&lt;/th&gt;&lt;th&gt;判讀&lt;/th&gt;&lt;th&gt;依據與限制&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Piotroski F 分數（財報是否在改善）&lt;/td&gt;&lt;td&gt;6 ／ 8 項（2025-05-31→2026-05-31）&lt;/td&gt;&lt;td&gt;中&lt;/td&gt;&lt;td&gt;未通過：營運現金流＞淨利（應計少）、流動比率比上年高。Piotroski（2000）研究文獻/Piotroski2000_財報訊號.json 第 9–11、15 頁；8–9 分高分組、0–2 分低分組&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Beneish M 分數（盈餘被美化的機率）&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;待核對&lt;/td&gt;&lt;td&gt;Beneish（1999）原文未存檔，係數與分界未核對；折舊用折舊攤銷合計（近似）。待使用者同意下載原文存檔後才列入報告&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Greenblatt 盈餘殖利率與資本報酬率&lt;/td&gt;&lt;td&gt;盈餘殖利率 6.7%；ROIC 21%&lt;/td&gt;&lt;td&gt;高於 10 年公債 5.1%；ROIC 21% 高於 WACC 8.7%&lt;/td&gt;&lt;td&gt;盈餘殖利率＝近四季營業利益 ÷（市值＋有息負債－現金與證券），推導；ROIC 為本專案稅後口徑，非 Greenblatt 原式稅前；不做排名&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;details id=&quot;wp-6&quot;&gt;&lt;summary&gt;6 財務：償債指標、融資活動、存活檢查與利率壓力測試（含判定規則與限制）&lt;/summary&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;融資活動與償債：錢還給誰、有沒有借錢、還不還得起&lt;/h3&gt;&lt;p class=&quot;cap&quot;&gt;利息保障改讀信用與存活的利息口徑（EBIT ÷ 實付利息（us-gaap:InterestPaidNet，財年截至 2026-05-31，10-K 2026-05-31，申報 2026-07-15；實付口徑，最近完整財年、不是近四季）），底稿的利息費用科目未對應。&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;償債能力指標（利息保障依 Damodaran 合成評等對照；其他沒有公認門檻，只寫事實）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;指標&lt;/th&gt;&lt;th&gt;數值&lt;/th&gt;&lt;th&gt;判讀&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;EBIT ÷ 利息費用&lt;/td&gt;&lt;td&gt;11.63&lt;/td&gt;&lt;td&gt;相當於 AAA 級：EBIT 是利息費用的 11.6 倍；依 Damodaran 合成評等大型公司對照表（2026 年 1 月；市值 567.4 億美元，在 50 億美元以上）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;（營運現金流＋實付利息）÷ 實付利息&lt;/td&gt;&lt;td&gt;未取得&lt;/td&gt;&lt;td&gt;資料限制：用實際現金算的付息能力無法計算（實付利息部分缺漏：季報缺本期或去年同期欄）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;有息負債 ÷ EBITDA&lt;/td&gt;&lt;td&gt;1.75&lt;/td&gt;&lt;td&gt;不評好壞：以近四季 EBITDA 45.1 億美元計，約 1.8 年可還清有息負債&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;淨負債 ÷ EBITDA&lt;/td&gt;&lt;td&gt;-0.11&lt;/td&gt;&lt;td&gt;不評好壞：現金多於有息負債（淨現金）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;營運現金流 ÷ 有息負債&lt;/td&gt;&lt;td&gt;35.2%&lt;/td&gt;&lt;td&gt;不評好壞：一年的營運現金流約可還掉 35% 的有息負債（約 2.8 年還清）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;現金與證券 ÷ 一年內到期債務&lt;/td&gt;&lt;td&gt;4.18&lt;/td&gt;&lt;td&gt;不評好壞：現金與證券是一年內到期債務的 4.2 倍（已核對：10-Q 2026-08-31 Part I, Item 1 ¶11 資產負債表只有「一年內到期長期債 2,000」，沒有應付票據、短期借款或商業本票列（Item 2 ¶178 商業本票計畫期末無借款）；2,000 對應 10-K Note 6 的 2026-11-01（1,000，2.38%）與 2027-03-27（1,000，2.75%）兩筆公司債。工具「部分缺漏」註記是因缺短期借款科目，原表核對後為沒有此項。）&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;利息費用：損益表只列「利息（收益）費用，淨額」（2026 年 8 月 31 日止第一季為 -14，即淨收益），總利息費用未揭露，利息保障倍數與利率壓力測試因此未取得（不補值、不用票面利率推算冒充）。；實付利息：10-K 2026-05-31 現金流量表補充揭露 FY2026 付息 323（扣資本化利息）；10-Q 2026-08-31 補充揭露只列非現金購置與已宣告未付股利，沒有付息列，近四季實付利息無法由申報組出，列為未取得。；淨利息為收益的原因：投資組合利息收入 FY2026 278、第一季 71（10-K Note 4 ¶170；10-Q Note 3 ¶45），現金部位大於債務成本。&lt;/p&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;可用授信與到期（作者判讀，融資償債判讀.json）：有 30 億美元未動用的承諾授信（364 天 10 億至 2027-03-05、五年期 20 億至 2030-03-07）與 30 億美元商業本票計畫（未發行）；公司債面額合計 80 億美元，一年內到期 20 億（2026-11-01、2027-03-27 各 10 億），帳上現金與短期投資 83.7 億&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;融資活動現金流：還給股東與借還款（本財年第一季，截至 2026-08-31，10-Q 2026-08-31）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;對象｜分類&lt;/th&gt;&lt;th&gt;金額&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股東｜股利&lt;/td&gt;&lt;td&gt;-610.0 百萬美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股東｜增資與員工認股&lt;/td&gt;&lt;td&gt;0&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股東｜回購&lt;/td&gt;&lt;td&gt;0&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股東小計&lt;/td&gt;&lt;td&gt;-610.0 百萬美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;其他｜其他（未歸類）&lt;/td&gt;&lt;td&gt;-8.0 百萬美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;其他小計&lt;/td&gt;&lt;td&gt;-8.0 百萬美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;對照：同期營運現金流&lt;/td&gt;&lt;td&gt;135.0 百萬美元&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;融資活動是公司與出資人（股東、債權人）之間的現金往來，不等於借款：回購、股利是還給股東，借入、償還才是借款；負數＝現金流出。本表期間與下方借款用途、上方現金流分層（近四季）不同。&lt;/p&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;借款用途（研究判讀）：近四季沒有新借款，也沒有償還債務；商業本票與承諾授信都未動用。股利 24.26 億美元與資本支出由營運現金與帳上現金支應，回購只有 0.20 億。公司表示未來回購的資金預期來自營運現金流；期間 近四季至 2026-08-31（FY2026 Q2～FY2027 Q1）；依據：10-Q 2026-08-31 Part I, Item 1 ¶16（現金流量表：第一季融資活動只有股利 −610、其他 −8，沒有借款或償債列）、10-K 2026-05-31 Item 7 ¶209（FY2026 融資活動主要是股利；FY2025 含償還 10 億美元公司債）、10-Q 2026-08-31 Part I, Item 2 ¶177–178（承諾授信與 30 億美元商業本票計畫期末都沒有動用）、10-Q 2026-08-31 Part I, Item 2 ¶173（回購在 FY2026 第一季期間暫停（該季仍回購 126），之後沒有計畫內回購；預期未來回購資金來自營運現金流）&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;survival-detail&quot;&gt;&lt;h3&gt;存活檢查：現金對債務（12～24 個月，推導，非違約預測）&lt;/h3&gt;&lt;p style=&quot;margin:0 0 6px&quot;&gt;&lt;b&gt;信用評級&lt;/b&gt;　機構 Moody&amp;#x27;s A2、S&amp;amp;P A+（10-Q 2026-08-31 Part I, Item 2 ¶175）／推導 AAA（Damodaran 合成評等，利息保障 11.6 倍，推導）｜投資等級（BBB-／Baa3 以上）；推導比機構高 5 級（推導只看利息保障，不含規模、產業與擔保結構，僅供對照）&lt;/p&gt;&lt;p style=&quot;margin:0 0 6px&quot;&gt;&lt;b&gt;存活檢查（完整理由）&lt;/b&gt;　無明顯警訊（推導，非違約預測）：現金加未動用信貸 114 億美元，一年內到期債務 20 億美元（另利息 323.0 百萬美元），可付 4.9 倍；現金加未動用信貸 114 億美元，兩年內到期債務 20 億美元（另利息 646.0 百萬美元），可付 4.3 倍；利息保障 11.6 倍；會計師未提出繼續經營疑慮。&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;燈號：無明顯警訊（一般公司：現金對債務；資料截至 2026-08-31，收盤日 2026-11-16）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;判定&lt;/th&gt;&lt;th&gt;內容與出處&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;會計師繼續經營疑慮&lt;/td&gt;&lt;td&gt;無明顯警訊&lt;/td&gt;&lt;td&gt;會計師與管理層未提出繼續經營疑慮（掃描 10-Q 2026-08-31、10-K 2026-05-31）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;流動性：12 個月&lt;/td&gt;&lt;td&gt;無明顯警訊&lt;/td&gt;&lt;td&gt;現金加未動用信貸 11,368.0，一年內到期本金 2,000.0，加利息 323.0，可付 4.9 倍&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;流動性：24 個月&lt;/td&gt;&lt;td&gt;無明顯警訊&lt;/td&gt;&lt;td&gt;現金加未動用信貸 11,368.0，兩年內到期本金 2,000.0，加利息 646.0，可付 4.3 倍&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;利息保障&lt;/td&gt;&lt;td&gt;無明顯警訊&lt;/td&gt;&lt;td&gt;利息保障 11.6 倍&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;回饋股東對自由現金流&lt;/td&gt;&lt;td&gt;提示&lt;/td&gt;&lt;td&gt;近四季回購加股利 24 億美元，超過自由現金流 21 億美元，差額 341.0 百萬美元要靠現金或借款&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;信用評級（機構）&lt;/td&gt;&lt;td&gt;投資等級&lt;/td&gt;&lt;td&gt;Moody&amp;#x27;s A2（10-Q 2026-08-31 Part I, Item 2 ¶175）；S&amp;amp;P A+（10-Q 2026-08-31 Part I, Item 2 ¶175）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;信用評級（推導）&lt;/td&gt;&lt;td&gt;投資等級&lt;/td&gt;&lt;td&gt;AAA：Damodaran 合成評等 2026 年 1 月（大型公司表），利息保障 11.6 倍（EBIT ÷ 實付利息（us-gaap:InterestPaidNet，財年截至 2026-05-31，10-K 2026-05-31（申報 2026-07-15）；實付口徑，最近完整財年、不是近四季））&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;機構與推導比對&lt;/td&gt;&lt;td&gt;提示&lt;/td&gt;&lt;td&gt;推導比機構高 5 級（推導只看利息保障，不含規模、產業與擔保結構，僅供對照）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;債券市場參考&lt;/td&gt;&lt;td&gt;信用評級 A&lt;/td&gt;&lt;td&gt;ICE BofA 公司債選擇權調整利差：投資等級整體 0.89 個百分點（2026-11-13，FRED BAMLC0A0CM）；BBB 級 1.11 個百分點（2026-11-13，FRED BAMLC0A4CBBB）；投機等級整體 3.23 個百分點（2026-11-13，FRED BAMLH0A0HYM2）；A 級 0.73 個百分點（2026-11-13，FRED BAMLC0A3CA）；個別債券殖利率與價格未取得（TRACE／FINRA 不在固定來源）&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;作者自債務附註填的近期到期明細（信用揭露.json 近期到期；只到月份時取該月 1 日），一年內至少等於資產負債表一年內到期債務；利息口徑：實付利息（us-gaap:InterestPaidNet，財年截至 2026-05-31，10-K 2026-05-31（申報 2026-07-15）；實付口徑，最近完整財年、不是近四季）；未動用信貸：10-Q 2026-08-31 Part I, Item 2 ¶177；10-K 2026-05-31 Item 8 ¶181、¶182（兩筆承諾額度：364 天 10 億（2027-03-05 到期，可再延 364 天）＋五年期 20 億（2030-03-07 到期）＝30 億；10-Q 寫承諾額度與年報相同、全部未動用。另有銀行保證與信用狀約 13 億（10-K Note 16 ¶348，主要為不動產用途），公司未說明占用承諾額度，這裡不扣。另有 30 億商業本票計畫，未動用，不計入。）&lt;/p&gt;&lt;h3 style=&quot;margin-top:14px&quot;&gt;利率壓力測試（固定情境：利率上升 1、2 個百分點與下降 1 個百分點，不預測聯準會；推導）&lt;/h3&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;單位百萬美元；狀態：已試算&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;浮動利率債利息變動&lt;/th&gt;&lt;th&gt;再融資利息變動&lt;/th&gt;&lt;th&gt;壓力後一年利息&lt;/th&gt;&lt;th&gt;利息保障&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;目前利率（只算再融資）&lt;/td&gt;&lt;td&gt;0.0&lt;/td&gt;&lt;td&gt;66.3&lt;/td&gt;&lt;td&gt;389.3&lt;/td&gt;&lt;td&gt;9.7 倍&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;+1 個百分點&lt;/td&gt;&lt;td&gt;24.0&lt;/td&gt;&lt;td&gt;86.3&lt;/td&gt;&lt;td&gt;433.3&lt;/td&gt;&lt;td&gt;8.7 倍&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;+2 個百分點&lt;/td&gt;&lt;td&gt;48.0&lt;/td&gt;&lt;td&gt;106.3&lt;/td&gt;&lt;td&gt;477.3&lt;/td&gt;&lt;td&gt;7.9 倍&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;−1 個百分點&lt;/td&gt;&lt;td&gt;-24.0&lt;/td&gt;&lt;td&gt;46.3&lt;/td&gt;&lt;td&gt;345.3&lt;/td&gt;&lt;td&gt;10.9 倍&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;目前利率：聯邦基金利率 3.88%（2026-11-13，FRED DFF）、SOFR 3.93%（2026-11-16，FRED SOFR）、十年期公債 5.15%（2026-11-13，FRED DGS10）；估值折現率用的 10 年期公債是 5.12%（2026-11-16，美國財政部），來源與日期不同；浮動利率債 2,400.0，占總債務 30%（10-Q 2026-08-31 Part I, Item 1 ¶80；Part I, Item 3 ¶2；10-K 2026-05-31 Item 7A ¶15、Item 8 ¶190；債務本身全為固定利率票面債，本金 80 億，加權 3.1%，10-K Item 8 債務表；其中名目 24 億用利率交換，收固定、付 SOFR 加固定利差，換成浮動，浮動曝險以 24 億計。10-Q 2026-08-31 Note 7 ¶80 確認交換名目仍為 24 億，與 2026-05-31 相同；10-Q Item 3 ¶2 寫 Item 7A 資訊與年報相比無重大變動。未計現金部位的利息收入對沖，近四季淨利息為收益。Item 7A 沒有寫每 100bp 利息變動。）；兩年內到期須再融資本金 2,000.0，原票面 2.56%（作者填票面利率（信用揭露.json 近期到期）），再融資利率 5.88%（10 年期公債 5.15%（2026-11-13）＋ A 級 OAS 0.73 個百分點（機構最低評級），推導）；利息保障基準：利息保障（EBIT÷一年利息），目前 11.6 倍；利率上升 2 個百分點（+200bp，bp＝基點，100bp＝1 個百分點）後低於 1.5 倍才在燈號理由加一條（不改燈號、不改研究評等）；通膨、物價、消費者等間接影響不在此表&lt;/p&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;&lt;a href=&quot;#survival-rules&quot;&gt;判定規則與限制見本節下方&lt;/a&gt;（寫死在程式，不改研究評等）。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;survival-rules&quot;&gt;&lt;h3&gt;存活檢查與利率壓力測試：判定規則與限制&lt;/h3&gt;&lt;p class=&quot;cap&quot;&gt;規則版本：v1.1（2026-11-03 第二輪：加 KBRA、利率壓力測試、首頁精簡；仍只顯示提示、不改研究評等）&lt;/p&gt;&lt;ul class=&quot;cap&quot;&gt;&lt;li&gt;總燈號：各項取最嚴重：任一高風險→高風險；否則任一需留意→需留意；12 個月流動性或繼續經營無法判定→資料不足；其餘→無明顯警訊。Z 分數與推導評級只列理由、不改燈號。&lt;/li&gt;&lt;li&gt;繼續經營：最新年報或其後季報出現會計師或管理層「substantial doubt … going concern」肯定句 → 高風險（否定句、假設句只列出不計）；只出現在前一份年報 → 需留意&lt;/li&gt;&lt;li&gt;流動性_12個月：現金與證券＋未動用信貸 ≥ 一年內到期本金＋一年利息 → 無明顯警訊；不足但加近四季自由現金流（已扣實付利息）後 ≥ 一年內到期本金 → 需留意；仍不足 → 高風險&lt;/li&gt;&lt;li&gt;流動性_24個月：同上改兩年（本金、利息、自由現金流各計兩年）；不足但加兩年自由現金流 ≥ 本金的 50% → 需留意；更低 → 高風險&lt;/li&gt;&lt;li&gt;燒錢：近四季自由現金流為負：現金還能燒幾個月＝（現金與證券＋未動用信貸－一年內到期本金）÷ 每月燒錢；&amp;lt;12 個月 高風險、12～24 個月 需留意&lt;/li&gt;&lt;li&gt;利息保障：EBIT ÷ 利息費用 &amp;lt; 1.5 倍 → 需留意&lt;/li&gt;&lt;li&gt;契約：作者自 信用揭露.json 填公司揭露的契約門檻與實際值：已違反 → 高風險；餘裕 &amp;lt; 15% → 需留意；未揭露不判&lt;/li&gt;&lt;li&gt;信用評級：機構評級（S&amp;amp;P、Moody&amp;#x27;s、Fitch、KBRA，取各機構最新、以最低者判等級）低於 BBB-／Baa3 → 需留意；只有推導評級為投機等級 → 只列理由&lt;/li&gt;&lt;li&gt;利率壓力測試：固定情境 +100bp／+200bp／-100bp（不預測聯準會）：利息增加＝浮動利率債×利率變動（作者填 Item 7A 每 100bp 利息變動時改用該值）＋兩年內到期本金×（再融資利率＋利率變動－原票面利率）；再融資利率＝收盤日 10 年期公債殖利率＋該評級 ICE BofA OAS（推導）；壓力後利息保障＝EBIT÷（一年利息＋利息增加），EBIT 分母異常時改用現金利息保障。+200bp 後低於 1.5 倍 → 理由加一條、首頁也加（只列理由、不改燈號）；浮動利率債未揭露或未填 → 該情境未取得；金融業不套&lt;/li&gt;&lt;li&gt;金融業：銀行券商、保險不套現金對債務：研究評等輸入 監理紅線 低於門檻 → 高風險；高於門檻不到 20%（相對）→ 需留意；未填 → 資料不足&lt;/li&gt;&lt;/ul&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;使用限制&lt;/p&gt;&lt;ul class=&quot;cap&quot;&gt;&lt;li&gt;推導，非違約預測：燈號只看 12～24 個月付不付得出錢與已揭露的警訊，不是違約機率，也不改研究評等（第一版）。&lt;/li&gt;&lt;li&gt;Altman Z 分數會誤判兩類公司：權益為負（如舉債回購）與保留盈餘因長期回購或股利變負，所以只當輔助、不單獨下結論、不改燈號。&lt;/li&gt;&lt;li&gt;金融業（銀行券商、保險）的存款與保單負債是營業資金，改看監理資本（如 CET1），不套現金對債務。&lt;/li&gt;&lt;li&gt;超過 2～3 年的到期與再融資風險留在正文債務到期表，不進燈號。&lt;/li&gt;&lt;li&gt;到期年度桶以到期表資料日（年報）起算：桶的結束日落在窗口內才計入；跨窗口的桶另列，若作者在 信用揭露.json 填了近期到期明細就改用明細。&lt;/li&gt;&lt;li&gt;個別債券價格與殖利率（TRACE／FINRA）不在固定來源：未取得；市場參考只用 FRED 的 ICE BofA 各評級公司債利差（大盤層級）。&lt;/li&gt;&lt;li&gt;機構評級只認公司自己在 SEC 申報寫出的 S&amp;amp;P、Moody&amp;#x27;s、Fitch、KBRA 評級並附原句；沒揭露寫未揭露，不從新聞或記憶補。&lt;/li&gt;&lt;li&gt;利率壓力測試只用固定情境（+100bp、+200bp、−100bp），不預測聯準會；以 10 年期公債估再融資成本，實際年期與擔保結構不同會有誤差；浮動利率債若也在兩年內到期會重複計算（偏保守）；通膨、物價、消費者等間接影響不進燈號；金融業不套，維持看資本適足率。&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/details&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;more&quot; data-layer=&quot;附錄&quot;&gt;&lt;div class=&quot;qno&quot;&gt;附錄&lt;/div&gt;&lt;h2&gt;附錄：估值細節、論點檢查、名詞、表格與資料來源（預設摺疊）&lt;/h2&gt;&lt;details id=&quot;valdetail&quot;&gt;&lt;summary&gt;估值細節：利率、同業與產業對照、券商目標價&lt;/summary&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;券商目標價&lt;/h3&gt;&lt;figure class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;券商目標價範圍對照本報告合理價值與收盤價（美元；yfinance，取得 2026-11-06；第三方看法，只揭露，不是本報告目標價、不進評等）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 150&quot; role=&quot;img&quot; aria-label=&quot;券商目標價&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;230.0&quot; x2=&quot;230.0&quot; y1=&quot;8&quot; y2=&quot;128&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;230.0&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;0&lt;/text&gt;&lt;line x1=&quot;295.0&quot; x2=&quot;295.0&quot; y1=&quot;8&quot; y2=&quot;128&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;295.0&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;20&lt;/text&gt;&lt;line x1=&quot;360.0&quot; x2=&quot;360.0&quot; y1=&quot;8&quot; y2=&quot;128&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;360.0&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;40&lt;/text&gt;&lt;line x1=&quot;425.0&quot; x2=&quot;425.0&quot; y1=&quot;8&quot; y2=&quot;128&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;425.0&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;60&lt;/text&gt;&lt;line x1=&quot;490.0&quot; x2=&quot;490.0&quot; y1=&quot;8&quot; y2=&quot;128&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;490.0&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;80&lt;/text&gt;&lt;text x=&quot;220&quot; y=&quot;27&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;券商目標價（最低–最高，點＝平均）&lt;/text&gt;&lt;line x1=&quot;291.8&quot; x2=&quot;425.0&quot; y1=&quot;22&quot; y2=&quot;22&quot; stroke=&quot;var(--c6)&quot; stroke-width=&quot;3&quot; opacity=&quot;.55&quot;/&gt;&lt;circle cx=&quot;348.4&quot; cy=&quot;22&quot; r=&quot;7&quot; fill=&quot;var(--c6)&quot;&gt;&lt;title&gt;券商目標價（最低–最高，點＝平均）：36&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;437.0&quot; y=&quot;27&quot; class=&quot;val&quot;&gt;36&lt;/text&gt;&lt;text x=&quot;220&quot; y=&quot;67&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;本報告合理價值（只含折現率）&lt;/text&gt;&lt;line x1=&quot;319.5&quot; x2=&quot;357.0&quot; y1=&quot;62&quot; y2=&quot;62&quot; stroke=&quot;var(--c1)&quot; stroke-width=&quot;3&quot; opacity=&quot;.55&quot;/&gt;&lt;circle cx=&quot;335.2&quot; cy=&quot;62&quot; r=&quot;7&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;本報告合理價值（只含折現率）：32&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;369.0&quot; y=&quot;67&quot; class=&quot;val&quot;&gt;32&lt;/text&gt;&lt;text x=&quot;220&quot; y=&quot;107&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;收盤價&lt;/text&gt;&lt;circle cx=&quot;354.3&quot; cy=&quot;102&quot; r=&quot;7&quot; fill=&quot;var(--ink)&quot;&gt;&lt;title&gt;收盤價：38&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;366.3&quot; y=&quot;107&quot; class=&quot;val&quot;&gt;38&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;市場怎麼看：券商目標價與它隱含的成長&lt;/h4&gt;&lt;p&gt;37 家券商的平均目標價 36.45 美元（中位 34.00，最低 19.00、最高 60.00）；比 2026-11-16 收盤價 38.26 低約 5%；換成本模型的語言，平均目標價要求未來 5 年營收每年成長約 1%，不高於同規模公司次年成長的 p75（+6.0%）；分析師自己預估明年每股盈餘成長 +22.1%（今年預估 1.25 美元、明年 1.53 美元；本報告申報與扣非經常 EPS 差距超過容忍度，今年預估若含已申報的非經常利益，成長率會被高基期壓低；本報告扣非經常 EPS 為 1.73 美元）；近 90 天有 21 家調整目標價：上調 1、下調 16、持平 4。&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;券商目標價與隱含成長（yfinance，取得 2026-11-06）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;目標價（美元）&lt;/th&gt;&lt;th&gt;折回今天（推導）&lt;/th&gt;&lt;th&gt;隱含未來 5 年營收年增&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;平均目標價&lt;/td&gt;&lt;td&gt;36.45&lt;/td&gt;&lt;td&gt;33.27&lt;/td&gt;&lt;td&gt;+1.3%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;中位目標價&lt;/td&gt;&lt;td&gt;34.00&lt;/td&gt;&lt;td&gt;31.03&lt;/td&gt;&lt;td&gt;-0.1%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;最低目標價&lt;/td&gt;&lt;td&gt;19.00&lt;/td&gt;&lt;td&gt;17.34&lt;/td&gt;&lt;td&gt;-9.7%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;最高目標價&lt;/td&gt;&lt;td&gt;60.00&lt;/td&gt;&lt;td&gt;54.76&lt;/td&gt;&lt;td&gt;+11.1%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;Nasdaq 共識目標價 36.52（最低 19.00、最高 62.00；買進 9、持有 16、賣出 9）。券商目標價是第三方對 12 個月後股價的看法，多用「預估盈餘 × 主觀本益比」，通常偏樂觀；本區只揭露，不是本報告的目標價、不當證據、不影響估值與研究評等。「折回今天」以股權成本折現（未加回期間股利），「隱含成長」以本報告基準情境的其他假設反推，是用本模型理解他們的價格，不是券商自己的假設（推導）。資料取得時間與本報告收盤日不同。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;利率的影響：公債殖利率變動與股債利差&lt;/h3&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;Nike 的價值約 55% 來自明確預測期之後（基準終值占比），對利率敏感：10 年期公債殖利率下降 1 個百分點，合理價值中點從約 32 美元升到約 38 美元（+18%）；上升 1 個百分點則降到約 28 美元（−13%）。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;股債利差：以申報每股盈餘 2.09 美元計，盈餘殖利率約 5.5%，比 10 年期公債 5.12% 高約 0.3 個百分點；申報盈餘含關稅退款，改用 1.73 美元則約 4.5%，比公債低約 0.6 個百分點&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;。&lt;/strong&gt;只代表相對水準，不改估值與研究評等。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;grid2 wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;公債殖利率每變動 1 個百分點，合理價值中點的變化（美元；紅色虛線為現價 38.26）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 500 142&quot; role=&quot;img&quot; aria-label=&quot;利率敏感度&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;168.0&quot; x2=&quot;168.0&quot; y1=&quot;6&quot; y2=&quot;136&quot; class=&quot;zero&quot;/&gt;&lt;line x1=&quot;417.1&quot; x2=&quot;417.1&quot; y1=&quot;4&quot; y2=&quot;138&quot; class=&quot;price&quot;/&gt;&lt;text x=&quot;158&quot; y=&quot;23&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;公債−1%（4.12%）&lt;/text&gt;&lt;rect x=&quot;168.0&quot; y=&quot;9&quot; width=&quot;248.1&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c1)&quot;/&gt;&lt;text x=&quot;424.1&quot; y=&quot;23&quot; class=&quot;val&quot;&gt;38&lt;/text&gt;&lt;text x=&quot;158&quot; y=&quot;63&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;目前公債（5.12%）&lt;/text&gt;&lt;rect x=&quot;168.0&quot; y=&quot;49&quot; width=&quot;210.8&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;386.8&quot; y=&quot;63&quot; class=&quot;val&quot;&gt;32&lt;/text&gt;&lt;text x=&quot;158&quot; y=&quot;103&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;公債＋1%（6.12%）&lt;/text&gt;&lt;rect x=&quot;168.0&quot; y=&quot;89&quot; width=&quot;182.7&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c2)&quot;/&gt;&lt;text x=&quot;358.7&quot; y=&quot;103&quot; class=&quot;val&quot;&gt;28&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;盈餘殖利率（申報 EPS 口徑）vs 10 年期公債殖利率（2021-11-16～2026-11-16，每季末取樣）；目前利差 +0.34 個百分點，位於期間內 71% 百分位（越低越貴）。折線為申報 EPS；扣非經常 EPS（1.73 美元，申報 2.09 美元）口徑目前盈餘殖利率 4.5%、利差 -0.60 個百分點（推導，單點，沒 gt;&lt;/circle&gt;&lt;circle cx=&quot;510.0&quot; cy=&quot;102.6&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--neg)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;10 年期公債 2026-11-16：5.1%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;518.0&quot; y=&quot;106.6&quot; class=&quot;val&quot; fill=&quot;var(--neg)&quot;&gt;5.1%&lt;/text&gt;&lt;polyline points=&quot;510.0,119.4&quot; fill=&quot;none&quot; stroke=&quot;var(--c3)&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;circle cx=&quot;510.0&quot; cy=&quot;119.4&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c3)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;盈餘殖利率（目前，扣非經常 EPS） 2026-11-16：4.5%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;518.0&quot; y=&quot;123.4&quot; class=&quot;val&quot; fill=&quot;var(--c3)&quot;&gt;4.5%&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c1)&quot;&gt;&lt;/i&gt;盈餘殖利率（1 ÷ 申報本益比）&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--neg)&quot;&gt;&lt;/i&gt;10 年期公債&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c3)&quot;&gt;&lt;/i&gt;盈餘殖利率（目前，扣非經常 EPS）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;股債利差只作「相對自身歷史的位置」：名目利率對實質盈餘有方法限制，不影響估值與研究評等。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;同業與產業對照&lt;/h3&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;與個別同業比較：各公司皆為可得近四季&lt;/h4&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;近四季營業利益率 Deckers（Hoka、UGG 的母公司）23.6%（DECK，資料商 yfinance，Yahoo 財經資料套件，近四季截至 2026-09-30）、Lululemon（高價運動服飾品牌）17.8%（LULU，資料商 yfinance，近四季截至 2026-07-31）、On（高價跑鞋品牌）15.3%（ONON，資料商 yfinance，近四季截至 2026-09-30），Nike 8.2%（NKE，資料商 yfinance，近四季截至 2026-08-31）；VF（The North Face、Vans 的母公司）7.1%（VFC，資料商 yfinance，近四季截至 2026-09-30）、Under Armour -0.5%（UAA，資料商 yfinance，近四季截至 2026-09-30）。&lt;/strong&gt;Nike 已從同業標竿掉到後段，折扣與大中華區是主因。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;同業本益比依 2026-11-16 收盤：Deckers 11.1 倍（DECK，資料商 yfinance 快照；2026-11-16 收盤）、On 20.0 倍（ONON，資料商 yfinance 快照；2026-11-16 收盤）、Lululemon 8.7 倍（LULU，資料商 yfinance 快照；2026-11-16 收盤）、VF 21.9 倍（VFC，資料商 yfinance 快照；2026-11-16 收盤），Under Armour 虧損不列；On 的企業價值資料疑有誤，只列本益比。&lt;/strong&gt;乘 Nike 扣非經常口徑並非完全同口徑，只作交叉核對、不進評等。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;與個別同業比較：利潤率與投入強度（各公司皆為可得近四季，Nike 至 2026 年 8 月）。資料期間：本公司 SEC 近四季（截至 2026-08-31）；同業為資料商（yfinance 季報加總）近四季，截至 DECK 2026-09-30、ONON 2026-09-30、LULU 2026-07-31＊、VFC 2026-09-30＊、UAA 2026-09-30、ADDYY 2026-09-30；＊資料商「營收年增」是最新單季對去年同季（不是近四季），最新一季截止日與近四季不同；資料商查詢 2026-11-17（批次收盤 2026-11-16）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 300&quot; role=&quot;img&quot; aria-label=&quot;同業比較&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;266.0&quot; y2=&quot;266.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;270.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;-10%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;205.5&quot; y2=&quot;205.5&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;209.5&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;0%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;145.0&quot; y2=&quot;145.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;149.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;10%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;84.5&quot; y2=&quot;84.5&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;88.5&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;20%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;24.0&quot; y2=&quot;24.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;28.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;30%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;205.5&quot; y2=&quot;205.5&quot; class=&quot;zero&quot;/&gt;&lt;rect x=&quot;62.5&quot; y=&quot;156.0&quot; width=&quot;14.3&quot; height=&quot;49.5&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;營業利益率 NKE：8%&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;95.0&quot; y=&quot;196.6&quot; width=&quot;14.3&quot; height=&quot;8.9&quot; rx=&quot;2&quot; fill=&quot;var(--c3)&quot;&gt;&lt;title&gt;資本支出占營收 NKE：1%&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;86.9&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;NKE&lt;/text&gt;&lt;rect x=&quot;132.2&quot; y=&quot;62.8&quot; width=&quot;14.3&quot; height=&quot;142.7&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;營業利益率 DECK：24%&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;164.7&quot; y=&quot;197.3&quot; width=&quot;14.3&quot; height=&quot;8.2&quot; rx=&quot;2&quot; fill=&quot;var(--c3)&quot;&gt;&lt;title&gt;資本支出占營收 DECK：1%&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;156.6&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;DECK&lt;/text&gt;&lt;rect x=&quot;201.9&quot; y=&quot;112.8&quot; width=&quot;14.3&quot; height=&quot;92.7&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;營業利益率 ONON：15%&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;234.4&quot; y=&quot;185.1&quot; width=&quot;14.3&quot; height=&quot;20.4&quot; rx=&quot;2&quot; fill=&quot;var(--c3)&quot;&gt;&lt;title&gt;資本支出占營收 ONON：3%&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;226.3&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;ONON&lt;/text&gt;&lt;rect x=&quot;271.6&quot; y=&quot;97.6&quot; width=&quot;14.3&quot; height=&quot;107.9&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;營業利益率 LULU：18%&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;304.1&quot; y=&quot;171.3&quot; width=&quot;14.3&quot; height=&quot;34.2&quot; rx=&quot;2&quot; fill=&quot;var(--c3)&quot;&gt;&lt;title&gt;資本支出占營收 LULU：6%&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;296.0&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;LULU&lt;/text&gt;&lt;rect x=&quot;341.3&quot; y=&quot;162.7&quot; width=&quot;14.3&quot; height=&quot;42.8&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;營業利益率 VFC：7%&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;373.8&quot; y=&quot;193.0&quot; width=&quot;14.3&quot; height=&quot;12.5&quot; rx=&quot;2&quot; fill=&quot;var(--c3)&quot;&gt;&lt;title&gt;資本支出占營收 VFC：2%&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;365.7&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;VFC&lt;/text&gt;&lt;rect x=&quot;411.0&quot; y=&quot;205.5&quot; width=&quot;14.3&quot; height=&quot;3.0&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;營業利益率 UAA：-0%&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;443.6&quot; y=&quot;198.2&quot; width=&quot;14.3&quot; height=&quot;7.3&quot; rx=&quot;2&quot; fill=&quot;var(--c3)&quot;&gt;&lt;title&gt;資本支出占營收 UAA：1%&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;435.4&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;UAA&lt;/text&gt;&lt;rect x=&quot;480.7&quot; y=&quot;149.8&quot; width=&quot;14.3&quot; height=&quot;55.7&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;營業利益率 ADDYY：9%&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;513.3&quot; y=&quot;194.7&quot; width=&quot;14.3&quot; height=&quot;10.8&quot; rx=&quot;2&quot; fill=&quot;var(--c3)&quot;&gt;&lt;title&gt;資本支出占營收 ADDYY：2%&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;505.1&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;ADDYY&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c1)&quot;&gt;&lt;/i&gt;營業利益率&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c2)&quot;&gt;&lt;/i&gt;研發占營收&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c3)&quot;&gt;&lt;/i&gt;資本支出占營收&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt signals&quot;&gt;&lt;tr&gt;&lt;th&gt;公司&lt;/th&gt;&lt;th&gt;主要品牌與定位&lt;/th&gt;&lt;th&gt;營業利益率&lt;/th&gt;&lt;th&gt;資本支出占營收&lt;/th&gt;&lt;th&gt;與 Nike 的主要差異&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Nike&lt;/td&gt;&lt;td&gt;全品類運動鞋服（Nike、Jordan、Converse）&lt;/td&gt;&lt;td&gt;8.2%（NKE，資料商 yfinance，近四季截至 2026-08-31）（含退款；扣除後約 6.7%）&lt;/td&gt;&lt;td&gt;1.5%（NKE，資料商 yfinance，近四季截至 2026-08-31）&lt;/td&gt;&lt;td&gt;規模最大；正處轉型低谷&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Deckers&lt;/td&gt;&lt;td&gt;Hoka（高價跑鞋品牌）跑鞋、UGG（雪靴品牌）&lt;/td&gt;&lt;td&gt;23.6%（DECK，資料商 yfinance，近四季截至 2026-09-30）&lt;/td&gt;&lt;td&gt;1.4%（DECK，資料商 yfinance，近四季截至 2026-09-30）&lt;/td&gt;&lt;td&gt;以高價跑鞋（Hoka）在跑步市場與 Nike 直接競爭&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;On&lt;/td&gt;&lt;td&gt;高價跑鞋&lt;/td&gt;&lt;td&gt;15.3%（ONON，資料商 yfinance，近四季截至 2026-09-30）&lt;/td&gt;&lt;td&gt;3.4%（ONON，資料商 yfinance，近四季截至 2026-09-30）&lt;/td&gt;&lt;td&gt;成長快、規模小&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Lululemon&lt;/td&gt;&lt;td&gt;高價運動服飾&lt;/td&gt;&lt;td&gt;17.8%（LULU，資料商 yfinance，近四季截至 2026-07-31）&lt;/td&gt;&lt;td&gt;5.7%（LULU，資料商 yfinance，近四季截至 2026-07-31）&lt;/td&gt;&lt;td&gt;直營為主；近期同樣面臨成長放緩&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;VF Corp（The North Face、Vans 的母公司）&lt;/td&gt;&lt;td&gt;戶外與街頭品牌&lt;/td&gt;&lt;td&gt;7.1%（VFC，資料商 yfinance，近四季截至 2026-09-30）&lt;/td&gt;&lt;td&gt;2.1%（VFC，資料商 yfinance，近四季截至 2026-09-30）&lt;/td&gt;&lt;td&gt;也在轉型；利潤率低&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Under Armour&lt;/td&gt;&lt;td&gt;運動鞋服&lt;/td&gt;&lt;td&gt;-0.5%（UAA，資料商 yfinance，近四季截至 2026-09-30）&lt;/td&gt;&lt;td&gt;1.2%（UAA，資料商 yfinance，近四季截至 2026-09-30）&lt;/td&gt;&lt;td&gt;規模小、轉型多年未見效&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;我們的假設 vs Damodaran（紐約大學教授的公開估值資料庫）「鞋類」產業常見範圍&lt;/h4&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;基準第一年營業利益率 5.7%，低於產業 9.0%，反映指引低谷；長期 11.5% 低於 Nike 過去 12 年平均約 12.1%。&lt;/strong&gt;銷售對投入資本取 3.0，低於公司 2026 財年 3.17、近四季 3.15，產業為 2.62；期末資本報酬率基準與樂觀取 20%、與產業 20.9% 相近，保守取 11.7%。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;資本成本 8.7% 高於產業 8.0%，主因公債殖利率較新（5.12%）；稅率基準取 21%，2027 財年指引約 25%。&lt;/strong&gt;Nike 占產業營收比重高，產業值只作參考。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;figure&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt signals&quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;本報告&lt;/th&gt;&lt;th&gt;產業&lt;/th&gt;&lt;th&gt;說明&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;營業利益率（稅前）&lt;/td&gt;&lt;td&gt;5.7%（第一年）&lt;/td&gt;&lt;td&gt;9.0%&lt;/td&gt;&lt;td&gt;公司指引的低谷；長期 11.5%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;銷售對投入資本&lt;/td&gt;&lt;td&gt;3.0&lt;/td&gt;&lt;td&gt;2.62&lt;/td&gt;&lt;td&gt;公司歷史 3.64／3.17／3.15，取 3.0 較保守&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;期末資本報酬率&lt;/td&gt;&lt;td&gt;20%（保守 11.7%）&lt;/td&gt;&lt;td&gt;20.9%&lt;/td&gt;&lt;td&gt;保守採計算核對建議&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Beta（股價相對大盤的波動倍數）&lt;/td&gt;&lt;td&gt;1.03&lt;/td&gt;&lt;td&gt;0.93（去槓桿）&lt;/td&gt;&lt;td&gt;產業值依 Nike 負債權益比 13.5% 重新加槓桿&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;資本成本&lt;/td&gt;&lt;td&gt;8.7%&lt;/td&gt;&lt;td&gt;8.0%&lt;/td&gt;&lt;td&gt;本報告用較新的公債殖利率&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;稅率&lt;/td&gt;&lt;td&gt;21%&lt;/td&gt;&lt;td&gt;18.0%&lt;/td&gt;&lt;td&gt;近四季約 20.7%；2027 財年指引約 25%；長期取 21%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;details id=&quot;claims&quot;&gt;&lt;summary&gt;論點檢查：每條判斷的證據狀態&lt;/summary&gt;&lt;div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;依風險分類的主張（證據狀態：支持／部分支持／提出反證／資料不足）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;編號&lt;/th&gt;&lt;th&gt;風險類別&lt;/th&gt;&lt;th&gt;主張&lt;/th&gt;&lt;th&gt;角色&lt;/th&gt;&lt;th&gt;證據狀態&lt;/th&gt;&lt;th&gt;什麼會改變判斷&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;NKE-C02&lt;/td&gt;&lt;td&gt;R1 資金與流動性&lt;/td&gt;&lt;td&gt;未來 12 個月的到期債務與股利可由現有現金支應：2026-08-31 現金與短期投資 83.68 億美元，為一年內到期公司債 20 億的 4.2 倍，另有 30 億美元未動用的承諾授信與未發行的 30 億商業本票計畫；近四季回購與股利後為 −3.41 億，以此速度帳上現金每年減少&lt;/td&gt;&lt;td&gt;支持論點&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;現金與短期投資降到低於一年內到期債務加一年股利（約 44 億）；承諾授信或商業本票餘額由零轉為正，且用途為支應股利&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;NKE-C03&lt;/td&gt;&lt;td&gt;R2 償債負擔與永久損失&lt;/td&gt;&lt;td&gt;償債負擔相對獲利的倍數：有息負債 78.93 億美元約為近四季 EBITDA 的 1.75 倍（扣除關稅退款後約 2.2 倍，推導），淨負債為負；公司債皆無擔保、票面為固定利率，其中約 24 億經利率交換轉為浮動，到期分散到 2050 年，信評仍為投資級&lt;/td&gt;&lt;td&gt;支持論點&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;信評再遭調降到 BBB 級或以下；為股利或重組新增借款，使有息負債÷EBITDA（扣非經常）超過 3 倍&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;NKE-M-成長G3&lt;/td&gt;&lt;td&gt;R3 成長退坡與競爭&lt;/td&gt;&lt;td&gt;目前的成長來源接不住衰退：FY2027 第一季北美批發 +9%、服飾 +2%，但大中華區 −26%（幣別中性）、Converse −28%、鞋類 −6%、直營 −8%，總營收 −4%；公司說 Sportswear、Jordan 與大中華區的調整會延續到 FY2027 以後&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;連續兩季總營收幣別中性年增為正，且大中華區衰退收斂到個位數；下一份財報把 FY2027 營收指引下修到低於「衰退高個位數」（例如衰退雙位數）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;NKE-C08&lt;/td&gt;&lt;td&gt;R4 投入回報不足&lt;/td&gt;&lt;td&gt;過去兩年投入沒有換回回報：FY2024–FY2026 稅後營業利益減少約 23 億美元、營運投入資本反增約 5 億，增量回報為負；近四季 ROIC 約 21%（含退款；扣除後約 17%）仍高於資本成本&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;FY2028 稅後營業利益回到 FY2024 水準的八成以上而投入資本未明顯增加&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;NKE-M-品質Q3&lt;/td&gt;&lt;td&gt;R5 收入與盈餘品質&lt;/td&gt;&lt;td&gt;近四季盈餘沒有完整變成可分配的現金：一般資本支出後現金 21.05 億美元低於股利 24.26 億，回購與股利後為 −3.41 億；而且 21.05 億已含 FY2026 第四季認列的 9.86 億關稅退款現金（約 3 億在第四季、其餘在 FY2027 第一季收回並同時繳相關所得稅），扣除後更低&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;FY2027 全年一般資本支出後現金（扣除退款收現與相關稅款後）高於股利；FY2027 第二季或之後的現金流量表顯示營運現金流連兩季低於當季股利&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;NKE-C05&lt;/td&gt;&lt;td&gt;R5 收入與盈餘品質&lt;/td&gt;&lt;td&gt;近四季申報盈餘被非經常項目墊高：稀釋 EPS 2.09 美元含 FY2026 第四季關稅退款約 0.52 美元；扣除退款、加回遣散費後約 1.73 美元（推導）&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;公司在 10-K 或法說會揭露逐季關稅成本&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;NKE-C06&lt;/td&gt;&lt;td&gt;R6 治理與資料可信度&lt;/td&gt;&lt;td&gt;轉型承諾的執行紀錄還在建立：2024 財年以來第三個重組計畫（BNP 分析師），財務長與會計長在 2026 年更替；正面線索是執行長與三位董事 4 月在公開市場自掏腰包買進（其中 John Rogers 已於 9 月股東會後退休）&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;部分支持&lt;/td&gt;&lt;td&gt;Pace 的第一個完整年度（FY2028）營運費用率較 FY2026 下降，且公司未再宣布新重組；再度更換執行長或財務長，或會計長離職出現歧見揭露&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;NKE-C01&lt;/td&gt;&lt;td&gt;R7 估值與市場預期&lt;/td&gt;&lt;td&gt;以 2026-11-16 收盤 38.26 美元計，現價已預付部分回升：沿用我們的營收路徑與前四年利潤率，第 5 年起營業利益率約要 12.4%，略高於 FY2015–FY2026 平均稅前利益率約 12.1%（口徑不同）、也高於我們基準的長期 11.5%；或改由營收解，未來五年每年約要成長 3.3%，而公司指引 FY2027 營收衰退高個位數。基準情境成真時的年報酬約 8.2%，比 10 年期公債 5.12% 多約 3.1 個百分點&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;FY2028 營業利益率（不含關稅退款與重組費用）回到 10% 以上；價格位置依政策規則重算，由合理轉為偏低或便宜&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;NKE-M-成長G2&lt;/td&gt;&lt;td&gt;R7 估值與市場預期&lt;/td&gt;&lt;td&gt;成長性四問並列：市價要求的成長接近過去長期——基準反推未來 5 年營收年增約 3.3%，略低於 FY2015–FY2026 年複合 3.9%，但高於近四季 −1.2% 與模型基準第 1–5 年約 0.9%（不是高成長股的要求，但要從衰退回到過去常態）。實績：FY2015–FY2026 營收年複合約 3.9%，近四季 −1.2%、最新一季 −4.3%（一年前近四季 −7.1%，衰退收斂）。品質：近兩年增量 ROIC 為負（營業利益減少、投入資本仍增加），近四季可支撐成長約 2.7%，近五年 ROIC（財務投入資本口徑、含商譽，營業利益為推導近似）中位 42% 但 FY2025、FY2026 降到 26%、24%（FY2026 含關稅退款，非經常；與近四季 ROIC 約 21% 的營運投入資本口徑不同），實績與回升都要打折看。股價要求：市價反推未來 5 年營收年增約 3.3%（基準情境利潤率路徑不變；折現率由低到高對應 −0.2%–6.7%），超額報酬期間式 10 年名目約 5.0%；扣非經常本益比約 22.1 倍、申報 EPS 本益比約 18.3 倍，都在近五年最低與 p25 之間，但這是獲利低谷的本益比，轉機股不據此判斷便宜。模型假設：基準情境首年 −7%、之後 0%、3%、5%、4%，第 1–5 年年複合約 0.9%、前 10 年名目年增約 2.1%（實質約 0.1%，推導），都低於市價要求（5 年 3.3%、10 年式 5.0%），也低於同規模公司十年實質中位 1.8%&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;連續兩季總營收幣別中性年增為正（與 NKE-M-成長G3 同口徑），且 FY2027 年度增量 ROIC 轉正；公司把 FY2027 營收指引下修到衰退雙位數&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;NKE-C07&lt;/td&gt;&lt;td&gt;R8 宏觀與共同曝險&lt;/td&gt;&lt;td&gt;生產與貿易政策曝險集中：FY2026 鞋類約 52% 在越南生產、四家代工商合計約 60%；IEEPA 關稅雖已判定違法並退款，其他貿易措施仍可能直接影響成本與毛利&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;部分支持&lt;/td&gt;&lt;td&gt;美國對越南或印尼產鞋類實施新的關稅，且公司揭露影響金額&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;NKE-C04&lt;/td&gt;&lt;td&gt;R9 稀釋與股東回饋&lt;/td&gt;&lt;td&gt;股東回饋不再減少股數：回購在 FY2026 第一季期間暫停、之後沒有計畫內回購，近四季現金回購只有 0.20 億美元（FY2026 第二季的現金支付），低於股權薪酬約 6.9 億，淨回購殖利率約 −1.2%&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;恢復回購且金額超過股權薪酬，並由營運現金支應&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;並列：研究評等 生意品質良好 ／ 價格合理（在市場常態內）；價格位置 合理；現價隱含年報酬（基準情境，非預期報酬） 8.2%。各列狀態與價格分開呈現，不合成分數，狀態件數也不代表強弱（非買賣建議）。&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;details id=&quot;glossary&quot;&gt;&lt;summary&gt;名詞小抄&lt;/summary&gt;&lt;dl class=&quot;gl&quot;&gt;&lt;dt id=&quot;g0&quot;&gt;近四季（TTM）&lt;/dt&gt;&lt;dd&gt;最近連續四個季度加總，等於「最近一整年」&lt;/dd&gt;&lt;dt id=&quot;g1&quot;&gt;批發&lt;/dt&gt;&lt;dd&gt;把商品賣給零售商（例如 Dick&amp;#x27;s、Foot Locker，運動鞋零售連鎖），再由零售商賣給消費者&lt;/dd&gt;&lt;dt id=&quot;g2&quot;&gt;直營（NIKE Direct）&lt;/dt&gt;&lt;dd&gt;Nike 自己的門市、網站與 App（手機應用程式）直接賣給消費者&lt;/dd&gt;&lt;dt id=&quot;g3&quot;&gt;幣別中性&lt;/dt&gt;&lt;dd&gt;排除匯率變動影響後的成長率&lt;/dd&gt;&lt;dt id=&quot;g4&quot;&gt;關稅退款&lt;/dt&gt;&lt;dd&gt;美國法院判決部分關稅違法後，政府退還已繳的關稅；對 Nike 是非經常性收益&lt;/dd&gt;&lt;dt id=&quot;g5&quot;&gt;轉機股&lt;/dt&gt;&lt;dd&gt;林區的分類之一：經營陷入困境、正在轉型的公司；重點是能否撐過低谷與轉機證據&lt;/dd&gt;&lt;dt id=&quot;g6&quot;&gt;營業利益率&lt;/dt&gt;&lt;dd&gt;每 100 美元營收，扣掉成本和營運費用後剩下多少&lt;/dd&gt;&lt;dt id=&quot;g7&quot;&gt;自由現金流&lt;/dt&gt;&lt;dd&gt;營運現金流扣掉設備投資，公司可以自由運用的現金&lt;/dd&gt;&lt;dt id=&quot;g8&quot;&gt;雙重股權&lt;/dt&gt;&lt;dd&gt;不同類別股票的投票權不同；Nike 的 A 股選出四分之三董事，Swoosh, LLC 持有約 79% 的 A 股&lt;/dd&gt;&lt;dt id=&quot;g9&quot;&gt;現金流折現（FCFF）&lt;/dt&gt;&lt;dd&gt;把公司未來每年能產生的自由現金流，用合理的報酬率折算回今天的價值&lt;/dd&gt;&lt;dt id=&quot;g10&quot;&gt;本益比&lt;/dt&gt;&lt;dd&gt;股價 ÷ 每股盈餘；代表用幾年的獲利買下這家公司&lt;/dd&gt;&lt;dt id=&quot;g11&quot;&gt;PEG&lt;/dt&gt;&lt;dd&gt;本益比 ÷ 盈餘成長率；林區認為 1 以下便宜、2 以上偏貴&lt;/dd&gt;&lt;dt id=&quot;g12&quot;&gt;股東收益率&lt;/dt&gt;&lt;dd&gt;股利殖利率加回購殖利率：公司一年還給股東的現金占市值多少&lt;/dd&gt;&lt;dt id=&quot;g13&quot;&gt;股債利差&lt;/dt&gt;&lt;dd&gt;盈餘殖利率（1 ÷ 本益比）減 10 年期公債殖利率；越低代表股票相對公債越貴&lt;/dd&gt;&lt;dt id=&quot;g14&quot;&gt;代工商&lt;/dt&gt;&lt;dd&gt;受品牌委託生產商品的工廠業者；Nike 的鞋與服飾幾乎全由代工商生產&lt;/dd&gt;&lt;dt id=&quot;g15&quot;&gt;10-K&lt;/dt&gt;&lt;dd&gt;公司向美國證券監管機關提交的年度報告，含完整財報與風險說明&lt;/dd&gt;&lt;dt id=&quot;g16&quot;&gt;10-Q&lt;/dt&gt;&lt;dd&gt;公司向美國證券監管機關提交的季度報告&lt;/dd&gt;&lt;dt id=&quot;g17&quot;&gt;8-K&lt;/dt&gt;&lt;dd&gt;公司遇到財報發布、人事異動等重大事件時提交的公告&lt;/dd&gt;&lt;dt id=&quot;g18&quot;&gt;Form 4&lt;/dt&gt;&lt;dd&gt;董事、高階主管等內部人申報股票交易的表單&lt;/dd&gt;&lt;dt id=&quot;g19&quot;&gt;DEF 14A&lt;/dt&gt;&lt;dd&gt;正式股東會委託書，說明董事提名、投票議案與管理層薪酬&lt;/dd&gt;&lt;dt id=&quot;g20&quot;&gt;DCF&lt;/dt&gt;&lt;dd&gt;現金流折現法：把未來現金流換算成今天的價值；本報告以企業自由現金流估值&lt;/dd&gt;&lt;dt id=&quot;g21&quot;&gt;MD&amp;amp;A&lt;/dt&gt;&lt;dd&gt;年報與季報中的「管理層討論與分析」，公司解釋營運與財務變化的章節&lt;/dd&gt;&lt;dt id=&quot;g22&quot;&gt;Business Wire&lt;/dt&gt;&lt;dd&gt;企業發布新聞稿的平台&lt;/dd&gt;&lt;dt id=&quot;g23&quot;&gt;加權平均資本成本（WACC）&lt;/dt&gt;&lt;dd&gt;股東與債主要求報酬的加權平均，用來折現公司未來現金流。&lt;/dd&gt;&lt;dt id=&quot;g24&quot;&gt;EBIT&lt;/dt&gt;&lt;dd&gt;息稅前利益，約等於營業利益；EV/EBIT 是企業價值除以它的倍數。&lt;/dd&gt;&lt;dt id=&quot;g25&quot;&gt;bp&lt;/dt&gt;&lt;dd&gt;基點，1 bp＝0.01 個百分點。&lt;/dd&gt;&lt;/dl&gt;&lt;/details&gt;&lt;details id=&quot;numbers-table&quot;&gt;&lt;summary&gt;完整數字表格：三大報表摘要（年度與 8 季，供查；圖在正文「完整數字」）&lt;/summary&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:14px&quot;&gt;損益表（年度與近四季）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;億美元&lt;/th&gt;&lt;th&gt;FY23&lt;/th&gt;&lt;th&gt;FY24&lt;/th&gt;&lt;th&gt;FY25&lt;/th&gt;&lt;th&gt;FY26&lt;/th&gt;&lt;th&gt;近四季&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;營收&lt;/td&gt;&lt;td&gt;512&lt;/td&gt;&lt;td&gt;514&lt;/td&gt;&lt;td&gt;463&lt;/td&gt;&lt;td&gt;464&lt;/td&gt;&lt;td&gt;459&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;毛利&lt;/td&gt;&lt;td&gt;223&lt;/td&gt;&lt;td&gt;229&lt;/td&gt;&lt;td&gt;198&lt;/td&gt;&lt;td&gt;199&lt;/td&gt;&lt;td&gt;198&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;研發費用&lt;/ &lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;div class=&quot;wrap&quot;&gt;&lt;div class=&quot;top&quot;&gt;&lt;span&gt;&lt;b&gt;耐吉（NKE）&lt;/b&gt;｜商業評估&lt;/span&gt;&lt;span&gt;資料截止 2026-11-16｜基準季 2026-08-31｜&lt;a href=&quot;報告.html&quot;&gt;估值報告（另頁）&lt;/a&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;hero&quot;&gt;&lt;div&gt;&lt;div class=&quot;eyebrow&quot;&gt;商業評估｜品牌消費與硬體／品牌商品&lt;/div&gt;&lt;h1&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;Nike 靠品牌與運動行銷把外包生產的鞋服賣進批發與直營兩個通路，模式仍成立；但營收已兩年沒有成長、2027 財年指引再衰退高個位數，大中華區與 Converse 還在下滑，北美批發回補是目前唯一有財報證據的轉機。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src2&quot;&gt;[2]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src3&quot;&gt;[3]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src4&quot;&gt;[4]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src5&quot;&gt;[5]&lt;/a&gt;&lt;/sup&gt;&lt;/h1&gt;&lt;p class=&quot;lead&quot;&gt;本頁只用官方文件、財報與新聞，回答商業模式是否成立、成長點在哪、是否卡住、未來怎麼變、週期多久。&lt;b&gt;不含價格、估值或任何買賣建議&lt;/b&gt;，也不影響估值報告的研究評等。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;gradebox&quot;&gt;&lt;div class=&quot;lab&quot;&gt;商業動能（五級 A–E；原名「商業評估等級」，2026-11-17 改名）&lt;span class=&quot;ruleok&quot;&gt;評分規則第一版，2026-11-07 使用者核定&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;g&quot;&gt;D&lt;small&gt;級&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;加權分 2.6／5｜相對同業：DECK、ONON、LULU、VFC、UAA&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;模式或成長有實質問題&lt;/div&gt;&lt;div class=&quot;note&quot;&gt;商業評估等級（A–E 五級）只看商業模式是否成立、成長是否卡住、週期在哪，相對同產業卡同業評比；它不是估值報告研究評等裡的「生意品質 A／B／C」（那是看護城河、投入資本報酬、現金流品質、資產負債表與治理的絕對標準），不進研究評等、不影響估值、不涉任何價格。&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;nav class=&quot;qnav&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;&lt;a href=&quot;#s0&quot;&gt;重點&lt;/a&gt;&lt;a href=&quot;#s1&quot;&gt;1 商業輪廓&lt;/a&gt;&lt;a href=&quot;#s2&quot;&gt;2 說的 vs 做的&lt;/a&gt;&lt;a href=&quot;#s3&quot;&gt;3 成長與卡點&lt;/a&gt;&lt;a href=&quot;#sa&quot;&gt;4 優勢與持續期間&lt;/a&gt;&lt;a href=&quot;#s4&quot;&gt;5 生命週期&lt;/a&gt;&lt;a href=&quot;#s5&quot;&gt;6 週期&lt;/a&gt;&lt;a href=&quot;#s6&quot;&gt;7 觀察清單&lt;/a&gt;&lt;a href=&quot;#sg&quot;&gt;等級明細&lt;/a&gt;&lt;a href=&quot;#src&quot;&gt;出處&lt;/a&gt;&lt;/div&gt;&lt;/nav&gt;&lt;div class=&quot;wrap&quot;&gt;&lt;section id=&quot;s0&quot;&gt;&lt;h2&gt;一眼看重點&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;先看等級怎麼來、這頁的證據有多扎實；細節在下面各節。&lt;/p&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;等級怎麼來：五個面向&lt;/figcaption&gt;&lt;svg viewBox=&quot;0 0 640 260&quot; role=&quot;img&quot; aria-label=&quot;商業評估等級五面向：作者分與機械建議分&quot;&gt;&lt;line x1=&quot;150.0&quot; x2=&quot;150.0&quot; y1=&quot;20&quot; y2=&quot;232&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;150.0&quot; y=&quot;250&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;1 分&lt;/text&gt;&lt;line x1=&quot;255.0&quot; x2=&quot;255.0&quot; y1=&quot;20&quot; y2=&quot;232&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;255.0&quot; y=&quot;250&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;2 分&lt;/text&gt;&lt;line x1=&quot;360.0&quot; x2=&quot;360.0&quot; y1=&quot;20&quot; y2=&quot;232&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;360.0&quot; y=&quot;250&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;3 分&lt;/text&gt;&lt;line x1=&quot;465.0&quot; x2=&quot;465.0&quot; y1=&quot;20&quot; y2=&quot;232&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;465.0&quot; y=&quot;250&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;4 分&lt;/text&gt;&lt;line x1=&quot;570.0&quot; x2=&quot;570.0&quot; y1=&quot;20&quot; y2=&quot;232&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;570.0&quot; y=&quot;250&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;5 分&lt;/text&gt;&lt;text x=&quot;140&quot; y=&quot;55.0&quot; class=&quot;lb&quot; text-anchor=&quot;end&quot;&gt;模式穩固度&lt;tspan class=&quot;ax&quot;&g ot; y=&quot;175.0&quot; class=&quot;vl&quot;&gt;2&lt;tspan class=&quot;ax&quot;&gt;（機械 4）&lt;/tspan&gt;&lt;/text&gt;&lt;text x=&quot;140&quot; y=&quot;215.0&quot; class=&quot;lb&quot; text-anchor=&quot;end&quot;&gt;說法可信度&lt;tspan class=&quot;ax&quot;&gt; 15%&lt;/tspan&gt;&lt;/text&gt;&lt;rect x=&quot;150.0&quot; y=&quot;203.0&quot; width=&quot;210.0&quot; height=&quot;14&quot; rx=&quot;3&quot; fill=&quot;var(--biz)&quot; opacity=&quot;.85&quot;/&gt;&lt;path d=&quot;M360.0,198.0 l6,-8 h-12z&quot; fill=&quot;var(--accent)&quot;&gt;&lt;title&gt;機械建議 3&lt;/title&gt;&lt;/path&gt;&lt;text x=&quot;368.0&quot; y=&quot;215.0&quot; class=&quot;vl&quot;&gt;3&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;lg&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--biz)&quot;&gt;&lt;/i&gt;作者分&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--accent)&quot;&gt;&lt;/i&gt;機械建議分&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;藍條是作者分（1–5），橘色三角是工具的機械建議分；兩者不同的面向在等級明細寫了偏離理由。加權分 2.6 → D 級（A ≥ 4.2、B ≥ 3.5、C ≥ 2.8、D ≥ 2.1）。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估.json#/評等/面向（作者分、權重、機械建議）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;這頁的句子有多少是事實&lt;/figcaption&gt;&lt;svg viewBox=&quot;0 0 640 58&quot; role=&quot;img&quot; aria-label=&quot;句子標記組成&quot;&gt;&lt;rect x=&quot;4.0&quot; y=&quot;6&quot; width=&quot;386.2&quot; height=&quot;26&quot; fill=&quot;var(--biz)&quot;&gt;&lt;title&gt;事實 66&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;197.1&quot; y=&quot;24&quot; class=&quot;inb&quot; text-anchor=&quot;middle&quot;&gt;事實 66&lt;/text&gt;&lt;rect x=&quot;390.2&quot; y=&quot;6&quot; width=&quot;181.4&quot; height=&quot;26&quot; fill=&quot;var(--accent)&quot;&gt;&lt;title&gt;推論 31&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;480.9&quot; y=&quot;24&quot; class=&quot;inb&quot; text-anchor=&quot;middle&quot;&gt;推論 31&lt;/text&gt;&lt;rect x=&quot;571.6&quot; y=&quot;6&quot; width=&quot;41.0&quot; height=&quot;26&quot; fill=&quot;var(--c6)&quot;&gt;&lt;title&gt;作者判斷 7&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;612.6&quot; y=&quot;6&quot; width=&quot;23.4&quot; height=&quot;26&quot; fill=&quot;var(--neg)&quot;&gt;&lt;title&gt;待查 4&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;4&quot; y=&quot;52&quot; class=&quot;ax&quot;&gt;合計 108&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;lg&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--biz)&quot;&gt;&lt;/i&gt;事實 66&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--accent)&quot;&gt;&lt;/i&gt;推論 31&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c6)&quot;&gt;&lt;/i&gt;作者判斷 7&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--neg)&quot;&gt;&lt;/i&gt;待查 4&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;全頁句子依標記分類：事實（原文或財報直接寫的）占 61%；推論與作者判斷是從事實推出或取捨的結論，待查是找不到證據的地方。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估.json#/標記統計&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/section&gt;&lt;section id=&quot;s1&quot;&gt;&lt;h2&gt;1　商業輪廓：賣什麼、賣給誰、怎麼收錢&lt;/h2&gt;&lt;div&gt;&lt;span class=&quot;chip&quot;&gt;一次性商品銷售（批發）&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;一次性商品銷售（直營門市與數位）&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;品牌授權權利金&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cards c3&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;賣什麼&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;Nike 設計、開發並銷售運動鞋、服飾、器材、配件與服務，自稱全球最大的運動鞋服銷售商。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;2026 財年鞋類 305.38 億美元（占 65.8%）、服飾 134.97 億（29.1%）、器材 22.20 億（4.8%）；Converse 品牌全年 11.74 億美元，占 2.5%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src6&quot;&gt;[6]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src7&quot;&gt;[7]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;鞋服幾乎全部由獨立代工廠在美國以外生產；2026 財年 Nike 品牌鞋類由 15 家代工商製造，越南、印尼、中國工廠約占 52%、27%、16%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src8&quot;&gt;[8]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src9&quot;&gt;[9]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;賣給誰&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;兩個通路：批發客戶（獨立經銷商、授權商與業務代表，遍及幾乎所有國家）與 NIKE Direct（自營門市與數位平台）直接賣給消費者。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;Dick&amp;#x27;s Sporting Goods 在 10-K 寫 Nike 是它最大的供應商，約占 2025 財年商品採購的 31%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src10&quot;&gt;[10]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;怎麼收錢&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;批發是先接訂單再出貨：公司讓部分客戶在交貨前五到六個月下「期貨訂單」，以安排生產與運輸；另有一部分是先備貨再賣給客戶。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src11&quot;&gt;[11]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src12&quot;&gt;[12]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;直營收入在門市與數位平台售出時入帳；2027 財年第一季 NIKE Direct 營收 41 億美元，其中數位 18 億、門市 23 億。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src13&quot;&gt;[13]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;營收從哪裡來（2026-05-31 (FY)）&lt;/figcaption&gt;&lt;div class=&quot;sub-t&quot;&gt;依合併項目（ConsolidationItems）&lt;/div&gt;&lt;svg viewBox=&quot;0 0 640 1412&quot; role=&quot;img&quot; aria-label=&quot;橫條&quot;&gt;&lt;text x=&quot;252&quot; y=&quot;20&quot; class=&quot;lb s&quot; text-anchor=&quot;end&quot;&gt;Operating Segments - NIKE Brand&lt;title&gt;Operating Segments - NIKE Brand&lt;/title&gt;&lt;/text&gt;&lt;rect x=&quot;260&quot; y=&quot;9&quot; width=&quot;230.0&quot; height=&quot;15&quot; rx=&quot;2&quot; fill=&quot;var(--biz)&quot; opacity=&quot;.8&quot;/&gt;&lt;text x=&quot;496.0&quot; y=&quot;21&quot; class=&quot;vl s&quot;&gt;97.5%&lt;  class=&quot;ref&quot;&gt;&lt;a href=&quot;#src17&quot;&gt;[17]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;通路比重在倒回批發：公司把數位平台改定位成全價平台、把資源投回批發，所以直營下滑、批發上升是策略選擇，不全是需求轉弱。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src18&quot;&gt;[18]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src14&quot;&gt;[14]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;地區上，2026 財年北美 205.11 億美元（44.2%，年增 4.8%）、歐洲中東非洲 125.72 億（27.1%，+2.6%）、大中華區 58.47 億（12.6%，−11.2%）、亞太拉美 62.43 億（13.5%，−0.1%）；同一軸的分部、產品與通路是三種切法，不可相加。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src19&quot;&gt;[19]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src20&quot;&gt;[20]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src21&quot;&gt;[21]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src22&quot;&gt;[22]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;費用率：本期對去年同期（2026-08-31 (Q1)）&lt;/figcaption&gt;&lt;svg viewBox=&quot;0 0 640 152&quot; role=&quot;img&quot; aria-label=&quot;費用率本期與去年同期&quot;&gt;&lt;line x1=&quot;110.0&quot; x2=&quot;110.0&quot; y1=&quot;16&quot; y2=&quot;128&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;110.0&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;0%&lt;/text&gt;&lt;line x1=&quot;192.0&quot; x2=&quot;192.0&quot; y1=&quot;16&quot; y2=&quot;128&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;192.0&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;10%&lt;/text&gt;&lt;line x1=&quot;274.0&quot; x2=&quot;274.0&quot; y1=&quot;16&quot; y2=&quot;128&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;274.0&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;20%&lt;/text&gt;&lt;line x1=&quot;356.0&quot; x2=&quot;356.0&quot; y1=&quot;16&quot; y2=&quot;128&quot; class )&quot;&gt;&lt;title&gt;本期 34.9%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;405.9&quot; y=&quot;74.0&quot; class=&quot;vl s&quot;&gt;34.9%&lt;tspan class=&quot;ax&quot;&gt; +0.6 點&lt;/tspan&gt;&lt;/text&gt;&lt;text x=&quot;102&quot; y=&quot;108.0&quot; class=&quot;lb s&quot; text-anchor=&quot;end&quot;&gt;銷管費用率&lt;/text&gt;&lt;line x1=&quot;391.0&quot; x2=&quot;395.9&quot; y1=&quot;103.0&quot; y2=&quot;103.0&quot; stroke=&quot;var(--biz)&quot; stroke-width=&quot;3&quot; opacity=&quot;.5&quot;/&gt;&lt;circle cx=&quot;391.0&quot; cy=&quot;103.0&quot; r=&quot;5&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;去年同期 34.3%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;395.9&quot; cy=&quot;103.0&quot; r=&quot;5.5&quot; fill=&quot;var(--biz)&quot;&gt;&lt;title&gt;本期 34.9%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;405.9&quot; y=&quot;108.0&quot; class=&quot;vl s&quot;&gt;34.9%&lt;tspan class=&quot;ax&quot;&gt; +0.6 點&lt;/tspan&gt;&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;lg&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--biz)&quot;&gt;&lt;/i&gt;本期&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--muted)&quot;&gt;&lt;/i&gt;去年同期&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--neg)&quot;&gt;&lt;/i&gt;變差超過 1 點&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;空心點是去年同期、實心點是本期，右側是變化（百分點）；費用率升或毛利率降超過 1 點標紅。分母是含全部收入的營收。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估底稿.json#/費用率（財報/10-Q_2026-08-31_損益表.json）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/section&gt;&lt;section id=&quot;s2&quot;&gt;&lt;h2&gt;2　商業模式驗證：說的 vs 做的&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;管理層在 10-K、10-Q、8-K 的說法，對照財報數字。判定：已驗證／部分支持／說法未獲數字支持／待查。&lt;/p&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;說的 vs 做的：判定分布&lt;/figcaption&gt;&lt;svg viewBox=&quot;0 0 640 58&quot; role=&quot;img&quot; aria-label=&quot;說的vs做的判定&quot;&gt;&lt;rect x=&quot;4.0&quot; y=&quot;6&quot; width=&quot;126.4&quot; height=&quot;26&quot; fill=&quot;var(--pos)&quot;&gt;&lt;title&gt;已驗證 1&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;67.2&quot; y=&quot;24&quot; class=&quot;inb&quot; text-anchor=&quot;middle&quot;&gt;已驗證 1&lt;/text&gt;&lt;rect x=&quot;130.4&quot; y=&quot;6&quot; width=&quot;379.2&quot; height=&quot;26&quot; fill=&quot;var(--warn)&quot;&gt;&lt;title&gt;部分支持 3&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;320.0&quot; y=&quot;24&quot; class=&quot;inb&quot; text-anchor=&quot;middle&quot;&gt;部分支持 3&lt;/text&gt;&lt;rect x=&quot;509.6&quot; y=&quot;6&quot; width=&quot;126.4&quot; height=&quot;26&quot; fill=&quot;var(--neg)&quot;&gt;&lt;title&gt;說法未獲數字支持 1&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;572.8&quot; y=&quot;24&quot; class=&quot;inb&quot; text-anchor=&quot;middle&quot;&gt;說法未獲數字支持 1&lt;/text&gt;&lt;text x=&quot;4&quot; y=&quot;52&quot; class=&quot;ax&quot;&gt;合計 5&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;lg&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--pos)&quot;&gt;&lt;/i&gt;已驗證 1&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--warn)&quot;&gt;&lt;/i&gt;部分支持 3&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--neg)&quot;&gt;&lt;/i&gt;說法未獲數字支持 1&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;管理層 5 條說法對照財報數字的結果；4 條不是「已驗證」，下方用色框標出（有問題的證據）。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估.json#/內容/說的vs做的/判定&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;div class=&quot;callout warnc&quot;&gt;&lt;b&gt;有問題的證據（判定不是「已驗證」）&lt;/b&gt;&lt;ul class=&quot;badl&quot;&gt;&lt;li&gt;&lt;a href=&quot;#cl2&quot;&gt;數位改走全價、資源移回批發&lt;/a&gt; &lt;span class=&quot;v v-部分支持&quot;&gt;部分支持&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a href=&quot;#cl3&quot;&gt;運動本業（Sport Offense）帶來進展&lt;/a&gt; &lt;span class=&quot;v v-部分支持&quot;&gt;部分支持&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a href=&quot;#cl4&quot;&gt;重組計畫節省成本&lt;/a&gt; &lt;span class=&quot;v v-部分支持&quot;&gt;部分支持&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a href=&quot;#cl5&quot;&gt;為長期成長重新定位&lt;/a&gt; &lt;span class=&quot;v v-說法未獲數字支持&quot;&gt;說法未獲數字支持&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;div class=&quot;cards&quot;&gt;&lt;div class=&quot;card claim cv-已驗證&quot; id=&quot;cl1&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;北美轉型進度&lt;/b&gt;&lt;span class=&quot;v v-已驗證&quot;&gt;已驗證&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;管理層說法&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;10-K 寫各分部進度不同，預計 2026 年 12 月底前完成這些行動；北美進度最快，大中華區與 Converse 需要更多時間。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src23&quot;&gt;[23]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對照數字&lt;/div&gt;&lt;ul class=&quot;ev&quot;&gt;&lt;li class=&quot;s&quot;&gt;2026 財年北美營收幣別中性年增 5%，其中批發 +14%（擴大鋪貨、對既有客戶出貨增加），直營 −6%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src24&quot;&gt;[24]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;li class=&quot;s&quot;&gt;2027 財年第一季北美幣別中性 +2%、批發 +9%；北美 EBIT 11.70 億美元，年增 3%，其他三個地區 EBIT 都下降（大中華區 −34%）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src3&quot;&gt;[3]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src25&quot;&gt;[25]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;lbl&quot;&gt;說明&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;北美營收與 EBIT 都已回升，且是四個地區中唯一 EBIT 成長的，與「北美進度最快」一致。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src25&quot;&gt;[25]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src24&quot;&gt;[24]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card claim cv-部分支持&quot; id=&quot;cl2&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;數位改走全價、資源移回批發&lt;/b&gt;&lt;span class=&quot;v v-部分支持&quot;&gt;部分支持&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;管理層說法&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;公司說要把 NIKE 品牌數位平台重新定位為全價平台，並把資源重新投回批發通路。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src18&quot;&gt;[18]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對照數字&lt;/div&gt;&lt;ul class=&quot;ev&quot;&gt;&lt;li class=&quot;s&quot;&gt;2026 財年批發營收 275 億美元，前一年 259 億；直營年減 5.7%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src26&quot;&gt;[26]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src15&quot;&gt;[15]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;li class=&quot;s&quot;&gt;2027 財年第一季數位營收年減 13%；但鞋類平均單價仍因通路組合與較高折扣下降，拖累鞋類營收約 1 個百分點。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src13&quot;&gt;[13]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src27&quot;&gt;[27]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;lbl&quot;&gt;說明&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;通路比重確實移向批發；但「全價」還沒在單價上看到，折扣仍在拉低鞋類平均單價。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src27&quot;&gt;[27]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src26&quot;&gt;[26]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card claim cv-部分支持&quot; id=&quot;cl3&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;運動本業（Sport Offense）帶來進展&lt;/b&gt;&lt;span class=&quot;v v-部分支持&quot;&gt;部分支持&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;管理層說法&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;執行長 Hill 在 2027 財年第一季新聞稿說 Sport Offense 正在專業運動產品帶來可衡量的進展，生活風格、Jordan 與大中華區還有更多工作要做。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src28&quot;&gt;[28]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對照數字&lt;/div&gt;&lt;ul class=&quot;ev&quot;&gt;&lt;li class=&quot;s&quot;&gt;第一季 Nike 品牌鞋類幣別中性 −6%（銷量 −5%），服飾 +2%（銷量 −2%、單價 +4 個百分點）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src27&quot;&gt;[27]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src29&quot;&gt;[29]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;li class=&quot;s&quot;&gt;Modern Retail 轉述 Hill 在電話會議說跑步業務雙位數成長、市占持續回升；10-Q 沒有揭露各運動類別的營收。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src30&quot;&gt;[30]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;lbl&quot;&gt;說明&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;跑步的進展只有管理層口頭數字、申報沒有分類別營收；整體鞋類銷量仍在下滑，專業運動的成長還不足以抵銷其他類別。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src30&quot;&gt;[30]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src27&quot;&gt;[27]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card claim cv-部分支持&quot; id=&quot;cl4&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;重組計畫節省成本&lt;/b&gt;&lt;span class=&quot;v v-部分支持&quot;&gt;部分支持&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;管理層說法&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;公司在 8-K 寫 Pace 計畫的目標是到 2031 財年累計節省約 25 億美元，稅前費用約 10 億美元（主要是員工相關成本）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src31&quot;&gt;[31]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src32&quot;&gt;[32]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對照數字&lt;/div&gt;&lt;ul class=&quot;ev&quot;&gt;&lt;li class=&quot;s&quot;&gt;第一季營運費用（不含需求創造）年減 6%，主要是薪資相關與行政費用下降；需求創造費用年增 5%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src33&quot;&gt;[33]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src34&quot;&gt;[34]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;li class=&quot;s&quot;&gt;近四季營業利益 37.58 億美元、營業利益率 8.2%（推算），其中含 2026 財年第四季認列的 9.86 億美元 IEEPA 關稅退款；扣除後約 6.0%，一年前的近四季約 7.4%（推算）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src35&quot;&gt;[35]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src36&quot;&gt;[36]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src37&quot;&gt;[37]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;li class=&quot;s&quot;&gt;BNP Paribas 分析師指出 Pace 是 2024 財年以來第三個重組計畫，至今沒有看到營運槓桿。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src38&quot;&gt;[38]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;lbl&quot;&gt;說明&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;費用面確實在降，但扣除關稅退款後的利潤率比一年前低，節省還沒有變成利潤；25 億美元是到 2031 財年的預期，現在只能驗證開頭。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src33&quot;&gt;[33]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src35&quot;&gt;[35]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src38&quot;&gt;[38]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card claim cv-說法未獲數字支持&quot; id=&quot;cl5&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;為長期成長重新定位&lt;/b&gt;&lt;span class=&quot;v v-說法未獲數字支持&quot;&gt;說法未獲數字支持&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;管理層說法&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;Hill 在 2026 財年第四季新聞稿說公司已採取果斷行動、強化基礎，替長期成長重新定位。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src39&quot;&gt;[39]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對照數字&lt;/div&gt;&lt;ul class=&quot;ev&quot;&gt;&lt;li class=&quot;s&quot;&gt;2026 財年營收 463.98 億美元，比前一年只多 0.2%；2027 財年第一季年減 4%（幣別中性 −5%），全年指引衰退高個位數。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src40&quot;&gt;[40]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src41&quot;&gt;[41]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src2&quot;&gt;[2]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;li class=&quot;s&quot;&gt;Retail Dive 報導管理層在電話會議表示，修復業務的陣痛會延續本財年與下一財年。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src38&quot;&gt;[38]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;lbl&quot;&gt;說明&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;到目前為止營收沒有回到成長，管理層自己也把陣痛延到 2028 財年；「重新定位」還只是方向，數字尚未支持。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src2&quot;&gt;[2]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src38&quot;&gt;[38]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;s3&quot;&gt;&lt;h2&gt;3　成長引擎與卡點&lt;/h2&gt;&lt;h3&gt;成長從哪裡來（量、價、新產品、新市場、併購）&lt;/h3&gt;&lt;div class=&quot;cards&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;span class=&quot;chip&quot;&gt;量&lt;/span&gt;&lt;span class=&quot;qz&quot;&gt;能否量化：可量化&lt;/span&gt;&lt;/div&gt;&lt;b&gt;北美批發回補與擴大鋪貨&lt;/b&gt;&lt;div class=&quot;lbl&quot;&gt;證據&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;北美批發 2026 財年 +14%、2027 財年第一季 +9%（幣別中性），來源是擴大鋪貨與對既有客戶出貨增加。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src24&quot;&gt;[24]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src3&quot;&gt;[3]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;批發回補有上限：當鋪貨恢復到正常水準，成長要回到終端銷售（sell-through），所以這個引擎的增速會遞減。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src18&quot;&gt;[18]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src42&quot;&gt;[42]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;span class=&quot;chip&quot;&gt;價&lt;/span&gt;&lt;span class=&quot;qz&quot;&gt;能否量化：可量化&lt;/span&gt;&lt;/div&gt;&lt;b&gt;策略性調價（服飾已見效、鞋類被折扣抵銷）&lt;/b&gt;&lt;div class=&quot;lbl&quot;&gt;證據&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;第一季服飾平均單價貢獻約 4 個百分點的成長（產品組合與策略定價）；鞋類平均單價反而拖累約 1 個百分點（通路組合與較高折扣，部分被策略定價抵銷）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src29&quot;&gt;[29]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src27&quot;&gt;[27]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;span class=&quot;chip&quot;&gt;新產品&lt;/span&gt;&lt;span class=&quot;qz&quot;&gt;能否量化：待查&lt;/span&gt;&lt;/div&gt;&lt;b&gt;專業運動產品創新（跑步、籃球、足球）&lt;/b&gt;&lt;div class=&quot;lbl&quot;&gt;證據&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;公司把加速產品創新、減少部分鞋款在市場上的供給列為產品管理重點。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src43&quot;&gt;[43]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-待查&quot;&gt;待查&lt;/span&gt;待查：申報沒有揭露各運動類別或新品營收；目前只有管理層在電話會議口述跑步雙位數成長（新聞 N4 §2）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src30&quot;&gt;[30]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;span class=&quot;chip&quot;&gt;新市場&lt;/span&gt;&lt;span class=&quot;qz&quot;&gt;能否量化：可量化&lt;/span&gt;&lt;/div&gt;&lt;b&gt;無新市場擴張；大中華區是收縮中的既有市場&lt;/b&gt;&lt;div class=&quot;lbl&quot;&gt;證據&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;2027 財年第一季大中華區幣別中性 −26%，批發 −31%、直營 −18%；10-K 寫大中華區的負面影響延續整個 2027 財年。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src4&quot;&gt;[4]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src44&quot;&gt;[44]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;近年沒有新地區或併購帶來的成長；Pace 計畫在印度設園區屬組織與成本安排，不是新市場營收。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src45&quot;&gt;[45]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;近 12 季：營收年增與營業利益率&lt;/figcaption&gt;&lt;svg viewBox=&quot;0 0 680 250&quot; role=&quot;img&quot; aria-label=&quot;近幾季單季營收年增與營業利益率&quot;&gt;&lt;line x1=&quot;50&quot; x2=&quot;640&quot; y1=&quot;216.0&quot; y2=&quot;216.0&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;220.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;-15%&lt;/text&gt;&lt;line x1=&quot;50&quot; x2=&quot;640&quot; y1=&quot;167.0&quot; y2=&quot;167.0&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;171.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;-10%&lt;/text&gt;&lt;line x1=&quot;50&quot; x2=&quot;640&quot; y1=&quot;118.0&quot; y2=&quot;118.0&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;122.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;-5%&lt;/text&gt;&lt;line x1=&quot;50&quot; x2=&quot;640&quot; y1=&quot;69.0&quot; y2=&quot;69.0
