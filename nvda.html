;&lt;td&gt;基準穩態（45.0%）&lt;/td&gt;&lt;td&gt;29.9%&lt;/td&gt;&lt;td&gt;13.7 倍&lt;/td&gt;&lt;td&gt;歷史罕見&lt;/td&gt;&lt;td&gt;自足&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;10 倍／10 年&lt;/td&gt;&lt;td&gt;產業（51.7）&lt;/td&gt;&lt;td&gt;近四季（65.2%）&lt;/td&gt;&lt;td&gt;15.1%&lt;/td&gt;&lt;td&gt;4.1 倍&lt;/td&gt;&lt;td&gt;歷史罕見&lt;/td&gt;&lt;td&gt;自足&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;10 倍／10 年&lt;/td&gt;&lt;td&gt;產業（51.7）&lt;/td&gt;&lt;td&gt;基準穩態（45.0%）&lt;/td&gt;&lt;td&gt;19.5%&lt;/td&gt;&lt;td&gt;5.9 倍&lt;/td&gt;&lt;td&gt;歷史罕見&lt;/td&gt;&lt;td&gt;自足&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/details&gt;&lt;p class=&quot;cap&quot;&gt;限制：&lt;/p&gt;&lt;ul class=&quot;cap&quot;&gt;&lt;li&gt;Base Rate Book 1950–2015、只含存續公司（存活偏差）；原表 10 年欄，5 年期待建立&lt;/li&gt;&lt;li&gt;非營業淨資產假設不變；資金缺口另列，不回頭改期末市值&lt;/li&gt;&lt;li&gt;均值回歸以本益比近似 EV÷稅後營業利益；產業倍數是 Damodaran 目前值，不是成熟期值&lt;/li&gt;&lt;li&gt;罕見度是歷史上多少公司做到，不是這家公司做到的機率&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;!--目標區間:附錄--&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;目標區間的倍數核對（只列不合成）&lt;/h3&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt&quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;倍數區段&lt;/th&gt;&lt;th&gt;倍數（EV／營業利益）&lt;/th&gt;&lt;th&gt;第 1 年獲利（百萬美元）&lt;/th&gt;&lt;th&gt;核對區間（美元）&lt;/th&gt;&lt;th&gt;代表值需要倍數&lt;/th&gt;&lt;th&gt;主方法代表值對核對區間中點&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;同規模同成長 p25～中位&lt;/td&gt;&lt;td&gt;9.19–16.95&lt;/td&gt;&lt;td&gt;268,612&lt;/td&gt;&lt;td&gt;105.22–191.02&lt;/td&gt;&lt;td&gt;6.3&lt;/td&gt;&lt;td&gt;−51%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;現在倍數～自身近五年 p25&lt;/td&gt;&lt;td&gt;6.71–18.67&lt;/td&gt;&lt;td&gt;315,088&lt;/td&gt;&lt;td&gt;90.58–245.81&lt;/td&gt;&lt;td&gt;9.6&lt;/td&gt;&lt;td&gt;−24%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;自身近五年中位～p75&lt;/td&gt;&lt;td&gt;26.68–40.64&lt;/td&gt;&lt;td&gt;349,929&lt;/td&gt;&lt;td&gt;388.01–589.17&lt;/td&gt;&lt;td&gt;14.7&lt;/td&gt;&lt;td&gt;−56%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;各情境第 1 年營業利益（假設，推導；不是公司指引）。每股 =（倍數 × 獲利 − 股權橋 -86,236）÷ 24,285.0 百萬股，與估值引擎同口徑。倍數維持現在倍數不變、只看獲利，每股 ＝（現在倍數 × 第 1 年獲利 − 股權橋）÷ 股數：保守 210.1、基準 245.8、樂觀 272.6（美元）。倍數核對回答「市場一年後照這種擔憂程度給倍數，價格會在哪」；與主方法的差距是價值與市場慣例的落差，不合成、不平均。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;目標區間的企業價值前推核對&lt;/h3&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt&quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;股權成本前推（每股，折現率基準）&lt;/th&gt;&lt;th&gt;企業價值前推（每股）&lt;/th&gt;&lt;th&gt;相對差距&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;72.90&lt;/td&gt;&lt;td&gt;72.45&lt;/td&gt;&lt;td&gt;0.62%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;128.47&lt;/td&gt;&lt;td&gt;127.99&lt;/td&gt;&lt;td&gt;0.38%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;215.40&lt;/td&gt;&lt;td&gt;214.87&lt;/td&gt;&lt;td&gt;0.25%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;EV₀×（1＋WACC）−股權橋 與 每股價值×（1＋股權成本）的差；差距≥1% 只標註（槓桿較高時前者未計利息），不改目標區間。最大相對差距 0.62%（小於 1%）。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;各段代表值需要的倍數與歷史位置&lt;/h3&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt&quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;需要倍數（EV／營業利益）&lt;/th&gt;&lt;th&gt;相對現在 18.7 倍&lt;/th&gt;&lt;th&gt;自身近一年高於／低於此倍數的交易日比例&lt;/th&gt;&lt;th&gt;自身近五年（存檔四分位內插）&lt;/th&gt;&lt;th&gt;同規模同成長&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;6.3&lt;/td&gt;&lt;td&gt;低於&lt;/td&gt;&lt;td&gt;99% 以上／不到 1%&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;低於 p25&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;低於 p25&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;9.6&lt;/td&gt;&lt;td&gt;低於&lt;/td&gt;&lt;td&gt;99% 以上／不到 1%&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;約第 29 百分位（p25–p75 間線性內插，推導）&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;約第 26 百分位（p25–p75 間線性內插，推導）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;14.7&lt;/td&gt;&lt;td&gt;低於&lt;/td&gt;&lt;td&gt;99% 以上／不到 1%&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;約第 35 百分位（p25–p75 間線性內插，推導）&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;約第 43 百分位（p25–p75 間線性內插，推導）&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;需要倍數＝（代表值×股數＋股權橋）÷ 情境第 1 年獲利（推導）；是把價值翻成倍數的讀法，不是預測市場會給這個倍數。自身近一年比例：近一年每日 EV／近四季獲利（申報日後才可用）重建，四分位與市場給價存檔一致；推導（2025-11-17 至 2026-11-17，252 個交易日）。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;約 12 個月選擇權隱含分布&lt;/h3&gt;&lt;p class=&quot;cap&quot;&gt;未取得：到期日 2027-12-17 價平附近沒有有效報價（盤前盤後或無成交時 Yahoo 常給佔位值）。不補值、不外推。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;預估修正趨勢（只描述，不當證據）&lt;/h3&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt&quot;&gt;&lt;tr&gt;&lt;th&gt;期間&lt;/th&gt;&lt;th&gt;每股盈餘預估&lt;/th&gt;&lt;th&gt;7 天前&lt;/th&gt;&lt;th&gt;30 天前&lt;/th&gt;&lt;th&gt;60 天前&lt;/th&gt;&lt;th&gt;90 天前&lt;/th&gt;&lt;th&gt;較 30 天前&lt;/th&gt;&lt;th&gt;近 7 天上修／下修家數&lt;/th&gt;&lt;th&gt;近 30 天上修／下修家數&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;本季&lt;/td&gt;&lt;td&gt;2.48&lt;/td&gt;&lt;td&gt;2.47&lt;/td&gt;&lt;td&gt;2.47&lt;/td&gt;&lt;td&gt;2.47&lt;/td&gt;&lt;td&gt;2.35&lt;/td&gt;&lt;td&gt;持平&lt;/td&gt;&lt;td&gt;0／1&lt;/td&gt;&lt;td&gt;0／1&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;下一季&lt;/td&gt;&lt;td&gt;2.75&lt;/td&gt;&lt;td&gt;2.75&lt;/td&gt;&lt;td&gt;2.75&lt;/td&gt;&lt;td&gt;2.74&lt;/td&gt;&lt;td&gt;2.66&lt;/td&gt;&lt;td&gt;持平&lt;/td&gt;&lt;td&gt;0／1&lt;/td&gt;&lt;td&gt;0／1&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;本財年&lt;/td&gt;&lt;td&gt;9.32&lt;/td&gt;&lt;td&gt;9.31&lt;/td&gt;&lt;td&gt;9.31&lt;/td&gt;&lt;td&gt;9.30&lt;/td&gt;&lt;td&gt;8.96&lt;/td&gt;&lt;td&gt;持平&lt;/td&gt;&lt;td&gt;2／0&lt;/td&gt;&lt;td&gt;2／0&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;下一財年&lt;/td&gt;&lt;td&gt;15.93&lt;/td&gt;&lt;td&gt;15.91&lt;/td&gt;&lt;td&gt;15.91&lt;/td&gt;&lt;td&gt;15.57&lt;/td&gt;&lt;td&gt;12.82&lt;/td&gt;&lt;td&gt;持平&lt;/td&gt;&lt;td&gt;3／0&lt;/td&gt;&lt;td&gt;7／0&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;分析師預估與券商目標價只描述，不當證據，也不是目標區間任一端；上修／下修門檻為較 30 天前變動 ±1%（本工具設定；與「市價溢價來源」預估修正以 90 天 ±2% 判持平是兩個口徑）。資料取得 2026-11-13T01:09:36（台北時間）（yfinance eps_trend、eps_revisions）。券商目標價近 90 天 24 家調整：上調 7、下調 11、持平 6；上季財報驚奇（Nasdaq）：Jul 2026，8/26/2026 公布，每股盈餘 2.22、共識 2.09、驚奇 6.22%；（yfinance）：2026-07-31，實際 2.22、預估 2.09113。兩個來源口徑可能不同（可能是調整後或一般會計準則）；公司申報的每股盈餘可對照存檔 8-K 2026-08-26 財報新聞稿（事件/8K事件.json），本工具未逐項比對，只描述，不比較、不當證據。每批另存快照自建歷史：1 筆（2026-11-13 至 2026-11-13）。&lt;/p&gt;&lt;/div&gt;&lt;!--/目標區間:附錄--&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;成長性四問（細表）&lt;/h3&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;成長性四問：過去、品質、股價要求、模型假設&lt;/h4&gt;&lt;p&gt;&lt;b&gt;一句話：&lt;/b&gt;成長不穩定、難預期；成長品質好；股價要求的成長不高；本報告的基準假設積極。&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt&quot;&gt;&lt;tr&gt;&lt;th&gt;面向&lt;/th&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;數字&lt;/th&gt;&lt;th&gt;判讀&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;實績&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;長期營收年複合（2016～2026）&lt;/td&gt;&lt;td&gt;+45.7%&lt;/td&gt;&lt;td rowspan=&quot;2&quot; style=&quot;text-align:left;vertical-align:top&quot;&gt;&lt;span style=&quot;color:#a33a2b;font-weight:700&quot;&gt;● 不穩定、難預期&lt;/span&gt;&lt;br&gt;&lt;span style=&quot;font-size:12px;color:#7a7f7c&quot;&gt;近 8 季單季年增波動 15.5 個百分點，長期年複合 +45.7%&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;實績&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;近四季營收年增（一年前）&lt;/td&gt;&lt;td&gt;+83.4%（+71.6%）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;品質&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;新增投資的回報（增量 ROIC）&lt;/td&gt;&lt;td&gt;+185.8%&lt;/td&gt;&lt;td rowspan=&quot;3&quot; style=&quot;text-align:left;vertical-align:top&quot;&gt;&lt;span style=&quot;color:#2f6b4f;font-weight:700&quot;&gt;● 好：新增投入的回報高於資金成本&lt;/span&gt;&lt;br&gt;&lt;span style=&quot;font-size:12px;color:#7a7f7c&quot;&gt;增量 ROIC +185.8%、近五年 ROIC 中位 +110.8%，資金成本 11.5%&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;品質&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;存貨、應收增速減營收增速&lt;/td&gt;&lt;td&gt;+27.7%、+43.4%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;品質&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;再投資能支撐的成長&lt;/td&gt;&lt;td&gt;+74.6%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股價要求&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;現價隱含的未來 5 年營收年增&lt;/td&gt;&lt;td&gt;+18.1%（折現率高低 +20.2%～+15.9%）&lt;/td&gt;&lt;td rowspan=&quot;2&quot; style=&quot;text-align:left;vertical-align:top&quot;&gt;&lt;span style=&quot;color:#2f6b4f;font-weight:700&quot;&gt;● 不高：過去的成長就做得到&lt;/span&gt;&lt;br&gt;&lt;span style=&quot;font-size:12px;color:#7a7f7c&quot;&gt;市價要求每年 +18.1%&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股價要求&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;本益比在自身近五年的位置&lt;/td&gt;&lt;td&gt;低於自身最低（申報 EPS 本益比 19.7 倍，近五年中位 56.0 倍）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;模型假設&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;基準情境第 1 年營收成長&lt;/td&gt;&lt;td&gt;+60.0%&lt;/td&gt;&lt;td rowspan=&quot;3&quot; style=&quot;text-align:left;vertical-align:top&quot;&gt;&lt;span style=&quot;color:#a33a2b;font-weight:700&quot;&gt;● 積極&lt;/span&gt;&lt;br&gt;&lt;span style=&quot;font-size:12px;color:#7a7f7c&quot;&gt;基準首年 +60.0%，同規模公司 -0.0%～+20.8%，最新單季年增 +105.9%&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;模型假設&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;同類公司次年營收成長（中間一半）&lt;/td&gt;&lt;td&gt;+6.0%～+40.0%，中位 +22.0%；同規模（n=601）-0.0%～+20.8%，中位 +9.6%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;模型假設&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;同規模公司十年實質營收年增中位&lt;/td&gt;&lt;td&gt;+1.1%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;判讀由固定規則從表內數字算出，不影響估值與研究評等：實績看近 8 季單季年增的波動（6 個百分點內為穩定、超過 12 為不穩定）與長期方向；品質看新增投入與近五年的回報是否高於資金成本（虧損或增量回報為負為弱）；股價要求看市價隱含的未來 5 年年增是否超過過去實績、是否超過同類公司次年的 p75；模型假設看基準第 1 年是否落在同類公司 p25–p75 或貼近最新單季年增；股價要求與模型假設的同類公司，用同成長組再依規模或產業細分、樣本至少 300 家的最細一組。「同類公司」是本工作流回溯 2014–2025 年約 2,000 家美股、近一年成長相近者次年的實際分布，只是參考，不是預測；存貨或應收增得比營收快不代表成長轉弱，不列入判讀。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;估值方法與參數&lt;/h3&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;方法&lt;/th&gt;&lt;th&gt;低&lt;/th&gt;&lt;th&gt;中&lt;/th&gt;&lt;th&gt;高&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;DCF 保守&lt;/td&gt;&lt;td&gt;61&lt;/td&gt;&lt;td&gt;66&lt;/td&gt;&lt;td&gt;73&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;DCF 基準&lt;/td&gt;&lt;td&gt;105&lt;/td&gt;&lt;td&gt;116&lt;/td&gt;&lt;td&gt;130&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;DCF 樂觀&lt;/td&gt;&lt;td&gt;173&lt;/td&gt;&lt;td&gt;194&lt;/td&gt;&lt;td&gt;221&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;同業本益比&lt;/td&gt;&lt;td&gt;279&lt;/td&gt;&lt;td&gt;358&lt;/td&gt;&lt;td&gt;497&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;同業企業價值／營業利益&lt;/td&gt;&lt;td&gt;486&lt;/td&gt;&lt;td&gt;662&lt;/td&gt;&lt;td&gt;746&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;同業企業價值／營收&lt;/td&gt;&lt;td&gt;201&lt;/td&gt;&lt;td&gt;228&lt;/td&gt;&lt;td&gt;230&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p style=&quot;font-size:14px&quot;&gt;折現率基準 11.5%（區間 10.5%–12.5%）：無風險利率 5.12%、市場風險溢價 4.20%、beta 1.54。DCF 為 15 年：前 5 年依情境，後 10 年成長與利潤率逐步回到永續水準。&lt;/p&gt;&lt;p style=&quot;font-size:14px&quot;&gt;同業：AMD（資料中心 GPU 加速器直接競爭者）, AVGO（客製 AI 加速晶片（ASIC）與資料中心網路，與 NVDA 運算及網路業務競爭）, MRVL（客製 AI 晶片與資料中心互連；市值不到 NVDA 十分之一，規模不可比，因同屬資料中心晶片的無晶圓廠模式仍列交叉核對）, QCOM（無晶圓廠大型半導體設計公司；市值不到 NVDA 十分之一，規模不可比，只比較無晶圓廠的利潤結構與倍數口徑）。排除：INTC：D 獲利或現金流不可算：自有晶圓廠、轉型虧損期，倍數失真, TSM：C 經營模式不同：NVDA 主要代工供應商，晶圓製造重資產，與無晶圓廠設計不同。&lt;/p&gt;&lt;p style=&quot;font-size:14px&quot;&gt;產業公版：景氣循環／半導體／正常化；驗證狀態：待驗證（一家）；本公司尚未列入實例。首家產業，公版的估值法與指標選擇尚未經兩家以上驗證，審查與讀者請多看適用性。&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;details id=&quot;wp-value&quot;&gt;&lt;summary&gt;價值判斷：PEG、林區資產負債表檢查與交叉檢查&lt;/summary&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;PEG 與林區檢查&lt;/h3&gt;&lt;div class=&quot;wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;PEG：可計算的成長口徑（紅線為 1 與 2）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 500 142&quot; role=&quot;img&quot; aria-label=&quot;PEG&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;168.0&quot; x2=&quot;168.0&quot; y1=&quot;6&quot; y2=&quot;136&quot; class=&quot;zero&quot;/&gt;&lt;line x1=&quot;292.5&quot; x2=&quot;292.5&quot; y1=&quot;4&quot; y2=&quot;138&quot; class=&quot;price&quot;/&gt;&lt;line x1=&quot;417.1&quot; x2=&quot;417.1&quot; y1=&quot;4&quot; y2=&quot;138&quot; class=&quot;price&quot;/&gt;&lt;text x=&quot;158&quot; y=&quot;23&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;過去三年 EPS 年增&lt;/text&gt;&lt;rect x=&quot;168.0&quot; y=&quot;9&quot; width=&quot;11.8&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;187.8&quot; y=&quot;23&quot; class=&quot;val&quot;&gt;0.1&lt;/text&gt;&lt;text x=&quot;158&quot; y=&quot;63&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;近四季對上一財年&lt;/text&gt;&lt;rect x=&quot;168.0&quot; y=&quot;49&quot; width=&quot;39.8&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;215.8&quot; y=&quot;63&quot; class=&quot;val&quot;&gt;0.3&lt;/text&gt;&lt;text x=&quot;158&quot; y=&quot;103&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;基準情境推估&lt;/text&gt;&lt;rect x=&quot;168.0&quot; y=&quot;89&quot; width=&quot;184.1&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;360.1&quot; y=&quot;103&quot; class=&quot;val&quot;&gt;1.5&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;PEG 與林區加股利比率（可計算的成長口徑）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;成長口徑&lt;/th&gt;&lt;th&gt;成長率&lt;/th&gt;&lt;th&gt;PEG&lt;/th&gt;&lt;th&gt;判讀&lt;/th&gt;&lt;th&gt;加股利比率&lt;/th&gt;&lt;th&gt;判讀&lt;/th&gt;&lt;th&gt;加股東收益率比率（現代延伸）&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;過去三年 EPS 年增&lt;/td&gt;&lt;td&gt;206.6%&lt;/td&gt;&lt;td&gt;0.1&lt;/td&gt;&lt;td&gt;基期失真，不具參考性&lt;/td&gt;&lt;td&gt;10.52&lt;/td&gt;&lt;td&gt;好&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;近四季對上一財年（申報 EPS）&lt;/td&gt;&lt;td&gt;61.4%&lt;/td&gt;&lt;td&gt;0.3&lt;/td&gt;&lt;td&gt;基期失真，不具參考性&lt;/td&gt;&lt;td&gt;3.13&lt;/td&gt;&lt;td&gt;好&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準情境推估（稅後營業利益年增－股數年變化）&lt;/td&gt;&lt;td&gt;13.3%&lt;/td&gt;&lt;td&gt;1.5&lt;/td&gt;&lt;td&gt;合理&lt;/td&gt;&lt;td&gt;0.69&lt;/td&gt;&lt;td&gt;差&lt;/td&gt;&lt;td&gt;0.75&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;加股東收益率比率＝（成長率＋股利殖利率＋淨回購殖利率）÷本益比，把回購也算進股東回饋、並扣掉發給員工的股票；這是現代延伸，不是林區原版，也沒有政策門檻，只列數字。 PEG 用的每股盈餘 7.91 美元：PEG 所用 EPS 為一般會計 EPS，未扣非經常項目，含股權薪酬（近四季淨利每股 7.91、每股股權薪酬 0.30）。&lt;/p&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:4px&quot;&gt;PEG 的判讀標籤依估值政策門檻；高風險、成長極高或極低的公司，PEG 有系統性偏誤（同樣成長下風險越高 PEG 越低），不能只憑標籤判斷便宜或昂貴。&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;林區式資產負債表與市場檢查&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;數值&lt;/th&gt;&lt;th&gt;林區的看法&lt;/th&gt;&lt;th&gt;判讀&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;本益比&lt;/td&gt;&lt;td&gt;19.65&lt;/td&gt;&lt;td&gt;與自身歷史比較&lt;/td&gt;&lt;td&gt;偏便宜：申報 EPS 為 19.7 倍，位於過去五年第 0% 百分位（自身近五年 p25／p75 外才判偏便宜／偏貴）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;每股淨現金&lt;/td&gt;&lt;td&gt;0.96&lt;/td&gt;&lt;td&gt;淨現金可提供下檔保護（林區 O31、LAK02）&lt;/td&gt;&lt;td&gt;好：有淨現金，可提供下檔保護；占股價 0.6%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;負債對權益&lt;/td&gt;&lt;td&gt;0.15&lt;/td&gt;&lt;td&gt;一般越低越好（林區 L25）&lt;/td&gt;&lt;td&gt;不評好壞：有息負債約為股東權益的 0.15 倍；沒有公認門檻，償債能力見收現段償債指標&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;每股自由現金流（近四季）&lt;/td&gt;&lt;td&gt;5.21&lt;/td&gt;&lt;td&gt;比每股盈餘更接近現金（林區 O37、修正10）&lt;/td&gt;&lt;td&gt;不評好壞：自由現金流殖利率 3.4%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股數年變化（近三財年）&lt;/td&gt;&lt;td&gt;-0.7%&lt;/td&gt;&lt;td&gt;持續買回、且價格合理、資金來自本業現金時才是好訊號（林區 L16、O19）&lt;/td&gt;&lt;td&gt;好：近三財年平均每年 -0.7%；最近一季對去年同季 -1.0%（2025-07-27→2026-07-26）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;存貨增速 vs 營收增速&lt;/td&gt;&lt;td&gt;111%&lt;/td&gt;&lt;td&gt;存貨增速高於營收是警訊（林區 O50）&lt;/td&gt;&lt;td&gt;注意：存貨 +111%（2025-07-27→2026-07-26）vs 營收 +83%（近四季對前四季，各截至 2026-07-26、2025-07-27）：警訊，須查原因&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;內部人公開市場買進&lt;/td&gt;&lt;td&gt;0&lt;/td&gt;&lt;td&gt;內部人自掏腰包買進是強訊號&lt;/td&gt;&lt;td&gt;中性：近期無人買進；賣出原因多，訊號較弱&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;林區以外的交叉檢查（只揭露，不改研究評等與價格位置）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;檢查&lt;/th&gt;&lt;th&gt;結果&lt;/th&gt;&lt;th&gt;判讀&lt;/th&gt;&lt;th&gt;依據與限制&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Piotroski F 分數（財報是否在改善）&lt;/td&gt;&lt;td&gt;3 ／ 8 項（2025-01-26→2026-01-25）&lt;/td&gt;&lt;td&gt;中&lt;/td&gt;&lt;td&gt;未通過：ROA 比上年高、營運現金流＞淨利（應計少）、毛利率比上年高、資產周轉率比上年高（營收 ÷ 期初總資產）、流動比率比上年高。Piotroski（2000）研究文獻/Piotroski2000_財報訊號.json 第 9–11、15 頁；8–9 分高分組、0–2 分低分組&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Beneish M 分數（盈餘被美化的機率）&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;待核對&lt;/td&gt;&lt;td&gt;Beneish（1999）原文未存檔，係數與分界未核對；折舊用折舊攤銷合計（近似）。待使用者同意下載原文存檔後才列入報告&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Greenblatt 盈餘殖利率與資本報酬率&lt;/td&gt;&lt;td&gt;盈餘殖利率 5.3%；ROIC 243%&lt;/td&gt;&lt;td&gt;高於 10 年公債 5.1%；ROIC 243% 高於 WACC 11.5%&lt;/td&gt;&lt;td&gt;盈餘殖利率＝近四季營業利益 ÷（市值＋有息負債－現金與證券），推導；ROIC 為本專案稅後口徑，非 Greenblatt 原式稅前；不做排名&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;details id=&quot;wp-6&quot;&gt;&lt;summary&gt;6 財務：償債指標、融資活動、存活檢查與利率壓力測試（含判定規則與限制）&lt;/summary&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;融資活動與償債：錢還給誰、有沒有借錢、還不還得起&lt;/h3&gt;&lt;p class=&quot;cap&quot;&gt;利息保障改讀信用與存活的利息口徑（EBIT ÷ 近四季利息費用（作者讀附註：10-K 2026-01-25 Item 7 ¶85；10-Q 2026-07-26 Part I, Item 1 ¶151；推算：FY2026 全年 259＋FY2027 上半年 329−去年同期 124＝464；利息費用主要為票面利息與折價攤銷，10-K Item 7 ¶87。2026-06 新增 250 億票據只計入約兩個月，年化利息會高於此數。）），底稿的利息費用科目未對應。&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;償債能力指標（利息保障依 Damodaran 合成評等對照；其他沒有公認門檻，只寫事實）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;指標&lt;/th&gt;&lt;th&gt;數值&lt;/th&gt;&lt;th&gt;判讀&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;EBIT ÷ 利息費用&lt;/td&gt;&lt;td&gt;425.82&lt;/td&gt;&lt;td&gt;相當於 AAA 級：EBIT 是利息費用的 425.8 倍；依 Damodaran 合成評等大型公司對照表（2026 年 1 月；市值 37,753.5 億美元，在 50 億美元以上）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;（營運現金流＋實付利息）÷ 實付利息&lt;/td&gt;&lt;td&gt;未取得&lt;/td&gt;&lt;td&gt;資料限制：用實際現金算的付息能力無法計算（實付利息未取得：附註未申報此項或科目未對應）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;有息負債 ÷ EBITDA&lt;/td&gt;&lt;td&gt;0.17&lt;/td&gt;&lt;td&gt;不評好壞：以近四季 EBITDA 2,012.7 億美元計，約 0.2 年可還清有息負債&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;淨負債 ÷ EBITDA&lt;/td&gt;&lt;td&gt;-0.12&lt;/td&gt;&lt;td&gt;不評好壞：現金多於有息負債（淨現金）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;營運現金流 ÷ 有息負債&lt;/td&gt;&lt;td&gt;402.7%&lt;/td&gt;&lt;td&gt;不評好壞：一年的營運現金流約可還掉 403% 的有息負債（約 0.2 年還清）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;現金與證券 ÷ 一年內到期債務&lt;/td&gt;&lt;td&gt;56.59&lt;/td&gt;&lt;td&gt;資料限制：一年內到期債務只取得部分科目，56.6 倍可能高估（部分缺漏（只取得一年內到期長債；另一項可能未發生或未對應，未核對前不當零））&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;可用授信與到期（作者判讀，融資償債判讀.json）：一年內到期 1,000（3.20% 票據 2026 年到期）；商業本票計畫容量 250 億美元，期末無餘額；未申報循環信貸額度&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;融資活動現金流：還給股東與借還款（本財年年初至 2026-07-26 累計，10-Q 2026-07-26）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;對象｜分類&lt;/th&gt;&lt;th&gt;金額&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股東｜回購&lt;/td&gt;&lt;td&gt;-390 億美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股東｜股利&lt;/td&gt;&lt;td&gt;-62.9 億美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股東｜員工股票代扣稅與相關淨額&lt;/td&gt;&lt;td&gt;-45.3 億美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股東｜增資與員工認股&lt;/td&gt;&lt;td&gt;515.0 百萬美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股東小計&lt;/td&gt;&lt;td&gt;-494 億美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;債權人｜借入&lt;/td&gt;&lt;td&gt;249 億美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;債權人小計&lt;/td&gt;&lt;td&gt;249 億美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;其他｜其他（未歸類）&lt;/td&gt;&lt;td&gt;-30.1 億美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;其他小計&lt;/td&gt;&lt;td&gt;-30.1 億美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;對照：同期營運現金流&lt;/td&gt;&lt;td&gt;744 億美元&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;融資活動是公司與出資人（股東、債權人）之間的現金往來，不等於借款：回購、股利是還給股東，借入、償還才是借款；負數＝現金流出。本表期間與下方借款用途、上方現金流分層（近四季）不同。&lt;/p&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;借款用途（研究判讀）：再融資無關；2026-06 發行 250 億美元優先無擔保票據，公司寫明用於一般公司用途，用途未細分（回購、投資或承諾皆有可能，只算線索）；期間 FY2027 上半年（至 2026-07-26）；依據：10-Q 2026-07-26 Part I, Item 2 ¶105、10-Q 2026-07-26 Part I, Item 1 ¶176、10-Q 2026-07-26 Part I, Item 1 ¶38&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;survival-detail&quot;&gt;&lt;h3&gt;存活檢查：現金對債務（12～24 個月，推導，非違約預測）&lt;/h3&gt;&lt;p style=&quot;margin:0 0 6px&quot;&gt;&lt;b&gt;信用評級&lt;/b&gt;　機構 未揭露（10-K、10-Q、8-K、SEC 全文搜尋 查無 S&amp;amp;P、Moody&amp;#x27;s、Fitch、KBRA 評級）／推導 AAA（Damodaran 合成評等，利息保障 425.8 倍，近四季新借款多、利息偏低、評級可能偏高，推導）｜依推導：投資等級（BBB-／Baa3 以上）&lt;/p&gt;&lt;p style=&quot;margin:0 0 6px&quot;&gt;&lt;b&gt;存活檢查（完整理由）&lt;/b&gt;　無明顯警訊（推導，非違約預測）：現金與證券 566 億美元，一年內到期債務 10 億美元（另利息 464.0 百萬美元），可付 38.7 倍；兩年內到期債務未取得；利息保障 425.8 倍（新借款多、利息偏低，倍數可能偏高）；會計師未提出繼續經營疑慮。&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;燈號：無明顯警訊（一般公司：現金對債務；資料截至 2026-07-26，收盤日 2026-11-17）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;判定&lt;/th&gt;&lt;th&gt;內容與出處&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;會計師繼續經營疑慮&lt;/td&gt;&lt;td&gt;無明顯警訊&lt;/td&gt;&lt;td&gt;會計師與管理層未提出繼續經營疑慮（掃描 10-Q 2026-07-26、10-K 2026-01-25）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;流動性：12 個月&lt;/td&gt;&lt;td&gt;無明顯警訊&lt;/td&gt;&lt;td&gt;現金與證券 56,586.0（未動用信貸未取得，未計入），一年內到期本金 1,000.0，加利息 464.0（利息偏低，未含新借款全年利息），可付 38.7 倍&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;流動性：24 個月&lt;/td&gt;&lt;td&gt;資料不足&lt;/td&gt;&lt;td&gt;24 個月到期本金或現金未取得，無法比較&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;利息保障&lt;/td&gt;&lt;td&gt;無明顯警訊&lt;/td&gt;&lt;td&gt;利息保障 425.8 倍（近四季借還款淨額 24,896 占有息負債 75%（大額新借款），近四季利息費用（作者讀附註：10-K 2026-01-25 Item 7 ¶85；10-Q 2026-07-26 Part I, Item 1 ¶151；推算：FY2026 全年 259＋FY2027 上半年 329−去年同期 124＝464；利息費用主要為票面利息與折價攤銷（10-K Item 7 ¶87）。2026-06 新增 250 億票據只計入約兩個月，年化利息會高於此數。） 464 只含新債的部分期間，偏低；未能年化，倍數可能偏高）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Altman Z 分數&lt;/td&gt;&lt;td&gt;輔助（不改燈號）&lt;/td&gt;&lt;td&gt;Altman Z 29.33（安全區，只當輔助）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;回饋股東對自由現金流&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;近四季回購加股利 621 億美元，未超過自由現金流 1,270 億美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;信用評級（機構）&lt;/td&gt;&lt;td&gt;未揭露&lt;/td&gt;&lt;td&gt;公司申報查無 S&amp;amp;P、Moody&amp;#x27;s、Fitch、KBRA 評級&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;信用評級（推導）&lt;/td&gt;&lt;td&gt;投資等級&lt;/td&gt;&lt;td&gt;AAA：Damodaran 合成評等 2026 年 1 月（大型公司表），利息保障 425.8 倍（EBIT ÷ 近四季利息費用（作者讀附註：10-K 2026-01-25 Item 7 ¶85；10-Q 2026-07-26 Part I, Item 1 ¶151；推算：FY2026 全年 259＋FY2027 上半年 329−去年同期 124＝464；利息費用主要為票面利息與折價攤銷（10-K Item 7 ¶87）。2026-06 新增 250 億票據只計入約兩個月，年化利息會高於此數。））&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;債券市場參考&lt;/td&gt;&lt;td&gt;信用評級 AAA&lt;/td&gt;&lt;td&gt;ICE BofA 公司債選擇權調整利差：投資等級整體 0.90 個百分點（2026-11-16，FRED BAMLC0A0CM）；BBB 級 1.12 個百分點（2026-11-16，FRED BAMLC0A4CBBB）；投機等級整體 3.34 個百分點（2026-11-16，FRED BAMLH0A0HYM2）；AAA 級 0.45 個百分點（2026-11-16，FRED BAMLC0A1CAAA）；個別債券殖利率與價格未取得（TRACE／FINRA 不在固定來源）&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;資產負債表一年內到期債務（沒有到期年度桶，24 個月未取得）；利息口徑：近四季利息費用（作者讀附註：10-K 2026-01-25 Item 7 ¶85；10-Q 2026-07-26 Part I, Item 1 ¶151；推算：FY2026 全年 259＋FY2027 上半年 329−去年同期 124＝464；利息費用主要為票面利息與折價攤銷（10-K Item 7 ¶87）。2026-06 新增 250 億票據只計入約兩個月，年化利息會高於此數。）；未動用信貸：未取得（信用揭露.json 未填；不計入）&lt;/p&gt;&lt;h3 style=&quot;margin-top:14px&quot;&gt;利率壓力測試（固定情境：利率上升 1、2 個百分點與下降 1 個百分點，不預測聯準會；推導）&lt;/h3&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;單位百萬美元；狀態：部分未取得&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;浮動利率債利息變動&lt;/th&gt;&lt;th&gt;再融資利息變動&lt;/th&gt;&lt;th&gt;壓力後一年利息&lt;/th&gt;&lt;th&gt;利息保障&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;目前利率（只算再融資）&lt;/td&gt;&lt;td&gt;0.0&lt;/td&gt;&lt;td&gt;未取得&lt;/td&gt;&lt;td&gt;未取得&lt;/td&gt;&lt;td&gt;未取得&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;+1 個百分點&lt;/td&gt;&lt;td&gt;0.0&lt;/td&gt;&lt;td&gt;未取得&lt;/td&gt;&lt;td&gt;464.0&lt;/td&gt;&lt;td&gt;425.8 倍（不含再融資（兩年內到期本金未取得））&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;+2 個百分點&lt;/td&gt;&lt;td&gt;0.0&lt;/td&gt;&lt;td&gt;未取得&lt;/td&gt;&lt;td&gt;464.0&lt;/td&gt;&lt;td&gt;425.8 倍（不含再融資（兩年內到期本金未取得））&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;−1 個百分點&lt;/td&gt;&lt;td&gt;0.0&lt;/td&gt;&lt;td&gt;未取得&lt;/td&gt;&lt;td&gt;464.0&lt;/td&gt;&lt;td&gt;425.8 倍（不含再融資（兩年內到期本金未取得））&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;目前利率：聯邦基金利率 3.88%（2026-11-16，FRED DFF）、SOFR 3.93%（2026-11-16，FRED SOFR）、十年期公債 5.12%（2026-11-16，FRED DGS10）；浮動利率債 0.0，占總債務 0%（10-K 2026-01-25 Item 7A ¶4；10-Q 2026-07-26 Part I, Item 1 ¶175；債務表所列票據皆為固定票面利率；商業本票期末無餘額。）；兩年內到期須再融資本金 未取得，原票面 未取得（兩年內到期本金未取得），再融資利率 5.57%（10 年期公債 5.12%（2026-11-16）＋ AAA 級 OAS 0.45 個百分點（推導評級），推導）；利息保障基準：利息保障（EBIT÷一年利息），目前 425.8 倍；利率上升 2 個百分點（+200bp，bp＝基點，100bp＝1 個百分點）後低於 1.5 倍才在燈號理由加一條（不改燈號、不改研究評等）；通膨、物價、消費者等間接影響不在此表；缺 兩年內到期本金，對應情境未取得（不補值）&lt;/p&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;&lt;a href=&quot;#survival-rules&quot;&gt;判定規則與限制見本節下方&lt;/a&gt;（寫死在程式，不改研究評等）。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;survival-rules&quot;&gt;&lt;h3&gt;存活檢查與利率壓力測試：判定規則與限制&lt;/h3&gt;&lt;p class=&quot;cap&quot;&gt;規則版本：v1.1（2026-11-03 第二輪：加 KBRA、利率壓力測試、首頁精簡；仍只顯示提示、不改研究評等）&lt;/p&gt;&lt;ul class=&quot;cap&quot;&gt;&lt;li&gt;總燈號：各項取最嚴重：任一高風險→高風險；否則任一需留意→需留意；12 個月流動性或繼續經營無法判定→資料不足；其餘→無明顯警訊。Z 分數與推導評級只列理由、不改燈號。&lt;/li&gt;&lt;li&gt;繼續經營：最新年報或其後季報出現會計師或管理層「substantial doubt … going concern」肯定句 → 高風險（否定句、假設句只列出不計）；只出現在前一份年報 → 需留意&lt;/li&gt;&lt;li&gt;流動性_12個月：現金與證券＋未動用信貸 ≥ 一年內到期本金＋一年利息 → 無明顯警訊；不足但加近四季自由現金流（已扣實付利息）後 ≥ 一年內到期本金 → 需留意；仍不足 → 高風險&lt;/li&gt;&lt;li&gt;流動性_24個月：同上改兩年（本金、利息、自由現金流各計兩年）；不足但加兩年自由現金流 ≥ 本金的 50% → 需留意；更低 → 高風險&lt;/li&gt;&lt;li&gt;燒錢：近四季自由現金流為負：現金還能燒幾個月＝（現金與證券＋未動用信貸－一年內到期本金）÷ 每月燒錢；&amp;lt;12 個月 高風險、12～24 個月 需留意&lt;/li&gt;&lt;li&gt;利息保障：EBIT ÷ 利息費用 &amp;lt; 1.5 倍 → 需留意&lt;/li&gt;&lt;li&gt;契約：作者自 信用揭露.json 填公司揭露的契約門檻與實際值：已違反 → 高風險；餘裕 &amp;lt; 15% → 需留意；未揭露不判&lt;/li&gt;&lt;li&gt;信用評級：機構評級（S&amp;amp;P、Moody&amp;#x27;s、Fitch、KBRA，取各機構最新、以最低者判等級）低於 BBB-／Baa3 → 需留意；只有推導評級為投機等級 → 只列理由&lt;/li&gt;&lt;li&gt;利率壓力測試：固定情境 +100bp／+200bp／-100bp（不預測聯準會）：利息增加＝浮動利率債×利率變動（作者填 Item 7A 每 100bp 利息變動時改用該值）＋兩年內到期本金×（再融資利率＋利率變動－原票面利率）；再融資利率＝收盤日 10 年期公債殖利率＋該評級 ICE BofA OAS（推導）；壓力後利息保障＝EBIT÷（一年利息＋利息增加），EBIT 分母異常時改用現金利息保障。+200bp 後低於 1.5 倍 → 理由加一條、首頁也加（只列理由、不改燈號）；浮動利率債未揭露或未填 → 該情境未取得；金融業不套&lt;/li&gt;&lt;li&gt;金融業：銀行券商、保險不套現金對債務：研究評等輸入 監理紅線 低於門檻 → 高風險；高於門檻不到 20%（相對）→ 需留意；未填 → 資料不足&lt;/li&gt;&lt;/ul&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;使用限制&lt;/p&gt;&lt;ul class=&quot;cap&quot;&gt;&lt;li&gt;推導，非違約預測：燈號只看 12～24 個月付不付得出錢與已揭露的警訊，不是違約機率，也不改研究評等（第一版）。&lt;/li&gt;&lt;li&gt;Altman Z 分數會誤判兩類公司：權益為負（如舉債回購）與保留盈餘因長期回購或股利變負，所以只當輔助、不單獨下結論、不改燈號。&lt;/li&gt;&lt;li&gt;金融業（銀行券商、保險）的存款與保單負債是營業資金，改看監理資本（如 CET1），不套現金對債務。&lt;/li&gt;&lt;li&gt;超過 2～3 年的到期與再融資風險留在正文債務到期表，不進燈號。&lt;/li&gt;&lt;li&gt;到期年度桶以到期表資料日（年報）起算：桶的結束日落在窗口內才計入；跨窗口的桶另列，若作者在 信用揭露.json 填了近期到期明細就改用明細。&lt;/li&gt;&lt;li&gt;個別債券價格與殖利率（TRACE／FINRA）不在固定來源：未取得；市場參考只用 FRED 的 ICE BofA 各評級公司債利差（大盤層級）。&lt;/li&gt;&lt;li&gt;機構評級只認公司自己在 SEC 申報寫出的 S&amp;amp;P、Moody&amp;#x27;s、Fitch、KBRA 評級並附原句；沒揭露寫未揭露，不從新聞或記憶補。&lt;/li&gt;&lt;li&gt;利率壓力測試只用固定情境（+100bp、+200bp、−100bp），不預測聯準會；以 10 年期公債估再融資成本，實際年期與擔保結構不同會有誤差；浮動利率債若也在兩年內到期會重複計算（偏保守）；通膨、物價、消費者等間接影響不進燈號；金融業不套，維持看資本適足率。&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/details&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;more&quot; data-layer=&quot;附錄&quot;&gt;&lt;div class=&quot;qno&quot;&gt;附錄&lt;/div&gt;&lt;h2&gt;附錄：估值細節、論點檢查、名詞、表格與資料來源（預設摺疊）&lt;/h2&gt;&lt;details id=&quot;valdetail&quot;&gt;&lt;summary&gt;估值細節：利率、同業與產業對照、券商目標價&lt;/summary&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;券商目標價&lt;/h3&gt;&lt;figure class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;券商目標價範圍對照本報告合理價值與收盤價（美元；yfinance，取得 2026-11-13；第三方看法，只揭露，不是本報告目標價、不進評等）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 150&quot; role=&quot;img&quot; aria-label=&quot;券商目標價&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;230.0&quot; x2=&quot;230.0&quot; y1=&quot;8&quot; y2=&quot;128&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;230.0&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;0&lt;/text&gt;&lt;line x1=&quot;316.7&quot; x2=&quot;316.7&quot; y1=&quot;8&quot; y2=&quot;128&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;316.7&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;200&lt;/text&gt;&lt;line x1=&quot;403.3&quot; x2=&quot;403.3&quot; y1=&quot;8&quot; y2=&quot;128&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;403.3&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;400&lt;/text&gt;&lt;line x1=&quot;490.0&quot; x2=&quot;490.0&quot; y1=&quot;8&quot; y2=&quot;128&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;490.0&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;600&lt;/text&gt;&lt;text x=&quot;220&quot; y=&quot;27&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;券商目標價（最低–最高，點＝平均）&lt;/text&gt;&lt;line x1=&quot;308.0&quot; x2=&quot;453.2&quot; y1=&quot;22&quot; y2=&quot;22&quot; stroke=&quot;var(--c6)&quot; stroke-width=&quot;3&quot; opacity=&quot;.55&quot;/&gt;&lt;circle cx=&quot;364.2&quot; cy=&quot;22&quot; r=&quot;7&quot; fill=&quot;var(--c6)&quot;&gt;&lt;title&gt;券商目標價（最低–最高，點＝平均）：310&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;465.2&quot; y=&quot;27&quot; class=&quot;val&quot;&gt;310&lt;/text&gt;&lt;text x=&quot;220&quot; y=&quot;67&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;本報告合理價值（只含折現率）&lt;/text&gt;&lt;line x1=&quot;277.0&quot; x2=&quot;288.8&quot; y1=&quot;62&quot; y2=&quot;62&quot; stroke=&quot;var(--c1)&quot; stroke-width=&quot;3&quot; opacity=&quot;.55&quot;/&gt;&lt;circle cx=&quot;282.2&quot; cy=&quot;62&quot; r=&quot;7&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;本報告合理價值（只含折現率）：121&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;300.8&quot; y=&quot;67&quot; class=&quot;val&quot;&gt;121&lt;/text&gt;&lt;text x=&quot;220&quot; y=&quot;107&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;收盤價&lt;/text&gt;&lt;circle cx=&quot;297.4&quot; cy=&quot;102&quot; r=&quot;7&quot; fill=&quot;var(--ink)&quot;&gt;&lt;title&gt;收盤價：155&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;309.4&quot; y=&quot;107&quot; class=&quot;val&quot;&gt;155&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;市場怎麼看：券商目標價與它隱含的成長&lt;/h4&gt;&lt;p&gt;56 家券商的平均目標價 309.72 美元（中位 302.50，最低 180.00、最高 515.00）；比 2026-11-17 收盤價 155.46 高約 99%；換成本模型的語言，平均目標價要求未來 5 年營收每年成長約 37%，高於同規模公司次年成長的 p75（+20.8%）；分析師自己預估明年每股盈餘成長 +70.9%；近 90 天有 24 家調整目標價：上調 7、下調 11、持平 6。&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;券商目標價與隱含成長（yfinance，取得 2026-11-13）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;目標價（美元）&lt;/th&gt;&lt;th&gt;折回今天（推導）&lt;/th&gt;&lt;th&gt;隱含未來 5 年營收年增&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;平均目標價&lt;/td&gt;&lt;td&gt;309.72&lt;/td&gt;&lt;td&gt;278.15&lt;/td&gt;&lt;td&gt;+37.0%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;中位目標價&lt;/td&gt;&lt;td&gt;302.50&lt;/td&gt;&lt;td&gt;271.67&lt;/td&gt;&lt;td&gt;+36.4%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;最低目標價&lt;/td&gt;&lt;td&gt;180.00&lt;/td&gt;&lt;td&gt;161.66&lt;/td&gt;&lt;td&gt;+25.0%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;最高目標價&lt;/td&gt;&lt;td&gt;515.00&lt;/td&gt;&lt;td&gt;462.51&lt;/td&gt;&lt;td&gt;+48.5%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;Nasdaq 共識目標價 268.83（最低 170.00、最高 390.00；買進 28、持有 8、賣出 0）。券商目標價是第三方對 12 個月後股價的看法，多用「預估盈餘 × 主觀本益比」，通常偏樂觀；本區只揭露，不是本報告的目標價、不當證據、不影響估值與研究評等。「折回今天」以股權成本折現（未加回期間股利），「隱含成長」以本報告基準情境的其他假設反推，是用本模型理解他們的價格，不是券商自己的假設（推導）。資料取得時間與本報告收盤日不同。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;利率的影響：公債殖利率變動與股債利差&lt;/h3&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;10 年期公債殖利率 5.12%（2026-11-16，收盤日當天未入檔）。&lt;/strong&gt;殖利率降 1 個百分點、其他不變，合理價值中點約從 121 升到 135（+12%）；升 1 個百分點則降到約 109（−10%）。基準情境成真時，以收盤價買進的推算年報酬約 9.2%&lt;span class=&quot;src&quot;&gt;（基準情境成真時、以收盤 2026-11-17 股價買進的推算年報酬；條件式，非預期報酬、非買賣建議）&lt;/span&gt;，只比公債多約 4.1 個百分點，以這種波動的股票而言補償不多。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;grid2 wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;公債殖利率每變動 1 個百分點，合理價值中點的變化（美元；紅色虛線為現價 155.46）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 500 142&quot; role=&quot;img&quot; aria-label=&quot;利率敏感度&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;168.0&quot; x2=&quot;168.0&quot; y1=&quot;6&quot; y2=&quot;136&quot; class=&quot;zero&quot;/&gt;&lt;line x1=&quot;417.1&quot; x2=&quot;417.1&quot; y1=&quot;4&quot; y2=&quot;138&quot; class=&quot;price&quot;/&gt;&lt;text x=&quot;158&quot; y=&quot;23&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;公債−1%（4.12%）& yfinance，最新一季年增） 也高於 AMD 44.7%（AMD，資料商 yfinance，最新一季年增）。&lt;/strong&gt;我們的判讀：利潤率差距反映生態優勢，也代表回落空間大。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;與個別同業比較：利潤率與投入強度（近四季）。資料期間：本公司 SEC 近四季（截至 2026-07-26）；同業為資料商（yfinance 季報加總）近四季，截至 AMD 2026-09-30＊、AVGO 2026-07-31＊、MRVL 2026-07-31＊、QCOM 2026-09-30＊、INTC 2026-09-30＊、TSM 2026-09-30；＊資料商「營收年增」是最新單季對去年同季（不是近四季），最新一季截止日與近四季不同；資料商查詢 2026-11-18（批次收盤 2026-11-17）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 300&quot; role=&quot;img&quot; aria-label=&quot;同業比較&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;266.0&quot; y2=&quot;266.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;270.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;0%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;205.5&quot; y2=&quot;205.5&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;209.5&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;20%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;145.0&quot; y2=&quot;145.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;149.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;40%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;84.5&quot; y2=&quot;84.5&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;88.5&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;60%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;24.0&quot; y2=&quot;24.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;28.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;80%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;266.0&quot; y2=&quot;266.0&quot; class=&quot;zero&quot;/&gt;&lt;rect x=&quot;62.5&quot; y=&quot;68.7&quot; width=&quot;14.3&quot; height=&quot;197.3&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;營業利益率 NVDA：65%&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;78.7&quot; y=&quot;242.4&quot; width=&quot;14.3&quot; height=&quot;23.6&quot; rx=&quot;2&quot; fill=&quot;var(--c2)&quot;&gt;&lt;title&gt;研發占營收 NVDA：8%&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;95.0&quot; y=&quot;258.7&quot; width=&quot;14.3&quot; height=&quot;7.3&quot; rx=&quot;2&quot; fill=&quot;var(--c3)&quot;&gt;&lt;title&gt;資本支出占營收 NVDA：2%&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;86.9&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;NVDA&lt;/text&gt;&lt;rect x=&quot;132.2&quot; y=&quot;212.4&quot; width=&quot;14.3&quot; height=&quot;53.6&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;營業利益率 AMD：18%&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;148.4&quot; y=&quot;199.0&quot; width=&quot;14.3&quot; height=&quot;67.0&quot; rx=&quot;2&quot; fill=&quot;var(--c2)&quot;&gt;&lt;title&gt;研發占營收 AMD：22%&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;164.7&quot; y=&quot;252.2&quot; width=&quot;14.3&quot; height=&quot;13.8&quot; rx=&quot;2&quot; fill=&quot;var(--c3)&quot;&gt;&lt;title&gt;資本支出占營收 AMD：5%&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;156.6&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;AMD&lt;/text&gt;&lt;rect x=&quot;201.9&quot; y=&quot;119.2&quot; width=&quot;14.3&quot; height=&quot;146.8&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;營業利益率 AVGO：49%&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;218.2&quot; y=&quot;225.8&quot; width=&quot;14.3&quot; height=&quot;40.2&quot; rx=&quot;2&quot; fill=&quot;var(--c2)&quot;&gt;&lt;title&gt;研發占營收 AVGO：13%&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;234.4&quot; y=&quot;261.8&quot; width=&quot;14.3&quot; height=&quot;4.2&quot; rx=&quot;2&quot; fill=&quot;var(--c3)&quot;&gt;&lt;title&gt;資本支出占營收 AVGO：1%&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;226.3&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;AVGO&lt;/text&gt;&lt;rect x=&quot;271.6&quot; y=&quot;215.2&quot; width=&quot;14.3&quot; height=&quot;50.8&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;營業利益率 MRVL：17%&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;287.9&quot; y=&quot;187.8&quot; width=&quot;14.3&quot; height=&quot;78.2&quot; rx=&quot;2&quot; fill=&quot;var(--c2)&quot;&gt;&lt;title&gt;研發占營收 MRVL：26%&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;304.1&quot; y=&quot;250.7&quot; width=&quot;14.3&quot; height=&quot;15.3&quot; rx=&quot;2&quot; fill=&quot;var(--c3)&quot;&gt;&lt;title&gt;資本支出占營收 MRVL：5%&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;296.0&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;MRVL&lt;/text&gt;&lt;rect x=&quot;341.3&quot; y=&quot;205.3&quot; width=&quot;14.3&quot; height=&quot;60.7&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;營業利益率 QCOM：20%&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;357.6&quot; y=&quot;194.4&quot; width=&quot;14.3&quot; height=&quot;71.6&quot; rx=&quot;2&quot; fill=&quot;var(--c2)&quot;&gt;&lt;title&gt;研發占營收 QCOM：24%&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;373.8&quot; y=&quot;248.5&quot; width=&quot;14.3&quot; height=&quot;17.5&quot; rx=&quot;2&quot; fill=&quot;var(--c3)&quot;&gt;&lt;title&gt;資本支出占營收 QCOM：6%&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;365.7&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;QCOM&lt;/text&gt;&lt;rect x=&quot;411.0&quot; y=&quot;235.6&quot; width=&quot;14.3&quot; height=&quot;30.4&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;營業利益率 INTC：10%&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;427.3&quot; y=&quot;198.1&quot; width=&quot;14.3&quot; height=&quot;67.9&quot; rx=&quot;2&quot; fill=&quot;var(--c2)&quot;&gt;&lt;title&gt;研發占營收 INTC：22%&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;443.6&quot; y=&quot;196.8&quot; width=&quot;14.3&quot; height=&quot;69.2&quot; rx=&quot;2&quot; fill=&quot;var(--c3)&quot;&gt;&lt;title&gt;資本支出占營收 INTC：23%&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;435.4&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;INTC&lt;/text&gt;&lt;rect x=&quot;480.7&quot; y=&quot;90.6&quot; width=&quot;14.3&quot; height=&quot;175.4&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;營業利益率 TSM：58%&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;497.0&quot; y=&quot;248.0&quot; width=&quot;14.3&quot; height=&quot;18.0&quot; rx=&quot;2&quot; fill=&quot;var(--c2)&quot;&gt;&lt;title&gt;研發占營收 TSM：6%&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;513.3&quot; y=&quot;163.8&quot; width=&quot;14.3&quot; height=&quot;102.2&quot; rx=&quot;2&quot; fill=&quot;var(--c3)&quot;&gt;&lt;title&gt;資本支出占營收 TSM：34%&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;505.1&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;TSM&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c1)&quot;&gt;&lt;/i&gt;營業利益率&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c2)&quot;&gt;&lt;/i&gt;研發占營收&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c3)&quot;&gt;&lt;/i&gt;資本支出占營收&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;我們的假設 vs 產業常見範圍&lt;/h4&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;對照 Damodaran 半導體產業：第 1 年營業利益率 65% 高於產業 35.3%，依據是近四季實際 65.2%；之後回落到 45% 仍較高，理由是 CUDA 與整櫃系統的定價力（NVDA-C01）。&lt;/strong&gt;銷售對資本比 2.7 高於產業 1.21，因無晶圓廠&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;；永續期投入資本報酬 20%（寬護城河政策上限，高於資本成本 11.5%）。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;beta 1.54、稅率 16.5% 與產業相近；研發占營收 7.8% 低於產業 15.4%，因營收成長較快。&lt;/strong&gt;輝達占產業比重大，不能當獨立檢查。此方法在本工作流的實例驗證：半導體正常化 FCFF 首次使用；十一年平均利潤率 35.6% 含低谷，終值 45% 高於平均屬作者判斷。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;details id=&quot;claims&quot;&gt;&lt;summary&gt;論點檢查：每條判斷的證據狀態&lt;/summary&gt;&lt;div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;依風險分類的主張（證據狀態：支持／部分支持／提出反證／資料不足）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;編號&lt;/th&gt;&lt;th&gt;風險類別&lt;/th&gt;&lt;th&gt;主張&lt;/th&gt;&lt;th&gt;角色&lt;/th&gt;&lt;th&gt;證據狀態&lt;/th&gt;&lt;th&gt;什麼會改變判斷&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;NVDA-C05&lt;/td&gt;&lt;td&gt;R1 資金與流動性&lt;/td&gt;&lt;td&gt;成長所需資金由營運現金流自給，近四季扣資本支出後仍有 1,270 億。&lt;/td&gt;&lt;td&gt;支持論點&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;近四季營運現金流低於回購＋股利＋資本支出合計，或為支應承諾新增借款&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;NVDA-C13&lt;/td&gt;&lt;td&gt;R1 資金與流動性&lt;/td&gt;&lt;td&gt;資產負債表強：有息負債只有 EBITDA 的 0.17 倍，現金與證券約為一年內到期債務的 57 倍。&lt;/td&gt;&lt;td&gt;支持論點&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;有息負債÷EBITDA 升到 1.5 倍以上或保證轉為表內負債&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;NVDA-C11&lt;/td&gt;&lt;td&gt;R2 償債負擔與永久損失&lt;/td&gt;&lt;td&gt;對客戶的融資保證與策略投資把 AI 資本支出循環的風險部分搬到 Nvidia 的資產負債表外。&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;公司認列保證負債或揭露承租人違約；新增對客戶的保證或融資承諾超過 500 億&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;NVDA-C01&lt;/td&gt;&lt;td&gt;R3 成長退坡與競爭&lt;/td&gt;&lt;td&gt;CUDA 軟體生態與系統整合帶來轉換成本，是寬護城河的主要來源；三份非管理層的 SEC 申報（GSI Technology、SharonAI、ChronoScale 10-K）也這樣描述（ChronoScale 同時寫計畫加入 AMD 為第二家主要供應商）。&lt;/td&gt;&lt;td&gt;支持論點&lt;/td&gt;&lt;td&gt;部分支持&lt;/td&gt;&lt;td&gt;毛利率連兩季低於 70%（GAAP）且公司歸因於競爭或價格；前五大客戶之一在申報中揭露以自研晶片取代 Nvidia 為主要推論平台&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;NVDA-C02&lt;/td&gt;&lt;td&gt;R3 成長退坡與競爭&lt;/td&gt;&lt;td&gt;成長幾乎全來自資料中心系統的量，單季營收年增約一倍，主要由美國與台灣總部客戶拉動。&lt;/td&gt;&lt;td&gt;支持論點&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;單季營收年增率降到 20% 以下&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;NVDA-C03&lt;/td&gt;&lt;td&gt;R3 成長退坡與競爭&lt;/td&gt;&lt;td&gt;近期成長能見度高（Q3 營收 1,158 億高於指引 1,080 億，Q4 指引 1,300 億 ±3%，供應承諾 2026-10-25 增至 3,900 億），但能持續多久取決於客戶的電力、廠房與資金。&lt;/td&gt;&lt;td&gt;支持論點&lt;/td&gt;&lt;td&gt;部分支持&lt;/td&gt;&lt;td&gt;FY2027 Q4（預計 2027 年 2 月公布）實際營收低於指引下緣約 1,261 億，或 FY2028 Q1 指引低於 Q4 實際的 13 週換算水準；供應承諾較上季下降且公司說明需求轉弱&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;NVDA-C04&lt;/td&gt;&lt;td&gt;R3 成長退坡與競爭&lt;/td&gt;&lt;td&gt;新一代平台（Vera Rubin）接替 Blackwell 的時程目前看來銜接，但效能領先的差距被客製晶片追近。&lt;/td&gt;&lt;td&gt;支持論點&lt;/td&gt;&lt;td&gt;部分支持&lt;/td&gt;&lt;td&gt;公司在財報說明 Rubin 量產延後或毛利因新平台爬坡下滑超過 3 個百分點&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;NVDA-C10&lt;/td&gt;&lt;td&gt;R3 成長退坡與競爭&lt;/td&gt;&lt;td&gt;客戶高度集中：五家直接客戶占應收帳款七成，大客戶自研晶片會直接衝擊營收。&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;單一直接客戶占營收超過 20% 且其終端客戶宣布轉用自研晶片&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;NVDA-C14&lt;/td&gt;&lt;td&gt;R4 投入回報不足&lt;/td&gt;&lt;td&gt;投入資本報酬極高：近四季 ROIC 超過 200%，增量投入的回報也維持在一倍以上。&lt;/td&gt;&lt;td&gt;支持論點&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;近四季 ROIC 降到 50% 以下&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;NVDA-C08&lt;/td&gt;&lt;td&gt;R5 收入與盈餘品質&lt;/td&gt;&lt;td&gt;自由現金流只有淨利的約三分之二：應收與存貨增速高於營收，淨利另含權益證券未實現利益。&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;應收天數連兩季上升且公司提列呆帳或擴大延長付款安排；應收年增回到不高於營收年增&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;NVDA-C12&lt;/td&gt;&lt;td&gt;R6 治理與資料可信度&lt;/td&gt;&lt;td&gt;創辦人執行長在醜聞中辭職，由財務長暫代並另設董事會主席，關鍵人物與政策風險同時升高。&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;董事會或政府調查揭露公司層級的出口管制違規、罰款或客戶合約受影響；任命常任執行長，且其後兩季營收未低於指引下緣、指引未轉為下修&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;NVDA-C06&lt;/td&gt;&lt;td&gt;R7 估值與市場預期&lt;/td&gt;&lt;td&gt;十年潛力的上行路徑缺市場空間的可查證據；樂觀情境每股約 194 元是三情境中唯一高於收盤價者，所需條件無外部驗證。&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;資料不足&lt;/td&gt;&lt;td&gt;公司在 10-K 或投資人日揭露可查的市場規模與自身占比&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;NVDA-C07&lt;/td&gt;&lt;td&gt;R7 估值與市場預期&lt;/td&gt;&lt;td&gt;收盤價 155.46 美元高於合理價值上緣 135.63 美元，價格位置偏貴；市價另隱含未來五年營收年增約 18%、終值 EV/EBIT 約 20.0 倍（模型 8.6 倍），只作對照描述。&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;連續四季營業利益率維持 60% 以上且公司揭露多年期合約，使基準穩態利潤率有據上調&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;NVDA-C09&lt;/td&gt;&lt;td&gt;R8 宏觀與共同曝險&lt;/td&gt;&lt;td&gt;中國出口管制是持續的政策風險：中國（含香港）營收已降到一成以下，指引不計中國資料中心運算營收。&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;公司 8-K 或 10-Q 揭露 H200 停售或 2026-11-16 遠端存取新規造成的存貨減記、費用或營收影響，或 Q4 實際低於指引下緣&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;NVDA-C15&lt;/td&gt;&lt;td&gt;R9 稀釋與股東回饋&lt;/td&gt;&lt;td&gt;股東回報以回購為主，近四季回購約 553 億，稀釋股數略降。&lt;/td&gt;&lt;td&gt;支持論點&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;回購暫停或稀釋股數年增超過 1%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;並列：研究評等 生意品質一流 ／ 價格偏貴（單錨點）；價格位置 偏貴；現價隱含年報酬（基準情境，非預期報酬） 9.2%。各列狀態與價格分開呈現，不合成分數，狀態件數也不代表強弱（非買賣建議）。&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;details id=&quot;risks-more&quot;&gt;&lt;summary&gt;其他風險與改判條件（超過首頁上限的部分）&lt;/summary&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;risk-tbl&quot; style=&quot;min-width:0;width:100%&quot;&gt;&lt;tr&gt;&lt;th style=&quot;white-space:normal;width:64%&quot;&gt;情況（看哪個指標、門檻多少）&lt;/th&gt;&lt;th style=&quot;white-space:normal;width:22%&quot;&gt;會改變什麼判斷&lt;/th&gt;&lt;th style=&quot;white-space:normal;width:14%&quot;&gt;歷史基準比率&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;對客戶的融資保證與策略投資，AI 資本支出降溫時回到輝達&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;未設門檻：持續觀察&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/details&gt;&lt;details id=&quot;glossary&quot;&gt;&lt;summary&gt;名詞小抄&lt;/summary&gt;&lt;dl class=&quot;gl&quot;&gt;&lt;dt id=&quot;g0&quot;&gt;CUDA&lt;/dt&gt;&lt;dd&gt;輝達的平行運算軟體平台，開發者寫好的程式只能在輝達 GPU 上跑，是轉換成本的來源。&lt;/dd&gt;&lt;dt id=&quot;g1&quot;&gt;ACIE（AI Clouds, Industrial, &amp;amp; Enterprise）&lt;/dt&gt;&lt;dd&gt;輝達 FY2027 起的資料中心客群分類，指超大型雲端以外的 AI 雲、產業與企業客戶。&lt;/dd&gt;&lt;dt id=&quot;g2&quot;&gt;Blackwell、Vera Rubin&lt;/dt&gt;&lt;dd&gt;輝達的資料中心 GPU 平台世代名稱，Vera Rubin 是 Blackwell 的下一代。&lt;/dd&gt;&lt;dt id=&quot;g3&quot;&gt;ROIC（投入資本報酬率）&lt;/dt&gt;&lt;dd&gt;稅後營業利益除以投入營運的資本，衡量每投入 1 元一年賺多少。&lt;/dd&gt;&lt;dt id=&quot;g4&quot;&gt;EV/EBIT&lt;/dt&gt;&lt;dd&gt;企業價值除以營業利益，看買下整家公司要幾年的營業利益回本。&lt;/dd&gt;&lt;dt id=&quot;g5&quot;&gt;殘值保證（residual value guaranty）&lt;/dt&gt;&lt;dd&gt;承租人違約或資產跌價時，保證人補足出租人損失的承諾，屬表外或有負債。&lt;/dd&gt;&lt;/dl&gt;&lt;/details&gt;&lt;details id=&quot;numbers-table&quot;&gt;&lt;summary&gt;完整數字表格：三大報表摘要（年度與 8 季，供查；圖在正文「完整數字」）&lt;/summary&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:14px&quot;&gt;損益表（年度與近四季）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;億美元&lt;/th&gt;&lt;th&gt;FY23&lt;/th&gt;&lt;th&gt;FY24&lt;/th&gt;&lt;th&gt;FY25&lt;/th&gt;&lt;th&gt;FY26&lt;/th&gt;&lt;th&gt;近四季&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;營收&lt;/td&gt;&lt;td&gt;270&lt;/td&gt;&lt;td&gt;609&lt;/td&gt;&lt;td&gt;1,305&lt;/td&gt;&lt;td&gt;2,159&lt;/td&gt;&lt;td&gt;3,030&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;毛利&lt;/td&gt;&lt;td&gt;154&lt;/td&gt;&lt;td&gt;443&lt;/td&gt;&lt;td&gt;979&lt;/td&gt;&lt;td&gt;1,535&lt;/td&gt;&lt;td&gt;2,262&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;研發費用&lt;/td&gt;&lt;td&gt;73.4&lt;/td&gt;&lt;td&gt;86.8&lt;/td&gt;&lt;td&gt;129&lt;/td&gt;&lt;td&gt;185&lt;/td&gt;&lt;td&gt;236&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;營業利益&lt;/td&gt;&lt;td&gt;42.2&lt;/td&gt;&lt;td&gt;330&lt;/td&gt;&lt;td&gt;815&lt;/td&gt;&lt;td&gt;1,304&lt;/td&gt;&lt;td&gt;1,976&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;利息費用&lt;/td&gt;&lt;td&gt;2.6&lt;/td&gt;&lt;td&gt;2.6&lt;/td&gt;&lt;td&gt;2.5&lt;/td&gt;&lt;td&gt;2.6&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;稅前利益&lt;/td&gt;&lt;td&gt;41.8&lt;/td&gt;&lt;td&gt;338&lt;/td&gt;&lt;td&gt;840&lt;/td&gt;&lt;td&gt;1,414&lt;/td&gt;&lt;td&gt;2,297&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;所得稅&lt;/td&gt;&lt;td&gt;-1.9&lt;/td&gt;&lt;td&gt;40.6&lt;/td&gt;&lt;td&gt;111&lt;/td&gt;&lt;td&gt;214&lt;/td&gt;&lt;td&gt;369&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;淨利&lt;/td&gt;&lt;td&gt;43.7&lt;/td&gt;&lt;td&gt;298&lt;/td&gt;&lt;td&gt;729&lt;/td&gt;&lt;td&gt;1,201&lt;/td&gt;&lt;td&gt;1,929&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;稀釋每股盈餘（美元）&lt;/td ;td&gt;63.9&lt;/td&gt;&lt;td&gt;72.4&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;「—」：未揭露或未取得，不補值（利息費用、短期借款、發行借款、償還借款）；近四季每股盈餘不另算。自由現金流＝營運現金流減資本支出（推導）。現金流出（資本支出、併購、回購、股利、還款）照現金流量表以負數表示。&lt;/p&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:14px&quot;&gt;單季&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;億美元&lt;/th&gt;&lt;th&gt;FY25 Q3&lt;/th&gt;&lt;th&gt;FY25 Q4&lt;/th&gt;&lt;th&gt;FY26 Q1&lt;/th&gt;&lt;th&gt;FY26 Q2&lt;/th&gt;&lt;th&gt;FY26 Q3&lt;/th&gt;&lt;th&gt;FY26 Q4&lt;/th&gt;&lt;th&gt;FY27 Q1&lt;/th&gt;&lt;th&gt;FY27 Q2&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;營收&lt;/td&gt;&lt;td&gt;351&lt;/td&gt;&lt;td&gt;393&lt;/td&gt;&lt;td&gt;441&lt;/td&gt;&lt;td&gt;467&lt;/td&gt;&lt;td&gt;570&lt;/td&gt;&lt;td&gt;681&lt;/td&gt;&lt;td&gt;816&lt;/td&gt;&lt;td&gt;962&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;營業利益&lt;/td&gt;&lt;td&gt;219&lt;/td&gt;&lt;td&gt;240&lt;/td&gt;&lt;td&gt;216&lt;/td&gt;&lt;td&gt;284&lt;/td&gt;&lt;td&gt;360&lt;/td&gt;&lt;td&gt;443&lt;/td&gt;&lt;td&gt;535&lt;/td&gt;&lt;td&gt;637&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;淨利&lt;/td&gt;&lt;td&gt;193&lt;/td&gt;&lt;td&gt;221&lt;/td&gt;&lt;td&gt;188&lt;/td&gt;&lt;td&gt;264&lt;/td&gt;&lt;td&gt;319&lt;/td&gt;&lt;td&gt;430&lt;/td&gt;&lt;td&gt;583&lt;/td&gt;&lt;td&gt;597&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;營運現金流&lt;/td&gt;&lt;td&gt;176&lt;/td&gt;&lt;td&gt;166&lt;/td&gt;&lt;td&gt;274&lt;/td&gt;&lt;td&gt;154&lt;/td&gt;&lt;td&gt;238&lt;/td&gt;&lt;td&gt;362&lt;/td&gt;&lt;td&gt;503&lt;/td&gt;&lt;td&gt;241&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p style=&quot;font-size:13px;color:var(--muted)&quot;&gt;第四季與部分單季現金流由累計數相減推導：&lt;/p&gt;&lt;ul style=&quot;font-size:13px;color:var(--muted)&quot;&gt;&lt;li&gt;acquisitions 2024-10-27 = 第3季累計 − 第2季累計&lt;/li&gt;&lt;li&gt;acquisitions 2025-01-26 = 年度 − 前三季累計&lt;/li&gt;&lt;li&gt;acquisitions 2025-07-27 = 第2季累計 − 第1季累計&lt;/li&gt;&lt;li&gt;acquisitions 2025-10-26 = 第3季累計 − 第2季累計&lt;/li&gt;&lt;li&gt;acquis &lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;div class=&quot;wrap&quot;&gt;&lt;div class=&quot;top&quot;&gt;&lt;span&gt;&lt;b&gt;輝達（NVDA）&lt;/b&gt;｜商業評估&lt;/span&gt;&lt;span&gt;資料截止 2026-11-17｜基準季 2026-07-26｜&lt;a href=&quot;報告.html&quot;&gt;估值報告（另頁）&lt;/a&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;hero&quot;&gt;&lt;div&gt;&lt;div class=&quot;eyebrow&quot;&gt;商業評估｜半導體／正常化&lt;/div&gt;&lt;h1&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;輝達把 GPU、CPU、網路、整櫃系統與 CUDA 軟體綁成一套 AI 資料中心平台，賣給雲端業者與 AI 公司；第三季資料中心占營收九成以上、單季營收年增 103%，卡點在客戶集中、收款期拉長、供應承諾與對新興雲擔保快速擴大、對中國銷售受限與執行長突然離任。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src2&quot;&gt;[2]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src3&quot;&gt;[3]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src4&quot;&gt;[4]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src5&quot;&gt;[5]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src6&quot;&gt;[6]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src7&quot;&gt;[7]&lt;/a&gt;&lt;/sup&gt;&lt;/h1&gt;&lt;p class=&quot;lead&quot;&gt;本頁只用官方文件、財報與新聞，回答商業模式是否成立、成長點在哪、是否卡住、未來怎麼變、週期多久。&lt;b&gt;不含價格、估值或任何買賣建議&lt;/b&gt;，也不影響估值報告的研究評等。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;gradebox&quot;&gt;&lt;div class=&quot;lab&quot;&gt;商業動能（五級 A–E；原名「商業評估等級」，2026-11-17 改名）&lt;span class=&quot;ruleok&quot;&gt;評分規則第一版，2026-11-07 使用者核定&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;g&quot;&gt;B&lt;small&gt;級&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;加權分 3.7／5｜相對同業：AMD、AVGO、MRVL、QCOM&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;模式成立，有一兩個需要追蹤的卡點&lt;/div&gt;&lt;div class=&quot;note&quot;&gt;商業評估等級（A–E 五級）只看商業模式是否成立、成長是否卡住、週期在哪，相對同產業卡同業評比；它不是估值報告研究評等裡的「生意品質 A／B／C」（那是看護城河、投入資本報酬、現金流品質、資產負債表與治理的絕對標準），不進研究評等、不影響估值、不涉任何價格。&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;nav class=&quot;qnav&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;&lt;a href=&quot;#s0&quot;&gt;重點&lt;/a&gt;&lt;a href=&quot;#s1&quot;&gt;1 商業輪廓&lt;/a&gt;&lt;a href=&quot;#s2&quot;&gt;2 說的 vs 做的&lt;/a&gt;&lt;a href=&quot;#s3&quot;&gt;3 成長與卡點&lt;/a&gt;&lt;a href=&quot;#sa&quot;&gt;4 優勢與持續期間&lt;/a&gt;&lt;a href=&quot;#s4&quot;&gt;5 生命週期&lt;/a&gt;&lt;a href=&quot;#s5&quot;&gt;6 週期&lt;/a&gt;&lt;a href=&quot;#s6&quot;&gt;7 觀察清單&lt;/a&gt;&lt;a href=&quot;#sg&quot;&gt;等級明細&lt;/a&gt;&lt;a href=&quot;#src&quot;&gt;出處&lt;/a&gt;&lt;/div&gt;&lt;/nav&gt;&lt;div class=&quot;wrap&quot;&gt;&lt;section id=&quot;s0&quot;&gt;&lt;h2&gt;一眼看重點&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;先看等級怎麼來、這頁的證據有多扎實；細節在下面各節。&lt;/p&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;等級怎麼來：五個面向&lt;/figcaption&gt;&lt;svg viewBox=&quot;0 0 640 260&quot; role=&quot;img&quot; aria-label=&quot;商業評估等級五面向：作者分與機械建議分&quot;&gt;&lt;line x1=&quot;150.0&quot; x2=&quot;150.0&quot; y1=&quot;20&quot; y2=&quot;232&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;150.0&quot; y=&quot;250&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;1 分&lt;/text&gt;&lt;line x1=&quot;255.0&quot; x2=&quot;255.0&quot; y1=&quot;20&quot; y2=&quot;232&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;255.0&quot; y=&quot;250&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;2 分&lt;/text&gt;&lt;line x1=&quot;360.0&quot; x2=&quot;360.0&quot; y1=&quot;20&quot; y2=&quot;232&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;360.0&quot; y=&quot;250&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;3 分&lt;/text&gt;&lt;line x1=&quot;465.0&quot; x2=&quot;465.0&quot; y1=&quot;20&quot; y2=&quot;232&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;465.0&quot; y=&quot;250&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;4 分&lt;/text&gt;&lt;line x1=&quot;570.0&quot; x2=&quot;570.0&quot; y1=&quot;20&quot; y2=&quot;232&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;570.0&quot; y=&quot;250&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;5 分&lt;/text&gt;&lt;text x=&quot;140&quot; y=&quot;55.0&quot; class=&quot;lb&quot; text-anchor=&quot;end&quot;&gt;模式穩固度&lt;tspan class=&quot;ax&quot;&gt; 25%&lt;/tspan&gt;&lt;/text&gt;&lt;rect x=&quot;150.0&quot; y=&quot;43.0&quot; width=&quot;315.0&quot; height=&quot;14&quot; rx=&quot;3&quot; fill=&quot;var(--biz)&quot; opacity=&quot;.85&quot;/&gt;&lt;path d=&quot;M570.0,38.0 l6,-8 h-12z&quot; fill=&quot;var(--accent)&quot;&gt;&lt;title&gt;機械建議 5&lt;/title&gt;&lt;/path&gt;&lt;text x=&quot;473.0&quot; y=&quot;55.0&quot; class=&quot;vl&quot;&gt;4&lt;tspan class=&quot;ax&quot;&gt;（機械 5）&lt;/tspan&gt;&lt;/text&gt;&lt;text x=&quot;140&quot; y=&quot;95.0&quot; class=&quot;lb&quot; text-anchor=&quot;end&quot;&gt;成長動能&lt;tspan class=&quot;ax&quot;&gt; 25%&lt;/tspan&gt;&lt;/text&gt;&lt;rect x=&quot;150.0&quot; y=&quot;83.0&quot; width=&quot;420.0&quot; height=&quot;14&quot; rx=&quot;3&quot; fill=&quot;var(--biz)&quot; opacity=&quot;.85&quot;/&gt;&lt;path d=&quot;M570.0,78.0 l6,-8 h-12z&quot; fill=&quot;var(--accent)&quot;&gt;&lt;title&gt;機械建議 5&lt;/title&gt;&lt;/path&gt;&lt;text x=&quot;578.0&quot; y=&quot;95.0&quot; class=&quot;vl&quot;&gt;5&lt;/text&gt;&lt;text x=&quot;140&quot; y=&quot;135.0&quot; class=&quot;lb&quot; text-anchor=&quot;end&quot;&gt;卡點風險&lt;tspan class=&quot;ax&quot;&gt; 20%&lt;/tspan&gt;&lt;/text&gt;&lt;rect x=&quot;150.0&quot; y=&quot;123.0&quot; width=&quot;105.0&quot; height=&quot;14&quot; rx=&quot;3&quot; fill=&quot;var(--biz)&quot; opacity=&quot;.85&quot;/&gt;&lt;path d=&quot;M360.0,118.0 l6,-8 h-12z&quot; fill=&quot;var(--accent)&quot;&gt;&lt;title&gt;機械建議 3&lt;/title&gt;&lt;/path&gt;&lt;text x=&quot;263.0&quot; y=&quot;135.0&quot; class=&quot;vl&quot;&gt;2&lt;tspan class=&quot;ax&quot;&gt;（機械 3）&lt;/tspan&gt;&lt;/text&gt;&lt;text x=&quot;140&quot; y=&quot;175.0&quot; class=&quot;lb&quot; text-anchor=&quot;end&quot;&gt;週期位置&lt;tspan class=&quot;ax&quot;&gt; 15%&lt;/tspan&gt;&lt;/text&gt;&lt;rect x=&quot;150.0&quot; y=&quot;163.0&quot; width=&quot;210.0&quot; height=&quot;14&quot; rx=&quot;3&quot; fill=&quot;var(--biz)&quot; opacity=&quot;.85&quot;/&gt;&lt;path d=&quot;M465.0,158.0 l6,-8 h-12z&quot; fill=&quot;var(--accent)&quot;&gt;&lt;title&gt;機械建議 4&lt;/title&gt;&lt;/path&gt;&lt;text x=&quot;368.0&quot; y=&quot;175.0&quot; class=&quot;vl&quot;&gt;3&lt;tspan class=&quot;ax&quot;&gt;（機械 4）&lt;/tspan&gt;&lt;/text&gt;&lt;text x=&quot;140&quot; y=&quot;215.0&quot; class=&quot;lb&quot; text-anchor=&quot;end&quot;&gt;說法可信度&lt;tspan class=&quot;ax&quot;&gt; 15%&lt;/tspan&gt;&lt;/text&gt;&lt;rect x=&quot;150.0&quot; y=&quot;203.0&quot; width=&quot;315.0&quot; height=&quot;14&quot; rx=&quot;3&quot; fill=&quot;var(--biz)&quot; opacity=&quot;.85&quot;/&gt;&lt;path d=&quot;M360.0,198.0 l6,-8 h-12z&quot; fill=&quot;var(--accent)&quot;&gt;&lt;title&gt;機械建議 3&lt;/title&gt;&lt;/path&gt;&lt;text x=&quot;473.0&quot; y=&quot;215.0&quot; class=&quot;vl&quot;&gt;4&lt;tspan class=&quot;ax&quot;&gt;（機械 3）&lt;/tspan&gt;&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;lg&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--biz)&quot;&gt;&lt;/i&gt;作者分&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--accent)&quot;&gt;&lt;/i&gt;機械建議分&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;藍條是作者分（1–5），橘色三角是工具的機械建議分；兩者不同的面向在等級明細寫了偏離理由。加權分 3.7 → B 級（A ≥ 4.2、B ≥ 3.5、C ≥ 2.8、D ≥ 2.1）。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估.json#/評等/面向（作者分、權重、機械建議）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;這頁的句子有多少是事實&lt;/figcaption&gt;&lt;svg viewBox=&quot;0 0 640 58&quot; role=&quot;img&quot; aria-label=&quot;句子標記組成&quot;&gt;&lt;rect x=&quot;4.0&quot; y=&quot;6&quot; width=&quot;401.8&quot; height=&quot;26&quot; fill=&quot;var(--biz)&quot;&gt;&lt;title&gt;事實 89&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;204.9&quot; y=&quot;24&quot; class=&quot;inb&quot; text-anchor=&quot;middle&quot;&gt;事實 89&lt;/text&gt;&lt;rect x=&quot;405.8&quot; y=&quot;6&quot; width=&quot;162.5&quot; height=&quot;26&quot; fill=&quot;var(--accent)&quot;&gt;&lt;title&gt;推論 36&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;487.0&quot; y=&quot;24&quot; class=&quot;inb&quot; text-anchor=&quot;middle&quot;&gt;推論 36&lt;/text&gt;&lt;rect x=&quot;568.3&quot; y=&quot;6&quot; width=&quot;40.6&quot; height=&quot;26&quot; fill=&quot;var(--c6)&quot;&gt;&lt;title&gt;作者判斷 9&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;608.9&quot; y=&quot;6&quot; width=&quot;27.1&quot; height=&quot;26&quot; fill=&quot;var(--neg)&quot;&gt;&lt;title&gt;待查 6&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;4&quot; y=&quot;52&quot; class=&quot;ax&quot;&gt;合計 140&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;lg&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--biz)&quot;&gt;&lt;/i&gt;事實 89&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--accent)&quot;&gt;&lt;/i&gt;推論 36&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c6)&quot;&gt;&lt;/i&gt;作者判斷 9&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--neg)&quot;&gt;&lt;/i&gt;待查 6&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;全頁句子依標記分類：事實（原文或財報直接寫的）占 64%；推論與作者判斷是從事實推出或取捨的結論，待查是找不到證據的地方。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估.json#/標記統計&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/section&gt;&lt;section id=&quot;s1&quot;&gt;&lt;h2&gt;1　商業輪廓：賣什麼、賣給誰、怎麼收錢&lt;/h2&gt;&lt;div&gt;&lt;span class=&quot;chip&quot;&gt;一次性商品銷售（GPU、整櫃系統、網路設備，出貨時移轉控制權認列）&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;軟硬體支援、雲端服務與授權（先收款列遞延收入，期間內認列）&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cards c3&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;賣什麼&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;公司自稱資料中心規模的 AI 基礎設施公司；自 Blackwell 架構起，晶片、網路、系統、軟體與演算法一起設計，數十萬顆 GPU 可以互連成一台大型電腦。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src8&quot;&gt;[8]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;軟體層以 CUDA 開發平台為基礎，可在所有輝達 GPU 上執行，另有數百套領域專用函式庫與開發套件。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src9&quot;&gt;[9]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;主力是 Blackwell Ultra；新一代 Vera Rubin NVL72 在 FY2027 第三季量產並開始出貨，公司稱是史上最快的產品爬坡，同季也開始單獨銷售 Vera CPU。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src10&quot;&gt;[10]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src11&quot;&gt;[11]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;賣給誰&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;直接客戶是板卡廠、經銷商、代工設計廠、系統廠、雲端業者、AI 模型公司與系統整合商；間接客戶包括雲端、新興雲（Neocloud）、AI 模型公司、企業與公部門。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src12&quot;&gt;[12]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;FY2026 一家直接客戶占總營收 22%、另一家占 14%，都主要在運算與網路分部。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src13&quot;&gt;[13]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;2026-07-26 五家直接客戶分別占應收帳款 22%、14%、13%、11%、10%，合計 70%（推算）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src14&quot;&gt;[14]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;怎麼收錢&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;產品銷售在控制權移轉給客戶時認列營收。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src15&quot;&gt;[15]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;遞延收入包含客戶預付款，以及軟硬體支援、雲端服務、授權與開發安排的未實現收入。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src16&quot;&gt;[16]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;一年以上合約的剩餘履約義務只有 32 億美元，其中約 39% 在未來 12 個月認列；收入主要來自逐筆出貨，不是長約訂閱。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src17&quot;&gt;[17]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src18&quot;&gt;[18]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;營收從哪裡來（2026-01-25 (FY)）&lt;/figcaption&gt;&lt;div class=&quot;sub-t&quot;&gt;依合併項目（ConsolidationItems）&lt;/div&gt;&lt;svg viewBox=&quot;0 0 640 60&quot; role=&quot;img&quot; aria-label=&quot;橫條&quot;&gt;&lt;text x=&quot;252&quot; y=&quot;20&quot; class=&quot;lb s&quot; text-anchor=&quot;end&quot;&gt;Operating Segments - Compute &amp;amp; Netwo…&lt;title&gt;Operating Segments - Compute &amp;amp; Networking&lt;/title&gt;&lt;/text&gt;&lt;rect x=&quot;260&quot; y=&quot;9&quot; width=&quot;230.0&quot; height=&quot;15&quot; rx=&quot;2&quot; fill=&quot;var(--biz)&quot; opacity=&quot;.8&quot;/&gt;&lt;text x=&quot;496.0&quot; y=&quot;21&quot; class=&quot;vl s&quot;&gt;89.6%&lt;tspan class=&quot;ax&quot;&gt; 年增 66.5%&lt;/tspan&gt;&lt;/text&gt;&lt;text x=&quot;252&quot; y=&quot;46&quot; class=&quot;lb s&quot; text-anchor=&quot;end&quot;&gt;Operating Segments - Graphics&lt;title&gt;Operating Segments - Graphics&lt;/title&gt;&lt;/text&gt;&lt;rect x=&quot;260&quot; y=&quot;35&quot; width=&quot;26.7&quot; height=&quot;15&quot; rx=&quot;2&quot; fill=&quot;var(--biz)&quot; opacity=&quot;.8&quot;/&gt;&lt;text x=&quot;292.7&quot; y=&quot;47&quot; class=&quot;vl s&quot;&gt;10.4%&lt;tspan class=&quot;ax&quot;&gt; 年增 57.0%&lt;/tspan&gt;&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;sub-t&quot;&gt;依地區（StatementGeographical）&lt;/div&gt;&lt;svg viewBox=&quot;0 0 640 112&quot; role=&quot;img&quot; aria-label=&quot;橫條&quot;&gt;&lt;text x=&quot;184&quot; y=&quot;20&quot; class=&quot;lb s&quot; text-anchor=&quot;end&quot;&gt;United States&lt;title&gt;United States&lt;/title&gt;&lt;/text&gt;&lt;rect x=&quot;192&quot; y=&quot;9&quot; width=&quot;298.0&quot; height=&quot;15&quot; rx=&quot;2&quot; fill=&quot;var(--biz)&quot; opacity=&quot;.8&quot;/&gt;&lt;text x=&quot;496.0&quot; y=&quot;21&quot; class=&quot;vl s&quot;&gt;69.3%&lt;tspan class=&quot;ax&quot;&gt; 年增 93.1%&lt;/tspan&gt;&lt;/text&gt;&lt;text x=&quot;184&quot; y=&quot;46&quot; class
