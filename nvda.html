;&lt;span class=&quot;num&quot;&gt;116.6%&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;ProductOrService&lt;/td&gt;&lt;td&gt;Hyperscale&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;num&quot;&gt;487 億美元&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;num&quot;&gt;50.6%&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;num&quot;&gt;101.6%&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;ProductOrService&lt;/td&gt;&lt;td&gt;AI Clouds, Industrial, &amp;amp; Enterprise&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;num&quot;&gt;403 億美元&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;num&quot;&gt;41.9%&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;num&quot;&gt;138.1%&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;ProductOrService&lt;/td&gt;&lt;td&gt;Edge Computing&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;num&quot;&gt;72.0 億美元&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;num&quot;&gt;7.5%&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;num&quot;&gt;27.5%&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;lead&quot;&gt;來源：財報/10-Q_2026-07-26_損益表.json（XBRL 維度列；同一軸可能有上下層，不可重複加總）&lt;/p&gt;&lt;/details&gt;&lt;div class=&quot;callout&quot;&gt;&lt;b&gt;解讀&lt;/b&gt;&lt;p class=&quot;s&quot;&gt;FY2026 營收 2,159 億美元：資料中心 1,937 億（89.7%；其中運算 1,624 億、網路 314 億），遊戲 160 億（7.4%），專業視覺化 32 億、汽車 23 億；網路年增 141.5%，是成長最快的一塊。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src19&quot;&gt;[19]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;FY2027 第二季改用新市場分類：資料中心 890 億（92.5%，含超大型雲端 487 億、AI 雲／產業／企業 403 億）、邊緣運算 72 億（7.5%）；資料中心是上層，超大型雲端與 AI 雲是其下層，不能重複加總。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src20&quot;&gt;[20]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;第二季營收比去年同季多 495 億美元，其中資料中心多 479 億，約占增量的 97%（推算）；成長幾乎全部來自資料中心。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src20&quot;&gt;[20]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src21&quot;&gt;[21]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;FY2027 第三季（8-K 新聞稿，10-Q 尚未申報）營收 1,158 億美元：資料中心 1,076 億（約 92.9%，推算）、年增 110%；邊緣運算 82 億、年增 42%；資料中心內超大型雲端與 ACIE 的拆分新聞稿沒有給數字，待 10-Q。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src2&quot;&gt;[2]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src11&quot;&gt;[11]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;依客戶總部地區，第二季美國 62.4%、台灣 28.0%、中國含香港 8.2%；台灣比重高多半反映代工組裝廠出貨，不代表最終使用地。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src22&quot;&gt;[22]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src12&quot;&gt;[12]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;第三季仍有 24 億美元 Hopper 資料中心產品出貨到中國；代理執行長在法說會表示已停止在中國銷售 H200（報導），中國相關營收接下來會再縮小。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src11&quot;&gt;[11]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src7&quot;&gt;[7]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;費用率：本期對去年同期（2026-07-26 (Q2)）&lt;/figcaption&gt;&lt;svg viewBox=&quot;0 0 640 186&quot; role=&quot;img&quot; aria-label=&quot;費用率本期與去年同期&quot;&gt;&lt;line x1=&quot;110.0&quot; x2=&quot;110.0&quot; y1=&quot;16&quot; y2=&quot;162&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;110.0&quot; y=&quot;178&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;0%&lt;/text&gt;&lt;line x1=&quot;192.0&quot; x2=&quot;192.0&quot; y1=&quot;16&quot; y2=&quot;162&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;192.0&quot; y=&quot;178&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;20%&lt;/text&gt;&lt;line x1=&quot;274.0&quot; x2=&quot;274.0&quot; y1=&quot;16&quot; y2=&quot;162&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;274.0&quot; y=&quot;178&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;40%&lt;/text&gt;&lt;line x1=&quot;356.0&quot; x2=&quot;356.0&quot; y1=&quot;16&quot; y2=&quot;162&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;356.0&quot; y=&quot;178&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;60%&lt;/text&gt;&lt;line x1=&quot;438.0&quot; x2=&quot;438.0&quot; y1=&quot;16&quot; y2=&quot;162&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;438.0&quot; y=&quot;178&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;80%&lt;/text&gt;&lt;line x1=&quot;520.0&quot; x2=&quot;520.0&quot; y1=&quot;16&quot; y2=&quot;162&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;520.0&quot; y=&quot;178&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;100%&lt;/text&gt;&lt;text x=&quot;102&quot; y=&quot;40.0&quot; class=&quot;lb s&quot; text-anchor=&quot;end&quot;&gt;毛利率&lt;/text&gt;&lt;line x1=&quot;406.9&quot; x2=&quot;417.4&quot; y1=&quot;35.0&quot; y2=&quot;35.0&quot; stroke=&quot;var(--biz)&quot; stroke-width=&quot;3&quot; opacity=&quot;.5&quot;/&gt;&lt;circle cx=&quot;406.9&quot; cy=&quot;35.0&quot; r=&quot;5&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;去年同期 72.4%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;417.4&quot; cy=&quot;35.0&quot; r=&quot;5.5&quot; fill=&quot;var(--biz)&quot;&gt;&lt;title&gt;本期 75.0%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;427.4&quot; y=&quot;40.0&quot; class=&quot;vl s&quot;&gt;75.0%&lt;tspan class=&quot;ax&quot;&gt; +2.6 點&lt;/tspan&gt;&lt;/text&gt;&lt;text x=&quot;102&quot; y=&quot;74.0&quot; class=&quot;lb s&quot; text-anchor=&quot;end&quot;&gt;業務費用率&lt;/text&gt;&lt;line x1=&quot;119.8&quot; x2=&quot;115.8&quot; y1=&quot;69.0&quot; y2=&quot;69.0&quot; stroke=&quot;var(--biz)&quot; stroke-width=&quot;3&quot; opacity=&quot;.5&quot;/&gt;&lt;circle cx=&quot;119.8&quot; cy=&quot;69.0&quot; r=&quot;5&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;去年同期 2.4%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;115.8&quot; cy=&quot;69.0&quot; r=&quot;5.5&quot; fill=&quot;var(--biz)&quot;&gt;&lt;title&gt;本期 1.4%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;129.8&quot; y=&quot;74.0&quot; class=&quot;vl s&quot;&gt;1.4%&lt;tspan class=&quot;ax&quot;&gt; -1.0 點&lt;/tspan&gt;&lt;/text&gt;&lt;text x=&quot;102&quot; y=&quot;108.0&quot; class=&quot;lb s&quot; text-anchor=&quot;end&quot;&gt;銷管費用率&lt;/text&gt;&lt;line x1=&quot;119.8&quot; x2=&quot;115.8&quot; y1=&quot;103.0&quot; y2=&quot;103.0&quot; stroke=&quot;var(--biz)&quot; stroke-width=&quot;3&quot; opacity=&quot;.5&quot;/&gt;&lt;circle cx=&quot;119.8&quot; cy=&quot;103.0&quot; r=&quot;5&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;去年同期 2.4%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;115.8&quot; cy=&quot;103.0&quot; r=&quot;5.5&quot; fill=&quot;var(--biz)&quot;&gt;&lt;title&gt;本期 1.4%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;129.8&quot; y=&quot;108.0&quot; class=&quot;vl s&quot;&gt;1.4%&lt;tspan class=&quot;ax&quot;&gt; -1.0 點&lt;/tspan&gt;&lt;/text&gt;&lt;text x=&quot;102&quot; y=&quot;142.0&quot; class=&quot;lb s&quot; text-anchor=&quot;end&quot;&gt;研發率&lt;/text&gt;&lt;line x1=&quot;147.6&quot; x2=&quot;140.1&quot; y1=&quot;137.0&quot; y2=&quot;137.0&quot; stroke=&quot;var(--biz)&quot; stroke-width=&quot;3&quot; opacity=&quot;.5&quot;/&gt;&lt;circle cx=&quot;147.6&quot; cy=&quot;137.0&quot; r=&quot;5&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;去年同期 9.2%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;140.1&quot; cy=&quot;137.0&quot; r=&quot;5.5&quot; fill=&quot;var(--biz)&quot;&gt;&lt;title&gt;本期 7.3%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;157.6&quot; y=&quot;142.0&quot; class=&quot;vl s&quot;&gt;7.3%&lt;tspan class=&quot;ax&quot;&gt; -1.9 點&lt;/tspan&gt;&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;lg&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--biz)&quot;&gt;&lt;/i&gt;本期&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--muted)&quot;&gt;&lt;/i&gt;去年同期&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--neg)&quot;&gt;&lt;/i&gt;變差超過 1 點&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;空心點是去年同期、實心點是本期，右側是變化（百分點）；費用率升或毛利率降超過 1 點標紅。分母是含全部收入的營收。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估底稿.json#/費用率（財報/10-Q_2026-07-26_損益表.json）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/section&gt;&lt;section id=&quot;s2&quot;&gt;&lt;h2&gt;2　商業模式驗證：說的 vs 做的&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;管理層在 10-K、10-Q、8-K 的說法，對照財報數字。判定：已驗證／部分支持／說法未獲數字支持／待查。&lt;/p&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;說的 vs 做的：判定分布&lt;/figcaption&gt;&lt;svg viewBox=&quot;0 0 640 58&quot; role=&quot;img&quot; aria-label=&quot;說的vs做的判定&quot;&gt;&lt;rect x=&quot;4.0&quot; y=&quot;6&quot; width=&quot;90.3&quot; height=&quot;26&quot; fill=&quot;var(--pos)&quot;&gt;&lt;title&gt;已驗證 1&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;49.1&quot; y=&quot;24&quot; class=&quot;inb&quot; text-anchor=&quot;middle&quot;&gt;已驗證 1&lt;/text&gt;&lt;rect x=&quot;94.3&quot; y=&quot;6&quot; width=&quot;451.4&quot; height=&quot;26&quot; fill=&quot;var(--warn)&quot;&gt;&lt;title&gt;部分支持 5&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;320.0&quot; y=&quot;24&quot; class=&quot;inb&quot; text-anchor=&quot;middle&quot;&gt;部分支持 5&lt;/text&gt;&lt;rect x=&quot;545.7&quot; y=&quot;6&quot; width=&quot;90.3&quot; height=&quot;26&quot; fill=&quot;var(--muted)&quot;&gt;&lt;title&gt;待查 1&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;590.9&quot; y=&quot;24&quot; class=&quot;inb&quot; text-anchor=&quot;middle&quot;&gt;待查 1&lt;/text&gt;&lt;text x=&quot;4&quot; y=&quot;52&quot; class=&quot;ax&quot;&gt;合計 7&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;lg&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--pos)&quot;&gt;&lt;/i&gt;已驗證 1&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--warn)&quot;&gt;&lt;/i&gt;部分支持 5&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--muted)&quot;&gt;&lt;/i&gt;待查 1&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;管理層 7 條說法對照財報數字的結果；6 條不是「已驗證」，下方用色框標出（有問題的證據）。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估.json#/內容/說的vs做的/判定&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;div class=&quot;callout warnc&quot;&gt;&lt;b&gt;有問題的證據（判定不是「已驗證」）&lt;/b&gt;&lt;ul class=&quot;badl&quot;&gt;&lt;li&gt;&lt;a href=&quot;#cl2&quot;&gt;毛利率靠 Blackwell Ultra 產品組合改善&lt;/a&gt; &lt;span class=&quot;v v-部分支持&quot;&gt;部分支持&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a href=&quot;#cl3&quot;&gt;供應承諾是為了未來幾年的需求&lt;/a&gt; &lt;span class=&quot;v v-部分支持&quot;&gt;部分支持&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a href=&quot;#cl4&quot;&gt;應收增加是對投資等級客戶延長付款期&lt;/a&gt; &lt;span class=&quot;v v-部分支持&quot;&gt;部分支持&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a href=&quot;#cl5&quot;&gt;市場分類改口徑&lt;/a&gt; &lt;span class=&quot;v v-部分支持&quot;&gt;部分支持&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a href=&quot;#cl6&quot;&gt;執行長離任不影響營運與路線圖&lt;/a&gt; &lt;span class=&quot;v v-部分支持&quot;&gt;部分支持&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a href=&quot;#cl7&quot;&gt;新出口規則不影響營收&lt;/a&gt; &lt;span class=&quot;v v-待查&quot;&gt;待查&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;div class=&quot;cards&quot;&gt;&lt;div class=&quot;card claim cv-已驗證&quot; id=&quot;cl1&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;季度營收指引的達成&lt;/b&gt;&lt;span class=&quot;v v-已驗證&quot;&gt;已驗證&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;管理層說法&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;FY2027 第一季營收指引 780 億美元 ±2%，第二季指引 910 億美元 ±2%，兩者都不含中國資料中心運算營收。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src23&quot;&gt;[23]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src24&quot;&gt;[24]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對照數字&lt;/div&gt;&lt;ul class=&quot;ev&quot;&gt;&lt;li class=&quot;s&quot;&gt;第三季指引 1,080 億 ±2%（上緣 1,101.6 億，推算），實際 1,158 億美元，高出上緣約 56 億（推算）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src25&quot;&gt;[25]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src2&quot;&gt;[2]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;li class=&quot;s&quot;&gt;實際第一季營收 816.1 億、第二季 962.2 億美元，分別高於指引上緣 795.6 億與 928.2 億（推算）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src26&quot;&gt;[26]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src27&quot;&gt;[27]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;li class=&quot;s&quot;&gt;FY2026 第四季指引 650 億 ±2%，實際 681.3 億，也高於上緣 663 億（推算）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src28&quot;&gt;[28]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src26&quot;&gt;[26]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;lbl&quot;&gt;說明&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;近四季營收都落在指引上緣之上，指引偏保守；第四季指引 1,300 億 ±3% 含多出的一週、同樣不含中國資料中心運算營收，可沿用同一標準檢驗。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src29&quot;&gt;[29]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src26&quot;&gt;[26]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src2&quot;&gt;[2]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card claim cv-部分支持&quot; id=&quot;cl2&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;毛利率靠 Blackwell Ultra 產品組合改善&lt;/b&gt;&lt;span class=&quot;v v-部分支持&quot;&gt;部分支持&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;管理層說法&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;管理層說第二季毛利率 75.0%、去年同季 72.4%，增加是因為 Blackwell Ultra 改善產品組合；去年上半年另受 H20 存貨與採購義務 45 億美元費用影響。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src30&quot;&gt;[30]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對照數字&lt;/div&gt;&lt;ul class=&quot;ev&quot;&gt;&lt;li class=&quot;s&quot;&gt;損益表算出的毛利率 74.98%，去年同季 72.42%，年增 2.55 個百分點。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src31&quot;&gt;[31]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;li class=&quot;s&quot;&gt;第三季毛利率指引 74.0% ±0.5 個百分點，實際 74.8%（GAAP），落在上緣附近；公司說比第二季略降是 Rubin 初期爬坡所致。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src25&quot;&gt;[25]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src2&quot;&gt;[2]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src32&quot;&gt;[32]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;li class=&quot;s&quot;&gt;第四季毛利率指引 71.0%–72.0%，比第三季低約 3 個百分點；新聞稿沒有說明第四季下降的原因。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src29&quot;&gt;[29]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;lbl&quot;&gt;說明&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;第二、三季毛利率數字與說法一致；但產品組合的拆分沒有揭露、只能確認結果，第四季指引已降到 72% 以下，「組合改善」能否在 Rubin 放量後延續要等 FY2028 上半年驗證。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src33&quot;&gt;[33]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src32&quot;&gt;[32]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src29&quot;&gt;[29]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card claim cv-部分支持&quot; id=&quot;cl3&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;供應承諾是為了未來幾年的需求&lt;/b&gt;&lt;span class=&quot;v v-部分支持&quot;&gt;部分支持&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;管理層說法&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;公司說為了確保未來幾年的需求所需零組件，供應承諾由上一季的 2,790 億美元增到 3,900 億美元，主要是多年期記憶體採購。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src3&quot;&gt;[3]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對照數字&lt;/div&gt;&lt;ul class=&quot;ev&quot;&gt;&lt;li class=&quot;s&quot;&gt;第三季營收 1,158 億美元，供應承諾約是單季營收的 3.4 倍（推算；第二季時約 2.9 倍）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src3&quot;&gt;[3]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src2&quot;&gt;[2]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src34&quot;&gt;[34]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;li class=&quot;s&quot;&gt;一年以上合約的剩餘履約義務只有 32 億美元；公司沒有揭露與 2,790 億供應承諾對應的客戶確定訂單。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src17&quot;&gt;[17]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;li class=&quot;s&quot;&gt;存貨由第二季的 316 億增到 397 億美元，公司說是為了支援 Rubin 爬坡；另有對新興雲最高 1,180 億美元的擔保曝險（其中 SB Energy 1,050 億），至今未付款。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src5&quot;&gt;[5]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src4&quot;&gt;[4]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src35&quot;&gt;[35]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;lbl&quot;&gt;說明&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;單季營收年增 103% 與第四季指引支持「需求還在擴大」；但承諾金額遠超過可見的客戶合約，且再加上擔保與新興雲協議，需求一旦轉弱，這些承諾會變成存貨、採購義務與擔保風險（FY2026 H20 曾提列 45 億）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src2&quot;&gt;[2]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src3&quot;&gt;[3]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src4&quot;&gt;[4]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src36&quot;&gt;[36]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card claim cv-部分支持&quot; id=&quot;cl4&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;應收增加是對投資等級客戶延長付款期&lt;/b&gt;&lt;span class=&quot;v v-部分支持&quot;&gt;部分支持&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;管理層說法&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;公司在第三季仍說應收增加來自 Rubin 上市的出貨時點，以及與部分投資等級客戶的大型多季合約延長付款條件；應收周轉天數由 60 天升到 64 天。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src5&quot;&gt;[5]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src37&quot;&gt;[37]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對照數字&lt;/div&gt;&lt;ul class=&quot;ev&quot;&gt;&lt;li class=&quot;s&quot;&gt;應收帳款 630.6 億美元、一年前 278.1 億，年增 126.8%，比近四季營收年增快 43.4 個百分點、比最新單季營收年增快 20.9 個百分點。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src38&quot;&gt;[38]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;li class=&quot;s&quot;&gt;第三季應收 810 億美元、一年前 333.9 億，年增約 142.6%（推算），比單季營收年增 103% 快約 39.5 個百分點、比近四季營收年增約 93.3% 快約 49.3 個百分點（推算）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src5&quot;&gt;[5]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src39&quot;&gt;[39]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src26&quot;&gt;[26]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src2&quot;&gt;[2]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;li class=&quot;s&quot;&gt;五家直接客戶占應收 22%、14%、13%、11%、10%；公司沒有點名這些客戶，也沒有揭露各自的信用等級。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src14&quot;&gt;[14]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;lbl&quot;&gt;說明&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;應收集中在少數大客戶，與「大型多季合約」的說法相符；「投資等級」無法從申報核對，延長付款等於輝達用自己的資產負債表替客戶墊錢，第三季差距比第二季再擴大。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src14&quot;&gt;[14]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src5&quot;&gt;[5]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card claim cv-部分支持&quot; id=&quot;cl5&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;市場分類改口徑&lt;/b&gt;&lt;span class=&quot;v v-部分支持&quot;&gt;部分支持&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;管理層說法&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;公司說本季把一家客戶從 AI 雲／產業／企業（ACIE）改列超大型雲端，因為對方商業模式改變，並重編前期營收；平台改以資料中心與邊緣運算兩個市場呈現。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src27&quot;&gt;[27]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對照數字&lt;/div&gt;&lt;ul class=&quot;ev&quot;&gt;&lt;li class=&quot;s&quot;&gt;FY2026 10-K 的產品軸是運算、網路、遊戲、專業視覺化、汽車；FY2027 第二季 10-Q 的產品軸是資料中心（超大型雲端、ACIE）與邊緣運算，新舊細項不能直接對比，只有資料中心總數能銜接。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src19&quot;&gt;[19]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src20&quot;&gt;[20]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;li class=&quot;s&quot;&gt;報導指輝達前一年改變新加坡營收的揭露方式，時間點與 Megaspeed 走私調查有關，正受到重新檢視（報導，非申報）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src40&quot;&gt;[40]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;lbl&quot;&gt;說明&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;重編前期讓本期對比一致，這點有做到；但兩年內兩次改變分類或揭露方式，細項歷史序列變短，外部也對揭露方式提出疑問。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src27&quot;&gt;[27]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src40&quot;&gt;[40]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card claim cv-部分支持&quot; id=&quot;cl6&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;執行長離任不影響營運與路線圖&lt;/b&gt;&lt;span class=&quot;v v-部分支持&quot;&gt;部分支持&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;管理層說法&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;董事會聲明對代理執行長 Colette Kress 與經營團隊有完全信心，並表示期待營運、客戶承諾與產品路線圖不中斷。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src41&quot;&gt;[41]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對照數字&lt;/div&gt;&lt;ul class=&quot;ev&quot;&gt;&lt;li class=&quot;s&quot;&gt;黃仁勳 2026-11-11 辭任總裁、執行長與董事，即時生效；財務長 Kress 兼任代理執行長，董事會另找正式人選。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src6&quot;&gt;[6]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src42&quot;&gt;[42]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;li class=&quot;s&quot;&gt;TrendForce 轉述台灣媒體，傳輝達放緩下單、部分亞洲客戶的 AI 伺服器訂單重新審查（未證實）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src43&quot;&gt;[43]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;li class=&quot;s&quot;&gt;第三季營收 1,158 億、高於指引上緣，Vera Rubin NVL72 已出貨，第四季指引 1,300 億 ±3% 高於第三季實際。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src2&quot;&gt;[2]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src29&quot;&gt;[29]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src10&quot;&gt;[10]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;li class=&quot;s&quot;&gt;黃仁勳 11-17 聲明願意在董事會認為合適時回任；參院銀行委員會要求他 12-03 出席聽證（報導）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src44&quot;&gt;[44]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src45&quot;&gt;[45]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;lbl&quot;&gt;說明&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;離任後第一季的營收、指引與 Rubin 出貨沒有中斷，營運面目前支持董事會說法；但正式執行長未定、國會聽證與對中國銷售調整仍在進行，傳聞中的下單放緩也未證實或否認，治理面仍待觀察。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src2&quot;&gt;[2]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src29&quot;&gt;[29]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src45&quot;&gt;[45]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src43&quot;&gt;[43]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src7&quot;&gt;[7]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card claim cv-待查&quot; id=&quot;cl7&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;新出口規則不影響營收&lt;/b&gt;&lt;span class=&quot;v v-待查&quot;&gt;待查&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;管理層說法&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;報導指代理執行長在法說會說，Vera Rubin 等先進晶片的需求積壓，使新出口規則不會影響營收。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src46&quot;&gt;[46]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對照數字&lt;/div&gt;&lt;ul class=&quot;ev&quot;&gt;&lt;li class=&quot;s&quot;&gt;美國 11-16 新規禁止服務中國客戶的海外資料中心購買先進晶片；報導引述 Jefferies 的分析師數字：明年資料中心營收少 440–620 億美元（非公司揭露）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src47&quot;&gt;[47]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;li class=&quot;s&quot;&gt;公司沒有揭露積壓訂單金額；一年以上合約剩餘履約義務只有 32 億美元（第二季）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src17&quot;&gt;[17]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;lbl&quot;&gt;說明&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-待查&quot;&gt;待查&lt;/span&gt;待查：FY2027 第四季與 FY2028 第一季的營收是否達到指引、10-Q 對東南亞地區營收與新規影響的揭露，才能核對「不影響營收」。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;s3&quot;&gt;&lt;h2&gt;3　成長引擎與卡點&lt;/h2&gt;&lt;h3&gt;成長從哪裡來（量、價、新產品、新市場、併購）&lt;/h3&gt;&lt;div class=&quot;cards&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;span class=&quot;chip&quot;&gt;量&lt;/span&gt;&lt;span class=&quot;qz&quot;&gt;能否量化：可量化&lt;/span&gt;&lt;/div&gt;&lt;b&gt;資料中心出貨量擴大（Blackwell Ultra 與 Rubin 並行）&lt;/b&gt;&lt;div class=&quot;lbl&quot;&gt;證據&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;第三季資料中心營收 1,076 億美元，年增 110%、季增 21%；超大型雲端與 ACIE 兩個平台都大幅成長。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src11&quot;&gt;[11]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;第二季資料中心營收 890 億美元、年增 117%，由 Blackwell Ultra 爬坡帶動。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src48&quot;&gt;[48]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;span class=&quot;chip&quot;&gt;新產品&lt;/span&gt;&lt;span class=&quot;qz&quot;&gt;能否量化：部分可量化&lt;/span&gt;&lt;/div&gt;&lt;b&gt;Vera Rubin 平台與網路產品&lt;/b&gt;&lt;div class=&quot;lbl&quot;&gt;證據&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;Vera Rubin NVL72 第三季量產出貨，已在 CoreWeave、Google Cloud、Microsoft Azure、Oracle 雲與 Nebius 運作；Vera CPU 開始單獨銷售。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src10&quot;&gt;[10]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src11&quot;&gt;[11]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;FY2026 網路營收 314 億美元、年增 141.5%，快於運算的 58.9%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src19&quot;&gt;[19]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;span class=&quot;chip&quot;&gt;新市場&lt;/span&gt;&lt;span class=&quot;qz&quot;&gt;能否量化：可量化&lt;/span&gt;&lt;/div&gt;&lt;b&gt;AI 原生公司、企業與主權客戶（ACIE）&lt;/b&gt;&lt;div class=&quot;lbl&quot;&gt;證據&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;ACIE 營收第二季 403 億美元、年增 138%、季增 25%，來自 AI 原生公司、企業、主權客戶與使用 AI 雲的超大型雲端，成長快於超大型雲端。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src48&quot;&gt;[48]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src20&quot;&gt;[20]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;公司說 AI 雲與模型公司缺乏長期基礎設施合約與投資等級融資能力，輝達以擔保土地、電力、廠房與產能協助它們建置；例如對 SB Energy 約 4.25 GW 的租約提供殘值保證。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src49&quot;&gt;[49]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src50&quot;&gt;[50]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;公司說新興雲與前沿模型公司的成長快過其資產負債表與信用能支撐的程度，輝達以土地、電力與機房協議協助，新興雲協議最高承諾 320 億美元，且只在對方取得融資並完成部署後生效。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src51&quot;&gt;[51]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src52&quot;&gt;[52]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src53&quot;&gt;[53]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;span class=&quot;chip&quot;&gt;併購&lt;/span&gt;&lt;span class=&quot;qz&quot;&gt;能否量化：待查&lt;/span&gt;&lt;/div&gt;&lt;b&gt;收購 Hugging Face（尚未完成）&lt;/b&gt;&lt;div class=&quot;lbl&quot;&gt;證據&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;2026-09-02 簽約收購開源模型平台 Hugging Face；這是併購帶來的業務延伸，不是內生成長，金額貢獻在完成前無法計入。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src54&quot;&gt;[54]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;近 12 季：營收年增與營業利益率&lt;/figcaption&gt;&lt;svg viewBox=&quot;0 0 680 250&quot; role=&quot;img&quot; aria-label=&quot;近幾季單季營收年增與營業利益率&quot;&gt;&lt;line x1=&quot;50&quot; x2=&quot;640&quot; y1=&quot;216.0&quot; y2=&quot;216.0&quot; class=&quot;zl&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;220.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;0%&lt;/text&gt;&lt;line x1=&quot;50&quot; x2=&quot;640&quot; y1=&quot;150. 6&quot; fill=&quot;var(--pos)&quot;&gt;&lt;title&gt;C4 產能建置跟不上需求或過剩：-0.6 點，門檻 &gt; +3.0 點&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;269.4&quot; y=&quot;252.0&quot; class=&quot;vl s&quot; text-anchor=&quot;start&quot; fill=&quot;var(--pos)&quot;&gt;-0.6 點&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;lg&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--neg)&quot;&gt;&lt;/i&gt;亮燈&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--pos)&quot;&gt;&lt;/i&gt;未亮&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--neg)&quot;&gt;&lt;/i&gt;亮燈門檻（虛線）&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;G4 另有條件「營收近四季年增低於一年前」，兩個條件都成立才亮燈（目前未亮）。&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;C4 另有條件「營收近四季年增低於一年前」，兩個條件都成立才亮燈（目前未亮）。&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;每列一個用財報數字算的訊號：點是目前值，虛線是門檻，點落進淡紅色帶就亮燈；看離門檻還有多少餘裕。是非題型訊號（如連續放緩）不在此圖，見上方燈號。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估.json#/內容/卡住訊號（值、門檻、比較）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;div class=&quot;sub-h&quot;&gt;機械訊號（財報數字算得出）&lt;/div&gt;&lt;div class=&quot;cards&quot;&gt;&lt;div class=&quot;card sig&quot; id=&quot;sig-G1&quot; style=&quot;--tc:var(--lt-未亮, var(--muted))&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;G1　營收增速連續放緩&lt;/b&gt;&lt;span class=&quot;light l-未亮&quot;&gt;未亮&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;成長是不是一季比一季慢？&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;值&lt;/div&gt;&lt;div class=&quot;sv&quot;&gt;否&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;機械值，期末 2026-07-26；門檻  &lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;判讀&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;至第二季的近四季單季營收年增 62.5%、73.2%、85.2%、105.9%，連續加速，機械訊號未亮。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src55&quot;&gt;[55]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;第三季新聞稿單季年增 103%，比第二季略慢，是本輪第一次放緩；第四季指引中點 1,300 億對去年同季 681.3 億約年增 91%（推算，且多一週），若成真就是連續兩季放緩。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src2&quot;&gt;[2]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src29&quot;&gt;[29]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src26&quot;&gt;[26]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card sig&quot; id=&quot;sig-G2&quot; style=&quot;--tc:var(--lt-未亮, var(--muted))&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;G2　營業利益率走弱&lt;/b&gt;&lt;span class=&quot;light l-未亮&quot;&gt;未亮&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;規模變大，利潤率有沒有跟著變好？&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;值&lt;/div&gt;&lt;div class=&quot;sv&quot;&gt;+7.1 個百分點&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;機械值，期末 2026-07-26；門檻 &amp;lt; -1.0 個百分點&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;判讀&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;近四季營業利益率 65.2%，比一年前高 7.1 個百分點，規模擴大後利潤率仍在上升。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src56&quot;&gt;[56]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;第三季營業利益率 66.9%（推算），含第三季的近四季約 66.1%（推算），仍在上升。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src57&quot;&gt;[57]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src26&quot;&gt;[26]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card sig&quot; id=&quot;sig-G3&quot; style=&quot;--tc:var(--lt-亮燈, var(--muted))&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;G3　收款變慢&lt;/b&gt;&lt;span class=&quot;light l-亮燈&quot;&gt;亮燈&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;營收成長是不是靠放寬收款條件？&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;值&lt;/div&gt;&lt;div class=&quot;sv&quot;&gt;+43.4 個百分點&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;機械值，期末 2026-07-26；門檻 &amp;gt; +10.0 個百分點&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;判讀&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;應收年增 126.8%，比近四季營收年增快 43.4 個百分點；改用最新單季年增比較仍快 20.9 個百分點，超過 10 個百分點門檻，不是近四季口徑造成的假亮燈。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src38&quot;&gt;[38]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;公司自己說原因是對部分投資等級客戶的大型多季合約延長付款；這是真實的收款條件放寬，採用計分。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src37&quot;&gt;[37]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;第三季新聞稿：應收 810 億、年增約 142.6%，比含第三季的近四季營收年增約 93.3% 快約 49.3 個百分點（推算），周轉天數 64 天，訊號比第二季更明顯。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src5&quot;&gt;[5]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src39&quot;&gt;[39]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src26&quot;&gt;[26]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src2&quot;&gt;[2]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card sig&quot; id=&quot;sig-G4&quot; style=&quot;--tc:var(--lt-未亮, var(--muted))&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;G4　投入換不到成長&lt;/b&gt;&lt;span class=&quot;light l-未亮&quot;&gt;未亮&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;資本支出加大，營收增速有沒有跟上？&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;值&lt;/div&gt;&lt;div class=&quot;sv&quot;&gt;-0.6 個百分點&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;機械值，期末 2026-07-26；門檻 &amp;gt; +1.0 個百分點；且 營收近四季年增低於一年前&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;判讀&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;近四季資本支出只占營收 2.4%，比一年前低 0.6 個百分點；不自建晶圓廠，投入以研發與供應承諾為主，這條訊號抓不到它的主要投入。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src58&quot;&gt;[58]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src59&quot;&gt;[59]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src34&quot;&gt;[34]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card sig&quot; id=&quot;sig-C1&quot; style=&quot;--tc:var(--lt-亮燈, var(--muted))&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;C1　存貨堆積&lt;/b&gt;&lt;span class=&quot;light l-亮燈&quot;&gt;亮燈&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;存貨是不是比營收長得快？&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;值&lt;/div&gt;&lt;div class=&quot;sv&quot;&gt;+27.7 個百分點&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;機械值，期末 2026-07-26；門檻 &amp;gt; +5.0 個百分點&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;判讀&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;存貨年增 111.0%，比近四季營收年增快 27.7 個百分點；改用最新單季年增比較只快 5.2 個百分點，剛好過 5 個百分點門檻。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src60&quot;&gt;[60]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;半年內原料由 38.1 億增到 113.4 億、在製品由 88.2 億增到 133.8 億，製成品反由 87.7 億降到 68.6 億美元。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src61&quot;&gt;[61]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;第三季新聞稿：存貨 397 億美元、一年前 197.8 億，年增約 100.7%，只比含第三季的近四季營收年增快約 7.4 個百分點（推算），差距比第二季收斂。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src5&quot;&gt;[5]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src62&quot;&gt;[62]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src26&quot;&gt;[26]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src2&quot;&gt;[2]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;增加集中在原料與在製品，配合 Rubin 量產，第三季差距也已收斂，不是賣不掉的成品堆積；但存貨與 3,900 億供應承諾同步放大，需求轉弱時就是提列風險，機械值仍採用計分。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src61&quot;&gt;[61]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src5&quot;&gt;[5]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src3&quot;&gt;[3]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card sig&quot; id=&quot;sig-C2&quot; style=&quot;--tc:var(--lt-未亮, var(--muted))&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;C2　毛利率走弱&lt;/b&gt;&lt;span class=&quot;light l-未亮&quot;&gt;未亮&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;是不是供過於求在降價？&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;值&lt;/div&gt;&lt;div class=&quot;sv&quot;&gt;+2.5 個百分點&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;機械值，期末 2026-07-26；門檻 &amp;lt; -1.0 個百分點&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;判讀&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;第二季毛利率 75.0%，年增 2.55 個百分點；第三季 74.8%、年增 1.4 個百分點，沒有降價跡象。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src63&quot;&gt;[63]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src57&quot;&gt;[57]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;第四季指引 71.0%–72.0%，會是一年來最低；公司把第三季的季減歸因於 Rubin 初期爬坡，第四季原因未說明，要看是換代成本還是價格壓力。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src29&quot;&gt;[29]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src32&quot;&gt;[32]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card sig&quot; id=&quot;sig-C4&quot; style=&quot;--tc:var(--lt-未亮, var(--muted))&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;C4　產能建置跟不上需求或過剩&lt;/b&gt;&lt;span class=&quot;light l-未亮&quot;&gt;未亮&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;資本支出是不是在景氣高點加大？&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;值&lt;/div&gt;&lt;div class=&quot;sv&quot;&gt;-0.6 個百分點&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;機械值，期末 2026-07-26；門檻 &amp;gt; +3.0 個百分點；且 營收近四季年增低於一年前&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;判讀&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;資本支出強度沒有在高點加大；產能風險改以供應承諾形式出現（第二季 1,190 億增到 2,790 億，第三季再增到 3,900 億美元），這條機械訊號看不到。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src64&quot;&gt;[64]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src34&quot;&gt;[34]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src3&quot;&gt;[3]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub-h&quot;&gt;作者訊號（財報數字看不出，作者讀原文判斷）&lt;/div&gt;&lt;div class=&quot;cards&quot;&gt;&lt;div class=&quot;card sig&quot; id=&quot;sig-C3&quot; style=&quot;--tc:var(--lt-資料未取得, var(--muted))&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;C3　訂單出貨比轉弱&lt;/b&gt;&lt;span class=&quot;light l-資料未取得&quot;&gt;資料未取得&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;新訂單比出貨少嗎？&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;值&lt;/div&gt;&lt;div class=&quot;sv&quot;&gt;未揭露（公司不揭露訂單出貨比；一年以上合約剩餘履約義務 32 億美元，第二季）&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;作者從原文填&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;判讀&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-待查&quot;&gt;待查&lt;/span&gt;待查：公司未揭露訂單出貨比或積壓訂單金額；代理執行長在法說會只說需求有積壓（報導），要找第三季 10-Q 是否揭露客戶訂單或剩餘履約義務的變化。&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;可得的替代資料只有：一年以上合約剩餘履約義務 32 億美元（約 0.03 季營收）與供應承諾 2,790 億美元，兩者都不是訂單出貨比。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src17&quot;&gt;[17]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src18&quot;&gt;[18]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src34&quot;&gt;[34]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;h3 id=&quot;ext&quot;&gt;外部驗證：競爭者、客戶、供應商怎麼描述這家公司&lt;/h3&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;外部驗證：誰支持、誰反駁&lt;/figcaption&gt;&lt;div class=&quot;emx&quot; style=&quot;grid-template-columns:repeat(3,1fr)&quot;&gt;&lt;div class=&quot;emc&quot; style=&quot;--tc:var(--pos)&quot;&gt;&lt;div class=&quot;emh&quot;&gt;支持 &lt;b&gt;3&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;emi&quot;&gt;&lt;b&gt;Advanced Micro Devices（AMD）&lt;/b&gt;&lt;span&gt;競爭者&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;emi&quot;&gt;&lt;b&gt;GSI Technology&lt;/b&gt;&lt;span&gt;競爭者&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;emi&quot;&gt;&lt;b&gt;SharonAI Holdings&lt;/b&gt;&lt;span&gt;客戶&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;emc&quot; style=&quot;--tc:var(--warn)&quot;&gt;&lt;div class=&quot;emh&quot;&gt;部分支持 &lt;b&gt;1&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;emi&quot;&gt;&lt;b&gt;BluSky AI&lt;/b&gt;&lt;span&gt;客戶&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;emc&quot; style=&quot;--tc:var(--neg)&quot;&gt;&lt;div class=&quot;emh&quot;&gt;反駁 &lt;b&gt;3&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;emi&quot;&gt;&lt;b&gt;CNBC 引述的產業分析師&lt;/b&gt;&lt;span&gt;外部分析師&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;emi&quot;&gt;&lt;b&gt;TrendForce（轉述台灣媒體）&lt;/b&gt;&lt;span&gt;其他&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;emi&quot;&gt;&lt;b&gt;Switchyard Partners（AI 基礎設施投資人，Fortune 報導）&lt;/b&gt;&lt;span&gt;其他&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;7 個外部來源（競爭者、客戶、供應商、夥伴的申報或報導）怎麼描述本公司：支持 3、部分支持 1、反駁 3。依「對本公司說法」欄的開頭分類。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估.json#/內容/外部驗證（對方、關係、支持）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;div class=&quot;cards&quot;&gt;&lt;div class=&quot;card ext&quot; style=&quot;--tc:var(--pos)&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;Advanced Micro Devices（AMD）&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;競爭者&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;對方文件怎麼說&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;AMD 年報寫在資料中心分部主要與英特爾和輝達競爭，產品涵蓋 CPU、GPU、DPU 與 AI 網卡。對本公司說法：支持，輝達是資料中心 AI 晶片的主要對手方，與公司自述的地位一致（作者解讀，原文只列為競爭者）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src65&quot;&gt;[65]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對本公司說法&lt;/div&gt;&lt;div class=&quot;stc&quot;&gt;支持（資料中心主要玩家）&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card ext&quot; style=&quot;--tc:var(--pos)&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;GSI Technology&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;競爭者&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;對方文件怎麼說&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;GSI Technology 年報寫輝達靠 GPU 架構與廣泛採用的 CUDA 軟體平台在 AI 硬體生態取得主導地位，對開發者與客戶造成顯著的轉換成本與生態鎖定。對本公司說法：支持，CUDA 生態是屏障。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src66&quot;&gt;[66]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對本公司說法&lt;/div&gt;&lt;div class=&quot;stc&quot;&gt;支持&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card ext&quot; style=&quot;--tc:var(--pos)&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;SharonAI Holdings&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;客戶&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;對方文件怎麼說&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;SharonAI 年報寫自己的軟體架構、模型訓練流程與推論基礎設施都針對輝達 CUDA 平台與函式庫最佳化。對本公司說法：支持，客戶端的程式碼已綁在 CUDA 上。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src67&quot;&gt;[67]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對本公司說法&lt;/div&gt;&lt;div class=&quot;stc&quot;&gt;支持&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card ext&quot; style=&quot;--tc:var(--warn)&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;BluSky AI&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;客戶&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;對方文件怎麼說&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;BluSky AI 年報寫依賴輝達與 AMD 等少數 GPU 製造商，供應商延遲或漲價會直接影響其營運成本與擴張。對本公司說法：部分支持，客戶承認對輝達的採購依賴與議價弱勢，但也把 AMD 列為可替代來源。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src68&quot;&gt;[68]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對本公司說法&lt;/div&gt;&lt;div class=&quot;stc&quot;&gt;部分支持&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card ext&quot; style=&quot;--tc:var(--neg)&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;CNBC 引述的產業分析師&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;外部分析師&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;對方文件怎麼說&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;報導引述分析師：輝達仍擁有絕大多數 AI 運算與 CUDA 生態鎖定，但 OpenAI 與博通合作的 Jalapeño 晶片威脅輝達在成長最快的推論端的毛利。對本公司說法：反駁推論端的定價力，雖同時承認 CUDA 鎖定存在。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src69&quot;&gt;[69]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對本公司說法&lt;/div&gt;&lt;div class=&quot;stc&quot;&gt;反駁（推論端毛利）&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card ext&quot; style=&quot;--tc:var(--neg)&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;TrendForce（轉述台灣媒體）&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;其他&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;對方文件怎麼說&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;報導指若輝達放緩下單，釋出的台積電產能可能由 AMD 與博通、聯發科等 ASIC 業者取得；AMD MI455X 已量產出貨（傳聞，未證實）。對本公司說法：反駁需求與產能地位不受執行長事件影響的說法。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src70&quot;&gt;[70]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src43&quot;&gt;[43]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對本公司說法&lt;/div&gt;&lt;div class=&quot;stc&quot;&gt;反駁&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card ext&quot; style=&quot;--tc:var(--neg)&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;Switchyard Partners（AI 基礎設施投資人，Fortune 報導）&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;其他&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;對方文件怎麼說&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;報導引述投資人：黃仁勳離任對負債最高的新興雲衝擊最大，因為輝達不只賣晶片，還投資並擔保它們的業務，例如以固定價格回租閒置 GPU 產能，讓銀行願意放款。對本公司說法：反駁，部分客戶需求要靠輝達的擔保與融資支撐，不完全是自發需求。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src71&quot;&gt;[71]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src72&quot;&gt;[72]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對本公司說法&lt;/div&gt;&lt;div class=&quot;stc&quot;&gt;反駁（新興雲需求靠擔保）&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;sa&quot;&gt;&lt;h2&gt;4　優勢來源與持續期間&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;每種優勢都要同時有「好處」與「屏障」證據（Helmer《7 Powers》的檢驗）：只有好處、沒有屏障的優勢只算&lt;b&gt;暫時領先&lt;/b&gt;。再分兩維：超額報酬有多大、能撐多久（Mauboussin《Measuring the Moat》的問法）；Morningstar 五種來源只當分類參考。本節只談商業面的屏障，不含價格或估值，也不是估值報告的護城河評分，不進商業動能等級。&lt;/p&gt;&lt;div class=&quot;callout&quot;&gt;&lt;b&gt;總結&lt;/b&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;主要優勢是 CUDA 軟體生態的轉換成本，有競爭者與客戶申報佐證，換到目前同業最高的利潤率；推論端的客製晶片是最直接的侵蝕來源，供應規模的領先則較短暫。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src66&quot;&gt;[66]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src73&quot;&gt;[73]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src69&quot;&gt;[69]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;優勢地圖：多大、多久&lt;/figcaption&gt;&lt;div class=&quot;amx&quot;&gt;&lt;div class=&quot;amy&quot;&gt;持續期間 →&lt;/div&gt;&lt;div class=&quot;amg&quot;&gt;&lt;div class=&quot;amr&quot; style=&quot;grid-template-columns:80px repeat(4,1fr)&quot;&gt;&lt;div class=&quot;aml&quot;&gt;10年以上&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amc unk&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;amr&quot; style=&quot;grid-template-columns:80px repeat(4,1fr)&quot;&gt;&lt;div class=&quot;aml&quot;&gt;5–10年&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;span class=&quot;ab ab-有屏障證據&quot; title=&quot;CUDA 軟體生態的轉換成本：有屏障證據&quot;&gt;1&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;amc unk&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;amr&quot; style=&quot;grid-template-columns:80px repeat(4,1fr)&quot;&gt;&lt;div class=&quot;aml&quot;&gt;不足5年&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amc unk&quot;&gt;&lt;span class=&quot;ab ab-有屏障證據&quot; title=&quot;整櫃系統與供應鏈的規模：有屏障證據&quot;&gt;2&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;amr&quot; style=&quot;grid-template-columns:80px repeat(4,1fr)&quot;&gt;&lt;div class=&quot;aml&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amx-l&quot;&gt;小&lt;/div&gt;&lt;div class=&quot;amx-l&quot;&gt;中&lt;/div&gt;&lt;div class=&quot;amx-l&quot;&gt;大&lt;/div&gt;&lt;div class=&quot;amx-l&quot;&gt;不明&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;amxt&quot;&gt;超額報酬大小 →&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;ol class=&quot;akey&quot;&gt;&lt;li&gt;&lt;span class=&quot;ab ab-有屏障證據&quot;&gt;1&lt;/span&gt;CUDA 軟體生態的轉換成本（轉換成本；有屏障證據）&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;ab ab-有屏障證據&quot;&gt;2&lt;/span&gt;整櫃系統與供應鏈的規模（規模經濟；有屏障證據）&lt;/li&gt;&lt;/ol&gt;&lt;div class=&quot;lg&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--pos)&quot;&gt;&lt;/i&gt;有屏障證據&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--warn)&quot;&gt;&lt;/i&gt;暫時領先&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;每個圓圈是一項優勢：越往右超額報酬越大、越往上能撐越久。綠＝屏障有事實證據；橘＝只有好處或屏障只有推論（暫時領先，持續期間最多不足 5 年）。作者寫「不明」的維度放在虛線格，不補值。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估.json#/內容/優勢來源/優勢（超額報酬大小、持續期間、判定）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;每項優勢有多少證據&lt;/figcaption&gt;&lt;svg viewBox=&quot;0 0 680 128&quot; role=&quot;img&quot; aria-label=&quot;優勢的證據數：好處與屏障&quot;&gt;&lt;text x=&quot;254&quot; y=&quot;124&quot; class=&quot;ax&quot;&gt;好處句數&lt;/text&gt;&lt;text x=&quot;459.0&quot; y=&quot;124&quot; class=&quot;ax&quot;&gt;屏障句數（事實／推論）&lt;/text&gt;&lt;text x=&quot;242&quot; y=&quot;32&quot; class=&quot;lb s&quot; text-anchor=&quot;end&quot;&gt;1 CUDA 軟體生態的轉換成本&lt;title&gt;1 CUDA 軟體生態的轉換成本&lt;/title&gt;&lt;/text&gt;&lt;rect x=&quot;250&quot; y=&quot;20&quot; width=&quot;82.5&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;337.5&quot; y=&quot;33&quot; class=&quot;vl s&quot;&gt;2&lt;/text&gt;&lt;rect x=&quot;455.0&quot; y=&quot;20&quot; width=&quot;123.8&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;var(--pos)&quot;/&gt;&lt;rect x=&quot;578.8&quot; y=&quot;20&quot; width=&quot;41.2&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;var(--accent)&quot; opacity=&quot;.7&quot;/&gt;&lt;text x=&quot;625.0&quot; y=&quot;33&quot; class=&quot;vl s&quot;&gt;3／1&lt;/text&gt;&lt;text x=&quot;242&quot; y=&quot;78&quot; class=&quot;lb s&quot; text-anchor=&quot;end&quot;&gt;2 整櫃系統與供應鏈的規模&lt;title&gt;2 整櫃系統與供應鏈的規模&lt;/title&gt;&lt;/text&gt;&lt;rect x=&quot;250&quot; y=&quot;66&quot; width=&quot;41.2&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;296.2&quot; y=&quot;79&quot; class=&quot;vl s&quot;&gt;1&lt;/text&gt;&lt;rect x=&quot;455.0&quot; y=&quot;66&quot; width=&quot;41.2&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;var(--pos)&quot;/&gt;&lt;rect x=&quot;496.2&quot; y=&quot;66&quot; width=&quot;41.2&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;var(--accent)&quot; opacity=&quot;.7&quot;/&gt;&lt;text x=&quot;542.5&quot; y=&quot;79&quot; class=&quot;vl s&quot;&gt;1／1&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;lg&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c3)&quot;&gt;&lt;/i&gt;好處&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--pos)&quot;&gt;&lt;/i&gt;屏障：事實&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--accent)&quot;&gt;&lt;/i&gt;屏障：推論&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;左邊是「它帶來什麼」的句數，右邊是「為什麼對手拿不走」的句數；屏障至少一句是事實（綠）才算有屏障證據。句數多不等於優勢強，只表示證據量。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估.json#/內容/優勢來源/優勢（好處、屏障的標記）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;div class=&quot;card advc&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;&lt;span class=&quot;num-b 有屏障證據&quot;&gt;1&lt;/span&gt;CUDA 軟體生態的轉換成本&lt;/b&gt;&lt;span class=&quot;vd vd-有屏障證據&quot;&gt;有屏障證據&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;轉換成本（Switching Costs）｜晨星：轉換成本&lt;/div&gt;&lt;div class=&quot;two&quot;&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;好處（它帶來什麼）&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;第二季毛利率 75.0%、第三季 74.8%，都高於去年同季；公司把年增歸因於 Blackwell Ultra 帶來的產品組合改善。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src30&quot;&gt;[30]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src32&quot;&gt;[32]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;公司賣的是 CUDA 與數百套軟體庫加上晶片、網路、系統共同設計的整套平台，客戶買的不只是單顆晶片，這是毛利率能維持在七成以上的原因之一。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src9&quot;&gt;[9]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src30&quot;&gt;[30]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;屏障（為什麼對手拿不走）&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;競爭者 GSI Technology 年報寫 CUDA 對開發者與客戶造成顯著轉換成本與生態鎖定。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src66&quot;&gt;[66]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;客戶 SharonAI 的軟體架構、訓練流程與推論基礎設施都針對 CUDA 最佳化，換平台要改寫這些程式。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src67&quot;&gt;[67]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;全球超過 750 萬名開發者使用 CUDA 與輝達軟體工具，平台在幾乎所有主要伺服器廠與雲端都買得到。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src74&quot;&gt;[74]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;開發者與裝機量越大，平台對客戶的價值越高；對手要追上，不只要做出晶片，還要說服開發者重寫並維護另一套軟體。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src75&quot;&gt;[75]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;two&quot;&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;超額報酬大小&lt;/div&gt;&lt;span class=&quot;lv&quot;&gt;大&lt;/span&gt;&lt;div class=&quot;s&quot;&gt;近四季營業利益率 65.2%，在 AMD、博通、Marvell、高通四家同業中最高（同業百分位 1.0）；近 20 季範圍 15.7%–65.2%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src73&quot;&gt;[73]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;持續期間&lt;/div&gt;&lt;span class=&quot;lv&quot;&gt;5–10年&lt;/span&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;CUDA 鎖定有競爭者與客戶申報佐證，屏障本身堅固；但大型雲端客戶自研晶片（Alphabet、Amazon、Microsoft），OpenAI 與博通的 Jalapeño 直接針對推論端，第四季毛利率指引也降到 71%–72%，屏障在推論端較薄，所以不給 10 年以上。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src76&quot;&gt;[76]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src69&quot;&gt;[69]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src29&quot;&gt;[29]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card advc&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;&lt;span class=&quot;num-b 有屏障證據&quot;&gt;2&lt;/span&gt;整櫃系統與供應鏈的規模&lt;/b&gt;&lt;span class=&quot;vd vd-有屏障證據&quot;&gt;有屏障證據&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;規模經濟（Scale Economies）&lt;/div&gt;&lt;div class=&quot;two&quot;&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;好處（它帶來什麼）&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;第二季研發只占營收 7.3%（一年前 9.2%），卻支撐約 31,000 名研發人員；營收放大讓固定的研發投入攤得更薄。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src77&quot;&gt;[77]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src78&quot;&gt;[78]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;屏障（為什麼對手拿不走）&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;輝達為未來幾年的零組件簽下 3,900 億美元供應承諾，主要是多年期記憶體採購，比上一季增加 1,110 億。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src3&quot;&gt;[3]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;對手要取得同等產能，需要相近規模的預付與承諾；報導指輝達若放緩下單，釋出的台積電產能才會輪到 AMD 與 ASIC 業者，代表產能目前被輝達占住（傳聞）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src3&quot;&gt;[3]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src70&quot;&gt;[70]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;two&quot;&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;超額報酬大小&lt;/div&gt;&lt;span class=&quot;lv&quot;&gt;不明&lt;/span&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-待查&quot;&gt;待查&lt;/span&gt;待查：規模帶來的成本差與 CUDA 帶來的價格差無法從申報分開，要找同業單位成本或分架構毛利。&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;持續期間&lt;/div&gt;&lt;span class=&quot;lv&quot;&gt;不足5年&lt;/span&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;供應承諾部分可取消或調整，產能也會隨台積電擴產與對手下單而重分配；聯發科、世芯等 ASIC 業者已在擴大 AI 加速器業務，規模優勢撐不到 5 年以上。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src34&quot;&gt;[34]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src70&quot;&gt;[70]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;超額報酬的機械參考：利潤率位置&lt;/figcaption&gt;&lt;svg viewBox=&quot;0 0 680 92&quot; role=&quot;img&quot; aria-label=&quot;近四季營業利益率在近20季範圍的位置&quot;&gt;&lt;line x1=&quot;30.0&quot; x2=&quot;30.0&quot; y1=&quot;18&quot; y2=&quot;64&quot; class=&quot;zl&quot;/&gt;&lt;text x=&quot;30.0&quot; y=&quot;84&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;0%&lt;/text&gt;&lt;line x1=&quot;185.0&quot; x2=&quot;185.0&quot; y1=&quot;18&quot; y2=&quot;64&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;185.0&quot; y=&quot;84&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;20%&lt;/text&gt;&lt;line x1=&quot;340.0&quot; x2=&quot;340.0&quot; y1=&quot;18&quot; y2=&quot;64&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;340.0&quot; y=&quot;84&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;40%&lt;/text&gt;&lt;line x1=&quot;495.0&quot; x2=&quot;495.0&quot; y1=&quot;18&quot; y2=&quot;64&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;495.0&quot; y=&quot;84&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;60%&lt;/text&gt;&lt;line x1=&quot;650.0&quot; x2=&quot;650.0&quot; y1=&quot;18&quot; y2=&quot;64&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;650.0&quot; y=&quot;84&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;80%&lt;/text&gt;&lt;rect x=&quot;151.4&quot; y=&quot;30&quot; width=&quot;384.0&quot; height=&quot;22&quot; rx=&quot;4&quot; fill=&quot;var(--biz)&quot; opacity=&quot;.22&quot;/&gt;&lt;text x=&quot;151.4&quot; y=&quot;24&quot; class=&quot;ax&quot;&gt;近 20 季範圍 15.7%～65.2%&lt;/text&gt;&lt;circle cx=&quot;535.4&quot; cy=&quot;41&quot; r=&quot;7&quot; fill=&quot;var(--biz)&quot;/&gt;&lt;text x=&quot;535.4&quot; y=&quot;76&quot; class=&quot;vl s&quot; text-anchor=&quot;middle&quot;&gt;近四季 65.2%&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;藍帶是近 20 季的近四季營業利益率範圍，圓點是最新值；同業營業利益率百分位 1.0（1＝同業最高）。只供對照「超額報酬大小」，不是分數、不進等級，也不是估值報告的護城河評分。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估底稿.json#/優勢參考&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;p class=&quot;lead&quot;&gt;機械參考（供對照超額報酬，不是分數）：近四季營業利益率 65.2%，近 20 季範圍 15.7%～65.2%，同業營業利益率百分位 1.0。&lt;/p&gt;&lt;div class=&quot;note&quot;&gt;判定規則：屏障欄至少一句標「事實」並附出處才算「有屏障證據」；否則只算「暫時領先」，持續期間最多寫「不足5年」。&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;s4&quot;&gt;&lt;h2&gt;5　生命週期與未來變化&lt;/h2&gt;&lt;div class=&quot;stages&quot;&gt;&lt;div class=&quot;&quot;&gt;起步&lt;/div&gt;&lt;div class=&quot;on&quot;&gt;成長&lt;/div&gt;&lt;div class=&quot;&quot;&gt;成熟&lt;/div&gt;&lt;div class=&quot;&quot;&gt;衰退&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;lead&quot;&gt;估值報告的林區分類（引用，不重判）：快速成長&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;FY2026 營收 2,159 億美元、年增 65.5%；至第二季單季年增 105.9%、近四季年增 83.4%；第三季新聞稿單季年增 103%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src79&quot;&gt;[79]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src80&quot;&gt;[80]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src81&quot;&gt;[81]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src2&quot;&gt;[2]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;近四季營業利益率 65.2%，比一年前高 7.1 個百分點，成長同時帶來利潤率擴張。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src82&quot;&gt;[82]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src56&quot;&gt;[56]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;與研究報告的林區分類「快速成長」一致；該分類另註明兼具週期特徵，本頁第五節的週期推論也把它當成上行段中的成長股看待。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src83&quot;&gt;[83]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src84&quot;&gt;[84]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;callout&quot;&gt;&lt;b&gt;最可能的轉變：成長 → 成熟（以半導體循環下行段的形式出現）&lt;/b&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;營收近四季年增從第三季約 93%（推算）連續回落到 20% 以下，且近四季營業利益率跌破 55%，就代表成長期進入尾段。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src81&quot;&gt;[81]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src85&quot;&gt;[85]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src2&quot;&gt;[2]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;前一次下行段（2024-04 峰 208% 到 2025-10 谷 65.2%）歷時 6 季，但谷底年增仍有 65%；這次若谷底年增掉到 20% 以下，才是性質改變，不只是循環。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src86&quot;&gt;[86]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lead&quot;&gt;怎麼檢驗&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;每季看營收近四季年增與營業利益率近四季（推論紀錄 P1、P2），並對照客製晶片在推論端的採用（外部驗證 N2、N10）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src81&quot;&gt;[81]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src69&quot;&gt;[69]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src70&quot;&gt;[70]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;s5&quot;&gt;&lt;h2&gt;6　週期推論&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;三種證據都寫成「區間＋條件」，不給單一日期。&lt;/p&gt;&lt;div class=&quot;callout&quot;&gt;&lt;b&gt;綜合：未來 1–3 季（期末約 2027 年 1 月至 2027 年 7 月，FY2027 第四季到 FY2028 第二季）營收近四季年增可能見頂，之後進入下行段；見頂前近四季年增仍在 80% 以上&lt;/b&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;單季營收年增已由第二季 105.9% 降到第三季 103%，第四季指引中點約 91%（推算，含多一週；扣掉一週約 77%）；單季年增低於近四季年增後，近四季年增就會在一兩季內轉向。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src80&quot;&gt;[80]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src2&quot;&gt;[2]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src29&quot;&gt;[29]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src26&quot;&gt;[26]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;上行段至第二季已走 3 季，含第三季約 4 季；歷史中位 4 季、最長 7 季。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src87&quot;&gt;[87]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src88&quot;&gt;[88]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src2&quot;&gt;[2]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;若 Rubin 量產順利、供應承諾轉成出貨，見頂可能落在區間後段；若新出口規則、執行長更替導致客戶延後下單或轉向客製晶片，見頂會落在區間前段。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src10&quot;&gt;[10]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src3&quot;&gt;[3]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src47&quot;&gt;[47]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src43&quot;&gt;[43]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;區間以自身歷史上行段長度為主、產業週期為輔；訂單能見度不足，所以不給單一時點。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src88&quot;&gt;[88]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src18&quot;&gt;[18]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;h3&gt;① 自身歷史循環&lt;/h3&gt;&lt;div class=&quot;chart&quot;&gt;&lt;svg viewBox=&quot;0 0 720 240&quot; role=&quot;img&quot; aria-label=&quot;近四季營收年增（2012-04-29～2026-07-26（58 季））&quot;&gt;&lt;line
