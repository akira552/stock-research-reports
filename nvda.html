&lt;div class=&quot;wrap&quot;&gt;&lt;div class=&quot;top&quot;&gt;&lt;div&gt;&lt;b&gt;NVDA&lt;/b&gt;　NVIDIA Corporation（輝達）&lt;/div&gt;&lt;div&gt;財報截至 2026-07-26&lt;/div&gt;&lt;div class=&quot;dl&quot;&gt;&lt;button type=&quot;button&quot; data-dl=&quot;html&quot; data-name=&quot;NVDA_研究報告.html&quot;&gt;下載網頁&lt;/button&gt;&lt;button type=&quot;button&quot; data-dl=&quot;csv&quot; data-name=&quot;NVDA_報告表格.csv&quot;&gt;下載表格（Excel 可開）&lt;/button&gt;&lt;button type=&quot;button&quot; onclick=&quot;window.print()&quot; title=&quot;可選「另存為 PDF」&quot;&gt;列印／另存 PDF&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;front&quot; id=&quot;front&quot; data-layer=&quot;首頁&quot;&gt;&lt;header class=&quot;hero&quot;&gt;&lt;div&gt;&lt;span class=&quot;stance&quot;&gt;生意品質一流／價格偏貴（單錨點）&lt;/span&gt;&lt;span class=&quot;stance rating&quot;&gt;研究評等　生意品質一流 ／ 價格偏貴（單錨點）（非買賣建議）&lt;/span&gt;&lt;h1&gt;生意一流、正處景氣高峰；收盤價要成立，需長期營業利益率約 71%（目前 65%），或高成長延續得比基準更久&lt;/h1&gt;&lt;p class=&quot;summary&quot;&gt;輝達靠資料中心 &lt;abbr title=&quot;AI（Artificial Intelligence）&quot;&gt;人工智慧&lt;/abbr&gt; 系統賺錢，近四季營業利益率約 65%，資產負債表強。我們以景氣循環公司處理，利潤率逐年回落到正常化水準，合理價值 108.57–135.63 美元（中點 120.56 美元），收盤價 155.46 美元，價格位置偏貴；三情境中只有樂觀情境高於收盤價。收盤價在 Q3 財報公布前（11-17 收盤後公布），估值已併入 Q3 實績與 Q4 指引。研究用途，非買賣建議。&lt;/p&gt;&lt;/div&gt;&lt;/header&gt;&lt;div class=&quot;layer&quot; id=&quot;layer-30s&quot; style=&quot;margin-top:22px&quot;&gt;&lt;div class=&quot;cap&quot; style=&quot;font-weight:700;letter-spacing:.1em&quot;&gt;30 秒版&lt;/div&gt;&lt;section class=&quot;note-box&quot; id=&quot;expected-return&quot; style=&quot;margin-top:18px&quot;&gt;&lt;h3&gt;以現價買進的預期年報酬&lt;/h3&gt;&lt;p style=&quot;font-size:20px;font-weight:700;margin:4px 0 8px&quot;&gt;基準情境成真時，每年約 9.2%&lt;/p&gt;&lt;div class=&quot;rows&quot;&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;10 年期美國公債&lt;/span&gt;&lt;span&gt;5.1%&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;本報告要求報酬（&lt;abbr title=&quot;WACC（Weighted Average Cost of Capital）&quot;&gt;資金成本&lt;/abbr&gt;）&lt;/span&gt;&lt;span&gt;11.5%&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;保守情境成真時&lt;/span&gt;&lt;span&gt;6.1%&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;樂觀情境成真時&lt;/span&gt;&lt;span&gt;13.5%&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin:8px 0 0&quot;&gt;條件式推算：各情境成真、以收盤價買進時的年化報酬（使估值等於現價的折現率）；不是機率加權結果，也不是預測；非買賣建議，不進研究評等。&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;note-box&quot; id=&quot;bet&quot; style=&quot;margin-top:18px&quot;&gt;&lt;h3&gt;你在賭什麼：要讓現價 155.46 合理，長期營業利益率得維持多少？&lt;/h3&gt;&lt;p class=&quot;cap&quot; style=&quot;margin:0&quot;&gt;欄是折現率，列是成長情境&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table style=&quot;min-width:0;font-size:14px&quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th style=&quot;white-space:nowrap;text-align:center&quot;&gt;11.5%&lt;br&gt;&lt;small&gt;本報告&lt;/small&gt;&lt;/th&gt;&lt;th style=&quot;white-space:nowrap;text-align:center&quot;&gt;10.0%&lt;/th&gt;&lt;th style=&quot;white-space:nowrap;text-align:center&quot;&gt;9.0%&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td style=&quot;text-align:center&quot;&gt;&lt;b style=&quot;color:var(--neg)&quot;&gt;不可能&lt;/b&gt;&lt;/td&gt;&lt;td style=&quot;text-align:center&quot;&gt;&lt;b style=&quot;color:var(--neg)&quot;&gt;不可能（85%）&lt;/b&gt;&lt;/td&gt;&lt;td style=&quot;text-align:center&quot;&gt;&lt;b style=&quot;color:#b7791f&quot;&gt;69%&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td style=&quot;text-align:center&quot;&gt;&lt;b style=&quot;color:#b7791f&quot;&gt;71%&lt;/b&gt;&lt;/td&gt;&lt;td style=&quot;text-align:center&quot;&gt;&lt;b style=&quot;color:var(--pos)&quot;&gt;52%&lt;/b&gt;&lt;/td&gt;&lt;td style=&quot;text-align:center&quot;&gt;&lt;b style=&quot;color:var(--pos)&quot;&gt;42%&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td style=&quot;text-align:center&quot;&gt;&lt;b style=&quot;color:var(--pos)&quot;&gt;37%&lt;/b&gt;&lt;/td&gt;&lt;td style=&quot;text-align:center&quot;&gt;&lt;b style=&quot;color:var(--pos)&quot;&gt;26%&lt;/b&gt;&lt;/td&gt;&lt;td style=&quot;text-align:center&quot;&gt;&lt;b style=&quot;color:var(--pos)&quot;&gt;20%&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;目前營業利益率 65.2%（近四季）。綠＝不高於目前，現在就做得到；黃＝要比現在更好；紅＝解不到或高於 80%。利潤率由目前逐年走到該值，其他假設照各情境；條件式推算，非預測、非買賣建議。&lt;/p&gt;&lt;/section&gt;&lt;section id=&quot;lights&quot; style=&quot;margin-top:18px&quot;&gt;&lt;h3&gt;四個面向&lt;/h3&gt;&lt;div class=&quot;kpis&quot;&gt;&lt;div class=&quot;kpi&quot; style=&quot;border-left:4px solid var(--pos)&quot;&gt;&lt;div class=&quot;l&quot;&gt;生意品質&lt;/div&gt;&lt;div class=&quot;v&quot; style=&quot;color:var(--pos)&quot;&gt;一流&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;護城河、投入資本報酬、現金流品質、資產負債表、治理五項合評&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot; style=&quot;border-left:4px solid var(--pos)&quot;&gt;&lt;div class=&quot;l&quot;&gt;商業動能&lt;/div&gt;&lt;div class=&quot;v&quot; style=&quot;color:var(--pos)&quot;&gt;B（五級 A–E）&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;商業評估分頁：模式穩固度、成長動能、卡住訊號&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot; style=&quot;border-left:4px solid var(--pos)&quot;&gt;&lt;div class=&quot;l&quot;&gt;信用與存活&lt;/div&gt;&lt;div class=&quot;v&quot; style=&quot;color:var(--pos)&quot;&gt;無明顯警訊&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;機構 未揭露／推導 AAA；12～24 個月存活檢查（推導，非違約預測）&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot; style=&quot;border-left:4px solid var(--neg)&quot;&gt;&lt;div class=&quot;l&quot;&gt;價格&lt;/div&gt;&lt;div class=&quot;v&quot; style=&quot;color:var(--neg)&quot;&gt;偏貴&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;單錨點（常態區間要用正常化盈餘，目前不適用）；對照合理價值區間與買入上限，非買賣建議&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;/div&gt;&lt;div class=&quot;layer&quot; id=&quot;layer-try&quot; style=&quot;margin-top:22px&quot;&gt;&lt;div class=&quot;cap&quot; style=&quot;font-weight:700;letter-spacing:.1em&quot;&gt;自己試試看&lt;/div&gt;&lt;section class=&quot;note-box&quot; id=&quot;tool&quot; style=&quot;margin-top:18px&quot;&gt;&lt;h3&gt;調整假設，看每股值多少&lt;/h3&gt;&lt;div class=&quot;seg&quot; style=&quot;display:flex;gap:6px&quot;&gt;&lt;button type=&quot;button&quot; data-s=&quot;保守&quot; aria-pressed=&quot;false&quot; style=&quot;flex:1;padding:6px&quot;&gt;保守&lt;br&gt;&lt;small&gt;第 1 年 +43%&lt;/small&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; data-s=&quot;基準&quot; aria-pressed=&quot;true&quot; style=&quot;flex:1;padding:6px&quot;&gt;基準&lt;br&gt;&lt;small&gt;第 1 年 +60%&lt;/small&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; data-s=&quot;樂觀&quot; aria-pressed=&quot;false&quot; style=&quot;flex:1;padding:6px&quot;&gt;樂觀&lt;br&gt;&lt;small&gt;第 1 年 +75%&lt;/small&gt;&lt;/button&gt;&lt;/div&gt;&lt;label style=&quot;display:block;margin-top:10px&quot;&gt;10 年後的營業利益率 &lt;b id=&quot;t-mv&quot;&gt;&lt;/b&gt;&lt;input id=&quot;t-m&quot; type=&quot;range&quot; min=&quot;18.0&quot; max=&quot;80.0&quot; step=&quot;0.5&quot; style=&quot;width:100%&quot;&gt;&lt;/label&gt;&lt;small class=&quot;cap&quot;&gt;目前 65.2%；第 1～5 年照情境，之後逐年走到這個數字&lt;/small&gt;&lt;label style=&quot;display:block;margin-top:10px&quot;&gt;折現率（要求的報酬） &lt;b id=&quot;t-wv&quot;&gt;&lt;/b&gt;&lt;input id=&quot;t-w&quot; type=&quot;range&quot; min=&quot;8.5&quot; max=&quot;14.5&quot; step=&quot;0.1&quot; style=&quot;width:100%&quot;&gt;&lt;/label&gt;&lt;small class=&quot;cap&quot;&gt;本報告 11.5%；10 年期美國公債 5.12%&lt;/small&gt;&lt;div class=&quot;rows&quot; style=&quot;margin-top:10px&quot;&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;每股價值（這組假設）&lt;/span&gt;&lt;span&gt;&lt;b id=&quot;t-out&quot; style=&quot;font-size:22px&quot;&gt;&lt;/b&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;與現價 155.46 比&lt;/span&gt;&lt;span id=&quot;t-diff&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;p id=&quot;t-say&quot; style=&quot;margin:6px 0 0&quot;&gt;&lt;/p&gt;&lt;p class=&quot;cap&quot;&gt;簡化模型：同估值引擎的式子，只改這三項；預設值與引擎各情境一致，和完整報告的機率加權合理價值可能差 ±10%。本報告合理價值區間 108.57–135.63（三情境機率加權）。非目標價、非買賣建議。&lt;/p&gt;&lt;script type=&quot;application/json&quot; id=&quot;tool-data&quot;&gt;{&quot;base_revenue&quot;: 302969, &quot;bridge&quot;: {&quot;cash&quot;: 22443, &quot;securities&quot;: 128083, &quot;securities_haircut&quot;: 0.19, &quot;operating_cash_reserve&quot;: 0, &quot;debt&quot;: 33366, &quot;other_claims&quot;: 6588, &quot;shares&quot;: 24285}, &quot;wacc&quot;: 0.11524536692895838, &quot;price&quot;: 155.46, &quot;情境&quot;: {&quot;保守&quot;: {&quot;growth&quot;: [0.43, 0.002, 0.05, 0.03, 0.03], &quot;ebit_margin&quot;: [ &lt;/script&gt;&lt;/section&gt;&lt;section class=&quot;note-box&quot; id=&quot;ledger&quot; style=&quot;margin-top:18px&quot;&gt;&lt;h3&gt;上次預測對答案&lt;/h3&gt;&lt;p&gt;&lt;b&gt;上次（通過版_20261117）以來改了什麼：&lt;/b&gt;合理價值中點 110.22541873338199 → 120.56053040114887；收盤價 156.14 → 155.46。期間落空：無落空項目。&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;狀態&lt;/th&gt;&lt;th&gt;預測&lt;/th&gt;&lt;th&gt;檢驗時點&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b style=&quot;color:var(--muted)&quot;&gt;待公布&lt;/b&gt;&lt;/td&gt;&lt;td&gt;P1　2027 財年 第三季（至 2026-10-25）單季營收年增在 80% 以上（指引 1,080 億 ±2% 對去年同季 570.1 億，推算下緣約 85.7%）&lt;/td&gt;&lt;td&gt;2027 財年 第三季 10-Q（約 2026 年 11 月底）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b style=&quot;color:var(--muted)&quot;&gt;待公布&lt;/b&gt;&lt;/td&gt;&lt;td&gt;P2　到 2027 財年 第四季（至 2027-01-31）近四季營業利益率仍在 60% 以上（利潤率上行段延續，未隨換代或執行長更替下滑）&lt;/td&gt;&lt;td&gt;2027 財年 10-K（約 2027 年 3 月）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b style=&quot;color:var(--muted)&quot;&gt;待公布&lt;/b&gt;&lt;/td&gt;&lt;td&gt;P3　存貨增速減營收增速到 2027 財年 第四季不高於基準季的 27.7 個百分點（原料與在製品隨 Rubin 出貨轉成營收，差距不再擴大；比觀察清單的 40 點警戒線更嚴）&lt;/td&gt;&lt;td&gt;2027 財年 10-K（約 2027 年 3 月）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b style=&quot;color:var(--muted)&quot;&gt;待公布&lt;/b&gt;&lt;/td&gt;&lt;td&gt;P4　美國電腦與電子產品產能利用率到 2027 年 3 月仍在 74% 以上（產業上行段延續）&lt;/td&gt;&lt;td&gt;G.17 2027 年 3 月資料（約 2027 年 4 月中）&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;來源：商業評估的推論紀錄與觀察清單（預測帳本）；另有觀察清單 5 條待公布，見商業評估分頁。新財報進來後變成命中或落空；只描述，不是買賣建議。&lt;/p&gt;&lt;/section&gt;&lt;/div&gt;&lt;div class=&quot;layer&quot; id=&quot;layer-3min&quot; style=&quot;margin-top:22px&quot;&gt;&lt;div class=&quot;cap&quot; style=&quot;font-weight:700;letter-spacing:.1em&quot;&gt;3 分鐘版&lt;/div&gt;&lt;div class=&quot;grid2 front-pts&quot; style=&quot;margin-top:18px&quot;&gt;&lt;div&gt;&lt;h3&gt;三個看好的理由&lt;/h3&gt;&lt;ol class=&quot;pts&quot;&gt;&lt;li&gt;資料中心系統占營收約九成；Q3 營收 1,158 億、年增 103%，Q4 指引 1,300 億 ±3%，近期能見度高。&lt;/li&gt;&lt;li&gt;CUDA（輝達的 &lt;abbr title=&quot;GPU（Graphics Processing Unit）&quot;&gt;圖形處理器&lt;/abbr&gt; 程式開發平台）生態造成轉換成本，客戶與同業的 &lt;abbr title=&quot;SEC（Securities and Exchange Commission）&quot;&gt;美國證管會&lt;/abbr&gt; 申報都這樣寫；Q3 毛利率 74.8%。&lt;/li&gt;&lt;li&gt;資產負債表強：有息負債只有 &lt;abbr title=&quot;EBITDA（Earnings Before Interest, Taxes, Depreciation and Amortization）&quot;&gt;稅息折舊攤銷前獲利&lt;/abbr&gt;（稅息折舊攤銷前利益）的 0.17 倍，自由現金流足以支付回購與成長投入。&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;&lt;div&gt;&lt;h3&gt;三個風險&lt;/h3&gt;&lt;ol class=&quot;pts risk&quot;&gt;&lt;li&gt;創辦人執行長 11-11 辭任、財務長暫代，國會 12 月傳喚與聽證，關鍵人物與政策風險同時升高。&lt;/li&gt;&lt;li&gt;客戶集中且大客戶自研晶片，推論晶片的價格與市占可能被追近。&lt;/li&gt;&lt;li&gt;對客戶的融資保證最大曝險合計 1,180 億美元（其中 SB Energy 1,050 億，8-K 2026-11-17 本文 §54），人工智慧 資本支出降溫時風險回到輝達。&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;note-box&quot; id=&quot;when-fair&quot;&gt;&lt;b&gt;什麼條件下現價算合理&lt;/b&gt;&lt;ul&gt;&lt;li&gt;高成長多撐兩年（第 1 年成長率多維持兩年，其他照基準）：每股約 178.51（比現價高 15%）&lt;/li&gt;&lt;li&gt;長期營業利益率維持目前 65.2%（其他照基準）：每股約 147.38（比現價低 5%）&lt;/li&gt;&lt;li&gt;成長照樂觀、利潤率照基準：每股約 169.32（比現價高 9%）&lt;/li&gt;&lt;/ul&gt;&lt;p class=&quot;cap&quot;&gt;用估值引擎同一條式子、本報告折現率 11.5% 算；每條只改一項假設，其他照基準情境。買入上限放在下方「完整底稿」的價格框。非目標價、非買賣建議。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;note-box mv&quot;&gt;&lt;b&gt;市場價格隱含什麼、我們哪裡不同&lt;/b&gt;&lt;p&gt;收盤價（Q3 財報公布前）隱含未來 5 年營收每年約 18.1%（市價反推未來 5 年營收年增；市價 155.46 美元、收盤 2026-11-17；折現率 11.52%，沿用 2026-11-16 無風險利率 5.12%；推導）（估值引擎的衰退期也從這個成長率起降，15 年年複合約 12.4%、基準約 8.0%，推導）、第 15 年（明示期末）約 20.0 倍 &lt;abbr title=&quot;EV/EBIT（Enterprise Value / Earnings Before Interest and Taxes）&quot;&gt;企業價值對營業利益倍數&lt;/abbr&gt;；我們認為高峰利潤率會回落，基準情境只給 116.02 美元，只有樂觀情境高於收盤價。&lt;/p&gt;&lt;/div&gt;&lt;div id=&quot;triggers&quot; class=&quot;tm&quot;&gt;&lt;h3&gt;風險與改變判斷&lt;/h3&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;risk-tbl&quot; style=&quot;min-width:0;width:100%&quot;&gt;&lt;tr&gt;&lt;th style=&quot;white-space:normal;width:64%&quot;&gt;情況（看哪個指標、門檻多少）&lt;/th&gt;&lt;th style=&quot;white-space:normal;width:22%&quot;&gt;會改變什麼判斷&lt;/th&gt;&lt;th style=&quot;white-space:normal;width:14%&quot;&gt;歷史基準比率&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;調查或政府行動揭露公司層級出口管制違規或罰款&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;治理下修為弱（NVDA-C12）&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;Q4 營收低於指引下緣約 1,261 億，或下季指引低於當季實績&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;檢討基準第 1 年 +60%（NVDA-C03）&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;單季毛利率連兩季低於 70%（近四季 74.7%）&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;護城河由寬轉窄（NVDA-C01）&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;存貨天數連兩季高於 150 天且應收增速續高於營收&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;現金流品質下修（NVDA-C08）&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;增量 &lt;abbr title=&quot;ROIC（Return on Invested Capital）&quot;&gt;投入資本報酬率&lt;/abbr&gt; 降到 50% 以下（目前 185.8%），投入回報轉弱&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;檢討護城河分級&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;SB Energy（OpenAI 俄亥俄資料中心租約的出租人）保證觸發或認列保證負債&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;資產負債表由強轉中（NVDA-C11）&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;執行長辭任後接班不明，暫代者是財務長，產品路線圖執行可能受影響&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;未設門檻：持續觀察&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;中國出口管制擴大：H200（輝達資料中心晶片，銷往中國需美方許可）已停售、11-16 遠端存取新規，Q4 指引不計中國資料中心運算（N12）&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;未設門檻：持續觀察&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;大客戶自研推論晶片，價格與市占被追近&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;未設門檻：持續觀察&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;客戶資料中心受電力與資金限制，採購可能延後，存貨與承諾變成負擔&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;未設門檻：持續觀察&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;歷史基準比率＝成功幾率口徑，是同規模公司歷史上做到的比例，不是這家公司的預測；「—」＝沒有可對照的歷史基準，不估機率。營收成長類的列：同規模（營收 500 億美元以上）公司 10 年實質年增做到模型基準 8.3% 的歷史比例（超額報酬期間檢查.json 基準比率；Base Rate Book）。&lt;/p&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; id=&quot;sanity-front&quot;&gt;&lt;b&gt;合理性檢查：&lt;/b&gt;紅燈 2、黃燈 7（紅：&lt;abbr title=&quot;DCF（Discounted Cash Flow）&quot;&gt;現金流折現&lt;/abbr&gt; 中點與其他方法中點差距、保守（或積極）假設疊加項數）。只提醒、不改評等；逐項與作者說明見計算底稿 5。&lt;/p&gt;&lt;/div&gt;&lt;p class=&quot;cap fnote&quot;&gt;資料日期：財報截至 2026-07-26；市場資料 2026-11-17 收盤 155.46 美元。首家產業，公版待驗證（景氣循環／半導體；產業公版的估值法與指標選擇尚未經兩家以上驗證）。本報告為研究用途，研究評等與條件式目標區間都不是買賣建議；數字截至 2026-11-17 收盤與 2026-07-26 財報（10-Q）；2027 財年 Q3 財報 11-17 收盤後公布，收盤價未反映，估值第 1 年成長已併入 Q3 實績與 Q4 指引。本研究只評估公司本身，不評估讀者自身的資金期限與等待能力。完整數字見正文&lt;a href=&quot;#numbers&quot;&gt;「完整數字」&lt;/a&gt;；名詞與每條判斷的證據狀態見&lt;a href=&quot;#more&quot;&gt;附錄&lt;/a&gt;。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;

&lt;main class=&quot;wrap&quot;&gt;&lt;details id=&quot;full&quot; class=&quot;fullwrap&quot;&gt;&lt;summary style=&quot;cursor:pointer;font-weight:700;font-size:18px;padding:14px 0&quot;&gt;完整底稿：價格框與買入上限、正文七題、計算底稿、附錄與出處（點開）&lt;/summary&gt;&lt;div data-layer=&quot;正文&quot;&gt;&lt;section class=&quot;q&quot; id=&quot;price-detail&quot; data-layer=&quot;完整底稿&quot;&gt;&lt;div class=&quot;qno&quot;&gt;價格&lt;/div&gt;&lt;h2&gt;價格框、合理價值與市價隱含倍數&lt;/h2&gt;&lt;div class=&quot;hero&quot;&gt;&lt;aside class=&quot;pricebox&quot;&gt;&lt;div class=&quot;sub&quot;&gt;2026-11-17 收盤 155.46 美元&lt;/div&gt;&lt;div class=&quot;big&quot;&gt;155.46&lt;span style=&quot;font-size:18px&quot;&gt; 美元&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;zones&quot;&gt;&lt;div class=&quot;zone buy&quot; style=&quot;grid-column:1/-1&quot;&gt;&lt;span&gt;買入上限（不確定性高）&lt;/span&gt;&lt;b&gt;72 美元&lt;/b&gt;&lt;small&gt;股價在此以下才有 40% 安全邊際；＝合理價值中點 120.56 ×（1−40%）。非買賣建議。&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;rows&quot;&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;股價 ÷ 合理價值中點&lt;/span&gt;&lt;span&gt;1.29 倍&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;10 年期美國公債&lt;/span&gt;&lt;span&gt;5.12%&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;r&quot;&gt;&lt;span&gt;市價隱含 5 年營收年增&lt;/span&gt;&lt;span&gt;18.1%&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;現金（2026-07-26）&lt;/span&gt;&lt;span&gt;224 億美元&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;流動有價證券&lt;/span&gt;&lt;span&gt;341 億美元&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;權益證券（不計入淨現金）&lt;/span&gt;&lt;span&gt;428 億美元&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;有息負債&lt;/span&gt;&lt;span&gt;334 億美元&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;淨現金（現金＋流動有價證券−有息負債）&lt;/span&gt;&lt;span&gt;232 億美元&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;近四季回購&lt;/span&gt;&lt;span&gt;553 億美元&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;近四季公開市場回購均價（高於合理價值區間）&lt;/span&gt;&lt;span&gt;190.89 美元&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot; style=&quot;display:block&quot;&gt;&lt;span&gt;股東回報與權益（2022–2026）：&lt;/span&gt;&lt;span style=&quot;font-weight:400&quot;&gt;權益被回購壓低，ROE 偏高失真，請看投入資本報酬率；股東權益 266→1,573 億美元；股利＋回購占自由現金流 49%（逐年表見第六題）&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; id=&quot;cont-note&quot; style=&quot;margin:10px 0 0&quot;&gt;這個數字只描述現價與本報告合理價值中點的距離，不改價格位置與研究評等。非買賣建議。&lt;/p&gt;&lt;/aside&gt;&lt;/div&gt;&lt;section class=&quot;note-box&quot; id=&quot;value-trio&quot; style=&quot;margin-top:18px&quot;&gt;&lt;h3&gt;合理價值與市價隱含第 15 年倍數&lt;/h3&gt;&lt;div class=&quot;zones&quot; style=&quot;grid-template-columns:repeat(2,1fr)&quot;&gt;&lt;div class=&quot;zone&quot;&gt;&lt;span&gt;合理價值（只含折現率）&lt;/span&gt;&lt;b&gt;109–136 美元&lt;/b&gt;&lt;small&gt;中點 120.56 美元；三情境機率加權&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;zone mkt&quot;&gt;&lt;span&gt;市價隱含第 15 年倍數（EV/EBIT，基準情境）&lt;/span&gt;&lt;b&gt;20.0 倍&lt;/b&gt;&lt;small&gt;模型假設 8.6 倍，市價隱含是模型的 2.3 倍；折現率區間 16.2–24.4 倍；參考帶（跨產業，1046 筆、51 家）中位 15.5 倍、四分位 7.8–27.6 倍、p90 42.7 倍（機械回測樣本，非市場全體；分產業的筆數與公司數少，僅供參考）；只描述，不進評等&lt;br&gt;特例：獲利處於循環位置，倍數僅供參考；明示期 15 年，參考帶是 10 年機械回測，倍數不直接比，僅供參考&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;參考帶中位（跨產業） 15.5 倍時，機率加權每股約 147 美元（條件式，非目標價、非買賣建議，不進評等；各倍數對照見計算底稿 5）。&lt;/p&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;&lt;b&gt;合理價值 vs 市價隱含倍數（作者判讀）：&lt;/b&gt;市價隱含第 15 年（明示期末）EV/EBIT 約 20.0 倍，是模型終值倍數 8.6 倍 的 2.33 倍。特例：輝達處於景氣高峰、基期利潤率偏高，且本模型明示期 15 年、參考帶是 10 年機械回測，倍數只供參考；隱含倍數介於跨產業參考帶中位 15.5 倍與 p75 27.6 倍之間。市價等於假設第 15 年仍是高成長、高利潤的公司，我們假設屆時回到成熟水準；只描述，不當評等理由。&lt;/p&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:10px;font-size:15px;line-height:1.7&quot;&gt;上面的合理價值只含折現率高低；三情境全幅 61～221（情境與折現率一起算，約中點的 133%）；寬主要來自情境（差距 110%），不是折現率（22%）。情境差距＝（樂觀－保守）÷基準，折現率寬度＝（高－低）÷中點；非買賣建議。&lt;/p&gt;&lt;div class=&quot;tw&quot; style=&quot;margin-top:14px&quot;&gt;&lt;table class=&quot;txt&quot; style=&quot;min-width:0;font-size:16px&quot;&gt;&lt;tr&gt;&lt;th style=&quot;padding:9px 12px;font-size:15px&quot;&gt;情境&lt;/th&gt;&lt;th style=&quot;padding:9px 12px;font-size:15px&quot;&gt;每股價值&lt;/th&gt;&lt;th style=&quot;padding:9px 12px;font-size:15px&quot;&gt;權重&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;padding:9px 12px&quot;&gt;保守&lt;/td&gt;&lt;td style=&quot;padding:9px 12px;font-size:20px;font-weight:700&quot;&gt;66.22&lt;/td&gt;&lt;td style=&quot;padding:9px 12px&quot;&gt;30%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;padding:9px 12px&quot;&gt;基準&lt;div style=&quot;font-size:13px;line-height:1.5;color:var(--muted);margin-top:2px&quot;&gt;與外部 DCF 單點同口徑；今天的現值，不是 12 個月目標價，非買賣建議&lt;/div&gt;&lt;/td&gt;&lt;td style=&quot;padding:9px 12px;font-size:20px;font-weight:700&quot;&gt;116.02&lt;/td&gt;&lt;td style=&quot;padding:9px 12px&quot;&gt;45%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;padding:9px 12px&quot;&gt;樂觀&lt;/td&gt;&lt;td style=&quot;padding:9px 12px;font-size:20px;font-weight:700&quot;&gt;193.93&lt;/td&gt;&lt;td style=&quot;padding:9px 12px&quot;&gt;25%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:10px;font-size:15px;line-height:1.7&quot;&gt;中點是三個情境的加權，上下緣是換折現率重算；算式見&lt;a href=&quot;#valuation&quot;&gt;第五題&lt;/a&gt;。情境表說明合理價值怎麼組成，不是單一目標價。&lt;/p&gt;&lt;/section&gt;&lt;div class=&quot;kpis&quot;&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;l&quot;&gt;景氣正常化利潤率&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;37.7%（跨循環十年平均營業利益率，推導）&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;總經景氣位置的十年平均營業利益率（FY2017–FY2026，推導）；估值與第二題用產業指標十一年平均 35.6%（多含 FY2016 低點）；近四季 65.2%，景氣位置高峰&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;l&quot;&gt;近四季營收年增&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;+83.4%&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;近四季至 2026-07-26；Q3 單季 +103%（8-K 2026-11-17，收盤後公布）&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;l&quot;&gt;產能與訂單：供應承諾&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;3,900 億美元&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;2026-10-25，上季 2,790 億、主要是多年期記憶體採購；訂單出貨比未揭露（8-K 2026-11-17 本文 §44）&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;l&quot;&gt;每股自由現金流扣股權薪酬&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;4.91 美元&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;近四季；未扣股權薪酬 5.21 美元（財務指標）&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;note-box&quot; id=&quot;survival&quot; style=&quot;border-left-color:var(--pos)&quot;&gt;&lt;p style=&quot;margin:0&quot;&gt;&lt;b&gt;信用評級&lt;/b&gt;　機構 未揭露／推導 AAA（只看利息保障倍數，425.8 倍，近四季新借款多、利息偏低、評級可能偏高）｜依推導：投資等級　｜　&lt;a href=&quot;#survival-detail&quot;&gt;&lt;b&gt;存活檢查（12～24 個月）&lt;/b&gt;&lt;/a&gt;　&lt;b style=&quot;color:var(--pos)&quot;&gt;無明顯警訊&lt;/b&gt;（推導，非違約預測；理由見第六題計算底稿）&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;business&quot;&gt;&lt;div class=&quot;qno&quot;&gt;問題 01&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;生意怎麼賺錢？&lt;/div&gt;&lt;h2&gt;賣資料中心 AI 系統，九成營收、利潤率約 65%。&lt;/h2&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;輝達的錢幾乎都來自資料中心：FY2026 資料中心營收約占九成，近四季營業利益率 65.2%（財務指標）。&lt;/strong&gt;高利潤率來自整套系統加軟體一起賣，客戶買的是可直接上線的算力，不是單顆晶片。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;反方是集中：前兩大直接客戶占 FY2026 營收 36%（NVDA-C10）。&lt;/strong&gt;這些客戶也在自研晶片，一旦把推論工作移走，營收與利潤率會同時受影響。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;產品線營收占比（FY26，億美元；逐年金額與成長見下方明細表；圖的占比分母為圖中各線合計）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 480 280&quot; role=&quot;img&quot; aria-label=&quot;產品線營收&quot; class=&quot;chart&quot; style=&quot;max-width:624px&quot;&gt;&lt;path d=&quot;M240.0,52.0 A88,88 0 1 1 152.0,139.0 L186.0,139.4 A54,54 0 1 0 240.0,86.0 Z&quot; fill=&quot;var(--c1)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;資料中心運算：1,624（75%）&lt;/title&gt;&lt;/path&gt;&lt;path d=&quot;M152.0,139.0 A88,88 0 0 1 187.0,69.7 L207.5,96.9 A54,54 0 0 0 186.0,139.4 Z&quot; fill=&quot;var(--c2)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;資料中心網路：314（15%）&lt;/title&gt;&lt;/path&gt;&lt;path d=&quot;M187.0,69.7 A88,88 0 0 1 224.3,53.4 L230.4,86.9 A54,54 0 0 0 207.5,96.9 Z&quot; fill=&quot;var(--c6)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;遊戲：160（7%）&lt;/title&gt;&lt;/path&gt;&lt;path d=&quot;M224.3,53.4 A88,88 0 0 1 240.0,52.0 L240.0,86.0 A54,54 0 0 0 230.4,86.9 Z&quot; fill=&quot;var(--muted)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;其他：61.6（3%）&lt;/title&gt;&lt;/path&gt;&lt;polyline points=&quot;304.7,205.4 310.3,218.2 346.0,218.2&quot; fill=&quot;none&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;1&quot;/&gt;&lt;text x=&quot;354.0&quot; y=&quot;215.2&quot; class=&quot;lab&quot; text-anchor=&quot;start&quot;&gt;資料中心運算&lt;/text&gt;&lt;text x=&quot;354.0&quot; y=&quot;233.2&quot; class=&quot;val&quot; text-anchor=&quot;start&quot;&gt;75%&lt;tspan class=&quot;ax&quot; font-weight=&quot;400&quot;&gt;　1,624&lt;/tspan&gt;&lt;/text&gt;&lt;polyline points=&quot;157.9,98.5 150.8,106.4 134.0,106.4&quot; fill=&quot;none&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;1&quot;/&gt;&lt;text x=&quot;126.0&quot; y=&quot;103.4&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;資料中心網路&lt;/text&gt;&lt;text x=&quot;126.0&quot; y=&quot;121.4&quot; class=&quot;val&quot; text-anchor=&quot;end&quot;&gt;15%&lt;tspan class=&quot;ax&quot; font-weight=&quot;400&quot;&gt;　314&lt;/tspan&gt;&lt;/text&gt;&lt;polyline points=&quot;203.1,55.7 199.9,68.4 134.0,68.4&quot; fill=&quot;none&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;1&quot;/&gt;&lt;text x=&quot;126.0&quot; y=&quot;65.4&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;遊戲&lt;/text&gt;&lt;text x=&quot;126.0&quot; y=&quot;83.4&quot; class=&quot;val&quot; text-anchor=&quot;end&quot;&gt;7%&lt;tspan class=&quot;ax&quot; font-weight=&quot;400&quot;&gt;　160&lt;/tspan&gt;&lt;/text&gt;&lt;polyline points=&quot;231.8,48.4 231.1,30.4 134.0,30.4&quot; fill=&quot;none&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;1&quot;/&gt;&lt;text x=&quot;126.0&quot; y=&quot;27.4&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;其他&lt;/text&gt;&lt;text x=&quot;126.0&quot; y=&quot;45.4&quot; class=&quot;val&quot; text-anchor=&quot;end&quot;&gt;3%&lt;tspan class=&quot;ax&quot; font-weight=&quot;400&quot;&gt;　61.6&lt;/tspan&gt;&lt;/text&gt;&lt;text x=&quot;240.0&quot; y=&quot;136.0&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY26&lt;/text&gt;&lt;text x=&quot;240.0&quot; y=&quot;158.0&quot; class=&quot;val&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:18px&quot;&gt;2,159&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;白話說&lt;/b&gt;每 100 元營收，約 90 元來自資料中心，賺到約 65 元營業利益（近四季）。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;要留意&lt;/b&gt;地區營收按客戶總部，台灣多是代工組裝廠，最終用戶多在美歐。&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;產品線營收明細（億美元；占比為最近財年，分母為各線合計）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;產品線&lt;/th&gt;&lt;th&gt;FY24&lt;/th&gt;&lt;th&gt;FY25&lt;/th&gt;&lt;th&gt;FY26&lt;/th&gt;&lt;th&gt;近四季&lt;/th&gt;&lt;th&gt;最近財年年增&lt;/th&gt;&lt;th&gt;占比&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;資料中心運算&lt;/td&gt;&lt;td&gt;390&lt;/td&gt;&lt;td&gt;1,022&lt;/td&gt;&lt;td&gt;1,624&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;58.9%&lt;/td&gt;&lt;td&gt;75%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;資料中心網路&lt;/td&gt;&lt;td&gt;86&lt;/td&gt;&lt;td&gt;130&lt;/td&gt;&lt;td&gt;314&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;141.5%&lt;/td&gt;&lt;td&gt;15%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;遊戲&lt;/td&gt;&lt;td&gt;104&lt;/td&gt;&lt;td&gt;114&lt;/td&gt;&lt;td&gt;160&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;41.3%&lt;/td&gt;&lt;td&gt;7%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;專業視覺化&lt;/td&gt;&lt;td&gt;16&lt;/td&gt;&lt;td&gt;19&lt;/td&gt;&lt;td&gt;32&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;69.9%&lt;/td&gt;&lt;td&gt;1%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;汽車&lt;/td&gt;&lt;td&gt;11&lt;/td&gt;&lt;td&gt;17&lt;/td&gt;&lt;td&gt;23&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;38.7%&lt;/td&gt;&lt;td&gt;1%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;OEM 與其他&lt;/td&gt;&lt;td&gt;3&lt;/td&gt;&lt;td&gt;4&lt;/td&gt;&lt;td&gt;6&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;59.1%&lt;/td&gt;&lt;td&gt;0%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;business-profile&quot;&gt;&lt;h3&gt;生意介紹：年報重點&lt;/h3&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;輝達從遊戲顯示卡起家，現在九成營收來自資料中心整套系統。&lt;/strong&gt;下面八塊依年報與季報原文整理，每段附出處。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;賣什麼&lt;/p&gt;&lt;h4&gt;賣整座 AI 資料中心的運算與網路，不只是一顆晶片&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;公司自稱資料中心規模的 AI 基礎設施公司：GPU、CPU（中央處理器）、網路、整櫃系統與 &lt;a class=&quot;term&quot; href=&quot;#g0&quot;&gt;CUDA&lt;/a&gt; 軟體一起設計&lt;span class=&quot;src&quot;&gt;（10-K 2026-01-25 Item 1 ¶2–¶4）&lt;/span&gt;。&lt;/strong&gt;FY2026 資料中心營收 1,937 億美元（運算 1,624 億、網路 314 億）；遊戲 160 億、專業視覺化 32 億、汽車 23 億&lt;span class=&quot;src&quot;&gt;（10-K Item 15 Note 16）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;FY2027 起改以資料中心與邊緣運算兩個市場揭露：Q2 資料中心 890 億、邊緣運算 72 億&lt;span class=&quot;src&quot;&gt;（8-K 2026-08-26 本文 §35–§36）&lt;/span&gt;。&lt;/strong&gt;主力產品是 Blackwell Ultra，新一代 Vera Rubin NVL72 已量產出貨&lt;span class=&quot;src&quot;&gt;（8-K 2026-11-17 新聞稿 §5）&lt;/span&gt;。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;誰付錢、怎麼賣&lt;/p&gt;&lt;h4&gt;付錢的是少數大型雲端業者與 AI 公司，集中度高&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;直接客戶是代工組裝廠、經銷商與雲端業者，間接客戶另含 AI 模型公司、企業與政府&lt;span class=&quot;src&quot;&gt;（10-K 2026-01-25 Item 7 ¶67）&lt;/span&gt;。&lt;/strong&gt;FY2026 單一直接客戶占營收 22%、另一家 14%&lt;span class=&quot;src&quot;&gt;（10-K 2026-01-25 Item 1A ¶166；Item 7 ¶68）&lt;/span&gt;；2026-07-26 五家直接客戶合占應收帳款約七成&lt;span class=&quot;src&quot;&gt;（10-Q 2026-07-26 Item 1 ¶124）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;我們的判讀：前幾大客戶同時是潛在對手，Alphabet、Amazon、Microsoft 都在自研晶片&lt;span class=&quot;src&quot;&gt;（10-K 2026-01-25 Item 1 ¶70）&lt;/span&gt;，議價力是雙向的。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;營收結構：誰在拉動&lt;/p&gt;&lt;h4&gt;成長幾乎全來自資料中心，遊戲已是小業務&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;FY2026 營收 2,159 億美元，資料中心約占 90%、遊戲約 7%&lt;span class=&quot;src&quot;&gt;（推導，10-K 2026-01-25 Item 15 Note 16）&lt;/span&gt;。&lt;/strong&gt;Q2 單季營收 962 億、年增 106%，資料中心年增 117%，約占單季增量的 97%&lt;span class=&quot;src&quot;&gt;（推導，8-K 2026-08-26 本文 §34–§35）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;資料中心內，超大型雲端營收年增逾一倍，AI 雲、產業與企業（&lt;a class=&quot;term&quot; href=&quot;#g1&quot;&gt;ACIE&lt;/a&gt;）年增 138%，由 AI 原生公司、企業與主權客戶拉動&lt;span class=&quot;src&quot;&gt;（8-K 2026-08-26 本文 §35）&lt;/span&gt;。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;市場、地區與重點專案&lt;/p&gt;&lt;h4&gt;美國總部客戶占六成以上，台灣多為代工組裝出貨到美歐&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;依客戶總部地區，FY2026 美國 69%、台灣 20%、中國含香港 9%&lt;span class=&quot;src&quot;&gt;（10-K 2026-01-25 Item 15 Note 16）&lt;/span&gt;；Q2 美國 62%、台灣 28%&lt;span class=&quot;src&quot;&gt;（10-Q 2026-07-26 Item 1 ¶265）&lt;/span&gt;。&lt;/strong&gt;公司估計 FY2026 台灣總部客戶的資料中心營收約 76% 最終用於美國與歐洲&lt;span class=&quot;src&quot;&gt;（10-K Item 15 ¶386）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;重點專案：OpenAI 在俄亥俄州 Portsmouth（俄亥俄州地名）的資料中心，輝達對 SB Energy 約 4.25 GW（十億瓦）電力租約提供&lt;a class=&quot;term&quot; href=&quot;#g5&quot;&gt;殘值保證&lt;/a&gt;，生效於起租&lt;span class=&quot;src&quot;&gt;（8-K 2026-08-17 本文 §3）&lt;/span&gt;；收購 Hugging Face 約 119 億美元，預計 2027 上半年完成&lt;span class=&quot;src&quot;&gt;（8-K 2026-09-03 本文 §1–§2）&lt;/span&gt;。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;跟誰競爭&lt;/p&gt;&lt;h4&gt;對手有晶片公司，也有自研晶片的大客戶&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;公司自列對手：AMD、華為、英特爾等 GPU 與客製晶片供應商，以及 阿里巴巴、Alphabet（Google 母公司）、亞馬遜、百度、微軟 等自研 AI 晶片的雲端公司&lt;span class=&quot;src&quot;&gt;（10-K 2026-01-25 Item 1 ¶69–¶70）&lt;/span&gt;。&lt;/strong&gt;AMD 在自己的 10-K 也把輝達列為資料中心主要對手（SEC 全文搜尋 Q1）。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;外部證據：GSI Technology 10-K 寫 CUDA 帶來顯著轉換成本與生態鎖定（S01）。&lt;/strong&gt;我們的判讀：訓練端領先穩，推論端被自研晶片追近、價格壓力較大（新聞 N2）。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;管理層怎麼說&lt;/p&gt;&lt;h4&gt;公司說法：Q4 再成長、不計中國，交接不影響路線圖&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;公司說法：Q4 營收指引 1,300 億美元 ±3%（含額外一週）、毛利率 71%–72%，不計中國資料中心運算營收&lt;span class=&quot;src&quot;&gt;（8-K 2026-11-17 新聞稿 §4）&lt;/span&gt;。&lt;/strong&gt;實績對照：Q3 營收 1,158 億，高於指引 1,080 億的上緣，近八季全部高於上緣&lt;span class=&quot;src&quot;&gt;（8-K 2026-11-17 新聞稿 §3；估值輸入 evidence_notes.成長跑道）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;2026-11-12 公告：黃仁勳（Jensen Huang，創辦人）辭任總裁、執行長與董事，財務長 Colette Kress 暫代，Harvey C. Jones 任董事會主席；公司說營運、客戶承諾與產品路線圖預期不中斷&lt;span class=&quot;src&quot;&gt;（8-K 2026-11-12 本文 §2–§3、§10）&lt;/span&gt;。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;年報列的主要風險&lt;/p&gt;&lt;h4&gt;年報風險：代工依賴、客戶建置受限、出口管制、關鍵人物&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;①晶圓靠代工廠、封測靠外包，產能與零件短缺影響出貨&lt;span class=&quot;src&quot;&gt;（10-K 2026-01-25 Item 1A ¶86）&lt;/span&gt;。&lt;/strong&gt;②客戶建資料中心受土地、電力、廠房與資金限制，可能延後採購&lt;span class=&quot;src&quot;&gt;（10-Q 2026-07-26 Item 2 ¶17）&lt;/span&gt;。③美國出口管制使 H20 銷中國需許可&lt;span class=&quot;src&quot;&gt;（10-Q 2026-07-26 Part II Item 1A ¶31）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;④公司依賴長期任職的高階團隊，接班不順可能妨礙營運&lt;span class=&quot;src&quot;&gt;（10-K 2026-01-25 Item 1A ¶170）&lt;/span&gt;，這條已因執行長辭任成為現實。&lt;/strong&gt;⑤投資組合以美國公債為主，市場下跌可能產生損失&lt;span class=&quot;src&quot;&gt;（Item 1A ¶122）&lt;/span&gt;。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;規模與營運&lt;/p&gt;&lt;h4&gt;四萬多名員工、七成以上做研發&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;FY2026 年底約 42,000 名員工分布 38 國，其中 31,000 人從事研發&lt;span class=&quot;src&quot;&gt;（10-K 2026-01-25 Item 1 ¶102）&lt;/span&gt;。&lt;/strong&gt;公司不自有晶圓廠，資本支出近四季只有 74 億美元（財務指標）。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;moat&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;護城河與成長故事&lt;/p&gt;&lt;h3&gt;護城河寬，來自軟體生態與整櫃系統；推論端被追近。&lt;/h3&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;護城河主要是 CUDA 軟體生態與整櫃系統造成的轉換成本（NVDA-C01）。&lt;/strong&gt;客戶 SharonAI、ChronoScale 在 10-K 寫推論架構針對 CUDA 最佳化、GPU（圖形處理器，AI 運算主力晶片）主要只靠輝達，是外部證據；但 ChronoScale 同一句也寫計畫再依賴 AMD，表示客戶正在分散供應商（全文搜尋 Q1）。限制在推論晶片：OpenAI（ChatGPT 開發商）與雲端大客戶自研，分析師估客製晶片數量 2028 年可能超過 GPU（新聞 N2）。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;生命週期上，輝達仍在快速成長，但規模已到年營收 3,000 億美元，成長跑道的市場空間與滲透率公司未揭露。&lt;/strong&gt;我們的判讀：近一兩年靠 Blackwell 到 Vera Rubin（輝達 Blackwell 之後的新一代平台）的換代與客戶擴建延續，之後成長要看客戶電力與資金，利潤率回落是基準假設（明細見計算底稿 5）。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;外部申報證據（非輝達管理層）&lt;/h4&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;S01–S04 來自 SEC 全文搜尋存檔（全文搜尋結果.json Q1–Q3），只當旁證；客戶申報說明依賴，不代表輝達能永久定價。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;直接客戶占營收（FY2026，10-K Item 1A ¶166、Item 7 ¶68）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 500 102&quot; role=&quot;img&quot; aria-label=&quot;依賴度&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;230.0&quot; x2=&quot;230.0&quot; y1=&quot;6&quot; y2=&quot;96&quot; class=&quot;zero&quot;/&gt;&lt;text x=&quot;220&quot; y=&quot;23&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;直接客戶 A（未具名）（其他）&lt;/text&gt;&lt;rect x=&quot;230.0&quot; y=&quot;9&quot; width=&quot;192.7&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;430.7&quot; y=&quot;23&quot; class=&quot;val&quot;&gt;22%&lt;/text&gt;&lt;text x=&quot;220&quot; y=&quot;63&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;直接客戶 B（未具名）（其他）&lt;/text&gt;&lt;rect x=&quot;230.0&quot; y=&quot;49&quot; width=&quot;122.6&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;360.6&quot; y=&quot;63&quot; class=&quot;val&quot;&gt;14%&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;編號&lt;/th&gt;&lt;th&gt;申報公司&lt;/th&gt;&lt;th&gt;文件&lt;/th&gt;&lt;th&gt;說法&lt;/th&gt;&lt;th&gt;對論點&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;S01&lt;/td&gt;&lt;td&gt;GSI Technology（記憶體晶片公司）&lt;/td&gt;&lt;td&gt;10-K 2026-06-05&lt;/td&gt;&lt;td&gt;CUDA 平台造成顯著轉換成本與生態鎖定&lt;/td&gt;&lt;td&gt;支持護城河&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;S02&lt;/td&gt;&lt;td&gt;SharonAI Holdings（GPU 雲端業者）&lt;/td&gt;&lt;td&gt;10-K 2026-03-31&lt;/td&gt;&lt;td&gt;提供 B200、B300 等輝達 GPU，為輝達雲端夥伴&lt;/td&gt;&lt;td&gt;支持客戶依賴&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;S03&lt;/td&gt;&lt;td&gt;ChronoScale&lt;/td&gt;&lt;td&gt;10-K 2026-08-19&lt;/td&gt;&lt;td&gt;GPU 目前主要只依賴輝達一家供應商，並計畫加入 AMD 作為另一家主要供應商&lt;/td&gt;&lt;td&gt;客戶依賴，但正在分散&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;S04&lt;/td&gt;&lt;td&gt;AMD（晶片同業）&lt;/td&gt;&lt;td&gt;10-K 2026-02-04&lt;/td&gt;&lt;td&gt;資料中心主要對手為英特爾與輝達&lt;/td&gt;&lt;td&gt;競爭事實&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;supply&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;供應鏈與產能&lt;/p&gt;&lt;h3&gt;不自建晶圓廠，供應承諾大增，產能鎖定也是風險。&lt;/h3&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;輝達的晶圓、封裝與測試都外包，產能取決於代工與封測廠&lt;span class=&quot;src&quot;&gt;（10-K 2026-01-25 Item 1A ¶86）&lt;/span&gt;。&lt;/strong&gt;供應承諾從 2026-04 的 1,190 億美元增至 2026-07 的 2,790 億&lt;span class=&quot;src&quot;&gt;（10-Q 2026-07-26 Item 2 ¶16）&lt;/span&gt;，2026-10-25 再增至 3,900 億，主要是多年期記憶體採購&lt;span class=&quot;src&quot;&gt;（8-K 2026-11-17 本文 §44）&lt;/span&gt;，表示預期需求延續；需求轉弱時要承擔存貨與採購義務，FY2026 Q1 的 H20（輝達為中國市場設計的降規晶片）費用 45 億是前例。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;grid2 wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;Israel：占全部營收 vs 占全部長期資產&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 280&quot; role=&quot;img&quot; aria-label=&quot;地區占比&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;246.0&quot; y2=&quot;246.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;250.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;0%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;171.3&quot; y2=&quot;171.3&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;175.3&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;5%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;96.7&quot; y2=&quot;96.7&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;100.7&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;10%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;22.0&quot; y2=&quot;22.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;26.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;15%&lt;/text&gt;&lt;text x=&quot;72.0&quot; y=&quot;268&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY23&lt;/text&gt;&lt;text x=&quot;218.0&quot; y=&quot;268&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY24&lt;/text&gt;&lt;text x=&quot;364.0&quot; y=&quot;268&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY25&lt;/text&gt;&lt;text x=&quot;510.0&quot; y=&quot;268&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY26&lt;/text&gt;&lt;polyline points=&quot;72.0,246.0 218.0,246.0 364.0,246.0 510.0,246.0&quot; fill=&quot;none&quot; stroke=&quot;var(--c2)&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;circle cx=&quot;72.0&quot; cy=&quot;246.0&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c2)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;占營收 FY23：0%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;218.0&quot; cy=&quot;246.0&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c2)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;占營收 FY24：0%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;364.0&quot; cy=&quot;246.0&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c2)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;占營收 FY25：0%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;510.0&quot; cy=&quot;246.0&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c2)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;占營收 FY26：0%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;518.0&quot; y=&quot;250.0&quot; class=&quot;val&quot; fill=&quot;var(--c2)&quot;&gt;0%&lt;/text&gt;&lt;polyline points=&quot;72.0,135.0 218.0,122.0 364.0,46.4 510.0,34.4&quot; fill=&quot;none&quot; stroke=&quot;var(--neg)&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;circle cx=&quot;72.0&quot; cy=&quot;135.0&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--neg)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;占長期資產 FY23：7%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;218.0&quot; cy=&quot;122.0&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--neg)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;占長期資產 FY24：8%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;364.0&quot; cy=&quot;46.4&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--neg)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;占長期資產 FY25：13%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;510.0&quot; cy=&quot;34.4&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--neg)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;占長期資產 FY26：14%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;518.0&quot; y=&quot;38.4&quot; class=&quot;val&quot; fill=&quot;var(--neg)&quot;&gt;14%&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c2)&quot;&gt;&lt;/i&gt;占營收&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--neg)&quot;&gt;&lt;/i&gt;占長期資產&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;growth&quot;&gt;&lt;div class=&quot;qno&quot;&gt;問題 02&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;還在成長嗎？&lt;/div&gt;&lt;h2&gt;還在高速成長，但已是景氣高峰，之後會減速。&lt;/h2&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;成長還很快：近四季營收年增 83.4%（至 2026-07-26），Q3 單季營收 1,158 億、年增 103%（NVDA-C02、C03）。&lt;/strong&gt;投入資本報酬極高，近四季 &lt;a class=&quot;term&quot; href=&quot;#g3&quot;&gt;ROIC&lt;/a&gt; 242.7%、增量 ROIC 185.8%（NVDA-C14），代表每多投入 1 元，多賺的營業利潤超過 1 元。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;成長來源幾乎全是資料中心的出貨量，量與價公司未拆開揭露（拆解見下方區塊）。&lt;/strong&gt;新平台 Vera Rubin NVL72 已量產出貨，銜接 Blackwell&lt;span class=&quot;src&quot;&gt;（8-K 2026-11-17 新聞稿 §5）&lt;/span&gt;；供應承諾 2026-10-25 增至 3,900 億美元&lt;span class=&quot;src&quot;&gt;（上季 2,790 億，8-K 2026-11-17 本文 §44）&lt;/span&gt;顯示公司預期需求延續。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;限制是景氣位置：總經剖面判在高峰，十一年營業利益率平均 35.6%、最高 62.4%，現在 65% 高於歷史上限（產業指標）。&lt;/strong&gt;客戶建置受電力與資金限制，公司也在 10-Q 寫客戶可能延後採購。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;我們的判讀：未來兩三季有 Q4 指引 1,300 億與供應承諾支撐，三年後的規模沒有可查證據（NVDA-C06）。&lt;/strong&gt;基準第 1 年 +60%&lt;span class=&quot;src&quot;&gt;（Q3 實績加 Q4 指引推導）&lt;/span&gt;，第 3 年放一個溫和的景氣下行年（營收 −6.8%），之後回到 10% 與 5%。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;毛利率與營業利益率&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 280&quot; role=&quot;img&quot; aria-label=&quot;利潤率&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;246.0&quot; y2=&quot;246.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;250.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;0%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;190.0&quot; y2=&quot;190.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;194.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;20%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;134.0&quot; y2=&quot;134.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;138.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;40%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;78.0&quot; y2=&quot;78.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;82.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;60%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;22.0&quot; y2=&quot;22.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;26.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;80%&lt;/text&gt;&lt;text x=&quot;72.0&quot; y=&quot;268&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY23&lt;/text&gt;&lt;text x=&quot;181.5&quot; y=&quot;268&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY24&lt;/text&gt;&lt;text x=&quot;291.0&quot; y=&quot;268&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY25&lt;/text&gt;&lt;text x=&quot;400.5&quot; y=&quot;268&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY26&lt;/text&gt;&lt;text x=&quot;510.0&quot; y=&quot;268&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;近四季&lt;/text&gt;&lt;polyline points=&quot;72.0,86.6 181.5,42.4 291.0,36.0 400.5,47.0 510.0,36.9&quot; fill=&quot;none&quot; stroke=&quot;var(--c2)&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;circle cx=&quot;72.0&quot; cy=&quot;86.6&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c2)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;毛利率 FY23：57%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;181.5&quot; cy=&quot;42.4&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c2)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;毛利率 FY24：73%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;291.0&quot; cy=&quot;36.0&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c2)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;毛利率 FY25：75%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;400.5&quot; cy=&quot;47.0&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c2)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;毛利率 FY26：71%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;510.0&quot; cy=&quot;36.9&quot; r=&qu x=&quot;190.3&quot; cy=&quot;162.8&quot; r=&quot;3.5&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c1)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;單季營收比去年同季 2025-04：69%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;251.4&quot; cy=&quot;201.5&quot; r=&quot;3.5&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c1)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;單季營收比去年同季 2025-07：56%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;312.6&quot; cy=&quot;181.9&quot; r=&quot;3.5&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c1)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;單季營收比去年同季 2025-10：62%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;373.7&quot; cy=&quot;151.3&quot; r=&quot;3.5&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c1)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;單季營收比去年同季 2026-01：73%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;434.9&quot; cy=&quot;117.1&quot; r=&quot;3.5&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c1)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;單季營收比去年同季 2026-04：85%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;496.0&quot; cy=&quot;58.3&quot; r=&quot;3.5&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c1)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;單季營收比去年同季 2026-07：106%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;503.0&quot; y=&quot;62.3&quot; class=&quot;val&quot; fill=&quot;var(--c1)&quot;&gt;106%&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c1)&quot;&gt;&lt;/i&gt;單季營收比去年同季&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c2)&quot;&gt;&lt;/i&gt;近四季合計&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/div&gt;&lt;!--/新圖表--&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;白話說&lt;/b&gt;去年 Q3 每賣 100 元，今年 Q3 賣到約 203 元，多出來的幾乎都是資料中心。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;要留意&lt;/b&gt;高峰期的 ROIC 與增速不能直接外推，見改判訊號。&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;cash&quot;&gt;&lt;div class=&quot;qno&quot;&gt;問題 03・04&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;賺的錢是真的嗎？股東實際拿到什麼？&lt;/div&gt;&lt;h2&gt;現金是真的，但只有淨利的三分之二。&lt;/h2&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;現金流是真的但打折：近四季營運現金流 1,344 億美元、扣資本支出後自由現金流 1,270 億，只有淨利 1,929 億的約 66%（融資償債底稿、NVDA-C08）。&lt;/strong&gt;落差來自應收帳款年增 +126.8%（2026-07-26 對 2025-07-27）、比營收快 +43.4 個百分點（應收 2026-07-26 對 2025-07-27，對近四季營收年增），存貨天數約 150 天，加上淨利含權益證券未實現利益，這部分不是現金。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;負債很輕：有息負債 33,366 百萬美元，僅 EBITDA 的 0.17 倍（NVDA-C13）。&lt;/strong&gt;工具的「現金與證券」56,586 百萬美元只含現金與可交易債券&lt;span class=&quot;src&quot;&gt;（10-Q 2026-07-26，拆分見計算底稿股權橋）&lt;/span&gt;，扣有息負債後為淨現金 23,220 百萬美元，足以還清借款。另有公開與非公開權益證券約 939 億不在現金與證券內，連同債券合計 1,281 億，估值平均折 19% 計入（作者判斷）。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;淨利、營運現金流與自由現金流（億美元）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 300&quot; role=&quot;img&quot; aria-label=&quot;現金品質&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;266.0&quot; y2=&quot;266.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;270.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;0.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;185.3&quot; y2=&quot;185.3&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;189.3&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;1,000&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;104.7&quot; y2=&quot;104.7&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;108.7&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;2,000&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;24.0&quot; y2=&quot;24.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;28.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;3,000&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;266.0&quot; y2=&quot;266.0&quot; class=&quot;zero&quot;/&gt;&lt;rect x=&quot;70.3&quot; y=&quot;242.0&quot; width=&quot;26.5&quot; height=&quot;24.0&quot; rx=&quot;2&quot; fill=&quot;var(--c4)&quot;&gt;&lt;title&gt;淨利 FY24：298&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;98.8&quot; y=&quot;243.3&quot; width=&quot;26.5&quot; height=&quot;22.7&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;營運現金流 FY24：281&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;127.2&quot; y=&quot;244.2&quot; width=&quot;26.5&quot; height=&quot;21.8&quot; rx=&quot;2&quot; fill=&quot;var(--c2)&quot;&gt;&lt;title&gt;自由現金流 FY24：270&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;113.0&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY24&lt;/text&gt;&lt;rect x=&quot;192.3&quot; y=&quot;207.2&quot; width=&quot;26.5&quot; height=&quot;58.8&quot; rx=&quot;2&quot; fill=&quot;var(--c4)&quot;&gt;&lt;title&gt;淨利 FY25：729&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;220.8&quot; y=&quot;214.3&quot; width=&quot;26.5&quot; height=&quot;51.7&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;營運現金流 FY25：641&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;249.2&quot; y=&quot;216.9&quot; width=&quot;26.5&quot; height=&quot;49.1&quot; rx=&quot;2&quot; fill=&quot;var(--c2)&quot;&gt;&lt;title&gt;自由現金流 FY25：609&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;235.0&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY25&lt;/text&gt;&lt;rect x=&quot;314.3&quot; y=&quot;169.1&quot; width=&quot;26.5&quot; height=&quot;96.9&quot; rx=&quot;2&quot; fill=&quot;var(--c4)&quot;&gt;&lt;title&gt;淨利 FY26：1,201&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;342.8&quot; y=&quot;183.1&quot; width=&quot;26.5&quot; height=&quot;82.9&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;營運現金流 FY26：1,027&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;371.2&quot; y=&quot;188.0&quot; width=&quot;26.5&quot; height=&quot;78.0&quot; rx=&quot;2&quot; fill=&quot;var(--c2)&quot;&gt;&lt;title&gt;自由現金流 FY26：967&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;357.0&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY26&lt;/text&gt;&lt;rect x=&quot;436.3&quot; y=&quot;110.4&quot; width=&quot;26.5&quot; height=&quot;155.6&quot; rx=&quot;2&quot; fill=&quot;var(--c4)&quot;&gt;&lt;title&gt;淨利 近四季：1,929&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;464.8&quot; y=&quot;157.6&quot; width=&quot;26.5&quot; height=&quot;108.4&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;營運現金流 近四季：1,344&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;493.2&quot; y=&quot;163.5&quot; width=&quot;26.5&quot; height=&quot;102.5&quot; rx=&quot;2&quot; fill=&quot;var(--c2)&quot;&gt;&lt;title&gt;自由現金流 近四季：1,270&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;479.0&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;近四季&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c4)&quot;&gt;&lt;/i&gt;淨利&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c1)&quot;&gt;&lt;/i&gt;營運現金流&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c2)&quot;&gt;&lt;/i&gt;自由現金流&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;錢從哪一層開始不夠：現金流分層&lt;/h3&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;現金流分層（近四季，至 2026-07-26）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;層次&lt;/th&gt;&lt;th&gt;金額&lt;/th&gt;&lt;th&gt;正負&lt;/th&gt;&lt;th&gt;完整度&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;一、營運現金流&lt;/td&gt;&lt;td&gt;1,344 億美元&lt;/td&gt;&lt;td&gt;正&lt;/td&gt;&lt;td&gt;完整&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;二、一般資本支出後&lt;/td&gt;&lt;td&gt;1,270 億美元&lt;/td&gt;&lt;td&gt;正&lt;/td&gt;&lt;td&gt;完整&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;三、回購與股利後&lt;/td&gt;&lt;td&gt;649 億美元&lt;/td&gt;&lt;td&gt;正&lt;/td&gt;&lt;td&gt;完整&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;延伸：再扣併購與員工代扣稅&lt;/td&gt;&lt;td&gt;547 億美元&lt;/td&gt;&lt;td&gt;正&lt;/td&gt;&lt;td&gt;完整&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;數值正負不等於安全或危險：第二層為負代表所列投入超過當期營運現金，不等於營業虧損；資本支出尚未區分維持與擴張。&lt;/p&gt;&lt;p class=&quot;cap&quot;&gt;（算法與完整表見&lt;a href=&quot;#wp-3-4&quot;&gt;計算底稿 3・4&lt;/a&gt;）&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;白話說&lt;/b&gt;帳上每賺 100 元淨利，近四季實際收進可自由運用的現金約 66 元。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;要留意&lt;/b&gt;「現金與證券」只含現金和可交易債券，不含約 939 億的權益證券（股權橋另計，折 19%）。&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;shareholders&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;股東實際拿到什麼？&lt;/p&gt;&lt;h3&gt;主要靠回購，股東收益率約 1.6%。&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;股東回報以回購為主：近四季回購 553 億美元、股利 68 億，股利殖利率 0.2%、回購殖利率 1.5%（收盤 2026-11-17），合計股東收益率 1.6%（均為近四季）；2026-05 季配由 0.01 美元調升到 0.25 美元&lt;span class=&quot;src&quot;&gt;（10-Q 2026-07-26 Item 2 ¶101，8-K 2026-11-17 新聞稿 §2 宣告下一季照發）&lt;/span&gt;，年化 1.00 美元、以收盤價計約 0.64%&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;；約占自由現金流 49%（價值判斷、NVDA-C15）。&lt;/strong&gt;扣股權薪酬後的淨回購殖利率 1.3%（回購扣股權薪酬；收盤 2026-11-17），2026 財年稀釋股數對上一財年 -1.2%（近一財年；股數期間 2016–2026）。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;每股自由現金流近四季 5.21 美元，扣股權薪酬 4.91 美元。&lt;/strong&gt;限制：公司另花 91 億幫員工代扣稅，股權薪酬 72 億，回購有一部分是在抵銷員工股票，不全是股數減少。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;現價隱含年報酬（各情境成真時，非預期報酬）；紅色虛線為公債殖利率 5.12%。基準情境下，現價隱含的年報酬只比公債高 4.1 個百分點，模型的加權資本成本（基準）比公債高 6.4 個百分點，兩者的差距對應市價與合理價值的落差&lt;/p&gt;&lt;svg viewBox=&quot;0 0 500 182&quot; role=&quot;img&quot; aria-label=&quot;現價隱含年報酬對公債&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;168.0&quot; x2=&quot;168.0&quot; y1=&quot;6&quot; y2=&quot;176&quot; class=&quot;zero&quot;/&gt;&lt;line x1=&quot;262.2&quot; x2=&quot;262.2&quot; y1=&quot;4&quot; y2=&quot;178&quot; class=&quot;price&quot;/&gt;&lt;text x=&quot;158&quot; y=&quot;23&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;保守情境成真&lt;/text&gt;&lt;rect x=&quot;168.0&quot; y=&quot;9&quot; width=&quot;112.2&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c4)&quot;/&gt;&lt;text x=&quot;288.2&quot; y=&quot;23&quot; class=&quot;val&quot;&gt;6.10%&lt;/text&gt;&lt;text x=&quot;158&quot; y=&quot;63&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;基準情境成真&lt;/text&gt;&lt;rect x=&quot;168.0&quot; y=&quot;49&quot; width=&quot;168.9&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c1)&quot;/&gt;&lt;text x=&quot;344.9&quot; y=&quot;63&quot; class=&quot;val&quot;&gt;9.18%&lt;/text&gt;&lt;text x=&quot;158&quot; y=&quot;103&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;樂觀情境成真&lt;/text&gt;&lt;rect x=&quot;168.0&quot; y=&quot;89&quot; width=&quot;249.1&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;425.1&quot; y=&quot;103&quot; class=&quot;val&quot;&gt;13.54%&lt;/text&gt;&lt;text x=&quot;158&quot; y=&quot;143&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot; font-weight=&amp;quot;700&amp;quot;&gt;10 年期美國公債&lt;/text&gt;&lt;rect x=&quot;168.0&quot; y=&quot;129&quot; width=&quot;94.2&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--muted)&quot;/&gt;&lt;text x=&quot;270.2&quot; y=&quot;143&quot; class=&quot;val&quot;&gt;5.12%&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;每股自由現金流（美元）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 300&quot; role=&quot;img&quot; aria-label=&quot;每股自由現金流&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;266.0&quot; y2=&quot;266.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;270.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;0.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;185.3&quot; y2=&quot;185.3&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;189.3&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;2.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;104.7&quot; y2=&quot;104.7&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;108.7&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;4.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;24.0&quot; y2=&quot;24.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;28.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;6.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;266.0&quot; y2=&quot;266.0&quot; class=&quot;zero&quot;/&gt;&lt;rect x=&quot;66.6&quot; y=&quot;259.9&quot; width=&quot;32.2&quot; height=&quot;6.1&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;每股自由現金流 FY23：0.2&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;100.8&quot; y=&quot;264.2&quot; width=&quot;32.2&quot; height=&quot;1.8&quot; rx=&quot;2&quot; fill=&quot;var(--c4)&quot;&gt;&lt;title&gt;扣除股權薪酬後 FY23：0.0&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;100.8&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY23&lt;/text&gt;&lt;rect x=&quot;164.2&quot; y=&quot;222.3&quot; width=&quot;32.2&quot; height=&quot;43.7&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;每股自由現金流 FY24：1.1&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;198.4&quot; y=&quot;228.0&quot; width=&quot;32.2&quot; height=&quot;38.0&quot; rx=&quot;2&quot; fill=&quot;var(--c4)&quot;&gt;&lt;title&gt;扣除股權薪酬後 FY24：0.9&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;198.4&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY24&lt;/text&gt;&lt;rect x=&quot;261.8&quot; y=&quot;167.0&quot; width=&quot;32.2&quot; height=&quot;99.0&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;每股自由現金流 FY25：2.5&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;296.0&quot; y=&quot;174.8&quot; width=&quot;32.2&quot; height=&quot;91.2&quot; rx=&quot;2&quot; fill=&quot;var(--c4)&quot;&gt;&lt;title&gt;扣除股權薪酬後 FY25：2.3&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;296.0&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY25&lt;/text&gt;&lt;rect x=&quot;359.4&quot; y=&quot;106.9&quot; width=&quot;32.2&quot; height=&quot;159.1&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;每股自由現金流 FY26：3.9&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;393.6&quot; y=&quot;117.4&quot; width=&quot;32.2&quot; height=&quot;148.6&quot; rx=&quot;2&quot; fill=&quot;var(--c4)&quot;&gt;&lt;title&gt;扣除股權薪酬後 FY26：3.7&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;393.6&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY26&lt;/text&gt;&lt;rect x=&quot;457.0&quot; y=&quot;55.9&quot; width=&quot;32.2&quot; height=&quot;210.1&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;每股自由現金流 近四季：5.2&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;491.2&quot; y=&quot;67.9&quot; width=&quot;32.2&quot; height=&quot;198.1&quot; rx=&quot;2&quot; fill=&quot;var(--c4)&quot;&gt;&lt;title&gt;扣除股權薪酬後 近四季：4.9&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;491.2&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;近四季&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c1)&quot;&gt;&lt;/i&gt;每股自由現金流&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c4)&quot;&gt;&lt;/i&gt;扣除股權薪酬後&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;白話說&lt;/b&gt;以收盤價買 100 元股票，近四季約拿到 0.2 元股利；照 2026-05 調升後的季配 0.25 美元，往後一年約 0.6 元（推導），另有 1.5 元由公司回購承接。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;要留意&lt;/b&gt;舊年度股數未換算 2021、2024 年兩次分割，估值已改用分割調整後股數（推導）。&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;股東回報與市價隱含報酬拆解&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;和公債比，補償不多：基準情境成真時，收盤價買進的推算年報酬約 9.2%&lt;span class=&quot;src&quot;&gt;（基準情境成真時、以收盤 2026-11-17 股價買進的推算年報酬；條件式，非預期報酬、非買賣建議）&lt;/span&gt;＝股利 0.2%＋回購 1.5%＋每股成長與其他 7.5%&lt;span class=&quot;src&quot;&gt;（推算，假設倍數不變）&lt;/span&gt;，10 年期公債 5.12%。&lt;/strong&gt;回報品質中等：回購多但要先抵銷員工股票。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;現價隱含年報酬（基準情境，非預期報酬）從哪裡來：股利、回購是現在拿到的現金，其餘要靠每股成長（紅色虛線為 10 年期美國公債 5.12%）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 500 196&quot; role=&quot;img&quot; aria-label=&quot;市價隱含報酬拆解&quot; class=&quot;chart&quot; style=&quot;max-width:650px&quot;&gt;&lt;line x1=&quot;250.0&quot; x2=&quot;250.0&quot; y1=&quot;24&quot; y2=&quot;192&quot; class=&quot;zero&quot;/&gt;&lt;line x1=&quot;349.8&quot; x2=&quot;349.8&quot; y1=&quot;22&quot; y2=&quot;192&quot; class=&quot;price&quot;/&gt;&lt;text x=&quot;349.8&quot; y=&quot;16&quot; class=&quot;pricelab&quot; text-anchor=&quot;middle&quot;&gt;公債 5.12%&lt;/text&gt;&lt;text x=&quot;240&quot; y=&quot;55.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;股利殖利率&lt;/text&gt;&lt;rect x=&quot;250.0&quot; y=&quot;40.0&quot; width=&quot;3.5&quot; height=&quot;20&quot; rx=&quot;4&quot; fill=&quot;var(--c2)&quot;&gt;&lt;title&gt;股利殖利率：0.18%&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;261.5&quot; y=&quot;55.0&quot; class=&quot;val&quot;&gt;0.18%&lt;/text&gt;&lt;line x1=&quot;253.5&quot; x2=&quot;253.5&quot; y1=&quot;60.0&quot; y2=&quot;80.0&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;1&quot; stroke-dasharray=&quot;2 3&quot;/&gt;&lt;text x=&quot;240&quot; y=&quot;95.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;回購殖利率&lt;/text&gt;&lt;rect x=&quot;253.5&quot; y=&quot;80.0&quot; width=&quot;28.6&quot; height=&quot;20&quot; rx=&quot;4&quot; fill=&quot;var(--c6)&quot;&gt;&lt;title&gt;回購殖利率：+1.47%&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;290.0&quot; y=&quot;95.0&quot; class=&quot;val&quot;&gt;+1.47%&lt;/text&gt;&lt;line x1=&quot;282.0&quot; x2=&quot;282.0&quot; y1=&quot;100.0&quot; y2=&quot;120.0&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;1&quot; stroke-dasharray=&quot;2 3&quot;/&gt;&lt;text x=&quot;240&quot; y=&quot;135.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;每股成長與其他（推算）&lt;/text&gt;&lt;rect x=&quot;282.0&quot; y=&quot;120.0&quot; width=&quot;146.8&quot; height=&quot;20&quot; rx=&quot;4&quot; fill=&quot;var(--c3)&quot;&gt;&lt;title&gt;每股成長與其他（推算）：+7.53%&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;436.8&quot; y=&quot;135.0&quot; class=&quot;val&quot;&gt;+7.53%&lt;/text&gt;&lt;line x1=&quot;428.8&quot; x2=&quot;428.8&quot; y1=&quot;140.0&quot; y2=&quot;160.0&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;1&quot; stroke-dasharray=&quot;2 3&quot;/&gt;&lt;text x=&quot;240&quot; y=&quot;175.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;合計：現價隱含年報酬（基準情境，非預期報酬）&lt;/text&gt;&lt;rect x=&quot;250.0&quot; y=&quot;160.0&quot; width=&quot;178.8&quot; height=&quot;20&quot; rx=&quot;4&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;合計：現價隱含年報酬（基準情境，非預期報酬）：9.18%&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;436.8&quot; y=&quot;175.0&quot; class=&quot;val&quot;&gt;9.18%&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;股利、回購、股數變化與政策門檻的逐項判讀（算法與完整表見&lt;a href=&quot;#wp-3-4&quot;&gt;計算底稿 3・4&lt;/a&gt;）。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;market&quot;&gt;&lt;div class=&quot;qno&quot;&gt;市場背景&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;看價格之前：大盤與這檔股票現在的市場狀態&lt;/div&gt;&lt;h2&gt;大盤 2 個面向相對歷史偏高；股價近 12 個月落後大盤（-18% 對 +10%）&lt;/h2&gt;&lt;style&gt;.mkt-cards{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:14px 0}.mkt-cards .kpi{padding:10px 12px}.mkt-cards  指引。偏貴不是說公司不好，而是收盤價已假設高成長與高利潤率延續得比基準情境更久。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;基準情境的故事：明年營收再增約 60%&lt;span class=&quot;src&quot;&gt;（Q3 實績加 Q4 指引、之後兩季不再季增，推導）&lt;/span&gt;，第 3 年遇到一次溫和的景氣下行，之後回到一成與 5% 的成長；營業利益率從 65% 逐步回落到長期 45%，因為半導體有景氣循環，客製晶片也會壓價格。&lt;/strong&gt;這樣算每股約 116.02 美元。樂觀情境成長更久、利潤率維持近 60%，每股 193.93 美元，是唯一高於收盤價的情境（NVDA-C06、C07）。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;反方是我們可能低估延續期：近八季營收全超過指引上緣。&lt;/strong&gt;價格位置對基準第 3 年下行年敏感：不放下行年、改線性收斂時，中點約 147.46、區間 132.50–166.24，收盤價落在區間內、會變合理&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;。保守每股 66.22 美元，比收盤價低約 57%&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;。證券計入股權橋使中點約 +4%、其他請求權約 −0.3%&lt;span class=&quot;src&quot;&gt;（推導，11-11 版試算比例）&lt;/span&gt;，未達計算核對 ±10% 門檻。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;各方法的每股價值區間（美元）：綠底為合理價值，虛線為買入上限與市價&lt;/p&gt;&lt;svg viewBox=&quot;0 0 680 290&quot; role=&quot;img&quot; aria-label=&quot;估值區間&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;200.9&quot; x2=&quot;200.9&quot; y1=&quot;28&quot; y2=&quot;264&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;200.9&quot; y=&quot;282&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;100&lt;/text&gt;&lt;line x1=&quot;232.7&quot; x2=&quot;232.7&quot; y1=&quot;28&quot; y2=&quot;264&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;232.7&quot; y=&quot;282&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;150&lt;/text&gt;&lt;line x1=&quot;264.5&quot; x2=&quot;264.5&quot; y1=&quot;28&quot; y2=&quot;264&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;264.5&quot; y=&quot;282&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;200&lt;/text&gt;&lt;line x1=&quot;296.3&quot; x2=&quot;296.3&quot; y1=&quot;28&quot; y2=&quot;264&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;296.3&quot; y=&quot;282&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;250&lt;/text&gt;&lt;line x1=&quot;328.1&quot; x2=&quot;328.1&quot; y1=&q ; cy=&quot;102&quot; r=&quot;7&quot; fill=&quot;var(--neg)&quot;&gt;&lt;title&gt;市價隱含（第 15 年）：20 倍&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;442.9&quot; y=&quot;107&quot; class=&quot;val&quot;&gt;20 倍&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;p&gt;&lt;b&gt;成長端：&lt;/b&gt;市價要求未來 5 年營收年增約 18.1%（折現率高低 15.9%～20.2%），低於模型基準 5 年平均 18.6%、低於過去（2016–2026）實績 45.7%。&lt;/p&gt;&lt;p&gt;&lt;b&gt;倍數端：&lt;/b&gt;市價隱含第 15 年 &lt;a class=&quot;term&quot; href=&quot;#g4&quot;&gt;EV/EBIT&lt;/a&gt; 約 20.0 倍，高於模型 8.6 倍，在跨產業參考帶 p25–p75（7.8–27.6 倍）內。&lt;/p&gt;&lt;p&gt;成功幾率（歷史基準比率）：模型基準 10 年實質年增 8.3%，同規模（營收 500 億美元以上）公司歷史上做到的比例 21%（歷史基準比率，非預測）。&lt;/p&gt;&lt;p class=&quot;cap&quot;&gt;兩端是同一條「模型價值＝市價」換不同未知數反解，方向必然一致，不是兩個獨立證據；幅度才有資訊。只描述，不進研究評等、不改價格位置與合理價值，不是目標價，非買賣建議。成長性四問細表、三視角反推、長期倍數條件（算法與完整表見&lt;a href=&quot;#wp-5&quot;&gt;計算底稿 5&lt;/a&gt;）。&lt;/p&gt;&lt;div class=&quot;note-box&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;要撐住現價，營收每年需要成長多少 vs 實際成長（黑色橫線為不同折現率下的隱含營收年增範圍 16%–20%）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 500 262&quot; role=&quot;img&quot; aria-label=&quot;市價隱含成長&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;193.0&quot; x2=&quot;193.0&quot; y1=&quot;6&quot; y2=&quot;256&quot; class=&quot;zero&quot;/&gt;&lt;text x=&quot;183&quot; y=&quot;23&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;FY24 實際成長&lt;/text&gt;&lt;rect x=&quot;193.0&quot; y=&quot;9&quot; width=&quot;226.4&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;427.4&quot; y=&quot;23&quot; class=&quot;val&quot;&gt;125.9%&lt;/text&gt;&lt;text x=&quot;183&quot; y=&quot;63&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;FY25 實際成長&lt;/text&gt;&lt;rect x=&quot;193.0&quot; y=&quot;49&quot; width=&quot;205.4&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;406.4&quot; y=&quot;63&quot; class=&quot;val&quot;&gt;114.2%&lt;/text&gt;&lt;text x=&quot;183&quot; y=&quot;103&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;FY26 實際成長&lt;/text&gt;&lt;rect x=&quot;193.0&quot; y=&quot;89&quot; width=&quot;117.8&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;318.8&quot; y=&quot;103&quot; class=&quot;val&quot;&gt;65.5%&lt;/text&gt;&lt;text x=&quot;183&quot; y=&quot;143&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;FY23–FY26 年均&lt;/text&gt;&lt;rect x=&quot;193.0&quot; y=&quot;129&quot; width=&quot;179.9&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;380.9&quot; y=&quot;143&quot; class=&quot;val&quot;&gt;100.0%&lt;/text&gt;&lt;text x=&quot;183&quot; y=&quot;183&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;最近三季比去年同期&lt;/text&gt;&lt;rect x=&quot;193.0&quot; y=&quot;169&quot; width=&quot;160.1&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;361.1&quot; y=&quot;183&quot; class=&quot;val&quot;&gt;89.0%&lt;/text&gt;&lt;text x=&quot;183&quot; y=&quot;223&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot; font-weight=&amp;quot;700&amp;quot;&gt;市價隱含：未來 5 年每年&lt;/text&gt;&lt;rect x=&quot;193.0&quot; y=&quot;209&quot; width=&quot;32.6&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--neg)&quot;/&gt;&lt;line x1=&quot;221.6&quot; x2=&quot;229.4&quot; y1=&quot;218&quot; y2=&quot;218&quot; stroke=&quot;var(--ink)&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;line x1=&quot;221.6&quot; x2=&quot;221.6&quot; y1=&quot;212&quot; y2=&quot;224&quot; stroke=&quot;var(--ink)&quot;/&gt;&lt;line x1=&quot;229.4&quot; x2=&quot;229.4&quot; y1=&quot;212&quot; y2=&quot;224&quot; stroke=&quot;var(--ink)&quot;/&gt;&lt;text x=&quot;237.4&quot; y=&quot;223&quot; class=&quot;val&quot;&gt;18.1%&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:14px&quot;&gt;市價要求的成長 vs 實績與假設&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;營收年增&lt;/th&gt;&lt;th&gt;來源&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;市價反推，未來 5 年（基準折現率；第 6–15 年衰退期也從此值起降）&lt;/td&gt;&lt;td&gt;18.1%（市價反推未來 5 年營收年增；市價 155.46 美元、收盤 2026-11-17；折現率 11.52%，沿用 2026-11-16 無風險利率 5.12%；推導）&lt;/td&gt;&lt;td&gt;估值結果 reverse_dcf&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;市價反推（低折現率／高折現率）&lt;/td&gt;&lt;td&gt;15.9%（市價反推未來 5 年營收年增；市價 155.46 美元、收盤 2026-11-17；折現率 10.52%，沿用 2026-11-16 無風險利率 5.12%；推導）／20.2%（市價反推未來 5 年營收年增；市價 155.46 美元、收盤 2026-11-17；折現率 12.52%，沿用 2026-11-16 無風險利率 5.12%；推導）&lt;/td&gt;&lt;td&gt;估值結果 reverse_dcf&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;市價反推的 15 年路徑&lt;/td&gt;&lt;td&gt;15 年年複合約 12.4%（基準約 8.0%）；第 15 年營收約為基準的 1.8 倍（推導）&lt;/td&gt;&lt;td&gt;估值結果 reverse_dcf；估值引擎衰退期自第 5 年成長率線性降到永續成長&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準情境第 1–5 年平均&lt;/td&gt;&lt;td&gt;年複合約 16.6%（含第 3 年下行年；算術平均約 18.6%，比較用年複合，推導）&lt;/td&gt;&lt;td&gt;估值輸入 scenarios&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;近四季實績&lt;/td&gt;&lt;td&gt;+83.4%&lt;/td&gt;&lt;td&gt;成長推估底稿&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Q3 單季（收盤後公布）&lt;/td&gt;&lt;td&gt;+103%&lt;/td&gt;&lt;td&gt;8-K 2026-11-17 新聞稿 §3&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;同類公司次年成長 p75&lt;/td&gt;&lt;td&gt;+40.0%&lt;/td&gt;&lt;td&gt;成長推估底稿&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p&gt;要撐住現價，市場等於要求未來 5 年營收每年成長約 18.1%（換折現率高低兩端約 15.9% 到 20.2%）。這個要求在同規模公司的歷史上屬「歷史罕見」。溢價訊號集中在基本面預期（隱含假設罕見度）。&lt;/p&gt;&lt;p class=&quot;cap&quot;&gt;三視角反推、假設對照實績、歷史基準比率與市價溢價來源（算法與完整表見&lt;a href=&quot;#wp-5&quot;&gt;計算底稿 5&lt;/a&gt;）。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;白話說&lt;/b&gt;收盤價買 100 元，三情境加權的合理價值中點約 78 元（基準情境約 75 元，推導），其餘是市場對延續高成長的期待。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;要留意&lt;/b&gt;偏貴是價格判斷，不是說公司不好；見改判訊號。&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;value&quot;&gt;&lt;div class=&quot;qno&quot;&gt;價值判斷&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;價值判斷：用彼得林奇的方法再看一次&lt;/div&gt;&lt;h2&gt;快速成長股兼景氣循環，用正常化盈餘看並不便宜。&lt;/h2&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;林區分類&lt;/b&gt;快速成長；兼具週期（半導體庫存與客戶資本支出循環）&lt;br&gt;成長還能持續多久、擴張是否仍有利可圖、價格是否已透支成長；兼具週期特徵時須留意高峰利潤率被外推。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;研究評等&lt;/b&gt;&lt;span style=&quot;font-size:20px;font-weight:700&quot;&gt;生意品質一流 ／ 價格偏貴（單錨點）&lt;/span&gt;&lt;br&gt;生意品質依五項證據評定；價格位置三級（買入區、合理、偏貴），依買入上限與合理價值高端判斷，同業與歷史倍數只作交叉核對。非買賣建議。&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;林區分類是快速成長，但兼具半導體景氣循環特徵。&lt;/strong&gt;本益比 19.7 倍（申報 EPS（無非經常項目可扣） 7.91 美元；收盤 2026-11-17） 看起來不高&lt;span class=&quot;src&quot;&gt;（這裡的 7.91 美元其實就是申報 EPS，沒有扣掉權益證券未實現利益；扣除後近似 22.9 倍，推導；下面的 PEG 也用申報口徑）&lt;/span&gt;，過去三年的 PEG 只有 0.10&lt;span class=&quot;src&quot;&gt;（成長口徑 過去三年 EPS 年增 206.6%；收盤 2026-11-17）&lt;/span&gt;，但這是用高峰盈餘與高峰成長算的；改用基準情境推估的成長，PEG 是 1.48&lt;span class=&quot;src&quot;&gt;（成長口徑 基準情境推估、稅後營業利益年增－股數年變化 13.3%；收盤 2026-11-17）&lt;/span&gt;，就不便宜了。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;林區提醒景氣循環股在本益比最低時最危險。&lt;/strong&gt;輝達的利潤率高於自己十一年來的最高值，我們寧可用正常化利潤率看，所以價格位置是偏貴。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;grid2 wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;現金與證券 vs 有息負債（億美元），上方為淨現金&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 300&quot; role=&quot;img&quot; aria-label=&quot;資產負債&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;266.0&quot; y2=&quot;266.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;270.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;0.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;185.3&quot; y2=&quot;185.3&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;189.3&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;200&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;104.7&quot; y2=&quot;
