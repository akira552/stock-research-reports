6 點，門檻 &gt; +3.0 點&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;269.4&quot; y=&quot;252.0&quot; class=&quot;vl s&quot; text-anchor=&quot;start&quot; fill=&quot;var(--pos)&quot;&gt;-0.6 點&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;lg&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--neg)&quot;&gt;&lt;/i&gt;亮燈&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--pos)&quot;&gt;&lt;/i&gt;未亮&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--neg)&quot;&gt;&lt;/i&gt;亮燈門檻（虛線）&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;G4 另有條件「營收近四季年增低於一年前」，兩個條件都成立才亮燈（目前未亮）。&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;C4 另有條件「營收近四季年增低於一年前」，兩個條件都成立才亮燈（目前未亮）。&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;每列一個用財報數字算的訊號：點是目前值，虛線是門檻，點落進淡紅色帶就亮燈；看離門檻還有多少餘裕。是非題型訊號（如連續放緩）不在此圖，見上方燈號。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估.json#/內容/卡住訊號（值、門檻、比較）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;div class=&quot;sub-h&quot;&gt;機械訊號（財報數字算得出）&lt;/div&gt;&lt;div class=&quot;cards&quot;&gt;&lt;div class=&quot;card sig&quot; id=&quot;sig-G1&quot; style=&quot;--tc:var(--lt-未亮, var(--muted))&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;G1　營收增速連續放緩&lt;/b&gt;&lt;span class=&quot;light l-未亮&quot;&gt;未亮&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;成長是不是一季比一季慢？&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;值&lt;/div&gt;&lt;div class=&quot;sv&quot;&gt;否&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;機械值，期末 2026-07-26；門檻  &lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;判讀&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;近四季單季營收年增 62.5%、73.2%、85.2%、105.9%，連續加速，沒有放緩；第三季指引 1,080 億對去年同季 570.1 億約年增 89%（推算），會是第一次放緩。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src43&quot;&gt;[43]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src26&quot;&gt;[26]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src23&quot;&gt;[23]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card sig&quot; id=&quot;sig-G2&quot; style=&quot;--tc:var(--lt-未亮, var(--muted))&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;G2　營業利益率走弱&lt;/b&gt;&lt;span class=&quot;light l-未亮&quot;&gt;未亮&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;規模變大，利潤率有沒有跟著變好？&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;值&lt;/div&gt;&lt;div class=&quot;sv&quot;&gt;+7.1 個百分點&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;機械值，期末 2026-07-26；門檻 &amp;lt; -1.0 個百分點&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;判讀&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;近四季營業利益率 65.2%，比一年前高 7.1 個百分點，規模擴大後利潤率仍在上升。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src44&quot;&gt;[44]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card sig&quot; id=&quot;sig-G3&quot; style=&quot;--tc:var(--lt-亮燈, var(--muted))&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;G3　收款變慢&lt;/b&gt;&lt;span class=&quot;light l-亮燈&quot;&gt;亮燈&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;營收成長是不是靠放寬收款條件？&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;值&lt;/div&gt;&lt;div class=&quot;sv&quot;&gt;+43.4 個百分點&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;機械值，期末 2026-07-26；門檻 &amp;gt; +10.0 個百分點&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;判讀&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;應收年增 126.8%，比近四季營收年增快 43.4 個百分點；改用最新單季年增比較仍快 20.9 個百分點，超過 10 個百分點門檻，不是近四季口徑造成的假亮燈。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src34&quot;&gt;[34]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;公司自己說原因是對部分投資等級客戶的大型多季合約延長付款；這是真實的收款條件放寬，採用計分。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src33&quot;&gt;[33]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card sig&quot; id=&quot;sig-G4&quot; style=&quot;--tc:var(--lt-未亮, var(--muted))&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;G4　投入換不到成長&lt;/b&gt;&lt;span class=&quot;light l-未亮&quot;&gt;未亮&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;資本支出加大，營收增速有沒有跟上？&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;值&lt;/div&gt;&lt;div class=&quot;sv&quot;&gt;-0.6 個百分點&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;機械值，期末 2026-07-26；門檻 &amp;gt; +1.0 個百分點；且 營收近四季年增低於一年前&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;判讀&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;近四季資本支出只占營收 2.4%，比一年前低 0.6 個百分點；不自建晶圓廠，投入以研發與供應承諾為主，這條訊號抓不到它的主要投入。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src45&quot;&gt;[45]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src46&quot;&gt;[46]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src4&quot;&gt;[4]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card sig&quot; id=&quot;sig-C1&quot; style=&quot;--tc:var(--lt-亮燈, var(--muted))&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;C1　存貨堆積&lt;/b&gt;&lt;span class=&quot;light l-亮燈&quot;&gt;亮燈&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;存貨是不是比營收長得快？&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;值&lt;/div&gt;&lt;div class=&quot;sv&quot;&gt;+27.7 個百分點&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;機械值，期末 2026-07-26；門檻 &amp;gt; +5.0 個百分點&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;判讀&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;存貨年增 111.0%，比近四季營收年增快 27.7 個百分點；改用最新單季年增比較只快 5.2 個百分點，剛好過 5 個百分點門檻。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src47&quot;&gt;[47]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;半年內原料由 38.1 億增到 113.4 億、在製品由 88.2 億增到 133.8 億，製成品反由 87.7 億降到 68.6 億美元。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src30&quot;&gt;[30]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;增加集中在原料與在製品，配合 Rubin 開始量產，不是賣不掉的成品堆積；但存貨與 2,790 億供應承諾同步放大，需求轉弱時就是提列風險，仍採用計分。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src30&quot;&gt;[30]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src8&quot;&gt;[8]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src4&quot;&gt;[4]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card sig&quot; id=&quot;sig-C2&quot; style=&quot;--tc:var(--lt-未亮, var(--muted))&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;C2　毛利率走弱&lt;/b&gt;&lt;span class=&quot;light l-未亮&quot;&gt;未亮&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;是不是供過於求在降價？&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;值&lt;/div&gt;&lt;div class=&quot;sv&quot;&gt;+2.5 個百分點&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;機械值，期末 2026-07-26；門檻 &amp;lt; -1.0 個百分點&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;判讀&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;第二季毛利率 75.0%，年增 2.55 個百分點，沒有降價跡象；第三季指引 74.0% 略降，要看是否延續。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src48&quot;&gt;[48]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src26&quot;&gt;[26]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card sig&quot; id=&quot;sig-C4&quot; style=&quot;--tc:var(--lt-未亮, var(--muted))&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;C4　產能建置跟不上需求或過剩&lt;/b&gt;&lt;span class=&quot;light l-未亮&quot;&gt;未亮&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;資本支出是不是在景氣高點加大？&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;值&lt;/div&gt;&lt;div class=&quot;sv&quot;&gt;-0.6 個百分點&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;機械值，期末 2026-07-26；門檻 &amp;gt; +3.0 個百分點；且 營收近四季年增低於一年前&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;判讀&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;資本支出強度沒有在高點加大；產能風險改以供應承諾形式出現（一季內由 1,190 億增到 2,790 億美元），這條機械訊號看不到。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src49&quot;&gt;[49]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src4&quot;&gt;[4]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub-h&quot;&gt;作者訊號（財報數字看不出，作者讀原文判斷）&lt;/div&gt;&lt;div class=&quot;cards&quot;&gt;&lt;div class=&quot;card sig&quot; id=&quot;sig-C3&quot; style=&quot;--tc:var(--lt-資料未取得, var(--muted))&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;C3　訂單出貨比轉弱&lt;/b&gt;&lt;span class=&quot;light l-資料未取得&quot;&gt;資料未取得&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;新訂單比出貨少嗎？&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;值&lt;/div&gt;&lt;div class=&quot;sv&quot;&gt;未揭露（公司不揭露訂單出貨比；一年以上合約剩餘履約義務 32 億美元）&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;作者從原文填&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;判讀&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-待查&quot;&gt;待查&lt;/span&gt;待查：公司未揭露訂單出貨比或積壓訂單；要找新任管理層在 FY2027 第三季財報會議或 10-Q 是否揭露客戶訂單、供應承諾的變化，以及傳聞中的下單放緩是否屬實。&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;可得的替代資料只有：一年以上合約剩餘履約義務 32 億美元（約 0.03 季營收）與供應承諾 2,790 億美元，兩者都不是訂單出貨比。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src15&quot;&gt;[15]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src16&quot;&gt;[16]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src4&quot;&gt;[4]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;h3 id=&quot;ext&quot;&gt;外部驗證：競爭者、客戶、供應商怎麼描述這家公司&lt;/h3&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;外部驗證：誰支持、誰反駁&lt;/figcaption&gt;&lt;div class=&quot;emx&quot; style=&quot;grid-template-columns:repeat(3,1fr)&quot;&gt;&lt;div class=&quot;emc&quot; style=&quot;--tc:var(--pos)&quot;&gt;&lt;div class=&quot;emh&quot;&gt;支持 &lt;b&gt;3&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;emi&quot;&gt;&lt;b&gt;Advanced Micro Devices（AMD）&lt;/b&gt;&lt;span&gt;競爭者&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;emi&quot;&gt;&lt;b&gt;GSI Technology&lt;/b&gt;&lt;span&gt;競爭者&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;emi&quot;&gt;&lt;b&gt;SharonAI Holdings&lt;/b&gt;&lt;span&gt;客戶&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;emc&quot; style=&quot;--tc:var(--warn)&quot;&gt;&lt;div class=&quot;emh&quot;&gt;部分支持 &lt;b&gt;1&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;emi&quot;&gt;&lt;b&gt;BluSky AI&lt;/b&gt;&lt;span&gt;客戶&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;emc&quot; style=&quot;--tc:var(--neg)&quot;&gt;&lt;div class=&quot;emh&quot;&gt;反駁 &lt;b&gt;2&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;emi&quot;&gt;&lt;b&gt;CNBC 引述的產業分析師&lt;/b&gt;&lt;span&gt;外部分析師&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;emi&quot;&gt;&lt;b&gt;TrendForce（轉述台灣媒體）&lt;/b&gt;&lt;span&gt;其他&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;6 個外部來源（競爭者、客戶、供應商、夥伴的申報或報導）怎麼描述本公司：支持 3、部分支持 1、反駁 2。依「對本公司說法」欄的開頭分類。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估.json#/內容/外部驗證（對方、關係、支持）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;div class=&quot;cards&quot;&gt;&lt;div class=&quot;card ext&quot; style=&quot;--tc:var(--pos)&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;Advanced Micro Devices（AMD）&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;競爭者&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;對方文件怎麼說&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;AMD 年報寫在資料中心分部主要與英特爾和輝達競爭，產品涵蓋 CPU、GPU、DPU 與 AI 網卡。對本公司說法：支持，輝達是資料中心 AI 晶片的主要對手方，與公司自述的地位一致（作者解讀，原文只列為競爭者）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src50&quot;&gt;[50]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對本公司說法&lt;/div&gt;&lt;div class=&quot;stc&quot;&gt;支持（資料中心主要玩家）&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card ext&quot; style=&quot;--tc:var(--pos)&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;GSI Technology&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;競爭者&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;對方文件怎麼說&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;GSI Technology 年報寫輝達靠 GPU 架構與廣泛採用的 CUDA 軟體平台在 AI 硬體生態取得主導地位，對開發者與客戶造成顯著的轉換成本與生態鎖定。對本公司說法：支持，CUDA 生態是屏障。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src51&quot;&gt;[51]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對本公司說法&lt;/div&gt;&lt;div class=&quot;stc&quot;&gt;支持&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card ext&quot; style=&quot;--tc:var(--pos)&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;SharonAI Holdings&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;客戶&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;對方文件怎麼說&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;SharonAI 年報寫自己的軟體架構、模型訓練流程與推論基礎設施都針對輝達 CUDA 平台與函式庫最佳化。對本公司說法：支持，客戶端的程式碼已綁在 CUDA 上。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src52&quot;&gt;[52]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對本公司說法&lt;/div&gt;&lt;div class=&quot;stc&quot;&gt;支持&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card ext&quot; style=&quot;--tc:var(--warn)&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;BluSky AI&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;客戶&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;對方文件怎麼說&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;BluSky AI 年報寫依賴輝達與 AMD 等少數 GPU 製造商，供應商延遲或漲價會直接影響其營運成本與擴張。對本公司說法：部分支持，客戶承認對輝達的採購依賴與議價弱勢，但也把 AMD 列為可替代來源。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src53&quot;&gt;[53]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對本公司說法&lt;/div&gt;&lt;div class=&quot;stc&quot;&gt;部分支持&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card ext&quot; style=&quot;--tc:var(--neg)&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;CNBC 引述的產業分析師&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;外部分析師&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;對方文件怎麼說&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;報導引述分析師：輝達仍擁有絕大多數 AI 運算與 CUDA 生態鎖定，但 OpenAI 與博通合作的 Jalapeño 晶片威脅輝達在成長最快的推論端的毛利。對本公司說法：反駁推論端的定價力，雖同時承認 CUDA 鎖定存在。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src54&quot;&gt;[54]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對本公司說法&lt;/div&gt;&lt;div class=&quot;stc&quot;&gt;反駁（推論端毛利）&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card ext&quot; style=&quot;--tc:var(--neg)&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;TrendForce（轉述台灣媒體）&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;其他&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;對方文件怎麼說&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;報導指若輝達放緩下單，釋出的台積電產能可能由 AMD 與博通、聯發科等 ASIC 業者取得；AMD MI455X 已量產出貨（傳聞，未證實）。對本公司說法：反駁需求與產能地位不受執行長事件影響的說法。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src55&quot;&gt;[55]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src38&quot;&gt;[38]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對本公司說法&lt;/div&gt;&lt;div class=&quot;stc&quot;&gt;反駁&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;sa&quot;&gt;&lt;h2&gt;4　優勢來源與持續期間&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;每種優勢都要同時有「好處」與「屏障」證據（Helmer《7 Powers》的檢驗）：只有好處、沒有屏障的優勢只算&lt;b&gt;暫時領先&lt;/b&gt;。再分兩維：超額報酬有多大、能撐多久（Mauboussin《Measuring the Moat》的問法）；Morningstar 五種來源只當分類參考。本節只談商業面的屏障，不含價格或估值，也不是估值報告的護城河評分，不進商業評估等級。&lt;/p&gt;&lt;div class=&quot;callout&quot;&gt;&lt;b&gt;總結&lt;/b&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;主要優勢是 CUDA 軟體生態的轉換成本，有競爭者與客戶申報佐證，換到目前同業最高的利潤率；推論端的客製晶片是最直接的侵蝕來源，供應規模的領先則較短暫。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src51&quot;&gt;[51]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src56&quot;&gt;[56]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src54&quot;&gt;[54]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;優勢地圖：多大、多久&lt;/figcaption&gt;&lt;div class=&quot;amx&quot;&gt;&lt;div class=&quot;amy&quot;&gt;持續期間 →&lt;/div&gt;&lt;div class=&quot;amg&quot;&gt;&lt;div class=&quot;amr&quot; style=&quot;grid-template-columns:80px repeat(4,1fr)&quot;&gt;&lt;div class=&quot;aml&quot;&gt;10年以上&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amc unk&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;amr&quot; style=&quot;grid-template-columns:80px repeat(4,1fr)&quot;&gt;&lt;div class=&quot;aml&quot;&gt;5–10年&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;span class=&quot;ab ab-有屏障證據&quot; title=&quot;CUDA 軟體生態的轉換成本：有屏障證據&quot;&gt;1&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;amc unk&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;amr&quot; style=&quot;grid-template-columns:80px repeat(4,1fr)&quot;&gt;&lt;div class=&quot;aml&quot;&gt;不足5年&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amc unk&quot;&gt;&lt;span class=&quot;ab ab-有屏障證據&quot; title=&quot;整櫃系統與供應鏈的規模：有屏障證據&quot;&gt;2&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;amr&quot; style=&quot;grid-template-columns:80px repeat(4,1fr)&quot;&gt;&lt;div class=&quot;aml&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amx-l&quot;&gt;小&lt;/div&gt;&lt;div class=&quot;amx-l&quot;&gt;中&lt;/div&gt;&lt;div class=&quot;amx-l&quot;&gt;大&lt;/div&gt;&lt;div class=&quot;amx-l&quot;&gt;不明&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;amxt&quot;&gt;超額報酬大小 →&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;ol class=&quot;akey&quot;&gt;&lt;li&gt;&lt;span class=&quot;ab ab-有屏障證據&quot;&gt;1&lt;/span&gt;CUDA 軟體生態的轉換成本（轉換成本；有屏障證據）&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;ab ab-有屏障證據&quot;&gt;2&lt;/span&gt;整櫃系統與供應鏈的規模（規模經濟；有屏障證據）&lt;/li&gt;&lt;/ol&gt;&lt;div class=&quot;lg&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--pos)&quot;&gt;&lt;/i&gt;有屏障證據&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--warn)&quot;&gt;&lt;/i&gt;暫時領先&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;每個圓圈是一項優勢：越往右超額報酬越大、越往上能撐越久。綠＝屏障有事實證據；橘＝只有好處或屏障只有推論（暫時領先，持續期間最多不足 5 年）。作者寫「不明」的維度放在虛線格，不補值。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估.json#/內容/優勢來源/優勢（超額報酬大小、持續期間、判定）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;每項優勢有多少證據&lt;/figcaption&gt;&lt;svg viewBox=&quot;0 0 680 128&quot; role=&quot;img&quot; aria-label=&quot;優勢的證據數：好處與屏障&quot;&gt;&lt;text x=&quot;254&quot; y=&quot;124&quot; class=&quot;ax&quot;&gt;好處句數&lt;/text&gt;&lt;text x=&quot;459.0&quot; y=&quot;124&quot; class=&quot;ax&quot;&gt;屏障句數（事實／推論）&lt;/text&gt;&lt;text x=&quot;242&quot; y=&quot;32&quot; class=&quot;lb s&quot; text-anchor=&quot;end&quot;&gt;1 CUDA 軟體生態的轉換成本&lt;title&gt;1 CUDA 軟體生態的轉換成本&lt;/title&gt;&lt;/text&gt;&lt;rect x=&quot;250&quot; y=&quot;20&quot; width=&quot;41.2&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;296.2&quot; y=&quot;33&quot; class=&quot;vl s&quot;&gt;1&lt;/text&gt;&lt;rect x=&quot;455.0&quot; y=&quot;20&quot; width=&quot;123.8&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;var(--pos)&quot;/&gt;&lt;rect x=&quot;578.8&quot; y=&quot;20&quot; width=&quot;41.2&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;var(--accent)&quot; opacity=&quot;.7&quot;/&gt;&lt;text x=&quot;625.0&quot; y=&quot;33&quot; class=&quot;vl s&quot;&gt;3／1&lt;/text&gt;&lt;text x=&quot;242&quot; y=&quot;78&quot; class=&quot;lb s&quot; text-anchor=&quot;end&quot;&gt;2 整櫃系統與供應鏈的規模&lt;title&gt;2 整櫃系統與供應鏈的規模&lt;/title&gt;&lt;/text&gt;&lt;rect x=&quot;250&quot; y=&quot;66&quot; width=&quot;41.2&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;296.2&quot; y=&quot;79&quot; class=&quot;vl s&quot;&gt;1&lt;/text&gt;&lt;rect x=&quot;455.0&quot; y=&quot;66&quot; width=&quot;41.2&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;var(--pos)&quot;/&gt;&lt;rect x=&quot;496.2&quot; y=&quot;66&quot; width=&quot;41.2&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;var(--accent)&quot; opacity=&quot;.7&quot;/&gt;&lt;text x=&quot;542.5&quot; y=&quot;79&quot; class=&quot;vl s&quot;&gt;1／1&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;lg&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c3)&quot;&gt;&lt;/i&gt;好處&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--pos)&quot;&gt;&lt;/i&gt;屏障：事實&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--accent)&quot;&gt;&lt;/i&gt;屏障：推論&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;左邊是「它帶來什麼」的句數，右邊是「為什麼對手拿不走」的句數；屏障至少一句是事實（綠）才算有屏障證據。句數多不等於優勢強，只表示證據量。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估.json#/內容/優勢來源/優勢（好處、屏障的標記）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;div class=&quot;card advc&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;&lt;span class=&quot;num-b 有屏障證據&quot;&gt;1&lt;/span&gt;CUDA 軟體生態的轉換成本&lt;/b&gt;&lt;span class=&quot;vd vd-有屏障證據&quot;&gt;有屏障證據&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;轉換成本（Switching Costs）｜晨星：轉換成本&lt;/div&gt;&lt;div class=&quot;two&quot;&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;好處（它帶來什麼）&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;第二季毛利率 75.0%，去年同季 72.4%，客戶買的是含軟體的整套平台而不是單顆晶片。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src27&quot;&gt;[27]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;屏障（為什麼對手拿不走）&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;競爭者 GSI Technology 年報寫 CUDA 對開發者與客戶造成顯著轉換成本與生態鎖定。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src51&quot;&gt;[51]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;客戶 SharonAI 的軟體架構、訓練流程與推論基礎設施都針對 CUDA 最佳化，換平台要改寫這些程式。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src52&quot;&gt;[52]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;全球超過 750 萬名開發者使用 CUDA 與輝達軟體工具，平台在幾乎所有主要伺服器廠與雲端都買得到。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src57&quot;&gt;[57]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;開發者與裝機量越大，平台對客戶的價值越高；對手要追上，不只要做出晶片，還要說服開發者重寫並維護另一套軟體。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src58&quot;&gt;[58]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;two&quot;&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;超額報酬大小&lt;/div&gt;&lt;span class=&quot;lv&quot;&gt;大&lt;/span&gt;&lt;div class=&quot;s&quot;&gt;近四季營業利益率 65.2%，在 AMD、博通、Marvell、高通四家同業中最高（同業百分位 1.0）；近 20 季範圍 15.7%–65.2%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src56&quot;&gt;[56]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;持續期間&lt;/div&gt;&lt;span class=&quot;lv&quot;&gt;5–10年&lt;/span&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;CUDA 鎖定有競爭者與客戶申報佐證，屏障本身堅固；但大型雲端客戶自研晶片（Alphabet、Amazon、Microsoft），OpenAI 與博通的 Jalapeño 直接針對推論端，屏障在推論端較薄，所以不給 10 年以上。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src59&quot;&gt;[59]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src54&quot;&gt;[54]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card advc&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;&lt;span class=&quot;num-b 有屏障證據&quot;&gt;2&lt;/span&gt;整櫃系統與供應鏈的規模&lt;/b&gt;&lt;span class=&quot;vd vd-有屏障證據&quot;&gt;有屏障證據&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;規模經濟（Scale Economies）&lt;/div&gt;&lt;div class=&quot;two&quot;&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;好處（它帶來什麼）&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;第二季研發只占營收 7.3%（一年前 9.2%），卻支撐約 31,000 名研發人員；營收放大讓固定的研發投入攤得更薄。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src60&quot;&gt;[60]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src61&quot;&gt;[61]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;屏障（為什麼對手拿不走）&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;輝達已為未來幾年的記憶體與製造產能簽下 2,790 億美元供應承諾，一季內增加 1,600 億。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src4&quot;&gt;[4]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;對手要取得同等產能，需要相近規模的預付與承諾；報導指輝達若放緩下單，釋出的台積電產能才會輪到 AMD 與 ASIC 業者，代表產能目前被輝達占住（傳聞）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src4&quot;&gt;[4]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src55&quot;&gt;[55]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;two&quot;&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;超額報酬大小&lt;/div&gt;&lt;span class=&quot;lv&quot;&gt;不明&lt;/span&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-待查&quot;&gt;待查&lt;/span&gt;待查：規模帶來的成本差與 CUDA 帶來的價格差無法從申報分開，要找同業單位成本或分架構毛利。&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;持續期間&lt;/div&gt;&lt;span class=&quot;lv&quot;&gt;不足5年&lt;/span&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;供應承諾部分可取消或調整，產能也會隨台積電擴產與對手下單而重分配；聯發科、世芯等 ASIC 業者已在擴大 AI 加速器業務，規模優勢撐不到 5 年以上。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src4&quot;&gt;[4]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src55&quot;&gt;[55]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;超額報酬的機械參考：利潤率位置&lt;/figcaption&gt;&lt;svg viewBox=&quot;0 0 680 92&quot; role=&quot;img&quot; aria-label=&quot;近四季營業利益率在近20季範圍的位置&quot;&gt;&lt;line x1=&quot;30.0&quot; x2=&quot;30.0&quot; y1=&quot;18&quot; y2=&quot;64&quot; class=&quot;zl&quot;/&gt;&lt;text x=&quot;30.0&quot; y=&quot;84&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;0%&lt;/text&gt;&lt;line x1=&quot;185.0&quot; x2=&quot;185.0&quot; y1=&quot;18&quot; y2=&quot;64&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;185.0&quot; y=&quot;84&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;20%&lt;/text&gt;&lt;line x1=&quot;340.0&quot; x2=&quot;340.0&quot; y1=&quot;18&quot; y2=&quot;64&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;340.0&quot; y=&quot;84&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;40%&lt;/text&gt;&lt;line x1=&quot;495.0&quot; x2=&quot;495.0&quot; y1=&quot;18&quot; y2=&quot;64&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;495.0&quot; y=&quot;84&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;60%&lt;/text&gt;&lt;line x1=&quot;650.0&quot; x2=&quot;650.0&quot; y1=&quot;18&quot; y2=&quot;64&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;650.0&quot; y=&quot;84&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;80%&lt;/text&gt;&lt;rect x=&quot;151.4&quot; y=&quot;30&quot; width=&quot;384.0&quot; height=&quot;22&quot; rx=&quot;4&quot; fill=&quot;var(--biz)&quot; opacity=&quot;.22&quot;/&gt;&lt;text x=&quot;151.4&quot; y=&quot;24&quot; class=&quot;ax&quot;&gt;近 20 季範圍 15.7%～65.2%&lt;/text&gt;&lt;circle cx=&quot;535.4&quot; cy=&quot;41&quot; r=&quot;7&quot; fill=&quot;var(--biz)&quot;/&gt;&lt;text x=&quot;535.4&quot; y=&quot;76&quot; class=&quot;vl s&quot; text-anchor=&quot;middle&quot;&gt;近四季 65.2%&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;藍帶是近 20 季的近四季營業利益率範圍，圓點是最新值；同業營業利益率百分位 1.0（1＝同業最高）。只供對照「超額報酬大小」，不是分數、不進等級，也不是估值報告的護城河評分。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估底稿.json#/優勢參考&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;p class=&quot;lead&quot;&gt;機械參考（供對照超額報酬，不是分數）：近四季營業利益率 65.2%，近 20 季範圍 15.7%～65.2%，同業營業利益率百分位 1.0。&lt;/p&gt;&lt;div class=&quot;note&quot;&gt;判定規則：屏障欄至少一句標「事實」並附出處才算「有屏障證據」；否則只算「暫時領先」，持續期間最多寫「不足5年」。&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;s4&quot;&gt;&lt;h2&gt;5　生命週期與未來變化&lt;/h2&gt;&lt;div class=&quot;stages&quot;&gt;&lt;div class=&quot;&quot;&gt;起步&lt;/div&gt;&lt;div class=&quot;on&quot;&gt;成長&lt;/div&gt;&lt;div class=&quot;&quot;&gt;成熟&lt;/div&gt;&lt;div class=&quot;&quot;&gt;衰退&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;lead&quot;&gt;估值報告的林區分類（引用，不重判）：快速成長&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;FY2026 營收 2,159 億美元、年增 65.5%；最新單季年增 105.9%、近四季年增 83.4%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src62&quot;&gt;[62]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src31&quot;&gt;[31]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src63&quot;&gt;[63]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;近四季營業利益率 65.2%，比一年前高 7.1 個百分點，成長同時帶來利潤率擴張。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src64&quot;&gt;[64]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src44&quot;&gt;[44]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;與研究報告的林區分類「快速成長」一致；該分類另註明兼具週期特徵，本頁第五節的週期推論也把它當成上行段中的成長股看待。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src65&quot;&gt;[65]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src66&quot;&gt;[66]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;callout&quot;&gt;&lt;b&gt;最可能的轉變：成長 → 成熟（以半導體循環下行段的形式出現）&lt;/b&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;營收近四季年增從 83.4% 連續回落到 20% 以下，且近四季營業利益率跌破 55%，就代表成長期進入尾段。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src63&quot;&gt;[63]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src67&quot;&gt;[67]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;前一次下行段（2024-04 峰 208% 到 2025-10 谷 65.2%）歷時 6 季，但谷底年增仍有 65%；這次若谷底年增掉到 20% 以下，才是性質改變，不只是循環。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src68&quot;&gt;[68]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lead&quot;&gt;怎麼檢驗&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;每季看營收近四季年增與營業利益率近四季（推論紀錄 P1、P2），並對照客製晶片在推論端的採用（外部驗證 N2、N10）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src63&quot;&gt;[63]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src54&quot;&gt;[54]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src55&quot;&gt;[55]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;s5&quot;&gt;&lt;h2&gt;6　週期推論&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;三種證據都寫成「區間＋條件」，不給單一日期。&lt;/p&gt;&lt;div class=&quot;callout&quot;&gt;&lt;b&gt;綜合：未來 1–4 季（2026 年第四季至 2027 年第三季）營收近四季年增可能見頂，之後進入下行段；見頂前近四季年增仍在 60% 以上&lt;/b&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;第三季指引 1,080 億對應單季年增約 89%（推算），低於第二季的 105.9%；若第四季再放緩，單季年增就連續兩季下降，是見頂的第一個訊號。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src26&quot;&gt;[26]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src23&quot;&gt;[23]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;上行段已走 3 季，歷史中位 4 季、最長 7 季。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src69&quot;&gt;[69]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src70&quot;&gt;[70]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;若 Rubin 量產順利、供應承諾轉成出貨，上行段可能拉長到區間後段；若執行長更替導致客戶延後下單或轉向客製晶片，見頂會落在區間前段。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src8&quot;&gt;[8]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src38&quot;&gt;[38]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;區間以自身歷史上行段長度為主、產業週期為輔；訂單能見度不足，所以不給單一時點。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src70&quot;&gt;[70]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src16&quot;&gt;[16]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;h3&gt;① 自身歷史循環&lt;/h3&gt;&lt;div class=&quot;chart&quot;&gt;&lt;svg viewBox=&quot;0 0 720 240&quot; role=&quot;img&quot; aria-label=&quot;近四季營收年增（2012-04-29～2026-07-26（58 季））&quot;&gt;&lt;line x1=&quot;46&quot; x2=&quot;704&quot; y1=&quot;210.0&quot; y2=&quot;210.0&quot; stroke=&quot;var(--line)&quot; stroke-width=&quot;1&quot;/&gt;&lt;text x=&quot;40&quot; y=&quot;214.0&quot; font-size=&quot;11&quot; text-anchor=&quot;end&quot; fill=&quot;var(--muted)&quot;&gt;-19%&lt;/text&gt; uot; class=&quot;vl s&quot;&gt;5 季 上行&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;lg&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--neg)&quot;&gt;&lt;/i&gt;下行段&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--pos)&quot;&gt;&lt;/i&gt;上行段&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--ink)&quot;&gt;&lt;/i&gt;目前這一段（虛框，尚未結束）&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;每條是兩個轉折之間的一段有多長；虛線是歷史中位（下行 4 季、上行 6.5 季）。拿目前這段的長度對照中位，看走到哪；淡色段的起點是資料起點，不計入統計。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估底稿.json#/週期/營業利益率_近四季（之字形門檻 2%）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;p class=&quot;lead&quot;&gt;近四季營業利益率轉折：谷 2011-05（7.5%）、峰 2011-10（17.9%）、谷 2014-01（12.0%）、峰 2018-07（37.2%）、谷 2019-10（21.5%）、峰 2020-04（29.4%）、谷 2020-07（27.1%）、峰 2022-01（37.3%）、谷 2023-01（15.7%）、峰 2024-10（62.7%）、谷 2025-04（58.0%）；目前 上行。&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;營收近四季年增自 2012 年起有 5 次上行段與 5 次下行段；下行段中位 6 季（最短 2、最長 7），上行段中位 4 季（最短 1、最長 7）；年度營收只在 2019（FY2020 標籤年）下降。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src67&quot;&gt;[67]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src70&quot;&gt;[70]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src71&quot;&gt;[71]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;最近一次谷底在 2025-10-26（近四季年增 65.2%），之後連續 3 季上行到 83.4%；上一個峰在 2024-04-28 的 208.3%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src69&quot;&gt;[69]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src68&quot;&gt;[68]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;轉折的來源是客戶資本支出循環與產品換代（2019、2023 年兩次年增轉負），屬於重複出現的景氣循環，不是一次性事件。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src68&quot;&gt;[68]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src66&quot;&gt;[66]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;h3&gt;② 訂單能見度&lt;/h3&gt;&lt;p class=&quot;s&quot;&gt;一年以上合約剩餘履約義務 32 億美元，約只有 0.03 季營收；合約負債約 0.07 季營收，訂單能見度指標對輝達幾乎不適用。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src15&quot;&gt;[15]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src16&quot;&gt;[16]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src72&quot;&gt;[72]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;可用的前瞻資料只有一季的營收指引（第三季 1,080 億 ±2%）與 2,790 億美元供應承諾；後者是輝達對供應商的承諾，不是客戶對輝達的訂單。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src26&quot;&gt;[26]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src4&quot;&gt;[4]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;h3&gt;③ 公司特有週期&lt;/h3&gt;&lt;p class=&quot;s&quot;&gt;產品換代：Blackwell 與 Vera Rubin 並行出貨，公司寫生產規模與系統複雜度曾經造成延誤、營收波動與存貨提列，並列為仍存在的風險。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src8&quot;&gt;[8]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;出口管制：H20 銷往中國需許可，FY2026 第一季因此提列 45 億美元；第三季指引不含中國資料中心運算營收。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src32&quot;&gt;[32]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src26&quot;&gt;[26]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;客戶建置限制：土地、電力、廠房與資金不足會延後客戶部署，公司以擔保與承諾協助 AI 雲與模型公司。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src40&quot;&gt;[40]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;管理層更替：創辦人黃仁勳 2026-11-11 辭任，財務長兼任代理執行長。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src5&quot;&gt;[5]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;h3&gt;④ 產業層級週期（聯準會 G.17 工業生產與產能利用率，經 FRED）&lt;/h3&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;美國電腦與電子產品（含半導體）工業生產 2026 年 9 月年增約 9.5%，比 6 個月前加快約 3.9 個百分點，自 2023 年 9 月的谷起已上行 36 個月；這是全國分產業數據，不是輝達自己的數字。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src73&quot;&gt;[73]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src74&quot;&gt;[74]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src75&quot;&gt;[75]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;同產業產能利用率 75.9%，位在 2000 年以來約第 75 百分位（工具判為中性，剛好在偏高邊界下），近 6 個月升約 1.7 點、方向向上。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src76&quot;&gt;[76]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src77&quot;&gt;[77]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src78&quot;&gt;[78]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;輝達與這個產業週期方向同步（都在上行），但連動不緊：G.17 量的是美國境內生產，輝達晶圓靠代工、封測外包，營收年增 83% 遠大於產業的 9.5%；產業數據只能當背景，不能代表輝達的週期位置。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src79&quot;&gt;[79]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src46&quot;&gt;[46]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src63&quot;&gt;[63]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;系列&lt;/th&gt;&lt;th&gt;最新月份&lt;/th&gt;&lt;th&gt;最新值&lt;/th&gt;&lt;th&gt;位置與方向&lt;/th&gt;&lt;th&gt;之字形（月）&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;電腦與電子產品（含半導體）&lt;/b&gt;&lt;div class=&quot;lead&quot;&gt;IPG334S｜NAICS 334&lt;/div&gt;&lt;/td&gt;&lt;td&gt;2026-09&lt;/td&gt;&lt;td&gt;年增 9.5%&lt;/td&gt;&lt;td&gt;12 個月變化 9.5%；較 6 個月前加速（+3.9 個百分點）&lt;/td&gt;&lt;td&gt;目前上行，距最近轉折 36 個月&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;電腦與電子產品產能利用率&lt;/b&gt;&lt;div class=&quot;lead&quot;&gt;CAPUTLG334S｜NAICS 334&lt;/div&gt;&lt;/td&gt;&lt;td&gt;2026-09&lt;/td&gt;&lt;td&gt;75.9%&lt;/td&gt;&lt;td&gt;中性（百分位 0.75，2000-01 起）；近6個月 +1.7 點 → 上升&lt;/td&gt;&lt;td&gt;目前上行，距最近轉折 30 個月&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;lead&quot;&gt;來源：Board of Governors of the Federal Reserve System, G.17 Industrial Production and Capacity Utilization，經 FRED；系列編號查證日 2026-11-08，資料取得 2026-11-08。這是全國分產業的數據，只描述產業所處位置與方向，不是公司自己的數字，也不代表公司的週期必然同步。&lt;/p&gt;&lt;/section&gt;&lt;section id=&quot;s6&quot;&gt;&lt;h2&gt;7　觀察清單：下季要看什麼&lt;/h2&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;觀察清單：目前值離改判門檻多遠&lt;/figcaption&gt;&lt;div class=&quot;wg&quot;&gt;&lt;div class=&quot;wgt&quot;&gt;&lt;b&gt;單季營收年增&lt;/b&gt;&lt;span&gt;維持條件：營收單季年增 &amp;gt;= 50.0%&lt;/span&gt;&lt;/div&gt;&lt;svg viewBox=&quot;0 0 680 60&quot; role=&quot;img&quot; aria-label=&quot;單季營收年增&quot;&gt;&lt;rect x=&quot;281.8&quot; y=&quot;14&quot; width=&quot;384.2&quot; height=&quot;20&quot; fill=&quot;var(--pos)&quot; opacity=&quot;.12&quot;/&gt;&lt;line x1=&quot;14.0&quot; x2=&quot;666.0&quot; y1=&quot;24&quot; y2=&quot;24&quot; stroke=&quot;var(--line)&quot; stroke-width=&quot;2&quot;/&gt;&lt;line x1=&quot;281.8&quot; x2=&quot;281.8&quot; y1=&quot;8&quot; y2=&quot;40&quot; stroke=&quot;var(--ink)&quot; stroke-dasharray=&quot;4 3&quot; stroke-width=&quot;1.6&quot;/&gt;&lt;text x=&quot;281.8&quot; y=&quot;54&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;門檻 50.0%&lt;/text&gt;&lt;circle cx=&quot;581.0&quot; cy=&quot;24&quot; r=&quot;7&quot; fill=&quot;var(--pos)&quot;/&gt;&lt;text x=&quot;581.0&quot; y=&quot;9&quot; class=&quot;vl s&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--pos)&quot;&gt;目前 105.8%&lt;/text&gt;&lt;/svg&gt;&lt;/div&gt;&lt;div class=&quot;wg&quot;&gt;&lt;div class=&quot;wgt&quot;&gt;&lt;b&gt;應收增速減營收增速&lt;/b&gt;&lt;span&gt;維持條件：應收增速減營收增速 &amp;lt;= 50.0%&lt;/span&gt;&lt;/div&gt;&lt;svg viewBox=&quot;0 0 680 60&quot; role=&quot;img&quot; aria-label=&quot;應收增速減營收增速&quot;&gt;&lt;rect x=&quot;14.0&quot; y=&quot;14&quot; width=&quot;567.0&quot; height=&quot;20&quot; fill=&quot;var(--pos)&quot; opacity=&quot;.12&quot;/&gt;&lt;line x1=&quot;14.0&quot; x2=&quot;666.0&quot; y1=&quot;24&quot; y2=&quot;24&quot; stroke=&quot;var(--line)&quot; stroke-width=&quot;2&quot;/&gt;&lt;line x1=&quot;581.0&quot; x2=&quot;581.0&quot; y1=&quot;8&quot; y2=&quot;40&quot; stroke=&quot;var(--ink)&quot; stroke-dasharray=&quot;4 3&quot; stroke-width=&quot;1.6&quot;/&gt;&lt;text x=&quot;581.0&quot; y=&quot;54&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;門檻 50.0%&lt;/text&gt;&lt;circle cx=&quot;506.0&quot; cy=&quot;24&quot; r=&quot;7&quot; fill=&quot;var(--pos)&quot;/&gt;&lt;text x=&quot;506.0&quot; y=&quot;9&quot; class=&quot;vl s&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--pos)&quot;&gt;目前 43.4%&lt;/text&gt;&lt;/svg&gt;&lt;/div&gt;&lt;div class=&quot;wg&quot;&gt;&lt;div class=&quot;wgt&quot;&gt;&lt;b&gt;毛利率&lt;/b&gt;&lt;span&gt;維持條件：毛利率 &amp;gt;= 72.0%&lt;/span&gt;&lt;/div&gt;&lt;svg viewBox=&quot;0 0 680 60&quot; role=&quot;img&quot; aria-label=&quot;毛利率&quot;&gt;&lt;rect x=&quot;558.4&quot; y=&quot;14&quot; width=&quot;107.6&quot; height=&quot;20&quot; fill=&quot;var(--pos)&quot; opacity=&quot;.12&quot;/&gt;&lt;line x1=&quot;14.0&quot; x2=&quot;666.0&quot; y1=&quot;24&quot; y2=&quot;24&quot; stroke=&quot;var(--line)&quot; stroke-width=&quot;2&quot;/&gt;&lt;line x1=&quot;558.4&quot; x2=&quot;558.4&quot; y1=&quot;8&quot; y2=&quot;40&quot; stroke=&quot;var(--ink)&quot; stroke-dasharray=&quot;4 3&quot; stroke-width=&quot;1.6&quot;/&gt;&lt;text x=&quot;558.4&quot; y=&quot;54&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;門檻 72.0%&lt;/text&gt;&lt;circle cx=&quot;581.0&quot; cy=&quot;24&quot; r=&quot;7&quot; fill=&quot;var(--pos)&quot;/&gt;&lt;text x=&quot;581.0&quot; y=&quot;9&quot; class=&quot;vl s&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--pos)&quot;&gt;目前 75.0%&lt;/text&gt;&lt;/svg&gt;&lt;/div&gt;&lt;div class=&quot;wg&quot;&gt;&lt;div class=&quot;wgt&quot;&gt;&lt;b&gt;存貨增速減營收增速&lt;/b&gt;&lt;span&gt;維持條件：存貨增速減營收增速 &amp;lt;= 40.0%&lt;/span&gt;&lt;/div&gt;&lt;svg viewBox=&quot;0 0 680 60&quot; role=&quot;img&quot; aria-label=&quot;存貨增速減營收增速&quot;&gt;&lt;rect x=&quot;14.0&quot; y=&quot;14&quot; width=&quot;567.0&quot; height=&quot;20&quot; fill=&quot;var(--pos)&quot; opacity=&quot;.12&quot;/&gt;&lt;line x1=&quot;14.0&quot; x2=&quot;666.0&quot; y1=&quot;24&quot; y2=&quot;24&quot; stroke=&quot;var(--line)&quot; stroke-width=&quot;2&quot;/&gt;&lt;line x1=&quot;581.0&quot; x2=&quot;581.0&quot; y1=&quot;8&quot; y2=&quot;40&quot; stroke=&quot;var(--ink)&quot; stroke-dasharray=&quot;4 3&quot; stroke-width=&quot;1.6&quot;/&gt;&lt;text x=&quot;581.0&quot; y=&quot;54&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;門檻 40.0%&lt;/text&gt;&lt;circle cx=&quot;406.1&quot; cy=&quot;24&quot; r=&quot;7&quot; fill=&quot;var(--pos)&quot;/&gt;&lt;text x=&quot;406.1&quot; y=&quot;9&quot; class=&quot;vl s&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--pos)&quot;&gt;目前 27.7%&lt;/text&gt;&lt;/svg&gt;&lt;/div&gt;&lt;div class=&quot;lg&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--pos)&quot;&gt;&lt;/i&gt;仍在維持條件內&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--neg)&quot;&gt;&lt;/i&gt;已越過門檻&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;只畫能自動對照的觀察項（有檢驗鍵與門檻）：淡綠帶是維持目前判斷的範圍，虛線是門檻，圓點是底稿最新值；越過門檻就照表中「改判方向」重看。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估.json#/內容/觀察清單（檢驗鍵、比較、門檻）＋商業評估底稿.json#/指標（目前值）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;div class=&quot;cards&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;單季營收年增&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;自動對照&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;目前值&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;2026-07-26 單季營收年增 105.9%，近四季依序 62.5%、73.2%、85.2%、105.9%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src31&quot;&gt;[31]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src43&quot;&gt;[43]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;看什麼&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;上行段是否見頂、換代與執行長更替有沒有讓客戶延後下單&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;改判方向&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;若單季營收年增跌破 50%，則週期位置與成長動能下修，判定進入下行段&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;應收增速減營收增速&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;自動對照&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;目前值&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;2026-07-26 應收年增比近四季營收年增快 43.4 個百分點。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src80&quot;&gt;[80]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;看什麼&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;延長付款條件是否繼續擴大、是否集中在財力較弱的客戶&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;改判方向&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;若差距擴大到 50 個百分點以上，則卡點風險再下修，成長有更大比例靠輝達墊資&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;毛利率&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;自動對照&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;目前值&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;第二季毛利率 75.0%（損益表計算 74.98%），第三季指引 74.0%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src81&quot;&gt;[81]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src26&quot;&gt;[26]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;看什麼&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;推論端客製晶片與 AMD 新品是否壓到價格&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;改判方向&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;若毛利率跌破 72%，則CUDA 屏障在推論端被削弱，優勢持續期間下修&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;存貨增速減營收增速&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;自動對照&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;目前值&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;2026-07-26 存貨年增比近四季營收年增快 27.7 個百分點；供應承諾 2,790 億美元。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src82&quot;&gt;[82]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src4&quot;&gt;[4]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;看什麼&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;原料與在製品能否隨 Rubin 出貨轉成營收&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;改判方向&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;若差距擴大到 40 個百分點以上，或出現大額存貨與採購義務提列，則供應承諾變成負擔，卡點風險與週期位置下修&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;新任執行長與客戶集中度&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;人工對照&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;目前值&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;代理執行長由財務長兼任；FY2026 前兩大直接客戶占營收 22% 與 14%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src37&quot;&gt;[37]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src11&quot;&gt;[11]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;看什麼&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;正式執行長人選、第三季財報的客戶集中度與第四季指引&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;改判方向&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;若第四季指引低於第三季實際營收，或前兩大客戶占比明顯下降，則說法可信度與模式穩固度下修&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;h3&gt;推論紀錄（下一季財報後自動對照）&lt;/h3&gt;&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;推論&lt;/th&gt;&lt;th&gt;方法&lt;/th&gt;&lt;th&gt;檢驗指標&lt;/th&gt;&lt;th&gt;條件&lt;/th&gt;&lt;th&gt;基準季&lt;/th&gt;&lt;th&gt;檢驗時點&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;P1&lt;/td&gt;&lt;td&gt;FY2027 第三季（至 2026-10-25）單季營收年增在 80% 以上（指引 1,080 億 ±2% 對去年同季 570.1 億，推算下緣約 85.7%）&lt;/td&gt;&lt;td&gt;訂單能見度&lt;/td&gt;&lt;td&gt;營收單季年增&lt;/td&gt;&lt;td&gt;&amp;gt;= 0.8&lt;/td&gt;&lt;td&gt;2026-07-26&lt;/td&gt;&lt;td&gt;FY2027 第三季 10-Q（約 2026 年 11 月底）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;P2&lt;/td&gt;&lt;td&gt;到 FY2027 第四季（至 2027-01-31）近四季營業利益率仍在 60% 以上（利潤率上行段延續，未隨換代或執行長更替下滑）&lt;/td&gt;&lt;td&gt;自身歷史&lt;/td&gt;&lt;td&gt;營業利益率_近四季&lt;/td&gt;&lt;td&gt;&amp;gt;= 0.6&lt;/td&gt;&lt;td&gt;2026-07-26&lt;/td&gt;&lt;td&gt;FY2027 10-K（約 2027 年 3 月）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;P3&lt;/td&gt;&lt;td&gt;存貨增速減營收增速到 FY2027 第四季不高於基準季的 27.7 個百分點（原料與在製品隨 Rubin 出貨轉成營收，差距不再擴大；比觀察清單的 40 點警戒線更嚴）&lt;/td&gt;&lt;td&gt;公司特有&lt;/td&gt;&lt;td&gt;存貨增速減營收增速&lt;/td&gt;&lt;td&gt;&amp;lt;= 0.277&lt;/td&gt;&lt;td&gt;2026-07-26&lt;/td&gt;&lt;td&gt;FY2027 10-K（約 2027 年 3 月）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;P4&lt;/td&gt;&lt;td&gt;美國電腦與電子產品產能利用率到 2027 年 3 月仍在 74% 以上（產業上行段延續）&lt;/td&gt;&lt;td&gt;產業週期&lt;/td&gt;&lt;td&gt;G17:CAPUTLG334S&lt;/td&gt;&lt;td&gt;&amp;gt;= 74&lt;/td&gt;&lt;td&gt;2026-07-26&lt;/td&gt;&lt;td&gt;G.17 2027 年 3 月資料（約 2027 年 4 月中）&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;lead&quot;&gt;每條推論從檢驗期末起，每個新季度記一筆命中或落空（預測帳本，公司資料夾 商業評估檢驗.json）；方法準確度跨公司統計見 優化/商業評估預測帳本.json。&lt;/p&gt;&lt;/section&gt;&lt;section id=&quot;sg&quot;&gt;&lt;h2&gt;商業評估等級明細&lt;span class=&quot;ruleok&quot;&gt;評分規則第一版，2026-11-07 使用者核定&lt;/span&gt;&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;五個面向各 1–5 分，相對同產業卡同業評比；機械建議分由工具依同業位置、卡住訊號與驗證比例算出，作者可調整但要寫理由。加權分 3.7 → B 級。等級門檻：A ≥ 4.2、B ≥ 3.5、C ≥ 2.8、D ≥ 2.1、其餘 E。&lt;/p&gt;&lt;div class=&quot;cards&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;模式穩固度&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;權重 &lt;span class=&quot;num&quot;&gt;25%&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;fs&quot;&gt;&lt;span&gt;作者分 &lt;span class=&quot;num v&quot;&gt;4&lt;/span&gt;&lt;/span&gt;&lt;span&gt;機械建議 &lt;span class=&quot;num&quot;&gt;5&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;近四季營業利益率同業百分位 1.0&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;理由&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;近四季營業利益率 65.2%，同業百分位 1.0，CUDA 生態有外部申報佐證的轉換成本。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src56&quot;&gt;[56]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src51&quot;&gt;[51]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;比機械建議 5 分低 1 分：FY2026 兩家直接客戶合占 36% 營收，前幾大客戶同時自研晶片；近 20 季營業利益率低點 15.7%，利潤率會隨循環大幅擺動。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src11&quot;&gt;[11]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src59&quot;&gt;[59]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src56&quot;&gt;[56]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;同業對照&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;近四季營業利益率：輝達 65.2%、博通 48.5%、高通 20.1%、AMD 17.7%、Marvell 16.8%（yfinance 口徑，截止日不同）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src3&quot;&gt;[3]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src83&quot;&gt;[83]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;成長動能&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;權重 &lt;span class=&quot;num&quot;&gt;25%&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;fs&quot;&gt;&lt;span&gt;作者分 &lt;span class=&quot;num v&quot;&gt;5&lt;/span&gt;&lt;/span&gt;&lt;span&gt;機械建議 &lt;span class=&quot;num&quot;&gt;5&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;最近一季營收年增同業百分位 1.0（yfinance 口徑）&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;理由&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;最新單季營收年增 105.9%、近四季 83.4%，單季年增已連續三季加速；第三季指引推算單季年增約 89%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src31&quot;&gt;[31]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src63&quot;&gt;[63]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src26&quot;&gt;[26]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;同業對照&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;最近一季營收年增：輝達 105.9%、博通 85.5%、AMD 44.7%、Marvell 36.5%、高通 −8.4%，輝達同業百分位 1.0。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src84&quot;&gt;[84]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;卡點風險&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;權重 &lt;span class=&quot;num&quot;&gt;20%&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;fs&quot;&gt;&lt;span&gt;作者分 &lt;span class=&quot;num v&quot;&gt;2&lt;/span&gt;&lt;/span&gt;&lt;span&gt;機械建議 &lt;span class=&quot;num&quot;&gt;3&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;計分採用的亮燈 2 條（G3、C1）；資料未取得 1 條&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;理由&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;機械訊號亮燈 2 條：收款變慢（應收比近四季營收快 43.4 個百分點）與存貨堆積（快 27.7 個百分點），兩條都採用計分；訂單出貨比未揭露。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src34&quot;&gt;[34]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src47&quot;&gt;[47]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;比機械建議 3 分低 1 分：機械訊號沒涵蓋的卡點同時出現——供應承諾一季內由 1,190 億增到 2,790 億美元、創辦人執行長辭任、對中國出口需許可。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src4&quot;&gt;[4]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src5&quot;&gt;[5]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src32&quot;&gt;[32]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;同業對照&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-待查&quot;&gt;待查&lt;/span&gt;待查：AMD、博通、Marvell、高通尚未做商業評估，卡住訊號無法逐條對照。&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;客戶 BluSky AI 把輝達與 AMD 並列為少數 GPU 供應來源，AMD 是客戶可轉單的對象。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src53&quot;&gt;[53]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;週期位置&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;權重 &lt;span class=&quot;num&quot;&gt;15%&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;fs&quot;&gt;&lt;span&gt;作者分 &lt;span class=&quot;num v&quot;&gt;3&lt;/span&gt;&lt;/span&gt;&lt;span&gt;機械建議 &lt;span class=&quot;num&quot;&gt;4&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;營收近四季年增目前上行，距最近轉折 3 季；歷史下行段中位 6 季&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;理由&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;營收近四季年增自 2025-10-26 谷底上行 3 季，歷史上行段中位 4 季、最長 7 季。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src69&quot;&gt;[69]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src70&quot;&gt;[70]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;比機械建議 4 分低 1 分：上行段已接近歷史中位長度，第三季指引顯示單季年增將由 105.9% 回落，供應承諾在高點大幅擴大，位置偏向上行段後半。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src70&quot;&gt;[70]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src26&quot;&gt;[26]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src4&quot;&gt;[4]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;同業對照&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;同業最近一季營收年增分化：AI 相關的博通 85.5%、AMD 44.7% 在上行，手機為主的高通 −8.4%；輝達與博通同處 AI 上行段。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src84&quot;&gt;[84]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-待查&quot;&gt;待查&lt;/span&gt;待查：同業的之字形週期位置要等同業做商業評估底稿才能比較。&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;說法可信度&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;權重 &lt;span class=&quot;num&quot;&gt;15%&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;fs&quot;&gt;&lt;span&gt;作者分 &lt;span class=&quot;num v&quot;&gt;4&lt;/span&gt;&lt;/span&gt;&lt;span&gt;機械建議 &lt;span class=&quot;num&quot;&gt;4&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;已判定 5 條，驗證比例 0.7&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;理由&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;近三季營收都高於指引上緣，毛利率說法與損益表一致；供應承諾、應收延長付款與分類改口徑只部分支持，執行長交接說法待查。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src23&quot;&gt;[23]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src28&quot;&gt;[28]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src4&quot;&gt;[4]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src24&quot;&gt;[24]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;同業對照&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-待查&quot;&gt;待查&lt;/span&gt;待查：AMD、博通、Marvell、高通的指引達成紀錄尚未整理，無法並列。&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;相對同業：成長與利潤率&lt;/figcaption&gt;&lt;svg viewBox=&quot;0 0 680 300&quot; role=&quot;img&quot; aria-label=&quot;同業位置：營收年增與營業利益率&quot;&gt;&lt;line x1=&quot;56.0&quot; x2=&quot;56.0&quot; y1=&quot;16&quot; y2=&quot;260&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;56.0&quot; y=&quot;276&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;-20%&lt;/text&gt;&lt;line x1=&quot;140.9&quot; x2=&quot;140.9&quot; y1=&quot;16&quot; y2=&quot;260&quot; class=&quot;zl&quot;/&gt;&lt;text x=&quot;140.9&quot; y=&quot;276&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;0%&lt;/text&gt;&lt;line x1=&quot;225.7&quot; x2=&quot;225.7&quot; y1=&quot;16&quot; y2=&quot;260&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;225.7&quot; y=&quot;276&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;20%&lt;/text&gt;&lt;line x1=&quot;310.6&quot; x2=&quot;310.6&quot; y1=&quot;16&quot; y2=&quot;260&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;310.6&quot; y=&quot;276&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;40%&lt;/text&gt;&lt;line x1=&quot;395.4&quot; x2=&quot;395.4&quot; y1=&quot;16&quot; y2=&quot;260&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;395.4&quot; y=&quot;276&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;60%&lt;/text&gt;&lt;line x1=&quot;480.3&quot; x2=&quot;480.3&quot; y1=&quot;16&quot; y2=&quot;260&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;480.3&quot; y=&quot;276&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;80%&lt;/text&gt;&lt;line x1=&quot;565.1&quot; x2=&quot;565.1&quot; y1=&quot;16&quot; y2=&quot;260&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;565.1&quot; y=&quot;276&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;100%&lt;/text&gt;&lt;line x1=&quot;650.0&quot; x2=&quot;650.0&qu
