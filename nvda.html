ot;179&quot; y=&quot;63&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;Teter（預設計畫賣出）&lt;/text&gt;&lt;rect x=&quot;189.0&quot; y=&quot;49&quot; width=&quot;2.3&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;199.3&quot; y=&quot;63&quot; class=&quot;val&quot;&gt;13&lt;/text&gt;&lt;text x=&quot;179&quot; y=&quot;103&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;Kress（預設計畫賣出）&lt;/text&gt;&lt;rect x=&quot;189.0&quot; y=&quot;89&quot; width=&quot;2.0&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;198.3&quot; y=&quot;103&quot; class=&quot;val&quot;&gt;7.6&lt;/text&gt;&lt;text x=&quot;179&quot; y=&quot;143&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;Neal（非計畫賣出）&lt;/text&gt;&lt;rect x=&quot;189.0&quot; y=&quot;129&quot; width=&quot;2.0&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--neg)&quot;/&gt;&lt;text x=&quot;197.6&quot; y=&quot;143&quot; class=&quot;val&quot;&gt;3.3&lt;/text&gt;&lt;text x=&quot;179&quot; y=&quot;183&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;Dabiri（預設計畫賣出）&lt;/text&gt;&lt;rect x=&quot;189.0&quot; y=&quot;169&quot; width=&quot;2.0&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;197.0&quot; y=&quot;183&quot; class=&quot;val&quot;&gt;0.1&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;生意品質：A（規則：無「弱」且至少三項「強」＝A）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;評等&lt;/th&gt;&lt;th&gt;理由&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;護城河&lt;/td&gt;&lt;td&gt;寬&lt;/td&gt;&lt;td&gt;雙鑰匙兩把都過（超額報酬期間檢查.json#/雙鑰匙）：不含商譽本業 ROIC 近五年皆高於 WACC 11.5%；CUDA 轉換成本有非管理層 SEC 申報佐證（GSI Technology、SharonAI 10-K，NVDA-C01）。近四季毛利率 74.7%、營業利益率 65.2%（財務指標.json）；限制：客製推論晶片追近（CNBC 2026-08-26，NVDA-C01、NVDA-C10）。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;投入資本報酬與增量回報&lt;/td&gt;&lt;td&gt;強&lt;/td&gt;&lt;td&gt;近四季 ROIC 242.7%、2024-01-28～2026-01-25 增量 ROIC 185.8%（財務指標.json，營運投入資本口徑；NVDA-C14）；屬景氣高峰數字，FY2023 含商譽口徑 18.5%（超額報酬期間檢查.json）。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;自由現金流品質&lt;/td&gt;&lt;td&gt;中&lt;/td&gt;&lt;td&gt;近四季自由現金流 127,006 為淨利 192,879 的 66%：應收年增高於營收 43 個百分點、存貨天數約 150 天（成長推估底稿.json、財務指標.json），淨利另含權益證券未實現利益（10-Q 2026-07-26 Item 2 ¶76）；NVDA-C08。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;資產負債表&lt;/td&gt;&lt;td&gt;強&lt;/td&gt;&lt;td&gt;有息負債÷EBITDA 0.17 倍、現金與證券÷一年內到期債務約 56.6 倍（只取得一年內到期長債、可能高估；融資償債底稿.json；NVDA-C13）；推導信用等級 AAA（信用與存活.json）；表外 SB Energy 保證上限 1,050 億與供應承諾 2,790 億（10-Q Note 10 ¶209–¶211、Item 2 ¶16；2026-10-25 保證合計 1,180 億、供應承諾 3,900 億，8-K 2026-11-17 本文 §44、§54；NVDA-C11）未計入倍數。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;治理與資本配置&lt;/td&gt;&lt;td&gt;中&lt;/td&gt;&lt;td&gt;近四季回購 55,315、股利 6,776，稀釋股數略降（NVDA-C15）；但對客戶的保證與策略投資擴大（NVDA-C11），且創辦人執行長 2026-11-11 在醜聞中辭任、財務長暫代、另設首位董事會主席（8-K 2026-11-12 §2–§3；NVDA-C12），維持中、列下修條件（調查揭露公司層級違規）。&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;PEG 三口徑、林區資產負債表檢查與 F 分數等交叉檢查（算法與完整表見&lt;a href=&quot;#wp-value&quot;&gt;計算底稿 價值判斷&lt;/a&gt;）。&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;capital&quot;&gt;&lt;div class=&quot;qno&quot;&gt;問題 06&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;管理層怎麼用錢、怎麼管資產？&lt;/div&gt;&lt;h2&gt;錢多用在回購與綁住客戶，治理因執行長辭任降溫。&lt;/h2&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;資金去向：近四季自由現金流 1,270 億美元，回購 553 億、股利 68 億、員工代扣稅 91 億、併購 12 億（財務指標）。&lt;/strong&gt;另於 2026-06 發行約 250 億美元票據，公司寫一般公司用途、未細分（融資償債判讀）。借錢與回購同時發生只能當線索，不能說借錢回購。&lt;/p&gt;&lt;p&gt;反方是表外承諾擴大：對 SB Energy 租約保證上限 1,050 億、雲端服務承諾 290 億、股權投資承諾 250 億&lt;span class=&quot;src&quot;&gt;（10-Q 2026-07-26 Note 10）&lt;/span&gt;；2026-10-25 保證最大曝險合計 1,180 億（含新增電力與系統信用支持 95 億）、尚未起租的資料中心租約 740 億、新雲端業者協議 320 億&lt;span class=&quot;src&quot;&gt;（8-K 2026-11-17 本文 §47、§51、§54）&lt;/span&gt;，把客戶 AI 建置的風險部分搬到輝達身上（NVDA-C11）。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;近四季營運現金流的去向（億美元）：第一列為營運現金流，往下逐項扣除，最後一列為剩餘或缺口&lt;/p&gt;&lt;svg viewBox=&quot;0 0 500 298&quot; role=&quot;img&quot; aria-label=&quot;資金去向&quot; class=&quot;chart&quot; style=&quot;max-width:650px&quot;&gt;&lt;line x1=&quot;150.0&quot; x2=&quot;150.0&quot; y1=&quot;6&quot; y2=&quot;294&quot; class=&quot;zero&quot;/&gt;&lt;text x=&quot;140&quot; y=&quot;37.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;近四季營運現金流&lt;/text&gt;&lt;rect x=&quot;150.0&quot; y=&quot;22.0&quot; width=&quot;275.0&quot; height=&quot;20&quot; rx=&quot;4&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;近四季營運現金流：1,344&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;433.0&quot; y=&quot;37.0&quot; class=&quot;val&quot;&gt;1,344&lt;/text&gt;&lt;line x1=&quot;425.0&quot; x2=&quot;425.0&quot; y1=&quot;42.0&quot; y2=&quot;62.0&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;1&quot; stroke-dasharray=&quot;2 3&quot;/&gt;&lt;text x=&quot;140&quot; y=&quot;77.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;回購&lt;/text&gt;&lt;rect x=&quot;311.8&quot; y=&quot;62.0&quot; width=&quot;113.2&quot; height=&quot;20&quot; rx=&quot;4&quot; fill=&quot;var(--c2)&quot;&gt;&lt;title&gt;回購：−553&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;433.0&quot; y=&quot;77.0&quot; class=&quot;val&quot;&gt;−553&lt;/text&gt;&lt;line x1=&quot;311.8&quot; x2=&quot;311.8&quot; y1=&quot;82.0&quot; y2=&quot;102.0&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;1&quot; stroke-dasharray=&quot;2 3&quot;/&gt;&lt;text x=&quot;140&quot; y=&quot;117.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;股利&lt;/text&gt;&lt;rect x=&quot;297.9&quot; y=&quot;102.0&quot; width=&quot;13.9&quot; height=&quot;20&quot; rx=&quot;4&quot; fill=&quot;var(--c2)&quot;&gt;&lt;title&gt;股利：−67.8&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;319.8&quot; y=&quot;117.0&quot; class=&quot;val&quot;&gt;−67.8&lt;/text&gt;&lt;line x t;&lt;td&gt;+1.5%&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2022&lt;/td&gt;&lt;td&gt;266&lt;/td&gt;&lt;td&gt;44.8%&lt;/td&gt;&lt;td&gt;10.50&lt;/td&gt;&lt;td&gt;4.0&lt;/td&gt;&lt;td&gt;0.0&lt;/td&gt;&lt;td&gt;5%&lt;/td&gt;&lt;td&gt;+1.0%&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2023&lt;/td&gt;&lt;td&gt;221&lt;/td&gt;&lt;td&gt;17.9%&lt;/td&gt;&lt;td&gt;0.88&lt;/td&gt;&lt;td&gt;4.0&lt;/td&gt;&lt;td&gt;100&lt;/td&gt;&lt;td&gt;274%&lt;/td&gt;&lt;td&gt;+889.0%&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2024&lt;/td&gt;&lt;td&gt;430&lt;/td&gt;&lt;td&gt;91.5%&lt;/td&gt;&lt;td&gt;1.72&lt;/td&gt;&lt;td&gt;4.0&lt;/td&gt;&lt;td&gt;95.3&lt;/td&gt;&lt;td&gt;37%&lt;/td&gt;&lt;td&gt;-0.5%&lt;/td&gt;&lt;td&gt;ROE 偏高，單年數字請對照投入資本報酬率&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2025&lt;/td&gt;&lt;td&gt;793&lt;/td&gt;&lt;td&gt;119.2%&lt;/td&gt;&lt;td&gt;3.20&lt;/td&gt;&lt;td&gt;8.3&lt;/td&gt;&lt;td&gt;337&lt;/td&gt;&lt;td&gt;57%&lt;/td&gt;&lt;td&gt;-0.5%&lt;/td&gt;&lt;td&gt;權益被回購壓低，ROE 偏高失真，請看投入資本報酬率&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2026&lt;/td&gt;&lt;td&gt;1,573&lt;/td&gt;&lt;td&gt;101.5%&lt;/td&gt;&lt;td&gt;6.42&lt;/td&gt;&lt;td&gt;9.7&lt;/td&gt;&lt;td&gt;401&lt;/td&gt;&lt;td&gt;42%&lt;/td&gt;&lt;td&gt;-1.2%&lt;/td&gt;&lt;td&gt;權益被回購壓低，ROE 偏高失真，請看投入資本報酬率&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;長期財務.json（股東權益、稀釋股數〔分割調整〕、總資產；每股帳面＝股東權益 ÷ 稀釋股數，推導；股利支付、回購、營運現金流、資本支出在財務歷史.json 沒有該年時用）；產業指標.json 逐年（ROE）；財務歷史.json annual（股利、回購、營運現金流、資本支出）。用到：財務歷史、長期財務。ROE 註記門檻：ROE 高於 60% 或股東權益 ÷ 總資產低於 10%；近三年回購合計達當年股東權益 50% 以上才歸因於回購。（股利＋回購）÷ 年底市值：專案沒有逐年年底市值資料，不列該欄。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;capital-plain&quot;&gt;&lt;h3&gt;融資與償債：還不還得起&lt;/h3&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;b&gt;信用評級&lt;/b&gt;　機構 未揭露（10-K、10-Q、8-K、SEC 全文搜尋 查無 S&amp;amp;P、Moody&amp;#x27;s、Fitch、KBRA 評級）／推導 AAA（Damodaran 合成評等，利息保障 425.8 倍，近四季新借款多、利息偏低、評級可能偏高，推導）｜依推導：投資等級（BBB-／Baa3 以上）&lt;/p&gt;&lt;p&gt;&lt;b&gt;存活檢查（12～24 個月，推導，非違約預測）&lt;/b&gt;　無明顯警訊（推導，非違約預測）：現金與證券 566 億美元，一年內到期債務 10 億美元（另利息 464.0 百萬美元），可付 38.7 倍；兩年內到期債務未取得；利息保障 425.8 倍（新借款多、利息偏低，倍數可能偏高）；會計師未提出繼續經營疑慮。&lt;/p&gt;&lt;p&gt;&lt;b&gt;利率壓力測試&lt;/b&gt;　+200bp 後利息保障 425.8 倍（不含再融資）（目前 425.8 倍，推導）&lt;/p&gt;&lt;p&gt;&lt;b&gt;借款用途&lt;/b&gt;　再融資無關；2026-06 發行 250 億美元優先無擔保票據，公司寫明用於一般公司用途，用途未細分（回購、投資或承諾皆有可能，只算線索）&lt;/p&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;償債指標、融資活動表、存活檢查明細與利率壓力測試（算法與完整表見&lt;a href=&quot;#wp-6&quot;&gt;計算底稿 6&lt;/a&gt;）。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;財務管理&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;財務管理保守，償債能力強：有息負債 33,366 百萬美元，一年內到期只有 10 億美元，商業本票額度 250 億期末無餘額（融資償債判讀）。&lt;/strong&gt;近四季借還款淨額 淨借入 24,896 百萬美元&lt;span class=&quot;src&quot;&gt;（作者校正：原文 10-Q 2026-07-26；Part I, Item 1 ¶38；Part I, Item 2 ¶105；10-K 2026-01-25 Item 15 ¶51）&lt;/span&gt;，主要是 2026-06 的新票據。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;資產變化&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;應收帳款年增 127%、存貨年增 111%，都快於營收 83%（財務指標）。&lt;/strong&gt;存貨增加可由供應承諾與新平台量產部分解釋；應收方面，公司在 10-Q 說是對部分投資等級客戶的大型多季合約延長付款期限&lt;span class=&quot;src&quot;&gt;（10-Q 2026-07-26 Part I, Item 2 ¶88）&lt;/span&gt;，列為已解釋，但會延後現金回收，持續追蹤。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;公司內部治理&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;治理維持中、列下修條件：創辦人執行長 2026-11-11 辭任，財務長兼任暫代執行長，另設首位董事會主席並啟動搜尋&lt;span class=&quot;src&quot;&gt;（8-K 2026-11-12 §2–§3）&lt;/span&gt;。&lt;/strong&gt;間諜指控未證實（新聞 N5）；若調查揭露公司層級違規，治理降為弱（NVDA-C12）。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;業務治理&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;我們的判讀：用保證與策略投資幫客戶取得算力，短期擴大需求，長期增加循環融資風險（新聞 N4）。&lt;/strong&gt;Hugging Face 收購約 119 億美元加 10 億留任股票，屬生態延伸，金額占自由現金流約一成&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;資產變化訊號（對去年同期季末）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;signals&quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;變化&lt;/th&gt;&lt;th&gt;同期營收&lt;/th&gt;&lt;th&gt;判讀&lt;/th&gt;&lt;th&gt;說明&lt;/th&gt;&lt;th&gt;出處&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;應收帳款&lt;/td&gt;&lt;td&gt;+126.8%&lt;/td&gt;&lt;td&gt;+83.4%&lt;/td&gt;&lt;td class=&quot;st-已解釋&quot;&gt;已解釋&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;公司說是對部分投資等級客戶的大型多季合約延長付款期限；五家直接客戶占應收七成&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;10-Q 2026-07-26 Part I, Item 2 ¶88；Item 1 ¶124&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;存貨&lt;/td&gt;&lt;td&gt;+111.0%&lt;/td&gt;&lt;td&gt;+83.4%&lt;/td&gt;&lt;td class=&quot;st-部分解釋&quot;&gt;部分解釋&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;供應與產能承諾由 1,190 億增至 2,790 億（2026-07-26；2026-10-25 再增至 3,900 億，8-K 2026-11-17 本文 §44）、Vera Rubin 量產&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;10-Q 2026-07-26 Item 2 ¶16&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;應付帳款&lt;/td&gt;&lt;td&gt;+66.1%&lt;/td&gt;&lt;td&gt;+83.4%&lt;/td&gt;&lt;td class=&quot;st-已解釋&quot;&gt;已解釋&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;增速低於營收，未見拉長付款&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;財務指標.json 資產變化訊號&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;不動產廠房設備&lt;/td&gt;&lt;td&gt;+56.3%&lt;/td&gt;&lt;td&gt;+83.4%&lt;/td&gt;&lt;td class=&quot;st-已解釋&quot;&gt;已解釋&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;增速低於營收，近四季資本支出 74 億&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;財務指標.json 近四季資金&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;白話說&lt;/b&gt;近四季每 100 元自由現金流，約 44 元回購、5 元發股利、7 元幫員工代扣稅。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;要留意&lt;/b&gt;回購有一部分在抵銷員工股票，見第四題。&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;events&quot;&gt;&lt;div class=&quot;qno&quot;&gt;問題 07&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;近半年發生了什麼重大事件？&lt;/div&gt;&lt;h2&gt;執行長辭任、Q3 財報與國會聽證是近半年最大事件。&lt;/h2&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;近半年最大事件是創辦人執行長辭任：8-K 2026-11-12 公告黃仁勳 11-11 辭任，收盤價 155.46 美元 已在公告後交易。&lt;/strong&gt;我們以事件折價 5% 另列（扣除事件折價後每股中點 114.53、區間 103.14–128.84，見第五題計算底稿），不改基本假設。Q3 財報 11-17 收盤後公布、高於指引，收盤價未反映，估值已併入。&lt;/p&gt;&lt;p&gt;接下來的檢驗點：12-01 眾院三委員會傳喚黃仁勳（新聞 N11）、參院聽證 12-03 與 12-10（N8）、Q3 10-Q 申報、執行長遴選與 Q4 財報。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;其他事件多是在擴大生態：發債 250 億、對 SB Energy 保證、收購 Hugging Face。&lt;/strong&gt;限制：下表只列存檔的 8-K 與新聞，不代表所有事件。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;近半年 8-K 重大事件&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;依申報日排序；對論點的影響為作者判斷。&lt;/p&gt;&lt;p&gt;表外人事 8-K（5.02）：01-23 董事 Persis Drell 辭任；04-27 Scott Gawel 接任會計長；05-08 新董事 Suzanne Nora Johnson；07-02 Nicholas Parker 接替退休的 Ajay Puri 管全球業務；03-06 為主管薪酬計畫&lt;span class=&quot;src&quot;&gt;（各 8-K §2–§3）&lt;/span&gt;。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;figure&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt signals&quot;&gt;&lt;tr&gt;&lt;th&gt;日期&lt;/th&gt;&lt;th&gt;事件&lt;/th&gt;&lt;th&gt;對論點的影響&lt;/th&gt;&lt;th&gt;出處&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2026-11-17&lt;/td&gt;&lt;td&gt;Q3 營收 1,158 億、年增 103%；Q4 指引 1,300 億 ±3%、毛利率 71%–72%&lt;/td&gt;&lt;td&gt;收盤後公布；支持近期成長，已併入第 1 年 +60%&lt;/td&gt;&lt;td&gt;8-K 2026-11-17 新聞稿 §3–§4&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2026-11-12&lt;/td&gt;&lt;td&gt;黃仁勳辭任；財務長 Colette Kress（輝達財務長，暫代執行長）暫代執行長，Harvey C. Jones（輝達首位董事會主席）任董事會主席&lt;/td&gt;&lt;td&gt;治理與關鍵人物風險升高；不改估值&lt;/td&gt;&lt;td&gt;8-K 2026-11-12 本文 §2–§3&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2026-09-03&lt;/td&gt;&lt;td&gt;簽約收購 Hugging Face，約 119 億美元，另 10 億留任股票&lt;/td&gt;&lt;td&gt;生態延伸，預計 2027 上半年完成&lt;/td&gt;&lt;td&gt;8-K 2026-09-03 本文 §1–§2&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2026-08-26&lt;/td&gt;&lt;td&gt;Q2 營收 962 億、年增 106%；Q3 指引 1,080 億&lt;/td&gt;&lt;td&gt;支持近期成長&lt;/td&gt;&lt;td&gt;8-K 2026-08-26 本文 §34、新聞稿 §4&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2026-08-17&lt;/td&gt;&lt;td&gt;對 SB Energy 俄亥俄約 4.25 GW 租約提供殘值保證&lt;/td&gt;&lt;td&gt;表外風險擴大&lt;/td&gt;&lt;td&gt;8-K 2026-08-17 本文 §3&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2026-06-18&lt;/td&gt;&lt;td&gt;發行多檔優先無擔保票據約 250 億&lt;/td&gt;&lt;td&gt;負債上升，仍很低&lt;/td&gt;&lt;td&gt;10-Q 2026-07-26 Part I, Item 2 ¶105&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;接下來的檢驗點（收盤日後）&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;只列存檔新聞與申報已排定或公司已說明的事件；日期未公告的寫未公告。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;figure&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt signals&quot;&gt;&lt;tr&gt;&lt;th&gt;日期&lt;/th&gt;&lt;th&gt;事件&lt;/th&gt;&lt;th&gt;會看什麼&lt;/th&gt;&lt;th&gt;出處&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2026-12-01&lt;/td&gt;&lt;td&gt;眾院三委員會傳喚黃仁勳&lt;/td&gt;&lt;td&gt;出口管制與治理是否擴大成公司層級責任&lt;/td&gt;&lt;td&gt;新聞 N11&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2026-12-03、12-10&lt;/td&gt;&lt;td&gt;參院兩場聽證&lt;/td&gt;&lt;td&gt;政策風險與商務部長說法&lt;/td&gt;&lt;td&gt;新聞 N8&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;未公告&lt;/td&gt;&lt;td&gt;Q3 10-Q 申報&lt;/td&gt;&lt;td&gt;資產負債表、股數、客戶集中度更新&lt;/td&gt;&lt;td&gt;8-K 2026-11-17 新聞稿&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;未公告&lt;/td&gt;&lt;td&gt;執行長遴選結果&lt;/td&gt;&lt;td&gt;關鍵人物風險是否解除&lt;/td&gt;&lt;td&gt;8-K 2026-11-12 本文 §3&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;未公告（上年 Q4 於 2026-02-25 公布）&lt;/td&gt;&lt;td&gt;FY2027 Q4 財報&lt;/td&gt;&lt;td&gt;營收是否高於指引下緣約 1,261 億&lt;/td&gt;&lt;td&gt;8-K 2026-11-17 新聞稿 §4&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;白話說&lt;/b&gt;就像主廚突然離職的名店，菜單不變，但客人要等幾季才知道味道變不變。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;要留意&lt;/b&gt;Q3 財報在收盤後公布，收盤價未反映；國會傳喚與聽證都在收盤日後。&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;news&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;近期新聞查證&lt;/p&gt;&lt;h3&gt;新聞指向同一件事：成長還在，風險在人、政策與客戶。&lt;/h3&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;我們從 CNBC（美國財經電視台）、Fortune（美國財經雜誌）、TechCrunch（美國科技新聞網站）與 TrendForce（台灣市場研究機構）選十則與論點相關的新聞，引句都對過原文；Reuters、Forbes 有付費牆不引用，11-18 起的新聞在收盤日後不引用。&lt;/strong&gt;分析師說法與匿名消息只當待驗證訊號，下表放比重最高的五則。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;新聞摘要（依日期排序）&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;日期&lt;/th&gt;&lt;th&gt;媒體&lt;/th&gt;&lt;th&gt;新聞&lt;/th&gt;&lt;th&gt;我們的判讀&lt;/th&gt;&lt;th&gt;對應主張&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2026-08-26&lt;/td&gt;&lt;td&gt;CNBC&lt;/td&gt;&lt;td&gt;OpenAI 自研推論晶片進展，威脅輝達推論毛利&lt;/td&gt;&lt;td&gt;分析師說法；訓練端仍領先，推論端壓力是真的&lt;/td&gt;&lt;td&gt;NVDA-C01&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2026-11-12&lt;/td&gt;&lt;td&gt;Fortune&lt;/td&gt;&lt;td&gt;執行長辭任後，輝達對新興 AI 雲端業者的保證被重新定價&lt;/td&gt;&lt;td&gt;分析師說法；報導的支撐上限公司申報未見，不進估值&lt;/td&gt;&lt;td&gt;NVDA-C11&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2026-11-13&lt;/td&gt;&lt;td&gt;CNBC&lt;/td&gt;&lt;td&gt;醜聞延燒到商務部長，參院排定 12-03、12-10 兩場聽證&lt;/td&gt;&lt;td&gt;聽證日期為事實；政策風險升高，結果待觀察&lt;/td&gt;&lt;td&gt;NVDA-C12&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2026-11-17&lt;/td&gt;&lt;td&gt;CNBC&lt;/td&gt;&lt;td&gt;財報公布前收盤小跌、連四日下跌；黃仁勳表態願意回任&lt;/td&gt;&lt;td&gt;收盤價在財報前為事實；董事會不考慮回任是知情人士說法，未證實&lt;/td&gt;&lt;td&gt;NVDA-C12&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2026-11-17&lt;/td&gt;&lt;td&gt;TechCrunch&lt;/td&gt;&lt;td&gt;代理執行長 Kress 表示停止在中國銷售 H200；美方 11-16 遠端存取新規&lt;/td&gt;&lt;td&gt;公司稱營收不受影響；Jefferies &lt;section class=&quot;q&quot; id=&quot;workpaper&quot; data-layer=&quot;計算底稿&quot;&gt;&lt;div class=&quot;qno&quot;&gt;計算底稿&lt;/div&gt;&lt;h2&gt;計算底稿：正文結果的算法與完整表（預設摺疊）&lt;/h2&gt;&lt;p class=&quot;wpnote&quot;&gt;正文每個估值、償債結果都從這裡算出；背景計算照做、送審照核。不讀也不影響理解結論；非買賣建議。&lt;/p&gt;&lt;details id=&quot;wp-3-4&quot;&gt;&lt;summary&gt;3・4 現金與股東：報表對帳與股東回報判讀&lt;/summary&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;現金流報表對帳&lt;/h3&gt;&lt;p&gt;報表對帳（10-Q 2026-07-26，現金、約當現金及受限現金）：期初 106＋營運 744＋投資 -351＋融資 -275＋其他 0.0＝期末 224 億美元｜完整&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;股東回報判讀表&lt;/h3&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;股東回報（判讀依估值政策門檻，2026-10-14 核定；不影響估值與價格位置）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;數值&lt;/th&gt;&lt;th&gt;判讀&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股利殖利率&lt;/td&gt;&lt;td&gt;0.18%&lt;/td&gt;&lt;td&gt;不評好壞：依估值政策，股利殖利率高低不設門檻（高殖利率常因股價下跌）；占股東收益率 11%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;回購殖利率&lt;/td&gt;&lt;td&gt;1.47%&lt;/td&gt;&lt;td&gt;不評好壞：近四季回購約 553.1 億美元，是市值 37,753.5 億美元的 1.47%；划不划算看「股東收益率」「淨回購」「回購均價」&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股東收益率（股利＋回購）&lt;/td&gt;&lt;td&gt;1.64%（公債的 32%）&lt;/td&gt;&lt;td&gt;不評好壞：主要靠成長，1.64% 只有 10 年期公債 5.12% 的 32%；回饋低是成長型公司的常態，改看成長&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;淨回購殖利率&lt;/td&gt;&lt;td&gt;1.27%&lt;/td&gt;&lt;td&gt;好：回購 1.47% 裡約 0.2 個百分點用來抵銷發給員工的股票，扣掉後仍淨回購 1.27%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股數年變化（1／3／10 財年）&lt;/td&gt;&lt;td&gt;-1.2%／-0.7%／+0.7%&lt;/td&gt;&lt;td&gt;中性：2026 財年對上一財年 -1.2%（減少）；近 3 財年平均每年 -0.7%（減少）；近 10 財年平均每年 +0.7%；分割調整後稀釋股數（推導）：長期財務.json 稀釋股數 2015–2018 標籤年（FY2016–FY2019）未換算 2021 年 4 比 1 分割、2019–2021 標籤年（FY2020–FY2022）未換算 2024 年 10 比 1 分割；前者 ×40、後者 ×10，2022 起已是分割後口徑。調整後 FY2016→FY2026 約 227.6 億→245.1 億股，十年大致持平&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;近十年有回購的年數&lt;/td&gt;&lt;td&gt;7／10&lt;/td&gt;&lt;td&gt;中性：只有 7 年有回購，未達政策「穩定」要求的 8 年&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股利連續成長年數&lt;/td&gt;&lt;td&gt;2&lt;/td&gt;&lt;td&gt;中性：連續 2 年調高，未達政策「近十年年年調高」&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股東回饋占自由現金流&lt;/td&gt;&lt;td&gt;48.89%&lt;/td&gt;&lt;td&gt;好：回饋只用掉近四季自由現金流的 49%，低於政策 80% 注意線，還留約 51%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;近四季公開市場回購均價（最近 4 份定期報告）&lt;/td&gt;&lt;td&gt;190.89&lt;/td&gt;&lt;td&gt;警示：均價 190.89 比合理價值上緣 135.63 高 41%，買得偏貴；依本報告估值，這段期間不是在低於內在價值時回購；依政策「治理與資本配置」最高只能評「中」；本次該項評「中」，評等不受影響&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;details id=&quot;wp-mkt&quot;&gt;&lt;summary&gt;市場背景：大盤一句、流動性、空單與參考值的資料日期與存檔&lt;/summary&gt;&lt;p class=&quot;cap&quot;&gt;大盤狀態（市場總覽；只揭露，不進研究評等、價格位置與合理價值）：S&amp;amp;P 500（以 SPY 代表）前十大持股合計 37.3%，最大產業科技 38.2%；那斯達克 100（QQQ）科技占 58.0%；等權重 RSP 減市值加權 SPY 近3個月報酬差 1.7 個百分點，位在 2003 年以來第 79 分位（持平）。高收益債利差 3.30，位在 2023 年以來第 81 分位（偏高）；金融狀況指數 -0.46，位在 1971 年以來第 44 分位（中性）；VIX 18.70，位在 1990 年以來第 56 分位（中性）；融資推估（聯準會，推估）0.74 兆美元（2026-06-30），年增 46.6%（第 92 分位，偏高），占國內公司股權市值 0.68%（第 8 分位，偏低）。（市場總覽收盤日 2026-11-12，市場/市場總覽.json）。&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;流動性、空單與參考值（只列事實與資料日期，不判冷熱、不是買賣訊號；非買賣建議）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;類別&lt;/th&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;數值&lt;/th&gt;&lt;th&gt;資料日期&lt;/th&gt;&lt;th&gt;說明與存檔&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;流動性&lt;/td&gt;&lt;td&gt;20 日均成交量&lt;/td&gt;&lt;td&gt;236,552,250 股&lt;/td&gt;&lt;td&gt;2026-11-17 收盤&lt;/td&gt;&lt;td&gt;90 日均量 144,561,748 股（20 日 ÷ 90 日 1.64 倍）｜市場資料/市場溫度.json#/量能&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;流動性&lt;/td&gt;&lt;td&gt;20 日均成交金額&lt;/td&gt;&lt;td&gt;423.1 億美元&lt;/td&gt;&lt;td&gt;2026-11-17 收盤&lt;/td&gt;&lt;td&gt;市場資料/市場溫度.json#/流動性/20日均成交金額&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;流動性&lt;/td&gt;&lt;td&gt;20 日均周轉率（每日）&lt;/td&gt;&lt;td&gt;0.98%&lt;/td&gt;&lt;td&gt;2026-11-17 收盤&lt;/td&gt;&lt;td&gt;20 日均量 ÷ SEC 封面流通股數（當時可得，依分割換算）；自身近 5 年第 35% 百分位｜市場資料/市場溫度.json#/流動性/20日均換手率&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;空單&lt;/td&gt;&lt;td&gt;放空比率（空單占流通股）&lt;/td&gt;&lt;td&gt;1.16%&lt;/td&gt;&lt;td&gt;2026-10-30 結算&lt;/td&gt;&lt;td&gt;空單 279,579,505 股；前一期（2026-10-15）301,622,687 股，減少 7.3%；FINRA 每月兩次公布的合併空單，取得 2026-11-18｜市場資料/市場溫度.json#/流動性/空單&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;空單&lt;/td&gt;&lt;td&gt;回補天數&lt;/td&gt;&lt;td&gt;2.80 天&lt;/td&gt;&lt;td&gt;2026-10-30 結算&lt;/td&gt;&lt;td&gt;空單 ÷ 日均量（FINRA 自身日均量）；自算 ÷ 90 日均量 1.93 天｜市場資料/市場溫度.json#/流動性/空單&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;參考值&lt;/td&gt;&lt;td&gt;52 週區間位置&lt;/td&gt;&lt;td&gt;0%&lt;/td&gt;&lt;td&gt;2026-11-17 收盤&lt;/td&gt;&lt;td&gt;0%＝52 週低 155.46、100%＝52 週高 239.24（收盤，推算）｜市場資料/市場溫度.json#/趨勢&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;參考值&lt;/td&gt;&lt;td&gt;近 12 個月股價報酬&lt;/td&gt;&lt;td&gt;-18.1%&lt;/td&gt;&lt;td&gt;2026-11-17 收盤&lt;/td&gt;&lt;td&gt;同期 S&amp;amp;P 500 +10.2%｜市場資料/市場溫度.json#/動能&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;參考值&lt;/td&gt;&lt;td&gt;60 日歷史年化波動&lt;/td&gt;&lt;td&gt;43.8%&lt;/td&gt;&lt;td&gt;2026-11-17 收盤&lt;/td&gt;&lt;td&gt;日報酬標準差年化（收盤）｜市場資料/市場溫度.json#/波動&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;參考值&lt;/td&gt;&lt;td&gt;距 200 日均線&lt;/td&gt;&lt;td&gt;-23.6%&lt;/td&gt;&lt;td&gt;2026-11-17 收盤&lt;/td&gt;&lt;td&gt;200 日均線 203.60｜市場資料/市場溫度.json#/趨勢&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;!--空單與交割--&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;空單與交割、軋空條件（FINRA 每日放空、暗池與場外週量、Reg SHO 門檻名單、SEC 交割失敗；只描述，不判股價冷熱、不進研究評等；非買賣建議）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;類別&lt;/th&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;數值&lt;/th&gt;&lt;th&gt;資料日期&lt;/th&gt;&lt;th&gt;說明與存檔&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;空單&lt;/td&gt;&lt;td&gt;空單趨勢（近六期，半月一期）&lt;/td&gt;&lt;td&gt;連續減少 2 期&lt;/td&gt;&lt;td&gt;2026-10-30 結算&lt;/td&gt;&lt;td&gt;08-14 286.0M、08-31 298.3M、09-15 294.2M、09-30 311.4M、10-15 301.6M、10-30 279.6M；近一年區間 229.2M～324.1M｜市場資料/空單與交割.json#/空單&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;每日放空&lt;/td&gt;&lt;td&gt;放空成交占比（近20日平均）&lt;/td&gt;&lt;td&gt;31.1%&lt;/td&gt;&lt;td&gt;至 2026-11-17&lt;/td&gt;&lt;td&gt;前25日平均 42.9%；當天成交裡有多少是放空賣出（分母是 FINRA 場外回報成交量，不是全部成交）；不是未平倉空單；做市商、造市與避險的放空也算在內，大型股常態約三到四成，只看自己前後變化｜市場資料/空單與交割.json#/每日放空&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;交易場所&lt;/td&gt;&lt;td&gt;暗池（ATS）週成交占比&lt;/td&gt;&lt;td&gt;13.0%&lt;/td&gt;&lt;td&gt;2026-10-26 當週&lt;/td&gt;&lt;td&gt;近 8 週 10.5%～13.9%；資料落後約 3 週（自週起日算到收盤日）；在暗池（另類交易系統，掛單不公開）成交的股數占當週總成交；FINRA 週資料約落後 2～4 週公布（小型股 Tier 2 更久）；ATS 與 OTC 分開算、不加總；只描述在哪裡成交，不代表買或賣｜市場資料/空單與交割.json#/暗池與場外&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;交易場所&lt;/td&gt;&lt;td&gt;場外非暗池（OTC）週成交占比&lt;/td&gt;&lt;td&gt;33.0%&lt;/td&gt;&lt;td&gt;2026-10-26 當週&lt;/td&gt;&lt;td&gt;近 8 週 32.8%～39.2%；資料落後約 3 週（自週起日算到收盤日）；不經交易所也不經暗池、由券商自己撮合或內部化成交的占比；FINRA 週資料約落後 2～4 週公布（小型股 Tier 2 更久）；ATS 與 OTC 分開算、不加總；只描述在哪裡成交，不代表買或賣｜市場資料/空單與交割.json#/暗池與場外&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;交割&lt;/td&gt;&lt;td&gt;Reg SHO 門檻名單（FINRA 場外）&lt;/td&gt;&lt;td&gt;未上榜&lt;/td&gt;&lt;td&gt;2026-08-25～2026-11-17&lt;/td&gt;&lt;td&gt;Reg SHO 門檻名單：交割失敗量大（≥1 萬股且 ≥ 流通股 0.5%）連續 5 個交割日的股票會被列入；FINRA 名單只涵蓋場外（OTC）證券；上市股的門檻名單由交易所發布，本欄未上榜不代表不是門檻證券，交易所名單本工具未查｜市場資料/空單與交割.json#/門檻名單/FINRA&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;交割&lt;/td&gt;&lt;td&gt;Reg SHO 門檻名單（Nasdaq）&lt;/td&gt;&lt;td&gt;未上榜&lt;/td&gt;&lt;td&gt;2026-08-25～2026-11-17&lt;/td&gt;&lt;td&gt;門檻名單只查 FINRA（場外）與 Nasdaq；NYSE 與其他交易所上市股的名單未查（ICE 條款排除自動擷取），未上榜不代表不是門檻證券｜市場資料/空單與交割.json#/門檻名單/Nasdaq&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;交割&lt;/td&gt;&lt;td&gt;交割失敗（FTD）&lt;/td&gt;&lt;td&gt;最大單日 342,927 股（占流通股 0.001%）；未達異常門檻&lt;/td&gt;&lt;td&gt;2026-08-03～2026-10-30&lt;/td&gt;&lt;td&gt;交割失敗：賣方到交割日沒有交出股票的股數（SEC 每半月公布一檔）；異常門檻＝≥1 萬股且 ≥ 流通股 0.5% 連續 5 個交割日；SEC 半月檔約落後 2 週，最新半月檔可能尚未公布（本次未取得：202611a、202611b）｜市場資料/空單與交割.json#/交割失敗&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;綜合&lt;/td&gt;&lt;td&gt;軋空條件（描述型燈號）&lt;/td&gt;&lt;td&gt;低&lt;/td&gt;&lt;td&gt;2026-10-30 結算&lt;/td&gt;&lt;td&gt;空單占流通股 1.16%（未達偏多門檻）；回補 2.8 天（未達偏慢門檻）；空單最新期較前一期減少 7.3%；未在已查的門檻名單上、交割失敗未達異常門檻；規則：空單占流通股 ≥10% 且回補 ≥5 天，再加「空單增加中（連增 ≥3 期或近一年最高）」「占流通股 ≥20%」「交割吃緊」任一＝高；占流通股 ≥10%、交割吃緊、或回補 ≥5 天且空單增加中＝留意；其餘＝低（門檻 2026-11-18 使用者核定，設定/軋空條件門檻.json）；描述空方部位擁擠程度與回補難易，不判股價冷熱、不是股價會不會漲的判斷；不進研究評等、非買賣建議｜市場資料/空單與交割.json#/軋空條件&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;資料來源 FINRA、SEC（門檻名單另含 Nasdaq Trader）；FINRA 資料限非商業研究用途；只描述，不判股價冷熱、不進研究評等、非買賣建議。&lt;/p&gt;&lt;!--/空單與交割--&gt;&lt;div class=&quot;wide&quot;&gt;&lt;/div&gt;&lt;/details&gt;&lt;details id=&quot;wp-5&quot;&gt;&lt;summary&gt;5 估值：情境算式、市價隱含第 15 年倍數、同業與歷史倍數交叉核對、條件式區間算法、市價反推、溢價來源與作者計算說明&lt;/summary&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;作者計算說明&lt;/h3&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;價格位置推導：收盤價 155.46 美元 約是合理價值中點的 1.29 倍（收盤 2026-11-17 股價 155.46 美元 ÷ 合理價值中點 120.56 美元；只描述距離，非買賣建議）&lt;span class=&quot;src&quot;&gt;（收盤價 ÷ 加權中點，推導）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;情境參數：保守 30%、基準 45%、樂觀 25%&lt;span class=&quot;src&quot;&gt;（循環上行段權重；改用一般 25／50／25，中點 123.05、+2.1%，推導）&lt;/span&gt;。&lt;/strong&gt;第 1 年營收成長由 Q3 實績 115.8B 加 Q4 指引推導&lt;span class=&quot;src&quot;&gt;（8-K 2026-11-17 新聞稿 §0、本文 §57）&lt;/span&gt;：保守 43%（Q4 指引下緣、之後兩季退回 Q2 實績）、基準 60%（Q4 換算 13 週約 120.7B、之後兩季持平）、樂觀 75%（Q4 指引上緣、之後每季再增 10%）。基準營收成長 60%、25%、−6.8%、10%、5%，營業利益率 65%、62%、55.6%、58%、55%，衰退期 10 年後終值利潤率 45%；保守第 2 年放 2022 年實際組合（營收 +0.2%、營業利益率套用當年實際變動 −21.6 點，模型第 2 年 62%→40.4%；標籤年 2022＝FY2023，當年實際約 15.7%），終值 33%；樂觀利潤率 66%→59%，終值 55%。銷售對資本比 2.7，取近四季增量&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;。基準情境約 26% 價值來自明確預測期之後。基準下行年敏感度：第 2–5 年改線性收斂（45.8%、31.6%、17.3%、3.1%）且不放下行年，基準每股 175.80、加權中點 147.46、區間 132.50–166.24，收盤 155.46 在區間內；下行年是產業模組「基準情境下行年：要」的規則預設&lt;span class=&quot;src&quot;&gt;（引擎試算，推導，不進合理價值）&lt;/span&gt;。偏離方法卡 7 正常化起點的敏感度&lt;span class=&quot;src&quot;&gt;（引擎試算，推導）&lt;/span&gt;：基準終值改用十一年平均 35.6%，基準每股 105.62、加權中點 115.88（−3.9%）；基準第 1 年到終值都用 35.6%，基準每股 79.38、加權中點 104.07（−13.7%）、區間 93.35–117.59，收盤 155.46 都高於區間上緣。保守終值 33% 取十一年中位 32.5%、不用低點 14.9%，因終值是永續值，用單年谷底等於假設永久停在谷底（作者判斷）；改用 14.9%，保守每股 52.53、加權中點 116.45（−3.4%）、買入上限由 72.34 美元 變 69.87。樂觀終值 55% 未回到正常化 35.6%，因樂觀情境假設這輪循環不深，且 55% 仍低於近四季 65.2%（作者判斷）。情境差距約 110%，不確定性計分 5 分屬高，安全邊際 40%。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;折現率 11.5%：無風險 5.12%（FRED 10 年期公債 2026-11-16；收盤日當天未入檔），風險溢價 4.2%，beta 1.54＝Damodaran 半導體產業 beta 重新加槓桿 1.50 與 2 年週 beta（Blume 調整）1.57 的平均&lt;span class=&quot;src&quot;&gt;（負債權益比與 WACC 債務權重同為不含租賃口徑）&lt;/span&gt;，改用產業值 1.50 中點 122.83&lt;span class=&quot;src&quot;&gt;（+1.9%，推導）&lt;/span&gt;；yfinance 五年 beta 2.25 只當上緣。&lt;/strong&gt;護城河分級寬（雙鑰匙，外部證據 S01–S03），風格成長，衰退期 10 年、永續期 ROIC 20%；改用衰退 5 年加產業錨點 27.2%，中點約 −4.5%（超額報酬期間檢查）。執行長異動以事件折價 5% 另列（作者判斷，量級參考公告當日股價 −4.3%，11-11→11-12 收盤）：扣除事件折價後每股 103.14–128.84 美元（中點 114.53，估值結果 事件折價欄），價格位置用不含事件的值。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;股權橋&lt;span class=&quot;src&quot;&gt;（10-Q 2026-07-26 口徑；Q3 10-Q 尚未申報）&lt;/span&gt;：現金 224 億；可交易債券 341 億、上市權益證券 428 億、非上市權益證券 512 億，合計 1,281 億，打 19% 折扣（作者判斷）後約 1,037 億、每股約 4.27 美元；其他請求權約每股 0.27。&lt;/strong&gt;依計算核對（2026-11-13，以 11-11 版試算比例）：證券計入使中點約 +4%、其他請求權約 −0.3%&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;，未過 ±10% 門檻。表外 SB Energy 保證上限 1,050 億、雲端服務承諾 290 億、股權投資承諾 250 億屬或有或未來投資，不列請求權&lt;span class=&quot;src&quot;&gt;（2026-10-25 保證合計 1,180 億、承諾合計 5,180 億，8-K 2026-11-17 本文 §47、§54，同樣不列）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;成長跑道六項（估值輸入 evidence_notes.成長跑道）：①市場空間與滲透率未揭露；②定價能力部分證據，近四季毛利率 74.7%、Q3 74.8%，Q4 指引降到 71%–72%，原因公司未說明；③營運槓桿，增量營業利益率 FY2023→FY2026 約 66.8%；④指引達成，近八季 8／8 超過上緣；⑤資金，自由現金流 1,270 億支應回購 553 億與股利 68 億，另發債 250 億；⑥新事業，邊緣運算 Q3 82 億、年增 42%，獲利未揭露。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;口徑：本益比 19.7 倍（申報 EPS（無非經常項目可扣） 7.91 美元；收盤 2026-11-17） 的欄位標示寫「扣非經常」，但 7.91 美元實際是申報 EPS，含權益證券未實現利益、沒有扣除；三個 PEG 也用這個本益比。&lt;/strong&gt;扣營業外收益的近似 EPS 約 6.80 美元，本益比約 22.9 倍&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;。同業倍數交叉核對區間 278.85–496.77 只作核對、不進評等；同業 AMD、MRVL 的本益比含併購攤銷，口徑不同。&lt;/p&gt;&lt;p&gt;半導體公版必看指標：十年利潤率區間 FY2016–FY2026 營業利益率 14.9%～62.4%&lt;span class=&quot;src&quot;&gt;（低點 FY2016 與 FY2023 約 15%，推導，長期財務.json）&lt;/span&gt;；研發占營收由 FY2023 的 27.2% 降到 FY2026 的 8.6%&lt;span class=&quot;src&quot;&gt;（營收成長快於研發，推導）&lt;/span&gt;；產品集中度為資料中心約占 FY2026 營收九成&lt;span class=&quot;src&quot;&gt;（10-K Item 15 Note 16）&lt;/span&gt;；產能利用率與訂單：未揭露（無晶圓廠，產能在代工廠；公司未揭露訂單出貨比或積壓訂單金額，只揭露供應與產能承諾）。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;!--新圖表--&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;缺口判斷影響幅度&lt;/h3&gt;&lt;div class=&quot;wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;市價隱含第 15 年倍數（倍）：基準折現率下市價隱含 20.0 倍、模型 8.6 倍（約 2.3 倍差距）；參考帶 p25–p75 7.8–27.6 倍（機械回測樣本，非市場全體；分產業的筆數與公司數少，僅供參考）；特例：獲利處於循環位置，倍數僅供參考；明示期 15 年，參考帶是 10 年機械回測，倍數不直接比，僅供參考。只描述，不進評等、不是目標價（估值結果.json#/market_implied_terminal）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 620 242&quot; role=&quot;img&quot; aria-label=&quot;市價隱含第 15 年倍數&quot; class=&quot;chart&quot; style=&quot;max-width:775px&quot;&gt;&lt;line x1=&quot;252.0&quot; x2=&quot;252.0&quot; y1=&quot;22&quot; y2=&quot;216&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;252.0&quot; y=&quot;234&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;5&lt;/text&gt;&lt;line x1=&quot;319.6&quot; x2=&quot;319.6&quot; y1=&quot;22&quot; y2=&quot;216&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;319.6&quot; y=&quot;234&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;10&lt;/text&gt;&lt;line x1=&quot;387.2&quot; x2=&quot;387.2&quot; y1=&quot;22&quot; y2=&quot;216&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;387.2&quot; y=&quot;234&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;15&lt;/text&gt;&lt;line x1=&quot;454.8&quot; x2=&quot;454.8&quot; y1=&quot;22&quot; y2=&quot;216&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;454.8&quot; y=&quot;234&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;20&lt;/text&gt;&lt;line x1=&quot;522.4&quot; x2=&quot;522.4&quot; y1=&quot;22&quot; y2=&quot;216&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;522.4&quot; y=&quot;234&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;25&lt;/text&gt;&lt;line x1=&quot;590.0&quot; x2=&quot;590.0&quot; y1=&quot;22&quot; y2=&quot;216&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;590.0&quot; y=&quot;234&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;30&lt;/text&gt;&lt;text x=&quot;252&quot; y=&quot;16&quot; class=&quot;ax&quot;&gt;EV/EBIT（倍）&lt;/text&gt;&lt;text x=&quot;242&quot; y=&quot;66.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;市價隱含（第 15 年 EV/EBIT）&lt;/text&gt;&lt;rect x=&quot;403.2&quot; y=&quot;50.0&quot; width=&quot;111.4&quot; height=&quot;22&quot; rx=&quot;4&quot; fill=&quot;var(--neg)&quot; opacity=&quot;.28&quot;&gt;&lt;title&gt;高–低折現率：16–24&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;403.2&quot; y=&quot;87.0&quot; class=&quot;ax&quot; text-anchor=&quot;start&quot;&gt;高–低折現率 16–24&lt;/text&gt;&lt;circle cx=&quot;454.9&quot; cy=&quot;61.0&quot; r=&quot;7&quot; fill=&quot;var(--neg)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;1.5&quot;&gt;&lt;title&gt;基準：20&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;454.9&quot; y=&quot;47.0&quot; class=&quot;val&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--neg)&quot;&gt;基準 20&lt;/text&gt;&lt;text x=&quot;242&quot; y=&quot;128.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;模型假設（終值 ÷ 第 15 年 EBIT）&lt;/text&gt;&lt;rect x=&quot;288.2&quot; y=&quot;112.0&quot; width=&quot;27.6&quot; height=&quot;22&quot; rx=&quot;4&quot; fill=&quot;var(--c1)&quot; opacity=&quot;.28&quot;&gt;&lt;title&gt;高–低折現率：8–10&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;288.2&quot; y=&quot;149.0&quot; class=&quot;ax&quot; text-anchor=&quot;start&quot;&gt;高–低折現率 8–10&lt;/text&gt;&lt;circle cx=&quot;300.3&quot; cy=&quot;123.0&quot; r=&quot;7&quot; fill=&quot;var(--c1)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;1.5&quot;&gt;&lt;title&gt;基準：9&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;300.3&quot; y=&quot;109.0&quot; class=&quot;val&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--c1)&quot;&gt;基準 9&lt;/text&gt;&lt;text x=&quot;242&quot; y=&quot;190.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;參考帶（跨產業）&lt;/text&gt;&lt;rect x=&quot;289.9&quot; y=&quot;174.0&quot; width=&quot;267.7&quot; height=&quot;22&quot; rx=&quot;4&quot; fill=&quot;var(--c7)&quot; opacity=&quot;.28&quot;&gt;&lt;title&gt;p25–p75：8–28&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;289.9&quot; y=&quot;211.0&quot; class=&quot;ax&quot; text-anchor=&quot;start&quot;&gt;p25–p75 8–28&lt;/text&gt;&lt;circle cx=&quot;394.0&quot; cy=&quot;185.0&quot; r=&quot;6&quot; fill=&quot;var(--c7)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;1.5&quot;&gt;&lt;title&gt;中位：16&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;394.0&quot; y=&quot;171.0&quot; class=&quot;val&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--c7)&quot;&gt;中位 16&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;缺口判斷影響幅度：拿掉各項作者判斷、其他不變時，合理價值中點的變動（計算核對.json，2026-11-11）；紅色為過門檻（中點±10%或價格位置跨界或生意等級理由），2 項中 0 項過門檻；虛線為 ±10%。正值＝拿掉後中點變高&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 100&quot; role=&quot;img&quot; aria-label=&quot;缺口判斷影響幅度&quot; class=&quot;chart&quot; style=&quot;max-width:700px&quot;&gt;&lt;line x1=&quot;330.0&quot; x2=&quot;330.0&quot; y1=&quot;6&quot; y2=&quot;94&quot; class=&quot;zero&quot;/&gt;&lt;line x1=&quot;192.9&quot; x2=&quot;192.9&quot; y1=&quot;4&quot; y2=&quot;96&quot; class=&quot;price&quot;/&gt;&lt;line x1=&quot;467.1&quot; x2=&quot;467.1&quot; y1=&quot;4&quot; y2=&quot;96&quot; class=&quot;price&quot;/&gt;&lt;text x=&quot;150&quot; y=&quot;25&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;1. 股權橋證券&lt;/text&gt;&lt;rect x=&quot;273.0&quot; y=&quot;11&quot; width=&quot;57.0&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;338.0&quot; y=&quot;25&quot; class=&quot;val&quot;&gt;-4.2%&lt;/text&gt;&lt;text x=&quot;150&quot; y=&quot;63&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;2. 其他請求權&lt;/text&gt;&lt;rect x=&quot;330.0&quot; y=&quot;49&quot; width=&quot;3.6&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;341.6&quot; y=&quot;63&quot; class=&quot;val&quot;&gt;+0.3%&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;/div&gt;&lt;!--/新圖表--&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;合理價值怎麼來：三個情境與權重&lt;/h3&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt&quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;每股價值（基準折現率 11.5%）&lt;/th&gt;&lt;th&gt;權重&lt;/th&gt;&lt;th&gt;折現率高端 12.5%&lt;/th&gt;&lt;th&gt;折現率低端 10.5%&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;66.22&lt;/td&gt;&lt;td&gt;30%&lt;/td&gt;&lt;td&gt;60.54&lt;/td&gt;&lt;td&gt;73.31&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;116.02&lt;/td&gt;&lt;td&gt;45%&lt;/td&gt;&lt;td&gt;104.92&lt;/td&gt;&lt;td&gt;129.93&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;193.93&lt;/td&gt;&lt;td&gt;25%&lt;/td&gt;&lt;td&gt;172.78&lt;/td&gt;&lt;td&gt;220.66&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;加權（合理價值）&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;b&gt;120.56&lt;/b&gt;&lt;/td&gt;&lt;td&gt;100%&lt;/td&gt;&lt;td&gt;&lt;b&gt;108.57&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;b&gt;135.63&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;中點是三個情境的加權：0.3×66.22＋0.45×116.02＋0.25×193.93≈120.56（循環上行段權重組合）。區間上下緣是同樣三個情境、權重不變，只把折現率換成區間高端或低端重算後加權：高端約 12.5% → 108.57（下緣），低端約 10.5% → 135.63（上緣）。買入上限 72.34＝中點 × (1－安全邊際 40%，不確定性高)，股價在此以下才有 40% 安全邊際。情境表說明合理價值怎麼組成，不是單一目標價；非買賣建議。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;市價隱含第 15 年倍數（只描述，不進評等）&lt;/h3&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;基準情境：市價隱含 vs 模型假設的第 15 年 EV/EBIT（金額百萬美元）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;折現率&lt;/th&gt;&lt;th&gt;WACC&lt;/th&gt;&lt;th&gt;市場 EV&lt;/th&gt;&lt;th&gt;明示期現值&lt;/th&gt;&lt;th&gt;終值折現因子&lt;/th&gt;&lt;th&gt;第 15 年 EBIT&lt;/th&gt;&lt;th&gt;市價隱含倍數&lt;/th&gt;&lt;th&gt;模型終值倍數&lt;/th&gt;&lt;th&gt;隱含÷模型&lt;/th&gt;&lt;th&gt;現在 EV／次年 EBIT&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;低折現率&lt;/td&gt;&lt;td&gt;10.52%&lt;/td&gt;&lt;td&gt;3,689,110&lt;/td&gt;&lt;td&gt;2,137,245&lt;/td&gt;&lt;td&gt;0.223&lt;/td&gt;&lt;td&gt;430,257&lt;/td&gt;&lt;td&gt;16.2 倍&lt;/td&gt;&lt;td&gt;9.7 倍&lt;/td&gt;&lt;td&gt;1.67&lt;/td&gt;&lt;td&gt;11.7 倍&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;11.52%&lt;/td&gt;&lt;td&gt;3,689,110&lt;/td&gt;&lt;td&gt;2,012,874&lt;/td&gt;&lt;td&gt;0.195&lt;/td&gt;&lt;td&gt;430,257&lt;/td&gt;&lt;td&gt;20.0 倍&lt;/td&gt;&lt;td&gt;8.6 倍&lt;/td&gt;&lt;td&gt;2.33&lt;/td&gt;&lt;td&gt;11.7 倍&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;高折現率&lt;/td&gt;&lt;td&gt;12.52%&lt;/td&gt;&lt;td&gt;3,689,110&lt;/td&gt;&lt;td&gt;1,899,284&lt;/td&gt;&lt;td&gt;0.170&lt;/td&gt;&lt;td&gt;430,257&lt;/td&gt;&lt;td&gt;24.4 倍&lt;/td&gt;&lt;td&gt;7.7 倍&lt;/td&gt;&lt;td&gt;3.18&lt;/td&gt;&lt;td&gt;11.7 倍&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;算式：市場 EV＝模型 EV +（現價 − 模型每股價值）× 股數（股權橋與模型相同）；隱含倍數＝（市場 EV − 明示期現值）÷ 終值折現因子 ÷ 第 15 年 EBIT；模型終值倍數＝模型終值 ÷ 第 15 年 EBIT。參考帶：p25 7.8、中位 15.5、p75 27.6、p90 42.7 倍（機械回測樣本，非市場全體；分產業的筆數與公司數少，僅供參考；機械回測訓練期 2016–2021 全部回測日（審查工作區 回測資料/隱含倍數結果.json，1,810 筆中訓練期 1,046 筆；產業＝回測樣本的 Damodaran 產業）；重算：python3 程式/回測_隱含倍數參考帶.py &amp;lt;隱含倍數結果.json&amp;gt;）。只描述，不進價格位置、研究評等與合理價值。&lt;/p&gt;&lt;p class=&quot;cap&quot;&gt;特例：獲利處於循環位置，倍數僅供參考；明示期 15 年，參考帶是 10 年機械回測，倍數不直接比，僅供參考。&lt;/p&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;&lt;b&gt;合理價值 vs 市價隱含倍數（作者判讀）：&lt;/b&gt;市價隱含第 15 年（明示期末）EV/EBIT 約 20.0 倍，是模型終值倍數 8.6 倍 的 2.33 倍。特例：輝達處於景氣高峰、基期利潤率偏高，且本模型明示期 15 年、參考帶是 10 年機械回測，倍數只供參考；隱含倍數介於跨產業參考帶中位 15.5 倍與 p75 27.6 倍之間。市價等於假設第 15 年仍是高成長、高利潤的公司，我們假設屆時回到成熟水準；只描述，不當評等理由。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;如果 10 年後倍數是 15.5 倍，機率加權每股約 147 美元（條件式，非目標價、非買賣建議，不進評等）&lt;/h3&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;第 15 年 EV/EBIT 倍數對照（三情境各用自己的明示期 FCFF 與第 15 年 EBIT；權重 循環上行段：保守 30%／基準 45%／樂觀 25%；基準 WACC 11.52%）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;第 15 年倍數&lt;/th&gt;&lt;th&gt;機率加權每股（美元）&lt;/th&gt;&lt;th&gt;折現率低高區間&lt;/th&gt;&lt;th&gt;白話換算&lt;/th&gt;&lt;th&gt;現價相對&lt;/th&gt;&lt;th&gt;說明&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;模型假設倍數&lt;/td&gt;&lt;td&gt;8.6 倍&lt;/td&gt;&lt;td&gt;120.56&lt;/td&gt;&lt;td&gt;108.57–135.63&lt;/td&gt;&lt;td&gt;等於折現率減永續成長約 8.5%（模型 8.5%）&lt;/td&gt;&lt;td&gt;現價高於區間&lt;/td&gt;&lt;td&gt;各情境用自己的模型終值倍數（表列為基準情境）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;穩態理論上限&lt;/td&gt;&lt;td&gt;10.1 倍&lt;/td&gt;&lt;td&gt;126.33&lt;/td&gt;&lt;td&gt;116.62–137.26&lt;/td&gt;&lt;td&gt;等於折現率減永續成長約 7.2%（模型 8.5%）&lt;/td&gt;&lt;td&gt;現價高於區間&lt;/td&gt;&lt;td&gt;（1−t）（1+g）÷（WACC−g）：再投資為零（ROIC 無限大）時的上限；t＝第 15 年 1−NOPAT÷EBIT&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;參考帶中位（跨產業）&lt;/td&gt;&lt;td&gt;15.5 倍&lt;/td&gt;&lt;td&gt;146.97&lt;/td&gt;&lt;td&gt;134.67–160.88&lt;/td&gt;&lt;td&gt;等於折現率減永續成長約 4.7%（模型 8.5%）&lt;/td&gt;&lt;td&gt;現價在區間內&lt;/td&gt;&lt;td&gt;所選參考帶（跨產業）中位&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;同業今日 EV/EBIT 中位&lt;/td&gt;&lt;td&gt;80.9 倍&lt;/td&gt;&lt;td&gt;396.43&lt;/td&gt;&lt;td&gt;352.87–446.43&lt;/td&gt;&lt;td&gt;等於折現率減永續成長約 0.9%（模型 8.5%）&lt;/td&gt;&lt;td&gt;現價低於區間&lt;/td&gt;&lt;td&gt;估值結果 multiples.ev_ebit.peer_quartiles.p50（今天的倍數，不是 10 年後）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;參考帶 p75（跨產業）&lt;/td&gt;&lt;td&gt;27.6 倍&lt;/td&gt;&lt;td&gt;193.12&lt;/td&gt;&lt;td&gt;175.04–213.70&lt;/td&gt;&lt;td&gt;等於折現率減永續成長約 2.6%（模型 8.5%）&lt;/td&gt;&lt;td&gt;現價低於區間&lt;/td&gt;&lt;td&gt;所選參考帶（跨產業）p75&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;市價隱含&lt;/td&gt;&lt;td&gt;20.0 倍&lt;/td&gt;&lt;td&gt;164.15&lt;/td&gt;&lt;td&gt;149.70–180.55&lt;/td&gt;&lt;td&gt;等於折現率減永續成長約 3.7%（模型 8.5%）&lt;/td&gt;&lt;td&gt;現價在區間內&lt;/td&gt;&lt;td&gt;基準情境、基準折現率反推（只用基準情境，套到三情境後加權不必等於現價）&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;如果 10 年後倍數是 X，三情境各用自己的明示期 FCFF 與第 15 年 EBIT、以基準折現率折現，依政策情境機率權重加權的每股價值；區間只換折現率（①模型列為合理價值區間）。「折現率減永續成長」＝(1+g)(1−t)(1−g/ROIC)÷倍數（基準情境永續參數）。條件式，非目標價、非買賣建議，不進評等。模型假設倍數那一列等於合理價值（中點 120.56）。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;合理性與一致性檢查（只顯示，不改估值與評等）&lt;/h3&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;每項都有反方向版本；「方向」是亮燈時模型偏保守還是偏積極&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;編號&lt;/th&gt;&lt;th&gt;檢查&lt;/th&gt;&lt;th&gt;燈號&lt;/th&gt;&lt;th&gt;方向&lt;/th&gt;&lt;th&gt;說明&lt;/th&gt;&lt;th&gt;反方向條件&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;S1&lt;/td&gt;&lt;td&gt;合理價中點隱含本益比對照營收成長&lt;/td&gt;&lt;td&gt;綠&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;合理價中點 ÷ 近四季 EPS（替代未來一年 EPS，資料未存遠期 EPS）＝15.2 倍；近四季營收年增 83.4%&lt;/td&gt;&lt;td&gt;反方向：年增 &amp;lt; 5% 且 &amp;gt; 30 倍黃、&amp;gt; 40 倍紅&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;S2&lt;/td&gt;&lt;td&gt;DCF 中點與其他方法中點差距&lt;/td&gt;&lt;td&gt;紅&lt;/td&gt;&lt;td&gt;偏保守&lt;/td&gt;&lt;td&gt;其他方法中點的中位數 358.82（2 法：自身・近五年（2021-11-17 起）〔EV／營業利益〕、同業現行（AMD、AVGO、MRVL、QCOM）〔EV／營業利益〕）÷ DCF 中點 120.56&lt;/td&gt;&lt;td&gt;反方向：比值 &amp;lt; 0.67 黃、&amp;lt; 0.5 紅（DCF 比其他方法高很多）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;S3&lt;/td&gt;&lt;td&gt;折現率減市價反推折現率&lt;/td&gt;&lt;td&gt;黃&lt;/td&gt;&lt;td&gt;偏保守&lt;/td&gt;&lt;td&gt;採用 11.52%，市價反推（基準情境現價隱含年報酬）9.18%，差 +2.3 個百分點&lt;/td&gt;&lt;td&gt;反方向：採用比反推低 2 點以上黃、3 點以上紅&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;S4&lt;/td&gt;&lt;td&gt;終值占總價值比例&lt;/td&gt;&lt;td&gt;綠&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;基準情境終值現值占企業價值 26%&lt;/td&gt;&lt;td&gt;反方向：&amp;lt; 25% 黃（價值幾乎全靠明示期）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;S5&lt;/td&gt;&lt;td&gt;終值倍數落點&lt;/td&gt;&lt;td&gt;黃&lt;/td&gt;&lt;td&gt;偏保守&lt;/td&gt;&lt;td&gt;模型最後一年 EV/EBIT 8.6 倍；參考帶（跨產業）p25 7.8 中位 15.5 p75 27.6；護城河 寬；護城河寬卻低於 p25 與中位數的中點；明示期 15 年、參考帶是 10 年，僅供參考&lt;/td&gt;&lt;td&gt;反方向：高於 p75 紅、護城河無而高於中位黃（已含）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;S6&lt;/td&gt;&lt;td&gt;保守（或積極）假設疊加項數&lt;/td&gt;&lt;td&gt;紅&lt;/td&gt;&lt;td&gt;偏保守&lt;/td&gt;&lt;td&gt;保守：成長（基準首年比近四季 -23.4 點）、折現率（區間向上偏或高於反推 2 點以上）、終值（護城河寬或窄卻低於參考帶中位）、安全邊際 40%；積極：無&lt;/td&gt;&lt;td&gt;反方向：積極項數 3 黃、4 以上紅（已含）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;S9&lt;/td&gt;&lt;td&gt;樂觀情境低於現價要說明&lt;/td&gt;&lt;td&gt;綠&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;現價在保守與樂觀之間&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;S10&lt;/td&gt;&lt;td&gt;DCF 情境範圍與其他方法是否完全錯開&lt;/td&gt;&lt;td&gt;綠&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;樂觀 193.93、保守 66.22；其他方法最低下緣 58.13、最高上緣 715.03&lt;/td&gt;&lt;td&gt;反方向：保守高於所有其他方法上緣紅（已含）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;S7&lt;/td&gt;&lt;td&gt;折現率跨公司排序&lt;/td&gt;&lt;td&gt;黃&lt;/td&gt;&lt;td&gt;偏保守&lt;/td&gt;&lt;td&gt;BFAM（風險分 2 對 0，折現率 7.59% 低於本公司 11.52%）；FTDR（風險分 2 對 0，折現率 8.69% 低於本公司 11.52%）；NICE（風險分 2 對 0，折現率 9.90% 低於本公司 11.52%）；NVO（風險分 2 對 0，折現率 8.49% 低於本公司 11.52%）&lt;/td&gt;&lt;td&gt;反方向：本公司風險分高 2 以上、折現率卻較低時，記在對方公司（同一規則兩頭都檢）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;S8&lt;/td&gt;&lt;td&gt;品質倒掛&lt;/td&gt;&lt;td&gt;黃&lt;/td&gt;&lt;td&gt;偏保守&lt;/td&gt;&lt;td&gt;生意 A 合理價隱含本益比 15.2 倍低於全站生意 B 中位 18.9 倍&lt;/td&gt;&lt;td&gt;反方向：生意 C 高於 B 中位（已含）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;C1&lt;/td&gt;&lt;td&gt;護城河用詞統一寬／窄／無&lt;/td&gt;&lt;td&gt;黃&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;出現強／中／弱用法&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;C2&lt;/td&gt;&lt;td&gt;兩頁不並存兩套字母評等&lt;/td&gt;&lt;td&gt;黃&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;估值頁生意 A、商業評估 B 級（不同字母容易被讀成同一把尺）&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;C3&lt;/td&gt;&lt;td&gt;假設與自己的護城河評分一致（P4）&lt;/td&gt;&lt;td&gt;綠&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;C4&lt;/td&gt;&lt;td&gt;同一事件期間描述一致（指引達成連續季數）&lt;/td&gt;&lt;td&gt;黃&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;估值頁與商業評估頁的「近 N 季…指引」季數不同&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;C5&lt;/td&gt;&lt;td&gt;同一指標不同段落同值&lt;/td&gt;&lt;td&gt;綠&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;比對 10 個指標、34 處，沒有對不上&lt;/td&gt;&lt;td&gt;不分方向：任一處寫高或寫低都會亮；條件句、敏感度試算、其他期間與情境的數字不比（寧可漏報）&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;!--成長型價格參考--&gt;&lt;div class=&quot;block&quot; id=&quot;growth-ref&quot;&gt;&lt;h3&gt;成長型價格參考：報酬門檻價、五年報酬矩陣、林區比值（只描述，不進評等，非買賣建議）&lt;/h3&gt;&lt;p class=&quot;cap&quot;&gt;這一段只描述，不進研究評等、不改價格位置，也不是目標價；三種情境並列、不合成單一數字，數字是「該情境成真時」的條件式推算，不是預期報酬。非買賣建議。&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;一、報酬門檻價：收盤 2026-11-17 股價 155.46 美元（三情境並列；條件式推算，非目標價）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;年報酬 7% 的每股價格（美元）&lt;/th&gt;&lt;th&gt;年報酬 8% 的每股價格（美元）&lt;/th&gt;&lt;th&gt;年報酬 9% 的每股價格（美元）&lt;/th&gt;&lt;th&gt;年報酬 10% 的每股價格（美元）&lt;/th&gt;&lt;th&gt;現價隱含年報酬&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;124.48&lt;/td&gt;&lt;td&gt;102.93&lt;/td&gt;&lt;td&gt;88.36&lt;/td&gt;&lt;td&gt;77.78&lt;/td&gt;&lt;td&gt;6.1%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;231.36&lt;/td&gt;&lt;td&gt;188.50&lt;/td&gt;&lt;td&gt;159.61&lt;/td&gt;&lt;td&gt;138.73&lt;/td&gt;&lt;td&gt;9.2%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;420.20&lt;/td&gt;&lt;td&gt;335.22&lt;/td&gt;&lt;td&gt;278.41&lt;/td&gt;&lt;td&gt;237.72&lt;/td&gt;&lt;td&gt;13.5%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;算法：各情境的 10 年現金流與終值改用門檻當折現率，經同一股權橋換成每股；股價等於這個價格時，該情境成真的現價隱含年報酬就等於門檻（兩者互為反函數）。&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;二、五年報酬矩陣：現價買進、持有 5 年的年化報酬（三情境 × 三種第 5 年倍數；推導，條件式，非預期報酬）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;第 5 年 EBIT（估值輸入單位，推導）&lt;/th&gt;&lt;th&gt;維持現在 18.7 倍&lt;/th&gt;&lt;th&gt;縮四分之一 14.0 倍&lt;/th&gt;&lt;th&gt;回到參考帶中位（跨產業） 15.5 倍&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;193,430.8&lt;/td&gt;&lt;td&gt;4.2%&lt;/td&gt;&lt;td&gt;-0.8%&lt;/td&gt;&lt;td&gt;0.9%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;358,747.4&lt;/td&gt;&lt;td&gt;18.3%&lt;/td&gt;&lt;td&gt;12.6%&lt;/td&gt;&lt;td&gt;14.5%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;560,410.2&lt;/td&gt;&lt;td&gt;29.3%&lt;/td&gt;&lt;td&gt;23.1%&lt;/td&gt;&lt;td&gt;25.3%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;算法：現價買進、持有 5 年：第 1–5 年自由現金流與第 5 年企業價值（倍數 × 該情境第 5 年 EBIT）折回今天、經今日股權橋與股數換成每股，解出使每股等於現價的年報酬（與現價隱含年報酬同一算法，只是第 5 年改用倍數計價）；不另估 5 年後的淨債務與股數。企業價值 ÷ 當年 EBIT 口徑與市價隱含第 15 年倍數、參考帶相同。推導。現在倍數＝市場企業價值 3,689,109.9 ÷ 近四季營業利益 197,579.0（估值輸入 company_metrics.ebit）＝18.7 倍；縮四分之一＝現在倍數 × 0.75。參考帶：跨產業層「跨產業」中位 15.5 倍（機械回測樣本，非市場全體；分產業的筆數與公司數少，僅供參考）。特例：獲利處於循環位置，倍數僅供參考。&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;三、林區比值（只給比值與口徑；成長率與本益比的口徑同「PEG 與林區檢查」表的基準情境推估那一列）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;數值&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;林區分類&lt;/td&gt;&lt;td&gt;快速成長&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;成長率（基準情境推估（稅後營業利益年增－股數年變化））&lt;/td&gt;&lt;td&gt;13.3%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;本益比&lt;/td&gt;&lt;td&gt;19.7 倍&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股息殖利率&lt;/td&gt;&lt;td&gt;0.2%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;本益比 ÷ 成長率&lt;/td&gt;&lt;td&gt;1.48&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;（成長率＋股息殖利率）÷ 本益比&lt;/td&gt;&lt;td&gt;0.69&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;林區以本益比約等於成長率為參考（二手來源轉述）；本表不設門檻。只給比值與口徑，不作便宜或昂貴的判斷，不進研究評等與價格位置。非買賣建議。&lt;/p&gt;&lt;/div&gt;&lt;!--/成長型價格參考--&gt;&lt;div class=&quot;note-box&quot;&gt;&lt;b&gt;同業與歷史倍數交叉核對（不進評等）：279–497 美元&lt;/b&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;依同業的本益比、企業價值／營業利益、企業價值／營收倍數換算的每股價值，各法 25 百分位的中位數到 75 百分位的中位數；不是股價波動範圍，也不是合理價值。原稱「市場情緒區間」；2026-11-11 起只作交叉核對，不決定價格位置與研究評等（價格位置對稱四級：便宜、偏低、合理、偏貴，只看內在價值；同業與歷史倍數只作標註）。同業僅 4 家，分位僅供參考。&lt;/p&gt;&lt;p class=&quot;cap&quot; id=&quot;peer-outliers&quot; style=&quot;margin-top:4px&quot;&gt;同業異常值：不計入分位：QCOM 21.8 倍（ev_ebit，低於同組中位數 59.3 倍的一半，不進分位（D4））；QCOM 4.4 倍（ev_sales，低於同組中位數 15.8 倍的一半，不進分位（D4））。偏離但同組太少、仍計入：AMD 107.8 倍（pe，偏離同組中位數 45.2 倍超過 2 倍，但同業太少（排除後不足 3 家），只標註、仍進分位（D4））；QCOM 13.3 倍（pe，偏離同組中位數 45.2 倍超過 2 倍，但同業太少（排除後不足 3 家），只標註、仍進分位（D4））。&lt;/p&gt;&lt;/div&gt;&lt;!--目標區間:第五題--&gt;&lt;div class=&quot;block&quot; id=&quot;target-body&quot;&gt;&lt;h3&gt;各情境成真時的價值（一年後，條件式、非買賣建議）&lt;/h3&gt;&lt;p class=&quot;cap&quot;&gt;條件式目標區間：三種情境各自成真時的每股價值區間，不是股價預測，三段不合成單一數字；非買賣建議。不影響合理價值、價格位置與研究評等。&lt;/p&gt;&lt;p&gt;算法：各情境每股價值（折現率高低兩端）×（1＋股權成本 11.59%）− 未來 12 個月每股股利 1.00 美元（作者輸入：已宣告季配 0.25 美元×4，10-Q 2026-07-26 Item 2 ¶101、8-K 2026-11-17 新聞稿 §2，推導）；回購不加回。起點 2026-11-17 收盤，終點 2027-11-17。三段是各情境在折現率上下兩端的每股價值向前推 12 個月，不是價格機率分布的切片；段與段之間可能有空白，也可能重疊。區間主要寬度來自折現率不確定，不是 12 個月內的營運變化。&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt&quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;機率（政策權重，未經歷史校準）&lt;/th&gt;&lt;th&gt;目標區間（美元）&lt;/th&gt;&lt;th&gt;相對現價&lt;/th&gt;&lt;th&gt;關鍵假設（估值輸入）&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;30%&lt;/td&gt;&lt;td&gt;&lt;b&gt;66.55–80.80&lt;/b&gt;&lt;/td&gt;&lt;td&gt;−57%～−48%&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;第 1 年營收 +43.0%；營業利益率 62.0%；穩態 33.0%；永續成長 3.0%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;45%&lt;/td&gt;&lt;td&gt;&lt;b&gt;116.08–143.98&lt;/b&gt;&lt;/td&gt;&lt;td&gt;−25%～−7%&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;第 1 年營收 +60.0%；營業利益率 65.0%；穩態 45.0%；永續成長 3.0%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;25%&lt;/td&gt;&lt;td&gt;&lt;b&gt;191.80–245.24&lt;/b&gt;&lt;/td&gt;&lt;td&gt;+23%～+58%&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;第 1 年營收 +75.0%；營業利益率 66.0%；穩態 55.0%；永續成長 3.0%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;口徑：報告中「現價隱含年報酬（基準情境，非預期報酬）約 9.2%」是以現價買進、持有該情境全期現金流（含永續價值）的年化報酬；這裡的目標區間是 12 個月後各情境每股價值的前推，兩者口徑不同，不能互相換算（例如不能用前者推 12 個月後的價格）。&lt;/p&gt;&lt;h4 style=&quot;margin-top:14px&quot;&gt;每一段要成立，市場這一面需要什麼、正在顯示什麼&lt;/h4&gt;&lt;ul class=&quot;prose&quot;&gt;&lt;li&gt;保守段代表值 72.9（基準折現率前推）要成立，一年後EV／營業利益需約 6.3 倍（現在 18.7 倍，低於現在倍數）；過去一年逐日重建的交易日中，99% 以上高於這個倍數、不到 1% 低於這個倍數（推導）；同規模同成長低於 p25。這是把價值翻成倍數的讀法，不是預測市場會給這個倍數。&lt;/li&gt;&lt;li&gt;基準段代表值 128.5（基準折現率前推）要成立，一年後EV／營業利益需約 9.6 倍（現在 18.7 倍，低於現在倍數）；過去一年逐日重建的交易日中，99% 以上高於這個倍數、不到 1% 低於這個倍數（推導）；同規模同成長約第 26 百分位（p25–p75 間線性內插，推導）。這是把價值翻成倍數的讀法，不是預測市場會給這個倍數。&lt;/li&gt;&lt;li&gt;樂觀段代表值 215.4（基準折現率前推）要成立，一年後EV／營業利益需約 14.7 倍（現在 18.7 倍，低於現在倍數）；過去一年逐日重建的交易日中，99% 以上高於這個倍數、不到 1% 低於這個倍數（推導）；同規模同成長約第 43 百分位（p25–p75 間線性內插，推導）。這是把價值翻成倍數的讀法，不是預測市場會給這個倍數。&lt;/li&gt;&lt;li&gt;12 個月選擇權隱含分布：未取得（到期日 2027-12-17 價平附近沒有有效報價（盤前盤後或無成交時 Yahoo 常給佔位值））；不補值。&lt;/li&gt;&lt;li&gt;公債殖利率下降 1 個百分點時，保守／基準／樂觀段代表值（基準折現率前推，不是區間兩端的平均）為 80.0／142.5／242.7；目前 72.9／128.5／215.4；上升 1 個百分點時為 67.2／117.2／193.7（美元，股權成本同幅變動，其他假設不變）。&lt;/li&gt;&lt;li&gt;分析師預估：本財年每股盈餘預估 9.32，較 30 天前 9.31 +0.1%（持平），近 30 天 2 家上修、0 家下修；下一財年每股盈餘預估 15.93，較 30 天前 15.91 +0.1%（持平），近 30 天 7 家上修、0 家下修。只描述預估修正的方向，不當證據，也不是目標區間的任一端。&lt;/li&gt;&lt;li&gt;券商目標價近 90 天有 24 家調整：上調 7、下調 11、持平 6（只揭露，不是本報告的目標價）。&lt;/li&gt;&lt;li&gt;上季（Jul 2026，8/26/2026 公布）每股盈餘 2.22，共識預估 2.09，驚奇 6.22%（Nasdaq）；yfinance 另列 2026-07-31 實際 2.22、預估 2.09、驚奇 +6.16%；兩個來源口徑可能不同（可能是調整後或一般會計準則），公司申報的每股盈餘可對照存檔 8-K 2026-08-26 財報新聞稿（本句未逐項比對），只描述、不當證據。&lt;/li&gt;&lt;/ul&gt;&lt;p class=&quot;cap&quot;&gt;以上只引用已存檔的數字描述條件與現況，不是預測；選擇權機率是風險中立機率、不是真實機率，不改情境權重；分析師預估與券商目標價不當證據；細節表在附錄估值細節。&lt;/p&gt;&lt;ul class=&quot;cap&quot;&gt;&lt;li&gt;近四季公開市場回購均價 190.89 高於合理價值上緣 135.63；回購不加回、目標區間不調整。&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;!--/目標區間:第五題--&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;市價要求的成長：三視角反推、假設對照實績、歷史基準比率與市價溢價來源&lt;/h3&gt;&lt;p&gt;這一節把現價代回估值模型反解「市場要求什麼」，再和公司實績、同規模公司的歷史比例、市場面的過熱訊號對照；只揭露，不改合理價值、價格位置與研究評等。&lt;/p&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;市價隱含什麼、我們假設什麼、公司做到什麼&lt;/h4&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;視角（其他假設照基準，三者擇一）&lt;/th&gt;&lt;th&gt;市價隱含&lt;/th&gt;&lt;th&gt;本報告基準&lt;/th&gt;&lt;th&gt;實績或對照&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;成長&lt;/td&gt;&lt;td&gt;第 1–5 年營收每年約 18.1%&lt;/td&gt;&lt;td&gt;第 1–5 年平均約 18.6%（推算）&lt;/td&gt;&lt;td&gt;近四季 83.4%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;利潤率&lt;/td&gt;&lt;td&gt;第 1 年起每年（含穩態）營業利益率約 68.7%&lt;/td&gt;&lt;td&gt;第 1 年 65.0%、穩態 45.0%&lt;/td&gt;&lt;td&gt;14.9%–62.4%（近 11 年營業利益率）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;折現率&lt;/td&gt;&lt;td&gt;約 9.2%（使基準情境等於現價的折現率）&lt;/td&gt;&lt;td&gt;加權資本成本 11.5%&lt;/td&gt;&lt;td&gt;10 年期公債 5.12%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;市價隱含折現率約 9.2%，比加權資本成本 11.5% 低約 2.3 個百分點：照基準情境假設，現價隱含的長期報酬低於本報告採用的資金成本；市價要站得住，需要基準以外的假設成立（例如成長或利潤率高於基準，見上兩列），或投資人接受較低的報酬。隱含折現率不是預期報酬；V3 回測（2016–2025，含倖存者偏誤）中，之後一年實際報酬中位多高於隱含值。只揭露，不改研究評等與價格位置；非買賣建議。&lt;/p&gt;&lt;div style=&quot;margin-top:12px&quot;&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;第 1 年營收成長&lt;/th&gt;&lt;th&gt;穩態營業利益率&lt;/th&gt;&lt;th&gt;終端投入資本報酬率（ROIC）&lt;/th&gt;&lt;th&gt;永續成長&lt;/th&gt;&lt;th&gt;對照實績&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;43.0%&lt;/td&gt;&lt;td&gt;33.0%&lt;/td&gt;&lt;td&gt;20.0%&lt;/td&gt;&lt;td&gt;3.0%&lt;/td&gt;&lt;td&gt;保守於實績（終端 ROIC 不到研發資本化後實績一半；作者選值，理由見估值輸入）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;60.0%&lt;/td&gt;&lt;td&gt;45.0%&lt;/td&gt;&lt;td&gt;20.0%&lt;/td&gt;&lt;td&gt;3.0%&lt;/td&gt;&lt;td&gt;保守於實績（終端 ROIC 不到研發資本化後實績一半；作者選值，理由見估值輸入）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;75.0%&lt;/td&gt;&lt;td&gt;55.0%&lt;/td&gt;&lt;td&gt;20.0%&lt;/td&gt;&lt;td&gt;3.0%&lt;/td&gt;&lt;td&gt;保守於實績（終端 ROIC 不到研發資本化後實績一半；作者選值，理由見估值輸入）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;公司實績&lt;/td&gt;&lt;td&gt;近四季 83.4%&lt;/td&gt;&lt;td&gt;近四季 65.2%；14.9%–62.4%（近 11 年營業利益率）&lt;/td&gt;&lt;td&gt;近四季 242.7%；研發資本化後約 146.1%（2026-01-25 財年，研發資本化對照.json）&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;市價隱含三視角：把現價代回基準情境，一次只放開一個假設反解（成長、利潤率、折現率），三者擇一成立即可，不是同時需要；折現率視角就是第四題「現價隱含年報酬（基準情境，非預期報酬）」。假設對照：終端 ROIC 低於近四季一半時標「保守於實績」，括號寫原因：產業上限、公司近五年中位上限或等於資金成本是估值框架的上限設定（估值政策），作者選值的理由在估值輸入，都不是資料錯誤；穩態利潤率高於歷史上限標「高於歷史上限」；利潤率仍在改善中的公司（轉型、規模擴張期），歷史上限不一定是天花板，標記只提醒讀者對照，不代表假設錯誤。出處：估值結果.json（reverse_dcf、implied_return、discount）、估值輸入.json（scenarios）、財務指標.json（ROIC_TTM）、產業指標.json（景氣正常化）、成長推估底稿.json 與財務歷史.json（近四季）；推導，只揭露，不改合理價值、價格位置與研究評等。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;市價隱含的成長與歷史基準比率&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;市價隱含 NVDA 未來 10 年營收實質年增約 14.8%–15.3%（名目 17.3% 減通膨 2.0%–2.5% 的近似，推導）；1950–2015 年營收 500 億美元以上的公司中，10 年間做到實質年增 10% 以上的約 3.9%–0.9%（Mauboussin 等，2016，表 4）。此為揭露，不是市價錯誤的證明。&lt;/p&gt;&lt;p&gt;現價要成立，需把基準情境第 1 年營收成長 60.0% 延續約 3 年（之後新投資報酬等於折現率，不再創造價值；推導，只揭露）。&lt;/p&gt;&lt;p&gt;&lt;b&gt;隱含假設罕見度：歷史罕見&lt;/b&gt;（同規模公司 10 年做到的歷史比例 ≥50% 一般、10%–50% 樂觀、&amp;lt;10% 歷史罕見；只揭露，不改研究評等與價格位置）&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;超額報酬期間&lt;/th&gt;&lt;th&gt;市價隱含營收年增（名目）&lt;/th&gt;&lt;th&gt;約實質（名目減通膨 2.0%–2.5% 的近似，推導）&lt;/th&gt;&lt;th&gt;歷史基準比率（1950–2015）&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;10 年&lt;/td&gt;&lt;td&gt;17.3%&lt;/td&gt;&lt;td&gt;14.8%–15.3%&lt;/td&gt;&lt;td&gt;營收 500 億美元以上：10 年實質年增 10% 以上約 3.9%–0.9%（該組 10 年實質年增中位數 1.1%）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;15 年&lt;/td&gt;&lt;td&gt;13.2%&lt;/td&gt;&lt;td&gt;10.7%–11.2%&lt;/td&gt;&lt;td&gt;原文只有 10 年分布，15、20 年無對照&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;20 年&lt;/td&gt;&lt;td&gt;11.3%&lt;/td&gt;&lt;td&gt;8.8%–9.3%&lt;/td&gt;&lt;td&gt;原文只有 10 年分布，15、20 年無對照&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;做法：超額報酬期間內營收年增固定、利潤率與銷售對資本比取基準情境第 5 年；期間結束後新投資報酬等於折現率（不再創造價值）；永續成長照基準情境。折現率 11.52%、第 5 年利潤率 55.0%。來源：Mauboussin, Callahan &amp;amp; Majd（2016）〈The Base Rate Book〉表 4（第三方轉載，原表 1950–2015 年、實質成長、有存活偏差）。這張表只說明「市價需要多強、多久的成長才成立」，不改合理價值、買入上限與價格位置；歷史比例低代表市價需要少見的結果，不代表市價錯誤。通膨假設 2.0%–2.5% 依 Morningstar 2020-10 方法，實質年增為名目直接減通膨的近似。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;市價溢價來源&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;溢價訊號集中在基本面預期（隱含假設罕見度）。倍數重估、資金與情緒、總經與利率無訊號。只揭露，不改研究評等與價格位置，也不代表市價錯誤。&lt;/p&gt;&lt;p&gt;EPS 預估：+1y（財年未對應） 預估 90 天 24.2%（上修；判斷窗口為 90 天，±2% 內視為持平），近 30 天上修減下修 7 家；yfinance 預估是取得當下快照，股價 90 天變化以批次收盤日為終點，兩者日期可能差幾天；取得 2026-11-13。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;來源類別&lt;/th&gt;&lt;th&gt;數值&lt;/th&gt;&lt;th&gt;過熱訊號&lt;/th&gt;&lt;th&gt;說明／存檔位置&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;隱含假設罕見度&lt;/td&gt;&lt;td&gt;基本面預期&lt;/td&gt;&lt;td&gt;歷史罕見&lt;/td&gt;&lt;td&gt;有&lt;/td&gt;&lt;td&gt;價值判斷.json#/市價隱含假設&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;倍數擴張&lt;/td&gt;&lt;td&gt;倍數重估&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;不適用&lt;/td&gt;&lt;td&gt;EPS 年化變動 +125%，超過 ±50%（基期失真）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;預估背離&lt;/td&gt;&lt;td&gt;倍數重估&lt;/td&gt;&lt;td&gt;+1y（財年未對應） EPS 預估 90 天 +24.2%（上修；90 天變化 ±2% 內視為持平），同期股價 -28.5% → 預估未跟上下跌，偏情緒&lt;/td&gt;&lt;td&gt;無&lt;/td&gt;&lt;td&gt;價值判斷.json#/預估修正&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;本益比水位&lt;/td&gt;&lt;td&gt;倍數重估&lt;/td&gt;&lt;td&gt;現在 19.7 倍，自身五年 p75 75.8 倍&lt;/td&gt;&lt;td&gt;無&lt;/td&gt;&lt;td&gt;市場資料/歷史本益比.json#/pe_p75&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股債利差&lt;/td&gt;&lt;td&gt;總經與利率&lt;/td&gt;&lt;td&gt;近期百分位 100%（0% 最貴）&lt;/td&gt;&lt;td&gt;無&lt;/td&gt;&lt;td&gt;市場資料/歷史本益比.json#/股債利差/近期百分位&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;整體市場風險溢價&lt;/td&gt;&lt;td&gt;總經與利率&lt;/td&gt;&lt;td&gt;Damodaran 隱含風險溢價 4.20%（2026-10-01）&lt;/td&gt;&lt;td&gt;不適用&lt;/td&gt;&lt;td&gt;只存當月值，沒有歷史序列可比中位數；要下載 Damodaran 歷史表需使用者同意&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;動能&lt;/td&gt;&lt;td&gt;資金與情緒&lt;/td&gt;&lt;td&gt;相對 200 日均線 -24%；12 個月（2025-11-14 起） -18% 對 S&amp;amp;P500 +10%&lt;/td&gt;&lt;td&gt;無&lt;/td&gt;&lt;td&gt;市場資料/市場溫度.json#/趨勢、#/動能&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;部位與衍生品&lt;/td&gt;&lt;td&gt;資金與情緒&lt;/td&gt;&lt;td&gt;選擇權賣權對買權量比 偏熱；空單分位 35%、回補天數分位 70%&lt;/td&gt;&lt;td&gt;無&lt;/td&gt;&lt;td&gt;股價在 200 日均線下且 12 個月下跌，熱度不視為溢價來源&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;擁擠度&lt;/td&gt;&lt;td&gt;資金與情緒&lt;/td&gt;&lt;td&gt;20 日均換手率在自身五年 35% 分位；被發現程度 高&lt;/td&gt;&lt;td&gt;無&lt;/td&gt;&lt;td&gt;市場資料/市場溫度.json#/流動性/20日均換手率_分位&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;股價漲跌拆解：EPS 成長 vs 本益比變化（年化對數點，推導；不含股利、申報 EPS）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;期間&lt;/th&gt;&lt;th&gt;股價年化&lt;/th&gt;&lt;th&gt;EPS 貢獻&lt;/th&gt;&lt;th&gt;本益比貢獻&lt;/th&gt;&lt;th&gt;本益比&lt;/th&gt;&lt;th&gt;主因&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;1年&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;EPS 年化變動 +125%，超過 ±50%（基期失真）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;3年&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;EPS 年化變動 +167%，超過 ±50%（基期失真）&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;門檻：使用者 2026-11-04 照草案核定（程式/市場溢價來源.py 常數）。各列只描述市場面，不改合理價值、研究評等與價格位置，非買賣建議。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;multiple-conditions&quot;&gt;&lt;h3&gt;長期倍數條件：要漲 3／5／10 倍需要什麼&lt;/h3&gt;&lt;p&gt;反過來問：股價要在 5 年或 10 年內每股漲到 3、5、10 倍，期末營收、利潤率、估值倍數要做到多少，歷史上同規模公司有多少做到過。&lt;b&gt;條件反推，非預測、非機率、非目標價、非買賣建議&lt;/b&gt;；不改研究評等、價格位置與目標區間。&lt;/p&gt;&lt;p class=&quot;cap&quot;&gt;主列＝產業倍數＋基準穩態利潤率；括號是三種期末倍數口徑（不重估、產業、自身本益比 p25）的範圍。股數年稀釋率 -0.7%（推導）。罕見度：5 年用自有 SEC 名目分布、10 年用 Base Rate Book（1950–2015，實質）。&lt;/p&gt;&lt;ul&gt;&lt;li&gt;3 倍／5 年：營收年增約 13.0%（2 種期末倍數口徑 13.0%–33.6%），樂觀（營收 500 億美元以上的公司 5 年約 17.8% 做到）；資金自足&lt;/li&gt;&lt;li&gt;3 倍／10 年：營收年增約 5.9%（2 種期末倍數口徑 5.9%–15.1%），一般（營收 500 億美元以上的公司 10 年約 58.9% 做到）；資金自足&lt;/li&gt;&lt;li&gt;5 倍／5 年：營收年增約 25.2%（2 種期末倍數口徑 25.2%–48.0%），歷史罕見（營收 500 億美元以上的公司 5 年約 1.3% 做到）；資金自足&lt;/li&gt;&lt;li&gt;5 倍／10 年：營收年增約 11.5%（2 種期末倍數口徑 11.5%–21.2%），樂觀（營收 500 億美元以上的公司 10 年約 21.1% 做到）；資金自足&lt;/li&gt;&lt;li&gt;10 倍／5 年：營收年增約 43.9%（2 種期末倍數口徑 43.9%–70.1%），歷史罕見（營收 500 億美元以上的公司 5 年約 0% 做到）；資金自足&lt;/li&gt;&lt;li&gt;10 倍／10 年：營收年增約 19.5%（2 種期末倍數口徑 19.5%–29.9%），歷史罕見（營收 500 億美元以上的公司 10 年約 0.9% 做到）；資金自足&lt;/li&gt;&lt;/ul&gt;&lt;details&gt;&lt;summary&gt;全部格子&lt;/summary&gt;&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;倍數／期間&lt;/th&gt;&lt;th&gt;期末倍數口徑&lt;/th&gt;&lt;th&gt;利潤率口徑&lt;/th&gt;&lt;th&gt;需要營收年增&lt;/th&gt;&lt;th&gt;期末營收為現在&lt;/th&gt;&lt;th&gt;罕見度&lt;/th&gt;&lt;th&gt;資金&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;3 倍／5 年&lt;/td&gt;&lt;td&gt;不重估（22.4）&lt;/td&gt;&lt;td&gt;近四季（65.2%）&lt;/td&gt;&lt;td&gt;24.0%&lt;/td&gt;&lt;td&gt;2.9 倍&lt;/td&gt;&lt;td&gt;歷史罕見&lt;/td&gt;&lt;td&gt;自足&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;3 倍／5 年&lt;/td&gt;&lt;td&gt;不重估（22.4）&lt;/td&gt;&lt;td&gt;基準穩態（45.0%）&lt;/td&gt;&lt;td&gt;33.6%&lt;/td&gt;&lt;td&gt;4.3 倍&lt;/td&gt;&lt;td&gt;歷史罕見&lt;/td&gt;&lt;td&gt;自足&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;3 倍／5 年&lt;/td&gt;&lt;td&gt;產業（51.7）&l
