ot;img&quot; aria-label=&quot;內部人&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;189.0&quot; x2=&quot;189.0&quot; y1=&quot;6&quot; y2=&quot;216&quot; class=&quot;zero&quot;/&gt;&lt;text x=&quot;179&quot; y=&quot;23&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;Stevens（非計畫賣出）&lt;/text&gt;&lt;rect x=&quot;189.0&quot; y=&quot;9&quot; width=&quot;230.0&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--neg)&quot;/&gt;&lt;text x=&quot;427.0&quot; y=&quot;23&quot; class=&quot;val&quot;&gt;1,354&lt;/text&gt;&lt;text x=&quot;179&quot; y=&quot;63&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;Teter（預設計畫賣出）&lt;/text&gt;&lt;rect x=&quot;189.0&quot; y=&quot;49&quot; width=&quot;2.3&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;199.3&quot; y=&quot;63&quot; class=&quot;val&quot;&gt;13&lt;/text&gt;&lt;text x=&quot;179&quot; y=&quot;103&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;Kress（預設計畫賣出）&lt;/text&gt;&lt;rect x=&quot;189.0&quot; y=&quot;89&quot; width=&quot;2.0&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;198.3&quot; y=&quot;103&quot; class=&quot;val&quot;&gt;7.6&lt;/text&gt;&lt;text x=&quot;179&quot; y=&quot;143&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;Neal（非計畫賣出）&lt;/text&gt;&lt;rect x=&quot;189.0&quot; y=&quot;129&quot; width=&quot;2.0&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--neg)&quot;/&gt;&lt;text x=&quot;197.6&quot; y=&quot;143&quot; class=&quot;val&quot;&gt;3.3&lt;/text&gt;&lt;text x=&quot;179&quot; y=&quot;183&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;Dabiri（預設計畫賣出）&lt;/text&gt;&lt;rect x=&quot;189.0&quot; y=&quot;169&quot; width=&quot;2.0&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;197.0&quot; y=&quot;183&quot; class=&quot;val&quot;&gt;0.1&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;生意品質：A（規則：無「弱」且至少三項「強」＝A）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;評等&lt;/th&gt;&lt;th&gt;理由&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;護城河&lt;/td&gt;&lt;td&gt;強&lt;/td&gt;&lt;td&gt;近四季毛利率 74.7%、營業利益率 65.2%（財務指標.json）；CUDA 轉換成本有非管理層 SEC 申報佐證（GSI Technology、SharonAI 10-K，NVDA-C01）；限制：客製推論晶片追近（CNBC 2026-08-26，NVDA-C01、NVDA-C10）。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;投入資本報酬與增量回報&lt;/td&gt;&lt;td&gt;強&lt;/td&gt;&lt;td&gt;近四季 ROIC 242.7%、2024-01-28～2026-01-25 增量 ROIC 185.8%（財務指標.json，營運投入資本口徑；NVDA-C14）；屬景氣高峰數字，FY2023 含商譽口徑 18.5%（超額報酬期間檢查.json）。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;自由現金流品質&lt;/td&gt;&lt;td&gt;中&lt;/td&gt;&lt;td&gt;近四季自由現金流 127,006 為淨利 192,879 的 66%：應收年增高於營收 43 個百分點、存貨天數約 150 天（成長推估底稿.json、財務指標.json），淨利另含權益證券未實現利益（10-Q 2026-07-26 Item 2 ¶76）；NVDA-C08。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;資產負債表&lt;/td&gt;&lt;td&gt;強&lt;/td&gt;&lt;td&gt;有息負債÷EBITDA 0.17 倍、現金與證券÷一年內到期債務 22 倍（融資償債底稿.json；NVDA-C13）；推導信用等級 AAA（信用與存活.json）；表外 SB Energy 保證上限 1,050 億與供應承諾 2,790 億（10-Q Note 10 ¶209–¶211、Item 2 ¶16；NVDA-C11）未計入倍數。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;治理與資本配置&lt;/td&gt;&lt;td&gt;中&lt;/td&gt;&lt;td&gt;近四季回購 55,315、股利 6,776，稀釋股數略降（NVDA-C15）；但對客戶的保證與策略投資擴大（NVDA-C11），且創辦人執行長 2026-11-11 在醜聞中辭任、財務長暫代、另設首位董事會主席（8-K 2026-11-12 §2–§3；NVDA-C12），維持中、列下修條件（調查揭露公司層級違規）。&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;PEG 三口徑、林區資產負債表檢查與 F 分數等交叉檢查（算法與完整表見&lt;a href=&quot;#wp-value&quot;&gt;計算底稿 價值判斷&lt;/a&gt;）。&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;capital&quot;&gt;&lt;div class=&quot;qno&quot;&gt;問題 06&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;管理層怎麼用錢、怎麼管資產？&lt;/div&gt;&lt;h2&gt;錢多用在回購與綁住客戶，治理因執行長辭任降溫。&lt;/h2&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;資金去向：近四季自由現金流 1,270 億美元，回購 553 億、股利 68 億、員工代扣稅 91 億、併購 12 億（財務指標）。&lt;/strong&gt;另於 2026-06 發行約 250 億美元票據，公司寫一般公司用途、未細分（融資償債判讀）。借錢與回購同時發生只能當線索，不能說借錢回購。&lt;/p&gt;&lt;p&gt;反方是表外承諾擴大：對 SB Energy 租約保證上限 1,050 億、雲端服務承諾 290 億、股權投資承諾 250 億&lt;span class=&quot;src&quot;&gt;（10-Q 2026-07-26 Note 10）&lt;/span&gt;，把客戶 AI 建置的風險部分搬到輝達身上（NVDA-C11）。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;近四季營運現金流的去向（億美元）：第一列為營運現金流，往下逐項扣除，最後一列為剩餘或缺口&lt;/p&gt;&lt;svg viewBox=&quot;0 0 500 298&quot; role=&quot;img&quot; aria-label=&quot;資金去向&quot; class=&quot;chart&quot; style=&quot;max-width:650px&quot;&gt;&lt;line x1=&quot;150.0&quot; x2=&quot;150.0&quot; y1=&quot;6&quot; y2=&quot;294&quot; class=&quot;zero&quot;/&gt;&lt;text x=&quot;140&quot; y=&quot;37.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;近四季營運現金流&lt;/text&gt;&lt;rect x=&quot;150.0&quot; y=&quot;22.0&quot; width=&quot;275.0&quot; height=&quot;20&quot; rx=&quot;4&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;近四季營運現金流：1,344&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;433.0&quot; y=&quot;37.0&quot; class=&quot;val&quot;&gt;1,344&lt;/text&gt;&lt;line x1=&quot;425.0&quot; x2=&quot;425.0&quot; y1=&quot;42.0&quot; y2=&quot;62.0&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;1&quot; stroke-dasharray=&quot;2 3&quot;/&gt;&lt;text x=&quot;140&quot; y=&quot;77.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;回購&lt;/text&gt;&lt;rect x=&quot;311.8&quot; y=&quot;62.0&quot; width=&quot;113.2&quot; height=&quot;20&quot; rx=&quot;4&quot; fill=&quot;var(--c2)&quot;&gt;&lt;title&gt;回購：−553&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;433.0&quot; y=&quot;77.0&quot; class=&quot;val&quot;&gt;−553&lt;/text&gt;&lt;line x1=&quot;311.8&quot; x2=&quot;311.8&quot; y1=&quot;82.0&quot; y2=&quot;102.0&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;1&quot; stroke-dasharray=&quot;2 3&quot;/&gt;&lt;text x=&quot;140&quot; y=&quot;117.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;股利&lt;/text&gt;&lt;rect x=&quot;297.9&quot; y=&quot;102.0&quot; width=&quot;13.9&quot; height=&quot;20&quot; rx=&quot;4&quot; fill=&quot;var(--c2)&quot;&gt;&lt;title&gt;股利：−67.8&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;319.8&quot; y=&quot;117.0&quot; class=&quot;val&quot;&gt;−67.8&lt;/text&gt;&lt;line x1=&quot;297.9&quot; x2=&quot;297.9&quot; y1=&quot;122.0&quot; y2=&quot;142.0&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;1&quot; stroke-dasharray=&quot;2 3&quot;/&gt;&lt;text x=&quot;140&quot; y=&quot;157.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;員工股票代扣稅&lt;/text&gt;&lt;rect x=&quot;279.3&quot; y=&quot;142.0&quot; width=&quot;18.6&quot; height=&quot;20&quot; rx=&quot;4&quot; fill=&quot;var(--c2)&quot;&gt;&lt;title&gt;員工股票代扣稅：−91.0&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;305.9&quot; y=&quot;157.0&quot; class=&quot;val&quot;&gt;−91.0&lt;/text&gt;&lt;line x1=&quot;279.3&quot; x2=&quot;279.3&quot; y1=&quot;162.0&quot; y2=&quot;182.0&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;1&quot; stroke-dasharray=&quot;2 3&quot;/&gt;&lt;text x=&quot;140&quot; y=&quot;197.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;資本支出&lt;/text&gt;&lt;rect x=&quot;264.2&quot; y=&quot;182.0&quot; width=&quot;15.1&quot; height=&quot;20&quot; rx=&quot;4&quot; fill=&quot;var(--c2)&quot;&gt;&lt;title&gt;資本支出：−73.5&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;287.3&quot; y=&quot;197.0&quot; class=&quot;val&quot;&gt;−73.5&lt;/text&gt;&lt;line x1=&quot;264.2&quot; x2=&quot;264.2&quot; y1=&quot;202.0&quot; y2=&quot;222.0&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;1&quot; stroke-dasharray=&quot;2 3&quot;/&gt;&lt;text x=&quot;140&quot; y=&quot;237.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;併購&lt;/text&gt;&lt;rect x=&quot;261.9&quot; y=&quot;222.0&quot; width=&quot;2.4&quot; height=&quot;20&quot; rx=&quot;4&quot; fill=&quot;var(--c2)&quot;&gt;&lt;title&gt;併購：−11.6&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;272.2&quot; y=&quot;237.0&quot; class=&quot;val&quot;&gt;−11.6&lt;/text&gt;&lt;line x1=&quot;261.9&quot; x2=&quot;261.9&quot; y1=&quot;242.0&quot; y2=&quot;262.0&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;1&quot; stroke-dasharray=&quot;2 3&quot;/&gt;&lt;text x=&quot;140&quot; y=&quot;277.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;剩餘&lt;/text&gt;&lt;rect x=&quot;150.0&quot; y=&quot;262.0&quot; width=&quot;111.9&quot; height=&quot;20&quot; rx=&quot;4&quot; fill=&quot;var(--c3)&quot;&gt;&lt;title&gt;剩餘：547&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;269.9&quot; y=&quot;277.0&quot; class=&quot;val&quot;&gt;547&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;shareholder-equity&quot;&gt;&lt;h3&gt;股東回報與權益（逐年）&lt;/h3&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;財年&lt;/th&gt;&lt;th&gt;股東權益（億美元）&lt;/th&gt;&lt;th&gt;ROE&lt;/th&gt;&lt;th&gt;每股帳面（美元，推導）&lt;/th&gt;&lt;th&gt;股利（億美元）&lt;/th&gt;&lt;th&gt;回購（億美元）&lt;/th&gt;&lt;th&gt;（股利＋回購）÷ 自由現金流&lt;/th&gt;&lt;th&gt;稀釋股數年變化&lt;/th&gt;&lt;th&gt;註記&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2017&lt;/td&gt;&lt;td&gt;57.6&lt;/td&gt;&lt;td&gt;32.6%&lt;/td&gt;&lt;td&gt;8.88&lt;/td&gt;&lt;td&gt;2.6&lt;/td&gt;&lt;td&gt;7.4&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;+14.1%&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2018&lt;/td&gt;&lt;td&gt;74.7&lt;/td&gt;&lt;td&gt;46.1%&lt;/td&gt;&lt;td&gt;11.82&lt;/td&gt;&lt;td&gt;3.4&lt;/td&gt;&lt;td&gt;9.1&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;-2.6%&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2019&lt;/td&gt;&lt;td&gt;93.4&lt;/td&gt;&lt;td&gt;49.3%&lt;/td&gt;&lt;td&gt;14.95&lt;/td&gt;&lt;td&gt;3.7&lt;/td&gt;&lt;td&gt;15.8&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;-1.1%&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2020&lt;/td&gt;&lt;td&gt;122&lt;/td&gt;&lt;td&gt;26.0%&lt;/td&gt;&lt;td&gt;4.94&lt;/td&gt;&lt;td&gt;3.9&lt;/td&gt;&lt;td&gt;0.0&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;+295.5%&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2021&lt;/td&gt;&lt;td&gt;169&lt;/td&gt;&lt;td&gt;29.8%&lt;/td&gt;&lt;td&gt;6.73&lt;/td&gt;&lt;td&gt;4.0&lt;/td&gt;&lt;td&gt;0.0&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;+1.5%&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2022&lt;/td&gt;&lt;td&gt;266&lt;/td&gt;&lt;td&gt;44.8%&lt;/td&gt;&lt;td&gt;10.50&lt;/td&gt;&lt;td&gt;4.0&lt;/td&gt;&lt;td&gt;0.0&lt;/td&gt;&lt;td&gt;5%&lt;/td&gt;&lt;td&gt;+1.0%&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2023&lt;/td&gt;&lt;td&gt;221&lt;/td&gt;&lt;td&gt;17.9%&lt;/td&gt;&lt;td&gt;0.88&lt;/td&gt;&lt;td&gt;4.0&lt;/td&gt;&lt;td&gt;100&lt;/td&gt;&lt;td&gt;274%&lt;/td&gt;&lt;td&gt;+889.0%&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2024&lt;/td&gt;&lt;td&gt;430&lt;/td&gt;&lt;td&gt;91.5%&lt;/td&gt;&lt;td&gt;1.72&lt;/td&gt;&lt;td&gt;4.0&lt;/td&gt;&lt;td&gt;95.3&lt;/td&gt;&lt;td&gt;37%&lt;/td&gt;&lt;td&gt;-0.5%&lt;/td&gt;&lt;td&gt;ROE 偏高，單年數字請對照投入資本報酬率&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2025&lt;/td&gt;&lt;td&gt;793&lt;/td&gt;&lt;td&gt;119.2%&lt;/td&gt;&lt;td&gt;3.20&lt;/td&gt;&lt;td&gt;8.3&lt;/td&gt;&lt;td&gt;337&lt;/td&gt;&lt;td&gt;57%&lt;/td&gt;&lt;td&gt;-0.5%&lt;/td&gt;&lt;td&gt;權益被回購壓低，ROE 偏高失真，請看投入資本報酬率&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2026&lt;/td&gt;&lt;td&gt;1,573&lt;/td&gt;&lt;td&gt;101.5%&lt;/td&gt;&lt;td&gt;6.42&lt;/td&gt;&lt;td&gt;9.7&lt;/td&gt;&lt;td&gt;401&lt;/td&gt;&lt;td&gt;42%&lt;/td&gt;&lt;td&gt;-1.2%&lt;/td&gt;&lt;td&gt;權益被回購壓低，ROE 偏高失真，請看投入資本報酬率&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;長期財務.json（股東權益、稀釋股數〔分割調整〕、總資產；每股帳面＝股東權益 ÷ 稀釋股數，推導；股利支付、回購、營運現金流、資本支出在財務歷史.json 沒有該年時用）；產業指標.json 逐年（ROE）；財務歷史.json annual（股利、回購、營運現金流、資本支出）。用到：財務歷史、長期財務。ROE 註記門檻：ROE 高於 60% 或股東權益 ÷ 總資產低於 10%；近三年回購合計達當年股東權益 50% 以上才歸因於回購。（股利＋回購）÷ 年底市值：專案沒有逐年年底市值資料，不列該欄。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;capital-plain&quot;&gt;&lt;h3&gt;融資與償債：還不還得起&lt;/h3&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;b&gt;信用評級&lt;/b&gt;　機構 未揭露（10-K、10-Q、8-K、SEC 全文搜尋 查無 S&amp;amp;P、Moody&amp;#x27;s、Fitch、KBRA 評級）／推導 AAA（Damodaran 合成評等，利息保障 425.8 倍，近四季新借款多、利息偏低、評級可能偏高，推導）｜依推導：投資等級（BBB-／Baa3 以上）&lt;/p&gt;&lt;p&gt;&lt;b&gt;存活檢查（12～24 個月，推導，非違約預測）&lt;/b&gt;　無明顯警訊（推導，非違約預測）：現金與證券 566 億美元，一年內到期債務 10 億美元（另利息 464.0 百萬美元），可付 38.7 倍；兩年內到期債務未取得；利息保障 425.8 倍（新借款多、利息偏低，倍數可能偏高）；會計師未提出繼續經營疑慮。&lt;/p&gt;&lt;p&gt;&lt;b&gt;利率壓力測試&lt;/b&gt;　+200bp 後利息保障 425.8 倍（不含再融資）（目前 425.8 倍，推導）&lt;/p&gt;&lt;p&gt;&lt;b&gt;借款用途&lt;/b&gt;　再融資無關；2026-06 發行 250 億美元優先無擔保票據，公司寫明用於一般公司用途，用途未細分（回購、投資或承諾皆有可能，只算線索）&lt;/p&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;償債指標、融資活動表、存活檢查明細與利率壓力測試（算法與完整表見&lt;a href=&quot;#wp-6&quot;&gt;計算底稿 6&lt;/a&gt;）。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;財務管理&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;財務管理保守，償債能力強：有息負債 33,366 百萬美元，一年內到期只有 10 億美元，商業本票額度 250 億期末無餘額（融資償債判讀）。&lt;/strong&gt;近四季借還款淨額 淨借入 24,896 百萬美元&lt;span class=&quot;src&quot;&gt;（作者校正：原文 10-Q 2026-07-26；Part I, Item 1 ¶38；Part I, Item 2 ¶105；10-K 2026-01-25 Item 15 ¶51）&lt;/span&gt;，主要是 2026-06 的新票據。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;資產變化&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;應收帳款年增 127%、存貨年增 111%，都快於營收 83%（財務指標）。&lt;/strong&gt;存貨增加可由供應承諾與新平台量產部分解釋；應收方面，公司在 10-Q 說是對部分投資等級客戶的大型多季合約延長付款期限&lt;span class=&quot;src&quot;&gt;（10-Q 2026-07-26 Part I, Item 2 ¶88）&lt;/span&gt;，列為已解釋，但會延後現金回收，持續追蹤。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;公司內部治理&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;治理維持中、列下修條件：創辦人執行長 2026-11-11 辭任，財務長兼任暫代執行長，另設首位董事會主席並啟動搜尋&lt;span class=&quot;src&quot;&gt;（8-K 2026-11-12 §2–§3）&lt;/span&gt;。&lt;/strong&gt;間諜指控未證實（新聞 N5）；若調查揭露公司層級違規，治理降為弱（NVDA-C12）。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;業務治理&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;我們的判讀：用保證與策略投資幫客戶取得算力，短期擴大需求，長期增加循環融資風險（新聞 N4）。&lt;/strong&gt;Hugging Face 收購約 119 億美元加 10 億留任股票，屬生態延伸，金額占自由現金流約一成&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;資產變化訊號（對去年同期季末）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;signals&quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;變化&lt;/th&gt;&lt;th&gt;同期營收&lt;/th&gt;&lt;th&gt;判讀&lt;/th&gt;&lt;th&gt;說明&lt;/th&gt;&lt;th&gt;出處&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;應收帳款&lt;/td&gt;&lt;td&gt;+126.8%&lt;/td&gt;&lt;td&gt;+83.4%&lt;/td&gt;&lt;td class=&quot;st-已解釋&quot;&gt;已解釋&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;公司說是對部分投資等級客戶的大型多季合約延長付款期限；五家直接客戶占應收七成&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;10-Q 2026-07-26 Part I, Item 2 ¶88；Item 1 ¶124&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;存貨&lt;/td&gt;&lt;td&gt;+111.0%&lt;/td&gt;&lt;td&gt;+83.4%&lt;/td&gt;&lt;td class=&quot;st-部分解釋&quot;&gt;部分解釋&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;供應與產能承諾由 1,190 億增至 2,790 億、Vera Rubin 量產&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;10-Q 2026-07-26 Item 2 ¶16&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;應付帳款&lt;/td&gt;&lt;td&gt;+66.1%&lt;/td&gt;&lt;td&gt;+83.4%&lt;/td&gt;&lt;td class=&quot;st-已解釋&quot;&gt;已解釋&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;增速低於營收，未見拉長付款&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;財務指標.json 資產變化訊號&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;不動產廠房設備&lt;/td&gt;&lt;td&gt;+56.3%&lt;/td&gt;&lt;td&gt;+83.4%&lt;/td&gt;&lt;td class=&quot;st-已解釋&quot;&gt;已解釋&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;增速低於營收，近四季資本支出 74 億&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;財務指標.json 近四季資金&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;白話說&lt;/b&gt;近四季每 100 元自由現金流，約 44 元回購、5 元發股利、7 元幫員工代扣稅。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;要留意&lt;/b&gt;回購有一部分在抵銷員工股票，見第四題。&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;events&quot;&gt;&lt;div class=&quot;qno&quot;&gt;問題 07&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;近半年發生了什麼重大事件？&lt;/div&gt;&lt;h2&gt;執行長辭任與參院聽證，是近半年最大事件。&lt;/h2&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;近半年最大事件是創辦人執行長辭任：8-K 2026-11-12 公告黃仁勳 11-11 辭任，收盤價 162.85 美元 已在公告後交易。&lt;/strong&gt;我們不改估值，治理列下修條件；下一個檢驗點是 FY2027 Q3 財報&lt;span class=&quot;src&quot;&gt;（約 2026-11-17，8-K 2026-11-12 本文 §11）&lt;/span&gt;與參院聽證（12-03、12-10，新聞 N8），都在收盤日後。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;其他事件多是在擴大生態：發債 250 億、對 SB Energy 保證、收購 Hugging Face。&lt;/strong&gt;限制：下表只列存檔的 8-K 與新聞，不代表所有事件。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;近半年 8-K 重大事件&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;依申報日排序；對論點的影響為作者判斷。&lt;/p&gt;&lt;p&gt;表外人事 8-K（5.02）：01-23 董事 Persis Drell 辭任；04-27 Scott Gawel 接任會計長；05-08 新董事 Suzanne Nora Johnson；07-02 Nicholas Parker 接替退休的 Ajay Puri 管全球業務；03-06 為主管薪酬計畫&lt;span class=&quot;src&quot;&gt;（各 8-K §2–§3）&lt;/span&gt;。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;figure&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt signals&quot;&gt;&lt;tr&gt;&lt;th&gt;日期&lt;/th&gt;&lt;th&gt;事件&lt;/th&gt;&lt;th&gt;對論點的影響&lt;/th&gt;&lt;th&gt;出處&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2026-11-12&lt;/td&gt;&lt;td&gt;黃仁勳辭任；財務長 Colette Kress（輝達財務長，暫代執行長）暫代執行長，Harvey C. Jones（輝達首位董事會主席）任董事會主席&lt;/td&gt;&lt;td&gt;治理與關鍵人物風險升高；不改估值&lt;/td&gt;&lt;td&gt;8-K 2026-11-12 本文 §2–§3&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2026-09-03&lt;/td&gt;&lt;td&gt;簽約收購 Hugging Face，約 119 億美元，另 10 億留任股票&lt;/td&gt;&lt;td&gt;生態延伸，預計 2027 上半年完成&lt;/td&gt;&lt;td&gt;8-K 2026-09-03 本文 §1–§2&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2026-08-26&lt;/td&gt;&lt;td&gt;Q2 營收 962 億、年增 106%；Q3 指引 1,080 億&lt;/td&gt;&lt;td&gt;支持近期成長&lt;/td&gt;&lt;td&gt;8-K 2026-08-26 本文 §33–§34、新聞稿 §4&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2026-08-17&lt;/td&gt;&lt;td&gt;對 SB Energy 俄亥俄約 4.25 GW 租約提供殘值保證&lt;/td&gt;&lt;td&gt;表外風險擴大&lt;/td&gt;&lt;td&gt;8-K 2026-08-17 本文 §3&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2026-06-18&lt;/td&gt;&lt;td&gt;發行多檔優先無擔保票據約 250 億&lt;/td&gt;&lt;td&gt;負債上升，仍很低&lt;/td&gt;&lt;td&gt;10-Q 2026-07-26 Part I, Item 2 ¶105&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;白話說&lt;/b&gt;就像主廚突然離職的名店，菜單不變，但客人要等幾季才知道味道變不變。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;要留意&lt;/b&gt;Q3 財報與參院聽證都在收盤日後，報告數字未反映。&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;news&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;近期新聞查證&lt;/p&gt;&lt;h3&gt;新聞指向同一件事：成長還在，風險在人、政策與客戶。&lt;/h3&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;我們從 CNBC（美國財經電視台）、Fortune（美國財經雜誌）與 TrendForce（台灣市場研究機構）選八則與論點相關的新聞，引句都對過原文；Reuters 兩則有付費牆不引用。&lt;/strong&gt;分析師說法與匿名消息只當待驗證訊號，下表放比重最高的五則。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;新聞摘要（依日期排序）&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;日期&lt;/th&gt;&lt;th&gt;媒體&lt;/th&gt;&lt;th&gt;新聞&lt;/th&gt;&lt;th&gt;我們的判讀&lt;/th&gt;&lt;th&gt;對應主張&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2026-08-17&lt;/td&gt;&lt;td&gt;CNBC&lt;/td&gt;&lt;td&gt;輝達為 OpenAI 俄亥俄資料中心提供最高 1,050 億融資支持&lt;/td&gt;&lt;td&gt;金額與 10-Q Note 10 一致，循環融資疑慮成立&lt;/td&gt;&lt;td&gt;NVDA-C11&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2026-08-26&lt;/td&gt;&lt;td&gt;CNBC&lt;/td&gt;&lt;td&gt;OpenAI 自研推論晶片進展，威脅輝達推論毛利&lt;/td&gt;&lt;td&gt;分析師說法；訓練端仍領先，推論端壓力是真的&lt;/td&gt;&lt;td&gt;NVDA-C01&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2026-11-10&lt;/td&gt;&lt;td&gt;TrendForce&lt;/td&gt;&lt;td&gt;傳輝達可能放緩下單，AMD 與客製晶片對手受益&lt;/td&gt;&lt;td&gt;供應鏈傳聞，同文另稱訂單與產能暫未變，未證實&lt;/td&gt;&lt;td&gt;NVDA-C03&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2026-11-12&lt;/td&gt;&lt;td&gt;Fortune&lt;/td&gt;&lt;td&gt;執行長辭任後，輝達對新興 AI 雲端業者的保證被重新定價&lt;/td&gt;&lt;td&gt;分析師說法；報導的支撐上限公司申報未見，不進估值&lt;/td&gt;&lt;td&gt;NVDA-C11&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2026-11-13&lt;/td&gt;&lt;td&gt;CNBC&lt;/td&gt;&lt;td&gt;醜聞延燒到商務部長，參院排定 12-03、12-10 兩場聽證&lt;/td&gt;&lt;td&gt;聽證日期為事實；政策風險升高，結果待觀察&lt;/td&gt;&lt;td&gt;NVDA-C12&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;numbers&quot;&gt;&lt;div class=&quot;qno&quot;&gt;完整數字&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;三大報表摘要（年度與 8 季）&lt;/div&gt;&lt;h2&gt;營收、獲利、現金流與資產負債一次看&lt;/h2&gt;&lt;div class=&quot;grid2 wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;損益：年度與近四季（億美元）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 300&quot; role=&quot;img&quot; aria-label=&quot;損益（年度）&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;266.0&quot; y2=&quot;266.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;270.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;0.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;205.5&quot; y2=&quot;205.5&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;209.5&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;1,000&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;145.0&quot; y2=&quot;145.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;149.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;2,000&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;84.5&quot; y2=&quot;84.5&quot; class=&quot; ;&lt;title&gt;現金與短期投資 2026-07-26：566&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;439.7&quot; y=&quot;239.1&quot; width=&quot;36.0&quot; height=&quot;26.9&quot; rx=&quot;2&quot; fill=&quot;var(--neg)&quot;&gt;&lt;title&gt;借款（短期＋長期） 2026-07-26：334&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;477.6&quot; y=&quot;81.3&quot; width=&quot;36.0&quot; height=&quot;184.7&quot; rx=&quot;2&quot; fill=&quot;var(--c2)&quot;&gt;&lt;title&gt;股東權益 2026-07-26：2,290&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;458.7&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;2026-07-26&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c1)&quot;&gt;&lt;/i&gt;現金與短期投資&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--neg)&quot;&gt;&lt;/i&gt;借款（短期＋長期）&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c2)&quot;&gt;&lt;/i&gt;股東權益&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;數字取自 財務歷史.json（SEC 申報）；缺值不補、不畫。逐列表格見&lt;a href=&quot;#numbers-table&quot;&gt;附錄「完整數字表格」&lt;/a&gt;。&lt;/p&gt;&lt;/section&gt;&lt;/div&gt;
&lt;section class=&quot;q&quot; id=&quot;workpaper&quot; data-layer=&quot;計算底稿&quot;&gt;&lt;div class=&quot;qno&quot;&gt;計算底稿&lt;/div&gt;&lt;h2&gt;計算底稿：正文結果的算法與完整表（預設摺疊）&lt;/h2&gt;&lt;p class=&quot;wpnote&quot;&gt;正文每個估值、償債結果都從這裡算出；背景計算照做、送審照核。不讀也不影響理解結論；非買賣建議。&lt;/p&gt;&lt;details id=&quot;wp-3-4&quot;&gt;&lt;summary&gt;3・4 現金與股東：報表對帳與股東回報判讀&lt;/summary&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;現金流報表對帳&lt;/h3&gt;&lt;p&gt;報表對帳（10-Q 2026-07-26，現金、約當現金及受限現金）：期初 106＋營運 744＋投資 -351＋融資 -275＋其他 0.0＝期末 224 億美元｜完整&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;股東回報判讀表&lt;/h3&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;股東回報（判讀依估值政策門檻，2026-10-14 核定；不影響估值與價格位置）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;數值&lt;/th&gt;&lt;th&gt;判讀&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股利殖利率&lt;/td&gt;&lt;td&gt;0.17%&lt;/td&gt;&lt;td&gt;不評好壞：依估值政策，股利殖利率高低不設門檻（高殖利率常因股價下跌）；占股東收益率 11%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;回購殖利率&lt;/td&gt;&lt;td&gt;1.40%&lt;/td&gt;&lt;td&gt;不評好壞：近四季回購約 553.1 億美元，是市值 39,548.1 億美元的 1.40%；划不划算看「股東收益率」「淨回購」「回購均價」&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股東收益率（股利＋回購）&lt;/td&gt;&lt;td&gt;1.57%（公債的 31%）&lt;/td&gt;&lt;td&gt;不評好壞：主要靠成長，1.57% 只有 10 年期公債 5.10% 的 31%；回饋低是成長型公司的常態，改看成長&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;淨回購殖利率&lt;/td&gt;&lt;td&gt;1.22%&lt;/td&gt;&lt;td&gt;好：回購 1.40% 裡約 0.2 個百分點用來抵銷發給員工的股票，扣掉後仍淨回購 1.22%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股數年變化（1／3／10 財年）&lt;/td&gt;&lt;td&gt;-1.2%／-0.7%／+0.7%&lt;/td&gt;&lt;td&gt;中性：2026 財年對上一財年 -1.2%（減少）；近 3 財年平均每年 -0.7%（減少）；近 10 財年平均每年 +0.7%；分割調整後稀釋股數（推導）：長期財務.json 稀釋股數 2015–2018 標籤年（FY2016–FY2019）未換算 2021 年 4 比 1 分割、2019–2021 標籤年（FY2020–FY2022）未換算 2024 年 10 比 1 分割；前者 ×40、後者 ×10，2022 起已是分割後口徑。調整後 FY2016→FY2026 約 227.6 億→245.1 億股，十年大致持平&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;近十年有回購的年數&lt;/td&gt;&lt;td&gt;7／10&lt;/td&gt;&lt;td&gt;中性：只有 7 年有回購，未達政策「穩定」要求的 8 年&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股利連續成長年數&lt;/td&gt;&lt;td&gt;2&lt;/td&gt;&lt;td&gt;中性：連續 2 年調高，未達政策「近十年年年調高」&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股東回饋占自由現金流&lt;/td&gt;&lt;td&gt;48.89%&lt;/td&gt;&lt;td&gt;好：回饋只用掉近四季自由現金流的 49%，低於政策 80% 注意線，還留約 51%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;近四季回購均價（公開市場）&lt;/td&gt;&lt;td&gt;190.89&lt;/td&gt;&lt;td&gt;警示：均價 190.89 比合理價值上緣 116.32 高 64%，買得偏貴；依本報告估值，這段期間不是在低於內在價值時回購；依政策「治理與資本配置」最高只能評「中」；本次該項評「中」，評等不受影響&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;details id=&quot;wp-mkt&quot;&gt;&lt;summary&gt;市場背景：大盤一句、流動性、空單與參考值的資料日期與存檔&lt;/summary&gt;&lt;p class=&quot;cap&quot;&gt;大盤狀態（市場總覽；只揭露，不進研究評等、價格位置與合理價值）：S&amp;amp;P 500（以 SPY 代表）前十大持股合計 37.3%，最大產業科技 38.2%；那斯達克 100（QQQ）科技占 58.0%；等權重 RSP 減市值加權 SPY 近3個月報酬差 1.7 個百分點，位在 2003 年以來第 79 分位（持平）。高收益債利差 3.30，位在 2023 年以來第 81 分位（偏高）；金融狀況指數 -0.46，位在 1971 年以來第 44 分位（中性）；VIX 18.70，位在 1990 年以來第 56 分位（中性）；融資推估（聯準會，推估）0.74 兆美元（2026-06-30），年增 46.6%（第 92 分位，偏高），占國內公司股權市值 0.68%（第 8 分位，偏低）。（市場總覽收盤日 2026-11-12，市場/市場總覽.json）。&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;流動性、空單與參考值（只列事實與資料日期，不判冷熱、不是買賣訊號；非買賣建議）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;類別&lt;/th&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;數值&lt;/th&gt;&lt;th&gt;資料日期&lt;/th&gt;&lt;th&gt;說明與存檔&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;流動性&lt;/td&gt;&lt;td&gt;20 日均成交量&lt;/td&gt;&lt;td&gt;208,745,710 股&lt;/td&gt;&lt;td&gt;2026-11-13 收盤&lt;/td&gt;&lt;td&gt;90 日均量 139,399,608 股（20 日 ÷ 90 日 1.50 倍）｜市場資料/市場溫度.json#/量能&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;流動性&lt;/td&gt;&lt;td&gt;20 日均成交金額&lt;/td&gt;&lt;td&gt;385.2 億美元&lt;/td&gt;&lt;td&gt;2026-11-13 收盤&lt;/td&gt;&lt;td&gt;市場資料/市場溫度.json#/流動性/20日均成交金額&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;流動性&lt;/td&gt;&lt;td&gt;20 日均周轉率（每日）&lt;/td&gt;&lt;td&gt;0.87%&lt;/td&gt;&lt;td&gt;2026-11-13 收盤&lt;/td&gt;&lt;td&gt;20 日均量 ÷ SEC 封面流通股數（當時可得，依分割換算）；自身近 5 年第 30% 百分位｜市場資料/市場溫度.json#/流動性/20日均換手率&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;空單&lt;/td&gt;&lt;td&gt;放空比率（空單占流通股）&lt;/td&gt;&lt;td&gt;1.16%&lt;/td&gt;&lt;td&gt;2026-10-30 結算&lt;/td&gt;&lt;td&gt;空單 279,579,505 股；前一期（2026-10-15）301,622,687 股，減少 7.3%；FINRA 每月兩次公布的合併空單，取得 2026-11-14｜市場資料/市場溫度.json#/流動性/空單&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;空單&lt;/td&gt;&lt;td&gt;回補天數&lt;/td&gt;&lt;td&gt;2.80 天&lt;/td&gt;&lt;td&gt;2026-10-30 結算&lt;/td&gt;&lt;td&gt;空單 ÷ 日均量（FINRA 自身日均量）；自算 ÷ 90 日均量 2.01 天｜市場資料/市場溫度.json#/流動性/空單&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;參考值&lt;/td&gt;&lt;td&gt;52 週區間位置&lt;/td&gt;&lt;td&gt;0%&lt;/td&gt;&lt;td&gt;2026-11-13 收盤&lt;/td&gt;&lt;td&gt;0%＝52 週低 162.85、100%＝52 週高 239.24（收盤，推算）｜市場資料/市場溫度.json#/趨勢&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;參考值&lt;/td&gt;&lt;td&gt;近 12 個月股價報酬&lt;/td&gt;&lt;td&gt;-15.8%&lt;/td&gt;&lt;td&gt;2026-11-13 收盤&lt;/td&gt;&lt;td&gt;同期 S&amp;amp;P 500 +11.6%｜市場資料/市場溫度.json#/動能&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;參考值&lt;/td&gt;&lt;td&gt;60 日歷史年化波動&lt;/td&gt;&lt;td&gt;43.5%&lt;/td&gt;&lt;td&gt;2026-11-13 收盤&lt;/td&gt;&lt;td&gt;日報酬標準差年化（收盤）｜市場資料/市場溫度.json#/波動&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;參考值&lt;/td&gt;&lt;td&gt;距 200 日均線&lt;/td&gt;&lt;td&gt;-20.1%&lt;/td&gt;&lt;td&gt;2026-11-13 收盤&lt;/td&gt;&lt;td&gt;200 日均線 203.92｜市場資料/市場溫度.json#/趨勢&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;wide&quot;&gt;&lt;/div&gt;&lt;/details&gt;&lt;details id=&quot;wp-5&quot;&gt;&lt;summary&gt;5 估值：情境算式、市價隱含第 10 年倍數、同業與歷史倍數交叉核對、條件式區間算法、市價反推、溢價來源與作者計算說明&lt;/summary&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;作者計算說明&lt;/h3&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;價格位置推導：收盤價 162.85 美元 約是合理價值中點的 1.62 倍（收盤 2026-11-13 股價 162.85 美元 ÷ 合理價值中點 100.28 美元；只描述距離，非買賣建議）&lt;span class=&quot;src&quot;&gt;（收盤價 ÷ 加權中點，推導）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;情境參數：保守 25%、基準 50%、樂觀 25%。&lt;/strong&gt;基準營收成長 45%、18%、8%、5%、4%，營業利益率 65%→52%，衰退期 5 年後終值利潤率 45%；保守成長 30% 起、利潤率 62%→38%；樂觀成長 58% 起、利潤率 66%→59%。銷售對資本比 2.7，取近四季增量&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;。基準情境約 36% 價值來自明確預測期之後。偏離方法卡 7 正常化起點的敏感度&lt;span class=&quot;src&quot;&gt;（引擎試算，推導，不進合理價值；WACC 11.5%）&lt;/span&gt;：基準終值利潤率改用十一年平均 35.6%，基準每股 85.62（−10.1%）、加權中點 95.48（−4.8%）、合理價值區間 77.72–110.22；基準第 1 年到終值都用 35.6%，基準每股 66.76（−29.9%）、加權中點 86.05（−14.2%）、區間 68.94–100.39。收盤 162.85 都高於區間上緣，價格位置仍偏貴。另兩個情境也偏離方法卡 7 預設&lt;span class=&quot;src&quot;&gt;（引擎試算，推導，不進合理價值）&lt;/span&gt;：保守終值 33% 取十一年中位 32.5%、不用低點 14.9%，因終值是永續值，用單年谷底等於假設永久停在谷底（作者判斷）；改用 14.9%，加權中點 97.02（−3.3%），不確定性仍為高。樂觀終值 55% 未回到正常化 35.6%，因樂觀情境假設這輪循環不深，且 55% 仍低於近四季 65.2%（作者判斷）；改用 35.6%，加權中點 92.67（−7.6%），情境差距由 1.0007 降到 0.68，不確定性由高變中、安全邊際由 40% 變 30%，買入上限由 60.17 美元 變 64.87。情境差距只比中／高分界 1.0 多一點，分級由樂觀假設決定；作者維持樂觀假設，故不確定性維持高（作者判斷），買入上限對此假設敏感。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;折現率 11.5%：無風險 5.10%（FRED 10 年期公債 2026-11-12；收盤日當天未入檔），風險溢價 4.2%，beta 1.55＝2 年週 beta（Blume 調整）1.59 與 Damodaran 半導體產業 beta 重新加槓桿 1.50 的平均&lt;span class=&quot;src&quot;&gt;（負債權益比與 WACC 債務權重同為不含租賃口徑）&lt;/span&gt;，yfinance 五年 beta 2.25 只當上緣。&lt;/strong&gt;護城河分級寬（外部證據 S01–S03），風格成長，衰退期 5 年、永續期 ROIC 等於 WACC；改用衰退 5 年加產業錨點 27.2%，中點約 +8.0%（超額報酬期間檢查）。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;股權橋：現金 224 億；可交易債券 341 億、上市權益證券 428 億、非上市權益證券 512 億，合計 1,281 億，打 19% 折扣（作者判斷）後約 1,037 億、每股約 4.27 美元。&lt;/strong&gt;計算核對（11-11 版，股權橋項目不受股價影響）：拿掉證券中點約 −4.2%、其他請求權約 +0.3%&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;，未過 ±10% 門檻。表外 SB Energy 保證上限 1,050 億、雲端服務承諾 290 億、股權投資承諾 250 億屬或有或未來投資，不列請求權。&lt;/p&gt;&lt;p&gt;成長跑道六項（估值輸入 evidence_notes.成長跑道）：①市場空間與滲透率未揭露；②定價能力部分證據，近四季毛利率 74.7%、下季指引 74.0%；③營運槓桿，增量營業利益率 FY2023→FY2026 約 66.8%；④指引達成，近七季 7／7 超過上緣；⑤資金，自由現金流 1,270 億支應回購 553 億與股利 68 億，另發債 250 億；⑥新事業，邊緣運算 Q2 72 億、獲利未揭露。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;口徑：本益比 20.6 倍（申報 EPS（無非經常項目可扣） 7.91 美元；收盤 2026-11-13） 的欄位標示寫「扣非經常」，但 7.91 美元實際是申報 EPS，含權益證券未實現利益、沒有扣除；三個 PEG 也用這個本益比。&lt;/strong&gt;扣營業外收益的近似 EPS 約 6.80 美元，本益比約 23.9 倍&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;。同業倍數交叉核對區間 287.61–531.61 只作核對、不進評等；同業 AMD、MRVL 的本益比含併購攤銷，口徑不同。&lt;/p&gt;&lt;p&gt;半導體公版必看指標：十年利潤率區間 FY2016–FY2026 營業利益率 14.9%～62.4%&lt;span class=&quot;src&quot;&gt;（低點 FY2016 與 FY2023 約 15%，推導，長期財務.json）&lt;/span&gt;；研發占營收由 FY2023 的 27.2% 降到 FY2026 的 8.6%&lt;span class=&quot;src&quot;&gt;（營收成長快於研發，推導）&lt;/span&gt;；產品集中度為資料中心約占 FY2026 營收九成&lt;span class=&quot;src&quot;&gt;（10-K Item 15 Note 16）&lt;/span&gt;；產能利用率與訂單：未揭露（無晶圓廠，產能在代工廠；公司未揭露訂單出貨比或積壓訂單金額，只揭露供應與產能承諾）。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;!--新圖表--&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;缺口判斷影響幅度&lt;/h3&gt;&lt;div class=&quot;wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;市價隱含第 10 年倍數（倍）：基準折現率下市價隱含 22.5 倍、模型 7.4 倍（約 3.0 倍差距）；參考帶 p25–p75 7.8–27.6 倍（機械回測樣本，非市場全體；分產業的筆數與公司數少，僅供參考）；特例：獲利處於循環位置，倍數僅供參考。只描述，不進評等、不是目標價（估值結果.json#/market_implied_terminal）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 620 242&quot; role=&quot;img&quot; aria-label=&quot;市價隱含第 10 年倍數&quot; class=&quot;chart&quot; style=&quot;max-width:775px&quot;&gt;&lt;line x1=&quot;252.0&quot; x2=&quot;252.0&quot; y1=&quot;22&quot; y2=&quot;216&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;252.0&quot; y=&quot;234&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;0&lt;/text&gt;&lt;line x1=&quot;300.3&quot; x2=&quot;300.3&quot; y1=&quot;22&quot; y2=&quot;216&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;300.3&quot; y=&quot;234&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;5&lt;/text&gt;&lt;line x1=&quot;348.6&quot; x2=&quot;348.6&quot; y1=&quot;22&quot; y2=&quot;216&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;348.6&quot; y=&quot;234&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;10&lt;/text&gt;&lt;line x1=&quot;396.9&quot; x2=&quot;396.9&quot; y1=&quot;22&quot; y2=&quot;216&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;396.9&quot; y=&quot;234&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;15&lt;/text&gt;&lt;line x1=&quot;445.1&quot; x2=&quot;445.1&quot; y1=&q uot; height=&quot;22&quot; rx=&quot;4&quot; fill=&quot;var(--c1)&quot; opacity=&quot;.28&quot;&gt;&lt;title&gt;高–低折現率：6–9&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;308.4&quot; y=&quot;149.0&quot; class=&quot;ax&quot; text-anchor=&quot;start&quot;&gt;高–低折現率 6–9&lt;/text&gt;&lt;circle cx=&quot;323.9&quot; cy=&quot;123.0&quot; r=&quot;7&quot; fill=&quot;var(--c1)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;1.5&quot;&gt;&lt;title&gt;基準：7&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;323.9&quot; y=&quot;109.0&quot; class=&quot;val&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--c1)&quot;&gt;基準 7&lt;/text&gt;&lt;text x=&quot;242&quot; y=&quot;190.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;參考帶（跨產業）&lt;/text&gt;&lt;rect x=&quot;327.3&quot; y=&quot;174.0&quot; width=&quot;191.2&quot; height=&quot;22&quot; rx=&quot;4&quot; fill=&quot;var(--c7)&quot; opacity=&quot;.28&quot;&gt;&lt;title&gt;p25–p75：8–28&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;327.3&quot; y=&quot;211.0&quot; class=&quot;ax&quot; text-anchor=&quot;start&quot;&gt;p25–p75 8–28&lt;/text&gt;&lt;circle cx=&quot;401.7&quot; cy=&quot;185.0&quot; r=&quot;6&quot; fill=&quot;var(--c7)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;1.5&quot;&gt;&lt;title&gt;中位：16&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;401.7&quot; y=&quot;171.0&quot; class=&quot;val&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--c7)&quot;&gt;中位 16&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;缺口判斷影響幅度：拿掉各項作者判斷、其他不變時，合理價值中點的變動（計算核對.json，2026-11-11）；紅色為過門檻（中點±10%或價格位置跨界或生意等級理由），2 項中 0 項過門檻；虛線為 ±10%。正值＝拿掉後中點變高&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 100&quot; role=&quot;img&quot; aria-label=&quot;缺口判斷影響幅度&quot; class=&quot;chart&quot; style=&quot;max-width:700px&quot;&gt;&lt;line x1=&quot;330.0&quot; x2=&quot;330.0&quot; y1=&quot;6&quot; y2=&quot;94&quot; class=&quot;zero&quot;/&gt;&lt;line x1=&quot;192.9&quot; x2=&quot;192.9&quot; y1=&quot;4&quot; y2=&quot;96&quot; class=&quot;price&quot;/&gt;&lt;line x1=&quot;467.1&quot; x2=&quot;467.1&quot; y1=&quot;4&quot; y2=&quot;96&quot; class=&quot;price&quot;/&gt;&lt;text x=&quot;150&quot; y=&quot;25&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;1. 股權橋證券&lt;/text&gt;&lt;rect x=&quot;273.0&quot; y=&quot;11&quot; width=&quot;57.0&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;338.0&quot; y=&quot;25&quot; class=&quot;val&quot;&gt;-4.2%&lt;/text&gt;&lt;text x=&quot;150&quot; y=&quot;63&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;2. 其他請求權&lt;/text&gt;&lt;rect x=&quot;330.0&quot; y=&quot;49&quot; width=&quot;3.6&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;341.6&quot; y=&quot;63&quot; class=&quot;val&quot;&gt;+0.3%&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;/div&gt;&lt;!--/新圖表--&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;合理價值怎麼來：三個情境與權重&lt;/h3&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt&quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;每股價值（基準折現率 11.5%）&lt;/th&gt;&lt;th&gt;權重&lt;/th&gt;&lt;th&gt;折現率高端 13.9%&lt;/th&gt;&lt;th&gt;折現率低端 10.2%&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;57.70&lt;/td&gt;&lt;td&gt;25%&lt;/td&gt;&lt;td&gt;48.42&lt;/td&gt;&lt;td&gt;65.17&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;95.22&lt;/td&gt;&lt;td&gt;50%&lt;/td&gt;&lt;td&gt;77.57&lt;/td&gt;&lt;td&gt;109.78&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;152.98&lt;/td&gt;&lt;td&gt;25%&lt;/td&gt;&lt;td&gt;120.60&lt;/td&gt;&lt;td&gt;180.53&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;加權（合理價值）&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;b&gt;100.28&lt;/b&gt;&lt;/td&gt;&lt;td&gt;100%&lt;/td&gt;&lt;td&gt;&lt;b&gt;81.04&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;b&gt;116.32&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;中點是三個情境的加權：0.25×57.70＋0.5×95.22＋0.25×152.98≈100.28（一般權重組合）。區間上下緣是同樣三個情境、權重不變，只把折現率換成區間高端或低端重算後加權：高端約 13.9% → 81.04（下緣），低端約 10.2% → 116.32（上緣）。買入區上緣 60.17＝中點 × (1－安全邊際 40%，不確定性高)，股價在此以下才有 40% 安全邊際。情境表說明合理價值怎麼組成，不是單一目標價；非買賣建議。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;市價隱含第 10 年倍數（只描述，不進評等）&lt;/h3&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;基準情境：市價隱含 vs 模型假設的第 10 年 EV/EBIT（金額百萬美元）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;折現率&lt;/th&gt;&lt;th&gt;WACC&lt;/th&gt;&lt;th&gt;市場 EV&lt;/th&gt;&lt;th&gt;明示期現值&lt;/th&gt;&lt;th&gt;終值折現因子&lt;/th&gt;&lt;th&gt;第 10 年 EBIT&lt;/th&gt;&lt;th&gt;市價隱含倍數&lt;/th&gt;&lt;th&gt;模型終值倍數&lt;/th&gt;&lt;th&gt;隱含÷模型&lt;/th&gt;&lt;th&gt;現在 EV／次年 EBIT&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;低折現率&lt;/td&gt;&lt;td&gt;10.23%&lt;/td&gt;&lt;td&gt;3,868,576&lt;/td&gt;&lt;td&gt;1,498,789&lt;/td&gt;&lt;td&gt;0.378&lt;/td&gt;&lt;td&gt;325,163&lt;/td&gt;&lt;td&gt;19.3 倍&lt;/td&gt;&lt;td&gt;8.8 倍&lt;/td&gt;&lt;td&gt;2.19&lt;/td&gt;&lt;td&gt;13.5 倍&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;11.55%&lt;/td&gt;&lt;td&gt;3,868,576&lt;/td&gt;&lt;td&gt;1,414,387&lt;/td&gt;&lt;td&gt;0.335&lt;/td&gt;&lt;td&gt;325,163&lt;/td&gt;&lt;td&gt;22.5 倍&lt;/td&gt;&lt;td&gt;7.4 倍&lt;/td&gt;&lt;td&gt;3.02&lt;/td&gt;&lt;td&gt;13.5 倍&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;高折現率&lt;/td&gt;&lt;td&gt;13.90%&lt;/td&gt;&lt;td&gt;3,868,576&lt;/td&gt;&lt;td&gt;1,280,870&lt;/td&gt;&lt;td&gt;0.272&lt;/td&gt;&lt;td&gt;325,163&lt;/td&gt;&lt;td&gt;29.3 倍&lt;/td&gt;&lt;td&gt;5.8 倍&lt;/td&gt;&lt;td&gt;5.01&lt;/td&gt;&lt;td&gt;13.5 倍&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;算式：市場 EV＝模型 EV +（現價 − 模型每股價值）× 股數（股權橋與模型相同）；隱含倍數＝（市場 EV − 明示期現值）÷ 終值折現因子 ÷ 第 10 年 EBIT；模型終值倍數＝模型終值 ÷ 第 10 年 EBIT。參考帶：p25 7.8、中位 15.5、p75 27.6、p90 42.7 倍（機械回測樣本，非市場全體；分產業的筆數與公司數少，僅供參考；機械回測訓練期 2016–2021 全部回測日（審查工作區 回測資料/隱含倍數結果.json，1,810 筆中訓練期 1,046 筆；產業＝回測樣本的 Damodaran 產業）；重算：python3 程式/回測_隱含倍數參考帶.py &amp;lt;隱含倍數結果.json&amp;gt;）。只描述，不進價格位置、研究評等與合理價值。&lt;/p&gt;&lt;p class=&quot;cap&quot;&gt;特例：獲利處於循環位置，倍數僅供參考。&lt;/p&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;&lt;b&gt;合理價值 vs 市價隱含倍數（作者判讀）：&lt;/b&gt;市價隱含第 10 年 EV/EBIT 約 22.5 倍，是模型終值倍數 7.4 倍 的 3.02 倍；輝達處於景氣高峰，基期利潤率偏高，倍數只供參考。市價等於假設第 10 年仍是高成長、高利潤的公司，我們假設屆時回到成熟水準；只描述，不當評等理由。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;如果 10 年後倍數是 15.5 倍，機率加權每股約 140 美元（條件式，非目標價、非買賣建議，不進評等）&lt;/h3&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;第 10 年 EV/EBIT 倍數對照（三情境各用自己的明示期 FCFF 與第 10 年 EBIT；權重 一般：保守 25%／基準 50%／樂觀 25%；基準 WACC 11.55%）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;第 10 年倍數&lt;/th&gt;&lt;th&gt;機率加權每股（美元）&lt;/th&gt;&lt;th&gt;折現率低高區間&lt;/th&gt;&lt;th&gt;白話換算&lt;/th&gt;&lt;th&gt;現價相對&lt;/th&gt;&lt;th&gt;說明&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;模型假設倍數&lt;/td&gt;&lt;td&gt;7.4 倍&lt;/td&gt;&lt;td&gt;100.28&lt;/td&gt;&lt;td&gt;81.04–116.32&lt;/td&gt;&lt;td&gt;等於折現率減永續成長約 8.5%（模型 8.5%）&lt;/td&gt;&lt;td&gt;現價高於區間&lt;/td&gt;&lt;td&gt;各情境用自己的模型終值倍數（表列為基準情境）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;穩態理論上限&lt;/td&gt;&lt;td&gt;10.1 倍&lt;/td&gt;&lt;td&gt;113.11&lt;/td&gt;&lt;td&gt;98.00–123.03&lt;/td&gt;&lt;td&gt;等於折現率減永續成長約 6.3%（模型 8.5%）&lt;/td&gt;&lt;td&gt;現價高於區間&lt;/td&gt;&lt;td&gt;（1−t）（1+g）÷（WACC−g）：再投資為零（ROIC 無限大）時的上限；t＝第 10 年 1−NOPAT÷EBIT&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;參考帶中位（跨產業）&lt;/td&gt;&lt;td&gt;15.5 倍&lt;/td&gt;&lt;td&gt;139.95&lt;/td&gt;&lt;td&gt;119.78–153.25&lt;/td&gt;&lt;td&gt;等於折現率減永續成長約 4.1%（模型 8.5%）&lt;/td&gt;&lt;td&gt;現價高於區間&lt;/td&gt;&lt;td&gt;所選參考帶（跨產業）中位&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;同業今日 EV/EBIT 中位&lt;/td&gt;&lt;td&gt;63.2 倍&lt;/td&gt;&lt;td&gt;375.04&lt;/td&gt;&lt;td&gt;310.58–418.04&lt;/td&gt;&lt;td&gt;等於折現率減永續成長約 1.0%（模型 8.5%）&lt;/td&gt;&lt;td&gt;現價低於區間&lt;/td&gt;&lt;td&gt;估值結果 multiples.ev_ebit.peer_quartiles.p50（今天的倍數，不是 10 年後）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;參考帶 p75（跨產業）&lt;/td&gt;&lt;td&gt;27.6 倍&lt;/td&gt;&lt;td&gt;199.63&lt;/td&gt;&lt;td&gt;168.21–220.47&lt;/td&gt;&lt;td&gt;等於折現率減永續成長約 2.3%（模型 8.5%）&lt;/td&gt;&lt;td&gt;現價低於區間&lt;/td&gt;&lt;td&gt;所選參考帶（跨產業）p75&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;市價隱含&lt;/td&gt;&lt;td&gt;22.5 倍&lt;/td&gt;&lt;td&gt;174.55&lt;/td&gt;&lt;td&gt;147.86–192.22&lt;/td&gt;&lt;td&gt;等於折現率減永續成長約 2.8%（模型 8.5%）&lt;/td&gt;&lt;td&gt;現價在區間內&lt;/td&gt;&lt;td&gt;基準情境、基準折現率反推（只用基準情境，套到三情境後加權不必等於現價）&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;如果 10 年後倍數是 X，三情境各用自己的明示期 FCFF 與第 10 年 EBIT、以基準折現率折現，依政策情境機率權重加權的每股價值；區間只換折現率（①模型列為合理價值區間）。「折現率減永續成長」＝(1+g)(1−t)(1−g/ROIC)÷倍數（基準情境永續參數）。條件式，非目標價、非買賣建議，不進評等。模型假設倍數那一列等於合理價值（中點 100.28）。&lt;/p&gt;&lt;/div&gt;&lt;!--成長型價格參考--&gt;&lt;div class=&quot;block&quot; id=&quot;growth-ref&quot;&gt;&lt;h3&gt;成長型價格參考：報酬門檻價、五年報酬矩陣、林區比值（只描述，不進評等，非買賣建議）&lt;/h3&gt;&lt;p class=&quot;cap&quot;&gt;這一段只描述，不進研究評等、不改價格位置，也不是目標價；三種情境並列、不合成單一數字，數字是「該情境成真時」的條件式推算，不是預期報酬。非買賣建議。&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;一、報酬門檻價：收盤 2026-11-13 股價 162.85 美元（三情境並列；條件式推算，非目標價）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;年報酬 7% 的每股價格（美元）&lt;/th&gt;&lt;th&gt;年報酬 8% 的每股價格（美元）&lt;/th&gt;&lt;th&gt;年報酬 9% 的每股價格（美元）&lt;/th&gt;&lt;th&gt;年報酬 10% 的每股價格（美元）&lt;/th&gt;&lt;th&gt;現價隱含年報酬&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;100.65&lt;/td&gt;&lt;td&gt;85.39&lt;/td&gt;&lt;td&gt;74.69&lt;/td&gt;&lt;td&gt;66.73&lt;/td&gt;&lt;td&gt;5.1%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;183.57&lt;/td&gt;&lt;td&gt;150.88&lt;/td&gt;&lt;td&gt;128.82&lt;/td&gt;&lt;td&gt;112.86&lt;/td&gt;&lt;td&gt;7.6%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;331.88&lt;/td&gt;&lt;td&gt;262.33&lt;/td&gt;&lt;td&gt;217.67&lt;/td&gt;&lt;td&gt;186.45&lt;/td&gt;&lt;td&gt;11.0%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;算法：各情境的 10 年現金流與終值改用門檻當折現率，經同一股權橋換成每股；股價等於這個價格時，該情境成真的現價隱含年報酬就等於門檻（兩者互為反函數）。&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;二、五年報酬矩陣：現價買進、持有 5 年的年化報酬（三情境 × 三種第 5 年倍數；推導，條件式，非預期報酬）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;第 5 年 EBIT（估值輸入單位，推導）&lt;/th&gt;&lt;th&gt;維持現在 19.6 倍&lt;/th&gt;&lt;th&gt;縮四分之一 14.7 倍&lt;/th&gt;&lt;th&gt;回到參考帶中位（跨產業） 15.5 倍&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;173,215.4&lt;/td&gt;&lt;td&gt;1.9%&lt;/td&gt;&lt;td&gt;-3.1%&lt;/td&gt;&lt;td&gt;-2.2%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;317,905.4&lt;/td&gt;&lt;td&gt;15.1%&lt;/td&gt;&lt;td&gt;9.5%&lt;/td&gt;&lt;td&gt;10.5%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;505,970.4&lt;/td&gt;&lt;td&gt;26.2%&lt;/td&gt;&lt;td&gt;20.1%&lt;/td&gt;&lt;td&gt;21.3%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;算法：現價買進、持有 5 年：第 1–5 年自由現金流與第 5 年企業價值（倍數 × 該情境第 5 年 EBIT）折回今天、經今日股權橋與股數換成每股，解出使每股等於現價的年報酬（與現價隱含年報酬同一算法，只是第 5 年改用倍數計價）；不另估 5 年後的淨債務與股數。企業價值 ÷ 當年 EBIT 口徑與市價隱含第 10 年倍數、參考帶相同。推導。現在倍數＝市場企業價值 3,868,576.0 ÷ 近四季營業利益 197,579.0（估值輸入 company_metrics.ebit）＝19.6 倍；縮四分之一＝現在倍數 × 0.75。參考帶：跨產業層「跨產業」中位 15.5 倍（機械回測樣本，非市場全體；分產業的筆數與公司數少，僅供參考）。特例：獲利處於循環位置，倍數僅供參考。&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;三、林區比值（只給比值與口徑；成長率與本益比的口徑同「PEG 與林區檢查」表的基準情境推估那一列）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;數值&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;林區分類&lt;/td&gt;&lt;td&gt;快速成長&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;成長率（基準情境推估（稅後營業利益年增－股數年變化））&lt;/td&gt;&lt;td&gt;10.6%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;本益比&lt;/td&gt;&lt;td&gt;20.6 倍&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股息殖利率&lt;/td&gt;&lt;td&gt;0.2%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;本益比 ÷ 成長率&lt;/td&gt;&lt;td&gt;1.94&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;（成長率＋股息殖利率）÷ 本益比&lt;/td&gt;&lt;td&gt;0.52&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;林區以本益比約等於成長率為參考（二手來源轉述）；本表不設門檻。只給比值與口徑，不作便宜或昂貴的判斷，不進研究評等與價格位置。非買賣建議。&lt;/p&gt;&lt;/div&gt;&lt;!--/成長型價格參考--&gt;&lt;div class=&quot;note-box&quot;&gt;&lt;b&gt;同業與歷史倍數交叉核對（不進評等）：288–532 美元&lt;/b&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;依同業的本益比、企業價值／營業利益、企業價值／營收倍數換算的每股價值，各法 25 百分位的中位數到 75 百分位的中位數；不是股價波動範圍，也不是合理價值。原稱「市場情緒區間」；2026-11-11 起只作交叉核對，不決定價格位置與研究評等（價格位置三級：買入區、合理、偏貴，只看買入區上緣與合理價值高端）。同業僅 4 家，分位僅供參考。&lt;/p&gt;&lt;/div&gt;&lt;!--目標區間:第五題--&gt;&lt;div class=&quot;block&quot; id=&quot;target-body&quot;&gt;&lt;h3&gt;12 個月條件式目標區間：三種情境各自成真時的價值（條件式、非買賣建議）&lt;/h3&gt;&lt;p class=&quot;cap&quot;&gt;條件式目標區間：三種情境各自成真時的每股價值區間，不是股價預測，三段不合成單一數字；非買賣建議。不影響合理價值、價格位置與研究評等。&lt;/p&gt;&lt;p&gt;算法：各情境每股價值（折現率高低兩端）×（1＋股權成本 11.61%）− 未來 12 個月每股股利 0.28 美元（近四季實際每股股利 ＝ 價值判斷.json 股利殖利率 0.1706% × 現價 162.85（推導）；對照：價值判斷.json 每股股利（已調整）2025 年度 0.04（每股口徑；這裡是近四季股利總額 ÷ 估值股數，差在股數口徑與期間）；對照：市場快照 yfinance 當期年化股利率 1.00（與近四季實際差逾 10%，未採用，要改用請在 目標區間輸入.json 寫 每股股利_12個月））；回購不加回。起點 2026-11-13 收盤，終點 2027-11-13。三段是各情境在折現率上下兩端的每股價值向前推 12 個月，不是價格機率分布的切片；段與段之間可能有空白，也可能重疊。區間主要寬度來自折現率不確定，不是 12 個月內的營運變化。&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt&quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;機率（政策權重，未經歷史校準）&lt;/th&gt;&lt;th&gt;目標區間（美元）&lt;/th&gt;&lt;th&gt;相對現價&lt;/th&gt;&lt;th&gt;關鍵假設（估值輸入）&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;25%&lt;/td&gt;&lt;td&gt;&lt;b&gt;53.77–72.46&lt;/b&gt;&lt;/td&gt;&lt;td&gt;−67%～−56%&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;第 1 年營收 +30.0%；營業利益率 62.0%；穩態 33.0%；永續成長 2.5%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;50%&lt;/td&gt;&lt;td&gt;&lt;b&gt;86.30–122.25&lt;/b&gt;&lt;/td&gt;&lt;td&gt;−47%～−25%&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;第 1 年營收 +45.0%；營業利益率 65.0%；穩態 45.0%；永續成長 3.0%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;25%&lt;/td&gt;&lt;td&gt;&lt;b&gt;134.33–201.22&lt;/b&gt;&lt;/td&gt;&lt;td&gt;−18%～+24%&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;第 1 年營收 +58.0%；營業利益率 66.0%；穩態 55.0%；永續成長 3.5%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;口徑：報告中「現價隱含年報酬（基準情境，非預期報酬）約 7.6%」是以現價買進、持有該情境全期現金流（含永續價值）的年化報酬；這裡的目標區間是 12 個月後各情境每股價值的前推，兩者口徑不同，不能互相換算（例如不能用前者推 12 個月後的價格）。&lt;/p&gt;&lt;h4 style=&quot;margin-top:14px&quot;&gt;每一段要成立，市場這一面需要什麼、正在顯示什麼&lt;/h4&gt;&lt;ul class=&quot;prose&quot;&gt;&lt;li&gt;保守段代表值 64.1（基準折現率前推）要成立，一年後EV／營業利益需約 6.0 倍（現在 19.6 倍，低於現在倍數）；過去一年逐日重建的交易日中，99% 以上高於這個倍數、不到 1% 低於這個倍數（推導）；同規模同成長低於 p25。這是把價值翻成倍數的讀法，不是預測市場會給這個倍數。&lt;/li&gt;&lt;li&gt;基準段代表值 106.0（基準折現率前推）要成立，一年後EV／營業利益需約 8.7 倍（現在 19.6 倍，低於現在倍數）；過去一年逐日重建的交易日中，99% 以上高於這個倍數、不到 1% 低於這個倍數（推導）；同規模同成長低於 p25。這是把價值翻成倍數的讀法，不是預測市場會給這個倍數。&lt;/li&gt;&lt;li&gt;樂觀段代表值 170.5（基準折現率前推）要成立，一年後EV／營業利益需約 12.8 倍（現在 19.6 倍，低於現在倍數）；過去一年逐日重建的交易日中，99% 以上高於這個倍數、不到 1% 低於這個倍數（推導）；同規模同成長約第 37 百分位（p25–p75 間線性內插，推導）。這是把價值翻成倍數的讀法，不是預測市場會給這個倍數。&lt;/li&gt;&lt;li&gt;以 2027-12-17 到期選擇權的價平隱含波動 45.4%（2026-11-14 15:11 UTC 取得；最近成交 2026-11-13，不在取得當天；取價時現價 162.85，起點價 162.85 為 2026-11-13 收盤）定價，12 個月後（2027-11-13）價格落在保守段 3.9%、基準段 21%、樂觀段 34%；低於最低端（53.77） 1.0%、高於最高端（201.22） 28%、段與段之間空白 13%、段與段重疊 0.0%。這是風險中立機率，不是真實機率；不改情境權重、不改估值與評等；選擇權定價含風險溢酬與波動偏態，與三段情境機率是兩回事。報價品質：買權 50.6%、賣權 40.2% 相差 10 個百分點，報價可能過時或含偏斜，只作參考。&lt;/li&gt;&lt;li&gt;公債殖利率下降 1 個百分點時，保守／基準／樂觀段代表值（基準折現率前推，不是區間兩端的平均）為 69.5／116.7／190.8；目前 64.1／106.0／170.5；上升 1 個百分點時為 59.7／97.5／154.4（美元，股權成本同幅變動，其他假設不變）。&lt;/li&gt;&lt;li&gt;分析師預估：本財年每股盈餘預估 9.32，較 30 天前 9.31 +0.1%（持平），近 30 天 2 家上修、0 家下修；下一財年每股盈餘預估 15.93，較 30 天前 15.91 +0.1%（持平），近 30 天 7 家上修、0 家下修。只描述預估修正的方向，不當證據，也不是目標區間的任一端。&lt;/li&gt;&lt;li&gt;券商目標價近 90 天有 24 家調整：上調 7、下調 11、持平 6（只揭露，不是本報告的目標價）。&lt;/li&gt;&lt;li&gt;上季（Jul 2026，8/26/2026 公布）每股盈餘 2.22，共識預估 2.09，驚奇 6.22%（Nasdaq）；yfinance 另列 2026-07-31 實際 2.22、預估 2.09、驚奇 +6.16%；兩個來源口徑可能不同（可能是調整後或一般會計準則），公司申報的每股盈餘可對照存檔 8-K 2026-08-26 財報新聞稿（本句未逐項比對），只描述、不當證據。&lt;/li&gt;&lt;/ul&gt;&lt;p class=&quot;cap&quot;&gt;以上只引用已存檔的數字描述條件與現況，不是預測；選擇權機率是風險中立機率、不是真實機率，不改情境權重；分析師預估與券商目標價不當證據；細節表在附錄估值細節。&lt;/p&gt;&lt;ul class=&quot;cap&quot;&gt;&lt;li&gt;近四季公開市場回購均價 190.89 高於合理價值上緣 116.32；回購不加回、目標區間不調整。&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;!--/目標區間:第五題--&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;市價要求的成長：三視角反推、假設對照實績、歷史基準比率與市價溢價來源&lt;/h3&gt;&lt;p&gt;這一節把現價代回估值模型反解「市場要求什麼」，再和公司實績、同規模公司的歷史比例、市場面的過熱訊號對照；只揭露，不改合理價值、價格位置與研究評等。&lt;/p&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;市價隱含什麼、我們假設什麼、公司做到什麼&lt;/h4&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;視角（其他假設照基準，三者擇一）&lt;/th&gt;&lt;th&gt;市價隱含&lt;/th&gt;&lt;th&gt;本報告基準&lt;/th&gt;&lt;th&gt;實績或對照&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;成長&lt;/td&gt;&lt;td&gt;第 1–5 年營收每年約 25.8%&lt;/td&gt;&lt;td&gt;第 1–5 年平均約 16.0%（推算）&lt;/td&gt;&lt;td&gt;近四季 83.4%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;利潤率&lt;/td&gt;&lt;td&gt;第 1 年起每年（含穩態）營業利益率約 86.1%&lt;/td&gt;&lt;td&gt;第 1 年 65.0%、穩態 45.0%&lt;/td&gt;&lt;td&gt;14.9%–62.4%（近 11 年營業利益率）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;折現率&lt;/td&gt;&lt;td&gt;約 7.6%（使基準情境等於現價的折現率）&lt;/td&gt;&lt;td&gt;加權資本成本 11.5%&lt;/td&gt;&lt;td&gt;10 年期公債 5.10%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;市價隱含折現率約 7.6%，比加權資本成本 11.5% 低約 4.0 個百分點：照基準情境假設，現價隱含的長期報酬低於本報告採用的資金成本；市價要站得住，需要基準以外的假設成立（例如成長或利潤率高於基準，見上兩列），或投資人接受較低的報酬。隱含折現率不是預期報酬；V3 回測（2016–2025，含倖存者偏誤）中，之後一年實際報酬中位多高於隱含值。只揭露，不改研究評等與價格位置；非買賣建議。&lt;/p&gt;&lt;div style=&quot;margin-top:12px&quot;&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;第 1 年營收成長&lt;/th&gt;&lt;th&gt;穩態營業利益率&lt;/th&gt;&lt;th&gt;終端投入資本報酬率（ROIC）&lt;/th&gt;&lt;th&gt;永續成長&lt;/th&gt;&lt;th&gt;對照實績&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;30.0%&lt;/td&gt;&lt;td&gt;33.0%&lt;/td&gt;&lt;td&gt;11.6%&lt;/td&gt;&lt;td&gt;2.5%&lt;/td&gt;&lt;td&gt;保守於實績（終端 ROIC 不到研發資本化後實績一半；產業上限）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;45.0%&lt;/td&gt;&lt;td&gt;45.0%&lt;/td&gt;&lt;td&gt;11.6%&lt;/td&gt;&lt;td&gt;3.0%&lt;/td&gt;&lt;td&gt;保守於實績（終端 ROIC 不到研發資本化後實績一半；產業上限）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;58.0%&lt;/td&gt;&lt;td&gt;55.0%&lt;/td&gt;&lt;td&gt;11.6%&lt;/td&gt;&lt;td&gt;3.5%&lt;/td&gt;&lt;td&gt;保守於實績（終端 ROIC 不到研發資本化後實績一半；產業上限）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;公司實績&lt;/td&gt;&lt;td&gt;近四季 83.4%&lt;/td&gt;&lt;td&gt;近四季 65.2%；14.9%–62.4%（近 11 年營業利益率）&lt;/td&gt;&lt;td&gt;近四季 242.7%；研發資本化後約 146.1%（2026-01-25 財年，研發資本化對照.json）&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;市價隱含三視角：把現價代回基準情境，一次只放開一個假設反解（成長、利潤率、折現率），三者擇一成立即可，不是同時需要；折現率視角就是第四題「現價隱含年報酬（基準情境，非預期報酬）」。假設對照：終端 ROIC 低於近四季一半時標「保守於實績」，括號寫原因：產業上限、公司近五年中位上限或等於資金成本是估值框架的上限設定（估值政策），作者選值的理由在估值輸入，都不是資料錯誤；穩態利潤率高於歷史上限標「高於歷史上限」；利潤率仍在改善中的公司（轉型、規模擴張期），歷史上限不一定是天花板，標記只提醒讀者對照，不代表假設錯誤。出處：估值結果.json（reverse_dcf、implied_return、discount）、估值輸入.json（scenarios）、財務指標.json（ROIC_TTM）、產業指標.json（景氣正常化）、成長推估底稿.json 與財務歷史.json（近四季）；推導，只揭露，不改合理價值、價格位置與研究評等。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;市價隱含的成長與歷史基準比率&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;市價隱含 NVDA 未來 10 年營收實質年增約 16.4%–16.9%（名目 18.9% 減通膨 2.0%–2.5% 的近似，推導）；1950–2015 年營收 500 億美元以上的公司中，10 年間做到實質年增 15% 以上的約 0.9%（Mauboussin 等，2016，表 4）。此為揭露，不是市價錯誤的證明。&lt;/p&gt;&lt;p&gt;現價要成立，需把基準情境第 1 年營收成長 45.0% 延續約 4 年（之後新投資報酬等於折現率，不再創造價值；推導，只揭露）。&lt;/p&gt;&lt;p&gt;&lt;b&gt;隱含假設罕見度：歷史罕見&lt;/b&gt;（同規模公司 10 年做到的歷史比例 ≥50% 一般、10%–50% 樂觀、&amp;lt;10% 歷史罕見；只揭露，不改研究評等與價格位置）&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;超額報酬期間&lt;/th&gt;&lt;th&gt;市價隱含營收年增（名目）&lt;/th&gt;&lt;th&gt;約實質（名目減通膨 2.0%–2.5% 的近似，推導）&lt;/th&gt;&lt;th&gt;歷史基準比率（1950–2015）&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;10 年&lt;/td&gt;&lt;td&gt;18.9%&lt;/td&gt;&lt;td&gt;16.4%–16.9%&lt;/td&gt;&lt;td&gt;營收 500 億美元以上：10 年實質年增 15% 以上約 0.9%（該組 10 年實質年增中位數 1.1%）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;15 年&lt;/td&gt;&lt;td&gt;14.4%&lt;/td&gt;&lt;td&gt;11.9%–12.4%&lt;/td&gt;&lt;td&gt;原文只有 10 年分布，15、20 年無對照&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;20 年&lt;/td&gt;&lt;td&gt;12.2%&lt;/td&gt;&lt;td&gt;9.7%–10.2%&lt;/td&gt;&lt;td&gt;原文只有 10 年分布，15、20 年無對照&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;做法：超額報酬期間內營收年增固定、利潤率與銷售對資本比取基準情境第 5 年；期間結束後新投資報酬等於折現率（不再創造價值）；永續成長照基準情境。折現率 11.55%、第 5 年利潤率 52.0%。來源：Mauboussin, Callahan &amp;amp; Majd（2016）〈The Base Rate Book〉表 4（第三方轉載，原表 1950–2015 年、實質成長、有存活偏差）。這張表只說明「市價需要多強、多久的成長才成立」，不改合理價值、買入區上緣與價格位置；歷史比例低代表市價需要少見的結果，不代表市價錯誤。通膨假設 2.0%–2.5% 依 Morningstar 2020-10 方法，實質年增為名目直接減通膨的近似。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;市價溢價來源&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;溢價訊號集中在基本面預期（隱含假設罕見度）。倍數重估、資金與情緒、總經與利率無訊號。只揭露，不改研究評等與價格位置，也不代表市價錯誤。&lt;/p&gt;&lt;p&gt;EPS 預估：+1y（財年未對應） 預估 90 天 24.2%（上修；判斷窗口為 90 天，±2% 內視為持平），近 30 天上修減下修 7 家；yfinance 預估是取得當下快照，股價 90 天變化以批次收盤日為終點，兩者日期可能差幾天；取得 2026-11-13。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;來源類別&lt;/th&gt;&lt;th&gt;數值&lt;/th&gt;&lt;th&gt;過熱訊號&lt;/th&gt;&lt;th&gt;說明／存檔位置&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;隱含假設罕見度&lt;/td&gt;&lt;td&gt;基本面預期&lt;/td&gt;&lt;td&gt;歷史罕見&lt;/td&gt;&lt;td&gt;有&lt;/td&gt;&lt;td&gt;價值判斷.json#/市價隱含假設&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;倍數擴張&lt;/td&gt;&lt;td&gt;倍數重估&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;不適用&lt;/td&gt;&lt;td&gt;EPS 年化變動 +125%，超過 ±50%（基期失真）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;預估背離&lt;/td&gt;&lt;td&gt;倍數重估&lt;/td&gt;&lt;td&gt;+1y（財年未對應） EPS 預估 90 天 +24.2%（上修；90 天變化 ±2% 內視為持平），同期股價 -27.7% → 預估未跟上下跌，偏情緒&lt;/td&gt;&lt;td&gt;無&lt;/td&gt;&lt;td&gt;價值判斷.json#/預估修正&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;本益比水位&lt;/td&gt;&lt;td&gt;倍數重估&lt;/td&gt;&lt;td&gt;現在 20.6 倍，自身五年 p75 75.9 倍&lt;/td&gt;&lt;td&gt;無&lt;/td&gt;&lt;td&gt;市場資料/歷史本益比.json#/pe_p75&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股債利差&lt;/td&gt;&lt;td&gt;總經與利率&lt;/td&gt;&lt;td&gt;近期百分位 100%（0% 最貴）&lt;/td&gt;&lt;td&gt;無&lt;/td&gt;&lt;td&gt;市場資料/歷史本益比.json#/股債利差/近期百分位&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;整體市場風險溢價&lt;/td&gt;&lt;td&gt;總經與利率&lt;/td&gt;&lt;td&gt;Damodaran 隱含風險溢價 4.20%（2026-10-01）&lt;/td&gt;&lt;td&gt;不適用&lt;/td&gt;&lt;td&gt;只存當月值，沒有歷史序列可比中位數；要下載 Damodaran 歷史表需使用者同意&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;動能&lt;/td&gt;&lt;td&gt;資金與情緒&lt;/td&gt;&lt;td&gt;相對 200 日均線 -20%；12 個月（2025-11-12 起） -16% 對 S&amp;amp;P500 +12%&lt;/td&gt;&lt;td&gt;無&lt;/td&gt;&lt;td&gt;市場資料/市場溫度.json#/趨勢、#/動能&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;部位與衍生品&lt;/td&gt;&lt;td&gt;資金與情緒&lt;/td&gt;&lt;td&gt;選擇權賣權對買權量比 偏熱；空單分位 35%、回補天數分位 70%&lt;/td&gt;&lt;td&gt;無&lt;/td&gt;&lt;td&gt;股價在 200 日均線下且 12 個月下跌，熱度不視為溢價來源&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;擁擠度&lt;/td&gt;&lt;td&gt;資金與情緒&lt;/td&gt;&lt;td&gt;20 日均換手率在自身五年 30% 分位；被發現程度 高&lt;/td&gt;&lt;td&gt;無&lt;/td&gt;&lt;td&gt;市場資料/市場溫度.json#/流動性/20日均換手率_分位&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;股價漲跌拆解：EPS 成長 vs 本益比變化（年化對數點，推導；不含股利、申報 EPS）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;期間&lt;/th&gt;&lt;th&gt;股價年化&lt;/th&gt;&lt;th&gt;EPS 貢獻&lt;/th&gt;&lt;th&gt;本益比貢獻&lt;/th&gt;&lt;th&gt;本益比&lt;/th&gt;&lt;th&gt;主因&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;1年&lt;/td&gt
