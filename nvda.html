&lt;div class=&quot;front&quot; id=&quot;front&quot; data-layer=&quot;首頁&quot;&gt;&lt;header class=&quot;hero&quot;&gt;&lt;div&gt;&lt;span class=&quot;stance&quot;&gt;生意 A／價格偏貴&lt;/span&gt;&lt;span class=&quot;stance rating&quot;&gt;研究評等　生意 A ／ 價格偏貴（非買賣建議）&lt;/span&gt;&lt;h1&gt;生意一流、正在景氣高峰，收盤價已把高成長與高利潤率延續多年都算進去&lt;/h1&gt;&lt;p class=&quot;summary&quot;&gt;輝達靠資料中心 AI 系統賺錢，近四季營業利益率約 65%，資產負債表強。我們以景氣循環公司處理，利潤率逐年回落到正常化水準，合理價值 81.04–116.32 美元（中點 100.28 美元），收盤價 162.85 美元，價格位置偏貴。創辦人執行長 11-11 辭任、11-12 公告，收盤價已在公告後交易，治理風險升高。研究用途，非買賣建議。&lt;/p&gt;&lt;/div&gt;&lt;aside class=&quot;pricebox&quot;&gt;&lt;div class=&quot;sub&quot;&gt;2026-11-13 收盤 162.85 美元&lt;/div&gt;&lt;div class=&quot;big&quot;&gt;162.85&lt;span style=&quot;font-size:18px&quot;&gt; 美元&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;zones&quot;&gt;&lt;div class=&quot;zone buy&quot; style=&quot;grid-column:1/-1&quot;&gt;&lt;span&gt;買入區上緣（不確定性高）&lt;/span&gt;&lt;b&gt;60 美元&lt;/b&gt;&lt;small&gt;股價在此以下才有 40% 安全邊際；＝合理價值中點 100.28 ×（1−40%）。非買賣建議。&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;rows&quot;&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;股價 ÷ 合理價值中點&lt;/span&gt;&lt;span&gt;1.62 倍&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;10 年期美國公債&lt;/span&gt;&lt;span&gt;5.10%&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;r&quot;&gt;&lt;span&gt;市價隱含 5 年營收年增&lt;/span&gt;&lt;span&gt;25.8%&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;現金與證券（2026-07-26）&lt;/span&gt;&lt;span&gt;566 億美元&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;有息負債&lt;/span&gt;&lt;span&gt;334 億美元&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;淨現金&lt;/span&gt;&lt;span&gt;232 億美元&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;近四季回購&lt;/span&gt;&lt;span&gt;553 億美元&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;近四季公開市場回購均價（高於合理價值區間）&lt;/span&gt;&lt;span&gt;190.89 美元&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot; style=&quot;display:block&quot;&gt;&lt;span&gt;股東回報與權益（2022–2026）：&lt;/span&gt;&lt;span style=&quot;font-weight:400&quot;&gt;權益被回購壓低，ROE 偏高失真，請看投入資本報酬率；股東權益 266→1,573 億美元；股利＋回購占自由現金流 49%（逐年表見第六題）&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; id=&quot;cont-note&quot; style=&quot;margin:10px 0 0&quot;&gt;這個數字只描述現價與本報告合理價值中點的距離，不改價格位置與研究評等。非買賣建議。&lt;/p&gt;&lt;/aside&gt;&lt;/header&gt;&lt;section class=&quot;note-box&quot; id=&quot;value-trio&quot; style=&quot;margin-top:18px&quot;&gt;&lt;h3&gt;合理價值與市價隱含第 10 年倍數&lt;/h3&gt;&lt;div class=&quot;zones&quot; style=&quot;grid-template-columns:repeat(2,1fr)&quot;&gt;&lt;div class=&quot;zone&quot;&gt;&lt;span&gt;合理價值（只含折現率）&lt;/span&gt;&lt;b&gt;81–116 美元&lt;/b&gt;&lt;small&gt;中點 100.28 美元；三情境機率加權&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;zone mkt&quot;&gt;&lt;span&gt;市價隱含第 10 年倍數（EV/EBIT，基準情境）&lt;/span&gt;&lt;b&gt;22.5 倍&lt;/b&gt;&lt;small&gt;模型假設 7.4 倍，市價隱含是模型的 3.0 倍；折現率區間 19.3–29.3 倍；參考帶（跨產業，1046 筆、51 家）中位 15.5 倍、四分位 7.8–27.6 倍、p90 42.7 倍（機械回測樣本，非市場全體；分產業的筆數與公司數少，僅供參考）；只描述，不進評等&lt;br&gt;特例：獲利處於循環位置，倍數僅供參考&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;參考帶中位（跨產業） 15.5 倍時，機率加權每股約 140 美元（條件式，非目標價、非買賣建議，不進評等；各倍數對照見計算底稿 5）。&lt;/p&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;&lt;b&gt;合理價值 vs 市價隱含倍數（作者判讀）：&lt;/b&gt;市價隱含第 10 年 EV/EBIT 約 22.5 倍，是模型終值倍數 7.4 倍 的 3.02 倍；輝達處於景氣高峰，基期利潤率偏高，倍數只供參考。市價等於假設第 10 年仍是高成長、高利潤的公司，我們假設屆時回到成熟水準；只描述，不當評等理由。&lt;/p&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:10px;font-size:15px;line-height:1.7&quot;&gt;上面的合理價值只含折現率高低；三情境全幅 48～181（情境與折現率一起算，約中點的 132%）；寬主要來自情境（差距 100%），不是折現率（35%）。情境差距＝（樂觀－保守）÷基準，折現率寬度＝（高－低）÷中點；非買賣建議。&lt;/p&gt;&lt;div class=&quot;tw&quot; style=&quot;margin-top:14px&quot;&gt;&lt;table class=&quot;txt&quot; style=&quot;min-width:0;font-size:16px&quot;&gt;&lt;tr&gt;&lt;th style=&quot;padding:9px 12px;font-size:15px&quot;&gt;情境&lt;/th&gt;&lt;th style=&quot;padding:9px 12px;font-size:15px&quot;&gt;每股價值&lt;/th&gt;&lt;th style=&quot;padding:9px 12px;font-size:15px&quot;&gt;權重&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;padding:9px 12px&quot;&gt;保守&lt;/td&gt;&lt;td style=&quot;padding:9px 12px;font-size:20px;font-weight:700&quot;&gt;57.70&lt;/td&gt;&lt;td style=&quot;padding:9px 12px&quot;&gt;25%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;padding:9px 12px&quot;&gt;基準&lt;div style=&quot;font-size:13px;line-height:1.5;color:var(--muted);margin-top:2px&quot;&gt;與外部 DCF 單點同口徑；今天的現值，不是 12 個月目標價，非買賣建議&lt;/div&gt;&lt;/td&gt;&lt;td style=&quot;padding:9px 12px;font-size:20px;font-weight:700&quot;&gt;95.22&lt;/td&gt;&lt;td style=&quot;padding:9px 12px&quot;&gt;50%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;padding:9px 12px&quot;&gt;樂觀&lt;/td&gt;&lt;td style=&quot;padding:9px 12px;font-size:20px;font-weight:700&quot;&gt;152.98&lt;/td&gt;&lt;td style=&quot;padding:9px 12px&quot;&gt;25%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:10px;font-size:15px;line-height:1.7&quot;&gt;中點是三個情境的加權，上下緣是換折現率重算；算式見&lt;a href=&quot;#valuation&quot;&gt;第五題&lt;/a&gt;。情境表說明合理價值怎麼組成，不是單一目標價。&lt;/p&gt;&lt;/section&gt;&lt;!--目標區間:首頁--&gt;&lt;div class=&quot;note-box tgt&quot; id=&quot;target-front&quot;&gt;&lt;h3&gt;12 個月條件式目標區間&lt;/h3&gt;&lt;p style=&quot;margin:0 0 6px&quot;&gt;如果三種情境各自成真，一年後（至 2027-11-13）每股價值大約落在：保守 53.77–72.46、基準 86.30–122.25、樂觀 134.33–201.22 美元。這是條件式區間，不是股價預測，三段不合成單一數字。&lt;/p&gt;&lt;figure class=&quot;figure wide&quot;&gt;&lt;svg viewBox=&quot;0 0 860 232&quot; role=&quot;img&quot; aria-label=&quot;今天的價值區間與 12 個月後的條件式目標區間（條件式、非買賣建議）&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;192.0&quot; x2=&quot;192.0&quot; y1=&quot;24&quot; y2=&quot;198&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;192.0&quot; y=&quot;212&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;100&lt;/text&gt;&lt;line x1=&quot;271.7&quot; x2=&quot;271.7&quot; y1=&quot;24&quot; y2=&quot;198&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;271.7&quot; y=&quot;212&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;200&lt;/text&gt;&lt;line x1=&quot;351.4&quot; x2=&quot;351.4&quot; y1=&quot;24&quot; y2=&quot;198&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;351.4&quot; y=&quot;212&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;300&lt;/text&gt;&lt;line x1=&quot;431.2&quot; x2=&quot;431.2&quot; y1=&quot;24&quot; y2=&quot;198&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;431.2&quot; y=&quot;212&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;400&lt;/text&gt;&lt;line x1=&quot;510.9&quot; x2=&quot;510.9&quot; y1=&quot;24&quot; y2=&quot;198&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;510.9&quot; y=&quot;212&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;500&lt;/text&gt;&lt;text x=&quot;4&quot; y=&quot;16&quot; class=&quot;lab&quot; font-weight=&quot;700&quot;&gt;今天（依證據的價值；倍數列只作交叉核對）&lt;/text&gt;&lt;text x=&quot;142&quot; y=&quot;42.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;合理價值&lt;/text&gt;&lt;rect x=&quot;176.9&quot; y=&quot;30.0&quot; width=&quot;28.1&quot; height=&quot;16&quot; rx=&quot;8&quot; fill=&quot;var(--pos)&quot; opacity=&quot;0.8&quot;&gt;&lt;title&gt;合理價值：81.0–116.3&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;211.0&quot; y=&quot;42.0&quot; class=&quot;ax&quot;&gt;81.0–116.3；買入區上緣 60.2&lt;/text&gt;&lt;text x=&quot;142&quot; y=&quot;70.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;倍數交叉核對（不進評等）&lt;/text&gt;&lt;rect x=&quot;341.6&quot; y=&quot;58.0&quot; width=&quot;194.5&quot; height=&quot;16&quot; rx=&quot;8&quot; fill=&quot;var(--muted)&quot; opacity=&quot;0.35&quot;&gt;&lt;title&gt;倍數交叉核對（不進評等）：287.6–531.6&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;542.1&quot; y=&quot;70.0&quot; class=&quot;ax&quot;&gt;287.6–531.6&lt;/text&gt;&lt;text x=&quot;4&quot; y=&quot;96&quot; class=&quot;lab&quot; font-weight=&quot;700&quot;&gt;12 個月後（條件式目標區間，不進評等）&lt;/text&gt;&lt;text x=&quot;142&quot; y=&quot;122.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;保守 25%&lt;/text&gt;&lt;rect x=&quot;155.1&quot; y=&quot;110.0&quot; width=&quot;14.9&quot; height=&quot;16&quot; rx=&quot;8&quot; fill=&quot;var(--c5)&quot; opacity=&quot;0.85&quot;&gt;&lt;title&gt;保守 25%：53.8–72.5&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;176.0&quot; y=&quot;122.0&quot; class=&quot;ax&quot;&gt;53.77–72.46｜相對現價 −67%～−56%&lt;/text&gt;&lt;text x=&quot;142&quot; y=&quot;150.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;基準 50%&lt;/text&gt;&lt;rect x=&quot;181.1&quot; y=&quot;138.0&quot; width=&quot;28.7&quot; height=&quot;16&quot; rx=&quot;8&quot; fill=&quot;var(--c1)&quot; opacity=&quot;0.85&quot;&gt;&lt;title&gt;基準 50%：86.3–122.2&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;215.7&quot; y=&quot;150.0&quot; class=&quot;ax&quot;&gt;86.30–122.25｜相對現價 −47%～−25%&lt;/text&gt;&lt;text x=&quot;142&quot; y=&quot;178.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;樂觀 25%&lt;/text&gt;&lt;rect x=&quot;219.4&quot; y=&quot;166.0&quot; width=&quot;53.3&quot; height=&quot;16&quot; rx=&quot;8&quot; fill=&quot;var(--c2)&quot; opacity=&quot;0.85&quot;&gt;&lt;title&gt;樂觀 25%：134.3–201.2&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;278.7&quot; y=&quot;178.0&quot; class=&quot;ax&quot;&gt;134.33–201.22｜相對現價 −18%～+24%&lt;/text&gt;&lt;line x1=&quot;160.2&quot; x2=&quot;160.2&quot; y1=&quot;27&quot; y2=&quot;49&quot; class=&quot;buyline&quot;/&gt;&lt;line x1=&quot;242.1&quot; x2=&quot;242.1&quot; y1=&quot;24&quot; y2=&quot;198&quot; class=&quot;price&quot;/&gt;&lt;text x=&quot;242.1&quot; y=&quot;228&quot; class=&quot;pricelab&quot; text-anchor=&quot;middle&quot;&gt;現價 162.85&lt;/text&gt;&lt;/svg&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;條件式、非買賣建議；2026-11-13 至 2027-11-13；機率為政策權重，未經歷史校準；細節見第五題。&lt;/p&gt;&lt;/figure&gt;&lt;/div&gt;&lt;!--/目標區間:首頁--&gt;&lt;div class=&quot;kpis&quot;&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;l&quot;&gt;景氣正常化利潤率&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;37.7%（跨循環十年平均營業利益率，推導）&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;總經景氣位置的十年平均營業利益率（FY2017–FY2026，推導）；估值與第二題用產業指標十一年平均 35.6%（多含 FY2016 低點）；近四季 65.2%，景氣位置高峰&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;l&quot;&gt;近四季營收年增&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;+83.4%&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;近四季至 2026-07-26；最新單季 +105.9%（成長推估底稿）&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;l&quot;&gt;產能與訂單：供應承諾&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;2,790 億美元&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;上季 1,190 億；訂單出貨比未揭露（10-Q 2026-07-26 Item 2 ¶16）&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;l&quot;&gt;每股自由現金流扣股權薪酬&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;4.91 美元&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;近四季；未扣股權薪酬 5.21 美元（財務指標）&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;note-box&quot; id=&quot;survival&quot; style=&quot;border-left-color:var(--pos)&quot;&gt;&lt;p style=&quot;margin:0&quot;&gt;&lt;b&gt;信用評級&lt;/b&gt;　機構 未揭露／推導 AAA（只看利息保障倍數，425.8 倍，近四季新借款多、利息偏低、評級可能偏高）｜依推導：投資等級　｜　&lt;a href=&quot;#survival-detail&quot;&gt;&lt;b&gt;存活檢查（12～24 個月）&lt;/b&gt;&lt;/a&gt;　&lt;b style=&quot;color:var(--pos)&quot;&gt;無明顯警訊&lt;/b&gt;（推導，非違約預測；理由見第六題計算底稿）&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;grid2 front-pts&quot;&gt;&lt;div&gt;&lt;h3&gt;三個論點&lt;/h3&gt;&lt;ol class=&quot;pts&quot;&gt;&lt;li&gt;資料中心系統占營收約九成，最新單季年增 117%，下季指引 1,080 億美元，近期能見度高。&lt;/li&gt;&lt;li&gt;CUDA（輝達的 GPU 程式開發平台）軟體生態造成轉換成本，競爭者與客戶的 SEC 申報都這樣寫，毛利率維持約 75%。&lt;/li&gt;&lt;li&gt;資產負債表強：有息負債只有 EBITDA（稅息折舊攤銷前利益）的 0.17 倍，自由現金流足以支付回購與成長投入。&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;&lt;div&gt;&lt;h3&gt;三個風險&lt;/h3&gt;&lt;ol class=&quot;pts risk&quot;&gt;&lt;li&gt;創辦人執行長 11-11 辭任、財務長暫代，參院排定聽證，關鍵人物與政策風險同時升高。&lt;/li&gt;&lt;li&gt;客戶集中且大客戶自研晶片，推論晶片的價格與市占可能被追近。&lt;/li&gt;&lt;li&gt;對客戶的融資保證上限 1,050 億美元，AI 資本支出降溫時風險回到輝達。&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;note-box mv&quot;&gt;&lt;b&gt;市場價格隱含什麼、我們哪裡不同&lt;/b&gt;&lt;p&gt;收盤價隱含未來 5 年營收每年約 25.8%（市價反推未來 5 年營收年增；市價 162.85 美元、收盤 2026-11-13；折現率 11.55%，沿用 2026-11-12 無風險利率 5.10%；推導）、第 10 年仍值約 22.5 倍 EV/EBIT；我們認為高峰利潤率會回落，基準情境只給 95.22 美元。&lt;/p&gt;&lt;/div&gt;&lt;div id=&quot;triggers&quot; class=&quot;tm&quot;&gt;&lt;h3&gt;風險與改變判斷&lt;/h3&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;risk-tbl&quot; style=&quot;min-width:0;width:100%&quot;&gt;&lt;tr&gt;&lt;th style=&quot;white-space:normal;width:64%&quot;&gt;情況（看哪個指標、門檻多少）&lt;/th&gt;&lt;th style=&quot;white-space:normal;width:22%&quot;&gt;會改變什麼判斷&lt;/th&gt;&lt;th style=&quot;white-space:normal;width:14%&quot;&gt;歷史基準比率&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;調查或政府行動揭露公司層級出口管制違規或罰款：治理下修為弱（NVDA-C12）&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;—&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;單季營收低於指引下緣&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;或下季指引低於當季實績：檢討基準第 1 年 +45%（NVDA-C03）&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;單季毛利率連兩季低於 70%（近四季 74.7%）：護城河由強轉中（NVDA-C01）&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;—&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;存貨天數連兩季高於 150 天且應收增速續高於營收：現金流品質下修（NVDA-C08）&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;—&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;投入回報轉弱：增量 ROIC 降到 50% 以下（目前 185.8%）&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;檢討護城河分級&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;SB Energy（OpenAI 俄亥俄資料中心租約的出租人）保證觸發或認列保證負債：資產負債表由強轉中（NVDA-C11）&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;—&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;執行長辭任後接班不明，暫代者是財務長，產品路線圖執行可能受影響&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;未設門檻：持續觀察&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;中國出口管制可能從 H20（輝達為中國市場設計的降規晶片）擴大到 H200 晶片，Baird（美國券商）估減記約 50 億（分析師推測）&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;未設門檻：持續觀察&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;大客戶自研推論晶片，價格與市占被追近&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;未設門檻：持續觀察&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;客戶資料中心受電力與資金限制，採購可能延後，存貨與承諾變成負擔&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;未設門檻：持續觀察&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;歷史基準比率＝成功幾率口徑，是同規模公司歷史上做到的比例，不是這家公司的預測；「—」＝沒有可對照的歷史基準，不估機率。營收成長類的列：同規模（營收 500 億美元以上）公司 10 年實質年增做到模型基準 7.1% 的歷史比例（超額報酬期間檢查.json 基準比率；Base Rate Book）。&lt;/p&gt;&lt;/div&gt;&lt;p class=&quot;cap fnote&quot;&gt;資料日期：財報截至 2026-07-26；市場資料 2026-11-13 收盤 162.85 美元。首家產業，公版待驗證（景氣循環／半導體；產業公版的估值法與指標選擇尚未經兩家以上驗證）。本報告為研究用途，研究評等與條件式目標區間都不是買賣建議；數字截至 2026-11-13 收盤與 2026-07-26 財報，執行長辭任公告已在收盤前，FY2027 Q3 財報在收盤日後、未反映。本研究只評估公司本身，不評估讀者自身的資金期限與等待能力。完整數字見正文&lt;a href=&quot;#numbers&quot;&gt;「完整數字」&lt;/a&gt;；名詞與每條判斷的證據狀態見&lt;a href=&quot;#more&quot;&gt;附錄&lt;/a&gt;。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;

&lt;main class=&quot;wrap&quot;&gt;&lt;div data-layer=&quot;正文&quot;&gt;&lt;section class=&quot;q&quot; id=&quot;business&quot;&gt;&lt;div class=&quot;qno&quot;&gt;問題 01&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;生意怎麼賺錢？&lt;/div&gt;&lt;h2&gt;賣資料中心 AI 系統，九成營收、利潤率約 65%。&lt;/h2&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;輝達的錢幾乎都來自資料中心：FY2026 資料中心營收約占九成，近四季營業利益率 65.2%（財務指標）。&lt;/strong&gt;高利潤率來自整套系統加軟體一起賣，客戶買的是可直接上線的算力，不是單顆晶片。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;反方是集中：前兩大直接客戶占 FY2026 營收 36%（NVDA-C10）。&lt;/strong&gt;這些客戶也在自研晶片，一旦把推論工作移走，營收與利潤率會同時受影響。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;產品線營收占比（FY26，億美元；逐年金額與成長見下方明細表；圖的占比分母為圖中各線合計）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 480 280&quot; role=&quot;img&quot; aria-label=&quot;產品線營收&quot; class=&quot;chart&quot; style=&quot;max-width:624px&quot;&gt;&lt;path d=&quot;M240.0,52.0 A88,88 0 1 1 152.0,139.0 L186.0,139.4 A54,54 0 1 0 240.0,86.0 Z&quot; fill=&quot;var(--c1)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;資料中心運算：1,624（75%）&lt;/title&gt;&lt;/path&gt;&lt;path d=&quot;M152.0,139.0 A88,88 0 0 1 187.0,69.7 L207.5,96.9 A54,54 0 0 0 186.0,139.4 Z&quot; fill=&quot;var(--c2)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;資料中心網路：314（15%）&lt;/title&gt;&lt;/path&gt;&lt;path d=&quot;M187.0,69.7 A88,88 0 0 1 224.3,53.4 L230.4,86.9 A54,54 0 0 0 207.5,96.9 Z&quot; fill=&quot;var(--c6)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;遊戲：160（7%）&lt;/title&gt;&lt;/path&gt;&lt;path d=&quot;M224.3,53.4 A88,88 0 0 1 240.0,52.0 L240.0,86.0 A54,54 0 0 0 230.4,86.9 Z&quot; fill=&quot;var(--muted)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;其他：61.6（3%）&lt;/title&gt;&lt;/path&gt;&lt;polyline points=&quot;304.7,205.4 310.3,218.2 346.0,218.2&quot; fill=&quot;none&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;1&quot;/&gt;&lt;text x=&quot;354.0&quot; y=&quot;215.2&quot; class=&quot;lab&quot; text-anchor=&quot;start&quot;&gt;資料中心運算&lt;/text&gt;&lt;text x=&quot;354.0&quot; y=&quot;233.2&quot; class=&quot;val&quot; text-anchor=&quot;start&quot;&gt;75%&lt;tspan class=&quot;ax&quot; font-weight=&quot;400&quot;&gt;　1,624&lt;/tspan&gt;&lt;/text&gt;&lt;polyline points=&quot;157.9,98.5 150.8,106.4 134.0,106.4&quot; fill=&quot;none&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;1&quot;/&gt;&lt;text x=&quot;126.0&quot; y=&quot;103.4&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;資料中心網路&lt;/text&gt;&lt;text x=&quot;126.0&quot; y=&quot;121.4&quot; class=&quot;val&quot; text-anchor=&quot;end&quot;&gt;15%&lt;tspan class=&quot;ax&quot; font-weight=&quot;400&quot;&gt;　314&lt;/tspan&gt;&lt;/text&gt;&lt;polyline points=&quot;203.1,55.7 199.9,68.4 134.0,68.4&quot; fill=&quot;none&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;1&quot;/&gt;&lt;text x=&quot;126.0&quot; y=&quot;65.4&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;遊戲&lt;/text&gt;&lt;text x=&quot;126.0&quot; y=&quot;83.4&quot; class=&quot;val&quot; text-anchor=&quot;end&quot;&gt;7%&lt;tspan class=&quot;ax&quot; font-weight=&quot;400&quot;&gt;　160&lt;/tspan&gt;&lt;/text&gt;&lt;polyline points=&quot;231.8,48.4 231.1,30.4 134.0,30.4&quot; fill=&quot;none&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;1&quot;/&gt;&lt;text x=&quot;126.0&quot; y=&quot;27.4&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;其他&lt;/text&gt;&lt;text x=&quot;126.0&quot; y=&quot;45.4&quot; class=&quot;val&quot; text-anchor=&quot;end&quot;&gt;3%&lt;tspan class=&quot;ax&quot; font-weight=&quot;400&quot;&gt;　61.6&lt;/tspan&gt;&lt;/text&gt;&lt;text x=&quot;240.0&quot; y=&quot;136.0&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY26&lt;/text&gt;&lt;text x=&quot;240.0&quot; y=&quot;158.0&quot; class=&quot;val&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:18px&quot;&gt;2,159&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;白話說&lt;/b&gt;每 100 元營收，約 90 元來自資料中心，賺到約 65 元營業利益（近四季）。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;要留意&lt;/b&gt;地區營收按客戶總部，台灣多是代工組裝廠，最終用戶多在美歐。&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;產品線營收明細（億美元；占比為最近財年，分母為各線合計）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;產品線&lt;/th&gt;&lt;th&gt;FY24&lt;/th&gt;&lt;th&gt;FY25&lt;/th&gt;&lt;th&gt;FY26&lt;/th&gt;&lt;th&gt;近四季&lt;/th&gt;&lt;th&gt;最近財年年增&lt;/th&gt;&lt;th&gt;占比&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;資料中心運算&lt;/td&gt;&lt;td&gt;390&lt;/td&gt;&lt;td&gt;1,022&lt;/td&gt;&lt;td&gt;1,624&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;58.9%&lt;/td&gt;&lt;td&gt;75%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;資料中心網路&lt;/td&gt;&lt;td&gt;86&lt;/td&gt;&lt;td&gt;130&lt;/td&gt;&lt;td&gt;314&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;141.5%&lt;/td&gt;&lt;td&gt;15%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;遊戲&lt;/td&gt;&lt;td&gt;104&lt;/td&gt;&lt;td&gt;114&lt;/td&gt;&lt;td&gt;160&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;41.3%&lt;/td&gt;&lt;td&gt;7%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;專業視覺化&lt;/td&gt;&lt;td&gt;16&lt;/td&gt;&lt;td&gt;19&lt;/td&gt;&lt;td&gt;32&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;69.9%&lt;/td&gt;&lt;td&gt;1%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;汽車&lt;/td&gt;&lt;td&gt;11&lt;/td&gt;&lt;td&gt;17&lt;/td&gt;&lt;td&gt;23&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;38.7%&lt;/td&gt;&lt;td&gt;1%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;OEM 與其他&lt;/td&gt;&lt;td&gt;3&lt;/td&gt;&lt;td&gt;4&lt;/td&gt;&lt;td&gt;6&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;59.1%&lt;/td&gt;&lt;td&gt;0%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;business-profile&quot;&gt;&lt;h3&gt;生意介紹：年報重點&lt;/h3&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;輝達從遊戲顯示卡起家，現在九成營收來自資料中心整套系統。&lt;/strong&gt;下面八塊依年報與季報原文整理，每段附出處。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;賣什麼&lt;/p&gt;&lt;h4&gt;賣整座 AI 資料中心的運算與網路，不只是一顆晶片&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;公司自稱資料中心規模的 AI 基礎設施公司：GPU、CPU（中央處理器）、網路、整櫃系統與 &lt;a class=&quot;term&quot; href=&quot;#g0&quot;&gt;CUDA&lt;/a&gt; 軟體一起設計&lt;span class=&quot;src&quot;&gt;（10-K 2026-01-25 Item 1 ¶2–¶4）&lt;/span&gt;。&lt;/strong&gt;FY2026 資料中心營收 1,937 億美元（運算 1,624 億、網路 314 億）；遊戲 160 億、專業視覺化 32 億、汽車 23 億&lt;span class=&quot;src&quot;&gt;（10-K Item 15 Note 16）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;FY2027 起改以資料中心與邊緣運算兩個市場揭露：Q2 資料中心 890 億、邊緣運算 72 億&lt;span class=&quot;src&quot;&gt;（8-K 2026-08-26 本文 §35–§36）&lt;/span&gt;。&lt;/strong&gt;主力產品是 Blackwell Ultra，新一代 Vera Rubin 已開始量產&lt;span class=&quot;src&quot;&gt;（8-K 2026-08-26 新聞稿 §5）&lt;/span&gt;。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;誰付錢、怎麼賣&lt;/p&gt;&lt;h4&gt;付錢的是少數大型雲端業者與 AI 公司，集中度高&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;直接客戶是代工組裝廠、經銷商與雲端業者，間接客戶含雲端、AI 模型公司、企業與政府&lt;span class=&quot;src&quot;&gt;（10-K 2026-01-25 Item 7 ¶67）&lt;/span&gt;。&lt;/strong&gt;FY2026 單一直接客戶占營收 22%、另一家 14%&lt;span class=&quot;src&quot;&gt;（Item 7 ¶68）&lt;/span&gt;；2026-07-26 五家直接客戶合占應收帳款約七成&lt;span class=&quot;src&quot;&gt;（10-Q 2026-07-26 Item 1 ¶124）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;我們的判讀：前幾大客戶同時是潛在對手，Alphabet、Amazon、Microsoft 都在自研晶片&lt;span class=&quot;src&quot;&gt;（10-K 2026-01-25 Item 1 ¶70）&lt;/span&gt;，議價力是雙向的。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;營收結構：誰在拉動&lt;/p&gt;&lt;h4&gt;成長幾乎全來自資料中心，遊戲已是小業務&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;FY2026 營收 2,159 億美元，資料中心約占 90%、遊戲約 7%&lt;span class=&quot;src&quot;&gt;（推導，10-K 2026-01-25 Item 15 Note 16）&lt;/span&gt;。&lt;/strong&gt;Q2 單季營收 962 億、年增 106%，資料中心年增 117%，約占單季增量的 97%&lt;span class=&quot;src&quot;&gt;（推導，8-K 2026-08-26 本文 §33–§34）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;資料中心內，超大型雲端營收年增逾一倍，AI 雲、產業與企業（&lt;a class=&quot;term&quot; href=&quot;#g1&quot;&gt;ACIE&lt;/a&gt;）年增 138%，由 AI 原生公司、企業與主權客戶拉動&lt;span class=&quot;src&quot;&gt;（8-K 2026-08-26 本文 §34）&lt;/span&gt;。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;市場、地區與重點專案&lt;/p&gt;&lt;h4&gt;美國總部客戶占六成以上，台灣多為代工組裝出貨到美歐&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;依客戶總部地區，FY2026 美國 69%、台灣 20%、中國含香港 9%&lt;span class=&quot;src&quot;&gt;（10-K 2026-01-25 Item 15 Note 16）&lt;/span&gt;；Q2 美國 62%、台灣 28%&lt;span class=&quot;src&quot;&gt;（10-Q 2026-07-26 Item 1 ¶265）&lt;/span&gt;。&lt;/strong&gt;公司估計 FY2026 台灣總部客戶的資料中心營收約 76% 最終用於美國與歐洲&lt;span class=&quot;src&quot;&gt;（10-K Item 15 ¶386）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;重點專案：OpenAI 在俄亥俄州 Portsmouth（俄亥俄州地名）的資料中心，輝達對 SB Energy 約 4.25 GW（十億瓦）電力租約提供&lt;a class=&quot;term&quot; href=&quot;#g5&quot;&gt;殘值保證&lt;/a&gt;，生效於起租&lt;span class=&quot;src&quot;&gt;（8-K 2026-08-17 本文 §3）&lt;/span&gt;；收購 Hugging Face 約 119 億美元，預計 2027 上半年完成&lt;span class=&quot;src&quot;&gt;（8-K 2026-09-03 本文 §1–§2）&lt;/span&gt;。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;跟誰競爭&lt;/p&gt;&lt;h4&gt;對手有晶片公司，也有自研晶片的大客戶&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;公司自列對手：AMD、華為、英特爾等 GPU 與客製晶片供應商，以及 阿里巴巴、Alphabet（Google 母公司）、亞馬遜、百度、微軟 等自研 AI 晶片的雲端公司&lt;span class=&quot;src&quot;&gt;（10-K 2026-01-25 Item 1 ¶69–¶70）&lt;/span&gt;。&lt;/strong&gt;AMD 在自己的 10-K 也把輝達列為資料中心主要對手（SEC 全文搜尋 Q1）。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;外部證據：GSI Technology 10-K 寫 CUDA 帶來顯著轉換成本與生態鎖定（S01）。&lt;/strong&gt;我們的判讀：訓練端領先穩，推論端被自研晶片追近、價格壓力較大（新聞 N2）。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;管理層怎麼說&lt;/p&gt;&lt;h4&gt;公司說法：需求受客戶電力與資金限制，交接不影響路線圖&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;公司說法：Q3 營收指引 1,080 億美元 ±2%、毛利率 74.0%，不計中國資料中心運算營收&lt;span class=&quot;src&quot;&gt;（8-K 2026-08-26 新聞稿 §4）&lt;/span&gt;。&lt;/strong&gt;實績對照：近七季營收全部高於指引上緣（估值輸入 evidence_notes.成長跑道）。&lt;/p&gt;&lt;p&gt;2026-11-12 公告（收盤日前一天）：黃仁勳（Jensen Huang，創辦人）辭任總裁、執行長與董事，財務長 Colette Kress 暫代，Harvey C. Jones 任董事會主席；公司說營運、客戶承諾與產品路線圖預期不中斷&lt;span class=&quot;src&quot;&gt;（8-K 2026-11-12 本文 §2–§3、§10）&lt;/span&gt;。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;年報列的主要風險&lt;/p&gt;&lt;h4&gt;年報風險：代工依賴、客戶建置受限、出口管制、關鍵人物&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;①晶圓靠代工廠、封測靠外包，產能與零件短缺會影響出貨&lt;span class=&quot;src&quot;&gt;（10-K 2026-01-25 Item 1A ¶86）&lt;/span&gt;。&lt;/strong&gt;②客戶建資料中心受土地、電力、廠房與資金限制，可能延後採購&lt;span class=&quot;src&quot;&gt;（10-Q 2026-07-26 Item 2 ¶17）&lt;/span&gt;。③美國出口管制使 H20 銷中國需許可&lt;span class=&quot;src&quot;&gt;（10-Q 2026-07-26 Part II Item 1A ¶31）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;④公司依賴長期任職的高階團隊，接班不順可能妨礙營運&lt;span class=&quot;src&quot;&gt;（10-K 2026-01-25 Item 1A ¶170）&lt;/span&gt;，這條已因執行長辭任成為現實。&lt;/strong&gt;⑤投資組合以美國公債為主，市場下跌可能產生損失&lt;span class=&quot;src&quot;&gt;（Item 1A ¶122）&lt;/span&gt;。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;規模與營運&lt;/p&gt;&lt;h4&gt;四萬多名員工、七成以上做研發&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;FY2026 年底約 42,000 名員工分布 38 國，其中 31,000 人從事研發&lt;span class=&quot;src&quot;&gt;（10-K 2026-01-25 Item 1 ¶102）&lt;/span&gt;。&lt;/strong&gt;公司不自有晶圓廠，資本支出近四季只有 74 億美元（財務指標）。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;moat&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;護城河與成長故事&lt;/p&gt;&lt;h3&gt;護城河寬，來自軟體生態與整櫃系統；推論端被追近。&lt;/h3&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;護城河主要是 CUDA 軟體生態與整櫃系統造成的轉換成本（NVDA-C01）。&lt;/strong&gt;客戶 SharonAI、ChronoScale 在 10-K 寫推論架構針對 CUDA 最佳化、GPU（圖形處理器，AI 運算主力晶片）主要只靠輝達，是外部證據。限制在推論晶片：OpenAI（ChatGPT 開發商）與雲端大客戶自研，分析師估客製晶片數量 2028 年可能超過 GPU（新聞 N2）。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;生命週期上，輝達仍在快速成長，但規模已到年營收 3,000 億美元，成長跑道的市場空間與滲透率公司未揭露。&lt;/strong&gt;我們的判讀：近一兩年靠 Blackwell 到 Vera Rubin（輝達 Blackwell 之後的新一代平台）的換代與客戶擴建延續，之後成長要看客戶電力與資金，利潤率回落是基準假設（明細見計算底稿 5）。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;外部申報證據（非輝達管理層）&lt;/h4&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;S01–S04 來自 SEC 全文搜尋存檔（全文搜尋結果.json Q1–Q3），只當旁證；客戶申報說明依賴，不代表輝達能永久定價。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;直接客戶占營收（FY2026，10-K Item 7 ¶68）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 500 102&quot; role=&quot;img&quot; aria-label=&quot;依賴度&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;230.0&quot; x2=&quot;230.0&quot; y1=&quot;6&quot; y2=&quot;96&quot; class=&quot;zero&quot;/&gt;&lt;text x=&quot;220&quot; y=&quot;23&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;直接客戶 A（未具名）（其他）&lt;/text&gt;&lt;rect x=&quot;230.0&quot; y=&quot;9&quot; width=&quot;192.7&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;430.7&quot; y=&quot;23&quot; class=&quot;val&quot;&gt;22%&lt;/text&gt;&lt;text x=&quot;220&quot; y=&quot;63&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;直接客戶 B（未具名）（其他）&lt;/text&gt;&lt;rect x=&quot;230.0&quot; y=&quot;49&quot; width=&quot;122.6&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;360.6&quot; y=&quot;63&quot; class=&quot;val&quot;&gt;14%&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;編號&lt;/th&gt;&lt;th&gt;申報公司&lt;/th&gt;&lt;th&gt;文件&lt;/th&gt;&lt;th&gt;說法&lt;/th&gt;&lt;th&gt;對論點&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;S01&lt;/td&gt;&lt;td&gt;GSI Technology（記憶體晶片公司）&lt;/td&gt;&lt;td&gt;10-K 2026-06-05&lt;/td&gt;&lt;td&gt;CUDA 平台造成顯著轉換成本與生態鎖定&lt;/td&gt;&lt;td&gt;支持護城河&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;S02&lt;/td&gt;&lt;td&gt;SharonAI Holdings（GPU 雲端業者）&lt;/td&gt;&lt;td&gt;10-K 2026-03-31&lt;/td&gt;&lt;td&gt;提供 B200、B300 等輝達 GPU，為輝達雲端夥伴&lt;/td&gt;&lt;td&gt;支持客戶依賴&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;S03&lt;/td&gt;&lt;td&gt;ChronoScale&lt;/td&gt;&lt;td&gt;10-K 2026-08-19&lt;/td&gt;&lt;td&gt;GPU 目前主要只依賴輝達一家供應商&lt;/td&gt;&lt;td&gt;支持客戶依賴&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;S04&lt;/td&gt;&lt;td&gt;AMD（晶片同業）&lt;/td&gt;&lt;td&gt;10-K 2026-02-04&lt;/td&gt;&lt;td&gt;資料中心主要對手為英特爾與輝達&lt;/td&gt;&lt;td&gt;競爭事實&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;supply&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;供應鏈與產能&lt;/p&gt;&lt;h3&gt;不自建晶圓廠，供應承諾大增，產能鎖定也是風險。&lt;/h3&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;輝達的晶圓、封裝與測試都外包，產能取決於代工與封測廠&lt;span class=&quot;src&quot;&gt;（10-K 2026-01-25 Item 1A ¶86）&lt;/span&gt;。&lt;/strong&gt;供應與產能承諾從上季 1,190 億美元增至 2,790 億&lt;span class=&quot;src&quot;&gt;（10-Q 2026-07-26 Item 2 ¶16）&lt;/span&gt;，表示預期需求延續；需求轉弱時要承擔存貨與採購義務，FY2026 Q1 的 H20 費用 45 億是前例。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;grid2 wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;Israel：占全部營收 vs 占全部長期資產&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 280&quot; role=&quot;img&quot; aria-label=&quot;地區占比&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;246.0&quot; y2=&quot;246.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;250.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;0%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;171.3&quot; y2=&quot;171.3&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;175.3&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;5%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;96.7&quot; y2=&quot;96.7&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;100.7&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;10%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;22.0&quot; y2=&quot;22.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;26.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;15%&lt;/text&gt;&lt;text x=&quot;72.0&quot; y=&quot;268&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY23&lt;/text&gt;&lt;text x=&quot;218.0&quot; y=&quot;268&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY24&lt;/text&gt;&lt;text x=&quot;364.0&quot; y=&quot;268&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY25&lt;/text&gt;&lt;text x=&quot;510.0&quot; y=&quot;268&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY26&lt;/text&gt;&lt;polyline points=&quot;72.0,246.0 218.0,246.0 364.0,246.0 510.0,246.0&quot; fill=&quot;none&quot; stroke=&quot;var(--c2)&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;circle cx=&quot;72.0&quot; cy=&quot;246.0&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c2)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;占營收 FY23：0%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;218.0&quot; cy=&quot;246.0&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c2)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;占營收 FY24：0%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;364.0&quot; cy=&quot;246.0&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c2)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;占營收 FY25：0%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;510.0&quot; cy=&quot;246.0&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c2)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;占營收 FY26：0%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;518.0&quot; y=&quot;250.0&quot; class=&quot;val&quot; fill=&quot;var(--c2)&quot;&gt;0%&lt;/text&gt;&lt;polyline points=&quot;72.0,135.0 218.0,122.0 364.0,46.4 510.0,34.4&quot; fill=&quot;none&quot; stroke=&quot;var(--neg)&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;circle cx=&quot;72.0&quot; cy=&quot;135.0&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--neg)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;占長期資產 FY23：7%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;218.0&quot; cy=&quot;122.0&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--neg)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;占長期資產 FY24：8%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;364.0&quot; cy=&quot;46.4&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--neg)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;占長期資產 FY25：13%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;510.0&quot; cy=&quot;34.4&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--neg)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;占長期資產 FY26：14%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;518.0&quot; y=&quot;38.4&quot; class=&quot;val&quot; fill=&quot;var(--neg)&quot;&gt;14%&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c2)&quot;&gt;&lt;/i&gt;占營收&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--neg)&quot;&gt;&lt;/i&gt;占長期資產&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;growth&quot;&gt;&lt;div class=&quot;qno&quot;&gt;問題 02&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;還在成長嗎？&lt;/div&gt;&lt;h2&gt;還在高速成長，但已是景氣高峰，之後會減速。&lt;/h2&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;成長還很快：近四季營收年增 83.4%，最新單季 105.9%，下季指引約 1,080 億美元（NVDA-C02、C03）。&lt;/strong&gt;投入資本報酬極高，近四季 &lt;a class=&quot;term&quot; href=&quot;#g3&quot;&gt;ROIC&lt;/a&gt; 242.7%、增量 ROIC 185.8%（NVDA-C14），代表每多投入 1 元，多賺的營業利潤超過 1 元。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;成長來源幾乎全是資料中心的出貨量，量與價公司未拆開揭露（拆解見下方區塊）。&lt;/strong&gt;新平台 Vera Rubin 已量產，銜接 Blackwell；供應承諾 2,790 億美元顯示公司預期需求延續。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;限制是景氣位置：總經剖面判在高峰，十一年營業利益率平均 35.6%、最高 62.4%，現在 65% 高於歷史上限（產業指標）。&lt;/strong&gt;客戶建置受電力與資金限制，公司也在 10-Q 寫客戶可能延後採購。&lt;/p&gt;&lt;p&gt;我們的判讀：未來一兩年的量有指引與承諾支撐，三年後的規模沒有可查證據（NVDA-C06），基準情境讓成長在第 3 年後降到 8% 以下。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;毛利率與營業利益率&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 280&quot; role=&quot;img&quot; aria-label=&quot;利潤率&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;246.0&quot; y2=&quot;246.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;250.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;0%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;190.0&quot; y2=&quot;190.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;194.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;20%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;134.0&quot; y2=&quot;134.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;138.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;40%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;78.0&quot; y2=&quot;78.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;82.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;60%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;22.0&quot; y2=&quot;22.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;26.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;80%&lt; e&gt;&lt;/rect&gt;&lt;text x=&quot;265.5&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY26 Q2&lt;/text&gt;&lt;rect x=&quot;305.1&quot; y=&quot;174.0&quot; width=&quot;40.7&quot; height=&quot;92.0&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;單季營收 FY26 Q3：570&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;326.5&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY26 Q3&lt;/text&gt;&lt;text x=&quot;326.5&quot; y=&quot;16.0&quot; class=&quot;note&quot; text-anchor=&quot;middle&quot;&gt;+62%&lt;/text&gt;&lt;rect x=&quot;366.1&quot; y=&quot;156.1&quot; width=&quot;40.7&quot; height=&quot;109.9&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;單季營收 FY26 Q4：681&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;387.5&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY26 Q4&lt;/text&gt;&lt;text x=&quot;387.5&quot; y=&quot;16.0&quot; class=&quot;note&quot; text-anchor=&quot;middle&quot;&gt;+73%&lt;/text&gt;&lt;rect x=&quot;427.1&quot; y=&quot;134.3&quot; width=&quot;40.7&quot; height=&quot;131.7&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;單季營收 FY27 Q1：816&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;448.5&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY27 Q1&lt;/text&gt;&lt;text x=&quot;448.5&quot; y=&quot;16.0&quot; class=&quot;note&quot; text-anchor=&quot;middle&quot;&gt;+85%&lt;/text&gt;&lt;rect x=&quot;488.1&quot; y=&quot;110.8&quot; width=&quot;40.7&quot; height=&quot;155.2&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;單季營收 FY27 Q2：962&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;509.5&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY27 Q2&lt;/text&gt;&lt;text x=&quot;509.5&quot; y=&quot;16.0&quot; class=&quot;note&quot; text-anchor=&quot;middle&quot;&gt;+106%&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c1)&quot;&gt;&lt;/i&gt;單季營收&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;成長來源拆解：量、價、新產品、新市場、併購&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;量：Q2 單季增量約 495 億美元，資料中心約占 97%&lt;span class=&quot;src&quot;&gt;（推導，8-K 2026-08-26 本文 §35–§36）&lt;/span&gt;，由 Blackwell Ultra（Blackwell 平台的強化版）出貨拉動；出貨單位數未揭露。&lt;/strong&gt;價：價格與量未拆分揭露，只有旁證，毛利率由去年同期 72.4% 升到 75.0%，公司歸因於產品組合&lt;span class=&quot;src&quot;&gt;（8-K 2026-08-26 本文 §36）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;新產品：Vera Rubin 與 Spectrum-6（輝達資料中心網路交換器）交換器開始量產出貨，營收占比未揭露（新聞稿 §5）。&lt;/strong&gt;新市場：ACIE 年增 138%、邊緣運算年增 27%（本文 §35–§36）。併購：Hugging Face（開源 AI 模型與資料集平台）約 119 億美元尚未完成，未貢獻營收&lt;span class=&quot;src&quot;&gt;（8-K 2026-09-03）&lt;/span&gt;。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;投入與回報&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;研發投入的回報很高：增量 ROIC 185.8%&lt;span class=&quot;src&quot;&gt;（2024-01-28～2026-01-25，營運投入資本口徑）&lt;/span&gt;，營運槓桿在 FY2025→FY2026 的增量營業利益率約 57%&lt;span class=&quot;src&quot;&gt;（推導，長期財務）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;限制：這是景氣高峰的數字，含商譽的長期口徑 FY2023 只有 18.5%（超額報酬期間檢查）；增量回報轉弱列在改判訊號。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;研發與設備投資（億美元），上方為研發占營收&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 300&quot; role=&quot;img&quot; aria-label=&quot;投入&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;266.0&quot; y2=&quot;266.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;270.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;0.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;185.3&quot; y2=&quot;185.3&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;189.3&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;100&lt;/text&gt;&lt;line x1=&quot;52&quot; x2 /span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c1)&quot;&gt;&lt;/i&gt;營運現金流&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c2)&quot;&gt;&lt;/i&gt;自由現金流&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;錢從哪一層開始不夠：現金流分層&lt;/h3&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;現金流分層（近四季，至 2026-07-26）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;層次&lt;/th&gt;&lt;th&gt;金額&lt;/th&gt;&lt;th&gt;正負&lt;/th&gt;&lt;th&gt;完整度&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;一、營運現金流&lt;/td&gt;&lt;td&gt;1,344 億美元&lt;/td&gt;&lt;td&gt;正&lt;/td&gt;&lt;td&gt;完整&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;二、一般資本支出後&lt;/td&gt;&lt;td&gt;1,270 億美元&lt;/td&gt;&lt;td&gt;正&lt;/td&gt;&lt;td&gt;完整&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;三、回購與股利後&lt;/td&gt;&lt;td&gt;649 億美元&lt;/td&gt;&lt;td&gt;正&lt;/td&gt;&lt;td&gt;完整&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;延伸：再扣併購與員工代扣稅&lt;/td&gt;&lt;td&gt;547 億美元&lt;/td&gt;&lt;td&gt;正&lt;/td&gt;&lt;td&gt;完整&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;數值正負不等於安全或危險：第二層為負代表所列投入超過當期營運現金，不等於營業虧損；資本支出尚未區分維持與擴張。&lt;/p&gt;&lt;p class=&quot;cap&quot;&gt;（算法與完整表見&lt;a href=&quot;#wp-3-4&quot;&gt;計算底稿 3・4&lt;/a&gt;）&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;白話說&lt;/b&gt;帳上每賺 100 元淨利，近四季實際收進可自由運用的現金約 66 元。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;要留意&lt;/b&gt;「現金與證券」只含現金和可交易債券，不含約 939 億的權益證券（股權橋另計，折 19%）。&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;shareholders&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;股東實際拿到什麼？&lt;/p&gt;&lt;h3&gt;主要靠回購，股東收益率約 1.6%。&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;股東回報以回購為主：近四季回購 553 億美元、股利 68 億，股利殖利率 0.2%、回購殖利率 1.4%（收盤 2026-11-13），合計股東收益率 1.6%，約占自由現金流 49%（價值判斷、NVDA-C15）。&lt;/strong&gt;扣股權薪酬後的淨回購殖利率 1.2%（回購扣股權薪酬；收盤 2026-11-13），2026 財年稀釋股數對上一財年 -1.2%（近一財年；股數期間 2016–2026）。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;每股自由現金流近四季 5.21 美元，扣股權薪酬 4.91 美元。&lt;/strong&gt;限制：公司另花 91 億幫員工代扣稅，股權薪酬 72 億，回購有一部分是在抵銷員工股票，不全是股數減少。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;現價隱含年報酬（各情境成真時，非預期報酬）；紅色虛線為公債殖利率 5.10%。基準情境下，現價隱含的年報酬只比公債高 2.5 個百分點，模型的加權資本成本（基準）比公債高 6.4 個百分點，兩者的差距對應市價與合理價值的落差&lt;/p&gt;&lt;svg viewBox=&quot;0 0 500 182&quot; role=&quot;img&quot; aria-label=&quot;現價隱含年報酬對公債&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;168.0&quot; x2=&quot;168.0&quot; y1=&quot;6&quot; y2=&quot;176&quot; class=&quot;zero&quot;/&gt;&lt;line x1=&quot;283.2&quot; x2=&quot;283.2&quot; y1=&quot;4&quot; y2=&quot;178&quot; class=&quot;price&quot;/&gt;&lt;text x=&quot;158&quot; y=&quot;23&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;保守情境成真&lt;/text&gt;&lt;rect x=&quot;168.0&quot; y=&quot;9&quot; width=&quot;114.4&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c4)&quot;/&gt;&lt;text x=&quot;290.4&quot; y=&quot;23&quot; class=&quot;val&quot;&gt;5.06%&lt;/text&gt;&lt;text x=&quot;158&quot; y=&quot;63&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;基準情境成真&lt;/text&gt;&lt;rect x=&quot;168.0&quot; y=&quot;49&quot; width=&quot;171.3&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c1)&quot;/&gt;&lt;text x=&quot;347.3&quot; y=&quot;63&quot; class=&quot;val&quot;&gt;7.58%&lt;/text&gt;&lt;text x=&quot;158&quot; y=&quot;103&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;樂觀情境成真&lt;/text&gt;&lt;rect x=&quot;168.0&quot; y=&quot;89&quot; width=&quot;249.1&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;425.1&quot; y=&quot;103&quot; class=&quot;val&quot;&gt;11.02%&lt;/text&gt;&lt;text x=&quot;158&quot; y=&quot;143&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot; font-weight=&amp;quot;700&amp;quot;&gt;10 年期美國公債&lt;/text&gt;&lt;rect x=&quot;168.0&quot; y=&quot;129&quot; width=&quot;115.2&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--muted)&quot;/&gt;&lt;text x=&quot;291.2&quot; y=&quot;143&quot; class=&quot;val&quot;&gt;5.10%&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;每股自由現金流（美元）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 300&quot; role=&quot;img&quot; aria-label=&quot;每股自由現金流&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;266.0&quot; y2=&quot;266.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;270.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;0.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;185.3&quot; y2=&quot;185.3&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;189.3&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;2.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;104.7&quot; y2=&quot;104.7&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;108.7&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;4.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;24.0&quot; y2=&quot;24.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;28.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;6.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;266.0&quot; y2=&quot;266.0&quot; class=&quot;zero&quot;/&gt;&lt;rect x=&quot;66.6&quot; y=&quot;259.9&quot; width=&quot;32.2&quot; height=&quot;6.1&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;每股自由現金流 FY23：0.2&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;100.8&quot; y=&quot;264.2&quot; width=&quot;32.2&quot; height=&quot;1.8&quot; rx=&quot;2&quot; fill=&quot;var(--c4)&quot;&gt;&lt;title&gt;扣除股權薪酬後 FY23：0.0&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;100.8&quot; y=&quot;288&quot; itle&gt;&lt;/rect&gt;&lt;text x=&quot;491.2&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;近四季&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c1)&quot;&gt;&lt;/i&gt;每股自由現金流&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c4)&quot;&gt;&lt;/i&gt;扣除股權薪酬後&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;白話說&lt;/b&gt;以收盤價買 100 元股票，一年約拿到 0.2 元股利，另有 1.4 元由公司回購承接。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;要留意&lt;/b&gt;舊年度股數未換算 2021、2024 年兩次分割，估值已改用分割調整後股數（推導）。&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;股東回報與市價隱含報酬拆解&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;和公債比，補償不多：基準情境成真時，收盤價買進的推算年報酬約 7.6%&lt;span class=&quot;src&quot;&gt;（基準情境成真時、以收盤 2026-11-13 股價買進的推算年報酬；條件式，非預期報酬、非買賣建議）&lt;/span&gt;＝股利 0.2%＋回購 1.4%＋每股成長與其他 6.0%&lt;span class=&quot;src&quot;&gt;（推算，假設倍數不變）&lt;/span&gt;，10 年期公債 5.10%。&lt;/strong&gt;回報品質中等：回購多但要先抵銷員工股票。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;現價隱含年報酬（基準情境，非預期報酬）從哪裡來：股利、回購是現在拿到的現金，其餘要靠每股成長（紅色虛線為 10 年期美國公債 5.10%）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 500 196&quot; role=&quot;img&quot; aria-label=&quot;市價隱含報酬拆解&quot; class=&quot;chart&quot; style=&quot;max-width:650px&quot;&gt;&lt;line x1=&quot;250.0&quot; x2=&quot;250.0&quot; y1=&quot;24&quot; y2=&quot;192&quot; class=&quot;zero&quot;/&gt;&lt;line x1=&quot;370.3&quot; x2=&quot;370.3&quot; y1=&quot;22&quot; y2=&quot;192&quot; class=&quot;price&quot;/&gt;&lt;text x=&quot;370.3&quot; y=&quot;16&quot; class=&quot;pricelab&quot; text-anchor=&quot;middle&quot;&gt;公債 5.10%&lt;/text&gt;&lt;text x=&quot;240&quot; y=&quot;55.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;股利殖利率&lt;/text&gt;&lt;rect x=&quot;250.0&quot; y=&quot;40.0&quot; width=&qu 與高利潤率延續更久。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;基準情境的故事：明年營收再增約 45%&lt;span class=&quot;src&quot;&gt;（若之後三季都維持下季指引的 1,080 億，次四季約增 43%，推導；所以 45% 主要靠營收不從高檔回落）&lt;/span&gt;，之後幾年降到個位數；營業利益率從 65% 一路回落到 45%，因為半導體是景氣循環，客製晶片會壓價格。&lt;/strong&gt;這樣算每股約 95.22 美元；就算樂觀情境讓利潤率維持近 60%，每股也只有 152.98 美元，仍低於收盤價（NVDA-C06、C07）。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;反方是我們可能低估延續期：近七季營收全超過指引，若利潤率不回落，價值會高很多。&lt;/strong&gt;保守情境每股 57.70 美元，比收盤價低約 65%&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;。若不把證券計入股權橋，中點約低 4%&lt;span class=&quot;src&quot;&gt;（計算核對，推導）&lt;/span&gt;，未達 ±10% 門檻。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;各方法的每股價值區間（美元）：綠底為合理價值，虛線為買入區上緣與市價&lt;/p&gt;&lt;svg viewBox=&quot;0 0 680 290&quot; role=&quot;img&quot; aria-label=&quot;估值區間&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;175.5&quot; x2=&quot;175.5&quot; y1=&quot;28&quot; y2=&quot;264&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;175.5&quot; y=&quot;282&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;50&lt;/text&gt;&lt;line x1=&quot;206.5&quot; x2=&quot;206.5&quot; y1=&quot;28&quot; y2=&quot;264&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;206.5&quot; y=&quot;282&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;100&lt;/text&gt;&lt;line x1=&quot;237.5&quot; x2=&quot;237.5&quot; y1=&quot;28&quot; y2=&quot;264&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;237.5&quot; y=&quot;282&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;150&lt;/text&gt;&lt;line x1=&quot;268.5&quot; x2=&quot;268.5&quot; y1=&quot;28&quot; y2=&quot;264&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;268.5&quot; y=&quot;282&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;200&lt;/text&gt;&lt;line x1=&quot;299.5&quot; x2=&quot;299.5&quot; y1=&quot;28&quot; y2=&quot;264&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;299.5&quot; y=&quot;282&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;2 quot;&gt;&lt;title&gt;保守：67&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;223.4&quot; y=&quot;233.0&quot; class=&quot;val&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--c4)&quot;&gt;保守 67&lt;/text&gt;&lt;circle cx=&quot;274.1&quot; cy=&quot;247.0&quot; r=&quot;7&quot; fill=&quot;var(--c1)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;1.5&quot;&gt;&lt;title&gt;基準：113&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;274.1&quot; y=&quot;271.0&quot; class=&quot;val&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--c1)&quot;&gt;基準 113&lt;/text&gt;&lt;circle cx=&quot;355.1&quot; cy=&quot;247.0&quot; r=&quot;7&quot; fill=&quot;var(--c2)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;1.5&quot;&gt;&lt;title&gt;樂觀：186&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;355.1&quot; y=&quot;233.0&quot; class=&quot;val&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--c2)&quot;&gt;樂觀 186&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;!--/新圖表--&gt;&lt;!--目標區間:正文--&gt;&lt;div class=&quot;block&quot; id=&quot;target-plain&quot;&gt;&lt;h3&gt;12 個月條件式目標區間（條件式、非買賣建議）&lt;/h3&gt;&lt;p&gt;如果三種情境各自成真，一年後（至 2027-11-13）每股價值大約落在：保守 53.77–72.46、基準 86.30–122.25、樂觀 134.33–201.22 美元。這是條件式區間，不是股價預測，三段不合成單一數字。&lt;/p&gt;&lt;h4 style=&quot;margin-top:14px&quot;&gt;下四季申報可以對照什麼&lt;/h4&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt&quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;近四季營收年增&lt;/th&gt;&lt;th&gt;近四季營業利益率&lt;/th&gt;&lt;th&gt;公司特定事件（原文位置）&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;&amp;lt; 37.5%&lt;/td&gt;&lt;td&gt;&amp;lt; 63.50%&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;執行長辭任後的調查或政府行動：董事會內部調查或美國政府調查揭露公司層級出口管制違規、罰款，或新出口限制涵蓋 H200／東南亞，使營收或費用受影響（8-K 2026-11-12 本文 §2–§3；10-Q 2026-07-26 Part II, Item 1A ¶31）；SB Energy 保證因承租人違約觸發或公司認列保證負債（10-Q 2026-07-26 Part I, Item 1 ¶209）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;37.5%–51.5%&lt;/td&gt;&lt;td&gt;63.50%–65.50%&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;FY2027 Q3 財報（2026-11-17）營收落在指引 1,080 億 ±2% 內，且 Q4 指引不低於 Q3 實際（8-K 2026-08-26 新聞稿 §4；8-K 2026-11-12 本文 §11）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;&amp;gt; 51.5%&lt;/td&gt;&lt;td&gt;&amp;gt; 65.50%&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;任命常任執行長且供應承諾續增、毛利率維持 74% 上下，使高利潤率延續的證據增加（10-Q 2026-07-26 Part I, Item 2 ¶16、¶67；8-K 2026-11-12 本文 §8）&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;近四季營收年增 83.4%（2025-07-28～2026-07-26 對 2024-07-29～2025-07-27），較接近樂觀情境的第 1 年假設；近四季營業利益率 65.2%，較接近基準情境。門檻以相鄰情境第 1 年假設的中線為界，只描述哪個情境比較接近，不改機率與研究評等；近四季是未調整的報表數字，作者訂第 1 年假設時若扣除不外推的項目（見本題正文），扣除後可能較接近別的情境；下四季申報後對照，不自動重算目標區間。&lt;/p&gt;&lt;p class=&quot;cap&quot;&gt;算法、關鍵假設、各段需要的市場條件與失效事件（算法與完整表見&lt;a href=&quot;#wp-5&quot;&gt;計算底稿 5&lt;/a&gt;）。&lt;/p&gt;&lt;/div&gt;&lt;!--/目標區間:正文--&gt;&lt;div class=&quot;block&quot; id=&quot;market-demand&quot;&gt;&lt;h3&gt;市價在要求什麼：成長端與倍數端，對照過去實績與模型假設&lt;/h3&gt;&lt;div class=&quot;grid2 wide&quot;&gt;&lt;figure class=figure&gt;&lt;p class=cap&gt;成長端：市價要成立，未來 5 年營收每年要成長多少（紅點基準折現率、線段高低折現率），對照過去實績與模型基準假設（成長推估底稿.json 六、成長性四問並列；推導，只描述）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 190&quot; role=&quot;img&quot; aria-label=&quot;市價要求的成長&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;230.0&quot; x2=&quot;230.0&quot; y1=&quot;8&quot; y2=&quot;168&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;230.0&quot; y=&quot;184&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;0%&lt;/text&gt;&lt;line x1=&quot;295.0&quot; x2=&quot;295.0&quot; y1=&quot;8&quot; y2=&quot;168&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;295.0&quot; y=&quot;184&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;25%&lt;/text&gt;&lt;line x1=&quot;360.0&quot; x2=&quot;360.0&quot; y1=&quot;8&quot; y2=&quot;168&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;360.0&quot; y=&quot;184&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;50%&lt;/text&gt;&lt;line x1=&quot;425.0&quot; x2=&quot;425.0&quot; y1=&quot;8&quot; y2=&quot;168&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;425.0&quot; y=&quot;184&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;75%&lt;/text&gt;&lt;line x1=&quot;490.0&quot; x2=&quot;490.0&quot; y1=&quot;8&quot; y2=&quot;168&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;490.0&quot; y=&quot;184&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;100%&lt;/text&gt;&lt;text x=&quot;220&quot; y=&quot;27&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;過去實績（2016–2026 年複合）&lt;/text&gt;&lt;circle cx=&quot;348.8&quot; cy=&quot;22&quot; r=&quot;7&quot; fill=&quot;var(--c3)&quot;&gt;&lt;title&gt;過去實績（2016–2026 年複合）：46%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;360.8&quot; y=&quot;27&quot; class=&quot;val&quot;&gt;46%&lt;/text&gt;&lt;text x=&quot;220&quot; y=&quot;67&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;過去實績（近四季年增）&lt;/text&gt;&lt;circle cx=&quot;446.8&quot; cy=&quot;62&quot; r=&quot;7&quot; fill=&quot;var(--c3)&quot;&gt;&lt;title&gt;過去實績（近四季年增）：83%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;458.8&quot; y=&quot;67&quot; class=&quot;val&quot;&gt;83%&lt;/text&gt;&lt;text x=&quot;220&quot; y=&quot;107&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;模型基準（未來 5 年平均）&lt;/text&gt;&lt;circle cx=&quot;271.6&quot; cy=&quot;102&quot; r=&quot;7&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;模型基準（未來 5 年平均）：16%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;283.6&quot; y=&quot;107&quot; class=&quot;val&quot;&gt;16%&lt;/text&gt;&lt;text x=&quot;220&quot; y=&quot;147&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;市價要求（未來 5 年年增）&lt;/text&gt;&lt;line x1=&quot;287.2&quot; x2=&quot;312.9&quot; y1=&quot;142&quot; y2=&quot;142&quot; stroke=&quot;var(--neg)&quot; stroke-width=&quot;3&quot; opacity=&quot;.55&quot;/&gt;&lt;circle cx=&quot;297.1&quot; cy=&quot;142&quot; r=&quot;7&quot; fill=&quot;var(--neg)&quot;&gt;&lt;title&gt;市價要求（未來 5 年年增）：26%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;324.9&quot; y=&quot;147&quot; class=&quot;val&quot;&gt;26%&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;figure class=figure&gt;&lt;p class=cap&gt;倍數端：市價要成立，第 10 年出場 EV/EBIT 要多少倍（紅點基準折現率、線段高低折現率），對照模型假設與分產業參考帶 p25–p75（灰帶，直線為中位；估值結果.json#/market_implied_terminal；只描述，不是目標價、不進評等）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 150&quot; role=&quot;img&quot; aria-label=&quot;市價隱含第 10 年倍數&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;172.0&quot; x2=&quot;172.0&quot; y1=&quot;8&quot; y2=&quot;128&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;172.0&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;0 倍&lt;/text&gt;&lt;line x1=&quot;251.5&quot; x2=&quot;251.5&quot; y1=&quot;8&quot; y2=&quot;128&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;251.5&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;10 倍&lt;/text&gt;&lt;line x1=&quot;331.0&quot; x2=&quot;331.0&quot; y1=&quot;8&quot; y2=&quot;128&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;331.0&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;20 倍&lt;/text&gt;&lt;line x1=&quot;410.5&quot; x2=&quot;410.5&quot; y1=&quot;8&quot; y2=&quot;128&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;410.5&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;30 倍&lt;/text&gt;&lt;line x1=&quot;490.0&quot; x2=&quot;490.0&quot; y1=&quot;8&quot; y2=&quot;128&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;490.0&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;40 倍&lt;/text&gt;&lt;rect x=&quot;234.0&quot; y=&quot;11&quot; width=&quot;157.4&quot; height=&quot;22&quot; rx=&quot;4&quot; fill=&quot;var(--line)&quot;&gt;&lt;title&gt;跨產業 參考帶 p25–p75（機械回測樣本，非市場全體；分產業的筆數與公司數少，僅供參考）&lt;/title&gt;&lt;/rect&gt;&lt;line x1=&quot;295.2&quot; x2=&quot;295.2&quot; y1=&quot;11&quot; y2=&quot;33&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;162&quot; y=&quot;27&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;參考帶（跨產業）&lt;/text&gt;&lt;text x=&quot;399.4&quot; y=&quot;27&quot; class=&quot;val&quot;&gt;8 倍–28 倍&lt;/text&gt;&lt;text x=&quot;162&quot; y=&quot;67&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;模型假設（第 10 年）&lt;/text&gt;&lt;circle cx=&quot;231.2&quot; cy=&quot;62&quot; r=&quot;7&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;模型假設（第 10 年）：7 倍&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;243.2&quot; y=&quot;67&quot; class=&quot;val&quot;&gt;7 倍&lt;/text&gt;&lt;text x=&quot;162&quot; y=&quot;107&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;市價隱含（第 10 年）&lt;/text&gt;&lt;line x1=&quot;325.5&quot; x2=&quot;404.5&quot; y1=&quot;102&quot; y2=&quot;102&quot; stroke=&quot;var(--neg)&quot; stroke-width=&quot;3&quot; opacity=&quot;.55&quot;/&gt;&lt;circle cx=&quot;351.0&quot; cy=&quot;102&quot; r=&quot;7&quot; fill=&quot;var(--neg)&quot;&gt;&lt;title&gt;市價隱含（第 10 年）：23 倍&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;416.5&quot; y=&quot;107&quot; class=&quot;val&quot;&gt;23 倍&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;p&gt;&lt;b&gt;成長端：&lt;/b&gt;市價要求未來 5 年營收年增約 25.8%（折現率高低 22.0%～31.9%），高於模型基準 5 年平均 16.0%、低於過去（2016–2026）實績 45.7%。&lt;/p&gt;&lt;p&gt;&lt;b&gt;倍數端：&lt;/b&gt;市價隱含第 10 年 &lt;a class=&quot;term&quot; href=&quot;#g4&quot;&gt;EV/EBIT&lt;/a&gt; 約 22.5 倍，高於模型 7.4 倍，在跨產業參考帶 p25–p75（7.8–27.6 倍）內。&lt;/p&gt;&lt;p&gt;成功幾率（歷史基準比率）：模型基準 10 年實質年增 7.1%，同規模（營收 500 億美元以上）公司歷史上做到的比例 21%（歷史基準比率，非預測）。&lt;/p&gt;&lt;p class=&quot;cap&quot;&gt;兩端是同一條「模型價值＝市價」換不同未知數反解，方向必然一致，不是兩個獨立證據；幅度才有資訊。只描述，不進研究評等、不改價格位置與合理價值，不是目標價，非買賣建議。成長性四問細表、三視角反推、長期倍數條件（算法與完整表見&lt;a href=&quot;#wp-5&quot;&gt;計算底稿 5&lt;/a&gt;）。&lt;/p&gt;&lt;div class=&quot;note-box&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;要撐住現價，營收每年需要成長多少 vs 實際成長（黑色橫線為不同折現率下的隱含營收年增範圍 22%–32%）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 500 262&quot; role=&quot;img&quot; aria-label=&quot;市價隱含成長&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;193.0&quot; x2=&quot;193.0&quot; y1=&quot;6&quot; y2=&quot;256&quot; class=&quot;zero&quot;/&gt;&lt;text x=&quot;183&quot; y=&quot;23&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;FY24 實際成長&lt;/text&gt;&lt;rect x=&quot;193.0&quot; y=&quot;9&quot; width=&quot;226.4&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;427.4&quot; y=&quot;23&quot; class=&quot;val&quot;&gt;125.9%&lt;/text&gt;&lt;text x=&quot;183&quot; y=&quot;63&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;FY25 實際成長&lt;/text&gt;&lt;rect x=&quot;193.0&quot; y=&quot;49&quot; width=&quot;205.4&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;406.4&quot; y=&quot;63&quot; class=&quot;val&quot;&gt;114.2%&lt;/text&gt;&lt;text x=&quot;183&quot; y=&quot;103&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;FY26 實際成長&lt;/text&gt;&lt;rect x=&quot;193.0&quot; y=&quot;89&quot; width=&quot;117.8&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;318.8&quot; y=&quot;103&quot; class=&quot;val&quot;&gt;65.5%&lt;/text&gt;&lt;text x=&quot;183&quot; y=&quot;143&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;FY23–FY26 年均&lt;/text&gt;&lt;rect x=&quot;193.0&quot; y=&quot;129&quot; width=&quot;179.9&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;380.9&quot; y=&quot;143&quot; class=&quot;val&quot;&gt;100.0%&lt;/text&gt;&lt;text x=&quot;183&quot; y=&quot;183&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;最近三季比去年同期&lt;/text&gt;&lt;rect x=&quot;193.0&quot; y=&quot;169&quot; width=&quot;160.1&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;361.1&quot; y=&quot;183&quot; class=&quot;val&quot;&gt;89.0%&lt;/text&gt;&lt;text x=&quot;183&quot; y=&quot;223&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot; font-weight=&amp;quot;700&amp;quot;&gt;市價隱含：未來 5 年每年&lt;/text&gt;&lt;rect x=&quot;193.0&quot; y=&quot;209&quot; width=&quot;46.4&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--neg)&quot;/&gt;&lt;line x1=&quot;232.6&quot; x2=&quot;250.4&quot; y1=&quot;218&quot; y2=&quot;218&quot; stroke=&quot;var(--ink)&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;line x1=&quot;232.6&quot; x2=&quot;232.6&quot; y1=&quot;212&quot; y2=&quot;224&quot; stroke=&quot;var(--ink)&quot;/&gt;&lt;line x1=&quot;250.4&quot; x2=&quot;250.4&quot; y1=&quot;212&quot; y2=&quot;224&quot; stroke=&quot;var(--ink)&quot;/&gt;&lt;text x=&quot;258.4&quot; y=&quot;223&quot; class=&quot;val&quot;&gt;25.8%&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:14px&quot;&gt;市價要求的成長 vs 實績與假設&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;營收年增&lt;/th&gt;&lt;th&gt;來源&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;市價反推，未來 5 年（基準折現率）&lt;/td&gt;&lt;td&gt;25.8%（市價反推未來 5 年營收年增；市價 162.85 美元、收盤 2026-11-13；折現率 11.55%，沿用 2026-11-12 無風險利率 5.10%；推導）&lt;/td&gt;&lt;td&gt;估值結果 reverse_dcf&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;市價反推（低折現率／高折現率）&lt;/td&gt;&lt;td&gt;22.0%（市價反推未來 5 年營收年增；市價 162.85 美元、收盤 2026-11-13；折現率 10.23%，沿用 2026-11-12 無風險利率 5.10%；推導）／31.9%（市價反推未來 5 年營收年增；市價 162.85 美元、收盤 2026-11-13；折現率 13.90%，沿用 2026-11-12 無風險利率 5.10%；推導）&lt;/td&gt;&lt;td&gt;估值結果 reverse_dcf&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準情境第 1–5 年平均&lt;/td&gt;&lt;td&gt;約 16.0%（算術平均；年複合約 15.1%，推導）&lt;/td&gt;&lt;td&gt;估值輸入 scenarios&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;近四季實績&lt;/td&gt;&lt;td&gt;+83.4%&lt;/td&gt;&lt;td&gt;成長推估底稿&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;同類公司次年成長 p75&lt;/td&gt;&lt;td&gt;+40.0%&lt;/td&gt;&lt;td&gt;成長推估底稿&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p&gt;要撐住現價，市場等於要求未來 5 年營收每年成長約 25.8%（換折現率高低兩端約 22.0% 到 31.9%）。這個要求在同規模公司的歷史上屬「歷史罕見」。溢價訊號集中在基本面預期（隱含假設罕見度）。&lt;/p&gt;&lt;p class=&quot;cap&quot;&gt;三視角反推、假設對照實績、歷史基準比率與市價溢價來源（算法與完整表見&lt;a href=&quot;#wp-5&quot;&gt;計算底稿 5&lt;/a&gt;）。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;白話說&lt;/b&gt;收盤價買 100 元，三情境加權的合理價值中點約 62 元（基準情境約 58 元，推導），其餘是市場對延續高成長的期待。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;要留意&lt;/b&gt;偏貴是價格判斷，不是說公司不好；見改判訊號。&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;value&quot;&gt;&lt;div class=&quot;qno&quot;&gt;價值判斷&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;價值判斷：用彼得林奇的方法再看一次&lt;/div&gt;&lt;h2&gt;快速成長股兼景氣循環，用正常化盈餘看並不便宜。&lt;/h2&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;林區分類&lt;/b&gt;快速成長；兼具週期（半導體庫存與客戶資本支出循環）&lt;br&gt;成長還能持續多久、擴張是否仍有利可圖、價格是否已透支成長；兼具週期特徵時須留意高峰利潤率被外推。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;研究評等&lt;/b&gt;&lt;span style=&quot;font-size:20px;font-weight:700&quot;&gt;生意 A ／ 價格偏貴&lt;/span&gt;&lt;br&gt;生意品質依五項證據評定；價格位置三級（買入區、合理、偏貴），依買入上限與合理價值高端判斷，同業與歷史倍數只作交叉核對。非買賣建議。&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;林區分類是快速成長，但兼具半導體景氣循環特徵。&lt;/strong&gt;本益比 20.6 倍（申報 EPS（無非經常項目可扣） 7.91 美元；收盤 2026-11-13） 看起來不高&lt;span class=&quot;src&quot;&gt;（這裡的 7.91 美元其實就是申報 EPS，沒有扣掉權益證券未實現利益；扣除後近似 23.9 倍，推導；下面的 PEG 也用申報口徑）&lt;/span&gt;，過去三年的 PEG 只有 0.10&lt;span class=&quot;src&quot;&gt;（成長口徑 過去三年 EPS 年增 206.6%；收盤 2026-11-13）&lt;/span&gt;，但這是用高峰盈餘與高峰成長算的；改用基準情境推估的成長，PEG 是 1.94&lt;span class=&quot;src&quot;&gt;（成長口徑 基準情境推估、稅後營業利益年增－股數年變化 10.6%；收盤 2026-11-13）&lt;/span&gt;，就不便宜了。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;林區提醒景氣循環股在本益比最低時最危險。&lt;/strong&gt;輝達的利潤率高於自己十一年來的最高值，我們寧可用正常化利潤率看，所以價格位置是偏貴。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;grid2 wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;現金與證券 vs 有息負債（億美元），上方為淨現金&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 300&quot; role=&quot;img&quot; aria-label=&quot;資產負債&quot; class=&quot;c
