&lt;div class=&quot;wrap&quot;&gt;&lt;div class=&quot;top&quot;&gt;&lt;div&gt;&lt;b&gt;META&lt;/b&gt;　Meta Platforms, Inc.（Meta 平台）&lt;/div&gt;&lt;div&gt;財報截至 2026-09-30&lt;/div&gt;&lt;div class=&quot;dl&quot;&gt;&lt;button type=&quot;button&quot; data-dl=&quot;html&quot; data-name=&quot;META_研究報告.html&quot;&gt;下載網頁&lt;/button&gt;&lt;button type=&quot;button&quot; data-dl=&quot;csv&quot; data-name=&quot;META_報告表格.csv&quot;&gt;下載表格（Excel 可開）&lt;/button&gt;&lt;button type=&quot;button&quot; onclick=&quot;window.print()&quot; title=&quot;可選「另存為 PDF」&quot;&gt;列印／另存 PDF&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;front&quot; id=&quot;front&quot; data-layer=&quot;首頁&quot;&gt;&lt;header class=&quot;hero&quot;&gt;&lt;div&gt;&lt;span class=&quot;stance&quot;&gt;生意 B／價格偏貴&lt;/span&gt;&lt;span class=&quot;stance rating&quot;&gt;研究評等　生意 B ／ 價格偏貴（非買賣建議）&lt;/span&gt;&lt;h1&gt;廣告本業仍高成長但單季增速放緩，但 AI 投資把現金流壓到接近零，股價已先算進回報&lt;/h1&gt;&lt;p class=&quot;summary&quot;&gt;Meta 靠 Facebook、Instagram 等應用賣廣告，第三季曝光與單價同時成長，營收年增 26%。代價是資本支出近四季吃掉營運現金流近八成，第三季自由現金流轉負，公司停止回購、改靠發債與特別股。我們推算合理價值 427.32–624.09 美元（中點 515.58 美元），收盤 641.69 美元 高於上緣，研究評等 生意 B／價格偏貴（非買賣建議）。&lt;/p&gt;&lt;/div&gt;&lt;aside class=&quot;pricebox&quot;&gt;&lt;div class=&quot;sub&quot;&gt;2026-11-13 收盤 641.69 美元&lt;/div&gt;&lt;div class=&quot;big&quot;&gt;641.69&lt;span style=&quot;font-size:18px&quot;&gt; 美元&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;zones&quot;&gt;&lt;div class=&quot;zone buy&quot; style=&quot;grid-column:1/-1&quot;&gt;&lt;span&gt;買入區上緣（不確定性高）&lt;/span&gt;&lt;b&gt;309 美元&lt;/b&gt;&lt;small&gt;股價在此以下才有 40% 安全邊際；＝合理價值中點 515.58 ×（1−40%）。非買賣建議。&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;rows&quot;&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;股價 ÷ 合理價值中點&lt;/span&gt;&lt;span&gt;1.24 倍&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;10 年期美國公債&lt;/span&gt;&lt;span&gt;5.15%&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;r&quot;&gt;&lt;span&gt;市價隱含 5 年營收年增&lt;/span&gt;&lt;span&gt;19.4%&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;現金與證券（2026-09-30）&lt;/span&gt;&lt;span&gt;824 億美元&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;有息負債&lt;/span&gt;&lt;span&gt;809 億美元&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;淨現金&lt;/span&gt;&lt;span&gt;15.3 億美元&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;近四季回購&lt;/span&gt;&lt;span&gt;0.0 億美元&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot; style=&quot;display:block&quot;&gt;&lt;span&gt;股東回報與權益（2021–2025）：&lt;/span&gt;&lt;span style=&quot;font-weight:400&quot;&gt;近五年平均 ROE 29%；股東權益 1,249→2,172 億美元；股利＋回購占自由現金流 79%（逐年表見第六題）&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; id=&quot;cont-note&quot; style=&quot;margin:10px 0 0&quot;&gt;這個數字只描述現價與本報告合理價值中點的距離，不改價格位置與研究評等。非買賣建議。&lt;/p&gt;&lt;/aside&gt;&lt;/header&gt;&lt;section class=&quot;note-box&quot; id=&quot;value-trio&quot; style=&quot;margin-top:18px&quot;&gt;&lt;h3&gt;合理價值與市價隱含第 10 年倍數&lt;/h3&gt;&lt;div class=&quot;zones&quot; style=&quot;grid-template-columns:repeat(2,1fr)&quot;&gt;&lt;div class=&quot;zone&quot;&gt;&lt;span&gt;合理價值（只含折現率）&lt;/span&gt;&lt;b&gt;427–624 美元&lt;/b&gt;&lt;small&gt;中點 515.58 美元；三情境機率加權&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;zone mkt&quot;&gt;&lt;span&gt;市價隱含第 10 年倍數（EV/EBIT，基準情境）&lt;/span&gt;&lt;b&gt;13.6 倍&lt;/b&gt;&lt;small&gt;模型假設 8.6 倍，市價隱含是模型的 1.6 倍；折現率區間 12.0–15.5 倍；參考帶（大類：軟體與網路，148 筆、7 家）中位 15.5 倍、四分位 6.0–28.1 倍、p90 46.7 倍（機械回測樣本，非市場全體；分產業的筆數與公司數少，僅供參考）；只描述，不進評等&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;參考帶中位（軟體與網路） 15.5 倍時，機率加權每股約 776 美元（條件式，非目標價、非買賣建議，不進評等；各倍數對照見計算底稿 5）。&lt;/p&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;&lt;b&gt;合理價值 vs 市價隱含倍數（作者判讀）：&lt;/b&gt;市價隱含第 10 年 EV/EBIT 約 13.6 倍，是模型終值倍數 8.6 倍 的 1.59 倍，但仍低於軟體與網路類參考帶中位 15.5 倍；模型倍數偏低是因永續期假設 ROIC 等於折現率，第 10 年後成長不再創造價值。無特例標註，只描述、不作評等理由。&lt;/p&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:10px;font-size:15px;line-height:1.7&quot;&gt;上面的合理價值只含折現率高低；三情境全幅 208～1066（情境與折現率一起算，約中點的 166%）；寬主要來自情境（差距 133%），不是折現率（38%）。情境差距＝（樂觀－保守）÷基準，折現率寬度＝（高－低）÷中點；非買賣建議。&lt;/p&gt;&lt;div class=&quot;tw&quot; style=&quot;margin-top:14px&quot;&gt;&lt;table class=&quot;txt&quot; style=&quot;min-width:0;font-size:16px&quot;&gt;&lt;tr&gt;&lt;th style=&quot;padding:9px 12px;font-size:15px&quot;&gt;情境&lt;/th&gt;&lt;th style=&quot;padding:9px 12px;font-size:15px&quot;&gt;每股價值&lt;/th&gt;&lt;th style=&quot;padding:9px 12px;font-size:15px&quot;&gt;權重&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;padding:9px 12px&quot;&gt;保守&lt;/td&gt;&lt;td style=&quot;padding:9px 12px;font-size:20px;font-weight:700&quot;&gt;244.94&lt;/td&gt;&lt;td style=&quot;padding:9px 12px&quot;&gt;25%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;padding:9px 12px&quot;&gt;基準&lt;div style=&quot;font-size:13px;line-height:1.5;color:var(--muted);margin-top:2px&quot;&gt;與外部 DCF 單點同口徑；今天的現值，不是 12 個月目標價，非買賣建議&lt;/div&gt;&lt;/td&gt;&lt;td style=&quot;padding:9px 12px;font-size:20px;font-weight:700&quot;&gt;471.67&lt;/td&gt;&lt;td style=&quot;padding:9px 12px&quot;&gt;50%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;padding:9px 12px&quot;&gt;樂觀&lt;/td&gt;&lt;td style=&quot;padding:9px 12px;font-size:20px;font-weight:700&quot;&gt;874.02&lt;/td&gt;&lt;td style=&quot;padding:9px 12px&quot;&gt;25%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:10px;font-size:15px;line-height:1.7&quot;&gt;中點是三個情境的加權，上下緣是換折現率重算；算式見&lt;a href=&quot;#valuation&quot;&gt;第五題&lt;/a&gt;。情境表說明合理價值怎麼組成，不是單一目標價。&lt;/p&gt;&lt;/section&gt;&lt;!--目標區間:首頁--&gt;&lt;div class=&quot;note-box tgt&quot; id=&quot;target-front&quot;&gt;&lt;h3&gt;12 個月條件式目標區間&lt;/h3&gt;&lt;p style=&quot;margin:0 0 6px&quot;&gt;如果三種情境各自成真，一年後（至 2027-11-13）每股價值大約落在：保守 226.63–316.82、基準 428.96–626.09、樂觀 789.43–1171.73 美元。這是條件式區間，不是股價預測，三段不合成單一數字。&lt;/p&gt;&lt;figure class=&quot;figure wide&quot;&gt;&lt;svg viewBox=&quot;0 0 860 232&quot; role=&quot;img&quot; aria-label=&quot;今天的價值區間與 12 個月後的條件式目標區間（條件式、非買賣建議）&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;150.2&quot; x2=&quot;150.2&quot; y1=&quot;24&quot; y2=&quot;198&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;150.2&quot; y=&quot;212&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;200&lt;/text&gt;&lt;line x1=&quot;229.0&quot; x2=&quot;229.0&quot; y1=&quot;24&quot; y2=&quot;198&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;229.0&quot; y=&quot;212&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;400&lt;/text&gt;&lt;line x1=&quot;307.8&quot; x2=&quot;307.8&quot; y1=&quot;24&quot; y2=&quot;198&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;307.8&quot; y=&quot;212&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;600&lt;/text&gt;&lt;line x1=&quot;386.6&quot; x2=&quot;386.6&quot; y1=&quot;24&quot; y2=&quot;198&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;386.6&quot; y=&quot;212&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;800&lt;/text&gt;&lt;line x1=&quot;465.4&quot; x2=&quot;465.4&quot; y1=&quot;24&quot; y2=&quot;198&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;465.4&quot; y=&quot;212&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;1000&lt;/text&gt;&lt;line x1=&quot;544.2&quot; x2=&quot;544.2&quot; y1=&quot;24&quot; y2=&quot;198&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;544.2&quot; y=&quot;212&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;1200&lt;/text&gt;&lt;text x=&quot;4&quot; y=&quot;16&quot; class=&quot;lab&quot; font-weight=&quot;700&quot;&gt;今天（依證據的價值；倍數列只作交叉核對）&lt;/text&gt;&lt;text x=&quot;142&quot; y=&quot;42.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;合理價值&lt;/text&gt;&lt;rect x=&quot;239.8&quot; y=&quot;30.0&quot; width=&quot;77.5&quot; height=&quot;16&quot; rx=&quot;8&quot; fill=&quot;var(--pos)&quot; opacity=&quot;0.8&quot;&gt;&lt;title&gt;合理價值：427.3–624.1&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;323.3&quot; y=&quot;42.0&quot; class=&quot;ax&quot;&gt;427.3–624.1；買入區上緣 309.3&lt;/text&gt;&lt;text x=&quot;142&quot; y=&quot;70.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;倍數交叉核對（不進評等）&lt;/text&gt;&lt;rect x=&quot;319.5&quot; y=&quot;58.0&quot; width=&quot;147.6&quot; height=&quot;16&quot; rx=&quot;8&quot; fill=&quot;var(--muted)&quot; opacity=&quot;0.35&quot;&gt;&lt;title&gt;倍數交叉核對（不進評等）：629.8–1004.5&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;473.2&quot; y=&quot;70.0&quot; class=&quot;ax&quot;&gt;629.8–1004.5&lt;/text&gt;&lt;text x=&quot;4&quot; y=&quot;96&quot; class=&quot;lab&quot; font-weight=&quot;700&quot;&gt;12 個月後（條件式目標區間，不進評等）&lt;/text&gt;&lt;text x=&quot;142&quot; y=&quot;122.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;保守 25%&lt;/text&gt;&lt;rect x=&quot;160.7&quot; y=&quot;110.0&quot; width=&quot;35.5&quot; height=&quot;16&quot; rx=&quot;8&quot; fill=&quot;var(--c5)&quot; opacity=&quot;0.85&quot;&gt;&lt;title&gt;保守 25%：226.6–316.8&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;202.2&quot; y=&quot;122.0&quot; class=&quot;ax&quot;&gt;226.63–316.82｜相對現價 −65%～−51%&lt;/text&gt;&lt;text x=&quot;142&quot; y=&quot;150.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;基準 50%&lt;/text&gt;&lt;rect x=&quot;240.4&quot; y=&quot;138.0&quot; width=&quot;77.7&quot; height=&quot;16&quot; rx=&quot;8&quot; fill=&quot;var(--c1)&quot; opacity=&quot;0.85&quot;&gt;&lt;title&gt;基準 50%：429.0–626.1&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;324.1&quot; y=&quot;150.0&quot; class=&quot;ax&quot;&gt;428.96–626.09｜相對現價 −33%～−2%&lt;/text&gt;&lt;text x=&quot;142&quot; y=&quot;178.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;樂觀 25%&lt;/text&gt;&lt;rect x=&quot;382.4&quot; y=&quot;166.0&quot; width=&quot;150.6&quot; height=&quot;16&quot; rx=&quot;8&quot; fill=&quot;var(--c2)&quot; opacity=&quot;0.85&quot;&gt;&lt;title&gt;樂觀 25%：789.4–1171.7&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;539.1&quot; y=&quot;178.0&quot; class=&quot;ax&quot;&gt;789.43–1171.73｜相對現價 +23%～+83%&lt;/text&gt;&lt;line x1=&quot;193.3&quot; x2=&quot;193.3&quot; y1=&quot;27&quot; y2=&quot;49&quot; class=&quot;buyline&quot;/&gt;&lt;line x1=&quot;324.2&quot; x2=&quot;324.2&quot; y1=&quot;24&quot; y2=&quot;198&quot; class=&quot;price&quot;/&gt;&lt;text x=&quot;324.2&quot; y=&quot;228&quot; class=&quot;pricelab&quot; text-anchor=&quot;middle&quot;&gt;現價 641.69&lt;/text&gt;&lt;/svg&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;條件式、非買賣建議；2026-11-13 至 2027-11-13；機率為政策權重，未經歷史校準；細節見第五題。&lt;/p&gt;&lt;/figure&gt;&lt;/div&gt;&lt;!--/目標區間:首頁--&gt;&lt;div class=&quot;kpis&quot;&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;l&quot;&gt;近四季營收年增&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;27.5%&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;截至 2026-09-30；第三季單季 26%&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;l&quot;&gt;營業利益率（近四季）&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;32.9%&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;GAAP；扣和解費用約 37.8%（推導）&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;l&quot;&gt;每股自由現金流扣股權薪酬&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;0.66 美元&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;近四季；未扣前 11.16 美元&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;l&quot;&gt;資本支出強度&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;43.2%&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;資本支出÷營收，近四季&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;note-box&quot; id=&quot;survival&quot; style=&quot;border-left-color:var(--pos)&quot;&gt;&lt;p style=&quot;margin:0&quot;&gt;&lt;b&gt;信用評級&lt;/b&gt;　機構 未揭露／推導 AAA（只看利息保障倍數，30.6 倍，近四季新借款多、利息偏低、評級可能偏高）｜依推導：投資等級　｜　&lt;a href=&quot;#survival-detail&quot;&gt;&lt;b&gt;存活檢查（12～24 個月）&lt;/b&gt;&lt;/a&gt;　&lt;b style=&quot;color:var(--pos)&quot;&gt;無明顯警訊&lt;/b&gt;（推導，非違約預測；理由見第六題計算底稿）&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;grid2 front-pts&quot;&gt;&lt;div&gt;&lt;h3&gt;三個論點&lt;/h3&gt;&lt;ol class=&quot;pts&quot;&gt;&lt;li&gt;廣告量價同增：第三季曝光 +10%、單價 +14%，營收年增 26%，近四季營收都在指引區間內或以上，其中兩季超過上緣。&lt;/li&gt;&lt;li&gt;投入資本報酬仍高：近四季 ROIC 約 35%，網路效應讓廣告主難以離開。&lt;/li&gt;&lt;li&gt;成長不靠併購：營收 97% 以上是廣告，AI 推薦改善轉換率是單價上升的主因（公司說法）。&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;&lt;div&gt;&lt;h3&gt;三個風險&lt;/h3&gt;&lt;ol class=&quot;pts risk&quot;&gt;&lt;li&gt;AI 資本支出吃掉現金流，第三季自由現金流轉負，信評展望轉負。&lt;/li&gt;&lt;li&gt;青少年訴訟未結束：多州和解另有約 53 億附條件、尚未認列；2027 年 2 月學區示範案開審，金額未知。&lt;/li&gt;&lt;li&gt;特別股與遠期售股會讓股數增加約 2%–2.5%（推導）。&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;note-box mv&quot;&gt;&lt;b&gt;市場價格隱含什麼、我們哪裡不同&lt;/b&gt;&lt;p&gt;市價隱含未來五年營收每年約 19.4%（市價反推未來 5 年營收年增；市價 641.69 美元、收盤 2026-11-13；折現率 9.86%；推導），高於我們基準第 1–5 年平均約 13.6%（推算）；市場已把 AI 投資回報先算進去，我們等 AI 新產品營收與現金流回升的證據。&lt;/p&gt;&lt;/div&gt;&lt;div id=&quot;triggers&quot; class=&quot;tm&quot;&gt;&lt;h3&gt;什麼情況會改變判斷&lt;/h3&gt;&lt;div class=&quot;cards&quot;&gt;&lt;div class=&quot;card trig&quot;&gt;單季營收年增連續兩季低於 15%（基準第 2 年假設），重估成長情境。&lt;/div&gt;&lt;div class=&quot;card trig&quot;&gt;增量 ROIC 降到折現率 9.9% 以下，投入回報轉弱，重評投入資本報酬。&lt;/div&gt;&lt;div class=&quot;card trig&quot;&gt;2027 年資本支出指引高於 1,600 億（作者門檻）且自由現金流連兩季為負，資產負債表降為弱。&lt;/div&gt;&lt;div class=&quot;card trig&quot;&gt;學區示範案判決或和解金額超出已認列的法律應計負債，提高保守情境權重。&lt;/div&gt;&lt;div class=&quot;card trig&quot;&gt;近四季扣一次性營業利益率低於 33%（保守第 1 年），重估利潤率路徑。&lt;/div&gt;&lt;div class=&quot;card trig&quot;&gt;收盤價跌到買入區上緣 309.35 美元 以下，價格位置改為買入區。&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap fnote&quot;&gt;資料日期：財報截至 2026-09-30；市場資料 2026-11-13 收盤 641.69 美元。本報告僅供研究用途，研究評等與條件式目標區間都不是買賣建議；數字以 2026-11-13 收盤與 2026-09-30 財報為準。本研究只評估公司本身，不評估讀者自身的資金期限與等待能力。完整數字、名詞與每條判斷的證據狀態見&lt;a href=&quot;#more&quot;&gt;附錄&lt;/a&gt;。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;nav class=&quot;qnav&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;&lt;a href=&quot;#business&quot;&gt;01　生意怎麼賺錢？&lt;/a&gt;&lt;a href=&quot;#growth&quot;&gt;02　成長從哪裡來、能持續多久？&lt;/a&gt;&lt;a href=&quot;#cash&quot;&gt;03・04　賺到的錢有沒有變成現金？股東拿到多少？&lt;/a&gt;&lt;a href=&quot;#valuation&quot;&gt;05　現在的股價合理嗎？&lt;/a&gt;&lt;a href=&quot;#value&quot;&gt;價值判斷與評等&lt;/a&gt;&lt;a href=&quot;#capital&quot;&gt;06　資產負債表撐得住嗎？&lt;/a&gt;&lt;a href=&quot;#events&quot;&gt;07　接下來要盯什麼？&lt;/a&gt;&lt;a href=&quot;#workpaper&quot;&gt;計算底稿&lt;/a&gt;&lt;a href=&quot;#more&quot;&gt;附錄&lt;/a&gt;&lt;/div&gt;&lt;/nav&gt;
&lt;main class=&quot;wrap&quot;&gt;&lt;div data-layer=&quot;正文&quot;&gt;&lt;section class=&quot;q&quot; id=&quot;business&quot;&gt;&lt;div class=&quot;qno&quot;&gt;問題 01&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;生意怎麼賺錢？&lt;/div&gt;&lt;h2&gt;賣社群應用裡的廣告，97% 營收來自廣告&lt;/h2&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;Meta 的錢幾乎全來自廣告：使用者免費用 Facebook、Instagram，廣告主付錢買曝光與成效。&lt;/strong&gt;廣告系統越準，同一則廣告能賣越高的價，這是近年單價上升的主因&lt;span class=&quot;src&quot;&gt;（公司說法，10-Q 2026-09-30 Part I, Item 2 ¶98）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;反方是投入越來越重：近四季研發 765 億、資本支出 1,044 億，硬體部門仍在虧損。&lt;/strong&gt;廣告本業賺錢，但賺來的現金大多又投進 AI 與資料中心，股東能拿到的現金變少（見第三題）。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;產品線營收占比（近四季，億美元；逐年金額與成長見下方明細表；圖的占比分母為圖中各線合計）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 480 280&quot; role=&quot;img&quot; aria-label=&quot;產品線營收&quot; class=&quot;chart&quot; style=&quot;max-width:624px&quot;&gt;&lt;path d=&quot;M240.0,52.0 A88,88 0 1 1 226.3,53.1 L231.6,86.7 A54,54 0 1 0 240.0,86.0 Z&quot; fill=&quot;var(--c1)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;應用家族廣告：2,356（98%）&lt;/title&gt;&lt;/path&gt;&lt;path d=&quot;M226.3,53.1 A88,88 0 0 1 240.0,52.0 L240.0,86.0 A54,54 0 0 0 231.6,86.7 Z&quot; fill=&quot;var(--muted)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;其他：60.2（2%）&lt;/title&gt;&lt;/path&gt;&lt;polyline points=&quot;247.2,231.7 247.8,249.7 346.0,249.7&quot; fill=&quot;none&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;1&quot;/&gt;&lt;text x=&quot;354.0&quot; y=&quot;246.7&quot; class=&quot;lab&quot; text-anchor=&quot;start&quot;&gt;應用家族廣告&lt;/text&gt;&lt;text x=&quot;354.0&quot; y=&quot;264.7&quot; class=&quot;val&quot; text-anchor=&quot;start&quot;&gt;98%&lt;tspan class=&quot;ax&quot; font-weight=&quot;400&quot;&gt;　2,356&lt;/tspan&gt;&lt;/text&gt;&lt;polyline points=&quot;232.8,48.3 232.2,30.3 134.0,30.3&quot; fill=&quot;none&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;1&quot;/&gt;&lt;text x=&quot;126.0&quot; y=&quot;27.3&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;其他&lt;/text&gt;&lt;text x=&quot;126.0&quot; y=&quot;45.3&quot; class=&quot;val&quot; text-anchor=&quot;end&quot;&gt;2%&lt;tspan class=&quot;ax&quot; font-weight=&quot;400&quot;&gt;　60.2&lt;/tspan&gt;&lt;/text&gt;&lt;text x=&quot;240.0&quot; y=&quot;136.0&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;近四季&lt;/text&gt;&lt;text x=&quot;240.0&quot; y=&quot;158.0&quot; class=&quot;val&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:18px&quot;&gt;2,416&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;白話說&lt;/b&gt;每 100 元營收約 98 元來自廣告，扣掉成本與費用後近四季約剩 33 元營業利益。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;要留意&lt;/b&gt;使用者人數成長只剩約 3%，不能用人數推估營收（見改判訊號）。&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;產品線營收明細（億美元；占比為最近財年，分母為各線合計）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;產品線&lt;/th&gt;&lt;th&gt;FY23&lt;/th&gt;&lt;th&gt;FY24&lt;/th&gt;&lt;th&gt;FY25&lt;/th&gt;&lt;th&gt;近四季&lt;/th&gt;&lt;th&gt;最近財年年增&lt;/th&gt;&lt;th&gt;占比&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;應用家族廣告&lt;/td&gt;&lt;td&gt;1,319&lt;/td&gt;&lt;td&gt;1,606&lt;/td&gt;&lt;td&gt;1,962&lt;/td&gt;&lt;td&gt;2,356&lt;/td&gt;&lt;td&gt;22.1%&lt;/td&gt;&lt;td&gt;98%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;應用家族其他收入&lt;/td&gt;&lt;td&gt;11&lt;/td&gt;&lt;td&gt;17&lt;/td&gt;&lt;td&gt;26&lt;/td&gt;&lt;td&gt;38&lt;/td&gt;&lt;td&gt;50.1%&lt;/td&gt;&lt;td&gt;1%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;實境實驗室&lt;/td&gt;&lt;td&gt;19&lt;/td&gt;&lt;td&gt;21&lt;/td&gt;&lt;td&gt;22&lt;/td&gt;&lt;td&gt;22&lt;/td&gt;&lt;td&gt;2.8%&lt;/td&gt;&lt;td&gt;1%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;business-profile&quot;&gt;&lt;h3&gt;生意介紹：年報重點&lt;/h3&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;Meta 是全球最大的社群廣告平台，幾乎所有營收來自&lt;a class=&quot;term&quot; href=&quot;#g5&quot;&gt;應用家族&lt;/a&gt;的廣告，硬體與 AI 新產品仍在投入期。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;賣什麼&lt;/p&gt;&lt;h4&gt;賣的是應用裡的廣告位置，硬體只占約 1%&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;應用家族（Family of Apps，含 Facebook、Instagram、Messenger、WhatsApp）免費給使用者用，靠顯示廣告收費；2025 年廣告營收 1,961.75 億美元，約占 97.6%&lt;span class=&quot;src&quot;&gt;（推算）&lt;/span&gt;，其他應用收入 25.84 億。&lt;/strong&gt;&lt;a class=&quot;term&quot; href=&quot;#g6&quot;&gt;實境實驗室（Reality Labs）&lt;/a&gt;賣 Meta Quest&lt;span class=&quot;src&quot;&gt;（Meta 的虛擬實境頭戴裝置，10-K Item 1）&lt;/span&gt;頭戴裝置與 AI 眼鏡，2025 年營收 22.07 億，仍大幅虧損&lt;span class=&quot;src&quot;&gt;（10-K 2025-12-31 Item 7 ¶88；Note 15）&lt;/span&gt;。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;誰付錢、怎麼賣&lt;/p&gt;&lt;h4&gt;付錢的是數百萬廣告主，沒有單一大客戶&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;付錢的是想觸及消費者的品牌與中小企業，透過自助廣告工具按曝光或成效付費；沒有任何客戶占營收或應收帳款 10% 以上&lt;span class=&quot;src&quot;&gt;（10-K 2025-12-31 Item 8 ¶182）&lt;/span&gt;。&lt;/strong&gt;客戶分散降低單一流失風險，但也代表景氣差時大量中小廣告主會同時縮手；小型品牌 Digital Brands Group 在 10-K 寫付費社群行銷幾乎全在 Facebook 與 Instagram（全文搜尋 Q4，單一例子）。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;營收結構：誰在拉動&lt;/p&gt;&lt;h4&gt;成長幾乎全靠廣告，硬體反而在衰退&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;2025 年應用家族營收增加 364 億、年增 22%，公司說增加幾乎全部來自廣告&lt;span class=&quot;src&quot;&gt;（10-K 2025-12-31 Item 7 ¶112）&lt;/span&gt;。&lt;/strong&gt;2026 年第三季營收 646.0 億、年增 26%&lt;span class=&quot;src&quot;&gt;（8-K 2026-10-21 新聞稿 §3）&lt;/span&gt;，實境實驗室營收反而年減 6%，原因是 Quest 銷量下滑&lt;span class=&quot;src&quot;&gt;（10-Q 2026-09-30 Part I, Item 2 ¶102）&lt;/span&gt;。產品線金額與占比見下圖。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;市場、地區與重點專案&lt;/p&gt;&lt;h4&gt;六成營收在美國以外，亞太是曝光成長最快的地區&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;依客戶地址分，2025 年美國與加拿大 788.66 億（約 39%）、亞太 538.17 億（約 27%）、歐洲 465.69 億（約 23%）、其他地區 217.14 億&lt;span class=&quot;src&quot;&gt;（約 11%，推算）&lt;/span&gt;；美國單獨約 37%，美國以外約 63%&lt;span class=&quot;src&quot;&gt;（10-K 2025-12-31 Note 2 ¶194）&lt;/span&gt;。&lt;/strong&gt;亞太 2021→2025 年營收約翻倍，2026 年第三季各地區曝光都成長，以亞太最快&lt;span class=&quot;src&quot;&gt;（10-Q 2026-09-30 Part I, Item 2 ¶98）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;重點專案是 AI 資料中心：2026 年 7 月與夥伴合資在德州共建資料中心園區，Meta 持股 20%，預估總開發成本約 140 億；路易斯安那合資案約 270 億&lt;span class=&quot;src&quot;&gt;（10-Q 2026-09-30 Part I, Item 1 ¶97、¶100）&lt;/span&gt;。&lt;/strong&gt;2026 年實境實驗室費用約七成投入穿戴裝置&lt;span class=&quot;src&quot;&gt;（10-K 2025-12-31 Item 1 ¶17）&lt;/span&gt;。完工時程公司未揭露&lt;span class=&quot;src&quot;&gt;（查過 Item 1、Item 7）&lt;/span&gt;。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;跟誰競爭&lt;/p&gt;&lt;h4&gt;對手是所有搶使用者時間與廣告預算的平台&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;10-K 寫 Meta 在使用者、廣告主、開發者三方面都面臨激烈競爭，也和前沿 AI 模型與消費硬體公司競爭&lt;span class=&quot;src&quot;&gt;（10-K 2025-12-31 Item 1 ¶24）&lt;/span&gt;；iOS 變更限制廣告追蹤&lt;span class=&quot;src&quot;&gt;（Item 1A ¶128）&lt;/span&gt;。&lt;/strong&gt;Criteo 與 Roblox 的 10-K 都把 Meta 列為主要競爭者（全文搜尋 Q1）。量價同增代表定價力仍在，但平台規則握在 Apple、Google 手上（作者判斷）。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;管理層怎麼說&lt;/p&gt;&lt;h4&gt;公司說成長還會延續，但費用與資本支出一路上修&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;公司說法：第四季營收指引 730–760 億，2026 年資本支出（含融資租賃本金）1,350–1,450 億，排除第三季法律費用後 2026 營業利益仍高於 2025&lt;span class=&quot;src&quot;&gt;（8-K 2026-10-21 新聞稿 §5–7）&lt;/span&gt;。&lt;/strong&gt;對照實績：近四季營收都落在指引區間內或以上，其中 2025 年第四季、2026 年第三季超過上緣，2026 年第一、二季略低於上緣&lt;span class=&quot;src&quot;&gt;（8-K 各季新聞稿）&lt;/span&gt;，營收說到做到；但全年總費用指引兩度上修，資本支出區間只縮窄、沒有下修。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;年報列的主要風險&lt;/p&gt;&lt;h4&gt;最相關的四條：廣告依賴、平台規則、AI 投資、青少年訴訟&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;①幾乎所有營收來自廣告，廣告主縮減預算會重傷業務&lt;span class=&quot;src&quot;&gt;（10-Q 2026-09-30 Part II, Item 1A ¶60）&lt;/span&gt;。&lt;/strong&gt;②Apple、Google 的系統規則可限制廣告追蹤&lt;span class=&quot;src&quot;&gt;（10-K 2025-12-31 Item 1A ¶128）&lt;/span&gt;。③AI 投資規模大，可能無法如期回報&lt;span class=&quot;src&quot;&gt;（10-Q Part II, Item 1A ¶102）&lt;/span&gt;。④青少年訴訟：歐盟已立案調查&lt;span class=&quot;src&quot;&gt;（10-K Item 3 ¶29）&lt;/span&gt;，美國學區示範案 2027 年 2 月開審&lt;span class=&quot;src&quot;&gt;（10-Q Part I, Item 1 ¶179）&lt;/span&gt;。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;規模與營運&lt;/p&gt;&lt;h4&gt;員工約 6.7 萬人，自建資料中心&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;2026 年 9 月底員工 66,775 人、年減 15%&lt;span class=&quot;src&quot;&gt;（8-K 2026-10-21 新聞稿 §5；2025 年底為 78,865 人）&lt;/span&gt;，在 90 多個城市設有辦公室&lt;span class=&quot;src&quot;&gt;（10-K 2025-12-31 Item 1 ¶41）&lt;/span&gt;；自有 30 個資料中心據點，另租用部分資料中心&lt;span class=&quot;src&quot;&gt;（10-K Item 2 ¶3）&lt;/span&gt;。&lt;/strong&gt;2026 年 9 月家族應用&lt;a class=&quot;term&quot; href=&quot;#g4&quot;&gt;每日活躍人數&lt;/a&gt; 36.4 億、年增 3%&lt;span class=&quot;src&quot;&gt;（8-K 2026-10-21 新聞稿 §3）&lt;/span&gt;，人數接近飽和，成長主要靠單價與曝光。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;moat&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;護城河與成長故事&lt;/p&gt;&lt;h3&gt;網路效應與廣告資料規模仍強，分級維持窄&lt;/h3&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;護城河來自 36 億人每天使用帶來的廣告資料與觸及規模，曝光與單價能同時上升是定價力的直接證據。&lt;/strong&gt;外部只有同業 10-K 把 Meta 列為主要競爭者與小型廣告主依賴的原句，沒有市占或議價數據，因此分級維持「窄」、超額報酬期間 5 年（作者判斷）。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;成長跑道：使用者接近飽和，成長改靠單價；營運槓桿從每多 1 元營收多 0.64 元利潤降到約 0.20 元&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;，因折舊與 AI 費用上升。&lt;/strong&gt;指引紀錄好，但成長資金已從自有現金流轉向發債與特別股，六項明細見計算底稿 5。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;外部證據：其他公司 10-K 怎麼寫 Meta&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;四份都是 SEC 全文搜尋找到的他家年報原句（全文搜尋 Q1、Q4）；前三列支持競爭地位，第四列是成本面的長期承諾，不是護城河證據。&lt;/strong&gt;沒有找到市占率或廣告主轉換成本的量化資料。&lt;/p&gt;&lt;p&gt;護城河趨勢圖需要分部毛利，Meta 分部只揭露營收與營業利益，工具畫不出；趨勢改看第二題的 ROIC 與&lt;a class=&quot;term&quot; href=&quot;#g3&quot;&gt;增量 ROIC&lt;/a&gt;。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;公司&lt;/th&gt;&lt;th&gt;申報&lt;/th&gt;&lt;th&gt;原句重點&lt;/th&gt;&lt;th&gt;代表什麼&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Criteo（法國廣告科技公司，Criteo 10-K；廣告科技）&lt;/td&gt;&lt;td&gt;10-K 2026-02-26&lt;/td&gt;&lt;td&gt;把 Amazon、Meta、Google、Microsoft 列為大型、地位穩固的競爭者&lt;/td&gt;&lt;td&gt;廣告預算爭奪中 Meta 屬第一梯隊&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Roblox（線上遊戲平台，Roblox 10-K；遊戲平台）&lt;/td&gt;&lt;td&gt;10-K 2026-02-11&lt;/td&gt;&lt;td&gt;在使用者與使用時數上與 Meta 等科技巨頭競爭&lt;/td&gt;&lt;td&gt;搶使用者時間的對手不只社群&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Digital Brands Group（小型服飾）&lt;/td&gt;&lt;td&gt;10-K 2026-04-15&lt;/td&gt;&lt;td&gt;付費社群行銷幾乎全在 Facebook 與 Instagram&lt;/td&gt;&lt;td&gt;小型廣告主依賴度高（單一例子）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;CoreWeave（AI 雲端算力租賃商，CoreWeave 10-K；雲端算力）&lt;/td&gt;&lt;td&gt;10-K 2026-03-02&lt;/td&gt;&lt;td&gt;Meta 承諾支付最多約 142 億美元算力費用至 2031 年底&lt;/td&gt;&lt;td&gt;AI 算力部分外包，屬長期承諾&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;supply&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;供應鏈與地區&lt;/p&gt;&lt;h3&gt;營收六成來自美國以外，算力供應部分仰賴外部&lt;/h3&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;Meta 自建資料中心，但伺服器、網路設備與部分算力向外採購；Celestica&lt;span class=&quot;src&quot;&gt;（加拿大電子代工廠，Celestica 10-K）&lt;/span&gt;把 Meta 列為資料中心硬體客戶，CoreWeave 則有最多約 142 億美元的算力合約（全文搜尋 Q1、Q3）。&lt;/strong&gt;不可取消的合約承諾達 4,545 億，多為雲端算力、伺服器與資料中心能源&lt;span class=&quot;src&quot;&gt;（10-Q 2026-09-30 Part I, Item 2 ¶164）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;10-K 寫產品與服務仰賴零組件、電力與網路容量的持續供應&lt;span class=&quot;src&quot;&gt;（10-K 2025-12-31 Item 1 ¶26）&lt;/span&gt;；供應商占比公司未揭露，全文搜尋也沒找到 Meta 占供應商營收比重的原句，因此不畫依賴度圖。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;grid2 wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;Rest of the world：占全部營收 vs 占全部長期資產&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 280&quot; role=&quot;img&quot; aria-label=&quot;地區占比&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;246.0&quot; y2=&quot;246.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;250.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;0%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;190.0&quot; y2=&quot;190.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;194.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;5%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;134.0&quot; y2=&quot;134.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;138.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;10%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;78.0&quot; y2=&quot;78.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;82.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;15%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;22.0&quot; y2=&quot;22.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;26.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;20%&lt;/text&gt;&lt;text x=&quot;72.0&quot; y=&quot;268&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY22&lt;/text&gt;&lt;text x=&quot;218.0&quot; y=&quot;268&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY23&lt;/text&gt;&lt;text x=&quot;364.0&quot; y=&quot;268&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY24&lt;/text&gt;&lt;text x=&quot;510.0&quot; y=&quot;268&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY25&lt;/text&gt;&lt;polyline points=&quot;72.0,246.0 218.0,246.0 364.0,246.0 510.0,246.0&quot; fill=&quot;none&quot; stroke=&quot;var(--c2)&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;circle cx=&quot;72.0&quot; cy=&quot;246.0&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c2)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;占營收 FY22：0%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;218.0&quot; cy=&quot;246.0&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c2)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;占營收 FY23：0%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;364.0&quot; cy=&quot;246.0&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c2)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;占營收 FY24：0%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;510.0&quot; cy=&quot;246.0&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c2)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;占營收 FY25：0%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;518.0&quot; y=&quot;250.0&quot; class=&quot;val&quot; fill=&quot;var(--c2)&quot;&gt;0%&lt;/text&gt;&lt;polyline points=&quot;72.0,53.4 218.0,63.1 364.0,91.6 510.0,112.8&quot; fill=&quot;none&quot; stroke=&quot;var(--neg)&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;circle cx=&quot;72.0&quot; cy=&quot;53.4&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--neg)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;占長期資產 FY22：17%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;218.0&quot; cy=&quot;63.1&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--neg)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;占長期資產 FY23：16%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;364.0&quot; cy=&quot;91.6&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--neg)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;占長期資產 FY24：14%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;510.0&quot; cy=&quot;112.8&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--neg)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;占長期資產 FY25：12%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;518.0&quot; y=&quot;116.8&quot; class=&quot;val&quot; fill=&quot;var(--neg)&quot;&gt;12%&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c2)&quot;&gt;&lt;/i&gt;占營收&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--neg)&quot;&gt;&lt;/i&gt;占長期資產&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;growth&quot;&gt;&lt;div class=&quot;qno&quot;&gt;問題 02&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;成長從哪裡來、能持續多久？&lt;/div&gt;&lt;h2&gt;量價同增撐住成長，但增速正逐季放緩&lt;/h2&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;成長仍強但在放緩：近四季營收年增 27.5%，單季從 33% 降到第三季 26%。&lt;/strong&gt;基準情境假設第 1 年 20%、之後逐年降到 10%，比市價要求的低（見第五題）。&lt;/p&gt;&lt;p&gt;第三季曝光 +10%、單價 +14%，價格的貢獻已超過數量；公司把單價上升歸功於廣告投放與衡量工具改善&lt;span class=&quot;src&quot;&gt;（10-Q Part I, Item 2 ¶98）&lt;/span&gt;，這部分要看 AI 推薦能否持續提升廣告成效。&lt;/p&gt;&lt;p&gt;新產品還沒貢獻：AI 助理、AI 眼鏡等新產品營收公司未揭露，我們沒有把它們計入估值上修；實境實驗室第三季營收反而年減 6%。&lt;/p&gt;&lt;p&gt;反方：營運槓桿正在縮小，每多 1 元營收帶來的營業利益從 2022→2025 的約 0.64 元降到近四季約 0.20 元&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;，成長要花更多成本。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;最近 8 季營收（億美元），上方為比去年同季&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 300&quot; t; y=&quot;122.3&quot; width=&quot;40.7&quot; height=&quot;143.7&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;單季營收 FY25 Q2：475&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;204.5&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY25 Q2&lt;/text&gt;&lt;rect x=&quot;244.2&quot; y=&quot;111.0&quot; width=&quot;40.7&quot; height=&quot;155.0&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;單季營收 FY25 Q3：512&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;265.5&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY25 Q3&lt;/text&gt;&lt;rect x=&quot;305.1&quot; y=&quot;84.8&quot; width=&quot;40.7&quot; height=&quot;181.2&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;單季營收 FY25 Q4：599&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;326.5&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY25 Q4&lt;/text&gt;&lt;text x=&quot;326.5&quot; y=&quot;16.0&quot; class=&quot;note&quot; text-anchor=&quot;middle&quot;&gt;+24%&lt;/text&gt;&lt;rect x=&quot;366.1&quot; y=&quot;95.7&quot; width=&quot;40.7&quot; height=&quot;170.3&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;單季營收 FY26 Q1：563&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;387.5&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY26 Q1&lt;/text&gt;&lt;text x=&quot;387.5&quot; y=&quot;16.0&quot; class=&quot;note&quot; text-anchor=&quot;middle&quot;&gt;+33%&lt;/text&gt;&lt;rect x=&quot;427.1&quot; y=&quot;82.1&quot; width=&quot;40.7&quot; height=&quot;183.9&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;單季營收 FY26 Q2：608&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;448.5&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY26 Q2&lt;/text&gt;&lt;text x=&quot;448.5&quot; y=&quot;16.0&quot; class=&quot;note&quot; text-anchor=&quot;middle&quot;&gt;+28%&lt;/text&gt;&lt;rect x=&quot;488.1&quot; y=&quot;70.6&quot; width=&quot;40.7&quot; height=&quot;195.4&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;單季營收 FY26 Q3：646&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;509.5&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY26 Q3&lt;/text&gt;&lt;text x=&quot;509.5&quot; y=&quot;16.0&quot; class=&quot;note&quot; text-anchor=&quot;middle&quot;&gt;+26%&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c1)&quot;&gt;&lt;/i&gt;單季營收&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;成長來源拆解：量、價、新產品、新市場、併購&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;量：第三季廣告曝光 +10%，前九個月 +14%，主要來自亞太使用者與使用時間增加及廣告頻次。&lt;/strong&gt;價：每則廣告單價第三季 +14%、前九個月 +13%，來自廣告需求上升&lt;span class=&quot;src&quot;&gt;（10-Q 2026-09-30 Part I, Item 2 ¶98）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;新產品：AI 助理與 AI 眼鏡營收未揭露（資料不足）。&lt;/strong&gt;新市場：亞太曝光成長最快，但沒有新地區開放的揭露。併購：無，2025 年營收增加幾乎全部來自既有廣告&lt;span class=&quot;src&quot;&gt;（10-K Item 7 ¶112）&lt;/span&gt;。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;投入與回報&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;投入仍有回報但在下滑：2023→2025 年增量 ROIC 約 26.9%，高於折現率 9.9%；但投入資本一年多增加約四成，近四季研發占營收約 32%&lt;span class=&quot;src&quot;&gt;（推算）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;若把研發當投資資本化，2025 年 ROIC 從 36.0% 降到 26.1%&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;。&lt;/strong&gt;增量 ROIC 若跌破折現率，代表新增投資不再創造價值（見改判訊號）。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;研發與設備投資（億美元），上方為研發占營收&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 300&quot; role=&quot;img&quot; aria-label=&quot;投入&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;266.0&quot; y2=&quot;266.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot; &lt;tr&gt;&lt;td&gt;延伸：再扣併購與員工代扣稅&lt;/td&gt;&lt;td&gt;已知部分 62.1 億美元&lt;/td&gt;&lt;td&gt;無法判定&lt;/td&gt;&lt;td&gt;缺併購&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;數值正負不等於安全或危險：第二層為負代表所列投入超過當期營運現金，不等於營業虧損；資本支出尚未區分維持與擴張。&lt;/p&gt;&lt;p class=&quot;cap&quot;&gt;（算法與完整表見&lt;a href=&quot;#wp-3-4&quot;&gt;計算底稿 3・4&lt;/a&gt;）&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;白話說&lt;/b&gt;每 100 元營運現金流，近四季約 78 元又拿去蓋資料中心與買伺服器。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;要留意&lt;/b&gt;淨利高不等於能發給股東的現金（見改判訊號）。&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;shareholders&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;股東拿到多少？&lt;/p&gt;&lt;h3&gt;停止回購，未來反而會增加股數&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;股東回報明顯縮水：近四季回購為 0，只剩約 0.3% 的股利殖利率；扣股權薪酬後淨回購殖利率 -1.6%（回購扣股權薪酬；收盤 2026-11-13）。&lt;/strong&gt;股數過去在減少（2025 財年 -1.5%（近一財年；股數期間 2015–2025）），但 2026 年 10 月發行&lt;a class=&quot;term&quot; href=&quot;#g9&quot;&gt;強制轉換特別股&lt;/a&gt;、另簽&lt;a class=&quot;term&quot; href=&quot;#g8&quot;&gt;遠期售股&lt;/a&gt;，未來股數約增 2%–2.5%&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;另一件事是 Class C（C 類普通股）無投票權股：每股 A、B 股配 1 股 C 股，效果等同一拆二，發放後每股數字要除以 2&lt;span class=&quot;src&quot;&gt;（10-Q 2026-09-30 Part I, Item 1 ¶232）&lt;/span&gt;。&lt;/strong&gt;這對價值沒有影響，但讓公司未來能發無投票權股融資。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;股東回饋對自由現金流（億美元）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 300&quot; role=&quot;img&quot; aria-label=&quot;股東回饋&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;266.0&quot; y2=&quot;266.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;270.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;0.0&lt;/text&gt;&lt;line x1=&quot;52 )&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;稀釋股數年增 2025：-2%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;431.7&quot; y=&quot;172.8&quot; class=&quot;val&quot; fill=&quot;var(--neg)&quot;&gt;-2%&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c6)&quot;&gt;&lt;/i&gt;股票薪酬占營收&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--neg)&quot;&gt;&lt;/i&gt;稀釋股數年增&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/div&gt;&lt;!--/新圖表--&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;白話說&lt;/b&gt;持有 100 元股票，一年約領 0.3 元股利，沒有回購幫忙。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;要留意&lt;/b&gt;一拆二後股價與每股數字都會減半，不是跌價。&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;股東回報與市價隱含報酬拆解&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;和公債比：基準情境推算年報酬約 8.2%&lt;span class=&quot;src&quot;&gt;（基準情境成真時、以收盤 2026-11-13 股價買進的推算年報酬；條件式，非預期報酬、非買賣建議）&lt;/span&gt;，幾乎全部要靠每股成長，股利只有 0.3%、回購為 0；10 年期公債約 5.15%，差距約 3 個百分點&lt;span class=&quot;src&quot;&gt;（推算，非預期報酬）&lt;/span&gt;。&lt;/strong&gt;回報品質偏弱，因為未來還有特別股轉換與遠期售股帶來的稀釋。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;現價隱含年報酬（基準情境，非預期報酬）從哪裡來：股利、回購是現在拿到的現金，其餘要靠每股成長（紅色虛線為 10 年期美國公債 5.15%）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 500 196&quot; role=&quot;img&quot; aria-label=&quot;市價隱含報酬拆解&quot; class=&quot;chart&quot; style=&quot;max-width:650px&quot;&gt;&lt;line x1=&quot;250.0&quot; x2=&quot;250.0&quot; y1=&quot;24&quot; y2=&quot;192&quot; class=&quot;zero&quot;/&gt;&lt;line x1=&quot;361.7&quot; x2=&quot;361.7&quot; y1=&quot;22&quot; y2=&quot;192&quot; class=&quot;price&quot;/&gt;&lt;text x=&quot;361.7&quot; y=&quot;16&quot; class=&quot;pricelab&quot; text-anchor=&quot;middle&quot;&gt;公債 5.15%&lt;/text&gt;&lt;text x=&quot;240&quot; y=&quot;55.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;股利殖利率&lt;/text&gt;&lt;rect x=&quot;250.0&quot; y=&quot;40.0&quot; width=&quot;7.1&quot; height=&quot;20&quot; rx=&quot;4&quot; fill=&quot;var(--c2)&quot;&gt;&lt;title&gt;股利殖利率：0.33%&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;265.1&quot; y=&quot;55.0&quot; class=&quot;val&quot;&gt;0.33%&lt;/text&gt;&lt;line x1=&quot;257.1&quot; x2=&quot;257.1&quot; y1=&quot;60.0&quot; y2=&quot;80.0&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;1&quot; stroke-dasharray=&quot;2 3&quot;/&gt;&lt;text x=&quot;240&quot; y=&quot;95.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;回購殖利率&lt;/text&gt;&lt;rect x=&quot;257.1&quot; y=&quot;80.0&quot; width=&quot;2.0&quot; height=&quot;20&quot; rx=&quot;4&quot; fill=&quot;var(--c6)&quot;&gt;&lt;title&gt;回購殖利率：+0.00%&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;265.1&quot; y=&quot;95.0&quot; class=&quot;val&quot;&gt;+0.00%&lt;/text&gt;&lt;line x1=&quot;257.1&quot; x2=&quot;257.1&quot; y1=&quot;100.0&quot; y2=&quot;120.0&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;1&quot; stroke-dasharray=&quot;2 3&quot;/&gt;&lt;text x=&quot;240&quot; y=&quot;135.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;每股成長與其他（推算）&lt;/text&gt;&lt;rect x=&quot;257.1&quot; y=&quot;120.0&quot; width=&quot;171.7&quot; height=&quot;20&quot; rx=&quot;4&quot; fill=&quot;var(--c3)&quot;&gt;&lt;title&gt;每股成長與其他（推算）：+7.92%&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;436.8&quot; y=&quot;135.0&quot; class=&quot;val&quot;&gt;+7.92%&lt;/text&gt;&lt;line x1=&quot;428.8&quot; x2=&quot;428.8&quot; y1=&quot;140.0&quot; y2=&quot;160.0&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;1&quot; stroke-dasharray=&quot;2 3&quot;/&gt;&lt;text x=&quot;240&quot; y=&quot;175.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;合計：現價隱含年報酬（基準情境，非預期報酬）&lt;/text&gt;&lt;rect x=&quot;250.0&quot; y=&quot;160.0&quot; width=&quot;178.8&quot; height=&quot;20&quot; rx=&quot;4&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;合計：現價隱含年報酬（基準情境，非預期報酬）：8.25%&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;436.8&quot; y=&quot;175.0&quot; class=&quot;val&quot;&gt;8.25%&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;股利、回購、股數變化與政策門檻的逐項判讀（算法與完整表見&lt;a href=&quot;#wp-3-4&quot;&gt;計算底稿 3・4&lt;/a&gt;）。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;valuation&quot;&gt;&lt;div class=&quot;qno&quot;&gt;問題 05&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;現在的股價合理嗎？&lt;/div&gt;&lt;h2&gt;收盤價高於合理價值上緣，價格偏貴&lt;/h2&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;我們推算合理價值 427.32–624.09 美元，中點 515.58 美元；收盤 641.69 美元 約是中點的 1.24 倍（收盤 2026-11-13 股價 641.69 美元 ÷ 合理價值中點 515.58 美元；只描述距離，非買賣建議），價格位置 偏貴。&lt;/strong&gt;基準情境成真時，以現價買進的推算年報酬約 8.2%&lt;span class=&quot;src&quot;&gt;（基準情境成真時、以收盤 2026-11-13 股價買進的推算年報酬；條件式，非預期報酬、非買賣建議）&lt;/span&gt;（條件式，非預期報酬）。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;基準情境的故事是：廣告維持量價同增但逐年放緩，利潤率因折舊上升先降後回升，第 6 年起超額報酬逐步消失。&lt;/strong&gt;市價則要求未來五年營收每年約 19.4%&lt;span class=&quot;src&quot;&gt;（市價反推未來 5 年營收年增；市價 641.69 美元、收盤 2026-11-13；折現率 9.86%；推導）&lt;/span&gt;，接近近四季的實績、明顯高於我們的基準，等於把 AI 投資回報先算進去。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;反方是稅率：若改用近四季有效稅率 4.6%（只改基準），合理價值中點約 +9.3%（563.75），收盤價會落在區間內；三情境都改約 +20.1%&lt;span class=&quot;src&quot;&gt;（推導，計算核對）&lt;/span&gt;。&lt;/strong&gt;我們不採用，因 4.6% 被第一季一次性稅務利益墊低，公司第四季稅率指引為 15–17%。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;各方法的每股價值區間（美元）：綠底為合理價值，虛線為買入區上緣與市價&lt;/p&gt;&lt;svg viewBox=&quot;0 0 680 256&quot; role=&quot;img&quot; aria-label=&quot;估值區間&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;180.2&quot; x2=&quot;180.2&quot; y1=&quot;28&quot; y2=&quot;230&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;180.2&quot; y=&quot;248&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;200&lt;/text&gt;&lt;line x1=&quot;201.9&quot; x2=&quot;201.9&quot; y1=&quot;28&quot; y2=&quot;230&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;201.9&quot; y=&quot;248&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;250&lt;/text&gt;&lt;line x1=&quot;223.7&quot; x2=&quot;223.7&quot; y1=&quot;28&quot; y2=&quot;230&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;223.7&quot; y=&quot;248&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;300&lt;/text&gt;&lt;line x1=&quot;245.4&quot; x2=&quot;245.4&quot; y1=&quot;28&quot; y2=&quot;230&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;245.4&quot; y=&quot;248&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;350&lt;/text&gt;&lt;line x1=&quot;267.2&quot; x2=&quot;267.2&quot; y1=&quot;28&quot; y2=&quot;230&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;267.2&quot; y=&quot;248&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;400&lt;/text&gt;&lt;line x1=&quot;288.9&quot; x2=&quot;288.9&quot; y1=&quot;28&quot; y2=&quot;230&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;288.9&quot; y=&quot;248&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;450&lt;/text&gt;&lt;line x1=&quot;310.6&quot; x2=&quot;310.6&quot; y1=&quot;28&quot; y2=&quot;230&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;310.6&quot; y=&quot;248&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;500&lt;/text&gt;&lt;line x1=&quot;332.4&quot; x2=&quot;332.4&quot; y1=&quot;28&quot; y2=&quot;230&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;332.4&quot; y=&quot;248&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;550&lt;/text&gt;&lt;line x1=&quot;354.1&quot; x2=&quot;354.1&quot; y1=&quot;28&quot; y2=&quot;230&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;354.1&quot; y=&quot;248&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;600&lt;/text&gt;&lt;line x1=&quot;375.9&quot; x2=&quot;375.9&quot; y1=&quot;28&quot; y2=&quot;230&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;375.9&quot; y=&quot;248&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;650&lt;/text&gt;&lt;line 開始揭露 AI 代理或新產品營收（8-K 2026-10-21 新聞稿 §3）&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;近四季營收年增 27.5%（2025-10-01～2026-09-30 對 2024-10-01～2025-09-30），較接近樂觀情境的第 1 年假設；近四季營業利益率 32.9%，較接近保守情境。門檻以相鄰情境第 1 年假設的中線為界，只描述哪個情境比較接近，不改機率與研究評等；近四季是未調整的報表數字，作者訂第 1 年假設時若扣除不外推的項目（見本題正文），扣除後可能較接近別的情境；下四季申報後對照，不自動重算目標區間。&lt;/p&gt;&lt;p class=&quot;cap&quot;&gt;算法、關鍵假設、各段需要的市場條件與失效事件（算法與完整表見&lt;a href=&quot;#wp-5&quot;&gt;計算底稿 5&lt;/a&gt;）。&lt;/p&gt;&lt;/div&gt;&lt;!--/目標區間:正文--&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;市價要求的成長：對照過去實績與歷史基準比率&lt;/h3&gt;&lt;div class=&quot;note-box&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;要撐住現價，營收每年需要成長多少 vs 實際成長（黑色橫線為不同折現率下的隱含營收年增範圍 15%–24%）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 500 262&quot; role=&quot;img&quot; aria-label=&quot;市價隱含成長&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;193.0&quot; x2=&quot;193.0&quot; y1=&quot;6&quot; y2=&quot;256&quot; class=&quot;zero&quot;/&gt;&lt;text x=&quot;183&quot; y=&quot;23&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;FY23 實際成長&lt;/text&gt;&lt;rect x=&quot;193.0&quot; y=&quot;9&quot; width=&quot;123.3&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;324.3&quot; y=&quot;23&quot; class=&quot;val&quot;&gt;15.7%&lt;/text&gt;&lt;text x=&quot;183&quot; y=&quot;63&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;FY24 實際成長&lt;/text&gt;&lt;rect x=&quot;193.0&quot; y=&quot;49&quot; width=&quot;172.4&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;373.4&quot; y=&quot;63&quot; class=&quot;val&quot;&gt;21.9%&lt;/text&gt;&lt;text x=&quot;183&quot; y=&quot;103&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;FY25 實際成長&lt;/text&gt;&lt;rect x=&quot;193.0&quot; y=&quot;89&quot; width=&quot;174.2&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;375.2&quot; y=&quot;103&quot; class=&quot;val&quot;&gt;22.2%&lt;/text&gt;&lt;text x=&quot;183&quot; y=&quot;143&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;FY22–FY25 年均&lt;/text&gt;&lt;rect x=&quot;193.0&quot; y=&quot;129&quot; width=&quot;156.3&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;357.3&quot; y=&quot;143&quot; class=&quot;val&quot;&gt;19.9%&lt;/text&gt;&lt;text x=&quot;183&quot; y=&quot;183&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;最近三季比去年同期&lt;/text&gt;&lt;rect x=&quot;193.0&quot; y=&quot;169&quot; width=&quot;226.4&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;427.4&quot; y=&quot;183&quot; class=&quot;val&quot;&gt;28.8%&lt;/text&gt;&lt;text x=&quot;183&quot; y=&quot;223&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot; font-weight=&amp;quot;700&amp;quot;&gt;市價隱含：未來 5 年每年&lt;/text&gt;&lt;rect x=&quot;193.0&quot; y=&quot;209&quot; width=&quot;152.8&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--neg)&quot;/&gt;&lt;line x1=&quot;311.2&quot; x2=&quot;382.7&quot; y1=&quot;218&quot; y2=&quot;218&quot; stroke=&quot;var(--ink)&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;line x1=&quot;311.2&quot; x2=&quot;311.2&quot; y1=&quot;212&quot; y2=&quot;224&quot; stroke=&quot;var(--ink)&quot;/&gt;&lt;line x1=&quot;382.7&quot; x2=&quot;382.7&quot; y1=&quot;212&quot; y2=&quot;224&quot; stroke=&quot;var(--ink)&quot;/&gt;&lt;text x=&quot;390.7&quot; y=&quot;223&quot; class=&quot;val&quot;&gt;19.4%&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:14px&quot;&gt;市價要求的成長 vs 我們的假設&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;市價要求（推導）&lt;/th&gt;&lt;th&gt;基準情境&lt;/th&gt;&lt;th&gt;近期實績&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;未來五年營收年增&lt;/td&gt;&lt;td&gt;19.4%（市價反推未來 5 年營收年增；市價 641.69 美元、收盤 2026-11-13；折現率 9.86%；推導）&lt;/td&gt;&lt;td&gt;第 1 年 20%，逐年降到 10%&lt;/td&gt;&lt;td&gt;近四季 27.5%、第三季 26%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;固定營業利益率（單獨放開）&lt;/td&gt;&lt;td&gt;47.0%（市價反推第 1 年起每年固定的營業利益率，含穩態；市價 641.69 美元、收盤 2026-11-13；折現率 9.86%；推導）&lt;/td&gt;&lt;td&gt;35%–37%&lt;/td&gt;&lt;td&gt;近四季 32.9%（扣和解約 37.8%，推導）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;低／高折現率下的營收年增&lt;/td&gt;&lt;td&gt;15.0%（市價反推未來 5 年營收年增；市價 641.69 美元、收盤 2026-11-13；折現率 8.82%；推導）／24.1%（市價反推未來 5 年營收年增；市價 641.69 美元、收盤 2026-11-13；折現率 11.03%；推導）&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p&gt;要撐住現價，市場等於要求未來 5 年營收每年成長約 19.4%（換折現率高低兩端約 15.0% 到 24.1%）。這個要求在同規模公司的歷史上屬「歷史罕見」。溢價訊號集中在基本面預期（隱含假設罕見度）、倍數重估（預估背離）、資金與情緒（部位與衍生品）。&lt;/p&gt;&lt;p class=&quot;cap&quot;&gt;三視角反推、假設對照實績、歷史基準比率與市價溢價來源（算法與完整表見&lt;a href=&quot;#wp-5&quot;&gt;計算底稿 5&lt;/a&gt;）。&lt;/p&gt;&lt;p class=&quot;cap&quot;&gt;要在 5／10 年內漲 3、5、10 倍需要的營收成長與歷史罕見度，見&lt;a href=&quot;#multiple-conditions&quot;&gt;附錄「長期倍數條件」&lt;/a&gt;（條件反推，非預測）。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;白話說&lt;/b&gt;市價要求營收五年每年成長近兩成，我們的基準平均約一成三。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;要留意&lt;/b&gt;合理價值是區間不是目標價，稅率口徑會明顯影響結果（見改判訊號）。&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;value&quot;&gt;&lt;div class=&quot;qno&quot;&gt;價值判斷&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;價值判斷：用彼得林奇的方法再看一次&lt;/div&gt;&lt;h2&gt;快速成長股，但現價已反映成長&lt;/h2&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;林區分類&lt;/b&gt;快速成長股；兼具規模已是巨型公司，兼具穩定成長股特徵；AI 資本支出高峰使現金流暫時下降&lt;br&gt;成長還能持續多久、擴張是否仍有回報、資產負債表是否撐得住擴張&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;研究評等&lt;/b&gt;&lt;span style=&quot;font-size:20px;font-weight:700&quot;&gt;生意 B ／ 價格偏貴&lt;/span&gt;&lt;br&gt;生意品質依五項證據評定；價格位置三級（買入區、合理、偏貴），依買入上限與合理價值高端判斷，同業與歷史倍數只作交叉核對。非買賣建議。&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;林區分類是快速成長股：規模已是巨型公司，近四季營收仍年增 27.5%。&lt;/strong&gt;以申報每股盈餘 29.31 美元計，本益比 21.9 倍（申報 EPS（無非經常項目可扣） 29.31 美元；收盤 2026-11-13），看過去三年盈餘成長 PEG 只有 0.55&lt;span class=&quot;src&quot;&gt;（成長口徑 過去三年 EPS 年增 39.8%；收盤 2026-11-13）&lt;/span&gt;，看起來便宜。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;但用基準情境未來的盈餘成長算，PEG 是 1.72&lt;span class=&quot;src&quot;&gt;（成長口徑 基準情境推估、稅後營業利益年增－股數年變化 12.8%；收盤 2026-11-13）&lt;/span&gt;，因為 AI 折舊與費用會壓低接下來的盈餘增速。&lt;/strong&gt;資產負債表接近淨現金、內部人沒有公開市場買進。生意品質 B：護城河與投入資本報酬強，自由現金流品質弱。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;grid2 wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;現金與證券 vs 有息負債（億美元），上方為淨現金&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 300&quot; role=&quot;img&quot; aria-label=&quot;資產負債&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;266.0&quot; y2=&quot;266.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;270.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;0.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;205.5&quot; y2=&quot;205.5&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;209.5&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;250&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;145.0&quot; y2=&quot;145.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;149.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;500&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;84.5&quot; y2=&quot;84.5&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;88.5&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;750&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;24.0&quot; y2=&quot;24.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;28.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;1,000&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;266.0&quot; ;&lt;text x=&quot;213&quot; y=&quot;343&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;Li（非計畫賣出）&lt;/text&gt;&lt;rect x=&quot;223.0&quot; y=&quot;329&quot; width=&quot;5.3&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--neg)&quot;/&gt;&lt;text x=&quot;236.3&quot; y=&quot;343&quot; class=&quot;val&quot;&gt;1.5&lt;/text&gt;&lt;text x=&quot;213&quot; y=&quot;383&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;Kimmitt（預設計畫賣出）&lt;/text&gt;&lt;rect x=&quot;223.0&quot; y=&quot;369&quot; width=&quot;3.3&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;234.3&quot; y=&quot;383&quot; class=&quot;val&quot;&gt;0.9&lt;/text&gt;&lt;text x=&quot;213&quot; y=&quot;423&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;Alford（預設計畫賣出）&lt;/text&gt;&lt;rect x=&quot;223.0&quot; y=&quot;409&quot; width=&quot;2.0&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;232.8&quot; y=&quot;423&quot; class=&quot;val&quot;&gt;0.5&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;生意品質：B（規則：無「弱」且至少三項「強」＝A）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;評等&lt;/th&gt;&lt;th&gt;理由&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;護城河&lt;/td&gt;&lt;td&gt;強&lt;/td&gt;&lt;td&gt;每日活躍人數 36.4 億的網路效應與廣告投放資料規模；曝光與單價同時上升（第三季 +10%／+14%，8-K 2026-10-21 新聞稿 §3）；外部證據：Criteo、Roblox 10-K 把 Meta 列為主要競爭者，小型廣告主 10-K 寫付費 Facebook／Instagram 是主要獲客管道（全文搜尋 Q1、Q4）（META-C01）。外部證據只有競爭與依賴原句、無市占數據，分級維持窄&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;投入資本報酬與增量回報&lt;/td&gt;&lt;td&gt;強&lt;/td&gt;&lt;td&gt;近四季 ROIC 34.9%、2023→2025 增量 ROIC 26.9%、研發資本化後 26.1%（財務指標.json、研發資本化對照.json）；但 2025 年起營運投入資本由 1,872.75 億增到 2,568.41 億，報酬率正在下降（META-C08）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;自由現金流品質&lt;/td&gt;&lt;td&gt;弱&lt;/td&gt;&lt;td&gt;近四季自由現金流 286.49 億，只有淨利 752.49 億的 38%，與股權薪酬 269.43 億相當（財務指標.json）；2026 年第三季自由現金流為負 21.2 億（8-K 2026-10-21 新聞稿 §5）（META-C09）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;資產負債表&lt;/td&gt;&lt;td&gt;中&lt;/td&gt;&lt;td&gt;現金與證券 824.49 億約等於有息負債 809.22 億（財務指標.json）；但不可取消合約承諾 4,545.2 億、其中 2027 年到期 1,214.1 億（10-Q Item 2 ¶164），法律應計負債 198.81 億、多州和解另約 53 億附條件未認列（10-Q ¶179），季後再發美元債 150 億與歐元債 90 億歐元（8-K 2026-11-05、11-12），S&amp;amp;P（標普信評）展望轉負（META-C10、META-C11）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;治理與資本配置&lt;/td&gt;&lt;td&gt;中&lt;/td&gt;&lt;td&gt;雙重股權結構、創辦人控制投票權（10-Q Part II, Item 1A ¶389–391）；2025 年第四季起停止回購、改以舉債、強制轉換特別股與遠期售股支應資本支出，並以 Class C 無投票權股票股利重整股權（¶203）（META-C12、META-C13）&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;PEG 三口徑、林區資產負債表檢查與 F 分數等交叉檢查（算法與完整表見&lt;a href=&quot;#wp-value&quot;&gt;計算底稿 價值判斷&lt;/a&gt;）。&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;capital&quot;&gt;&lt;div class=&quot;qno&quot;&gt;問題 06&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;資產負債表撐得住嗎？&lt;/div&gt;&lt;h2&gt;目前撐得住，但正從淨現金轉向舉債擴張&lt;/h2&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;短期償債沒有壓力：現金與證券 82,449 百萬美元 大致抵銷有息負債 80,922 百萬美元，0（淨現金 1,527 百萬美元）；存活檢查 無明顯警訊。&lt;/strong&gt;但近四季 淨借入 54,816 百萬美元，季後又發行美元 150 億與歐元 90 億票據，負債會繼續增加。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;真正的壓力在承諾：不可取消合約承諾 4,545 億，2027 年就有約 1,214 億到期&lt;span class=&quot;src&quot;&gt;（10-Q Part I, Item 2 ¶164）&lt;/span&gt;，多為算力與資料中心。&lt;/strong&gt;S&amp;amp;P 評級維持 AA-、展望由穩定調為負向（CNBC 2026-10-30，新聞轉述；公司申報未揭露評級）。工具依財務比率推導的信用評級：機構 未揭露／推導 AAA（只看利息保障倍數，30.6 倍，近四季新借款多、利息偏低、評級可能偏高）｜依推導：投資等級，比 S&amp;amp;P 實際評級 AA- 高三級，判讀以 S&amp;amp;P 為準。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;近四季營運現金流的去向（億美元）：第一列為營運現金流，往下逐項扣除，最後一列為剩餘或缺口；同期淨借款 548 億美元（長債償還、短債淨變化依申報原表確認為零），不列入上方扣項&lt;/p&gt;&lt;svg viewBox=&quot;0 0 500 218&quot; role=&quot;img&quot; aria-label=&quot;資金去向&quot; class=&quot;chart&quot; style=&quot;max-width:650px&quot;&gt;&lt;l
