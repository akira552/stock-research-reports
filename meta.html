&gt;&lt;td&gt;23.8%&lt;/td&gt;&lt;td&gt;25.15&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;19.8&lt;/td&gt;&lt;td&gt;11%&lt;/td&gt;&lt;td&gt;+1.1%&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2018&lt;/td&gt;&lt;td&gt;841&lt;/td&gt;&lt;td&gt;27.9%&lt;/td&gt;&lt;td&gt;28.80&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;129&lt;/td&gt;&lt;td&gt;84%&lt;/td&gt;&lt;td&gt;-1.2%&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2019&lt;/td&gt;&lt;td&gt;1,011&lt;/td&gt;&lt;td&gt;20.0%&lt;/td&gt;&lt;td&gt;35.14&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;42.0&lt;/td&gt;&lt;td&gt;20%&lt;/td&gt;&lt;td&gt;-1.5%&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2020&lt;/td&gt;&lt;td&gt;1,283&lt;/td&gt;&lt;td&gt;25.4%&lt;/td&gt;&lt;td&gt;44.42&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;62.7&lt;/td&gt;&lt;td&gt;27%&lt;/td&gt;&lt;td&gt;+0.4%&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2021&lt;/td&gt;&lt;td&gt;1,249&lt;/td&gt;&lt;td&gt;31.1%&lt;/td&gt;&lt;td&gt;43.68&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;445&lt;/td&gt;&lt;td&gt;114%&lt;/td&gt;&lt;td&gt;-1.0%&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2022&lt;/td&gt;&lt;td&gt;1,257&lt;/td&gt;&lt;td&gt;18.5%&lt;/td&gt;&lt;td&gt;46.53&lt;/td&gt;&lt;td&gt;0.0&lt;/td&gt;&lt;td&gt;280&lt;/td&gt;&lt;td&gt;145%&lt;/td&gt;&lt;td&gt;-5.5%&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2023&lt;/td&gt;&lt;td&gt;1,532&lt;/td&gt;&lt;td&gt;28.0%&lt;/td&gt;&lt;td&gt;58.26&lt;/td&gt;&lt;td&gt;0.0&lt;/td&gt;&lt;td&gt;198&lt;/td&gt;&lt;td&gt;45%&lt;/td&gt;&lt;td&gt;-2.7%&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2024&lt;/td&gt;&lt;td&gt;1,826&lt;/td&gt;&lt;td&gt;37.1%&lt;/td&gt;&lt;td&gt;69.87&lt;/td&gt;&lt;td&gt;50.7&lt;/td&gt;&lt;td&gt;301&lt;/td&gt;&lt;td&gt;65%&lt;/td&gt;&lt;td&gt;-0.6%&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2025&lt;/td&gt;&lt;td&gt;2,172&lt;/td&gt;&lt;td&gt;30.2%&lt;/td&gt;&lt;td&gt;84.40&lt;/td&gt;&lt;td&gt;53.2&lt;/td&gt;&lt;td&gt;262&lt;/td&gt;&lt;td&gt;68%&lt;/td&gt;&lt;td&gt;-1.5%&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;長期財務.json（股東權益、稀釋股數〔分割調整〕、總資產；每股帳面＝股東權益 ÷ 稀釋股數，推導；股利支付、回購、營運現金流、資本支出在財務歷史.json 沒有該年時用）；產業指標.json 逐年（ROE）；財務歷史.json annual（股利、回購、營運現金流、資本支出）。用到：財務歷史、長期財務。ROE 註記門檻：ROE 高於 60% 或股東權益 ÷ 總資產低於 10%；近三年回購合計達當年股東權益 50% 以上才歸因於回購。（股利＋回購）÷ 年底市值：專案沒有逐年年底市值資料，不列該欄。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;capital-plain&quot;&gt;&lt;h3&gt;融資與償債：還不還得起&lt;/h3&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;b&gt;信用評級&lt;/b&gt;　機構 未揭露（10-K、10-Q、8-K、SEC 全文搜尋 查無 S&amp;amp;P、Moody&amp;#x27;s、Fitch、KBRA 評級）／推導 AAA（Damodaran 合成評等，利息保障 30.6 倍，近四季新借款多、利息偏低、評級可能偏高，推導）｜依推導：投資等級（BBB-／Baa3 以上）&lt;/p&gt;&lt;p&gt;&lt;b&gt;存活檢查（12～24 個月，推導，非違約預測）&lt;/b&gt;　無明顯警訊（推導，非違約預測）：現金與流動證券 716 億美元，一年內到期債務 28 億美元（另利息 26 億美元），可付 13.4 倍（含受限現金為 15.4 倍）；現金與流動證券 716 億美元，兩年內到期債務 28 億美元（另利息 52 億美元），可付 9.0 倍（含受限現金為 10.4 倍）；利息保障 30.6 倍（新借款多、利息偏低，倍數可能偏高）；會計師未提出繼續經營疑慮。&lt;/p&gt;&lt;p&gt;&lt;b&gt;利率壓力測試&lt;/b&gt;　+200bp 後利息保障 29.3 倍（目前 30.6 倍，推導）&lt;/p&gt;&lt;p&gt;&lt;b&gt;借款用途&lt;/b&gt;　擴張（AI 與資料中心資本支出）為主；2026 年 5 月發債 249.1 億，同期無回購&lt;/p&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;償債指標、融資活動表、存活檢查明細與利率壓力測試（算法與完整表見&lt;a href=&quot;#wp-6&quot;&gt;計算底稿 6&lt;/a&gt;）。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;財務管理&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;融資用途是擴張：2026 年 5 月發債 249.1 億，同期沒有回購，資金用於 AI 與資料中心資本支出（融資償債判讀）。&lt;/strong&gt;票據面額 840 億，一年內到期僅 27.5 億，其餘到 2066 年；10-Q 未見循環信貸額度。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;資產變化&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;不動產廠房設備一年增加約 58%，是營收增速的兩倍，原因明確是資料中心投資。&lt;/strong&gt;應付帳款自 2025 年底增加一倍多，原文未拆分原因，我們推測與資本支出應付款有關（作者判斷），列為追蹤項目。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;公司內部治理&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;創辦人透過雙重股權持有多數投票權&lt;span class=&quot;src&quot;&gt;（10-Q Part II, Item 1A ¶389–391）&lt;/span&gt;，新設的 Class C 無投票權股讓公司增資時不稀釋控制權&lt;span class=&quot;src&quot;&gt;（10-Q 2026-09-30 Part II, Item 1A ¶203）&lt;/span&gt;。&lt;/strong&gt;對小股東而言，資本配置方向由創辦人決定，治理評為中。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;人事異動：Dina Powell McCormick 於 2026 年 1 月 12 日起任總裁兼副董事長&lt;span class=&quot;src&quot;&gt;（8-K 2026-01-16 本文 §3）&lt;/span&gt;；董事 Hock E. Tan 與 Tracey T. Travis 通知不在 2026 年股東會連任&lt;span class=&quot;src&quot;&gt;（8-K 2026-04-14 本文 §2–3）&lt;/span&gt;。&lt;/strong&gt;兩事件未改變創辦人控制權，不影響治理評等（作者判斷）。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;業務治理&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;法律風險已實質進入財報：第三季認列約 99 億法律費用&lt;span class=&quot;src&quot;&gt;（8-K 2026-10-21 新聞稿 §6）&lt;/span&gt;，法律相關應計負債 198.81 億&lt;span class=&quot;src&quot;&gt;（10-Q Part I, Item 1 ¶124–128）&lt;/span&gt;；2026 年 8 月多州總檢察長和解約 127 億分 10 年付，另約 53 億附條件、尚未認列&lt;span class=&quot;src&quot;&gt;（10-Q 2026-09-30 Part I, Item 2 ¶178）&lt;/span&gt;；2027 年 2 月學區示範案開審，金額未知，美國聯邦貿易委員會（FTC）也上訴要求恢復反壟斷案。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;資產變化訊號（對去年同期季末）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;signals&quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;變化&lt;/th&gt;&lt;th&gt;同期營收&lt;/th&gt;&lt;th&gt;判讀&lt;/th&gt;&lt;th&gt;說明&lt;/th&gt;&lt;th&gt;出處&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;不動產廠房設備&lt;/td&gt;&lt;td&gt;+58%&lt;/td&gt;&lt;td&gt;+27.5%&lt;/td&gt;&lt;td class=&quot;st-已解釋&quot;&gt;已解釋&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;持續投資伺服器、資料中心與網路設施&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;10-Q 2026-09-30 Part I, Item 2 ¶156&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;應收帳款&lt;/td&gt;&lt;td&gt;+31%&lt;/td&gt;&lt;td&gt;+27.5%&lt;/td&gt;&lt;td class=&quot;st-已解釋&quot;&gt;已解釋&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;客戶收款隨營收增加，應收天數約 34 天&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;融資償債判讀.json 收入與收現；10-Q Part I, Item 2&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;應付帳款&lt;/td&gt;&lt;td&gt;+115%（2025 年底起）&lt;/td&gt;&lt;td&gt;+27.5%&lt;/td&gt;&lt;td class=&quot;st-部分解釋&quot;&gt;部分解釋&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;期間不同；推測與資本支出應付款增加有關（作者判斷，原文未拆）&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;財務指標.json 資產變化訊號&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;白話說&lt;/b&gt;每 100 元現金大致對應 100 元有息負債，但另有數倍的長期合約承諾。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;要留意&lt;/b&gt;淨現金接近零不代表沒壓力，合約承諾不列在負債（見改判訊號）。&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;events&quot;&gt;&lt;div class=&quot;qno&quot;&gt;問題 07&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;接下來要盯什麼？&lt;/div&gt;&lt;h2&gt;盯 AI 變現、資本支出指引與訴訟結果&lt;/h2&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;最關鍵的是 2027 年資本支出指引與自由現金流能否回正：公司尚未給 2027 年指引，若再大幅上修而現金流持續為負，保守情境機率上升。&lt;/p&gt;&lt;p&gt;反方事件是 AI 新產品開始揭露營收、單季營收維持 25% 以上成長，這會支持樂觀情境；目前兩者都還沒有證據。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;未來 12 個月已知事件&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;下表只列本輪存檔原文已提到、有日期或期限的事件，不代表全部風險。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;figure&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt signals&quot;&gt;&lt;tr&gt;&lt;th&gt;時間&lt;/th&gt;&lt;th&gt;事件&lt;/th&gt;&lt;th&gt;看什麼&lt;/th&gt;&lt;th&gt;出處&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2027-01 起&lt;/td&gt;&lt;td&gt;Class C 股票股利（章程 2027-01-19 生效後發放，日期未定）&lt;/td&gt;&lt;td&gt;一拆二後每股數字減半，不影響價值&lt;/td&gt;&lt;td&gt;10-Q 2026-09-30 Part I, Item 1 ¶232&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2027 年初&lt;/td&gt;&lt;td&gt;第四季財報與 2027 年資本支出指引&lt;/td&gt;&lt;td&gt;指引是否高於 2026 年 1,350–1,450 億&lt;/td&gt;&lt;td&gt;8-K 2026-10-21 新聞稿 §7&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2027-02&lt;/td&gt;&lt;td&gt;青少年訴訟學區示範案開審&lt;/td&gt;&lt;td&gt;判決或和解金額是否超出已認列的法律應計負債&lt;/td&gt;&lt;td&gt;10-Q 2026-09-30 Part I, Item 1 ¶179&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;審理中&lt;/td&gt;&lt;td&gt;FTC 上訴要求恢復反壟斷案&lt;/td&gt;&lt;td&gt;上訴結果與可能的補救措施&lt;/td&gt;&lt;td&gt;新聞 N4（MediaPost 2026-10-05）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2027-11-19 前&lt;/td&gt;&lt;td&gt;遠期售股 4,000 萬股交割&lt;/td&gt;&lt;td&gt;交割後股數約增 1.6%（推導）&lt;/td&gt;&lt;td&gt;8-K 2026-10-29 本文 §13–15&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;白話說&lt;/b&gt;示範案若判賠擴大，影響的是保守情境機率，不是公司存活。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;要留意&lt;/b&gt;事件表只列已知事件，不代表全部風險（見改判訊號）。&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;news&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;近期新聞查證&lt;/p&gt;&lt;h3&gt;新聞證實量價成長，也證實現金流與法律壓力&lt;/h3&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;查了 Google 新聞候選，留下 5 則與論點直接相關的報導，引句都已和原文核對；數字以公司申報為準，和解金額媒體有 167／171／180 億三種說法，以 10-Q 為準。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;新聞摘要（依日期排序）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;日期&lt;/th&gt;&lt;th&gt;來源&lt;/th&gt;&lt;th&gt;重點&lt;/th&gt;&lt;th&gt;我們的判讀&lt;/th&gt;&lt;th&gt;對應主張&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2026-08-26&lt;/td&gt;&lt;td&gt;CNBC&lt;/td&gt;&lt;td&gt;與多州就社群成癮案和解，約 180 億（其中約 53 億附條件、尚未認列），分 10 年付&lt;/td&gt;&lt;td&gt;金額大但分期，現金壓力可控；另有未認列部分&lt;/td&gt;&lt;td&gt;META-C10&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2026-10-05&lt;/td&gt;&lt;td&gt;MediaPost&lt;/td&gt;&lt;td&gt;FTC 上訴要求恢復反壟斷案&lt;/td&gt;&lt;td&gt;一審以 TikTok、YouTube 為競爭者駁回，上訴結果不確定&lt;/td&gt;&lt;td&gt;META-C12&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2026-10-22&lt;/td&gt;&lt;td&gt;Exchange4Media&lt;/td&gt;&lt;td&gt;AI 提升轉換率與廣告單價，廣告營收年增&lt;/td&gt;&lt;td&gt;與 10-Q 量價數字一致，屬公司說法&lt;/td&gt;&lt;td&gt;META-C01、C02&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2026-10-26&lt;/td&gt;&lt;td&gt;PR Newswire&lt;/td&gt;&lt;td&gt;強制轉換特別股與遠期售股定價&lt;/td&gt;&lt;td&gt;確認改以股權融資，未來股數增加&lt;/td&gt;&lt;td&gt;META-C13&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2026-10-30&lt;/td&gt;&lt;td&gt;CNBC&lt;/td&gt;&lt;td&gt;S&amp;amp;P 因資本支出與現金流將展望調為負向&lt;/td&gt;&lt;td&gt;外部信用機構對現金流疑慮的具體表態&lt;/td&gt;&lt;td&gt;META-C05、C11&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;/div&gt;
&lt;section class=&quot;q&quot; id=&quot;workpaper&quot; data-layer=&quot;計算底稿&quot;&gt;&lt;div class=&quot;qno&quot;&gt;計算底稿&lt;/div&gt;&lt;h2&gt;計算底稿：正文結果的算法與完整表（預設摺疊）&lt;/h2&gt;&lt;p class=&quot;wpnote&quot;&gt;正文每個估值、償債結果都從這裡算出；背景計算照做、送審照核。不讀也不影響理解結論；非買賣建議。&lt;/p&gt;&lt;details id=&quot;wp-3-4&quot;&gt;&lt;summary&gt;3・4 現金與股東：報表對帳與股東回報判讀&lt;/summary&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;現金流報表對帳&lt;/h3&gt;&lt;p&gt;報表對帳（10-Q 2026-09-30，現金、約當現金及受限現金）：期初 39,100.0＋營運 96,873.0＋投資 -114,309.0＋融資 2,682.0＋其他 8.0＝期末 24,354.0 百萬美元｜完整&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;股東回報判讀表&lt;/h3&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;股東回報（判讀依估值政策門檻，2026-10-14 核定；不影響估值與價格位置）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;數值&lt;/th&gt;&lt;th&gt;判讀&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股利殖利率&lt;/td&gt;&lt;td&gt;0.33%&lt;/td&gt;&lt;td&gt;不評好壞：依估值政策，股利殖利率高低不設門檻（高殖利率常因股價下跌）；占股東收益率 100%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;回購殖利率&lt;/td&gt;&lt;td&gt;-0.00%&lt;/td&gt;&lt;td&gt;不評好壞：近四季沒有回購&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股東收益率（股利＋回購）&lt;/td&gt;&lt;td&gt;0.33%（公債的 6%）&lt;/td&gt;&lt;td&gt;不評好壞：主要靠成長，0.33% 只有 10 年期公債 5.15% 的 6%；回饋低是成長型公司的常態，改看成長&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;淨回購殖利率&lt;/td&gt;&lt;td&gt;-1.63%&lt;/td&gt;&lt;td&gt;中性：沒有回購；發給員工的股票約占市值 1.63%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股數年變化（1／3／10 財年）&lt;/td&gt;&lt;td&gt;-1.5%／-1.6%／-1.0%&lt;/td&gt;&lt;td&gt;好：2025 財年對上一財年 -1.5%（減少）；近 3 財年平均每年 -1.6%（減少）；近 10 財年平均每年 -1.0%（減少）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;近十年有回購的年數&lt;/td&gt;&lt;td&gt;9／10&lt;/td&gt;&lt;td&gt;好：近十年有 9 年回購，達政策「穩定」（至少 8 年）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股利連續成長年數&lt;/td&gt;&lt;td&gt;1&lt;/td&gt;&lt;td&gt;中性：連續 1 年調高，未達政策「近十年年年調高」&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股東回饋占自由現金流&lt;/td&gt;&lt;td&gt;18.84%&lt;/td&gt;&lt;td&gt;好：回饋只用掉近四季自由現金流的 19%，低於政策 80% 注意線，還留約 81%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;details id=&quot;wp-5&quot;&gt;&lt;summary&gt;5 估值：情境算式、市價隱含第 10 年倍數、同業與歷史倍數交叉核對、條件式區間算法、市價反推、溢價來源與作者計算說明&lt;/summary&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;作者計算說明&lt;/h3&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;主方法 FCFF（數位平台產業卡）。&lt;/strong&gt;基準：營收年增 20%／15%／12%／11%／10%，營業利益率 36%／35%／35%／36%／37%；保守成長 10% 起、穩態利益率 30%；樂觀成長 27% 起、穩態 43%；權重 25／50／25，超額報酬衰退期 5 年（窄護城河、成長型），永續期 ROIC＝WACC。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;折現率：beta 約 1.19＝2 年週 beta 1.32 與 Damodaran Software (Entertainment) 重新加槓桿 1.05 的平均（負債權益比 4.90%，皆不含租賃），WACC 9.86%&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;。&lt;/strong&gt;稅率起點 16%，第 3–5 年 17–18% 為作者判斷。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;計算核對（缺口判斷第 2 項稅率，過門檻）：近四季有效稅率 4.6% 由 2026 年第一季 CAMT 過渡減免一次性利益 80.3 億墊低&lt;span class=&quot;src&quot;&gt;（10-Q 2026-09-30 Part I, Item 1 ¶212）&lt;/span&gt;，加回後前九個月約 16.9%&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;，與第四季指引 15–17% 一致&lt;span class=&quot;src&quot;&gt;（8-K 2026-10-21 新聞稿 §7）&lt;/span&gt;，故不採用。&lt;/strong&gt;若只改基準為 4.6%，中點 563.75（區間 468.60–680.64，+9.3%）；三情境都改約 +20.1%。其他三項未過門檻（+1.5%／+2.5%／0%）。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;季後融資：遠期售股 4,000 萬股（2027-11-19 前交割）、美元票據 150 億、歐元票據 90 億歐元都不進股權橋與股數；發債時現金與負債同增、淨額中性。&lt;/strong&gt;遠期售股發行價 625 美元高於中點，計入後每股約 +0.3%&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;成長跑道六項：①市場空間：每日活躍人數 36.4 億、年增 3%，目標市場規模未揭露（部分）。&lt;/strong&gt;②定價能力：第三季曝光 +10%、單價 +14%（有證據）。③營運槓桿：2022→2025 每多 1 元營收多 0.64 元營業利益，2025→近四季（扣和解）約 0.20 元&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;。④指引達成：近四季單季營收都在指引區間內或以上，兩季超過上緣（有證據）。⑤成長資金：自由現金流 286 億、第三季為負，回購停止、債務淨增 548 億並發特別股（有證據）。⑥新事業：實境實驗室 2026 年虧損指引 180–190 億，只列事實不估值。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;情境幅度：加權中點 ÷ 基準每股＝1.09&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;。&lt;/strong&gt;成長兩側用滿窄護城河參考幅度，利益率兩側同樣收窄。另一設定（衰退 5 年、永續期 ROIC 取產業錨點 27%）中點約 +16.9%，僅供對照。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;!--新圖表--&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;缺口判斷影響幅度&lt;/h3&gt;&lt;div class=&quot;wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;缺口判斷影響幅度：拿掉各項作者判斷、其他不變時，合理價值中點的變動（計算核對.json，2026-11-13）；紅色為過門檻（中點±10%或價格位置跨界或生意等級理由），4 項中 1 項過門檻；虛線為 ±10%。正值＝拿掉後中點變高&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 176&quot; role=&quot;img&quot; aria-label=&quot;缺口判斷影響幅度&quot; class=&quot;chart&quot; style=&quot;max-width:700px&quot;&gt;&lt;line x1=&quot;388.0&quot; x2=&quot;388.0&quot; y1=&quot;6&quot; y2=&quot;170&quot; class=&quot;zero&quot;/&gt;&lt;line x1=&quot;297.7&quot; x2=&quot;297.7&quot; y1=&quot;4&quot; y2=&quot;172&quot; class=&quot;price&quot;/&gt;&lt;line x1=&quot;478.3&quot; x2=&quot;478.3&quot; y1=&quot;4&quot; y2=&quot;172&quot; class=&quot;price&quot;/&gt;&lt;text x=&quot;266&quot; y=&quot;25&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;1. 法律相關應計負債列為債務類請求權&lt;/text&gt;&lt;rect x=&quot;388.0&quot; y=&quot;11&quot; width=&quot;13.5&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;409.5&quot; y=&quot;25&quot; class=&quot;val&quot;&gt;+1.5%&lt;/text&gt;&lt;text x=&quot;266&quot; y=&quot;63&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;2. 稅率改口徑：起點不用近四季有效稅…&lt;/text&gt;&lt;rect x=&quot;388.0&quot; y=&quot;49&quot; width=&quot;84.4&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--neg)&quot;/&gt;&lt;text x=&quot;480.4&quot; y=&quot;63&quot; class=&quot;val&quot;&gt;+9.3%&lt;/text&gt;&lt;text x=&quot;266&quot; y=&quot;101&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;3. 非上市股權投資不計入股權橋&lt;/text&gt;&lt;rect x=&quot;388.0&quot; y=&quot;87&quot; width=&quot;22.2&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;418.2&quot; y=&quot;101&quot; class=&quot;val&quot;&gt;+2.5%&lt;/text&gt;&lt;text x=&quot;266&quot; y=&quot;139&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;4. 資料日後發行的強制轉換特別股不進…&lt;/text&gt;&lt;rect x=&quot;388.0&quot; y=&quot;125&quot; width=&quot;2.0&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;396.0&quot; y=&quot;139&quot; class=&quot;val&quot;&gt;+0.0%&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;/div&gt;&lt;!--/新圖表--&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;合理價值怎麼來：三個情境與權重&lt;/h3&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt&quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;每股價值（基準折現率 9.9%）&lt;/th&gt;&lt;th&gt;權重&lt;/th&gt;&lt;th&gt;折現率高端 11.0%&lt;/th&gt;&lt;th&gt;折現率低端 8.8%&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;244.94&lt;/td&gt;&lt;td&gt;25%&lt;/td&gt;&lt;td&gt;207.70&lt;/td&gt;&lt;td&gt;289.59&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;471.67&lt;/td&gt;&lt;td&gt;50%&lt;/td&gt;&lt;td&gt;391.42&lt;/td&gt;&lt;td&gt;570.43&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;874.02&lt;/td&gt;&lt;td&gt;25%&lt;/td&gt;&lt;td&gt;718.75&lt;/td&gt;&lt;td&gt;1065.89&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;加權（合理價值）&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;b&gt;515.58&lt;/b&gt;&lt;/td&gt;&lt;td&gt;100%&lt;/td&gt;&lt;td&gt;&lt;b&gt;427.32&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;b&gt;624.09&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;中點是三個情境的加權：0.25×244.94＋0.5×471.67＋0.25×874.02≈515.58（一般權重組合）。區間上下緣是同樣三個情境、權重不變，只把折現率換成區間高端或低端重算後加權：高端約 11.0% → 427.32（下緣），低端約 8.8% → 624.09（上緣）。買入區上緣 309.35＝中點 × (1－安全邊際 40%，不確定性高)，股價在此以下才有 40% 安全邊際。情境表說明合理價值怎麼組成，不是單一目標價；非買賣建議。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;市價隱含第 10 年倍數（只描述，不進評等）&lt;/h3&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;基準情境：市價隱含 vs 模型假設的第 10 年 EV/EBIT（金額百萬美元）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;折現率&lt;/th&gt;&lt;th&gt;WACC&lt;/th&gt;&lt;th&gt;市場 EV&lt;/th&gt;&lt;th&gt;明示期現值&lt;/th&gt;&lt;th&gt;終值折現因子&lt;/th&gt;&lt;th&gt;第 10 年 EBIT&lt;/th&gt;&lt;th&gt;市價隱含倍數&lt;/th&gt;&lt;th&gt;模型終值倍數&lt;/th&gt;&lt;th&gt;隱含÷模型&lt;/th&gt;&lt;th&gt;現在 EV／次年 EBIT&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;低折現率&lt;/td&gt;&lt;td&gt;8.82%&lt;/td&gt;&lt;td&gt;1,669,422&lt;/td&gt;&lt;td&gt;517,100&lt;/td&gt;&lt;td&gt;0.429&lt;/td&gt;&lt;td&gt;223,445&lt;/td&gt;&lt;td&gt;12.0 倍&lt;/td&gt;&lt;td&gt;10.1 倍&lt;/td&gt;&lt;td&gt;1.19&lt;/td&gt;&lt;td&gt;16.0 倍&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;9.86%&lt;/td&gt;&lt;td&gt;1,669,422&lt;/td&gt;&lt;td&gt;484,664&lt;/td&gt;&lt;td&gt;0.390&lt;/td&gt;&lt;td&gt;223,445&lt;/td&gt;&lt;td&gt;13.6 倍&lt;/td&gt;&lt;td&gt;8.6 倍&lt;/td&gt;&lt;td&gt;1.59&lt;/td&gt;&lt;td&gt;16.0 倍&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;高折現率&lt;/td&gt;&lt;td&gt;11.03%&lt;/td&gt;&lt;td&gt;1,669,422&lt;/td&gt;&lt;td&gt;451,194&lt;/td&gt;&lt;td&gt;0.351&lt;/td&gt;&lt;td&gt;223,445&lt;/td&gt;&lt;td&gt;15.5 倍&lt;/td&gt;&lt;td&gt;7.3 倍&lt;/td&gt;&lt;td&gt;2.12&lt;/td&gt;&lt;td&gt;16.0 倍&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;算式：市場 EV＝模型 EV +（現價 − 模型每股價值）× 股數（股權橋與模型相同）；隱含倍數＝（市場 EV − 明示期現值）÷ 終值折現因子 ÷ 第 10 年 EBIT；模型終值倍數＝模型終值 ÷ 第 10 年 EBIT。參考帶：p25 6.0、中位 15.5、p75 28.1、p90 46.7 倍（機械回測樣本，非市場全體；分產業的筆數與公司數少，僅供參考；機械回測訓練期 2016–2021 全部回測日（審查工作區 回測資料/隱含倍數結果.json，1,810 筆中訓練期 1,046 筆；產業＝回測樣本的 Damodaran 產業）；重算：python3 程式/回測_隱含倍數參考帶.py &amp;lt;隱含倍數結果.json&amp;gt;）。只描述，不進價格位置、研究評等與合理價值。&lt;/p&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;&lt;b&gt;合理價值 vs 市價隱含倍數（作者判讀）：&lt;/b&gt;市價隱含第 10 年 EV/EBIT 約 13.6 倍，是模型終值倍數 8.6 倍 的 1.59 倍，但仍低於軟體與網路類參考帶中位 15.5 倍；模型倍數偏低是因永續期假設 ROIC 等於折現率，第 10 年後成長不再創造價值。無特例標註，只描述、不作評等理由。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;如果 10 年後倍數是 15.5 倍，機率加權每股約 776 美元（條件式，非目標價、非買賣建議，不進評等）&lt;/h3&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;第 10 年 EV/EBIT 倍數對照（三情境各用自己的明示期 FCFF 與第 10 年 EBIT；權重 一般：保守 25%／基準 50%／樂觀 25%；基準 WACC 9.86%）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;第 10 年倍數&lt;/th&gt;&lt;th&gt;機率加權每股（美元）&lt;/th&gt;&lt;th&gt;折現率低高區間&lt;/th&gt;&lt;th&gt;白話換算&lt;/th&gt;&lt;th&gt;現價相對&lt;/th&gt;&lt;th&gt;說明&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;模型假設倍數&lt;/td&gt;&lt;td&gt;8.6 倍&lt;/td&gt;&lt;td&gt;515.58&lt;/td&gt;&lt;td&gt;427.32–624.09&lt;/td&gt;&lt;td&gt;等於折現率減永續成長約 6.9%（模型 6.9%）&lt;/td&gt;&lt;td&gt;現價高於區間&lt;/td&gt;&lt;td&gt;各情境用自己的模型終值倍數（表列為基準情境）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;穩態理論上限&lt;/td&gt;&lt;td&gt;12.3 倍&lt;/td&gt;&lt;td&gt;655.85&lt;/td&gt;&lt;td&gt;595.39–715.61&lt;/td&gt;&lt;td&gt;等於折現率減永續成長約 4.8%（模型 6.9%）&lt;/td&gt;&lt;td&gt;現價在區間內&lt;/td&gt;&lt;td&gt;（1−t）（1+g）÷（WACC−g）：再投資為零（ROIC 無限大）時的上限；t＝第 10 年 1−NOPAT÷EBIT&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;參考帶中位（軟體與網路）&lt;/td&gt;&lt;td&gt;15.5 倍&lt;/td&gt;&lt;td&gt;775.52&lt;/td&gt;&lt;td&gt;703.03–847.23&lt;/td&gt;&lt;td&gt;等於折現率減永續成長約 3.8%（模型 6.9%）&lt;/td&gt;&lt;td&gt;現價低於區間&lt;/td&gt;&lt;td&gt;所選參考帶（大類）中位&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;同業今日 EV/EBIT 中位&lt;/td&gt;&lt;td&gt;22.6 倍&lt;/td&gt;&lt;td&gt;1040.07&lt;/td&gt;&lt;td&gt;941.00–1138.20&lt;/td&gt;&lt;td&gt;等於折現率減永續成長約 2.6%（模型 6.9%）&lt;/td&gt;&lt;td&gt;現價低於區間&lt;/td&gt;&lt;td&gt;估值結果 multiples.ev_ebit.peer_quartiles.p50（今天的倍數，不是 10 年後）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;參考帶 p75（軟體與網路）&lt;/td&gt;&lt;td&gt;28.1 倍&lt;/td&gt;&lt;td&gt;1248.33&lt;/td&gt;&lt;td&gt;1128.33–1367.26&lt;/td&gt;&lt;td&gt;等於折現率減永續成長約 2.1%（模型 6.9%）&lt;/td&gt;&lt;td&gt;現價低於區間&lt;/td&gt;&lt;td&gt;所選參考帶（大類）p75&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;市價隱含&lt;/td&gt;&lt;td&gt;13.6 倍&lt;/td&gt;&lt;td&gt;703.44&lt;/td&gt;&lt;td&gt;638.20–767.95&lt;/td&gt;&lt;td&gt;等於折現率減永續成長約 4.3%（模型 6.9%）&lt;/td&gt;&lt;td&gt;現價在區間內&lt;/td&gt;&lt;td&gt;基準情境、基準折現率反推（只用基準情境，套到三情境後加權不必等於現價）&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;如果 10 年後倍數是 X，三情境各用自己的明示期 FCFF 與第 10 年 EBIT、以基準折現率折現，依政策情境機率權重加權的每股價值；區間只換折現率（①模型列為合理價值區間）。「折現率減永續成長」＝(1+g)(1−t)(1−g/ROIC)÷倍數（基準情境永續參數）。條件式，非目標價、非買賣建議，不進評等。模型假設倍數那一列等於合理價值（中點 515.58）。&lt;/p&gt;&lt;/div&gt;&lt;!--成長型價格參考--&gt;&lt;div class=&quot;block&quot; id=&quot;growth-ref&quot;&gt;&lt;h3&gt;成長型價格參考：報酬門檻價、五年報酬矩陣、林區比值（只描述，不進評等，非買賣建議）&lt;/h3&gt;&lt;p class=&quot;cap&quot;&gt;這一段只描述，不進研究評等、不改價格位置，也不是目標價；三種情境並列、不合成單一數字，數字是「該情境成真時」的條件式推算，不是預期報酬。非買賣建議。&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;一、報酬門檻價：收盤 2026-11-13 股價 641.69 美元（三情境並列；條件式推算，非目標價）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;年報酬 7% 的每股價格（美元）&lt;/th&gt;&lt;th&gt;年報酬 8% 的每股價格（美元）&lt;/th&gt;&lt;th&gt;年報酬 9% 的每股價格（美元）&lt;/th&gt;&lt;th&gt;年報酬 10% 的每股價格（美元）&lt;/th&gt;&lt;th&gt;現價隱含年報酬&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;416.90&lt;/td&gt;&lt;td&gt;336.56&lt;/td&gt;&lt;td&gt;280.83&lt;/td&gt;&lt;td&gt;239.89&lt;/td&gt;&lt;td&gt;5.5%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;867.04&lt;/td&gt;&lt;td&gt;677.25&lt;/td&gt;&lt;td&gt;550.84&lt;/td&gt;&lt;td&gt;460.68&lt;/td&gt;&lt;td&gt;8.2%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;1,645.00&lt;/td&gt;&lt;td&gt;1,274.08&lt;/td&gt;&lt;td&gt;1,027.79&lt;/td&gt;&lt;td&gt;852.72&lt;/td&gt;&lt;td&gt;11.8%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;算法：各情境的 10 年現金流與終值改用門檻當折現率，經同一股權橋換成每股；股價等於這個價格時，該情境成真的現價隱含年報酬就等於門檻（兩者互為反函數）。&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;二、五年報酬矩陣：現價買進、持有 5 年的年化報酬（三情境 × 三種第 5 年倍數；推導，條件式，非預期報酬）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;第 5 年 EBIT（估值輸入單位，推導）&lt;/th&gt;&lt;th&gt;維持現在 18.3 倍&lt;/th&gt;&lt;th&gt;縮四分之一 13.7 倍&lt;/th&gt;&lt;th&gt;回到參考帶中位（軟體與網路） 15.5 倍&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;92,375.9&lt;/td&gt;&lt;td&gt;2.5%&lt;/td&gt;&lt;td&gt;-2.7%&lt;/td&gt;&lt;td&gt;-0.5%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;168,702.8&lt;/td&gt;&lt;td&gt;14.9%&lt;/td&gt;&lt;td&gt;8.9%&lt;/td&gt;&lt;td&gt;11.4%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;287,061.0&lt;/td&gt;&lt;td&gt;27.2%&lt;/td&gt;&lt;td&gt;20.5%&lt;/td&gt;&lt;td&gt;23.3%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;算法：現價買進、持有 5 年：第 1–5 年自由現金流與第 5 年企業價值（倍數 × 該情境第 5 年 EBIT）折回今天、經今日股權橋與股數換成每股，解出使每股等於現價的年報酬（與現價隱含年報酬同一算法，只是第 5 年改用倍數計價）；不另估 5 年後的淨債務與股數。企業價值 ÷ 當年 EBIT 口徑與市價隱含第 10 年倍數、參考帶相同。推導。現在倍數＝市場企業價值 1,669,422.4 ÷ 近四季營業利益 91,270.0（估值輸入 company_metrics.ebit_扣一次性）＝18.3 倍；縮四分之一＝現在倍數 × 0.75。參考帶：大類層「軟體與網路」中位 15.5 倍（機械回測樣本，非市場全體；分產業的筆數與公司數少，僅供參考）。&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;三、林區比值（只給比值與口徑；成長率與本益比的口徑同「PEG 與林區檢查」表的基準情境推估那一列）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;數值&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;林區分類&lt;/td&gt;&lt;td&gt;快速成長股&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;成長率（基準情境推估（稅後營業利益年增－股數年變化））&lt;/td&gt;&lt;td&gt;12.8%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;本益比&lt;/td&gt;&lt;td&gt;21.9 倍&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股息殖利率&lt;/td&gt;&lt;td&gt;0.3%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;本益比 ÷ 成長率&lt;/td&gt;&lt;td&gt;1.72&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;（成長率＋股息殖利率）÷ 本益比&lt;/td&gt;&lt;td&gt;0.60&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;林區以本益比約等於成長率為參考（二手來源轉述）；本表不設門檻。只給比值與口徑，不作便宜或昂貴的判斷，不進研究評等與價格位置。非買賣建議。&lt;/p&gt;&lt;/div&gt;&lt;!--/成長型價格參考--&gt;&lt;div class=&quot;note-box&quot;&gt;&lt;b&gt;同業與歷史倍數交叉核對（不進評等）：630–1004 美元&lt;/b&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;依同業的本益比、企業價值／營業利益倍數換算的每股價值，各法 25 百分位的中位數到 75 百分位的中位數；不是股價波動範圍，也不是合理價值。原稱「市場情緒區間」；2026-11-11 起只作交叉核對，不決定價格位置與研究評等（價格位置三級：買入區、合理、偏貴，只看買入區上緣與合理價值高端）。同業僅 4 家，分位僅供參考。&lt;/p&gt;&lt;/div&gt;&lt;!--目標區間:第五題--&gt;&lt;div class=&quot;block&quot; id=&quot;target-body&quot;&gt;&lt;h3&gt;12 個月條件式目標區間：三種情境各自成真時的價值（條件式、非買賣建議）&lt;/h3&gt;&lt;p class=&quot;cap&quot;&gt;條件式目標區間：三種情境各自成真時的每股價值區間，不是股價預測，三段不合成單一數字；非買賣建議。不影響合理價值、價格位置與研究評等。&lt;/p&gt;&lt;p&gt;算法：各情境每股價值（折現率高低兩端）×（1＋股權成本 10.13%）− 未來 12 個月每股股利 2.10 美元（近四季實際每股股利 ＝ 價值判斷.json 股利殖利率 0.3276% × 現價 641.69（推導））；回購不加回。起點 2026-11-13 收盤，終點 2027-11-13。三段是各情境在折現率上下兩端的每股價值向前推 12 個月，不是價格機率分布的切片；段與段之間可能有空白，也可能重疊。區間主要寬度來自折現率不確定，不是 12 個月內的營運變化。&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt&quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;機率（政策權重，未經歷史校準）&lt;/th&gt;&lt;th&gt;目標區間（美元）&lt;/th&gt;&lt;th&gt;相對現價&lt;/th&gt;&lt;th&gt;關鍵假設（估值輸入）&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;25%&lt;/td&gt;&lt;td&gt;&lt;b&gt;226.63–316.82&lt;/b&gt;&lt;/td&gt;&lt;td&gt;−65%～−51%&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;第 1 年營收 +10.0%；營業利益率 33.0%；穩態 30.0%；永續成長 2.5%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;50%&lt;/td&gt;&lt;td&gt;&lt;b&gt;428.96–626.09&lt;/b&gt;&lt;/td&gt;&lt;td&gt;−33%～−2%&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;第 1 年營收 +20.0%；營業利益率 36.0%；穩態 37.0%；永續成長 3.0%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;25%&lt;/td&gt;&lt;td&gt;&lt;b&gt;789.43–1171.73&lt;/b&gt;&lt;/td&gt;&lt;td&gt;+23%～+83%&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;第 1 年營收 +27.0%；營業利益率 38.0%；穩態 43.0%；永續成長 3.0%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;口徑：報告中「現價隱含年報酬（基準情境，非預期報酬）約 8.2%」是以現價買進、持有該情境全期現金流（含永續價值）的年化報酬；這裡的目標區間是 12 個月後各情境每股價值的前推，兩者口徑不同，不能互相換算（例如不能用前者推 12 個月後的價格）。&lt;/p&gt;&lt;h4 style=&quot;margin-top:14px&quot;&gt;每一段要成立，市場這一面需要什麼、正在顯示什麼&lt;/h4&gt;&lt;ul class=&quot;prose&quot;&gt;&lt;li&gt;保守段代表值 267.6（基準折現率前推）要成立，一年後EV／營業利益需約 8.1 倍（現在 18.3 倍，低於現在倍數）；過去一年逐日重建的交易日中，99% 以上高於這個倍數、不到 1% 低於這個倍數（推導）；同規模同成長低於 p25。這是把價值翻成倍數的讀法，不是預測市場會給這個倍數。&lt;/li&gt;&lt;li&gt;基準段代表值 517.3（基準折現率前推）要成立，一年後EV／營業利益需約 12.9 倍（現在 18.3 倍，低於現在倍數）；過去一年逐日重建的交易日中，99% 以上高於這個倍數、不到 1% 低於這個倍數（推導）；同規模同成長約第 37 百分位（p25–p75 間線性內插，推導）。這是把價值翻成倍數的讀法，不是預測市場會給這個倍數。&lt;/li&gt;&lt;li&gt;樂觀段代表值 960.4（基準折現率前推）要成立，一年後EV／營業利益需約 21.4 倍（現在 18.3 倍，高於現在倍數）；過去一年逐日重建的交易日中，7% 高於這個倍數、93% 低於這個倍數（推導）；同規模同成長約第 57 百分位（p25–p75 間線性內插，推導）。這是把價值翻成倍數的讀法，不是預測市場會給這個倍數。&lt;/li&gt;&lt;li&gt;以 2027-12-17 到期選擇權的價平隱含波動 43.1%（2026-11-14 02:40 UTC 取得）定價，12 個月後（2027-11-13）價格落在保守段 5.3%、基準段 32%、樂觀段 21%；低於最低端（226.63） 1.1%、高於最高端（1,171.73） 6.5%、段與段之間空白 34%、段與段重疊 0.0%。這是風險中立機率，不是真實機率；不改情境權重、不改估值與評等；選擇權定價含風險溢酬與波動偏態，與三段情境機率是兩回事。報價品質：買權 49.1%、賣權 37.1% 相差 12 個百分點，報價可能過時或含偏斜，只作參考。&lt;/li&gt;&lt;li&gt;公債殖利率下降 1 個百分點時，保守／基準／樂觀段代表值（基準折現率前推，不是區間兩端的平均）為 309.2／609.8／1140.5；目前 267.6／517.3／960.4；上升 1 個百分點時為 235.5／447.3／824.6（美元，股權成本同幅變動，其他假設不變）。&lt;/li&gt;&lt;li&gt;分析師預估：本財年每股盈餘預估 29.12，較 30 天前 31.04 −6.2%（下修），近 30 天 7 家上修、40 家下修；下一財年每股盈餘預估 33.97，較 30 天前 34.04 −0.2%（持平），近 30 天 22 家上修、22 家下修。只描述預估修正的方向，不當證據，也不是目標區間的任一端。&lt;/li&gt;&lt;li&gt;券商目標價近 90 天有 30 家調整：上調 24、下調 3、持平 3（只揭露，不是本報告的目標價）。&lt;/li&gt;&lt;li&gt;上季（Sep 2026，10/21/2026 公布）每股盈餘 7.4，共識預估 6.52，驚奇 13.5%（Nasdaq）；yfinance 另列 2026-09-30 實際 3.83、預估 5.42、驚奇 -29.33%；兩個來源口徑可能不同（可能是調整後或一般會計準則），公司申報的每股盈餘可對照存檔 8-K 2026-10-21 財報新聞稿（本句未逐項比對），只描述、不當證據。&lt;/li&gt;&lt;/ul&gt;&lt;p class=&quot;cap&quot;&gt;以上只引用已存檔的數字描述條件與現況，不是預測；選擇權機率是風險中立機率、不是真實機率，不改情境權重；分析師預估與券商目標價不當證據；細節表在附錄估值細節。&lt;/p&gt;&lt;p&gt;&lt;b&gt;需要重算區間的事件：&lt;/b&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;董事會宣告每股 A、B 股配發 1 股無投票權 C 股（章程 2027-01-19 生效後發放，日期由董事會決定）；公司預期 A 股市價會反映一拆二的效果。發放後股數約加倍，區間與合理價值每股數字都要除以 2 才能和新股價比較（推導）（10-Q 2026-09-30 Part I, Item 1 ¶232；Part II, Item 1A ¶379；8-K 2026-10-21 本文 §41）&lt;/li&gt;&lt;li&gt;遠期售股 4,000 萬股（另 600 萬股超額配售）可在 2027-11-19 前交割，交割後股數約增 1.6%（推導），交割價約 625 美元高於合理價值中點，對每股價值影響小；強制轉換特別股 2029-08 才轉換（8-K 2026-10-29 本文 §13–15）&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;!--/目標區間:第五題--&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;市價要求的成長：三視角反推、假設對照實績、歷史基準比率與市價溢價來源&lt;/h3&gt;&lt;p&gt;這一節把現價代回估值模型反解「市場要求什麼」，再和公司實績、同規模公司的歷史比例、市場面的過熱訊號對照；只揭露，不改合理價值、價格位置與研究評等。&lt;/p&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;市價隱含什麼、我們假設什麼、公司做到什麼&lt;/h4&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;視角（其他假設照基準，三者擇一）&lt;/th&gt;&lt;th&gt;市價隱含&lt;/th&gt;&lt;th&gt;本報告基準&lt;/th&gt;&lt;th&gt;實績或對照&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;成長&lt;/td&gt;&lt;td&gt;第 1–5 年營收每年約 19.4%&lt;/td&gt;&lt;td&gt;第 1–5 年平均約 13.6%（推算）&lt;/td&gt;&lt;td&gt;近四季 27.5%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;利潤率&lt;/td&gt;&lt;td&gt;第 1 年起每年（含穩態）營業利益率約 47.0%&lt;/td&gt;&lt;td&gt;第 1 年 36.0%、穩態 37.0%&lt;/td&gt;&lt;td&gt;24.8%–49.7%（近 11 年營業利益率）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;折現率&lt;/td&gt;&lt;td&gt;約 8.2%（使基準情境等於現價的折現率）&lt;/td&gt;&lt;td&gt;加權資本成本 9.9%&lt;/td&gt;&lt;td&gt;10 年期公債 5.15%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;市價隱含折現率約 8.2%，比加權資本成本 9.9% 低約 1.6 個百分點：照基準情境假設，現價隱含的長期報酬低於本報告採用的資金成本；市價要站得住，需要基準以外的假設成立（例如成長或利潤率高於基準，見上兩列），或投資人接受較低的報酬。隱含折現率不是預期報酬；V3 回測（2016–2025，含倖存者偏誤）中，之後一年實際報酬中位多高於隱含值。只揭露，不改研究評等與價格位置；非買賣建議。&lt;/p&gt;&lt;div style=&quot;margin-top:12px&quot;&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;第 1 年營收成長&lt;/th&gt;&lt;th&gt;穩態營業利益率&lt;/th&gt;&lt;th&gt;終端投入資本報酬率（ROIC）&lt;/th&gt;&lt;th&gt;永續成長&lt;/th&gt;&lt;th&gt;對照實績&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;10.0%&lt;/td&gt;&lt;td&gt;30.0%&lt;/td&gt;&lt;td&gt;9.9%&lt;/td&gt;&lt;td&gt;2.5%&lt;/td&gt;&lt;td&gt;保守於實績（終端 ROIC 不到研發資本化後實績一半；產業上限）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;20.0%&lt;/td&gt;&lt;td&gt;37.0%&lt;/td&gt;&lt;td&gt;9.9%&lt;/td&gt;&lt;td&gt;3.0%&lt;/td&gt;&lt;td&gt;保守於實績（終端 ROIC 不到研發資本化後實績一半；產業上限）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;27.0%&lt;/td&gt;&lt;td&gt;43.0%&lt;/td&gt;&lt;td&gt;9.9%&lt;/td&gt;&lt;td&gt;3.0%&lt;/td&gt;&lt;td&gt;保守於實績（終端 ROIC 不到研發資本化後實績一半；產業上限）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;公司實績&lt;/td&gt;&lt;td&gt;近四季 27.5%&lt;/td&gt;&lt;td&gt;近四季 32.9%；24.8%–49.7%（近 11 年營業利益率）&lt;/td&gt;&lt;td&gt;近四季 34.9%；研發資本化後約 26.1%（2025-12-31 財年，研發資本化對照.json）&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;市價隱含三視角：把現價代回基準情境，一次只放開一個假設反解（成長、利潤率、折現率），三者擇一成立即可，不是同時需要；折現率視角就是第四題「現價隱含年報酬（基準情境，非預期報酬）」。假設對照：終端 ROIC 低於近四季一半時標「保守於實績」，括號寫原因：產業上限、公司近五年中位上限或等於資金成本是估值框架的上限設定（估值政策），作者選值的理由在估值輸入，都不是資料錯誤；穩態利潤率高於歷史上限標「高於歷史上限」；利潤率仍在改善中的公司（轉型、規模擴張期），歷史上限不一定是天花板，標記只提醒讀者對照，不代表假設錯誤。出處：估值結果.json（reverse_dcf、implied_return、discount）、估值輸入.json（scenarios）、財務指標.json（ROIC_TTM）、產業指標.json（景氣正常化）、成長推估底稿.json 與財務歷史.json（近四季）；推導，只揭露，不改合理價值、價格位置與研究評等。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;市價隱含的成長與歷史基準比率&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;市價隱含 META 未來 10 年營收實質年增約 11.3%–11.8%（名目 13.8% 減通膨 2.0%–2.5% 的近似，推導）；1950–2015 年營收 500 億美元以上的公司中，10 年間做到實質年增 10% 以上的約 3.9%（Mauboussin 等，2016，表 4）。此為揭露，不是市價錯誤的證明。&lt;/p&gt;&lt;p&gt;現價要成立，需把基準情境第 1 年營收成長 20.0% 延續約 7 年（之後新投資報酬等於折現率，不再創造價值；推導，只揭露）。&lt;/p&gt;&lt;p&gt;&lt;b&gt;隱含假設罕見度：歷史罕見&lt;/b&gt;（同規模公司 10 年做到的歷史比例 ≥50% 一般、10%–50% 樂觀、&amp;lt;10% 歷史罕見；只揭露，不改研究評等與價格位置）&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;超額報酬期間&lt;/th&gt;&lt;th&gt;市價隱含營收年增（名目）&lt;/th&gt;&lt;th&gt;約實質（名目減通膨 2.0%–2.5% 的近似，推導）&lt;/th&gt;&lt;th&gt;歷史基準比率（1950–2015）&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;10 年&lt;/td&gt;&lt;td&gt;13.8%&lt;/td&gt;&lt;td&gt;11.3%–11.8%&lt;/td&gt;&lt;td&gt;營收 500 億美元以上：10 年實質年增 10% 以上約 3.9%（該組 10 年實質年增中位數 1.1%）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;15 年&lt;/td&gt;&lt;td&gt;10.5%&lt;/td&gt;&lt;td&gt;8.0%–8.5%&lt;/td&gt;&lt;td&gt;原文只有 10 年分布，15、20 年無對照&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;20 年&lt;/td&gt;&lt;td&gt;9.0%&lt;/td&gt;&lt;td&gt;6.5%–7.0%&lt;/td&gt;&lt;td&gt;原文只有 10 年分布，15、20 年無對照&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;做法：超額報酬期間內營收年增固定、利潤率與銷售對資本比取基準情境第 5 年；期間結束後新投資報酬等於折現率（不再創造價值）；永續成長照基準情境。折現率 9.86%、第 5 年利潤率 37.0%。來源：Mauboussin, Callahan &amp;amp; Majd（2016）〈The Base Rate Book〉表 4（第三方轉載，原表 1950–2015 年、實質成長、有存活偏差）。這張表只說明「市價需要多強、多久的成長才成立」，不改合理價值、買入區上緣與價格位置；歷史比例低代表市價需要少見的結果，不代表市價錯誤。通膨假設 2.0%–2.5% 依 Morningstar 2020-10 方法，實質年增為名目直接減通膨的近似。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;市價溢價來源&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;溢價訊號集中在基本面預期（隱含假設罕見度）、倍數重估（預估背離）、資金與情緒（部位與衍生品）。總經與利率無訊號。只揭露，不改研究評等與價格位置，也不代表市價錯誤。&lt;/p&gt;&lt;p&gt;EPS 預估：+1y（2027 財年，推導） 預估 90 天 0.1%（持平；判斷窗口為 90 天，±2% 內視為持平），近 30 天上修減下修 0 家；yfinance 預估是取得當下快照，股價 90 天變化以批次收盤日為終點，兩者日期可能差幾天；取得 2026-11-14，晚於收盤日 2026-11-13。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;來源類別&lt;/th&gt;&lt;th&gt;數值&lt;/th&gt;&lt;th&gt;過熱訊號&lt;/th&gt;&lt;th&gt;說明／存檔位置&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;隱含假設罕見度&lt;/td&gt;&lt;td&gt;基本面預期&lt;/td&gt;&lt;td&gt;歷史罕見&lt;/td&gt;&lt;td&gt;有&lt;/td&gt;&lt;td&gt;價值判斷.json#/市價隱含假設&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;倍數擴張&lt;/td&gt;&lt;td&gt;倍數重估&lt;/td&gt;&lt;td&gt;近 1 年（2025-11-13 起）股價 +5%：EPS +0.26、本益比 -0.21（對數）→ 獲利成長為主&lt;/td&gt;&lt;td&gt;無&lt;/td&gt;&lt;td&gt;EPS 與本益比貢獻方向相反且 EPS 變動大：起點或終點的申報 EPS 可能含一次性項目，倍數擴張的方向可能被基期扭曲，對照扣非經常 EPS 再讀&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;預估背離&lt;/td&gt;&lt;td&gt;倍數重估&lt;/td&gt;&lt;td&gt;+1y（2027 財年，推導） EPS 預估 90 天 +0.1%（持平；90 天變化 ±2% 內視為持平），同期股價 +8.8% → 預估未跟上，偏情緒或倍數&lt;/td&gt;&lt;td&gt;有&lt;/td&gt;&lt;td&gt;價值判斷.json#/預估修正&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;本益比水位&lt;/td&gt;&lt;td&gt;倍數重估&lt;/td&gt;&lt;td&gt;現在 21.9 倍，自身五年 p75 29.1 倍&lt;/td&gt;&lt;td&gt;無&lt;/td&gt;&lt;td&gt;市場資料/歷史本益比.json#/pe_p75&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股債利差&lt;/td&gt;&lt;td&gt;總經與利率&lt;/td&gt;&lt;td&gt;近期百分位 43%（0% 最貴）&lt;/td&gt;&lt;td&gt;無&lt;/td&gt;&lt;td&gt;市場資料/歷史本益比.json#/股債利差/近期百分位&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;整體市場風險溢價&lt;/td&gt;&lt;td&gt;總經與利率&lt;/td&gt;&lt;td&gt;Damodaran 隱含風險溢價 4.20%（2026-10-01）&lt;/td&gt;&lt;td&gt;不適用&lt;/td&gt;&lt;td&gt;只存當月值，沒有歷史序列可比中位數；要下載 Damodaran 歷史表需使用者同意&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;動能&lt;/td&gt;&lt;td&gt;資金與情緒&lt;/td&gt;&lt;td&gt;相對 200 日均線 +2%；12 個月（2025-11-12 起） +6% 對 S&amp;amp;P500 +12%&lt;/td&gt;&lt;td&gt;無&lt;/td&gt;&lt;td&gt;市場資料/市場溫度.json#/趨勢、#/動能&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;部位與衍生品&lt;/td&gt;&lt;td&gt;資金與情緒&lt;/td&gt;&lt;td&gt;選擇權賣權對買權量比 偏熱；空單分位 68%、回補天數分位 74%&lt;/td&gt;&lt;td&gt;有&lt;/td&gt;&lt;td&gt;市場資料/市場溫度.json#/選擇權情緒、#/流動性&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;擁擠度&lt;/td&gt;&lt;td&gt;資金與情緒&lt;/td&gt;&lt;td&gt;20 日均換手率在自身五年 72% 分位；被發現程度 高&lt;/td&gt;&lt;td&gt;無&lt;/td&gt;&lt;td&gt;市場資料/市場溫度.json#/流動性/20日均換手率_分位&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;股價漲跌拆解：EPS 成長 vs 本益比變化（年化對數點，推導；不含股利、申報 EPS）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;期間&lt;/th&gt;&lt;th&gt;股價年化&lt;/th&gt;&lt;th&gt;EPS 貢獻&lt;/th&gt;&lt;th&gt;本益比貢獻&lt;/th&gt;&lt;th&gt;本益比&lt;/th&gt;&lt;th&gt;主因&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;1年&lt;/td&gt;&lt;td&gt;5.2%&lt;/td&gt;&lt;td&gt;+0.26&lt;/td&gt;&lt;td&gt;-0.21&lt;/td&gt;&lt;td&gt;27.0 → 21.9&lt;/td&gt;&lt;td&gt;獲利成長為主&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;3年&lt;/td&gt;&lt;td&gt;24.9%&lt;/td&gt;&lt;td&gt;+0.32&lt;/td&gt;&lt;td&gt;-0.09&lt;/td&gt;&lt;td&gt;29.0 → 21.9&lt;/td&gt;&lt;td&gt;獲利成長為主&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;門檻：使用者 2026-11-04 照草案核定（程式/市場溢價來源.py 常數）。各列只描述市場面，不改合理價值、研究評等與價格位置，非買賣建議。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;details id=&quot;wp-value&quot;&gt;&lt;summary&gt;價值判斷：PEG、林區資產負債表檢查與交叉檢查&lt;/summary&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;PEG 與林區檢查&lt;/h3&gt;&lt;div class=&quot;wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;PEG：可計算的成長口徑（紅線為 1 與 2）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 500 142&quot; role=&quot;img&quot; aria-label=&quot;PEG&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;168.0&quot; x2=&quot;168.0&quot; y1=&quot;6&quot; y2=&quot;136&quot; class=&quot;zero&quot;/&gt;&lt;line x1=&quot;292.5&quot; x2=&quot;292.5&quot; y1=&quot;4&quot; y2=&quot;138&quot; class=&quot;price&quot;/&gt;&lt;line x1=&quot;417.1&quot; x2=&quot;417.1&quot; y1=&quot;4&quot; y2=&quot;138&quot; class=&quot;price&quot;/&gt;&lt;text x=&quot;158&quot; y=&quot;23&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;過去三年 EPS 年增&lt;/text&gt;&lt;rect x=&quot;168.0&quot; y=&quot;9&quot; width=&quot;68.4&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;244.4&quot; y=&quot;23&quot; class=&quot;val&quot;&gt;0.5&lt;/text&gt;&lt;text x=&quot;158&quot; y=&quot;63&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;近四季對上一財年&lt;/text&gt;&lt;rect x=&quot;168.0&quot; y=&quot;49&quot; width=&quot;110.1&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;286.1&quot; y=&quot;63&quot; class=&quot;val&quot;&gt;0.9&lt;/text&gt;&lt;text x=&quot;158&quot; y=&quot;103&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;基準情境推估&lt;/text&gt;&lt;rect x=&quot;168.0&quot; y=&quot;89&quot; width=&quot;213.6&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;389.6&quot; y=&quot;103&quot; class=&quot;val&quot;&gt;1.7&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;PEG 與林區加股利比率（可計算的成長口徑）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;成長口徑&lt;/th&gt;&lt;th&gt;成長率&lt;/th&gt;&lt;th&gt;PEG&lt;/th&gt;&lt;th&gt;判讀&lt;/th&gt;&lt;th&gt;加股利比率&lt;/th&gt;&lt;th&gt;判讀&lt;/th&gt;&lt;th&gt;加股東收益率比率（現代延伸）&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;過去三年 EPS 年增&lt;/td&gt;&lt;td&gt;39.8%&lt;/td&gt;&lt;td&gt;0.5&lt;/td&gt;&lt;td&gt;便宜&lt;/td&gt;&lt;td&gt;1.83&lt;/td&gt;&lt;td&gt;普通&lt;/td&gt;&lt;td&gt;1.76&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;近四季對上一財年（申報 EPS）&lt;/td&gt;&lt;td&gt;24.8%&lt;/td&gt;&lt;td&gt;0.9&lt;/td&gt;&lt;td&gt;便宜&lt;/td&gt;&lt;td&gt;1.15&lt;/td&gt;&lt;td&gt;普通&lt;/td&gt;&lt;td&gt;1.07&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準情境推估（稅後營業利益年增－股數年變化）&lt;/td&gt;&lt;td&gt;12.8%&lt;/td&gt;&lt;td&gt;1.7&lt;/td&gt;&lt;td&gt;合理&lt;/td&gt;&lt;td&gt;0.60&lt;/td&gt;&lt;td&gt;差&lt;/td&gt;&lt;td&gt;0.52&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;加股東收益率比率＝（成長率＋股利殖利率＋淨回購殖利率）÷本益比，把回購也算進股東回饋、並扣掉發給員工的股票；這是現代延伸，不是林區原版，也沒有政策門檻，只列數字。 PEG 用的每股盈餘 29.31 美元：PEG 所用 EPS 為一般會計 EPS，未扣非經常項目，含股權薪酬（近四季淨利每股 29.31、每股股權薪酬 10.49）。&lt;/p&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:4px&quot;&gt;PEG 的判讀標籤依估值政策門檻；高風險、成長極高或極低的公司，PEG 有系統性偏誤（同樣成長下風險越高 PEG 越低），不能只憑標籤判斷便宜或昂貴。&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;林區式資產負債表與市場檢查&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;數值&lt;/th&gt;&lt;th&gt;林區的看法&lt;/th&gt;&lt;th&gt;判讀&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;本益比&lt;/td&gt;&lt;td&gt;21.89&lt;/td&gt;&lt;td&gt;與自身歷史比較&lt;/td&gt;&lt;td&gt;中性：申報 EPS 為 21.9 倍，位於過去五年第 27% 百分位（自身近五年 p25／p75 外才判偏便宜／偏貴）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;每股淨現金&lt;/td&gt;&lt;td&gt;0.59&lt;/td&gt;&lt;td&gt;淨現金可提供下檔保護（林區 O31、LAK02）&lt;/td&gt;&lt;td&gt;好：有淨現金，可提供下檔保護；占股價 0.1%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;負債對權益&lt;/td&gt;&lt;td&gt;0.30&lt;/td&gt;&lt;td&gt;一般越低越好（林區 L25）&lt;/td&gt;&lt;td&gt;不評好壞：有息負債約為股東權益的 0.30 倍；沒有公認門檻，償債能力見收現段償債指標&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;每股自由現金流（近四季）&lt;/td&gt;&lt;td&gt;11.16&lt;/td&gt;&lt;td&gt;比每股盈餘更接近現金（林區 O37、修正10）&lt;/td&gt;&lt;td&gt;不評好壞：自由現金流殖利率 1.7%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股數年變化（近三財年）&lt;/td&gt;&lt;td&gt;-1.6%&lt;/td&gt;&lt;td&gt;持續買回、且價格合理、資金來自本業現金時才是好訊號（林區 L16、O19）&lt;/td&gt;&lt;td&gt;好：近三財年平均每年 -1.6%；最近一季對去年同季 +0.0%（2025-09-30→2026-09-30）：近期轉為增加，PEG 推估改用近期變化&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;存貨增速 vs 營收增速&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;存貨增速高於營收是警訊（林區 O50）&lt;/td&gt;&lt;td&gt;資料限制：無資料&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;內部人公開市場買進&lt;/td&gt;&lt;td&gt;0&lt;/td&gt;&lt;td&gt;內部人自掏腰包買進是強訊號&lt;/td&gt;&lt;td&gt;中性：近期無人買進；賣出原因多，訊號較弱&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;林區以外的交叉檢查（只揭露，不改研究評等與價格位置）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;檢查&lt;/th&gt;&lt;th&gt;結果&lt;/th&gt;&lt;th&gt;判讀&lt;/th&gt;&lt;th&gt;依據與限制&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Piotroski F 分數（財報是否在改善）&lt;/td&gt;&lt;td&gt;5 ／ 8 項（2024-12-31→2025-12-31）&lt;/td&gt;&lt;td&gt;中&lt;/td&gt;&lt;td&gt;未通過：ROA 比上年高、長期負債 ÷ 平均總資產比上年低、流動比率比上年高。Piotroski（2000）研究文獻/Piotroski2000_財報訊號.json 第 9–11、15 頁；8–9 分高分組、0–2 分低分組&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Beneish M 分數（盈餘被美化的機率）&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;不適用&lt;/td&gt;&lt;td&gt;缺 銷管費用&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Greenblatt 盈餘殖利率與資本報酬率&lt;/td&gt;&lt;td&gt;盈餘殖利率 4.8%；ROIC 35%&lt;/td&gt;&lt;td&gt;低於 10 年公債 5.1%；ROIC 35% 高於 WACC 9.9%&lt;/td&gt;&lt;td&gt;盈餘殖利率＝近四季營業利益 ÷（市值＋有息負債－現金與證券），推導；ROIC 為本專案稅後口徑，非 Greenblatt 原式稅前；不做排名&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;details id=&quot;wp-6&quot;&gt;&lt;summary&gt;6 財務：償債指標、融資活動、存活檢查與利率壓力測試&lt;/summary&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;融資活動與償債：錢還給誰、有沒有借錢、還不還得起&lt;/h3&gt;&lt;p class=&quot;cap&quot;&gt;利息保障改讀信用與存活的利息口徑（EBIT ÷ 近四季利息費用：us-gaap:InterestExpenseDebt，年度＋本期年初至今－去年同期；本機 SEC 事實），底稿的利息費用科目未對應。&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;償債能力指標（利息保障依 Damodaran 合成評等對照；其他沒有公認門檻，只寫事實）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;指標&lt;/th&gt;&lt;th&gt;數值&lt;/th&gt;&lt;th&gt;判讀&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;EBIT ÷ 利息費用&lt;/td&gt;&lt;td&gt;30.62&lt;/td&gt;&lt;td&gt;相當於 AAA 級：EBIT 是利息費用的 30.6 倍；依 Damodaran 合成評等大型公司對照表（2026 年 1 月；市值 16,510.7 億美元，在 50 億美元以上）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;（營運現金流＋實付利息）÷ 實付利息&lt;/td&gt;&lt;td&gt;92.09&lt;/td&gt;&lt;td&gt;不評好壞：實付利息 14.6 億美元，營運現金流加回利息後可付約 92 倍；大額新借款只付了部分期間的利息，這個倍數偏高，不能單獨拿來判斷&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;有息負債 ÷ EBITDA&lt;/td&gt;&lt;td&gt;0.78&lt;/td&gt;&lt;td&gt;不評好壞：以近四季 EBITDA 1,043.0 億美元計，約 0.8 年可還清有息負債&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;淨負債 ÷ EBITDA&lt;/td&gt;&lt;td&gt;-0.01&lt;/td&gt;&lt;td&gt;不評好壞：現金多於有息負債（淨現金）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;營運現金流 ÷ 有息負債&lt;/td&gt;&lt;td&gt;164.5%&lt;/td&gt;&lt;td&gt;不評好壞：一年的營運現金流約可還掉 164% 的有息負債（約 0.6 年還清）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;現金與證券 ÷ 一年內到期債務&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;資料限制：未取得（未取得（短期借款與一年內到期長債科目皆無））&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;2026 年 8 月多州總檢察長和解：約 127 億美元分 10 年按年支付，另有 53 億美元或有金額尚未認列（10-Q 2026-09-30 Item 2 ¶178）；第三季一次性認列 99 億費用，EBIT 與利息保障倍數含此項，扣除後倍數需另算（推導，待估值段）。&lt;/p&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;可用授信與到期（作者判讀，融資償債判讀.json）：票據面額 840 億；一年內到期 27.5 億（2027 年 8 月），其餘至 2066 年；10-Q 未見循環信貸額度&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;融資活動現金流：還給股東與借還款（本財年年初至 2026-09-30 累計，10-Q 2026-09-30）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;對象｜分類&lt;/th&gt;&lt;th&gt;金額&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股東｜員工股票代扣稅與相關淨額&lt;/td&gt;&lt;td&gt;-128 億美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股東｜股利&lt;/td&gt;&lt;td&gt;-40.6 億美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股東｜回購&lt;/td&gt;&lt;td&gt;0&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股東小計&lt;/td&gt;&lt;td&gt;-168 億美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;債權人｜借入&lt;/td&gt;&lt;td&gt;249 億美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;債權人小計&lt;/td&gt;&lt;td&gt;249 億美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;其他｜融資租賃本金&lt;/td&gt;&lt;td&gt;-27.7 億美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;其他｜其他（未歸類）&lt;/td&gt;&lt;td&gt;-26.3 億美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;其他小計&lt;/td&gt;&lt;td&gt;-54.0 億美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;對照：同期營運現金流&lt;/td&gt;&lt;td&gt;969 億美元&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;融資活動是公司與出資人（股東、債權人）之間的現金往來，不等於借款：回購、股利是還給股東，借入、償還才是借款；負數＝現金流出。本表期間與下方借款用途、上方現金流分層（近四季）不同。&lt;/p&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;借款用途（研究判讀）：擴張（AI 與資料中心資本支出）為主；2026 年 5 月發債 249.1 億，同期無回購；期間 2026 年前九個月；依據：10-Q 2026-09-30 Part I, Item 2 ¶159、10-Q 2026-09-30 Part I, Item 2 ¶148、10-Q 2026-09-30 Part I, Item 2 ¶156、10-Q 2026-09-30 Part I, Item 1 ¶131、8-K 2026-11-05 本文 §3、8-K 2026-11-12 本文 §3、8-K 2026-10-29 本文 §13&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;survival-detail&quot;&gt;&lt;h3&gt;存活檢查：現金對債務（12～24 個月，推導，非違約預測）&lt;/h3&gt;&lt;p style=&quot;margin:0 0 6px&quot;&gt;&lt;b&gt;信用評級&lt;/b&gt;　機構 未揭露（10-K、10-Q、8-K、SEC 全文搜尋 查無 S&amp;amp;P、Moody&amp;#x27;s、Fitch、KBRA 評級）／推導 AAA（Damodaran 合成評等，利息保障 30.6 倍，近四季新借款多、利息偏低、評級可能偏高，推導）｜依推導：投資等級（BBB-／Baa3 以上）&lt;/p&gt;&lt;p style=&quot;margin:0 0 6px&quot;&gt;&lt;b&gt;存活檢查（完整理由）&lt;/b&gt;　無明顯警訊（推導，非違約預測）：現金與流動證券 716 億美元，一年內到期債務 28 億美元（另利息 ;限制：&lt;/p&gt;&lt;ul class=&quot;cap&quot;&gt;&lt;li&gt;Base Rate Book 1950–2015、只含存續公司（存活偏差）；原表 10 年欄，5 年期待建立&lt;/li&gt;&lt;li&gt;非營業淨資產假設不變；資金缺口另列，不回頭改期末市值&lt;/li&gt;&lt;li&gt;均值回歸以本益比近似 EV÷稅後營業利益；產業倍數是 Damodaran 目前值，不是成熟期值&lt;/li&gt;&lt;li&gt;罕見度是歷史上多少公司做到，不是這家公司做到的機率&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;!--目標區間:附錄--&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;目標區間的倍數核對（只列不合成）&lt;/h3&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt&quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;倍數區段&lt;/th&gt;&lt;th&gt;倍數（EV／營業利益）&lt;/th&gt;&lt;th&gt;第 1 年獲利（百萬美元）&lt;/th&gt;&lt;th&gt;核對區間（美元）&lt;/th&gt;&lt;th&gt;代表值需要倍數&lt;/th&gt;&lt;th&gt;主方法代表值對核對區間中點&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;同規模同成長 p25～中位&lt;/td&gt;&lt;td&gt;9.18–16.87&lt;/td&gt;&lt;td&gt;87,703&lt;/td&gt;&lt;td&gt;305.63–568.00&lt;/td&gt;&lt;td&gt;8.1&lt;/td&gt;&lt;td&gt;−39%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;現在倍數～自身近五年 p25&lt;/td&gt;&lt;td&gt;16.63–18.29&lt;/td&gt;&lt;td&gt;104,374&lt;/td&gt;&lt;td&gt;667.33–734.84&lt;/td&gt;&lt;td&gt;12.9&lt;/td&gt;&lt;td&gt;−26%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;自身近五年中位～p75&lt;/td&gt;&lt;td&gt;20.56–23.97&lt;/td&gt;&lt;td&gt;116,599&lt;/td&gt;&lt;td&gt;924.43–1079.14&lt;/td&gt;&lt;td&gt;21.4&lt;/td&gt;&lt;td&gt;−4%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;各情境第 1 年營業利益（假設，推導；不是公司指引）。每股 =（倍數 × 獲利 − 股權橋 18,354）÷ 2,573.0 百萬股，與估值引擎同口徑。倍數維持現在倍數不變、只看獲利，每股 ＝（現在倍數 × 第 1 年獲利 − 股權橋）÷ 股數：保守 616.3、基準 734.8、樂觀 821.8（美元）。倍數核對回答「市場一年後照這種擔憂程度給倍數，價格會在哪」；與主方法的差距是價值與市場慣例的落差，不合成、不平均。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;目標區間的企業價值前推核對&lt;/h3&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt&quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;股權成本前推（每股，折現率基準）&lt;/th&gt;&lt;th&gt;企業價值前推（每股）&lt;/th&gt;&lt;th&gt;相對差距&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;267.64&lt;/td&gt;&lt;td&gt;267.69&lt;/td&gt;&lt;td&gt;0.02%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;517.33&lt;/td&gt;&lt;td&gt;516.78&lt;/td&gt;&lt;td&gt;0.11%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;960.43&lt;/td&gt;&lt;td&gt;958.81&lt;/td&gt;&lt;td&gt;0.17%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;EV₀×（1＋WACC）−股權橋 與 每股價值×（1＋股權成本）的差；差距≥1% 只標註（槓桿較高時前者未計利息），不改目標區間。最大相對差距 0.17%（小於 1%）。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;各段代表值需要的倍數與歷史位置&lt;/h3&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt&quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;需要倍數（EV／營業利益）&lt;/th&gt;&lt;th&gt;相對現在 18.3 倍&lt;/th&gt;&lt;th&gt;自身近一年高於／低於此倍數的交易日比例&lt;/th&gt;&lt;th&gt;自身近五年（存檔四分位內插）&lt;/th&gt;&lt;th&gt;同規模同成長&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;8.1&lt;/td&gt;&lt;td&gt;低於&lt;/td&gt;&lt;td&gt;99% 以上／不到 1%&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;低於 p25&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;低於 p25&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;12.9&lt;/td&gt;&lt;td&gt;低於&lt;/td&gt;&lt;td&gt;99% 以上／不到 1%&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;低於 p25&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;約第 37 百分位（p25–p75 間線性內插，推導）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;21.4&lt;/td&gt;&lt;td&gt;高於&lt;/td&gt;&lt;td&gt;7%／93%&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;約第 56 百分位（p25–p75 間線性內插，推導）&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;約第 57 百分位（p25–p75 間線性內插，推導）&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;需要倍數＝（代表值×股數＋股權橋）÷ 情境第 1 年獲利（推導）；是把價值翻成倍數的讀法，不是預測市場會給這個倍數。自身近一年比例：近一年每日 EV／近四季獲利（申報日後才可用）重建，四分位與市場給價存檔一致；推導（2025-11-13 至 2026-11-13，252 個交易日）。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;約 12 個月選擇權隱含分布下，各段的風險中立機率&lt;/h3&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt&quot;&gt;&lt;tr&gt;&lt;th&gt;保守段&lt;/th&gt;&lt;th&gt;基準段&lt;/th&gt;&lt;th&gt;樂觀段&lt;/th&gt;&lt;th&gt;低於最低端&lt;/th&gt;&lt;th&gt;高於最高端&lt;/th&gt;&lt;th&gt;段與段空白&lt;/th&gt;&lt;th&gt;段與段重疊&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;5.3%&lt;/td&gt;&lt;td&gt;32%&lt;/td&gt;&lt;td&gt;21%&lt;/td&gt;&lt;td&gt;1.1%&lt;/td&gt;&lt;td&gt;6.5%&lt;/td&gt;&lt;td&gt;34%&lt;/td&gt;&lt;td&gt;0.0%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;風險中立機率，不是真實機率；不改情境權重、不改估值與評等。到期日 2027-12-17（離終點日 34 天）價平隱含波動 43.1%（買權 49%、賣權 37%），最近成交 2026-11-13 20:50:58+00:00；無風險利率 4.65%（FRED DGS1，2026-11-12 觀測 4.65%，資料庫/利率_FRED.json）、股利率 0.33%；起點價格 641.69（2026-11-13 收盤）。對數常態；漂移＝無風險利率（固定用 1 年期 DGS1，期間固定 1 年，不依到期日做期限插補）−股利率；波動＝價平隱含波動（不含波動微笑與偏態）；以批次收盤價為起點、12 個月為期間。各段機率是價格落在該段價值區間內的機率，段與段重疊處在各段機率中重複計入。報價品質：買權 49.1%、賣權 37.1% 相差 12 個百分點，報價可能過時或含偏斜，只作參考。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;預估修正趨勢（只描述，不當證據）&lt;/h3&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt&quot;&gt;&lt;tr&gt;&lt;th&gt;期間&lt;/th&gt;&lt;th&gt;每股盈餘預估&lt;/th&gt;&lt;th&gt;7 天前&lt;/th&gt;&lt;th&gt;30 天前&lt;/th&gt;&lt;th&gt;60 天前&lt;/th&gt;&lt;th&gt;90 天前&lt;/th&gt;&lt;th&gt;較 30 天前&lt;/th&gt;&lt;th&gt;近 7 天上修／下修家數&lt;/th&gt;&lt;th&gt;近 30 天上修／下修家數&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;本季&lt;/td&gt;&lt;td&gt;8.33&lt;/td&gt;&lt;td&gt;8.33&lt;/td&gt;&lt;td&gt;8.26&lt;/td&gt;&lt;td&gt;8.22&lt;/td&gt;&lt;td&gt;8.23&lt;/td&gt;&lt;td&gt;持平&lt;/td&gt;&lt;td&gt;8／4&lt;/td&gt;&lt;td&gt;24／15&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;下一季&lt;/td&gt;&lt;td&gt;7.65&lt;/td&gt;&lt;td&gt;7.65&lt;/td&gt;&lt;td&gt;7.83&lt;/td&gt;&lt;td&gt;7.78&lt;/td&gt;&lt;td&gt;7.77&lt;/td&gt;&lt;td&gt;下修&lt;/td&gt;&lt;td&gt;6／13&lt;/td&gt;&lt;td&gt;7／12&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;本財年（2026 財年，推導）&lt;/td&gt;&lt;td&gt;29.12&lt;/td&gt;&lt;td&gt;29.12&lt;/td&gt;&lt;td&gt;31.04&lt;/td&gt;&lt;td&gt;31.42&lt;/td&gt;&lt;td&gt;31.79&lt;/td&gt;&lt;td&gt;下修&lt;/td&gt;&lt;td&gt;3／4&lt;/td&gt;&lt;td&gt;7／40&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;下一財年（2027 財年，推導）&lt;/td&gt;&lt;td&gt;33.97&lt;/td&gt;&lt;td&gt;33.93&lt;/td&gt;&lt;td&gt;34.04&lt;/td&gt;&lt;td&gt;33.91&lt;/td&gt;&lt;td&gt;33.95&lt;/td&gt;&lt;td&gt;持平&lt;/td&gt;&lt;td&gt;3／4&lt;/td&gt;&lt;td&gt;22／22&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;分析師預估與券商目標價只描述，不當證據，也不是目標區間任一端；上修／下修門檻為較 30 天前變動 ±1%（本工具設定；與「市價溢價來源」預估修正以 90 天 ±2% 判持平是兩個口徑）。資料取得 2026-11-14T10:39:39（台北時間）（yfinance eps_trend、eps_revisions）。券商目標價近 90 天 30 家調整：上調 24、下調 3、持平 3；上季財報驚奇（Nasdaq）：Sep 2026，10/21/2026 公布，每股盈餘 7.4、共識 6.52、驚奇 13.5%；（yfinance）：2026-09-30，實際 3.83、預估 5.41956。兩個來源口徑可能不同（可能是調整後或一般會計準則）；公司申報的每股盈餘可對照存檔 8-K 2026-10-21 財報新聞稿（事件/8K事件.json），本工具未逐項比對，只描述，不比較、不當證據。每批另存快照自建歷史：1 筆（2026-11-14 至 2026-11-14）。&lt;/p&gt;&lt;/div&gt;&lt;!--/目標區間:附錄--&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;利率的影響：公債殖利率變動與股債利差&lt;/h3&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;利率影響不小：10 年期公債殖利率下降 1 個百分點、其他不變，合理價值中點從約 516 升到約 613（+19%）；上升 1 個百分點則降到約 442（−14%）。&lt;/strong&gt;現在 10 年期公債約 5.15%，基準情境推算年報酬約 8.2%&lt;span class=&quot;src&quot;&gt;（基準情境成真時、以收盤 2026-11-13 股價買進的推算年報酬；條件式，非預期報酬、非買賣建議）&lt;/span&gt;，只比公債高約 3 個百分點。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;grid2 wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;公債殖利率每變動 1 個百分點，合理價值中點的變化（美元；紅色虛線為現價 641.69）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 500 142&quot; role=&quot;img&quot; aria-label=&quot;利率敏感度&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;168.0&quot; x2=&quot;168.0&quot; y1=&quot;6&quot; y2=&quot;136&quot; class=&quot;zero&quot;/&gt;&lt;line x1=&quot;417.1&quot; x2=&quot;417.1&quot; y1=&quot;4&quot; y2=&quot;138&quot; class=&quot;price&quot;/&gt;&lt;text x=&quot;158&quot; y=&quot;23&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;公債−1%（4.15%）&lt;/text&gt;&lt;rect x=&quot;168.0&quot; y=&quot;9&quot; width=&quot;238.1&quot; h t;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;同業與產業對照&lt;/h3&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;與個別同業比較&lt;/h4&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;Meta 的利潤率與 Google 相當，但資本支出強度最高：近四季營業利益率 32.9%（META，資料商 yfinance，近四季截至 2026-09-30）、Google 33.3%（GOOGL，資料商 yfinance，近四季截至 2026-09-30）；資本支出占營收 43.2%（META，資料商 yfinance，近四季截至 2026-09-30），高於 Google 33.9%（GOOGL，資料商 yfinance，近四季截至 2026-09-30） 與 Microsoft 39.2%（MSFT，資料商 yfinance，近四季截至 2026-09-30）。&lt;/p&gt;&lt;p&gt;社群同業 Pinterest、Snap 利潤率遠低、幾乎不蓋資料中心，可比性有限；同業倍數只作交叉核對，不進評等。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;與個別同業比較：利潤率與投入強度（近四季）。資料期間：本公司 SEC 近四季（截至 2026-09-30）；同業為資料商（yfinance 季報加總）近四季，截至 GOOGL 2026-09-30、PINS 2026-09-30、SNAP 2026-09-30、RDDT 2026-09-30、MSFT 2026-09-30、AMZN 2026-09-30；資料商查詢 2026-11-14（批次收盤 2026-11-13）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 300&quot; role=&quot;img&quot; aria-label=&quot;同業比較&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;266.0&quot; y2=&quot;266.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;270.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;-20%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;205.5&quot; y2=&quot;205.5&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;209.5&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;0%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;145.0&quot; y2=&quot;145.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;149.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;20%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;84.5&quot; y2=&quot;84.5&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;88.5&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;40%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;24.0&quot; y2=&quot;24.0&quot; class=&quot;gr ot;&gt;&lt;title&gt;研發占營收 PINS：35%&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;234.4&quot; y=&quot;201.3&quot; width=&quot;14.3&quot; height=&quot;4.2&quot; rx=&quot;2&quot; fill=&quot;var(--c3)&quot;&gt;&lt;title&gt;資本支出占營收 PINS：1%&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;226.3&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;PINS&lt;/text&gt;&lt;rect x=&quot;271.6&quot; y=&quot;205.5&quot; width=&quot;14.3&quot; height=&quot;5.5&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;營業利益率 SNAP：-2%&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;287.9&quot; y=&quot;114.7&quot; width=&quot;14.3&quot; height=&quot;90.8&quot; rx=&quot;2&quot; fill=&quot;var(--c2)&quot;&gt;&lt;title&gt;研發占營收 SNAP：30%&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;304.1&quot; y=&quot;196.0&quot; width=&quot;14.3&quot; height=&quot;9.5&quot; rx=&quot;2&quot; fill=&quot;var(--c3)&quot;&gt;&lt;title&gt;資本支出占營收 SNAP：3%&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;296.0&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;SNAP&lt;/text&gt;&lt;rect x=&quot;341.3&quot; y=&quot;116.6&quot; width=&quot;14.3&quot; height=&quot;88.9&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;營業利益率 RDDT：29%&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;357.6&quot; y=&quot;117.3&quot; width=&quot;14.3&quot; height=&quot;88.2&quot; rx=&quot;2&quot; fill=&quot;var(--c2)&quot;&gt;&lt;title&gt;研發占營收 RDDT：29%&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;373.8&quot; y=&quot;204.9&quot; width=&quot;14.3&quot; height=&quot;1.0&quot; rx=&quot;2&quot; fill=&quot;var(--c3)&quot;&gt;&lt;title&gt;資本支出占營收 RDDT：0%&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;365.7&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;RDDT&lt;/text&gt;&lt;rect x=&quot;411.0&quot; y=&quot;63.0&quot; width=&quot;14.3&quot; height=&quot;142.5&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;營業利益率 MSFT：47%&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;427.3&quot; y=&quot;173.7&quot; width=&quot;14.3&quot; height=&quot;31.8&quot; rx=&quot;2&quot; fill=&quot;var(--c2)&quot;&gt;&lt;title&gt;研發占營收 MSFT：11%&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;443.6&quot; y=&quot;86.8&quot; width=&quot;14.3&quot; height=&quot;118.7&quot; rx=&quot;2&quot; fill=&quot;var(--c3)&quot;&gt;&lt;title&gt;資本支出占營收 MSFT：39%&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;435.4&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;MSFT&lt;/text&gt;&lt;rect x=&quot;480.7&quot; y=&quot;168.8&quot; width=&quot;14.3&quot; height=&quot;36.7&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;營業利益率 AMZN：12%&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;513.3&quot; y=&quot;129.2&quot; width=&quot;14.3&quot; height=&quot;76.3&quot; rx=&quot;2&quot; fill=&quot;var(--c3)&quot;&gt;&lt;title&gt;資本支出占營收 AMZN：25%&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;505.1&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;AMZN&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c1)&quot;&gt;&lt;/i&gt;營業利益率&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c2)&quot;&gt;&lt;/i&gt;研發占營收&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c3)&quot;&gt;&lt;/i&gt;資本支出占營收&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;我們的假設 vs 產業常見範圍&lt;/h4&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;利潤率與折現率略高於產業：基準第 1 年營業利益率 36%，Damodaran Software (Entertainment) 77 家為 33.85%（2026 年 1 月）。&lt;/strong&gt;beta 約 1.19 對產業 1.03，折現率 9.86% 對產業資本成本 8.44%；偏高來自兩年週 beta 較高（作者判斷）。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;銷售對投入資本與期末 ROIC 低於產業：基準第 1 年 0.5、第 5 年 1.1，產業 1.34，反映 2026 年資本支出指引 1,350–1,450 億的高峰投資&lt;span class=&quot;src&quot;&gt;（8-K 2026-10-21 新聞稿 §7）&lt;/span&gt;。&lt;/strong&gt;期末 ROIC 取等於折現率，產業 ROC 27.02%，代表不假設永續超額報酬（作者判斷）。稅率 18% 低於產業 22.02%，依公司第四季稅率指引 15–17%（同 §7）。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;估值方法與參數&lt;/h3&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;方法&lt;/th&gt;&lt;th&gt;低&lt;/th&gt;&lt;th&gt;中&lt;/th&gt;&lt;th&gt;高&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;DCF 保守&lt;/td&gt;&lt;td&gt;208&lt;/td&gt;&lt;td&gt;245&lt;/td&gt;&lt;td&gt;290&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;DCF 基準&lt;/td&gt;&lt;td&gt;391&lt;/td&gt;&lt;td&gt;472&lt;/td&gt;&lt;td&gt;570&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;DCF 樂觀&lt;/td&gt;&lt;td&gt;719&lt;/td&gt;&lt;td&gt;874&lt;/td&gt;&lt;td&gt;1066&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;同業本益比&lt;/td&gt;&lt;td&gt;555&lt;/td&gt;&lt;td&gt;695&lt;/td&gt;&lt;td&gt;1186&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;同業企業價值／營業利益&lt;/td&gt;&lt;td&gt;705&lt;/td&gt;&lt;td&gt;793&lt;/td&gt;&lt;td&gt;823&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p style=&quot;font-size:14px&quot;&gt;折現率基準 9.9%（區間 8.8%–11.0%）：無風險利率 5.15%、市場風險溢價 4.20%、beta 1.185。DCF 為 10 年：前 5 年依情境，後 5 年成長與利潤率逐步回到永續水準。&lt;/p&gt;&lt;p style=&quot;font-size:14px&quot;&gt;同業：GOOGL（數位廣告平台（搜尋與 YouTube），同為大型 AI 資本支出廣告商）, PINS（社群與內容平台，廣告變現；資料商 EV 無法確認含營業租賃（共用_租賃口徑.py），EV 倍數不適用，寫 null；市值不到本公司十分之一，但同為使用者流量變現的社群廣告模式、毛利結構相近，只作倍數交叉核對）, SNAP（社群通訊平台，廣告變現；近四季淨利與營業利益為負，P/E、EV/EBIT 不適用；市值不到本公司十分之一，但同為使用者流量變現的社群廣告模式、毛利結構相近，只作倍數交叉核對）, RDDT（社群論壇平台，廣告變現；市值不到本公司十分之一，但同為使用者流量變現的社群廣告模式、毛利結構相近，只作倍數交叉核對）, MSFT（產業卡同業池提示；大型 AI 資本支出平台（含 LinkedIn 與搜尋廣告），只作規模與資本強度對照）。排除：AMZN：C 經營模式不同：產業卡同業池提示，但營收以零售與雲端為主，廣告占比低，生意型態不同。&lt;/p&gt;&lt;p style=&quot;font-size:14px&quot;&gt;產業公版：穩定現金流／數位平台；驗證狀態：已驗證三家（UBER、GOOGL 2026-11-06～07、GRAB 2026-11-08 通過審查；2026-11-08 使用者核定）；本公司尚未列入實例。&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;details id=&quot;claims&quot;&gt;&lt;summary&gt;論點檢查：每條判斷的證據狀態&lt;/summary&gt;&lt;div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;依風險分類的主張（證據狀態：支持／部分支持／提出反證／資料不足）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;編號&lt;/th&gt;&lt;th&gt;風險類別&lt;/th&gt;&lt;th&gt;主張&lt;/th&gt;&lt;th&gt;角色&lt;/th&gt;&lt;th&gt;證據狀態&lt;/th&gt;&lt;th&gt;什麼會改變判斷&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;META-C05&lt;/td&gt;&lt;td&gt;R1 資金與流動性&lt;/td&gt;&lt;td&gt;2026 年資本支出超過營運現金流可負擔的部分，成長改由發債、特別股與遠期售股支應&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;自由現金流連續兩季轉為正值，且同期沒有新發債或發股&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;META-C11&lt;/td&gt;&lt;td&gt;R1 資金與流動性&lt;/td&gt;&lt;td&gt;資產負債表中等：現金與有息負債大致相抵，但不可取消承諾 4,545 億、季後再發債，信評展望轉負&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;部分支持&lt;/td&gt;&lt;td&gt;信評降到 A+ 以下或淨負債超過 EBITDA 1 倍&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;META-C10&lt;/td&gt;&lt;td&gt;R2 償債負擔與永久損失&lt;/td&gt;&lt;td&gt;青少年相關訴訟仍未結束：多州總檢察長和解約 180 億，其中約 127 億分 10 年付、另 53 億附條件尚未認列，2027 年 2 月有學區示範案開審&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;2027 年 2 月學區示範案判決或和解金額超過 50 億&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;META-C01&lt;/td&gt;&lt;td&gt;R3 成長退坡與競爭&lt;/td&gt;&lt;td&gt;Meta 的網路效應與廣告資料規模讓曝光與單價同時上升，同業 10-K 把它列為主要競爭者，小型廣告主把它當主要獲客管道&lt;/td&gt;&lt;td&gt;支持論點&lt;/td&gt;&lt;td&gt;部分支持&lt;/td&gt;&lt;td&gt;連續兩季平均廣告價格年增轉負且曝光年增低於 5%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;META-C02&lt;/td&gt;&lt;td&gt;R3 成長退坡與競爭&lt;/td&gt;&lt;td&gt;成長來自既有廣告業務的量價自然成長，沒有靠併購&lt;/td&gt;&lt;td&gt;支持論點&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;單季營收年增低於 15% 或出現重大併購&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;META-C03&lt;/td&gt;&lt;td&gt;R3 成長退坡與競爭&lt;/td&gt;&lt;td&gt;成長速度正從 30% 左右回落，基準假設第 1 年 20%、之後逐年降到 10%&lt;/td&gt;&lt;td&gt;支持論點&lt;/td&gt;&lt;td&gt;部分支持&lt;/td&gt;&lt;td&gt;2027 年任一季營收年增高於 25%；2027 年任一季營收年增低於 10%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;META-C04&lt;/td&gt;&lt;td&gt;R4 投入回報不足&lt;/td&gt;&lt;td&gt;新引擎（Muse AI 代理、合作廣告、Reality Labs 的 AI 眼鏡）還在待證明階段，沒有計入估值上修&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;資料不足&lt;/td&gt;&lt;td&gt;公司在 10-Q／10-K 揭露 AI 代理或訂閱營收且單季超過總營收 2%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;META-C08&lt;/td&gt;&lt;td&gt;R4 投入回報不足&lt;/td&gt;&lt;td&gt;投入資本報酬仍高（近四季 ROIC 約 35%），但投入資本一年多增加約四成，報酬率能否守住要看 AI 變現&lt;/td&gt;&lt;td&gt;支持論點&lt;/td&gt;&lt;td&gt;部分支持&lt;/td&gt;&lt;td&gt;近四季 ROIC 降到 20% 以下&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;META-C09&lt;/td&gt;&lt;td&gt;R5 收入與盈餘品質&lt;/td&gt;&lt;td&gt;自由現金流品質弱：近四季自由現金流不到淨利的四成，且與股權薪酬相當，第三季轉負&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;資本支出年增轉為個位數且近四季自由現金流超過淨利 60%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;META-C12&lt;/td&gt;&lt;td&gt;R6 治理與資料可信度&lt;/td&gt;&lt;td&gt;治理與資本配置中等：創辦人控制投票權，停止回購並新設無投票權 C 股以保留融資彈性&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;恢復回購且淨股數年減 1% 以上&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;META-C06&lt;/td&gt;&lt;td&gt;R7 估值與市場預期&lt;/td&gt;&lt;td&gt;十年後的規模取決於 AI 投資能否變現；樂觀情境的利潤率升到 42% 目前沒有完整財務路徑&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;資料不足&lt;/td&gt;&lt;td&gt;資本支出年增降到 10% 以下且營業利益率維持 40% 以上&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;META-C07&lt;/td&gt;&lt;td&gt;R7 估值與市場預期&lt;/td&gt;&lt;td&gt;現價 641.69 美元隱含前五年營收年增約 19%，高於基準情境，市場已預先計入 AI 投資回報&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;收盤價低於合理價值上緣，或新財報使基準情境成長上調到與反推值相當&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;META-C13&lt;/td&gt;&lt;td&gt;R9 稀釋與股東回饋&lt;/td&gt;&lt;td&gt;特別股與遠期售股會讓股數增加約 2%–2.5%（推導），2027 年 11 月前交割、2029 年 8 月轉換&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;10-Q 揭露新增股權發行超過 3% 股數&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;並列：研究評等 生意 B ／ 價格偏貴；價格位置 偏貴；現價隱含年報酬（基準情境，非預期報酬） 8.2%。各列狀態與價格分開呈現，不合成分數，狀態件數也不代表強弱（非買賣建議）。另有 1 條本次未檢驗，不代表沒有風險。&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;details id=&quot;survival-rules&quot;&gt;&lt;summary&gt;存活檢查與利率壓力測試：判定規則與限制&lt;/summary&gt;&lt;p class=&quot;cap&quot;&gt;規則版本：v1.1（2026-11-03 第二輪：加 KBRA、利率壓力測試、首頁精簡；仍只顯示提示、不改研究評等）&lt;/p&gt;&lt;ul class=&quot;cap&quot;&gt;&lt;li&gt;總燈號：各項取最嚴重：任一高風險→高風險；否則任一需留意→需留意；12 個月流動性或繼續經營無法判定→資料不足；其餘→無明顯警訊。Z 分數與推導評級只列理由、不改燈號。&lt;/li&gt;&lt;li&gt;繼續經營：最新年報或其後季報出現會計師或管理層「substantial doubt … going concern」肯定句 → 高風險（否定句、假設句只列出不計）；只出現在前一份年報 → 需留意&lt;/li&gt;&lt;li&gt;流動性_12個月：現金與證券＋未動用信貸 ≥ 一年內到期本金＋一年利息 → 無明顯警訊；不足但加近四季自由現金流（已扣實付利息）後 ≥ 一年內到期本金 → 需留意；仍不足 → 高風險&lt;/li&gt;&lt;li&gt;流動性_24個月：同上改兩年（本金、利息、自由現金流各計兩年）；不足但加兩年自由現金流 ≥ 本金的 50% → 需留意；更低 → 高風險&lt;/li&gt;&lt;li&gt;燒錢：近四季自由現金流為負：現金還能燒幾個月＝（現金與證券＋未動用信貸－一年內到期本金）÷ 每月燒錢；&amp;lt;12 個月 高風險、12～24 個月 需留意&lt;/li&gt;&lt;li&gt;利息保障：EBIT ÷ 利息費用 &amp;lt; 1.5 倍 → 需留意&lt;/li&gt;&lt;li&gt;契約：作者自 信用揭露.json 填公司揭露的契約門檻與實際值：已違反 → 高風險；餘裕 &amp;lt; 15% → 需留意；未揭露不判&lt;/li&gt;&lt;li&gt;信用評級：機構評級（S&amp;amp;P、Moody&amp;#x27;s、Fitch、KBRA，取各機構最新、以最低者判等級）低於 BBB-／Baa3 → 需留意；只有推導評級為投機等級 → 只列理由&lt;/li&gt;&lt;li&gt;利率壓力測試：固定情境 +100bp／+200bp／-100bp（不預測聯準會）：利息增加＝浮動利率債×利率變動（作者填 Item 7A 每 100bp 利息變動時改用該值）＋兩年內到期本金×（再融資利率＋利率變動－原票面利率）；再融資利率＝收盤日 10 年期公債殖利率＋該評級 ICE BofA OAS（推導）；壓力後利息保障＝EBIT÷（一年利息＋利息增加），EBIT 分母異常時改用現金利息保障。+200bp 後低於 1.5 倍 → 理由加一條、首頁也加（只列理由、不改燈號）；浮動利率債未揭露或未填 → 該情境未取得；金融業不套&lt;/li&gt;&lt;li&gt;金融業：銀行券商、保險不套現金對債務：研究評等輸入 監理紅線 低於門檻 → 高風險；高於門檻不到 20%（相對）→ 需留意；未填 → 資料不足&lt;/li&gt;&lt;/ul&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;使用限制&lt;/p&gt;&lt;ul class=&quot;cap&quot;&gt;&lt;li&gt;推導，非違約預測：燈號只看 12～24 個月付不付得出錢與已揭露的警訊，不是違約機率，也不改研究評等（第一版）。&lt;/li&gt;&lt;li&gt;Altman Z 分數會誤判兩類公司：權益為負（如舉債回購）與保留盈餘因長期回購或股利變負，所以只當輔助、不單獨下結論、不改燈號。&lt;/li&gt;&lt;li&gt;金融業（銀行券商、保險）的存款與保單負債是營業資金，改看監理資本（如 CET1），不套現金對債務。&lt;/li&gt;&lt;li&gt;超過 2～3 年的到期與再融資風險留在正文債務到期表，不進燈號。&lt;/li&gt;&lt;li&gt;到期年度桶以到期表資料日（年報）起算：桶的結束日落在窗口內才計入；跨窗口的桶另列，若作者在 信用揭露.json 填了近期到期明細就改用明細。&lt;/li&gt;&lt;li&gt;個別債券價格與殖利率（TRACE／FINRA）不在固定來源：未取得；市場參考只用 FRED 的 ICE BofA 各評級公司債利差（大盤層級）。&lt;/li&gt;&lt;li&gt;機構評級只認公司自己在 SEC 申報寫出的 S&amp;amp;P、Moody&amp;#x27;s、Fitch、KBRA 評級並附原句；沒揭露寫未揭露，不從新聞或記憶補。&lt;/li&gt;&lt;li&gt;利率壓力測試只用固定情境（+100bp、+200bp、−100bp），不預測聯準會；以 10 年期公債估再融資成本，實際年期與擔保結構不同會有誤差；浮動利率債若也在兩年內到期會重複計算（偏保守）；通膨、物價、消費者等間接影響不進燈號；金融業不套，維持看資本適足率。&lt;/li&gt;&lt;/ul&gt;&lt;/details&gt;&lt;details id=&quot;risks&quot;&gt;&lt;summary&gt;其他風險&lt;/summary&gt;&lt;div class=&quot;cards&quot;&gt;&lt;div class=&quot;card risk&quot;&gt;AI 投資回收慢於預期，折舊壓低利潤率多年。&lt;/div&gt;&lt;div class=&quot;card risk&quot;&gt;廣告景氣衰退時量價同時下滑。&lt;/div&gt;&lt;div class=&quot;card risk&quot;&gt;Apple、Google 平台規則再限制廣告追蹤。&lt;/div&gt;&lt;div class=&quot;card risk&quot;&gt;歐盟與美國的青少年保護監理加重。&lt;/div&gt;&lt;div class=&quot;card risk&quot;&gt;股權融資擴大造成稀釋。&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;details id=&quot;glossary&quot;&gt;&lt;summary&gt;名詞小抄&lt;/summary&gt;&lt;dl class=&quot;gl&quot;&gt;&lt;dt id=&quot;g0&quot;&gt;自由現金流（FCF）&lt;/dt&gt;&lt;dd&gt;營運現金流扣掉資本支出後，公司真正能自由運用的現金。&lt;/dd&gt;&lt;dt id=&quot;g1&quot;&gt;企業自由現金流折現（FCFF）&lt;/dt&gt;&lt;dd&gt;把公司未來每年的自由現金流折回今天的價值，再扣負債算每股價值。&lt;/dd&gt;&lt;dt id=&quot;g2&quot;&gt;投入資本報酬率（ROIC）&lt;/dt&gt;&lt;dd&gt;每投入 1 元營運資本，一年賺回多少稅後營業利益。&lt;/dd&gt;&lt;dt id=&quot;g3&quot;&gt;增量 ROIC&lt;/dt&gt;&lt;dd&gt;新增投入的資本帶來多少新增利潤，用來看新投資划不划算。&lt;/dd&gt;&lt;dt id=&quot;g4&quot;&gt;每日活躍人數（DAP）&lt;/dt&gt;&lt;dd&gt;每天至少用一個 Meta 應用的人數，公司自己估算。&lt;/dd&gt;&lt;dt id=&quot;g5&quot;&gt;應用家族（Family of Apps）&lt;/dt&gt;&lt;dd&gt;Facebook、Instagram、Messenger、WhatsApp 等應用的合稱，是 Meta 的廣告本業。&lt;/dd&gt;&lt;dt id=&quot;g6&quot;&gt;實境實驗室（Reality Labs）&lt;/dt&gt;&lt;dd&gt;Meta 做 VR 頭戴裝置、AI 眼鏡的部門，目前大幅虧損。&lt;/dd&gt;&lt;dt id=&quot;g7&quot;&gt;公司替代最低稅（CAMT）&lt;/dt&gt;&lt;dd&gt;美國對大型公司帳面利潤課的最低稅；2026 年第一季的過渡減免讓有效稅率一次性變低。&lt;/dd&gt;&lt;dt id=&quot;g8&quot;&gt;遠期售股&lt;/dt&gt;&lt;dd&gt;公司先和銀行約定價格，日後才交付新股收錢的增資方式。&lt;/dd&gt;&lt;dt id=&quot;g9&quot;&gt;強制轉換特別股&lt;/dt&gt;&lt;dd&gt;先付固定股息、到期一定轉成普通股的特別股，等於延後的增資。&lt;/dd&gt;&lt;dt id=&quot;g10&quot;&gt;終值&lt;/dt&gt;&lt;dd&gt;預測期以後所有年份的價值合計，通常占估值一大半。&lt;/dd&gt;&lt;/dl&gt;&lt;/details&gt;&lt;details id=&quot;numbers&quot;&gt;&lt;summary&gt;完整數字：三大報表摘要（年度與 8 季）&lt;/summary&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:14px&quot;&gt;損益表（年度與近四季）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;億美元&lt;/th&gt;&lt;th&gt;FY22&lt;/th&gt;&lt;th&gt;FY23&l &lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;div class=&quot;wrap&quot;&gt;&lt;div class=&quot;top&quot;&gt;&lt;span&gt;&lt;b&gt;Meta 平台（META）&lt;/b&gt;｜商業評估&lt;/span&gt;&lt;span&gt;資料截止 2026-09-30（10-Q 2026-09-30、8-K 2026-10-21 財報新聞稿）｜基準季 2026-09-30｜&lt;a href=&quot;報告.html&quot;&gt;估值報告（另頁）&lt;/a&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;hero&quot;&gt;&lt;div&gt;&lt;div class=&quot;eyebrow&quot;&gt;商業評估｜數位平台／—&lt;/div&gt;&lt;h1&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;Meta 靠 36 億人每天使用的應用賣廣告，量價同增讓營收年增 26%；卡點不在需求，而在 AI 基礎設施成本與兩筆訴訟費用把營業利益率從 44% 高點壓到 33%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src2&quot;&gt;[2]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src3&quot;&gt;[3]&lt;/a&gt;&lt;/sup&gt;&lt;/h1&gt;&lt;p class=&quot;lead&quot;&gt;本頁只用官方文件、財報與新聞，回答商業模式是否成立、成長點在哪、是否卡住、未來怎麼變、週期多久。&lt;b&gt;不含價格、估值或任何買賣建議&lt;/b&gt;，也不影響估值報告的研究評等。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;gradebox&quot;&gt;&lt;div class=&quot;lab&quot;&gt;商業評估等級（五級 A–E）&lt;span class=&quot;ruleok&quot;&gt;評分規則第一版，2026-11-07 使用者核定&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;g&quot;&gt;B&lt;small&gt;級&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;加權分 3.65／5｜相對同業：GOOGL、PINS、SNAP、RDDT、MSFT&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;模式成立，有一兩個需要追蹤的卡點&lt;/div&gt;&lt;div class=&quot;note&quot;&gt;商業評估等級（A–E 五級）只看商業模式是否成立、成長是否卡住、週期在哪，相對同產業卡同業評比；它不是估值報告研究評等裡的「生意品質 A／B／C」（那是看護城河、投入資本報酬、現金流品質、資產負債表與治理的絕對標準），不進研究評等、不影響估值、不涉任何價格。&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;nav class=&quot;qnav&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;&lt;a href=&quot;#s0&quot;&gt;重點&lt;/a&gt;&lt;a href=&quot;#s1&quot;&gt;1 商業輪廓&lt;/a&gt;&lt;a href=&quot;#s2&quot;&gt;2 說的 vs 做的&lt;/a&gt;&lt;a href=&quot;#s3&quot;&gt;3 成長與卡點&lt;/a&gt;&lt;a href=&quot;#sa&quot;&gt;4 優勢與持續期間&lt;/a&gt;&lt;a href=&quot;#s4&quot;&gt;5 生命週期&lt;/a&gt;&lt;a href=&quot;#s5&quot;&gt;6 週期&lt;/a&gt;&lt;a href=&quot;#s6&quot;&gt;7 觀察清單&lt;/a&gt;&lt;a href=&quot;#sg&quot;&gt;等級明細&lt;/a&gt;&lt;a href=&quot;#src&quot;&gt;出處&lt;/a&gt;&lt;/div&gt;&lt;/nav&gt;&lt;div class=&quot;wrap&quot;&gt;&lt;section id=&quot;s0&quot;&gt;&lt;h2&gt;一眼看重點&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;先看等級怎麼來、這頁的證據有多扎實；細節在下面各節。&lt;/p&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;等級怎麼來：五個面向&lt;/figcaption&gt;&lt;svg viewBox=&quot;0 0 640 260&quot; role=&quot;img&quot; aria-label=&quot;商業評估等級五面向：作者分與機械建議分&quot;&gt;&lt;line x1=&quot;150.0&quot; x2=&quot;150.0&quot; y1=&quot;20&quot; y2=&quot;232&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;150.0&quot; y=&quot;250&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;1 分&lt;/text&gt;&lt;line x1=&quot;255.0&quot; x2=&quot;255.0&quot; y1=&quot;20&quot; y2=&quot;232&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;255.0&quot; y=&quot;250&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;2 分&lt;/text&gt;&lt;line x1=&quot;360.0&quot; x2=&quot;360.0&quot; y1=&quot;20&quot; y2=&quot;232&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;360.0&quot; y=&quot;250&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;3 分&lt;/text&gt;&lt;line x1=&quot;465.0&quot; x2=&quot;465.0&quot; y1=&quot;20&quot; y2=&quot;232&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;465.0&quot; y=&quot;250&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;4 分&lt;/text&gt;&lt;line x1=&quot;570.0&quot; x2=&quot;570.0&quot; y1=&quot;20&quot; y2=&quot;232&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;570.0&quot; y=&quot;250&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;5 分&lt;/text&gt;&lt;text x=&quot;140&quot; y=&quot;55.0&quot; class=&quot;lb&quot; text-anchor=&quot;end&quot;&gt;模式穩固度&lt;tspan class=&quot;ax&quot;&gt; 25%&lt;/tspan&gt;&lt;/text&gt;&lt;rect x=&quot;150.0&quot; y=&quot;43.0&quot; width=&quot;315.0&quot; height=&quot;14&quot; rx=&quot;3&quot; fill=&quot;var(--biz)&quot; opacit
