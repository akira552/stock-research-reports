 x=&quot;140&quot; y=&quot;215.0&quot; class=&quot;lb&quot; text-anchor=&quot;end&quot;&gt;說法可信度&lt;tspan class=&quot;ax&quot;&gt; 15%&lt;/tspan&gt;&lt;/text&gt;&lt;rect x=&quot;150.0&quot; y=&quot;203.0&quot; width=&quot;315.0&quot; height=&quot;14&quot; rx=&quot;3&quot; fill=&quot;var(--biz)&quot; opacity=&quot;.85&quot;/&gt;&lt;path d=&quot;M465.0,198.0 l6,-8 h-12z&quot; fill=&quot;var(--accent)&quot;&gt;&lt;title&gt;機械建議 4&lt;/title&gt;&lt;/path&gt;&lt;text x=&quot;473.0&quot; y=&quot;215.0&quot; class=&quot;vl&quot;&gt;4&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;lg&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--biz)&quot;&gt;&lt;/i&gt;作者分&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--accent)&quot;&gt;&lt;/i&gt;機械建議分&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;藍條是作者分（1–5），橘色三角是工具的機械建議分；兩者不同的面向在等級明細寫了偏離理由。加權分 3.65 → B 級（A ≥ 4.2、B ≥ 3.5、C ≥ 2.8、D ≥ 2.1）。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估.json#/評等/面向（作者分、權重、機械建議）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;這頁的句子有多少是事實&lt;/figcaption&gt;&lt;svg viewBox=&quot;0 0 640 58&quot; role=&quot;img&quot; aria-label=&quot;句子標記組成&quot;&gt;&lt;rect x=&quot;4.0&quot; y=&quot;6&quot; width=&quot;385.9&quot; height=&quot;26&quot; fill=&quot;var(--biz)&quot;&gt;&lt;title&gt;事實 58&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;196.9&quot; y=&quot;24&quot; class=&quot;inb&quot; text-anchor=&quot;middle&quot;&gt;事實 58&lt;/text&gt;&lt;rect x=&quot;389.9&quot; y=&quot;6&quot; width=&quot;199.6&quot; height=&quot;26&quot; fill=&quot;var(--accent)&quot;&gt;&lt;title&gt;推論 30&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;489.6&quot; y=&quot;24&quot; class=&quot;inb&quot; text-anchor=&quot;middle&quot;&gt;推論 30&lt;/text&gt;&lt;rect x=&quot;589.4&quot; y=&quot;6&quot; width=&quot;33.3&quot; height=&quot;26&quot; fill=&quot;var(--c6)&quot;&gt;&lt;title&gt;作者判斷 5&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;622.7&quot; y=&quot;6&quot; width=&quot;13.3&quot; height=&quot;26&quot; fill=&quot;var(--neg)&quot;&gt;&lt;title&gt;待查 2&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;4&quot; y=&quot;52&quot; class=&quot;ax&quot;&gt;合計 95&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;lg&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--biz)&quot;&gt;&lt;/i&gt;事實 58&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--accent)&quot;&gt;&lt;/i&gt;推論 30&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c6)&quot;&gt;&lt;/i&gt;作者判斷 5&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--neg)&quot;&gt;&lt;/i&gt;待查 2&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;全頁句子依標記分類：事實（原文或財報直接寫的）占 61%；推論與作者判斷是從事實推出或取捨的結論，待查是找不到證據的地方。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估.json#/標記統計&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/section&gt;&lt;section id=&quot;s1&quot;&gt;&lt;h2&gt;1　商業輪廓：賣什麼、賣給誰、怎麼收錢&lt;/h2&gt;&lt;div&gt;&lt;span class=&quot;chip&quot;&gt;廣告（按曝光與成效計費的自助競價廣告）&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;企業付費訊息（WhatsApp）與訂閱&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;一次性硬體銷售（Meta Quest、AI 眼鏡）&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cards c3&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;賣什麼&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;應用家族（Facebook、Instagram、Messenger、WhatsApp）免費給使用者用，靠廣告收費；2025 年廣告營收 1,961.75 億美元，占總營收 97.6%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src4&quot;&gt;[4]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src5&quot;&gt;[5]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;實境實驗室賣 Meta Quest 頭戴裝置與 AI 眼鏡；2026 年第三季營收 4.43 億美元、年減 6%，原因是 Quest 銷量下滑、AI 眼鏡銷量上升只部分抵銷。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src6&quot;&gt;[6]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src7&quot;&gt;[7]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;賣給誰&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;付錢的是想觸及消費者的廣告主；2023–2025 年沒有任何客戶占營收或應收帳款 10% 以上。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src8&quot;&gt;[8]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;公司在風險因素寫幾乎所有營收來自廣告，廣告主流失或縮減預算會嚴重傷害業務。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src9&quot;&gt;[9]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;怎麼收錢&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;廣告營收＝曝光次數×每則廣告平均單價；2026 年第三季曝光年增 10%、單價年增 14%，廣告營收年增 26%（增加 129.8 億美元）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src10&quot;&gt;[10]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;應用家族其他營收第三季年增 59%（增加 4.07 億美元），主要來自 WhatsApp 企業付費訊息與訂閱。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src11&quot;&gt;[11]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;營收從哪裡來（2025-12-31 (FY)）&lt;/figcaption&gt;&lt;div class=&quot;sub-t&quot;&gt;依產品（ProductOrService）&lt;/div&gt;&lt;svg viewBox=&quot;0 0 640 60&quot; role=&quot;img&quot; aria-label=&quot;橫條&quot;&gt;&lt;text x=&quot;204&quot; y=&quot;20&quot; class=&quot;lb s&quot; text-anchor=&quot;end&quot;&gt;Advertising - Family of Apps&lt;title&gt;Advertising - Family of Apps&lt;/title&gt;&lt;/text&gt;&lt;rect x=&quot;212&quot; y=&quot;9&quot; width=&quot;278.0&quot; height=&quot;15&quot; rx=&quot;2&quot; fill=&quot;var(--biz)&quot; opacity=&quot;.8&quot;/&gt;&lt;text x=&quot;496.0&quot; y=&quot;21&quot; class=&quot;vl s&quot;&gt;97.6%&lt;tspan class=&quot;ax&quot;&gt; 年增 22.1%&lt;/tspan&gt;&lt;/text&gt;&lt;text x=&quot;204&quot; y=&quot;46&quot; class=&quot;lb s&quot; text-anchor=&quot;end&quot;&gt;Other revenue - Family of Apps&lt;title&gt;Other revenue - Family of Apps&lt;/title&gt;&lt;/text&gt;&lt;rect x=&quot;212&quot; y=&quot;35&quot; width=&quot;3.7&quot; height=&quot;15&quot; rx=&quot;2&quot; fill=&quot;var(--biz)&quot; opacity=&quot;.8&quot;/&gt quot; fill=&quot;var(--neg)&quot;&gt;&lt;title&gt;本期 28.2%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;235.5&quot; y=&quot;108.0&quot; class=&quot;vl s&quot;&gt;28.2%&lt;tspan class=&quot;ax&quot;&gt; +15.8 點&lt;/tspan&gt;&lt;/text&gt;&lt;text x=&quot;102&quot; y=&quot;142.0&quot; class=&quot;lb s&quot; text-anchor=&quot;end&quot;&gt;研發率&lt;/text&gt;&lt;line x1=&quot;231.2&quot; x2=&quot;237.3&quot; y1=&quot;137.0&quot; y2=&quot;137.0&quot; stroke=&quot;var(--neg)&quot; stroke-width=&quot;3&quot; opacity=&quot;.5&quot;/&gt;&lt;circle cx=&quot;231.2&quot; cy=&quot;137.0&quot; r=&quot;5&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;去年同期 29.5%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;237.3&quot; cy=&quot;137.0&quot; r=&quot;5.5&quot; fill=&quot;var(--neg)&quot;&gt;&lt;title&gt;本期 31.0%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;247.3&quot; y=&quot;142.0&quot; class=&quot;vl s&quot;&gt;31.0%&lt;tspan class=&quot;ax&quot;&gt; +1.5 點&lt;/tspan&gt;&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;lg&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--biz)&quot;&gt;&lt;/i&gt;本期&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--muted)&quot;&gt;&lt;/i&gt;去年同期&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--neg)&quot;&gt;&lt;/i&gt;變差超過 1 點&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;空心點是去年同期、實心點是本期，右側是變化（百分點）；費用率升或毛利率降超過 1 點標紅。分母是含全部收入的營收。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估底稿.json#/費用率（財報/10-Q_2026-09-30_損益表.json）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/section&gt;&lt;section id=&quot;s2&quot;&gt;&lt;h2&gt;2　商業模式驗證：說的 vs 做的&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;管理層在 10-K、10-Q、8-K 的說法，對照財報數字。判定：已驗證／部分支持／說法未獲數字支持／待查。&lt;/p&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;說的 vs 做的：判定分布&lt;/figcaption&gt;&lt;svg viewBox=&quot;0 0 640 58&quot; role=&quot;img&quot; aria-label=&quot;說的vs做的判定&quot;&gt;&lt;rect x=&quot;4.0&quot; y=&quot;6&quot; width=&quot;252.8&quot; height=&quot;26&quot; fill=&quot;var(--pos)&quot;&gt;&lt;title&gt;已驗證 2&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;130.4&quot; y=&quot;24&quot; class=&quot;inb&quot; text-anchor=&quot;middle&quot;&gt;已驗證 2&lt;/text&gt;&lt;rect x=&quot;256.8&quot; y=&quot;6&quot; width=&quot;252.8&quot; height=&quot;26&quot; fill=&quot;var(--warn)&quot;&gt;&lt;title&gt;部分支持 2&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;383.2&quot; y=&quot;24&quot; class=&quot;inb&quot; text-anchor=&quot;middle&quot;&gt;部分支持 2&lt;/text&gt;&lt;rect x=&quot;509.6&quot; y=&quot;6&quot; width=&quot;126.4&quot; height=&quot;26&quot; fill=&quot;var(--neg)&quot;&gt;&lt;title&gt;說法未獲數字支持 1&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;572.8&quot; y=&quot;24&quot; class=&quot;inb&quot; text-anchor=&quot;middle&quot;&gt;說法未獲數字支持 1&lt;/text&gt;&lt;text x=&quot;4&quot; y=&quot;52&quot; class=&quot;ax&quot;&gt;合計 5&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;lg&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--pos)&quot;&gt;&lt;/i&gt;已驗證 2&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--warn)&quot;&gt;&lt;/i&gt;部分支持 2&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--neg)&quot;&gt;&lt;/i&gt;說法未獲數字支持 1&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;管理層 5 條說法對照財報數字的結果；3 條不是「已驗證」，下方用色框標出（有問題的證據）。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估.json#/內容/說的vs做的/判定&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;div class=&quot;callout warnc&quot;&gt;&lt;b&gt;有問題的證據（判定不是「已驗證」）&lt;/b&gt;&lt;ul class=&quot;badl&quot;&gt;&lt;li&gt;&lt;a href=&quot;#cl2&quot;&gt;廣告單價上升來自 AI 廣告成效改善&lt;/a&gt; &lt;span class=&quot;v v-部分支持&quot;&gt;部分支持&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a href=&quot;#cl4&quot;&gt;排除法律費用後 2026 年營業利益高於 2025 年&lt;/a&gt; &lt;span class=&quot;v v-部分支持&quot;&gt;部分支持&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a href=&quot;#cl5&quot;&gt;資本支出區間&lt;/a&gt; &lt;span class=&quot;v v-說法未獲數字支持&quot;&gt;說法未獲數字支持&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;div class=&quot;cards&quot;&gt;&lt;div class=&quot;card claim cv-已驗證&quot; id=&quot;cl1&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;季度營收指引&lt;/b&gt;&lt;span class=&quot;v v-已驗證&quot;&gt;已驗證&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;管理層說法&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;2026 年 7 月公司給第三季營收指引 610–640 億美元。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src15&quot;&gt;[15]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對照數字&lt;/div&gt;&lt;ul class=&quot;ev&quot;&gt;&lt;li class=&quot;s&quot;&gt;第三季實際營收 646.0 億美元，高於指引上緣；第一季實際 563.11 億美元，落在 1 月指引 535–565 億美元之內、接近上緣。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src16&quot;&gt;[16]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src17&quot;&gt;[17]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;lbl&quot;&gt;說明&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;營收指引連續落在區間內或超過上緣，營收端的說法可信。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src15&quot;&gt;[15]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card claim cv-部分支持&quot; id=&quot;cl2&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;廣告單價上升來自 AI 廣告成效改善&lt;/b&gt;&lt;span class=&quot;v v-部分支持&quot;&gt;部分支持&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;管理層說法&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;公司說第三季每則廣告單價上升來自廣告需求增加，而需求增加主要歸因於廣告定向與衡量工具的持續改善（原文：we believe is mostly due to ongoing improvements to our ad performance）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src10&quot;&gt;[10]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對照數字&lt;/div&gt;&lt;ul class=&quot;ev&quot;&gt;&lt;li class=&quot;s&quot;&gt;第三季單價年增 14%、前一年同期為 10%；同時曝光年增 10%，且較多曝光落在 Reels 等變現率較低的產品與地區。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src10&quot;&gt;[10]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;li class=&quot;s&quot;&gt;公司沒有揭露 AI 工具帶來的單價增幅拆分；第三方報導（Exchange4Media）同樣引用公司說法。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src18&quot;&gt;[18]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;lbl&quot;&gt;說明&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;單價在曝光大增、低變現產品占比上升下仍加速成長，方向上支持說法；但「主要因為 AI」只有公司自述，沒有可拆分的數字。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src10&quot;&gt;[10]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card claim cv-已驗證&quot; id=&quot;cl3&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;實境實驗室虧損&lt;/b&gt;&lt;span class=&quot;v v-已驗證&quot;&gt;已驗證&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;管理層說法&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;2025 年 10-K 寫 2026 年實境實驗室營業虧損與 2025 年的 191.9 億美元相近；2026 年 10 月改為 180–190 億美元、較 2025 年下降。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src19&quot;&gt;[19]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src20&quot;&gt;[20]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對照數字&lt;/div&gt;&lt;ul class=&quot;ev&quot;&gt;&lt;li class=&quot;s&quot;&gt;2026 年前九個月實境實驗室營業虧損 127.75 億美元，2025 年同期 131.71 億美元，年減約 3%（推算）；員工薪酬由 78.95 億降到 69.82 億美元。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src6&quot;&gt;[6]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;lbl&quot;&gt;說明&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;虧損實際小幅下降，與說法一致；第四季要虧 52–62 億美元才落在全年區間（推算），屬正常季節範圍。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src6&quot;&gt;[6]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src20&quot;&gt;[20]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card claim cv-部分支持&quot; id=&quot;cl4&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;排除法律費用後 2026 年營業利益高於 2025 年&lt;/b&gt;&lt;span class=&quot;v v-部分支持&quot;&gt;部分支持&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;管理層說法&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;公司說排除第三季法律費用後，2026 年營業利益仍高於 2025 年。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src20&quot;&gt;[20]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對照數字&lt;/div&gt;&lt;ul class=&quot;ev&quot;&gt;&lt;li class=&quot;s&quot;&gt;公司口徑（只排除第三季法律費用 98.9 億美元）：前九個月營業利益 546.35 億美元加回後為 645.25 億美元；2025 全年 832.76 億美元，第四季營業利益要超過約 187.5 億美元才成立（推算）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src6&quot;&gt;[6]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src21&quot;&gt;[21]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src20&quot;&gt;[20]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;li class=&quot;s&quot;&gt;若再加回第二季 24.0 億美元法律費用，前九個月為 669.25 億美元，高於 2025 年同期 585.31 億美元，第四季門檻降為約 163.5 億美元（推算）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src22&quot;&gt;[22]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src17&quot;&gt;[17]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;lbl&quot;&gt;說明&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;近四季申報營業利益依序為 247.45、228.72、187.75、129.88 億美元（第三季加回法律費用後約 228.8 億），公司口徑門檻約 187.5 億與第二季申報值相當、低於 2025 年第四季與 2026 年第一季，所以傾向成立但不是穩過；要等 10-K 才能確認，而且這個說法本身把訴訟費用排除在外。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src17&quot;&gt;[17]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src20&quot;&gt;[20]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card claim cv-說法未獲數字支持&quot; id=&quot;cl5&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;資本支出區間&lt;/b&gt;&lt;span class=&quot;v v-說法未獲數字支持&quot;&gt;說法未獲數字支持&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;管理層說法&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;2026 年 1 月公司給 2026 年資本支出（含融資租賃本金）指引 1,150–1,350 億美元。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src23&quot;&gt;[23]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對照數字&lt;/div&gt;&lt;ul class=&quot;ev&quot;&gt;&lt;li class=&quot;s&quot;&gt;區間之後三次上調：4 月 1,250–1,450 億、7 月 1,300–1,450 億、10 月 1,350–1,450 億美元；10 月的下緣等於 1 月的上緣。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src24&quot;&gt;[24]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src25&quot;&gt;[25]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;li class=&quot;s&quot;&gt;前三季資本支出 198.4 億、310.8 億、349.1 億美元，合計 858.3 億美元（推算）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src26&quot;&gt;[26]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src27&quot;&gt;[27]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src28&quot;&gt;[28]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;lbl&quot;&gt;說明&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;年初的資本支出區間沒有守住，投入規模一路往上；費用端則大致守住：全年總費用指引由 1,620–1,690 億上修到 1,750–1,790 億，扣掉兩筆約 123 億法律費用後約 1,627–1,667 億美元，仍在原區間內（推算）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src29&quot;&gt;[29]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src20&quot;&gt;[20]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src30&quot;&gt;[30]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;s3&quot;&gt;&lt;h2&gt;3　成長引擎與卡點&lt;/h2&gt;&lt;h3&gt;成長從哪裡來（量、價、新產品、新市場、併購）&lt;/h3&gt;&lt;div class=&quot;cards&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;span class=&quot;chip&quot;&gt;價&lt;/span&gt;&lt;span class=&quot;qz&quot;&gt;能否量化：可量化&lt;/span&gt;&lt;/div&gt;&lt;b&gt;每則廣告單價上升（廣告成效工具改善、需求增加）&lt;/b&gt;&lt;div class=&quot;lbl&quot;&gt;證據&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;第三季單價年增 14%、前九個月年增 13%，前一年兩期都是 10%；電商類廣告主是廣告營收增加的最大來源。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src10&quot;&gt;[10]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;span class=&quot;chip&quot;&gt;量&lt;/span&gt;&lt;span class=&quot;qz&quot;&gt;能否量化：可量化&lt;/span&gt;&lt;/div&gt;&lt;b&gt;廣告曝光增加（使用者、使用時數與廣告頻率）&lt;/b&gt;&lt;div class=&quot;lbl&quot;&gt;證據&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;第三季曝光年增 10%、前九個月年增 14%，各地區都成長，亞太最快；9 月家族應用每日活躍人數 36.4 億、年增 3%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src10&quot;&gt;[10]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;使用人數只增 3%，曝光的成長主要靠每人使用與廣告頻率，量的引擎正在變慢（第三季 10% 低於前一年同期 14%）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src10&quot;&gt;[10]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;span class=&quot;chip&quot;&gt;新產品&lt;/span&gt;&lt;span class=&quot;qz&quot;&gt;能否量化：可量化&lt;/span&gt;&lt;/div&gt;&lt;b&gt;WhatsApp 企業付費訊息、訂閱與 AI 眼鏡&lt;/b&gt;&lt;div class=&quot;lbl&quot;&gt;證據&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;應用家族其他營收第三季年增 59%，前九個月增加 12.0 億美元；實境實驗室前九個月營收年增 2%，AI 眼鏡增加、Quest 減少。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src11&quot;&gt;[11]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src31&quot;&gt;[31]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;新產品增速高，但 2025 年其他營收只占總營收 1.3%，對整體成長的貢獻仍小。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src32&quot;&gt;[32]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;近 12 季：營收年增與營業利益率&lt;/figcaption&gt;&lt;svg viewBox=&quot;0 0 680 250&quot; role=&quot;img&quot; aria-label=&quot;近幾季單季營收年增與營業利益率&quot;&gt;&lt;line x1=&quot;50&quot; x2=&quot;640&quot; y1=&quot;216.0&quot; y2=&quot;216.0&quot; class=&quot;zl&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;220.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;0%&lt;/text&gt;&lt;line x1=&quot;50&quot; x2=&quot;640&quot; y1=&quot;150.7&quot; y2=&quot;150.7&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;154.7&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;20%&lt;/text&gt;&lt;line x1=&quot;50&quot; x2=&quot;640&quot; y1=&quot;85.3&quot; y2=&quot;85.3&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;89.3&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;40%&lt;/text&gt;&lt;line x1=&quot;50&quot; x2=&quot;640&quot; y1=&quot;20.0&quot; y2=&quot;20.0&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;24.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;60%&lt;/text&gt;&lt;text x=&quot;113.6&quot; y=&quot;238&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;2024-03&lt;/text&gt;&lt;text x=&quot;212.9&quot; y=&quot;238&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;2024-09&lt;/text&gt;&lt;text x=&quot;312.2&quot; y=&quot;238&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;2025-03&lt;/text&gt;&lt;text x=&quot;411.5&quot; y=&quot;238&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;2025-09&lt;/text&gt;&lt;text x=&quot;510.7&quot; y=&quot;238&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;2026-03&lt;/text&gt;&lt;text x=&quot;610.0&quot; y=&quot;238&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;2026-09&lt;/text&gt;&lt;polyline points=&quot;64.0,135.3 113.6,127.0 163.3,143.8 212.9,154.4 262.5,148.6 312.2,163.5 361.8,145.4 411.5,130.2 461.1,138.3 510.7,107.9 560.4,124.7 610.0,130.8&quot; fill=&quot;none&quot; stroke=&quot;var(--biz)&quot; stroke-width=&quot;2.4&quot;/&gt;&lt;circle cx=&quot;64.0&quot; cy=&quot;135.3&quot; r=&quot;3.4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--biz)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;單季營收年增 2023-12-31：24.7%&lt; &quot; stroke-width=&quot;2&quot; stroke-dasharray=&quot;4 3&quot;/&gt;&lt;text x=&quot;180&quot; y=&quot;56.0&quot; class=&quot;lb s&quot; text-anchor=&quot;end&quot;&gt;G2 營業利益率走弱&lt;/text&gt;&lt;line x1=&quot;415.0&quot; x2=&quot;259.4&quot; y1=&quot;51.0&quot; y2=&quot;51.0&quot; stroke=&quot;var(--neg)&quot; stroke-width=&quot;3&quot;/&gt;&lt;circle cx=&quot;259.4&quot; cy=&quot;51.0&quot; r=&quot;6&quot; fill=&quot;var(--neg)&quot;&gt;&lt;title&gt;G2 營業利益率走弱：-10.4 點，門檻 &lt; -1.0 點&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;268.4&quot; y=&quot;42.0&quot; class=&quot;vl s&quot; text-anchor=&quot;start&quot; fill=&quot;var(--neg)&quot;&gt;-10.4 點&lt;/text&gt;&lt;rect x=&quot;565.0&quot; y=&quot;81.0&quot; width=&quot;75.0&quot; height=&quot;24&quot; fill=&quot;var(--neg)&quot; opacity=&quot;.10&quot;/&gt;&lt;line x1=&quot;565.0&quot; x2=&quot;565.0&quot; y1=&quot;79.0&quot; y2=&quot;107.0&quot; stroke=&quot;var(--neg)&quot; stroke-width=&quot;2&quot; stroke-dasharray=&quot;4 3&quot;/&gt;&lt;text x=&quot;180&quot; y=&quot;98.0&quot; class=&quot;lb s&quot; text-anchor=&quot;end&quot;&gt;G3 收款變慢&lt;/text&gt;&lt;line x1=&quot;415.0&quot; x2=&quot;472.0&quot; y1=&quot;93.0&quot; y2=&quot;93.0&quot; stroke=&quot;var(--pos)&quot; stroke-width=&quot;3&quot;/&gt;&lt;circle cx=&quot;472.0&quot; cy=&quot;93.0&quot; r=&quot;6&quot; fill=&quot;var(--pos)&quot;&gt;&lt;title&gt;G3 收款變慢：+3.8 點，門檻 &gt; +10.0 點&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;481.0&quot; y=&quot;84.0&quot; class=&quot;vl s&quot; text-anchor=&quot;start&quot; fill=&quot;var(--pos)&quot;&gt;+3.8 點&lt;/text&gt;&lt;rect x=&quot;430.0&quot; y=&quot;123.0&quot; width=&quot;210.0&quot; height=&quot;24&quot; fill=&quot;var(--neg)&quot; opacity=&quot;.10&quot;/&gt;&lt;line x1=&quot;430.0&quot; x2=&quot;430.0&quot; y1=&quot;121.0&quot; y2=&quot;149.0&quot; stroke=&quot;var(--neg)&quot; stroke-width=&quot;2&quot; stroke-dasharray=&quot;4 3&quot;/&gt;&lt;text x=&quot;180&quot; y=&quot;140.0&quot; class=&quot;lb s&quot; text-anchor=&quot;end&quot;&gt;G4 投入換不到成長&lt;/text&gt;&lt;line x1=&quot;415.0&quot; x2=&quot;566.6&quot; y1=&quot;135.0&quot; y2=&quot;135.0&quot; stroke=&quot;var(--pos)&quot; stroke-width=&quot;3&quot;/&gt;&lt;circle cx=&quot;566.6&quot; cy=&quot;135.0&quot; r=&quot;6&quot; fill=&quot;var(--pos)&quot;&gt;&lt;title&gt;G4 投入換不到成長：+10.1 點，門檻 &gt; +1.0 點&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;557.6&quot; y=&quot;126.0&quot; class=&quot;vl s&quot; text-anchor=&quot;end&quot; fill=&quot;var(--pos)&quot;&gt;+10.1 點&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;lg&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--neg)&quot;&gt;&lt;/i&gt;亮燈&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--pos)&quot;&gt;&lt;/i&gt;未亮&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--neg)&quot;&gt;&lt;/i&gt;亮燈門檻（虛線）&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;G4 另有條件「營收近四季年增低於一年前」：本期 27.5%、比較期 21.3%，兩個條件都成立才亮燈（目前未亮）。&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;每列一個用財報數字算的訊號：點是目前值，虛線是門檻，點落進淡紅色帶就亮燈；看離門檻還有多少餘裕。是非題型訊號（如連續放緩）不在此圖，見上方燈號。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估.json#/內容/卡住訊號（值、門檻、比較）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;div class=&quot;sub-h&quot;&gt;機械訊號（財報數字算得出）&lt;/div&gt;&lt;div class=&quot;cards&quot;&gt;&lt;div class=&quot;card sig&quot; id=&quot;sig-G1&quot; style=&quot;--tc:var(--lt-亮燈, var(--muted))&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;G1　營收增速連續放緩&lt;/b&gt;&lt;span class=&quot;light l-亮燈&quot;&gt;亮燈&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;成長是不是一季比一季慢？&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;值&lt;/div&gt;&lt;div class=&quot;sv&quot;&gt;是&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;機械值，期末 2026-09-30；門檻  &lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;判讀&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;單季營收年增由第一季 33.1% 降到第二季 28.0%、第三季 26.1%；第一季報告幣年增 33%、定幣 29%，約 4 個百分點來自匯率（推算），第三季為定幣與報告幣同為 26%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src33&quot;&gt;[33]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src34&quot;&gt;[34]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;第四季指引 730–760 億美元，對 2025 年第四季 598.93 億美元年增約 21.9%–26.9%（推算），中點約 24.4%，放緩延續；匯率只解釋第一季的一部分，屬真實放緩，計分採用。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src35&quot;&gt;[35]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src17&quot;&gt;[17]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card sig&quot; id=&quot;sig-G2&quot; style=&quot;--tc:var(--lt-亮燈, var(--muted))&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;G2　營業利益率走弱&lt;/b&gt;&lt;span class=&quot;light l-亮燈&quot;&gt;亮燈&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;規模變大，利潤率有沒有跟著變好？&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;值&lt;/div&gt;&lt;div class=&quot;sv&quot;&gt;-10.4 個百分點&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;機械值，期末 2026-09-30；門檻 &amp;lt; -1.0 個百分點&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;判讀&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;近四季營業利益率 32.9%，比一年前的 43.2% 低 10.4 個百分點；其中第二季 24.0 億、第三季 98.9 億美元法律費用合計約 123 億美元。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src36&quot;&gt;[36]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src22&quot;&gt;[22]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src21&quot;&gt;[21]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;加回兩筆法律費用後近四季營業利益率約 37.9%，仍比一年前低約 5.3 個百分點（推算）；營業成本與研發增加主要來自資料中心、技術基礎設施、第三方雲端與 AI token 費用，屬持續性成本，所以不以一次性費用為由排除，計分採用。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src17&quot;&gt;[17]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src3&quot;&gt;[3]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src37&quot;&gt;[37]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card sig&quot; id=&quot;sig-G3&quot; style=&quot;--tc:var(--lt-未亮, var(--muted))&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;G3　收款變慢&lt;/b&gt;&lt;span class=&quot;light l-未亮&quot;&gt;未亮&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;營收成長是不是靠放寬收款條件？&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;值&lt;/div&gt;&lt;div class=&quot;sv&quot;&gt;+3.8 個百分點&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;機械值，期末 2026-09-30；門檻 &amp;gt; +10.0 個百分點&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;判讀&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;應收增速只比營收增速高 3.8 個百分點，低於 10 個百分點門檻；客戶分散、無單一客戶超過 10%，看不到靠放寬收款條件衝營收。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src38&quot;&gt;[38]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src8&quot;&gt;[8]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card sig&quot; id=&quot;sig-G4&quot; style=&quot;--tc:var(--lt-未亮, var(--muted))&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;G4　投入換不到成長&lt;/b&gt;&lt;span class=&quot;light l-未亮&quot;&gt;未亮&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;資本支出加大，營收增速有沒有跟上？&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;值&lt;/div&gt;&lt;div class=&quot;sv&quot;&gt;+10.1 個百分點&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;機械值，期末 2026-09-30；門檻 &amp;gt; +1.0 個百分點；且 營收近四季年增低於一年前&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;判讀&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;近四季資本支出占營收 43.2%，一年內增加 10.1 個百分點，但營收近四季年增由 21.3% 升到 27.5%，第二個條件不成立所以未亮；若之後營收增速回落而資本支出強度續升，這條會亮。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src39&quot;&gt;[39]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src40&quot;&gt;[40]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src41&quot;&gt;[41]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;h3 id=&quot;ext&quot;&gt;外部驗證：競爭者、客戶、供應商怎麼描述這家公司&lt;/h3&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;外部驗證：誰支持、誰反駁&lt;/figcaption&gt;&lt;div class=&quot;emx&quot; style=&quot;grid-template-columns:repeat(3,1fr)&quot;&gt;&lt;div class=&quot;emc&quot; style=&quot;--tc:var(--pos)&quot;&gt;&lt;div class=&quot;emh&quot;&gt;支持 &lt;b&gt;3&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;emi&quot;&gt;&lt;b&gt;Criteo&lt;/b&gt;&lt;span&gt;競爭者&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;emi&quot;&gt;&lt;b&gt;Digital Brands Group&lt;/b&gt;&lt;span&gt;客戶&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;emi&quot;&gt;&lt;b&gt;ThredUp&lt;/b&gt;&lt;span&gt;客戶&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;emc&quot; style=&quot;--tc:var(--warn)&quot;&gt;&lt;div class=&quot;emh&quot;&gt;部分支持 &lt;b&gt;1&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;emi&quot;&gt;&lt;b&gt;CoreWeave&lt;/b&gt;&lt;span&gt;供應商&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;emc&quot; style=&quot;--tc:var(--neg)&quot;&gt;&lt;div class=&quot;emh&quot;&gt;反駁 &lt;b&gt;1&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;emi&quot;&gt;&lt;b&gt;S&amp;amp;P Global Ratings（經 CNBC 報導）&lt;/b&gt;&lt;span&gt;其他&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;5 個外部來源（競爭者、客戶、供應商、夥伴的申報或報導）怎麼描述本公司：支持 3、部分支持 1、反駁 1。依「對本公司說法」欄的開頭分類。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估.json#/內容/外部驗證（對方、關係、支持）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;div class=&quot;cards&quot;&gt;&lt;div class=&quot;card ext&quot; style=&quot;--tc:var(--pos)&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;Criteo&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;競爭者&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;對方文件怎麼說&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;Criteo 10-K 把 Amazon、Meta、Google、Microsoft 列為大型、地位穩固的競爭者（原文：large, well-established companies）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src42&quot;&gt;[42]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對本公司說法&lt;/div&gt;&lt;div class=&quot;stc&quot;&gt;支持&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card ext&quot; style=&quot;--tc:var(--pos)&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;Digital Brands Group&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;客戶&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;對方文件怎麼說&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;Digital Brands Group 10-K 寫付費社群行銷是主要的獲客管道，而且幾乎全部是 Facebook 與 Instagram 的付費行銷。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src43&quot;&gt;[43]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對本公司說法&lt;/div&gt;&lt;div class=&quot;stc&quot;&gt;支持&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card ext&quot; style=&quot;--tc:var(--pos)&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;ThredUp&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;客戶&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;對方文件怎麼說&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;ThredUp 10-K 寫依賴 Google 搜尋、應用商店與 Facebook、Instagram 等社群平台作為重要行銷管道。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src44&quot;&gt;[44]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對本公司說法&lt;/div&gt;&lt;div class=&quot;stc&quot;&gt;支持&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card ext&quot; style=&quot;--tc:var(--warn)&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;CoreWeave&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;供應商&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;對方文件怎麼說&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;CoreWeave 10-K 寫 Meta 承諾在 2031 年 12 月前支付最多約 142 億美元算力費用，並把 Meta 列為未來期間的重要客戶。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src45&quot;&gt;[45]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對本公司說法&lt;/div&gt;&lt;div class=&quot;stc&quot;&gt;部分支持&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card ext&quot; style=&quot;--tc:var(--neg)&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;S&amp;amp;P Global Ratings（經 CNBC 報導）&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;其他&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;對方文件怎麼說&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;S&amp;amp;P 將 Meta 信用評等展望由 AA- 穩定調為 AA- 負向，理由是資本支出偏高與自由現金流為負，並質疑 Meta 相對同業把 AI 投資變現的能力。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src46&quot;&gt;[46]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src47&quot;&gt;[47]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對本公司說法&lt;/div&gt;&lt;div class=&quot;stc&quot;&gt;反駁&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;sa&quot;&gt;&lt;h2&gt;4　優勢來源與持續期間&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;每種優勢都要同時有「好處」與「屏障」證據（Helmer《7 Powers》的檢驗）：只有好處、沒有屏障的優勢只算&lt;b&gt;暫時領先&lt;/b&gt;。再分兩維：超額報酬有多大、能撐多久（Mauboussin《Measuring the Moat》的問法）；Morningstar 五種來源只當分類參考。本節只談商業面的屏障，不含價格或估值，也不是估值報告的護城河評分，不進商業評估等級。&lt;/p&gt;&lt;div class=&quot;callout&quot;&gt;&lt;b&gt;總結&lt;/b&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;主要優勢是親友社交網路帶來的廣告觸及與資料規模，屏障有 FTC 主張與親友連結的事實依據，但法院認定短影音平台構成競爭；AI 基礎設施規模只對中小對手有效，回報尚待證明。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src48&quot;&gt;[48]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src49&quot;&gt;[49]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src50&quot;&gt;[50]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src35&quot;&gt;[35]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;優勢地圖：多大、多久&lt;/figcaption&gt;&lt;div class=&quot;amx&quot;&gt;&lt;div class=&quot;amy&quot;&gt;持續期間 →&lt;/div&gt;&lt;div class=&quot;amg&quot;&gt;&lt;div class=&quot;amr&quot; style=&quot;grid-template-columns:80px repeat(4,1fr)&quot;&gt;&lt;div class=&quot;aml&quot;&gt;10年以上&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amc unk&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;amr&quot; style=&quot;grid-template-columns:80px repeat(4,1fr)&quot;&gt;&lt;div class=&quot;aml&quot;&gt;5–10年&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;span class=&quot;ab ab-有屏障證據&quot; title=&quot;社交網路觸及與廣告資料規模：有屏障證據&quot;&gt;1&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;amc unk&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;amr&quot; style=&quot;grid-template-columns:80px repeat(4,1fr)&quot;&gt;&lt;div class=&quot;aml&quot;&gt;不足5年&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amc unk&quot;&gt;&lt;span class=&quot;ab ab-有屏障證據&quot; title=&quot;自建 AI 與資料中心的規模：有屏障證據&quot;&gt;2&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;amr&quot; style=&quot;grid-template-columns:80px repeat(4,1fr)&quot;&gt;&lt;div class=&quot;aml&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amx-l&quot;&gt;小&lt;/div&gt;&lt;div class=&quot;amx-l&quot;&gt;中&lt;/div&gt;&lt;div class=&quot;amx-l&quot;&gt;大&lt;/div&gt;&lt;div class=&quot;amx-l&quot;&gt;不明&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;amxt&quot;&gt;超額報酬大小 →&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;ol class=&quot;akey&quot;&gt;&lt;li&gt;&lt;span class=&quot;ab ab-有屏障證據&quot;&gt;1&lt;/span&gt;社交網路觸及與廣告資料規模（網路經濟；有屏障證據）&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;ab ab-有屏障證據&quot;&gt;2&lt;/span&gt;自建 AI 與資料中心的規模（規模經濟；有屏障證據）&lt;/li&gt;&lt;/ol&gt;&lt;div class=&quot;lg&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--pos)&quot;&gt;&lt;/i&gt;有屏障證據&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--warn)&quot;&gt;&lt;/i&gt;暫時領先&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;每個圓圈是一項優勢：越往右超額報酬越大、越往上能撐越久。綠＝屏障有事實證據；橘＝只有好處或屏障只有推論（暫時領先，持續期間最多不足 5 年）。作者寫「不明」的維度放在虛線格，不補值。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估.json#/內容/優勢來源/優勢（超額報酬大小、持續期間、判定）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;每項優勢有多少證據&lt;/figcaption&gt;&lt;svg viewBox=&quot;0 0 680 128&quot; role=&quot;img&quot; aria-label=&quot;優勢的證據數：好處與屏障&quot;&gt;&lt;text x=&quot;254&quot; y=&quot;124&quot; class=&quot;ax&quot;&gt;好處句數&lt;/text&gt;&lt;text x=&quot;459.0&quot; y=&quot;124&quot; class=&quot;ax&quot;&gt;屏障句數（事實／推論）&lt;/text&gt;&lt;text x=&quot;242&quot; y=&quot;32&quot; class=&quot;lb s&quot; text-anchor=&quot;end&quot;&gt;1 社交網路觸及與廣告資料規模&lt;title&gt;1 社交網路觸及與廣告資料規模&lt;/title&gt;&lt;/text&gt;&lt;rect x=&quot;250&quot; y=&quot;20&quot; width=&quot;82.5&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;337.5&quot; y=&quot;33&quot; class=&quot;vl s&quot;&gt;2&lt;/text&gt;&lt;rect x=&quot;455.0&quot; y=&quot;20&quot; width=&quot;123.8&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;var(--pos)&quot;/&gt;&lt;rect x=&quot;578.8&quot; y=&quot;20&quot; width=&quot;41.2&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;var(--accent)&quot; opacity=&quot;.7&quot;/&gt;&lt;text x=&quot;625.0&quot; y=&quot;33&quot; class=&quot;vl s&quot;&gt;3／1&lt;/text&gt;&lt;text x=&quot;242&quot; y=&quot;78&quot; class=&quot;lb s&quot; text-anchor=&quot;end&quot;&gt;2 自建 AI 與資料中心的規模&lt;title&gt;2 自建 AI 與資料中心的規模&lt;/title&gt;&lt;/text&gt;&lt;rect x=&quot;250&quot; y=&quot;66&quot; width=&quot;41.2&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;296.2&quot; y=&quot;79&quot; class=&quot;vl s&quot;&gt;1&lt;/text&gt;&lt;rect x=&quot;455.0&quot; y=&quot;66&quot; width=&quot;82.5&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;var(--pos)&quot;/&gt;&lt;rect x=&quot;537.5&quot; y=&quot;66&quot; width=&quot;82.5&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;var(--accent)&quot; opacity=&quot;.7&quot;/&gt;&lt;text x=&quot;625.0&quot; y=&quot;79&quot; class=&quot;vl s&quot;&gt;2／2&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;lg&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c3)&quot;&gt;&lt;/i&gt;好處&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--pos)&quot;&gt;&lt;/i&gt;屏障：事實&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--accent)&quot;&gt;&lt;/i&gt;屏障：推論&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;左邊是「它帶來什麼」的句數，右邊是「為什麼對手拿不走」的句數；屏障至少一句是事實（綠）才算有屏障證據。句數多不等於優勢強，只表示證據量。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估.json#/內容/優勢來源/優勢（好處、屏障的標記）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;div class=&quot;card advc&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;&lt;span class=&quot;num-b 有屏障證據&quot;&gt;1&lt;/span&gt;社交網路觸及與廣告資料規模&lt;/b&gt;&lt;span class=&quot;vd vd-有屏障證據&quot;&gt;有屏障證據&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;網路經濟（Network Economies）｜晨星：網路效應&lt;/div&gt;&lt;div class=&quot;two&quot;&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;好處（它帶來什麼）&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;36.4 億每日活躍人數讓廣告主一次觸及大量受眾；第三季曝光與單價同時上升，廣告營收年增 26%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src10&quot;&gt;[10]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;Digital Brands Group 申報寫其獲客幾乎全押在 Facebook 與 Instagram，顯示至少部分小型廣告主對這兩個平台的依賴。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src43&quot;&gt;[43]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;屏障（為什麼對手拿不走）&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;FTC 上訴狀主張 Meta 在「個人社交網路」市場有壟斷力，理由是消費者需要在同一處連結親友，而這是 Meta 的應用提供、TikTok 與 YouTube 不提供的。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src51&quot;&gt;[51]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src48&quot;&gt;[48]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;但一審法院已認定 Meta 目前與 YouTube、TikTok 競爭而非壟斷；Meta 10-K 也寫部分使用者（尤其年輕使用者）已減少使用、轉向替代產品。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src49&quot;&gt;[49]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src52&quot;&gt;[52]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;同業近四季營業利益率：Meta 32.9%、Alphabet 33.3%、Reddit 29.4%、Pinterest 5.6%、Snap −1.8%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src50&quot;&gt;[50]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;屏障在親友關係網路這一層：對手要先把數十億人的社交關係搬過去，廣告主才會跟著轉移；但在內容與使用時間這一層，短影音平台已證明能分走使用者，而 Reddit、Alphabet 的利益率與 Meta 相近，代表屏障擋住的是同類社交廣告的小平台，不是所有爭奪廣告預算的對手。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src48&quot;&gt;[48]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src52&quot;&gt;[52]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src50&quot;&gt;[50]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;two&quot;&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;超額報酬大小&lt;/div&gt;&lt;span class=&quot;lv&quot;&gt;大&lt;/span&gt;&lt;div class=&quot;s&quot;&gt;近四季營業利益率 32.9%、近 20 季介於 23.6%–44.0%；應用家族分部前九個月營業利益率約 37.4%（推算）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src53&quot;&gt;[53]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src6&quot;&gt;[6]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;持續期間&lt;/div&gt;&lt;span class=&quot;lv&quot;&gt;5–10年&lt;/span&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;屏障有親友網路的事實依據（FTC 主張親友連結是 Meta 的應用提供、TikTok 與 YouTube 不提供的），且 2022 年營收下降後兩年內利益率回到 40% 以上，顯示屏障在一次景氣與平台規則衝擊後仍在；但法院認定短影音平台構成競爭、年輕使用者轉移已見於 10-K，加上青少年監管與 FTC 上訴，所以給 5–10 年、不給 10 年以上。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src49&quot;&gt;[49]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src48&quot;&gt;[48]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src52&quot;&gt;[52]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src54&quot;&gt;[54]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src55&quot;&gt;[55]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card advc&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;&lt;span class=&quot;num-b 有屏障證據&quot;&gt;2&lt;/span&gt;自建 AI 與資料中心的規模&lt;/b&gt;&lt;span class=&quot;vd vd-有屏障證據&quot;&gt;有屏障證據&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;規模經濟（Scale Economies）｜晨星：成本優勢&lt;/div&gt;&lt;div class=&quot;two&quot;&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;好處（它帶來什麼）&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;公司把單價上升歸因於廣告定向與衡量工具的改善，背後是自建的運算基礎設施。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src10&quot;&gt;[10]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;屏障（為什麼對手拿不走）&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;Meta 自有 30 個資料中心據點，2026 年資本支出指引 1,350–1,450 億美元；同業 Pinterest、Snap 近四季營業利益率 5.6% 與 −1.8%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src56&quot;&gt;[56]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src25&quot;&gt;[25]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src50&quot;&gt;[50]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;以這兩家的利益率，難以支撐同等規模的運算投入，所以規模對中小社群同業構成門檻。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src50&quot;&gt;[50]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src25&quot;&gt;[25]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;ProCap Financial 申報寫 Microsoft、Google、Amazon、Apple 與 Meta 等大型科技公司都已投入數十億美元在 AI 研究與基礎設施。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src57&quot;&gt;[57]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;所以這項規模對最大型科技對手不構成屏障。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src57&quot;&gt;[57]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;two&quot;&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;超額報酬大小&lt;/div&gt;&lt;span class=&quot;lv&quot;&gt;不明&lt;/span&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-待查&quot;&gt;待查&lt;/span&gt;待查：AI 投入對廣告單價的貢獻沒有拆分揭露；第三季自由現金流為負 21.2 億美元，投入的回報要等之後幾季的利益率與現金流才看得出。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src35&quot;&gt;[35]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;持續期間&lt;/div&gt;&lt;span class=&quot;lv&quot;&gt;不足5年&lt;/span&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;對小型同業有效、對 Google 與 Microsoft 無效，而運算設備更新快，規模領先需要每年持續大額投入才維持得住。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src57&quot;&gt;[57]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src25&quot;&gt;[25]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;CoreWeave 的申報顯示 Meta 也向外承諾長期算力採購，代表規模優勢有一部分不是自有、屬長期成本承諾。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src45&quot;&gt;[45]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;超額報酬的機械參考：利潤率位置&lt;/figcaption&gt;&lt;svg viewBox=&quot;0 0 680 92&quot; role=&quot;img&quot; aria-label=&quot;近四季營業利益率在近20季範圍的位置&quot;&gt;&lt;line x1=&quot;30.0&quot; x2=&quot;30.0&quot; y1=&quot;18&quot; y2=&quot;64&quot; class=&quot;zl&quot;/&gt;&lt;text x=&quot;30.0&quot; y=&quot;84&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;0%&lt;/text&gt;&lt;line x1=&quot;154.0&quot; x2=&quot;154.0&quot; y1=&quot;18&quot; y2=&quot;64&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;154.0&quot; y=&quot;84&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;10%&lt;/text&gt;&lt;line x1=&quot;278.0&quot; x2=&quot;278.0&quot; y1=&quot;18&quot; y2=&quot;64&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;278.0&quot; y=&quot;84&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;20%&lt;/text&gt;&lt;line x1=&quot;402.0&quot; x2=&quot;402.0&quot; y1=&quot;18&quot; y2=&quot;64&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;402.0&quot; y=&quot;84&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;30%&lt;/text&gt;&lt;line x1=&quot;526.0&quot; x2=&quot;526.0&quot; y1=&quot;18&quot; y2=&quot;64&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;526.0&quot; y=&quot;84&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;40%&lt;/text&gt;&lt;line x1=&quot;650.0&quot; x2=&quot;650.0&quot; y1=&quot;18&quot; y2=&quot;64&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;650.0&quot; y=&quot;84&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;50%&lt;/text&gt;&lt;rect x=&quot;322.1&quot; y=&quot;30&quot; width=&quot;253.7&quot; height=&quot;22&quot; rx=&quot;4&quot; fill=&quot;var(--biz)&quot; opacity=&quot;.22&quot;/&gt;&lt;text x=&quot;322.1&quot; y=&quot;24&quot; class=&quot;ax&quot;&gt;近 20 季範圍 23.6%～44.0%&lt;/text&gt;&lt;circle cx=&quot;437.5&quot; cy=&quot;41&quot; r=&quot;7&quot; fill=&quot;var(--biz)&quot;/&gt;&lt;text x=&quot;437.5&quot; y=&quot;76&quot; class=&quot;vl s&quot; text-anchor=&quot;middle&quot;&gt;近四季 32.9%&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;藍帶是近 20 季的近四季營業利益率範圍，圓點是最新值；同業營業利益率百分位 0.6（1＝同業最高）。只供對照「超額報酬大小」，不是分數、不進等級，也不是估值報告的護城河評分。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估底稿.json#/優勢參考&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;p class=&quot;lead&quot;&gt;機械參考（供對照超額報酬，不是分數）：近四季營業利益率 32.9%，近 20 季範圍 23.6%～44.0%，同業營業利益率百分位 0.6。&lt;/p&gt;&lt;div class=&quot;note&quot;&gt;判定規則：屏障欄至少一句標「事實」並附出處才算「有屏障證據」；否則只算「暫時領先」，持續期間最多寫「不足5年」。&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;s4&quot;&gt;&lt;h2&gt;5　生命週期與未來變化&lt;/h2&gt;&lt;div class=&quot;stages&quot;&gt;&lt;div class=&quot;&quot;&gt;起步&lt;/div&gt;&lt;div class=&quot;on&quot;&gt;成長&lt;/div&gt;&lt;div class=&quot;&quot;&gt;成熟&lt;/div&gt;&lt;div class=&quot;&quot;&gt;衰退&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;lead&quot;&gt;估值報告的林區分類（引用，不重判）：快速成長股&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;營收近四季年增 27.5%，一年前為 21.3%；2022 年是近年唯一營收下降的年度。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src40&quot;&gt;[40]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src41&quot;&gt;[41]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src58&quot;&gt;[58]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;家族應用每日活躍人數 36.4 億、年增只有 3%，使用者端已接近飽和。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;林區分類為「快速成長股」，與本頁「成長」一致；但使用者近飽和、成長改靠單價與頻率，已帶有成熟期特徵。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src59&quot;&gt;[59]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;callout&quot;&gt;&lt;b&gt;最可能的轉變：成長 → 成熟（單價與曝光增速同步回落）&lt;/b&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;條件：營收近四季年增降到 15% 以下，且廣告曝光年增降到個位數；目前分別為 27.5% 與 10%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src40&quot;&gt;[40]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src10&quot;&gt;[10]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lead&quot;&gt;怎麼檢驗&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;每季看 10-Q 管理層討論的曝光與單價增速，以及底稿營收近四季年增；連續兩季同時符合條件才認定轉變。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src10&quot;&gt;[10]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src40&quot;&gt;[40]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;s5&quot;&gt;&lt;h2&gt;6　週期推論&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;三種證據都寫成「區間＋條件」，不給單一日期。&lt;/p&gt;&lt;div class=&quot;callout&quot;&gt;&lt;b&gt;綜合：未來 1–5 季（2026 年第四季至 2027 年第四季）營收近四季年增由約 27% 的候選高點回落到 20% 上下；營業利益率近四季下行段延續到 2027 年下半年&lt;/b&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;條件一：第四季營收落在指引 730–760 億美元，單季年增低於第三季的 26%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src35&quot;&gt;[35]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;條件二：2027 年第一季要對比 2026 年第一季 33.1% 的高基期（含匯率順風），近四季年增幾乎一定下降。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src33&quot;&gt;[33]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src29&quot;&gt;[29]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;條件三：資本支出維持在年 1,350 億美元以上，折舊持續墊高營業成本。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src25&quot;&gt;[25]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src3&quot;&gt;[3]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;營收週期的回落是高基期與量的放緩，不是需求轉弱；若廣告景氣同時轉差，歷史下行段中位 6 季可作參考。利益率的週期由公司自己的投資節奏決定，訴訟費用在 2027 年第三季後移出近四季計算。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src60&quot;&gt;[60]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src21&quot;&gt;[21]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;h3&gt;① 自身歷史循環&lt;/h3&gt;&lt;div class=&quot;chart&quot;&gt;&lt;svg viewBox=&quot;0 0 720 240&quot; role=&quot;img&quot; aria-label=&quot;近四季營收年增（2013-03-31～2026-09-30（55 季））&quot;&gt;&lt;line x1=&quot;46&quot; x2=&quot;704&quot; y1=&quot;210.0&quot; y2=&quot;210.0&quot; stroke=&quot;var(--line)&quot; stroke-width=&quot;1&quot;/&gt;&lt;text x=&quot;40&quot; y=&quot;214.0&quot; font-size=&quot;11&quot; text-anchor=&quot;end&quot; fill=&quot;var(--muted)&quot;&gt;-2%&lt;/text&gt;&lt;line x1=&quot;46&quot; x2=&quot;704&quot; y1=&quot;204.6&quot; y2=&quot;204.6&quot; stroke=&quot;var(--line)&quot; stroke-width=&quot;1.4&quot;/&gt;&lt;text x=&quot;40&quot; y=&quot;208.6&quot; font-size=&quot;11&quot; text-anchor=&quot;end&quot; fill ;&gt;5 季 下行&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;lg&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--neg)&quot;&gt;&lt;/i&gt;下行段&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--pos)&quot;&gt;&lt;/i&gt;上行段&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--ink)&quot;&gt;&lt;/i&gt;目前這一段（虛框，尚未結束）&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;每條是兩個轉折之間的一段有多長；虛線是歷史中位（下行 7 季、上行 7.5 季）。拿目前這段的長度對照中位，看走到哪；淡色段的起點是資料起點，不計入統計。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估底稿.json#/週期/營業利益率_近四季（之字形門檻 2%）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;p class=&quot;lead&quot;&gt;近四季營業利益率轉折：峰 2012-03（43.3%）、谷 2013-03（9.7%）、峰 2014-09（44.6%）、谷 2015-09（30.1%）、峰 2018-03（50.1%）、谷 2019-12（33.9%）、峰 2021-06（42.5%）、谷 2023-03（23.6%）、峰 2025-06（44.0%）；目前 下行。&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;營收近四季年增的之字形轉折：2020 年 9 月谷 18.7%、2021 年 9 月峰 42.2%、2023 年 3 月谷 −1.9%；歷史下行段 3 段，中位 6 季、最長 16 季；目前自 2023 年 3 月谷底上行 14 季，2026 年 6 月 27.65% 是候選高點，最新 27.53%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src61&quot;&gt;[61]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src60&quot;&gt;[60]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src62&quot;&gt;[62]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;營業利益率近四季在 2025 年 6 月見峰 44.0% 後下行 5 季，最新 32.9%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src2&quot;&gt;[2]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;兩次營收谷底分別對應疫情與 2022 年廣告追蹤限制加上景氣轉弱，屬廣告景氣循環而非一次性事件；本次利益率下行則是公司主動擴大基礎設施投入加上訴訟費用，與廣告需求無關。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src61&quot;&gt;[61]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src3&quot;&gt;[3]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src21&quot;&gt;[21]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;h3&gt;② 訂單能見度&lt;/h3&gt;&lt;p class=&quot;s&quot;&gt;公司沒有揭露 RPO；合約負債只有約 0.02 季營收，廣告以競價即時成交，沒有訂單積壓可看。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src63&quot;&gt;[63]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src64&quot;&gt;[64]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;能見度只靠下一季營收指引：第四季 730–760 億美元，年增約 21.9%–26.9%（推算）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src35&quot;&gt;[35]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src17&quot;&gt;[17]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;h3&gt;③ 公司特有週期&lt;/h3&gt;&lt;p class=&quot;s&quot;&gt;AI 基礎設施建置期：2026 年資本支出指引 1,350–1,450 億美元，前三季已投入 858.3 億美元（推算）；德州與路易斯安那的合資資料中心預估開發成本約 140 億與 270 億美元。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src25&quot;&gt;[25]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src28&quot;&gt;[28]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src65&quot;&gt;[65]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src66&quot;&gt;[66]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;青少年訴訟：與 52 州檢察長和解總額最高約 185.9 億美元，其中約 53 億美元附條件、尚未認列；下一件學區示範案 2027 年 2 月開審。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src21&quot;&gt;[21]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src55&quot;&gt;[55]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;建置期的折舊會在完工後幾年陸續進到成本，所以利益率壓力在資本支出見頂後仍會延續數季。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src3&quot;&gt;[3]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src29&quot;&gt;[29]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/section&gt;&lt;section id=&quot;s6&quot;&gt;&lt;h2&gt;7　觀察清單：下季要看什麼&lt;/h2&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;觀察清單：目前值離改判門檻多遠&lt;/figcaption&gt;&lt;div class=&quot;wg&quot;&gt;&lt;div class=&quot;wgt&quot;&gt;&lt;b&gt;單季營收年增&lt;/b&gt;&lt;span&gt;維持條件：營收單季年增 &amp;gt;= 15.0%&lt;/span&gt;&lt;/div&gt;&lt;svg viewBox=&quot;0 uot;var(--pos)&quot;&gt;目前 32.9%&lt;/text&gt;&lt;/svg&gt;&lt;/div&gt;&lt;div class=&quot;wg&quot;&gt;&lt;div class=&quot;wgt&quot;&gt;&lt;b&gt;資本支出強度（近四季）&lt;/b&gt;&lt;span&gt;維持條件：資本支出強度_近四季 &amp;lt;= 50.0%&lt;/span&gt;&lt;/div&gt;&lt;svg viewBox=&quot;0 0 680 60&quot; role=&quot;img&quot; aria-label=&quot;資本支出強度（近四季）&quot;&gt;&lt;rect x=&quot;14.0&quot; y=&quot;14&quot; width=&quot;567.0&quot; height=&quot;20&quot; fill=&quot;var(--pos)&quot; opacity=&quot;.12&quot;/&gt;&lt;line x1=&quot;14.0&quot; x2=&quot;666.0&quot; y1=&quot;24&quot; y2=&quot;24&quot; stroke=&quot;var(--line)&quot; stroke-width=&quot;2&quot;/&gt;&lt;line x1=&quot;581.0&quot; x2=&quot;581.0&quot; y1=&quot;8&quot; y2=&quot;40&quot; stroke=&quot;var(--ink)&quot; stroke-dasharray=&quot;4 3&quot; stroke-width=&quot;1.6&quot;/&gt;&lt;text x=&quot;581.0&quot; y=&quot;54&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;門檻 50.0%&lt;/text&gt;&lt;circle cx=&quot;504.2&quot; cy=&quot;24&quot; r=&quot;7&quot; fill=&quot;var(--pos)&quot;/&gt;&lt;text x=&quot;504.2&quot; y=&quot;9&quot; class=&quot;vl s&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--pos)&quot;&gt;目前 43.2%&lt;/text&gt;&lt;/svg&gt;&lt;/div&gt;&lt;div class=&quot;lg&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--pos)&quot;&gt;&lt;/i&gt;仍在維持條件內&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--neg)&quot;&gt;&lt;/i&gt;已越過門檻&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;只畫能自動對照的觀察項（有檢驗鍵與門檻）：淡綠帶是維持目前判斷的範圍，虛線是門檻，圓點是底稿最新值；越過門檻就照表中「改判方向」重看。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估.json#/內容/觀察清單（檢驗鍵、比較、門檻）＋商業評估底稿.json#/指標（目前值）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;div class=&quot;cards&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;單季營收年增&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;自動對照&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;目前值&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;2026 年第三季 26.1%（前三季：2025 Q4 23.8%、2026 Q1 33.1%、2026 Q2 28.0%）&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src33&quot;&gt;[33]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;看什麼&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;曝光與單價增速是否同時回落&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;改判方向&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;若單季營收年增低於 15%，則成長引擎轉弱，成長動能與生命週期改看成熟&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;營業利益率近四季&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;自動對照&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;目前值&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;2026 年 9 月 32.9%（含兩筆法律費用；加回後約 37.9%，推算）&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src67&quot;&gt;[67]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src21&quot;&gt;[21]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;看什麼&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;折舊與 AI 運算費用占營收比是否繼續上升&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;改判方向&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;若近四季營業利益率低於 30%，則成本壓力超過訴訟一次性因素，卡點風險下修&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;資本支出強度（近四季）&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;自動對照&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;目前值&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;近四季資本支出占營收 43.2%，一年增加 10.1 個百分點&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src68&quot;&gt;[68]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src39&quot;&gt;[39]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;看什麼&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;2027 年資本支出指引與營收增速的相對變化&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;改判方向&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;若資本支出強度超過 50% 且營收近四季年增下降，則卡住訊號 G4 亮燈，投入換不到成長&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;青少年訴訟與監管&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;人工對照&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;目前值&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;約 53 億美元附條件和解款尚未認列；下一件學區示範案 2027 年 2 月開審&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src55&quot;&gt;[55]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;看什麼&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;示範案結果、附條件款項是否認列、各國對青少年使用的限制&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;改判方向&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;若判決或新和解金額超過 100 億美元，或監管限制青少年使用，則卡點風險與模式穩固度下修&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;h3&gt;推論紀錄（下一季財報後自動對照）&lt;/h3&gt;&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;推論&lt;/th&gt;&lt;th&gt;方法&lt;/th&gt;&lt;th&gt;檢驗指標&lt;/th&gt;&lt;th&gt;條件&lt;/th&gt;&lt;th&gt;基準季&lt;/th&gt;&lt;th&gt;檢驗時點&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;P1&lt;/td&gt;&lt;td&gt;2026 年第四季單季營收年增不低於 20%（指引下緣約 21.9%）&lt;/td&gt;&lt;td&gt;其他&lt;/td&gt;&lt;td&gt;營收單季年增&lt;/td&gt;&lt;td&gt;&amp;gt;= 0.2&lt;/td&gt;&lt;td&gt;2026-09-30&lt;/td&gt;&lt;td&gt;2026 年 10-K（約 2027 年 2 月）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;P2&lt;/td&gt;&lt;td&gt;營收近四季年增在 2027 年第一季低於 27%，2026 年 6 月的 27.65% 確認為本輪高點&lt;/td&gt;&lt;td&gt;自身歷史&lt;/td&gt;&lt;td&gt;營收近四季年增&lt;/td&gt;&lt;td&gt;&amp;lt; 0.27&lt;/td&gt;&lt;td&gt;2026-09-30&lt;/td&gt;&lt;td&gt;2027 年第一季 10-Q（約 2027 年 5 月）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;P3&lt;/td&gt;&lt;td&gt;基礎設施成本持續，營業利益率近四季到 2027 年第二季仍低於 40%&lt;/td&gt;&lt;td&gt;公司特有&lt;/td&gt;&lt;td&gt;營業利益率_近四季&lt;/td&gt;&lt;td&gt;&amp;lt; 0.4&lt;/td&gt;&lt;td&gt;2026-09-30&lt;/td&gt;&lt;td&gt;2027 年第二季 10-Q（約 2027 年 8 月）&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;lead&quot;&gt;每條推論從檢驗期末起，每個新季度記一筆命中或落空（預測帳本，公司資料夾 商業評估檢驗.json）；方法準確度跨公司統計見 優化/商業評估預測帳本.json。&lt;/p&gt;&lt;/section&gt;&lt;section id=&quot;sg&quot;&gt;&lt;h2&gt;商業評估等級明細&lt;span class=&quot;ruleok&quot;&gt;評分規則第一版，2026-11-07 使用者核定&lt;/span&gt;&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;五個面向各 1–5 分，相對同產業卡同業評比；機械建議分由工具依同業位置、卡住訊號與驗證比例算出，作者可調整但要寫理由。加權分 3.65 → B 級。等級門檻：A ≥ 4.2、B ≥ 3.5、C ≥ 2.8、D ≥ 2.1、其餘 E。&lt;/p&gt;&lt;div class=&quot;cards&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;模式穩固度&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;權重 &lt;span class=&quot;num&quot;&gt;25%&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;fs&quot;&gt;&lt;span&gt;作者分 &lt;span class=&quot;num v&quot;&gt;4&lt;/span&gt;&lt;/span&gt;&lt;span&gt;機械建議 &lt;span class=&quot;num&quot;&gt;4&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;近四季營業利益率同業百分位 0.6&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;理由&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;近四季營業利益率 32.9%，同業百分位 0.6，機械建議 4 分；廣告模式經 2022 年營收下降後回到高利益率，但營收 97% 以上單押廣告。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src69&quot;&gt;[69]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src4&quot;&gt;[4]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;同業對照&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;營業利益率：Microsoft 47.1%、Alphabet 33.3%、Meta 32.9%、Reddit 29.4%、Pinterest 5.6%、Snap −1.8%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src50&quot;&gt;[50]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;成長動能&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;權重 &lt;span class=&quot;num&quot;&gt;25%&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;fs&quot;&gt;&lt;span&gt;作者分 &lt;span class=&quot;num v&quot;&gt;4&lt;/span&gt;&lt;/span&gt;&lt;span&gt;機械建議 &lt;span class=&quot;num&quot;&gt;5&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;最近一季營收年增同業百分位 0.8（yfinance 口徑）&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;理由&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;最近一季營收年增 26.1%，同業百分位 0.8，機械建議 5 分。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src70&quot;&gt;[70]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src71&quot;&gt;[71]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;下調 1 分：單季增速已連三季放緩，第四季指引中點約 24.4%（推算），每日活躍人數只增 3%，量的引擎在變慢。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src33&quot;&gt;[33]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src35&quot;&gt;[35]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;同業對照&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;最近一季營收年增：Reddit 53.0%、Meta 26.1%、Alphabet 24.7%、Microsoft 18.8%、Snap 14.3%、Pinterest 11.9%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src72&quot;&gt;[72]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;卡點風險&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;權重 &lt;span class=&quot;num&quot;&gt;20%&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;fs&quot;&gt;&lt;span&gt;作者分 &lt;span class=&quot;num v&quot;&gt;3&lt;/span&gt;&lt;/span&gt;&lt;span&gt;機械建議 &lt;span class=&quot;num&quot;&gt;3&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;計分採用的亮燈 2 條（G1、G2）；資料未取得 0 條&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;理由&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;機械訊號亮 2 條（G1 營收增速連續放緩、G2 營業利益率走弱），兩條都採用計分；機械建議 3 分。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src73&quot;&gt;[73]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src74&quot;&gt;[74]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;另有未入計分的卡點：約 53 億美元附條件和解款未認列、2027 年 2 月示範案開審，以及 S&amp;amp;P 展望轉負，維持 3 分。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src55&quot;&gt;[55]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src46&quot;&gt;[46]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;同業對照&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;同業的卡住訊號尚未逐家用同口徑計算。利益率面 Snap 為負、Pinterest 5.6%，卡點在獲利本身，Meta 卡點在成本與訴訟。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src50&quot;&gt;[50]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;週期位置&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;權重 &lt;span class=&quot;num&quot;&gt;15%&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;fs&quot;&gt;&lt;span&gt;作者分 &lt;span class=&quot;num v&quot;&gt;3&lt;/span&gt;&lt;/span&gt;&lt;span&gt;機械建議 &lt;span class=&quot;num&quot;&gt;4&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;營收近四季年增目前上行，距最近轉折 14 季；歷史下行段中位 6 季&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;理由&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;營收近四季年增上行 14 季，機械建議 4 分。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src75&quot;&gt;[75]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;下調 1 分：上行段已有 2026 年 6 月的候選高點、2027 年第一季面對 33% 高基期，而營業利益率近四季已下行 5 季；兩條序列一升一降，位置接近高點而非上行早段。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src62&quot;&gt;[62]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src2&quot;&gt;[2]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;同業對照&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;Alphabet 最近一季營收年增 24.7%、Microsoft 18.8%，與 Meta 同屬廣告與雲端需求的上行期；Pinterest 11.9%、Snap 14.3% 增速較低。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src72&quot;&gt;[72]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;說法可信度&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;權重 &lt;span class=&quot;num&quot;&gt;15%&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;fs&quot;&gt;&lt;span&gt;作者分 &lt;span class=&quot;num v&quot;&gt;4&lt;/span&gt;&lt;/span&gt;&lt;span&gt;機械建議 &lt;span class=&quot;num&quot;&gt;4&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;已判定 5 條，驗證比例 0.6&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;理由&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;五條說的 vs 做的：兩條已驗證（營收指引、實境實驗室虧損）、兩條部分支持（AI 推升單價、排除訴訟後營業利益）、一條未獲數字支持（資本支出區間三次上調）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src6&quot;&gt;[6]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src25&quot;&gt;[25]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;同業對照&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-待查&quot;&gt;待查&lt;/span&gt;同業說法可信度尚未逐家比對；待查：Alphabet、Pinterest、Snap 近四季的指引達成紀錄。&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;相對同業：成長與利潤率&lt;/figcaption&gt;&lt;svg viewBox=&quot;0 0 680 300&quot; role=&quot;img&quot; aria-label=&quot;同業位置：營收年增與營業利益率&quot;&gt;&lt;line x1=&quot;56.0&quot; x2=&quot;56.0&quot; y1=&quot;16&quot; y2=&quot;260&quot; class=&quot;zl&quot;/&gt;&lt;text x=&quot;56.0&quot; y=&quot;276&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;0%&lt;/text&gt;&lt;line x1=&quot;155.0&quot; x2=&quot;155.0&quot; y1=&quot;16&quot; y2=&quot;260&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;155.0&quot; y=&quot;276&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;10%&lt;/text&gt;&lt;line x1=&quot;254.0&quot; x2=&quot;254.0&quot; y1=&quot;16&quot; y2=&quot;260&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;254.0&quot; y=&quot;276&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;20%&lt;/text&gt;&lt;line x1=&quot;353.0&quot; x2=&quot;353.0&quot; y1=&quot;16&quot; y2=&quot;260&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;353.0&quot; y=&quot;276&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;30%&lt;/text&gt;&lt;line x1=&quot;452.0&quot; x2=&quot;452.0&quot; y1=&quot;16&quot; y2=&quot;260&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;452.0&quot; y=&quot;276&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;40%&lt;/text&gt;&lt;line x1=&quot;551.0&quot; x2=&quot;551.0&quot; y1=&quot;16&quot; y2=&quot;260&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;551.0&quot; y=&quot;276&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;50%&lt;/text&gt;&lt;line x1=&quot;650.0&quot; x2=&quot;650.0&quot; y1=&quot;16&quot; y2=&quot;260&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;650.0&quot; y=&quot;276&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;60%&lt;/text&gt;&lt;line x1=&quot;56&quot; x2=&quot;650&quot; y1=&quot;260.0&quot; y2=&quot;260.0&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;50&quot; y=&quot;264.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;-20%&lt;/text&gt;&lt;line x1=&quot;56&quot; x2=&quot;650&quot; y1=&quot;199.0&quot; y2=&quot;199.0&quot; class=&quot;zl&quot;/&gt;&lt;text x=&quot;50&quot; y=&quot;203.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;0%&lt;/text&gt;&lt;line x1=&quot;56&quot; x2=&quot;650&quot; y1=&quot;138.0&quot; y2=&quot;138.0&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;50&quot; y=&quot;142.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;20%&lt;/text&gt;&lt;line x1=&quot;56&quot; x2=&quot;650&quot; y1=&quot;77.0&quot; y2=&quot;77.0&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;50&quot; y=&quot;81.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;40%&lt;/text&gt;&lt;line x1=&quot;56&quot; x2=&quot;650&quot; y1=&quot;16.0&quot; y2=&quot;16.0&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;50&quot; y=&quot;20.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;60%&lt;/text&gt;&lt;text x=&quot;650&quot; y=&quot;296&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;最近一季營收年增 →&lt;/text&gt;&lt;text x=&quot;60&quot; y=&quot;26&quot; class=&quot;ax&quot;&gt;↑ 營業利益率&lt;/text&gt;&lt;circle cx=&quot;314.4&quot; cy=&quot;98.8&quot; r=&quot;8&quot; fill=&quot;var(--biz)&quot; opacity=&quot;1&quot;&gt;&lt;title&gt;META：營收年增 26.1%、營業利益率 32.9%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;324.4&quot; y=&quot;102.8&quot; class=&quot;vl s&quot; text-anchor=&quot;start&quot;&gt;META&lt;/text&gt;&lt;circle cx=&quot;300.5&quot; cy=&quot;97.4&quot; r=&quot;5.5&quot; fill=&quot;var(--muted)&quot; opacity=&quot;0.75&quot;&gt;&lt;title&gt;GOOGL：營收年增 24.7%、營業利益率 33.3%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;290.5&quot; y=&quot;101.4&quot; class=&quot;ax s&quot; text-anchor=&quot;end&quot;&gt;GOOGL&lt;/text&gt;&lt;circle cx=&quot;173.8&quot; cy=&quot;182.0&quot; r=&quot;5.5&quot; fill=&quot;var(--muted)&quot; opacity=&quot;0.75&quot;&gt;&lt;title&gt;PINS：營收年增 11.9%、營業利益率 5.6%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;183.8&quot; y=&quot;186.0&quot; class=&quot;ax s&quot; text-anchor=&quot;start&quot;&gt;PINS&lt;/text&gt;&lt;circle cx=&quot;197.6&quot; cy=&quot;204.5&quot; r=&quot;5.5&quot; fill=&quot;var(--muted)&quot; opacity=&quot;0.75&quot;&gt;&lt;title&gt;SNAP：營收年增 14.3%、營業利益率 -1.8%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;207.6&quot; y=&quot;208.5&quot; class=&quot;ax s&quot; text-anchor=&quot;start&quot;&gt;SNAP&lt;/text&gt;&lt;circle cx=&quot;580.7&quot; cy=&quot;109.3&quot; r=&quot;5.5&quot; fill=&quot;var(--muted)&quot; opacity=&quot;0.75&quot;&gt;&lt;title&gt;RDDT：營收年增 53.0%、營業利益率 29.4%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;590.7&quot; y=&quot;113.3&quot; class=&quot;ax s&quot; text-anchor=&quot;start&quot;&gt;RDDT&lt;/text&gt;&lt;circle cx=&quot;242.1&quot; cy=&quot;55.3&quot; r=&quot;5.5&quot; fill=&quot;var(--muted)&quot; opacity=&quot;0.75&quot;&gt;&lt;title&gt;MSFT：營收年增 18.8%、營業利益率 47.1%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;252.1&quot; y=&quot;59.3&quot; class=&quot;ax s&quot; text-anchor=&quot;start&quot;&gt;MSFT&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;右上角＝成長快又賺得多。藍點是本公司，灰點是同產業卡同業；營收年增百分位 0.8、營業利益率百分位 0.6（成長動能、模式穩固度的機械建議分依此）。營收年增是最近一季對去年同季（yfinance 口徑），不是近四季合計。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估底稿.json#/同業位置
