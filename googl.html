&lt;div class=&quot;wrap&quot;&gt;&lt;div class=&quot;top&quot;&gt;&lt;div&gt;&lt;b&gt;GOOGL&lt;/b&gt;　Alphabet Inc.（Alphabet（Google 母公司））&lt;/div&gt;&lt;div&gt;財報截至 2026-09-30（2026 年第三季 10-Q；近四季＝2025Q4～2026Q3）&lt;/div&gt;&lt;div class=&quot;dl&quot;&gt;&lt;button type=&quot;button&quot; data-dl=&quot;html&quot; data-name=&quot;GOOGL_研究報告.html&quot;&gt;下載網頁&lt;/button&gt;&lt;button type=&quot;button&quot; data-dl=&quot;csv&quot; data-name=&quot;GOOGL_報告表格.csv&quot;&gt;下載表格（Excel 可開）&lt;/button&gt;&lt;button type=&quot;button&quot; onclick=&quot;window.print()&quot; title=&quot;可選「另存為 PDF」&quot;&gt;列印／另存 PDF&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;front&quot; id=&quot;front&quot; data-layer=&quot;首頁&quot;&gt;&lt;header class=&quot;hero&quot;&gt;&lt;div&gt;&lt;span class=&quot;stance&quot;&gt;生意 B／價格偏貴&lt;/span&gt;&lt;span class=&quot;stance rating&quot;&gt;研究評等　生意 B ／ 價格偏貴（非買賣建議）&lt;/span&gt;&lt;h1&gt;搜尋與雲端的護城河仍深，但 AI 投資讓自由現金流轉負；現價已預支高成長&lt;/h1&gt;&lt;p class=&quot;summary&quot;&gt;近四季營收年增 22.2%、雲端第三季 +103%，但資本支出 1,598 億讓自由現金流只剩 197 億。合理價值約 187.16–261.22 美元，2026-11-13 收盤 295.77 美元 高於上緣；基準情境成真時的現價隱含年報酬約 7.9%（基準情境成真時、以收盤 2026-11-13 股價買進的推算年報酬；條件式，非預期報酬、非買賣建議），低於資金成本 9.5%。&lt;/p&gt;&lt;/div&gt;&lt;aside class=&quot;pricebox&quot;&gt;&lt;div class=&quot;sub&quot;&gt;2026-11-13 收盤 295.77 美元&lt;/div&gt;&lt;div class=&quot;big&quot;&gt;295.77&lt;span style=&quot;font-size:18px&quot;&gt; 美元&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;zones&quot;&gt;&lt;div class=&quot;zone buy&quot; style=&quot;grid-column:1/-1&quot;&gt;&lt;span&gt;買入區上緣（不確定性高）&lt;/span&gt;&lt;b&gt;137 美元&lt;/b&gt;&lt;small&gt;股價在此以下才有 40% 安全邊際；＝合理價值中點 227.92 ×（1−40%）。非買賣建議。&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;rows&quot;&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;股價 ÷ 合理價值中點&lt;/span&gt;&lt;span&gt;1.30 倍&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;10 年期美國公債&lt;/span&gt;&lt;span&gt;5.15%&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;r&quot;&gt;&lt;span&gt;市價隱含 5 年營收年增&lt;/span&gt;&lt;span&gt;16.4%&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;現金與證券（2026-09-30）&lt;/span&gt;&lt;span&gt;2,651 億美元&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;有息負債&lt;/span&gt;&lt;span&gt;1,251 億美元&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;淨現金&lt;/span&gt;&lt;span&gt;1,400 億美元&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;近四季回購&lt;/span&gt;&lt;span&gt;59.0 億美元&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot; style=&quot;display:block&quot;&gt;&lt;span&gt;股東回報與權益（2021–2025）：&lt;/span&gt;&lt;span style=&quot;font-weight:400&quot;&gt;近五年平均 ROE 30%；股東權益 2,516→4,153 億美元；股利＋回購占自由現金流 87%（逐年表見第六題）&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; id=&quot;cont-note&quot; style=&quot;margin:10px 0 0&quot;&gt;這個數字只描述現價與本報告合理價值中點的距離，不改價格位置與研究評等。非買賣建議。&lt;/p&gt;&lt;/aside&gt;&lt;/header&gt;&lt;section class=&quot;note-box&quot; id=&quot;value-trio&quot; style=&quot;margin-top:18px&quot;&gt;&lt;h3&gt;合理價值與市價隱含第 10 年倍數&lt;/h3&gt;&lt;div class=&quot;zones&quot; style=&quot;grid-template-columns:repeat(2,1fr)&quot;&gt;&lt;div class=&quot;zone&quot;&gt;&lt;span&gt;合理價值（只含折現率）&lt;/span&gt;&lt;b&gt;187–261 美元&lt;/b&gt;&lt;small&gt;中點 227.92 美元；三情境機率加權&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;zone mkt&quot;&gt;&lt;span&gt;市價隱含第 10 年倍數（EV/EBIT，基準情境）&lt;/span&gt;&lt;b&gt;20.4 倍&lt;/b&gt;&lt;small&gt;模型假設 11.4 倍，市價隱含是模型的 1.8 倍；折現率區間 17.9–25.0 倍；參考帶（大類：軟體與網路，148 筆、7 家）中位 15.5 倍、四分位 6.0–28.1 倍、p90 46.7 倍（機械回測樣本，非市場全體；分產業的筆數與公司數少，僅供參考）；只描述，不進評等&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;參考帶中位（軟體與網路） 15.5 倍時，機率加權每股約 265 美元（條件式，非目標價、非買賣建議，不進評等；各倍數對照見計算底稿 5）。&lt;/p&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;&lt;b&gt;合理價值 vs 市價隱含倍數（作者判讀）：&lt;/b&gt;市價隱含第 10 年 EV（企業價值）/EBIT（息稅前利益，本報告以營業利益計）約 20.4 倍，是本報告基準模型終值倍數 11.4 倍 的 1.79 倍，介於軟體與網路參考帶中位 15.5 倍與第 75 百分位 28.1 倍之間；無特例。只描述市價與模型的距離，不作評等理由。&lt;/p&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:10px;font-size:15px;line-height:1.7&quot;&gt;上面的合理價值只含折現率高低；三情境全幅 102～426（情境與折現率一起算，約中點的 142%）；寬主要來自情境（差距 116%），不是折現率（32%）。情境差距＝（樂觀－保守）÷基準，折現率寬度＝（高－低）÷中點；非買賣建議。&lt;/p&gt;&lt;div class=&quot;tw&quot; style=&quot;margin-top:14px&quot;&gt;&lt;table class=&quot;txt&quot; style=&quot;min-width:0;font-size:16px&quot;&gt;&lt;tr&gt;&lt;th style=&quot;padding:9px 12px;font-size:15px&quot;&gt;情境&lt;/th&gt;&lt;th style=&quot;padding:9px 12px;font-size:15px&quot;&gt;每股價值&lt;/th&gt;&lt;th style=&quot;padding:9px 12px;font-size:15px&quot;&gt;權重&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;padding:9px 12px&quot;&gt;保守&lt;/td&gt;&lt;td style=&quot;padding:9px 12px;font-size:20px;font-weight:700&quot;&gt;119.36&lt;/td&gt;&lt;td style=&quot;padding:9px 12px&quot;&gt;25%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;padding:9px 12px&quot;&gt;基準&lt;div style=&quot;font-size:13px;line-height:1.5;color:var(--muted);margin-top:2px&quot;&gt;與外部 DCF 單點同口徑；今天的現值，不是 12 個月目標價，非買賣建議&lt;/div&gt;&lt;/td&gt;&lt;td style=&quot;padding:9px 12px;font-size:20px;font-weight:700&quot;&gt;212.81&lt;/td&gt;&lt;td style=&quot;padding:9px 12px&quot;&gt;50%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;padding:9px 12px&quot;&gt;樂觀&lt;/td&gt;&lt;td style=&quot;padding:9px 12px;font-size:20px;font-weight:700&quot;&gt;366.72&lt;/td&gt;&lt;td style=&quot;padding:9px 12px&quot;&gt;25%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:10px;font-size:15px;line-height:1.7&quot;&gt;中點是三個情境的加權，上下緣是換折現率重算；算式見&lt;a href=&quot;#valuation&quot;&gt;第五題&lt;/a&gt;。情境表說明合理價值怎麼組成，不是單一目標價。&lt;/p&gt;&lt;/section&gt;&lt;!--目標區間:首頁--&gt;&lt;div class=&quot;note-box tgt&quot; id=&quot;target-front&quot;&gt;&lt;h3&gt;12 個月條件式目標區間&lt;/h3&gt;&lt;p style=&quot;margin:0 0 6px&quot;&gt;如果三種情境各自成真，一年後（至 2027-11-13）每股價值大約落在：保守 111.20–145.02、基準 191.49–265.97、樂觀 323.75–466.01 美元。這是條件式區間，不是股價預測，三段不合成單一數字。&lt;/p&gt;&lt;figure class=&quot;figure wide&quot;&gt;&lt;svg viewBox=&quot;0 0 860 232&quot; role=&quot;img&quot; aria-label=&quot;今天的價值區間與 12 個月後的條件式目標區間（條件式、非買賣建議）&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;152.2&quot; x2=&quot;152.2&quot; y1=&quot;24&quot; y2=&quot;198&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;152.2&quot; y=&quot;212&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;100&lt;/text&gt;&lt;line x1=&quot;255.8&quot; x2=&quot;255.8&quot; y1=&quot;24&quot; y2=&quot;198&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;255.8&quot; y=&quot;212&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;200&lt;/text&gt;&lt;line x1=&quot;359.4&quot; x2=&quot;359.4&quot; y1=&quot;24&quot; y2=&quot;198&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;359.4&quot; y=&quot;212&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;300&lt;/text&gt;&lt;line x1=&quot;463.0&quot; x2=&quot;463.0&quot; y1=&quot;24&quot; y2=&quot;198&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;463.0&quot; y=&quot;212&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;400&lt;/text&gt;&lt;line x1=&quot;566.6&quot; x2=&quot;566.6&quot; y1=&quot;24&quot; y2=&quot;198&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;566.6&quot; y=&quot;212&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;500&lt;/text&gt;&lt;text x=&quot;4&quot; y=&quot;16&quot; class=&quot;lab&quot; font-weight=&quot;700&quot;&gt;今天（依證據的價值；倍數列只作交叉核對）&lt;/text&gt;&lt;text x=&quot;142&quot; y=&quot;42.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;合理價值&lt;/text&gt;&lt;rect x=&quot;242.5&quot; y=&quot;30.0&quot; width=&quot;76.7&quot; height=&quot;16&quot; rx=&quot;8&quot; fill=&quot;var(--pos)&quot; opacity=&quot;0.8&quot;&gt;&lt;title&gt;合理價值：187.2–261.2&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;325.2&quot; y=&quot;42.0&quot; class=&quot;ax&quot;&gt;187.2–261.2；買入區上緣 136.8&lt;/text&gt;&lt;text x=&quot;142&quot; y=&quot;70.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;倍數交叉核對（不進評等）&lt;/text&gt;&lt;rect x=&quot;318.1&quot; y=&quot;58.0&quot; width=&quot;55.1&quot; height=&quot;16&quot; rx=&quot;8&quot; fill=&quot;var(--muted)&quot; opacity=&quot;0.35&quot;&gt;&lt;title&gt;倍數交叉核對（不進評等）：260.1–313.2&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;379.1&quot; y=&quot;70.0&quot; class=&quot;ax&quot;&gt;260.1–313.2&lt;/text&gt;&lt;text x=&quot;4&quot; y=&quot;96&quot; class=&quot;lab&quot; font-weight=&quot;700&quot;&gt;12 個月後（條件式目標區間，不進評等）&lt;/text&gt;&lt;text x=&quot;142&quot; y=&quot;122.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;保守 25%&lt;/text&gt;&lt;rect x=&quot;163.8&quot; y=&quot;110.0&quot; width=&quot;35.0&quot; height=&quot;16&quot; rx=&quot;8&quot; fill=&quot;var(--c5)&quot; opacity=&quot;0.85&quot;&gt;&lt;title&gt;保守 25%：111.2–145.0&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;204.9&quot; y=&quot;122.0&quot; class=&quot;ax&quot;&gt;111.20–145.02｜相對現價 −62%～−51%&lt;/text&gt;&lt;text x=&quot;142&quot; y=&quot;150.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;基準 50%&lt;/text&gt;&lt;rect x=&quot;247.0&quot; y=&quot;138.0&quot; width=&quot;77.2&quot; height=&quot;16&quot; rx=&quot;8&quot; fill=&quot;var(--c1)&quot; opacity=&quot;0.85&quot;&gt;&lt;title&gt;基準 50%：191.5–266.0&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;330.2&quot; y=&quot;150.0&quot; class=&quot;ax&quot;&gt;191.49–265.97｜相對現價 −35%～−10%&lt;/text&gt;&lt;text x=&quot;142&quot; y=&quot;178.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;樂觀 25%&lt;/text&gt;&lt;rect x=&quot;384.0&quot; y=&quot;166.0&quot; width=&quot;147.4&quot; height=&quot;16&quot; rx=&quot;8&quot; fill=&quot;var(--c2)&quot; opacity=&quot;0.85&quot;&gt;&lt;title&gt;樂觀 25%：323.8–466.0&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;537.4&quot; y=&quot;178.0&quot; class=&quot;ax&quot;&gt;323.75–466.01｜相對現價 +9%～+58%&lt;/text&gt;&lt;line x1=&quot;190.3&quot; x2=&quot;190.3&quot; y1=&quot;27&quot; y2=&quot;49&quot; class=&quot;buyline&quot;/&gt;&lt;line x1=&quot;355.0&quot; x2=&quot;355.0&quot; y1=&quot;24&quot; y2=&quot;198&quot; class=&quot;price&quot;/&gt;&lt;text x=&quot;355.0&quot; y=&quot;228&quot; class=&quot;pricelab&quot; text-anchor=&quot;middle&quot;&gt;現價 295.77&lt;/text&gt;&lt;/svg&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;條件式、非買賣建議；2026-11-13 至 2027-11-13；機率為政策權重，未經歷史校準；細節見第五題。&lt;/p&gt;&lt;/figure&gt;&lt;/div&gt;&lt;!--/目標區間:首頁--&gt;&lt;div class=&quot;kpis&quot;&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;l&quot;&gt;近四季營收年增&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;+22.2%&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;近四季 4,711 億美元；第三季 +24.7%，雲端 +103%&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;l&quot;&gt;營業利益率&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;33.3%&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;近四季（營業利益 1,570 億 ÷ 營收 4,711 億）&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;l&quot;&gt;每股FCF扣股權薪酬&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;約 −0.87 美元&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;近四季；未扣股權薪酬約 1.61 美元（推算）&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;l&quot;&gt;資本支出強度&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;33.9%&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;近四季資本支出 1,598 億 ÷ 營收；2022 年約 11%&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;note-box&quot; id=&quot;survival&quot; style=&quot;border-left-color:var(--pos)&quot;&gt;&lt;p style=&quot;margin:0&quot;&gt;&lt;b&gt;信用評級&lt;/b&gt;　機構 Moody&amp;#x27;s Aa2、S&amp;amp;P AA+（SEC 全文搜尋 FWP 2026-08-07 0001193125-26-338750）｜投資等級　｜　&lt;a href=&quot;#survival-detail&quot;&gt;&lt;b&gt;存活檢查（12～24 個月）&lt;/b&gt;&lt;/a&gt;　&lt;b style=&quot;color:var(--pos)&quot;&gt;無明顯警訊&lt;/b&gt;（推導，非違約預測；理由見第六題計算底稿）&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;grid2 front-pts&quot;&gt;&lt;div&gt;&lt;h3&gt;三個論點&lt;/h3&gt;&lt;ol class=&quot;pts&quot;&gt;&lt;li&gt;第三季雲端 +103%，近四季營收 +22.2%，投入資本報酬率約 37%。&lt;/li&gt;&lt;li&gt;近四季資本支出 1,598 億，自由現金流只剩 197 億，扣股權薪酬後為負。&lt;/li&gt;&lt;li&gt;現價 295.77 美元 高於合理價值上緣；市價要求未來 5 年營收年增約 16.4%。&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;&lt;div&gt;&lt;h3&gt;三個風險&lt;/h3&gt;&lt;ol class=&quot;pts risk&quot;&gt;&lt;li&gt;AI 模式變現較低，搜尋年增由 17% 降到 12%。&lt;/li&gt;&lt;li&gt;2027 年資本支出再顯著增加，採購承諾 9,244 億。&lt;/li&gt;&lt;li&gt;停止回購、改發股發債，流通股 2026 年已增 1.7%。&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;note-box mv&quot;&gt;&lt;b&gt;市場價格隱含什麼、我們哪裡不同&lt;/b&gt;&lt;p&gt;市價隱含未來 5 年營收年增約 16.4%（利潤率照基準），或第 1 年起每年營業利益率約 41.4%（擇一，推導）；本報告基準成長由 20% 逐年降到 8%、利潤率約 31%–32%。&lt;/p&gt;&lt;/div&gt;&lt;div id=&quot;triggers&quot; class=&quot;tm&quot;&gt;&lt;h3&gt;風險與改變判斷&lt;/h3&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;risk-tbl&quot; style=&quot;min-width:0;width:100%&quot;&gt;&lt;tr&gt;&lt;th style=&quot;white-space:normal;width:64%&quot;&gt;情況（看哪個指標、門檻多少）&lt;/th&gt;&lt;th style=&quot;white-space:normal;width:22%&quot;&gt;會改變什麼判斷&lt;/th&gt;&lt;th style=&quot;white-space:normal;width:14%&quot;&gt;歷史基準比率&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;搜尋與其他年增連兩季低於 8%，或全球搜尋市占跌破 85%&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;護城河由強下修&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;雲端年增連兩季低於 50% 或積壓季減，基準成長下修；連四季營收年增 22% 以上&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;基準上修&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;連兩季營運現金流高於資本支出&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;自由現金流品質由弱上修；否則維持弱&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;近四季 ROIC（投入資本報酬率）跌破 20%，或增量 ROIC 連兩季低於資金成本 9.5%&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;投入回報由強下修&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;流通股較 9 月底 12,294 百萬股再增 1% 以上&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;資本配置下修；淨回購連兩季為正則上修&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;有息負債÷EBITDA（稅息折舊攤銷前利潤）超過 1.5，或淨現金轉為淨負債&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;資產負債表由強下修&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;估值：現價高於合理價值上緣，基準隱含年報酬低於資金成本 9.5%&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;未設門檻：持續觀察&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;AI 投資回收：2026 年資本支出指引 1,950～2,050 億，2027 年再增&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;未設門檻：持續觀察&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;搜尋變現：AI 模式變現較低，搜尋年增由 17% 降到 12%&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;未設門檻：持續觀察&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;收入品質：TPU（Google 自研的 AI 晶片）系統附回購選擇權，積壓含關聯方 Crux AI（Blackstone 與 Google 合資的 TPU 雲端公司）168 億&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;未設門檻：持續觀察&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;歷史基準比率＝成功幾率口徑，是同規模公司歷史上做到的比例，不是這家公司的預測；「—」＝沒有可對照的歷史基準，不估機率。營收成長類的列：同規模（營收 500 億美元以上）公司 10 年實質年增做到模型基準 7.7% 的歷史比例（超額報酬期間檢查.json 基準比率；Base Rate Book）。&lt;/p&gt;&lt;/div&gt;&lt;p class=&quot;cap fnote&quot;&gt;資料日期：財報截至 2026-09-30（2026 年第三季 10-Q；近四季＝2025Q4～2026Q3）；市場資料 2026-11-13 收盤 295.77 美元。首家產業，公版待驗證（穩定現金流／數位平台；產業公版的估值法與指標選擇尚未經兩家以上驗證）。研究用途，非買賣建議，不構成任何投資建議，也不提供單一目標價。本研究只評估公司本身，不評估讀者自身的資金期限與等待能力。完整數字見正文&lt;a href=&quot;#numbers&quot;&gt;「完整數字」&lt;/a&gt;；名詞與每條判斷的證據狀態見&lt;a href=&quot;#more&quot;&gt;附錄&lt;/a&gt;。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;nav class=&quot;qnav&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;&lt;a href=&quot;#business&quot;&gt;01　生意怎麼賺錢？&lt;/a&gt;&lt;a href=&quot;#growth&quot;&gt;02　還在成長嗎？&lt;/a&gt;&lt;a href=&quot;#cash&quot;&gt;03・04　賺的錢是真的嗎？股東實際拿到什麼？&lt;/a&gt;&lt;a href=&quot;#market&quot;&gt;市場背景&lt;/a&gt;&lt;a href=&quot;#valuation&quot;&gt;05　現在的價格貴不貴？&lt;/a&gt;&lt;a href=&quot;#value&quot;&gt;價值判斷與評等&lt;/a&gt;&lt;a href=&quot;#capital&quot;&gt;06　管理層怎麼用錢、怎麼管資產？&lt;/a&gt;&lt;a href=&quot;#events&quot;&gt;07　近半年發生了什麼重大事件？&lt;/a&gt;&lt;a href=&quot;#numbers&quot;&gt;完整數字&lt;/a&gt;&lt;a href=&quot;#workpaper&quot;&gt;計算底稿&lt;/a&gt;&lt;a href=&quot;#more&quot;&gt;附錄&lt;/a&gt;&lt;/div&gt;&lt;/nav&gt;
&lt;main class=&quot;wrap&quot;&gt;&lt;div data-layer=&quot;正文&quot;&gt;&lt;section class=&quot;q&quot; id=&quot;business&quot;&gt;&lt;div class=&quot;qno&quot;&gt;問題 01&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;生意怎麼賺錢？&lt;/div&gt;&lt;h2&gt;廣告仍占營收約 69%，雲端已成第二具引擎&lt;/h2&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;廣告仍是主體，雲端已是第二具引擎：第三季 Google 服務 963 億美元、年增 11%，Google 雲端 307 億、年增 103%，其他事業（Waymo 等）3.7 億仍虧損。&lt;/strong&gt;&lt;a class=&quot;term&quot; href=&quot;#g0&quot;&gt;近四季&lt;/a&gt;廣告約占 69%、雲端約 20%、訂閱與裝置約 11%&lt;span class=&quot;src&quot;&gt;（推算）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;最賺錢的搜尋正在放慢：搜尋年增由第二季 17% 降到第三季 12%，管理層承認 &lt;a class=&quot;term&quot; href=&quot;#g5&quot;&gt;AI 模式&lt;/a&gt;變現較低；雲端營業利益率則由 23.7% 升到 36.2%，利潤結構往雲端移。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;產品線營收占比（近四季，億美元；逐年金額與成長見下方明細表；數字取自原文表 10-K 2025-12-31 Item 8 ¶210，近四季為推算；圖的占比分母為圖中各線合計）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 480 280&quot; role=&quot;img&quot; aria-label=&quot;產品線營收&quot; class=&quot;chart&quot; style=&quot;max-width:624px&quot;&gt;&lt;path d=&quot;M240.0,52.0 A88,88 0 1 1 159.0,174.4 L190.3,161.1 A54,54 0 1 0 240.0,86.0 Z&quot; fill=&quot;var(--c1)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;Google 廣告：3,232（69%）&lt;/title&gt;&lt;/path&gt;&lt;path d=&quot;M159.0,174.4 A88,88 0 0 1 181.3,74.4 L204.0,99.7 A54,54 0 0 0 190.3,161.1 Z&quot; fill=&quot;var(--c2)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;Google 雲端：932（20%）&lt;/title&gt;&lt;/path&gt;&lt;path d=&quot;M181.3,74.4 A88,88 0 0 1 238.2,52.0 L238.9,86.0 A54,54 0 0 0 204.0,99.7 Z&quot; fill=&quot;var(--c6)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;訂閱、平台與裝置：532（11%）&lt;/title&gt;&lt;/path&gt;&lt;path d=&quot;M238.2,52.0 A88,88 0 0 1 240.0,52.0 L240.0,86.0 A54,54 0 0 0 238.9,86.0 Z&quot; fill=&quot;var(--muted)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;其他：15.3（&amp;lt;1%）&lt;/title&gt;&lt;/path&gt;&lt;polyline points=&quot;316.7,190.8 323.4,200.7 346.0,200.7&quot; fill=&quot;none&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;1&quot;/&gt;&lt;text x=&quot;354.0&quot; y=&quot;197.7&quot; class=&quot;lab&quot; text-anchor=&quot;start&quot;&gt;Google 廣告&lt;/text&gt;&lt;text x=&quot;354.0&quot; y=&quot;215.7&quot; class=&quot;val&quot; text-anchor=&quot;start&quot;&gt;69%&lt;tspan class=&quot;ax&quot; font-weight=&quot;400&quot;&gt;　3,232&lt;/tspan&gt;&lt;/text&gt;&lt;polyline points=&quot;150.2,119.9 142.4,116.0 134.0,116.0&quot; fill=&quot;none&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;1&quot;/&gt;&lt;text x=&quot;126.0&quot; y=&quot;113.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;Google 雲端&lt;/text&gt;&lt;text x=&quot;126.0&quot; y=&quot;131.0&quot; class=&quot;val&quot; text-anchor=&quot;end&quot;&gt;20%&lt;tspan class=&quot;ax&quot; font-weight=&quot;400&quot;&gt;　932&lt;/tspan&gt;&lt;/text&gt;&lt;polyline points=&quot;206.3,54.4 203.4,68.0 134.0,68.0&quot; fill=&quot;none&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;1&quot;/&gt;&lt;text x=&quot;126.0&quot; y=&quot;65.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;訂閱、平台與裝置&lt;/text&gt;&lt;text x=&quot;126.0&quot; y=&quot;83.0&quot; class=&quot;val&quot; text-anchor=&quot;end&quot;&gt;11%&lt;tspan class=&quot;ax&quot; font-weight=&quot;400&quot;&gt;　532&lt;/tspan&gt;&lt;/text&gt;&lt;polyline points=&quot;239.1,48.0 239.0,30.0 134.0,30.0&quot; fill=&quot;none&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;1&quot;/&gt;&lt;text x=&quot;126.0&quot; y=&quot;27.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;其他&lt;/text&gt;&lt;text x=&quot;126.0&quot; y=&quot;45.0&quot; class=&quot;val&quot; text-anchor=&quot;end&quot;&gt;&amp;lt;1%&lt;tspan class=&quot;ax&quot; font-weight=&quot;400&quot;&gt;　15.3&lt;/tspan&gt;&lt;/text&gt;&lt;text x=&quot;240.0&quot; y=&quot;136.0&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;近四季&lt;/text&gt;&lt;text x=&quot;240.0&quot; y=&quot;158.0&quot; class=&quot;val&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:18px&quot;&gt;4,710&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;產品線與業務線營收（10-K／10-Q 原文表格整理）&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;XBRL（SEC 財報的結構化資料格式；SEC 財報的結構化資料）只有 2022–2024 年產品線拆分，本表改用 2025 年 10-K 與 2026 年第三季 10-Q 附註；近四季＝2025 年＋前九月－去年前九月&lt;span class=&quot;src&quot;&gt;（推算）&lt;/span&gt;，單位億美元。&lt;/p&gt;&lt;p&gt;雲端成長最快（2025 年 +35.8%、第三季 +102.6%），占營收由 2023 年約 11% 升到約 20%；聯播網是廣告三條線中唯一萎縮的。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;figure&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt signals&quot;&gt;&lt;tr&gt;&lt;th&gt;產品線&lt;/th&gt;&lt;th&gt;2025&lt;/th&gt;&lt;th&gt;近四季（推算）&lt;/th&gt;&lt;th&gt;2025 年增&lt;/th&gt;&lt;th&gt;第三季年增&lt;/th&gt;&lt;th&gt;占近四季&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;搜尋與其他（Google Search &amp;amp; other）&lt;/td&gt;&lt;td&gt;2,245&lt;/td&gt;&lt;td&gt;2,501&lt;/td&gt;&lt;td&gt;+13.4%&lt;/td&gt;&lt;td&gt;+12.0%&lt;/td&gt;&lt;td&gt;53%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;YouTube（Google 旗下影音平台）廣告&lt;/td&gt;&lt;td&gt;404&lt;/td&gt;&lt;td&gt;435&lt;/td&gt;&lt;td&gt;+11.7%&lt;/td&gt;&lt;td&gt;+9.2%&lt;/td&gt;&lt;td&gt;9%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;聯播網（Google Network）&lt;/td&gt;&lt;td&gt;298&lt;/td&gt;&lt;td&gt;296&lt;/td&gt;&lt;td&gt;−1.9%&lt;/td&gt;&lt;td&gt;+1.4%&lt;/td&gt;&lt;td&gt;6%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;訂閱、平台與裝置&lt;/td&gt;&lt;td&gt;480&lt;/td&gt;&lt;td&gt;532&lt;/td&gt;&lt;td&gt;+19.1%&lt;/td&gt;&lt;td&gt;+11.0%&lt;/td&gt;&lt;td&gt;11%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Google 雲端（Google Cloud）&lt;/td&gt;&lt;td&gt;587&lt;/td&gt;&lt;td&gt;932&lt;/td&gt;&lt;td&gt;+35.8%&lt;/td&gt;&lt;td&gt;+102.6%&lt;/td&gt;&lt;td&gt;20%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;其他事業（Other Bets）&lt;/td&gt;&lt;td&gt;15&lt;/td&gt;&lt;td&gt;15&lt;/td&gt;&lt;td&gt;−6.7%&lt;/td&gt;&lt;td&gt;+8.1%&lt;/td&gt;&lt;td&gt;0%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;合計（含避險損益）&lt;/td&gt;&lt;td&gt;4,028&lt;/td&gt;&lt;td&gt;4,711&lt;/td&gt;&lt;td&gt;+15.1%&lt;/td&gt;&lt;td&gt;+24.7%&lt;/td&gt;&lt;td&gt;100%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;白話說&lt;/b&gt;每 100 美元近四季營收（推算）：搜尋 53、YouTube 9、聯播網 6、訂閱與裝置 11、雲端 20。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;要留意&lt;/b&gt;搜尋最賺錢；AI 改變找資訊方式而變現追不上，成長會先放慢，見改判訊號。&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;產品線營收明細（億美元；占比為最近財年，分母為各線合計；數字取自原文表 10-K 2025-12-31 Item 8 ¶210，近四季為推算）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;產品線&lt;/th&gt;&lt;th&gt;FY23&lt;/th&gt;&lt;th&gt;FY24&lt;/th&gt;&lt;th&gt;FY25&lt;/th&gt;&lt;th&gt;近四季&lt;/th&gt;&lt;th&gt;最近財年年增&lt;/th&gt;&lt;th&gt;占比&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Google 廣告&lt;/td&gt;&lt;td&gt;2,379&lt;/td&gt;&lt;td&gt;2,646&lt;/td&gt;&lt;td&gt;2,947&lt;/td&gt;&lt;td&gt;3,232&lt;/td&gt;&lt;td&gt;11.4%&lt;/td&gt;&lt;td&gt;73%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Google 雲端&lt;/td&gt;&lt;td&gt;331&lt;/td&gt;&lt;td&gt;432&lt;/td&gt;&lt;td&gt;587&lt;/td&gt;&lt;td&gt;932&lt;/td&gt;&lt;td&gt;35.8%&lt;/td&gt;&lt;td&gt;15%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;訂閱、平台與裝置&lt;/td&gt;&lt;td&gt;347&lt;/td&gt;&lt;td&gt;403&lt;/td&gt;&lt;td&gt;480&lt;/td&gt;&lt;td&gt;532&lt;/td&gt;&lt;td&gt;19.1%&lt;/td&gt;&lt;td&gt;12%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;其他事業&lt;/td&gt;&lt;td&gt;15&lt;/td&gt;&lt;td&gt;16&lt;/td&gt;&lt;td&gt;15&lt;/td&gt;&lt;td&gt;15&lt;/td&gt;&lt;td&gt;-6.7%&lt;/td&gt;&lt;td&gt;0%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;business-profile&quot;&gt;&lt;h3&gt;生意介紹：年報重點&lt;/h3&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;Alphabet 是搜尋與 YouTube 廣告公司，正在變成廣告加雲端與 AI 算力的雙引擎公司。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;賣什麼&lt;/p&gt;&lt;h4&gt;三塊生意：廣告為主，雲端與 TPU 加速&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;Google 服務賣搜尋、YouTube 與聯播網廣告，加上 YouTube 訂閱、Pixel 等裝置；Google 雲端賣運算基礎設施、AI 模型 API（應用程式介面）與 &lt;a class=&quot;term&quot; href=&quot;#g3&quot;&gt;TPU&lt;/a&gt; 系統；其他事業以 Waymo 自動駕駛為主，收入主要來自自動駕駛與網路服務&lt;span class=&quot;src&quot;&gt;（10-K 2025 Item 1 ¶53）&lt;/span&gt;。&lt;/strong&gt;公司說加入 AI Overviews（搜尋結果頁的 AI 摘要）與 AI Mode 後變現方式可能不同，會影響成長率與利潤率&lt;span class=&quot;src&quot;&gt;（10-K 2025 Item 7 ¶9）&lt;/span&gt;。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;誰付錢、怎麼賣&lt;/p&gt;&lt;h4&gt;付錢的是廣告主、企業與消費者，沒有大客戶依賴&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;廣告主按點擊或曝光付費，企業與開發者付雲端與 API 費用，消費者付訂閱與裝置。&lt;/strong&gt;沒有單一客戶或關係企業群占營收 10% 以上&lt;span class=&quot;src&quot;&gt;（10-K 2025 Item 8 ¶211）&lt;/span&gt;；應收帳款多為無擔保&lt;span class=&quot;src&quot;&gt;（Item 8 ¶143）&lt;/span&gt;。&lt;a class=&quot;term&quot; href=&quot;#g2&quot;&gt;營收積壓&lt;/a&gt;含與關聯方 Crux AI（Blackstone 與 Google 的 TPU 雲端合資）多年合約 168 億&lt;span class=&quot;src&quot;&gt;（10-Q 2026-09-30 Item 1 ¶119）&lt;/span&gt;，是少見的集中點。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;營收結構：誰在拉動&lt;/p&gt;&lt;h4&gt;雲端在拉動，搜尋在放慢&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;近四季廣告約 69%、雲端約 20%、訂閱平台與裝置約 11%&lt;span class=&quot;src&quot;&gt;（推算，見產品線表）&lt;/span&gt;。&lt;/strong&gt;第三季營收多出約 252 億中，雲端 156 億、Google 服務 93 億&lt;span class=&quot;src&quot;&gt;（8-K 2026-10-28 新聞稿）&lt;/span&gt;；搜尋與其他年增 12%&lt;span class=&quot;src&quot;&gt;（10-Q 2026-09-30 Item 2 ¶115–117）&lt;/span&gt;。判讀：成長越來越靠資本密集的雲端。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;市場、地區與重點專案&lt;/p&gt;&lt;h4&gt;美國占比上升；重點專案是資料中心與 Waymo&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;2025 年美國占營收 48%、歐洲中東非洲 29%、亞太 17%&lt;span class=&quot;src&quot;&gt;（10-K 2025 Item 7 ¶147）&lt;/span&gt;；2026 年第三季美國升到 53%、歐洲中東非洲 26%、亞太 16%，美國年增約 39%、歐洲中東非洲約 9%，拉動的是美國&lt;span class=&quot;src&quot;&gt;（10-Q 2026-09-30 Item 1 ¶116；8-K 2026-10-28 新聞稿 §36）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;最大專案是資料中心：公司說建設是多年多階段工程，2026 年&lt;a class=&quot;term&quot; href=&quot;#g8&quot;&gt;資本支出&lt;/a&gt;指引 1,950～2,050 億、2027 年顯著增加&lt;span class=&quot;src&quot;&gt;（10-Q Item 2 ¶203；新聞 N3）&lt;/span&gt;，個別地點與規模未揭露&lt;span class=&quot;src&quot;&gt;（查過 10-K Item 1、Item 7）&lt;/span&gt;。&lt;/strong&gt;Waymo 在美國 15 個大城市營運，計畫進入加拿大、德國、新加坡與西班牙（公司說法，新聞 N1 §11）。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;跟誰競爭&lt;/p&gt;&lt;h4&gt;搜尋入口仍穩，雲端是三強競爭&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;10-K 列的對手橫跨通用搜尋與資訊服務、垂直搜尋與電商、線上廣告平台、內容平台與企業雲端&lt;span class=&quot;src&quot;&gt;（10-K 2025 Item 1 ¶55–61）&lt;/span&gt;。&lt;/strong&gt;外部證據：Statcounter 2026 年 9 月全球搜尋市占約 89.9%，但 ChatGPT（OpenAI 的聊天機器人）與 Gemini（Google 的 AI 模型與助理）用戶都在增加（新聞 N13）。我們的判讀：搜尋入口仍穩，雲端與微軟、亞馬遜同樣大舉投資（見第二題）。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;管理層怎麼說&lt;/p&gt;&lt;h4&gt;公司說 AI 帶動查詢量，但搜尋營收成長仍在放慢&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;公司說法：營收年增 25%，AI 投資讓搜尋查詢量年增率達五年最高，雲端年增 103%，TPU 系統需求強，Gemini app（應用程式）用戶達 10 億&lt;span class=&quot;src&quot;&gt;（8-K 2026-10-28 新聞稿 §2–3）&lt;/span&gt;。&lt;/strong&gt;和實績對照：營收與雲端數字與 10-Q 一致，但搜尋與其他年增由第二季 17% 降到 12%，查詢量成長還沒轉成同速營收&lt;span class=&quot;src&quot;&gt;（10-Q Item 2 ¶115–117）&lt;/span&gt;。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;年報列的主要風險&lt;/p&gt;&lt;h4&gt;四條和本報告最相關的年報風險&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;①AI 正在改變廣告業，公司不保證能及時調整廣告形式&lt;span class=&quot;src&quot;&gt;（10-K 2025 Item 1A ¶6）&lt;/span&gt;；②各業務對手眾多，可能持續重投基礎設施與人才&lt;span class=&quot;src&quot;&gt;（¶22）&lt;/span&gt;；③AI 加速器供應競爭激烈，長期採購合約可能留下用不完的成本&lt;span class=&quot;src&quot;&gt;（¶44）&lt;/span&gt;；④其他事業如自動駕駛、生命科學可能無法獲利&lt;span class=&quot;src&quot;&gt;（¶18）&lt;/span&gt;。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;moat&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;護城河與成長故事&lt;/p&gt;&lt;h3&gt;護城河仍深，受考驗的是 AI 模式變現與反壟斷補救&lt;/h3&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;護城河有三層：搜尋入口&lt;span class=&quot;src&quot;&gt;（citybiz 轉述 Statcounter 2026 年 9 月全球市占約 89.9%（網頁造訪口徑）；Yelp，美國在地商家評論網站、Angi、CarGurus 年報都寫依賴 Google 導流）&lt;/span&gt;、廣告效率、算力（雲端積壓 5,608 億、自研 TPU）。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;受考驗處：AI 模式變現低於傳統搜尋，搜尋年增由 17% 降到 12%；Yelp 年報指出 AI 回答放在自然結果上方。&lt;/strong&gt;廣告科技案法院駁回分拆、改命行為補救（最終判決未出；PPC Land 解讀為六年期），搜尋案限制分發並要求分享資料、雙方上訴中。2026 年資本支出指引 1,950～2,050 億，2027 年再增加。&lt;/p&gt;&lt;p&gt;成長跑道：雲端空間有積壓支撐&lt;span class=&quot;src&quot;&gt;（約近四季營收 6 倍，推導）&lt;/span&gt;，搜尋量價同增仍有定價能力，增量營業利益率高於平均；但公司只給資本支出指引，2026 年成長投資靠外部融資（六項明細見計算底稿 5）。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;護城河來源：證據、威脅與失效條件&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;優勢來源&lt;/th&gt;&lt;th&gt;證據&lt;/th&gt;&lt;th&gt;威脅&lt;/th&gt;&lt;th&gt;什麼情況代表失效&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;搜尋入口與網路效應&lt;/td&gt;&lt;td&gt;Statcounter（網路流量統計機構）全球約 89.9%（2026-0&lt;/td&gt;&lt;td&gt;AI 聊天工具改變找資訊方式；AI &lt;/td&gt;&lt;td&gt;搜尋與其他年增連兩季低於 8%，或 Statcoun&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;雲端與 AI 算力（TPU）&lt;/td&gt;&lt;td&gt;雲端第三季 +103%、營業利益率 36.2%；積壓 5&lt;/td&gt;&lt;td&gt;資本密集、同業同樣大舉投資；夥伴交付&lt;/td&gt;&lt;td&gt;雲端年增連兩季低於 50%，或積壓季減&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;資料與廣告效率&lt;/td&gt;&lt;td&gt;Google 服務營業利益率 40.7%（去年同期 38&lt;/td&gt;&lt;td&gt;隱私法規、AI 改變廣告形式；廣告科技行為補救&lt;/td&gt;&lt;td&gt;營業利益率連續下滑而搜尋成長放緩&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;supply&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;供應鏈與生產地&lt;/p&gt;&lt;h3&gt;硬體全委外，TPU 靠 Broadcom（美國半導體公司）與 Celestica（電子代工製造商）&lt;/h3&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;實體供應鏈服務資料中心與消費硬體；10-Q 說明存貨由第三方代工廠製造，各國生產比例與代工廠名稱未揭露，不補值。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;TPU：Broadcom 揭露長期開發供應協議，Celestica 在美國擴產支援（預計 2027 年完成）。&lt;/strong&gt;另有能源設備保證最高 162 億、TPU 回購保證最高 66 億。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;grid2 wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;International：占全部營收 vs 占全部長期資產&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 280&quot; role=&quot;img&quot; aria-label=&quot;地區占比&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;246.0&quot; y2=&quot;246.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;250.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;0%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;190.0&quot; y2=&quot;190.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;194.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;10%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;134.0&quot; y2=&quot;134.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;138.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;20%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;78.0&quot; y2=&quot;78.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;82.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;30%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;22.0&quot; y2=&quot;22.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;26.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;40%&lt;/text&gt;&lt;text x=&quot;72.0&quot; y=&quot;268&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY22&lt;/text&gt;&lt;text x=&quot;218.0&quot; y=&quot;268&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY23&lt;/text&gt;&lt;text x=&quot;364.0&quot; y=&quot;268&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY24&lt;/text&gt;&lt;text x=&quot;510.0&quot; y=&quot;268&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY25&lt;/text&gt;&lt;polyline points=&quot;72.0,246.0 218.0,246.0 364.0,246.0 510.0,246.0&quot; fill=&quot;none&quot; stroke=&quot;var(--c2)&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;circle cx=&quot;72.0&quot; cy=&quot;246.0&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c2)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;占營收 FY22：0%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;218.0&quot; cy=&quot;246.0&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c2)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;占營收 FY23：0%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;364.0&quot; cy=&quot;246.0&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c2)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;占營收 FY24：0%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;510.0&quot; cy=&quot;246.0&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c2)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;占營收 FY25：0%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;518.0&quot; y=&quot;250.0&quot; class=&quot;val&quot; fill=&quot;var(--c2)&quot;&gt;0%&lt;/text&gt;&lt;polyline points=&quot;72.0,79.6 218.0,86.0 364.0,107.6 510.0,103.8&quot; fill=&quot;none&quot; stroke=&quot;var(--neg)&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;circle cx=&quot;72.0&quot; cy=&quot;79.6&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--neg)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;占長期資產 FY22：30%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;218.0&quot; cy=&quot;86.0&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--neg)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;占長期資產 FY23：29%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;364.0&quot; cy=&quot;107.6&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--neg)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;占長期資產 FY24：25%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;510.0&quot; cy=&quot;103.8&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--neg)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;占長期資產 FY25：25%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;518.0&quot; y=&quot;107.8&quot; class=&quot;val&quot; fill=&quot;var(--neg)&quot;&gt;25%&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c2)&quot;&gt;&lt;/i&gt;占營收&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--neg)&quot;&gt;&lt;/i&gt;占長期資產&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;growth&quot;&gt;&lt;div class=&quot;qno&quot;&gt;問題 02&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;還在成長嗎？&lt;/div&gt;&lt;h2&gt;在加速：近四季 +22%，靠雲端，用大量投資換來&lt;/h2&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;成長在加速：年度營收 2023 年 +8.7%、2024 年 +13.9%、2025 年 +15.1%，單季年增由 2026 年第一季 +21.8% 升到第三季 +24.7%，近四季 4,711 億（+22.2%）。&lt;/p&gt;&lt;p&gt;成長主要來自雲端的量：第三季多出約 252 億中雲端 156 億、Google 服務 93 億；搜尋付費點擊 +8%、每次點擊成本 +4%，量價同增（拆解見「成長來源」）。&lt;/p&gt;&lt;p&gt;成長品質仍好但在下降：近四季&lt;a class=&quot;term&quot; href=&quot;#g6&quot;&gt;投入資本報酬率&lt;/a&gt;約 37%，遠高於資金成本約 9.5%；&lt;a class=&quot;term&quot; href=&quot;#g7&quot;&gt;增量 ROIC&lt;/a&gt; 由 2023–2025 年約 28% 降到近四季約 17%&lt;span class=&quot;src&quot;&gt;（推算）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;反方：Google 服務只剩約 11% 成長；市價要求未來 5 年營收年增約 16.4%&lt;span class=&quot;src&quot;&gt;（市價反推未來 5 年營收年增；市價 295.77 美元、收盤 2026-11-13；折現率 9.53%；推導）&lt;/span&gt;，高於本報告基準的 5 年年複合約 12.9%&lt;span class=&quot;src&quot;&gt;（推算）&lt;/span&gt;，接近同類公司次年成長第 75 百分位 17.7%。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;毛利率與營業利益率&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 280&quot; role=&quot;img&quot; aria-label=&quot;利潤率&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;246.0&quot; y2=&quot;246.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;250.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;20%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;201.2&quot; y2=&quot;201.2&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;205.2&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;30%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;156.4&quot; y2=&quot;156.4&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;160.4&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;40%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;111.6&quot; y2=&quot;111.6&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;115.6&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;50%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;66.8&quot; y2=&quot;66.8&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;70.8&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;60%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;22.0&quot; y2=&quot;22.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;26.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;70%&lt;/text&gt;&lt;text x=&quot;72.0&quot; y=&quot;268&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY22&lt;/text&gt;&lt;text x=&quot;181.5&quot; y=&quot;268&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY23&lt;/text&gt;&lt;text x=&quot;291.0&quot; y=&quot;268&quot; class=&quot;ax&quot; text-anc 營收的 6.0 倍&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;；搜尋付費點擊年增 8%。&lt;/strong&gt;價：每次點擊成本年增 4%，聯播網曝光年減 14%。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;新產品：TPU 系統開始對外銷售，部分附回購選擇權（見第三題）；新市場：第三季美國年增約 39%、歐洲中東非洲約 9%。&lt;/strong&gt;併購：Wiz（多雲與 AI 資安公司，2026 年 3 月以 295 億美元併入雲端分部）2026 年 3 月併入雲端，貢獻未揭露。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;figure&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt signals&quot;&gt;&lt;tr&gt;&lt;th&gt;來源&lt;/th&gt;&lt;th&gt;證據&lt;/th&gt;&lt;th&gt;期間&lt;/th&gt;&lt;th&gt;出處&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;量（雲端）&lt;/td&gt;&lt;td&gt;雲端營收 +103%（+156 億）&lt;/td&gt;&lt;td&gt;2026 第三季&lt;/td&gt;&lt;td&gt;8-K 2026-10-28 新聞稿&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;量（搜尋）&lt;/td&gt;&lt;td&gt;付費點擊 +8%&lt;/td&gt;&lt;td&gt;2026 第三季&lt;/td&gt;&lt;td&gt;10-Q Item 2 ¶117&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;價&lt;/td&gt;&lt;td&gt;每次點擊成本 +4%&lt;/td&gt;&lt;td&gt;2026 第三季&lt;/td&gt;&lt;td&gt;10-Q Item 2 ¶117&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;新產品&lt;/td&gt;&lt;td&gt;TPU 系統對外銷售&lt;/td&gt;&lt;td&gt;2026 年起&lt;/td&gt;&lt;td&gt;10-Q；新聞 N7&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;新市場&lt;/td&gt;&lt;td&gt;美國 +39%、歐洲中東非洲 +9%&lt;/td&gt;&lt;td&gt;2026 第三季&lt;/td&gt;&lt;td&gt;8-K 新聞稿 §36&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;併購&lt;/td&gt;&lt;td&gt;Wiz 併入雲端，貢獻未揭露&lt;/td&gt;&lt;td&gt;2026-03 起&lt;/td&gt;&lt;td&gt;10-Q&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;投入與回報：研發與資本支出換到了什麼&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;研發由 2022 年 395 億增到近四季 745 億（占營收約 14%–16%）；資本支出由 315 億增到近四季 1,598 億，占營收由 11% 升到約 34%。&lt;/strong&gt;2022→2025 年每多花 1 元研發，毛利約多 3.9 元；2025 年→近四季約 3.5 元，只看投入與成果同向，不代表因果。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;同業資本支出占營收&lt;span class=&quot;src&quot;&gt;（yfinance 近四季口徑）&lt;/span&gt;：微軟約 39.2%、Meta（Facebook 母公司）約 43.2%、亞馬遜約 25.2%，同屬大舉投資的一群。&lt;/strong&gt; ss=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c4)&quot;&gt;&lt;/i&gt;淨利&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c1)&quot;&gt;&lt;/i&gt;營運現金流&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c2)&quot;&gt;&lt;/i&gt;自由現金流&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;錢從哪一層開始不夠：現金流分層&lt;/h3&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;現金流分層（近四季，至 2026-09-30）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;層次&lt;/th&gt;&lt;th&gt;金額&lt;/th&gt;&lt;th&gt;正負&lt;/th&gt;&lt;th&gt;完整度&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;一、營運現金流&lt;/td&gt;&lt;td&gt;1,796 億美元&lt;/td&gt;&lt;td&gt;正&lt;/td&gt;&lt;td&gt;完整&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;二、一般資本支出後&lt;/td&gt;&lt;td&gt;197 億美元&lt;/td&gt;&lt;td&gt;正&lt;/td&gt;&lt;td&gt;完整&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;三、回購與股利後&lt;/td&gt;&lt;td&gt;31.4 億美元&lt;/td&gt;&lt;td&gt;正&lt;/td&gt;&lt;td&gt;完整&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;延伸：再扣併購與員工代扣稅&lt;/td&gt;&lt;td&gt;已知部分 31.4 億美元&lt;/td&gt;&lt;td&gt;無法判定&lt;/td&gt;&lt;td&gt;缺併購、員工股票代扣稅&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;數值正負不等於安全或危險：第二層為負代表所列投入超過當期營運現金，不等於營業虧損；資本支出尚未區分維持與擴張。&lt;/p&gt;&lt;p class=&quot;cap&quot;&gt;（算法與完整表見&lt;a href=&quot;#wp-3-4&quot;&gt;計算底稿 3・4&lt;/a&gt;）&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;白話說&lt;/b&gt;每 100 美元稅後營業利益，近四季收到約 140 美元營運現金，約 124 美元又花在資本支出，剩約 15 美元自由現金流。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;要留意&lt;/b&gt;連兩季營運現金流高於資本支出，現金品質才上修，見改判訊號。&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;shareholders&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;股東實際拿到什麼？&lt;/p&gt;&lt;h3&gt;回饋大幅縮減：2026 年停止回購，改為發股與發債&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;回饋大幅縮減：近四季&lt;a class=&quot;term&quot; href=&quot;#g16&quot;&gt;股東收益率&lt;/a&gt; 0.5%（股利 0.3%、回購 0.2%），扣股權薪酬後淨回購殖利率 -0.7%（回購扣股權薪酬；收盤 2026-11-13）；2026 前九月回購為 0，近四季回購 59 億全在 2025 年第四季。&lt;/strong&gt;每股自由現金流由 2025 年約 5.99 美元降到約 1.61 美元，扣股權薪酬約 −0.87 美元&lt;span class=&quot;src&quot;&gt;（推算）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;股數 2026 年轉為增加：流通股由 2025 年底 12,088 百萬股增到 9 月底 12,294 百萬股（+1.7%）；稀釋股數 2025 財年對上一財年 -1.7%（近一財年；股數期間 2022–2025）。&lt;/strong&gt;另有 2029 年轉普通股的&lt;a class=&quot;term&quot; href=&quot;#g18&quot;&gt;強制轉換特別股&lt;/a&gt;（清算優先 192.5 億）；財務長說除支應股權薪酬稅負的 ATM（依市價分批增資）外暫不再發股，是公司說法，不是承諾。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;每股自由現金流（美元）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 300&quot; role=&quot;img&quot; aria-label=&quot;每股自由現金流&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;266.0&quot; y2=&quot;266.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;270.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;-2.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;217.6&quot; y2=&quot;217.6&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;221.6&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;0.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;169.2&quot; y2=&quot;169.2&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;173.2&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;2.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;120.8&quot; y2=&quot;120.8&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;124.8&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;4.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;72.4&quot; y2=&quot;72.4&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;76.4&quot; class=&quot;ax&quot; text-anchor=&quot;end&qu 45.0&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;每股自由現金流 FY25：6.0&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;393.6&quot; y=&quot;122.0&quot; width=&quot;32.2&quot; height=&quot;95.6&quot; rx=&quot;2&quot; fill=&quot;var(--c4)&quot;&gt;&lt;title&gt;扣除股權薪酬後 FY25：4.0&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;393.6&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY25&lt;/text&gt;&lt;rect x=&quot;457.0&quot; y=&quot;178.7&quot; width=&quot;32.2&quot; height=&quot;38.9&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;每股自由現金流 近四季：1.6&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;491.2&quot; y=&quot;217.6&quot; width=&quot;32.2&quot; height=&quot;21.0&quot; rx=&quot;2&quot; fill=&quot;var(--c4)&quot;&gt;&lt;title&gt;扣除股權薪酬後 近四季：-0.9&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;491.2&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;近四季&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c1)&quot;&gt;&lt;/i&gt;每股自由現金流&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c4)&quot;&gt;&lt;/i&gt;扣除股權薪酬後&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;白話說&lt;/b&gt;你有 100 股，公司 2026 年發新股讓流通股到 9 月底多了約 1.7%，你的持股比例也被稀釋同幅度。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;要留意&lt;/b&gt;新發普通股或可轉換證券使流通股再增加超過 1%，下修每股價值判斷；恢復淨回購連兩季則上修，見改判訊號。&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;股東回報與市價隱含報酬拆解&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;和公債比：股東收益率 0.5%，約為 2026-11-13 的 10 年期公債 5.15% 的一成，屬主要靠成長。&lt;/strong&gt;基準情境成真時的現價隱含年報酬約 7.9%&lt;span class=&quot;src&quot;&gt;（基準情境成真時、以收盤 2026-11-13 股價買進的推算年報酬；條件式，非預期報酬、非買賣建議）&lt;/span&gt;＝股利 0.3%＋回購 0.2%＋每股成長與其他 7.5%&lt;span class=&quot;src&quot;&gt;（推算，假設倍數不變）&lt;/span&gt;，幾乎全押在 AI 投資能把每股價值做大。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;回報品質：近十年每年都有回購，但近四季回購 59 億少於股權薪酬 304 億，淨回購為負（警示）；股利 2025 年每股 0.83 美元。&lt;/strong&gt;回購不到市值 0.2%，依政策不判斷回購均價。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;現價隱含年報酬（基準情境，非預期報酬）從哪裡來：股利、回購是現在拿到的現金，其餘要靠每股成長（紅色虛線為 10 年期美國公債 5.15%）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 500 196&quot; role=&quot;img&quot; aria-label=&quot;市價隱含報酬拆解&quot; class=&quot;chart&quot; style=&quot;max-width:650px&quot;&gt;&lt;line x1=&quot;250.0&quot; x2=&quot;250.0&quot; y1=&quot;24&quot; y2=&quot;192&quot; class=&quot;zero&quot;/&gt;&lt;line x1=&quot;366.3&quot; x2=&quot;366.3&quot; y1=&quot;22&quot; y2=&quot;192&quot; class=&quot;price&quot;/&gt;&lt;text x=&quot;366.3&quot; y=&quot;16&quot; class=&quot;pricelab&quot; text-anchor=&quot;middle&quot;&gt;公債 5.15%&lt;/text&gt;&lt;text x=&quot;240&quot; y=&quot;55.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;股利殖利率&lt;/text&gt;&lt;rect x=&quot;250.0&quot; y=&quot;40.0&quot; width=&quot;6.6&quot; height=&quot;20&quot; rx=&quot;4&quot; fill=&quot;var(--c2)&quot;&gt;&lt;title&gt;股利殖利率：0.29%&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;264.6&quot; y=&quot;55.0&quot; class=&quot;val&quot;&gt;0.29%&lt;/text&gt;&lt;line x1=&quot;256.6&quot; x2=&quot;256.6&quot; y1=&quot;60.0&quot; y2=&quot;80.0&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;1&quot; stroke-dasharray=&quot;2 3&quot;/&gt;&lt;text x=&quot;240&quot; y=&quot;95.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;回購殖利率&lt;/text&gt;&lt;rect x=&quot;256.6&quot; y=&quot;80.0&quot; width=&quot;3.6&quot; height=&quot;20&quot; rx=&quot;4&quot; fill=&quot;var(--c6)&quot;&gt;&lt;title&gt;回購殖利率：+0.16%&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;268.3&quot; y=&quot;95.0&quot; class=&quot;val&quot;&gt;+0.16%&lt;/text&gt;&lt;line x1=&quot;260.3&quot; x2=&quot;260.3&quot; y1=&quot;100.0&quot; y2=&quot;120.0&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;1&quot; stroke-dasharray=& t;收盤價&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c3)&quot;&gt;&lt;/i&gt;200 日均線&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--pos)&quot;&gt;&lt;/i&gt;合理價值區間&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c7)&quot;&gt;&lt;/i&gt;同業與歷史倍數（交叉核對，不進評等）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;流動性、空單與參考值的資料日期與存檔（算法與完整表見&lt;a href=&quot;#wp-mkt&quot;&gt;計算底稿 市場背景&lt;/a&gt;）。&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;valuation&quot;&gt;&lt;div class=&quot;qno&quot;&gt;問題 05&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;現在的價格貴不貴？&lt;/div&gt;&lt;h2&gt;價格偏貴：295.77 美元 高於合理價值上緣&lt;/h2&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;價格偏貴：2026-11-13 收盤 295.77 美元 高於合理價值 187.16–261.22 美元 的上緣，價格位置為「偏貴」。&lt;/strong&gt;中點 227.92 美元 是三情境加權（保守 25%、基準 50%、樂觀 25%）；基準成真時的現價隱含年報酬約 7.9%&lt;span class=&quot;src&quot;&gt;（基準情境成真時、以收盤 2026-11-13 股價買進的推算年報酬；條件式，非預期報酬、非買賣建議）&lt;/span&gt;，低於資金成本 9.5%。買入區上緣為 136.75 美元，現價離它很遠。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;基準情境的故事是雲端撐住成長、投資高峰兩年後回收：營收年增由 20% 逐年降到 8%，營業利益率維持約 31%–32%；高峰期每 1 元新增投入資本只換到約 0.5 元新增營收，第 5 年回到過去長期約 1 元。&lt;/strong&gt;約 53% 的價值來自明確預測期之後。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;反方與限制：市價要求未來 5 年營收年增約 16.4%&lt;span class=&quot;src&quot;&gt;（市價反推未來 5 年營收年增；市價 295.77 美元、收盤 2026-11-13；折現率 9.53%；推導）&lt;/span&gt;&lt;span class=&quot;src&quot;&gt;（或利潤率約 41.4%（市價反推第 1 年起每年固定的營業利益率，含穩態；市價 295.77 美元、收盤 2026-11-13；折現率 9.53%；推導），擇一）&lt;/span&gt;，只有樂觀情境做得到。&lt;/strong&gt;若改用公版預設產業 Information Services（資訊服務業），合理價值中點約 +10.6%&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;，價格位置會由偏貴變合理；本報告因業務與資本密度不可比而不採。其他三項作者判斷各影響中點 3.4% 以內（見計算底稿）。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;現價隱含年報酬（各情境成真時，非預期報酬）；紅色虛線為公債殖利率 5.15%。基準情境下，現價隱含的年報酬只比公債高 2.8 個百分點，模型的加權資本成本（基準）比公債高 4.4 個百分點，兩者的差距對應市價與合理價值的落差&lt;/p&gt;&lt;svg viewBox=&quot;0 0 500 gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;scenario-plain&quot;&gt;&lt;h3&gt;合理價值怎麼來：三個情境&lt;/h3&gt;&lt;p&gt;合理價值是三個情境每股價值的加權：中點 227.92 美元，換不同折現率重算後的區間 187.16–261.22 美元；買入區上緣 136.75 美元是中點再打 40% 安全邊際折扣（股價在此以下才有這個安全邊際）。情境表說明合理價值怎麼組成，不是單一目標價；非買賣建議。&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt&quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;每股價值（美元）&lt;/th&gt;&lt;th&gt;權重&lt;/th&gt;&lt;th&gt;這個情境假設什麼&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;119.36&lt;/td&gt;&lt;td&gt;25%&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;營收年增 +12.0% 逐步到 +4.0%；營業利益率 30.0%，長期 25.0%；之後每年成長 2.5%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;212.81&lt;/td&gt;&lt;td&gt;50%&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;營收年增 +20.0% 逐步到 +8.0%；營業利益率 32.0%，長期 31.0%；之後每年成長 3.0%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;366.72&lt;/td&gt;&lt;td&gt;25%&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;營收年增 +27.0% 逐步到 +10.0%；營業利益率 33.0%，長期 39.0%；之後每年成長 3.5%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;（算法與完整表見&lt;a href=&quot;#wp-5&quot;&gt;計算底稿 5&lt;/a&gt;）&lt;/p&gt;&lt;/div&gt;&lt;!--新圖表--&gt;&lt;div class=&quot;wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;三情境路徑：左為營收（億美元）、右為營業利益率；實線為實績，虛線為模型三情境第 1～15 年（估值結果 dcf 逐年列；起點為近四季，估值基期營收 4,711 億美元）。只描述模型假設，不是預測&lt;/p&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div&gt;&lt;svg viewBox=&quot;0 0 520 280&quot; role=&quot;img&quot; aria-label=&quot;三情境營收路徑&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;56&quot; x2=&quot;476&quot; y1=&quot;246.0&quot; y2=&quot;246.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;48&quot; y=&quot;250.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;0.0&lt;/text&gt;&lt;line x1=&quot;56&quot; x2=&quot;476&quot; y1=&quot;200.4&quot; y2=&quot;200.4&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;48&quot; y=&quot;204.4&
