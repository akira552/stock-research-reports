xt-anchor=&quot;end&quot;&gt;A5 業務費用效率變差&lt;/text&gt;&lt;line x1=&quot;254.3&quot; x2=&quot;254.1&quot; y1=&quot;261.0&quot; y2=&quot;261.0&quot; stroke=&quot;var(--pos)&quot; stroke-width=&quot;3&quot;/&gt;&lt;circle cx=&quot;254.1&quot; cy=&quot;261.0&quot; r=&quot;6&quot; fill=&quot;var(--pos)&quot;&gt;&lt;title&gt;A5 業務費用效率變差：-0.1 點，門檻 &gt; +1.0 點&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;263.1&quot; y=&quot;252.0&quot; class=&quot;vl s&quot; text-anchor=&quot;start&quot; fill=&quot;var(--pos)&quot;&gt;-0.1 點&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;lg&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--neg)&quot;&gt;&lt;/i&gt;亮燈&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--pos)&quot;&gt;&lt;/i&gt;未亮&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--neg)&quot;&gt;&lt;/i&gt;亮燈門檻（虛線）&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;G4 另有條件「營收近四季年增低於一年前」：本期 22.2%、比較期 13.4%，兩個條件都成立才亮燈（目前未亮）。&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;A4 另有條件「單季營收年增低於去年同期」：本期 24.6%、比較期 16.0%，兩個條件都成立才亮燈（目前未亮）。&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;每列一個用財報數字算的訊號：點是目前值，虛線是門檻，點落進淡紅色帶就亮燈；看離門檻還有多少餘裕。是非題型訊號（如連續放緩）不在此圖，見上方燈號。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估、門檻、比較）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;div class=&quot;sub-h&quot;&gt;機械訊號（財報數字算得出）&lt;/div&gt;&lt;div class=&quot;cards&quot;&gt;&lt;div class=&quot;card sig&quot; id=&quot;sig-G1&quot; style=&quot;--tc:var(--lt-未亮, var(--muted))&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;G1　營收增速連續放緩&lt;/b&gt;&lt;span class=&quot;light l-未亮&quot;&gt;未亮&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;成長是不是一季比一季慢？&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;值&lt;/div&gt;&lt;div class=&quot;sv&quot;&gt;否&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;機械值，期末 2026-09-30；門檻  &lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;判讀&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;近四季單季營收年增 18.0%、21.8%、24.2%、24.7% 逐季加速，未出現連續放緩。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src29&quot;&gt;[29]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card sig&quot; id=&quot;sig-G2&quot; style=&quot;--tc:var(--lt-未亮, var(--muted))&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;G2　營業利益率走弱&lt;/b&gt;&lt;span class=&quot;light l-未亮&quot;&gt;未亮&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;規模變大，利潤率有沒有跟著變好？&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;值&lt;/div&gt;&lt;div class=&quot;sv&quot;&gt;+1.1 個百分點&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;機械值，期末 2026-09-30；門檻 &amp;lt; -1.0 個百分點&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;判讀&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;近四季營業利益率 33.3%，比一年前高 1.1 個百分點，未亮燈；但單季利益率由第一季 36.1% 降到第三季 31.8%，同期前九月折舊年增約 46%（推算），折舊壓力已開始反映在單季。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src30&quot;&gt;[30]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src31&quot;&gt;[31]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src4&quot;&gt;[4]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card sig&quot; id=&quot;sig-G3&quot; style=&quot;--tc:var(--lt-未亮, var(--muted))&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;G3　收款變慢&lt;/b&gt;&lt;span class=&quot;light l-未亮&quot;&gt;未亮&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;營收成長是不是靠放寬收款條件？&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;值&lt;/div&gt;&lt;div class=&quot;sv&quot;&gt;+5.1 個百分點&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;機械值，期末 2026-09-30；門檻 &amp;gt; +10.0 個百分點&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;判讀&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;應收增速只比近四季營收增速高 5.1 個百分點，低於 10 個百分點的門檻。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src32&quot;&gt;[32]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card sig&quot; id=&quot;sig-G4&quot; style=&quot;--tc:var(--lt-未亮, var(--muted))&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;G4　投入換不到成長&lt;/b&gt;&lt;span class=&quot;light l-未亮&quot;&gt;未亮&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;資本支出加大，營收增速有沒有跟上？&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;值&lt;/div&gt;&lt;div class=&quot;sv&quot;&gt;+13.7 個百分點&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;機械值，期末 2026-09-30；門檻 &amp;gt; +1.0 個百分點；且 營收近四季年增低於一年前&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;判讀&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;資本支出強度近四季 33.9%，一年內升 13.7 個百分點，但營收近四季年增也由 13.4% 升到 22.2%，所以「且」條件未成立；投入是否持續換到成長要看 2027 年。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src33&quot;&gt;[33]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src34&quot;&gt;[34]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src35&quot;&gt;[35]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card sig&quot; id=&quot;sig-A3&quot; style=&quot;--tc:var(--lt-未亮, var(--muted))&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;A3　雲端積壓訂單跟不上&lt;/b&gt;&lt;span class=&quot;light l-未亮&quot;&gt;未亮&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;未來要認列的合約有沒有比營收長得慢？&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;值&lt;/div&gt;&lt;div class=&quot;sv&quot;&gt;+237.8 個百分點&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;機械值，期末 2026-09-30；門檻 &amp;lt; +0.0 個百分點&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;判讀&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;RPO 增速比營收增速高約 238 個百分點，但 2026 年第一季起口徑擴大（納入一年以內合約）並含關聯方 Crux AI 168 億，同口徑增速會低很多；即使如此，雲端積壓季增約 469 億（5,139 億 → 5,608 億，推算），仍高於雲端單季營收 307 億，未亮燈結論不變。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src36&quot;&gt;[36]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src11&quot;&gt;[11]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src37&quot;&gt;[37]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card sig&quot; id=&quot;sig-A4&quot; style=&quot;--tc:var(--lt-未亮, var(--muted))&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;A4　研發加重而成長沒跟上&lt;/b&gt;&lt;span class=&quot;light l-未亮&quot;&gt;未亮&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;研發投入是否換到成長？&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;值&lt;/div&gt;&lt;div class=&quot;sv&quot;&gt;+1.4 個百分點&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;機械值，期末 2026-09-30；門檻 &amp;gt; +1.0 個百分點；且 單季營收年增低於去年同期&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;判讀&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;研發率升 1.4 個百分點（14.8% → 16.2%），但第三季單季營收年增 24.7% 高於去年同期 16.0%，「且」條件未成立。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src38&quot;&gt;[38]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src39&quot;&gt;[39]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card sig&quot; id=&quot;sig-A5&quot; style=&quot;--tc:var(--lt-未亮, var(--muted))&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;A5　業務費用效率變差&lt;/b&gt;&lt;span class=&quot;light l-未亮&quot;&gt;未亮&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;買成長的成本有沒有變貴？&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;值&lt;/div&gt;&lt;div class=&quot;sv&quot;&gt;-0.1 個百分點&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;機械值，期末 2026-09-30；門檻 &amp;gt; +1.0 個百分點&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;判讀&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;業務行銷費用率 6.9%，比去年同期低 0.1 個百分點。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src40&quot;&gt;[40]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub-h&quot;&gt;作者訊號（財報數字看不出，作者讀原文判斷）&lt;/div&gt;&lt;div class=&quot;cards&quot;&gt;&lt;div class=&quot;card sig&quot; id=&quot;sig-A1&quot; style=&quot;--tc:var(--lt-未亮, var(--muted))&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;A1　流量取得成本占比上升&lt;/b&gt;&lt;span class=&quot;light l-未亮&quot;&gt;未亮&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;為了拿到流量付出去的比例是不是變高？&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;值&lt;/div&gt;&lt;div class=&quot;sv&quot;&gt;TAC 率 20.1% → 20.0%（第三季，年變化 −0.1 個百分點）&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;作者從原文填&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;判讀&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;第三季 TAC 率由 20.1% 降到 20.0%、前九月由 20.4% 降到 19.8%，主因營收組合由聯播網移向搜尋；搜尋的 TAC 率大致持平，聯播網的 TAC 率上升。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src41&quot;&gt;[41]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card sig&quot; id=&quot;sig-A2&quot; style=&quot;--tc:var(--lt-未亮, var(--muted))&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;A2　付費點擊或曝光量轉弱&lt;/b&gt;&lt;span class=&quot;light l-未亮&quot;&gt;未亮&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;廣告量還在成長嗎？&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;值&lt;/div&gt;&lt;div class=&quot;sv&quot;&gt;付費點擊 +8%、聯播網曝光 −14%（第三季年增）&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;作者從原文填&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;判讀&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;搜尋付費點擊第三季仍年增 8%（前九月 11%），聯播網曝光年減 14%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src13&quot;&gt;[13]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;占廣告大宗的搜尋點擊仍在成長，判未亮燈；聯播網曝光萎縮，但聯播網只占第三季營收約 6%，且每次曝光價格同幅上升，不改變本訊號的判定，另列觀察。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src13&quot;&gt;[13]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;h3 id=&quot;ext&quot;&gt;外部驗證：競爭者、客戶、供應商怎麼描述這家公司&lt;/h3&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;外部驗證：誰支持、誰反駁&lt;/figcaption&gt;&lt;div class=&quot;emx&quot; style=&quot;grid-template-columns:repeat(3,1fr)&quot;&gt;&lt;div class=&quot;emc&quot; style=&quot;--tc:var(--pos)&quot;&gt;&lt;div class=&quot;emh&quot;&gt;支持 &lt;b&gt;4&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;emi&quot;&gt;&lt;b&gt;Yelp&lt;/b&gt;&lt;span&gt;客戶&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;emi&quot;&gt;&lt;b&gt;Thryv&lt;/b&gt;&lt;span&gt;客戶&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;emi&quot;&gt;&lt;b&gt;Broadcom&lt;/b&gt;&lt;span&gt;供應商&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;emi&quot;&gt;&lt;b&gt;CME Group&lt;/b&gt;&lt;span&gt;客戶&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;emc&quot; style=&quot;--tc:var(--warn)&quot;&gt;&lt;div class=&quot;emh&quot;&gt;部分支持 &lt;b&gt;0&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;emc&quot; style=&quot;--tc:var(--neg)&quot;&gt;&lt;div class=&quot;emh&quot;&gt;反駁 &lt;b&gt;1&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;emi&quot;&gt;&lt;b&gt;Bing、ChatGPT（第三方統計）&lt;/b&gt;&lt;span&gt;競爭者&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;5 個外部來源（競爭者、客戶、供應商、夥伴的申報或報導）怎麼描述本公司：支持 4、部分支持 0、反駁 1。依「對本公司說法」欄的開頭分類。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估、關係、支持）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;div class=&quot;cards&quot;&gt;&lt;div class=&quot;card ext&quot; style=&quot;--tc:var(--pos)&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;Yelp&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;客戶&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;對方文件怎麼說&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;Yelp 10-K 說高度依賴以 Google 為主的搜尋引擎帶流量，並指出 Google 在自然搜尋結果上方放 AI 生成回答，降低其平台連結的顯眼程度（原文：may be having a negative impact on our traffic）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src42&quot;&gt;[42]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src43&quot;&gt;[43]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對本公司說法&lt;/div&gt;&lt;div class=&quot;stc&quot;&gt;支持&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card ext&quot; style=&quot;--tc:var(--pos)&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;Thryv&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;客戶&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;對方文件怎麼說&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;Thryv 10-K 說 Google in particular is the most significant source of traffic，指其黃頁網站與客戶網站的最大流量來源是 Google。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src44&quot;&gt;[44]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對本公司說法&lt;/div&gt;&lt;div class=&quot;stc&quot;&gt;支持&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card ext&quot; style=&quot;--tc:var(--pos)&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;Broadcom&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;供應商&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;對方文件怎麼說&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;Broadcom 8-K 揭露與 Google 簽長期協議，開發並供應後續世代的客製 TPU；另有供應保證協議，供應 AI 機櫃用的網路與其他元件，期間至多到 2031 年。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src45&quot;&gt;[45]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對本公司說法&lt;/div&gt;&lt;div class=&quot;stc&quot;&gt;支持&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card ext&quot; style=&quot;--tc:var(--pos)&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;CME Group&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;客戶&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;對方文件怎麼說&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;CME Group 10-K 揭露 2021 年與 Google Cloud 簽十年策略合作，2025 年在把清算與市場資料等核心非低延遲應用搬上 Google Cloud 上有顯著進展（significant progress，原文未說已全部搬完）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src46&quot;&gt;[46]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src47&quot;&gt;[47]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對本公司說法&lt;/div&gt;&lt;div class=&quot;stc&quot;&gt;支持&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card ext&quot; style=&quot;--tc:var(--neg)&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;Bing、ChatGPT（第三方統計）&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;競爭者&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;對方文件怎麼說&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;報導引 Statcounter：9 月 Google 全球搜尋占有率 89.9%，年減 0.44 個百分點，Bing 5.3% 年增 1.19 個百分點；另引 Sensor Tower 數據，ChatGPT 行動日活躍用戶年增 69%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src48&quot;&gt;[48]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src49&quot;&gt;[49]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對本公司說法&lt;/div&gt;&lt;div class=&quot;stc&quot;&gt;反駁&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;sa&quot;&gt;&lt;h2&gt;4　優勢來源與持續期間&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;每種優勢都要同時有「好處」與「屏障」證據（Helmer《7 Powers》的檢驗）：只有好處、沒有屏障的優勢只算&lt;b&gt;暫時領先&lt;/b&gt;。再分兩維：超額報酬有多大、能撐多久（Mauboussin《Measuring the Moat》的問法）；Morningstar 五種來源只當分類參考。本節只談商業面的屏障，不含價格或估值，也不是估值報告的護城河評分，不進商業動能等級。&lt;/p&gt;&lt;div class=&quot;callout&quot;&gt;&lt;b&gt;總結&lt;/b&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;搜尋入口的屏障是預設分發合約與搜尋資料規模，超額報酬大，但最終判決正限制與要求分享這兩項，持續期間寫不足 5 年、以上訴結果檢驗；雲端的轉換成本有客戶申報與不可取消合約支撐，取 5–10 年，但只保護既有負載；TPU 只有開發年資與世代數、沒有對手拿不走的事實，屬暫時領先，寫不足 5 年。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src50&quot;&gt;[50]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src51&quot;&gt;[51]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src52&quot;&gt;[52]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src11&quot;&gt;[11]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src26&quot;&gt;[26]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;優勢地圖：多大、多久&lt;/figcaption&gt;&lt;div class=&quot;amx&quot;&gt;&lt;div class=&quot;amy&quot;&gt;持續期間 →&lt;/div&gt;&lt;div class=&quot;amg&quot;&gt;&lt;div class=&quot;amr&quot; style=&quot;grid-template-columns:80px repeat(4,1fr)&quot;&gt;&lt;div class=&quot;aml&quot;&gt;10年以上&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amc unk&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;amr&quot; style=&quot;grid-template-columns:80px repeat(4,1fr)&quot;&gt;&lt;div class=&quot;aml&quot;&gt;5–10年&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;span class=&quot;ab ab-有屏障證據&quot; title=&quot;Google 雲端的客戶轉換成本：有屏障證據&quot;&gt;2&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amc unk&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;amr&quot; style=&quot;grid-template-columns:80px repeat(4,1fr)&quot;&gt;&lt;div class=&quot;aml&quot;&gt;不足5年&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;span class=&quot;ab ab-有屏障證據&quot; title=&quot;搜尋入口：使用者、廣告主與網站流量的雙邊規模：有屏障證據&quot;&gt;1&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;amc unk&quot;&gt;&lt;span class=&quot;ab ab-暫時領先&quot; title=&quot;自研 TPU 與 AI 基礎設施：暫時領先&quot;&gt;3&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;amr&quot; style=&quot;grid-template-columns:80px repeat(4,1fr)&quot;&gt;&lt;div class=&quot;aml&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amx-l&quot;&gt;小&lt;/div&gt;&lt;div class=&quot;amx-l&quot;&gt;中&lt;/div&gt;&lt;div class=&quot;amx-l&quot;&gt;大&lt;/div&gt;&lt;div class=&quot;amx-l&quot;&gt;不明&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;amxt&quot;&gt;超額報酬大小 →&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;ol class=&quot;akey&quot;&gt;&lt;li&gt;&lt;span class=&quot;ab ab-有屏障證據&quot;&gt;1&lt;/span&gt;搜尋入口：使用者、廣告主與網站流量的雙邊規模（網路經濟；有屏障證據）&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;ab ab-有屏障證據&quot;&gt;2&lt;/span&gt;Google 雲端的客戶轉換成本（轉換成本；有屏障證據）&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;ab ab-暫時領先&quot;&gt;3&lt;/span&gt;自研 TPU 與 AI 基礎設施（流程能力；暫時領先）&lt;/li&gt;&lt;/ol&gt;&lt;div class=&quot;lg&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--pos)&quot;&gt;&lt;/i&gt;有屏障證據&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--warn)&quot;&gt;&lt;/i&gt;暫時領先&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;每個圓圈是一項優勢：越往右超額報酬越大、越往上能撐越久。綠＝屏障有事實證據；橘＝只有好處或屏障只有推論（暫時領先，持續期間最多不足 5 年）。作者寫「不明」的維度放在虛線格，不補值。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估、持續期間、判定）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;每項優勢有多少證據&lt;/figcaption&gt;&lt;svg viewBox=&quot;0 0 680 174&quot; role=&quot;img&quot; aria-label=&quot;優勢的證據數：好處與屏障&quot;&gt;&lt;text x=&quot;254&quot; y=&quot;170&quot; class=&quot;ax&quot;&gt;好處句數&lt;/text&gt;&lt;text x=&quot;459.0&quot; y=&quot;170&quot; class=&quot;ax&quot;&gt;屏障句數（事實／推論）&lt;/text&gt;&lt;text x=&quot;242&quot; y=&quot;32&quot; class=&quot;lb s&quot; text-anchor=&quot;end&quot;&gt;1 搜尋入口：使用者、廣告主與網站流…&lt;title&gt;1 搜尋入口：使用者、廣告主與網站流量的雙邊規模&lt;/title&gt;&lt;/text&gt;&lt;rect x=&quot;250&quot; y=&quot;20&quot; width=&quot;123.8&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;378.8&quot; y=&quot;33&quot; class=&quot;vl s&quot;&gt;3&lt;/text&gt;&lt;rect x=&quot;455.0&quot; y=&quot;20&quot; width=&quot;82.5&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;var(--pos)&quot;/&gt;&lt;rect x=&quot;537.5&quot; y=&quot;20&quot; width=&quot;41.2&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;var(--accent)&quot; opacity=&quot;.7&quot;/&gt;&lt;text x=&quot;583.8&quot; y=&quot;33&quot; class=&quot;vl s&quot;&gt;2／1&lt;/text&gt;&lt;text x=&quot;242&quot; y=&quot;78&quot; class=&quot;lb s&quot; text-anchor=&quot;end&quot;&gt;2 Google 雲端的客戶轉換成本&lt;title&gt;2 Google 雲端的客戶轉換成本&lt;/title&gt;&lt;/text&gt;&lt;rect x=&quot;250&quot; y=&quot;66&quot; width=&quot;82.5&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;337.5&quot; y=&quot;79&quot; class=&quot;vl s&quot;&gt;2&lt;/text&gt;&lt;rect x=&quot;455.0&quot; y=&quot;66&quot; width=&quot;123.8&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;var(--pos)&quot;/&gt;&lt;rect x=&quot;578.8&quot; y=&quot;66&quot; width=&quot;41.2&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;var(--accent)&quot; opacity=&quot;.7&quot;/&gt;&lt;text x=&quot;625.0&quot; y=&quot;79&quot; class=&quot;vl s&quot;&gt;3／1&lt;/text&gt;&lt;text x=&quot;242&quot; y=&quot;124&quot; class=&quot;lb s&quot; text-anchor=&quot;end&quot;&gt;3 自研 TPU 與 AI 基礎設施&lt;title&gt;3 自研 TPU 與 AI 基礎設施&lt;/title&gt;&lt;/text&gt;&lt;rect x=&quot;250&quot; y=&quot;112&quot; width=&quot;82.5&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;337.5&quot; y=&quot;125&quot; class=&quot;vl s&quot;&gt;2&lt;/text&gt;&lt;rect x=&quot;455.0&quot; y=&quot;112&quot; width=&quot;0.0&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;var(--pos)&quot;/&gt;&lt;rect x=&quot;455.0&quot; y=&quot;112&quot; width=&quot;41.2&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;var(--accent)&quot; opacity=&quot;.7&quot;/&gt;&lt;text x=&quot;501.2&quot; y=&quot;125&quot; class=&quot;vl s&quot;&gt;0／1&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;lg&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c3)&quot;&gt;&lt;/i&gt;好處&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--pos)&quot;&gt;&lt;/i&gt;屏障：事實&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--accent)&quot;&gt;&lt;/i&gt;屏障：推論&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;左邊是「它帶來什麼」的句數，右邊是「為什麼對手拿不走」的句數；屏障至少一句是事實（綠）才算有屏障證據。句數多不等於優勢強，只表示證據量。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估、屏障的標記）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;div class=&quot;card advc&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;&lt;span class=&quot;num-b 有屏障證據&quot;&gt;1&lt;/span&gt;搜尋入口：使用者、廣告主與網站流量的雙邊規模&lt;/b&gt;&lt;span class=&quot;vd vd-有屏障證據&quot;&gt;有屏障證據&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;網路經濟（Network Economies）｜晨星：網路效應&lt;/div&gt;&lt;div class=&quot;two&quot;&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;好處（它帶來什麼）&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;Google 服務第三季營收 963.02 億、分部營業利益 391.57 億，分部利益率約 40.7%（推算）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src2&quot;&gt;[2]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;報導引 Statcounter：9 月 Google 全球搜尋占有率 89.9%，第二名 Bing 5.3%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src48&quot;&gt;[48]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;依賴搜尋流量的網站在申報裡寫 Google 是主要流量來源：Thryv 寫 Google in particular is the most significant source of traffic；Yelp 寫 rely heavily on Internet search engines, including primarily Google；CarGurus 則並列 Google、Bing、Yahoo!。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src44&quot;&gt;[44]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src42&quot;&gt;[42]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src53&quot;&gt;[53]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;屏障（為什麼對手拿不走）&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;Google 搜尋營收包含搜尋分發夥伴把 Google.com 設為瀏覽器、工具列等預設搜尋所帶來的流量；前九月流量取得成本 477.73 億，增加主要來自付給分發夥伴的流量取得成本。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src50&quot;&gt;[50]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src54&quot;&gt;[54]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src41&quot;&gt;[41]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;公司在風險因素自述：若法院限制預設分發安排與營收分成協議、要求分享或授權搜尋資料並向對手提供聯合供應，could significantly impair our distribution reach。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src55&quot;&gt;[55]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;從上面兩項推論：預設搜尋位置由分成合約占住，對手要拿走這些流量，得先贏得預設位置並付出同量級的分成，且沒有同量的查詢資料；公司自己把這些安排與搜尋資料列為分發觸及的來源，所以它們是對手拿不走的原因。但這兩項也正是最終判決要限制與分享的項目。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src50&quot;&gt;[50]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src41&quot;&gt;[41]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src55&quot;&gt;[55]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;two&quot;&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;超額報酬大小&lt;/div&gt;&lt;span class=&quot;lv&quot;&gt;大&lt;/span&gt;&lt;div class=&quot;s&quot;&gt;Google 服務分部利益率約 40.7%（推算），集團近四季營業利益率 33.3%，在近 20 季範圍 25.4%–33.3% 的高端。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src2&quot;&gt;[2]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src56&quot;&gt;[56]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;持續期間&lt;/div&gt;&lt;span class=&quot;lv&quot;&gt;不足5年&lt;/span&gt;&lt;div class=&quot;s&quot;&gt;占有率一年只降 0.44 個百分點（9 月 89.9%），第三方網站仍以 Google 為主要流量來源；這是目前的結果（好處），不是屏障本身。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src48&quot;&gt;[48]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src44&quot;&gt;[44]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;削弱屏障的因素：2025 年 12 月最終判決限制 Google 的發行方式，並要求與部分競爭者分享特定搜尋資料、提供聯合供應服務（雙方都已上訴、仍待判決）；AI 對話工具提供新入口，ChatGPT 行動日活躍用戶年增 69%；Yelp 也說 Google 自己的 AI 回答減少了導向它的點擊。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src51&quot;&gt;[51]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src49&quot;&gt;[49]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src43&quot;&gt;[43]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;屏障事實是預設分發合約與搜尋資料規模，而最終判決正好限制前者、要求分享後者，只差上訴結果與執行範圍；屏障能撐多久取決於這幾年內的上訴與執行，所以持續期間寫不足 5 年，不因占有率流失慢就延長；若上訴推翻或執行範圍縮小，再改評。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src51&quot;&gt;[51]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src55&quot;&gt;[55]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src48&quot;&gt;[48]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card advc&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;&lt;span class=&quot;num-b 有屏障證據&quot;&gt;2&lt;/span&gt;Google 雲端的客戶轉換成本&lt;/b&gt;&lt;span class=&quot;vd vd-有屏障證據&quot;&gt;有屏障證據&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;轉換成本（Switching Costs）｜晨星：轉換成本&lt;/div&gt;&lt;div class=&quot;two&quot;&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;好處（它帶來什麼）&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;雲端第三季分部營業利益 111.21 億，利益率約 36.2%（去年同期約 23.7%，推算）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src2&quot;&gt;[2]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;雲端營收積壓 5,608 億，約為雲端第三季營收 307 億的 18 倍（推算）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src11&quot;&gt;[11]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;屏障（為什麼對手拿不走）&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;客戶申報顯示系統已綁在 Google 雲端上：Snap 寫已把軟體與電腦系統建成使用 Google Cloud 與 AWS 提供的運算、儲存、頻寬等服務；Etsy 寫市集大部分運算、儲存與網路依賴 Google Cloud，使用中斷會 seriously harm our business。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src52&quot;&gt;[52]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src57&quot;&gt;[57]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src58&quot;&gt;[58]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;CME Group 2021 年與 Google Cloud 簽十年策略合作，2025 年在把清算與市場資料等核心非低延遲應用搬上 Google Cloud 上有顯著進展（significant progress，原文未說已全部搬完）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src46&quot;&gt;[46]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src47&quot;&gt;[47]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;營收積壓只計不可取消的合約承諾；預計略多於 55% 在 24 個月內認列，其餘在之後認列。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src11&quot;&gt;[11]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;從上面三項推論：對手要搶走這些工作負載，客戶得重寫已綁定的系統、把已搬上或正在搬上 Google Cloud 的核心應用再搬一次，並等合約承諾到期，搬遷成本由客戶承擔，所以對手難以單靠降價拿走既有負載。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src52&quot;&gt;[52]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src47&quot;&gt;[47]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src11&quot;&gt;[11]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;two&quot;&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;超額報酬大小&lt;/div&gt;&lt;span class=&quot;lv&quot;&gt;中&lt;/span&gt;&lt;div class=&quot;s&quot;&gt;雲端分部利益率第三季約 36.2%，第二季公司說 35.6%，但一年前只有約 23.7%（推算），高利益率只維持兩季，且含 TPU 硬體銷售、組合未單獨揭露。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src2&quot;&gt;[2]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src20&quot;&gt;[20]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src16&quot;&gt;[16]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;持續期間&lt;/div&gt;&lt;span class=&quot;lv&quot;&gt;5–10年&lt;/span&gt;&lt;div class=&quot;s&quot;&gt;CME 十年合作自 2021 年起算到 2031 年（推算）；積壓略少於 45% 在 24 個月之後才認列（推算：原文略多於 55% 在 24 個月內）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src46&quot;&gt;[46]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src11&quot;&gt;[11]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;削弱屏障的因素：Snap 同時使用 AWS，客戶多雲並用，新工作負載仍可分給對手；Crux AI 168 億屬關聯方合約。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src52&quot;&gt;[52]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src11&quot;&gt;[11]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;已綁定系統與不可取消合約有事實支撐，所以不寫不足 5 年；但客戶多雲並用、轉換成本只保護既有負載、不保護新增需求，所以不寫 10 年以上，取 5–10 年。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src52&quot;&gt;[52]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src46&quot;&gt;[46]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src11&quot;&gt;[11]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card advc&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;&lt;span class=&quot;num-b 暫時領先&quot;&gt;3&lt;/span&gt;自研 TPU 與 AI 基礎設施&lt;/b&gt;&lt;span class=&quot;vd vd-暫時領先&quot;&gt;暫時領先&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;流程能力（Process Power）｜晨星：成本優勢&lt;/div&gt;&lt;div class=&quot;two&quot;&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;好處（它帶來什麼）&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;公司說本季靠工程與硬體優化，把 AI Mode 回答成本降到上線以來最低。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src59&quot;&gt;[59]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;TPU 系統已成雲端第三季營收增量的來源之一，並透過 Oracle 對外提供。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src16&quot;&gt;[16]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src26&quot;&gt;[26]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;屏障（為什麼對手拿不走）&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;從開發年資與世代數推論：對手要做出同級的自研加速器與整套堆疊可能需要多世代累積；但目前找不到對手拿不走的事實（亞馬遜與微軟仍在模仿，TPU 的開發與供應依賴 Broadcom 的長期協議），所以這只是推論，判定暫時領先。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src26&quot;&gt;[26]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src60&quot;&gt;[60]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src45&quot;&gt;[45]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;two&quot;&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;超額報酬大小&lt;/div&gt;&lt;span class=&quot;lv&quot;&gt;不明&lt;/span&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-待查&quot;&gt;待查&lt;/span&gt;待查：TPU 系統銷售金額與毛利，10-Q 沒有單獨揭露，換到多少利潤差無法從申報算出。&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;持續期間&lt;/div&gt;&lt;span class=&quot;lv&quot;&gt;不足5年&lt;/span&gt;&lt;div class=&quot;s&quot;&gt;背景事實：報導指 Google 自 2013 年開始開發 TPU，晶片、模型與雲端一站式的組合是亞馬遜與微軟 have tried to replicate 的打法；10-K 時已到第七代 Ironwood。這是開發年資與對手在模仿，不是對手拿不走的原因。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src26&quot;&gt;[26]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src60&quot;&gt;[60]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;削弱屏障的因素：報導引 Anthropic 上市申報，說它同時採用 Google、Amazon、輝達與 AMD 的晶片，依各工作負載的價格效能挑選。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src61&quot;&gt;[61]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;屏障事實只有開發年資、世代數與對手仍在模仿；大客戶多家採購、設計依賴 Broadcom，2031 年只是網路元件供應保證的期限、不是 TPU 屏障的期限，所以寫不足 5 年，待 TPU 營收與毛利揭露後再評。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src26&quot;&gt;[26]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src61&quot;&gt;[61]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src45&quot;&gt;[45]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;超額報酬的機械參考：利潤率位置&lt;/figcaption&gt;&lt;svg viewBox=&quot;0 0 680 92&quot; role=&quot;img&quot; aria-label=&quot;近四季營業利益率在近20季範圍的位置&quot;&gt;&lt;line x1=&quot;30.0&quot; x2=&quot;30.0&quot; y1=&quot;18&quot; y2=&quot;64&quot; class=&quot;zl&quot;/&gt;&lt;text x=&quot;30.0&quot; y=&quot;84&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;0%&lt;/text&gt;&lt;line x1=&quot;185.0&quot; x2=&quot;185.0&quot; y1=&quot;18&quot; y2=&quot;64&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;185.0&quot; y=&quot;84&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;10%&lt;/text&gt;&lt;line x1=&quot;340.0&quot; x2=&quot;340.0&quot; y1=&quot;18&quot; y2=&quot;64&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;340.0&quot; y=&quot;84&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;20%&lt;/text&gt;&lt;line x1=&quot;495.0&quot; x2=&quot;495.0&quot; y1=&quot;18&quot; y2=&quot;64&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;495.0&quot; y=&quot;84&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;30%&lt;/text&gt;&lt;line x1=&quot;650.0&quot; x2=&quot;650.0&quot; y1=&quot;18&quot; y2=&quot;64&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;650.0&quot; y=&quot;84&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;40%&lt;/text&gt;&lt;rect x=&quot;422.9&quot; y=&quot;30&quot; width=&quot;123.5&quot; height=&quot;22&quot; rx=&quot;4&quot; fill=&quot;var(--biz)&quot; opacity=&quot;.22&quot;/&gt;&lt;text x=&quot;422.9&quot; y=&quot;24&quot; class=&quot;ax&quot;&gt;近 20 季範圍 25.4%～33.3%&lt;/text&gt;&lt;circle cx=&quot;546.5&quot; cy=&quot;41&quot; r=&quot;7&quot; fill=&quot;var(--biz)&quot;/&gt;&lt;text x=&quot;546.5&quot; y=&quot;76&quot; class=&quot;vl s&quot; text-anchor=&quot;middle&quot;&gt;近四季 33.3%&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;藍帶是近 20 季的近四季營業利益率範圍，圓點是最新值；同業營業利益率百分位 0.667（1＝同業最高）。只供對照「超額報酬大小」，不是分數、不進等級，也不是估值報告的護城河評分。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估底稿&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;p class=&quot;lead&quot;&gt;機械參考（供對照超額報酬，不是分數）：近四季營業利益率 33.3%，近 20 季範圍 25.4%～33.3%，同業營業利益率百分位 0.667。&lt;/p&gt;&lt;div class=&quot;note&quot;&gt;判定規則：屏障欄至少一句標「事實」並附出處才算「有屏障證據」；否則只算「暫時領先」，持續期間最多寫「不足5年」。&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;s4&quot;&gt;&lt;h2&gt;5　生命週期與未來變化&lt;/h2&gt;&lt;div class=&quot;stages&quot;&gt;&lt;div class=&quot;&quot;&gt;起步&lt;/div&gt;&lt;div class=&quot;&quot;&gt;成長&lt;/div&gt;&lt;div class=&quot;on&quot;&gt;成熟&lt;/div&gt;&lt;div class=&quot;&quot;&gt;衰退&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;lead&quot;&gt;估值報告的林區分類（引用，不重判）：穩定成長股（Stalwart）&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;2022–2025 年營收年複合約 12.5%（推算），年度營收 2016 年以來沒有下降年。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src62&quot;&gt;[62]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src63&quot;&gt;[63]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;核心的 Google 服務第三季只年增 10.6%（推算），搜尋 12.0%、YouTube 廣告 9.2%、聯播網 1.4%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;雲端分部占第三季營收約 24% 且年增約一倍，屬於成熟公司內的成長型業務。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;研究報告的林區分類為穩定成長股，與「成熟」階段一致；兩者都把雲端的高速成長視為兼具的快速成長特徵，而不是整家公司回到成長期。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src64&quot;&gt;[64]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src65&quot;&gt;[65]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;callout&quot;&gt;&lt;b&gt;最可能的轉變：成熟 → 成長（雲端占比擴大而再加速）&lt;/b&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;營收近四季年增連續維持在 20% 以上到 2027 年下半年，且雲端占季營收超過三成；這與研究報告林區分類寫的改判條件（加速延續兩年以上、雲端占比過三成）同方向。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src35&quot;&gt;[35]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src66&quot;&gt;[66]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;反方向：若 AI 搜尋變現追不上、雲端在 TPU 一次性銷售後回落，增速回到 10%–15%，維持成熟。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src19&quot;&gt;[19]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src7&quot;&gt;[7]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lead&quot;&gt;怎麼檢驗&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;每季看營收近四季年增與 10-Q 營收表中雲端占比；2027 年第二季 10-Q（約 2027 年 7 月）做第一次判定。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src31&quot;&gt;[31]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;s5&quot;&gt;&lt;h2&gt;6　週期推論&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;三種證據都寫成「區間＋條件」，不給單一日期。&lt;/p&gt;&lt;div class=&quot;callout&quot;&gt;&lt;b&gt;綜合：未來 2–6 季（2027 年第一季至 2028 年第一季）營收近四季年增可能見頂，之後進入下行段&lt;/b&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;上行段已 13 季，遠長於過去唯一完整上行段的 5 季；單季增速第三季只比第二季多 0.4 個百分點，加速已在收斂。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src67&quot;&gt;[67]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src29&quot;&gt;[29]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;若雲端積壓按 24 個月認列節奏轉成營收、且 AI 搜尋廣告變現追上，見頂會延後到 6 季以後；若單季營收年增跌破 15%，下行段大致確認。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src11&quot;&gt;[11]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src19&quot;&gt;[19]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;利潤率比營收更早受折舊壓力：單季營業利益率已由第一季 36.1% 降到第三季 31.8%，營業利益率週期的見頂可能早於營收。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src31&quot;&gt;[31]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src4&quot;&gt;[4]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;h3&gt;① 自身歷史循環&lt;/h3&gt;&lt;div class=&quot;chart&quot;&gt;&lt;svg viewBox=&quot;0 0 720 240&quot; role=&quot;img&quot; aria-label=&quot;近四季營收年增（2016-06-30～2026-09-30（42 季））&quot;&gt;&lt;line x1=&quot;46&quot; x2=&quot;704&quot; y1=&quot;210.0&quot; y2=&quot;210.0&quot; stroke=&quot;var(--line)&quot; stroke-width=&quot;1.4&quot;/&gt;&lt;text x=&quot;40&quot; y=&quot;214.0&quot; font-size=&quot;11&quot; text-anchor=&quot;end&quot; fill=&quot;var(--muted)&quot;&gt;0%&lt;/text&gt;&lt;line x1=&quot;46&quot; x2=&quot;704&quot; y1=&quot;28.0&quot; y2=&quot;28.0&quot; stroke=&quot;var(--line)&quot; stroke-width=&quot;1&quot;/&gt;&lt;text x=&quot;40&quot; y=&quot;32.0&quot; font-size=&quot;11&quot; text-anchor=&qu &gt;[67]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src69&quot;&gt;[69]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;過去兩次下行（2018–2020、2021–2023）與數位廣告景氣和疫後回落同期，屬廣告景氣循環；這一輪上行多了雲端與 TPU 銷售，與廣告循環不完全同步。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src70&quot;&gt;[70]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;h3&gt;② 訂單能見度&lt;/h3&gt;&lt;p class=&quot;s&quot;&gt;營收積壓 5,677 億約等於 4.45 季營收；略多於 55% 預計在 24 個月內認列（約 3,120 億，推算）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src71&quot;&gt;[71]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src11&quot;&gt;[11]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;積壓幾乎全在雲端，廣告沒有積壓可看；所以能見度只覆蓋約四分之一營收，廣告循環仍要看點擊與價格。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src11&quot;&gt;[11]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;h3&gt;③ 公司特有週期&lt;/h3&gt;&lt;p class=&quot;s&quot;&gt;前九月資本支出 1,320 億（去年同期 636 億）、折舊 220 億（去年同期 151 億，年增約 46%，推算）；同期營運現金流 1,271.49 億，低於資本支出。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src4&quot;&gt;[4]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src3&quot;&gt;[3]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;公司說 2026 年技術基礎設施投資較 2025 年大幅增加，資產要到可使用時才開始提列折舊，資料中心建置多為多年多階段工程；推論新產能陸續投入使用後折舊會繼續上升。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src72&quot;&gt;[72]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src4&quot;&gt;[4]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;2026 年 6 月公司簽訂最多 400 億美元的市場發行股票計畫，至 2026-09-30 尚可發行 276 億；所得主要用於員工股權的稅務支出。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src73&quot;&gt;[73]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src74&quot;&gt;[74]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;基準季後的 2026-11-05，公司完成 60 億歐元優先票據的公開發行（依 S-3 登記）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src75&quot;&gt;[75]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;TPU 系統銷售在交付時一次認列，且部分合約附回購選擇權，雲端營收會隨交付批次跳動。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src7&quot;&gt;[7]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;公司計畫在 2026 年第四季把 AI Mode 廣告擴到巴西、墨西哥、英國等市場，是搜尋變現的換代期。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src28&quot;&gt;[28]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/section&gt;&lt;section id=&quot;s6&quot;&gt;&lt;h2&gt;7　觀察清單：下季要看什麼&lt;/h2&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;觀察清單：目前值離改判門檻多遠&lt;/figcaption&gt;&lt;div class=&quot;wg&quot;&gt;&lt;div class=&quot;wgt&quot;&gt;&lt;b&gt;單季營收年增&lt;/b&gt;&lt;span&gt;維持條件：營收單季年增 &amp;gt;= 15.0%&lt;/span&gt;&lt;/div&gt;&lt;svg viewBox=&quot;0 0 680 60&quot; role=&quot;img&quot; aria-label=&quot;單季營收年增&quot;&gt;&lt;rect x=&quot;359.0&quot; y=&quot;14&quot; width=&quot;307.0&quot; height=&quot;20&quot; fill=&quot;var(--pos)&quot; opacity=&quot;.12&quot;/&gt;&lt;line x1=&quot;14.0&quot; x2=&quot;666.0&quot; y1=&quot;24&quot; y2=&quot;24&quot; stroke=&quot;var(--line)&quot; stroke-width=&quot;2&quot;/&gt;&lt;line x1=&quot;359.0&quot; x2=&quot;359.0&quot; y1=&quot;8&quot; y2=&quot;40&quot; stroke=&quot;var(--ink)&quot; stroke-dasharray=&quot;4 3&quot; stroke-width=&quot;1.6&quot;/&gt;&lt;text x=&quot;359.0&quot; y=&quot;54&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;門檻 15.0%&lt;/text&gt;&lt;circle cx=&quot;581.0&quot; cy=&quot;24&quot; r=&quot;7&quot; fill=&quot;var(--pos)&quot;/&gt;&lt;text x=&quot;581.0&quot; y=&quot;9&quot; class=&quot;vl s&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--pos)&quot;&gt;目前 24.6%&lt;/text&gt;&lt;/svg&gt;&lt;/div&gt;&lt;div class=&quot;wg&quot;&gt;&lt;div class=&quot;wgt&quot;&gt;&lt;b&gt;近四季營業利益率&lt;/b&gt;&lt;span&gt;維持條件：營業利益率_近四季 &amp;gt;= 30.0%&lt;/span&gt;&lt;/div&gt;&lt;svg viewBox=&quot;0 0 680 60&quot; role=&quot;img&quot; aria-label=&quot;近四季營業利益率&quot;&gt;&lt;rect x=&quot;524.5&quot; y=&quot;14&quot; width=&quot;141.5&quot; height=&quot;20&quot; fill=&quot;var(--pos)&quot; opacity=&quot;.12&quot;/&gt;&lt;line x1=&quot;14.0&quot; x2=&quot;666.0&quot; y1=&quot;24&quot; y2=&quot;24&quot; stroke=&quot;var(--line)&quot; stroke-width=&quot;2&quot;/&gt;&lt;line x1=&quot;524.5&quot; x2=&quot;524.5&quot; y1=&quot;8&quot; y2=&quot;40&quot; stroke=&quot;var(--ink)&quot; stroke-dasharray=&quot;4 3&quot; stroke-width=&quot;1.6&quot;/&gt;&lt;text x=&quot;524.5&quot; y=&quot;54&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;門檻 30.0%&lt;/text&gt;&lt;circle cx=&quot;581.0&quot; cy=&quot;24&quot; r=&quot;7&quot; fill=&quot;var(--pos)&quot;/&gt;&lt;text x=&quot;581.0&quot; y=&quot;9&quot; class=&quot;vl s&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--pos)&quot;&gt;目前 33.3%&lt;/text&gt;&lt;/svg&gt;&lt;/div&gt;&lt;div class=&quot;wg&quot;&gt;&lt;div class=&quot;wgt&quot;&gt;&lt;b&gt;資本支出強度（近四季）&lt;/b&gt;&lt;span&gt;維持條件：資本支出強度_近四季 &amp;lt;= 40.0%&lt;/span&gt;&lt;/div&gt;&lt;svg viewBox=&quot;0 0 680 60&quot; role=&quot;img&quot; aria-label=&quot;資本支出強度（近四季）&quot;&gt;&lt;rect x=&quot;14.0&quot; y=&quot;14&quot; width=&quot;567.0&quot; height=&quot;20&quot; fill=&quot;var(--pos)&quot; opacity=&quot;.12&quot;/&gt;&lt;line x1=&quot;14.0&quot; x2=&quot;666.0&quot; y1=&quot;24&quot; y2=&quot;24&quot; stroke=&quot;var(--line)&quot; stroke-width=&quot;2&quot;/&gt;&lt;line x1=&quot;581.0&quot; x2=&quot;581.0&quot; y1=&quot;8&quot; y2=&quot;40&quot; stroke=&quot;var(--ink)&quot; stroke-dasharray=&quot;4 3&quot; stroke-width=&quot;1.6&quot;/&gt;&lt;text x=&quot;581.0&quot; y=&quot;54&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;門檻 40.0%&lt;/text&gt;&lt;circle cx=&quot;494.8&quot; cy=&quot;24&quot; r=&quot;7&quot; fill=&quot;var(--pos)&quot;/&gt;&lt;text x=&quot;494.8&quot; y=&quot;9&quot; class=&quot;vl s&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--pos)&quot;&gt;目前 33.9%&lt;/text&gt;&lt;/svg&gt;&lt;/div&gt;&lt;div class=&quot;wg&quot;&gt;&lt;div class=&quot;wgt&quot;&gt;&lt;b&gt;營收積壓可見季數&lt;/b&gt;&lt;span&gt;維持條件：RPO可見季數 &amp;gt;= 3.0 季&lt;/span&gt;&lt;/div&gt;&lt;svg viewBox=&quot;0 0 680 60&quot; role=&quot;img&quot; aria-label=&quot;營收積壓可見季數&quot;&gt;&lt;rect x=&quot;396.2&quot; y=&quot;14&quot; width=&quot;269.8&quot; height=&quot;20&quot; fill=&quot;var(--pos)&quot; opacity=&quot;.12&quot;/&gt;&lt;line x1=&quot;14.0&quot; x2=&quot;666.0&quot; y1=&quot;24&quot; y2=&quot;24&quot; stroke=&quot;var(--line)&quot; stroke-width=&quot;2&quot;/&gt;&lt;line x1=&quot;396.2&quot; x2=&quot;396.2&quot; y1=&quot;8&quot; y2=&quot;40&quot; stroke=&quot;var(--ink)&quot; stroke-dasharray=&quot;4 3&quot; stroke-width=&quot;1.6&quot;/&gt;&lt;text x=&quot;396.2&quot; y=&quot;54&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;門檻 3.0 季&lt;/text&gt;&lt;circle cx=&quot;581.0&quot; cy=&quot;24&quot; r=&quot;7&quot; fill=&quot;var(--pos)&quot;/&gt;&lt;text x=&quot;581.0&quot; y=&quot;9&quot; class=&quot;vl s&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--pos)&quot;&gt;目前 4.5 季&lt;/text&gt;&lt;/svg&gt;&lt;/div&gt;&lt;div class=&quot;lg&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--pos)&quot;&gt;&lt;/i&gt;仍在維持條件內&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--neg)&quot;&gt;&lt;/i&gt;已越過門檻&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;只畫能自動對照的觀察項（有檢驗鍵與門檻）：淡綠帶是維持目前判斷的範圍，虛線是門檻，圓點是底稿最新值；越過門檻就照表中「改判方向」重看。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估、比較、門檻）＋商業評估底稿）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;div class=&quot;cards&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;單季營收年增&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;自動對照&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;目前值&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;2026 年第三季 24.7%（之前三季：2025 年第四季 18.0%、2026 年第一季 21.8%、第二季 24.2%）&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src29&quot;&gt;[29]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;看什麼&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;雲端積壓轉營收的速度與 TPU 交付批次&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;改判方向&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;若單季營收年增低於 15%，則週期轉入下行段，週期位置與成長動能下修&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;近四季營業利益率&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;自動對照&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;目前值&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;2026-09-30 近四季 33.3%（單季 31.8%）&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src76&quot;&gt;[76]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src77&quot;&gt;[77]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;看什麼&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;折舊上升與雲端利益率能否互相抵銷&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;改判方向&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;若近四季營業利益率跌破 30%，則G2 可能亮燈，模式穩固度與卡點風險下修&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;資本支出強度（近四季）&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;自動對照&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;目前值&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;2026-09-30 近四季 33.9%，一年內升 13.7 個百分點&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src78&quot;&gt;[78]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src33&quot;&gt;[33]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;看什麼&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;2027 年資本支出指引、營運現金流能否再蓋過資本支出、營收增速是否同向&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;改判方向&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;若資本支出強度超過 40% 而營收近四季年增開始下降，則G4 亮燈，投入換不到成長，卡點風險下修&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;搜尋付費點擊與每次點擊價格&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;人工對照&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;目前值&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;第三季付費點擊 +8%、每次點擊價格 +4%&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src13&quot;&gt;[13]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;看什麼&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;AI Mode 廣告擴大後點擊與價格能否同時成長&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;改判方向&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;若付費點擊年增低於 5% 且每次點擊價格沒有上升，則A2 亮燈，搜尋進入變現放緩期&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;營收積壓可見季數&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;自動對照&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;目前值&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;2026-09-30 約 4.45 季（新口徑，含 Crux AI 168 億）&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src71&quot;&gt;[71]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src11&quot;&gt;[11]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;看什麼&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;積壓是否持續季增、關聯方占比是否升高&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;改判方向&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;若可見季數跌破 3 季，則雲端訂單能見度轉弱，週期綜合區間提前&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;h3&gt;推論紀錄（下一季財報後自動對照）&lt;/h3&gt;&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;推論&lt;/th&gt;&lt;th&gt;方法&lt;/th&gt;&lt;th&gt;檢驗指標&lt;/th&gt;&lt;th&gt;條件&lt;/th&gt;&lt;th&gt;基準季&lt;/th&gt;&lt;th&gt;檢驗時點&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;P1&lt;/td&gt;&lt;td&gt;2026 年第四季（至 2026-12-31）單季營收年增仍在 20% 以上（雲端積壓轉營收撐住）&lt;/td&gt;&lt;td&gt;訂單能見度&lt;/td&gt;&lt;td&gt;營收單季年增&lt;/td&gt;&lt;td&gt;&amp;gt;= 0.2&lt;/td&gt;&lt;td&gt;2026-09-30&lt;/td&gt;&lt;td&gt;2026 年 10-K（約 2027 年 2 月）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;P2&lt;/td&gt;&lt;td&gt;到 2027 年第三季（至 2027-09-30）營收近四季年增從高點回落到 22% 以下（上行段已遠長於歷史）&lt;/td&gt;&lt;td&gt;自身歷史&lt;/td&gt;&lt;td&gt;營收近四季年增&lt;/td&gt;&lt;td&gt;&amp;lt; 0.22&lt;/td&gt;&lt;td&gt;2026-09-30&lt;/td&gt;&lt;td&gt;2027 年第三季 10-Q（約 2027 年 10 月）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;P3&lt;/td&gt;&lt;td&gt;折舊上升使近四季營業利益率在 2027 年第二季（至 2027-06-30）不超過 34%&lt;/td&gt;&lt;td&gt;公司特有&lt;/td&gt;&lt;td&gt;營業利益率_近四季&lt;/td&gt;&lt;td&gt;&amp;lt;= 0.34&lt;/td&gt;&lt;td&gt;2026-09-30&lt;/td&gt;&lt;td&gt;2027 年第二季 10-Q（約 2027 年 7 月）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;P4&lt;/td&gt;&lt;td&gt;2027 年第一季（至 2027-03-31）營收積壓仍可覆蓋 4 季以上營收&lt;/td&gt;&lt;td&gt;訂單能見度&lt;/td&gt;&lt;td&gt;RPO可見季數&lt;/td&gt;&lt;td&gt;&amp;gt;= 4&lt;/td&gt;&lt;td&gt;2026-09-30&lt;/td&gt;&lt;td&gt;2027 年第一季 10-Q（約 2027 年 4 月）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;P5&lt;/td&gt;&lt;td&gt;2027 年資本支出顯著增加的說法使近四季資本支出強度在 2027 年第一季（至 2027-03-31）不低於 35%&lt;/td&gt;&lt;td&gt;公司特有&lt;/td&gt;&lt;td&gt;資本支出強度_近四季&lt;/td&gt;&lt;td&gt;&amp;gt;= 0.35&lt;/td&gt;&lt;td&gt;2026-09-30&lt;/td&gt;&lt;td&gt;2027 年第一季 10-Q（約 2027 年 4 月）&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;lead&quot;&gt;每條推論從檢驗期末起，每個新季度記一筆命中或落空（預測帳本，公司資料夾 商業評估檢驗）；方法準確度跨公司統計見 商業評估預測帳本。&lt;/p&gt;&lt;/section&gt;&lt;section id=&quot;sg&quot;&gt;&lt;h2&gt;商業動能明細&lt;span class=&quot;ruleok&quot;&gt;評分規則第一版，2026-11-07 核定&lt;/span&gt;&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;五個面向各 1–5 分，相對同產業卡同業評比；機械建議分由工具依同業位置、卡住訊號與驗證比例算出，作者可調整但要寫理由。加權分 3.85 → B 級。等級門檻：A ≥ 4.2、B ≥ 3.5、C ≥ 2.8、D ≥ 2.1、其餘 E。&lt;/p&gt;&lt;div class=&quot;cards&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;模式穩固度&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;權重 &lt;span class=&quot;num&quot;&gt;25%&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;fs&quot;&gt;&lt;span&gt;作者分 &lt;span class=&quot;num v&quot;&gt;4&lt;/span&gt;&lt;/span&gt;&lt;span&gt;機械建議 &lt;span class=&quot;num&quot;&gt;4&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;近四季營業利益率同業百分位 0.667&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;理由&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;近四季營業利益率 33.3%，在同業中百分位 0.667，機械建議 4 分。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src79&quot;&gt;[79]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;廣告第三季約占營收 64% 的集中度高，但雲端已成第二利潤來源（第三季分部利益 111.21 億），兩條收入的付費者與計費方式不同，維持 4 分。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src2&quot;&gt;[2]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;同業對照&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;近四季營業利益率：微軟 47.1%、Alphabet 33.3%、Meta 32.9%、亞馬遜 12.1%（yfinance 口徑）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src80&quot;&gt;[80]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;成長動能&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;權重 &lt;span class=&quot;num&quot;&gt;25%&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;fs&quot;&gt;&lt;span&gt;作者分 &lt;span class=&quot;num v&quot;&gt;4&lt;/span&gt;&lt;/span&gt;&lt;span&gt;機械建議 &lt;span class=&quot;num&quot;&gt;4&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;最近一季營收年增同業百分位 0.667（yfinance 口徑）&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;理由&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;第三季營收年增 24.7%、連四季加速，同業百分位 0.667，機械建議 4 分；但核心 Google 服務只年增 10.6%（推算），加速幾乎全來自雲端。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src81&quot;&gt;[81]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src29&quot;&gt;[29]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;同業對照&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;最近一季營收年增：Meta 26.1%、Alphabet 24.7%、微軟 18.8%、亞馬遜 12.1%（yfinance 口徑）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src82&quot;&gt;[82]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;卡點風險&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;權重 &lt;span class=&quot;num&quot;&gt;20%&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;fs&quot;&gt;&lt;span&gt;作者分 &lt;span class=&quot;num v&quot;&gt;4&lt;/span&gt;&lt;/span&gt;&lt;span&gt;機械建議 &lt;span class=&quot;num&quot;&gt;5&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;計分採用的亮燈 0 條（無）；資料未取得 0 條&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;理由&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;九條卡住訊號（七條機械、兩條作者）全未亮燈，機械建議 5 分。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src83&quot;&gt;[83]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;扣 1 分：AI Mode 變現較低已被管理層承認、搜尋案最終判決限制發行並要求分享資料（上訴中）、資本支出強度一年升 13.7 個百分點且前九月營運現金流已低於資本支出；這幾項現有訊號清單沒有直接涵蓋。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src19&quot;&gt;[19]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src51&quot;&gt;[51]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src33&quot;&gt;[33]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src3&quot;&gt;[3]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;同業對照&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;近四季資本支出占營收：Meta 43.2%、微軟 39.2%、Alphabet 33.9%、亞馬遜 25.2%（yfinance 口徑），同屬重投入的一群。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src84&quot;&gt;[84]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src85&quot;&gt;[85]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src86&quot;&gt;[86]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src87&quot;&gt;[87]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-待查&quot;&gt;待查&lt;/span&gt;待查：微軟、Meta、亞馬遜還沒有商業評估，卡住訊號亮燈數無法對照。&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;週期位置&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;權重 &lt;span class=&quot;num&quot;&gt;15%&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;fs&quot;&gt;&lt;span&gt;作者分 &lt;span class=&quot;num v&quot;&gt;3&lt;/span&gt;&lt;/span&gt;&lt;span&gt;機械建議 &lt;span class=&quot;num&quot;&gt;4&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;營收近四季年增目前上行，距最近轉折 13 季；歷史下行段中位 7.5 季&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;理由&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;營收近四季年增上行 13 季，機械建議 4 分。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src88&quot;&gt;[88]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;扣 1 分：上行段已遠長於過去唯一完整上行段（5 季），單季加速幅度收斂到 0.4 個百分點，單季營業利益率已由 36.1% 降到 31.8%，位置偏上行後段。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src67&quot;&gt;[67]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src31&quot;&gt;[31]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;同業對照&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;最近一季營收年增 Meta 26.1%、微軟 18.8% 也處高檔，數位廣告與雲端同業同處上行。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src82&quot;&gt;[82]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-待查&quot;&gt;待查&lt;/span&gt;待查：同業的營收之字形轉折與段長要等同業做商業評估才有。&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;說法可信度&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;權重 &lt;span class=&quot;num&quot;&gt;15%&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;fs&quot;&gt;&lt;span&gt;作者分 &lt;span class=&quot;num v&quot;&gt;4&lt;/span&gt;&lt;/span&gt;&lt;span&gt;機械建議 &lt;span class=&quot;num&quot;&gt;4&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;已判定 4 條，驗證比例 0.62&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;理由&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;四條說的 vs 做的：雲端 103% 已驗證；搜尋動能、積壓與資本支出部分支持，沒有說法被數字否定。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src11&quot;&gt;[11]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src4&quot;&gt;[4]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;管理層主動說 AI Mode 變現較低、10-Q 主動揭露積壓口徑改變與關聯方 Crux AI 金額。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src19&quot;&gt;[19]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src11&quot;&gt;[11]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;同業對照&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-待查&quot;&gt;待查&lt;/span&gt;待查：微軟、Meta、亞馬遜的說的 vs 做的尚未建立，無法比較驗證比例。&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;相對同業：成長與利潤率&lt;/figcaption&gt;&lt;svg viewBox=&quot;0 0 680 300&quot; role=&quot;img&quot; aria-label=&quot;同業位置：營收年增與營業利益率&quot;&gt;&lt;line x1=&quot;56.0&quot; x2=&quot;56.0&quot; y1=&quot;16&quot; y2=&quot;260&quot; class=&quot;zl&quot;/&gt;&lt;text x=&quot;56.0&quot; y=&quot;276&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;0%&lt;/text&gt;&lt;line x1=&quot;155.0&quot; x2=&quot;155.0&quot; y1=&quot;16&quot; y2=&quot;260&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;155.0&quot; y=&quot;276&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;5%&lt;/text&gt;&lt;line x1=&quot;254.0&quot; x2=&quot;254.0&quot; y1=&quot;16&quot; y2=&quot;260&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;254.0&quot; y=&quot;276&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;10%&lt;/text&gt;&lt;line x1=&quot;353.0&quot; x2=&quot;353.0&quot; y1=&quot;16&quot; y2=&quot;260&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;353.0&quot; y=&quot;276&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;15%&lt;/text&gt;&lt;line x1=&quot;452.0&quot; x2=&quot;452.0&quot; y1=&quot;16&quot; y2=&quot;260&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;452.0&quot; y=&quot;276&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;20%&lt;/text&gt;&lt;line x1=&quot;551.0&quot; x2=&quot;551.0&quot; y1=&quot;16&quot; y2=&quot;260&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;551.0&quot; y=&quot;276&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;25%&lt;/text&gt;&lt;line x1=&quot;650.0&quot; x2=&quot;650.0&quot; y1=&quot;16&quot; y2=&quot;260&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;650.0&quot; y=&quot;276&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;30%&lt;/text&gt;&lt;line x1=&quot;56&quot; x2=&quot;650&quot; y1=&quot;260.0&quot; y2=&quot;260.0&quot; class=&quot;zl&quot;/&gt;&lt;text x=&quot;50&quot; y=&quot;264.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;0%&lt;/text&gt;&lt;line x1=&quot;56&quot; x2=&quot;650&quot; y1=&quot;211.2&quot; y2=&quot;211.2&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;50&quot; y=&quot;215.2&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;10%&lt;/text&gt;&lt;line x1=&quot;56&quot; x2=&quot;650&quot; y1=&quot;162.4&quot; y2=&quot;162.4&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;50&quot; y=&quot;166.4&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;20%&lt;/text&gt;&lt;line x1=&quot;56&quot; x2=&quot;650&quot; y1=&quot;113.6&quot; y2=&quot;113.6&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;50&quot; y=&quot;117.6&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;30%&lt;/text&gt;&lt;line x1=&quot;56&quot; x2=&quot;650&quot; y1=&quot;64.8&quot; y2=&quot;64.8&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;50&quot; y=&quot;68.8&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;40%&lt;/text&gt;&lt;line x1=&quot;56&quot; x2=&quot;650&quot; y1=&quot;16.0&quot; y2=&quot;16.0&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;50&quot; y=&quot;20.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;50%&lt;/text&gt;&lt;text x=&quot;650&quot; y=&quot;296&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;最近一季營收年增 →&lt;/text&gt;&lt;text x=&quot;60&quot; y=&quot;26&quot; class=&quot;ax&quot;&gt;↑ 營業利益率&lt;/text&gt;&lt;circle cx=&quot;545.1&quot; cy=&quot;97.4&quot; r=&quot;8&quot; fill=&quot;var(--biz)&quot; opacity=&quot;1&quot;&gt;&lt;title&gt;GOOGL：營收年增 24.7%、營業利益率 33.3%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;535.1&quot; y=&quot;101.4&quot; class=&quot;vl s&quot; text-anchor=&quot;end&quot;&gt;GOOGL&lt;/text&gt;&lt;circle cx=&quot;428.2&quot; cy=&quot;30.2&quot; r=&quot;5.5&quot; fill=&quot;var(--muted)&quot; opacity=&quot;0.75&quot;&gt;&lt;title&gt;MSFT：營收年增 18.8%、營業利益率 47.1%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;438.2&quot; y=&quot;34.2&quot; class=&quot;ax s&quot; text-anchor=&quot;start&quot;&gt;MSFT&lt;/text&gt;&lt;circle cx=&quot;572.8&quot; cy=&quot;99.6&quot; r=&quot;5.5&quot; fill=&quot;var(--muted)&quot; opacity=&quot;0.75&quot;&gt;&lt;title&gt;META：營收年增 26.1%、營業利益率 32.9%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;582.8&quot; y=&quot;103.6&quot; class=&quot;ax s&quot; text-anchor=&quot;start&quot;&gt;META&lt;/text&gt;&lt;circle cx=&quot;295.6&quot; cy=&quot;200.8&quot; r=&quot;5.5&quot; fill=&quot;var(--muted)&quot; opacity=&quot;0.75&quot;&gt;&lt;title&gt;AMZN：營收年增 12.1%、營業利益率 12.1%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;305.6&quot; y=&quot;204.8&quot; class=&quot;ax s&quot; text-anchor=&quot;start&quot;&gt;AMZN&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;右上角＝成長快又賺得多。藍點是本公司，灰點是同產業卡同業；營收年增百分位 0.667、營業利益率百分位 0.667（成長動能、模式穩固度的機械建議分依此）。營收年增是最近一季對去年同季（yfinance 口徑），不是近四季合計。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估底稿）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;div class=&quot;note&quot;&gt;商業評估等級（A–E 五級）只看商業模式是否成立、成長是否卡住、週期在哪，相對同產業卡同業評比；它不是估值報告研究評等裡的「生意品質 A／B／C」（那是看護城河、投入資本報酬、現金流品質、資產負債表與治理的絕對標準），不進研究評等、不影響估值、不涉任何價格。&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;src&quot;&gt;&lt;h2&gt;出處&lt;/h2&gt;&lt;p class=&quot;lead&quot;&g
