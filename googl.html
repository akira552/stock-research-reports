t;高–低折現率：10–13&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;360.8&quot; y=&quot;149.0&quot; class=&quot;ax&quot; text-anchor=&quot;start&quot;&gt;高–低折現率 10–13&lt;/text&gt;&lt;circle cx=&quot;380.2&quot; cy=&quot;123.0&quot; r=&quot;7&quot; fill=&quot;var(--c1)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;1.5&quot;&gt;&lt;title&gt;基準：11&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;380.2&quot; y=&quot;109.0&quot; class=&quot;val&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--c1)&quot;&gt;基準 11&lt;/text&gt;&lt;text x=&quot;242&quot; y=&quot;190.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;參考帶（軟體與網路）&lt;/text&gt;&lt;rect x=&quot;319.6&quot; y=&quot;174.0&quot; width=&quot;249.0&quot; height=&quot;22&quot; rx=&quot;4&quot; fill=&quot;var(--c7)&quot; opacity=&quot;.28&quot;&gt;&lt;title&gt;p25–p75：6–28&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;319.6&quot; y=&quot;211.0&quot; class=&quot;ax&quot; text-anchor=&quot;start&quot;&gt;p25–p75 6–28&lt;/text&gt;&lt;circle cx=&quot;426.6&quot; cy=&quot;185.0&quot; r=&quot;6&quot; fill=&quot;var(--c7)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;1.5&quot;&gt;&lt;title&gt;中位：16&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;426.6&quot; y=&quot;171.0&quot; class=&quot;val&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--c7)&quot;&gt;中位 16&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;缺口判斷影響幅度：拿掉各項作者判斷、其他不變時，合理價值中點的變動（計算核對.json，2026-11-13）；紅色為過門檻（中點±10%或價格位置跨界或生意等級理由），3 項中 0 項過門檻；虛線為 ±10%。正值＝拿掉後中點變高&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 138&quot; role=&quot;img&quot; aria-label=&quot;缺口判斷影響幅度&quot; class=&quot;chart&quot; style=&quot;max-width:700px&quot;&gt;&lt;line x1=&quot;392.0&quot; x2=&quot;392.0&quot; y1=&quot;6&quot; y2=&quot;132&quot; class=&quot;zero&quot;/&gt;&lt;line x1=&quot;304.9&quot; x2=&quot;304.9&quot; y1=&quot;4&quot; y2=&quot;134&quot; class=&quot;price&quot;/&gt;&lt;line x1=&quot;479.1&quot; x2=&quot;479.1&quot; y1=&quot;4&quot; y2=&quot;134&quot; class=&quot;price&quot;/&gt;&lt;text x=&quot;274&quot; y=&quot;25&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;G1. 非有價證券計入股權橋&lt;/text&gt;&lt;rect x=&quot;362.8&quot; y=&quot;11&quot; width=&quot;29.2&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;400.0&quot; y=&quot;25&quot; class=&quot;val&quot;&gt;-3.4%&lt;/text&gt;&lt;text x=&quot;274&quot; y=&quot;63&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;G2. 遞延所得稅負債淨額列其他請求權&lt;/text&gt;&lt;rect x=&quot;392.0&quot; y=&quot;49&quot; width=&quot;8.1&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;408.1&quot; y=&quot;63&quot; class=&quot;val&quot;&gt;+0.9%&lt;/text&gt;&lt;text x=&quot;274&quot; y=&quot;101&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;G3. 強制轉換特別股以清算優先列請求權…&lt;/text&gt;&lt;rect x=&quot;392.0&quot; y=&quot;87&quot; width=&quot;2.1&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;402.1&quot; y=&quot;101&quot; class=&quot;val&quot;&gt;+0.2%&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;/div&gt;&lt;!--/新圖表--&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;合理價值怎麼來：三個情境與權重&lt;/h3&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt&quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;每股價值（基準折現率 9.5%）&lt;/th&gt;&lt;th&gt;權重&lt;/th&gt;&lt;th&gt;折現率高端 10.7%&lt;/th&gt;&lt;th&gt;折現率低端 8.8%&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;119.36&lt;/td&gt;&lt;td&gt;25%&lt;/td&gt;&lt;td&gt;102.14&lt;/td&gt;&lt;td&gt;132.97&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;212.81&lt;/td&gt;&lt;td&gt;50%&lt;/td&gt;&lt;td&gt;175.32&lt;/td&gt;&lt;td&gt;243.20&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;366.72&lt;/td&gt;&lt;td&gt;25%&lt;/td&gt;&lt;td&gt;295.85&lt;/td&gt;&lt;td&gt;425.50&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;加權（合理價值）&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;b&gt;227.92&lt;/b&gt;&lt;/td&gt;&lt;td&gt;100%&lt;/td&gt;&lt;td&gt;&lt;b&gt;187.16&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;b&gt;261.22&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;中點是三個情境的加權：0.25×119.36＋0.5×212.81＋0.25×366.72≈227.92（一般權重組合）。區間上下緣是同樣三個情境、權重不變，只把折現率換成區間高端或低端重算後加權：高端約 10.7% → 187.16（下緣），低端約 8.8% → 261.22（上緣）。買入區上緣 136.75＝中點 × (1－安全邊際 40%，不確定性高)，股價在此以下才有 40% 安全邊際。情境表說明合理價值怎麼組成，不是單一目標價；非買賣建議。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;市價隱含第 10 年倍數（只描述，不進評等）&lt;/h3&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;基準情境：市價隱含 vs 模型假設的第 10 年 EV/EBIT（金額百萬美元）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;折現率&lt;/th&gt;&lt;th&gt;WACC&lt;/th&gt;&lt;th&gt;市場 EV&lt;/th&gt;&lt;th&gt;明示期現值&lt;/th&gt;&lt;th&gt;終值折現因子&lt;/th&gt;&lt;th&gt;第 10 年 EBIT&lt;/th&gt;&lt;th&gt;市價隱含倍數&lt;/th&gt;&lt;th&gt;模型終值倍數&lt;/th&gt;&lt;th&gt;隱含÷模型&lt;/th&gt;&lt;th&gt;現在 EV／次年 EBIT&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;低折現率&lt;/td&gt;&lt;td&gt;8.83%&lt;/td&gt;&lt;td&gt;3,491,911&lt;/td&gt;&lt;td&gt;1,238,228&lt;/td&gt;&lt;td&gt;0.281&lt;/td&gt;&lt;td&gt;446,893&lt;/td&gt;&lt;td&gt;17.9 倍&lt;/td&gt;&lt;td&gt;12.7 倍&lt;/td&gt;&lt;td&gt;1.41&lt;/td&gt;&lt;td&gt;19.3 倍&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;9.53%&lt;/td&gt;&lt;td&gt;3,491,911&lt;/td&gt;&lt;td&gt;1,165,840&lt;/td&gt;&lt;td&gt;0.255&lt;/td&gt;&lt;td&gt;446,893&lt;/td&gt;&lt;td&gt;20.4 倍&lt;/td&gt;&lt;td&gt;11.4 倍&lt;/td&gt;&lt;td&gt;1.79&lt;/td&gt;&lt;td&gt;19.3 倍&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;高折現率&lt;/td&gt;&lt;td&gt;10.70%&lt;/td&gt;&lt;td&gt;3,491,911&lt;/td&gt;&lt;td&gt;1,057,585&lt;/td&gt;&lt;td&gt;0.218&lt;/td&gt;&lt;td&gt;446,893&lt;/td&gt;&lt;td&gt;25.0 倍&lt;/td&gt;&lt;td&gt;9.7 倍&lt;/td&gt;&lt;td&gt;2.59&lt;/td&gt;&lt;td&gt;19.3 倍&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;算式：市場 EV＝模型 EV +（現價 − 模型每股價值）× 股數（股權橋與模型相同）；隱含倍數＝（市場 EV − 明示期現值）÷ 終值折現因子 ÷ 第 10 年 EBIT；模型終值倍數＝模型終值 ÷ 第 10 年 EBIT。參考帶：p25 6.0、中位 15.5、p75 28.1、p90 46.7 倍（機械回測樣本，非市場全體；分產業的筆數與公司數少，僅供參考；機械回測訓練期 2016–2021 全部回測日（審查工作區 回測資料/隱含倍數結果.json，1,810 筆中訓練期 1,046 筆；產業＝回測樣本的 Damodaran 產業）；重算：python3 程式/回測_隱含倍數參考帶.py &amp;lt;隱含倍數結果.json&amp;gt;）。只描述，不進價格位置、研究評等與合理價值。&lt;/p&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;&lt;b&gt;合理價值 vs 市價隱含倍數（作者判讀）：&lt;/b&gt;市價隱含第 10 年 EV（企業價值）/EBIT（息稅前利益，本報告以營業利益計）約 20.4 倍，是本報告基準模型終值倍數 11.4 倍 的 1.79 倍，介於軟體與網路參考帶中位 15.5 倍與第 75 百分位 28.1 倍之間；無特例。只描述市價與模型的距離，不作評等理由。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;如果 10 年後倍數是 15.5 倍，機率加權每股約 265 美元（條件式，非目標價、非買賣建議，不進評等）&lt;/h3&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;第 10 年 EV/EBIT 倍數對照（三情境各用自己的明示期 FCFF 與第 10 年 EBIT；權重 一般：保守 25%／基準 50%／樂觀 25%；基準 WACC 9.53%）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;第 10 年倍數&lt;/th&gt;&lt;th&gt;機率加權每股（美元）&lt;/th&gt;&lt;th&gt;折現率低高區間&lt;/th&gt;&lt;th&gt;白話換算&lt;/th&gt;&lt;th&gt;現價相對&lt;/th&gt;&lt;th&gt;說明&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;模型假設倍數&lt;/td&gt;&lt;td&gt;11.4 倍&lt;/td&gt;&lt;td&gt;227.92&lt;/td&gt;&lt;td&gt;187.16–261.22&lt;/td&gt;&lt;td&gt;等於折現率減永續成長約 6.5%（模型 6.5%）&lt;/td&gt;&lt;td&gt;現價高於區間&lt;/td&gt;&lt;td&gt;各情境用自己的模型終值倍數（表列為基準情境）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;穩態理論上限&lt;/td&gt;&lt;td&gt;12.9 倍&lt;/td&gt;&lt;td&gt;239.74&lt;/td&gt;&lt;td&gt;212.22–258.62&lt;/td&gt;&lt;td&gt;等於折現率減永續成長約 5.8%（模型 6.5%）&lt;/td&gt;&lt;td&gt;現價高於區間&lt;/td&gt;&lt;td&gt;（1−t）（1+g）÷（WACC−g）：再投資為零（ROIC 無限大）時的上限；t＝第 10 年 1−NOPAT÷EBIT&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;參考帶中位（軟體與網路）&lt;/td&gt;&lt;td&gt;15.5 倍&lt;/td&gt;&lt;td&gt;264.69&lt;/td&gt;&lt;td&gt;233.52–286.11&lt;/td&gt;&lt;td&gt;等於折現率減永續成長約 4.8%（模型 6.5%）&lt;/td&gt;&lt;td&gt;現價高於區間&lt;/td&gt;&lt;td&gt;所選參考帶（大類）中位&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;同業今日 EV/EBIT 中位&lt;/td&gt;&lt;td&gt;24.3 倍&lt;/td&gt;&lt;td&gt;349.66&lt;/td&gt;&lt;td&gt;306.05–379.72&lt;/td&gt;&lt;td&gt;等於折現率減永續成長約 3.1%（模型 6.5%）&lt;/td&gt;&lt;td&gt;現價低於區間&lt;/td&gt;&lt;td&gt;估值結果 multiples.ev_ebit.peer_quartiles.p50（今天的倍數，不是 10 年後）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;參考帶 p75（軟體與網路）&lt;/td&gt;&lt;td&gt;28.1 倍&lt;/td&gt;&lt;td&gt;386.83&lt;/td&gt;&lt;td&gt;337.78–420.67&lt;/td&gt;&lt;td&gt;等於折現率減永續成長約 2.6%（模型 6.5%）&lt;/td&gt;&lt;td&gt;現價低於區間&lt;/td&gt;&lt;td&gt;所選參考帶（大類）p75&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;市價隱含&lt;/td&gt;&lt;td&gt;20.4 倍&lt;/td&gt;&lt;td&gt;312.21&lt;/td&gt;&lt;td&gt;274.08–338.46&lt;/td&gt;&lt;td&gt;等於折現率減永續成長約 3.6%（模型 6.5%）&lt;/td&gt;&lt;td&gt;現價在區間內&lt;/td&gt;&lt;td&gt;基準情境、基準折現率反推（只用基準情境，套到三情境後加權不必等於現價）&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;如果 10 年後倍數是 X，三情境各用自己的明示期 FCFF 與第 10 年 EBIT、以基準折現率折現，依政策情境機率權重加權的每股價值；區間只換折現率（①模型列為合理價值區間）。「折現率減永續成長」＝(1+g)(1−t)(1−g/ROIC)÷倍數（基準情境永續參數）。條件式，非目標價、非買賣建議，不進評等。模型假設倍數那一列等於合理價值（中點 227.92）。&lt;/p&gt;&lt;/div&gt;&lt;!--成長型價格參考--&gt;&lt;div class=&quot;block&quot; id=&quot;growth-ref&quot;&gt;&lt;h3&gt;成長型價格參考：報酬門檻價、五年報酬矩陣、林區比值（只描述，不進評等，非買賣建議）&lt;/h3&gt;&lt;p class=&quot;cap&quot;&gt;這一段只描述，不進研究評等、不改價格位置，也不是目標價；三種情境並列、不合成單一數字，數字是「該情境成真時」的條件式推算，不是預期報酬。非買賣建議。&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;一、報酬門檻價：收盤 2026-11-13 股價 295.77 美元（三情境並列；條件式推算，非目標價）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;年報酬 7% 的每股價格（美元）&lt;/th&gt;&lt;th&gt;年報酬 8% 的每股價格（美元）&lt;/th&gt;&lt;th&gt;年報酬 9% 的每股價格（美元）&lt;/th&gt;&lt;th&gt;年報酬 10% 的每股價格（美元）&lt;/th&gt;&lt;th&gt;現價隱含年報酬&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;188.65&lt;/td&gt;&lt;td&gt;153.56&lt;/td&gt;&lt;td&gt;129.40&lt;/td&gt;&lt;td&gt;111.80&lt;/td&gt;&lt;td&gt;5.4%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;374.07&lt;/td&gt;&lt;td&gt;290.36&lt;/td&gt;&lt;td&gt;235.16&lt;/td&gt;&lt;td&gt;196.21&lt;/td&gt;&lt;td&gt;7.9%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;692.94&lt;/td&gt;&lt;td&gt;519.17&lt;/td&gt;&lt;td&gt;409.84&lt;/td&gt;&lt;td&gt;335.12&lt;/td&gt;&lt;td&gt;10.7%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;算法：各情境的 10 年現金流與終值改用門檻當折現率，經同一股權橋換成每股；股價等於這個價格時，該情境成真的現價隱含年報酬就等於門檻（兩者互為反函數）。&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;二、五年報酬矩陣：現價買進、持有 5 年的年化報酬（三情境 × 三種第 5 年倍數；推導，條件式，非預期報酬）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;第 5 年 EBIT（估值輸入單位，推導）&lt;/th&gt;&lt;th&gt;維持現在 22.2 倍&lt;/th&gt;&lt;th&gt;縮四分之一 16.7 倍&lt;/th&gt;&lt;th&gt;回到參考帶中位（軟體與網路） 15.5 倍&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;161,832.2&lt;/td&gt;&lt;td&gt;2.3%&lt;/td&gt;&lt;td&gt;-3.0%&lt;/td&gt;&lt;td&gt;-4.3%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;276,805.5&lt;/td&gt;&lt;td&gt;13.2%&lt;/td&gt;&lt;td&gt;7.2%&lt;/td&gt;&lt;td&gt;5.8%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;413,996.3&lt;/td&gt;&lt;td&gt;22.8%&lt;/td&gt;&lt;td&gt;16.3%&lt;/td&gt;&lt;td&gt;14.7%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;算法：現價買進、持有 5 年：第 1–5 年自由現金流與第 5 年企業價值（倍數 × 該情境第 5 年 EBIT）折回今天、經今日股權橋與股數換成每股，解出使每股等於現價的年報酬（與現價隱含年報酬同一算法，只是第 5 年改用倍數計價）；不另估 5 年後的淨債務與股數。企業價值 ÷ 當年 EBIT 口徑與市價隱含第 10 年倍數、參考帶相同。推導。現在倍數＝市場企業價值 3,491,911.5 ÷ 近四季營業利益 156,976.0（估值輸入 company_metrics.ebit）＝22.2 倍；縮四分之一＝現在倍數 × 0.75。參考帶：大類層「軟體與網路」中位 15.5 倍（機械回測樣本，非市場全體；分產業的筆數與公司數少，僅供參考）。&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;三、林區比值（只給比值與口徑；成長率與本益比的口徑同「PEG 與林區檢查」表的基準情境推估那一列）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;數值&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;林區分類&lt;/td&gt;&lt;td&gt;穩定成長股（Stalwart）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;成長率（基準情境推估（稅後營業利益年增－股數年變化））&lt;/td&gt;&lt;td&gt;10.7%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;本益比&lt;/td&gt;&lt;td&gt;28.4 倍&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股息殖利率&lt;/td&gt;&lt;td&gt;0.3%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;本益比 ÷ 成長率&lt;/td&gt;&lt;td&gt;2.64&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;（成長率＋股息殖利率）÷ 本益比&lt;/td&gt;&lt;td&gt;0.39&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;林區以本益比約等於成長率為參考（二手來源轉述）；本表不設門檻。只給比值與口徑，不作便宜或昂貴的判斷，不進研究評等與價格位置。非買賣建議。&lt;/p&gt;&lt;/div&gt;&lt;!--/成長型價格參考--&gt;&lt;div class=&quot;note-box&quot;&gt;&lt;b&gt;同業與歷史倍數交叉核對（不進評等）：260–313 美元&lt;/b&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;依同業的企業價值／營業利益倍數與自身歷史本益比換算的每股價值，各法 25 百分位的中位數到 75 百分位的中位數；不是股價波動範圍，也不是合理價值。原稱「市場情緒區間」；2026-11-11 起只作交叉核對，不決定價格位置與研究評等（價格位置三級：買入區、合理、偏貴，只看買入區上緣與合理價值高端）。同業僅 3 家，分位僅供參考。&lt;/p&gt;&lt;/div&gt;&lt;!--目標區間:第五題--&gt;&lt;div class=&quot;block&quot; id=&quot;target-body&quot;&gt;&lt;h3&gt;12 個月條件式目標區間：三種情境各自成真時的價值（條件式、非買賣建議）&lt;/h3&gt;&lt;p class=&quot;cap&quot;&gt;條件式目標區間：三種情境各自成真時的每股價值區間，不是股價預測，三段不合成單一數字；非買賣建議。不影響合理價值、價格位置與研究評等。&lt;/p&gt;&lt;p&gt;算法：各情境每股價值（折現率高低兩端）×（1＋股權成本 9.73%）− 未來 12 個月每股股利 0.88 美元（作者輸入：8-K 2026-10-28 新聞稿 §9：董事會 2026-10 宣告 A、B、C 類股季股利每股 0.22 美元；0.22 × 4＝0.88（推導，未計 12 個月內可能的調升；強制轉換特別股股利不計，特別股列其他請求權））；回購不加回。起點 2026-11-13 收盤，終點 2027-11-13。三段是各情境在折現率上下兩端的每股價值向前推 12 個月，不是價格機率分布的切片；段與段之間可能有空白，也可能重疊。區間主要寬度來自折現率不確定，不是 12 個月內的營運變化。&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt&quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;機率（政策權重，未經歷史校準）&lt;/th&gt;&lt;th&gt;目標區間（美元）&lt;/th&gt;&lt;th&gt;相對現價&lt;/th&gt;&lt;th&gt;關鍵假設（估值輸入）&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;25%&lt;/td&gt;&lt;td&gt;&lt;b&gt;111.20–145.02&lt;/b&gt;&lt;/td&gt;&lt;td&gt;−62%～−51%&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;第 1 年營收 +12.0%；營業利益率 30.0%；穩態 25.0%；永續成長 2.5%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;50%&lt;/td&gt;&lt;td&gt;&lt;b&gt;191.49–265.97&lt;/b&gt;&lt;/td&gt;&lt;td&gt;−35%～−10%&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;第 1 年營收 +20.0%；營業利益率 32.0%；穩態 31.0%；永續成長 3.0%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;25%&lt;/td&gt;&lt;td&gt;&lt;b&gt;323.75–466.01&lt;/b&gt;&lt;/td&gt;&lt;td&gt;+9%～+58%&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;第 1 年營收 +27.0%；營業利益率 33.0%；穩態 39.0%；永續成長 3.5%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;口徑：報告中「現價隱含年報酬（基準情境，非預期報酬）約 7.9%」是以現價買進、持有該情境全期現金流（含永續價值）的年化報酬；這裡的目標區間是 12 個月後各情境每股價值的前推，兩者口徑不同，不能互相換算（例如不能用前者推 12 個月後的價格）。&lt;/p&gt;&lt;h4 style=&quot;margin-top:14px&quot;&gt;每一段要成立，市場這一面需要什麼、正在顯示什麼&lt;/h4&gt;&lt;ul class=&quot;prose&quot;&gt;&lt;li&gt;保守段代表值 130.1（基準折現率前推）要成立，一年後EV／營業利益需約 9.1 倍（現在 22.2 倍，低於現在倍數）；過去一年逐日重建的交易日中，99% 以上高於這個倍數、不到 1% 低於這個倍數（推導）；同規模同成長低於 p25。這是把價值翻成倍數的讀法，不是預測市場會給這個倍數。&lt;/li&gt;&lt;li&gt;基準段代表值 232.6（基準折現率前推）要成立，一年後EV／營業利益需約 15.0 倍（現在 22.2 倍，低於現在倍數）；過去一年逐日重建的交易日中，99% 以上高於這個倍數、不到 1% 低於這個倍數（推導）；同規模同成長約第 42 百分位（p25–p75 間線性內插，推導）。這是把價值翻成倍數的讀法，不是預測市場會給這個倍數。&lt;/li&gt;&lt;li&gt;樂觀段代表值 401.5（基準折現率前推）要成立，一年後EV／營業利益需約 24.3 倍（現在 22.2 倍，高於現在倍數）；過去一年逐日重建的交易日中，95% 高於這個倍數、5% 低於這個倍數（推導）；同規模同成長約第 67 百分位（p25–p75 間線性內插，推導）。這是把價值翻成倍數的讀法，不是預測市場會給這個倍數。&lt;/li&gt;&lt;li&gt;以 2027-12-17 到期選擇權的價平隱含波動 37.9%（2026-11-14 08:53 UTC 取得；最近成交 2026-11-13，不在取得當天；取價時現價 295.77，起點價 295.77 為 2026-11-13 收盤）定價，12 個月後（2027-11-13）價格落在保守段 2.9%、基準段 28%、樂觀段 28%；低於最低端（111.20） 0.6%、高於最高端（466.01） 10%、段與段之間空白 31%、段與段重疊 0.0%。這是風險中立機率，不是真實機率；不改情境權重、不改估值與評等；選擇權定價含風險溢酬與波動偏態，與三段情境機率是兩回事。報價品質：買權 43.5%、賣權 32.3% 相差 11 個百分點，報價可能過時或含偏斜，只作參考。&lt;/li&gt;&lt;li&gt;公債殖利率下降 1 個百分點時，保守／基準／樂觀段代表值（基準折現率前推，不是區間兩端的平均）為 150.1／278.0／490.1；目前 130.1／232.6／401.5；上升 1 個百分點時為 115.0／199.3／338.0（美元，股權成本同幅變動，其他假設不變）。&lt;/li&gt;&lt;li&gt;分析師預估：本財年每股盈餘預估 19.56，較 30 天前 20.61 −5.1%（下修），近 30 天 0 家上修、45 家下修；下一財年每股盈餘預估 14.97，較 30 天前 15.03 −0.4%（持平），近 30 天 19 家上修、26 家下修。只描述預估修正的方向，不當證據，也不是目標區間的任一端。&lt;/li&gt;&lt;li&gt;券商目標價近 90 天有 22 家調整：上調 4、下調 16、持平 2（只揭露，不是本報告的目標價）。&lt;/li&gt;&lt;li&gt;上季（Sep 2026，10/28/2026 公布）每股盈餘 2.12，共識預估 2.94，驚奇 -27.89%（Nasdaq）；yfinance 另列 2026-09-30 實際 2.12、預估 3.01、驚奇 -29.54%；兩個來源口徑可能不同（可能是調整後或一般會計準則），公司申報的每股盈餘可對照存檔 8-K 2026-10-28 財報新聞稿（本句未逐項比對），只描述、不當證據。&lt;/li&gt;&lt;/ul&gt;&lt;p class=&quot;cap&quot;&gt;以上只引用已存檔的數字描述條件與現況，不是預測；選擇權機率是風險中立機率、不是真實機率，不改情境權重；分析師預估與券商目標價不當證據；細節表在附錄估值細節。&lt;/p&gt;&lt;p&gt;&lt;b&gt;需要重算區間的事件：&lt;/b&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;搜尋反壟斷案（美國哥倫比亞特區聯邦地方法院）2025-12 的最終判決限制 Google 搜尋的分發方式，並要求與特定競爭者分享搜尋資料、提供搜尋聯合供應服務；Google 2026-01 提出上訴並聲請暫停部分補救措施（法院以時機未到駁回，待補救範圍更明確後可再聲請），司法部與各州檢察長 2026-02 也上訴，上訴仍在審理中。若上訴判決或暫停實施聲請的結果改變補救措施的範圍（擴大或放寬），搜尋營收、分發成本與利潤率假設需要重算；10-Q 對此案未揭露可估計的損失金額（10-Q 2026-09-30 Part I, Item 1 ¶331）&lt;/li&gt;&lt;li&gt;GFiber 出售交易（2026-03 簽署的最終協議，把 GFiber 股權投入新成立的實體）預計 2026 年底完成：完成後 Google 收到現金 15 億美元、20 億美元應收票據與 49.99% 股權，GFiber 不再合併（改以權益法的未合併 VIE 處理），合併營收基數與 Other Bets 營業損失口徑將改變；10-Q 未揭露 GFiber 營收與營業損失金額，每股影響未取得，不納入估值（10-Q 2026-09-30 Part I, Item 1 ¶294；10-Q 2026-09-30 Part I, Item 1 ¶295；10-Q 2026-09-30 Part I, Item 2 ¶256）&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;b&gt;時程可能延後、落在 12 個月之外的事件：&lt;/b&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;廣告技術反壟斷案（美國維吉尼亞東區聯邦地方法院）2026-09 的補救判決駁回司法部要求的結構性拆分，改命行為性補救（互通性、資料存取、拍賣行為）；法院尚未進入最終判決，進入後 Google 計畫就 2025-04 的不利認定提出上訴，也可能就 2026-09 判決的部分提出上訴；德州東區各州檢察長案的審判排在司法部案補救程序結束之後，10-Q 未給日期。最終判決、上訴結果與德州審判的時程未揭露，可能落在未來 12 個月之外；10-Q 稱無法估計可能損失（10-Q 2026-09-30 Part I, Item 1 ¶332）&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;!--/目標區間:第五題--&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;市價要求的成長：三視角反推、假設對照實績、歷史基準比率與市價溢價來源&lt;/h3&gt;&lt;p&gt;這一節把現價代回估值模型反解「市場要求什麼」，再和公司實績、同規模公司的歷史比例、市場面的過熱訊號對照；只揭露，不改合理價值、價格位置與研究評等。&lt;/p&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;市價隱含什麼、我們假設什麼、公司做到什麼&lt;/h4&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;視角（其他假設照基準，三者擇一）&lt;/th&gt;&lt;th&gt;市價隱含&lt;/th&gt;&lt;th&gt;本報告基準&lt;/th&gt;&lt;th&gt;實績或對照&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;成長&lt;/td&gt;&lt;td&gt;第 1–5 年營收每年約 16.4%&lt;/td&gt;&lt;td&gt;第 1–5 年平均約 13.0%（推算）&lt;/td&gt;&lt;td&gt;近四季 22.2%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;利潤率&lt;/td&gt;&lt;td&gt;第 1 年起每年（含穩態）營業利益率約 41.4%&lt;/td&gt;&lt;td&gt;第 1 年 32.0%、穩態 31.0%&lt;/td&gt;&lt;td&gt;20.1%–32.1%（近 11 年營業利益率）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;折現率&lt;/td&gt;&lt;td&gt;約 7.9%（使基準情境等於現價的折現率）&lt;/td&gt;&lt;td&gt;加權資本成本 9.5%&lt;/td&gt;&lt;td&gt;10 年期公債 5.15%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;市價隱含折現率約 7.9%，比加權資本成本 9.5% 低約 1.6 個百分點：照基準情境假設，現價隱含的長期報酬低於本報告採用的資金成本；市價要站得住，需要基準以外的假設成立（例如成長或利潤率高於基準，見上兩列），或投資人接受較低的報酬。隱含折現率不是預期報酬；V3 回測（2016–2025，含倖存者偏誤）中，之後一年實際報酬中位多高於隱含值。只揭露，不改研究評等與價格位置；非買賣建議。&lt;/p&gt;&lt;div style=&quot;margin-top:12px&quot;&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;第 1 年營收成長&lt;/th&gt;&lt;th&gt;穩態營業利益率&lt;/th&gt;&lt;th&gt;終端投入資本報酬率（ROIC）&lt;/th&gt;&lt;th&gt;永續成長&lt;/th&gt;&lt;th&gt;對照實績&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;12.0%&lt;/td&gt;&lt;td&gt;25.0%&lt;/td&gt;&lt;td&gt;17.0%&lt;/td&gt;&lt;td&gt;2.5%&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;20.0%&lt;/td&gt;&lt;td&gt;31.0%&lt;/td&gt;&lt;td&gt;25.0%&lt;/td&gt;&lt;td&gt;3.0%&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;27.0%&lt;/td&gt;&lt;td&gt;39.0%&lt;/td&gt;&lt;td&gt;32.0%&lt;/td&gt;&lt;td&gt;3.5%&lt;/td&gt;&lt;td&gt;高於歷史上限（穩態利潤率）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;公司實績&lt;/td&gt;&lt;td&gt;近四季 22.2%&lt;/td&gt;&lt;td&gt;近四季 33.3%；20.1%–32.1%（近 11 年營業利益率）&lt;/td&gt;&lt;td&gt;近四季 37.2%；研發資本化後約 30.7%（2025-12-31 財年，研發資本化對照.json）&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;p style=&quot;margin-top:8px&quot;&gt;&lt;b&gt;為何樂觀情境的穩態利潤率高於歷史上限（作者說明）：&lt;/b&gt;樂觀穩態利潤率 39% 高於近 11 年上限 32.1%：近四季已達 33.3%，增量營業利益率約 41%–45%（推導，長期財務），雲端分部利益率由 23.7% 升到 36.2%（10-Q 2026-09-30 分部附註），規模擴張讓利潤率仍在改善。&lt;/p&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;市價隱含三視角：把現價代回基準情境，一次只放開一個假設反解（成長、利潤率、折現率），三者擇一成立即可，不是同時需要；折現率視角就是第四題「現價隱含年報酬（基準情境，非預期報酬）」。假設對照：終端 ROIC 低於近四季一半時標「保守於實績」，括號寫原因：產業上限、公司近五年中位上限或等於資金成本是估值框架的上限設定（估值政策），作者選值的理由在估值輸入，都不是資料錯誤；穩態利潤率高於歷史上限標「高於歷史上限」；利潤率仍在改善中的公司（轉型、規模擴張期），歷史上限不一定是天花板，標記只提醒讀者對照，不代表假設錯誤。出處：估值結果.json（reverse_dcf、implied_return、discount）、估值輸入.json（scenarios）、財務指標.json（ROIC_TTM）、產業指標.json（景氣正常化）、成長推估底稿.json 與財務歷史.json（近四季）；推導，只揭露，不改合理價值、價格位置與研究評等。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;市價隱含的成長與歷史基準比率&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;市價隱含 GOOGL 未來 10 年營收實質年增約 15.0%–15.5%（名目 17.5% 減通膨 2.0%–2.5% 的近似，推導）；1950–2015 年營收 500 億美元以上的公司中，10 年間做到實質年增 10% 以上的約 3.9%–0.9%（Mauboussin 等，2016，表 4）。此為揭露，不是市價錯誤的證明。&lt;/p&gt;&lt;p&gt;現價要成立，需把基準情境第 1 年營收成長 20.0% 延續約 9 年（之後新投資報酬等於折現率，不再創造價值；推導，只揭露）。&lt;/p&gt;&lt;p&gt;&lt;b&gt;隱含假設罕見度：歷史罕見&lt;/b&gt;（同規模公司 10 年做到的歷史比例 ≥50% 一般、10%–50% 樂觀、&amp;lt;10% 歷史罕見；只揭露，不改研究評等與價格位置）&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;超額報酬期間&lt;/th&gt;&lt;th&gt;市價隱含營收年增（名目）&lt;/th&gt;&lt;th&gt;約實質（名目減通膨 2.0%–2.5% 的近似，推導）&lt;/th&gt;&lt;th&gt;歷史基準比率（1950–2015）&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;10 年&lt;/td&gt;&lt;td&gt;17.5%&lt;/td&gt;&lt;td&gt;15.0%–15.5%&lt;/td&gt;&lt;td&gt;營收 500 億美元以上：10 年實質年增 10% 以上約 3.9%–0.9%（該組 10 年實質年增中位數 1.1%）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;15 年&lt;/td&gt;&lt;td&gt;13.0%&lt;/td&gt;&lt;td&gt;10.5%–11.0%&lt;/td&gt;&lt;td&gt;原文只有 10 年分布，15、20 年無對照&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;20 年&lt;/td&gt;&lt;td&gt;10.9%&lt;/td&gt;&lt;td&gt;8.4%–8.9%&lt;/td&gt;&lt;td&gt;原文只有 10 年分布，15、20 年無對照&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;做法：超額報酬期間內營收年增固定、利潤率與銷售對資本比取基準情境第 5 年；期間結束後新投資報酬等於折現率（不再創造價值）；永續成長照基準情境。折現率 9.53%、第 5 年利潤率 32.0%。來源：Mauboussin, Callahan &amp;amp; Majd（2016）〈The Base Rate Book〉表 4（第三方轉載，原表 1950–2015 年、實質成長、有存活偏差）。這張表只說明「市價需要多強、多久的成長才成立」，不改合理價值、買入區上緣與價格位置；歷史比例低代表市價需要少見的結果，不代表市價錯誤。通膨假設 2.0%–2.5% 依 Morningstar 2020-10 方法，實質年增為名目直接減通膨的近似。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;市價溢價來源&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;溢價訊號集中在資金與情緒（部位與衍生品、擁擠度）、基本面預期（隱含假設罕見度）。倍數重估、總經與利率無訊號。只揭露，不改研究評等與價格位置，也不代表市價錯誤。&lt;/p&gt;&lt;p&gt;EPS 預估：+1y（2027 財年，推導） 預估 90 天 1.3%（持平；判斷窗口為 90 天，±2% 內視為持平），近 30 天上修減下修 -7 家；yfinance 預估是取得當下快照，股價 90 天變化以批次收盤日為終點，兩者日期可能差幾天；取得 2026-11-14，晚於收盤日 2026-11-13。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;來源類別&lt;/th&gt;&lt;th&gt;數值&lt;/th&gt;&lt;th&gt;過熱訊號&lt;/th&gt;&lt;th&gt;說明／存檔位置&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;隱含假設罕見度&lt;/td&gt;&lt;td&gt;基本面預期&lt;/td&gt;&lt;td&gt;歷史罕見&lt;/td&gt;&lt;td&gt;有&lt;/td&gt;&lt;td&gt;價值判斷.json#/市價隱含假設&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;倍數擴張&lt;/td&gt;&lt;td&gt;倍數重估&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;不適用&lt;/td&gt;&lt;td&gt;EPS 年化變動 +89%，超過 ±50%（基期失真）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;預估背離&lt;/td&gt;&lt;td&gt;倍數重估&lt;/td&gt;&lt;td&gt;+1y（2027 財年，推導） EPS 預估 90 天 +1.3%（持平；90 天變化 ±2% 內視為持平），同期股價 -14.5% → 預估未跟上下跌，偏情緒&lt;/td&gt;&lt;td&gt;無&lt;/td&gt;&lt;td&gt;價值判斷.json#/預估修正&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;本益比水位&lt;/td&gt;&lt;td&gt;倍數重估&lt;/td&gt;&lt;td&gt;現在 15.4 倍，自身五年 p75 27.3 倍&lt;/td&gt;&lt;td&gt;無&lt;/td&gt;&lt;td&gt;市場資料/歷史本益比.json#/pe_p75&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股債利差&lt;/td&gt;&lt;td&gt;總經與利率&lt;/td&gt;&lt;td&gt;近期百分位 75%（0% 最貴）&lt;/td&gt;&lt;td&gt;無&lt;/td&gt;&lt;td&gt;市場資料/歷史本益比.json#/股債利差/近期百分位&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;整體市場風險溢價&lt;/td&gt;&lt;td&gt;總經與利率&lt;/td&gt;&lt;td&gt;Damodaran 隱含風險溢價 4.20%（2026-10-01）&lt;/td&gt;&lt;td&gt;不適用&lt;/td&gt;&lt;td&gt;只存當月值，沒有歷史序列可比中位數；要下載 Damodaran 歷史表需使用者同意&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;動能&lt;/td&gt;&lt;td&gt;資金與情緒&lt;/td&gt;&lt;td&gt;相對 200 日均線 -13%；12 個月（2025-11-12 起） +3% 對 S&amp;amp;P500 +12%&lt;/td&gt;&lt;td&gt;無&lt;/td&gt;&lt;td&gt;市場資料/市場溫度.json#/趨勢、#/動能&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;部位與衍生品&lt;/td&gt;&lt;td&gt;資金與情緒&lt;/td&gt;&lt;td&gt;選擇權賣權對買權量比 偏熱；空單分位 44%、回補天數分位 50%&lt;/td&gt;&lt;td&gt;有&lt;/td&gt;&lt;td&gt;市場資料/市場溫度.json#/選擇權情緒、#/流動性&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;擁擠度&lt;/td&gt;&lt;td&gt;資金與情緒&lt;/td&gt;&lt;td&gt;20 日均換手率在自身五年 78% 分位；被發現程度 高&lt;/td&gt;&lt;td&gt;有&lt;/td&gt;&lt;td&gt;市場資料/市場溫度.json#/流動性/20日均換手率_分位&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;股價漲跌拆解：EPS 成長 vs 本益比變化（年化對數點，推導；不含股利、申報 EPS）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;期間&lt;/th&gt;&lt;th&gt;股價年化&lt;/th&gt;&lt;th&gt;EPS 貢獻&lt;/th&gt;&lt;th&gt;本益比貢獻&lt;/th&gt;&lt;th&gt;本益比&lt;/th&gt;&lt;th&gt;主因&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;1年&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;EPS 年化變動 +89%，超過 ±50%（基期失真）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;3年&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;EPS 年化變動 +54%，超過 ±50%（基期失真）&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;門檻：使用者 2026-11-04 照草案核定（程式/市場溢價來源.py 常數）。各列只描述市場面，不改合理價值、研究評等與價格位置，非買賣建議。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;multiple-conditions&quot;&gt;&lt;h3&gt;長期倍數條件：要漲 3／5／10 倍需要什麼&lt;/h3&gt;&lt;p&gt;反過來問：股價要在 5 年或 10 年內每股漲到 3、5、10 倍，期末營收、利潤率、估值倍數要做到多少，歷史上同規模公司有多少做到過。&lt;b&gt;條件反推，非預測、非機率、非目標價、非買賣建議&lt;/b&gt;；不改研究評等、價格位置與目標區間。&lt;/p&gt;&lt;p class=&quot;cap&quot;&gt;主列＝產業倍數＋基準穩態利潤率；括號是三種期末倍數口徑（不重估、產業、自身本益比 p25）的範圍。股數年稀釋率 -2.4%（推導）。罕見度：5 年用自有 SEC 名目分布、10 年用 Base Rate Book（1950–2015，實質）。&lt;/p&gt;&lt;ul&gt;&lt;li&gt;3 倍／5 年：營收年增約 17.8%（3 種期末倍數口徑 17.8%–30.3%），歷史罕見（營收 500 億美元以上的公司 5 年約 6.7% 做到）；資金自足&lt;/li&gt;&lt;li&gt;3 倍／10 年：營收年增約 7.2%（3 種期末倍數口徑 7.2%–12.8%），一般～樂觀（營收 500 億美元以上的公司 10 年約 58.9%–21.1% 做到）；資金自足&lt;/li&gt;&lt;li&gt;5 倍／5 年：營收年增約 30.7%（3 種期末倍數口徑 30.7%–44.6%），歷史罕見（營收 500 億美元以上的公司 5 年約 0% 做到）；資金自足&lt;/li&gt;&lt;li&gt;5 倍／10 年：營收年增約 12.9%（3 種期末倍數口徑 12.9%–18.8%），歷史罕見（營收 500 億美元以上的公司 10 年約 3.9% 做到）；資金自足&lt;/li&gt;&lt;li&gt;10 倍／5 年：營收年增約 50.3%（3 種期末倍數口徑 50.3%–66.2%），歷史罕見（營收 500 億美元以上的公司 5 年約 0% 做到）；資金有缺口&lt;/li&gt;&lt;li&gt;10 倍／10 年：營收年增約 21.1%（3 種期末倍數口徑 21.1%–27.4%），歷史罕見（營收 500 億美元以上的公司 10 年約 0.9% 做到）；資金自足&lt;/li&gt;&lt;/ul&gt;&lt;details&gt;&lt;summary&gt;全部格子&lt;/summary&gt;&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;倍數／期間&lt;/th&gt;&lt;th&gt;期末倍數口徑&lt;/th&gt;&lt;th&gt;利潤率口徑&lt;/th&gt;&lt;th&gt;需要營收年增&lt;/th&gt;&lt;th&gt;期末營收為現在&lt;/th&gt;&lt;th&gt;罕見度&lt;/th&gt;&lt;th&gt;資金&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;3 倍／5 年&lt;/td&gt;&lt;td&gt;不重估（27.1）&lt;/td&gt;&lt;td&gt;近四季（33.3%）&lt;/td&gt;&lt;td&gt;22.3%&lt;/td&gt;&lt;td&gt;2.7 倍&lt;/td&gt;&lt;td&gt;歷史罕見&lt;/td&gt;&lt;td&gt;自足&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;3 倍／5 年&lt;/td&gt;&lt;td&gt;不重估（27.1）&lt;/td&gt;&lt;td&gt;基準穩態（31.0%）&lt;/td&gt;&lt;td&gt;24.1%&lt;/td&gt;&lt;td&gt;2.9 倍&lt;/td&gt;&lt;td&gt;歷史罕見&lt;/td&gt;&lt;td&gt;自足&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;3 倍／5 年&lt;/td&gt;&lt;td&gt;產業（35.2）&lt;/td&gt;&lt;td&gt;近四季（33.3%）&lt;/td&gt;&lt;td&gt;16.1%&lt;/td&gt;&lt;td&gt;2.1 倍&lt;/td&gt;&lt;td&gt;歷史罕見&lt;/td&gt;&lt;td&gt;自足&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;3 倍／5 年&lt;/td&gt;&lt;td&gt;產業（35.2）&lt;/td&gt;&lt;td&gt;基準穩態（31.0%）&lt;/td&gt;&lt;td&gt;17.8%&lt;/td&gt;&lt;td&gt;2.3 倍&l t;td&gt;10 倍／10 年&lt;/td&gt;&lt;td&gt;產業（35.2）&lt;/td&gt;&lt;td&gt;近四季（33.3%）&lt;/td&gt;&lt;td&gt;20.2%&lt;/td&gt;&lt;td&gt;6.3 倍&lt;/td&gt;&lt;td&gt;歷史罕見&lt;/td&gt;&lt;td&gt;自足&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;10 倍／10 年&lt;/td&gt;&lt;td&gt;產業（35.2）&lt;/td&gt;&lt;td&gt;基準穩態（31.0%）&lt;/td&gt;&lt;td&gt;21.1%&lt;/td&gt;&lt;td&gt;6.8 倍&lt;/td&gt;&lt;td&gt;歷史罕見&lt;/td&gt;&lt;td&gt;自足&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;10 倍／10 年&lt;/td&gt;&lt;td&gt;均值回歸（21.3）&lt;/td&gt;&lt;td&gt;近四季（33.3%）&lt;/td&gt;&lt;td&gt;26.4%&lt;/td&gt;&lt;td&gt;10.5 倍&lt;/td&gt;&lt;td&gt;歷史罕見&lt;/td&gt;&lt;td&gt;自足&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;10 倍／10 年&lt;/td&gt;&lt;td&gt;均值回歸（21.3）&lt;/td&gt;&lt;td&gt;基準穩態（31.0%）&lt;/td&gt;&lt;td&gt;27.4%&lt;/td&gt;&lt;td&gt;11.2 倍&lt;/td&gt;&lt;td&gt;歷史罕見&lt;/td&gt;&lt;td&gt;自足&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/details&gt;&lt;p class=&quot;cap&quot;&gt;限制：&lt;/p&gt;&lt;ul class=&quot;cap&quot;&gt;&lt;li&gt;Base Rate Book 1950–2015、只含存續公司（存活偏差）；原表 10 年欄，5 年期待建立&lt;/li&gt;&lt;li&gt;非營業淨資產假設不變；資金缺口另列，不回頭改期末市值&lt;/li&gt;&lt;li&gt;均值回歸以本益比近似 EV÷稅後營業利益；產業倍數是 Damodaran 目前值，不是成熟期值&lt;/li&gt;&lt;li&gt;罕見度是歷史上多少公司做到，不是這家公司做到的機率&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;!--目標區間:附錄--&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;目標區間的倍數核對（只列不合成）&lt;/h3&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt&quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;倍數區段&lt;/th&gt;&lt;th&gt;倍數（EV／營業利益）&lt;/th&gt;&lt;th&gt;第 1 年獲利（百萬美元）&lt;/th&gt;&lt;th&gt;核對區間（美元）&lt;/th&gt;&lt;th&gt;代表值需要倍數&lt;/th&gt;&lt;th&gt;主方法代表值對核對區間中點&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;同規模同成長 p25～中位&lt;/td&gt;&lt;td&gt;10.95–16.87&lt;/td&gt;&lt;td&gt;158,289&lt;/td&gt;&lt;td&gt;153.98–229.60&lt;/td&gt;&lt;td&gt;9.1&lt;/td&gt;&lt;td&gt;−32%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;現在倍數～自身近五年 p25&lt;/td&gt;&lt;td&gt;19.66–22.24&lt;/td&gt;&lt;td&gt;180,902&lt;/td&gt;&lt;td&gt;301.05–338.67&lt;/td&gt;&lt;td&gt;15.0&lt;/td&gt;&lt;td&gt;−27%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;自身近五年中位～p75&lt;/td&gt;&lt;td&gt;21.79–29.81&lt;/td&gt;&lt;td&gt;197,437&lt;/td&gt;&lt;td&gt;361.03–488.67&lt;/td&gt;&lt;td&gt;24.3&lt;/td&gt;&lt;td&gt;−5%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;各情境第 1 年營業利益（假設，推導；不是公司指引）。每股 =（倍數 × 獲利 − 股權橋 -177,411）÷ 12,406.0 百萬股，與估值引擎同口徑。倍數維持現在倍數不變、只看獲利，每股 ＝（現在倍數 × 第 1 年獲利 − 股權橋）÷ 股數：保守 298.1、基準 338.7、樂觀 368.3（美元）。倍數核對回答「市場一年後照這種擔憂程度給倍數，價格會在哪」；與主方法的差距是價值與市場慣例的落差，不合成、不平均。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;目標區間的企業價值前推核對&lt;/h3&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt&quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;股權成本前推（每股，折現率基準）&lt;/th&gt;&lt;th&gt;企業價值前推（每股）&lt;/th&gt;&lt;th&gt;相對差距&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;130.09&lt;/td&gt;&lt;td&gt;128.49&lt;/td&gt;&lt;td&gt;1.23%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;232.63&lt;/td&gt;&lt;td&gt;230.85&lt;/td&gt;&lt;td&gt;0.76%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;401.51&lt;/td&gt;&lt;td&gt;399.44&lt;/td&gt;&lt;td&gt;0.52%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;EV₀×（1＋WACC）−股權橋 與 每股價值×（1＋股權成本）的差；差距≥1% 只標註（槓桿較高時前者未計利息），不改目標區間。最大相對差距 1.23%（達 1% 以上，僅標註）。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;各段代表值需要的倍數與歷史位置&lt;/h3&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt&quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;需要倍數（EV／營業利益）&lt;/th&gt;&lt;th&gt;相對現在 22.2 倍&lt;/th&gt;&lt;th&gt;自身近一年高於／低於此倍數的交易日比例&lt;/th&gt;&lt;th&gt;自身近五年（存檔四分位內插）&lt;/th&gt;&lt;th&gt;同規模同成長&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;9.1&lt;/td&gt;&lt;td&gt;低於&lt;/td&gt;&lt;td&gt;99% 以上／不到 1%&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;低於 p25&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;低於 p25&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;15.0&lt;/td&gt;&lt;td&gt;低於&lt;/td&gt;&lt;td&gt;99% 以上／不到 1%&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;低於 p25&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;約第 42 百分位（p25–p75 間線性內插，推導）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;24.3&lt;/td&gt;&lt;td&gt;高於&lt;/td&gt;&lt;td&gt;95%／5%&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;約第 58 百分位（p25–p75 間線性內插，推導）&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;約第 67 百分位（p25–p75 間線性內插，推導）&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;需要倍數＝（代表值×股數＋股權橋）÷ 情境第 1 年獲利（推導）；是把價值翻成倍數的讀法，不是預測市場會給這個倍數。自身近一年比例：近一年每日 EV／近四季獲利（申報日後才可用）重建，四分位與市場給價存檔一致；推導（2025-11-13 至 2026-11-13，252 個交易日）。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;約 12 個月選擇權隱含分布下，各段的風險中立機率&lt;/h3&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt&quot;&gt;&lt;tr&gt;&lt;th&gt;保守段&lt;/th&gt;&lt;th&gt;基準段&lt;/th&gt;&lt;th&gt;樂觀段&lt;/th&gt;&lt;th&gt;低於最低端&lt;/th&gt;&lt;th&gt;高於最高端&lt;/th&gt;&lt;th&gt;段與段空白&lt;/th&gt;&lt;th&gt;段與段重疊&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2.9%&lt;/td&gt;&lt;td&gt;28%&lt;/td&gt;&lt;td&gt;28%&lt;/td&gt;&lt;td&gt;0.6%&lt;/td&gt;&lt;td&gt;10%&lt;/td&gt;&lt;td&gt;31%&lt;/td&gt;&lt;td&gt;0.0%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;風險中立機率，不是真實機率；不改情境權重、不改估值與評等。到期日 2027-12-17（離終點日 34 天）價平隱含波動 37.9%（買權 43%、賣權 32%），最近成交 2026-11-13 20:56:17+00:00（最近成交 2026-11-13，不在取得當天；取價時現價 295.77，起點價 295.77 為 2026-11-13 收盤）；無風險利率 4.65%（FRED DGS1，2026-11-12 觀測 4.65%，資料庫/利率_FRED.json）、股利率 0.30%；起點價格 295.77（2026-11-13 收盤）。對數常態；漂移＝無風險利率（固定用 1 年期 DGS1，期間固定 1 年，不依到期日做期限插補）−股利率；波動＝價平隱含波動（不含波動微笑與偏態）；以批次收盤價為起點、12 個月為期間。各段機率是價格落在該段價值區間內的機率，段與段重疊處在各段機率中重複計入。報價品質：買權 43.5%、賣權 32.3% 相差 11 個百分點，報價可能過時或含偏斜，只作參考。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;預估修正趨勢（只描述，不當證據）&lt;/h3&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt&quot;&gt;&lt;tr&gt;&lt;th&gt;期間&lt;/th&gt;&lt;th&gt;每股盈餘預估&lt;/th&gt;&lt;th&gt;7 天前&lt;/th&gt;&lt;th&gt;30 天前&lt;/th&gt;&lt;th&gt;60 天前&lt;/th&gt;&lt;th&gt;90 天前&lt;/th&gt;&lt;th&gt;較 30 天前&lt;/th&gt;&lt;th&gt;近 7 天上修／下修家數&lt;/th&gt;&lt;th&gt;近 30 天上修／下修家數&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;本季&lt;/td&gt;&lt;td&gt;3.20&lt;/td&gt;&lt;td&gt;3.20&lt;/td&gt;&lt;td&gt;3.35&lt;/td&gt;&lt;td&gt;3.34&lt;/td&gt;&lt;td&gt;3.33&lt;/td&gt;&lt;td&gt;下修&lt;/td&gt;&lt;td&gt;10／27&lt;/td&gt;&lt;td&gt;10／26&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;下一季&lt;/td&gt;&lt;td&gt;3.33&lt;/td&gt;&lt;td&gt;3.33&lt;/td&gt;&lt;td&gt;3.46&lt;/td&gt;&lt;td&gt;3.40&lt;/td&gt;&lt;td&gt;3.40&lt;/td&gt;&lt;td&gt;下修&lt;/td&gt;&lt;td&gt;4／11&lt;/td&gt;&lt;td&gt;6／8&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;本財年（2026 財年，推導）&lt;/td&gt;&lt;td&gt;19.56&lt;/td&gt;&lt;td&gt;19.53&lt;/td&gt;&lt;td&gt;20.61&lt;/td&gt;&lt;td&gt;20.61&lt;/td&gt;&lt;td&gt;20.59&lt;/td&gt;&lt;td&gt;下修&lt;/td&gt;&lt;td&gt;0／45&lt;/td&gt;&lt;td&gt;0／45&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;下一財年（2027 財年，推導）&lt;/td&gt;&lt;td&gt;14.97&lt;/td&gt;&lt;td&gt;14.95&lt;/td&gt;&lt;td&gt;15.03&lt;/td&gt;&lt;td&gt;14.90&lt;/td&gt;&lt;td&gt;14.78&lt;/td&gt;&lt;td&gt;持平&lt;/td&gt;&lt;td&gt;10／30&lt;/td&gt;&lt;td&gt;19／26&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;分析師預估與券商目標價只描述，不當證據，也不是目標區間任一端；上修／下修門檻為較 30 天前變動 ±1%（本工具設定；與「市價溢價來源」預估修正以 90 天 ±2% 判持平是兩個口徑）。資料取得 2026-11-14T16:42:30（台北時間）（yfinance eps_trend、eps_revisions）。券商目標價近 90 天 22 家調整：上調 4、下調 16、持平 2；上季財報驚奇（Nasdaq）：Sep 2026，10/28/2026 公布，每股盈餘 2.12、共識 2.94、驚奇 -27.89%；（yfinance）：2026-09-30，實際 2.12、預估 3.0089。兩個來源口徑可能不同（可能是調整後或一般會計準則）；公司申報的每股盈餘可對照存檔 8-K 2026-10-28 財報新聞稿（事件/8K事件.json），本工具未逐項比對，只描述，不比較、不當證據。每批另存快照自建歷史：2 筆（2026-11-05 至 2026-11-14）。&lt;/p&gt;&lt;/div&gt;&lt;!--/目標區間:附錄--&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;成長性四問（細表）&lt;/h3&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;成長性四問：過去、品質、股價要求、模型假設&lt;/h4&gt;&lt;p&gt;&lt;b&gt;一句話：&lt;/b&gt;成長穩定、可預期；成長品質好；股價要求的成長不高；本報告的基準假設落在常見範圍。&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt&quot;&gt;&lt;tr&gt;&lt;th&gt;面向&lt;/th&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;數字&lt;/th&gt;&lt;th&gt;判讀&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;實績&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;長期營收年複合（2015～2025）&lt;/td&gt;&lt;td&gt;+18.3%&lt;/td&gt;&lt;td rowspan=&quot;2&quot; style=&quot;text-align:left;vertical-align:top&quot;&gt;&lt;span style=&quot;color:#2f6b4f;font-weight:700&quot;&gt;● 穩定、可預期&lt;/span&gt;&lt;br&gt;&lt;span style=&quot;font-size:12px;color:#7a7f7c&quot;&gt;近 8 季單季年增波動 4.9 個百分點，長期年複合 +18.3%&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;實績&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;近四季營收年增（一年前）&lt;/td&gt;&lt;td&gt;+22.2%（+13.4%）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;品質&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;新增投資的回報（增量 ROIC）&lt;/td&gt;&lt;td&gt;+28.4%&lt;/td&gt;&lt;td rowspan=&quot;3&quot; style=&quot;text-align:left;vertical-align:top&quot;&gt;&lt;span style=&quot;color:#2f6b4f;font-weight:700&quot;&gt;● 好：新增投入的回報高於資金成本&lt;/span&gt;&lt;br&gt;&lt;span style=&quot;font-size:12px;color:#7a7f7c&quot;&gt;增量 ROIC +28.4%、近五年 ROIC 中位 +44.0%，資金成本 9.5%&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;品質&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;存貨、應收增速減營收增速&lt;/td&gt;&lt;td&gt;不適用、+5.1%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;品質&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;再投資能支撐的成長&lt;/td&gt;&lt;td&gt;+47.0%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股價要求&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;現價隱含的未來 5 年營收年增&lt;/td&gt;&lt;td&gt;+16.4%（折現率高低 +20.3%～+13.9%）&lt;/td&gt;&lt;td rowspan=&quot;2&quot; style=&quot;text-align:left;vertical-align:top&quot;&gt;&lt;span style=&quot;color:#2f6b4f;font-weight:700&quot;&gt;● 不高：過去的成長就做得到&lt;/span&gt;&lt;br&gt;&lt;span style=&quot;font-size:12px;color:#7a7f7c&quot;&gt;市價要求每年 +16.4%&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股價要求&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;本益比在自身近五年的位置&lt;/td&gt;&lt;td&gt;介於最低與p25之間（申報 EPS 本益比 15.4 倍，近五年中位 24.2 倍；扣非經常本益比 28.4 倍口徑不同，口徑較貴，不能據此說相對歷史便宜）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;模型假設&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;基準情境第 1 年營收成長&lt;/td&gt;&lt;td&gt;+20.0%&lt;/td&gt;&lt;td rowspan=&quot;3&quot; style=&quot;text-align:left;vertical-align:top&quot;&gt;&lt;span style=&quot;color:#2f6b4f;font-weight:700&quot;&gt;● 落在常見範圍&lt;/span&gt;&lt;br&gt;&lt;span style=&quot;font-size:12px;color:#7a7f7c&quot;&gt;基準首年 +20.0%，同規模公司 -0.0%～+20.8%，最新單季年增 +24.7%&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;模型假設&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;同類公司次年營收成長（中間一半）&lt;/td&gt;&lt;td&gt;+3.4%～+17.7%，中位 +10.2%；同規模（n=601）-0.0%～+20.8%，中位 +9.6%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;模型假設&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;同規模公司十年實質營收年增中位&lt;/td&gt;&lt;td&gt;+1.1%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;判讀由固定規則從表內數字算出，不影響估值與研究評等：實績看近 8 季單季年增的波動（6 個百分點內為穩定、超過 12 為不穩定）與長期方向；品質看新增投入與近五年的回報是否高於資金成本（虧損或增量回報為負為弱）；股價要求看市價隱含的未來 5 年年增是否超過過去實績、是否超過同類公司次年的 p75；模型假設看基準第 1 年是否落在同類公司 p25–p75 或貼近最新單季年增；股價要求與模型假設的同類公司，用同成長組再依規模或產業細分、樣本至少 300 家的最細一組。「同類公司」是本工作流回溯 2014–2025 年約 2,000 家美股、近一年成長相近者次年的實際分布，只是參考，不是預測；存貨或應收增得比營收快不代表成長轉弱，不列入判讀。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;估值方法與參數&lt;/h3&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;方法&lt;/th&gt;&lt;th&gt;低&lt;/th&gt;&lt;th&gt;中&lt;/th&gt;&lt;th&gt;高&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;DCF 保守&lt;/td&gt;&lt;td&gt;102&lt;/td&gt;&lt;td&gt;119&lt;/td&gt;&lt;td&gt;133&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;DCF 基準&lt;/td&gt;&lt;td&gt;175&lt;/td&gt;&lt;td&gt;213&lt;/td&gt;&lt;td&gt;243&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;DCF 樂觀&lt;/td&gt;&lt;td&gt;296&lt;/td&gt;&lt;td&gt;367&lt;/td&gt;&lt;td&gt;426&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;歷史本益比&lt;/td&gt;&lt;td&gt;222&lt;/td&gt;&lt;td&gt;249&lt;/td&gt;&lt;td&gt;278&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;同業企業價值／營業利益&lt;/td&gt;&lt;td&gt;299&lt;/td&gt;&lt;td&gt;321&lt;/td&gt;&lt;td&gt;348&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p style=&quot;font-size:14px&quot;&gt;折現率基準 9.5%（區間 8.8%–10.7%）：無風險利率 5.15%、市場風險溢價 4.20%、beta 1.09。DCF 為 15 年：前 5 年依情境，後 10 年成長與利潤率逐步回到永續水準。&lt;/p&gt;&lt;p style=&quot;font-size:14px&quot;&gt;同業：MSFT（Azure 雲端與 AI 基礎設施投資、超大型平台；最近一季營收年增約 19%、近四季營業利益率約 47%（高於 GOOGL））, META（數位廣告為主、AI 資本支出大幅增加；最近一季營收年增約 26%、近四季營業利益率約 33%）, AMZN（AWS 為雲端主要對手、AI 資本支出大；零售業務拉低利潤率（近四季營業利益率約 12%），只用 EV/EBIT、不用 EV/營收）。排除：AAPL：C：硬體為主，收入與資本需求不同（方向：AAPL 估值把 GOOGL 當平台利潤率參考，GOOGL 這邊因 AAPL 硬體為主不以其為同業）, ORCL：C、F：雲端成長期但負債比高、資本結構差異大，未取得市場資料。&lt;/p&gt;&lt;p style=&quot;font-size:14px&quot;&gt;產業公版：穩定現金流／數位平台／廣告加雲端；驗證狀態：已驗證三家（UBER、GOOGL 2026-11-06～07、GRAB 2026-11-08 通過審查；2026-11-08 使用者核定）；本公司是第 1 家實例。首家產業，公版的估值法與指標選擇尚未經兩家以上驗證，審查與讀者請多看適用性。&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;details id=&quot;wp-value&quot;&gt;&lt;summary&gt;價值判斷：PEG、林區資產負債表檢查與交叉檢查&lt;/summary&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;PEG 與林區檢查&lt;/h3&gt;&lt;div class=&quot;wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;PEG：可計算的成長口徑（紅線為 1 與 2；灰色為成長率與本益比口徑不一致，不作判讀）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 500 142&quot; role=&quot;img&quot; aria-label=&quot;PEG&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;250.0&quot; x2=&quot;250.0&quot; y1=&quot;6&quot; y2=&quot;136&quot; class=&quot;zero&quot;/&gt;&lt;line x1=&quot;316.1&quot; x2=&quot;316.1&quot; y1=&quot;4&quot; y2=&quot;138&quot; class=&quot;price&quot;/&gt;&lt;line x1=&quot;382.1&quot; x2=&quot;382.1&quot; y1=&quot;4&quot; y2=&quot;138&quot; class=&quot;price&quot;/&gt;&lt;text x=&quot;240&quot; y=&quot;23&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;過去三年 EPS 年增（口徑不一致）&lt;/text&gt;&lt;rect x=&quot;250.0&quot; y=&quot;9&quot; width=&quot;56.3&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--muted)&quot;/&gt;&lt;text x=&quot;314.3&quot; y=&quot;23&quot; class=&quot;val&quot;&gt;0.9&lt;/text&gt;&lt;text x=&quot;240&quot; y=&quot;63&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;近四季對上一財年&lt;/text&gt;&lt;rect x=&quot;250.0&quot; y=&quot;49&quot; width=&quot;100.4&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;358.4&quot; y=&quot;63&quot; class=&quot;val&quot;&gt;1.5&lt;/text&gt;&lt;text x=&quot;240&quot; y=&quot;103&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;基準情境推估&lt;/text&gt;&lt;rect x=&quot;250.0&quot; y=&quot;89&quot; width=&quot;174.5&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;432.5&quot; y=&quot;103&quot; class=&quot;val&quot;&gt;2.6&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;PEG 與林區加股利比率（可計算的成長口徑）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;成長口徑&lt;/th&gt;&lt;th&gt;成長率&lt;/th&gt;&lt;th&gt;PEG&lt;/th&gt;&lt;th&gt;判讀&lt;/th&gt;&lt;th&gt;加股利比率&lt;/th&gt;&lt;th&gt;判讀&lt;/th&gt;&lt;th&gt;加股東收益率比率（現代延伸）&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;過去三年 EPS 年增&lt;/td&gt;&lt;td&gt;33.3%&lt;/td&gt;&lt;td&gt;0.9&lt;/td&gt;&lt;td&gt;口徑不一致，不具參考性&lt;/td&gt;&lt;td&gt;1.18&lt;/td&gt;&lt;td&gt;口徑不一致，不具參考性&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;近四季對上一財年（扣非經常）&lt;/td&gt;&lt;td&gt;18.7%&lt;/td&gt;&lt;td&gt;1.5&lt;/td&gt;&lt;td&gt;合理&lt;/td&gt;&lt;td&gt;0.67&lt;/td&gt;&lt;td&gt;差&lt;/td&gt;&lt;td&gt;0.64&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準情境推估（稅後營業利益年增－股數年變化）&lt;/td&gt;&lt;td&gt;10.7%&lt;/td&gt;&lt;td&gt;2.6&lt;/td&gt;&lt;td&gt;偏貴&lt;/td&gt;&lt;td&gt;0.39&lt;/td&gt;&lt;td&gt;差&lt;/td&gt;&lt;td&gt;0.37&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;加股東收益率比率＝（成長率＋股利殖利率＋淨回購殖利率）÷本益比，把回購也算進股東回饋、並扣掉發給員工的股票；這是現代延伸，不是林區原版，也沒有政策門檻，只列數字。 PEG 用的每股盈餘 10.42 美元：PEG 所用 EPS 為一般會計 EPS 扣非經常項目，含股權薪酬（近四季淨利每股 19.16、每股股權薪酬 2.47）。&lt;/p&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;「口徑不一致」：「過去三年 EPS 年增」用申報 EPS（近四季 19.16 美元，含非經常損益），本益比用扣非經常 EPS 10.42 美元（差 -46%，容忍 ±7%）。兩者不同口徑，數字照列但不作便宜或昂貴判斷；要得到同口徑的過去三年 PEG，須逐年扣非經常 EPS（估值輸入 eps_history_adjusted）。&lt;/p&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:4px&quot;&gt;PEG 的判讀標籤依估值政策門檻；高風險、成長極高或極低的公司，PEG 有系統性偏誤（同樣成長下風險越高 PEG 越低），不能只憑標籤判斷便宜或昂貴。&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;林區式資產負債表與市場檢查&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;數值&lt;/th&gt;&lt;th&gt;林區的看法&lt;/th&gt;&lt;th&gt;判讀&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;本益比&lt;/td&gt;&lt;td&gt;28.38&lt;/td&gt;&lt;td&gt;與自身歷史比較&lt;/td&gt;&lt;td&gt;資料限制：歷史第 1% 百分位是用申報 EPS（15.4 倍）算的，扣非經常 EPS 為 28.4 倍、口徑較貴，不能據此說相對歷史便宜&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;每股淨現金&lt;/td&gt;&lt;td&gt;11.28&lt;/td&gt;&lt;td&gt;淨現金可提供下檔保護（林區 O31、LAK02）&lt;/td&gt;&lt;td&gt;好：有淨現金，可提供下檔保護；占股價 3.8%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;負債對權益&lt;/td&gt;&lt;td&gt;0.18&lt;/td&gt;&lt;td&gt;一般越低越好（林區 L25）&lt;/td&gt;&lt;td&gt;不評好壞：有息負債約為股東權益的 0.18 倍；沒有公認門檻，償債能力見收現段償債指標&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;每股自由現金流（近四季）&lt;/td&gt;&lt;td&gt;1.61&lt;/td&gt;&lt;td&gt;比每股盈餘更接近現金（林區 O37、修正10）&lt;/td&gt;&lt;td&gt;不評好壞：自由現金流殖利率 0.5%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股數年變化（近三財年）&lt;/td&gt;&lt;td&gt;-2.4%&lt;/td&gt;&lt;td&gt;持續買回、且價格合理、資金來自本業現金時才是好訊號（林區 L16、O19）&lt;/td&gt;&lt;td&gt;好：近三財年平均每年 -2.4%；最近一季對去年同季 +1.3%（2025-09-30→2026-09-30）：近期轉為增加，PEG 推估改用近期變化&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;存貨增速 vs 營收增速&lt;/td&gt;&lt;td&gt;446%&lt;/td&gt;&lt;td&gt;存貨增速高於營收是警訊（林區 O50）&lt;/td&gt;&lt;td&gt;注意：存貨 +446%（2025-12-31→2026-09-30）vs 營收 +22%（近四季對前四季，各截至 2026-09-30、2025-09-30）：警訊，須查原因&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;內部人公開市場買進&lt;/td&gt;&lt;td&gt;0&lt;/td&gt;&lt;td&gt;內部人自掏腰包買進是強訊號&lt;/td&gt;&lt;td&gt;中性：近期無人買進；賣出原因多，訊號較弱&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;林區以外的交叉檢查（只揭露，不改研究評等與價格位置）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;檢查&lt;/th&gt;&lt;th&gt;結果&lt;/th&gt;&lt;th&gt;判讀&lt;/th&gt;&lt;th&gt;依據與限制&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Piotroski F 分數（財報是否在改善）&lt;/td&gt;&lt;td&gt;7 ／ 8 項（2024-12-31→2025-12-31）&lt;/td&gt;&lt;td&gt;中&lt;/td&gt;&lt;td&gt;未通過：長期負債 ÷ 平均總資產比上年低。Piotroski（2000）研究文獻/Piotroski2000_財報訊號.json 第 9–11、15 頁；8–9 分高分組、0–2 分低分組&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Beneish M 分數（盈餘被美化的機率）&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;不適用&lt;/td&gt;&lt;td&gt;缺 銷管費用&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Greenblatt 盈餘殖利率與資本報酬率&lt;/td&gt;&lt;td&gt;盈餘殖利率 4.4%；ROIC 37%&lt;/td&gt;&lt;td&gt;低於 10 年公債 5.1%；ROIC 37% 高於 WACC 9.5%&lt;/td&gt;&lt;td&gt;盈餘殖利率＝近四季營業利益 ÷（市值＋有息負債－現金與證券），推導；ROIC 為本專案稅後口徑，非 Greenblatt 原式稅前；不做排名&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;details id=&quot;wp-6&quot;&gt;&lt;summary&gt;6 財務：償債指標、融資活動、存活檢查與利率壓力測試（含判定規則與限制）&lt;/summary&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;融資活動與償債：錢還給誰、有沒有借錢、還不還得起&lt;/h3&gt;&lt;p class=&quot;cap&quot;&gt;利息保障改讀信用與存活的利息口徑（EBIT ÷ 近四季利息費用：us-gaap:InterestExpenseNonoperating，年度＋本期年初至今－去年同期；本機 SEC 事實），底稿的利息費用科目未對應。&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;償債能力指標（利息保障依 Damodaran 合成評等對照；其他沒有公認門檻，只寫事實）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;指標&lt;/th&gt;&lt;th&gt;數值&lt;/th&gt;&lt;th&gt;判讀&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;EBIT ÷ 利息費用&lt;/td&gt;&lt;td&gt;51.03&lt;/td&gt;&lt;td&gt;相當於 AAA 級：EBIT 是利息費用的 51.0 倍；依 Damodaran 合成評等大型公司對照表（2026 年 1 月；市值 36,693.2 億美元，在 50 億美元以上）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;（營運現金流＋實付利息）÷ 實付利息&lt;/td&gt;&lt;td&gt;未取得&lt;/td&gt;&lt;td&gt;資料限制：用實際現金算的付息能力無法計算（實付利息未取得：附註未申報此項或科目未對應）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;有息負債 ÷ EBITDA&lt;/td&gt;&lt;td&gt;0.68&lt;/td&gt;&lt;td&gt;不評好壞：以近四季 EBITDA 1,849.7 億美元計，約 0.7 年可還清有息負債&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;淨負債 ÷ EBITDA&lt;/td&gt;&lt;td&gt;-0.76&lt;/td&gt;&lt;td&gt;不評好壞：現金多於有息負債（淨現金）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;營運現金流 ÷ 有息負債&lt;/td&gt;&lt;td&gt;143.5%&lt;/td&gt;&lt;td&gt;不評好壞：一年的營運現金流約可還掉 144% 的有息負債（約 0.7 年還清）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;現金與證券 ÷ 一年內到期債務&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;不適用：已核對：10-Q 2026-09-30 Part I, Item 1 ¶245 一年內到期長期票據 1,016 百萬美元，列在應計費用及其他流動負債（¶249）；商業本票餘額 0（¶239）；底稿「一年內到期債務未取得」是因為資產負債表沒有獨立科目，不是沒有一年內到期債務。&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;利息費用：Q3 967 百萬，前九個月 2,778 百萬（已扣資本化利息，前九個月約 10 億，10-Q Item 1 ¶275、¶276）；Q3 營業利益 40,576 ÷ Q3 利息費用 967 約 42 倍（推導，單季）；近四季利息費用底稿未取得。；利息費用 2025 年同期為 Q3 143、前九個月 438，2026 年增加與長期債務票面由 2025-12-31 的 490.85 億增至 2026-09-30 的 1,274.85 億同向。；表外保證（10-Q 2026-09-30 Item 1 ¶315、¶316）：為能源與電力合約對手的長交期設備提供財務保證，最高可能支付 162 億、期限至 2049 年 1 月；TPU 硬體回購保證最高 66 億。兩者公允價值都不重大，不計入有息負債，但屬或有義務，與重大採購承諾 9,244 億一起在報告交代。；期後事項：2026-11-05 完成 60 億歐元優先票據發行（8-K 2026-11-05 Item 8.01，本文 §2、§4），七檔於 2028 至 2045 年到期，最早一檔 2028 年，一年內與兩年內到期金額不變；上表與存活檢查依 2026-09-30 債務表，未含這筆；募得資金用途與美元等值 8-K 未揭露&lt;/p&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;可用授信與到期（作者判讀，融資償債判讀.json）：一年內到期的長期票據 10.16 億美元（10-Q 2026-09-30）；商業本票額度 250 億美元、期末餘額 0；循環信用額度 100 億美元全數未動用（40 億 2027 年 4 月到期、60 億 2030 年 4 月到期）；2026 年新發的約 808 億美元票據（10-Q Item 1 ¶242：美元 450 億＋外幣 358 億，面額）最早 2028 年到期；期後（2026-11-05，8-K Item 8.01）另完成 60 億歐元優先票據發行，七檔最早 2028 年、最晚 2045 年到期，不在 2026-09-30 的債務表內&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;融資活動現金流：還給股東與借還款（本財年年初至 2026-09-30 累計，10-Q 2026-09-30）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;對象｜分類&lt;/th&gt;&lt;th&gt;金額&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股東｜員工股票代扣稅與相關淨額&lt;/td&gt;&lt;td&gt;-174 億美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股東｜股利&lt;/td&gt;&lt;td&gt;-81.7 億美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股東｜回購&lt;/td&gt;&lt;td&gt;0&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股東｜增資與員工認股&lt;/td&gt;&lt;td&gt;429 億美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股東小計&lt;/td&gt;&lt;td&gt;173 億美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;債權人｜償還&lt;/td&gt;&lt;td&gt;-88.8 億美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;債權人｜借入&lt;/td&gt;&lt;td&gt;852 億美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;債權人小計&lt;/td&gt;&lt;td&gt;763 億美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;其他｜少數股東往來&lt;/td&gt;&lt;td&gt;37.6 億美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;其他｜投資面：收購與無形資產購置 −34,103（含 Wiz）、其他投資 −879；融資面：強制轉換特別股淨收入 +19,063、其他融資 −686&lt;/td&gt;&lt;td&gt;184 億美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;其他小計&lt;/td&gt;&lt;td&gt;221 億美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;對照：同期營運現金流&lt;/td&gt;&lt;td&gt;1,271 億美元&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;融資活動是公司與出資人（股東、債權人）之間的現金往來，不等於借款：回購、股利是還給股東，借入、償還才是借款；負數＝現金流出。本表期間與下方借款用途、上方現金流分層（近四季）不同。&lt;/p&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;借款用途（研究判讀）：混合（以擴張為主）：AI 基礎設施資本支出是最大資金需求，同時用債務、普通股與強制轉換特別股籌資；債務本身公司只寫「一般公司用途」，沒有單獨指定用途；期間 2026 年前九個月（2026-01-01～2026-09-30）；依據：10-Q 2026-09-30 Part I, Item 1 ¶242（2026 年發行 450 億美元＋358 億美元外幣高級無擔保票據，用途：一般公司用途）、10-Q 2026-09-30 Part I, Item 1 ¶243（第三季發行 USD 固定與浮動利率票據、AUD 票據）、10-Q 2026-09-30 Part I, Item 1 ¶361、¶364（普通股淨收入 205 億＋私募 100 億、強制轉換特別股淨收入 190 億，用途：一般公司用途，包括擴大 AI 基礎設施與全球算力的資本支出）、10-Q 2026-09-30 Part I, Item 1 ¶375、¶376（ATM 計畫上限 400 億，主要用於支付員工股權授予的稅負；本年已發行淨收入 124 億，剩餘 276 億）、10-Q 2026-09-30 Part I, Item 2 ¶204（前九個月資本支出 1,320 億，去年同期 636 億）、10-Q 2026-09-30 Part I, Item 1 ¶279（2026-03-11 完成 Wiz 收購 295 億）、10-Q 2026-09-30 Part I, Item 1 ¶386（前九個月無回購）、8-K 2026-06-04 本文 §211、§212、§214（股權募資用途與「平衡投資」的資金來源說明：營運現金流、債務、股權）、8-K 2026-10-28 新聞稿 §8（第三季發行票據淨收入 287 億，用於一般公司用途）、8-K 2026-05-11 本文 §3、8-K 2026-05-21 本文 §3、8-K 2026-08-10 本文 §3（歐元、加幣、日圓、美元票據發行）&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;survival-detail&quot;&gt;&lt;h3&gt;存活檢查：現金對債務（12～24 個月，推導，非違約預測）&lt;/h3&gt;&lt;p style=&quot;margin:0 0 6px&quot;&gt;&lt;b&gt;信用評級&lt;/b&gt;　機構 Moody&amp;#x27;s Aa2（展望穩定）、S&amp;amp;P AA+（展望穩定）（SEC 全文搜尋 FWP 2026-08-07 0001193125-26-338750）／推導 AAA（Damodaran 合成評等，利息保障 51.0 倍，近四季新借款多、利息偏低、評級可能偏高，推導）｜投資等級（BBB-／Baa3 以上）；推導比機構高 2 級（推導只看利息保障，不含規模、產業與擔保結構，僅供對照）&lt;/p&gt;&lt;p style=&quot;margin:0 0 6px&quot;&gt;&lt;b&gt;存活檢查（完整理由）&lt;/b&gt;　無明顯警訊（推導，非違約預測）：現金加未動用信貸 2,751 億美元，一年內到期債務 20 億美元（另利息 31 億美元），可付 54.2 倍；現金加未動用信貸 2,751 億美元，兩年內到期債務 30 億美元（另利息 62 億美元），可付 30.1 倍；利息保障 51.0 倍（新借款多、利息偏低，倍數可能偏高）；會計師未提出繼續經營疑慮。&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;燈號：無明顯警訊（一般公司：現金對債務；資料截至 2026-09-30，收盤日 2026-11-13）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;判定&lt;/th&gt;&lt;th&gt;內容與出處&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;會計師繼續經營疑慮&lt;/td&gt;&lt;td&gt;無明顯警訊&lt;/td&gt;&lt;td&gt;會計師與管理層未提出繼續經營疑慮（掃描 10-Q 2026-09-30、10-K 2025-12-31）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;流動性：12 個月&lt;/td&gt;&lt;td&gt;無明顯警訊&lt;/td&gt;&lt;td&gt;現金加未動用信貸 275,098.0，一年內到期本金 2,000.0，加利息 3,076.0（利息偏低，未含新借款全年利息），可付 54.2 倍；跨窗口的到期桶 第2年 1,000.0（2026-12-31～2027-12-31） 未計入，到期月份看債務附註&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;流動性：24 個月&lt;/td&gt;&lt;td&gt;無明顯警訊&lt;/td&gt;&lt;td&gt;現金加未動用信貸 275,098.0，兩年內到期本金 3,000.0，加利息 6,152.0（利息偏低，未含新借款全年利息），可付 30.1 倍；跨窗口的到期桶 第3年 2,676.0（2027-12-31～2028-12-31） 未計入，到期月份看債務附註&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;利息保障&lt;/td&gt;&lt;td&gt;無明顯警訊&lt;/td&gt;&lt;td&gt;利息保障 51.0 倍（近四季借還款淨額 96,572 占有息負債 77%（大額新借款），近四季利息費用（us-gaap:InterestExpenseNonoperating，年度＋本期年初至今－去年同期；本機 SEC 事實） 3,076 只含新債的部分期間，偏低；未能年化，倍數可能偏高）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Altman Z 分數&lt;/td&gt;&lt;td&gt;輔助（不改燈號）&lt;/td&gt;&lt;td&gt;Altman Z 8.75（安全區，只當輔助）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;回饋股東對自由現金流&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;近四季回購加股利 166 億美元，未超過自由現金流 197 億美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;信用評級（機構）&lt;/td&gt;&lt;td&gt;投資等級&lt;/td&gt;&lt;td&gt;Moody&amp;#x27;s Aa2（SEC 全文搜尋 FWP 2026-08-07 0001193125-26-338750）；S&amp;amp;P AA+（SEC 全文搜尋 FWP 2026-08-07 0001193125-26-338750）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;信用評級（推導）&lt;/td&gt;&lt;td&gt;投資等級&lt;/td&gt;&lt;td&gt;AAA：Damodaran 合成評等 2026 年 1 月（大型公司表），利息保障 51.0 倍（EBIT ÷ 近四季利息費用（us-gaap:InterestExpenseNonoperating，年度＋本期年初至今－去年同期；本機 SEC 事實））&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;機構與推導比對&lt;/td&gt;&lt;td&gt;提示&lt;/td&gt;&lt;td&gt;推導比機構高 2 級（推導只看利息保障，不含規模、產業與擔保結構，僅供對照）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;債券市場參考&lt;/td&gt;&lt;td&gt;AA 級&lt;/td&gt;&lt;td&gt;ICE BofA 公司債選擇權調整利差：投資等級整體 0.89 個百分點（2026-11-12，FRED BAMLC0A0CM）；BBB 級 1.11 個百分點（2026-11-12，FRED BAMLC0A4CBBB）；投機等級整體 3.20 個百分點（2026-11-12，FRED BAMLH0A0HYM2）；AA 級 0.64 個百分點（2026-11-12，FRED BAMLC0A2CAA）；個別債券殖利率與價格未取得（TRACE／FINRA 不在固定來源）&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;債務到期年度桶（10-K 2025-12-31，資料日 2025-12-31），桶結束日落在窗口內才計入；一年內取與資產負債表一年內到期債務較大者；利息口徑：近四季利息費用（us-gaap:InterestExpenseNonoperating，年度＋本期年初至今－去年同期；本機 SEC 事實）（出處：期間 2025-01-01～2025-12-31、2026-01-01～2026-09-30、2025-01-01～2025-09-30；申報 10-K 2026-02-05（0001652044-26-000018）、10-Q 2026-10-29（0001652044-26-000084））；未動用信貸：10-Q 2026-09-30 Part I, Item 1 ¶255（全額未動用；其中 4,000 在 2027-04 到期（落在 12 個月窗口內，24 個月窗口只剩 6,000 的 2030-04 部分），工具照全額計入，結論對 4,000 到期不敏感（現金與證券遠大於債務到期）；另有商業本票計畫上限 25,000，期末無餘額（Part I, Item 1 ¶239）；借款條件與契約未揭露，未判契約）&lt;/p&gt;&lt;h3 style=&quot;margin-top:14px&quot;&gt;利率壓力測試（固定情境：利率上升 1、2 個百分點與下降 1 個百分點，不預測聯準會；推導）&lt;/h3&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;單位百萬美元；狀態：已試算&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;浮動利率債利息變動&lt;/th&gt;&lt;th&gt;再融資利息變動&lt;/th&gt;&lt;th&gt;壓力後一年利息&lt;/th&gt;&lt;th&gt;利息保障&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;目前利率（只算再融資）&lt;/td&gt;&lt;td&gt;0.0&lt;/td&gt;&lt;td&gt;98.4&lt;/td&gt;&lt;td&gt;3,174.4&lt;/td&gt;&lt;td&gt;49.5 倍&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;+1 個百分點&lt;/td&gt;&lt;td&gt;33.9&lt;/td&gt;&lt;td&gt;128.4&lt;/td&gt;&lt;td&gt;3,238.3&lt;/td&gt;&lt;td&gt;48.5 倍&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;+2 個百分點&lt;/td&gt;&lt;td&gt;67.7&lt;/td&gt;&lt;td&gt;158.4&lt;/td&gt;&lt;td&gt;3,302.2&lt;/td&gt;&lt;td&gt;47.5 倍&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;−1 個百分點&lt;/td&gt;&lt;td&gt;-33.9&lt;/td&gt;&lt;td&gt;68.4&lt;/td&gt;&lt;td&gt;3,110.6&lt;/td&gt;&lt;td&gt;50.5 倍&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;目前利率：聯邦基金利率 3.88%（2026-11-12，FRED DFF）、SOFR 3.90%（2026-11-12，FRED SOFR）、十年期公債 5.10%（2026-11-12，FRED DGS10）；估值折現率用的 10 年期公債是 5.15%（2026-11-13，美國財政部），來源與日期不同；浮動利率債 3,386.0，占總債務 3%（10-Q 2026-09-30 Part I, Item 1 ¶243、¶245、¶246；浮動利率債＝美元 1,800＋澳幣 A$2.3 十億，推導：2026 年澳幣票據 A$5.6 十億〔固定 3.3＋浮動 2.3，¶243〕對表列 3,861，換算約 0.69，A$2.3 十億≈1,586，＝3,386，推導；公司另以利率交換把一部分固定利率債轉浮動，¶179，名目金額在已讀原文未找到，故未計入、此為浮動利率債下限；總債務為票據面額合計 127,485，¶245；公司未給每 100bp 利息變動金額；10 月 Waymo 另借 5,000 有擔保定期貸款，SOFR＋5.25%，¶252，是期後事項，不在 9/30 餘額）；兩年內到期須再融資本金 3,000.0，原票面 2.46%（目前平均利率 2.46%（一年利息÷有息負債，推導）），再融資利率 5.74%（10 年期公債 5.10%（2026-11-12）＋ AA 級 OAS 0.64 個百分點（機構最低評級），推導）；利息保障基準：利息保障（EBIT÷一年利息），目前 51.0 倍；利率上升 2 個百分點（+200bp，bp＝基點，100bp＝1 個百分點）後低於 1.5 倍才在燈號理由加一條（不改燈號、不改研究評等）；通膨、物價、消費者等間接影響不在此表&lt;/p&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;&lt;a href=&quot;#survival-rules&quot;&gt;判定規則與限制見本節下方&lt;/a&gt;（寫死在程式，不改研究評等）。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;survival-rules&quot;&gt;&lt;h3&gt;存活檢查與利率壓力測試：判定規則與限制&lt;/h3&gt;&lt;p class=&quot;cap&quot;&gt;規則版本：v1.1（2026-11-03 第二輪：加 KBRA、利率壓力測試、首頁精簡；仍只顯示提示、不改研究評等）&lt;/p&gt;&lt;ul class=&quot;cap&quot;&gt;&lt;li&gt;總燈號：各項取最嚴重：任一高風險→高風險；否則任一需留意→需留意；12 個月流動性或繼續經營無法判定→資料不足；其餘→無明顯警訊。Z 分數與推導評級只列理由、不改燈號。&lt;/li&gt;&lt;li&gt;繼續經營：最新年報或其後季報出現會計師或管理層「substantial doubt … going concern」肯定句 → 高風險（否定句、假設句只列出不計）；只出現在前一份年報 → 需留意&lt;/li&gt;&lt;li&gt;流動性_12個月：現金與證券＋未動用信貸 ≥ 一年內到期本金＋一年利息 → 無明顯警訊；不足但加近四季自由現金流（已扣實付利息）後 ≥ 一年內到期本金 → 需留意；仍不足 → 高風險&lt;/li&gt;&lt;li&gt;流動性_24個月：同上改兩年（本金、利息、自由現金流各計兩年）；不足但加兩年自由現金流 ≥ 本金的 50% → 需留意；更低 → 高風險&lt;/li&gt;&lt;li&gt;燒錢：近四季自由現金流為負：現金還能燒幾個月＝（現金與證券＋未動用信貸－一年內到期本金）÷ 每月燒錢；&amp;lt;12 個月 高風險、12～24 個月 需留意&lt;/li&gt;&lt;li&gt;利息保障：EBIT ÷ 利息費用 &amp;lt; 1.5 倍 → 需留意&lt;/li&gt;&lt;li&gt;契約：作者自 信用揭露.json 填公司揭露的契約門檻與實際值：已違反 → 高風險；餘裕 &amp;lt; 15% → 需留意；未揭露不判&lt;/li&gt;&lt;li&gt;信用評級：機構評級（S&amp;amp;P、Moody&amp;#x27;s、Fitch、KBRA，取各機構最新、以最低者判等級）低於 BBB-／Baa3 → 需留意；只有推導評級為投機等級 → 只列理由&lt;/li&gt;&lt;li&gt;利率壓力測試：固定情境 +100bp／+200bp／-100bp（不預測聯準會）：利息增加＝浮動利率債×利率變動（作者填 Item 7A 每 100bp 利息變動時改用該值）＋兩年內到期本金×（再融資利率＋利率變動－原票面利率）；再融資利率＝收盤日 10 年期公債殖利率＋該評級 ICE BofA OAS（推導）；壓力後利息保障＝EBIT÷（一年利息＋利息增加），EBIT 分母異常時改用現金利息保障。+200bp 後低於 1.5 倍 → 理由加一條、首頁也加（只列理由、不改燈號）；浮動利率債未揭露或未填 → 該情境未取得；金融業不套&lt;/li&gt;&lt;li&gt;金融業：銀行券商、保險不套現金對債務：研究評等輸入 監理紅線 低於門檻 → 高風險；高於門檻不到 20%（相對）→ 需留意；未填 → 資料不足&lt;/li&gt;&lt;/ul&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;使用限制&lt;/p&gt;&lt;ul class=&quot;cap&quot;&gt;&lt;li&gt;推導，非違約預測：燈號只看 12～24 個月付不付得出錢與已揭露的警訊，不是違約機率，也不改研究評等（第一版）。&lt;/li&gt;&lt;li&gt;Altman Z 分數會誤判兩類公司：權益為負（如舉債回購）與保留盈餘因長期回購或股利變負，所以只當輔助、不單獨下結論、不改燈號。&lt;/li&gt;&lt;li&gt;金融業（銀行券商、保險）的存款與保單負債是營業資金，改看監理資本（如 CET1），不套現金對債務。&lt;/li&gt;&lt;li&gt;超過 2～3 年的到期與再融資風險留在正文債務到期表，不進燈號。&lt;/li&gt;&lt;li&gt;到期年度桶以到期表資料日（年報）起算：桶的結束日落在窗口內才計入；跨窗口的桶另列，若作者在 信用揭露.json 填了近期到期明細就改用明細。&lt;/li&gt;&lt;li&gt;個別債券價格與殖利率（TRACE／FINRA）不在固定來源：未取得；市場參考只用 FRED 的 ICE BofA 各評級公司債利差（大盤層級）。&lt;/li&gt;&lt;li&gt;機構評級只認公司自己在 SEC 申報寫出的 S&amp;amp;P、Moody&amp;#x27;s、Fitch、KBRA 評級並附原句；沒揭露寫未揭露，不從新聞或記憶補。&lt;/li&gt;&lt;li&gt;利率壓力測試只用固定情境（+100bp、+200bp、−100bp），不預測聯準會；以 10 年期公債估再融資成本，實際年期與擔保結構不同會有誤差；浮動利率債若也在兩年內到期會重複計算（偏保守）；通膨、物價、消費者等間接影響不進燈號；金融業不套，維持看資本適足率。&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/details&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;more&quot; data-layer=&quot;附錄&quot;&gt;&lt;div class=&quot;qno&quot;&gt;附錄&lt;/div&gt;&lt;h2&gt;附錄：估值細節、論點檢查、名詞、表格與資料來源（預設摺疊）&lt;/h2&gt;&lt;details id=&quot;valdetail&quot;&gt;&lt;summary&gt;估值細節：利率、同業與產業對照、券商目標價&lt;/summary&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;券商目標價&lt;/h3&gt;&lt;figure class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;券商目標價範圍對照本報告合理價值與收盤價（美元；yfinance，取得 2026-11-14；第三方看法，只揭露，不是本報告目標價、不進評等）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 150&quot; role=&quot;img&quot; aria-label=&quot;券商目標價&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;230.0&quot; x2=&quot;230.0&quot; y1=&quot;8&quot; y2=&quot;128&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;230.0&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;0&lt;/text&gt;&lt;line x1=&quot;316.7&quot; x2=&quot;316.7&quot; y1=&quot;8&quot; y2=&quot;128&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;316.7&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;200&lt;/text&gt;&lt;line x1=&quot;403.3&quot; x2=&quot;403.3&quot; y1=&quot;8&quot; y2=&quot;128&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;403.3&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;400&lt;/text&gt;&lt;line x1=&quot;490.0&quot; x2=&quot;490.0&quot; y1=&quot;8&quot; y2=&quot;128&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;490.0&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;600&lt;/text&gt;&lt;text x=&quot;220&quot; y=&quot;27&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;券商目標價（最低–最高，點＝平均）&lt;/text&gt;&lt;line x1=&quot;360.0&quot; x2=&quot;446.7&quot; y1=&quot;22&quot; y2=&quot;22&quot; stroke=&quot;var(--c6)&quot; stroke-width=&quot;3&quot; opacity=&quot;.55&quot;/&gt;&lt;circle cx=&quot;403.5&quot; cy=&quot;22&quot; r=&quot;7&quot; fill=&quot;var(--c6)&quot;&gt;&lt;title&gt;券商目標價（最低–最高，點＝平均）：400&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;458.7&quot; y=&quot;27&quot; class=&quot;val&quot;&gt;400&lt;/text&gt;&lt;text x=&quot;220&quot; y=&quot;67&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;本報告合理價值（只含折現率）&lt;/text&gt;&lt;line x1=&quot;311.1&quot; x2=&quot;343.2&quot; y1=&quot;62&quot; y2=&quot;62&quot; stroke=&quot;var(--c1)&quot; stroke-width=&quot;3&quot; opacity=&quot;.55&quot;/&gt;&lt;circle cx=&quot;328.8&quot; cy=&quot;62&quot; r=&quot;7&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;本報告合理價值（只含折現率）：228&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;355.2&quot; y=&quot;67&quot; class=&quot;val&quot;&gt;228&lt;/text&gt;&lt;text x=&quot;220&quot; y=&quot;107&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;收盤價&lt;/text&gt;&lt;circle cx=&quot;358.2&quot; cy=&quot;102&quot; r=&quot;7&quot; fill=&quot;var(--ink)&quot;&gt;&lt;title&gt;收盤價：296&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;370.2&quot; y=&quot;107&quot; class=&quot;val&quot;&gt;296&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;市場怎麼看：券商目標價與它隱含的成長&lt;/h4&gt;&lt;p&gt;53 家券商的平均目標價 400.37 美元（中位 400.00，最低 300.00、最高 500.00）；比 2026-11-13 收盤價 295.77 高約 35%；換成本模型的語言，平均目標價要求未來 5 年營收每年成長約 20%，不高於同規模公司次年成長的 p75（+20.8%）；分析師自己預估明年每股盈餘成長 -23.5%（今年預估 19.56 美元、明年 14.97 美元；本報告申報與扣非經常 EPS 差距超過容忍度，今年預估若含已申報的非經常利益，成長率會被高基期壓低，不能直接讀成本業衰退；本報告扣非經常 EPS 為 10.42 美元）；近 90 天有 22 家調整目標價：上調 4、下調 16、持平 2。&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;券商目標價與隱含成長（yfinance，取得 2026-11-14）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;目標價（美元）&lt;/th&gt;&lt;th&gt;折回今天（推導）&lt;/th&gt;&lt;th&gt;隱含未來 5 年營收年增&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;平均目標價&lt;/td&gt;&lt;td&gt;400.37&lt;/td&gt;&lt;td&gt;364.88&lt;/td&gt;&lt;td&gt;+19.9%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;中位目標價&lt;/td&gt;&lt;td&gt;400.00&lt;/td&gt;&lt;td&gt;364.54&lt;/td&gt;&lt;td&gt;+19.9%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;最低目標價&lt;/td&gt;&lt;td&gt;300.00&lt;/td&gt;&lt;td&gt;273.40&lt;/td&gt;&lt;td&gt;+15.1%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;最高目標價&lt;/td&gt;&lt;td&gt;500.00&lt;/td&gt;&lt;td&gt;455.67&lt;/td&gt;&lt;td&gt;+23.4%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;Nasdaq 共識目標價 398.88（最低 300.00、最高 490.00；買進 29、持有 4、賣出 0）。券商目標價是第三方對 12 個月後股價的看法，多用「預估盈餘 × 主觀本益比」，通常偏樂觀；本區只揭露，不是本報告的目標價、不當證據、不影響估值與研究評等。「折回今天」以股權成本折現（未加回期間股利），「隱含成長」以本報告基準情境的其他假設反推，是用本模型理解他們的價格，不是券商自己的假設（推導）。資料取得時間與本報告收盤日不同。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;利率的影響：公債殖利率變動與股債利差&lt;/h3&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;利率敏感：10 年期公債殖利率下降 1 個百分點、其他假設不變，合理價值中點從約 228 升到約 276（+21%）；上升 1 個百分點則降到約 193（−15%）。&lt;/strong&gt;即使利率下降 1 個百分點，中點仍低於現價。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;股債利差：申報 EPS 約 19.1 美元的盈餘殖利率約 6.5%，比 2026-11-13 的 10 年期公債 5.15% 高約 1.3 個百分點，但申報盈餘含大額權益證券評價利益；改用核心 EPS 10.42 美元，盈餘殖利率約 3.5%，比公債低約 1.6 個百分點&lt;span class=&quot;src&quot;&gt;（推算）&lt;/span&gt;。&lt;/strong&gt;只描述相對位置，不改估值。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;grid2 wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;公債殖利率每變動 1 個百分點，合理價值中點的變化（美元；紅色虛線為現價 295.77）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 500 142&quot; role=&quot;img&quot; aria-label=&quot;利率敏感度&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;168.0&quot; x2=&quot;168.0&quot; y1=&quot;6&quot; y2=&quot;136&quot; class=&quot;zero&quot;/&gt;&lt;line x1=&quot;417.1&quot; x2=&quot;417.1&quot; y1=&quot;4&quot; y2=&quot;138&quot; class=&quot;price&quot;/&gt;&lt;text x=&quot;158&quot; y=&quot;23&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;公債−1%（4.15%）&lt;/text&gt;&lt;rect x=&quot;168.0&quot; y=&q ;&lt;/svg&gt;&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c1)&quot;&gt;&lt;/i&gt;盈餘殖利率（1 ÷ 申報本益比）&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--neg)&quot;&gt;&lt;/i&gt;10 年期公債&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c3)&quot;&gt;&lt;/i&gt;盈餘殖利率（目前，扣非經常 EPS）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;股債利差只作「相對自身歷史的位置」：名目利率對實質盈餘有方法限制，不影響估值與研究評等。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;同業與產業對照&lt;/h3&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;與個別同業比較：利潤率與投入強度&lt;/h4&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;近四季營業利益率&lt;span class=&quot;src&quot;&gt;（yfinance 口徑）&lt;/span&gt;：微軟 47.1%、甲骨文（Oracle，甲骨文，資料庫與雲端公司）34.2%、Alphabet 33.3%、蘋果 33.0%、Meta 32.9%、亞馬遜 12.1%（蘋果、甲骨文為估值排除的營運參考）。&lt;/strong&gt;Alphabet 資本支出占營收與微軟、Meta 同屬大舉投資的一群，甲骨文更超過營收。&lt;/p&gt;&lt;p&gt;變現管道不同：微軟靠企業軟體與 Azure（微軟的雲端服務），Meta 幾乎全靠廣告，亞馬遜靠零售與 AWS（亞馬遜的雲端服務），Alphabet 兼有搜尋廣告、雲端與 TPU。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;與個別同業比較：利潤率與投入強度（近四季）。資料期間：本公司 SEC 近四季（截至 2026-09-30）；同業為資料商（yfinance 季報加總）近四季，截至 MSFT 2026-09-30、META 2026-09-30、AMZN 2026-09-30、AAPL 2026-09-30＊、ORCL 2026-08-31；＊資料商「營收年增」是最新單季對去年同季（不是近四季），最新一季截止日與近四季不同；資料商查詢 2026-11-14（批次收盤 2026-11-13）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 300&quot; role=&quot;img&quot; aria-label=&quot;同業比較&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;266.0&quot; y2=&quot;266.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;270.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;0%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;185.3&quot; y2=&quot;185.3&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;189.3&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;50%&lt;/text&gt;&lt;line x1=&quo
