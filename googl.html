&lt;div class=&quot;wrap&quot;&gt;&lt;div class=&quot;top&quot;&gt;&lt;div&gt;&lt;b&gt;GOOGL&lt;/b&gt;　Alphabet Inc.（Alphabet（Google 母公司））&lt;/div&gt;&lt;div&gt;財報截至 2026-09-30（2026 年第三季 10-Q；近四季＝2025Q4～2026Q3）&lt;/div&gt;&lt;div class=&quot;dl&quot;&gt;&lt;button type=&quot;button&quot; data-dl=&quot;html&quot; data-name=&quot;GOOGL_研究報告.html&quot;&gt;下載網頁&lt;/button&gt;&lt;button type=&quot;button&quot; data-dl=&quot;csv&quot; data-name=&quot;GOOGL_報告表格.csv&quot;&gt;下載表格（Excel 可開）&lt;/button&gt;&lt;button type=&quot;button&quot; onclick=&quot;window.print()&quot; title=&quot;可選「另存為 PDF」&quot;&gt;列印／另存 PDF&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;front&quot; id=&quot;front&quot; data-layer=&quot;首頁&quot;&gt;&lt;header class=&quot;hero&quot;&gt;&lt;div&gt;&lt;span class=&quot;stance&quot;&gt;生意品質良好／價格合理（在市場常態內）&lt;/span&gt;&lt;span class=&quot;stance rating&quot;&gt;研究評等　生意品質良好 ／ 價格合理（在市場常態內）（非買賣建議）&lt;/span&gt;&lt;h1&gt;護城河寬、雲端加速；現價要成立，基準成長下長期營業利益率需逐步升到約 40%（目前 33%）&lt;/h1&gt;&lt;p class=&quot;summary&quot;&gt;近四季營收年增 22.2%、雲端第三季 +103%，但資本支出 1,598 億讓自由現金流只剩 197 億。合理價值約 204.71–296.61 美元，2026-11-16 收盤 283.72 美元 落在區間上半段；基準情境成真時的現價隱含年報酬約 8.6%（基準情境成真時、以收盤 2026-11-16 股價買進的推算年報酬；條件式，非預期報酬、非買賣建議），略低於資金成本 9.8%。&lt;/p&gt;&lt;/div&gt;&lt;/header&gt;&lt;div class=&quot;layer&quot; id=&quot;layer-30s&quot; style=&quot;margin-top:22px&quot;&gt;&lt;div class=&quot;cap&quot; style=&quot;font-weight:700;letter-spacing:.1em&quot;&gt;30 秒版&lt;/div&gt;&lt;section class=&quot;note-box&quot; id=&quot;expected-return&quot; style=&quot;margin-top:18px&quot;&gt;&lt;h3&gt;以現價買進的預期年報酬&lt;/h3&gt;&lt;p style=&quot;font-size:20px;font-weight:700;margin:4px 0 8px&quot;&gt;基準情境成真時，每年約 8.6%&lt;/p&gt;&lt;div class=&quot;rows&quot;&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;10 年期美國公債&lt;/span&gt;&lt;span&gt;5.1%&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;本報告要求報酬（&lt;abbr title=&quot;WACC（Weighted Average Cost of Capital）&quot;&gt;資金成本&lt;/abbr&gt;）&lt;/span&gt;&lt;span&gt;9.8%&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;保守情境成真時&lt;/span&gt;&lt;span&gt;6.0%&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;樂觀情境成真時&lt;/span&gt;&lt;span&gt;11.8%&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin:8px 0 0&quot;&gt;條件式推算：各情境成真、以收盤價買進時的年化報酬（使估值等於現價的折現率）；不是機率加權結果，也不是預測；非買賣建議，不進研究評等。&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;note-box&quot; id=&quot;bet&quot; style=&quot;margin-top:18px&quot;&gt;&lt;h3&gt;你在賭什麼：要讓現價 283.72 合理，長期營業利益率得維持多少？&lt;/h3&gt;&lt;p class=&quot;cap&quot; style=&quot;margin:0&quot;&gt;欄是折現率，列是成長情境&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table style=&quot;min-width:0;font-size:14px&quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th style=&quot;white-space:nowrap;text-align:center&quot;&gt;9.8%&lt;br&gt;&lt;small&gt;本報告&lt;/small&gt;&lt;/th&gt;&lt;th style=&quot;white-space:nowrap;text-align:center&quot;&gt;9.0%&lt;/th&gt;&lt;th style=&quot;white-space:nowrap;text-align:center&quot;&gt;8.6%&lt;br&gt;&lt;small&gt;市價反推&lt;/small&gt;&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td style=&quot;text-align:center&quot;&gt;&lt;b style=&quot;color:#b7791f&quot;&gt;68%&lt;/b&gt;&lt;/td&gt;&lt;td style=&quot;text-align:center&quot;&gt;&lt;b style=&quot;color:#b7791f&quot;&gt;57%&lt;/b&gt;&lt;/td&gt;&lt;td style=&quot;text-align:center&quot;&gt;&lt;b style=&quot;color:#b7791f&quot;&gt;52%&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td style=&quot;text-align:center&quot;&gt;&lt;b style=&quot;color:#b7791f&quot;&gt;40%&lt;/b&gt;&lt;/td&gt;&lt;td style=&quot;text-align:center&quot;&gt;&lt;b style=&quot;color:var(--pos)&quot;&gt;33%&lt;/b&gt;&lt;/td&gt;&lt;td style=&quot;text-align:center&quot;&gt;&lt;b style=&quot;color:var(--pos)&quot;&gt;30%&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td style=&quot;text-align:center&quot;&gt;&lt;b style=&quot;color:var(--pos)&quot;&gt;27%&lt;/b&gt;&lt;/td&gt;&lt;td style=&quot;text-align:center&quot;&gt;&lt;b style=&quot;color:var(--pos)&quot;&gt;23%&lt;/b&gt;&lt;/td&gt;&lt;td style=&quot;text-align:center&quot;&gt;&lt;b style=&quot;color:var(--pos)&quot;&gt;21%&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;目前營業利益率 33.3%（近四季）。綠＝不高於目前，現在就做得到；黃＝要比現在更好；紅＝解不到或高於 80%。利潤率由目前逐年走到該值，其他假設照各情境；條件式推算，非預測、非買賣建議。&lt;/p&gt;&lt;/section&gt;&lt;section id=&quot;lights&quot; style=&quot;margin-top:18px&quot;&gt;&lt;h3&gt;四個面向&lt;/h3&gt;&lt;div class=&quot;kpis&quot;&gt;&lt;div class=&quot;kpi&quot; style=&quot;border-left:4px solid var(--pos)&quot;&gt;&lt;div &lt;/script&gt;&lt;/section&gt;&lt;section class=&quot;note-box&quot; id=&quot;ledger&quot; style=&quot;margin-top:18px&quot;&gt;&lt;h3&gt;上次預測對答案&lt;/h3&gt;&lt;p&gt;&lt;b&gt;上次（上一版）以來改了什麼：&lt;/b&gt;研究評等 生意 B ／ 價格偏貴 → 生意品質良好 ／ 價格合理（在市場常態內）；價格位置 偏貴 → 合理；合理價值中點 227.92252822435645 → 243.49406447705104；收盤價 295.7699890136719 → 283.7200012207031。期間落空：無落空項目。&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;狀態&lt;/th&gt;&lt;th&gt;預測&lt;/th&gt;&lt;th&gt;檢驗時點&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b style=&quot;color:var(--muted)&quot;&gt;待公布&lt;/b&gt;&lt;/td&gt;&lt;td&gt;P1　2026 年第四季（至 2026-12-31）單季營收年增仍在 20% 以上（雲端積壓轉營收撐住）&lt;/td&gt;&lt;td&gt;2026 年 10-K（約 2027 年 2 月）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b style=&quot;color:var(--muted)&quot;&gt;待公布&lt;/b&gt;&lt;/td&gt;&lt;td&gt;P2　到 2027 年第三季（至 2027-09-30）營收近四季年增從高點回落到 22% 以下（上行段已遠長於歷史）&lt;/td&gt;&lt;td&gt;2027 年第三季 10-Q（約 2027 年 10 月）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b style=&quot;color:var(--muted)&quot;&gt;待公布&lt;/b&gt;&lt;/td&gt;&lt;td&gt;P3　折舊上升使近四季營業利益率在 2027 年第二季（至 2027-06-30）不超過 34%&lt;/td&gt;&lt;td&gt;2027 年第二季 10-Q（約 2027 年 7 月）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b style=&quot;color:var(--muted)&quot;&gt;待公布&lt;/b&gt;&lt;/td&gt;&lt;td&gt;P4　2027 年第一季（至 2027-03-31）營收積壓仍可覆蓋 4 季以上營收&lt;/td&gt;&lt;td&gt;2027 年第一季 10-Q（約 2027 年 4 月）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b style=&quot;color:var(--muted)&quot;&gt;待公布&lt;/b&gt;&lt;/td&gt;&lt;td&gt;P5　2027 年資本支出顯著增加的說法使近四季資本支出強度在 2027 年第一季（至 2027-03-31）不低於 35%&lt;/td&gt;&lt;td&gt;2027 年第一季 10-Q（約 2027 年 4 月）&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;來源：商業評估的推論紀錄與觀察清單（預測帳本）；另有觀察清單 5 條待公布，見商業評估分頁。新財報進來後變成命中或落空；只描述，不是買賣建議。&lt;/p&gt;&lt;/section&gt;&lt;/div&gt;&lt;div class=&quot;layer&quot; id=&quot;layer-3min&quot; style=&quot;margin-top:22px&quot;&gt;&lt;div class=&quot;cap&quot; style=&quot;font-weight:700;letter-spacing:.1em&quot;&gt;3 分鐘版&lt;/div&gt;&lt;div class=&quot;grid2 front-pts&quot; style=&quot;margin-top:18px&quot;&gt;&lt;div&gt;&lt;h3&gt;三個看好的理由&lt;/h3&gt;&lt;ol class=&quot;pts&quot;&gt;&lt;li&gt;第三季雲端 +103%，近四季營收 +22.2%，投入資本報酬率約 37%。&lt;/li&gt;&lt;li&gt;近四季資本支出 1,598 億，自由現金流只剩 197 億，扣股權薪酬後為負。&lt;/li&gt;&lt;li&gt;現價 283.72 美元 在合理價值區間上半段；基準成真時年報酬約 8.6%（基準情境成真時、以收盤 2026-11-16 股價買進的推算年報酬；條件式，非預期報酬、非買賣建議），略低於資金成本。&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;&lt;div&gt;&lt;h3&gt;三個風險&lt;/h3&gt;&lt;ol class=&quot;pts risk&quot;&gt;&lt;li&gt;&lt;abbr title=&quot;AI（Artificial Intelligence）&quot;&gt;人工智慧&lt;/abbr&gt; 模式變現較低，搜尋年增由 17% 降到 12%。&lt;/li&gt;&lt;li&gt;2027 年資本支出再顯著增加，採購承諾 9,244 億。&lt;/li&gt;&lt;li&gt;停止回購、改發股發債，流通股 2026 年已增 1.7%。&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;note-box&quot; id=&quot;when-fair&quot;&gt;&lt;b&gt;什麼條件下現價算合理&lt;/b&gt;&lt;ul&gt;&lt;li&gt;高成長多撐兩年（第 1 年成長率多維持兩年，其他照基準）：每股約 349.28（比現價高 23%）&lt;/li&gt;&lt;li&gt;長期營業利益率維持目前 33.3%（其他照基準）：每股約 244.18（比現價低 14%）&lt;/li&gt;&lt;li&gt;成長照樂觀、利潤率照基準：每股約 294.83（比現價高 4%）&lt;/li&gt;&lt;/ul&gt;&lt;p class=&quot;cap&quot;&gt;用估值模型同一條式子、本報告折現率 9.8% 算；每條只改一項假設，其他照基準情境。買入上限放在下方「完整底稿」的價格框。非目標價、非買賣建議。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;note-box mv&quot;&gt;&lt;b&gt;市場價格隱含什麼、我們哪裡不同&lt;/b&gt;&lt;p&gt;成長照基準時，市價隱含第 1 年起每年營業利益率約 37.6%（市價反推第 1 年起每年固定的營業利益率，含穩態；市價 283.72 美元、收盤 2026-11-16；折現率 9.78%；推導）（近四季 33.3%），或 10 年營收名目年增約 17.4%（推導，擇一）；本報告基準成長由 25% 降到 8%、利潤率約 31%–32%。&lt;/p&gt;&lt;/div&gt;&lt;div id=&quot;triggers&quot; class=&quot;tm&quot;&gt;&lt;h3&gt;風險與改變判斷&lt;/h3&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;risk-tbl&quot; style=&quot;min-width:0;width:100%&quot;&gt;&lt;tr&gt;&lt;th style=&quot;white-space:normal;width:64%&quot;&gt;情況（看哪個指標、門檻多少）&lt;/th&gt;&lt;th style=&quot;white-space:normal;width:22%&quot;&gt;會改變什麼判斷&lt;/th&gt;&lt;th style=&quot;white-space:normal;width:14%&quot;&gt;歷史基準比率&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;搜尋與其他年增連兩季低於 8%，或全球搜尋市占跌破 85%&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;護城河由寬下修為窄&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;雲端年增連兩季低於 50% 或積壓季減，基準成長下修；連四季營收年增 22% 以上&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;基準上修&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;連兩季營運現金流高於資本支出&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;自由現金流品質由弱上修；否則維持弱&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;近四季 &lt;abbr title=&quot;ROIC（Return on Invested Capital）&quot;&gt;投入資本報酬率&lt;/abbr&gt;（投入資本報酬率）跌破 20%，或增量 投入資本報酬率 連兩季低於資金成本 9.8%&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;投入回報由強下修&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;收盤價高於合理價值上緣 296.61 美元&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;價格位置由合理改偏貴；低於 204.71 美元 改偏低&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;流通股較 9 月底再增 1% 以上或淨現金轉淨負債&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;資本配置或資產負債表下修；淨回購連兩季為正則上修&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;估值：現價在合理價值上半段，基準隱含年報酬 8.6%（基準情境成真時、以收盤 2026-11-16 股價買進的推算年報酬；條件式，非預期報酬、非買賣建議） 低於資金成本 9.8%&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;未設門檻：持續觀察&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;人工智慧 投資回收：2026 年資本支出指引 1,950～2,050 億，2027 年再增&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;未設門檻：持續觀察&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;搜尋變現：人工智慧 模式變現較低，搜尋年增由 17% 降到 12%&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;未設門檻：持續觀察&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;收入品質：TPU（Google 自研的 人工智慧 晶片）系統附回購選擇權，積壓含關聯方 Crux 人工智慧（Blackstone 與 Google 合資的 TPU 雲端公司）168 億&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;未設門檻：持續觀察&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;歷史基準比率＝成功幾率口徑，是同規模公司歷史上做到的比例，不是這家公司的預測；「—」＝沒有可對照的歷史基準，不估機率。營收成長類的列：同規模（營收 500 億美元以上）公司 10 年實質年增做到模型基準 9.0% 的歷史比例（超額報酬期間檢查 基準比率；Base Rate Book）。&lt;/p&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; id=&quot;sanity-front&quot;&gt;&lt;b&gt;合理性檢查：&lt;/b&gt;紅燈 0、黃燈 3。只提醒、不改評等；逐項與作者說明見計算底稿 5。&lt;/p&gt;&lt;/div&gt;&lt;p class=&quot;cap fnote&quot;&gt;資料日期：財報截至 2026-09-30（2026 年第三季 10-Q；近四季＝2025Q4～2026Q3）；市場資料 2026-11-16 收盤 283.72 美元。首家產業，公版待驗證（穩定現金流／數位平台；產業公版的估值法與指標選擇尚未經兩家以上驗證）。研究用途，非買賣建議，不構成任何投資建議，也不提供單一目標價。本研究只評估公司本身，不評估讀者自身的資金期限與等待能力。完整數字見正文&lt;a href=&quot;#numbers&quot;&gt;「完整數字」&lt;/a&gt;；名詞與每條判斷的證據狀態見&lt;a href=&quot;#more&quot;&gt;附錄&lt;/a&gt;。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;

&lt;main class=&quot;wrap&quot;&gt;&lt;details id=&quot;full&quot; class=&quot;fullwrap&quot;&gt;&lt;summary style=&quot;cursor:pointer;font-weight:700;font-size:18px;padding:14px 0&quot;&gt;完整底稿：價格框與買入上限、正文七題、計算底稿、附錄與出處（點開）&lt;/summary&gt;&lt;div data-layer=&quot;正文&quot;&gt;&lt;section class=&quot;q&quot; id=&quot;price-detail&quot; data-layer=&quot;完整底稿&quot;&gt;&lt;div class=&quot;qno&quot;&gt;價格&lt;/div&gt;&lt;h2&gt;價格框、合理價值與市價隱含倍數&lt;/h2&gt;&lt;div class=&quot;hero&quot;&gt;&lt;aside class=&quot;pricebox&quot;&gt;&lt;div class=&quot;sub&quot;&gt;2026-11-16 收盤 283.72 美元&lt;/div&gt;&lt;div class=&quot;big&quot;&gt;283.72&lt;span style=&quot;font-size:18px&quot;&gt; 美元&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;zones&quot;&gt;&lt;div class=&quot;zone buy&quot; style=&quot;grid-column:1/-1&quot;&gt;&lt;span&gt;買入上限（不確定性中）&lt;/span&gt;&lt;b&gt;170 美元&lt;/b&gt;&lt;small&gt;股價在此以下才有 30% 安全邊際；＝合理價值中點 243.49 ×（1−30%）。非買賣建議。&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;rows&quot;&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;股價 ÷ 合理價值中點&lt;/span&gt;&lt;span&gt;1.17 倍&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;10 年期美國公債&lt;/span&gt;&lt;span&gt;5.12%&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;r&quot;&gt;&lt;span&gt;市價隱含 5 年營收年增&lt;/span&gt;&lt;span&gt;14.5%&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;現金（2026-09-30）&lt;/span&gt;&lt;span&gt;563 億美元&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;流動有價證券&lt;/span&gt;&lt;span&gt;2,088 億美元&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;有息負債&lt;/span&gt;&lt;span&gt;1,251 億美元&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;淨現金（現金＋流動有價證券−有息負債）&lt;/span&gt;&lt;span&gt;1,400 億美元&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;近四季回購&lt;/span&gt;&lt;span&gt;59.0 億美元&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot; style=&quot;display:block&quot;&gt;&lt;span&gt;股東回報與權益（2021–2025）：&lt;/span&gt;&lt;span style=&quot;font-weight:400&quot;&gt;近五年平均 ROE 30%；股東權益 2,516→4,153 億美元；股利＋回購占自由現金流 87%（逐年表見第六題）&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; id=&quot;cont-note&quot; style=&quot;margin:10px 0 0&quot;&gt;這個數字只描述現價與本報告合理價值中點的距離，不改價格位置與研究評等。非買賣建議。&lt;/p&gt;&lt;/aside&gt;&lt;/div&gt;&lt;section class=&quot;note-box&quot; id=&quot;value-trio&quot; style=&quot;margin-top:18px&quot;&gt;&lt;h3&gt;合理價值與市價隱含第 20 年倍數&lt;/h3&gt;&lt;div class=&quot;zones&quot; style=&quot;grid-template-columns:repeat(2,1fr)&quot;&gt;&lt;div class=&quot;zone&quot;&gt;&lt;span&gt;合理價值（只含折現率）&lt;/span&gt;&lt;b&gt;205–297 美元&lt;/b&gt;&lt;small&gt;中點 243.49 美元；三情境機率加權&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;zone mkt&quot;&gt;&lt;span&gt;市價隱含第 20 年倍數（EV/EBIT，基準情境）&lt;/span&gt;&lt;b&gt;17.6 倍&lt;/b&gt;&lt;small&gt;模型假設 10.5 倍，市價隱含是模型的 1.7 倍；折現率區間 13.1–23.0 倍；參考帶（大類：軟體與網路，148 筆、7 家）中位 15.5 倍、四分位 6.0–28.1 倍、p90 46.7 倍（機械回測樣本，非市場全體；分產業的筆數與公司數少，僅供參考）；只描述，不進評等&lt;br&gt;特例：明示期 20 年，參考帶是 10 年機械回測，倍數不直接比，僅供參考&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;參考帶中位（軟體與網路） 15.5 倍時，機率加權每股約 287 美元（條件式，非目標價、非買賣建議，不進評等；各倍數對照見計算底稿 5）。&lt;/p&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;&lt;b&gt;合理價值 vs 市價隱含倍數（作者判讀）：&lt;/b&gt;市價隱含第 20 年 EV（企業價值）/EBIT（息稅前利益，本報告以營業利益計）約 17.6 倍，是本報告基準模型終值倍數 10.5 倍 的 1.68 倍。特例：本報告衰退期 15 年使明示期達 20 年，軟體與網路參考帶（中位 15.5 倍）是 10 年機械回測，倍數不直接比、僅供參考；模型倍數較低是因 15 年後永續期 ROIC 降到 18.9%，價值已在較長的衰退期計入。只描述，不作評等理由。&lt;/p&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:10px;font-size:15px;line-height:1.7&quot;&gt;上面的合理價值只含折現率高低；三情境全幅 105～492（情境與折現率一起算，約中點的 159%）；寬主要來自情境（差距 124%），不是折現率（38%）。情境差距＝（樂觀－保守）÷基準，折現率寬度＝（高－低）÷中點；非買賣建議。&lt;/p&gt;&lt;div class=&quot;tw&quot; style=&quot;margin-top:14px&quot;&gt;&lt;table class=&quot;txt&quot; style=&quot;min-width:0;font-size:16px&quot;&gt;&lt;tr&gt;&lt;th style=&quot;padding:9px 12px;font-size:15px&quot;&gt;情境&lt;/th&gt;&lt;th style=&quot;padding:9px 12px;font-size:15px&quot;&gt;每股價值&lt;/th&gt;&lt;th style=&quot;padding:9px 12px;font-size:15px&quot;&gt;權重&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;padding:9px 12px&quot;&gt;保守&lt;/td&gt;&lt;td style=&quot;padding:9px 12px;font-size:20px;font-weight:700&quot;&gt;121.10&lt;/td&gt;&lt;td style=&quot;padding:9px 12px&quot;&gt;25%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;padding:9px 12px&quot;&gt;基準&lt;div style=&quot;font-size:13px;line-height:1.5;color:var(--muted);margin-top:2px&quot;&gt;與外部 DCF 單點同口徑；今天的現值，不是 12 個月目標價，非買賣建議&lt;/div&gt;&lt;/td&gt;&lt;td style=&quot;padding:9px 12px;font-size:20px;font-weight:700&quot;&gt;226.20&lt;/td&gt;&lt;td style=&quot;padding:9px 12px&quot;&gt;50%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;padding:9px 12px&quot;&gt;樂觀&lt;/td&gt;&lt;td style=&quot;padding:9px 12px;font-size:20px;font-weight:700&quot;&gt;400.48&lt;/td&gt;&lt;td style=&quot;padding:9px 12px&quot;&gt;25%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:10px;font-size:15px;line-height:1.7&quot;&gt;中點是三個情境的加權，上下緣是換折現率重算；算式見&lt;a href=&quot;#valuation&quot;&gt;第五題&lt;/a&gt;。情境表說明合理價值怎麼組成，不是單一目標價。&lt;/p&gt;&lt;/section&gt;&lt;div class=&quot;kpis&quot;&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;l&quot;&gt;近四季營收年增&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;+22.2%&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;近四季 4,711 億美元；第三季 +24.7%，雲端 +103%&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;l&quot;&gt;營業利益率&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;33.3%&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;近四季（營業利益 1,570 億 ÷ 營收 4,711 億）&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;l&quot;&gt;每股FCF扣股權薪酬&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;約 −0.87 美元&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;近四季；未扣股權薪酬約 1.61 美元（推算）&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;l&quot;&gt;資本支出強度&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;33.9%&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;近四季資本支出 1,598 億 ÷ 營收；2022 年約 11%&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;note-box&quot; id=&quot;survival&quot; style=&quot;border-left-color:var(--pos)&quot;&gt;&lt;p style=&quot;margin:0&quot;&gt;&lt;b&gt;信用評級&lt;/b&gt;　機構 Moody&amp;#x27;s Aa2、S&amp;amp;P AA+（SEC 全文搜尋 FWP 2026-08-07 0001193125-26-338750）｜投資等級　｜　&lt;a href=&quot;#survival-detail&quot;&gt;&lt;b&gt;存活檢查（12～24 個月）&lt;/b&gt;&lt;/a&gt;　&lt;b style=&quot;color:var(--pos)&quot;&gt;無明顯警訊&lt;/b&gt;（推導，非違約預測；理由見第六題計算底稿）&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;business&quot;&gt;&lt;div class=&quot;qno&quot;&gt;問題 01&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;生意怎麼賺錢？&lt;/div&gt;&lt;h2&gt;廣告仍占營收約 69%，雲端已成第二具引擎&lt;/h2&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;廣告仍是主體，雲端已是第二具引擎：第三季 Google 服務 963 億美元、年增 11%，Google 雲端 307 億、年增 103%，其他事業（Waymo 等）3.7 億仍虧損。&lt;/strong&gt;&lt;a class=&quot;term&quot; href=&quot;#g0&quot;&gt;近四季&lt;/a&gt;廣告約占 69%、雲端約 20%、訂閱與裝置約 11%&lt;span class=&quot;src&quot;&gt;（推算）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;最賺錢的搜尋正在放慢：搜尋年增由第二季 17% 降到第三季 12%，管理層承認 &lt;a class=&quot;term&quot; href=&quot;#g5&quot;&gt;AI 模式&lt;/a&gt;變現較低；雲端營業利益率則由 23.7% 升到 36.2%，利潤結構往雲端移。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;產品線營收占比（近四季，億美元；逐年金額與成長見下方明細表；數字取自原文表 10-K 2025-12-31 Item 8 ¶210，近四季為推算；圖的占比分母為圖中各線合計）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 480 280&quot; role=&quot;img&quot; aria-label=&quot;產品線營收&quot; class=&quot;chart&quot; style=&quot;max-width:624px&quot;&gt;&lt;path d=&quot;M240.0,52.0 A88,88 0 1 1 159.0,174.4 L190.3,161.1 A54,54 0 1 0 240.0,86.0 Z&quot; fill=&quot;var(--c1)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;Google 廣告：3,232（69%）&lt;/title&gt;&lt;/path&gt;&lt;path d=&quot;M159.0,174.4 A88,88 0 0 1 181.3,74.4 L204.0,99.7 A54,54 0 0 0 190.3,161.1 Z&quot; fill=&quot;var(--c2)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;Google 雲端：932（20%）&lt;/title&gt;&lt;/path&gt;&lt;path d=&quot;M181.3,74.4 A88,88 0 0 1 238.2,52.0 L238.9,86.0 A54,54 0 0 0 204.0,99.7 Z&quot; fill=&quot;var(--c6)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;訂閱、平台與裝置：532（11%）&lt;/title&gt;&lt;/path&gt;&lt;path d=&quot;M238.2,52.0 A88,88 0 0 1 240.0,52.0 L240.0,86.0 A54,54 0 0 0 238.9,86.0 Z&quot; fill=&quot;var(--muted)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;其他：15.3（&amp;lt;1%）&lt;/title&gt;&lt;/path&gt;&lt;polyline points=&quot;316.7,190.8 323.4,200.7 346.0,200.7&quot; fill=&quot;none&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;1&quot;/&gt;&lt;text x=&quot;354.0&quot; y=&quot;197.7&quot; class=&quot;lab&quot; text-anchor=&quot;start&quot;&gt;Google 廣告&lt;/text&gt;&lt;text x=&quot;354.0&quot; y=&quot;215.7&quot; class=&quot;val&quot; text-anchor=&quot;start&quot;&gt;69%&lt;tspan class=&quot;ax&quot; font-weight=&quot;400&quot;&gt;　3,232&lt;/tspan&gt;&lt;/text&gt;&lt;polyline points=&quot;150.2,119.9 142.4,116.0 134.0,116.0&quot; fill=&quot;none&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;1&quot;/&gt;&lt;text x=&quot;126.0&quot; y=&quot;113.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;Google 雲端&lt;/text&gt;&lt;text x=&quot;126.0&quot; y=&quot;131.0&quot; class=&quot;val&quot; text-anchor=&quot;end&quot;&gt;20%&lt;tspan class=&quot;ax&quot; font-weight=&quot;400&quot;&gt;　932&lt;/tspan&gt;&lt;/text&gt;&lt;polyline points=&quot;206.3,54.4 203.4,68.0 134.0,68.0&quot; fill=&quot;none&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;1&quot;/&gt;&lt;text x=&quot;126.0&quot; y=&quot;65.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;訂閱、平台與裝置&lt;/text&gt;&lt;text x=&quot;126.0&quot; y=&quot;83.0&quot; class=&quot;val&quot; text-anchor=&quot;end&quot;&gt;11%&lt;tspan class=&quot;ax&quot; font-weight=&quot;400&quot;&gt;　532&lt;/tspan&gt;&lt;/text&gt;&lt;polyline points=&quot;239.1,48.0 239.0,30.0 134.0,30.0&quot; fill=&quot;none&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;1&quot;/&gt;&lt;text x=&quot;126.0&quot; y=&quot;27.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;其他&lt;/text&gt;&lt;text x=&quot;126.0&quot; y=&quot;45.0&quot; class=&quot;val&quot; text-anchor=&quot;end&quot;&gt;&amp;lt;1%&lt;tspan class=&quot;ax&quot; font-weight=&quot;400&quot;&gt;　15.3&lt;/tspan&gt;&lt;/text&gt;&lt;text x=&quot;240.0&quot; y=&quot;136.0&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;近四季&lt;/text&gt;&lt;text x=&quot;240.0&quot; y=&quot;158.0&quot; class=&quot;val&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:18px&quot;&gt;4,710&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;產品線與業務線營收（10-K／10-Q 原文表格整理）&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;XBRL（SEC 財報的結構化資料格式；SEC 財報的結構化資料）只有 2022–2024 年產品線拆分，本表改用 2025 年 10-K 與 2026 年第三季 10-Q 附註；近四季＝2025 年＋前九月－去年前九月&lt;span class=&quot;src&quot;&gt;（推算）&lt;/span&gt;，單位億美元。&lt;/p&gt;&lt;p&gt;雲端成長最快（2025 年 +35.8%、第三季 +102.6%），占營收由 2023 年約 11% 升到約 20%；聯播網是廣告三條線中唯一萎縮的。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;figure&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt signals&quot;&gt;&lt;tr&gt;&lt;th&gt;產品線&lt;/th&gt;&lt;th&gt;2025&lt;/th&gt;&lt;th&gt;近四季（推算）&lt;/th&gt;&lt;th&gt;2025 年增&lt;/th&gt;&lt;th&gt;第三季年增&lt;/th&gt;&lt;th&gt;占近四季&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;搜尋與其他（Google Search &amp;amp; other）&lt;/td&gt;&lt;td&gt;2,245&lt;/td&gt;&lt;td&gt;2,501&lt;/td&gt;&lt;td&gt;+13.4%&lt;/td&gt;&lt;td&gt;+12.0%&lt;/td&gt;&lt;td&gt;53%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;YouTube（Google 旗下影音平台）廣告&lt;/td&gt;&lt;td&gt;404&lt;/td&gt;&lt;td&gt;435&lt;/td&gt;&lt;td&gt;+11.7%&lt;/td&gt;&lt;td&gt;+9.2%&lt;/td&gt;&lt;td&gt;9%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;聯播網（Google Network）&lt;/td&gt;&lt;td&gt;298&lt;/td&gt;&lt;td&gt;296&lt;/td&gt;&lt;td&gt;−1.9%&lt;/td&gt;&lt;td&gt;+1.4%&lt;/td&gt;&lt;td&gt;6%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;訂閱、平台與裝置&lt;/td&gt;&lt;td&gt;480&lt;/td&gt;&lt;td&gt;532&lt;/td&gt;&lt;td&gt;+19.1%&lt;/td&gt;&lt;td&gt;+11.0%&lt;/td&gt;&lt;td&gt;11%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Google 雲端（Google Cloud）&lt;/td&gt;&lt;td&gt;587&lt;/td&gt;&lt;td&gt;932&lt;/td&gt;&lt;td&gt;+35.8%&lt;/td&gt;&lt;td&gt;+102.6%&lt;/td&gt;&lt;td&gt;20%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;其他事業（Other Bets）&lt;/td&gt;&lt;td&gt;15&lt;/td&gt;&lt;td&gt;15&lt;/td&gt;&lt;td&gt;−6.7%&lt;/td&gt;&lt;td&gt;+8.1%&lt;/td&gt;&lt;td&gt;0%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;合計（含避險損益）&lt;/td&gt;&lt;td&gt;4,028&lt;/td&gt;&lt;td&gt;4,711&lt;/td&gt;&lt;td&gt;+15.1%&lt;/td&gt;&lt;td&gt;+24.7%&lt;/td&gt;&lt;td&gt;100%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;白話說&lt;/b&gt;每 100 美元近四季營收（推算）：搜尋 53、YouTube 9、聯播網 6、訂閱與裝置 11、雲端 20。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;要留意&lt;/b&gt;搜尋最賺錢；AI 改變找資訊方式而變現追不上，成長會先放慢，見改判訊號。&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;產品線營收明細（億美元；占比為最近財年，分母為各線合計；數字取自原文表 10-K 2025-12-31 Item 8 ¶210，近四季為推算）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;產品線&lt;/th&gt;&lt;th&gt;FY23&lt;/th&gt;&lt;th&gt;FY24&lt;/th&gt;&lt;th&gt;FY25&lt;/th&gt;&lt;th&gt;近四季&lt;/th&gt;&lt;th&gt;最近財年年增&lt;/th&gt;&lt;th&gt;占比&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Google 廣告&lt;/td&gt;&lt;td&gt;2,379&lt;/td&gt;&lt;td&gt;2,646&lt;/td&gt;&lt;td&gt;2,947&lt;/td&gt;&lt;td&gt;3,232&lt;/td&gt;&lt;td&gt;11.4%&lt;/td&gt;&lt;td&gt;73%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Google 雲端&lt;/td&gt;&lt;td&gt;331&lt;/td&gt;&lt;td&gt;432&lt;/td&gt;&lt;td&gt;587&lt;/td&gt;&lt;td&gt;932&lt;/td&gt;&lt;td&gt;35.8%&lt;/td&gt;&lt;td&gt;15%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;訂閱、平台與裝置&lt;/td&gt;&lt;td&gt;347&lt;/td&gt;&lt;td&gt;403&lt;/td&gt;&lt;td&gt;480&lt;/td&gt;&lt;td&gt;532&lt;/td&gt;&lt;td&gt;19.1%&lt;/td&gt;&lt;td&gt;12%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;其他事業&lt;/td&gt;&lt;td&gt;15&lt;/td&gt;&lt;td&gt;16&lt;/td&gt;&lt;td&gt;15&lt;/td&gt;&lt;td&gt;15&lt;/td&gt;&lt;td&gt;-6.7%&lt;/td&gt;&lt;td&gt;0%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;business-profile&quot;&gt;&lt;h3&gt;生意介紹：年報重點&lt;/h3&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;Alphabet 是搜尋與 YouTube 廣告公司，正在變成廣告加雲端與 AI 算力的雙引擎公司。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;賣什麼&lt;/p&gt;&lt;h4&gt;三塊生意：廣告為主，雲端與 TPU 加速&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;Google 服務賣搜尋、YouTube 與聯播網廣告，加上 YouTube 訂閱、Pixel 等裝置；Google 雲端賣運算基礎設施、AI 模型 API（應用程式介面）與 &lt;a class=&quot;term&quot; href=&quot;#g3&quot;&gt;TPU&lt;/a&gt; 系統；其他事業以 Waymo 自動駕駛為主，收入主要來自自動駕駛與網路服務&lt;span class=&quot;src&quot;&gt;（10-K 2025 Item 1 ¶53）&lt;/span&gt;。&lt;/strong&gt;公司說加入 AI Overviews（搜尋結果頁的 AI 摘要）與 AI Mode 後變現方式可能不同，會影響成長率與利潤率&lt;span class=&quot;src&quot;&gt;（10-K 2025 Item 7 ¶9）&lt;/span&gt;。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;誰付錢、怎麼賣&lt;/p&gt;&lt;h4&gt;付錢的是廣告主、企業與消費者，沒有大客戶依賴&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;廣告主按點擊或曝光付費，企業與開發者付雲端與 API 費用，消費者付訂閱與裝置。&lt;/strong&gt;沒有單一客戶或關係企業群占營收 10% 以上&lt;span class=&quot;src&quot;&gt;（10-K 2025 Item 8 ¶211）&lt;/span&gt;；應收帳款多為無擔保&lt;span class=&quot;src&quot;&gt;（Item 8 ¶143）&lt;/span&gt;。&lt;a class=&quot;term&quot; href=&quot;#g2&quot;&gt;營收積壓&lt;/a&gt;含與關聯方 Crux AI（Blackstone 與 Google 的 TPU 雲端合資）多年合約 168 億&lt;span class=&quot;src&quot;&gt;（10-Q 2026-09-30 Item 1 ¶119）&lt;/span&gt;，是少見的集中點。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;營收結構：誰在拉動&lt;/p&gt;&lt;h4&gt;雲端在拉動，搜尋在放慢&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;近四季廣告約 69%、雲端約 20%、訂閱平台與裝置約 11%&lt;span class=&quot;src&quot;&gt;（推算，見產品線表）&lt;/span&gt;。&lt;/strong&gt;第三季營收多出約 252 億中，雲端 156 億、Google 服務 93 億&lt;span class=&quot;src&quot;&gt;（8-K 2026-10-28 新聞稿）&lt;/span&gt;；搜尋與其他年增 12%&lt;span class=&quot;src&quot;&gt;（10-Q 2026-09-30 Item 2 ¶115–117）&lt;/span&gt;。判讀：成長越來越靠資本密集的雲端。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;市場、地區與重點專案&lt;/p&gt;&lt;h4&gt;美國占比上升；重點專案是資料中心與 Waymo&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;2025 年美國占營收 48%、歐洲中東非洲 29%、亞太 17%&lt;span class=&quot;src&quot;&gt;（10-K 2025 Item 7 ¶147）&lt;/span&gt;；2026 年第三季美國升到 53%、歐洲中東非洲 26%、亞太 16%，美國年增約 39%、歐洲中東非洲約 9%，拉動的是美國&lt;span class=&quot;src&quot;&gt;（10-Q 2026-09-30 Item 1 ¶116；8-K 2026-10-28 新聞稿 §36）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;最大專案是資料中心：公司說建設是多年多階段工程，2026 年&lt;a class=&quot;term&quot; href=&quot;#g8&quot;&gt;資本支出&lt;/a&gt;指引 1,950～2,050 億、2027 年顯著增加&lt;span class=&quot;src&quot;&gt;（10-Q Item 2 ¶203；新聞 N3）&lt;/span&gt;，個別地點與規模未揭露&lt;span class=&quot;src&quot;&gt;（查過 10-K Item 1、Item 7）&lt;/span&gt;。&lt;/strong&gt;Waymo 在美國 15 個大城市營運，計畫進入加拿大、德國、新加坡與西班牙（公司說法，新聞 N1 §11）。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;跟誰競爭&lt;/p&gt;&lt;h4&gt;搜尋入口仍穩，雲端是三強競爭&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;10-K 列的對手橫跨通用搜尋與資訊服務、垂直搜尋與電商、線上廣告平台、內容平台與企業雲端&lt;span class=&quot;src&quot;&gt;（10-K 2025 Item 1 ¶55–61）&lt;/span&gt;。&lt;/strong&gt;外部證據：Statcounter 2026 年 9 月全球搜尋市占約 89.9%，但 ChatGPT（OpenAI 的聊天機器人）與 Gemini（Google 的 AI 模型與助理）用戶都在增加（新聞 N13）。我們的判讀：搜尋入口仍穩，雲端與微軟、亞馬遜同樣大舉投資（見第二題）。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;管理層怎麼說&lt;/p&gt;&lt;h4&gt;公司說 AI 帶動查詢量，但搜尋營收成長仍在放慢&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;公司說法：營收年增 25%，AI 投資讓搜尋查詢量年增率達五年最高，雲端年增 103%，TPU 系統需求強，Gemini app（應用程式）用戶達 10 億&lt;span class=&quot;src&quot;&gt;（8-K 2026-10-28 新聞稿 §2–3）&lt;/span&gt;。&lt;/strong&gt;和實績對照：營收與雲端數字與 10-Q 一致，但搜尋與其他年增由第二季 17% 降到 12%，查詢量成長還沒轉成同速營收&lt;span class=&quot;src&quot;&gt;（10-Q Item 2 ¶115–117）&lt;/span&gt;。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;年報列的主要風險&lt;/p&gt;&lt;h4&gt;四條和本報告最相關的年報風險&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;①AI 正在改變廣告業，公司不保證能及時調整廣告形式&lt;span class=&quot;src&quot;&gt;（10-K 2025 Item 1A ¶6）&lt;/span&gt;；②各業務對手眾多，可能持續重投基礎設施與人才&lt;span class=&quot;src&quot;&gt;（¶22）&lt;/span&gt;；③AI 加速器供應競爭激烈，長期採購合約可能留下用不完的成本&lt;span class=&quot;src&quot;&gt;（¶44）&lt;/span&gt;；④其他事業如自動駕駛、生命科學可能無法獲利&lt;span class=&quot;src&quot;&gt;（¶18）&lt;/span&gt;。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;moat&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;護城河與成長故事&lt;/p&gt;&lt;h3&gt;護城河寬；受考驗的是 AI 模式變現與反壟斷補救&lt;/h3&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;護城河有三層：搜尋入口&lt;span class=&quot;src&quot;&gt;（citybiz 轉述 Statcounter 2026 年 9 月全球市占約 89.9%（網頁造訪口徑）；Yelp，美國在地商家評論網站、Angi、CarGurus 年報都寫依賴 Google 導流）&lt;/span&gt;、廣告效率、算力（雲端積壓 5,608 億、自研 TPU）。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;受考驗處：AI 模式變現低於傳統搜尋，搜尋年增由 17% 降到 12%；Yelp 年報指出 AI 回答放在自然結果上方。&lt;/strong&gt;廣告科技案法院駁回分拆、改命行為補救（最終判決未出；PPC Land 解讀為六年期），搜尋案限制分發並要求分享資料、雙方上訴中。2026 年資本支出指引 1,950～2,050 億，2027 年再增加。&lt;/p&gt;&lt;p&gt;成長跑道：雲端空間有積壓支撐&lt;span class=&quot;src&quot;&gt;（約近四季營收 6 倍，推導）&lt;/span&gt;，搜尋量價同增仍有定價能力，增量營業利益率高於平均；但公司只給資本支出指引，2026 年成長投資靠外部融資（六項明細見計算底稿 5）。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;護城河來源：證據、威脅與失效條件&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;優勢來源&lt;/th&gt;&lt;th&gt;證據&lt;/th&gt;&lt;th&gt;威脅&lt;/th&gt;&lt;th&gt;什麼情況代表失效&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;搜尋入口與網路效應&lt;/td&gt;&lt;td&gt;Statcounter（網路流量統計機構）全球約 89.9%（2026-0&lt;/td&gt;&lt;td&gt;AI 聊天工具改變找資訊方式；AI &lt;/td&gt;&lt;td&gt;搜尋與其他年增連兩季低於 8%，或 Statcoun&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;雲端與 AI 算力（TPU）&lt;/td&gt;&lt;td&gt;雲端第三季 +103%、營業利益率 36.2%；積壓 5&lt;/td&gt;&lt;td&gt;資本密集、同業同樣大舉投資；夥伴交付&lt;/td&gt;&lt;td&gt;雲端年增連兩季低於 50%，或積壓季減&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;資料與廣告效率&lt;/td&gt;&lt;td&gt;Google 服務營業利益率 40.7%（去年同期 38&lt;/td&gt;&lt;td&gt;隱私法規、AI 改變廣告形式；廣告科技行為補救&lt;/td&gt;&lt;td&gt;營業利益率連續下滑而搜尋成長放緩&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;supply&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;供應鏈與生產地&lt;/p&gt;&lt;h3&gt;硬體全委外，TPU 靠 Broadcom（美國半導體公司）與 Celestica（電子代工製造商）&lt;/h3&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;實體供應鏈服務資料中心與消費硬體；10-Q 說明存貨由第三方代工廠製造，各國生產比例與代工廠名稱未揭露，不補值。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;TPU：Broadcom 揭露長期開發供應協議，Celestica 在美國擴產支援（預計 2027 年完成）。&lt;/strong&gt;另有能源設備保證最高 162 億、TPU 回購保證最高 66 億。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;grid2 wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt; 46.0&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c2)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;占營收 FY22：0%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;218.0&quot; cy=&quot;246.0&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c2)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;占營收 FY23：0%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;364.0&quot; cy=&quot;246.0&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c2)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;占營收 FY24：0%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;510.0&quot; cy=&quot;246.0&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c2)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;占營收 FY25：0%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;518.0&quot; y=&quot;250.0&quot; class=&quot;val&quot; fill=&quot;var(--c2)&quot;&gt;0%&lt;/text&gt;&lt;polyline points=&quot;72.0,79.6 218.0,86.0 364.0,107.6 510.0,103.8&quot; fill=&quot;none&quot; stroke=&quot;var(--neg)&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;circle cx=&quot;72.0&quot; cy=&quot;79.6&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--neg)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;占長期資產 FY22：30%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;218.0&quot; cy=&quot;86.0&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--neg)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;占長期資產 FY23：29%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;364.0&quot; cy=&quot;107.6&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--neg)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;占長期資產 FY24：25%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;510.0&quot; cy=&quot;103.8&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--neg)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;占長期資產 FY25：25%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;518.0&quot; y=&quot;107.8&quot; class=&quot;val&quot; fill=&quot;var(--neg)&quot;&gt;25%&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c2)&quot;&gt;&lt;/i&gt;占營收&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--neg)&quot;&gt;&lt;/i&gt;占長期資產&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;growth&quot;&gt;&lt;div class=&quot;qno&quot;&gt;問題 02&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;還在成長嗎？&lt;/div&gt;&lt;h2&gt;在加速：近四季 +22%，靠雲端，用大量投資換來&lt;/h2&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;成長在加速：年度營收 2023 年 +8.7%、2024 年 +13.9%、2025 年 +15.1%，單季年增由 2026 年第一季 +21.8% 升到第三季 +24.7%，近四季 4,711 億（+22.2%）。&lt;/p&gt;&lt;p&gt;成長主要來自雲端的量：第三季多出約 252 億中雲端 156 億、Google 服務 93 億；搜尋付費點擊 +8%、每次點擊成本 +4%，量價同增（拆解見「成長來源」）。&lt;/p&gt;&lt;p&gt;成長品質仍好但在下降：近四季&lt;a class=&quot;term&quot; href=&quot;#g6&quot;&gt;投入資本報酬率&lt;/a&gt;約 37%，遠高於資金成本約 9.8%；&lt;a class=&quot;term&quot; href=&quot;#g7&quot;&gt;增量 ROIC&lt;/a&gt; 由 2023–2025 年約 28% 降到近四季約 17%&lt;span class=&quot;src&quot;&gt;（推算）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;反方：Google 服務只剩約 11% 成長；基準第 1 年 25% 略高於近四季 22.2%，要靠雲端積壓持續認列，雲端放慢就得下修（市價要求見第五題）。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;毛利率與營業利益率&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 280&quot; role=&quot;img&quot; aria-label=&quot;利潤率&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;246.0&quot; y2=&quot;246.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;250.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;20%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;201.2&quot; y2=&quot;201.2&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;205.2&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;30%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;156.4&quot; y2=&quot;156.4&quot; class=&quot;grid&quot; lphabet 過去一年做到 122 美元，但為此花約 34 美元蓋新店（2022 年約 11 美元）。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;要留意&lt;/b&gt;雲端成長或投入回報轉弱，基準成長就要下修，見改判訊號。&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;cash&quot;&gt;&lt;div class=&quot;qno&quot;&gt;問題 03・04&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;賺的錢是真的嗎？股東實際拿到什麼？&lt;/div&gt;&lt;h2&gt;本業收現強，但幾乎全投進 AI；申報淨利被投資利益墊高&lt;/h2&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;近四季營運現金流 1,796 億美元，是稅後營業利益 1,286 億的 1.4 倍；但資本支出 1,598 億，&lt;a class=&quot;term&quot; href=&quot;#g9&quot;&gt;自由現金流&lt;/a&gt;只剩 197 億（約 15%），再扣股權薪酬 304 億就轉負；第三季單季約 −91 億。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;申報淨利 2,357 億不能直接看：投資損益（業外收益稅前約 1,307 億）主要是 SpaceX（太空發射與衛星網路公司）與非上市股權評價利益。&lt;/strong&gt;我們改用&lt;a class=&quot;term&quot; href=&quot;#g1&quot;&gt;核心每股盈餘&lt;/a&gt; 10.42 美元（申報約 19.1 美元）。2026 前九月營運現金流 1,271 億低於資本支出 1,320 億，差額靠淨借入與發股補足（見第六題）。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;現價隱含年報酬（各情境成真時，非預期報酬）；紅色虛線為公債殖利率 5.12%。基準情境下，現價隱含的年報酬只比公債高 3.5 個百分點，模型的加權資本成本（基準）比公債高 4.7 個百分點，兩者的差距對應市價與合理價值的落差&lt;/p&gt;&lt;svg viewBox=&quot;0 0 500 182&quot; role=&quot;img&quot; aria-label=&quot;現價隱含年報酬對公債&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;168.0&quot; x2=&quot;168.0&quot; y1=&quot;6&quot; y2=&quot;176&quot; class=&quot;zero&quot;/&gt;&lt;line x1=&quot;276.3&quot; x2=&quot;276.3&quot; y1=&quot;4&quot; y2=&quot;178&quot; class=&quot;price&quot;/&gt;&lt;text x=&quot;158&quot; y=&quot;23&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;保守情境成真&lt;/text&gt;&lt;rect x=&quot;168.0&quot; y=&quot;9&quot; width=&quot;127.4&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c4)&quot;/&gt;&lt;text x=&quot;303.4&quot; y=&quot;23&quot; class=&quot;val&quot;&gt;6.02%&lt;/text&gt;&lt;text x=&quot;158&quot; y=&quot;63&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;基準情境成真&lt;/text&gt;&lt;rect x=&quot;168.0&quot; y=&quot;49&quot ;&gt;&lt;title&gt;營運現金流 FY25：1,647&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;371.2&quot; y=&quot;206.9&quot; width=&quot;26.5&quot; height=&quot;59.1&quot; rx=&quot;2&quot; fill=&quot;var(--c2)&quot;&gt;&lt;title&gt;自由現金流 FY25：733&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;357.0&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY25&lt;/text&gt;&lt;rect x=&quot;436.3&quot; y=&quot;75.9&quot; width=&quot;26.5&quot; height=&quot;190.1&quot; rx=&quot;2&quot; fill=&quot;var(--c4)&quot;&gt;&lt;title&gt;淨利 近四季：2,357&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;464.8&quot; y=&quot;121.2&quot; width=&quot;26.5&quot; height=&quot;144.8&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;營運現金流 近四季：1,796&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;493.2&quot; y=&quot;250.1&quot; width=&quot;26.5&quot; height=&quot;15.9&quot; rx=&quot;2&quot; fill=&quot;var(--c2)&quot;&gt;&lt;title&gt;自由現金流 近四季：197&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;479.0&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;近四季&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c4)&quot;&gt;&lt;/i&gt;淨利&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c1)&quot;&gt;&lt;/i&gt;營運現金流&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c2)&quot;&gt;&lt;/i&gt;自由現金流&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;錢從哪一層開始不夠：現金流分層&lt;/h3&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;現金流分層（近四季，至 2026-09-30）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;層次&lt;/th&gt;&lt;th&gt;金額&lt;/th&gt;&lt;th&gt;正負&lt;/th&gt;&lt;th&gt;完整度&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;一、營運現金流&lt;/td&gt;&lt;td&gt;1,796 億美元&lt;/td&gt;&lt;td&gt;正&lt;/td&gt;&lt;td&gt;完整&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;二、一般資本支出後&lt;/td&gt;&lt;td&gt;197 億美元&lt;/td&gt;&lt;td&gt;正&lt;/td&gt;&lt;td&gt;完整&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;三、回購與股利後&lt;/td&gt;&lt;td&gt;31.4 億美元&lt;/td&gt;&lt;td&gt;正&lt;/td&gt;&lt;td&gt;完整&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;延伸：再扣併購與員工代扣稅&lt;/td&gt;&lt;td&gt;已知部分 31.4 億美元&lt;/td&gt;&lt;td&gt;無法判定&lt;/td&gt;&lt;td&gt;缺併購、員工股票代扣稅&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;數值正負不等於安全或危險：第二層為負代表所列投入超過當期營運現金，不等於營業虧損；資本支出尚未區分維持與擴張。&lt;/p&gt;&lt;p class=&quot;cap&quot;&gt;（算法與完整表見&lt;a href=&quot;#wp-3-4&quot;&gt;計算底稿 3・4&lt;/a&gt;）&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;白話說&lt;/b&gt;每 100 美元稅後營業利益，近四季收到約 140 美元營運現金，約 124 美元又花在資本支出，剩約 15 美元自由現金流。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;要留意&lt;/b&gt;連兩季營運現金流高於資本支出，現金品質才上修，見改判訊號。&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;shareholders&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;股東實際拿到什麼？&lt;/p&gt;&lt;h3&gt;回饋大幅縮減：2026 年停止回購，改為發股與發債&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;回饋大幅縮減：近四季&lt;a class=&quot;term&quot; href=&quot;#g16&quot;&gt;股東收益率&lt;/a&gt; 0.5%（股利 0.3%、回購 0.2%），扣股權薪酬後淨回購殖利率 -0.7%（回購扣股權薪酬；收盤 2026-11-16）；2026 前九月回購為 0，近四季回購 59 億全在 2025 年第四季。&lt;/strong&gt;每股自由現金流由 2025 年約 5.99 美元降到約 1.61 美元，扣股權薪酬約 −0.87 美元&lt;span class=&quot;src&quot;&gt;（推算）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;股數 2026 年轉為增加：流通股由 2025 年底 12,088 百萬股增到 9 月底 12,294 百萬股（+1.7%）；稀釋股數 2025 財年對上一財年 -1.7%（近一財年；股數期間 2022–2025）。&lt;/strong&gt;另有 2029 年轉普通股的&lt;a class=&quot;term&quot; href=&quot;#g18&quot;&gt;強制轉換特別股&lt;/a&gt;（清算優先 192.5 億）；財務長說除支應股權薪酬稅負的 ATM（依市價分批增資）外暫不再發股，是公司說法，不是承諾。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;每股自由現金流（美元）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 300&quot; role=&quot;img&quot; aria-label=&quot;每股自由現金流&quot; class=&quot;chart&quot;&gt;&lt;line x1= &quot;164.2&quot; y=&quot;85.4&quot; width=&quot;32.2&quot; height=&quot;132.2&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;每股自由現金流 FY23：5.5&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;198.4&quot; y=&quot;128.1&quot; width=&quot;32.2&quot; height=&quot;89.5&quot; rx=&quot;2&quot; fill=&quot;var(--c4)&quot;&gt;&lt;title&gt;扣除股權薪酬後 FY23：3.7&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;198.4&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY23&lt;/text&gt;&lt;rect x=&quot;261.8&quot; y=&quot;76.2&quot; width=&quot;32.2&quot; height=&quot;141.4&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;每股自由現金流 FY24：5.8&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;296.0&quot; y=&quot;120.5&quot; width=&quot;32.2&quot; height=&quot;97.1&quot; rx=&quot;2&quot; fill=&quot;var(--c4)&quot;&gt;&lt;title&gt;扣除股權薪酬後 FY24：4.0&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;296.0&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY24&lt;/text&gt;&lt;rect x=&quot;359.4&quot; y=&quot;72.6&quot; width=&quot;32.2&quot; height=&quot;145.0&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;每股自由現金流 FY25：6.0&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;393.6&quot; y=&quot;122.0&quot; width=&quot;32.2&quot; height=&quot;95.6&quot; rx=&quot;2&quot; fill=&quot;var(--c4)&quot;&gt;&lt;title&gt;扣除股權薪酬後 FY25：4.0&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;393.6&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY25&lt;/text&gt;&lt;rect x=&quot;457.0&quot; y=&quot;178.7&quot; width=&quot;32.2&quot; height=&quot;38.9&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;每股自由現金流 近四季：1.6&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;491.2&quot; y=&quot;217.6&quot; width=&quot;32.2&quot; height=&quot;21.0&quot; rx=&quot;2&quot; fill=&quot;var(--c4)&quot;&gt;&lt;title&gt;扣除股權薪酬後 近四季：-0.9&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;491.2&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;近四季&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c1)&quot;&gt;&lt;/i&gt;每股自由現金流&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c4)&quot;&gt;&lt;/i&gt;扣除股權薪酬後&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;白話說&lt;/b&gt;你有 100 股，公司 2026 年發新股讓流通股到 9 月底多了約 1.7%，你的持股比例也被稀釋同幅度。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;要留意&lt;/b&gt;新發普通股或可轉換證券使流通股再增加超過 1%，下修每股價值判斷；恢復淨回購連兩季則上修，見改判訊號。&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;股東回報與市價隱含報酬拆解&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;和公債比：股東收益率 0.5%，約為 2026-11-16 的 10 年期公債 5.12% 的一成，屬主要靠成長。&lt;/strong&gt;基準情境成真時的現價隱含年報酬約 8.6%&lt;span class=&quot;src&quot;&gt;（基準情境成真時、以收盤 2026-11-16 股價買進的推算年報酬；條件式，非預期報酬、非買賣建議）&lt;/span&gt;＝股利 0.3%＋回購 0.2%＋每股成長與其他 8.2%&lt;span class=&quot;src&quot;&gt;（推算，假設倍數不變）&lt;/span&gt;，幾乎全押在 AI 投資能把每股價值做大。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;回報品質：近十年每年都有回購，但近四季回購 59 億少於股權薪酬 304 億，淨回購為負（警示）；股利 2025 年每股 0.83 美元。&lt;/strong&gt;回購不到市值 0.2%，依政策不判斷回購均價。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;現價隱含年報酬（基準情境，非預期報酬）從哪裡來：股利、回購是現在拿到的現金，其餘要靠每股成長（紅色虛線為 10 年期美國公債 5.12%）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 500 196&quot; role=&quot;img&quot; aria-label=&quot;市價隱含報酬拆解&quot; class=&quot;chart&quot; style=&quot;max-width:650px&quot;&gt;&lt;line x1=&quot;250.0&quot; x2=&quot;250.0&quot; y1=&quot;24&quot; y2=&quot;192&quot; class=&quot;zero&quot;/&gt;&lt;line x1=&quot;356.0&quot; x2=&quot;356.0&quot; y1=&quot;22&quot; y2=&quot;192&quot; class=&quot;price&quot;/&gt;&lt;text x=&quot;356.0&quot; y=&quot;16&quot; class=&quot;pricelab&quot; text-anchor=&quot;middle&quot;&gt;公債 5.12%&lt;/text&gt;&lt;text x=&quot;240&quot; y=&quot;55.0&quot; c &lt;span class=&quot;src&quot;&gt;（基準情境成真時、以收盤 2026-11-16 股價買進的推算年報酬；條件式，非預期報酬、非買賣建議）&lt;/span&gt;，略低於資金成本 9.8%。買入上限為 170.45 美元，現價高於它。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;基準情境的故事是雲端撐住成長、投資高峰兩年後回收：營收年增由 25% 逐年降到 8%，營業利益率維持約 31%–32%；高峰期每 1 元新增投入資本只換到約 0.5 元新增營收，第 5 年回到過去長期約 1 元。&lt;/strong&gt;寬護城河讓超額報酬再延續 15 年，約 40% 的價值來自明確預測期之後。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;反方與限制：成長照基準時，市價要求第 1 年起每年營業利益率約 37.6%&lt;span class=&quot;src&quot;&gt;（市價反推第 1 年起每年固定的營業利益率，含穩態；市價 283.72 美元、收盤 2026-11-16；折現率 9.78%；推導）&lt;/span&gt;，高於近四季 33.3%；另一算法下是 10 年營收名目年增約 17.4%&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;，大型公司做到的很少。&lt;/strong&gt;若改用公版預設產業基準 Information Services（資訊服務業），合理價值中點約 +17.1%&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;，價格位置不變；改用 Advertising（廣告業，Damodaran 產業分類）約 +3.1%。其他三項作者判斷各影響中點 3.2% 以內（見計算底稿）。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;現價隱含年報酬（各情境成真時，非預期報酬）；紅色虛線為公債殖利率 5.12%。基準情境下，現價隱含的年報酬只比公債高 3.5 個百分點，模型的加權資本成本（基準）比公債高 4.7 個百分點，兩者的差距對應市價與合理價值的落差&lt;/p&gt;&lt;svg viewBox=&quot;0 0 500 182&quot; role=&quot;img&quot; aria-label=&quot;現價隱含年報酬對公債&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;168.0&quot; x2=&quot;168.0&quot; y1=&quot;6&quot; y2=&quot;176&quot; class=&quot;zero&quot;/&gt;&lt;line x1=&quot;276.3&quot; x2=&quot;276.3&quot; y1=&quot;4&quot; y2=&quot;178&quot; class=&quot;price&quot;/&gt;&lt;text x=&quot;158&quot; y=&quot;23&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;保守情境成真&lt;/text&gt;&lt;rect x=&quot;168.0&quot; y=&quot;9&quot; width=&quot;127.4&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c4)&quot;/&gt;&lt;text x=&quot;303.4&quot; y=&quot;23&quot; class=&quot;val&quot;&gt;6.02%&lt;/text&gt;&lt;text x=&quot;158&quot; y=&quot;63&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;基準情境成真&lt;/text&gt;&lt;rect x=&quot;168.0&quot; y=&quot;49&quot; width=&quot;182.9&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var quot;&gt;20%&lt;/text&gt;&lt;line x1=&quot;490.0&quot; x2=&quot;490.0&quot; y1=&quot;8&quot; y2=&quot;168&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;490.0&quot; y=&quot;184&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;30%&lt;/text&gt;&lt;text x=&quot;220&quot; y=&quot;27&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;過去實績（2015–2025 年複合）&lt;/text&gt;&lt;circle cx=&quot;388.7&quot; cy=&quot;22&quot; r=&quot;7&quot; fill=&quot;var(--c3)&quot;&gt;&lt;title&gt;過去實績（2015–2025 年複合）：18%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;400.7&quot; y=&quot;27&quot; class=&quot;val&quot;&gt;18%&lt;/text&gt;&lt;text x=&quot;220&quot; y=&quot;67&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;過去實績（近四季年增）&lt;/text&gt;&lt;circle cx=&quot;422.5&quot; cy=&quot;62&quot; r=&quot;7&quot; fill=&quot;var(--c3)&quot;&gt;&lt;title&gt;過去實績（近四季年增）：22%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;434.5&quot; y=&quot;67&quot; class=&quot;val&quot;&gt;22%&lt;/text&gt;&lt;text x=&quot;220&quot; y=&quot;107&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;模型基準（未來 5 年平均）&lt;/text&gt;&lt;circle cx=&quot;363.5&quot; cy=&quot;102&quot; r=&quot;7&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;模型基準（未來 5 年平均）：15%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;375.5&quot; y=&quot;107&quot; class=&quot;val&quot;&gt;15%&lt;/text&gt;&lt;text x=&quot;220&quot; y=&quot;147&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;市價要求（未來 5 年年增）&lt;/text&gt;&lt;line x1=&quot;330.3&quot; x2=&quot;379.5&quot; y1=&quot;142&quot; y2=&quot;142&quot; stroke=&quot;var(--neg)&quot; stroke-width=&quot;3&quot; opacity=&quot;.55&quot;/&gt;&lt;circle cx=&quot;355.3&quot; cy=&quot;142&quot; r=&quot;7&quot; fill=&quot;var(--neg)&quot;&gt;&lt;title&gt;市價要求（未來 5 年年增）：14%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;391.5&quot; y=&quot;147&quot; class=&quot;val&quot;&gt;14%&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;figure class=figure&gt;&lt;p class=cap&gt;倍數端：市價要成立，第 20 年出場 EV/EBIT 要多少倍（紅點基準折現率、線段高低折現率），對照模型假設與分產業參考帶 p25–p75（灰帶，直線為中位；估值結果；只描述，不是目標價、不進評等）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 150&quot; role=&quot;img&quot; aria-label=&quot;市價隱含第 20 年倍數&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;172.0&quot; x2=&quot;172.0&quot; y1=&quot;8&quot; y2=&quot;128&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;172.0&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;0 倍&lt;/text&gt;&lt;line x1=&quot;251.5&quot; x2=&quot;251.5&quot; y1=&quot;8&quot; y2=&quot;128&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;251.5&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;10 倍&lt;/text&gt;&lt;line x1=&quot;331.0&quot; x2=&quot;331.0&quot; y1=&quot;8&quot; y2=&quot;128&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;331.0&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;20 倍&lt;/text&gt;&lt;line x1=&quot;410.5&quot; x2=&quot;410.5&quot; y1=&quot;8&quot; y2=&quot;128&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;410.5&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;30 倍&lt;/text&gt;&lt;line x1=&quot;490.0&quot; x2=&quot;490.0&quot; y1=&quot;8&quot; y2=&quot;128&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;490.0&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;40 倍&lt;/text&gt;&lt;rect x=&quot;219.7&quot; y=&quot;11&quot; width=&quot;175.7&quot; height=&quot;22&quot; rx=&quot;4&quot; fill=&quot;var(--line)&quot;&gt;&lt;title&gt;軟體與網路 參考帶 p25–p75（機械回測樣本，非市場全體；分產業的筆數與公司數少，僅供參考）&lt;/title&gt;&lt;/rect&gt;&lt;line x1=&quot;295.2&quot; x2=&quot;295.2&quot; y1=&quot;11&quot; y2=&quot;33&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;162&quot; y=&quot;27&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;參考帶（軟體與網路）&lt;/text&gt;&lt;text x=&quot;403.4&quot; y=&quot;27&quot; class=&quot;val&quot;&gt;6 倍–28 倍&lt;/text&gt;&lt;text x=&quot;162&quot; y=&quot;67&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;模型假設（第 20 年）&lt;/text&gt;&lt;circle cx=&quot;255.3&quot; cy=&quot;62&quot; r=&quot;7&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;模型假設（第 20 年）：10 倍&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;267.3&quot; y=&quot;67&quot; class=&quot;val&quot;&gt;10 倍&lt;/text&gt;&lt;text x=&quot;162&quot; y=&quot;107&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;市價隱含（第 20 年）&lt;/text&gt;&lt;line x1=&quot;276.5&quot; x2=&quot;355.2&quot; y1=&quot;102&quot; y2=&quot;102&quot; stroke=&quot;var(--neg)&quot; stroke-width=&quot;3&quot; opacity=&quot;.55&quot;/&gt;&lt;circle cx=&quot;312.0&quot; cy=&quot;102&quot; r=&quot;7&quot; fill=&quot;var(--neg)&quot;&gt;&lt;title&gt;市價隱含（第 20 年）：18 倍&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;367.2&quot; y=&quot;107&quot; class=&quot;val&quot;&gt;18 倍&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;p&gt;&lt;b&gt;成長端：&lt;/b&gt;市價要求未來 5 年營收年增約 14.5%（折現率高低 11.6%～17.3%），低於模型基準 5 年平均 15.4%、低於過去（2015–2025）實績 18.3%。&lt;/p&gt;&lt;p&gt;&lt;b&gt;倍數端：&lt;/b&gt;市價隱含第 20 年 EV/EBIT 約 17.6 倍，高於模型 10.5 倍，在軟體與網路參考帶 p25–p75（6.0–28.1 倍）內。&lt;/p&gt;&lt;p&gt;成功幾率（歷史基準比率）：模型基準 10 年實質年增 9.0%，同規模（營收 500 億美元以上）公司歷史上做到的比例 21%（歷史基準比率，非預測）。&lt;/p&gt;&lt;p class=&quot;cap&quot;&gt;兩端是同一條「模型價值＝市價」換不同未知數反解，方向必然一致，不是兩個獨立證據；幅度才有資訊。只描述，不進研究評等、不改價格位置與合理價值，不是目標價，非買賣建議。成長性四問細表、三視角反推、長期倍數條件（算法與完整表見&lt;a href=&quot;#wp-5&quot;&gt;計算底稿 5&lt;/a&gt;）。&lt;/p&gt;&lt;div class=&quot;note-box&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;要撐住現價，營收每年需要成長多少 vs 實際成長（黑色橫線為不同折現率下的隱含營收年增範圍 12%–17%）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 500 262&quot; role=&quot;img&quot; aria-label=&quot;市價隱含成長&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;193.0&quot; x2=&quot;193.0&quot; y1=&quot;6&quot; y2=&quot;256&quot; class=&quot;zero&quot;/&gt;&lt;text x=&quot;183&quot; y=&quot;23&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;FY23 實際成長&lt;/text&gt;&lt;rect x=&quot;193.0&quot; y=&quot;9&quot; width=&quot;83.2&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;284.2&quot; y=&quot;23&quot; class=&quot;val&quot;&gt;8.7%&lt;/text&gt;&lt;text x=&quot;183&quot; y=&quot;63&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;FY24 實際成長&lt;/text&gt;&lt;rect x=&quot;193.0&quot; y=&quot;49&quot; width=&quot;132.9&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;333.9&quot; y=&quot;63&quot; class=&quot;val&quot;&gt;13.9%&lt;/text&gt;&lt;text x=&quot;183&quot; y=&quot;103&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;FY25 實際成長&lt;/text&gt;&lt;rect x=&quot;193.0&quot; y=&quot;89&quot; width=&quot;144.6&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;345.6&quot; y=&quot;103&quot; class=&quot;val&quot;&gt;15.1%&lt;/text&gt;&lt;text x=&quot;183&quot; y=&quot;143&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;FY22–FY25 年均&lt;/text&gt;&lt;rect x=&quot;193.0&quot; y=&quot;129&quot; width=&quot;119.9&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;320.9&quot; y=&quot;143&quot; class=&quot;val&quot;&gt;12.5%&lt;/text&gt;&lt;text x=&quot;183&quot; y=&quot;183&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;最近三季比去年同期&lt;/text&gt;&lt;rect x=&quot;193.0&quot; y=&quot;169&quot; width=&quot;226.4&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;427.4&quot; y=&quot;183&quot; class=&quot;val&quot;&gt;23.6%&lt;/text&gt;&lt;text x=&quot;183&quot; y=&quot;223&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot; font-weight=&amp;quot;700&amp;quot;&gt;市價隱含：未來 5 年每年&lt;/text&gt;&lt;rect x=&quot;193.0&quot; y=&quot;209&quot; width=&quot;138.6&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--neg)&quot;/&gt;&lt;line x1=&quot;303.9&quot; x2=&quot;358.3&quot; y1=&quot;218&quot; y2=&quot;218&quot; stroke=&quot;var(--ink)&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;line x1=&quot;303.9&quot; x2=&quot;303.9&quot; y1=&quot;212&quot; y2=&quot;224&quot; stroke=&quot;var(--ink)&quot;/&gt;&lt;line x1=&quot;358.3&quot; x2=&quot;358.3&quot; y1=&quot;212&quot; y2=&quot;224&quot; stroke=&quot;var(--ink)&quot;/&gt;&lt;text x=&quot;366.3&quot; y=&quot;223&quot; class=&quot;val&quot;&gt;14.5%&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:14px&quot;&gt;備註：市價要求的成長 vs Alphabet 實際營收成長&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;期間&lt;/th&gt;&lt;th&gt;營收成長&lt;/th&gt;&lt;th&gt;說明&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2023 年&lt;/td&gt;&lt;td&gt;+8.7%&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2024 年&lt;/td&gt;&lt;td&gt;+13.9%&lt;/td&gt;&lt;td&gt;雲端 +30.6%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2025 年&lt;/td&gt;&lt;td&gt;+15.1%&lt;/td&gt;&lt;td&gt;雲端 +35.8%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2022–2025 年年均&lt;/td&gt;&lt;td&gt;+12.5%&lt;/td&gt;&lt;td&gt;三年複合成長&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;近四季對前四季&lt;/td&gt;&lt;td&gt;+22.2%&lt;/td&gt;&lt;td&gt;一年前為 +13.4%，加速&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2026 年第三季對去年同期&lt;/td&gt;&lt;td&gt;+24.7%&lt;/td&gt;&lt;td&gt;雲端 +102.6%、Google 服務 +10.6%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;本報告基準：未來 5 年&lt;/td&gt;&lt;td&gt;+25% 逐年降到 +8%&lt;/td&gt;&lt;td&gt;前五年幾何平均約 15.2%（推算）；第 5 年已降到 8%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;市價要求：未來 5 年每年&lt;/td&gt;&lt;td&gt;約 14.5%（11.6%～17.3%）&lt;/td&gt;&lt;td&gt;依折現率高低（推導）；或第 1 年起每年（含永續期）營業利益率約 37.6%（擇一）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;市價隱含（另一算法）：未來 10 年每年&lt;/td&gt;&lt;td&gt;名目約 17.4%&lt;/td&gt;&lt;td&gt;實質約 15%；營收 500 億美元以上公司 10 年實質 10% 以上約 3.9%（推導）&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p&gt;要撐住現價，市場等於要求未來 5 年營收每年成長約 14.5%（換折現率高低兩端約 11.6% 到 17.3%）。這個要求在同規模公司的歷史上屬「歷史罕見」。現價未高於合理價值上緣，下表只描述市場面，不代表有溢價。&lt;/p&gt;&lt;p class=&quot;cap&quot;&gt;三視角反推、假設對照實績、歷史基準比率與市價溢價來源（算法與完整表見&lt;a href=&quot;#wp-5&quot;&gt;計算底稿 5&lt;/a&gt;）。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;白話說&lt;/b&gt;今天付 283.72 美元，等於預付每年營業利益率約 37.6%（市價反推第 1 年起每年固定的營業利益率，含穩態；市價 283.72 美元、收盤 2026-11-16；折現率 9.78%；推導）（成長照基準）；近四季是 33.3%。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;要留意&lt;/b&gt;這是條件估值：約 40% 價值來自預測期之後，長期假設一動合理價值就動，見改判訊號。&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;value&quot;&gt;&lt;div class=&quot;qno&quot;&gt;價值判斷&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;價值判斷：用彼得林奇的方法再看一次&lt;/div&gt;&lt;h2&gt;穩定成長股、生意品質良好；PEG（本益比對成長比）看似便宜是口徑混用&lt;/h2&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;林區分類&lt;/b&gt;穩定成長股（Stalwart）；兼具快速成長特徵（Google Cloud 近四季營收約 932 億、第三季年增 +103%）；資產股特徵（SpaceX 有價股權 752 億與非上市股權 1,352 億）&lt;br&gt;穩定成長股看本益比相對自身常態，股價大漲、本益比遠高於自身常態時檢視；資產股的投資利益要和本業分開，本益比改用核心盈餘（營業利益稅後 ÷ 稀釋股數）。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;研究評等&lt;/b&gt;&lt;span style=&quot;font-size:20px;font-weight:700&quot;&gt;生意品質良好 ／ 價格合理（在市場常態內）&lt;/span&gt;&lt;br&gt;生意品質依五項證據評定；價格位置四級（便宜、偏低、合理、偏貴），依買入上限與合理價值高端判斷，同業與歷史倍數只作交叉核對。非買賣建議。&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;林區分類：穩定成長股，兼具快速成長（雲端第三季 +103%）與資產股（SpaceX 等權益證券）特徵；2022–2025 年營收年複合約 12.5%&lt;span class=&quot;src&quot;&gt;（推算）&lt;/span&gt;。&lt;/strong&gt;核心&lt;a class=&quot;term&quot; href=&quot;#g14&quot;&gt;本益比&lt;/a&gt; 27.2 倍（一般會計 EPS，未扣非經常 10.42 美元；收盤 2026-11-16），高於申報與核心 EPS 相近期間歷史第 75 百分位 26.7 倍；加速延續兩年以上且雲端占比過三成，應改判快速成長股。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;PEG 三口徑：(1) 過去三年申報 EPS 年增 33.3%、PEG 0.82&lt;span class=&quot;src&quot;&gt;（成長口徑 過去三年 EPS 年增 33.3%；收盤 2026-11-16）&lt;/span&gt; 看似便宜，但這是申報 EPS 配核心本益比，口徑混用；改用核心 EPS 年增約 22.4%&lt;span class=&quot;src&quot;&gt;（推算）&lt;/span&gt;，PEG 約 1.2。&lt;/strong&gt;(2) 近四季對上一財年申報 EPS +18.7%，PEG 1.46&lt;span class=&quot;src&quot;&gt;（成長口徑 近四季對上一財年、申報 EPS 18.7%；收盤 2026-11-16）&lt;/span&gt;，同樣含權益證券利益。(3) 基準情境推估約 13.0%&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;，PEG 2.09&lt;span class=&quot;src&quot;&gt;（成長口徑 基準情境推估、稅後營業利益年增－股數年變化 13.0%；收盤 2026-11-16）&lt;/span&gt;，最能代表未來。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;資產負債表：每股淨現金約 11.28 美元（約股價 4.0%）、負債對權益 0.18，但每股自由現金流近四季只有 1.61 美元。&lt;/strong&gt;存貨 +446% 是林區警訊，原因已查明（待售 TPU 系統與 Pixel 等裝置）。內部人近 6 個月公開市場買進 0，賣出全屬 10b5-1；Brin 8 月是 B 股轉 A 股後贈與，不是賣出。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;grid2 wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;現金與證券 vs 有息負債（億美元），上方為淨現金&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 300&quot; role=&quot;img&quot; aria-label=&quot;資產負債&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;266.0&quot; y2=&quot;266.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;270.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;0.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;185.3&quot; y2=&quot;185.3&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;189.3&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;1,000&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;104.7&quot; y2=&quot;104.7&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;108.7&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;2,000&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;24.0&quot; y2=&quot;24.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;28.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;3,000&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;266.0&quot; y2=&quot;266.0&quot; class=&quot;zero&quot;/&gt;&lt;rect x=&quot;70.3&quot; y=&quot;176.5&quot; width=&quot;40.7&quot; height=&quot;89.5&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;現金與證券 FY23：1,109&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;113.0&quot; y=&quot;256.4&quot; width=&quot;40.7&quot; height=&quot;9.6&quot; rx=&quot;2&quot; fill=&quot;var(--c5)&quot;&gt;&lt;title&gt;有息負債 FY23：119&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;113.0&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY23&lt;/text&gt;&lt;text x=&quot;113.0&quot; y=&quot;16.0&quot; class=&quot;note&quot; text-anchor=&quot;middle&quot;&gt;淨 990&lt;/text&gt;&lt;rect x=&quot;192.3&quot; y=&quot;188.8&quot; width=&quot;40.7&quot; height=&quot;77.2&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;現金與證券 FY24：957&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;235.0&quot; y=&quot;257.2&quot; width=&quot;40.7&quot; height=&quot;8.8&quot; rx=&quot;2&quot; fill=&quot;var(--c5)&quot;&gt;&lt;title&gt;有息負債 FY24：109&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;235.0&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY24&lt;/text&gt;&lt;text x=&quot;235.0&quot; y=&quot;16.0&quot; class=&quot;note&quot; text-anchor=&quot;middle&quot;&gt;淨 848&lt;/text&gt;&lt;rect x=&quot;314.3&quot; y=&quot;163.7&quot; width=&quot;40.7&quot; height=&quot;102.3&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;現金與證券 FY25：1,268&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;357.0&quot; y=&quot;228.5&quot; width=&quot;40.7&quot; height=&quot;37.5&quot; rx=&quot;2&quot; fill=&quot;var(--c5)&quot;&gt;&lt;title&gt;有息負債 FY25：465&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;357.0&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY25&lt;/text&gt;&lt;text x=&quot;357.0&quot; y=&quot;16.0&quot; class=&quot;note&quot; text-anchor=&quot;middle&quot;&gt;淨 803&lt;/text&gt;&lt;rect x=&quot;436.3&quot; y=&quot;52.2&quot; width=&quot;40.7&quot; height=&quot;213.8&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;現金與證券 2026-09：2,651&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;479.0&quot; y=&quot;165.1&quot; width=&quot;40.7&quot; height=&quot;100.9&quot; rx=&quot;2&quot; fill=&quot;var(--c5)&quot;&gt;&lt;title&gt;有息負債 2026-09：1,251&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;479.0&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;2026-09&lt;/text&gt;&lt;text x=&quot;479.0&quot; y=&quot;16.0&quot; class=&quot;note&quot; text-anchor=&quot;middle&quot;&gt;淨 1,400&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c1)&quot;&gt;&lt;/i&gt;現金與證券&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c5)&quot;&gt;&lt;/i&gt;有息負債&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;2026-05-18 起申報（最早交易 2026-05-15）內部人公開市場買賣（百萬美元）；無任何買進&lt;/p&gt;&lt;svg viewBox=&quot;0 0 500 182&quot; role=&quot;img&quot; aria-label=&quot;內部人&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;206.0&quot; x2=&quot;206.0&quot; y1=&quot;6&quot; y2=&quot;176&quot; class=&quot;zero&quot;/&gt;&lt;text x=&quot;196&quot; y=&quot;23&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;Walker（預設計畫賣出）&lt;/text&gt;&lt;rect x=&quot;206.0&quot; y=&quot;9&quot; width=&quot;214.5&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;428.5&quot; y=&quot;23&quot; class=&quot;val&quot;&gt;3.1&lt;/text&gt;&lt;text x=&quot;196&quot; y=&quot;63&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;Hennessy（預設計畫賣出）&lt;/text&gt;&lt;rect x=&quot;206.0&quot; y=&quot;49&quot; width=&quot;60.8&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;274.8&quot; y=&quot;63&quot; class=&quot;val&quot;&gt;0.9&lt;/text&gt;&lt;text x=&quot;196&quot; y=&quot;103&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;Saraci（預設計畫賣出）&lt;/text&gt;&lt;rect x=&quot;206.0&quot; y=&quot;89&quot; width=&quot;20.7&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;234.7&quot; y=&quot;103&quot; class=&quot;val&quot;&gt;0.3&lt;/text&gt;&lt;text x=&quot;196&quot; y=&quot;143&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;Arnold（預設計畫賣出）&lt;/text&gt;&lt;rect x=&quot;206.0&quot; y=&quot;129&quot; width=&quot;12.6&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;226.6&quot; y=&quot;143&quot; class=&quot;val&quot;&gt;0.2&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;生意品質：B（規則：無「弱」且至少三項「強」＝A）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;評等&lt;/th&gt;&lt;th&gt;理由&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;護城河&lt;/td&gt;&lt;td&gt;寬&lt;/td&gt;&lt;td&gt;搜尋：2026 年 9 月全球搜尋市占 89.9%（Statcounter，經 citybiz 新聞 N13）、約 90%（CNBC 新聞 N12）兩個外部來源，第三季查詢年增率為五年最高（8-K 2026-10-28）；Yelp、Angi、CarGurus 2026 年 10-K 仍依賴 Google 導流（全文搜尋 Q1）。雲端：未完成訂單 5,608 億（10-Q Item 1 ¶119）、TPU 對外銷售（Oracle 代售、Broadcom 長約供應至多到 2031 年）；第三季 Services 營業利益率 40.7%、Cloud 36.2%（Item 2 ¶152）。反方：管理層說 AI Mode（搜尋的 AI 對話模式）查詢的變現較低對成長有影響（新聞 N10）；第三季 Search &amp;amp; other 年增由 17% 降到 12%，廣告科技案法院駁回分拆、改命行為補救（最終判決未出，10-Q ¶332；PPC Land 解讀為六年期，新聞 N15），搜尋案雙方上訴中（10-Q ¶331）。主張 GOOGL-C01（部分支持）、GOOGL-C14；失效條件：Search &amp;amp; other 年增連兩季低於 8% 或全球市占跌破 85%。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;投入資本報酬與增量回報&lt;/td&gt;&lt;td&gt;強&lt;/td&gt;&lt;td&gt;近四季 ROIC 37.2%（營運投入資本口徑）、近五年中位 44.0%、2023–2025 增量 ROIC 28.4%（財務指標），研發 7 年資本化後 30.7%、5 年 32.3%，兩種年限都遠高於 WACC 9.8%，結論不翻轉（研發資本化對照）。反方：近四季增量 ROIC 約 16.6%（推算），營運投入資本一年增加 1,627 億；2026 年資本支出指引第二季已上修為 1,950～2,050 億、2027 年再顯著增加（新聞 N24、N3），新投入報酬尚待驗證。主張 GOOGL-C02（部分支持）。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;自由現金流品質&lt;/td&gt;&lt;td&gt;弱&lt;/td&gt;&lt;td&gt;近四季自由現金流 19,747（營運現金流 179,551 − 資本支出 159,804），只有稅後營業利益 128,628 的 15%；扣股權薪酬 30,409 後為 −10,662。第二、三季單季自由現金流為負（第三季約 −91 億，CNBC 新聞 N3），2026 前九月營運現金流 127,149 低於資本支出 131,953，缺口與併購由發債收入（已扣發行費用）85,222（扣還款 8,879 後淨借入約 76,343）、普通股 42,870、特別股 19,063 補足（融資償債判讀）；資本支出指引第二季上修為 1,950～2,050 億、第三季維持，2027 年再顯著增加（新聞 N24、N3），基準情境第 1 年 FCFF 約 −908 億（估值模型基準情境第 1 年）。正面：營運現金流是稅後營業利益的 1.4 倍，壓縮來自擴張投資且有未完成訂單 5,677 億支撐，不是本業惡化。證據段未找到投資已在現金流兌現的證據，維持弱。主張 GOOGL-C03（支持）、GOOGL-C10、GOOGL-C11。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;資產負債表&lt;/td&gt;&lt;td&gt;強&lt;/td&gt;&lt;td&gt;現金與有價證券 265,098（其中有價權益證券含 SpaceX 752 億，短期限售），有息負債 126,118＋融資租賃 3,705；有息負債÷EBITDA（稅息折舊攤銷前利潤）0.68、淨負債÷EBITDA −0.76、營運現金流÷有息負債 1.44；循環信用 100 億未動用、商業本票餘額 0；2026 年新發債最早 2028 年到期（融資償債判讀）。反方：債務 9 個月內由 46,547 增至 126,118；表外有採購承諾 9,244 億、能源設備保證最高 162 億、TPU 回購保證最高 66 億（10-Q ¶242、¶315、¶316）；外部融資的影響已在自由現金流品質一項計入，這裡不重複扣分。主張 GOOGL-C08、GOOGL-C09（支持）。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;治理與資本配置&lt;/td&gt;&lt;td&gt;中&lt;/td&gt;&lt;td&gt;創辦人 Larry Page、Sergey Brin 合計投票權約 52.7%（委託書，推算）；2026 年停止回購（前九月 0，去年同期 39,810），改為公開發行、波克夏私募、ATM 與強制轉換特別股，流通股由 12,088 增至 12,294（+1.7%）；淨回購為負屬股東回報警示（政策上限中）。財務長稱除支應股權薪酬稅負的 ATM 外暫不再發股（新聞 N24，公司說法）。正面：6 月公開發行 A 股每股 355.20（10-Q Item 1 ¶359）、波克夏私募 A 股 351.81（8-K 2026-06-04 本文 §17、§210），高於本次收盤 283.72（2026-11-16）；近 6 個月內部人公開市場賣出 40 筆皆屬 10b5-1、買進 0；Brin 2026-08-07 Form 4 的 C 代碼是 B 股轉 A 股後贈與，不是賣出。主張 GOOGL-C12、GOOGL-C13（支持）。&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;PEG 三口徑、林區資產負債表檢查與 F 分數等交叉檢查（算法與完整表見&lt;a href=&quot;#wp-value&quot;&gt;計算底稿 價值判斷&lt;/a&gt;）。&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;capital&quot;&gt;&lt;div class=&quot;qno&quot;&gt;問題 06&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;管理層怎麼用錢、怎麼管資產？&lt;/div&gt;&lt;h2&gt;資金政策大轉彎：停止回購，改以發債與增資支應 AI 基建&lt;/h2&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;2026 前九月營運現金流 1,271 億不夠支應資本支出 1,320 億，加上收購 341 億（含 3 月完成的 Wiz）與非有價證券投資 242 億，差額由發債收入 852 億（淨借入約 763 億）、普通股 429 億與強制轉換特別股 191 億補足，回購降為 0。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;借款用途判讀為「混合、以擴張為主」：公司對債務只寫一般公司用途，但最大需求是 AI 基礎設施。&lt;/strong&gt;創辦人合計約 52.7% 投票權&lt;span class=&quot;src&quot;&gt;（推算）&lt;/span&gt;，外部股東難以約束這類轉向。&lt;/p&gt;&lt;/div&gt;
