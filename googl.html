gt;&lt;td&gt;均值回歸（21.3）&lt;/td&gt;&lt;td&gt;基準穩態（31.0%）&lt;/td&gt;&lt;td&gt;26.8%&lt;/td&gt;&lt;td&gt;10.8 倍&lt;/td&gt;&lt;td&gt;歷史罕見&lt;/td&gt;&lt;td&gt;自足&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/details&gt;&lt;p class=&quot;cap&quot;&gt;限制：&lt;/p&gt;&lt;ul class=&quot;cap&quot;&gt;&lt;li&gt;Base Rate Book 1950–2015、只含存續公司（存活偏差）；原表 10 年欄，5 年期待建立&lt;/li&gt;&lt;li&gt;非營業淨資產假設不變；資金缺口另列，不回頭改期末市值&lt;/li&gt;&lt;li&gt;均值回歸以本益比近似 EV÷稅後營業利益；產業倍數是 Damodaran 目前值，不是成熟期值&lt;/li&gt;&lt;li&gt;罕見度是歷史上多少公司做到，不是這家公司做到的機率&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;!--目標區間:附錄--&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;目標區間的倍數核對（只列不合成）&lt;/h3&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt&quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;倍數區段&lt;/th&gt;&lt;th&gt;倍數（EV／營業利益）&lt;/th&gt;&lt;th&gt;第 1 年獲利（百萬美元）&lt;/th&gt;&lt;th&gt;核對區間（美元）&lt;/th&gt;&lt;th&gt;代表值需要倍數&lt;/th&gt;&lt;th&gt;主方法代表值對核對區間中點&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;同規模同成長 p25～中位&lt;/td&gt;&lt;td&gt;10.95–16.87&lt;/td&gt;&lt;td&gt;162,529&lt;/td&gt;&lt;td&gt;157.73–235.37&lt;/td&gt;&lt;td&gt;9.0&lt;/td&gt;&lt;td&gt;−33%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;現在倍數～自身近五年 p25&lt;/td&gt;&lt;td&gt;19.68–21.29&lt;/td&gt;&lt;td&gt;188,439&lt;/td&gt;&lt;td&gt;313.16–337.72&lt;/td&gt;&lt;td&gt;15.4&lt;/td&gt;&lt;td&gt;−24%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;自身近五年中位～p75&lt;/td&gt;&lt;td&gt;21.79–29.81&lt;/td&gt;&lt;td&gt;203,656&lt;/td&gt;&lt;td&gt;371.95–503.61&lt;/td&gt;&lt;td&gt;25.9&lt;/td&gt;&lt;td&gt;+0%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;各情境第 1 年營業利益（假設，推導；不是公司指引）。每股 =（倍數 × 獲利 − 股權橋 -177,411）÷ 12,406.0 百萬股，與估值模型同口徑。倍數維持現在倍數不變、只看獲利，每股 ＝（現在倍數 × 第 1 年獲利 − 股權橋）÷ 股數：保守 293.3、基準 337.7、樂觀 363.8（美元）。倍數核對回答「市場一年後照這種擔憂程度給倍數，價格會在哪」；與主方法的差距是價值與市場慣例的落差，不合成、不平均。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;目標區間的企業價值前推核對&lt;/h3&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt&quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;股權成本前推（每股，折現率基準）&lt;/th&gt;&lt;th&gt;企業價值前推（每股）&lt;/th&gt;&lt;th&gt;相對差距&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;132.32&lt;/td&gt;&lt;td&gt;130.67&lt;/td&gt;&lt;td&gt;1.25%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;247.92&lt;/td&gt;&lt;td&gt;246.04&lt;/td&gt;&lt;td&gt;0.76%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;439.61&lt;/td&gt;&lt;td&gt;437.37&lt;/td&gt;&lt;td&gt;0.51%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;EV₀×（1＋WACC）−股權橋 與 每股價值×（1＋股權成本）的差；差距≥1% 只標註（槓桿較高時前者未計利息），不改目標區間。最大相對差距 1.25%（達 1% 以上，僅標註）。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;各段代表值需要的倍數與歷史位置&lt;/h3&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt&quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;需要倍數（EV／營業利益）&lt;/th&gt;&lt;th&gt;相對現在 21.3 倍&lt;/th&gt;&lt;th&gt;自身近一年高於／低於此倍數的交易日比例&lt;/th&gt;&lt;th&gt;自身近五年（存檔四分位內插）&lt;/th&gt;&lt;th&gt;同規模同成長&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;9.0&lt;/td&gt;&lt;td&gt;低於&lt;/td&gt;&lt;td&gt;99% 以上／不到 1%&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;低於 p25&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;低於 p25&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;15.4&lt;/td&gt;&lt;td&gt;低於&lt;/td&gt;&lt;td&gt;99% 以上／不到 1%&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;低於 p25&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;約第 44 百分位（p25–p75 間線性內插，推導）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;25.9&lt;/td&gt;&lt;td&gt;高於&lt;/td&gt;&lt;td&gt;92%／8%&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;約第 63 百分位（p25–p75 間線性內插，推導）&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;約第 71 百分位（p25–p75 間線性內插，推導）&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;需要倍數＝（代表值×股數＋股權橋）÷ 情境第 1 年獲利（推導）；是把價值翻成倍數的讀法，不是預測市場會給這個倍數。自身近一年比例：近一年每日 EV／近四季獲利（申報日後才可用）重建，四分位與市場給價存檔一致；推導（2025-11-14 至 2026-11-16，252 個交易日）。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;約 12 個月選擇權隱含分布&lt;/h3&gt;&lt;p class=&quot;cap&quot;&gt;未取得：到期日 2027-12-17 價平附近沒有有效報價（盤前盤後或無成交時 Yahoo 常給佔位值）。不補值、不外推。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;預估修正趨勢（只描述，不當證據）&lt;/h3&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt&quot;&gt;&lt;tr&gt;&lt;th&gt;期間&lt;/th&gt;&lt;th&gt;每股盈餘預估&lt;/th&gt;&lt;th&gt;7 天前&lt;/th&gt;&lt;th&gt;30 天前&lt;/th&gt;&lt;th&gt;60 天前&lt;/th&gt;&lt;th&gt;90 天前&lt;/th&gt;&lt;th&gt;較 30 天前&lt;/th&gt;&lt;th&gt;近 7 天上修／下修家數&lt;/th&gt;&lt;th&gt;近 30 天上修／下修家數&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;本季&lt;/td&gt;&lt;td&gt;3.24&lt;/td&gt;&lt;td&gt;3.20&lt;/td&gt;&lt;td&gt;3.34&lt;/td&gt;&lt;td&gt;3.33&lt;/td&gt;&lt;td&gt;3.33&lt;/td&gt;&lt;td&gt;下修&lt;/td&gt;&lt;td&gt;10／27&lt;/td&gt;&lt;td&gt;10／26&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;下一季&lt;/td&gt;&lt;td&gt;3.33&lt;/td&gt;&lt;td&gt;3.33&lt;/td&gt;&lt;td&gt;3.46&lt;/td&gt;&lt;td&gt;3.40&lt;/td&gt;&lt;td&gt;3.40&lt;/td&gt;&lt;td&gt;下修&lt;/td&gt;&lt;td&gt;4／11&lt;/td&gt;&lt;td&gt;5／10&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;本財年（2026 財年，推導）&lt;/td&gt;&lt;td&gt;19.60&lt;/td&gt;&lt;td&gt;19.53&lt;/td&gt;&lt;td&gt;20.59&lt;/td&gt;&lt;td&gt;20.61&lt;/td&gt;&lt;td&gt;20.59&lt;/td&gt;&lt;td&gt;下修&lt;/td&gt;&lt;td&gt;0／45&lt;/td&gt;&lt;td&gt;0／45&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;下一財年（2027 財年，推導）&lt;/td&gt;&lt;td&gt;14.93&lt;/td&gt;&lt;td&gt;14.95&lt;/td&gt;&lt;td&gt;15.08&lt;/td&gt;&lt;td&gt;14.88&lt;/td&gt;&lt;td&gt;14.78&lt;/td&gt;&lt;td&gt;持平&lt;/td&gt;&lt;td&gt;11／32&lt;/td&gt;&lt;td&gt;19／26&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;分析師預估與券商目標價只描述，不當證據，也不是目標區間任一端；上修／下修門檻為較 30 天前變動 ±1%（本工具設定；與「市價溢價來源」預估修正以 90 天 ±2% 判持平是兩個口徑）。資料取得 2026-11-17T20:24:12（台北時間）（yfinance eps_trend、eps_revisions）。券商目標價近 90 天 22 家調整：上調 4、下調 16、持平 2；上季財報驚奇（Nasdaq）：Sep 2026，10/28/2026 公布，每股盈餘 2.12、共識 2.94、驚奇 -27.89%；（yfinance）：2026-09-30，實際 2.12、預估 3.0089。兩個來源口徑可能不同（可能是調整後或一般會計準則）；公司申報的每股盈餘可對照存檔 8-K 2026-10-28 財報新聞稿（事件/8K事件），本工具未逐項比對，只描述，不比較、不當證據。每批另存快照自建歷史：3 筆（2026-11-05 至 2026-11-17）。&lt;/p&gt;&lt;/div&gt;&lt;!--/目標區間:附錄--&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;成長性四問（細表）&lt;/h3&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;成長性四問：過去、品質、股價要求、模型假設&lt;/h4&gt;&lt;p&gt;&lt;b&gt;一句話：&lt;/b&gt;成長穩定、可預期；成長品質好；股價要求的成長不高；本報告的基準假設貼近最新單季。&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt&quot;&gt;&lt;tr&gt;&lt;th&gt;面向&lt;/th&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;數字&lt;/th&gt;&lt;th&gt;判讀&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;實績&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;長期營收年複合（2015～2025）&lt;/td&gt;&lt;td&gt;+18.3%&lt;/td&gt;&lt;td rowspan=&quot;2&quot; style=&quot;text-align:left;vertical-align:top&quot;&gt;&lt;span style=&quot;color:#2f6b4f;font-weight:700&quot;&gt;● 穩定、可預期&lt;/span&gt;&lt;br&gt;&lt;span style=&quot;font-size:12px;color:#7a7f7c&quot;&gt;近 8 季單季年增波動 4.9 個百分點，長期年複合 +18.3%&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;實績&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;近四季營收年增（一年前）&lt;/td&gt;&lt;td&gt;+22.2%（+13.4%）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;品質&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;新增投資的回報（增量 ROIC）&lt;/td&gt;&lt;td&gt;+28.4%&lt;/td&gt;&lt;td rowspan=&quot;3&quot; style=&quot;text-align:left;vertical-align:top&quot;&gt;&lt;span style=&quot;color:#2f6b4f;font-weight:700&quot;&gt;● 好：新增投入的回報高於資金成本&lt;/span&gt;&lt;br&gt;&lt;span style=&quot;font-size:12px;color:#7a7f7c&quot;&gt;增量 ROIC +28.4%、近五年 ROIC 中位 +44.0%，資金成本 9.8%&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;品質&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;存貨、應收增速減營收增速&lt;/td&gt;&lt;td&gt;不適用、+5.1%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;品質&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;再投資能支撐的成長&lt;/td&gt;&lt;td&gt;+47.0%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股價要求&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;現價隱含的未來 5 年營收年增&lt;/td&gt;&lt;td&gt;+14.5%（折現率高低 +17.3%～+11.6%）&lt;/td&gt;&lt;td rowspan=&quot;2&quot; style=&quot;text-align:left;vertical-align:top&quot;&gt;&lt;span style=&quot;color:#2f6b4f;font-weight:700&quot;&gt;● 不高：過去的成長就做得到&lt;/span&gt;&lt;br&gt;&lt;span style=&quot;font-size:12px;color:#7a7f7c&quot;&gt;市價要求每年 +14.5%&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股價要求&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;本益比在自身近五年的位置&lt;/td&gt;&lt;td&gt;介於最低與p25之間（申報 EPS 本益比 14.8 倍，近五年中位 24.1 倍；扣非經常本益比 27.2 倍口徑不同，口徑較貴，不能據此說相對歷史便宜）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;模型假設&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;基準情境第 1 年營收成長&lt;/td&gt;&lt;td&gt;+25.0%&lt;/td&gt;&lt;td rowspan=&quot;3&quot; style=&quot;text-align:left;vertical-align:top&quot;&gt;&lt;span style=&quot;color:#2f6b4f;font-weight:700&quot;&gt;● 貼近最新單季&lt;/span&gt;&lt;br&gt;&lt;span style=&quot;font-size:12px;color:#7a7f7c&quot;&gt;基準首年 +25.0%，同規模公司 -0.0%～+20.8%，最新單季年增 +24.7%&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;模型假設&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;同類公司次年營收成長（中間一半）&lt;/td&gt;&lt;td&gt;+3.4%～+17.7%，中位 +10.2%；同規模（n=601）-0.0%～+20.8%，中位 +9.6%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;模型假設&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;同規模公司十年實質營收年增中位&lt;/td&gt;&lt;td&gt;+1.1%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;判讀由固定規則從表內數字算出，不影響估值與研究評等：實績看近 8 季單季年增的波動（6 個百分點內為穩定、超過 12 為不穩定）與長期方向；品質看新增投入與近五年的回報是否高於資金成本（虧損或增量回報為負為弱）；股價要求看市價隱含的未來 5 年年增是否超過過去實績、是否超過同類公司次年的 p75；模型假設看基準第 1 年是否落在同類公司 p25–p75 或貼近最新單季年增；股價要求與模型假設的同類公司，用同成長組再依規模或產業細分、樣本至少 300 家的最細一組。「同類公司」是本工作流回溯 2014–2025 年約 2,000 家美股、近一年成長相近者次年的實際分布，只是參考，不是預測；存貨或應收增得比營收快不代表成長轉弱，不列入判讀。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;估值方法與參數&lt;/h3&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;方法&lt;/th&gt;&lt;th&gt;低&lt;/th&gt;&lt;th&gt;中&lt;/th&gt;&lt;th&gt;高&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;DCF 保守&lt;/td&gt;&lt;td&gt;105&lt;/td&gt;&lt;td&gt;121&lt;/td&gt;&lt;td&gt;143&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;DCF 基準&lt;/td&gt;&lt;td&gt;190&lt;/td&gt;&lt;td&gt;226&lt;/td&gt;&lt;td&gt;275&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;DCF 樂觀&lt;/td&gt;&lt;td&gt;334&lt;/td&gt;&lt;td&gt;400&lt;/td&gt;&lt;td&gt;492&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;歷史本益比&lt;/td&gt;&lt;td&gt;222&lt;/td&gt;&lt;td&gt;249&lt;/td&gt;&lt;td&gt;278&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;同業企業價值／營業利益&lt;/td&gt;&lt;td&gt;294&lt;/td&gt;&lt;td&gt;318&lt;/td&gt;&lt;td&gt;341&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p style=&quot;font-size:14px&quot;&gt;折現率基準 9.8%（區間 8.8%–10.8%）：無風險利率 5.12%、市場風險溢價 4.20%、beta 1.16。DCF 為 20 年：前 5 年依情境，後 15 年成長與利潤率逐步回到永續水準。&lt;/p&gt;&lt;p style=&quot;font-size:14px&quot;&gt;同業：MSFT（Azure 雲端與 AI 基礎設施投資、超大型平台；最近一季營收年增約 19%、近四季營業利益率約 47%（高於 GOOGL））, META（數位廣告為主、AI 資本支出大幅增加；最近一季營收年增約 26%、近四季營業利益率約 33%）, AMZN（AWS 為雲端主要對手、AI 資本支出大；零售業務拉低利潤率（近四季營業利益率約 12%），只用 EV/EBIT、不用 EV/營收）。排除：AAPL：C：硬體為主，收入與資本需求不同（方向：AAPL 估值把 GOOGL 當平台利潤率參考，GOOGL 這邊因 AAPL 硬體為主不以其為同業）, ORCL：C、F：雲端成長期但負債比高、資本結構差異大，未取得市場資料。&lt;/p&gt;&lt;p style=&quot;font-size:14px&quot;&gt;產業公版：穩定現金流／數位平台／廣告加雲端；驗證狀態：已驗證三家（UBER、GOOGL 2026-11-06～07、GRAB 2026-11-08 通過審查；2026-11-08 核定）；本公司是第 1 家實例。首家產業，公版的估值法與指標選擇尚未經兩家以上驗證，審查與讀者請多看適用性。&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;details id=&quot;wp-value&quot;&gt;&lt;summary&gt;價值判斷：PEG、林區資產負債表檢查與交叉檢查&lt;/summary&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;PEG 與林區檢查&lt;/h3&gt;&lt;div class=&quot;wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;PEG：可計算的成長口徑（紅線為 1 與 2；灰色為成長率與本益比口徑不一致，不作判讀）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 500 142&quot; role=&quot;img&quot; aria-label=&quot;PEG&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;250.0&quot; x2=&quot;250.0&quot; y1=&quot;6&quot; y2=&quot;136&quot; class=&quot;zero&quot;/&gt;&lt;line x1=&quot;333.6&quot; x2=&quot;333.6&quot; y1=&quot;4&quot; y2=&quot;138&quot; class=&quot;price&quot;/&gt;&lt;line x1=&quot;417.3&quot; x2=&quot;417.3&quot; y1=&quot;4&quot; y2=&quot;138&quot; class=&quot;price&quot;/&gt;&lt;text x=&quot;240&quot; y=&quot;23&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;過去三年 EPS 年增（口徑不一致）&lt;/text&gt;&lt;rect x=&quot;250.0&quot; y=&quot;9&quot; width=&quot;68.3&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--muted)&quot;/&gt;&lt;text x=&quot;326.3&quot; y=&quot;23&quot; class=&quot;val&quot;&gt;0.8&lt;/text&gt;&lt;text x=&quot;240&quot; y=&quot;63&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;近四季對上一財年&lt;/text&gt;&lt;rect x=&quot;250.0&quot; y=&quot;49&quot; width=&quot;121.9&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;379.9&quot; y=&quot;63&quot; class=&quot;val&quot;&gt;1.5&lt;/text&gt;&lt;text x=&quot;240&quot; y=&quot;103&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;基準情境推估&lt;/text&gt;&lt;rect x=&quot;250.0&quot; y=&quot;89&quot; width=&quot;174.5&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;432.5&quot; y=&quot;103&quot; class=&quot;val&quot;&gt;2.1&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;PEG 與林區加股利比率（可計算的成長口徑）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;成長口徑&lt;/th&gt;&lt;th&gt;成長率&lt;/th&gt;&lt;th&gt;PEG&lt;/th&gt;&lt;th&gt;判讀&lt;/th&gt;&lt;th&gt;加股利比率&lt;/th&gt;&lt;th&gt;判讀&lt;/th&gt;&lt;th&gt;加股東收益率比率（現代延伸）&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;過去三年 EPS 年增&lt;/td&gt;&lt;td&gt;33.3%&lt;/td&gt;&lt;td&gt;0.8&lt;/td&gt;&lt;td&gt;口徑不一致，不具參考性&lt;/td&gt;&lt;td&gt;1.24&lt;/td&gt;&lt;td&gt;口徑不一致，不具參考性&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;近四季對上一財年（申報 EPS）&lt;/td&gt;&lt;td&gt;18.7%&lt;/td&gt;&lt;td&gt;1.5&lt;/td&gt;&lt;td&gt;合理&lt;/td&gt;&lt;td&gt;0.70&lt;/td&gt;&lt;td&gt;差&lt;/td&gt;&lt;td&gt;0.67&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準情境推估（稅後營業利益年增－股數年變化）&lt;/td&gt;&lt;td&gt;13.0%&lt;/td&gt;&lt;td&gt;2.1&lt;/td&gt;&lt;td&gt;偏貴&lt;/td&gt;&lt;td&gt;0.49&lt;/td&gt;&lt;td&gt;差&lt;/td&gt;&lt;td&gt;0.46&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;加股東收益率比率＝（成長率＋股利殖利率＋淨回購殖利率）÷本益比，把回購也算進股東回饋、並扣掉發給員工的股票；這是現代延伸，不是林區原版，也沒有政策門檻，只列數字。 PEG 用的每股盈餘 10.42 美元：PEG 所用 EPS 為一般會計 EPS，未扣非經常項目，含股權薪酬（近四季淨利每股 19.16、每股股權薪酬 2.47）。&lt;/p&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;「口徑不一致」：「過去三年 EPS 年增」用申報 EPS（近四季 19.16 美元，含非經常損益），本益比用扣非經常 EPS 10.42 美元（差 -46%，容忍 ±7%）。兩者不同口徑，數字照列但不作便宜或昂貴判斷；要得到同口徑的過去三年 PEG，須逐年扣非經常 EPS（估值輸入 eps_history_adjusted）。&lt;/p&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:4px&quot;&gt;PEG 的判讀標籤依估值政策門檻；高風險、成長極高或極低的公司，PEG 有系統性偏誤（同樣成長下風險越高 PEG 越低），不能只憑標籤判斷便宜或昂貴。&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;林區式資產負債表與市場檢查&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;數值&lt;/th&gt;&lt;th&gt;林區的看法&lt;/th&gt;&lt;th&gt;判讀&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;本益比&lt;/td&gt;&lt;td&gt;27.23&lt;/td&gt;&lt;td&gt;與自身歷史比較&lt;/td&gt;&lt;td&gt;資料限制：歷史第 0% 百分位是用申報 EPS（14.8 倍）算的，申報 EPS 為 27.2 倍、口徑較貴，不能據此說相對歷史便宜&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;每股淨現金&lt;/td&gt;&lt;td&gt;11.28&lt;/td&gt;&lt;td&gt;淨現金可提供下檔保護（林區 O31、LAK02）&lt;/td&gt;&lt;td&gt;好：有淨現金，可提供下檔保護；占股價 4.0%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;負債對權益&lt;/td&gt;&lt;td&gt;0.18&lt;/td&gt;&lt;td&gt;一般越低越好（林區 L25）&lt;/td&gt;&lt;td&gt;不評好壞：有息負債約為股東權益的 0.18 倍；沒有公認門檻，償債能力見收現段償債指標&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;每股自由現金流（近四季）&lt;/td&gt;&lt;td&gt;1.61&lt;/td&gt;&lt;td&gt;比每股盈餘更接近現金（林區 O37、修正10）&lt;/td&gt;&lt;td&gt;不評好壞：自由現金流殖利率 0.6%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股數年變化（近三財年）&lt;/td&gt;&lt;td&gt;-2.4%&lt;/td&gt;&lt;td&gt;持續買回、且價格合理、資金來自本業現金時才是好訊號（林區 L16、O19）&lt;/td&gt;&lt;td&gt;好：近三財年平均每年 -2.4%；最近一季對去年同季 +1.3%（2025-09-30→2026-09-30）：近期轉為增加，PEG 推估改用近期變化&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;存貨增速 vs 營收增速&lt;/td&gt;&lt;td&gt;446%&lt;/td&gt;&lt;td&gt;存貨增速高於營收是警訊（林區 O50）&lt;/td&gt;&lt;td&gt;注意：存貨 +446%（2025-12-31→2026-09-30）vs 營收 +22%（近四季對前四季，各截至 2026-09-30、2025-09-30）：警訊，須查原因&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;內部人公開市場買進&lt;/td&gt;&lt;td&gt;0&lt;/td&gt;&lt;td&gt;內部人自掏腰包買進是強訊號&lt;/td&gt;&lt;td&gt;中性：近期無人買進；賣出原因多，訊號較弱&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;林區以外的交叉檢查（只揭露，不改研究評等與價格位置）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;檢查&lt;/th&gt;&lt;th&gt;結果&lt;/th&gt;&lt;th&gt;判讀&lt;/th&gt;&lt;th&gt;依據與限制&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Piotroski F 分數（財報是否在改善）&lt;/td&gt;&lt;td&gt;7 ／ 8 項（2024-12-31→2025-12-31）&lt;/td&gt;&lt;td&gt;中&lt;/td&gt;&lt;td&gt;未通過：長期負債 ÷ 平均總資產比上年低。Piotroski（2000）研究文獻/Piotroski2000_財報訊號 第 9–11、15 頁；8–9 分高分組、0–2 分低分組&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Beneish M 分數（盈餘被美化的機率）&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;不適用&lt;/td&gt;&lt;td&gt;缺 銷管費用&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Greenblatt 盈餘殖利率與資本報酬率&lt;/td&gt;&lt;td&gt;盈餘殖利率 4.6%；ROIC 37%&lt;/td&gt;&lt;td&gt;低於 10 年公債 5.1%；ROIC 37% 高於 WACC 9.8%&lt;/td&gt;&lt;td&gt;盈餘殖利率＝近四季營業利益 ÷（市值＋有息負債－現金與證券），推導；ROIC 為本專案稅後口徑，非 Greenblatt 原式稅前；不做排名&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;details id=&quot;wp-6&quot;&gt;&lt;summary&gt;6 財務：償債指標、融資活動、存活檢查與利率壓力測試（含判定規則與限制）&lt;/summary&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;融資活動與償債：錢還給誰、有沒有借錢、還不還得起&lt;/h3&gt;&lt;p class=&quot;cap&quot;&gt;利息保障改讀信用與存活的利息口徑（EBIT ÷ 近四季利息費用：us-gaap:InterestExpenseNonoperating，年度＋本期年初至今－去年同期；本機 SEC 事實），底稿的利息費用科目未對應。&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;償債能力指標（利息保障依 Damodaran 合成評等對照；其他沒有公認門檻，只寫事實）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;指標&lt;/th&gt;&lt;th&gt;數值&lt;/th&gt;&lt;th&gt;判讀&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;EBIT ÷ 利息費用&lt;/td&gt;&lt;td&gt;51.03&lt;/td&gt;&lt;td&gt;相當於 AAA 級：EBIT 是利息費用的 51.0 倍；依 Damodaran 合成評等大型公司對照表（2026 年 1 月；市值 35,198.3 億美元，在 50 億美元以上）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;（營運現金流＋實付利息）÷ 實付利息&lt;/td&gt;&lt;td&gt;未取得&lt;/td&gt;&lt;td&gt;資料限制：用實際現金算的付息能力無法計算（實付利息未取得：附註未申報此項或科目未對應）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;有息負債 ÷ EBITDA&lt;/td&gt;&lt;td&gt;0.68&lt;/td&gt;&lt;td&gt;不評好壞：以近四季 EBITDA 1,849.7 億美元計，約 0.7 年可還清有息負債&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;淨負債 ÷ EBITDA&lt;/td&gt;&lt;td&gt;-0.76&lt;/td&gt;&lt;td&gt;不評好壞：現金多於有息負債（淨現金）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;營運現金流 ÷ 有息負債&lt;/td&gt;&lt;td&gt;143.5%&lt;/td&gt;&lt;td&gt;不評好壞：一年的營運現金流約可還掉 144% 的有息負債（約 0.7 年還清）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;現金與證券 ÷ 一年內到期債務&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;不適用：已核對：10-Q 2026-09-30 Part I, Item 1 ¶245 一年內到期長期票據 1,016 百萬美元，列在應計費用及其他流動負債（¶249）；商業本票餘額 0（¶239）；底稿「一年內到期債務未取得」是因為資產負債表沒有獨立科目，不是沒有一年內到期債務。&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;利息費用：Q3 967 百萬，前九個月 2,778 百萬（已扣資本化利息，前九個月約 10 億，10-Q Item 1 ¶275、¶276）；Q3 營業利益 40,576 ÷ Q3 利息費用 967 約 42 倍（推導，單季）；近四季利息費用底稿未取得。；利息費用 2025 年同期為 Q3 143、前九個月 438，2026 年增加與長期債務票面由 2025-12-31 的 490.85 億增至 2026-09-30 的 1,274.85 億同向。；表外保證（10-Q 2026-09-30 Item 1 ¶315、¶316）：為能源與電力合約對手的長交期設備提供財務保證，最高可能支付 162 億、期限至 2049 年 1 月；TPU 硬體回購保證最高 66 億。兩者公允價值都不重大，不計入有息負債，但屬或有義務，與重大採購承諾 9,244 億一起在報告交代。；期後事項：2026-11-05 完成 60 億歐元優先票據發行（8-K 2026-11-05 Item 8.01，本文 §2、§4），七檔於 2028 至 2045 年到期，最早一檔 2028 年，一年內與兩年內到期金額不變；上表與存活檢查依 2026-09-30 債務表，未含這筆；募得資金用途與美元等值 8-K 未揭露&lt;/p&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;可用授信與到期（作者判讀，融資償債判讀）：一年內到期的長期票據 10.16 億美元（10-Q 2026-09-30）；商業本票額度 250 億美元、期末餘額 0；循環信用額度 100 億美元全數未動用（40 億 2027 年 4 月到期、60 億 2030 年 4 月到期）；2026 年新發的約 808 億美元票據（10-Q Item 1 ¶242：美元 450 億＋外幣 358 億，面額）最早 2028 年到期；期後（2026-11-05，8-K Item 8.01）另完成 60 億歐元優先票據發行，七檔最早 2028 年、最晚 2045 年到期，不在 2026-09-30 的債務表內&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;融資活動現金流：還給股東與借還款（本財年年初至 2026-09-30 累計，10-Q 2026-09-30）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;對象｜分類&lt;/th&gt;&lt;th&gt;金額&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股東｜員工股票代扣稅與相關淨額&lt;/td&gt;&lt;td&gt;-174 億美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股東｜股利&lt;/td&gt;&lt;td&gt;-81.7 億美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股東｜回購&lt;/td&gt;&lt;td&gt;0&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股東｜增資與員工認股&lt;/td&gt;&lt;td&gt;429 億美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股東小計&lt;/td&gt;&lt;td&gt;173 億美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;債權人｜償還&lt;/td&gt;&lt;td&gt;-88.8 億美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;債權人｜借入&lt;/td&gt;&lt;td&gt;852 億美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;債權人小計&lt;/td&gt;&lt;td&gt;763 億美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;其他｜少數股東往來&lt;/td&gt;&lt;td&gt;37.6 億美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;其他｜投資面：收購與無形資產購置 −34,103（含 Wiz）、其他投資 −879；融資面：強制轉換特別股淨收入 +19,063、其他融資 −686&lt;/td&gt;&lt;td&gt;184 億美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;其他小計&lt;/td&gt;&lt;td&gt;221 億美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;對照：同期營運現金流&lt;/td&gt;&lt;td&gt;1,271 億美元&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;融資活動是公司與出資人（股東、債權人）之間的現金往來，不等於借款：回購、股利是還給股東，借入、償還才是借款；負數＝現金流出。本表期間與下方借款用途、上方現金流分層（近四季）不同。&lt;/p&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;借款用途（研究判讀）：混合（以擴張為主）：AI 基礎設施資本支出是最大資金需求，同時用債務、普通股與強制轉換特別股籌資；債務本身公司只寫「一般公司用途」，沒有單獨指定用途；期間 2026 年前九個月（2026-01-01～2026-09-30）；依據：10-Q 2026-09-30 Part I, Item 1 ¶242（2026 年發行 450 億美元＋358 億美元外幣高級無擔保票據，用途：一般公司用途）、10-Q 2026-09-30 Part I, Item 1 ¶243（第三季發行 USD 固定與浮動利率票據、AUD 票據）、10-Q 2026-09-30 Part I, Item 1 ¶361、¶364（普通股淨收入 205 億＋私募 100 億、強制轉換特別股淨收入 190 億，用途：一般公司用途，包括擴大 AI 基礎設施與全球算力的資本支出）、10-Q 2026-09-30 Part I, Item 1 ¶375、¶376（ATM 計畫上限 400 億，主要用於支付員工股權授予的稅負；本年已發行淨收入 124 億，剩餘 276 億）、10-Q 2026-09-30 Part I, Item 2 ¶204（前九個月資本支出 1,320 億，去年同期 636 億）、10-Q 2026-09-30 Part I, Item 1 ¶279（2026-03-11 完成 Wiz 收購 295 億）、10-Q 2026-09-30 Part I, Item 1 ¶386（前九個月無回購）、8-K 2026-06-04 本文 §211、§212、§214（股權募資用途與「平衡投資」的資金來源說明：營運現金流、債務、股權）、8-K 2026-10-28 新聞稿 §8（第三季發行票據淨收入 287 億，用於一般公司用途）、8-K 2026-05-11 本文 §3、8-K 2026-05-21 本文 §3、8-K 2026-08-10 本文 §3（歐元、加幣、日圓、美元票據發行）&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;survival-detail&quot;&gt;&lt;h3&gt;存活檢查：現金對債務（12～24 個月，推導，非違約預測）&lt;/h3&gt;&lt;p style=&quot;margin:0 0 6px&quot;&gt;&lt;b&gt;信用評級&lt;/b&gt;　機構 Moody&amp;#x27;s Aa2（展望穩定）、S&amp;amp;P AA+（展望穩定）（SEC 全文搜尋 FWP 2026-08-07 0001193125-26-338750）／推導 AAA（Damodaran 合成評等，利息保障 51.0 倍，近四季新借款多、利息偏低、評級可能偏高，推導）｜投資等級（BBB-／Baa3 以上）；推導比機構高 2 級（推導只看利息保障，不含規模、產業與擔保結構，僅供對照）&lt;/p&gt;&lt;p style=&quot;margin:0 0 6px&quot;&gt;&lt;b&gt;存活檢查（完整理由）&lt;/b&gt;　無明顯警訊（推導，非違約預測）：現金加未動用信貸 2,751 億美元，一年內到期債務 20 億美元（另利息 31 億美元），可付 54.2 倍；現金加未動用信貸 2,751 億美元，兩年內到期債務 30 億美元（另利息 62 億美元），可付 30.1 倍；利息保障 51.0 倍（新借款多、利息偏低，倍數可能偏高）；會計師未提出繼續經營疑慮。&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;燈號：無明顯警訊（一般公司：現金對債務；資料截至 2026-09-30，收盤日 2026-11-16）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;判定&lt;/th&gt;&lt;th&gt;內容與出處&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;會計師繼續經營疑慮&lt;/td&gt;&lt;td&gt;無明顯警訊&lt;/td&gt;&lt;td&gt;會計師與管理層未提出繼續經營疑慮（掃描 10-Q 2026-09-30、10-K 2025-12-31）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;流動性：12 個月&lt;/td&gt;&lt;td&gt;無明顯警訊&lt;/td&gt;&lt;td&gt;現金加未動用信貸 275,098.0，一年內到期本金 2,000.0，加利息 3,076.0（利息偏低，未含新借款全年利息），可付 54.2 倍；跨窗口的到期桶 第2年 1,000.0（2026-12-31～2027-12-31） 未計入，到期月份看債務附註&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;流動性：24 個月&lt;/td&gt;&lt;td&gt;無明顯警訊&lt;/td&gt;&lt;td&gt;現金加未動用信貸 275,098.0，兩年內到期本金 3,000.0，加利息 6,152.0（利息偏低，未含新借款全年利息），可付 30.1 倍；跨窗口的到期桶 第3年 2,676.0（2027-12-31～2028-12-31） 未計入，到期月份看債務附註&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;利息保障&lt;/td&gt;&lt;td&gt;無明顯警訊&lt;/td&gt;&lt;td&gt;利息保障 51.0 倍（近四季借還款淨額 96,572 占有息負債 77%（大額新借款），近四季利息費用（us-gaap:InterestExpenseNonoperating，年度＋本期年初至今－去年同期；本機 SEC 事實） 3,076 只含新債的部分期間，偏低；未能年化，倍數可能偏高）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Altman Z 分數&lt;/td&gt;&lt;td&gt;輔助（不改燈號）&lt;/td&gt;&lt;td&gt;Altman Z 8.48（安全區，只當輔助）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;回饋股東對自由現金流&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;近四季回購加股利 166 億美元，未超過自由現金流 197 億美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;信用評級（機構）&lt;/td&gt;&lt;td&gt;投資等級&lt;/td&gt;&lt;td&gt;Moody&amp;#x27;s Aa2（SEC 全文搜尋 FWP 2026-08-07 0001193125-26-338750）；S&amp;amp;P AA+（SEC 全文搜尋 FWP 2026-08-07 0001193125-26-338750）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;信用評級（推導）&lt;/td&gt;&lt;td&gt;投資等級&lt;/td&gt;&lt;td&gt;AAA：Damodaran 合成評等 2026 年 1 月（大型公司表），利息保障 51.0 倍（EBIT ÷ 近四季利息費用（us-gaap:InterestExpenseNonoperating，年度＋本期年初至今－去年同期；本機 SEC 事實））&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;機構與推導比對&lt;/td&gt;&lt;td&gt;提示&lt;/td&gt;&lt;td&gt;推導比機構高 2 級（推導只看利息保障，不含規模、產業與擔保結構，僅供對照）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;債券市場參考&lt;/td&gt;&lt;td&gt;信用評級 AA&lt;/td&gt;&lt;td&gt;ICE BofA 公司債選擇權調整利差：投資等級整體 0.89 個百分點（2026-11-13，FRED BAMLC0A0CM）；BBB 級 1.11 個百分點（2026-11-13，FRED BAMLC0A4CBBB）；投機等級整體 3.23 個百分點（2026-11-13，FRED BAMLH0A0HYM2）；AA 級 0.64 個百分點（2026-11-13，FRED BAMLC0A2CAA）；個別債券殖利率與價格未取得（TRACE／FINRA 不在固定來源）&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;債務到期年度桶（10-K 2025-12-31，資料日 2025-12-31），桶結束日落在窗口內才計入；一年內取與資產負債表一年內到期債務較大者；利息口徑：近四季利息費用（us-gaap:InterestExpenseNonoperating，年度＋本期年初至今－去年同期；本機 SEC 事實）（出處：期間 2025-01-01～2025-12-31、2026-01-01～2026-09-30、2025-01-01～2025-09-30；申報 10-K 2026-02-05（0001652044-26-000018）、10-Q 2026-10-29（0001652044-26-000084））；未動用信貸：10-Q 2026-09-30 Part I, Item 1 ¶255（全額未動用；其中 4,000 在 2027-04 到期（落在 12 個月窗口內，24 個月窗口只剩 6,000 的 2030-04 部分），工具照全額計入，結論對 4,000 到期不敏感（現金與證券遠大於債務到期）；另有商業本票計畫上限 25,000，期末無餘額（Part I, Item 1 ¶239）；借款條件與契約未揭露，未判契約）&lt;/p&gt;&lt;h3 style=&quot;margin-top:14px&quot;&gt;利率壓力測試（固定情境：利率上升 1、2 個百分點與下降 1 個百分點，不預測聯準會；推導）&lt;/h3&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;單位百萬美元；狀態：已試算&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;浮動利率債利息變動&lt;/th&gt;&lt;th&gt;再融資利息變動&lt;/th&gt;&lt;th&gt;壓力後一年利息&lt;/th&gt;&lt;th&gt;利息保障&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;目前利率（只算再融資）&lt;/td&gt;&lt;td&gt;0.0&lt;/td&gt;&lt;td&gt;99.9&lt;/td&gt;&lt;td&gt;3,175.9&lt;/td&gt;&lt;td&gt;49.4 倍&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;+1 個百分點&lt;/td&gt;&lt;td&gt;33.9&lt;/td&gt;&lt;td&gt;129.9&lt;/td&gt;&lt;td&gt;3,239.8&lt;/td&gt;&lt;td&gt;48.5 倍&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;+2 個百分點&lt;/td&gt;&lt;td&gt;67.7&lt;/td&gt;&lt;td&gt;159.9&lt;/td&gt;&lt;td&gt;3,303.7&lt;/td&gt;&lt;td&gt;47.5 倍&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;−1 個百分點&lt;/td&gt;&lt;td&gt;-33.9&lt;/td&gt;&lt;td&gt;69.9&lt;/td&gt;&lt;td&gt;3,112.1&lt;/td&gt;&lt;td&gt;50.4 倍&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;目前利率：聯邦基金利率 3.88%（2026-11-13，FRED DFF）、SOFR 3.90%（2026-11-13，FRED SOFR）、十年期公債 5.15%（2026-11-13，FRED DGS10）；估值折現率用的 10 年期公債是 5.12%（2026-11-16，美國財政部），來源與日期不同；浮動利率債 3,386.0，占總債務 3%（10-Q 2026-09-30 Part I, Item 1 ¶243、¶245、¶246；浮動利率債＝美元 1,800＋澳幣 A$2.3 十億，推導：2026 年澳幣票據 A$5.6 十億〔固定 3.3＋浮動 2.3，¶243〕對表列 3,861，換算約 0.69，A$2.3 十億≈1,586，＝3,386，推導；公司另以利率交換把一部分固定利率債轉浮動，¶179，名目金額在已讀原文未找到，故未計入、此為浮動利率債下限；總債務為票據面額合計 127,485，¶245；公司未給每 100bp 利息變動金額；10 月 Waymo 另借 5,000 有擔保定期貸款，SOFR＋5.25%，¶252，是期後事項，不在 9/30 餘額）；兩年內到期須再融資本金 3,000.0，原票面 2.46%（目前平均利率 2.46%（一年利息÷有息負債，推導）），再融資利率 5.79%（10 年期公債 5.15%（2026-11-13）＋ AA 級 OAS 0.64 個百分點（機構最低評級），推導）；利息保障基準：利息保障（EBIT÷一年利息），目前 51.0 倍；利率上升 2 個百分點（+200bp，bp＝基點，100bp＝1 個百分點）後低於 1.5 倍才在燈號理由加一條（不改燈號、不改研究評等）；通膨、物價、消費者等間接影響不在此表&lt;/p&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;&lt;a href=&quot;#survival-rules&quot;&gt;判定規則與限制見本節下方&lt;/a&gt;（寫死在程式，不改研究評等）。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;survival-rules&quot;&gt;&lt;h3&gt;存活檢查與利率壓力測試：判定規則與限制&lt;/h3&gt;&lt;p class=&quot;cap&quot;&gt;規則版本：v1.1（2026-11-03 第二輪：加 KBRA、利率壓力測試、首頁精簡；仍只顯示提示、不改研究評等）&lt;/p&gt;&lt;ul class=&quot;cap&quot;&gt;&lt;li&gt;總燈號：各項取最嚴重：任一高風險→高風險；否則任一需留意→需留意；12 個月流動性或繼續經營無法判定→資料不足；其餘→無明顯警訊。Z 分數與推導評級只列理由、不改燈號。&lt;/li&gt;&lt;li&gt;繼續經營：最新年報或其後季報出現會計師或管理層「substantial doubt … going concern」肯定句 → 高風險（否定句、假設句只列出不計）；只出現在前一份年報 → 需留意&lt;/li&gt;&lt;li&gt;流動性_12個月：現金與證券＋未動用信貸 ≥ 一年內到期本金＋一年利息 → 無明顯警訊；不足但加近四季自由現金流（已扣實付利息）後 ≥ 一年內到期本金 → 需留意；仍不足 → 高風險&lt;/li&gt;&lt;li&gt;流動性_24個月：同上改兩年（本金、利息、自由現金流各計兩年）；不足但加兩年自由現金流 ≥ 本金的 50% → 需留意；更低 → 高風險&lt;/li&gt;&lt;li&gt;燒錢：近四季自由現金流為負：現金還能燒幾個月＝（現金與證券＋未動用信貸－一年內到期本金）÷ 每月燒錢；&amp;lt;12 個月 高風險、12～24 個月 需留意&lt;/li&gt;&lt;li&gt;利息保障：EBIT ÷ 利息費用 &amp;lt; 1.5 倍 → 需留意&lt;/li&gt;&lt;li&gt;契約：作者自 信用揭露 填公司揭露的契約門檻與實際值：已違反 → 高風險；餘裕 &amp;lt; 15% → 需留意；未揭露不判&lt;/li&gt;&lt;li&gt;信用評級：機構評級（S&amp;amp;P、Moody&amp;#x27;s、Fitch、KBRA，取各機構最新、以最低者判等級）低於 BBB-／Baa3 → 需留意；只有推導評級為投機等級 → 只列理由&lt;/li&gt;&lt;li&gt;利率壓力測試：固定情境 +100bp／+200bp／-100bp（不預測聯準會）：利息增加＝浮動利率債×利率變動（作者填 Item 7A 每 100bp 利息變動時改用該值）＋兩年內到期本金×（再融資利率＋利率變動－原票面利率）；再融資利率＝收盤日 10 年期公債殖利率＋該評級 ICE BofA OAS（推導）；壓力後利息保障＝EBIT÷（一年利息＋利息增加），EBIT 分母異常時改用現金利息保障。+200bp 後低於 1.5 倍 → 理由加一條、首頁也加（只列理由、不改燈號）；浮動利率債未揭露或未填 → 該情境未取得；金融業不套&lt;/li&gt;&lt;li&gt;金融業：銀行券商、保險不套現金對債務：研究評等輸入 監理紅線 低於門檻 → 高風險；高於門檻不到 20%（相對）→ 需留意；未填 → 資料不足&lt;/li&gt;&lt;/ul&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;使用限制&lt;/p&gt;&lt;ul class=&quot;cap&quot;&gt;&lt;li&gt;推導，非違約預測：燈號只看 12～24 個月付不付得出錢與已揭露的警訊，不是違約機率，也不改研究評等（第一版）。&lt;/li&gt;&lt;li&gt;Altman Z 分數會誤判兩類公司：權益為負（如舉債回購）與保留盈餘因長期回購或股利變負，所以只當輔助、不單獨下結論、不改燈號。&lt;/li&gt;&lt;li&gt;金融業（銀行券商、保險）的存款與保單負債是營業資金，改看監理資本（如 CET1），不套現金對債務。&lt;/li&gt;&lt;li&gt;超過 2～3 年的到期與再融資風險留在正文債務到期表，不進燈號。&lt;/li&gt;&lt;li&gt;到期年度桶以到期表資料日（年報）起算：桶的結束日落在窗口內才計入；跨窗口的桶另列，若作者在 信用揭露 填了近期到期明細就改用明細。&lt;/li&gt;&lt;li&gt;個別債券價格與殖利率（TRACE／FINRA）不在固定來源：未取得；市場參考只用 FRED 的 ICE BofA 各評級公司債利差（大盤層級）。&lt;/li&gt;&lt;li&gt;機構評級只認公司自己在 SEC 申報寫出的 S&amp;amp;P、Moody&amp;#x27;s、Fitch、KBRA 評級並附原句；沒揭露寫未揭露，不從新聞或記憶補。&lt;/li&gt;&lt;li&gt;利率壓力測試只用固定情境（+100bp、+200bp、−100bp），不預測聯準會；以 10 年期公債估再融資成本，實際年期與擔保結構不同會有誤差；浮動利率債若也在兩年內到期會重複計算（偏保守）；通膨、物價、消費者等間接影響不進燈號；金融業不套，維持看資本適足率。&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/details&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;more&quot; data-layer=&quot;附錄&quot;&gt;&lt;div class=&quot;qno&quot;&gt;附錄&lt;/div&gt;&lt;h2&gt;附錄：估值細節、論點檢查、名詞、表格與資料來源（預設摺疊）&lt;/h2&gt;&lt;details id=&quot;valdetail&quot;&gt;&lt;summary&gt;估值細節：利率、同業與產業對照、券商目標價&lt;/summary&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;券商目標價&lt;/h3&gt;&lt;figure class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;券商目標價範圍對照本報告合理價值與收盤價（美元；yfinance，取得 2026-11-17；第三方看法，只揭露，不是本報告目標價、不進評等）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 150&quot; role=&quot;img&quot; aria-label=&quot;券商目標價&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;230.0&quot; x2=&quot;230.0&quot; y1=&quot;8&quot; y2=&quot;128&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;230.0&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;0&lt;/text&gt;&lt;line x1=&quot;316.7&quot; x2=&quot;316.7&quot; y1=&quot;8&quot; y2=&quot;128&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;316.7&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;200&lt;/text&gt;&lt;line x1=&quot;403.3&quot; x2=&quot;403.3&quot; y1=&quot;8&quot; y2=&quot;128&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;403.3&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;400&lt;/text&gt;&lt;line x1=&quot;490.0&quot; x2=&quot;490.0&quot; y1=&quot;8&quot; y2=&quot;128&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;490.0&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;600&lt;/text&gt;&lt;text x=&quot;220&quot; y=&quot;27&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;券商目標價（最低–最高，點＝平均）&lt;/text&gt;&lt;line x1=&quot;360.0&quot; x2=&quot;446.7&quot; y1=&quot;22&quot; y2=&quot;22&quot; stroke=&quot;var(--c6)&quot; stroke-width=&quot;3&quot; opacity=&quot;.55&quot;/&gt;&lt;circle cx=&quot;403.5&quot; cy=&quot;22&quot; r=&quot;7&quot; fill=&quot;var(--c6)&quot;&gt;&lt;title&gt;券商目標價（最低–最高，點＝平均）：400&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;458.7&quot; y=&quot;27&quot; class=&quot;val&quot;&gt;400&lt;/text&gt;&lt;text x=&quot;220&quot; y=&quot;67&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;本報告合理價值（只含折現率）&lt;/text&gt;&lt;line x1=&quot;318.7&quot; x2=&quot;358.5&quot; y1=&quot;62&quot; y2=&quot;62&quot; stroke=&quot;var(--c1)&quot; stroke-width=&quot;3&quot; opacity=&quot;.55&quot;/&gt;&lt;circle cx=&quot;335.5&quot; cy=&quot;62&quot; r=&quot;7&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;本報告合理價值（只含折現率）：243&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;370.5&quot; y=&quot;67&quot; class=&quot;val&quot;&gt;243&lt;/text&gt;&lt;text x=&quot;220&quot; y=&quot;107&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;收盤價&lt;/text&gt;&lt;circle cx=&quot;352.9&quot; cy=&quot;102&quot; r=&quot;7&quot; fill=&quot;var(--ink)&quot;&gt;&lt;title&gt;收盤價：284&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;364.9&quot; y=&quot;107&quot; class=&quot;val&quot;&gt;284&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;市場怎麼看：券商目標價與它隱含的成長&lt;/h4&gt;&lt;p&gt;53 家券商的平均目標價 400.37 美元（中位 400.00，最低 300.00、最高 500.00）；比 2026-11-16 收盤價 283.72 高約 41%；換成本模型的語言，平均目標價要求未來 5 年營收每年成長約 18%，不高於同規模公司次年成長的 p75（+20.8%）；分析師自己預估明年每股盈餘成長 -23.8%（今年預估 19.60 美元、明年 14.93 美元；本報告申報與扣非經常 EPS 差距超過容忍度，今年預估若含已申報的非經常利益，成長率會被高基期壓低，不能直接讀成本業衰退；本報告扣非經常 EPS 為 10.42 美元）；近 90 天有 22 家調整目標價：上調 4、下調 16、持平 2。&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;券商目標價與隱含成長（yfinance，取得 2026-11-17）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;目標價（美元）&lt;/th&gt;&lt;th&gt;折回今天（推導）&lt;/th&gt;&lt;th&gt;隱含未來 5 年營收年增&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;平均目標價&lt;/td&gt;&lt;td&gt;400.37&lt;/td&gt;&lt;td&gt;364.00&lt;/td&gt;&lt;td&gt;+17.9%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;中位目標價&lt;/td&gt;&lt;td&gt;400.00&lt;/td&gt;&lt;td&gt;363.66&lt;/td&gt;&lt;td&gt;+17.8%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;最低目標價&lt;/td&gt;&lt;td&gt;300.00&lt;/td&gt;&lt;td&gt;272.75&lt;/td&gt;&lt;td&gt;+13.9%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;最高目標價&lt;/td&gt;&lt;td&gt;500.00&lt;/td&gt;&lt;td&gt;454.58&lt;/td&gt;&lt;td&gt;+20.7%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;Nasdaq 共識目標價 398.88（最低 300.00、最高 490.00；買進 29、持有 4、賣出 0）。券商目標價是第三方對 12 個月後股價的看法，多用「預估盈餘 × 主觀本益比」，通常偏樂觀；本區只揭露，不是本報告的目標價、不當證據、不影響估值與研究評等。「折回今天」以股權成本折現（未加回期間股利），「隱含成長」以本報告基準情境的其他假設反推，是用本模型理解他們的價格，不是券商自己的假設（推導）。資料取得時間與本報告收盤日不同。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;利率的影響：公債殖利率變動與股債利差&lt;/h3&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;利率敏感：10 年期公債殖利率下降 1 個百分點、其他假設不變，合理價值中點從約 243 升到約 294（+21%）；上升 1 個百分點則降到約 206（−15%）。&lt;/strong&gt;利率下降 1 個百分點時，中點接近現價。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;股債利差：申報 EPS 約 19.1 美元的盈餘殖利率約 6.7%，比 2026-11-16 的 10 年期公債 5.12% 高約 1.6 個百分點，但申報盈餘含大額權益證券評價利益；改用核心 EPS 10.42 美元，盈餘殖利率約 3.7%，比公債低約 1.4 個百分點&lt;span class=&quot;src&quot;&gt;（推算）&lt;/span&gt;。&lt;/strong&gt;只描述相對位置，不改估值。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;grid2 wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;公債殖利率每變動 1 個百分點，合理價值中點的變化（美元；紅色虛線為現價 283.72）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 500 142&quot; role=&quot;img&quot; aria-label=&q 0%&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;427.5&quot; y=&quot;263.0&quot; width=&quot;17.0&quot; height=&quot;3.0&quot; rx=&quot;2&quot; fill=&quot;var(--c3)&quot;&gt;&lt;title&gt;資本支出占營收 AAPL：2%&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;418.0&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;AAPL&lt;/text&gt;&lt;rect x=&quot;470.9&quot; y=&quot;210.8&quot; width=&quot;17.0&quot; height=&quot;55.2&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;營業利益率 ORCL：34%&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;489.8&quot; y=&quot;243.1&quot; width=&quot;17.0&quot; height=&quot;22.9&quot; rx=&quot;2&quot; fill=&quot;var(--c2)&quot;&gt;&lt;title&gt;研發占營收 ORCL：14%&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;508.8&quot; y=&quot;95.9&quot; width=&quot;17.0&quot; height=&quot;170.1&quot; rx=&quot;2&quot; fill=&quot;var(--c3)&quot;&gt;&lt;title&gt;資本支出占營收 ORCL：105%&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;499.3&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;ORCL&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c1)&quot;&gt;&lt;/i&gt;營業利益率&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c2)&quot;&gt;&lt;/i&gt;研發占營收&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c3)&quot;&gt;&lt;/i&gt;資本支出占營收&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt signals&quot;&gt;&lt;tr&gt;&lt;th&gt;公司&lt;/th&gt;&lt;th&gt;商業模式&lt;/th&gt;&lt;th&gt;服務導向&lt;/th&gt;&lt;th&gt;營業利益率&lt;/th&gt;&lt;th&gt;研發占營收&lt;/th&gt;&lt;th&gt;資本支出占營收&lt;/th&gt;&lt;th&gt;最近一季營收年增&lt;/th&gt;&lt;th&gt;與 Alphabet 的主要差異&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Alphabet&lt;/td&gt;&lt;td&gt;搜尋與 YouTube 廣告＋雲端＋TPU&lt;/td&gt;&lt;td&gt;高&lt;/td&gt;&lt;td&gt;33.3%&lt;/td&gt;&lt;td&gt;15.8%&lt;/td&gt;&lt;td&gt;33.9%&lt;/td&gt;&lt;td&gt;+24.7%&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Microsoft（微軟）&lt;/td&gt;&lt;td&gt;企業軟體與 Azure 雲端&lt;/td&gt;&lt;td&gt;高&lt;/td&gt;&lt;td&gt;47.1%&lt;/td&gt;&lt;td&gt;10.5%&lt;/td&gt;&lt;td&gt;39.2%&lt;/td&gt;&lt;td&gt;+18.8%&lt;/td&gt;&lt;td&gt;收入以企業訂閱為主，利潤率最高&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Meta&lt;/td&gt;&lt;td&gt;社群平台廣告&lt;/td&gt;&lt;td&gt;高&lt;/td&gt;&lt;td&gt;32.9%&lt;/td&gt;&lt;td&gt;31.7%&lt;/td&gt;&lt;td&gt;43.2%&lt;/td&gt;&lt;td&gt;+26.1%&lt;/td&gt;&lt;td&gt;收入幾乎全是廣告；研發與資本支出強度最高&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Amazon（亞馬遜）&lt;/td&gt;&lt;td&gt;電商＋AWS 雲端＋廣告&lt;/td&gt;&lt;td&gt;混合&lt;/td&gt;&lt;td&gt;12.1%&lt;/td&gt;&lt;td&gt;未單列&lt;/td&gt;&lt;td&gt;25.2%&lt;/td&gt;&lt;td&gt;+12.1%&lt;/td&gt;&lt;td&gt;零售低利潤拉低整體&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Apple（營運參考）&lt;/td&gt;&lt;td&gt;硬體為主＋服務&lt;/td&gt;&lt;td&gt;低&lt;/td&gt;&lt;td&gt;33.0%&lt;/td&gt;&lt;td&gt;9.6%&lt;/td&gt;&lt;td&gt;1.9%&lt;/td&gt;&lt;td&gt;+11.7%&lt;/td&gt;&lt;td&gt;資本支出極低，不是 AI 基礎設施的大投資者&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Oracle（營運參考）&lt;/td&gt;&lt;td&gt;資料庫軟體＋雲端基礎設施&lt;/td&gt;&lt;td&gt;高&lt;/td&gt;&lt;td&gt;34.2%&lt;/td&gt;&lt;td&gt;14.2%&lt;/td&gt;&lt;td&gt;105.4%&lt;/td&gt;&lt;td&gt;+29.6%&lt;/td&gt;&lt;td&gt;資本支出超過營收，AI 雲端建設最激進&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;details id=&quot;claims&quot;&gt;&lt;summary&gt;論點檢查：每條判斷的證據狀態&lt;/summary&gt;&lt;div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;依風險分類的主張（證據狀態：支持／部分支持／提出反證／資料不足）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;編號&lt;/th&gt;&lt;th&gt;風險類別&lt;/th&gt;&lt;th&gt;主張&lt;/th&gt;&lt;th&gt;角色&lt;/th&gt;&lt;th&gt;證據狀態&lt;/th&gt;&lt;th&gt;什麼會改變判斷&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;GOOGL-C08&lt;/td&gt;&lt;td&gt;R1 資金與流動性&lt;/td&gt;&lt;td&gt;短期資金來源與到期：現金與有價證券約 2,651 億、循環信用 100 億全數未動用、商業本票餘額 0、一年內到期長期票據約 10 億、2026 年新發票據最早 2028 年到期，對照近四季營運現金流約 1,796 億；資金缺口來自自願擴張而非債務到期。&lt;/td&gt;&lt;td&gt;支持論點&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;單季營運現金流低於資本支出的缺口超過 200 億且商業本票或循環信用餘額轉為正值，或信用評等被調降&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;GOOGL-C09&lt;/td&gt;&lt;td&gt;R2 償債負擔與永久損失&lt;/td&gt;&lt;td&gt;債務負擔相對獲利仍輕：有息負債÷EBITDA 約 0.68、淨負債為負、營運現金流÷有息負債約 1.44；但有息負債九個月內由約 465 億增至約 1,261 億，另有 9,244 億採購承諾、162 億能源設備保證與 66 億 TPU 回購保證等表外義務；期後 2026-11-05 再完成 60 億歐元優先票據（9/30 數字未含）。&lt;/td&gt;&lt;td&gt;支持論點&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;有息負債÷EBITDA 超過 1.5，或淨現金轉為淨負債&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;GOOGL-C01&lt;/td&gt;&lt;td&gt;R3 成長退坡與競爭&lt;/td&gt;&lt;td&gt;搜尋的規模與網路效應仍在：2026 年 9 月全球搜尋市占約 89.9%、查詢量年增率為五年最高，但管理層說 AI Mode 查詢的變現較低對成長有影響，第三季 Search &amp;amp; other 年增由 17% 降到 12%，護城河受考驗而非失守。&lt;/td&gt;&lt;td&gt;支持論點&lt;/td&gt;&lt;td&gt;部分支持&lt;/td&gt;&lt;td&gt;Search &amp;amp; other 年增連兩季低於 8%，或 Statcounter 全球市占跌破 85%；AI Mode 廣告全球擴大後 Search &amp;amp; other 年增回到 15% 以上&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;GOOGL-C04&lt;/td&gt;&lt;td&gt;R3 成長退坡與競爭&lt;/td&gt;&lt;td&gt;成長主要是內生的：第三季營收增加主要來自 Google Cloud 增 156 億（+103%）與 Services 增 93 億（+11%）；Wiz 併購（2026-03 完成）與 TPU 系統銷售的貢獻未單獨揭露，股數增加對每股成長是減項。&lt;/td&gt;&lt;td&gt;支持論點&lt;/td&gt;&lt;td&gt;部分支持&lt;/td&gt;&lt;td&gt;2026 年 10-K 揭露 Wiz 或 TPU 系統銷售占雲端營收增加的一半以上&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;GOOGL-C05&lt;/td&gt;&lt;td&gt;R3 成長退坡與競爭&lt;/td&gt;&lt;td&gt;基準情境成長 25%→8% 的速度有積壓支撐、持續時間靠雲端：營收積壓 5,677 億約 55% 在 24 個月內認列、近四季營收年增 22.2% 且加速；但搜尋放緩後 Services 只剩約一成成長。市價反推（利潤率照基準、其他條件不變）第 1–5 年每年營收年增約 14.5%，低於同類公司次年 p75 17.7%、高於中位 10.2%；另一算法（基準第 5 年利潤率、超額報酬期 10 年）要求每年名目年增約 17.4%，營收 500 億美元以上公司十年實質年增 10% 以上的只占 3.9%（推導）。&lt;/td&gt;&lt;td&gt;支持論點&lt;/td&gt;&lt;td&gt;部分支持&lt;/td&gt;&lt;td&gt;Google Cloud 年增連兩季低於 50%，或雲端積壓季減；雲端積壓季增超過 10% 且 Services 年增回到 13% 以上&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;GOOGL-C14&lt;/td&gt;&lt;td&gt;R3 成長退坡與競爭&lt;/td&gt;&lt;td&gt;反壟斷補救目前以行為規範為主：廣告科技案法院駁回結構性分拆、改命互通、資料存取與競價行為補救（最終判決尚未作出；PPC Land 解讀為六年期並設監督人）；搜尋案最終判決限制分發方式並要求分享搜尋資料，雙方上訴中，影響持續但無法量化。&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;部分支持&lt;/td&gt;&lt;td&gt;搜尋案上訴維持資料分享與預設分發限制，且 Search &amp;amp; other 年增降到個位數；上訴判決撤銷搜尋案資料分享或分發限制（補救範圍轉為縮小）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;GOOGL-C16&lt;/td&gt;&lt;td&gt;R3 成長退坡與競爭&lt;/td&gt;&lt;td&gt;成長空間的證據偏向雲端：Google Cloud 未完成訂單 5,608 億約為其近四季營收的 6.0 倍（推導）；公司不揭露搜尋市占或市場規模，第三方估計全球搜尋市占約九成，搜尋本身的滲透空間有限。&lt;/td&gt;&lt;td&gt;支持論點&lt;/td&gt;&lt;td&gt;部分支持&lt;/td&gt;&lt;td&gt;雲端未完成訂單連兩季下降，或對近四季雲端營收倍數降到 3 倍以下&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;GOOGL-C17&lt;/td&gt;&lt;td&gt;R3 成長退坡與競爭&lt;/td&gt;&lt;td&gt;搜尋仍有定價能力：2026 年第三季付費點擊年增 8%、每次點擊成本年增 4%（前九月 +11%／+4%，FY2025 +6%／+7%），量價同增；但 Network 曝光第三季年減 14%，第三方網站流量在下滑。&lt;/td&gt;&lt;td&gt;支持論點&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;付費點擊與 CPC 同時轉為年減一季&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;GOOGL-C02&lt;/td&gt;&lt;td&gt;R4 投入回報不足&lt;/td&gt;&lt;td&gt;高資本報酬仍明顯高於資金成本：近四季 ROIC 約 37%、近五年中位約 44%，研發資本化後約 31%（7 年）至 32%（5 年）仍遠高於 WACC 9.8%；但近四季增量 ROIC 降到約 16.6%（推算），新一輪 AI 投入的報酬尚待驗證。&lt;/td&gt;&lt;td&gt;支持論點&lt;/td&gt;&lt;td&gt;部分支持&lt;/td&gt;&lt;td&gt;近四季 ROIC 跌破 20%，或增量 ROIC 連兩季低於 WACC&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;GOOGL-C18&lt;/td&gt;&lt;td&gt;R4 投入回報不足&lt;/td&gt;&lt;td&gt;營運槓桿在擴大：2022→2025 增量營業利益率約 45.2%、FY2025→近四季約 40.9%（推導），都高於 FY2025 營業利益率 32.0%；但 AI 資本支出帶來的折舊加速可能壓縮後續增量利潤率。&lt;/td&gt;&lt;td&gt;支持論點&lt;/td&gt;&lt;td&gt;部分支持&lt;/td&gt;&lt;td&gt;近四季營業利益率連兩季下降 2 個百分點以上&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;GOOGL-C19&lt;/td&gt;&lt;td&gt;R4 投入回報不足&lt;/td&gt;&lt;td&gt;指引達成紀錄只能看資本支出：公司不給營收或獲利指引；2026 年資本支出指引第二季由 1,800～1,900 億上修為 1,950～2,050 億、第三季維持，前九月實際 1,320 億約為指引下緣的 68%（推導），2027 年將再顯著增加。&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;2027 年資本支出指引高於 2026 年 50% 以上，且雲端營收年增降到 40% 以下&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;GOOGL-C03&lt;/td&gt;&lt;td&gt;R5 收入與盈餘品質&lt;/td&gt;&lt;td&gt;近四季盈餘大多沒有變成自由現金流：自由現金流 197 億只占稅後營業利益 1,286 億的約 15%，扣股權薪酬 304 億後為負；第三季單季自由現金流約 −91 億，2026 年以發債與發股補足，每股價值暫時靠外部融資撐住。&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;連兩季單季營運現金流高於資本支出，且 2027 年資本支出指引增幅低於營運現金流增幅；2027 年資本支出指引顯著高於 2026 年且營運現金流未同步成長&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;GOOGL-C10&lt;/td&gt;&lt;td&gt;R5 收入與盈餘品質&lt;/td&gt;&lt;td&gt;部分雲端成長的收入品質低於一般訂閱：TPU 系統銷售附多年回購選擇權（按退貨權處理，回購保證最高 66 億；公司稱交易對手沒有行使的經濟誘因，公司說法），積壓含關聯方 Crux AI 168 億，Crux AI 據報以晶片擔保借款 220 億；存貨增至 133 億主要是待售 TPU 硬體，屬有解釋的警訊。&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;部分支持&lt;/td&gt;&lt;td&gt;10-Q／10-K 揭露 TPU 回購實際發生、退貨備抵增加，或 Crux AI 積壓延後認列；TPU 系統營收單獨揭露且回購保證金額下降&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;GOOGL-C11&lt;/td&gt;&lt;td&gt;R5 收入與盈餘品質&lt;/td&gt;&lt;td&gt;申報 EPS 被權益證券未實現利益墊高：近四季申報淨利每股約 19.1 美元，核心 EPS 10.42；SpaceX 持股 9 月底帳列 752 億、第三季有價及其他權益證券未實現損失約 124 億，業外損益波動大，本益比與 PEG 一律用核心 EPS。&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;申報與核心 EPS 的差距連四季低於 7%（權益證券損益轉為接近零）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;GOOGL-C13&lt;/td&gt;&lt;td&gt;R6 治理與資料可信度&lt;/td&gt;&lt;td&gt;治理風險主要是雙層股權：創辦人透過 B 股合計約 52.7% 投票權（推算），外部股東難以約束資本配置；內部人交易沒有異常：Brin 2026-08-07 Form 4 的 C 代碼是 B 股轉 A 股後贈與，近 6 個月公開市場賣出全屬 10b5-1 計畫、買進 0。&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;創辦人或高管出現非 10b5-1 的公開市場賣出且單人半年合計超過 1 億美元，或發行新的低投票權股票&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;GOOGL-C06&lt;/td&gt;&lt;td&gt;R7 估值與市場預期&lt;/td&gt;&lt;td&gt;現價 283.72 高於基準情境每股 226.20，落在合理價值區間 204.71–296.61 的上半段（中點 243.49）：市價要求基準以上的前提——成長照基準時，第 1 年起每年（含永續期）營業利益率約 37.6%（基準穩態 31%）；或以基準第 5 年利潤率 32% 計，超額報酬期 10 年每年營收名目年增約 17.4%（營收 500 億美元以上公司十年實質年增 10% 以上的只占 3.9%），兩者擇一而非同時成立。核心本益比 27.2 倍略高於去扭曲歷史 p75 26.7 倍；基準情境現價隱含年報酬 8.6%（非預期報酬）低於 WACC 9.8%，價格位置合理、不屬便宜。&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;基準情境的成長或利潤率依新財報上修到接近市價隱含水準（例如營收年增連四季 ≥ 22% 且營業利益率 ≥ 35%）；收盤價高於合理價值高端（本輪 296.61）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;GOOGL-C07&lt;/td&gt;&lt;td&gt;R7 估值與市場預期&lt;/td&gt;&lt;td&gt;PEG 第一口徑 0.82 的便宜不成立：33.3% 成長率是申報 EPS（含權益證券利益）三年年增，配核心本益比 27.2 倍屬口徑混用；改用核心 EPS 三年年增約 22.4%（推算）PEG 約 1.2，基準情境推估口徑 PEG 2.1，且低 PEG 反映的是高再投資需求下的成長。&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;核心 EPS 近四季年增持續 25% 以上且資本支出占營收比率下降&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;GOOGL-C15&lt;/td&gt;&lt;td&gt;R8 宏觀與共同曝險&lt;/td&gt;&lt;td&gt;AI 基礎設施需求是產業共同曝險：大型雲端業者同時擴張（微軟下調、Alphabet 維持指引），新雲端夥伴交付延遲，大客戶與合資的融資進度影響積壓認列；若 AI 需求放緩，雲端積壓、TPU 銷售與資本支出回收會同時受壓，且採購承諾使支出難以快速下修。&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;部分支持&lt;/td&gt;&lt;td&gt;大型雲端業者合計資本支出指引轉為下修，或 Google Cloud 積壓季增轉為負值&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;GOOGL-C12&lt;/td&gt;&lt;td&gt;R9 稀釋與股東回饋&lt;/td&gt;&lt;td&gt;2026 年由回購轉為增資：前九月回購為 0，改以普通股公開發行、波克夏私募、ATM 與強制轉換特別股籌資，近一年股數增加、淨回購為負；財務長稱除支應股權薪酬稅負的 ATM 外暫不再發股，稀釋有上限線索但不是承諾。&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;以 2026-09-30 流通股 12,294 百萬股為基準，新發行普通股或可轉換證券使流通股再增加超過 1%；恢復淨回購（回購大於股權薪酬）連兩季&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;並列：研究評等 生意品質良好 ／ 價格合理（在市場常態內）；價格位置 合理；現價隱含年報酬（基準情境，非預期報酬） 8.6%。各列狀態與價格分開呈現，不合成分數，狀態件數也不代表強弱（非買賣建議）。&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;details id=&quot;risks-more&quot;&gt;&lt;summary&gt;其他風險與改判條件（超過首頁上限的部分）&lt;/summary&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;risk-tbl&quot; style=&quot;min-width:0;width:100%&quot;&gt;&lt;tr&gt;&lt;th style=&quot;white-space:normal;width:64%&quot;&gt;情況（看哪個指標、門檻多少）&lt;/th&gt;&lt;th style=&quot;white-space:normal;width:22%&quot;&gt;會改變什麼判斷&lt;/th&gt;&lt;th style=&quot;white-space:normal;width:14%&quot;&gt;歷史基準比率&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;反壟斷：搜尋案限制分發並要求分享資料，雙方上訴中，影響無法量化&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;未設門檻：持續觀察&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;獲利品質：申報淨利含權益證券評價損益，本報告改用核心 EPS（每股盈餘）&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;未設門檻：持續觀察&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/details&gt;&lt;details id=&quot;glossary&quot;&gt;&lt;summary&gt;名詞小抄&lt;/summary&gt;&lt;dl class=&quot;gl&quot;&gt;&lt;dt id=&quot;g0&quot;&gt;近四季（TTM）&lt;/dt&gt;&lt;dd&gt;最近四個季度加總，比單一財年更新。&lt;/dd&gt;&lt;dt id=&quot;g1&quot;&gt;核心每股盈餘（核心 EPS）&lt;/dt&gt;&lt;dd&gt;營業利益扣稅後除以稀釋股數，排除 SpaceX 等權益證券的評價損益；本報告為 10.42 美元。&lt;/dd&gt;&lt;dt id=&quot;g2&quot;&gt;營收積壓（revenue backlog）&lt;/dt&gt;&lt;dd&gt;已簽約、還沒認列為營收的金額，不含可取消的合約。&lt;/dd&gt;&lt;dt id=&quot;g3&quot;&gt;TPU（Tensor Processing Unit）&lt;/dt&gt;&lt;dd&gt;Google 自研的 AI 運算晶片，自用、在雲端出租，2026 年起也直接把整套系統賣給企業。&lt;/dd&gt;&lt;dt id=&quot;g4&quot;&gt;流量取得成本（TAC）&lt;/dt&gt;&lt;dd&gt;Google 付給把搜尋流量導過來的夥伴（手機、瀏覽器、網站）的分成。&lt;/dd&gt;&lt;dt id=&quot;g5&quot;&gt;AI 模式（AI Mode）&lt;/dt&gt;&lt;dd&gt;Google 搜尋裡用 AI 對話方式回答問題的功能，廣告變現目前低於傳統搜尋。&lt;/dd&gt;&lt;dt id=&quot;g6&quot;&gt;投入資本報酬率（ROIC）&lt;/dt&gt;&lt;dd&gt;稅後營業利益 ÷ 營運投入資本：每投入 1 元一年賺多少。&lt;/dd&gt;&lt;dt id=&quot;g7&quot;&gt;增量 ROIC&lt;/dt&gt;&lt;dd&gt;新增的稅後營業利益 ÷ 新增的投入資本：新投資的回報。&lt;/dd&gt;&lt;dt id=&quot;g8&quot;&gt;資本支出（capex）&lt;/dt&gt;&lt;dd&gt;買伺服器、蓋資料中心等長期資產的支出。&lt;/dd&gt;&lt;dt id=&quot;g9&quot;&gt;自由現金流（FCF）&lt;/dt&gt;&lt;dd&gt;營運現金流扣掉資本支出，公司真正能自由分配的現金。&lt;/dd&gt;&lt;dt id=&quot;g10&quot;&gt;現金流折現（FCFF）&lt;/dt&gt;&lt;dd&gt;把公司未來每年可分配給股東與債權人的現金，用資金成本折回今天的估值法。&lt;/dd&gt;&lt;dt id=&quot;g11&quot;&gt;加權平均資金成本（WACC）&lt;/dt&gt;&lt;dd&gt;股東與債權人要求報酬的加權平均，本報告約 9.8%。&lt;/dd&gt;&lt;dt id=&quot;g12&quot;&gt;銷售對資本比&lt;/dt&gt;&lt;dd&gt;每多投入 1 美元資本，能多帶來多少營收；越低代表越吃資本。&lt;/dd&gt;&lt;dt id=&quot;g13&quot;&gt;終值占比&lt;/dt&gt;&lt;dd&gt;估值中來自明確預測期之後的比重，越高越依賴遠期假設。&lt;/dd&gt;&lt;dt id=&quot;g14&quot;&gt;本益比（P/E）&lt;/dt&gt;&lt;dd&gt;股價 ÷ 每股盈餘；本報告用核心 EPS 計算。&lt;/dd&gt;&lt;dt id=&quot;g15&quot;&gt;本益比對成長比（PEG）&lt;/dt&gt;&lt;dd&gt;本益比 ÷ 盈餘年成長率（百分點）；林區認為約 1 算合理，但成長率要和本益比用同一口徑。&lt;/dd&gt;&lt;dt id=&quot;g16&quot;&gt;股東收益率&lt;/dt&gt;&lt;dd&gt;股利殖利率＋回購殖利率，也就是公司每年用現金回饋股東的比率。&lt;/dd&gt;&lt;dt id=&quot;g17&quot;&gt;股債利差&lt;/dt&gt;&lt;dd&gt;盈餘殖利率（每股盈餘 ÷ 股價）減 10 年期公債殖利率；越低代表股票相對公債越貴。&lt;/dd&gt;&lt;dt id=&quot;g18&quot;&gt;強制轉換特別股&lt;/dt&gt;&lt;dd&gt;到期必須轉成普通股的特別股，等於延後的增資。&lt;/dd&gt;&lt;dt id=&quot;g19&quot;&gt;ATM 增資（at-the-market）&lt;/dt&gt;&lt;dd&gt;公司依市價分批在市場上賣新股。&lt;/dd&gt;&lt;dt id=&quot;g20&quot;&gt;三類股&lt;/dt&gt;&lt;dd&gt;A 股一股一票、B 股一股十票（創辦人持有）、C 股無表決權。&lt;/dd&gt;&lt;dt id=&quot;g21&quot;&gt;預設交易計畫（10b5-1）&lt;/dt&gt;&lt;dd&gt;內部人事先登記、依規則自動執行的買賣計畫，用來避免內線交易疑慮。&lt;/dd&gt;&lt;/dl&gt;&lt;/details&gt;&lt;details id=&quot;numbers-table&quot;&gt;&lt;summary&gt;完整數字表格：三大報表摘要（年度與 8 季，供查；圖在正文「完整數字」）&lt;/summary&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:14px&quot;&gt;損益表（年度與近四季）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;億美元&lt;/th&gt;&lt;th&gt;FY22&lt;/th&gt;&lt;th&gt;FY23&lt;/th&gt;&lt;th&gt;FY24&lt;/th&gt;&lt;th&gt;FY25&lt;/th&gt;&lt;th&gt;近四季&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;營收&lt;/td&gt;&lt;td&gt;2,828&lt;/td&gt;&lt;td&gt;3,074&lt;/td&gt;&lt;td&gt;3,500&lt;/td&gt;&lt;td&gt;4,028&lt;/td&gt;&lt;td&gt;4,711&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;毛利&lt;/td&gt;&lt;td&gt;1,566&lt;/td&gt;&lt;td&gt;1,741&lt;/td&gt;&lt;td&gt;2,037&lt;/td&gt;&lt;td&gt;2,403&lt;/td&gt;&lt;td&gt;2,867&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;研發費用&lt;/td&gt;&lt;td&gt;395&lt;/td&gt;&lt;td&gt;454&lt;/td&gt;&lt;td&gt;493&lt;/td&gt;&lt;td&gt;611&lt;/td&gt;&lt;td&gt;745&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;營業利益&lt;/td&gt;&lt;td&gt;748&lt;/td&gt;&lt;td&gt;843&lt;/td&gt;&lt;td&gt;1,124&lt;/td&gt;&lt;td&gt;1,290&lt;/td&gt;&lt;td&gt;1,570&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;利息費用&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;稅前利益&lt;/td&gt;&lt;td&gt;713&lt;/td&gt;&lt;td&gt;857&lt;/td&gt;&lt;td&gt;1,198&lt;/td&gt;&lt;td&gt;1,588&lt;/td&gt;&lt;td&gt;2,876&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;所得稅&lt;/td&gt;&lt;td&gt;114&lt;/td&gt;&lt;td&gt;119&lt;/td&gt;&lt;td&gt;197&lt;/td&gt;&lt;td&gt;267&lt;/td&gt;&lt; &lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;div class=&quot;wrap&quot;&gt;&lt;div class=&quot;top&quot;&gt;&lt;span&gt;&lt;b&gt;Alphabet（Google 母公司）（GOOGL）&lt;/b&gt;｜商業評估&lt;/span&gt;&lt;span&gt;資料截止 2026-11-16｜基準季 2026-09-30｜&lt;a href=&quot;報告.html&quot;&gt;估值報告（另頁）&lt;/a&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;hero&quot;&gt;&lt;div&gt;&lt;div class=&quot;eyebrow&quot;&gt;商業評估｜數位平台／廣告加雲端&lt;/div&gt;&lt;h1&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;搜尋廣告仍是利潤主體但第三季增速放慢到 12%，Google 雲端（含 TPU 系統銷售）第三季年增約一倍成為第二具引擎；模式成立，卡點在 AI 搜尋變現，以及前九月營運現金流已不夠支應的資本投入能否換回成長。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src2&quot;&gt;[2]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src3&quot;&gt;[3]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src4&quot;&gt;[4]&lt;/a&gt;&lt;/sup&gt;&lt;/h1&gt;&lt;p class=&quot;lead&quot;&gt;本頁只用官方文件、財報與新聞，回答商業模式是否成立、成長點在哪、是否卡住、未來怎麼變、週期多久。&lt;b&gt;不含價格、估值或任何買賣建議&lt;/b&gt;，也不影響估值報告的研究評等。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;gradebox&quot;&gt;&lt;div class=&quot;lab&quot;&gt;商業動能（五級 A–E；原名「商業評估等級」，2026-11-17 改名）&lt;span class=&quot;ruleok&quot;&gt;評分規則第一版，2026-11-07 核定&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;g&quot;&gt;B&lt;small&gt;級&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;加權分 3.85／5｜相對同業：MSFT、META、AMZN&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;模式成立，有一兩個需要追蹤的卡點&lt;/div&gt;&lt;div class=&quot;note&quot;&gt;商業評估等級（A–E 五級）只看商業模式是否成立、成長是否卡住、週期在哪，相對同產業卡同業評比；它不是估值報告研究評等裡的「生意品質 A／B／C」（那是看護城河、投入資本報酬、現金流品質、資產負債表與治理的絕對標準），不進研究評等、不影響估值、不涉任何價格。&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;nav class=&quot;qnav&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;&lt;a href=&quot;#s0&quot;&gt;重點&lt;/a&gt;&lt;a href=&quot;#s1&quot;&gt;1 商業輪廓&lt;/a&gt;&lt;a href=&quot;#s2&quot;&gt;2 說的 vs 做的&lt;/a&gt;&lt;a href=&quot;#s3&quot;&gt;3 成長與卡點&lt;/a&gt;&lt;a href=&quot;#sa&quot;&gt;4 優勢與持續期間&lt;/a&gt;&lt;a href=&quot;#s4&quot;&gt;5 生命週期&lt;/a&gt;&lt;a href=&quot;#s5&quot;&gt;6 週期&lt;/a&gt;&lt;a href=&quot;#s6&quot;&gt;7 觀察清單&lt;/a&gt;&lt;a href=&quot;#sg&quot;&gt;等級明細&lt;/a&gt;&lt;a href=&quot;#src&quot;&gt;出處&lt;/a&gt;&lt;/div&gt;&lt;/nav&gt;&lt;div class=&quot;wrap&quot;&gt;&lt;section id=&quot;s0&quot;&gt;&lt;h2&gt;一眼看重點&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;先看等級怎麼來、這頁的證據有多扎實；細節在下面各節。&lt;/p&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;等級怎麼來：五個面向&lt;/figcaption&gt;&lt;svg viewBox=&quot;0 0 640 260&quot; role=&quot;img&quot; aria-label=&quot;商業評估等級五面向：作者分與機械建議分&quot;&gt;&lt;line x1=&quot;150.0&quot; x2=&quot;150.0&quot; y1=&quot;20&quot; y2=&quot;232&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;150.0&quot; y=&quot;250&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;1 分&lt;/text&gt;&lt;line x1=&quot;255.0&quot; x2=&quot;255.0&quot; y1=&quot;20&quot; y2=&quot;232&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;255.0&quot; y=&quot;250&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;2 分&lt;/text&gt;&lt;line x1=&quot;360.0&quot; x2=&quot;360.0&quot; y1=&quot;20&quot; y2=&quot;232&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;360.0&quot; y=&quot;250&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;3 分&lt;/text&gt;&lt;line x1=&quot;465.0&quot; x2=&quot;465.0&quot; y1=&quot;20&quot; y2=&quot;232&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;465.0&quot; y=&quot;250&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;4 分&lt;/text&gt;&lt;line x1=&quot;570.0&quot; x2=&quot;570.0&quot; y1=&quot;20&quot; y2=&quot;232&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;570.0&quot; y=&quot;250&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;5 分&lt;/text&gt;&lt;text x=&quot;140&quot; y=&quot;55.0&quot; class=&quot;lb&quot; text-anchor=&quot;end&quot;&gt;模式穩固度&lt;tspan class=&quot;ax&quot;&gt; 25%&lt;/tspan&gt;&lt;/text&gt;&lt;rect x=&quot;150.0&quot; y=&quot;43.0&quo class=&quot;vl&quot;&gt;3&lt;tspan class=&quot;ax&quot;&gt;（機械 4）&lt;/tspan&gt;&lt;/text&gt;&lt;text x=&quot;140&quot; y=&quot;215.0&quot; class=&quot;lb&quot; text-anchor=&quot;end&quot;&gt;說法可信度&lt;tspan class=&quot;ax&quot;&gt; 15%&lt;/tspan&gt;&lt;/text&gt;&lt;rect x=&quot;150.0&quot; y=&quot;203.0&quot; width=&quot;315.0&quot; height=&quot;14&quot; rx=&quot;3&quot; fill=&quot;var(--biz)&quot; opacity=&quot;.85&quot;/&gt;&lt;path d=&quot;M465.0,198.0 l6,-8 h-12z&quot; fill=&quot;var(--accent)&quot;&gt;&lt;title&gt;機械建議 4&lt;/title&gt;&lt;/path&gt;&lt;text x=&quot;473.0&quot; y=&quot;215.0&quot; class=&quot;vl&quot;&gt;4&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;lg&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--biz)&quot;&gt;&lt;/i&gt;作者分&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--accent)&quot;&gt;&lt;/i&gt;機械建議分&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;藍條是作者分（1–5），橘色三角是工具的機械建議分；兩者不同的面向在等級明細寫了偏離理由。加權分 3.85 → B 級（A ≥ 4.2、B ≥ 3.5、C ≥ 2.8、D ≥ 2.1）。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估、權重、機械建議）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;這頁的句子有多少是事實&lt;/figcaption&gt;&lt;svg viewBox=&quot;0 0 640 58&quot; role=&quot;img&quot; aria-label=&quot;句子標記組成&quot;&gt;&lt;rect x=&quot;4.0&quot; y=&quot;6&quot; width=&quot;419.6&quot; height=&quot;26&quot; fill=&quot;var(--biz)&quot;&gt;&lt;title&gt;事實 79&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;213.8&quot; y=&quot;24&quot; class=&quot;inb&quot; text-anchor=&quot;middle&quot;&gt;事實 79&lt;/text&gt;&lt;rect x=&quot;423.6&quot; y=&quot;6&quot; width=&quot;132.8&quot; height=&quot;26&quot; fill=&quot;var(--accent)&quot;&gt;&lt;title&gt;推論 25&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;489.9&quot; y=&quot;24&quot; class=&quot;inb&quot; text-anchor=&quot;middle&quot;&gt;推論 25&lt;/text&gt;&lt;rect x=&quot;556.3&quot; y=&quot;6&quot; width=&quot;58.4&quot; height=&quot;26&quot; fill=&quot;var(--c6)&quot;&gt;&lt;title&gt;作者判斷 11&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;614.8&quot; y=&quot;6&quot; width=&quot;21.2&quot; height=&quot;26&quot; fill=&quot;var(--neg)&quot;&gt;&lt;title&gt;待查 4&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;4&quot; y=&quot;52&quot; class=&quot;ax&quot;&gt;合計 119&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;lg&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--biz)&quot;&gt;&lt;/i&gt;事實 79&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--accent)&quot;&gt;&lt;/i&gt;推論 25&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c6)&quot;&gt;&lt;/i&gt;作者判斷 11&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--neg)&quot;&gt;&lt;/i&gt;待查 4&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;全頁句子依標記分類：事實（原文或財報直接寫的）占 66%；推論與作者判斷是從事實推出或取捨的結論，待查是找不到證據的地方。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/section&gt;&lt;section id=&quot;s1&quot;&gt;&lt;h2&gt;1　商業輪廓：賣什麼、賣給誰、怎麼收錢&lt;/h2&gt;&lt;div&gt;&lt;span class=&quot;chip&quot;&gt;廣告（點擊與曝光計費的效果型與品牌廣告）&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;雲端消費量計費&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;訂閱&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;一次性商品銷售（裝置、TPU 系統）&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;抽成（Google Play 應用內購買）&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cards c3&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;賣什麼&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;Google 服務分部含廣告、Android、Chrome、消費性裝置、地圖、Google Play、搜尋與 YouTube，收入主要來自廣告，另有消費者訂閱、應用程式與應用內購買、裝置銷售。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src5&quot;&gt;[5]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;Google 雲端分部賣基礎設施與平台服務、Workspace 協作工具與其他企業服務；產品收入主要是出售 TPU 系統（硬體、軟體、安裝與保固）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src6&quot;&gt;[6]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src7&quot;&gt;[7]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;賣給誰&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;付錢的是廣告主、企業與開發者（雲端）、消費者（訂閱與裝置）；2023–2025 年沒有任何單一客戶或關係企業群占營收 10% 以上。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src8&quot;&gt;[8]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src9&quot;&gt;[9]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;第三季依客戶地址：美國 676.81 億美元占 53%、歐洲中東非洲 26%、亞太 16%、其他美洲 5%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src10&quot;&gt;[10]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;少見的集中點：營收積壓含與關聯方 Crux AI（未合併的權益法合資）的多年合約 168 億。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src11&quot;&gt;[11]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;怎麼收錢&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;搜尋廣告看付費點擊數與每次點擊價格，聯播網廣告看曝光數與每次曝光價格；第三季付費點擊年增 8%、每次點擊價格年增 4%，聯播網曝光年減 14%、每次曝光價格年增 14%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src12&quot;&gt;[12]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src13&quot;&gt;[13]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;雲端服務在客戶實際使用時依用量認列，訂閱制在合約期間平均認列；TPU 系統硬體在交付控制權時認列，部分合約附預設價格的多年回購選擇權，按退貨權處理。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src14&quot;&gt;[14]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src7&quot;&gt;[7]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;Android 應用內付費經 Google 金流時，Match Group 揭露訂閱一般要付 Google 最高 15% 的分成。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src15&quot;&gt;[15]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;callout&quot;&gt;&lt;b&gt;解讀&lt;/b&gt;&lt;p class=&quot;s&quot;&gt;第三季總營收 1,275.77 億美元：搜尋與其他 633.50 億、YouTube 廣告 112.07 億、聯播網 74.55 億（三者合計廣告 820.12 億，約占 64%，推算）、訂閱平台與裝置 142.90 億、雲端 307.09 億（約占 24%，推算）、其他事業 3.72 億；廣告是 Google 服務的下層細項，不可與 Google 服務合計重複加總。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;第三季年增：搜尋與其他 +12.0%、YouTube 廣告 +9.2%、聯播網 +1.4%、訂閱平台與裝置 +11.0%、雲端 +102.6%（推算）；總營收多出約 252 億中雲端占約 156 億，成長重心已由廣告移到雲端。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src16&quot;&gt;[16]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;分部營業利益第三季：Google 服務 391.57 億、雲端 111.21 億、其他事業 −20.47 億、集團層級 −76.55 億；利潤主體仍是服務分部。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src2&quot;&gt;[2]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;費用率：本期對去年同期（2026-09-30 (Q3)）&lt;/figcaption&gt;&lt;svg viewBox=&quot;0 0 640 186&quot; role=&quot;img&quot; aria-label=&quot;費用率本期與去年同期&quot;&gt;&lt;line x1=&quot;110.0&quot; x2=&quot;110.0&quot; y1=&quot;16&quot; y2=&quot;162&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;110.0&quot; y=&quot;178&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;0%&lt;/text&gt;&lt;line x1=&quot;212.5&quot; x2=&quot;212.5&quot; y1=&quot;16&quot; y2=&quot;162&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;212.5&quot; y=&quot;178&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;20%&lt;/text&gt;&lt;line x1=&quot;315.0&quot; x2=&quot;315.0&quot; y1=&quot;16&quot; y2=&quot;162&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;315.0&quot; y=&quot;178&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;40%&lt;/text&gt;&lt;line x1=&quot;417.5&quot; x2=&quot;417.5&quot; y1=&quot;16&quot; y2=&quot;162&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;417.5&quot; y=&quot;178&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;60%&lt;/text&gt;&lt;line x1=&quot;520.0&quot; x2=&quot;520.0&quot; y1=&quot;16&quot; y2=&quot;162&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;520.0&quot; y=&quot;178&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;80%&lt;/text&gt;&lt;text x=&quot;102&quot; y=&quot;40.0&quot; class=&quot;lb s&quot; text-anchor=&quot;end&quot;&gt;毛利率&lt;/text&gt;&lt;line x1=&quot;415.3&quot; x2=&quot;416.0&quot; y1=&quot;35.0&quot; y2=&quot;35.0&quot; stroke=&quot;var(--biz)&quot; stroke-width=&quot;3&quot; opacity=&quot;.5&quot;/&gt;&lt;circle cx=&quot;415.3&quot; cy=&quot;35.0&quot; r=&quot;5&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;去年同期 59.6%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;416.0&quot; cy=&quot;35.0&quot; r=&quot;5.5&quot; fill=&quot;var(--biz)&quot;&gt;&lt;title&gt;本期 59.7%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;426.0&quot; y=&quot;40.0&quot; class=&quot;vl s&quot;&gt;59.7%&lt;tspan class=&quot;ax&quot;&gt; +0.1 點&lt;/tspan&gt;&lt;/text&gt;&lt;text x=&quot;102&quot; y=&quot;74.0&quot; class=&quot;lb s&quot; text-anchor=&quot;end&quot;&gt;業務費用率&lt;/text&gt;&lt;line x1=&quot;146.1&quot; x2=&quot;145.4&quot; y1=&quot;69.0&quot; y2=&quot;69.0&quot; stroke=&quot;var(--biz)&quot; stroke-width=&quot;3&quot; opacity=&quot;.5&quot;/&gt;&lt;circle cx=&quot;146.1&quot; cy=&quot;69.0&quot; r=&quot;5&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;去年同期 7.0%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;145.4&quot; cy=&quot;69.0&quot; r=&quot;5.5&quot; fill=&quot;var(--biz)&quot;&gt;&lt;title&gt;本期 6.9%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;156.1&quot; y=&quot;74.0&quot; class=&quot;vl s&quot;&gt;6.9%&lt;tspan class=&quot;ax&quot;&gt; -0.1 點&lt;/tspan&gt;&lt;/text&gt;&lt;text x=&quot;102&quot; y=&quot;108.0&quot; class=&quot;lb s&quot; text-anchor=&quot;end&quot;&gt;銷管費用率&lt;/text&gt;&lt;line x1=&quot;183.1&quot; x2=&quot;170.0&quot; y1=&quot;103.0&quot; y2=&quot;103.0&quot; stroke=&quot;var(--biz)&quot; stroke-width=&quot;3&quot; opacity=&quot;.5&quot;/&gt;&lt;circle cx=&quot;183.1&quot; cy=&quot;103.0&quot; r=&quot;5&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;去年同期 14.3%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;170.0&quot; cy=&quot;103.0&quot; r=&quot;5.5&quot; fill=&quot;var(--biz)&quot;&gt;&lt;title&gt;本期 11.7%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;193.1&quot; y=&quot;108.0&quot; class=&quot;vl s&quot;&gt;11.7%&lt;tspan class=&quot;ax&quot;&gt; -2.6 點&lt;/tspan&gt;&lt;/text&gt;&lt;text x=&quot;102&quot; y=&quot;142.0&quot; class=&quot;lb s&quot; text-anchor=&quot;end&quot;&gt;研發率&lt;/text&gt;&lt;line x1=&quot;185.8&quot; x2=&quot;192.9&quot; y1=&quot;137.0&quot; y2=&quot;137.0&quot; stroke=&quot;var(--neg)&quot; stroke-width=&quot;3&quot; opacity=&quot;.5&quot;/&gt;&lt;circle cx=&quot;185.8&quot; cy=&quot;137.0&quot; r=&quot;5&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;去年同期 14.8%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;192.9&quot; cy=&quot;137.0&quot; r=&quot;5.5&quot; fill=&quot;var(--neg)&quot;&gt;&lt;title&gt;本期 16.2%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;202.9&quot; y=&quot;142.0&quot; class=&quot;vl s&quot;&gt;16.2%&lt;tspan class=&quot;ax&quot;&gt; +1.4 點&lt;/tspan&gt;&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;lg&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--biz)&quot;&gt;&lt;/i&gt;本期&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--muted)&quot;&gt;&lt;/i&gt;去年同期&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--neg)&quot;&gt;&lt;/i&gt;變差超過 1 點&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;空心點是去年同期、實心點是本期，右側是變化（百分點）；費用率升或毛利率降超過 1 點標紅。分母是含全部收入的營收。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估底稿）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/section&gt;&lt;section id=&quot;s2&quot;&gt;&lt;h2&gt;2　商業模式驗證：說的 vs 做的&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;管理層在 10-K、10-Q、8-K 的說法，對照財報數字。判定：已驗證／部分支持／說法未獲數字支持／待查。&lt;/p&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;說的 vs 做的：判定分布&lt;/figcaption&gt;&lt;svg viewBox=&quot;0 0 640 58&quot; role=&quot;img&quot; aria-label=&quot;說的vs做的判定&quot;&gt;&lt;rect x=&quot;4.0&quot; y=&quot;6&quot; width=&quot;158.0&quot; height=&quot;26&quot; fill=&quot;var(--pos)&quot;&gt;&lt;title&gt;已驗證 1&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;83.0&quot; y=&quot;24&quot; class=&quot;inb&quot; text-anchor=&quot;middle&quot;&gt;已驗證 1&lt;/text&gt;&lt;rect x=&quot;162.0&quot; y=&quot;6&quot; width=&quot;474.0&quot; height=&quot;26&quot; fill=&quot;var(--warn)&quot;&gt;&lt;title&gt;部分支持 3&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;399.0&quot; y=&quot;24&quot; class=&quot;inb&quot; text-anchor=&quot;middle&quot;&gt;部分支持 3&lt;/text&gt;&lt;text x=&quot;4&quot; y=&quot;52&quot; class=&quot;ax&quot;&gt;合計 4&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;lg&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--pos)&quot;&gt;&lt;/i&gt;已驗證 1&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--warn)&quot;&gt;&lt;/i&gt;部分支持 3&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;管理層 4 條說法對照財報數字的結果；3 條不是「已驗證」，下方用色框標出（有問題的證據）。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;div class=&quot;callout warnc&quot;&gt;&lt;b&gt;有問題的證據（判定不是「已驗證」）&lt;/b&gt;&lt;ul class=&quot;badl&quot;&gt;&lt;li&gt;&lt;a href=&quot;#cl2&quot;&gt;搜尋動能&lt;/a&gt; &lt;span class=&quot;v v-部分支持&quot;&gt;部分支持&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a href=&quot;#cl3&quot;&gt;營收積壓（口徑擴大）&lt;/a&gt; &lt;span class=&quot;v v-部分支持&quot;&gt;部分支持&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a href=&quot;#cl4&quot;&gt;資本支出計畫&lt;/a&gt; &lt;span class=&quot;v v-部分支持&quot;&gt;部分支持&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;div class=&quot;cards&quot;&gt;&lt;div class=&quot;card claim cv-已驗證&quot; id=&quot;cl1&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;雲端加速&lt;/b&gt;&lt;span class=&quot;v v-已驗證&quot;&gt;已驗證&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;管理層說法&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;執行長在第三季法說會說：Google Cloud revenues grew 103%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src17&quot;&gt;[17]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對照數字&lt;/div&gt;&lt;ul class=&quot;ev&quot;&gt;&lt;li class=&quot;s&quot;&gt;10-Q 雲端第三季營收 307.09 億，去年同期 151.57 億，年增 102.6%（推算）；增加的 156 億主要來自 GCP 基礎設施與平台服務，以及 TPU 系統銷售。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src16&quot;&gt;[16]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;li class=&quot;s&quot;&gt;雲端分部營業利益由 35.94 億增到 111.21 億，利益率由約 23.7% 升到約 36.2%（推算）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src2&quot;&gt;[2]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;lbl&quot;&gt;說明&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;營收數字與申報一致；但其中含一次認列的 TPU 系統硬體銷售，10-Q 沒有單獨揭露金額，所以服務型雲端的內生增速無法從申報拆出。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src16&quot;&gt;[16]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src7&quot;&gt;[7]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card claim cv-部分支持&quot; id=&quot;cl2&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;搜尋動能&lt;/b&gt;&lt;span class=&quot;v v-部分支持&quot;&gt;部分支持&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;管理層說法&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;執行長說 Search has strong momentum，查詢量年增率是五年來最高。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src17&quot;&gt;[17]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對照數字&lt;/div&gt;&lt;ul class=&quot;ev&quot;&gt;&lt;li class=&quot;s&quot;&gt;搜尋與其他營收第三季 633.50 億、年增 12.0%（推算），第二季 632.71 億、年增 16.8%（推算）；付費點擊第三季年增 8%、前九月 11%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src18&quot;&gt;[18]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src13&quot;&gt;[13]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;li class=&quot;s&quot;&gt;業務長在同一場法說會說 AI Mode 查詢成長強，但 AI Mode 的變現較低，對本季有影響。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src19&quot;&gt;[19]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;lbl&quot;&gt;說明&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;查詢量申報沒有揭露、無法核對；可核對的搜尋營收增速由第二季約 17% 降到第三季 12%，付費點擊也比前九月平均放慢，代表查詢增加沒有同比例轉成營收。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src18&quot;&gt;[18]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src13&quot;&gt;[13]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src19&quot;&gt;[19]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card claim cv-部分支持&quot; id=&quot;cl3&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;營收積壓（口徑擴大）&lt;/b&gt;&lt;span class=&quot;v v-部分支持&quot;&gt;部分支持&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;管理層說法&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;財務長第二季法說會說，雲端積壓季增逾 500 億、達 5,140 億，大部分是一般 GCP 合約，預計總積壓略多於 50% 在 24 個月內認列。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src20&quot;&gt;[20]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src21&quot;&gt;[21]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對照數字&lt;/div&gt;&lt;ul class=&quot;ev&quot;&gt;&lt;li class=&quot;s&quot;&gt;10-Q：2026-09-30 營收積壓 5,677 億，其中雲端 5,608 億，預計略多於 55% 在 24 個月內認列；2026 年第一季起改把原始合約期一年以內的合約也算進積壓；其中 168 億來自關聯方 Crux AI。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src11&quot;&gt;[11]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;li class=&quot;s&quot;&gt;2025-12-31 舊口徑營收積壓為 2,428 億。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src22&quot;&gt;[22]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;lbl&quot;&gt;說明&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;積壓確實大增，但同時有口徑擴大與關聯方合約兩個因素，與舊口徑的年增比較（底稿 RPO 年增約 260%）不是同口徑，不能全部當成需求增加。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src11&quot;&gt;[11]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src23&quot;&gt;[23]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card claim cv-部分支持&quot; id=&quot;cl4&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;資本支出計畫&lt;/b&gt;&lt;span class=&quot;v v-部分支持&quot;&gt;部分支持&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;管理層說法&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;報導：Alphabet 第二季把 2026 年資本支出指引上調到 1,950–2,050 億，第三季維持；財務長說 We continue to expect our capex to increase significantly in 2027。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src24&quot;&gt;[24]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對照數字&lt;/div&gt;&lt;ul class=&quot;ev&quot;&gt;&lt;li class=&quot;s&quot;&gt;10-Q：前九月資本支出 1,320 億（去年同期 636 億）；前九月折舊 220 億（去年同期 151 億）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src4&quot;&gt;[4]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;li class=&quot;s&quot;&gt;前九月營運現金流 1,271.49 億，低於同期資本支出 1,320 億（推算差約 49 億）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src3&quot;&gt;[3]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src4&quot;&gt;[4]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;lbl&quot;&gt;說明&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;要達全年 1,950–2,050 億，第四季需約 630–730 億（推算），高於報導的第三季 513.6 億，指引能否兌現要等 10-K 核對；支出確實大增，但已超過本業現金流能支應的程度。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src4&quot;&gt;[4]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src25&quot;&gt;[25]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src24&quot;&gt;[24]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src3&quot;&gt;[3]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;s3&quot;&gt;&lt;h2&gt;3　成長引擎與卡點&lt;/h2&gt;&lt;h3&gt;成長從哪裡來（量、價、新產品、新市場、併購）&lt;/h3&gt;&lt;div class=&quot;cards&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;span class=&quot;chip&quot;&gt;新產品&lt;/span&gt;&lt;span class=&quot;qz&quot;&gt;能否量化：可量化&lt;/span&gt;&lt;/div&gt;&lt;b&gt;Google 雲端 AI 基礎設施與 TPU 系統對外銷售&lt;/b&gt;&lt;div class=&quot;lbl&quot;&gt;證據&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;雲端第三季營收年增 102.6%（推算），增量來自 GCP 基礎設施與平台服務與 TPU 系統銷售；TPU 系統在第二季首次交付到客戶資料中心。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src16&quot;&gt;[16]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src20&quot;&gt;[20]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;報導：Oracle 將對外提供 Google 的 TPU，Google 由自用晶片改走夥伴通路擴大客群。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src26&quot;&gt;[26]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;span class=&quot;chip&quot;&gt;量&lt;/span&gt;&lt;span class=&quot;qz&quot;&gt;能否量化：可量化&lt;/span&gt;&lt;/div&gt;&lt;b&gt;搜尋付費點擊量&lt;/b&gt;&lt;div class=&quot;lbl&quot;&gt;證據&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;付費點擊第三季年增 8%、前九月 11%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src13&quot;&gt;[13]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;搜尋與其他營收第三季年增約 12.0%（推算：633.50 億對 565.67 億），點擊 +8% 大於單價 +4%，所以本季搜尋成長以點擊量貢獻較多；公司自己的說法是查詢增加、廣告主支出與格式改善等相互關聯的因素共同帶動，沒有指明主要來源。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src13&quot;&gt;[13]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src27&quot;&gt;[27]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;span class=&quot;chip&quot;&gt;價&lt;/span&gt;&lt;span class=&quot;qz&quot;&gt;能否量化：可量化&lt;/span&gt;&lt;/div&gt;&lt;b&gt;每次點擊與每次曝光價格&lt;/b&gt;&lt;div class=&quot;lbl&quot;&gt;證據&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;每次點擊價格第三季年增 4%；聯播網每次曝光價格年增 14%，抵銷曝光年減 14%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src13&quot;&gt;[13]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;AI Mode 廣告正擴大到更多市場，但目前變現低於傳統搜尋，價的貢獻短期可能被組合變化稀釋。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src19&quot;&gt;[19]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src28&quot;&gt;[28]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;span class=&quot;chip&quot;&gt;新產品&lt;/span&gt;&lt;span class=&quot;qz&quot;&gt;能否量化：可量化&lt;/span&gt;&lt;/div&gt;&lt;b&gt;訂閱、平台與裝置&lt;/b&gt;&lt;div class=&quot;lbl&quot;&gt;證據&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;訂閱平台與裝置第三季 142.90 億，年增 11.0%（推算）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;近 12 季：營收年增與營業利益率&lt;/figcaption&gt;&lt;svg viewBox=&quot;0 0 680 250&quot; role=&quot;img&quot; aria-label=&quot;近幾季單季營收年增與營業利益率&quot;&gt;&lt;line x1=&quot;50&quot; x2=&quot;640&quot; y1=&quot;216.0&quot; y2=&quot;216.0&quot; class=&quot;zl&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;220.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;0%&lt;/text&gt;&lt;line x1=&quot;50&quot; x2=&quot;640&quot; y1=&quot;167.0&quot; y2=&quot;167.0&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;171.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;10%&lt;/text&gt;&lt;line x1=&quot;50&quot; x2=&quot;640&quot; y1=&quot;118.0&quot; y2=&quot;118.0&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;122.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;20%&l
