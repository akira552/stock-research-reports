e x1=&quot;399.6&quot; x2=&quot;399.6&quot; y1=&quot;122.0&quot; y2=&quot;142.0&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;1&quot; stroke-dasharray=&quot;2 3&quot;/&gt;&lt;text x=&quot;140&quot; y=&quot;157.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;資本支出&lt;/text&gt;&lt;rect x=&quot;154.8&quot; y=&quot;142.0&quot; width=&quot;244.8&quot; height=&quot;20&quot; rx=&quot;4&quot; fill=&quot;var(--c2)&quot;&gt;&lt;title&gt;資本支出：−1,598&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;407.6&quot; y=&quot;157.0&quot; class=&quot;val&quot;&gt;−1,598&lt;/text&gt;&lt;line x1=&quot;154.8&quot; x2=&quot;154.8&quot; y1=&quot;162.0&quot; y2=&quot;182.0&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;1&quot; stroke-dasharray=&quot;2 3&quot;/&gt;&lt;text x=&quot;140&quot; y=&quot;197.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;剩餘&lt;/text&gt;&lt;rect x=&quot;150.0&quot; y=&quot;182.0&quot; width=&quot;4.8&quot; height=&quot;20&quot; rx=&quot;4&quot; fill=&quot;var(--c3)&quot;&gt;&lt;title&gt;剩餘：31.4&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;162.8&quot; y=&quot;197.0&quot; class=&quot;val&quot;&gt;31.4&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;shareholder-equity&quot;&gt;&lt;h3&gt;股東回報與權益（逐年）&lt;/h3&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;財年&lt;/th&gt;&lt;th&gt;股東權益（億美元）&lt;/th&gt;&lt;th&gt;ROE&lt;/th&gt;&lt;th&gt;每股帳面（美元，推導）&lt;/th&gt;&lt;th&gt;股利（億美元）&lt;/th&gt;&lt;th&gt;回購（億美元）&lt;/th&gt;&lt;th&gt;（股利＋回購）÷ 自由現金流&lt;/th&gt;&lt;th&gt;稀釋股數年變化&lt;/th&gt;&lt;th&gt;註記&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2016&lt;/td&gt;&lt;td&gt;1,390&lt;/td&gt;&lt;td&gt;15.0%&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;0.0&lt;/td&gt;&lt;td&gt;36.9&lt;/td&gt;&lt;td&gt;14%&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2017&lt;/td&gt;&lt;td&gt;1,525&lt;/td&gt;&lt;td&gt;8.7%&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;0.0&lt;/td&gt;&lt;td&gt;48.5&lt;/td&gt;&lt;td&gt;20%&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2018&lt;/td&gt;&lt;td&gt;1,776&lt;/td&gt;&lt;td&gt;18.6%&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;90.8&lt;/td&gt;&lt;td&gt;40%&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2019&lt;/td&gt;&lt;td&gt;2,014&lt;/td&gt;&lt;td&gt;18.1%&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;184&lt;/td&gt;&lt;td&gt;59%&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2020&lt;/td&gt;&lt;td&gt;2,225&lt;/td&gt;&lt;td&gt;19.0%&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;311&lt;/td&gt;&lt;td&gt;73%&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2021&lt;/td&gt;&lt;td&gt;2,516&lt;/td&gt;&lt;td&gt;32.1%&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;503&lt;/td&gt;&lt;td&gt;75%&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2022&lt;/td&gt;&lt;td&gt;2,561&lt;/td&gt;&lt;td&gt;23.6%&lt;/td&gt;&lt;td&gt;19.47&lt;/td&gt;&lt;td&gt;0.0&lt;/td&gt;&lt;td&gt;593&lt;/td&gt;&lt;td&gt;99%&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2023&lt;/td&gt;&lt;td&gt;2,834&lt;/td&gt;&lt;td&gt;27.4%&lt;/td&gt;&lt;td&gt;22.27&lt;/td&gt;&lt;td&gt;0.0&lt;/td&gt;&lt;td&gt;615&lt;/td&gt;&lt;td&gt;89%&lt;/td&gt;&lt;td&gt;-3.3%&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2024&lt;/td&gt;&lt;td&gt;3,251&lt;/td&gt;&lt;td&gt;32.9%&lt;/td&gt;&lt;td&gt;26.12&lt;/td&gt;&lt;td&gt;73.6&lt;/td&gt;&lt;td&gt;622&lt;/td&gt;&lt;td&gt;96%&lt;/td&gt;&lt;td&gt;-2.2%&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2025&lt;/td&gt;&lt;td&gt;4,153&lt;/td&gt;&lt;td&gt;35.7%&lt;/td&gt;&lt;td&gt;33.95&lt;/td&gt;&lt;td&gt;100&lt;/td&gt;&lt;td&gt;457&lt;/td&gt;&lt;td&gt;76%&lt;/td&gt;&lt;td&gt;-1.7%&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;長期財務（股東權益、稀釋股數〔分割調整〕、總資產；每股帳面＝股東權益 ÷ 稀釋股數，推導；股利支付、回購、營運現金流、資本支出在財務歷史 沒有該年時用）；產業指標 逐年（ROE）；財務歷史 annual（股利、回購、營運現金流、資本支出）。用到：財務歷史、長期財務。ROE 註記門檻：ROE 高於 60% 或股東權益 ÷ 總資產低於 10%；近三年回購合計達當年股東權益 50% 以上才歸因於回購。（股利＋回購）÷ 年底市值：專案沒有逐年年底市值資料，不列該欄。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;capital-plain&quot;&gt;&lt;h3&gt;融資與償債：還不還得起&lt;/h3&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;b&gt;信用評級&lt;/b&gt;　機構 Moody&amp;#x27;s Aa2（展望穩定）、S&amp;amp;P AA+（展望穩定）（SEC 全文搜尋 FWP 2026-08-07 0001193125-26-338750）／推導 AAA（Damodaran 合成評等，利息保障 51.0 倍，近四季新借款多、利息偏低、評級可能偏高，推導）｜投資等級（BBB-／Baa3 以上）；推導比機構高 2 級（推導只看利息保障，不含規模、產業與擔保結構，僅供對照）&lt;/p&gt;&lt;p&gt;&lt;b&gt;存活檢查（12～24 個月，推導，非違約預測）&lt;/b&gt;　無明顯警訊（推導，非違約預測）：現金加未動用信貸 2,751 億美元，一年內到期債務 20 億美元（另利息 31 億美元），可付 54.2 倍；現金加未動用信貸 2,751 億美元，兩年內到期債務 30 億美元（另利息 62 億美元），可付 30.1 倍；利息保障 51.0 倍（新借款多、利息偏低，倍數可能偏高）；會計師未提出繼續經營疑慮。&lt;/p&gt;&lt;p&gt;&lt;b&gt;利率壓力測試&lt;/b&gt;　+200bp 後利息保障 47.5 倍（目前 51.0 倍，推導）&lt;/p&gt;&lt;p&gt;&lt;b&gt;借款用途&lt;/b&gt;　混合（以擴張為主）：AI 基礎設施資本支出是最大資金需求，同時用債務、普通股與強制轉換特別股籌資；債務本身公司只寫「一般公司用途」，沒有單獨指定用途&lt;/p&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;償債指標、融資活動表、存活檢查明細與利率壓力測試（算法與完整表見&lt;a href=&quot;#wp-6&quot;&gt;計算底稿 6&lt;/a&gt;）。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;survival-charts&quot;&gt;&lt;h3&gt;存活檢查與利率壓力測試（圖）&lt;/h3&gt;&lt;div class=&quot;grid2 wide&quot;&gt;&lt;figure class=figure&gt;&lt;p class=cap&gt;存活檢查（12～24 個月）：手上的錢對到期債務加利息（億美元；可付 54.2 倍／30.1 倍；燈號 無明顯警訊；資料截至 2026-09-30；信用與存活；推導，非違約預測）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 500 222&quot; role=&quot;img&quot; aria-label=&quot;存活檢查&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;223.0&quot; x2=&quot;223.0&quot; y1=&quot;6&quot; y2=&quot;216&quot; class=&quot;zero&quot;/&gt;&lt;text x=&quot;213&quot; y=&quot;23&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;現金與流動證券&lt;/text&gt;&lt;rect x=&quot;223.0&quot; y=&quot;9&quot; width=&quot;199.1&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c1)&quot;/&gt;&lt;text x=&quot;430.1&quot; y=&quot;23&quot; class=&quot;val&quot;&gt;2,651&lt;/text&gt;&lt;text x=&quot;213&quot; y=&quot;63&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;未動用信貸&lt;/text&gt;&lt;rect x=&quot;223.0&quot; y=&quot;49&quot; width=&quot;7.5&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c1)&quot;/&gt;&lt;text x=&quot;238.5&quot; y=&quot;63&quot; class=&quot;val&quot;&gt;100&lt;/text&gt;&lt;text x=&quot;213&quot; y=&quot;103&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;12 個月要付：本金＋利息&lt;/text&gt;&lt;rect x=&quot;223.0&quot; y=&quot;89&quot; width=&quot;3.8&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--neg)&quot;/&gt;&lt;text x=&quot;234.8&quot; y=&quot;103&quot; class=&quot;val&quot;&gt;50.8&lt;/text&gt;&lt;text x=&quot;213&quot; y=&quot;143&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;24 個月要付：本金＋兩年利息&lt;/text&gt;&lt;rect x=&quot;223.0&quot; y=&quot;129&quot; width=&quot;6.9&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--neg)&quot;/&gt;&lt;text x=&quot;237.9&quot; y=&quot;143&quot; class=&quot;val&quot;&gt;91.5&lt;/text&gt;&lt;text x=&quot;213&quot; y=&quot;183&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;近四季自由現金流&lt;/text&gt;&lt;rect x=&quot;223.0&quot; y=&quot;169&quot; width=&quot;14.8&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;245.8&quot; y=&quot;183&quot; class=&quot;val&quot;&gt;197&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;figure class=figure&gt;&lt;p class=cap&gt;利率壓力測試：各固定情境下的利息保障（倍；紅色虛線 1.5 倍＝提示門檻；不預測聯準會；推導）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 500 222&quot; role=&quot;img&quot; aria-label=&quot;利率壓力測試&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;183.0&quot; x2=&quot;183.0&quot; y1=&quot;6&quot; y2=&quot;216&quot; class=&quot;zero&quot;/&gt;&lt;line x1=&quot;189.9&quot; x2=&quot;189.9&quot; y1=&quot;4&quot; y2=&quot;218&quot; class=&quot;price&quot;/&gt;&lt;text x=&quot;173&quot; y=&quot;23&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;目前&lt;/text&gt;&lt;rect x=&quot;183.0&quot; y=&quot;9&quot; width=&quot;235.5&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c1)&quot;/&gt;&lt;text x=&quot;426.5&quot; y=&quot;23&quot; class=&quot;val&quot;&gt;51.0 倍&lt;/text&gt;&lt;text x=&quot;173&quot; y=&quot;63&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;目前利率（只算再融資）&lt;/text&gt;&lt;rect x=&quot;183.0&quot; y=&quot;49&quot; width=&quot;228.1&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c1)&quot;/&gt;&lt;text x=&quot;419.1&quot; y=&quot;63&quot; class=&quot;val&quot;&gt;49.4 倍&lt;/text&gt;&lt;text x=&quot;173&quot; y=&quot;103&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;利率 +1 個百分點&lt;/text&gt;&lt;rect x=&quot;183.0&quot; y=&quot;89&quot; width=&quot;223.6&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c1)&quot;/&gt;&lt;text x=&quot;414.6&quot; y=&quot;103&quot; class=&quot;val&quot;&gt;48.5 倍&lt;/text&gt;&lt;text x=&quot;173&quot; y=&quot;143&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;利率 +2 個百分點&lt;/text&gt;&lt;rect x=&quot;183.0&quot; y=&quot;129&quot; width=&quot;219.3&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c1)&quot;/&gt;&lt;text x=&quot;410.3&quot; y=&quot;143&quot; class=&quot;val&quot;&gt;47.5 倍&lt;/text&gt;&lt;text x=&quot;173&quot; y=&quot;183&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;利率 −1 個百分點&lt;/text&gt;&lt;rect x=&quot;183.0&quot; y=&quot;169&quot; width=&quot;232.7&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c1)&quot;/&gt;&lt;text x=&quot;423.7&quot; y=&quot;183&quot; class=&quot;val&quot;&gt;50.4 倍&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;燈號規則：現金＋未動用信貸要能付 12 個月本金與利息，否則看自由現金流；利率上升 2 個百分點後利息保障低於 1.5 倍才加一條理由。只顯示、不改研究評等；明細表、規則與限制（算法與完整表見&lt;a href=&quot;#wp-6&quot;&gt;計算底稿 6&lt;/a&gt;）。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;財務管理：資金、負債與承諾&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;9 月底現金與有價證券約 2,651 億（含短期限售的 SpaceX 752 億）；有息負債 125,102 百萬美元，未含一年內到期票據約 10 億與融資租賃約 37 億，淨現金仍為正。&lt;/strong&gt;2026 年新發票據最早 2028 年到期，資金缺口來自自願擴張，不是債務到期。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;營運資金：存貨天數由約 5 天升到約 26 天（TPU 系統備貨），應收約 56 天持平，應付由約 27 天升到約 43 天。&lt;/strong&gt;表外：採購承諾 9,244 億、能源設備保證最高 162 億、TPU 回購保證最高 66 億。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;figure&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt signals&quot;&gt;&lt;tr&gt;&lt;th&gt;財務管理指標&lt;/th&gt;&lt;th&gt;數值&lt;/th&gt;&lt;th&gt;代表什麼&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;現金與有價證券&lt;/td&gt;&lt;td&gt;約 2,651 億（含 SpaceX 752 億，短期限售）&lt;/td&gt;&lt;td&gt;流動性充足，但部分是股權、價格會變動&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2026 前九月外部融資&lt;/td&gt;&lt;td&gt;發債收入 852 億（淨借入約 763 億）、普通股 429 億、特別股 191 億&lt;/td&gt;&lt;td&gt;AI 投資的缺口靠外部資金補&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;表外承諾與保證&lt;/td&gt;&lt;td&gt;採購承諾 9,244 億；能源設備保證最高 162 億；TPU 回購保證最高 66 億&lt;/td&gt;&lt;td&gt;未來數年成本相對固定&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;資產變化：存貨、設備、應付與權益證券&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;存貨九個月 +446%（2025 年底起，去年同期未單獨揭露）；設備 +67%、應付帳款 +108%、遞延收入 +70% 是十二個月年增（2025-09-30 起），都遠快於近四季營收 +22%。&lt;/strong&gt;存貨已由公司說明是待售 TPU 系統與 Pixel（Google 自有品牌手機）等裝置，設備對應技術基礎設施投資；應付與遞延收入方向與資本支出倍增、雲端成長一致，但公司未逐項說明，列為部分解釋的待查線索。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;權益證券：有價含 SpaceX 752 億、非上市股權約 1,352 億，評價變動進淨利，第三季淨損約 87 億。&lt;/strong&gt;股權橋把非上市股權打七折計入&lt;span class=&quot;src&quot;&gt;（作者判斷，比全額少約 3.3 美元，推算）&lt;/span&gt;，SpaceX 以 9 月底帳列全額計。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;figure&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt signals&quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;期初（日期）→期末（2026-09-30）&lt;/th&gt;&lt;th&gt;變化（期間）&lt;/th&gt;&lt;th&gt;判讀&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;存貨&lt;/td&gt;&lt;td&gt;24 億（2025-12-31）→133 億&lt;/td&gt;&lt;td&gt;+446%（九個月，2025-12-31 起）&lt;/td&gt;&lt;td&gt;已解釋：待售 TPU 系統與 Pixel 等裝置&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;應收帳款&lt;/td&gt;&lt;td&gt;571 億（2025-09-30）→728 億&lt;/td&gt;&lt;td&gt;+27%（十二個月，2025-09-30 起）&lt;/td&gt;&lt;td class=&quot;st-正常&quot;&gt;正常&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;應付帳款&lt;/td&gt;&lt;td&gt;105 億（2025-09-30）→220 億&lt;/td&gt;&lt;td&gt;+108%（十二個月，2025-09-30 起）&lt;/td&gt;&lt;td&gt;部分解釋：與資本支出同向&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;不動產廠房設備&lt;/td&gt;&lt;td&gt;2,238 億（2025-09-30）→3,728 億&lt;/td&gt;&lt;td&gt;+67%（十二個月，2025-09-30 起）&lt;/td&gt;&lt;td&gt;已解釋：技術基礎設施投資&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;遞延收入（流動）&lt;/td&gt;&lt;td&gt;55 億（2025-09-30）→94 億&lt;/td&gt;&lt;td&gt;+70%（十二個月，2025-09-30 起）&lt;/td&gt;&lt;td&gt;部分解釋：雲端及訂閱，增幅原因未說明&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;權益證券&lt;/td&gt;&lt;td&gt;有價（含 SpaceX 752 億）＋非上市約 1,352 億&lt;/td&gt;&lt;td&gt;第三季淨損約 87 億（2026 年第三季單季）&lt;/td&gt;&lt;td class=&quot;st-已解釋&quot;&gt;已解釋&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;公司內部治理：控制權、董事會與獎酬&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;&lt;a class=&quot;term&quot; href=&quot;#g20&quot;&gt;三類股&lt;/a&gt;：A 股一股一票、B 股十票、C 股無表決權。&lt;/strong&gt;共同創辦人 Larry Page 與 Sergey Brin 分別約 27.4%、25.3% 表決權，合計約 52.7%&lt;span class=&quot;src&quot;&gt;（推算）&lt;/span&gt;，董事與高管合計約 54.3%（2026 委託書）；十席董事中 Page、Brin 與執行長 Sundar Pichai 三人非獨立。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;高管績效股（PSU，2026 年 4 月授予 Ashkenazi、Porat、Schindler、Walker 四位）依 2026–2028 年相對 S&amp;amp;P 100 公司的股東總報酬歸屬（目標的 0%–200%），其餘為三年按月歸屬的時間型 GSU&lt;span class=&quot;src&quot;&gt;（8-K 2026-04-10 本文 §6–§8）&lt;/span&gt;；指標沒有資本報酬或每股現金。&lt;/strong&gt;2020 年底投入 100 美元，2025 年底為 361 美元（同業 138）。近 6 個月內部人公開市場買進 0，賣出全屬&lt;a class=&quot;term&quot; href=&quot;#g21&quot;&gt;預設交易計畫（10b5-1）&lt;/a&gt;。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;figure&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt signals&quot;&gt;&lt;tr&gt;&lt;th&gt;治理指標&lt;/th&gt;&lt;th&gt;數值&lt;/th&gt;&lt;th&gt;出處&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;表決權&lt;/td&gt;&lt;td&gt;Page 約 27.4%、Brin 約 25.3%（合計約 52.7%，推算）；董事與高管約 54.3%&lt;/td&gt;&lt;td&gt;2026 委託書&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股東總報酬（100 美元起算）&lt;/td&gt;&lt;td&gt;公司 361 對同業 138（2020 年底至 2025 年底）&lt;/td&gt;&lt;td&gt;2026 委託書&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;內部人（近 6 個月）&lt;/td&gt;&lt;td&gt;買進 0；賣出 40 筆約 452 萬美元，全屬 10b5-1&lt;/td&gt;&lt;td&gt;Form 4&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;高管績效股指標&lt;/td&gt;&lt;td&gt;相對 S&amp;amp;P 100 股東總報酬（2026–2028，歸屬 0%–200%）；其餘為時間型 GSU&lt;/td&gt;&lt;td&gt;8-K 2026-04-10&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;業務治理：分部利潤、公司層級費用與法規&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;第三季分部利潤：Google 服務營業利益 392 億、利益率 40.7%（去年同期 38.5%）；雲端 111 億、36.2%（23.7%）；其他事業虧損 20 億。&lt;/strong&gt;公司只揭露分部營業利益，分部毛利未揭露。公司層級費用（主要是共用 AI 研發）由 45 億增到 77 億（+71%）。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;反壟斷：廣告科技案法院 2026 年 9 月駁回結構性分拆，改命互通、資料存取與競價行為補救，最終判決尚未作出，公司計畫上訴&lt;span class=&quot;src&quot;&gt;（10-Q Item 1 ¶332）&lt;/span&gt;；產業媒體 PPC Land（數位廣告業新聞網站）解讀為六年期並設法院監督人（新聞 N15）。&lt;/strong&gt;搜尋案限制分發並要求分享資料，雙方上訴中&lt;span class=&quot;src&quot;&gt;（10-Q Item 1 ¶331）&lt;/span&gt;；影響無法量化。2026 年第二季 PriceRunner 案認列約 21 億、第三季歐盟數位市場法罰款 10 億，都視為經常性成本，不另調整估值。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;figure&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt signals&quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;2026 第三季&lt;/th&gt;&lt;th&gt;去年同期&lt;/th&gt;&lt;th&gt;說明&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Google 服務營業利益&lt;/td&gt;&lt;td&gt;392 億（40.7%）&lt;/td&gt;&lt;td&gt;335 億（38.5%）&lt;/td&gt;&lt;td&gt;廣告與訂閱&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;雲端營業利益&lt;/td&gt;&lt;td&gt;111 億（36.2%）&lt;/td&gt;&lt;td&gt;36 億（23.7%）&lt;/td&gt;&lt;td&gt;規模效益顯現&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;其他事業&lt;/td&gt;&lt;td&gt;−20 億&lt;/td&gt;&lt;td&gt;−14 億&lt;/td&gt;&lt;td&gt;Waymo（其他事業中的自動駕駛服務）等，投資期&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;公司層級費用&lt;/td&gt;&lt;td&gt;−77 億&lt;/td&gt;&lt;td&gt;−45 億&lt;/td&gt;&lt;td&gt;主要是共用 AI 研發&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;白話說&lt;/b&gt;像一家過去每年買回自家股票的店，今年改成借錢也找新股東蓋新廠房：賺錢老股東受益，不賺錢要一起承擔。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;要留意&lt;/b&gt;應付帳款 +108% 與遞延收入 +70% 只部分解釋，是待查線索，見改判訊號。&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;events&quot;&gt;&lt;div class=&quot;qno&quot;&gt;問題 07&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;近半年發生了什麼重大事件？&lt;/div&gt;&lt;h2&gt;第三季營收 +25%、雲端 +103%；6 月起大規模發股發債&lt;/h2&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;2026 年 5 月以來的 8-K 多數與籌資有關：6 月初公開發行普通股（A 股每股 355.20 美元）與強制轉換特別股、設立最高 400 億美元 ATM，並由波克夏以每股約 351.81 美元私募；5、8、11 月另發行歐元、加幣、日圓與美元票據。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;10 月 28 日第三季財報：營收 1,276 億（+25%）、雲端 307 億（+103%）、營業利益率 31.8%；每股 2.12 美元低於去年同期，因權益證券由利益轉淨損約 87 億。&lt;/strong&gt;2026 年資本支出指引維持 1,950～2,050 億，2027 年會顯著增加。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;note-box&quot;&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:14px&quot;&gt;2026 年 5 月以來 8-K 重大事件（依關聯性排序）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;申報日&lt;/th&gt;&lt;th&gt;事件&lt;/th&gt;&lt;th&gt;內容重點&lt;/th&gt;&lt;th&gt;影響哪個判斷&lt;/th&gt;&lt;th&gt;關聯性&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;10-28&lt;/td&gt;&lt;td&gt;第三季財報（Item 2.02）&lt;/td&gt;&lt;td&gt;營收 1,276 億 +25%；雲端 +103%&lt;/td&gt;&lt;td&gt;第二、三、五題&lt;/td&gt;&lt;td&gt;高&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;06-04、06-05&lt;/td&gt;&lt;td&gt;增資計畫（Item 1.01、7.01、8.01）&lt;/td&gt;&lt;td&gt;公開發行普通股與強制轉換特別股（2029 年轉普通股）；ATM 最高 400 億；波克夏私募&lt;/td&gt;&lt;td&gt;第四、六題&lt;/td&gt;&lt;td&gt;高&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;07-22&lt;/td&gt;&lt;td&gt;第二季財報（Item 2.02）&lt;/td&gt;&lt;td&gt;營收 1,198 億 +24%；雲端 +82%&lt;/td&gt;&lt;td&gt;第二、三、五題&lt;/td&gt;&lt;td&gt;高&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;08-10&lt;/td&gt;&lt;td&gt;發行 250 億美元票據（Item 8.01）&lt;/td&gt;&lt;td&gt;多檔不同年期&lt;/td&gt;&lt;td&gt;第六題：負債&lt;/td&gt;&lt;td&gt;中&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;11-05&lt;/td&gt;&lt;td&gt;發行 60 億歐元優先票據（Item 8.01）&lt;/td&gt;&lt;td&gt;期後事項，9 月底資產負債表未含&lt;/td&gt;&lt;td&gt;第六題：負債&lt;/td&gt;&lt;td&gt;中&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;05-11、05-21&lt;/td&gt;&lt;td&gt;發行歐元、加幣、日圓票據（Item 8.01）&lt;/td&gt;&lt;td&gt;90 億歐元＋95 億加幣；約 5,769 億日圓&lt;/td&gt;&lt;td&gt;第六題：負債&lt;/td&gt;&lt;td&gt;中&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;06-11&lt;/td&gt;&lt;td&gt;股東會結果（Item 5.02、5.07）&lt;/td&gt;&lt;td&gt;員工股票計畫增加 2 億股 C 股&lt;/td&gt;&lt;td&gt;第四題：稀釋&lt;/td&gt;&lt;td&gt;中&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;06-05&lt;/td&gt;&lt;td&gt;新任會計長（Item 5.02）&lt;/td&gt;&lt;td&gt;Marsida Saraci 擔任首席會計官&lt;/td&gt;&lt;td&gt;第六題&lt;/td&gt;&lt;td&gt;低&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;白話說&lt;/b&gt;公司以每股約 352–355 美元發新股，像高價賣股份拿現金開分店，前提是新店賺錢。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;要留意&lt;/b&gt;看第四季財報會議的 2027 年資本支出、雲端積壓與 ATM 發行股數。&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;news&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;與報告相關的近期新聞&lt;/p&gt;&lt;h3&gt;新聞印證雲端與 TPU 需求，也印證資本支出加重與搜尋變現受考驗&lt;/h3&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;本輪新聞候選 631 則，挑官方逐字稿、主流媒體與原始數據，回原文逐句核對，採用 17 則（下表列最重要 5 則，其餘存新聞/ 資料夾）；11-17 複核的新候選（創辦人售股轉述、付費新聞稿、自動產生的 SpaceX 持股稿）都不採用。&lt;/strong&gt;新聞只作外部參考，財務事實以 SEC 申報為準。&lt;/p&gt;&lt;p&gt;最重要訊號：官方逐字稿顯示 2026 年資本支出指引由 1,800～1,900 億上修為 1,950～2,050 億，雲端 +103%；反方是商務長承認 AI 模式變現較低，以及新雲端夥伴交付延遲。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;新聞摘要（依日期排序）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;日期&lt;/th&gt;&lt;th&gt;新聞&lt;/th&gt;&lt;th&gt;來源&lt;/th&gt;&lt;th&gt;對應主題&lt;/th&gt;&lt;th&gt;方向&lt;/th&gt;&lt;th&gt;我們的判讀&lt;/th&gt;&lt;th&gt;原文網址&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;07-22&lt;/td&gt;&lt;td&gt;Alphabet 第二季財報會議逐字稿&lt;/td&gt;&lt;td&gt;Alphabet 投資人關係（官方逐字稿）&lt;/td&gt;&lt;td&gt;資本支出與自由現金流&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;資本支出指引上修；財務長稱除 ATM 外暫不再發股（公司說法，非承諾）。&lt;/td&gt;&lt;td class=&quot;link&quot;&gt;&lt;a href=&quot;https://abc.xyz/investor/events/event-details/2026/2026-Q2-Earnings-Call-2026-GgTAq7Is0z/default.aspx&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;原文&lt;/a&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;10-07&lt;/td&gt;&lt;td&gt;citybiz：Google 仍占全球搜尋近九成（Statcounter）&lt;/td&gt;&lt;td&gt;citybiz（引述 Statcounter）&lt;/td&gt;&lt;td&gt;搜尋護城河&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;2026 年 9 月 89.9%、一年降 0.44 個百分點；不含 App 內 AI 助理。&lt;/td&gt;&lt;td class=&quot;link&quot;&gt;&lt;a href=&quot;https://www.citybiz.co/article/915639/chatgpt-and-gemini-gain-users-as-google-holds-nearly-90-of-global-search-market/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;原文&lt;/a&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;10-28&lt;/td&gt;&lt;td&gt;CNBC（美國財經電視台）：第三季維持資本支出、2027 年顯著增加，自由現金流為負&lt;/td&gt;&lt;td&gt;CNBC&lt;/td&gt;&lt;td&gt;資本支出與自由現金流&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;單季自由現金流約 −91 億，與本報告現金品質弱一致；3,000 億是市場估計，不引用。&lt;/td&gt;&lt;td class=&quot;link&quot;&gt;&lt;a href=&quot;https://www.cnbc.com/2026/10/28/alphabet-googl-earnings-q3-2026.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;原文&lt;/a&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;10-29&lt;/td&gt;&lt;td&gt;9to5Google：Google 承認 AI Mode 變現較低&lt;/td&gt;&lt;td&gt;9to5Google&lt;/td&gt;&lt;td&gt;搜尋護城河&lt;/td&gt;&lt;td&gt;反方&lt;/td&gt;&lt;td&gt;搜尋護城河受考驗的直接證據；第三季搜尋 17%→12%，廣告擴大效果待驗證。&lt;/td&gt;&lt;td class=&quot;link&quot;&gt;&lt;a href=&quot;https://9to5google.com/2026/10/29/google-stock-drop-ai-mode-ad-expansion/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;原文&lt;/a&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;10-29&lt;/td&gt;&lt;td&gt;CNBC：Google 與微軟沒有再上調資本支出預測&lt;/td&gt;&lt;td&gt;CNBC&lt;/td&gt;&lt;td&gt;資本支出與自由現金流&lt;/td&gt;&lt;td&gt;反方&lt;/td&gt;&lt;td&gt;指引沒有再上修，2027 年仍會顯著增加；新雲端夥伴交付延遲屬產業風險。&lt;/td&gt;&lt;td class=&quot;link&quot;&gt;&lt;a href=&quot;https://www.cnbc.com/2026/10/29/microsoft-google-ai-capex-estimates.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;原文&lt;/a&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;numbers&quot;&gt;&lt;div class=&quot;qno&quot;&gt;完整數字&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;三大報表摘要（年度與 8 季）&lt;/div&gt;&lt;h2&gt;營收、獲利、現金流與資產負債一次看&lt;/h2&gt;&lt;div class=&quot;grid2 wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;損益：年度與近四季（億美元）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 300&quot; role=&quot;img&quot; aria-label=&quot;損益（年度）&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;266.0&quot; y2=&quot;266.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;270.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;0.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;185.3&quot; y2=&quot;185.3&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;189.3&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;2,000&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;104.7&quot; y2=&quot;104.7&quot; class=&quot;grid quot;296.0&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;2026-06-30&lt;/text&gt;&lt;rect x=&quot;401.7&quot; y=&quot;185.8&quot; width=&quot;36.0&quot; height=&quot;80.2&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;現金與短期投資 2026-09-30：2,651&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;439.7&quot; y=&quot;228.2&quot; width=&quot;36.0&quot; height=&quot;37.8&quot; rx=&quot;2&quot; fill=&quot;var(--neg)&quot;&gt;&lt;title&gt;借款（短期＋長期） 2026-09-30：1,251&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;477.6&quot; y=&quot;61.0&quot; width=&quot;36.0&quot; height=&quot;205.0&quot; rx=&quot;2&quot; fill=&quot;var(--c2)&quot;&gt;&lt;title&gt;股東權益 2026-09-30：6,775&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;458.7&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;2026-09-30&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c1)&quot;&gt;&lt;/i&gt;現金與短期投資&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--neg)&quot;&gt;&lt;/i&gt;借款（短期＋長期）&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c2)&quot;&gt;&lt;/i&gt;股東權益&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;數字取自 財務歷史（SEC 申報）；缺值不補、不畫。逐列表格見&lt;a href=&quot;#numbers-table&quot;&gt;附錄「完整數字表格」&lt;/a&gt;。&lt;/p&gt;&lt;/section&gt;&lt;/div&gt;
&lt;section class=&quot;q&quot; id=&quot;workpaper&quot; data-layer=&quot;計算底稿&quot;&gt;&lt;div class=&quot;qno&quot;&gt;計算底稿&lt;/div&gt;&lt;h2&gt;計算底稿：正文結果的算法與完整表（預設摺疊）&lt;/h2&gt;&lt;p class=&quot;wpnote&quot;&gt;正文每個估值、償債結果都從這裡算出；背景計算照做、送審照核。不讀也不影響理解結論；非買賣建議。&lt;/p&gt;&lt;details id=&quot;wp-3-4&quot;&gt;&lt;summary&gt;3・4 現金與股東：報表對帳與股東回報判讀&lt;/summary&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;現金流報表對帳&lt;/h3&gt;&lt;p&gt;報表對帳（10-Q 2026-09-30，現金、約當現金及受限現金）：期初 30,708.0＋營運 127,149.0＋投資 -217,171.0＋融資 115,757.0＋其他 -109.0＝期末 56,334.0 百萬美元｜完整&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;股東回報判讀表&lt;/h3&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;股東回報（判讀依估值政策門檻，2026-10-14 核定；不影響估值與價格位置）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;數值&lt;/th&gt;&lt;th&gt;判讀&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股利殖利率&lt;/td&gt;&lt;td&gt;0.31%&lt;/td&gt;&lt;td&gt;不評好壞：依估值政策，股利殖利率高低不設門檻（高殖利率常因股價下跌）；占股東收益率 65%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;回購殖利率&lt;/td&gt;&lt;td&gt;0.17%&lt;/td&gt;&lt;td&gt;不評好壞：近四季回購約 59.0 億美元，是市值 35,198.3 億美元的 0.17%；划不划算看「股東收益率」「淨回購」「回購均價」&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股東收益率（股利＋回購）&lt;/td&gt;&lt;td&gt;0.47%（公債的 9%）&lt;/td&gt;&lt;td&gt;不評好壞：主要靠成長，0.47% 只有 10 年期公債 5.12% 的 9%；回饋低是成長型公司的常態，改看成長&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;淨回購殖利率&lt;/td&gt;&lt;td&gt;-0.70%&lt;/td&gt;&lt;td&gt;警示：回購少於發給員工的股票，只在抵銷稀釋（淨 -0.70%）；依政策「治理與資本配置」最高只能評「中」；本次該項評「中」，評等不受影響&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股數年變化（1／3／10 財年）&lt;/td&gt;&lt;td&gt;-1.7%／-2.4%／—&lt;/td&gt;&lt;td&gt;好：2025 財年對上一財年 -1.7%（減少）；近 3 財年平均每年 -2.4%（減少）；10 財年資料不足（只有 2022–2025）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;近十年有回購的年數&lt;/td&gt;&lt;td&gt;10／10&lt;/td&gt;&lt;td&gt;好：近十年有 10 年回購，達政策「穩定」（至少 8 年）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股利連續成長年數&lt;/td&gt;&lt;td&gt;1&lt;/td&gt;&lt;td&gt;中性：連續 1 年調高，未達政策「近十年年年調高」&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股東回饋占自由現金流&lt;/td&gt;&lt;td&gt;84.07%&lt;/td&gt;&lt;td&gt;注意：股利＋回購用掉近四季自由現金流的 84%，接近政策 100% 警示線&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;details id=&quot;wp-mkt&quot;&gt;&lt;summary&gt;市場背景：大盤一句、流動性、空單與參考值的資料日期與存檔&lt;/summary&gt;&lt;p class=&quot;cap&quot;&gt;大盤狀態（市場總覽；只揭露，不進研究評等、價格位置與合理價值）：S&amp;amp;P 500（以 SPY 代表）前十大持股合計 37.3%，最大產業科技 38.2%；那斯達克 100（QQQ）科技占 58.0%；等權重 RSP 減市值加權 SPY 近3個月報酬差 1.7 個百分點，位在 2003 年以來第 79 分位（持平）。高收益債利差 3.30，位在 2023 年以來第 81 分位（偏高）；金融狀況指數 -0.46，位在 1971 年以來第 44 分位（中性）；VIX 18.70，位在 1990 年以來第 56 分位（中性）；融資推估（聯準會，推估）0.74 兆美元（2026-06-30），年增 46.6%（第 92 分位，偏高），占國內公司股權市值 0.68%（第 8 分位，偏低）。（市場總覽收盤日 2026-11-12，市場/市場總覽）。&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;流動性、空單與參考值（只列事實與資料日期，不判冷熱、不是買賣訊號；非買賣建議）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;類別&lt;/th&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;數值&lt;/th&gt;&lt;th&gt;資料日期&lt;/th&gt;&lt;th&gt;說明與存檔&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;流動性&lt;/td&gt;&lt;td&gt;20 日均成交量&lt;/td&gt;&lt;td&gt;41,537,495 股&lt;/td&gt;&lt;td&gt;2026-11-16 收盤&lt;/td&gt;&lt;td&gt;90 日均量 29,964,897 股（20 日 ÷ 90 日 1.39 倍）｜市場溫度&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;流動性&lt;/td&gt;&lt;td&gt;20 日均成交金額&lt;/td&gt;&lt;td&gt;122.8 億美元&lt;/td&gt;&lt;td&gt;2026-11-16 收盤&lt;/td&gt;&lt;td&gt;市場溫度&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;流動性&lt;/td&gt;&lt;td&gt;20 日均周轉率（每日）&lt;/td&gt;&lt;td&gt;0.34%&lt;/td&gt;&lt;td&gt;2026-11-16 收盤&lt;/td&gt;&lt;td&gt;20 日均量 ÷ SEC 封面流通股數（當時可得，依分割換算）；自身近 5 年第 80% 百分位｜市場溫度&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;空單&lt;/td&gt;&lt;td&gt;放空比率（空單占流通股）&lt;/td&gt;&lt;td&gt;0.71%&lt;/td&gt;&lt;td&gt;2026-10-30 結算&lt;/td&gt;&lt;td&gt;空單 87,622,276 股；前一期（2026-10-15）78,436,901 股，增加 11.7%；FINRA 每月兩次公布的合併空單，取得 2026-11-17｜市場溫度&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;空單&lt;/td&gt;&lt;td&gt;回補天數&lt;/td&gt;&lt;td&gt;2.12 天&lt;/td&gt;&lt;td&gt;2026-10-30 結算&lt;/td&gt;&lt;td&gt;空單 ÷ 日均量（FINRA 自身日均量）；自算 ÷ 90 日均量 2.92 天｜市場溫度&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;參考值&lt;/td&gt;&lt;td&gt;52 週區間位置&lt;/td&gt;&lt;td&gt;8%&lt;/td&gt;&lt;td&gt;2026-11-16 收盤&lt;/td&gt;&lt;td&gt;0%＝52 週低 273.16、100%＝52 週高 402.12（收盤，推算）｜市場溫度&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;參考值&lt;/td&gt;&lt;td&gt;近 12 個月股價報酬&lt;/td&gt;&lt;td&gt;+2.1%&lt;/td&gt;&lt;td&gt;2026-11-16 收盤&lt;/td&gt;&lt;td&gt;同期 S&amp;amp;P 500 +11.3%｜市場溫度&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;參考值&lt;/td&gt;&lt;td&gt;60 日歷史年化波動&lt;/td&gt;&lt;td&gt;35.7%&lt;/td&gt;&lt;td&gt;2026-11-16 收盤&lt;/td&gt;&lt;td&gt;日報酬標準差年化（收盤）｜市場溫度&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;參考值&lt;/td&gt;&lt;td&gt;距 200 日均線&lt;/td&gt;&lt;td&gt;-16.0%&lt;/td&gt;&lt;td&gt;2026-11-16 收盤&lt;/td&gt;&lt;td&gt;200 日均線 337.93｜市場溫度&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;wide&quot;&gt;&lt;/div&gt;&lt;/details&gt;&lt;details id=&quot;wp-5&quot;&gt;&lt;summary&gt;5 估值：情境算式、市價隱含第 20 年倍數、同業與歷史倍數交叉核對、條件式區間算法、市價反推、溢價來源與作者計算說明&lt;/summary&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;作者計算說明&lt;/h3&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;折現率：無風險利率 5.12%（財政部 10 年期 2026-11-16）、股權風險溢價 4.20%（Damodaran 2026-10-01 市場隱含）。&lt;/strong&gt;beta（股價相對大盤的波動度）中值 1.16＝Damodaran Software（Damodaran 產業分類的軟體業） (Entertainment（娛樂）) 重新加槓桿 1.04&lt;span class=&quot;src&quot;&gt;（負債權益比 3.72%，與 WACC 債務權重同口徑、不含營業租賃）&lt;/span&gt;與 2 年週 beta（Blume 調整）1.275 的平均&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;，偏離產業值 0.12、在 0.2 以內；改用產業值 1.04 時中點 +9.7%、位置仍合理&lt;span class=&quot;src&quot;&gt;（估值模型試算，推導，不進合理價值）&lt;/span&gt;。基準 WACC 9.78%（區間 8.78%～10.78%）；AI 投資回收與搜尋變現風險已在保守情境處理，折現率不再加碼。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;成長：第 1 年預設 25.1%（近四季年增 22.2% 與分析師共識 27.9% 的平均，共識只當預設的一半、不當證據），採用 25%。&lt;/strong&gt;基準 25／19／14／11／8%，第 4–5 年比預設收斂路徑降得慢，依據是雲端未完成訂單約 55% 在 24 個月內認列、其餘在更後年度&lt;span class=&quot;src&quot;&gt;（10-Q Item 1 ¶119）&lt;/span&gt;；保守 15／9／6／5／4%、樂觀 31／25／20／15／11%。基準 10 年名目年增約 11.0%&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;，營收 500 億美元以上公司 10 年實質 5% 以上約占 21.1%（Base Rate Book 表 4），不罕見。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;再投資：近期增量銷售對資本比 0.63（2023～2025）對長期 1.03（2017～2025），比值 61% 低於 70%，屬投資高峰期&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;。&lt;/strong&gt;基準銷售對資本 0.48、0.55、0.70、0.85、1.00：第 1 年取依 2026 年資本支出指引換算 0.48～0.51 的下緣，第 5 年回到長期值附近；樂觀 0.60→1.05、保守 0.40→0.85（保守第 5 年不回長期值，理由是營收組合轉向資本密集的雲端、採購承諾 9,244 億難下修）。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;超額報酬期間：近五年 ROIC 37%～58%&lt;span class=&quot;src&quot;&gt;（財務投入資本口徑）&lt;/span&gt;每年高於 WACC 9.8%，且 Yelp、Angi（美國居家服務媒合平台）、CarGurus（美國汽車買賣網站）10-K 寫依賴 Google 搜尋導流（雙鑰匙通過），護城河分級寬；產業模組穩定複利，三情境衰退期 15 年，若縮回 5 年中點 207.8&lt;span class=&quot;src&quot;&gt;（−14.7%，推導）&lt;/span&gt;。&lt;/strong&gt;永續期 ROIC 三情境 18.9%＝近十年 ROIC 中位 37.8% 的一半（上限 20%），低於上限 44%／27% 是因資本密度上升，近四季增量 ROIC 約 16.6%&lt;span class=&quot;src&quot;&gt;（推算）&lt;/span&gt;；永續成長 3.0%。另一設定（衰退 15 年＋永續期 ROIC＝WACC）中點 −6.6%，價格位置不變。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;情境幅度：第 1–3 年平均成長保守 10.0%、基準 19.3%、樂觀 25.3%；穩態利潤率保守 25%（基準的 0.81 倍）、樂觀 39%（1.26 倍），兩邊同一把尺。&lt;/strong&gt;加權中點 ÷ 基準每股＝243.49 ÷ 226.20＝1.08&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;，上行較大來自樂觀情境利潤率與銷售對資本比同時較好。情境差距 124%；不確定性依客觀計分 4 分為「中」（營收波動 1、利潤率高低差 1、單一產品占營收 2），安全邊際 30%。第 6 項「需要外部融資」判否：基準第 1、2 年 FCFF 合計約 −1,161 億，9 月底現金與有價證券約 2,651 億足以支應，2026 年發債與發股是擴張投資的資金來源選擇、不是現金不足被迫融資（作者判斷，見第六題）。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;市價隱含：市價反推（基準折現率）第 1–5 年營收年增 14.5%&lt;span class=&quot;src&quot;&gt;（市價反推未來 5 年營收年增；市價 283.72 美元、收盤 2026-11-16；折現率 9.78%；推導）&lt;/span&gt;，或成長照基準時第 1 年起每年營業利益率 37.6%&lt;span class=&quot;src&quot;&gt;（市價反推第 1 年起每年固定的營業利益率，含穩態；市價 283.72 美元、收盤 2026-11-16；折現率 9.78%；推導）&lt;/span&gt;，兩者是各自單獨放開的解、不同時成立。&lt;/strong&gt;5 年反推低於基準前五年幾何平均約 15.2%&lt;span class=&quot;src&quot;&gt;（推算）&lt;/span&gt;，是因為基準第 5 年已降到 8%，不代表市價比本報告保守。另一算法（超額報酬期間 10 年、利潤率與銷售對資本比取基準第 5 年）市價隱含 10 年營收名目年增約 17.4%、實質約 14.9%–15.4%&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;；1950–2015 年營收 500 億美元以上公司 10 年實質 10% 以上約 3.9%（Mauboussin 等，2016，表 4），此為揭露，不是市價錯誤的證明。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;成長跑道（六項）：①市場空間：雲端未完成訂單 5,608 億約為近四季雲端營收 6.0 倍&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;，搜尋市占約 90% 為第三方數字（部分）。&lt;/strong&gt;②定價能力：付費點擊 +8%、每次點擊成本 +4%&lt;span class=&quot;src&quot;&gt;（10-Q Item 2 ¶117，有證據）&lt;/span&gt;。③營運槓桿：增量營業利益率 2022→2025 約 45.2%、2025→近四季約 40.9%&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;，高於 2025 年利潤率 32.0%（有證據）。④指引達成：公司只給資本支出指引，2026 年由 1,800～1,900 億上修為 1,950～2,050 億、第三季維持（部分；全年實際未出，未畫指引圖）。⑤資金：前九月營運現金流 1,271 億低於資本支出 1,320 億，缺口由發債、發股與特別股補足（有證據）。⑥新事業：其他事業第三季營收 3.7 億、營業虧損 20 億&lt;span class=&quot;src&quot;&gt;（10-Q Item 1 ¶428，申報實績，只列事實、不估值）&lt;/span&gt;；雲端自第二季起認列 TPU 系統營收、金額未單獨揭露&lt;span class=&quot;src&quot;&gt;（10-Q Item 2 ¶45）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;計算核對（2026-11-17，以 11-16 輸入重跑 G1～G4，計算核對第 4 項：產業基準例外）：G1（缺口判斷第 1 項）非上市股權七折計入，不做時中點 −3.13%；G2（缺口判斷第 2 項）遞延所得稅列請求權 +0.87%；G3（缺口判斷第 3 項）特別股以清算優先列請求權 +0.20%；三項價格位置都不變。&lt;/strong&gt;G4 產業基準例外過門檻：改回公版預設 Information Services（beta 中值 0.96）時中點 285.07（+17.07%）、區間 235.21–356.14，收盤價仍在區間內、位置不變；核對判定部分支持、未給建議值。本報告不採：Information Services 加槓桿 beta 0.76（去槓桿 0.74）與 Alphabet 週 beta 1.275 差約 0.51，收入以徵信與資料訂閱為主，而 Alphabet 約 73.2% 營收來自廣告&lt;span class=&quot;src&quot;&gt;（10-K Item 8 ¶210，推導）&lt;/span&gt;。Software (Entertainment) 不主張業務相近，只因 beta 接近 Alphabet 本身的市場風險（作者判斷）；公版允許的 Advertising 對照：WACC 9.62%、中點 250.95（+3.1%）、位置合理&lt;span class=&quot;src&quot;&gt;（估值模型暫存複本試跑，推導）&lt;/span&gt;。此例外已列出。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;一次性項目：近四季有兩筆法務費用——2026 年第二季 PriceRunner（比價網站業者）案約 21 億&lt;span class=&quot;src&quot;&gt;（10-Q Item 1 ¶341）&lt;/span&gt;、第三季歐盟數位市場法罰款 10 億&lt;span class=&quot;src&quot;&gt;（10-Q Item 1 ¶339，已上訴）&lt;/span&gt;——合計約 31 億、占近四季營業利益 1,570 億約 2%&lt;span class=&quot;src&quot;&gt;（推算）&lt;/span&gt;，都視為經常性的法務成本，不另調整估值。&lt;/strong&gt;核心 EPS 10.42 美元＝營業利益扣稅後除以稀釋股數，排除權益證券評價損益。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;!--新圖表--&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;缺口判斷影響幅度&lt;/h3&gt;&lt;div class=&quot;wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;市價隱含第 20 年倍數（倍）：基準折現率下市價隱含 17.6 倍、模型 10.5 倍（約 1.7 倍差距）；參考帶 p25–p75 6.0–28.1 倍（機械回測樣本，非市場全體；分產業的筆數與公司數少，僅供參考）；特例：明示期 20 年，參考帶是 10 年機械回測，倍數不直接比，僅供參考。只描述，不進評等、不是目標價（估值結果）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 620 242&quot; role=&quot;img&quot; aria-label=&quot;市價隱含第 20 年倍數&quot; class=&quot;chart&quot; style=&quot;max-width:775px&quot;&gt;&lt;line x1=&quot;252.0&quot; x2=&quot;252.0&quot; y1=&quot;22&quot; y2=&quot;216&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;252.0&quot; y=&quot;234&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;0&lt;/text&gt;&lt;line x1=&quot;308.3&quot; x2=&quot;308.3&quot; y1=&quot;22&quot; y2=&quot;216&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;308.3&quot; y=&quot;234&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;5&lt;/text&gt;&lt;line x1=&quot;364.7&quot; x2=&quot;364.7&quot; y1=&quot;22&quot; y2=&quot;216&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;364.7&quot; y=&quot;234&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;10&lt;/text&gt;&lt;line x1=&quot;421.0&quot; x2=&quot;421.0&quot; y1=&quot;22&quot; y2=&quot;216&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;421.0&quot; y=&quot;234&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;15&lt;/text&gt;&lt;line x1=&quot;477.3&quot; x2=&quot;477.3&quot; y1=&quot;22&quot; y2=&quot;216&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;477.3&quot; y=&quot;234&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;20&lt;/text&gt;&lt;line x1=&quot;533.7&quot; x2=&quot;533.7&quot; y1=&quot;22&quot; y2=&quot;216&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;533.7&quot; y=&quot;234&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;25&lt;/text&gt;&lt;line x1=&quot;590.0&quot; x2=&quot;590. 稅負債淨額列其他請求權&lt;/text&gt;&lt;rect x=&quot;369.3&quot; y=&quot;49&quot; width=&quot;5.6&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;382.9&quot; y=&quot;63&quot; class=&quot;val&quot;&gt;+0.9%&lt;/text&gt;&lt;text x=&quot;274&quot; y=&quot;101&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;G3. 強制轉換特別股以清算優先列請求權…&lt;/text&gt;&lt;rect x=&quot;369.3&quot; y=&quot;87&quot; width=&quot;2.0&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;378.5&quot; y=&quot;101&quot; class=&quot;val&quot;&gt;+0.2%&lt;/text&gt;&lt;text x=&quot;274&quot; y=&quot;139&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;G4. 產業基準改用 Software …&lt;/text&gt;&lt;rect x=&quot;369.3&quot; y=&quot;125&quot; width=&quot;109.8&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--neg)&quot;/&gt;&lt;text x=&quot;487.1&quot; y=&quot;139&quot; class=&quot;val&quot;&gt;+17.1%&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;/div&gt;&lt;!--/新圖表--&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;合理價值怎麼來：三個情境與權重&lt;/h3&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt&quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;每股價值（基準折現率 9.8%）&lt;/th&gt;&lt;th&gt;權重&lt;/th&gt;&lt;th&gt;折現率高端 10.8%&lt;/th&gt;&lt;th&gt;折現率低端 8.8%&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;121.10&lt;/td&gt;&lt;td&gt;25%&lt;/td&gt;&lt;td&gt;104.69&lt;/td&gt;&lt;td&gt;143.39&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;226.20&lt;/td&gt;&lt;td&gt;50%&lt;/td&gt;&lt;td&gt;190.21&lt;/td&gt;&lt;td&gt;275.45&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;400.48&lt;/td&gt;&lt;td&gt;25%&lt;/td&gt;&lt;td&gt;333.76&lt;/td&gt;&lt;td&gt;492.14&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;加權（合理價值）&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;b&gt;243.49&lt;/b&gt;&lt;/td&gt;&lt;td&gt;100%&lt;/td&gt;&lt;td&gt;&lt;b&gt;204.71&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;b&gt;296.61&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;中點是三個情境的加權：0.25×121.10＋0.5×226.20＋0.25×400.48≈243.49（一般權重組合）。區間上下緣是同樣三個情境、權重不變，只把折現率換成區間高端或低端重算後加權：高端約 10.8% → 204.71（下緣），低端約 8.8% → 296.61（上緣）。買入上限 170.45＝中點 × (1－安全邊際 30%，不確定性中)，股價在此以下才有 30% 安全邊際。情境表說明合理價值怎麼組成，不是單一目標價；非買賣建議。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;市價隱含第 20 年倍數（只描述，不進評等）&lt;/h3&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;基準情境：市價隱含 vs 模型假設的第 20 年 EV/EBIT（金額百萬美元）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;折現率&lt;/th&gt;&lt;th&gt;WACC&lt;/th&gt;&lt;th&gt;市場 EV&lt;/th&gt;&lt;th&gt;明示期現值&lt;/th&gt;&lt;th&gt;終值折現因子&lt;/th&gt;&lt;th&gt;第 20 年 EBIT&lt;/th&gt;&lt;th&gt;市價隱含倍數&lt;/th&gt;&lt;th&gt;模型終值倍數&lt;/th&gt;&lt;th&gt;隱含÷模型&lt;/th&gt;&lt;th&gt;現在 EV／次年 EBIT&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;低折現率&lt;/td&gt;&lt;td&gt;8.78%&lt;/td&gt;&lt;td&gt;3,342,419&lt;/td&gt;&lt;td&gt;1,764,090&lt;/td&gt;&lt;td&gt;0.186&lt;/td&gt;&lt;td&gt;646,338&lt;/td&gt;&lt;td&gt;13.1 倍&lt;/td&gt;&lt;td&gt;12.3 倍&lt;/td&gt;&lt;td&gt;1.07&lt;/td&gt;&lt;td&gt;17.7 倍&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;9.78%&lt;/td&gt;&lt;td&gt;3,342,419&lt;/td&gt;&lt;td&gt;1,581,128&lt;/td&gt;&lt;td&gt;0.155&lt;/td&gt;&lt;td&gt;646,338&lt;/td&gt;&lt;td&gt;17.6 倍&lt;/td&gt;&lt;td&gt;10.5 倍&lt;/td&gt;&lt;td&gt;1.68&lt;/td&gt;&lt;td&gt;17.7 倍&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;高折現率&lt;/td&gt;&lt;td&gt;10.78%&lt;/td&gt;&lt;td&gt;3,342,419&lt;/td&gt;&lt;td&gt;1,420,709&lt;/td&gt;&lt;td&gt;0.129&lt;/td&gt;&lt;td&gt;646,338&lt;/td&gt;&lt;td&gt;23.0 倍&lt;/td&gt;&lt;td&gt;9.1 倍&lt;/td&gt;&lt;td&gt;2.52&lt;/td&gt;&lt;td&gt;17.7 倍&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;算式：市場 EV＝模型 EV +（現價 − 模型每股價值）× 股數（股權橋與模型相同）；隱含倍數＝（市場 EV − 明示期現值）÷ 終值折現因子 ÷ 第 20 年 EBIT；模型終值倍數＝模型終值 ÷ 第 20 年 EBIT。參考帶：p25 6.0、中位 15.5、p75 28.1、p90 46.7 倍（機械回測樣本，非市場全體；分產業的筆數與公司數少，僅供參考；機械回測訓練期 2016–2021 全部回測日（回測資料隱含倍數結果，1,810 筆中訓練期 1,046 筆；產業＝回測樣本的 Damodaran 產業））。只描述，不進價格位置、研究評等與合理價值。&lt;/p&gt;&lt;p class=&quot;cap&quot;&gt;特例：明示期 20 年，參考帶是 10 年機械回測，倍數不直接比，僅供參考。&lt;/p&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;&lt;b&gt;合理價值 vs 市價隱含倍數（作者判讀）：&lt;/b&gt;市價隱含第 20 年 EV（企業價值）/EBIT（息稅前利益，本報告以營業利益計）約 17.6 倍，是本報告基準模型終值倍數 10.5 倍 的 1.68 倍。特例：本報告衰退期 15 年使明示期達 20 年，軟體與網路參考帶（中位 15.5 倍）是 10 年機械回測，倍數不直接比、僅供參考；模型倍數較低是因 15 年後永續期 ROIC 降到 18.9%，價值已在較長的衰退期計入。只描述，不作評等理由。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;如果 10 年後倍數是 15.5 倍，機率加權每股約 287 美元（條件式，非目標價、非買賣建議，不進評等）&lt;/h3&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;第 20 年 EV/EBIT 倍數對照（三情境各用自己的明示期 FCFF 與第 20 年 EBIT；權重 一般：保守 25%／基準 50%／樂觀 25%；基準 WACC 9.78%）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;第 20 年倍數&lt;/th&gt;&lt;th&gt;機率加權每股（美元）&lt;/th&gt;&lt;th&gt;折現率低高區間&lt;/th&gt;&lt;th&gt;白話換算&lt;/th&gt;&lt;th&gt;現價相對&lt;/th&gt;&lt;th&gt;說明&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;模型假設倍數&lt;/td&gt;&lt;td&gt;10.5 倍&lt;/td&gt;&lt;td&gt;243.49&lt;/td&gt;&lt;td&gt;204.71–296.61&lt;/td&gt;&lt;td&gt;等於折現率減永續成長約 6.8%（模型 6.8%）&lt;/td&gt;&lt;td&gt;現價在區間內&lt;/td&gt;&lt;td&gt;各情境用自己的模型終值倍數（表列為基準情境）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;穩態理論上限&lt;/td&gt;&lt;td&gt;12.5 倍&lt;/td&gt;&lt;td&gt;260.74&lt;/td&gt;&lt;td&gt;228.90–298.33&lt;/td&gt;&lt;td&gt;等於折現率減永續成長約 5.7%（模型 6.8%）&lt;/td&gt;&lt;td&gt;現價在區間內&lt;/td&gt;&lt;td&gt;（1−t）（1+g）÷（WACC−g）：再投資為零（ROIC 無限大）時的上限；t＝第 20 年 1−NOPAT÷EBIT&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;參考帶中位（軟體與網路）&lt;/td&gt;&lt;td&gt;15.5 倍&lt;/td&gt;&lt;td&gt;287.29&lt;/td&gt;&lt;td&gt;251.05–330.22&lt;/td&gt;&lt;td&gt;等於折現率減永續成長約 4.6%（模型 6.8%）&lt;/td&gt;&lt;td&gt;現價在區間內&lt;/td&gt;&lt;td&gt;所選參考帶（大類）中位&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;同業今日 EV/EBIT 中位&lt;/td&gt;&lt;td&gt;24.0 倍&lt;/td&gt;&lt;td&gt;361.43&lt;/td&gt;&lt;td&gt;312.89–419.25&lt;/td&gt;&lt;td&gt;等於折現率減永續成長約 3.0%（模型 6.8%）&lt;/td&gt;&lt;td&gt;現價低於區間&lt;/td&gt;&lt;td&gt;估值結果 multiples.ev_ebit.peer_quartiles.p50（今天的倍數，不是 10 年後）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;參考帶 p75（軟體與網路）&lt;/td&gt;&lt;td&gt;28.1 倍&lt;/td&gt;&lt;td&gt;397.20&lt;/td&gt;&lt;td&gt;342.72–462.19&lt;/td&gt;&lt;td&gt;等於折現率減永續成長約 2.5%（模型 6.8%）&lt;/td&gt;&lt;td&gt;現價低於區間&lt;/td&gt;&lt;td&gt;所選參考帶（大類）p75&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;市價隱含&lt;/td&gt;&lt;td&gt;17.6 倍&lt;/td&gt;&lt;td&gt;305.75&lt;/td&gt;&lt;td&gt;266.44–352.38&lt;/td&gt;&lt;td&gt;等於折現率減永續成長約 4.0%（模型 6.8%）&lt;/td&gt;&lt;td&gt;現價在區間內&lt;/td&gt;&lt;td&gt;基準情境、基準折現率反推（只用基準情境，套到三情境後加權不必等於現價）&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;如果 10 年後倍數是 X，三情境各用自己的明示期 FCFF 與第 20 年 EBIT、以基準折現率折現，依政策情境機率權重加權的每股價值；區間只換折現率（①模型列為合理價值區間）。「折現率減永續成長」＝(1+g)(1−t)(1−g/ROIC)÷倍數（基準情境永續參數）。條件式，非目標價、非買賣建議，不進評等。模型假設倍數那一列等於合理價值（中點 243.49）。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;合理性與一致性檢查（只顯示，不改估值與評等）&lt;/h3&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;每項都有反方向版本；「方向」是亮燈時模型偏保守還是偏積極&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;編號&lt;/th&gt;&lt;th&gt;檢查&lt;/th&gt;&lt;th&gt;燈號&lt;/th&gt;&lt;th&gt;方向&lt;/th&gt;&lt;th&gt;說明&lt;/th&gt;&lt;th&gt;反方向條件&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;S1&lt;/td&gt;&lt;td&gt;合理價中點隱含本益比對照營收成長&lt;/td&gt;&lt;td&gt;綠&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;合理價中點 ÷ 近四季 EPS（替代未來一年 EPS，資料未存遠期 EPS）＝23.4 倍；近四季營收年增 22.2%&lt;/td&gt;&lt;td&gt;反方向：年增 &amp;lt; 5% 且 &amp;gt; 30 倍黃、&amp;gt; 40 倍紅&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;S2&lt;/td&gt;&lt;td&gt;DCF 中點與其他方法中點差距&lt;/td&gt;&lt;td&gt;綠&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;其他方法中點的中位數 289.98（3 法：自身・近五年（2021-11-16 起）〔EV／營業利益〕、同業現行（MSFT、META、AMZN）〔EV／營業利益〕、自身・近五年（2021-11-16 起）〔EV／自由現金流〕）÷ DCF 中點 243.49&lt;/td&gt;&lt;td&gt;反方向：比值 &amp;lt; 0.67 黃、&amp;lt; 0.5 紅（DCF 比其他方法高很多）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;S3&lt;/td&gt;&lt;td&gt;折現率減市價反推折現率&lt;/td&gt;&lt;td&gt;綠&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;採用 9.78%，市價反推（基準情境現價隱含年報酬）8.64%，差 +1.1 個百分點&lt;/td&gt;&lt;td&gt;反方向：採用比反推低 2 點以上黃、3 點以上紅&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;S4&lt;/td&gt;&lt;td&gt;終值占總價值比例&lt;/td&gt;&lt;td&gt;綠&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;基準情境終值現值占企業價值 40%&lt;/td&gt;&lt;td&gt;反方向：&amp;lt; 25% 黃（價值幾乎全靠明示期）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;S5&lt;/td&gt;&lt;td&gt;終值倍數落點&lt;/td&gt;&lt;td&gt;黃&lt;/td&gt;&lt;td&gt;偏保守&lt;/td&gt;&lt;td&gt;模型最後一年 EV/EBIT 10.5 倍；參考帶（軟體與網路）p25 6.0 中位 15.5 p75 28.1；護城河 寬；護城河寬卻低於 p25 與中位數的中點；明示期 20 年、參考帶是 10 年，僅供參考&lt;/td&gt;&lt;td&gt;反方向：高於 p75 紅、護城河無而高於中位黃（已含）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;S6&lt;/td&gt;&lt;td&gt;保守（或積極）假設疊加項數&lt;/td&gt;&lt;td&gt;綠&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;保守：利潤率（首年比近四季 -1.3 點）、終值（護城河寬或窄卻低於參考帶中位）；積極：成長（基準首年比近四季 +2.8 點）&lt;/td&gt;&lt;td&gt;反方向：積極項數 3 黃、4 以上紅（已含）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;S9&lt;/td&gt;&lt;td&gt;樂觀情境低於現價要說明&lt;/td&gt;&lt;td&gt;綠&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;現價在保守與樂觀之間&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;S10&lt;/td&gt;&lt;td&gt;DCF 情境範圍與其他方法是否完全錯開&lt;/td&gt;&lt;td&gt;綠&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;樂觀 400.48、保守 121.10；其他方法最低下緣 48.76、最高上緣 391.45&lt;/td&gt;&lt;td&gt;反方向：保守高於所有其他方法上緣紅（已含）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;S7&lt;/td&gt;&lt;td&gt;折現率跨公司排序&lt;/td&gt;&lt;td&gt;黃&lt;/td&gt;&lt;td&gt;偏保守&lt;/td&gt;&lt;td&gt;BFAM（風險分 2 對 0，折現率 7.59% 低於本公司 9.78%）；FTDR（風險分 2 對 0，折現率 8.69% 低於本公司 9.78%）；NVO（風險分 2 對 0，折現率 8.49% 低於本公司 9.78%）；SFM（風險分 2 對 0，折現率 8.67% 低於本公司 9.78%）&lt;/td&gt;&lt;td&gt;反方向：本公司風險分高 2 以上、折現率卻較低時，記在對方公司（同一規則兩頭都檢）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;S8&lt;/td&gt;&lt;td&gt;品質倒掛&lt;/td&gt;&lt;td&gt;綠&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;反方向：生意 C 高於 B 中位（已含）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;C1&lt;/td&gt;&lt;td&gt;護城河用詞統一寬／窄／無&lt;/td&gt;&lt;td&gt;黃&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;出現強／中／弱用法&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;C2&lt;/td&gt;&lt;td&gt;兩頁不並存兩套字母評等&lt;/td&gt;&lt;td&gt;綠&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;C3&lt;/td&gt;&lt;td&gt;假設與自己的護城河評分一致（P4）&lt;/td&gt;&lt;td&gt;綠&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;C4&lt;/td&gt;&lt;td&gt;同一事件期間描述一致（指引達成連續季數）&lt;/td&gt;&lt;td&gt;綠&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;C5&lt;/td&gt;&lt;td&gt;同一指標不同段落同值&lt;/td&gt;&lt;td&gt;綠&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;比對 9 個指標、24 處，沒有對不上&lt;/td&gt;&lt;td&gt;不分方向：任一處寫高或寫低都會亮；條件句、敏感度試算、其他期間與情境的數字不比（寧可漏報）&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;!--成長型價格參考--&gt;&lt;div class=&quot;block&quot; id=&quot;growth-ref&quot;&gt;&lt;h3&gt;成長型價格參考：報酬門檻價、五年報酬矩陣、林區比值（只描述，不進評等，非買賣建議）&lt;/h3&gt;&lt;p class=&quot;cap&quot;&gt;這一段只描述，不進研究評等、不改價格位置，也不是目標價；三種情境並列、不合成單一數字，數字是「該情境成真時」的條件式推算，不是預期報酬。非買賣建議。&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;一、報酬門檻價：收盤 2026-11-16 股價 283.72 美元（三情境並列；條件式推算，非目標價）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;年報酬 7% 的每股價格（美元）&lt;/th&gt;&lt;th&gt;年報酬 8% 的每股價格（美元）&lt;/th&gt;&lt;th&gt;年報酬 9% 的每股價格（美元）&lt;/th&gt;&lt;th&gt;年報酬 10% 的每股價格（美元）&lt;/th&gt;&lt;th&gt;現價隱含年報酬&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;211.47&lt;/td&gt;&lt;td&gt;167.17&lt;/td&gt;&lt;td&gt;137.85&lt;/td&gt;&lt;td&gt;117.09&lt;/td&gt;&lt;td&gt;6.0%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;427.40&lt;/td&gt;&lt;td&gt;328.31&lt;/td&gt;&lt;td&gt;263.18&lt;/td&gt;&lt;td&gt;217.38&lt;/td&gt;&lt;td&gt;8.6%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;776.41&lt;/td&gt;&lt;td&gt;590.84&lt;/td&gt;&lt;td&gt;469.27&lt;/td&gt;&lt;td&gt;384.10&lt;/td&gt;&lt;td&gt;11.8%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;算法：各情境的 10 年現金流與終值改用門檻當折現率，經同一股權橋換成每股；股價等於這個價格時，該情境成真的現價隱含年報酬就等於門檻（兩者互為反函數）。&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;二、五年報酬矩陣：現價買進、持有 5 年的年化報酬（三情境 × 三種第 5 年倍數；推導，條件式，非預期報酬）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;第 5 年 EBIT（估值輸入單位，推導）&lt;/th&gt;&lt;th&gt;維持現在 21.3 倍&lt;/th&gt;&lt;th&gt;縮四分之一 16.0 倍&lt;/th&gt;&lt;th&gt;回到參考帶中位（軟體與網路） 15.5 倍&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;170,885.1&lt;/td&gt;&lt;td&gt;3.2%&lt;/td&gt;&lt;td&gt;-2.2%&lt;/td&gt;&lt;td&gt;-2.8%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;306,457.2&lt;/td&gt;&lt;td&gt;15.1%&lt;/td&gt;&lt;td&gt;8.9%&lt;/td&gt;&lt;td&gt;8.3%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;460,849.6&lt;/td&gt;&lt;td&gt;25.1%&lt;/td&gt;&lt;td&gt;18.5%&lt;/td&gt;&lt;td&gt;17.8%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;算法：現價買進、持有 5 年：第 1–5 年自由現金流與第 5 年企業價值（倍數 × 該情境第 5 年 EBIT）折回今天、經今日股權橋與股數換成每股，解出使每股等於現價的年報酬（與現價隱含年報酬同一算法，只是第 5 年改用倍數計價）；不另估 5 年後的淨債務與股數。企業價值 ÷ 當年 EBIT 口徑與市價隱含第 20 年倍數、參考帶相同。推導。現在倍數＝市場企業價值 3,342,419.3 ÷ 近四季營業利益 156,976.0（估值輸入 company_metrics.ebit）＝21.3 倍；縮四分之一＝現在倍數 × 0.75。參考帶：大類層「軟體與網路」中位 15.5 倍（機械回測樣本，非市場全體；分產業的筆數與公司數少，僅供參考）。&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;三、林區比值（只給比值與口徑；成長率與本益比的口徑同「PEG 與林區檢查」表的基準情境推估那一列）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;數值&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;林區分類&lt;/td&gt;&lt;td&gt;穩定成長股（Stalwart）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;成長率（基準情境推估（稅後營業利益年增－股數年變化））&lt;/td&gt;&lt;td&gt;13.0%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;本益比&lt;/td&gt;&lt;td&gt;27.2 倍&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股息殖利率&lt;/td&gt;&lt;td&gt;0.3%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;本益比 ÷ 成長率&lt;/td&gt;&lt;td&gt;2.09&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;（成長率＋股息殖利率）÷ 本益比&lt;/td&gt;&lt;td&gt;0.49&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;林區以本益比約等於成長率為參考（二手來源轉述）；本表不設門檻。只給比值與口徑，不作便宜或昂貴的判斷，不進研究評等與價格位置。非買賣建議。&lt;/p&gt;&lt;/div&gt;&lt;!--/成長型價格參考--&gt;&lt;div class=&quot;note-box&quot;&gt;&lt;b&gt;同業與歷史倍數交叉核對（不進評等）：258–309 美元&lt;/b&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;依同業的企業價值／營業利益倍數與自身歷史本益比換算的每股價值，各法 25 百分位的中位數到 75 百分位的中位數；不是股價波動範圍，也不是合理價值。原稱「市場情緒區間」；2026-11-11 起只作交叉核對，不決定價格位置與研究評等（價格位置對稱四級：便宜、偏低、合理、偏貴，只看內在價值；同業與歷史倍數只作標註）。同業僅 3 家，分位僅供參考。&lt;/p&gt;&lt;/div&gt;&lt;!--目標區間:第五題--&gt;&lt;div class=&quot;block&quot; id=&quot;target-body&quot;&gt;&lt;h3&gt;各情境成真時的價值（一年後，條件式、非買賣建議）&lt;/h3&gt;&lt;p class=&quot;cap&quot;&gt;條件式目標區間：三種情境各自成真時的每股價值區間，不是股價預測，三段不合成單一數字；非買賣建議。不影響合理價值、價格位置與研究評等。&lt;/p&gt;&lt;p&gt;算法：各情境每股價值（折現率高低兩端）×（1＋股權成本 9.99%）− 未來 12 個月每股股利 0.88 美元（作者輸入：8-K 2026-10-28 新聞稿 §9：董事會 2026-10 宣告 A、B、C 類股季股利每股 0.22 美元；0.22 × 4＝0.88（推導，未計 12 個月內可能的調升；強制轉換特別股股利不計，特別股列其他請求權））；回購不加回。起點 2026-11-16 收盤，終點 2027-11-16。三段是各情境在折現率上下兩端的每股價值向前推 12 個月，不是價格機率分布的切片；段與段之間可能有空白，也可能重疊。區間主要寬度來自折現率不確定，不是 12 個月內的營運變化。&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt&quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;機率（政策權重，未經歷史校準）&lt;/th&gt;&lt;th&gt;目標區間（美元）&lt;/th&gt;&lt;th&gt;相對現價&lt;/th&gt;&lt;th&gt;關鍵假設（估值輸入）&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;25%&lt;/td&gt;&lt;td&gt;&lt;b&gt;114.27–156.84&lt;/b&gt;&lt;/td&gt;&lt;td&gt;−60%～−45%&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;第 1 年營收 +15.0%；營業利益率 30.0%；穩態 25.0%；永續成長 3.0%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;50%&lt;/td&gt;&lt;td&gt;&lt;b&gt;208.33–302.09&lt;/b&gt;&lt;/td&gt;&lt;td&gt;−27%～+6%&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;第 1 年營收 +25.0%；營業利益率 32.0%；穩態 31.0%；永續成長 3.0%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;25%&lt;/td&gt;&lt;td&gt;&lt;b&gt;366.22–540.43&lt;/b&gt;&lt;/td&gt;&lt;td&gt;+29%～+90%&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;第 1 年營收 +31.0%；營業利益率 33.0%；穩態 39.0%；永續成長 3.0%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;口徑：報告中「現價隱含年報酬（基準情境，非預期報酬）約 8.6%」是以現價買進、持有該情境全期現金流（含永續價值）的年化報酬；這裡的目標區間是 12 個月後各情境每股價值的前推，兩者口徑不同，不能互相換算（例如不能用前者推 12 個月後的價格）。&lt;/p&gt;&lt;h4 style=&quot;margin-top:14px&quot;&gt;每一段要成立，市場這一面需要什麼、正在顯示什麼&lt;/h4&gt;&lt;ul class=&quot;prose&quot;&gt;&lt;li&gt;保守段代表值 132.3（基準折現率前推）要成立，一年後EV／營業利益需約 9.0 倍（現在 21.3 倍，低於現在倍數）；過去一年逐日重建的交易日中，99% 以上高於這個倍數、不到 1% 低於這個倍數（推導）；同規模同成長低於 p25。這是把價值翻成倍數的讀法，不是預測市場會給這個倍數。&lt;/li&gt;&lt;li&gt;基準段代表值 247.9（基準折現率前推）要成立，一年後EV／營業利益需約 15.4 倍（現在 21.3 倍，低於現在倍數）；過去一年逐日重建的交易日中，99% 以上高於這個倍數、不到 1% 低於這個倍數（推導）；同規模同成長約第 44 百分位（p25–p75 間線性內插，推導）。這是把價值翻成倍數的讀法，不是預測市場會給這個倍數。&lt;/li&gt;&lt;li&gt;樂觀段代表值 439.6（基準折現率前推）要成立，一年後EV／營業利益需約 25.9 倍（現在 21.3 倍，高於現在倍數）；過去一年逐日重建的交易日中，92% 高於這個倍數、8% 低於這個倍數（推導）；同規模同成長約第 71 百分位（p25–p75 間線性內插，推導）。這是把價值翻成倍數的讀法，不是預測市場會給這個倍數。&lt;/li&gt;&lt;li&gt;12 個月選擇權隱含分布：未取得（到期日 2027-12-17 價平附近沒有有效報價（盤前盤後或無成交時 Yahoo 常給佔位值））；不補值。&lt;/li&gt;&lt;li&gt;公債殖利率下降 1 個百分點時，保守／基準／樂觀段代表值（基準折現率前推，不是區間兩端的平均）為 154.4／297.1／531.3；目前 132.3／247.9／439.6；上升 1 個百分點時為 115.9／211.5／371.9（美元，股權成本同幅變動，其他假設不變）。&lt;/li&gt;&lt;li&gt;分析師預估：本財年每股盈餘預估 19.60，較 30 天前 20.59 −4.8%（下修），近 30 天 0 家上修、45 家下修；下一財年每股盈餘預估 14.93，較 30 天前 15.08 −1.0%（持平），近 30 天 19 家上修、26 家下修。只描述預估修正的方向，不當證據，也不是目標區間的任一端。&lt;/li&gt;&lt;li&gt;券商目標價近 90 天有 22 家調整：上調 4、下調 16、持平 2（只揭露，不是本報告的目標價）。&lt;/li&gt;&lt;li&gt;上季（Sep 2026，10/28/2026 公布）每股盈餘 2.12，共識預估 2.94，驚奇 -27.89%（Nasdaq）；yfinance 另列 2026-09-30 實際 2.12、預估 3.01、驚奇 -29.54%；兩個來源口徑可能不同（可能是調整後或一般會計準則），公司申報的每股盈餘可對照存檔 8-K 2026-10-28 財報新聞稿（本句未逐項比對），只描述、不當證據。&lt;/li&gt;&lt;/ul&gt;&lt;p class=&quot;cap&quot;&gt;以上只引用已存檔的數字描述條件與現況，不是預測；選擇權機率是風險中立機率、不是真實機率，不改情境權重；分析師預估與券商目標價不當證據；細節表在附錄估值細節。&lt;/p&gt;&lt;p&gt;&lt;b&gt;需要重算區間的事件：&lt;/b&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;搜尋反壟斷案（美國哥倫比亞特區聯邦地方法院）2025-12 的最終判決限制 Google 搜尋的分發方式，並要求與特定競爭者分享搜尋資料、提供搜尋聯合供應服務；Google 2026-01 提出上訴並聲請暫停部分補救措施（法院以時機未到駁回，待補救範圍更明確後可再聲請），司法部與各州檢察長 2026-02 也上訴，上訴仍在審理中。若上訴判決或暫停實施聲請的結果改變補救措施的範圍（擴大或放寬），搜尋營收、分發成本與利潤率假設需要重算；10-Q 對此案未揭露可估計的損失金額（10-Q 2026-09-30 Part I, Item 1 ¶331）&lt;/li&gt;&lt;li&gt;GFiber 出售交易（2026-03 簽署的最終協議，把 GFiber 股權投入新成立的實體）預計 2026 年底完成：完成後 Google 收到現金 15 億美元、20 億美元應收票據與 49.99% 股權，GFiber 不再合併（改以權益法的未合併 VIE 處理），合併營收基數與 Other Bets 營業損失口徑將改變；10-Q 未揭露 GFiber 營收與營業損失金額，每股影響未取得，不納入估值（10-Q 2026-09-30 Part I, Item 1 ¶294；10-Q 2026-09-30 Part I, Item 1 ¶295；10-Q 2026-09-30 Part I, Item 2 ¶256）&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;b&gt;時程可能延後、落在 12 個月之外的事件：&lt;/b&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;廣告技術反壟斷案（美國維吉尼亞東區聯邦地方法院）2026-09 的補救判決駁回司法部要求的結構性拆分，改命行為性補救（互通性、資料存取、拍賣行為）；法院尚未進入最終判決，進入後 Google 計畫就 2025-04 的不利認定提出上訴，也可能就 2026-09 判決的部分提出上訴；德州東區各州檢察長案的審判排在司法部案補救程序結束之後，10-Q 未給日期。最終判決、上訴結果與德州審判的時程未揭露，可能落在未來 12 個月之外；10-Q 稱無法估計可能損失（10-Q 2026-09-30 Part I, Item 1 ¶332）&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;!--/目標區間:第五題--&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;市價要求的成長：三視角反推、假設對照實績、歷史基準比率與市價溢價來源&lt;/h3&gt;&lt;p&gt;這一節把現價代回估值模型反解「市場要求什麼」，再和公司實績、同規模公司的歷史比例、市場面的過熱訊號對照；只揭露，不改合理價值、價格位置與研究評等。&lt;/p&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;市價隱含什麼、我們假設什麼、公司做到什麼&lt;/h4&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;視角（其他假設照基準，三者擇一）&lt;/th&gt;&lt;th&gt;市價隱含&lt;/th&gt;&lt;th&gt;本報告基準&lt;/th&gt;&lt;th&gt;實績或對照&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;成長&lt;/td&gt;&lt;td&gt;第 1–5 年營收每年約 14.5%&lt;/td&gt;&lt;td&gt;第 1–5 年平均約 15.4%（推算）&lt;/td&gt;&lt;td&gt;近四季 22.2%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;利潤率&lt;/td&gt;&lt;td&gt;第 1 年起每年（含穩態）營業利益率約 37.6%&lt;/td&gt;&lt;td&gt;第 1 年 32.0%、穩態 31.0%&lt;/td&gt;&lt;td&gt;20.1%–32.1%（近 11 年營業利益率）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;折現率&lt;/td&gt;&lt;td&gt;約 8.6%（使基準情境等於現價的折現率）&lt;/td&gt;&lt;td&gt;加權資本成本 9.8%&lt;/td&gt;&lt;td&gt;10 年期公債 5.12%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;市價隱含折現率約 8.6%，比加權資本成本 9.8% 低約 1.1 個百分點：照基準情境假設，現價隱含的長期報酬低於本報告採用的資金成本；市價要站得住，需要基準以外的假設成立（例如成長或利潤率高於基準，見上兩列），或投資人接受較低的報酬。隱含折現率不是預期報酬；V3 回測（2016–2025，含倖存者偏誤）中，之後一年實際報酬中位多高於隱含值。只揭露，不改研究評等與價格位置；非買賣建議。&lt;/p&gt;&lt;div style=&quot;margin-top:12px&quot;&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;第 1 年營收成長&lt;/th&gt;&lt;th&gt;穩態營業利益率&lt;/th&gt;&lt;th&gt;終端投入資本報酬率（ROIC）&lt;/th&gt;&lt;th&gt;永續成長&lt;/th&gt;&lt;th&gt;對照實績&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;15.0%&lt;/td&gt;&lt;td&gt;25.0%&lt;/td&gt;&lt;td&gt;18.9%&lt;/td&gt;&lt;td&gt;3.0%&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;25.0%&lt;/td&gt;&lt;td&gt;31.0%&lt;/td&gt;&lt;td&gt;18.9%&lt;/td&gt;&lt;td&gt;3.0%&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;31.0%&lt;/td&gt;&lt;td&gt;39.0%&lt;/td&gt;&lt;td&gt;18.9%&lt;/td&gt;&lt;td&gt;3.0%&lt;/td&gt;&lt;td&gt;高於歷史上限（穩態利潤率）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;公司實績&lt;/td&gt;&lt;td&gt;近四季 22.2%&lt;/td&gt;&lt;td&gt;近四季 33.3%；20.1%–32.1%（近 11 年營業利益率）&lt;/td&gt;&lt;td&gt;近四季 37.2%；研發資本化後約 30.7%（2025-12-31 財年，研發資本化對照）&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;p style=&quot;margin-top:8px&quot;&gt;&lt;b&gt;為何樂觀情境的穩態利潤率高於歷史上限（作者說明）：&lt;/b&gt;樂觀穩態利潤率 39% 高於近 11 年上限 32.1%：近四季已達 33.3%，增量營業利益率約 41%–45%（推導，長期財務），雲端分部利益率由 23.7% 升到 36.2%（10-Q 2026-09-30 分部附註），規模擴張讓利潤率仍在改善。&lt;/p&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;市價隱含三視角：把現價代回基準情境，一次只放開一個假設反解（成長、利潤率、折現率），三者擇一成立即可，不是同時需要；折現率視角就是第四題「現價隱含年報酬（基準情境，非預期報酬）」。假設對照：終端 ROIC 低於近四季一半時標「保守於實績」，括號寫原因：產業上限、公司近五年中位上限或等於資金成本是估值框架的上限設定（估值政策），作者選值的理由在估值輸入，都不是資料錯誤；穩態利潤率高於歷史上限標「高於歷史上限」；利潤率仍在改善中的公司（轉型、規模擴張期），歷史上限不一定是天花板，標記只提醒讀者對照，不代表假設錯誤。出處：估值結果（reverse_dcf、implied_return、discount）、估值輸入（scenarios）、財務指標（ROIC_TTM）、產業指標（景氣正常化）、成長推估底稿 與財務歷史（近四季）；推導，只揭露，不改合理價值、價格位置與研究評等。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;市價隱含的成長與歷史基準比率&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;市價隱含 GOOGL 未來 10 年營收實質年增約 14.9%–15.4%（名目 17.4% 減通膨 2.0%–2.5% 的近似，推導）；1950–2015 年營收 500 億美元以上的公司中，10 年間做到實質年增 10% 以上的約 3.9%–0.9%（Mauboussin 等，2016，表 4）。此為揭露，不是市價錯誤的證明。&lt;/p&gt;&lt;p&gt;現價要成立，需把基準情境第 1 年營收成長 25.0% 延續約 7 年（之後新投資報酬等於折現率，不再創造價值；推導，只揭露）。&lt;/p&gt;&lt;p&gt;&lt;b&gt;隱含假設罕見度：歷史罕見&lt;/b&gt;（同規模公司 10 年做到的歷史比例 ≥50% 一般、10%–50% 樂觀、&amp;lt;10% 歷史罕見；只揭露，不改研究評等與價格位置）&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;超額報酬期間&lt;/th&gt;&lt;th&gt;市價隱含營收年增（名目）&lt;/th&gt;&lt;th&gt;約實質（名目減通膨 2.0%–2.5% 的近似，推導）&lt;/th&gt;&lt;th&gt;歷史基準比率（1950–2015）&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;10 年&lt;/td&gt;&lt;td&gt;17.4%&lt;/td&gt;&lt;td&gt;14.9%–15.4%&lt;/td&gt;&lt;td&gt;營收 500 億美元以上：10 年實質年增 10% 以上約 3.9%–0.9%（該組 10 年實質年增中位數 1.1%）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;15 年&lt;/td&gt;&lt;td&gt;13.0%&lt;/td&gt;&lt;td&gt;10.5%–11.0%&lt;/td&gt;&lt;td&gt;原文只有 10 年分布，15、20 年無對照&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;20 年&lt;/td&gt;&lt;td&gt;11.0%&lt;/td&gt;&lt;td&gt;8.5%–9.0%&lt;/td&gt;&lt;td&gt;原文只有 10 年分布，15、20 年無對照&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;做法：超額報酬期間內營收年增固定、利潤率與銷售對資本比取基準情境第 5 年；期間結束後新投資報酬等於折現率（不再創造價值）；永續成長照基準情境。折現率 9.78%、第 5 年利潤率 32.0%。來源：Mauboussin, Callahan &amp;amp; Majd（2016）〈The Base Rate Book〉表 4（第三方轉載，原表 1950–2015 年、實質成長、有存活偏差）。這張表只說明「市價需要多強、多久的成長才成立」，不改合理價值、買入上限與價格位置；歷史比例低代表市價需要少見的結果，不代表市價錯誤。通膨假設 2.0%–2.5% 依 Morningstar 2020-10 方法，實質年增為名目直接減通膨的近似。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;市價溢價來源&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;現價未高於合理價值上緣，下表只描述市場面，不代表有溢價。溢價訊號集中在資金與情緒（部位與衍生品、擁擠度）、基本面預期（隱含假設罕見度）。倍數重估、總經與利率無訊號。只揭露，不改研究評等與價格位置，也不代表市價錯誤。&lt;/p&gt;&lt;p&gt;EPS 預估：+1y（2027 財年，推導） 預估 90 天 1.0%（持平；判斷窗口為 90 天，±2% 內視為持平），近 30 天上修減下修 -7 家；yfinance 預估是取得當下快照，股價 90 天變化以批次收盤日為終點，兩者日期可能差幾天；取得 2026-11-17，晚於收盤日 2026-11-16。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;來源類別&lt;/th&gt;&lt;th&gt;數值&lt;/th&gt;&lt;th&gt;過熱訊號&lt;/th&gt;&lt;th&gt;說明／存檔位置&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;隱含假設罕見度&lt;/td&gt;&lt;td&gt;基本面預期&lt;/td&gt;&lt;td&gt;歷史罕見&lt;/td&gt;&lt;td&gt;有&lt;/td&gt;&lt;td&gt;價值判斷&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;倍數擴張&lt;/td&gt;&lt;td&gt;倍數重估&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;不適用&lt;/td&gt;&lt;td&gt;EPS 年化變動 +89%，超過 ±50%（基期失真）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;預估背離&lt;/td&gt;&lt;td&gt;倍數重估&lt;/td&gt;&lt;td&gt;+1y（2027 財年，推導） EPS 預估 90 天 +1.0%（持平；90 天變化 ±2% 內視為持平），同期股價 -17.6% → 預估未跟上下跌，偏情緒&lt;/td&gt;&lt;td&gt;無&lt;/td&gt;&lt;td&gt;價值判斷&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;本益比水位&lt;/td&gt;&lt;td&gt;倍數重估&lt;/td&gt;&lt;td&gt;現在 14.8 倍，自身五年 p75 27.3 倍&lt;/td&gt;&lt;td&gt;無&lt;/td&gt;&lt;td&gt;歷史本益比&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股債利差&lt;/td&gt;&lt;td&gt;總經與利率&lt;/td&gt;&lt;td&gt;近期百分位 81%（0% 最貴）&lt;/td&gt;&lt;td&gt;無&lt;/td&gt;&lt;td&gt;歷史本益比&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;整體市場風險溢價&lt;/td&gt;&lt;td&gt;總經與利率&lt;/td&gt;&lt;td&gt;Damodaran 隱含風險溢價 4.20%（2026-10-01）&lt;/td&gt;&lt;td&gt;不適用&lt;/td&gt;&lt;td&gt;只存當月值，沒有歷史序列可比中位數；要下載 Damodaran 歷史表需取得授權&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;動能&lt;/td&gt;&lt;td&gt;資金與情緒&lt;/td&gt;&lt;td&gt;相對 200 日均線 -16%；12 個月（2025-11-13 起） +2% 對 S&amp;amp;P500 +11%&lt;/td&gt;&lt;td&gt;無&lt;/td&gt;&lt;td&gt;市場溫度、#/動能&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;部位與衍生品&lt;/td&gt;&lt;td&gt;資金與情緒&lt;/td&gt;&lt;td&gt;選擇權賣權對買權量比 偏熱；空單分位 0%、回補天數分位 25%&lt;/td&gt;&lt;td&gt;有&lt;/td&gt;&lt;td&gt;市場溫度、#/流動性&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;擁擠度&lt;/td&gt;&lt;td&gt;資金與情緒&lt;/td&gt;&lt;td&gt;20 日均換手率在自身五年 80% 分位；被發現程度 高&lt;/td&gt;&lt;td&gt;有&lt;/td&gt;&lt;td&gt;市場溫度&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;股價漲跌拆解：EPS 成長 vs 本益比變化（年化對數點，推導；不含股利、申報 EPS）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;期間&lt;/th&gt;&lt;th&gt;股價年化&lt;/th&gt;&lt;th&gt;EPS 貢獻&lt;/th&gt;&lt;th&gt;本益比貢獻&lt;/th&gt;&lt;th&gt;本益比&lt;/th&gt;&lt;th&gt;主因&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;1年&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;EPS 年化變動 +89%，超過 ±50%（基期失真）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;3年&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;EPS 年化變動 +54%，超過 ±50%（基期失真）&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;門檻： 2026-11-04 照草案核定。各列只描述市場面，不改合理價值、研究評等與價格位置，非買賣建議。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;multiple-conditions&quot;&gt;&lt;h3&gt;長期倍數條件：要漲 3／5／10 倍需要什麼&lt;/h3&gt;&lt;p&gt;反過來問：股價要在 5 年或 10 年內每股漲到 3、5、10 倍，期末營收、利潤率、估值倍數要做到多少，歷史上同規模公司有多少做到過。&lt;b&gt;條件反推，非預測、非機率、非目標價、非買賣建議&lt;/b&gt;；不改研究評等、價格位置與目標區間。&lt;/p&gt;&lt;p class=&quot;cap&quot;&gt;主列＝產業倍數＋基準穩態利潤率；括號是三種期末倍數口徑（不重估、產業、自身本益比 p25）的範圍。股數年稀釋率 -2.4%（推導）。罕見度：5 年用自有 SEC 名目分布、10 年用 Base Rate Book（1950–2015，實質）。&lt;/p&gt;&lt;ul&gt;&lt;li&gt;3 倍／5 年：營收年增約 16.8%（3 種期末倍數口徑 16.8%–29.2%），歷史罕見（營收 500 億美元以上的公司 5 年約 6.7% 做到）；資金自足&lt;/li&gt;&lt;li&gt;3 倍／10 年：營收年增約 6.8%（3 種期末倍數口徑 6.8%–12.3%），一般（營收 500 億美元以上的公司 10 年約 58.9% 做到）；資金自足&lt;/li&gt;&lt;li&gt;5 倍／5 年：營收年增約 29.6%（3 種期末倍數口徑 29.6%–43.3%），歷史罕見（營收 500 億美元以上的公司 5 年約 1.3% 做到）；資金自足&lt;/li&gt;&lt;li&gt;5 倍／10 年：營收年增約 12.4%（3 種期末倍數口徑 12.4%–18.3%），樂觀～歷史罕見（營收
