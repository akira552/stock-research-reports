uot;middle&quot; fill=&quot;var(--c2)&quot;&gt;樂觀 519&lt;/text&gt;&lt;text x=&quot;140&quot; y=&quot;190.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;年報酬 9%&lt;/text&gt;&lt;circle cx=&quot;221.2&quot; cy=&quot;185.0&quot; r=&quot;7&quot; fill=&quot;var(--c4)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;1.5&quot;&gt;&lt;title&gt;保守：129&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;221.2&quot; y=&quot;171.0&quot; class=&quot;val&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--c4)&quot;&gt;保守 129&lt;/text&gt;&lt;circle cx=&quot;279.3&quot; cy=&quot;185.0&quot; r=&quot;7&quot; fill=&quot;var(--c1)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;1.5&quot;&gt;&lt;title&gt;基準：235&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;279.3&quot; y=&quot;209.0&quot; class=&quot;val&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--c1)&quot;&gt;基準 235&lt;/text&gt;&lt;circle cx=&quot;375.4&quot; cy=&quot;185.0&quot; r=&quot;7&quot; fill=&quot;var(--c2)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;1.5&quot;&gt;&lt;title&gt;樂觀：410&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;375.4&quot; y=&quot;171.0&quot; class=&quot;val&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--c2)&quot;&gt;樂觀 410&lt;/text&gt;&lt;text x=&quot;140&quot; y=&quot;252.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;年報酬 10%&lt;/text&gt;&lt;circle cx=&quot;211.5&quot; cy=&quot;247.0&quot; r=&quot;7&quot; fill=&quot;var(--c4)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;1.5&quot;&gt;&lt;title&gt;保守：112&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;211.5&quot; y=&quot;233.0&quot; class=&quot;val&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--c4)&quot;&gt;保守 112&lt;/text&gt;&lt;circle cx=&quot;257.9&quot; cy=&quot;247.0&quot; r=&quot;7&quot; fill=&quot;var(--c1)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;1.5&quot;&gt;&lt;title&gt;基準：196&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;257.9&quot; y=&quot;271.0&quot; class=&quot;val&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--c1)&quot;&gt;基準 196&lt;/text&gt;&lt;circle cx=&quot;334.3&quot; cy=&quot;247.0&quot; r=&quot;7&quot; fill=&quot;var(--c2)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;1.5&quot;&gt;&lt;title&gt;樂觀：335&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;334.3&quot; y=&quot;233.0&quot; class=&quot;val&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--c2)&quot;&gt;樂觀 335&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;!--/新圖表--&gt;&lt;!--目標區間:正文--&gt;&lt;div class=&quot;block&quot; id=&quot;target-plain&quot;&gt;&lt;h3&gt;12 個月條件式目標區間（條件式、非買賣建議）&lt;/h3&gt;&lt;p&gt;如果三種情境各自成真，一年後（至 2027-11-13）每股價值大約落在：保守 111.20–145.02、基準 191.49–265.97、樂觀 323.75–466.01 美元。這是條件式區間，不是股價預測，三段不合成單一數字。&lt;/p&gt;&lt;h4 style=&quot;margin-top:14px&quot;&gt;下四季申報可以對照什麼&lt;/h4&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt&quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;近四季營收年增&lt;/th&gt;&lt;th&gt;近四季營業利益率&lt;/th&gt;&lt;th&gt;公司特定事件（原文位置）&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;&amp;lt; 16.0%&lt;/td&gt;&lt;td&gt;&amp;lt; 31.00%&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;（單季口徑：比左欄近四季中線更嚴格的確認條件）合併營收單季年增連續兩季低於 12%（保守情境第 1 年營收成長；第三季為 24.7%，新聞稿取整為 25%，近四季 22.2%），或合併營業利益率連續兩季低於 30%（保守情境第 1 年營業利益率；第三季 31.8%，同季認列歐盟數位市場法罰款 10 億美元）。公司在第二季財報會議說明，供給受限下擴大使用第三方運算容量作為過渡，短期會造成小幅利潤率壓力；10-Q 揭露剩餘期限逾一年的合約承諾共 8,021 億美元，支出難以隨營收放緩立即下修（推導）（8-K 2026-10-28 新聞稿 §0；8-K 2026-10-28 新聞稿 §1；10-Q 2026-09-30 Part I, Item 1 ¶339；10-Q 2026-09-30 Part I, Item 1 ¶309；新聞 N24 §47；成長推估底稿.json#/一、營收年增）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;16.0%–23.5%&lt;/td&gt;&lt;td&gt;31.00%–32.50%&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;第四季財報會議（公司未公布日期）對 2027 年資本支出給出細節時，與基準情境的再投資假設比對：基準第 1 年（2026Q4–2027Q3）營收增加約 942 億美元（推導：近四季營收 471,098 百萬 × 20%），搭配銷售對資本 0.48，隱含第 1 年淨投入（資本支出減折舊攤銷加營運資金增加，不是資本支出總額；第 1 年為 2026Q4–2027Q3，與 2027 曆年資本支出期間不同）約 1,963 億美元（推導）。2026 年資本支出指引第二季上修為 1,950–2,050 億美元、第三季維持，前九月已支出 1,320 億美元；公司稱 2027 年將顯著增加。若細節使隱含第 1 年淨投入落在約 1,570–2,355 億美元（銷售對資本 0.60 至 0.40，推導）之內，與基準的資本假設相容；高於 2,355 億美元較接近保守的資本假設（0.40），低於 1,570 億美元較接近樂觀的資本假設（0.60）（新聞 N24 §47；新聞 N3 §2；10-Q 2026-09-30 Part I, Item 2 ¶204；8-K 2026-06-04 本文 §213；估值輸入.json#/scenarios；估值輸入.json#/evidence_notes/再投資）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;&amp;gt; 23.5%&lt;/td&gt;&lt;td&gt;&amp;gt; 32.50%&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;（單季口徑：比左欄近四季中線更嚴格的確認條件）合併營收單季年增連續兩季達 27% 以上（樂觀情境第 1 年營收成長；第三季 24.7%，新聞稿取整為 25%），且 TPU 系統供應協議的營收如公司所述絕大部分在 2027 年認列、積壓訂單 5,677 億美元（其中 Google Cloud 5,608 億；整體積壓含關聯方 Crux AI 的 168 億）如公司預期略高於 55% 在未來 24 個月認列（推導約 3,120 億美元）。TPU 系統銷售是第三季 Google Cloud 營收年增 103% 的貢獻項之一，單季金額可能不平均；積壓訂單的認列要看交付能力與客戶使用量（10-Q 2026-09-30 Part I, Item 2 ¶45；10-Q 2026-09-30 Part I, Item 1 ¶119；8-K 2026-10-28 新聞稿 §1；新聞 N24 §47；成長推估底稿.json#/一、營收年增）&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;近四季營收年增 22.2%（2025-10-01～2026-09-30 對 2024-10-01～2025-09-30），較接近基準情境的第 1 年假設；近四季營業利益率 33.3%，較接近樂觀情境。門檻以相鄰情境第 1 年假設的中線為界，只描述哪個情境比較接近，不改機率與研究評等；近四季是未調整的報表數字，作者訂第 1 年假設時若扣除不外推的項目（見本題正文），扣除後可能較接近別的情境；下四季申報後對照，不自動重算目標區間。&lt;/p&gt;&lt;p class=&quot;cap&quot;&gt;算法、關鍵假設、各段需要的市場條件與失效事件（算法與完整表見&lt;a href=&quot;#wp-5&quot;&gt;計算底稿 5&lt;/a&gt;）。&lt;/p&gt;&lt;/div&gt;&lt;!--/目標區間:正文--&gt;&lt;div class=&quot;block&quot; id=&quot;market-demand&quot;&gt;&lt;h3&gt;市價在要求什麼：成長端與倍數端，對照過去實績與模型假設&lt;/h3&gt;&lt;div class=&quot;grid2 wide&quot;&gt;&lt;figure class=figure&gt;&lt;p class=cap&gt;成長端：市價要成立，未來 5 年營收每年要成長多少（紅點基準折現率、線段高低折現率），對照過去實績與模型基準假設（成長推估底稿.json 六、成長性四問並列；推導，只描述）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 190&quot; role=&quot;img&quot; aria-label=&quot;市價要求的成長&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;230.0&quot; x2=&quot;230.0&quot; y1=&quot;8&quot; y2=&quot;168&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;230.0&quot; y=&quot;184&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;0%&lt;/text&gt;&lt;line x1=&quot;316.7&quot; x2=&quot;316.7&quot; y1=&quot;8&quot; y2=&quot;168&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;316.7&quot; y=&quot;184&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;10%&lt;/text&gt;&lt;line x1=&quot;403.3&quot; x2=&quot;403.3&quot; y1=&quot;8&quot; y2=&quot;168&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;403.3&quot; y=&quot;184&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;20%&lt;/text&gt;&lt;line x1=&quot;490.0&quot; x2=&quot;490.0&quot; y1=&quot;8&quot; y2=&quot;168&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;490.0&quot; y=&quot;184&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;30%&lt;/text&gt;&lt;text x=&quot;220&quot; y=&quot;27&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;過去實績（2015–2025 年複合）&lt;/text&gt;&lt;circle cx=&quot;388.7&quot; cy=&quot;22&quot; r=&quot;7&quot; fill=&quot;var(--c3)&quot;&gt;&lt;title&gt;過去實績（2015–2025 年複合）：18%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;400.7&quot; y=&quot;27&quot; class=&quot;val&quot;&gt;18%&lt;/text&gt;&lt;text x=&quot;220&quot; y=&quot;67&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;過去實績（近四季年增）&lt;/text&gt;&lt;circle cx=&quot;422.5&quot; cy=&quot;62&quot; r=&quot;7&quot; fill=&quot;var(--c3)&quot;&gt;&lt;title&gt;過去實績（近四季年增）：22%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;434.5&quot; y=&quot;67&quot; class=&quot;val&quot;&gt;22%&lt;/text&gt;&lt;text x=&quot;220&quot; y=&quot;107&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;模型基準（未來 5 年平均）&lt;/text&gt;&lt;circle cx=&quot;342.7&quot; cy=&quot;102&quot; r=&quot;7&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;模型基準（未來 5 年平均）：13%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;354.7&quot; y=&quot;107&quot; class=&quot;val&quot;&gt;13%&lt;/text&gt;&lt;text x=&quot;220&quot; y=&quot;147&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;市價要求（未來 5 年年增）&lt;/text&gt;&lt;line x1=&quot;350.8&quot; x2=&quot;406.1&quot; y1=&quot;142&quot; y2=&quot;142&quot; stroke=&quot;var(--neg)&quot; stroke-width=&quot;3&quot; opacity=&quot;.55&quot;/&gt;&lt;circle cx=&quot;372.2&quot; cy=&quot;142&quot; r=&quot;7&quot; fill=&quot;var(--neg)&quot;&gt;&lt;title&gt;市價要求（未來 5 年年增）：16%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;418.1&quot; y=&quot;147&quot; class=&quot;val&quot;&gt;16%&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;figure class=figure&gt;&lt;p class=cap&gt;倍數端：市價要成立，第 10 年出場 EV/EBIT 要多少倍（紅點基準折現率、線段高低折現率），對照模型假設與分產業參考帶 p25–p75（灰帶，直線為中位；估值結果.json#/market_implied_terminal；只描述，不是目標價、不進評等）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 150&quot; role=&quot;img&quot; aria-label=&quot;市價隱含第 10 年倍數&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;172.0&quot; x2=&quot;172.0&quot; y1=&quot;8&quot; y2=&quot;128&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;172.0&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;0 倍&lt;/text&gt;&lt;line x1=&quot;251.5&quot; x2=&quot;251.5&quot; y1=&quot;8&quot; y2=&quot;128&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;251.5&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;10 倍&lt;/text&gt;&lt;line x1=&quot;331.0&quot; x2=&quot;331.0&quot; y1=&quot;8&quot; y2=&quot;128&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;331.0&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;20 倍&lt;/text&gt;&lt;line x1=&quot;410.5&quot; x2=&quot;410.5&quot; y1=&quot;8&quot; y2=&quot;128&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;410.5&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;30 倍&lt;/text&gt;&lt;line x1=&quot;490.0&quot; x2=&quot;490.0&quot; y1=&quot;8&quot; y2=&quot;128&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;490.0&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;40 倍&lt;/text&gt;&lt;rect x=&quot;219.7&quot; y=&quot;11&quot; width=&quot;175.7&quot; height=&quot;22&quot; rx=&quot;4&quot; fill=&quot;var(--line)&quot;&gt;&lt;title&gt;軟體與網路 參考帶 p25–p75（機械回測樣本，非市場全體；分產業的筆數與公司數少，僅供參考）&lt;/title&gt;&lt;/rect&gt;&lt;line x1=&quot;295.2&quot; x2=&quot;295.2&quot; y1=&quot;11&quot; y2=&quot;33&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;162&quot; y=&quot;27&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;參考帶（軟體與網路）&lt;/text&gt;&lt;text x=&quot;403.4&quot; y=&quot;27&quot; class=&quot;val&quot;&gt;6 倍–28 倍&lt;/text&gt;&lt;text x=&quot;162&quot; y=&quot;67&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;模型假設（第 10 年）&lt;/text&gt;&lt;circle cx=&quot;262.4&quot; cy=&quot;62&quot; r=&quot;7&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;模型假設（第 10 年）：11 倍&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;274.4&quot; y=&quot;67&quot; class=&quot;val&quot;&gt;11 倍&lt;/text&gt;&lt;text x=&quot;162&quot; y=&quot;107&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;市價隱含（第 10 年）&lt;/text&gt;&lt;line x1=&quot;314.6&quot; x2=&quot;370.8&quot; y1=&quot;102&quot; y2=&quot;102&quot; stroke=&quot;var(--neg)&quot; stroke-width=&quot;3&quot; opacity=&quot;.55&quot;/&gt;&lt;circle cx=&quot;334.2&quot; cy=&quot;102&quot; r=&quot;7&quot; fill=&quot;var(--neg)&quot;&gt;&lt;title&gt;市價隱含（第 10 年）：20 倍&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;382.8&quot; y=&quot;107&quot; class=&quot;val&quot;&gt;20 倍&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;p&gt;&lt;b&gt;成長端：&lt;/b&gt;市價要求未來 5 年營收年增約 16.4%（折現率高低 13.9%～20.3%），高於模型基準 5 年平均 13.0%、低於過去（2015–2025）實績 18.3%。&lt;/p&gt;&lt;p&gt;&lt;b&gt;倍數端：&lt;/b&gt;市價隱含第 10 年 EV/EBIT 約 20.4 倍，高於模型 11.4 倍，在軟體與網路參考帶 p25–p75（6.0–28.1 倍）內。&lt;/p&gt;&lt;p&gt;成功幾率（歷史基準比率）：模型基準 10 年實質年增 7.7%，同規模（營收 500 億美元以上）公司歷史上做到的比例 21%（歷史基準比率，非預測）。&lt;/p&gt;&lt;p class=&quot;cap&quot;&gt;兩端是同一條「模型價值＝市價」換不同未知數反解，方向必然一致，不是兩個獨立證據；幅度才有資訊。只描述，不進研究評等、不改價格位置與合理價值，不是目標價，非買賣建議。成長性四問細表、三視角反推、長期倍數條件（算法與完整表見&lt;a href=&quot;#wp-5&quot;&gt;計算底稿 5&lt;/a&gt;）。&lt;/p&gt;&lt;div class=&quot;note-box&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;要撐住現價，營收每年需要成長多少 vs 實際成長（黑色橫線為不同折現率下的隱含營收年增範圍 14%–20%）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 500 262&quot; role=&quot;img&quot; aria-label=&quot;市價隱含成長&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;193.0&quot; x2=&quot;193.0&quot; y1=&quot;6&quot; y2=&quot;256&quot; class=&quot;zero&quot;/&gt;&lt;text x=&quot;183&quot; y=&quot;23&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;FY23 實際成長&lt;/text&gt;&lt;rect x=&quot;193.0&quot; y=&quot;9&quot; width=&quot;83.2&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;284.2&quot; y=&quot;23&quot; class=&quot;val&quot;&gt;8.7%&lt;/text&gt;&lt;text x=&quot;183&quot; y=&quot;63&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;FY24 實際成長&lt;/text&gt;&lt;rect x=&quot;193.0&quot; y=&quot;49&quot; width=&quot;132.9&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;333.9&quot; y=&quot;63&quot; class=&quot;val&quot;&gt;13.9%&lt;/text&gt;&lt;text x=&quot;183&quot; y=&quot;103&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;FY25 實際成長&lt;/text&gt;&lt;rect x=&quot;193.0&quot; y=&quot;89&quot; width=&quot;144.6&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;345.6&quot; y=&quot;103&quot; class=&quot;val&quot;&gt;15.1%&lt;/text&gt;&lt;text x=&quot;183&quot; y=&quot;143&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;FY22–FY25 年均&lt;/text&gt;&lt;rect x=&quot;193.0&quot; y=&quot;129&quot; width=&quot;119.9&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;320.9&quot; y=&quot;143&quot; class=&quot;val&quot;&gt;12.5%&lt;/text&gt;&lt;text x=&quot;183&quot; y=&quot;183&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;最近三季比去年同期&lt;/text&gt;&lt;rect x=&quot;193.0&quot; y=&quot;169&quot; width=&quot;226.4&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;427.4&quot; y=&quot;183&quot; class=&quot;val&quot;&gt;23.6%&lt;/text&gt;&lt;text x=&quot;183&quot; y=&quot;223&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot; font-weight=&amp;quot;700&amp;quot;&gt;市價隱含：未來 5 年每年&lt;/text&gt;&lt;rect x=&quot;193.0&quot; y=&quot;209&quot; width=&quot;157.2&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--neg)&quot;/&gt;&lt;line x1=&quot;326.6&quot; x2=&quot;387.7&quot; y1=&quot;218&quot; y2=&quot;218&quot; stroke=&quot;var(--ink)&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;line x1=&quot;326.6&quot; x2=&quot;326.6&quot; y1=&quot;212&quot; y2=&quot;224&quot; stroke=&quot;var(--ink)&quot;/&gt;&lt;line x1=&quot;387.7&quot; x2=&quot;387.7&quot; y1=&quot;212&quot; y2=&quot;224&quot; stroke=&quot;var(--ink)&quot;/&gt;&lt;text x=&quot;395.7&quot; y=&quot;223&quot; class=&quot;val&quot;&gt;16.4%&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:14px&quot;&gt;備註：市價要求的成長 vs Alphabet 實際營收成長&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;期間&lt;/th&gt;&lt;th&gt;營收成長&lt;/th&gt;&lt;th&gt;說明&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2023 年&lt;/td&gt;&lt;td&gt;+8.7%&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2024 年&lt;/td&gt;&lt;td&gt;+13.9%&lt;/td&gt;&lt;td&gt;雲端 +30.6%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2025 年&lt;/td&gt;&lt;td&gt;+15.1%&lt;/td&gt;&lt;td&gt;雲端 +35.8%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2022–2025 年年均&lt;/td&gt;&lt;td&gt;+12.5%&lt;/td&gt;&lt;td&gt;三年複合成長&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;近四季對前四季&lt;/td&gt;&lt;td&gt;+22.2%&lt;/td&gt;&lt;td&gt;一年前為 +13.4%，加速&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2026 年第三季對去年同期&lt;/td&gt;&lt;td&gt;+24.7%&lt;/td&gt;&lt;td&gt;雲端 +102.6%、Google 服務 +10.6%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;本報告基準：未來 5 年&lt;/td&gt;&lt;td&gt;+20% 逐年降到 +8%&lt;/td&gt;&lt;td&gt;年複合約 12.9%（推算）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;市價要求：未來 5 年每年&lt;/td&gt;&lt;td&gt;約 16.4%（13.9%～20.3%）&lt;/td&gt;&lt;td&gt;依折現率高低（推導）；或改為第 1 年起每年（含永續期）營業利益率約 41.4%（擇一）&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p&gt;要撐住現價，市場等於要求未來 5 年營收每年成長約 16.4%（換折現率高低兩端約 13.9% 到 20.3%）。這個要求在同規模公司的歷史上屬「歷史罕見」。溢價訊號集中在資金與情緒（部位與衍生品、擁擠度）、基本面預期（隱含假設罕見度）。&lt;/p&gt;&lt;p class=&quot;cap&quot;&gt;三視角反推、假設對照實績、歷史基準比率與市價溢價來源（算法與完整表見&lt;a href=&quot;#wp-5&quot;&gt;計算底稿 5&lt;/a&gt;）。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;白話說&lt;/b&gt;今天付 295.77 美元，等於預付未來 5 年營收年增約 16.4%（市價反推未來 5 年營收年增；市價 295.77 美元、收盤 2026-11-13；折現率 9.53%；推導）；本報告基準由 20% 降到 8%。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;要留意&lt;/b&gt;這是條件估值：約 53% 價值來自預測期之後，長期假設一動合理價值就動，見改判訊號。&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;value&quot;&gt;&lt;div class=&quot;qno&quot;&gt;價值判斷&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;價值判斷：用彼得林奇的方法再看一次&lt;/div&gt;&lt;h2&gt;穩定成長股、生意 B，價格偏貴；PEG（本益比對成長比）看似便宜是口徑混用&lt;/h2&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;林區分類&lt;/b&gt;穩定成長股（Stalwart）；兼具快速成長特徵（Google Cloud 近四季營收約 932 億、第三季年增 +103%）；資產股特徵（SpaceX 有價股權 752 億與非上市股權 1,352 億）&lt;br&gt;穩定成長股看本益比相對自身常態，股價大漲、本益比遠高於自身常態時檢視；資產股的投資利益要和本業分開，本益比改用核心盈餘（營業利益稅後 ÷ 稀釋股數）。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;研究評等&lt;/b&gt;&lt;span style=&quot;font-size:20px;font-weight:700&quot;&gt;生意 B ／ 價格偏貴&lt;/span&gt;&lt;br&gt;生意品質依五項證據評定；價格位置三級（買入區、合理、偏貴），依買入上限與合理價值高端判斷，同業與歷史倍數只作交叉核對。非買賣建議。&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;林區分類：穩定成長股，兼具快速成長（雲端第三季 +103%）與資產股（SpaceX 等權益證券）特徵；2022–2025 年營收年複合約 12.5%&lt;span class=&quot;src&quot;&gt;（推算）&lt;/span&gt;。&lt;/strong&gt;核心&lt;a class=&quot;term&quot; href=&quot;#g14&quot;&gt;本益比&lt;/a&gt; 28.4 倍（扣非經常 EPS 10.42 美元；收盤 2026-11-13），高於申報與核心 EPS 相近期間歷史第 75 百分位 26.7 倍；加速延續兩年以上且雲端占比過三成，應改判快速成長股。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;PEG 三口徑：(1) 過去三年申報 EPS 年增 33.3%、PEG 0.85&lt;span class=&quot;src&quot;&gt;（成長口徑 過去三年 EPS 年增 33.3%；收盤 2026-11-13）&lt;/span&gt; 看似便宜，但這是申報 EPS 配核心本益比，口徑混用；改用核心 EPS 年增約 22.4%&lt;span class=&quot;src&quot;&gt;（推算）&lt;/span&gt;，PEG 約 1.3。&lt;/strong&gt;(2) 近四季核心 EPS +18.7%，PEG 1.52&lt;span class=&quot;src&quot;&gt;（成長口徑 近四季對上一財年、扣非經常 18.7%；收盤 2026-11-13）&lt;/span&gt;。(3) 基準情境推估約 10.7%&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;，PEG 2.64&lt;span class=&quot;src&quot;&gt;（成長口徑 基準情境推估、稅後營業利益年增－股數年變化 10.7%；收盤 2026-11-13）&lt;/span&gt;，最能代表未來。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;資產負債表：每股淨現金約 11.28 美元（約股價 3.8%）、負債對權益 0.18，但每股自由現金流近四季只有 1.61 美元。&lt;/strong&gt;存貨 +446% 是林區警訊，原因已查明（待售 TPU 系統與 Pixel 等裝置）。內部人近 6 個月公開市場買進 0，賣出全屬 10b5-1；Brin 8 月是 B 股轉 A 股後贈與，不是賣出。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;grid2 wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;現金與證券 vs 有息負債（億美元），上方為淨現金&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 300&quot; role=&quot;img&quot; aria-label=&quot;資產負債&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;266.0&quot; y2=&quot;266.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;270.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;0.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;185.3&quot; y2=&quot;185.3&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;189.3&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;1,000&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;104.7&quot; y2=&quot;104.7&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;108.7&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;2,000&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;24.0&quot; y2=&quot;24.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;28.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;3,000&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;266.0&quot; y2=&quot;266.0&quot; class=&quot;zero&quot;/&gt;&lt;rect x=&quot;70.3&quot; y=&quot;176.5&quot; width=&quot;40.7&quot; height=&quot;89.5&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;現金與證券 FY23：1,109&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;113.0&quot; y=&quot;256.4&quot; width=&quot;40.7&quot; height=&quot;9.6&quot; rx=&quot;2&quot; fill=&quot;var(--c5)&quot;&gt;&lt;title&gt;有息負債 FY23：119&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;113.0&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY23&lt;/text&gt;&lt;text x=&quot;113.0&quot; y=&quot;16.0&quot; class=&quot;note&quot; text-anchor=&quot;middle&quot;&gt;淨 990&lt;/text&gt;&lt;rect x=&quot;192.3&quot; y=&quot;188.8&quot; width=&quot;40.7&quot; height=&quot;77.2&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;現金與證券 FY24：957&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;235.0&quot; y=&quot;257.2&quot; width=&quot;40.7&quot; height=&quot;8.8&quot; rx=&quot;2&quot; fill=&quot;var(--c5)&quot;&gt;&lt;title&gt;有息負債 FY24：109&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;235.0&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY24&lt;/text&gt;&lt;text x=&quot;235.0&quot; y=&quot;16.0&quot; class=&quot;note&quot; text-anchor=&quot;middle&quot;&gt;淨 848&lt;/text&gt;&lt;rect x=&quot;314.3&quot; y=&quot;163.7&quot; width=&quot;40.7&quot; height=&quot;102.3&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;現金與證券 FY25：1,268&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;357.0&quot; y=&quot;228.5&quot; width=&quot;40.7&quot; height=&quot;37.5&quot; rx=&quot;2&quot; fill=&quot;var(--c5)&quot;&gt;&lt;title&gt;有息負債 FY25：465&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;357.0&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY25&lt;/text&gt;&lt;text x=&quot;357.0&quot; y=&quot;16.0&quot; class=&quot;note&quot; text-anchor=&quot;middle&quot;&gt;淨 803&lt;/text&gt;&lt;rect x=&quot;436.3&quot; y=&quot;52.2&quot; width=&quot;40.7&quot; height=&quot;213.8&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;現金與證券 2026-09：2,651&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;479.0&quot; y=&quot;165.1&quot; width=&quot;40.7&quot; height=&quot;100.9&quot; rx=&quot;2&quot; fill=&quot;var(--c5)&quot;&gt;&lt;title&gt;有息負債 2026-09：1,251&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;479.0&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;2026-09&lt;/text&gt;&lt;text x=&quot;479.0&quot; y=&quot;16.0&quot; class=&quot;note&quot; text-anchor=&quot;middle&quot;&gt;淨 1,400&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c1)&quot;&gt;&lt;/i&gt;現金與證券&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c5)&quot;&gt;&lt;/i&gt;有息負債&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;近 6 個月內部人公開市場買賣（百萬美元）；無任何買進&lt;/p&gt;&lt;svg viewBox=&quot;0 0 500 182&quot; role=&quot;img&quot; aria-label=&quot;內部人&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;206.0&quot; x2=&quot;206.0&quot; y1=&quot;6&quot; y2=&quot;176&quot; class=&quot;zero&quot;/&gt;&lt;text x=&quot;196&quot; y=&quot;23&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;Walker（預設計畫賣出）&lt;/text&gt;&lt;rect x=&quot;206.0&quot; y=&quot;9&quot; width=&quot;214.5&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;428.5&quot; y=&quot;23&quot; class=&quot;val&quot;&gt;3.1&lt;/text&gt;&lt;text x=&quot;196&quot; y=&quot;63&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;Hennessy（預設計畫賣出）&lt;/text&gt;&lt;rect x=&quot;206.0&quot; y=&quot;49&quot; width=&quot;54.6&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;268.6&quot; y=&quot;63&quot; class=&quot;val&quot;&gt;0.8&lt;/text&gt;&lt;text x=&quot;196&quot; y=&quot;103&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;Saraci（預設計畫賣出）&lt;/text&gt;&lt;rect x=&quot;206.0&quot; y=&quot;89&quot; width=&quot;20.7&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;234.7&quot; y=&quot;103&quot; class=&quot;val&quot;&gt;0.3&lt;/text&gt;&lt;text x=&quot;196&quot; y=&quot;143&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;Arnold（預設計畫賣出）&lt;/text&gt;&lt;rect x=&quot;206.0&quot; y=&quot;129&quot; width=&quot;12.6&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;226.6&quot; y=&quot;143&quot; class=&quot;val&quot;&gt;0.2&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;生意品質：B（規則：無「弱」且至少三項「強」＝A）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;評等&lt;/th&gt;&lt;th&gt;理由&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;護城河&lt;/td&gt;&lt;td&gt;強&lt;/td&gt;&lt;td&gt;搜尋：2026 年 9 月全球搜尋市占 89.9%（Statcounter，經 citybiz 新聞 N13）、約 90%（CNBC 新聞 N12）兩個外部來源，第三季查詢年增率為五年最高（8-K 2026-10-28）；Yelp、Angi（美國居家服務媒合平台）、CarGurus（美國汽車買賣網站）2026 年 10-K 仍依賴 Google 導流（全文搜尋 Q1）。雲端：未完成訂單 5,608 億（10-Q Item 1 ¶119）、TPU 對外銷售（Oracle 代售、Broadcom 長約供應至多到 2031 年）；第三季 Services 營業利益率 40.7%、Cloud 36.2%（Item 2 ¶152）。反方：管理層說 AI Mode（搜尋的 AI 對話模式）查詢的變現較低對成長有影響（新聞 N10）；第三季 Search &amp;amp; other 年增由 17% 降到 12%，廣告科技案改為六年行為規範、搜尋案上訴中（10-Q ¶331、¶332）。主張 GOOGL-C01（部分支持）、GOOGL-C14；失效條件：Search &amp;amp; other 年增連兩季低於 8% 或全球市占跌破 85%。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;投入資本報酬與增量回報&lt;/td&gt;&lt;td&gt;強&lt;/td&gt;&lt;td&gt;近四季 ROIC 37.2%（營運投入資本口徑）、近五年中位 44.0%、2023–2025 增量 ROIC 28.4%（財務指標.json），研發 7 年資本化後 30.7%、5 年 32.3%，兩種年限都遠高於 WACC 9.5%，結論不翻轉（研發資本化對照.json）。反方：近四季增量 ROIC 約 16.6%（推算），營運投入資本一年增加 1,627 億；2026 年資本支出指引第二季已上修為 1,950～2,050 億、2027 年再顯著增加（新聞 N24、N3），新投入報酬尚待驗證。主張 GOOGL-C02（部分支持）。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;自由現金流品質&lt;/td&gt;&lt;td&gt;弱&lt;/td&gt;&lt;td&gt;近四季自由現金流 19,747（營運現金流 179,551 − 資本支出 159,804），只有稅後營業利益 128,628 的 15%；扣股權薪酬 30,409 後為 −10,662。第二、三季單季自由現金流為負（第三季約 −91 億，CNBC 新聞 N3），2026 前九月營運現金流 127,149 低於資本支出 131,953，缺口與併購由發債收入（已扣發行費用）85,222（扣還款 8,879 後淨借入約 76,343）、普通股 42,870、特別股 19,063 補足（融資償債判讀.json）；資本支出指引第二季上修為 1,950～2,050 億、第三季維持，2027 年再顯著增加（新聞 N24、N3），基準情境第 1 年 FCFF 約 −329 億（推算）。正面：營運現金流是稅後營業利益的 1.4 倍，壓縮來自擴張投資且有未完成訂單 5,677 億支撐，不是本業惡化。證據段未找到投資已在現金流兌現的證據，維持弱。主張 GOOGL-C03（支持）、GOOGL-C10、GOOGL-C11。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;資產負債表&lt;/td&gt;&lt;td&gt;強&lt;/td&gt;&lt;td&gt;現金與有價證券 265,098（其中有價權益證券含 SpaceX 752 億，短期限售），有息負債 126,118＋融資租賃 3,705；有息負債÷EBITDA 0.68、淨負債÷EBITDA −0.76、營運現金流÷有息負債 1.44；循環信用 100 億未動用、商業本票餘額 0；2026 年新發債最早 2028 年到期（融資償債判讀.json）。反方：債務 9 個月內由 46,547 增至 126,118；表外有採購承諾 9,244 億、能源設備保證最高 162 億、TPU 回購保證最高 66 億（10-Q ¶242、¶315、¶316）；外部融資的影響已在自由現金流品質一項計入，這裡不重複扣分。主張 GOOGL-C08、GOOGL-C09（支持）。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;治理與資本配置&lt;/td&gt;&lt;td&gt;中&lt;/td&gt;&lt;td&gt;創辦人 Larry Page、Sergey Brin 合計投票權約 52.7%（委託書，推算）；2026 年停止回購（前九月 0，去年同期 39,810），改為公開發行、波克夏私募、ATM 與強制轉換特別股，流通股由 12,088 增至 12,294（+1.7%）；淨回購為負屬股東回報警示（政策上限中）。財務長稱除支應股權薪酬稅負的 ATM 外暫不再發股（新聞 N24，公司說法）。正面：6 月公開發行 A 股每股 355.20（10-Q Item 1 ¶359）、波克夏私募 A 股 351.81（8-K 2026-06-04 本文 §17、§210），高於本次收盤 295.77（2026-11-13）；近 6 個月內部人公開市場賣出 39 筆皆屬 10b5-1、買進 0；Brin 2026-08-07 Form 4 的 C 代碼是 B 股轉 A 股後贈與，不是賣出。主張 GOOGL-C12、GOOGL-C13（支持）。&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;PEG 三口徑、林區資產負債表檢查與 F 分數等交叉檢查（算法與完整表見&lt;a href=&quot;#wp-value&quot;&gt;計算底稿 價值判斷&lt;/a&gt;）。&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;capital&quot;&gt;&lt;div class=&quot;qno&quot;&gt;問題 06&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;管理層怎麼用錢、怎麼管資產？&lt;/div&gt;&lt;h2&gt;資金政策大轉彎：停止回購，改以發債與增資支應 AI 基建&lt;/h2&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;2026 前九月營運現金流 1,271 億不夠支應資本支出 1,320 億，加上收購 341 億（含 3 月完成的 Wiz）與非有價證券投資 242 億，差額由發債收入 852 億（淨借入約 763 億）、普通股 429 億與強制轉換特別股 191 億補足，回購降為 0。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;借款用途判讀為「混合、以擴張為主」：公司對債務只寫一般公司用途，但最大需求是 AI 基礎設施。&lt;/strong&gt;創辦人合計約 52.7% 投票權&lt;span class=&quot;src&quot;&gt;（推算）&lt;/span&gt;，外部股東難以約束這類轉向。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;近四季營運現金流的去向（億美元）：第一列為營運現金流，往下逐項扣除，最後一列為剩餘或缺口；同期淨借款 966 億美元（短債淨變化依申報原表確認為零），不列入上方扣項&lt;/p&gt;&lt;svg viewBox=&quot;0 0 500 218&quot; role=&quot;img&quot; aria-label=&quot;資金去向&quot; class=&quot;chart&quot; style=&quot;max-width:650px&quot;&gt;&lt;line x1=&quot;150.0&quot; x2=&quot;150.0&quot; y1=&quot;6&quot; y2=&quot;214&quot; class=&quot;zero&quot;/&gt;&lt;text x=&quot;140&quot; y=&quot;37.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;近四季營運現金流&lt;/text&gt;&lt;rect x=&quot;150.0&quot; y=&quot;22.0&quot; width=&quot;275.0&quot; height=&quot;20&quot; rx=&quot;4&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;近四季營運現金流：1,796&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;433.0&quot; y=&quot;37.0&quot; class=&quot;val&quot;&gt;1,796&lt;/text&gt;&lt;line x1=&quot;425.0&quot; x2=&quot;425.0&quot; y1=&quot;42.0&quot; y2=&quot;62.0&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;1&quot; stroke-dasharray=&quot;2 3&quot;/&gt;&lt;text x=&quot;140&quot; y=&quot;77.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;回購&lt;/text&gt;&lt;rect x=&quot;416.0&quot; y=&quot;62.0&quot; width=&quot;9.0&quot; height=&quot;20&quot; rx=&quot;4&quot; fill=&quot;var(--c2)&quot;&gt;&lt;title&gt;回購：−59.0&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;433.0&quot; y=&quot;77.0&quot; class=&quot;val&quot;&gt;−59.0&lt;/text&gt;&lt;line x1=&quot;416.0&quot; x2=&quot;416.0&quot; y1=&quot;82.0&quot; y2=&quot;102.0&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;1&quot; stroke-dasharray=&quot;2 3&quot;/&gt;&lt;text x=&quot;140&quot; y=&quot;117.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;股利&lt;/text&gt;&lt;rect x=&quot;399.6&quot; y= ;96%&lt;/td&gt;&lt;td&gt;-2.2%&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2025&lt;/td&gt;&lt;td&gt;4,153&lt;/td&gt;&lt;td&gt;35.7%&lt;/td&gt;&lt;td&gt;33.95&lt;/td&gt;&lt;td&gt;100&lt;/td&gt;&lt;td&gt;457&lt;/td&gt;&lt;td&gt;76%&lt;/td&gt;&lt;td&gt;-1.7%&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;長期財務.json（股東權益、稀釋股數〔分割調整〕、總資產；每股帳面＝股東權益 ÷ 稀釋股數，推導；股利支付、回購、營運現金流、資本支出在財務歷史.json 沒有該年時用）；產業指標.json 逐年（ROE）；財務歷史.json annual（股利、回購、營運現金流、資本支出）。用到：財務歷史、長期財務。ROE 註記門檻：ROE 高於 60% 或股東權益 ÷ 總資產低於 10%；近三年回購合計達當年股東權益 50% 以上才歸因於回購。（股利＋回購）÷ 年底市值：專案沒有逐年年底市值資料，不列該欄。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;capital-plain&quot;&gt;&lt;h3&gt;融資與償債：還不還得起&lt;/h3&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;b&gt;信用評級&lt;/b&gt;　機構 Moody&amp;#x27;s Aa2（展望穩定）、S&amp;amp;P AA+（展望穩定）（SEC 全文搜尋 FWP 2026-08-07 0001193125-26-338750）／推導 AAA（Damodaran 合成評等，利息保障 51.0 倍，近四季新借款多、利息偏低、評級可能偏高，推導）｜投資等級（BBB-／Baa3 以上）；推導比機構高 2 級（推導只看利息保障，不含規模、產業與擔保結構，僅供對照）&lt;/p&gt;&lt;p&gt;&lt;b&gt;存活檢查（12～24 個月，推導，非違約預測）&lt;/b&gt;　無明顯警訊（推導，非違約預測）：現金加未動用信貸 2,751 億美元，一年內到期債務 20 億美元（另利息 31 億美元），可付 54.2 倍；現金加未動用信貸 2,751 億美元，兩年內到期債務 30 億美元（另利息 62 億美元），可付 30.1 倍；利息保障 51.0 倍（新借款多、利息偏低，倍數可能偏高）；會計師未提出繼續經營疑慮。&lt;/p&gt;&lt;p&gt;&lt;b&gt;利率壓力測試&lt;/b&gt;　+200bp 後利息保障 47.5 倍（目前 51.0 倍，推導）&lt;/p&gt;&lt;p&gt;&lt;b&gt;借款用途&lt;/b&gt;　混合（以擴張為主）：AI 基礎設施資本支出是最大資金需求，同時用債務、普通股與強制轉換特別股籌資；債務本身公司只寫「一般公司用途」，沒有單獨指定用途&lt;/p&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;償債指標、融資活動表、存活檢查明細與利率壓力測試（算法與完整表見&lt;a href=&quot;#wp-6&quot;&gt;計算底稿 6&lt;/a&gt;）。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;survival-charts&quot;&gt;&lt;h3&gt;存活檢查與利率壓力測試（圖）&lt;/h3&gt;&lt;div class=&quot;grid2 wide&quot;&gt;&lt;figure class=figure&gt;&lt;p class=cap&gt;存活檢查（12～24 個月）：手上的錢對到期債務加利息（億美元；可付 54.2 倍／30.1 倍；燈號 無明顯警訊；資料截至 2026-09-30；信用與存活.json；推導，非違約預測）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 500 222&quot; role=&quot;img&quot; aria-label=&quot;存活檢查&quot; --c1)&quot;/&gt;&lt;text x=&quot;423.9&quot; y=&quot;183&quot; class=&quot;val&quot;&gt;50.5 倍&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;燈號規則寫死在程式（信用與存活.py）：現金＋未動用信貸要能付 12 個月本金與利息，否則看自由現金流；利率上升 2 個百分點後利息保障低於 1.5 倍才加一條理由。只顯示、不改研究評等；明細表、規則與限制（算法與完整表見&lt;a href=&quot;#wp-6&quot;&gt;計算底稿 6&lt;/a&gt;）。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;財務管理：資金、負債與承諾&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;9 月底現金與有價證券約 2,651 億（含短期限售的 SpaceX 752 億）；有息負債 125,102 百萬美元，未含一年內到期票據約 10 億與融資租賃約 37 億，淨現金仍為正。&lt;/strong&gt;2026 年新發票據最早 2028 年到期，資金缺口來自自願擴張，不是債務到期。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;營運資金：存貨天數由約 5 天升到約 26 天（TPU 系統備貨），應收約 56 天持平，應付由約 27 天升到約 43 天。&lt;/strong&gt;表外：採購承諾 9,244 億、能源設備保證最高 162 億、TPU 回購保證最高 66 億。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;figure&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt signals&quot;&gt;&lt;tr&gt;&lt;th&gt;財務管理指標&lt;/th&gt;&lt;th&gt;數值&lt;/th&gt;&lt;th&gt;代表什麼&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;現金與有價證券&lt;/td&gt;&lt;td&gt;約 2,651 億（含 SpaceX 752 億，短期限售）&lt;/td&gt;&lt;td&gt;流動性充足，但部分是股權、價格會變動&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2026 前九月外部融資&lt;/td&gt;&lt;td&gt;發債收入 852 億（淨借入約 763 億）、普通股 429 億、特別股 191 億&lt;/td&gt;&lt;td&gt;AI 投資的缺口靠外部資金補&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;表外承諾與保證&lt;/td&gt;&lt;td&gt;採購承諾 9,244 億；能源設備保證最高 162 億；TPU 回購保證最高 66 億&lt;/td&gt;&lt;td&gt;未來數年成本相對固定&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;資產變化：存貨、設備、應付與權益證券&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;存貨 +446%（2025 年底起九個月，去年同期未單獨揭露）、設備 +67%、應付帳款 +108%、遞延收入 +70%（三者為 2025-09-30 起年增）都遠快於近四季營收 +22%；存貨已由公司說明是待售 TPU 系統與 Pixel（Google 自有品牌手機）等裝置，設備對應技術基礎設施投資。&lt;/strong&gt;應付與遞延收入方向與資本支出倍增、雲端成長一致，但公司未逐項說明，列為部分解釋的待查線索。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;權益證券：有價含 SpaceX 752 億、非上市股權約 1,352 億，評價變動進淨利，第三季淨損約 87 億。&lt;/strong&gt;股權橋把非上市股權打七折計入&lt;span class=&quot;src&quot;&gt;（作者判斷，比全額少約 3.3 美元，推算）&lt;/span&gt;，SpaceX 以 9 月底帳列全額計。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;figure&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt signals&quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;期初（日期）→期末（2026-09-30）&lt;/th&gt;&lt;th&gt;變化&lt;/th&gt;&lt;th&gt;判讀&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;存貨&lt;/td&gt;&lt;td&gt;24 億（2025-12-31）→133 億&lt;/td&gt;&lt;td&gt;+446%（九個月）&lt;/td&gt;&lt;td&gt;已解釋：待售 TPU 系統與 Pixel 等裝置&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;應收帳款&lt;/td&gt;&lt;td&gt;571 億（2025-09-30）→728 億&lt;/td&gt;&lt;td&gt;+27%（年增）&lt;/td&gt;&lt;td class=&quot;st-正常&quot;&gt;正常&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;應付帳款&lt;/td&gt;&lt;td&gt;105 億（2025-09-30）→220 億&lt;/td&gt;&lt;td&gt;+108%（年增）&lt;/td&gt;&lt;td&gt;部分解釋：與資本支出同向&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;不動產廠房設備&lt;/td&gt;&lt;td&gt;2,238 億（2025-09-30）→3,728 億&lt;/td&gt;&lt;td&gt;+67%（年增）&lt;/td&gt;&lt;td&gt;已解釋：技術基礎設施投資&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;遞延收入（流動）&lt;/td&gt;&lt;td&gt;55 億（2025-09-30）→94 億&lt;/td&gt;&lt;td&gt;+70%（年增）&lt;/td&gt;&lt;td&gt;部分解釋：雲端及訂閱，增幅原因未說明&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;權益證券&lt;/td&gt;&lt;td&gt;有價（含 SpaceX 752 億）＋非上市約 1,352 億&lt;/td&gt;&lt;td&gt;第三季淨損約 87 億&lt;/td&gt;&lt;td class=&quot;st-已解釋&quot;&gt;已解釋&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;公司內部治理：控制權、董事會與獎酬&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;&lt;a class=&quot;term&quot; href=&quot;#g20&quot;&gt;三類股&lt;/a&gt;：A 股一股一票、B 股十票、C 股無表決權。&lt;/strong&gt;共同創辦人 Larry Page 與 Sergey Brin 分別約 27.4%、25.3% 表決權，合計約 52.7%&lt;span class=&quot;src&quot;&gt;（推算）&lt;/span&gt;，董事與高管合計約 54.3%（2026 委託書）；十席董事中 Page、Brin 與執行長 Sundar Pichai 三人非獨立。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;高管績效股（PSU，2026 年 4 月授予 Ashkenazi、Porat、Schindler、Walker 四位）依 2026–2028 年相對 S&amp;amp;P 100 公司的股東總報酬歸屬（目標的 0%–200%），其餘為三年按月歸屬的時間型 GSU&lt;span class=&quot;src&quot;&gt;（8-K 2026-04-10 本文 §6–§8）&lt;/span&gt;；指標沒有資本報酬或每股現金。&lt;/strong&gt;2020 年底投入 100 美元，2025 年底為 361 美元（同業 138）。近 6 個月內部人公開市場買進 0，賣出全屬&lt;a class=&quot;term&quot; href=&quot;#g21&quot;&gt;預設交易計畫（10b5-1）&lt;/a&gt;。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;figure&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt signals&quot;&gt;&lt;tr&gt;&lt;th&gt;治理指標&lt;/th&gt;&lt;th&gt;數值&lt;/th&gt;&lt;th&gt;出處&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;表決權&lt;/td&gt;&lt;td&gt;Page 約 27.4%、Brin 約 25.3%（合計約 52.7%，推算）；董事與高管約 54.3%&lt;/td&gt;&lt;td&gt;2026 委託書&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股東總報酬（100 美元起算）&lt;/td&gt;&lt;td&gt;公司 361 對同業 138（2020 年底至 2025 年底）&lt;/td&gt;&lt;td&gt;2026 委託書&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;內部人（近 6 個月）&lt;/td&gt;&lt;td&gt;買進 0；賣出 39 筆約 443 萬美元，全屬 10b5-1&lt;/td&gt;&lt;td&gt;Form 4&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;高管績效股指標&lt;/td&gt;&lt;td&gt;相對 S&amp;amp;P 100 股東總報酬（2026–2028，歸屬 0%–200%）；其餘為時間型 GSU&lt;/td&gt;&lt;td&gt;8-K 2026-04-10&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;業務治理：分部利潤、公司層級費用與法規&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;第三季分部利潤：Google 服務營業利益 392 億、利益率 40.7%（去年同期 38.5%）；雲端 111 億、36.2%（23.7%）；其他事業虧損 20 億。&lt;/strong&gt;公司只揭露分部營業利益，分部毛利未揭露。公司層級費用（主要是共用 AI 研發）由 45 億增到 77 億（+71%）。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;反壟斷：廣告科技案法院 2026 年 9 月駁回結構性分拆，改命互通、資料存取與競價行為補救，最終判決尚未作出，公司計畫上訴&lt;span class=&quot;src&quot;&gt;（10-Q Item 1 ¶332）&lt;/span&gt;；產業媒體 PPC Land 解讀為六年期並設法院監督人（新聞 N15）。&lt;/strong&gt;搜尋案限制分發並要求分享資料，雙方上訴中&lt;span class=&quot;src&quot;&gt;（10-Q Item 1 ¶331）&lt;/span&gt;；影響無法量化。2026 年第二季 PriceRunner 案認列約 21 億、第三季歐盟數位市場法罰款 10 億，都視為經常性成本，不另調整估值。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;figure&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt signals&quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;2026 第三季&lt;/th&gt;&lt;th&gt;去年同期&lt;/th&gt;&lt;th&gt;說明&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Google 服務營業利益&lt;/td&gt;&lt;td&gt;392 億（40.7%）&lt;/td&gt;&lt;td&gt;335 億（38.5%）&lt;/td&gt;&lt;td&gt;廣告與訂閱&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;雲端營業利益&lt;/td&gt;&lt;td&gt;111 億（36.2%）&lt;/td&gt;&lt;td&gt;36 億（23.7%）&lt;/td&gt;&lt;td&gt;規模效益顯現&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;其他事業&lt;/td&gt;&lt;td&gt;−20 億&lt;/td&gt;&lt;td&gt;−14 億&lt;/td&gt;&lt;td&gt;Waymo（其他事業中的自動駕駛服務）等，投資期&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;公司層級費用&lt;/td&gt;&lt;td&gt;−77 億&lt;/td&gt;&lt;td&gt;−45 億&lt;/td&gt;&lt;td&gt;主要是共用 AI 研發&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;白話說&lt;/b&gt;像一家過去每年買回自家股票的店，今年改成借錢也找新股東蓋新廠房：賺錢老股東受益，不賺錢要一起承擔。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;要留意&lt;/b&gt;應付帳款 +108% 與遞延收入 +70% 只部分解釋，是待查線索，見改判訊號。&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;events&quot;&gt;&lt;div class=&quot;qno&quot;&gt;問題 07&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;近半年發生了什麼重大事件？&lt;/div&gt;&lt;h2&gt;第三季營收 +25%、雲端 +103%；6 月起大規模發股發債&lt;/h2&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;2026 年 5 月以來的 8-K 多數與籌資有關：6 月初公開發行普通股（A 股每股 355.20 美元）與強制轉換特別股、設立最高 400 億美元 ATM，並由波克夏以每股約 351.81 美元私募；5、8、11 月另發行歐元、加幣、日圓與美元票據。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;10 月 28 日第三季財報：營收 1,276 億（+25%）、雲端 307 億（+103%）、營業利益率 31.8%；每股 2.12 美元低於去年同期，因權益證券由利益轉淨損約 87 億。&lt;/strong&gt;2026 年資本支出指引維持 1,950～2,050 億，2027 年會顯著增加。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;note-box&quot;&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:14px&quot;&gt;2026 年 5 月以來 8-K 重大事件（依關聯性排序）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;申報日&lt;/th&gt;&lt;th&gt;事件&lt;/th&gt;&lt;th&gt;內容重點&lt;/th&gt;&lt;th&gt;影響哪個判斷&lt;/th&gt;&lt;th&gt;關聯性&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;10-28&lt;/td&gt;&lt;td&gt;第三季財報（Item 2.02）&lt;/td&gt;&lt;td&gt;營收 1,276 億 +25%；雲端 +103%&lt;/td&gt;&lt;td&gt;第二、三、五題&lt;/td&gt;&lt;td&gt;高&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;06-04、06-05&lt;/td&gt;&lt;td&gt;增資計畫（Item 1.01、7.01、8.01）&lt;/td&gt;&lt;td&gt;公開發行普通股與強制轉換特別股（2029 年轉普通股）；ATM 最高 400 億；波克夏私募&lt;/td&gt;&lt;td&gt;第四、六題&lt;/td&gt;&lt;td&gt;高&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;07-22&lt;/td&gt;&lt;td&gt;第二季財報（Item 2.02）&lt;/td&gt;&lt;td&gt;營收 1,198 億 +24%；雲端 +82%&lt;/td&gt;&lt;td&gt;第二、三、五題&lt;/td&gt;&lt;td&gt;高&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;08-10&lt;/td&gt;&lt;td&gt;發行 250 億美元票據（Item 8.01）&lt;/td&gt;&lt;td&gt;多檔不同年期&lt;/td&gt;&lt;td&gt;第六題：負債&lt;/td&gt;&lt;td&gt;中&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;11-05&lt;/td&gt;&lt;td&gt;發行 60 億歐元優先票據（Item 8.01）&lt;/td&gt;&lt;td&gt;期後事項，9 月底資產負債表未含&lt;/td&gt;&lt;td&gt;第六題：負債&lt;/td&gt;&lt;td&gt;中&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;05-11、05-21&lt;/td&gt;&lt;td&gt;發行歐元、加幣、日圓票據（Item 8.01）&lt;/td&gt;&lt;td&gt;90 億歐元＋95 億加幣；約 5,769 億日圓&lt;/td&gt;&lt;td&gt;第六題：負債&lt;/td&gt;&lt;td&gt;中&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;06-11&lt;/td&gt;&lt;td&gt;股東會結果（Item 5.02、5.07）&lt;/td&gt;&lt;td&gt;員工股票計畫增加 2 億股 C 股&lt;/td&gt;&lt;td&gt;第四題：稀釋&lt;/td&gt;&lt;td&gt;中&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;06-05&lt;/td&gt;&lt;td&gt;新任會計長（Item 5.02）&lt;/td&gt;&lt;td&gt;Marsida Saraci 擔任首席會計官&lt;/td&gt;&lt;td&gt;第六題&lt;/td&gt;&lt;td&gt;低&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;白話說&lt;/b&gt;公司以每股約 352–355 美元發新股，像高價賣股份拿現金開分店，前提是新店賺錢。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;要留意&lt;/b&gt;看第四季財報會議的 2027 年資本支出、雲端積壓與 ATM 發行股數。&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;news&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;與報告相關的近期新聞&lt;/p&gt;&lt;h3&gt;新聞印證雲端與 TPU 需求，也印證資本支出加重與搜尋變現受考驗&lt;/h3&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;本輪重跑新聞候選 631 則，挑官方逐字稿、主流媒體與原始數據，回原文逐句核對，採用 17 則（下表列最重要 9 則，其餘存新聞/ 資料夾）；擷取失敗與 11-01 之後轉址被限流的新聞不引用，歐元債改以 8-K 原文代替。&lt;/strong&gt;新聞只作外部參考，財務事實以 SEC 申報為準。&lt;/p&gt;&lt;p&gt;最重要訊號：官方逐字稿顯示 2026 年資本支出指引由 1,800～1,900 億上修為 1,950～2,050 億，雲端 +103%；反方是商務長承認 AI 模式變現較低，以及新雲端夥伴交付延遲。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;新聞摘要（依日期排序）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;日期&lt;/th&gt;&lt;th&gt;新聞&lt;/th&gt;&lt;th&gt;來源&lt;/th&gt;&lt;th&gt;對應主題&lt;/th&gt;&lt;th&gt;方向&lt;/th&gt;&lt;th&gt;我們的判讀&lt;/th&gt;&lt;th&gt;原文網址&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;06-23&lt;/td&gt;&lt;td&gt;CNBC（美國財經電視台）：Google 線上主導地位出現裂痕&lt;/td&gt;&lt;td&gt;CNBC&lt;/td&gt;&lt;td&gt;搜尋護城河&lt;/td&gt;&lt;td&gt;反方&lt;/td&gt;&lt;td&gt;市占仍約九成；使用者轉向聊天機器人未反映在市占，搜尋放緩是早期訊號。&lt;/td&gt;&lt;td class=&quot;link&quot;&gt;&lt;a href=&quot;https://www.cnbc.com/2026/06/23/googles-online-dominance-is-showing-signs-of-cracking-in-ai-era.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;原文&lt;/a&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;07-22&lt;/td&gt;&lt;td&gt;Alphabet 第二季財報會議逐字稿&lt;/td&gt;&lt;td&gt;Alphabet 投資人關係（官方逐字稿）&lt;/td&gt;&lt;td&gt;資本支出與自由現金流&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;資本支出指引上修；財務長稱除 ATM 外暫不再發股（公司說法，非承諾）。&lt;/td&gt;&lt;td class=&quot;link&quot;&gt;&lt;a href=&quot;https://abc.xyz/investor/events/event-details/2026/2026-Q2-Earnings-Call-2026-GgTAq7Is0z/default.aspx&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;原文&lt;/a&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;09-20&lt;/td&gt;&lt;td&gt;Dealroom：十家銀行對 Crux AI 提供 220 億美元貸款（引述 Bloomberg）&lt;/td&gt;&lt;td&gt;Dealroom（引述 Bloomberg）&lt;/td&gt;&lt;td&gt;SpaceX 與 Crux AI&lt;/td&gt;&lt;td&gt;反方&lt;/td&gt;&lt;td&gt;合資以晶片擔保借款；未經 Alphabet 證實，只列待驗證訊號。&lt;/td&gt;&lt;td class=&quot;link&quot;&gt;&lt;a href=&quot;https://app.dealroom.co/news/note/banks-lend-22b-to-blackstone-alphabet-s-crux-ai-backed-by-chips&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;原文&lt;/a&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;10-07&lt;/td&gt;&lt;td&gt;citybiz：Google 仍占全球搜尋近九成（Statcounter）&lt;/td&gt;&lt;td&gt;citybiz（引述 Statcounter）&lt;/td&gt;&lt;td&gt;搜尋護城河&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;2026 年 9 月 89.9%、一年降 0.44 個百分點；不含 App 內 AI 助理。&lt;/td&gt;&lt;td class=&quot;link&quot;&gt;&lt;a href=&quot;https://www.citybiz.co/article/915639/chatgpt-and-gemini-gain-users-as-google-holds-nearly-90-of-global-search-market/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;原文&lt;/a&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;10-28&lt;/td&gt;&lt;td&gt;CNBC：第三季維持資本支出、2027 年顯著增加，自由現金流為負&lt;/td&gt;&lt;td&gt;CNBC&lt;/td&gt;&lt;td&gt;資本支出與自由現金流&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;單季自由現金流約 −91 億，與本報告現金品質弱一致；3,000 億是市場估計，不引用。&lt;/td&gt;&lt;td class=&quot;link&quot;&gt;&lt;a href=&quot;https://www.cnbc.com/2026/10/28/alphabet-googl-earnings-q3-2026.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;原文&lt;/a&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;10-28&lt;/td&gt;&lt;td&gt;執行長第三季財報會議講稿&lt;/td&gt;&lt;td&gt;Google 官方部落格（執行長講稿）&lt;/td&gt;&lt;td&gt;雲端與 TPU&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;營收 +25%、雲端 +103% 與 8-K 一致；查詢量成長是公司說法。&lt;/td&gt;&lt;td class=&quot;link&quot;&gt;&lt;a href=&quot;https://blog.google/company-news/inside-google/message-ceo/alphabet-earnings-q3-2026/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;原文&lt;/a&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;10-28&lt;/td&gt;&lt;td&gt;CNBC：Google 透過夥伴對外銷售 TPU&lt;/td&gt;&lt;td&gt;CNBC&lt;/td&gt;&lt;td&gt;雲端與 TPU&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;TPU 新成長引擎；部分合約附回購選擇權、金額未揭露，屬待證明。&lt;/td&gt;&lt;td class=&quot;link&quot;&gt;&lt;a href=&quot;https://www.cnbc.com/2026/10/28/google-alters-cloud-playbook-turning-to-partners-to-sell-more-ai-chips.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;原文&lt;/a&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;10-29&lt;/td&gt;&lt;td&gt;9to5Google：Google 承認 AI Mode 變現較低&lt;/td&gt;&lt;td&gt;9to5Google&lt;/td&gt;&lt;td&gt;搜尋護城河&lt;/td&gt;&lt;td&gt;反方&lt;/td&gt;&lt;td&gt;搜尋護城河受考驗的直接證據；第三季搜尋 17%→12%，廣告擴大效果待驗證。&lt;/td&gt;&lt;td class=&quot;link&quot;&gt;&lt;a href=&quot;https://9to5google.com/2026/10/29/google-stock-drop-ai-mode-ad-expansion/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;原文&lt;/a&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;10-29&lt;/td&gt;&lt;td&gt;CNBC：Google 與微軟沒有再上調資本支出預測&lt;/td&gt;&lt;td&gt;CNBC&lt;/td&gt;&lt;td&gt;資本支出與自由現金流&lt;/td&gt;&lt;td&gt;反方&lt;/td&gt;&lt;td&gt;指引沒有再上修，2027 年仍會顯著增加；新雲端夥伴交付延遲屬產業風險。&lt;/td&gt;&lt;td class=&quot;link&quot;&gt;&lt;a href=&quot;https://www.cnbc.com/2026/10/29/microsoft-google-ai-capex-estimates.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;原文&lt;/a&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;numbers&quot;&gt;&lt;div class=&quot;qno&quot;&gt;完整數字&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;三大報表摘要（年度與 8 季）&lt;/div&gt;&lt;h2&gt;營收、獲利、現金流與資產負債一次看&lt;/h2&gt;&lt;div class=&quot;grid2 wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;損益：年度與近四季（億美元）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 300&quot; role=&quot;img&quot; aria-label=&quot;損益（年度）&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;266.0&quot; y2=&quot;266.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;270.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;0.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;185.3&quot; y2=&quot;185.3&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;189.3&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;2,000&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=& &lt;section class=&quot;q&quot; id=&quot;workpaper&quot; data-layer=&quot;計算底稿&quot;&gt;&lt;div class=&quot;qno&quot;&gt;計算底稿&lt;/div&gt;&lt;h2&gt;計算底稿：正文結果的算法與完整表（預設摺疊）&lt;/h2&gt;&lt;p class=&quot;wpnote&quot;&gt;正文每個估值、償債結果都從這裡算出；背景計算照做、送審照核。不讀也不影響理解結論；非買賣建議。&lt;/p&gt;&lt;details id=&quot;wp-3-4&quot;&gt;&lt;summary&gt;3・4 現金與股東：報表對帳與股東回報判讀&lt;/summary&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;現金流報表對帳&lt;/h3&gt;&lt;p&gt;報表對帳（10-Q 2026-09-30，現金、約當現金及受限現金）：期初 30,708.0＋營運 127,149.0＋投資 -217,171.0＋融資 115,757.0＋其他 -109.0＝期末 56,334.0 百萬美元｜完整&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;股東回報判讀表&lt;/h3&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;股東回報（判讀依估值政策門檻，2026-10-14 核定；不影響估值與價格位置）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;數值&lt;/th&gt;&lt;th&gt;判讀&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股利殖利率&lt;/td&gt;&lt;td&gt;0.29%&lt;/td&gt;&lt;td&gt;不評好壞：依估值政策，股利殖利率高低不設門檻（高殖利率常因股價下跌）；占股東收益率 65%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;回購殖利率&lt;/td&gt;&lt;td&gt;0.16%&lt;/td&gt;&lt;td&gt;不評好壞：近四季回購約 59.0 億美元，是市值 36,693.2 億美元的 0.16%；划不划算看「股東收益率」「淨回購」「回購均價」&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股東收益率（股利＋回購）&lt;/td&gt;&lt;td&gt;0.45%（公債的 9%）&lt;/td&gt;&lt;td&gt;不評好壞：主要靠成長，0.45% 只有 10 年期公債 5.15% 的 9%；回饋低是成長型公司的常態，改看成長&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;淨回購殖利率&lt;/td&gt;&lt;td&gt;-0.67%&lt;/td&gt;&lt;td&gt;警示：回購少於發給員工的股票，只在抵銷稀釋（淨 -0.67%）；依政策「治理與資本配置」最高只能評「中」；本次該項評「中」，評等不受影響&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股數年變化（1／3／10 財年）&lt;/td&gt;&lt;td&gt;-1.7%／-2.4%／—&lt;/td&gt;&lt;td&gt;好：2025 財年對上一財年 -1.7%（減少）；近 3 財年平均每年 -2.4%（減少）；10 財年資料不足（只有 2022–2025）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;近十年有回購的年數&lt;/td&gt;&lt;td&gt;10／10&lt;/td&gt;&lt;td&gt;好：近十年有 10 年回購，達政策「穩定」（至少 8 年）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股利連續成長年數&lt;/td&gt;&lt;td&gt;1&lt;/td&gt;&lt;td&gt;中性：連續 1 年調高，未達政策「近十年年年調高」&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股東回饋占自由現金流&lt;/td&gt;&lt;td&gt;84.07%&lt;/td&gt;&lt;td&gt;注意：股利＋回購用掉近四季自由現金流的 84%，接近政策 100% 警示線&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;details id=&quot;wp-mkt&quot;&gt;&lt;summary&gt;市場背景：大盤一句、流動性、空單與參考值的資料日期與存檔&lt;/summary&gt;&lt;p class=&quot;cap&quot;&gt;大盤狀態（市場總覽；只揭露，不進研究評等、價格位置與合理價值）：S&amp;amp;P 500（以 SPY 代表）前十大持股合計 37.3%，最大產業科技 38.2%；那斯達克 100（QQQ）科技占 58.0%；等權重 RSP 減市值加權 SPY 近3個月報酬差 1.7 個百分點，位在 2003 年以來第 79 分位（持平）。高收益債利差 3.30，位在 2023 年以來第 81 分位（偏高）；金融狀況指數 -0.46，位在 1971 年以來第 44 分位（中性）；VIX 18.70，位在 1990 年以來第 56 分位（中性）；融資推估（聯準會，推估）0.74 兆美元（2026-06-30），年增 46.6%（第 92 分位，偏高），占國內公司股權市值 0.68%（第 8 分位，偏低）。（市場總覽收盤日 2026-11-12，市場/市場總覽.json）。&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;流動性、空單與參考值（只列事實與資料日期，不判冷熱、不是買賣訊號；非買賣建議）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;類別&lt;/th&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;數值&lt;/th&gt;&lt;th&gt;資料日期&lt;/th&gt;&lt;th&gt;說明與存檔&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;流動性&lt;/td&gt;&lt;td&gt;20 日均成交量&lt;/td&gt;&lt;td&gt;40,791,460 股&lt;/td&gt;&lt;td&gt;2026-11-13 收盤&lt;/td&gt;&lt;td&gt;90 日均量 29,780,642 股（20 日 ÷ 90 日 1.37 倍）｜市場資料/市場溫度.json#/量能&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;流動性&lt;/td&gt;&lt;td&gt;20 日均成交金額&lt;/td&gt;&lt;td&gt;121.2 億美元&lt;/td&gt;&lt;td&gt;2026-11-13 收盤&lt;/td&gt;&lt;td&gt;市場資料/市場溫度.json#/流動性/20日均成交金額&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;流動性&lt;/td&gt;&lt;td&gt;20 日均周轉率（每日）&lt;/td&gt;&lt;td&gt;0.33%&lt;/td&gt;&lt;td&gt;2026-11-13 收盤&lt;/td&gt;&lt;td&gt;20 日均量 ÷ SEC 封面流通股數（當時可得，依分割換算）；自身近 5 年第 78% 百分位｜市場資料/市場溫度.json#/流動性/20日均換手率&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;空單&lt;/td&gt;&lt;td&gt;放空比率（空單占流通股）&lt;/td&gt;&lt;td&gt;1.49%&lt;/td&gt;&lt;td&gt;2026-10-30 結算&lt;/td&gt;&lt;td&gt;空單 87,622,276 股；前月（2026-09-30）80,391,960 股，增加 9.0%；交易所每月兩次申報，經 yfinance 取得（2026-11-14）｜市場資料/市場溫度.json#/流動性/空單&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;空單&lt;/td&gt;&lt;td&gt;回補天數&lt;/td&gt;&lt;td&gt;2.67 天&lt;/td&gt;&lt;td&gt;2026-10-30 結算&lt;/td&gt;&lt;td&gt;空單 ÷ 日均量（yfinance）；自算 ÷ 90 日均量 2.94 天｜市場資料/市場溫度.json#/流動性/空單&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;參考值&lt;/td&gt;&lt;td&gt;52 週區間位置&lt;/td&gt;&lt;td&gt;18%&lt;/td&gt;&lt;td&gt;2026-11-13 收盤&lt;/td&gt;&lt;td&gt;0%＝52 週低 273.16、100%＝52 週高 402.12（收盤，推算）｜市場資料/市場溫度.json#/趨勢&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;參考值&lt;/td&gt;&lt;td&gt;近 12 個月股價報酬&lt;/td&gt;&lt;td&gt;+3.4%&lt;/td&gt;&lt;td&gt;2026-11-13 收盤&lt;/td&gt;&lt;td&gt;同期 S&amp;amp;P 500 +11.6%｜市場資料/市場溫度.json#/動能&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;參考值&lt;/td&gt;&lt;td&gt;60 日歷史年化波動&lt;/td&gt;&lt;td&gt;34.9%&lt;/td&gt;&lt;td&gt;2026-11-13 收盤&lt;/td&gt;&lt;td&gt;日報酬標準差年化（收盤）｜市場資料/市場溫度.json#/波動&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;參考值&lt;/td&gt;&lt;td&gt;距 200 日均線&lt;/td&gt;&lt;td&gt;-12.5%&lt;/td&gt;&lt;td&gt;2026-11-13 收盤&lt;/td&gt;&lt;td&gt;200 日均線 338.20｜市場資料/市場溫度.json#/趨勢&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;wide&quot;&gt;&lt;/div&gt;&lt;/details&gt;&lt;details id=&quot;wp-5&quot;&gt;&lt;summary&gt;5 估值：情境算式、市價隱含第 10 年倍數、同業與歷史倍數交叉核對、條件式區間算法、市價反推、溢價來源與作者計算說明&lt;/summary&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;作者計算說明&lt;/h3&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;折現率：無風險利率 5.15%（財政部 10 年期 2026-11-13）、股權風險溢價 4.20%（Damodaran 2026-10-01 市場隱含）。&lt;/strong&gt;beta（股價相對大盤的波動度）中值 1.09＝2 年週 beta（Blume 調整）1.15 與 Damodaran Software（Damodaran 產業分類的軟體業） (Entertainment（娛樂）) 重新加槓桿 1.04 的平均&lt;span class=&quot;src&quot;&gt;（推導；負債權益比 3.57% 與 WACC 債務權重同口徑、不含營業租賃）&lt;/span&gt;；yfinance 五年迴歸 1.23 只當上緣。基準 WACC 9.53%（低 8.83%、高 10.70%）。若沿用舊版中值 1.21，合理價值中點約 209.1&lt;span class=&quot;src&quot;&gt;（−8.3%，估值引擎試算，推導，不進合理價值）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;再投資：近期增量銷售對資本比 0.63（2023～2025）對長期 1.03（2017～2025），比值 61% 低於 70%，屬投資高峰期&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;。&lt;/strong&gt;基準銷售對資本 0.48、0.55、0.70、0.85、1.00：第 1 年取依 2026 年資本支出指引換算 0.48～0.51 的下緣，第 5 年回到長期值附近；樂觀 0.60→1.05、保守 0.40→0.85（保守第 5 年不回長期值，理由是營收組合轉向資本密集的雲端、採購承諾 9,244 億難下修）。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;超額報酬期間：近五年 ROIC 37%～58%&lt;span class=&quot;src&quot;&gt;（財務投入資本口徑）&lt;/span&gt;每年高於 WACC，護城河分級寬，三情境衰退期 10 年；若縮回 5 年，中點約 212.4&lt;span class=&quot;src&quot;&gt;（−6.8%，推導）&lt;/span&gt;。&lt;/strong&gt;永續期 ROIC 基準 25%、樂觀 32%、保守 17%，低於上限 44%／27%，取各情境第 5 年銷售對資本比 × 稅後穩態利潤率&lt;span class=&quot;src&quot;&gt;（例：1.00 × 31% × 82%＝25.4%，推導）&lt;/span&gt;。另一設定（衰退 15 年＋永續期 ROIC＝WACC）中點 −3.8%、只延長衰退期 +6.4%，價格位置都不變。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;情境幅度：第 1–3 年平均成長保守 8.0%、基準 15.7%、樂觀 22.0%；穩態利潤率保守 25%（基準的 0.81 倍）、樂觀 39%（1.26 倍），兩邊用同一把尺。&lt;/strong&gt;加權中點 ÷ 基準每股＝227.92 ÷ 212.81＝1.07&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;，上行較大來自樂觀情境利潤率與銷售對資本比同時較好。情境差距 116%，不確定性「高」。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;成長跑道（六項）：①市場空間：雲端未完成訂單 5,608 億約為近四季雲端營收 6.0 倍&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;，搜尋市占約 90% 為第三方數字（部分）。&lt;/strong&gt;②定價能力：付費點擊 +8%、每次點擊成本 +4%&lt;span class=&quot;src&quot;&gt;（10-Q Item 2 ¶117，有證據）&lt;/span&gt;。③營運槓桿：增量營業利益率 2022→2025 約 45.2%、2025→近四季約 40.9%&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;，高於 2025 年利潤率 32.0%（有證據）。④指引達成：公司只給資本支出指引，2026 年由 1,800～1,900 億上修為 1,950～2,050 億、第三季維持（部分；全年實際未出，未畫指引圖）。⑤資金：前九月營運現金流 1,271 億低於資本支出 1,320 億，缺口由發債、發股與特別股補足（有證據）。⑥新事業：其他事業第三季營收 3.7 億、營業虧損 20 億&lt;span class=&quot;src&quot;&gt;（10-Q Item 1 ¶428，申報實績，只列事實、不估值）&lt;/span&gt;；雲端自第二季起認列 TPU 系統營收、金額未單獨揭露&lt;span class=&quot;src&quot;&gt;（10-Q Item 2 ¶45）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;計算核對（2026-11-14，過門檻 0 項）：G1（缺口判斷第 1 項）非上市股權七折計入，不做時中點 −3.35%；G2（缺口判斷第 2 項）遞延所得稅列請求權 +0.93%；G3（缺口判斷第 3 項）特別股以清算優先列請求權 +0.24%；還原後上緣最高 263.34 仍低於收盤，價格位置不變。&lt;/strong&gt;G4（計算核對第 4 項：產業基準例外）產業基準例外：公版預設 Information Services 15 家、營業利益率 11.9%、去槓桿 beta 0.74，主要是資訊與徵信服務；改用時 WACC 9.01%、中點 252.0（+10.6%）、區間 187.2～326.5，價格位置會變「合理」&lt;span class=&quot;src&quot;&gt;（估值引擎試算，推導）&lt;/span&gt;。本報告沿用 Software (Entertainment)（77 家、營業利益率 33.9%），但 Alphabet 資本支出約占該產業五成五&lt;span class=&quot;src&quot;&gt;（推算）&lt;/span&gt;，只作參考、不當獨立檢查；此例外送審交接列出。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;一次性項目：近四季有兩筆法務費用——2026 年第二季 PriceRunner（比價網站業者）案約 21 億&lt;span class=&quot;src&quot;&gt;（10-Q Item 1 ¶341）&lt;/span&gt;、第三季歐盟數位市場法罰款 10 億&lt;span class=&quot;src&quot;&gt;（10-Q Item 1 ¶339，已上訴）&lt;/span&gt;——合計約 31 億、占近四季營業利益 1,570 億約 2%&lt;span class=&quot;src&quot;&gt;（推算）&lt;/span&gt;，都視為經常性的法務成本，不另調整估值。&lt;/strong&gt;核心 EPS 10.42 美元＝營業利益扣稅後除以稀釋股數，排除權益證券評價損益。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;!--新圖表--&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;缺口判斷影響幅度&lt;/h3&gt;&lt;div class=&quot;wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;市價隱含第 10 年倍數（倍）：基準折現率下市價隱含 20.4 倍、模型 11.4 倍（約 1.8 倍差距）；參考帶 p25–p75 6.0–28.1 倍（機械回測樣本，非市場全體；分產業的筆數與公司數少，僅供參考）。只描述，不進評等、不是目標價（估值結果.json#/market_implied_terminal）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 620 242&quot; role=&quot;img&quot; aria-label=&quot;市價隱含第 10 年倍數&quot; class=&quot;chart&quot; style=&quot;max-width:775px&quot;&gt;&lt;line x1=&quot;252.0&quot; x2=&quot;252.0&quot; y1=&quot;22&quot; y2=&quot;216&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;252.0&quot; y=&quot;234&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;0&lt;/text&gt;&lt;line x1=&quot;308.3&quot; x2=&quot;308.3&quot; y1=&quot;22&quot; y2=&quot;216&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;308.3&quot; y=&quot;234&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;5&lt;/text&gt;&lt;line x1=&quot;364.7&quot; x2=&quot;364.7&quot; y1=&quot;22&quot; y2=&quot;216&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;364.7&quot; y=&quot;234&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;10&lt;/text&gt;&lt;line x1=&quot;421.0&quot; x2=&quot;421.0&quot; y1=&quot;22&quot; y2=&quot;216&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;421.0&quot; y=&quot;234&quot; cla
