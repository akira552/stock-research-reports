ot;55.2&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;營業利益率 ORCL：34%&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;489.8&quot; y=&quot;243.1&quot; width=&quot;17.0&quot; height=&quot;22.9&quot; rx=&quot;2&quot; fill=&quot;var(--c2)&quot;&gt;&lt;title&gt;研發占營收 ORCL：14%&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;508.8&quot; y=&quot;95.9&quot; width=&quot;17.0&quot; height=&quot;170.1&quot; rx=&quot;2&quot; fill=&quot;var(--c3)&quot;&gt;&lt;title&gt;資本支出占營收 ORCL：105%&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;499.3&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;ORCL&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c1)&quot;&gt;&lt;/i&gt;營業利益率&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c2)&quot;&gt;&lt;/i&gt;研發占營收&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c3)&quot;&gt;&lt;/i&gt;資本支出占營收&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt signals&quot;&gt;&lt;tr&gt;&lt;th&gt;公司&lt;/th&gt;&lt;th&gt;商業模式&lt;/th&gt;&lt;th&gt;服務導向&lt;/th&gt;&lt;th&gt;營業利益率&lt;/th&gt;&lt;th&gt;研發占營收&lt;/th&gt;&lt;th&gt;資本支出占營收&lt;/th&gt;&lt;th&gt;最近一季營收年增&lt;/th&gt;&lt;th&gt;與 Alphabet 的主要差異&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Alphabet&lt;/td&gt;&lt;td&gt;搜尋與 YouTube 廣告＋雲端＋TPU&lt;/td&gt;&lt;td&gt;高&lt;/td&gt;&lt;td&gt;33.3%&lt;/td&gt;&lt;td&gt;15.8%&lt;/td&gt;&lt;td&gt;33.9%&lt;/td&gt;&lt;td&gt;+24.7%&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Microsoft（微軟）&lt;/td&gt;&lt;td&gt;企業軟體與 Azure 雲端&lt;/td&gt;&lt;td&gt;高&lt;/td&gt;&lt;td&gt;47.1%&lt;/td&gt;&lt;td&gt;10.5%&lt;/td&gt;&lt;td&gt;39.2%&lt;/td&gt;&lt;td&gt;+18.8%&lt;/td&gt;&lt;td&gt;收入以企業訂閱為主，利潤率最高&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Meta&lt;/td&gt;&lt;td&gt;社群平台廣告&lt;/td&gt;&lt;td&gt;高&lt;/td&gt;&lt;td&gt;32.9%&lt;/td&gt;&lt;td&gt;31.7%&lt;/td&gt;&lt;td&gt;43.2%&lt;/td&gt;&lt;td&gt;+26.1%&lt;/td&gt;&lt;td&gt;收入幾乎全是廣告；研發與資本支出強度最高&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Amazon（亞馬遜）&lt;/td&gt;&lt;td&gt;電商＋AWS 雲端＋廣告&lt;/td&gt;&lt;td&gt;混合&lt;/td&gt;&lt;td&gt;12.1%&lt;/td&gt;&lt;td&gt;未單列&lt;/td&gt;&lt;td&gt;25.2%&lt;/td&gt;&lt;td&gt;+12.1%&lt;/td&gt;&lt;td&gt;零售低利潤拉低整體&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Apple（營運參考）&lt;/td&gt;&lt;td&gt;硬體為主＋服務&lt;/td&gt;&lt;td&gt;低&lt;/td&gt;&lt;td&gt;33.0%&lt;/td&gt;&lt;td&gt;9.6%&lt;/td&gt;&lt;td&gt;1.9%&lt;/td&gt;&lt;td&gt;+11.7%&lt;/td&gt;&lt;td&gt;資本支出極低，不是 AI 基礎設施的大投資者&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Oracle（營運參考）&lt;/td&gt;&lt;td&gt;資料庫軟體＋雲端基礎設施&lt;/td&gt;&lt;td&gt;高&lt;/td&gt;&lt;td&gt;34.2%&lt;/td&gt;&lt;td&gt;14.2%&lt;/td&gt;&lt;td&gt;105.4%&lt;/td&gt;&lt;td&gt;+29.6%&lt;/td&gt;&lt;td&gt;資本支出超過營收，AI 雲端建設最激進&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;details id=&quot;claims&quot;&gt;&lt;summary&gt;論點檢查：每條判斷的證據狀態&lt;/summary&gt;&lt;div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;依風險分類的主張（證據狀態：支持／部分支持／提出反證／資料不足）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;編號&lt;/th&gt;&lt;th&gt;風險類別&lt;/th&gt;&lt;th&gt;主張&lt;/th&gt;&lt;th&gt;角色&lt;/th&gt;&lt;th&gt;證據狀態&lt;/th&gt;&lt;th&gt;什麼會改變判斷&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;GOOGL-C08&lt;/td&gt;&lt;td&gt;R1 資金與流動性&lt;/td&gt;&lt;td&gt;短期資金來源與到期：現金與有價證券約 2,651 億、循環信用 100 億全數未動用、商業本票餘額 0、一年內到期長期票據約 10 億、2026 年新發票據最早 2028 年到期，對照近四季營運現金流約 1,796 億；資金缺口來自自願擴張而非債務到期。&lt;/td&gt;&lt;td&gt;支持論點&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;單季營運現金流低於資本支出的缺口超過 200 億且商業本票或循環信用餘額轉為正值，或信用評等被調降&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;GOOGL-C09&lt;/td&gt;&lt;td&gt;R2 償債負擔與永久損失&lt;/td&gt;&lt;td&gt;債務負擔相對獲利仍輕：有息負債÷EBITDA 約 0.68、淨負債為負、營運現金流÷有息負債約 1.44；但有息負債九個月內由約 465 億增至約 1,261 億，另有 9,244 億採購承諾、162 億能源設備保證與 66 億 TPU 回購保證等表外義務；期後 2026-11-05 再完成 60 億歐元優先票據（9/30 數字未含）。&lt;/td&gt;&lt;td&gt;支持論點&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;有息負債÷EBITDA 超過 1.5，或淨現金轉為淨負債&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;GOOGL-C01&lt;/td&gt;&lt;td&gt;R3 成長退坡與競爭&lt;/td&gt;&lt;td&gt;搜尋的規模與網路效應仍在：2026 年 9 月全球搜尋市占約 89.9%、查詢量年增率為五年最高，但管理層說 AI Mode 查詢的變現較低對成長有影響，第三季 Search &amp;amp; other 年增由 17% 降到 12%，護城河受考驗而非失守。&lt;/td&gt;&lt;td&gt;支持論點&lt;/td&gt;&lt;td&gt;部分支持&lt;/td&gt;&lt;td&gt;Search &amp;amp; other 年增連兩季低於 8%，或 Statcounter 全球市占跌破 85%；AI Mode 廣告全球擴大後 Search &amp;amp; other 年增回到 15% 以上&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;GOOGL-C04&lt;/td&gt;&lt;td&gt;R3 成長退坡與競爭&lt;/td&gt;&lt;td&gt;成長主要是內生的：第三季營收增加主要來自 Google Cloud 增 156 億（+103%）與 Services 增 93 億（+11%）；Wiz 併購（2026-03 完成）與 TPU 系統銷售的貢獻未單獨揭露，股數增加對每股成長是減項。&lt;/td&gt;&lt;td&gt;支持論點&lt;/td&gt;&lt;td&gt;部分支持&lt;/td&gt;&lt;td&gt;2026 年 10-K 揭露 Wiz 或 TPU 系統銷售占雲端營收增加的一半以上&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;GOOGL-C05&lt;/td&gt;&lt;td&gt;R3 成長退坡與競爭&lt;/td&gt;&lt;td&gt;基準情境成長 20%→8% 的速度有積壓支撐、持續時間靠雲端：營收積壓 5,677 億約 55% 在 24 個月內認列、近四季營收年增 22.2% 且加速；但搜尋放緩後 Services 只剩約一成成長，市價要求的未來 5 年年增約 16.4% 高於基準情境五年平均約 13%（推導），接近同類公司次年 p75 17.7%。&lt;/td&gt;&lt;td&gt;支持論點&lt;/td&gt;&lt;td&gt;部分支持&lt;/td&gt;&lt;td&gt;Google Cloud 年增連兩季低於 50%，或雲端積壓季減；雲端積壓季增超過 10% 且 Services 年增回到 13% 以上&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;GOOGL-C14&lt;/td&gt;&lt;td&gt;R3 成長退坡與競爭&lt;/td&gt;&lt;td&gt;反壟斷補救目前以行為規範為主：廣告科技案法院駁回結構性分拆、改命互通、資料存取與競價行為補救（最終判決尚未作出；PPC Land 解讀為六年期並設監督人）；搜尋案最終判決限制分發方式並要求分享搜尋資料，雙方上訴中，影響持續但無法量化。&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;部分支持&lt;/td&gt;&lt;td&gt;搜尋案上訴維持資料分享與預設分發限制，且 Search &amp;amp; other 年增降到個位數；上訴判決撤銷搜尋案資料分享或分發限制（補救範圍轉為縮小）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;GOOGL-C16&lt;/td&gt;&lt;td&gt;R3 成長退坡與競爭&lt;/td&gt;&lt;td&gt;成長空間的證據偏向雲端：Google Cloud 未完成訂單 5,608 億約為其近四季營收的 6.0 倍（推導）；公司不揭露搜尋市占或市場規模，第三方估計全球搜尋市占約九成，搜尋本身的滲透空間有限。&lt;/td&gt;&lt;td&gt;支持論點&lt;/td&gt;&lt;td&gt;部分支持&lt;/td&gt;&lt;td&gt;雲端未完成訂單連兩季下降，或對近四季雲端營收倍數降到 3 倍以下&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;GOOGL-C17&lt;/td&gt;&lt;td&gt;R3 成長退坡與競爭&lt;/td&gt;&lt;td&gt;搜尋仍有定價能力：2026 年第三季付費點擊年增 8%、每次點擊成本年增 4%（前九月 +11%／+4%，FY2025 +6%／+7%），量價同增；但 Network 曝光第三季年減 14%，第三方網站流量在下滑。&lt;/td&gt;&lt;td&gt;支持論點&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;付費點擊與 CPC 同時轉為年減一季&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;GOOGL-C02&lt;/td&gt;&lt;td&gt;R4 投入回報不足&lt;/td&gt;&lt;td&gt;高資本報酬仍明顯高於資金成本：近四季 ROIC 約 37%、近五年中位約 44%，研發資本化後約 31%（7 年）至 32%（5 年）仍遠高於 WACC 9.5%；但近四季增量 ROIC 降到約 16.6%（推算），新一輪 AI 投入的報酬尚待驗證。&lt;/td&gt;&lt;td&gt;支持論點&lt;/td&gt;&lt;td&gt;部分支持&lt;/td&gt;&lt;td&gt;近四季 ROIC 跌破 20%，或增量 ROIC 連兩季低於 WACC&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;GOOGL-C18&lt;/td&gt;&lt;td&gt;R4 投入回報不足&lt;/td&gt;&lt;td&gt;營運槓桿在擴大：2022→2025 增量營業利益率約 45.2%、FY2025→近四季約 40.9%（推導），都高於 FY2025 營業利益率 32.0%；但 AI 資本支出帶來的折舊加速可能壓縮後續增量利潤率。&lt;/td&gt;&lt;td&gt;支持論點&lt;/td&gt;&lt;td&gt;部分支持&lt;/td&gt;&lt;td&gt;近四季營業利益率連兩季下降 2 個百分點以上&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;GOOGL-C19&lt;/td&gt;&lt;td&gt;R4 投入回報不足&lt;/td&gt;&lt;td&gt;指引達成紀錄只能看資本支出：公司不給營收或獲利指引；2026 年資本支出指引第二季由 1,800～1,900 億上修為 1,950～2,050 億、第三季維持，前九月實際 1,320 億約為指引下緣的 68%（推導），2027 年將再顯著增加。&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;2027 年資本支出指引高於 2026 年 50% 以上，且雲端營收年增降到 40% 以下&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;GOOGL-C03&lt;/td&gt;&lt;td&gt;R5 收入與盈餘品質&lt;/td&gt;&lt;td&gt;近四季盈餘大多沒有變成自由現金流：自由現金流 197 億只占稅後營業利益 1,286 億的約 15%，扣股權薪酬 304 億後為負；第三季單季自由現金流約 −91 億，2026 年以發債與發股補足，每股價值暫時靠外部融資撐住。&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;連兩季單季營運現金流高於資本支出，且 2027 年資本支出指引增幅低於營運現金流增幅；2027 年資本支出指引顯著高於 2026 年且營運現金流未同步成長&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;GOOGL-C10&lt;/td&gt;&lt;td&gt;R5 收入與盈餘品質&lt;/td&gt;&lt;td&gt;部分雲端成長的收入品質低於一般訂閱：TPU 系統銷售附多年回購選擇權（按退貨權處理，回購保證最高 66 億；公司稱交易對手沒有行使的經濟誘因，公司說法），積壓含關聯方 Crux AI 168 億，Crux AI 據報以晶片擔保借款 220 億；存貨增至 133 億主要是待售 TPU 硬體，屬有解釋的警訊。&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;部分支持&lt;/td&gt;&lt;td&gt;10-Q／10-K 揭露 TPU 回購實際發生、退貨備抵增加，或 Crux AI 積壓延後認列；TPU 系統營收單獨揭露且回購保證金額下降&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;GOOGL-C11&lt;/td&gt;&lt;td&gt;R5 收入與盈餘品質&lt;/td&gt;&lt;td&gt;申報 EPS 被權益證券未實現利益墊高：近四季申報淨利每股約 19.1 美元，核心 EPS 10.42；SpaceX 持股 9 月底帳列 752 億、第三季有價及其他權益證券未實現損失約 124 億，業外損益波動大，本益比與 PEG 一律用核心 EPS。&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;申報與核心 EPS 的差距連四季低於 7%（權益證券損益轉為接近零）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;GOOGL-C13&lt;/td&gt;&lt;td&gt;R6 治理與資料可信度&lt;/td&gt;&lt;td&gt;治理風險主要是雙層股權：創辦人透過 B 股合計約 52.7% 投票權（推算），外部股東難以約束資本配置；內部人交易沒有異常：Brin 2026-08-07 Form 4 的 C 代碼是 B 股轉 A 股後贈與，近 6 個月公開市場賣出全屬 10b5-1 計畫、買進 0。&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;創辦人或高管出現非 10b5-1 的公開市場賣出且單人半年合計超過 1 億美元，或發行新的低投票權股票&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;GOOGL-C06&lt;/td&gt;&lt;td&gt;R7 估值與市場預期&lt;/td&gt;&lt;td&gt;現價 295.77 已反映高於基準的前提：市價隱含未來 5 年營收年增約 16.4%（利潤率照基準）或第 1 年起每年（含永續期）營業利益率約 41.4%（成長照基準），兩者是擇一而非同時成立，都高於基準情境（五年平均約 13%、穩態利潤率 31%）；核心本益比 28.4 倍高於去扭曲歷史 p75 26.7 倍，基準情境現價隱含年報酬 7.9%（非預期報酬）低於 WACC 9.5%，價格位置偏貴。&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;基準情境的成長或利潤率依新財報上修到接近市價隱含水準（例如營收年增連四季 ≥ 22% 且營業利益率 ≥ 35%）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;GOOGL-C07&lt;/td&gt;&lt;td&gt;R7 估值與市場預期&lt;/td&gt;&lt;td&gt;PEG 第一口徑 0.85 的便宜不成立：33.3% 成長率是申報 EPS（含權益證券利益）三年年增，配核心本益比 28.4 倍屬口徑混用；改用核心 EPS 三年年增約 22.4%（推算）PEG 約 1.3，基準情境推估口徑 PEG 2.6，且低 PEG 反映的是高再投資需求下的成長。&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;核心 EPS 近四季年增持續 25% 以上且資本支出占營收比率下降&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;GOOGL-C15&lt;/td&gt;&lt;td&gt;R8 宏觀與共同曝險&lt;/td&gt;&lt;td&gt;AI 基礎設施需求是產業共同曝險：大型雲端業者同時擴張（微軟下調、Alphabet 維持指引），新雲端夥伴交付延遲，大客戶與合資的融資進度影響積壓認列；若 AI 需求放緩，雲端積壓、TPU 銷售與資本支出回收會同時受壓，且採購承諾使支出難以快速下修。&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;部分支持&lt;/td&gt;&lt;td&gt;大型雲端業者合計資本支出指引轉為下修，或 Google Cloud 積壓季增轉為負值&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;GOOGL-C12&lt;/td&gt;&lt;td&gt;R9 稀釋與股東回饋&lt;/td&gt;&lt;td&gt;2026 年由回購轉為增資：前九月回購為 0，改以普通股公開發行、波克夏私募、ATM 與強制轉換特別股籌資，近一年股數增加、淨回購為負；財務長稱除支應股權薪酬稅負的 ATM 外暫不再發股，稀釋有上限線索但不是承諾。&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;以 2026-09-30 流通股 12,294 百萬股為基準，新發行普通股或可轉換證券使流通股再增加超過 1%；恢復淨回購（回購大於股權薪酬）連兩季&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;並列：研究評等 生意 B ／ 價格偏貴；價格位置 偏貴；現價隱含年報酬（基準情境，非預期報酬） 7.9%。各列狀態與價格分開呈現，不合成分數，狀態件數也不代表強弱（非買賣建議）。&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;details id=&quot;risks-more&quot;&gt;&lt;summary&gt;其他風險與改判條件（超過首頁上限的部分）&lt;/summary&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;risk-tbl&quot; style=&quot;min-width:0;width:100%&quot;&gt;&lt;tr&gt;&lt;th style=&quot;white-space:normal;width:64%&quot;&gt;情況（看哪個指標、門檻多少）&lt;/th&gt;&lt;th style=&quot;white-space:normal;width:22%&quot;&gt;會改變什麼判斷&lt;/th&gt;&lt;th style=&quot;white-space:normal;width:14%&quot;&gt;歷史基準比率&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;反壟斷：搜尋案限制分發並要求分享資料，雙方上訴中，影響無法量化&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;未設門檻：持續觀察&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;獲利品質：申報淨利含權益證券評價損益，本報告改用核心 EPS（每股盈餘）&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;未設門檻：持續觀察&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/details&gt;&lt;details id=&quot;glossary&quot;&gt;&lt;summary&gt;名詞小抄&lt;/summary&gt;&lt;dl class=&quot;gl&quot;&gt;&lt;dt id=&quot;g0&quot;&gt;近四季（TTM）&lt;/dt&gt;&lt;dd&gt;最近四個季度加總，比單一財年更新。&lt;/dd&gt;&lt;dt id=&quot;g1&quot;&gt;核心每股盈餘（核心 EPS）&lt;/dt&gt;&lt;dd&gt;營業利益扣稅後除以稀釋股數，排除 SpaceX 等權益證券的評價損益；本報告為 10.42 美元。&lt;/dd&gt;&lt;dt id=&quot;g2&quot;&gt;營收積壓（revenue backlog）&lt;/dt&gt;&lt;dd&gt;已簽約、還沒認列為營收的金額，不含可取消的合約。&lt;/dd&gt;&lt;dt id=&quot;g3&quot;&gt;TPU（Tensor Processing Unit）&lt;/dt&gt;&lt;dd&gt;Google 自研的 AI 運算晶片，自用、在雲端出租，2026 年起也直接把整套系統賣給企業。&lt;/dd&gt;&lt;dt id=&quot;g4&quot;&gt;流量取得成本（TAC）&lt;/dt&gt;&lt;dd&gt;Google 付給把搜尋流量導過來的夥伴（手機、瀏覽器、網站）的分成。&lt;/dd&gt;&lt;dt id=&quot;g5&quot;&gt;AI 模式（AI Mode）&lt;/dt&gt;&lt;dd&gt;Google 搜尋裡用 AI 對話方式回答問題的功能，廣告變現目前低於傳統搜尋。&lt;/dd&gt;&lt;dt id=&quot;g6&quot;&gt;投入資本報酬率（ROIC）&lt;/dt&gt;&lt;dd&gt;稅後營業利益 ÷ 營運投入資本：每投入 1 元一年賺多少。&lt;/dd&gt;&lt;dt id=&quot;g7&quot;&gt;增量 ROIC&lt;/dt&gt;&lt;dd&gt;新增的稅後營業利益 ÷ 新增的投入資本：新投資的回報。&lt;/dd&gt;&lt;dt id=&quot;g8&quot;&gt;資本支出（capex）&lt;/dt&gt;&lt;dd&gt;買伺服器、蓋資料中心等長期資產的支出。&lt;/dd&gt;&lt;dt id=&quot;g9&quot;&gt;自由現金流（FCF）&lt;/dt&gt;&lt;dd&gt;營運現金流扣掉資本支出，公司真正能自由分配的現金。&lt;/dd&gt;&lt;dt id=&quot;g10&quot;&gt;現金流折現（FCFF）&lt;/dt&gt;&lt;dd&gt;把公司未來每年可分配給股東與債權人的現金，用資金成本折回今天的估值法。&lt;/dd&gt;&lt;dt id=&quot;g11&quot;&gt;加權平均資金成本（WACC）&lt;/dt&gt;&lt;dd&gt;股東與債權人要求報酬的加權平均，本報告約 9.5%。&lt;/dd&gt;&lt;dt id=&quot;g12&quot;&gt;銷售對資本比&lt;/dt&gt;&lt;dd&gt;每多投入 1 美元資本，能多帶來多少營收；越低代表越吃資本。&lt;/dd&gt;&lt;dt id=&quot;g13&quot;&gt;終值占比&lt;/dt&gt;&lt;dd&gt;估值中來自明確預測期之後的比重，越高越依賴遠期假設。&lt;/dd&gt;&lt;dt id=&quot;g14&quot;&gt;本益比（P/E）&lt;/dt&gt;&lt;dd&gt;股價 ÷ 每股盈餘；本報告用核心 EPS 計算。&lt;/dd&gt;&lt;dt id=&quot;g15&quot;&gt;本益比對成長比（PEG）&lt;/dt&gt;&lt;dd&gt;本益比 ÷ 盈餘年成長率（百分點）；林區認為約 1 算合理，但成長率要和本益比用同一口徑。&lt;/dd&gt;&lt;dt id=&quot;g16&quot;&gt;股東收益率&lt;/dt&gt;&lt;dd&gt;股利殖利率＋回購殖利率，也就是公司每年用現金回饋股東的比率。&lt;/dd&gt;&lt;dt id=&quot;g17&quot;&gt;股債利差&lt;/dt&gt;&lt;dd&gt;盈餘殖利率（每股盈餘 ÷ 股價）減 10 年期公債殖利率；越低代表股票相對公債越貴。&lt;/dd&gt;&lt;dt id=&quot;g18&quot;&gt;強制轉換特別股&lt;/dt&gt;&lt;dd&gt;到期必須轉成普通股的特別股，等於延後的增資。&lt;/dd&gt;&lt;dt id=&quot;g19&quot;&gt;ATM 增資（at-the-market）&lt;/dt&gt;&lt;dd&gt;公司依市價分批在市場上賣新股。&lt;/dd&gt;&lt;dt id=&quot;g20&quot;&gt;三類股&lt;/dt&gt;&lt;dd&gt;A 股一股一票、B 股一股十票（創辦人持有）、C 股無表決權。&lt;/dd&gt;&lt;dt id=&quot;g21&quot;&gt;預設交易計畫（10b5-1）&lt;/dt&gt;&lt;dd&gt;內部人事先登記、依規則自動執行的買賣計畫，用來避免內線交易疑慮。&lt;/dd&gt;&lt;/dl&gt;&lt;/details&gt;&lt;details id=&quot;numbers-table&quot;&gt;&lt;summary&gt;完整數字表格：三大報表摘要（年度與 8 季，供查；圖在正文「完整數字」）&lt;/summary&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:14px&quot;&gt;損益表（年度與近四季）&lt;/p&gt;&lt;div cl &lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;div class=&quot;wrap&quot;&gt;&lt;div class=&quot;top&quot;&gt;&lt;span&gt;&lt;b&gt;Alphabet（Google 母公司）（GOOGL）&lt;/b&gt;｜商業評估&lt;/span&gt;&lt;span&gt;資料截止 2026-11-13｜基準季 2026-09-30｜&lt;a href=&quot;報告.html&quot;&gt;估值報告（另頁）&lt;/a&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;hero&quot;&gt;&lt;div&gt;&lt;div class=&quot;eyebrow&quot;&gt;商業評估｜數位平台／廣告加雲端&lt;/div&gt;&lt;h1&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;搜尋廣告仍是利潤主體但第三季增速放慢到 12%，Google 雲端（含 TPU 系統銷售）第三季年增約一倍成為第二具引擎；模式成立，卡點在 AI 搜尋變現，以及前九月營運現金流已不夠支應的資本投入能否換回成長。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src2&quot;&gt;[2]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src3&quot;&gt;[3]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src4&quot;&gt;[4]&lt;/a&gt;&lt;/sup&gt;&lt;/h1&gt;&lt;p class=&quot;lead&quot;&gt;本頁只用官方文件、財報與新聞，回答商業模式是否成立、成長點在哪、是否卡住、未來怎麼變、週期多久。&lt;b&gt;不含價格、估值或任何買賣建議&lt;/b&gt;，也不影響估值報告的研究評等。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;gradebox&quot;&gt;&lt;div class=&quot;lab&quot;&gt;商業評估等級（五級 A–E）&lt;span class=&quot;ruleok&quot;&gt;評分規則第一版，2026-11-07 使用者核定&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;g&quot;&gt;B&lt;small&gt;級&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;加權分 3.85／5｜相對同業：MSFT、META、AMZN&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;模式成立，有一兩個需要追蹤的卡點&lt;/div&gt;&lt;div class=&quot;note&quot;&gt;商業評估等級（A–E 五級）只看商業模式是否成立、成長是否卡住、週期在哪，相對同產業卡同業評比；它不是估值報告研究評等裡的「生意品質 A／B／C」（那是看護城河、投入資本報酬、現金流品質、資產負債表與治理的絕對標準），不進研究評等、不影響估值、不涉任何價格。&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;nav class=&quot;qnav&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;&lt;a href=&quot;#s0&quot;&gt;重點&lt;/a&gt;&lt;a href=&quot;#s1&quot;&gt;1 商業輪廓&lt;/a&gt;&lt;a href=&quot;#s2&quot;&gt;2 說的 vs 做的&lt;/a&gt;&lt;a href=&quot;#s3&quot;&gt;3 成長與卡點&lt;/a&gt;&lt;a href=&quot;#sa&quot;&gt;4 優勢與持續期間&lt;/a&gt;&lt;a h ar(--c6)&quot;&gt;&lt;title&gt;作者判斷 11&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;614.4&quot; y=&quot;6&quot; width=&quot;21.6&quot; height=&quot;26&quot; fill=&quot;var(--neg)&quot;&gt;&lt;title&gt;待查 4&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;4&quot; y=&quot;52&quot; class=&quot;ax&quot;&gt;合計 117&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;lg&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--biz)&quot;&gt;&lt;/i&gt;事實 78&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--accent)&quot;&gt;&lt;/i&gt;推論 24&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c6)&quot;&gt;&lt;/i&gt;作者判斷 11&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--neg)&quot;&gt;&lt;/i&gt;待查 4&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;全頁句子依標記分類：事實（原文或財報直接寫的）占 67%；推論與作者判斷是從事實推出或取捨的結論，待查是找不到證據的地方。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估.json#/標記統計&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/section&gt;&lt;section id=&quot;s1&quot;&gt;&lt;h2&gt;1　商業輪廓：賣什麼、賣給誰、怎麼收錢&lt;/h2&gt;&lt;div&gt;&lt;span class=&quot;chip&quot;&gt;廣告（點擊與曝光計費的效果型與品牌廣告）&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;雲端消費量計費&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;訂閱&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;一次性商品銷售（裝置、TPU 系統）&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;抽成（Google Play 應用內購買）&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cards c3&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;賣什麼&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;Google 服務分部含廣告、Android、Chrome、消費性裝置、地圖、Google Play、搜尋與 YouTube，收入主要來自廣告，另有消費者訂閱、應用程式與應用內購買、裝置銷售。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src5&quot;&gt;[5]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;Google 雲端分部賣基礎設施與平台服務、Workspace 協作工具與其他企業服務；產品收入主要是出售 TPU 系統（硬體、軟體、安裝與保固）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src6&quot;&gt;[6]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src7&quot;&gt;[7]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;賣給誰&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;付錢的是廣告主、企業與開發者（雲端）、消費者（訂閱與裝置）；2023–2025 年沒有任何單一客戶或關係企業群占營收 10% 以上。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src8&quot;&gt;[8]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src9&quot;&gt;[9]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;第三季依客戶地址：美國 676.81 億美元占 53%、歐洲中東非洲 26%、亞太 16%、其他美洲 5%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src10&quot;&gt;[10]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;少見的集中點：營收積壓含與關聯方 Crux AI（未合併的權益法合資）的多年合約 168 億。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src11&quot;&gt;[11]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;怎麼收錢&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;搜尋廣告看付費點擊數與每次點擊價格，聯播網廣告看曝光數與每次曝光價格；第三季付費點擊年增 8%、每次點擊價格年增 4%，聯播網曝光年減 14%、每次曝光價格年增 14%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src12&quot;&gt;[12]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src13&quot;&gt;[13]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;雲端服務在客戶實際使用時依用量認列，訂閱制在合約期間平均認列；TPU 系統硬體在交付控制權時認列，部分合約附預設價格的多年回購選擇權，按退貨權處理。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src14&quot;&gt;[14]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src7&quot;&gt;[7]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;Android 應用內付費經 Google 金流時，Match Group 揭露訂閱一般要付 Google 最高 15% 的分成。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src15&quot;&gt;[15]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;callout&quot;&gt;&lt;b&gt;解讀&lt;/b&gt;&lt;p class=&quot;s&quot;&gt;第三季總營收 1,275.77 億美元：搜尋與其他 633.50 億、YouTube 廣告 112.07 億、聯播網 74.55 億（三者合計廣告 820.12 億，約占 64%，推算）、訂閱平台與裝置 142.90 億、雲端 307.09 億（約占 24%，推算）、其他事業 3.72 億；廣告是 Google 服務的下層細項，不可與 Google 服務合計重複加總。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;第三季年增：搜尋與其他 +12.0%、YouTube 廣告 +9.2%、聯播網 +1.4%、訂閱平台與裝置 +11.0%、雲端 +102.6%（推算）；總營收多出約 252 億中雲端占約 156 億，成長重心已由廣告移到雲端。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src16&quot;&gt;[16]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;分部營業利益第三季：Google 服務 391.57 億、雲端 111.21 億、其他事業 −20.47 億、集團層級 −76.55 億；利潤主體仍是服務分部。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src2&quot;&gt;[2]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;費用率：本期對去年同期（2026-09-30 (Q3)）&lt;/figcaption&gt;&lt;svg viewBox=&quot;0 0 640 186&quot; role=&quot;img&quot; aria-label=&quot;費用率本期與去年同期&quot;&gt;&lt;line x1=&quot;110.0&quot; x2=&quot;110.0&quot; y1=&quot;16&quot; y2=&quot;162&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;110.0&quot; y=&quot;178&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;0%&lt;/text&gt;&lt;line x1=&quot;212.5&quot; x2=&quot;212.5&quot; y1=&quot;16&quot; y2=&quot;162&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;212.5&quot; y=&quot;178&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;20%&lt;/text&gt;&lt;line x1=&quot;315.0&quot; x2=&quot;315.0&quot; y1=&quot;16&quot; y2=&quot;162&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;315.0&quot; y=&quot;178&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;40%&lt;/text&gt;&lt;line x1=&quot;417.5&quot; x2=&quot;417.5&quot; y1=&quot;16&quot; y2=&quot;162&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;417.5&quot; y=&quot;178&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;60%&lt;/text&gt;&lt;line x1=&quot;520.0&quot; x2=&quot;520.0&quot; y1=&quot;16&quot; y2=&quot;162&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;520.0&quot; y=&quot;178&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;80%&lt;/text&gt;&lt;text x=&quot;102&quot; y=&quot;40.0&quot; class=&quot;lb s&quot; text-anchor=&quot;end&quot;&gt;毛利率&lt;/text&gt;&lt;line x1=&quot;415.3&quot; x2=&quot;416.0&quot; y1=&quot;35.0&quot; y2=&quot;35.0&quot; stroke=&quot;var(--biz)&quot; stroke-width=&quot;3&quot; opacity=&quot;.5&quot;/&gt;&lt;circle cx=&quot;415.3&quot; cy=&quot;35.0&quot; r=&quot;5&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;去年同期 59.6%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;416.0&quot; cy=&quot;35.0&quot; r=&quot;5.5&quot; fill=&quot;var(--biz)&quot;&gt;&lt;title&gt;本期 59.7%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;426.0&quot; y=&quot;40.0&quot; class=&quot;vl s&quot;&gt;59.7%&lt;tspan class=&quot;ax&quot;&gt; +0.1 點&lt;/tspan&gt;&lt;/text&gt;&lt;text x=&quot;102&quot; y=&quot;74.0&quot; class=&quot;lb s&quot; text-anchor=&quot;end&quot;&gt;業務費用率&lt;/text&gt;&lt;line x1=&quot;146.1&quot; x2=&quot;145.4&quot; y1=&quot;69.0&quot; y2=&quot;69.0&quot; stroke=&quot;var(--biz)&quot; stroke-width=&quot;3&quot; opacity=&quot;.5&quot;/&gt;&lt;circle cx=&quot;146.1&quot; cy=&quot;69.0&quot; r=&quot;5&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;去年同期 7.0%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;145.4&quot; cy=&quot;69.0&quot; r=&quot;5.5&quot; fill=&quot;var(--biz)&quot;&gt;&lt;title&gt;本期 6.9%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;156.1&quot; y=&quot;74.0&quot; class=&quot;vl s&quot;&gt;6.9%&lt;tspan class=&quot;ax&quot;&gt; -0.1 點&lt;/tspan&gt;&lt;/text&gt;&lt;text x=&quot;102&quot; y=&quot;108.0&quot; class=&quot;lb s&quot; text-anchor=&quot;end&quot;&gt;銷管費用率&lt;/text&gt;&lt;line x1=&quot;183.1&quot; x2=&quot;170.0&quot; y1=&quot;103.0&quot; y2=&quot;103.0&quot; stroke=&quot;var(--biz)&quot; stroke-width=&quot;3&quot; opacity=&quot;.5&quot;/&gt;&lt;circle cx=&quot;183.1&quot; cy=&quot;103.0&quot; r=&quot;5&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;去年同期 14.3%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;170.0&quot; cy=&quot;103.0&quot; r=&quot;5.5&quot; fill=&quot;var(--biz)&quot;&gt;&lt;title&gt;本期 11.7%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;193.1&quot; y=&quot;108.0&quot; class=&quot;vl s&quot;&gt;11.7%&lt;tspan class=&quot;ax&quot;&gt; -2.6 點&lt;/tspan&gt;&lt;/text&gt;&lt;text x=&quot;102&quot; y=&quot;142.0&quot; class=&quot;lb s&quot; text-anchor=&quot;end&quot;&gt;研發率&lt;/text&gt;&lt;line x1=&quot;185.8&quot; x2=&quot;192.9&quot; y1=&quot;137.0&quot; y2=&quot;137.0&quot; stroke=&quot;var(--neg)&quot; stroke-width=&quot;3&quot; opacity=&quot;.5&quot;/&gt;&lt;circle cx=&quot;185.8&quot; cy=&quot;137.0&quot; r=&quot;5&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;去年同期 14.8%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;192.9&quot; cy=&quot;137.0&quot; r=&quot;5.5&quot; fill=&quot;var(--neg)&quot;&gt;&lt;title&gt;本期 16.2%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;202.9&quot; y=&quot;142.0&quot; class=&quot;vl s&quot;&gt;16.2%&lt;tspan class=&quot;ax&quot;&gt; +1.4 點&lt;/tspan&gt;&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;lg&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--biz)&quot;&gt;&lt;/i&gt;本期&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--muted)&quot;&gt;&lt;/i&gt;去年同期&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--neg)&quot;&gt;&lt;/i&gt;變差超過 1 點&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;空心點是去年同期、實心點是本期，右側是變化（百分點）；費用率升或毛利率降超過 1 點標紅。分母是含全部收入的營收。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估底稿.json#/費用率（財報/10-Q_2026-09-30_損益表.json）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/section&gt;&lt;section id=&quot;s2&quot;&gt;&lt;h2&gt;2　商業模式驗證：說的 vs 做的&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;管理層在 10-K、10-Q、8-K 的說法，對照財報數字。判定：已驗證／部分支持／說法未獲數字支持／待查。&lt;/p&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;說的 vs 做的：判定分布&lt;/figcaption&gt;&lt;svg viewBox=&quot;0 0 640 58&quot; role=&quot;img&quot; aria-label=&quot;說的vs做的判定&quot;&gt;&lt;rect x=&quot;4.0&quot; y=&quot;6&quot; width=&quot;158.0&quot; height=&quot;26&quot; fill=&quot;var(--pos)&quot;&gt;&lt;title&gt;已驗證 1&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;83.0&quot; y=&quot;24&quot; class=&quot;inb&quot; text-anchor=&quot;middle&quot;&gt;已驗證 1&lt;/text&gt;&lt;rect x=&quot;162.0&quot; y=&quot;6&quot; width=&quot;474.0&quot; height=&quot;26&quot; fill=&quot;var(--warn)&quot;&gt;&lt;title&gt;部分支持 3&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;399.0&quot; y=&quot;24&quot; class=&quot;inb&quot; text-anchor=&quot;middle&quot;&gt;部分支持 3&lt;/text&gt;&lt;text x=&quot;4&quot; y=&quot;52&quot; class=&quot;ax&quot;&gt;合計 4&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;lg&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--pos)&quot;&gt;&lt;/i&gt;已驗證 1&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--warn)&quot;&gt;&lt;/i&gt;部分支持 3&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;管理層 4 條說法對照財報數字的結果；3 條不是「已驗證」，下方用色框標出（有問題的證據）。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估.json#/內容/說的vs做的/判定&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;div class=&quot;callout warnc&quot;&gt;&lt;b&gt;有問題的證據（判定不是「已驗證」）&lt;/b&gt;&lt;ul class=&quot;badl&quot;&gt;&lt;li&gt;&lt;a href=&quot;#cl2&quot;&gt;搜尋動能&lt;/a&gt; &lt;span class=&quot;v v-部分支持&quot;&gt;部分支持&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a href=&quot;#cl3&quot;&gt;營收積壓（口徑擴大）&lt;/a&gt; &lt;span class=&quot;v v-部分支持&quot;&gt;部分支持&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a href=&quot;#cl4&quot;&gt;資本支出計畫&lt;/a&gt; &lt;span class=&quot;v v-部分支持&quot;&gt;部分支持&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;div class=&quot;cards&quot;&gt;&lt;div class=&quot;card claim cv-已驗證&quot; id=&quot;cl1&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;雲端加速&lt;/b&gt;&lt;span class=&quot;v v-已驗證&quot;&gt;已驗證&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;管理層說法&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;執行長在第三季法說會說：Google Cloud revenues grew 103%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src17&quot;&gt;[17]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對照數字&lt;/div&gt;&lt;ul class=&quot;ev&quot;&gt;&lt;li class=&quot;s&quot;&gt;10-Q 雲端第三季營收 307.09 億，去年同期 151.57 億，年增 102.6%（推算）；增加的 156 億主要來自 GCP 基礎設施與平台服務，以及 TPU 系統銷售。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src16&quot;&gt;[16]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;li class=&quot;s&quot;&gt;雲端分部營業利益由 35.94 億增到 111.21 億，利益率由約 23.7% 升到約 36.2%（推算）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src2&quot;&gt;[2]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;lbl&quot;&gt;說明&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;營收數字與申報一致；但其中含一次認列的 TPU 系統硬體銷售，10-Q 沒有單獨揭露金額，所以服務型雲端的內生增速無法從申報拆出。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src16&quot;&gt;[16]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src7&quot;&gt;[7]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card claim cv-部分支持&quot; id=&quot;cl2&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;搜尋動能&lt;/b&gt;&lt;span class=&quot;v v-部分支持&quot;&gt;部分支持&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;管理層說法&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;執行長說 Search has strong momentum，查詢量年增率是五年來最高。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src17&quot;&gt;[17]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對照數字&lt;/div&gt;&lt;ul class=&quot;ev&quot;&gt;&lt;li class=&quot;s&quot;&gt;搜尋與其他營收第三季 633.50 億、年增 12.0%（推算），第二季 632.71 億、年增 16.8%（推算）；付費點擊第三季年增 8%、前九月 11%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src18&quot;&gt;[18]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src13&quot;&gt;[13]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;li class=&quot;s&quot;&gt;業務長在同一場法說會說 AI Mode 查詢成長強，但 AI Mode 的變現較低，對本季有影響。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src19&quot;&gt;[19]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;lbl&quot;&gt;說明&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;查詢量申報沒有揭露、無法核對；可核對的搜尋營收增速由第二季約 17% 降到第三季 12%，付費點擊也比前九月平均放慢，代表查詢增加沒有同比例轉成營收。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src18&quot;&gt;[18]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src13&quot;&gt;[13]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src19&quot;&gt;[19]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card claim cv-部分支持&quot; id=&quot;cl3&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;營收積壓（口徑擴大）&lt;/b&gt;&lt;span class=&quot;v v-部分支持&quot;&gt;部分支持&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;管理層說法&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;財務長第二季法說會說，雲端積壓季增逾 500 億、達 5,140 億，大部分是一般 GCP 合約，預計總積壓略多於 50% 在 24 個月內認列。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src20&quot;&gt;[20]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src21&quot;&gt;[21]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對照數字&lt;/div&gt;&lt;ul class=&quot;ev&quot;&gt;&lt;li class=&quot;s&quot;&gt;10-Q：2026-09-30 營收積壓 5,677 億，其中雲端 5,608 億，預計略多於 55% 在 24 個月內認列；2026 年第一季起改把原始合約期一年以內的合約也算進積壓；其中 168 億來自關聯方 Crux AI。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src11&quot;&gt;[11]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;li class=&quot;s&quot;&gt;2025-12-31 舊口徑營收積壓為 2,428 億。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src22&quot;&gt;[22]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;lbl&quot;&gt;說明&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;積壓確實大增，但同時有口徑擴大與關聯方合約兩個因素，與舊口徑的年增比較（底稿 RPO 年增約 260%）不是同口徑，不能全部當成需求增加。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src11&quot;&gt;[11]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src23&quot;&gt;[23]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card claim cv-部分支持&quot; id=&quot;cl4&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;資本支出計畫&lt;/b&gt;&lt;span class=&quot;v v-部分支持&quot;&gt;部分支持&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;管理層說法&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;報導：Alphabet 第二季把 2026 年資本支出指引上調到 1,950–2,050 億，第三季維持；財務長說 We continue to expect our capex to increase significantly in 2027。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src24&quot;&gt;[24]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對照數字&lt;/div&gt;&lt;ul class=&quot;ev&quot;&gt;&lt;li class=&quot;s&quot;&gt;10-Q：前九月資本支出 1,320 億（去年同期 636 億）；前九月折舊 220 億（去年同期 151 億）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src4&quot;&gt;[4]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;li class=&quot;s&quot;&gt;前九月營運現金流 1,271.49 億，低於同期資本支出 1,320 億（推算差約 49 億）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src3&quot;&gt;[3]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src4&quot;&gt;[4]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;lbl&quot;&gt;說明&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;要達全年 1,950–2,050 億，第四季需約 630–730 億（推算），高於報導的第三季 513.6 億，指引能否兌現要等 10-K 核對；支出確實大增，但已超過本業現金流能支應的程度。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src4&quot;&gt;[4]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src25&quot;&gt;[25]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src24&quot;&gt;[24]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src3&quot;&gt;[3]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;s3&quot;&gt;&lt;h2&gt;3　成長引擎與卡點&lt;/h2&gt;&lt;h3&gt;成長從哪裡來（量、價、新產品、新市場、併購）&lt;/h3&gt;&lt;div class=&quot;cards&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;span class=&quot;chip&quot;&gt;新產品&lt;/span&gt;&lt;span class=&quot;qz&quot;&gt;能否量化：可量化&lt;/span&gt;&lt;/div&gt;&lt;b&gt;Google 雲端 AI 基礎設施與 TPU 系統對外銷售&lt;/b&gt;&lt;div class=&quot;lbl&quot;&gt;證據&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;雲端第三季營收年增 102.6%（推算），增量來自 GCP 基礎設施與平台服務與 TPU 系統銷售；TPU 系統在第二季首次交付到客戶資料中心。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src16&quot;&gt;[16]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src20&quot;&gt;[20]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;報導：Oracle 將對外提供 Google 的 TPU，Google 由自用晶片改走夥伴通路擴大客群。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src26&quot;&gt;[26]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;span class=&quot;chip&quot;&gt;量&lt;/span&gt;&lt;span class=&quot;qz&quot;&gt;能否量化：可量化&lt;/span&gt;&lt;/div&gt;&lt;b&gt;搜尋付費點擊量&lt;/b&gt;&lt;div class=&quot;lbl&quot;&gt;證據&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;付費點擊第三季年增 8%、前九月 11%，是搜尋營收成長的主要來源。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src13&quot;&gt;[13]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;span class=&quot;chip&quot;&gt;價&lt;/span&gt;&lt;span class=&quot;qz&quot;&gt;能否量化：可量化&lt;/span&gt;&lt;/div&gt;&lt;b&gt;每次點擊與每次曝光價格&lt;/b&gt;&lt;div class=&quot;lbl&quot;&gt;證據&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;每次點擊價格第三季年增 4%；聯播網每次曝光價格年增 14%，抵銷曝光年減 14%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src13&quot;&gt;[13]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;AI Mode 廣告正擴大到更多市場，但目前變現低於傳統搜尋，價的貢獻短期可能被組合變化稀釋。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src19&quot;&gt;[19]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src27&quot;&gt;[27]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;span class=&quot;chip&quot;&gt;新產品&lt;/span&gt;&lt;span class=&quot;qz&quot;&gt;能否量化：可量化&lt;/span&gt;&lt;/div&gt;&lt;b&gt;訂閱、平台與裝置&lt;/b&gt;&lt;div class=&quot;lbl&quot;&gt;證據&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;訂閱平台與裝置第三季 142.90 億，年增 11.0%（推算）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;近 12 季：營收年增與營業利益率&lt;/figcaption&gt;&lt;svg viewBox=&quot;0 0 680 250&quot; role=&quot;img&quot; aria-label=&quot;近幾季單季營收年增與營業利益率&quot;&gt;&lt;line x1=&quot;50&quot; x2=&quot;640&quot; y1=&quot;216.0&quot; y2=&quot;216.0&quot; class=&quot;zl&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;220.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;0%&lt;/text&gt;&lt;line x1=&quot;50&quot; x2=&quot;640&quot; y1=&quot;167.0&quot; y2=&quot;167.0&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;171.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;10%&lt;/text&gt;&lt;line x1=&quot;50&quot; x2=&quot;640&quot; y1=&quot;118.0&quot; y2=&quot;118.0&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;122.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;20%&lt;/text&gt;&lt;line x1=&quot;50&quot; x2=&quot;640&quot; y1=&quot;69.0&quot; y2=&quot;69.0&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;73.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;30%&lt;/text&gt;&lt;line x1=&quot;50&quot; x2=&quot;640&quot; y1=&quot;20.0&quot; y2=&quot;20.0&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;24.0&quot; class=&quot;ax&quot; ;&lt;text x=&quot;263.1&quot; y=&quot;252.0&quot; class=&quot;vl s&quot; text-anchor=&quot;start&quot; fill=&quot;var(--pos)&quot;&gt;-0.1 點&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;lg&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--neg)&quot;&gt;&lt;/i&gt;亮燈&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--pos)&quot;&gt;&lt;/i&gt;未亮&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--neg)&quot;&gt;&lt;/i&gt;亮燈門檻（虛線）&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;G4 另有條件「營收近四季年增低於一年前」：本期 22.2%、比較期 13.4%，兩個條件都成立才亮燈（目前未亮）。&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;A4 另有條件「單季營收年增低於去年同期」：本期 24.6%、比較期 16.0%，兩個條件都成立才亮燈（目前未亮）。&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;每列一個用財報數字算的訊號：點是目前值，虛線是門檻，點落進淡紅色帶就亮燈；看離門檻還有多少餘裕。是非題型訊號（如連續放緩）不在此圖，見上方燈號。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估.json#/內容/卡住訊號（值、門檻、比較）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;div class=&quot;sub-h&quot;&gt;機械訊號（財報數字算得出）&lt;/div&gt;&lt;div class=&quot;cards&quot;&gt;&lt;div class=&quot;card sig&quot; id=&quot;sig-G1&quot; style=&quot;--tc:var(--lt-未亮, var(--muted))&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;G1　營收增速連續放緩&lt;/b&gt;&lt;span class=&quot;light l-未亮&quot;&gt;未亮&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;成長是不是一季比一季慢？&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;值&lt;/div&gt;&lt;div class=&quot;sv&quot;&gt;否&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;機械值，期末 2026-09-30；門檻  &lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;判讀&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;近四季單季營收年增 18.0%、21.8%、24.2%、24.7% 逐季加速，未出現連續放緩。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src28&quot;&gt;[28]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card sig&quot; id=&quot;sig-G2&quot; style=&quot;--tc:var(--lt-未亮, var(--muted))&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;G2　營業利益率走弱&lt;/b&gt;&lt;span class=&quot;light l-未亮&quot;&gt;未亮&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;規模變大，利潤率有沒有跟著變好？&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;值&lt;/div&gt;&lt;div class=&quot;sv&quot;&gt;+1.1 個百分點&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;機械值，期末 2026-09-30；門檻 &amp;lt; -1.0 個百分點&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;判讀&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;近四季營業利益率 33.3%，比一年前高 1.1 個百分點，未亮燈；但單季利益率由第一季 36.1% 降到第三季 31.8%，同期前九月折舊年增約 46%（推算），折舊壓力已開始反映在單季。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src29&quot;&gt;[29]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src30&quot;&gt;[30]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src4&quot;&gt;[4]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card sig&quot; id=&quot;sig-G3&quot; style=&quot;--tc:var(--lt-未亮, var(--muted))&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;G3　收款變慢&lt;/b&gt;&lt;span class=&quot;light l-未亮&quot;&gt;未亮&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;營收成長是不是靠放寬收款條件？&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;值&lt;/div&gt;&lt;div class=&quot;sv&quot;&gt;+5.1 個百分點&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;機械值，期末 2026-09-30；門檻 &amp;gt; +10.0 個百分點&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;判讀&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;應收增速只比近四季營收增速高 5.1 個百分點，低於 10 個百分點的門檻。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src31&quot;&gt;[31]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card sig&quot; id=&quot;sig-G4&quot; style=&quot;--tc:var(--lt-未亮, var(--muted))&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;G4　投入換不到成長&lt;/b&gt;&lt;span class=&quot;light l-未亮&quot;&gt;未亮&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;資本支出加大，營收增速有沒有跟上？&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;值&lt;/div&gt;&lt;div class=&quot;sv&quot;&gt;+13.7 個百分點&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;機械值，期末 2026-09-30；門檻 &amp;gt; +1.0 個百分點；且 營收近四季年增低於一年前&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;判讀&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;資本支出強度近四季 33.9%，一年內升 13.7 個百分點，但營收近四季年增也由 13.4% 升到 22.2%，所以「且」條件未成立；投入是否持續換到成長要看 2027 年。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src32&quot;&gt;[32]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src33&quot;&gt;[33]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src34&quot;&gt;[34]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card sig&quot; id=&quot;sig-A3&quot; style=&quot;--tc:var(--lt-未亮, var(--muted))&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;A3　雲端積壓訂單跟不上&lt;/b&gt;&lt;span class=&quot;light l-未亮&quot;&gt;未亮&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;未來要認列的合約有沒有比營收長得慢？&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;值&lt;/div&gt;&lt;div class=&quot;sv&quot;&gt;+237.8 個百分點&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;機械值，期末 2026-09-30；門檻 &amp;lt; +0.0 個百分點&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;判讀&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;RPO 增速比營收增速高約 238 個百分點，但 2026 年第一季起口徑擴大（納入一年以內合約）並含關聯方 Crux AI 168 億，同口徑增速會低很多；即使如此，雲端積壓季增約 469 億（5,139 億 → 5,608 億，推算），仍高於雲端單季營收 307 億，未亮燈結論不變。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src35&quot;&gt;[35]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src11&quot;&gt;[11]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src36&quot;&gt;[36]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card sig&quot; id=&quot;sig-A4&quot; style=&quot;--tc:var(--lt-未亮, var(--muted))&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;A4　研發加重而成長沒跟上&lt;/b&gt;&lt;span class=&quot;light l-未亮&quot;&gt;未亮&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;研發投入是否換到成長？&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;值&lt;/div&gt;&lt;div class=&quot;sv&quot;&gt;+1.4 個百分點&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;機械值，期末 2026-09-30；門檻 &amp;gt; +1.0 個百分點；且 單季營收年增低於去年同期&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;判讀&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;研發率升 1.4 個百分點（14.8% → 16.2%），但第三季單季營收年增 24.7% 高於去年同期 16.0%，「且」條件未成立。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src37&quot;&gt;[37]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src38&quot;&gt;[38]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card sig&quot; id=&quot;sig-A5&quot; style=&quot;--tc:var(--lt-未亮, var(--muted))&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;A5　業務費用效率變差&lt;/b&gt;&lt;span class=&quot;light l-未亮&quot;&gt;未亮&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;買成長的成本有沒有變貴？&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;值&lt;/div&gt;&lt;div class=&quot;sv&quot;&gt;-0.1 個百分點&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;機械值，期末 2026-09-30；門檻 &amp;gt; +1.0 個百分點&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;判讀&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;業務行銷費用率 6.9%，比去年同期低 0.1 個百分點。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src39&quot;&gt;[39]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub-h&quot;&gt;作者訊號（財報數字看不出，作者讀原文判斷）&lt;/div&gt;&lt;div class=&quot;cards&quot;&gt;&lt;div class=&quot;card sig&quot; id=&quot;sig-A1&quot; style=&quot;--tc:var(--lt-未亮, var(--muted))&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;A1　流量取得成本占比上升&lt;/b&gt;&lt;span class=&quot;light l-未亮&quot;&gt;未亮&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;為了拿到流量付出去的比例是不是變高？&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;值&lt;/div&gt;&lt;div class=&quot;sv&quot;&gt;TAC 率 20.1% → 20.0%（第三季，年變化 −0.1 個百分點）&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;作者從原文填&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;判讀&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;第三季 TAC 率由 20.1% 降到 20.0%、前九月由 20.4% 降到 19.8%，主因營收組合由聯播網移向搜尋；搜尋的 TAC 率大致持平，聯播網的 TAC 率上升。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src40&quot;&gt;[40]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card sig&quot; id=&quot;sig-A2&quot; style=&quot;--tc:var(--lt-未亮, var(--muted))&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;A2　付費點擊或曝光量轉弱&lt;/b&gt;&lt;span class=&quot;light l-未亮&quot;&gt;未亮&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;廣告量還在成長嗎？&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;值&lt;/div&gt;&lt;div class=&quot;sv&quot;&gt;付費點擊 +8%、聯播網曝光 −14%（第三季年增）&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;作者從原文填&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;判讀&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;搜尋付費點擊第三季仍年增 8%（前九月 11%），聯播網曝光年減 14%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src13&quot;&gt;[13]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;占廣告大宗的搜尋點擊仍在成長，判未亮燈；聯播網曝光萎縮，但聯播網只占第三季營收約 6%，且每次曝光價格同幅上升，不改變本訊號的判定，另列觀察。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src13&quot;&gt;[13]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;h3 id=&quot;ext&quot;&gt;外部驗證：競爭者、客戶、供應商怎麼描述這家公司&lt;/h3&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;外部驗證：誰支持、誰反駁&lt;/figcaption&gt;&lt;div class=&quot;emx&quot; style=&quot;grid-template-columns:repeat(3,1fr)&quot;&gt;&lt;div class=&quot;emc&quot; style=&quot;--tc:var(--pos)&quot;&gt;&lt;div class=&quot;emh&quot;&gt;支持 &lt;b&gt;4&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;emi&quot;&gt;&lt;b&gt;Yelp&lt;/b&gt;&lt;span&gt;客戶&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;emi&quot;&gt;&lt;b&gt;Thryv&lt;/b&gt;&lt;span&gt;客戶&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;emi&quot;&gt;&lt;b&gt;Broadcom&lt;/b&gt;&lt;span&gt;供應商&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;emi&quot;&gt;&lt;b&gt;CME Group&lt;/b&gt;&lt;span&gt;客戶&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;emc&quot; style=&quot;--tc:var(--warn)&quot;&gt;&lt;div class=&quot;emh&quot;&gt;部分支持 &lt;b&gt;0&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;emc&quot; style=&quot;--tc:var(--neg)&quot;&gt;&lt;div class=&quot;emh&quot;&gt;反駁 &lt;b&gt;1&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;emi&quot;&gt;&lt;b&gt;Bing、ChatGPT（第三方統計）&lt;/b&gt;&lt;span&gt;競爭者&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;5 個外部來源（競爭者、客戶、供應商、夥伴的申報或報導）怎麼描述本公司：支持 4、部分支持 0、反駁 1。依「對本公司說法」欄的開頭分類。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估.json#/內容/外部驗證（對方、關係、支持）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;div class=&quot;cards&quot;&gt;&lt;div class=&quot;card ext&quot; style=&quot;--tc:var(--pos)&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;Yelp&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;客戶&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;對方文件怎麼說&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;Yelp 10-K 說高度依賴以 Google 為主的搜尋引擎帶流量，並指出 Google 在自然搜尋結果上方放 AI 生成回答，降低其平台連結的顯眼程度（原文：may be having a negative impact on our traffic）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src41&quot;&gt;[41]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src42&quot;&gt;[42]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對本公司說法&lt;/div&gt;&lt;div class=&quot;stc&quot;&gt;支持&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card ext&quot; style=&quot;--tc:var(--pos)&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;Thryv&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;客戶&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;對方文件怎麼說&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;Thryv 10-K 說 Google in particular is the most significant source of traffic，指其黃頁網站與客戶網站的最大流量來源是 Google。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src43&quot;&gt;[43]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對本公司說法&lt;/div&gt;&lt;div class=&quot;stc&quot;&gt;支持&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card ext&quot; style=&quot;--tc:var(--pos)&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;Broadcom&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;供應商&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;對方文件怎麼說&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;Broadcom 8-K 揭露與 Google 簽長期協議，開發並供應後續世代的客製 TPU；另有供應保證協議，供應 AI 機櫃用的網路與其他元件，期間至多到 2031 年。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src44&quot;&gt;[44]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對本公司說法&lt;/div&gt;&lt;div class=&quot;stc&quot;&gt;支持&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card ext&quot; style=&quot;--tc:var(--pos)&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;CME Group&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;客戶&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;對方文件怎麼說&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;CME Group 10-K 揭露 2021 年與 Google Cloud 簽十年策略合作，2025 年已把清算與市場資料等核心非低延遲應用搬上 Google Cloud。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src45&quot;&gt;[45]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src46&quot;&gt;[46]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對本公司說法&lt;/div&gt;&lt;div class=&quot;stc&quot;&gt;支持&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card ext&quot; style=&quot;--tc:var(--neg)&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;Bing、ChatGPT（第三方統計）&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;競爭者&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;對方文件怎麼說&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;報導引 Statcounter：9 月 Google 全球搜尋占有率 89.9%，年減 0.44 個百分點，Bing 5.3% 年增 1.19 個百分點；另引 Sensor Tower 數據，ChatGPT 行動日活躍用戶年增 69%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src47&quot;&gt;[47]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src48&quot;&gt;[48]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對本公司說法&lt;/div&gt;&lt;div class=&quot;stc&quot;&gt;反駁&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;sa&quot;&gt;&lt;h2&gt;4　優勢來源與持續期間&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;每種優勢都要同時有「好處」與「屏障」證據（Helmer《7 Powers》的檢驗）：只有好處、沒有屏障的優勢只算&lt;b&gt;暫時領先&lt;/b&gt;。再分兩維：超額報酬有多大、能撐多久（Mauboussin《Measuring the Moat》的問法）；Morningstar 五種來源只當分類參考。本節只談商業面的屏障，不含價格或估值，也不是估值報告的護城河評分，不進商業評估等級。&lt;/p&gt;&lt;div class=&quot;callout&quot;&gt;&lt;b&gt;總結&lt;/b&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;搜尋入口的屏障是預設分發合約與搜尋資料規模，超額報酬大，但最終判決正限制與要求分享這兩項，持續期間寫不足 5 年、以上訴結果檢驗；雲端的轉換成本有客戶申報與不可取消合約支撐，取 5–10 年，但只保護既有負載；TPU 只有開發年資與世代數、沒有對手拿不走的事實，屬暫時領先，寫不足 5 年。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src49&quot;&gt;[49]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src50&quot;&gt;[50]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src51&quot;&gt;[51]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src11&quot;&gt;[11]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src26&quot;&gt;[26]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;優勢地圖：多大、多久&lt;/figcaption&gt;&lt;div class=&quot;amx&quot;&gt;&lt;div class=&quot;amy&quot;&gt;持續期間 →&lt;/div&gt;&lt;div class=&quot;amg&quot;&gt;&lt;div class=&quot;amr&quot; style=&quot;grid-template-columns:80px repeat(4,1fr)&quot;&gt;&lt;div class=&quot;aml&quot;&gt;10年以上&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amc unk&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;amr&quot; style=&quot;grid-template-columns:80px repeat(4,1fr)&quot;&gt;&lt;div class=&quot;aml&quot;&gt;5–10年&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;span class=&quot;ab ab-有屏障證據&quot; title=&quot;Google 雲端的客戶轉換成本：有屏障證據&quot;&gt;2&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amc unk&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;amr&quot; style=&quot;grid-template-columns:80px repeat(4,1fr)&quot;&gt;&lt;div class=&quot;aml&quot;&gt;不足5年&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;span class=&quot;ab ab-有屏障證據&quot; title=&quot;搜尋入口：使用者、廣告主與網站流量的雙邊規模：有屏障證據&quot;&gt;1&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;amc unk&quot;&gt;&lt;span class=&quot;ab ab-暫時領先&quot; title=&quot;自研 TPU 與 AI 基礎設施：暫時領先&quot;&gt;3&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;amr&quot; style=&quot;grid-template-columns:80px repeat(4,1fr)&quot;&gt;&lt;div class=&quot;aml&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amx-l&quot;&gt;小&lt;/div&gt;&lt;div class=&quot;amx-l&quot;&gt;中&lt;/div&gt;&lt;div class=&quot;amx-l&quot;&gt;大&lt;/div&gt;&lt;div class=&quot;amx-l&quot;&gt;不明&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;amxt&quot;&gt;超額報酬大小 →&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;ol class=&quot;akey&quot;&gt;&lt;li&gt;&lt;span class=&quot;ab ab-有屏障證據&quot;&gt;1&lt;/span&gt;搜尋入口：使用者、廣告主與網站流量的雙邊規模（網路經濟；有屏障證據）&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;ab ab-有屏障證據&quot;&gt;2&lt;/span&gt;Google 雲端的客戶轉換成本（轉換成本；有屏障證據）&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;ab ab-暫時領先&quot;&gt;3&lt;/span&gt;自研 TPU 與 AI 基礎設施（流程能力；暫時領先）&lt;/li&gt;&lt;/ol&gt;&lt;div class=&quot;lg&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--pos)&quot;&gt;&lt;/i&gt;有屏障證據&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--warn)&quot;&gt;&lt;/i&gt;暫時領先&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;每個圓圈是一項優勢：越往右超額報酬越大、越往上能撐越久。綠＝屏障有事實證據；橘＝只有好處或屏障只有推論（暫時領先，持續期間最多不足 5 年）。作者寫「不明」的維度放在虛線格，不補值。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估.json#/內容/優勢來源/優勢（超額報酬大小、持續期間、判定）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;每項優勢有多少證據&lt;/figcaption&gt;&lt;svg viewBox=&quot;0 0 680 174&quot; role=&quot;img&quot; aria-label=&quot;優勢的證據數：好處與屏障&quot;&gt;&lt;text x=&quot;254&quot; y=&quot;170&quot; class=&quot;ax&quot;&gt;好處句數&lt;/text&gt;&lt;text x=&quot;459.0&quot; y=&quot;170&quot; class=&quot;ax&quot;&gt;屏障句數（事實／推論）&lt;/text&gt;&lt;text x=&quot;242&quot; y=&quot;32&quot; class=&quot;lb s&quot; text-anchor=&quot;end&quot;&gt;1 搜尋入口：使用者、廣告主與網站流…&lt;title&gt;1 搜尋入口：使用者、廣告主與網站流量的雙邊規模&lt;/title&gt;&lt;/text&gt;&lt;rect x=&quot;250&quot; y=&quot;20&quot; width=&quot;123.8&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;378.8&quot; y=&quot;33&quot; class=&quot;vl s&quot;&gt;3&lt;/text&gt;&lt;rect x=&quot;455.0&quot; y=&quot;20&quot; width=&quot;82.5&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;var(--pos)&quot;/&gt;&lt;rect x=&quot;537.5&quot; y=&quot;20&quot; width=&quot;41.2&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;var(--accent)&quot; opacity=&quot;.7&quot;/&gt;&lt;text x=&quot;583.8&quot; y=&quot;33&quot; class=&quot;vl s&quot;&gt;2／1&lt;/text&gt;&lt;text x=&quot;242&quot; y=&quot;78&quot; class=&quot;lb s&quot; text-anchor=&quot;end&quot;&gt;2 Google 雲端的客戶轉換成本&lt;title&gt;2 Google 雲端的客戶轉換成本&lt;/title&gt;&lt;/text&gt;&lt;rect x=&quot;250&quot; y=&quot;66&quot; width=&quot;82.5&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;337.5&quot; y=&quot;79&quot; class=&quot;vl s&quot;&gt;2&lt;/text&gt;&lt;rect x=&quot;455.0&quot; y=&quot;66&quot; width=&quot;123.8&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;var(--pos)&quot;/&gt;&lt;rect x=&quot;578.8&quot; y=&quot;66&quot; width=&quot;41.2&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;var(--accent)&quot; opacity=&quot;.7&quot;/&gt;&lt;text x=&quot;625.0&quot; y=&quot;79&quot; class=&quot;vl s&quot;&gt;3／1&lt;/text&gt;&lt;text x=&quot;242&quot; y=&quot;124&quot; class=&quot;lb s&quot; text-anchor=&quot;end&quot;&gt;3 自研 TPU 與 AI 基礎設施&lt;title&gt;3 自研 TPU 與 AI 基礎設施&lt;/title&gt;&lt;/text&gt;&lt;rect x=&quot;250&quot; y=&quot;112&quot; width=&quot;82.5&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;337.5&quot; y=&quot;125&quot; class=&quot;vl s&quot;&gt;2&lt;/text&gt;&lt;rect x=&quot;455.0&quot; y=&quot;112&quot; width=&quot;0.0&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;var(--pos)&quot;/&gt;&lt;rect x=&quot;455.0&quot; y=&quot;112&quot; width=&quot;41.2&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;var(--accent)&quot; opacity=&quot;.7&quot;/&gt;&lt;text x=&quot;501.2&quot; y=&quot;125&quot; class=&quot;vl s&quot;&gt;0／1&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;lg&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c3)&quot;&gt;&lt;/i&gt;好處&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--pos)&quot;&gt;&lt;/i&gt;屏障：事實&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--accent)&quot;&gt;&lt;/i&gt;屏障：推論&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;左邊是「它帶來什麼」的句數，右邊是「為什麼對手拿不走」的句數；屏障至少一句是事實（綠）才算有屏障證據。句數多不等於優勢強，只表示證據量。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估.json#/內容/優勢來源/優勢（好處、屏障的標記）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;div class=&quot;card advc&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;&lt;span class=&quot;num-b 有屏障證據&quot;&gt;1&lt;/span&gt;搜尋入口：使用者、廣告主與網站流量的雙邊規模&lt;/b&gt;&lt;span class=&quot;vd vd-有屏障證據&quot;&gt;有屏障證據&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;網路經濟（Network Economies）｜晨星：網路效應&lt;/div&gt;&lt;div class=&quot;two&quot;&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;好處（它帶來什麼）&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;Google 服務第三季營收 963.02 億、分部營業利益 391.57 億，分部利益率約 40.7%（推算）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src2&quot;&gt;[2]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;報導引 Statcounter：9 月 Google 全球搜尋占有率 89.9%，第二名 Bing 5.3%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src47&quot;&gt;[47]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;依賴搜尋流量的網站在申報裡寫 Google 是主要流量來源：Thryv 寫 Google in particular is the most significant source of traffic；Yelp 寫 rely heavily on Internet search engines, including primarily Google；CarGurus 則並列 Google、Bing、Yahoo!。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src43&quot;&gt;[43]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src41&quot;&gt;[41]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src52&quot;&gt;[52]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;屏障（為什麼對手拿不走）&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;Google 搜尋營收包含搜尋分發夥伴把 Google.com 設為瀏覽器、工具列等預設搜尋所帶來的流量；前九月流量取得成本 477.73 億，增加主要來自付給分發夥伴的流量取得成本。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src49&quot;&gt;[49]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src53&quot;&gt;[53]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src40&quot;&gt;[40]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;公司在風險因素自述：若法院限制預設分發安排與營收分成協議、要求分享或授權搜尋資料並向對手提供聯合供應，could significantly impair our distribution reach。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src54&quot;&gt;[54]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;從上面兩項推論：預設搜尋位置由分成合約占住，對手要拿走這些流量，得先贏得預設位置並付出同量級的分成，且沒有同量的查詢資料；公司自己把這些安排與搜尋資料列為分發觸及的來源，所以它們是對手拿不走的原因。但這兩項也正是最終判決要限制與分享的項目。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src49&quot;&gt;[49]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src40&quot;&gt;[40]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src54&quot;&gt;[54]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;two&quot;&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;超額報酬大小&lt;/div&gt;&lt;span class=&quot;lv&quot;&gt;大&lt;/span&gt;&lt;div class=&quot;s&quot;&gt;Google 服務分部利益率約 40.7%（推算），集團近四季營業利益率 33.3%，在近 20 季範圍 25.4%–33.3% 的高端。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src2&quot;&gt;[2]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src55&quot;&gt;[55]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;持續期間&lt;/div&gt;&lt;span class=&quot;lv&quot;&gt;不足5年&lt;/span&gt;&lt;div class=&quot;s&quot;&gt;占有率一年只降 0.44 個百分點（9 月 89.9%），第三方網站仍以 Google 為主要流量來源；這是目前的結果（好處），不是屏障本身。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src47&quot;&gt;[47]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src43&quot;&gt;[43]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;削弱屏障的因素：2025 年 12 月最終判決限制 Google 的發行方式，並要求與部分競爭者分享特定搜尋資料、提供聯合供應服務（雙方都已上訴、仍待判決）；AI 對話工具提供新入口，ChatGPT 行動日活躍用戶年增 69%；Yelp 也說 Google 自己的 AI 回答減少了導向它的點擊。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src50&quot;&gt;[50]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src48&quot;&gt;[48]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src42&quot;&gt;[42]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;屏障事實是預設分發合約與搜尋資料規模，而最終判決正好限制前者、要求分享後者，只差上訴結果與執行範圍；屏障能撐多久取決於這幾年內的上訴與執行，所以持續期間寫不足 5 年，不因占有率流失慢就延長；若上訴推翻或執行範圍縮小，再改評。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src50&quot;&gt;[50]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src54&quot;&gt;[54]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src47&quot;&gt;[47]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card advc&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;&lt;span class=&quot;num-b 有屏障證據&quot;&gt;2&lt;/span&gt;Google 雲端的客戶轉換成本&lt;/b&gt;&lt;span class=&quot;vd vd-有屏障證據&quot;&gt;有屏障證據&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;轉換成本（Switching Costs）｜晨星：轉換成本&lt;/div&gt;&lt;div class=&quot;two&quot;&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;好處（它帶來什麼）&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;雲端第三季分部營業利益 111.21 億，利益率約 36.2%（去年同期約 23.7%，推算）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src2&quot;&gt;[2]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;雲端營收積壓 5,608 億，約為雲端第三季營收 307 億的 18 倍（推算）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src11&quot;&gt;[11]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;屏障（為什麼對手拿不走）&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;客戶申報顯示系統已綁在 Google 雲端上：Snap 寫已把軟體與電腦系統建成使用 Google Cloud 與 AWS 提供的運算、儲存、頻寬等服務；Etsy 寫市集大部分運算、儲存與網路依賴 Google Cloud，使用中斷會 seriously harm our business。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src51&quot;&gt;[51]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src56&quot;&gt;[56]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src57&quot;&gt;[57]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;CME Group 2021 年與 Google Cloud 簽十年策略合作，2025 年已把清算與市場資料等核心應用搬上 Google Cloud。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src45&quot;&gt;[45]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src46&quot;&gt;[46]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;營收積壓只計不可取消的合約承諾；預計略多於 55% 在 24 個月內認列，其餘在之後認列。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src11&quot;&gt;[11]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;從上面三項推論：對手要搶走這些工作負載，客戶得重寫已綁定的系統、再搬一次核心應用，並等合約承諾到期，搬遷成本由客戶承擔，所以對手難以單靠降價拿走既有負載。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src51&quot;&gt;[51]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src46&quot;&gt;[46]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src11&quot;&gt;[11]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;two&quot;&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;超額報酬大小&lt;/div&gt;&lt;span class=&quot;lv&quot;&gt;中&lt;/span&gt;&lt;div class=&quot;s&quot;&gt;雲端分部利益率第三季約 36.2%，第二季公司說 35.6%，但一年前只有約 23.7%（推算），高利益率只維持兩季，且含 TPU 硬體銷售、組合未單獨揭露。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src2&quot;&gt;[2]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src20&quot;&gt;[20]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src16&quot;&gt;[16]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;持續期間&lt;/div&gt;&lt;span class=&quot;lv&quot;&gt;5–10年&lt;/span&gt;&lt;div class=&quot;s&quot;&gt;CME 十年合作自 2021 年起算到 2031 年（推算）；積壓約 45% 在 24 個月之後才認列（推算）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src45&quot;&gt;[45]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src11&quot;&gt;[11]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;削弱屏障的因素：Snap 同時使用 AWS，客戶多雲並用，新工作負載仍可分給對手；Crux AI 168 億屬關聯方合約。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src51&quot;&gt;[51]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src11&quot;&gt;[11]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;已綁定系統與不可取消合約有事實支撐，所以不寫不足 5 年；但客戶多雲並用、轉換成本只保護既有負載、不保護新增需求，所以不寫 10 年以上，取 5–10 年。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src51&quot;&gt;[51]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src45&quot;&gt;[45]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src11&quot;&gt;[11]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card advc&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;&lt;span class=&quot;num-b 暫時領先&quot;&gt;3&lt;/span&gt;自研 TPU 與 AI 基礎設施&lt;/b&gt;&lt;span class=&quot;vd vd-暫時領先&quot;&gt;暫時領先&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;流程能力（Process Power）｜晨星：成本優勢&lt;/div&gt;&lt;div class=&quot;two&quot;&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;好處（它帶來什麼）&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;公司說本季靠工程與硬體優化，把 AI Mode 回答成本降到上線以來最低。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src58&quot;&gt;[58]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;TPU 系統已成雲端第三季營收增量的來源之一，並透過 Oracle 對外提供。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src16&quot;&gt;[16]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src26&quot;&gt;[26]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;屏障（為什麼對手拿不走）&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;從開發年資與世代數推論：對手要做出同級的自研加速器與整套堆疊可能需要多世代累積；但目前找不到對手拿不走的事實（亞馬遜與微軟仍在模仿，TPU 的開發與供應依賴 Broadcom 的長期協議），所以這只是推論，判定暫時領先。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src26&quot;&gt;[26]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src59&quot;&gt;[59]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src44&quot;&gt;[44]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;two&quot;&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;超額報酬大小&lt;/div&gt;&lt;span class=&quot;lv&quot;&gt;不明&lt;/span&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-待查&quot;&gt;待查&lt;/span&gt;待查：TPU 系統銷售金額與毛利，10-Q 沒有單獨揭露，換到多少利潤差無法從申報算出。&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;持續期間&lt;/div&gt;&lt;span class=&quot;lv&quot;&gt;不足5年&lt;/span&gt;&lt;div class=&quot;s&quot;&gt;背景事實：報導指 Google 自 2013 年開始開發 TPU，晶片、模型與雲端一站式的組合是亞馬遜與微軟 have tried to replicate 的打法；10-K 時已到第七代 Ironwood。這是開發年資與對手在模仿，不是對手拿不走的原因。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src26&quot;&gt;[26]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src59&quot;&gt;[59]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;削弱屏障的因素：報導引 Anthropic 上市申報，說它同時採用 Google、Amazon、輝達與 AMD 的晶片，依各工作負載的價格效能挑選。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src60&quot;&gt;[60]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;屏障事實只有開發年資、世代數與對手仍在模仿；大客戶多家採購、設計依賴 Broadcom，2031 年只是網路元件供應保證的期限、不是 TPU 屏障的期限，所以寫不足 5 年，待 TPU 營收與毛利揭露後再評。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src26&quot;&gt;[26]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src60&quot;&gt;[60]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src44&quot;&gt;[44]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;超額報酬的機械參考：利潤率位置&lt;/figcaption&gt;&lt;svg viewBox=&quot;0 0 680 92&quot; role=&quot;img&quot; aria-label=&quot;近四季營業利益率在近20季範圍的位置&quot;&gt;&lt;line x1=&quot;30.0&quot; x2=&quot;30.0&quot; y1=&quot;18&quot; y2=&quot;64&quot; class=&quot;zl&quot;/&gt;&lt;text x=&quot;30.0&quot; y=&quot;84&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;0%&lt;/text&gt;&lt;line x1=&quot;185.0&quot; x2=&quot;185.0&quot; y1=&quot;18&quot; y2=&quot;64&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;185.0&quot; y=&quot;84&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;10%&lt;/text&gt;&lt;line x1=&quot;340.0&quot; x2=&quot;340.0&quot; y1=&quot;18&quot; y2=&quot;64&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;340.0&quot; y=&quot;84&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;20%&lt;/text&gt;&lt;line x1=&quot;495.0&quot; x2=&quot;495.0&quot; y1=&quot;18&quot; y2=&quot;64&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;495.0&quot; y=&quot;84&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;30%&lt;/text&gt;&lt;line x1=&quot;650.0&quot; x2=&quot;650.0&quot; y1=&quot;18&quot; y2=&quot;64&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;650.0&quot; y=&quot;84&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;40%&lt;/text&gt;&lt;rect x=&quot;422.9&quot; y=&quot;30&quot; width=&quot;123.5&quot; height=&quot;22&quot; rx=&quot;4&quot; fill=&quot;var(--biz)&quot; opacity=&quot;.22&quot;/&gt;&lt;text x=&quot;422.9&quot; y=&quot;24&quot; class=&quot;ax&quot;&gt;近 20 季範圍 25.4%～33.3%&lt;/text&gt;&lt;circle cx=&quot;546.5&quot; cy=&quot;41&quot; r=&quot;7&quot; fill=&quot;var(--biz)&quot;/&gt;&lt;text x=&quot;546.5&quot; y=&quot;76&quot; class=&quot;vl s&quot; text-anchor=&quot;middle&quot;&gt;近四季 33.3%&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;藍帶是近 20 季的近四季營業利益率範圍，圓點是最新值；同業營業利益率百分位 0.667（1＝同業最高）。只供對照「超額報酬大小」，不是分數、不進等級，也不是估值報告的護城河評分。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估底稿.json#/優勢參考&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;p class=&quot;lead&quot;&gt;機械參考（供對照超額報酬，不是分數）：近四季營業利益率 33.3%，近 20 季範圍 25.4%～33.3%，同業營業利益率百分位 0.667。&lt;/p&gt;&lt;div class=&quot;note&quot;&gt;判定規則：屏障欄至少一句標「事實」並附出處才算「有屏障證據」；否則只算「暫時領先」，持續期間最多寫「不足5年」。&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;s4&quot;&gt;&lt;h2&gt;5　生命週期與未來變化&lt;/h2&gt;&lt;div class=&quot;stages&quot;&gt;&lt;div class=&quot;&quot;&gt;起步&lt;/div&gt;&lt;div class=&quot;&quot;&gt;成長&lt;/div&gt;&lt;div class=&quot;on&quot;&gt;成熟&lt;/div&gt;&lt;div class=&quot;&quot;&gt;衰退&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;lead&quot;&gt;估值報告的林區分類（引用，不重判）：穩定成長股（Stalwart）&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;2022–2025 年營收年複合約 12.5%（推算），年度營收 2016 年以來沒有下降年。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src61&quot;&gt;[61]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src62&quot;&gt;[62]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;核心的 Google 服務第三季只年增 10.6%（推算），搜尋 12.0%、YouTube 廣告 9.2%、聯播網 1.4%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;雲端分部占第三季營收約 24% 且年增約一倍，屬於成熟公司內的成長型業務。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;研究報告的林區分類為穩定成長股，與「成熟」階段一致；兩者都把雲端的高速成長視為兼具的快速成長特徵，而不是整家公司回到成長期。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src63&quot;&gt;[63]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src64&quot;&gt;[64]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;callout&quot;&gt;&lt;b&gt;最可能的轉變：成熟 → 成長（雲端占比擴大而再加速）&lt;/b&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;營收近四季年增連續維持在 20% 以上到 2027 年下半年，且雲端占季營收超過三成；這與研究報告林區分類寫的改判條件（加速延續兩年以上、雲端占比過三成）同方向。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src34&quot;&gt;[34]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src65&quot;&gt;[65]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;反方向：若 AI 搜尋變現追不上、雲端在 TPU 一次性銷售後回落，增速回到 10%–15%，維持成熟。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src19&quot;&gt;[19]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src7&quot;&gt;[7]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lead&quot;&gt;怎麼檢驗&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;每季看營收近四季年增與 10-Q 營收表中雲端占比；2027 年第二季 10-Q（約 2027 年 7 月）做第一次判定。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src30&quot;&gt;[30]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;s5&quot;&gt;&lt;h2&gt;6　週期推論&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;三種證據都寫成「區間＋條件」，不給單一日期。&lt;/p&gt;&lt;div class=&quot;callout&quot;&gt;&lt;b&gt;綜合：未來 2–6 季（2027 年第一季至 2028 年第一季）營收近四季年增可能見頂，之後進入下行段&lt;/b&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;上行段已 13 季，遠長於過去唯一完整上行段的 5 季；單季增速第三季只比第二季多 0.4 個百分點，加速已在收斂。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src66&quot;&gt;[66]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src28&quot;&gt;[28]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;若雲端積壓按 24 個月認列節奏轉成營收、且 AI 搜尋廣告變現追上，見頂會延後到 6 季以後；若單季營收年增跌破 15%，下行段大致確認。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src11&quot;&gt;[11]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src19&quot;&gt;[19]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;利潤率比營收更早受折舊壓力：單季營業利益率已由第一季 36.1% 降到第三季 31.8%，營業利益率週期的見頂可能早於營收。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src30&quot;&gt;[30]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src4&quot;&gt;[4]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;h3&gt;① 自身歷史循環&lt;/h3&gt;&lt;div class=&quot;chart&quot;&gt;&lt;svg viewBox=&quot;0 0 720 240&quot; role=&quot;img&quot; aria-label=&quot;近四季營收年增（2016-06-30～2026-09-30（42 季））&quot;&gt;&lt;line x1=&quot;46&quot; x2=&quot;704&quot; y1=&quot;210.0&quot; y2=&quot;210.0&quot; stroke=&quot;var(--line)&quot; stroke-width=&quot;1.4&quot;/&gt;&lt;text x=&quot;40&quot; y=&quot;214.0&quot; font-size=&quot;11&quot; text-anchor=&quot;end&quot; fill=&quot;var(--muted)&quot;&gt;0%&lt;/text&gt;&lt;line x1=&quot;46&quot; x2=&quot;704&quot; y1=&quot;28.0&quot; y2=&quot;28.0&quot; stroke=&quot;var(--line)&quot; stroke-width=&quot;1&quot;/&gt;&lt;text x=&quot;40&quot; y=&quot;32.0&quot; font-size=&quot;11&quot; text-anchor=&quot;end&quot; fill=&quot;var(--muted)&quot;&gt;41%&lt;/text&gt;&lt;text x=&quot;46.0&quot; y=&quot;232&quot; font-size=&quot;11&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--muted)&quot;&gt;2016-06&lt;/text&gt;&lt;text x=&quot;158.3&quot; y=&quot;232&quot; font-size=&quot;11&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--muted)&quot;&gt;2018-03&lt;/text&gt;&lt;text x=&quot;270.7&quot; y=&quot;232&quot;
