&lt;section class=&quot;q&quot; id=&quot;workpaper&quot; data-layer=&quot;計算底稿&quot;&gt;&lt;div class=&quot;qno&quot;&gt;計算底稿&lt;/div&gt;&lt;h2&gt;計算底稿：正文結果的算法與完整表（預設摺疊）&lt;/h2&gt;&lt;p class=&quot;wpnote&quot;&gt;正文每個估值、償債結果都從這裡算出；背景計算照做、送審照核。不讀也不影響理解結論；非買賣建議。&lt;/p&gt;&lt;details id=&quot;wp-3-4&quot;&gt;&lt;summary&gt;3・4 現金與股東：報表對帳與股東回報判讀&lt;/summary&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;現金流報表對帳&lt;/h3&gt;&lt;p&gt;報表對帳（10-Q 2026-08-28，現金、約當現金及受限現金）：期初 5,431.0＋營運 7,646.0＋投資 -1,908.0＋融資 -6,814.0＋其他 4.0＝期末 4,359.0 百萬美元｜完整&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;股東回報判讀表&lt;/h3&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;股東回報（判讀依估值政策門檻，2026-10-14 核定；不影響估值與價格位置）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;數值&lt;/th&gt;&lt;th&gt;判讀&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股利殖利率&lt;/td&gt;&lt;td&gt;0.00%&lt;/td&gt;&lt;td&gt;不評好壞：近四季沒有配息（近十年未申報股利，以 0 計），股東回報全部來自回購&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;回購殖利率&lt;/td&gt;&lt;td&gt;9.65%&lt;/td&gt;&lt;td&gt;不評好壞：近四季回購約 93.0 億美元，是市值 963.1 億美元的 9.65%；划不划算看「股東收益率」「淨回購」「回購均價」&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股東收益率（股利＋回購）&lt;/td&gt;&lt;td&gt;9.65%（公債的 189%）&lt;/td&gt;&lt;td&gt;好：9.65% 是 10 年期公債 5.12% 的 189%，光靠現金回饋就可與公債競爭&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;淨回購殖利率&lt;/td&gt;&lt;td&gt;7.50%&lt;/td&gt;&lt;td&gt;好：回購 9.65% 裡約 2.2 個百分點用來抵銷發給員工的股票，扣掉後仍淨回購 7.50%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股數年變化（1／3／10 財年）&lt;/td&gt;&lt;td&gt;-5.0%／-3.2%／-1.7%&lt;/td&gt;&lt;td&gt;好：2025 財年對上一財年 -5.0%（減少）；近 3 財年平均每年 -3.2%（減少）；近 10 財年平均每年 -1.7%（減少）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;近十年有回購的年數&lt;/td&gt;&lt;td&gt;10／10&lt;/td&gt;&lt;td&gt;好：近十年有 10 年回購，達政策「穩定」（至少 8 年）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股利連續成長年數&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;不適用：公司沒有配息&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股東回饋占自由現金流&lt;/td&gt;&lt;td&gt;87.75%&lt;/td&gt;&lt;td&gt;注意：股利＋回購用掉近四季自由現金流的 88%，接近政策 100% 警示線&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;近四季公開市場回購均價（最近 4 份定期報告）&lt;/td&gt;&lt;td&gt;279.34&lt;/td&gt;&lt;td&gt;中性：均價 279.34 在合理價值區間 266.04–349.81 內&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;推定為零的項目&lt;/td&gt;&lt;td&gt;股利：近十年（2016–2025）均未申報，推定為零（推導值）&lt;/td&gt;&lt;td&gt;資料限制：公司近十年沒有這項申報，上表以 0 計算；屬推導值&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;details id=&quot;wp-mkt&quot;&gt;&lt;summary&gt;市場背景：大盤一句、流動性、空單與參考值的資料日期與存檔&lt;/summary&gt;&lt;p class=&quot;cap&quot;&gt;大盤狀態（市場總覽；只揭露，不進研究評等、價格位置與合理價值）：S&amp;amp;P 500（以 SPY 代表）前十大持股合計 37.3%，最大產業科技 38.2%；那斯達克 100（QQQ）科技占 58.0%；等權重 RSP 減市值加權 SPY 近3個月報酬差 1.7 個百分點，位在 2003 年以來第 79 分位（持平）。高收益債利差 3.30，位在 2023 年以來第 81 分位（偏高）；金融狀況指數 -0.46，位在 1971 年以來第 44 分位（中性）；VIX 18.70，位在 1990 年以來第 56 分位（中性）；融資推估（聯準會，推估）0.74 兆美元（2026-06-30），年增 46.6%（第 92 分位，偏高），占國內公司股權市值 0.68%（第 8 分位，偏低）。（市場總覽收盤日 2026-11-12，市場/市場總覽.json）。&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;流動性、空單與參考值（只列事實與資料日期，不判冷熱、不是買賣訊號；非買賣建議）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;類別&lt;/th&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;數值&lt;/th&gt;&lt;th&gt;資料日期&lt;/th&gt;&lt;th&gt;說明與存檔&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;流動性&lt;/td&gt;&lt;td&gt;20 日均成交量&lt;/td&gt;&lt;td&gt;3,961,515 股&lt;/td&gt;&lt;td&gt;2026-11-16 收盤&lt;/td&gt;&lt;td&gt;90 日均量 4,769,053 股（20 日 ÷ 90 日 0.83 倍）｜市場資料/市場溫度.json#/量能&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;流動性&lt;/td&gt;&lt;td&gt;20 日均成交金額&lt;/td&gt;&lt;td&gt;9.9 億美元&lt;/td&gt;&lt;td&gt;2026-11-16 收盤&lt;/td&gt;&lt;td&gt;市場資料/市場溫度.json#/流動性/20日均成交金額&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;流動性&lt;/td&gt;&lt;td&gt;20 日均周轉率（每日）&lt;/td&gt;&lt;td&gt;1.02%&lt;/td&gt;&lt;td&gt;2026-11-16 收盤&lt;/td&gt;&lt;td&gt;20 日均量 ÷ SEC 封面流通股數（當時可得，依分割換算）；自身近 5 年第 70% 百分位｜市場資料/市場溫度.json#/流動性/20日均換手率&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;空單&lt;/td&gt;&lt;td&gt;放空比率（空單占流通股）&lt;/td&gt;&lt;td&gt;4.31%&lt;/td&gt;&lt;td&gt;2026-10-30 結算&lt;/td&gt;&lt;td&gt;空單 16,762,913 股；前一期（2026-10-15）17,933,611 股，減少 6.5%；FINRA 每月兩次公布的合併空單，取得 2026-11-17｜市場資料/市場溫度.json#/流動性/空單&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;空單&lt;/td&gt;&lt;td&gt;回補天數&lt;/td&gt;&lt;td&gt;4.18 天&lt;/td&gt;&lt;td&gt;2026-10-30 結算&lt;/td&gt;&lt;td&gt;空單 ÷ 日均量（FINRA 自身日均量）；自算 ÷ 90 日均量 3.51 天｜市場資料/市場溫度.json#/流動性/空單&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;參考值&lt;/td&gt;&lt;td&gt;52 週區間位置&lt;/td&gt;&lt;td&gt;32%&lt;/td&gt;&lt;td&gt;2026-11-16 收盤&lt;/td&gt;&lt;td&gt;0%＝52 週低 193.41、100%＝52 週高 357.53（收盤，推算）｜市場資料/市場溫度.json#/趨勢&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;參考值&lt;/td&gt;&lt;td&gt;近 12 個月股價報酬&lt;/td&gt;&lt;td&gt;-26.3%&lt;/td&gt;&lt;td&gt;2026-11-16 收盤&lt;/td&gt;&lt;td&gt;同期 S&amp;amp;P 500 +11.3%｜市場資料/市場溫度.json#/動能&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;參考值&lt;/td&gt;&lt;td&gt;60 日歷史年化波動&lt;/td&gt;&lt;td&gt;38.9%&lt;/td&gt;&lt;td&gt;2026-11-16 收盤&lt;/td&gt;&lt;td&gt;日報酬標準差年化（收盤）｜市場資料/市場溫度.json#/波動&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;參考值&lt;/td&gt;&lt;td&gt;距 200 日均線&lt;/td&gt;&lt;td&gt;-0.6%&lt;/td&gt;&lt;td&gt;2026-11-16 收盤&lt;/td&gt;&lt;td&gt;200 日均線 247.43｜市場資料/市場溫度.json#/趨勢&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;!--空單與交割--&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;空單與交割、軋空條件（FINRA 每日放空、暗池與場外週量、Reg SHO 門檻名單、SEC 交割失敗；只描述，不判股價冷熱、不進研究評等；非買賣建議）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;類別&lt;/th&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;數值&lt;/th&gt;&lt;th&gt;資料日期&lt;/th&gt;&lt;th&gt;說明與存檔&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;空單&lt;/td&gt;&lt;td&gt;空單趨勢（近六期，半月一期）&lt;/td&gt;&lt;td&gt;連續減少 1 期&lt;/td&gt;&lt;td&gt;2026-10-30 結算&lt;/td&gt;&lt;td&gt;08-14 18.0M、08-31 17.4M、09-15 18.5M、09-30 17.7M、10-15 17.9M、10-30 16.8M；近一年區間 11.6M～20.9M｜市場資料/空單與交割.json#/空單&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;每日放空&lt;/td&gt;&lt;td&gt;放空成交占比（近20日平均）&lt;/td&gt;&lt;td&gt;48.0%&lt;/td&gt;&lt;td&gt;至 2026-11-16&lt;/td&gt;&lt;td&gt;前25日平均 53.5%；當天成交裡有多少是放空賣出（分母是 FINRA 場外回報成交量，不是全部成交）；不是未平倉空單；做市商、造市與避險的放空也算在內，大型股常態約三到四成，只看自己前後變化｜市場資料/空單與交割.json#/每日放空&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;交易場所&lt;/td&gt;&lt;td&gt;暗池（ATS）週成交占比&lt;/td&gt;&lt;td&gt;20.7%&lt;/td&gt;&lt;td&gt;2026-10-26 當週&lt;/td&gt;&lt;td&gt;近 8 週 15.2%～25.1%；資料落後約 3 週（自週起日算到收盤日）；在暗池（另類交易系統，掛單不公開）成交的股數占當週總成交；FINRA 週資料約落後 2～4 週公布（小型股 Tier 2 更久）；ATS 與 OTC 分開算、不加總；只描述在哪裡成交，不代表買或賣｜市場資料/空單與交割.json#/暗池與場外&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;交易場所&lt;/td&gt;&lt;td&gt;場外非暗池（OTC）週成交占比&lt;/td&gt;&lt;td&gt;23.7%&lt;/td&gt;&lt;td&gt;2026-10-26 當週&lt;/td&gt;&lt;td&gt;近 8 週 18.5%～28.8%；資料落後約 3 週（自週起日算到收盤日）；不經交易所也不經暗池、由券商自己撮合或內部化成交的占比；FINRA 週資料約落後 2～4 週公布（小型股 Tier 2 更久）；ATS 與 OTC 分開算、不加總；只描述在哪裡成交，不代表買或賣｜市場資料/空單與交割.json#/暗池與場外&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;交割&lt;/td&gt;&lt;td&gt;Reg SHO 門檻名單（FINRA 場外）&lt;/td&gt;&lt;td&gt;未上榜&lt;/td&gt;&lt;td&gt;2026-08-24～2026-11-16&lt;/td&gt;&lt;td&gt;Reg SHO 門檻名單：交割失敗量大（≥1 萬股且 ≥ 流通股 0.5%）連續 5 個交割日的股票會被列入；FINRA 名單只涵蓋場外（OTC）證券；上市股的門檻名單由交易所發布，本欄未上榜不代表不是門檻證券，交易所名單本工具未查｜市場資料/空單與交割.json#/門檻名單/FINRA&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;交割&lt;/td&gt;&lt;td&gt;Reg SHO 門檻名單（Nasdaq）&lt;/td&gt;&lt;td&gt;未上榜&lt;/td&gt;&lt;td&gt;2026-08-24～2026-11-16&lt;/td&gt;&lt;td&gt;門檻名單只查 FINRA（場外）與 Nasdaq；NYSE 與其他交易所上市股的名單未查（ICE 條款排除自動擷取），未上榜不代表不是門檻證券｜市場資料/空單與交割.json#/門檻名單/Nasdaq&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;交割&lt;/td&gt;&lt;td&gt;交割失敗（FTD）&lt;/td&gt;&lt;td&gt;最大單日 24,557 股（占流通股 0.006%）；未達異常門檻&lt;/td&gt;&lt;td&gt;2026-08-03～2026-10-26&lt;/td&gt;&lt;td&gt;交割失敗：賣方到交割日沒有交出股票的股數（SEC 每半月公布一檔）；異常門檻＝≥1 萬股且 ≥ 流通股 0.5% 連續 5 個交割日；SEC 半月檔約落後 2 週，最新半月檔可能尚未公布（本次未取得：202611a、202611b）｜市場資料/空單與交割.json#/交割失敗&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;綜合&lt;/td&gt;&lt;td&gt;軋空條件（描述型燈號）&lt;/td&gt;&lt;td&gt;低&lt;/td&gt;&lt;td&gt;2026-10-30 結算&lt;/td&gt;&lt;td&gt;空單占流通股 4.31%（未達偏多門檻）；回補 4.2 天（未達偏慢門檻）；空單最新期較前一期減少 6.5%；未在已查的門檻名單上、交割失敗未達異常門檻；規則：空單占流通股 ≥10% 且回補 ≥5 天，再加「空單增加中（連增 ≥3 期或近一年最高）」「占流通股 ≥20%」「交割吃緊」任一＝高；占流通股 ≥10%、交割吃緊、或回補 ≥5 天且空單增加中＝留意；其餘＝低（門檻 2026-11-18 使用者核定，設定/軋空條件門檻.json）；描述空方部位擁擠程度與回補難易，不判股價冷熱、不是股價會不會漲的判斷；不進研究評等、非買賣建議｜市場資料/空單與交割.json#/軋空條件&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;資料來源 FINRA、SEC（門檻名單另含 Nasdaq Trader）；FINRA 資料限非商業研究用途；只描述，不判股價冷熱、不進研究評等、非買賣建議。&lt;/p&gt;&lt;!--/空單與交割--&gt;&lt;div class=&quot;wide&quot;&gt;&lt;/div&gt;&lt;/details&gt;&lt;details id=&quot;wp-5&quot;&gt;&lt;summary&gt;5 估值：情境算式、市價隱含第 15 年倍數、同業與歷史倍數交叉核對、條件式區間算法、市價反推、溢價來源與作者計算說明&lt;/summary&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;作者計算說明&lt;/h3&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;折現率 10.1%：無風險利率 5.12%（美國財政部 10 年期，2026-11-16）、市場風險溢價 4.20%（Damodaran 2026-10-01，±0.5 個百分點）、beta 1.30。&lt;/strong&gt;beta 取 Damodaran 2026-01 軟體業去槓桿 beta 1.23，依含租賃負債權益比 7.0%、稅率 22% 重新加槓桿&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;，與 WACC 債務權重同口徑。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;beta 對照：2 年週 beta（Blume 調整）0.90 與產業值差 0.40，超過 0.2，中值不取它；低端 1.10、高端 1.383（yfinance 五年迴歸）。&lt;/strong&gt;中值改 1.10 時合理價值中點約 338&lt;span class=&quot;src&quot;&gt;（+11.9%，推導）&lt;/span&gt;，價格位置仍為偏低。折現率區間取基準 ±1.0 個百分點；AI 壓價風險已在保守情境處理，CEO 交接列事件，不重複加碼折現率。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;三情境（權重 25／50／25）：保守營收 7、5、4、3、3%，利潤率 33% 降到 25%、穩態 23%；基準 10、9、8、7、6%，利潤率 35% 到 36%、穩態 35%；樂觀 14、13、12、11、10%，利潤率 36% 到 40%、穩態 39%。&lt;/strong&gt;三情境每股 169.04 美元、301.63 美元、437.64 美元；情境差距約 89%，不確定性計分「低」。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;第 1 年成長：預設 11.9%&lt;span class=&quot;src&quot;&gt;（FY2026 營收指引中點 26,601 對 FY2025 23,769，8-K 2026-09-10 新聞稿 §7，推導）&lt;/span&gt;，採用 10.0%。&lt;/strong&gt;原因是模型第 1 年（FY2026 Q4～FY2027 Q3）只和指引重疊一季，且指引含 Semrush 併購墊高，扣除後 Q4 指引約 +8.2%&lt;span class=&quot;src&quot;&gt;（推算）&lt;/span&gt;。改用 11.9% 時中點約 +0.8%&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;終值：護城河雙鑰匙，鑰匙一通過（不含商譽 ROIC 近五年都高於資金成本），鑰匙二不通過（公司未揭露續約率與流失率，第三方申報只證明市場地位），分級為窄。&lt;/strong&gt;衰退期 10 年、永續期 ROIC 13.1%（資金成本加 3 個百分點）、永續成長 2.5%，三情境同值。改用永續期 ROIC＝資金成本時中點約 −2.4%&lt;span class=&quot;src&quot;&gt;（推導，只作敏感度）&lt;/span&gt;。 合理性檢查 S2、S5 紅燈（偏保守）的量化：模型終值倍數 8.5 倍，低於軟體業參考帶 p25 約 12.4 倍；三情境終值都改用 12.4 倍時，中點約 350&lt;span class=&quot;src&quot;&gt;（約 +15.7%，依估值結果倍數對照「穩態理論上限」與「參考帶中位」兩列線性內插，推導，只作敏感度、不進合理價值）&lt;/span&gt;。仍採保守設定，因鑰匙二不通過、護城河窄，且明示期 15 年、參考帶是 10 年機械回測，倍數不直接比；S2 的其他方法是同業與歷史倍數交叉核對，ADBE 倍數處歷史低位，差距屬預期。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;成長跑道：產業模組屬穩定複利，近十年營收沒有衰退年、營業利益率最大回落 5.4 個百分點；RPO 約為近四季營收 0.85 倍，FY2026 期末 ARR 指引年增 10.2%&lt;span class=&quot;src&quot;&gt;（8-K 2026-09-10 新聞稿 §7）&lt;/span&gt;。&lt;/strong&gt;這些是衰退期取窄分級上限 10 年的依據。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;情境幅度：加權合理價值中點 ÷ 基準情境每股＝1.003&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;，不低於 0.97。&lt;/strong&gt;樂觀本輪拉寬，若回到前一輪 13% 到 10%、穩態 37%，中點約 −2.0%&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;。市價反推另兩種折現率：低折現率 1.9%&lt;span class=&quot;src&quot;&gt;（市價反推未來 5 年營收年增；市價 246.00 美元、收盤 2026-11-16；折現率 9.10%；推導）&lt;/span&gt;、高折現率 6.1%&lt;span class=&quot;src&quot;&gt;（市價反推未來 5 年營收年增；市價 246.00 美元、收盤 2026-11-16；折現率 11.10%；推導）&lt;/span&gt;；基準第 1 年 10% 成長延續 約 4 年&lt;span class=&quot;src&quot;&gt;（基準情境第 1 年營收成長 10.0% 延續；收盤 2026-11-16；推導）&lt;/span&gt; 即可支撐現價&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;報酬門檻價&lt;span class=&quot;src&quot;&gt;（條件式推算，非目標價、非買賣建議）&lt;/span&gt;：年報酬 10% 對應每股，保守 171.02 美元&lt;span class=&quot;src&quot;&gt;（保守情境成真、年報酬 10% 所對應的每股價格；收盤 2026-11-16 股價 246.00 美元；條件式推算，非目標價、非買賣建議）&lt;/span&gt;、基準 305.57 美元&lt;span class=&quot;src&quot;&gt;（基準情境成真、年報酬 10% 所對應的每股價格；收盤 2026-11-16 股價 246.00 美元；條件式推算，非目標價、非買賣建議）&lt;/span&gt;、樂觀 443.74 美元&lt;span class=&quot;src&quot;&gt;（樂觀情境成真、年報酬 10% 所對應的每股價格；收盤 2026-11-16 股價 246.00 美元；條件式推算，非目標價、非買賣建議）&lt;/span&gt;。&lt;/strong&gt;第 5 年倍數維持現在 10.5 倍&lt;span class=&quot;src&quot;&gt;（第 5 年企業價值 ÷ 當年 EBIT，維持現在；推導）&lt;/span&gt; 時，三情境五年年報酬約 3.9%&lt;span class=&quot;src&quot;&gt;（保守情境成真、現價買進持有 5 年、第 5 年企業價值 ÷ EBIT 10.5 倍〔維持現在〕；推導，條件式，非預期報酬、非買賣建議）&lt;/span&gt;、15.6%&lt;span class=&quot;src&quot;&gt;（基準情境成真、現價買進持有 5 年、第 5 年企業價值 ÷ EBIT 10.5 倍〔維持現在〕；推導，條件式，非預期報酬、非買賣建議）&lt;/span&gt;、22.4%&lt;span class=&quot;src&quot;&gt;（樂觀情境成真、現價買進持有 5 年、第 5 年企業價值 ÷ EBIT 10.5 倍〔維持現在〕；推導，條件式，非預期報酬、非買賣建議）&lt;/span&gt;&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;缺口判斷清單：無；本輪沒有計算核對項目。&lt;/strong&gt;同業與歷史倍數交叉核對只作參考，不進評等。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;!--新圖表--&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;缺口判斷影響幅度&lt;/h3&gt;&lt;div class=&quot;wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;市價隱含第 15 年倍數（倍）：基準折現率下市價隱含 3.9 倍、模型 8.5 倍（約 0.5 倍差距）；參考帶 p25–p75 12.4–35.4 倍（機械回測樣本，非市場全體；分產業的筆數與公司數少，僅供參考）；特例：明示期 15 年，參考帶是 10 年機械回測，倍數不直接比，僅供參考。只描述，不進評等、不是目標價（估值結果.json#/market_implied_terminal）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 620 242&quot; role=&quot;img&quot; aria-label=&quot;市價隱含第 15 年倍數&quot; class=&quot;chart&quot; style=&quot;max-width:775px&quot;&gt;&lt;line x1=&quot;334.0&quot; x2=&quot;334.0&quot; y1=&quot;22&quot; y2=&quot;216&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;334.0&quot; y=&quot;234&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;0&lt;/text&gt;&lt;line x1=&quot;398.0&quot; x2=&quot;398.0&quot; y1=&quot;22&quot; y2=&quot;216&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;398.0&quot; y=&quot;234&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;10&lt;/text&gt;&lt;line x1=&quot;462.0&quot; x2=&quot;462.0&quot; y1=&quot;22&quot; y2=&quot;216&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;462.0&quot; y=&quot;234&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;20&lt;/text&gt;&lt;line x1=&quot;526.0&quot; x2=&quot;526.0&quot; y1=&quot;22&quot; y2=&quot;216&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;526.0&quot; y=&quot;234&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;30&lt;/text&gt;&lt;line x1=&quot;590.0&quot; x2=&quot;590.0&quot; y1=&quot;22&quot; y2=&quot;216&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;590.0&quot; y=&quot;234&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;40&lt;/text&gt;&lt;text x=&quot;334&quot; y=&quot;16&quot; class=&quot;ax&quot;&gt;EV/EBIT（倍）&lt;/text&gt;&lt;text x=&quot;324&quot; y=&quot;66.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;市價隱含（第 15 年 EV/EBIT）&lt;/text&gt;&lt;rect x=&quot;349.2&quot; y=&quot;50.0&quot; width=&quot;21.0&quot; height=&quot;22&quot; rx=&quot;4&quot; fill=&quot;var(--neg)&quot; opacity=&quot;.28&quot;&gt;&lt;title&gt;高–低折現率：2–6&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;349.2&quot; y=&quot;87.0&quot; class=&quot;ax&quot; text-anchor=&quot;start&quot;&gt;高–低折現率 2–6&lt;/text&gt;&lt;circle cx=&quot;358.9&quot; cy=&quot;61.0&quot; r=&quot;7&quot; fill=&quot;var(--neg)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;1.5&quot;&gt;&lt;title&gt;基準：4&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;358.9&quot; y=&quot;47.0&quot; class=&quot;val&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--neg)&quot;&gt;基準 4&lt;/text&gt;&lt;text x=&quot;324&quot; y=&quot;128.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;模型假設（終值 ÷ 第 15 年 EBIT）&lt;/text&gt;&lt;rect x=&quot;382.2&quot; y=&quot;112.0&quot; width=&quot;14.6&quot; height=&quot;22&quot; rx=&quot;4&quot; fill=&quot;var(--c1)&quot; opacity=&quot;.28&quot;&gt;&lt;title&gt;高–低折現率：8–10&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;382.2&quot; y=&quot;149.0&quot; class=&quot;ax&quot; text-anchor=&quot;start&quot;&gt;高–低折現率 8–10&lt;/text&gt;&lt;circle cx=&quot;388.5&quot; cy=&quot;123.0&quot; r=&quot;7&quot; fill=&quot;var(--c1)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;1.5&quot;&gt;&lt;title&gt;基準：9&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;388.5&quot; y=&quot;109.0&quot; class=&quot;val&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--c1)&quot;&gt;基準 9&lt;/text&gt;&lt;text x=&quot;324&quot; y=&quot;190.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;參考帶（Software (System &amp;amp; Application)）&lt;/text&gt;&lt;rect x=&quot;413.4&quot; y=&quot;174.0&quot; width=&quot;147.2&quot; height=&quot;22&quot; rx=&quot;4&quot; fill=&quot;var(--c7)&quot; opacity=&quot;.28&quot;&gt;&lt;title&gt;p25–p75：12–35&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;413.4&quot; y=&quot;211.0&quot; class=&quot;ax&quot; text-anchor=&quot;start&quot;&gt;p25–p75 12–35&lt;/text&gt;&lt;circle cx=&quot;467.8&quot; cy=&quot;185.0&quot; r=&quot;6&quot; fill=&quot;var(--c7)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;1.5&quot;&gt;&lt;title&gt;中位：21&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;467.8&quot; y=&quot;171.0&quot; class=&quot;val&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--c7)&quot;&gt;中位 21&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;/div&gt;&lt;!--/新圖表--&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;合理價值怎麼來：三個情境與權重&lt;/h3&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt&quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;每股價值（基準折現率 10.1%）&lt;/th&gt;&lt;th&gt;權重&lt;/th&gt;&lt;th&gt;折現率高端 11.1%&lt;/th&gt;&lt;th&gt;折現率低端 9.1%&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;169.04&lt;/td&gt;&lt;td&gt;25%&lt;/td&gt;&lt;td&gt;150.90&lt;/td&gt;&lt;td&gt;192.42&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;301.63&lt;/td&gt;&lt;td&gt;50%&lt;/td&gt;&lt;td&gt;265.63&lt;/td&gt;&lt;td&gt;348.33&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;437.64&lt;/td&gt;&lt;td&gt;25%&lt;/td&gt;&lt;td&gt;381.99&lt;/td&gt;&lt;td&gt;510.16&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;加權（合理價值）&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;b&gt;302.48&lt;/b&gt;&lt;/td&gt;&lt;td&gt;100%&lt;/td&gt;&lt;td&gt;&lt;b&gt;266.04&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;b&gt;349.81&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;中點是三個情境的加權：0.25×169.04＋0.5×301.63＋0.25×437.64≈302.48（一般權重組合）。區間上下緣是同樣三個情境、權重不變，只把折現率換成區間高端或低端重算後加權：高端約 11.1% → 266.04（下緣），低端約 9.1% → 349.81（上緣）。買入上限 241.99＝中點 × (1－安全邊際 20%，不確定性低)，股價在此以下才有 20% 安全邊際。情境表說明合理價值怎麼組成，不是單一目標價；非買賣建議。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;市價隱含第 15 年倍數（只描述，不進評等）&lt;/h3&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;基準情境：市價隱含 vs 模型假設的第 15 年 EV/EBIT（金額百萬美元）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;折現率&lt;/th&gt;&lt;th&gt;WACC&lt;/th&gt;&lt;th&gt;市場 EV&lt;/th&gt;&lt;th&gt;明示期現值&lt;/th&gt;&lt;th&gt;終值折現因子&lt;/th&gt;&lt;th&gt;第 15 年 EBIT&lt;/th&gt;&lt;th&gt;市價隱含倍數&lt;/th&gt;&lt;th&gt;模型終值倍數&lt;/th&gt;&lt;th&gt;隱含÷模型&lt;/th&gt;&lt;th&gt;現在 EV／次年 EBIT&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;低折現率&lt;/td&gt;&lt;td&gt;9.10%&lt;/td&gt;&lt;td&gt;97,432&lt;/td&gt;&lt;td&gt;84,626&lt;/td&gt;&lt;td&gt;0.271&lt;/td&gt;&lt;td&gt;19,895&lt;/td&gt;&lt;td&gt;2.4 倍&lt;/td&gt;&lt;td&gt;9.8 倍&lt;/td&gt;&lt;td&gt;0.24&lt;/td&gt;&lt;td&gt;9.7 倍&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;10.10%&lt;/td&gt;&lt;td&gt;97,432&lt;/td&gt;&lt;td&gt;79,173&lt;/td&gt;&lt;td&gt;0.236&lt;/td&gt;&lt;td&gt;19,895&lt;/td&gt;&lt;td&gt;3.9 倍&lt;/td&gt;&lt;td&gt;8.5 倍&lt;/td&gt;&lt;td&gt;0.46&lt;/td&gt;&lt;td&gt;9.7 倍&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;高折現率&lt;/td&gt;&lt;td&gt;11.10%&lt;/td&gt;&lt;td&gt;97,432&lt;/td&gt;&lt;td&gt;74,224&lt;/td&gt;&lt;td&gt;0.206&lt;/td&gt;&lt;td&gt;19,895&lt;/td&gt;&lt;td&gt;5.7 倍&lt;/td&gt;&lt;td&gt;7.5 倍&lt;/td&gt;&lt;td&gt;0.75&lt;/td&gt;&lt;td&gt;9.7 倍&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;算式：市場 EV＝模型 EV +（現價 − 模型每股價值）× 股數（股權橋與模型相同）；隱含倍數＝（市場 EV − 明示期現值）÷ 終值折現因子 ÷ 第 15 年 EBIT；模型終值倍數＝模型終值 ÷ 第 15 年 EBIT。參考帶：p25 12.4、中位 20.9、p75 35.4、p90 54.5 倍（機械回測樣本，非市場全體；分產業的筆數與公司數少，僅供參考；機械回測訓練期 2016–2021 全部回測日（審查工作區 回測資料/隱含倍數結果.json，1,810 筆中訓練期 1,046 筆；產業＝回測樣本的 Damodaran 產業）；重算：python3 程式/回測_隱含倍數參考帶.py &amp;lt;隱含倍數結果.json&amp;gt;）。只描述，不進價格位置、研究評等與合理價值。&lt;/p&gt;&lt;p class=&quot;cap&quot;&gt;特例：明示期 15 年，參考帶是 10 年機械回測，倍數不直接比，僅供參考。&lt;/p&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;&lt;b&gt;合理價值 vs 市價隱含倍數（作者判讀）：&lt;/b&gt;市價隱含第 15 年（明示期最後一年）企業價值對營業利益約 3.9 倍，只有模型終值倍數 8.5 倍 的 0.46，也遠低於軟體業參考帶 p25 約 12.4 倍：市價幾乎不給明示期之後的價值。特例：本模型明示期 15 年、參考帶是 10 年機械回測，倍數不直接比。只描述，不進評等、非目標價。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;如果 10 年後倍數是 20.9 倍，機率加權每股約 454 美元（條件式，非目標價、非買賣建議，不進評等）&lt;/h3&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;第 15 年 EV/EBIT 倍數對照（三情境各用自己的明示期 FCFF 與第 15 年 EBIT；權重 一般：保守 25%／基準 50%／樂觀 25%；基準 WACC 10.10%）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;第 15 年倍數&lt;/th&gt;&lt;th&gt;機率加權每股（美元）&lt;/th&gt;&lt;th&gt;折現率低高區間&lt;/th&gt;&lt;th&gt;白話換算&lt;/th&gt;&lt;th&gt;現價相對&lt;/th&gt;&lt;th&gt;說明&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;模型假設倍數&lt;/td&gt;&lt;td&gt;8.5 倍&lt;/td&gt;&lt;td&gt;302.48&lt;/td&gt;&lt;td&gt;266.04–349.81&lt;/td&gt;&lt;td&gt;等於折現率減永續成長約 7.6%（模型 7.6%）&lt;/td&gt;&lt;td&gt;現價低於區間&lt;/td&gt;&lt;td&gt;各情境用自己的模型終值倍數（表列為基準情境）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;穩態理論上限&lt;/td&gt;&lt;td&gt;10.5 倍&lt;/td&gt;&lt;td&gt;327.03&lt;/td&gt;&lt;td&gt;298.04–359.87&lt;/td&gt;&lt;td&gt;等於折現率減永續成長約 6.1%（模型 7.6%）&lt;/td&gt;&lt;td&gt;現價低於區間&lt;/td&gt;&lt;td&gt;（1−t）（1+g）÷（WACC−g）：再投資為零（ROIC 無限大）時的上限；t＝第 15 年 1−NOPAT÷EBIT&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;參考帶中位（Software (System &amp;amp; Application)）&lt;/td&gt;&lt;td&gt;20.9 倍&lt;/td&gt;&lt;td&gt;453.81&lt;/td&gt;&lt;td&gt;408.74–505.24&lt;/td&gt;&lt;td&gt;等於折現率減永續成長約 3.1%（模型 7.6%）&lt;/td&gt;&lt;td&gt;現價低於區間&lt;/td&gt;&lt;td&gt;所選參考帶（產業）中位&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;同業今日 EV/EBIT 中位&lt;/td&gt;&lt;td&gt;24.8 倍&lt;/td&gt;&lt;td&gt;501.41&lt;/td&gt;&lt;td&gt;450.30–559.82&lt;/td&gt;&lt;td&gt;等於折現率減永續成長約 2.6%（模型 7.6%）&lt;/td&gt;&lt;td&gt;現價低於區間&lt;/td&gt;&lt;td&gt;估值結果 multiples.ev_ebit.peer_quartiles.p50（今天的倍數，不是 10 年後）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;參考帶 p75（Software (System &amp;amp; Application)）&lt;/td&gt;&lt;td&gt;35.4 倍&lt;/td&gt;&lt;td&gt;631.00&lt;/td&gt;&lt;td&gt;563.46–708.42&lt;/td&gt;&lt;td&gt;等於折現率減永續成長約 1.8%（模型 7.6%）&lt;/td&gt;&lt;td&gt;現價低於區間&lt;/td&gt;&lt;td&gt;所選參考帶（產業）p75&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;市價隱含&lt;/td&gt;&lt;td&gt;3.9 倍&lt;/td&gt;&lt;td&gt;245.87&lt;/td&gt;&lt;td&gt;227.17–266.80&lt;/td&gt;&lt;td&gt;等於折現率減永續成長約 16.7%（模型 7.6%）&lt;/td&gt;&lt;td&gt;現價在區間內&lt;/td&gt;&lt;td&gt;基準情境、基準折現率反推（只用基準情境，套到三情境後加權不必等於現價）&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;如果 10 年後倍數是 X，三情境各用自己的明示期 FCFF 與第 15 年 EBIT、以基準折現率折現，依政策情境機率權重加權的每股價值；區間只換折現率（①模型列為合理價值區間）。「折現率減永續成長」＝(1+g)(1−t)(1−g/ROIC)÷倍數（基準情境永續參數）。條件式，非目標價、非買賣建議，不進評等。模型假設倍數那一列等於合理價值（中點 302.48）。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;合理性與一致性檢查（只顯示，不改估值與評等）&lt;/h3&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;每項都有反方向版本；「方向」是亮燈時模型偏保守還是偏積極&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;編號&lt;/th&gt;&lt;th&gt;檢查&lt;/th&gt;&lt;th&gt;燈號&lt;/th&gt;&lt;th&gt;方向&lt;/th&gt;&lt;th&gt;說明&lt;/th&gt;&lt;th&gt;反方向條件&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;S1&lt;/td&gt;&lt;td&gt;合理價中點隱含本益比對照營收成長&lt;/td&gt;&lt;td&gt;綠&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;合理價中點 ÷ 近四季 EPS（替代未來一年 EPS，資料未存遠期 EPS）＝16.9 倍；近四季營收年增 12.0%&lt;/td&gt;&lt;td&gt;反方向：年增 &amp;lt; 5% 且 &amp;gt; 30 倍黃、&amp;gt; 40 倍紅&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;S2&lt;/td&gt;&lt;td&gt;DCF 中點與其他方法中點差距&lt;/td&gt;&lt;td&gt;紅&lt;/td&gt;&lt;td&gt;偏保守&lt;/td&gt;&lt;td&gt;其他方法中點的中位數 644.96（3 法：自身・近五年（2021-11-16 起）〔EV／營業利益〕、同業現行（CRM、INTU、ADSK、NOW、WDAY）〔EV／營業利益〕、自身・近五年（2021-11-16 起）〔EV／自由現金流〕）÷ DCF 中點 302.48&lt;/td&gt;&lt;td&gt;反方向：比值 &amp;lt; 0.67 黃、&amp;lt; 0.5 紅（DCF 比其他方法高很多）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;S3&lt;/td&gt;&lt;td&gt;折現率減市價反推折現率&lt;/td&gt;&lt;td&gt;綠&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;採用 10.10%，市價反推（基準情境現價隱含年報酬）11.76%，差 -1.7 個百分點&lt;/td&gt;&lt;td&gt;反方向：採用比反推低 2 點以上黃、3 點以上紅&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;S4&lt;/td&gt;&lt;td&gt;終值占總價值比例&lt;/td&gt;&lt;td&gt;綠&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;基準情境終值現值占企業價值 34%&lt;/td&gt;&lt;td&gt;反方向：&amp;lt; 25% 黃（價值幾乎全靠明示期）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;S5&lt;/td&gt;&lt;td&gt;終值倍數落點&lt;/td&gt;&lt;td&gt;紅&lt;/td&gt;&lt;td&gt;偏保守&lt;/td&gt;&lt;td&gt;模型最後一年 EV/EBIT 8.5 倍；參考帶（Software (System &amp;amp; Application)）p25 12.4 中位 20.9 p75 35.4；護城河 窄；護城河窄卻低於參考帶 p25；明示期 15 年、參考帶是 10 年，僅供參考&lt;/td&gt;&lt;td&gt;反方向：高於 p75 紅、護城河無而高於中位黃（已含）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;S6&lt;/td&gt;&lt;td&gt;保守（或積極）假設疊加項數&lt;/td&gt;&lt;td&gt;綠&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;保守：成長（基準首年比近四季 -2.0 點）、終值（護城河寬或窄卻低於參考帶中位）；積極：安全邊際 20%&lt;/td&gt;&lt;td&gt;反方向：積極項數 3 黃、4 以上紅（已含）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;S9&lt;/td&gt;&lt;td&gt;樂觀情境低於現價要說明&lt;/td&gt;&lt;td&gt;綠&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;現價在保守與樂觀之間&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;S10&lt;/td&gt;&lt;td&gt;DCF 情境範圍與其他方法是否完全錯開&lt;/td&gt;&lt;td&gt;綠&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;樂觀 437.64、保守 169.04；其他方法最低下緣 413.25、最高上緣 951.57&lt;/td&gt;&lt;td&gt;反方向：保守高於所有其他方法上緣紅（已含）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;S7&lt;/td&gt;&lt;td&gt;折現率跨公司排序&lt;/td&gt;&lt;td&gt;黃&lt;/td&gt;&lt;td&gt;偏保守&lt;/td&gt;&lt;td&gt;UUUU（風險分 3 對 1，折現率 9.48% 低於本公司 10.10%）；WING（風險分 3 對 1，折現率 9.15% 低於本公司 10.10%）；WIX（風險分 4 對 1，折現率 8.69% 低於本公司 10.10%）&lt;/td&gt;&lt;td&gt;反方向：本公司風險分高 2 以上、折現率卻較低時，記在對方公司（同一規則兩頭都檢）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;S8&lt;/td&gt;&lt;td&gt;品質倒掛&lt;/td&gt;&lt;td&gt;黃&lt;/td&gt;&lt;td&gt;偏保守&lt;/td&gt;&lt;td&gt;生意 A 合理價隱含本益比 16.9 倍低於全站生意 B 中位 18.9 倍&lt;/td&gt;&lt;td&gt;反方向：生意 C 高於 B 中位（已含）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;C1&lt;/td&gt;&lt;td&gt;護城河用詞統一寬／窄／無&lt;/td&gt;&lt;td&gt;黃&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;出現強／中／弱用法&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;C2&lt;/td&gt;&lt;td&gt;兩頁不並存兩套字母評等&lt;/td&gt;&lt;td&gt;黃&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;估值頁生意 A、商業評估 B 級（不同字母容易被讀成同一把尺）&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;C3&lt;/td&gt;&lt;td&gt;假設與自己的護城河評分一致（P4）&lt;/td&gt;&lt;td&gt;綠&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;C4&lt;/td&gt;&lt;td&gt;同一事件期間描述一致（指引達成連續季數）&lt;/td&gt;&lt;td&gt;綠&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;C5&lt;/td&gt;&lt;td&gt;同一指標不同段落同值&lt;/td&gt;&lt;td&gt;綠&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;比對 9 個指標、25 處，沒有對不上&lt;/td&gt;&lt;td&gt;不分方向：任一處寫高或寫低都會亮；條件句、敏感度試算、其他期間與情境的數字不比（寧可漏報）&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;!--成長型價格參考--&gt;&lt;div class=&quot;block&quot; id=&quot;growth-ref&quot;&gt;&lt;h3&gt;成長型價格參考：報酬門檻價、五年報酬矩陣、林區比值（只描述，不進評等，非買賣建議）&lt;/h3&gt;&lt;p class=&quot;cap&quot;&gt;這一段只描述，不進研究評等、不改價格位置，也不是目標價；三種情境並列、不合成單一數字，數字是「該情境成真時」的條件式推算，不是預期報酬。非買賣建議。&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;一、報酬門檻價：收盤 2026-11-16 股價 246.00 美元（三情境並列；條件式推算，非目標價）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;年報酬 7% 的每股價格（美元）&lt;/th&gt;&lt;th&gt;年報酬 8% 的每股價格（美元）&lt;/th&gt;&lt;th&gt;年報酬 9% 的每股價格（美元）&lt;/th&gt;&lt;th&gt;年報酬 10% 的每股價格（美元）&lt;/th&gt;&lt;th&gt;現價隱含年報酬&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;273.63&lt;/td&gt;&lt;td&gt;227.38&lt;/td&gt;&lt;td&gt;195.02&lt;/td&gt;&lt;td&gt;171.02&lt;/td&gt;&lt;td&gt;7.5%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;512.17&lt;/td&gt;&lt;td&gt;418.64&lt;/td&gt;&lt;td&gt;353.54&lt;/td&gt;&lt;td&gt;305.57&lt;/td&gt;&lt;td&gt;11.8%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;766.32&lt;/td&gt;&lt;td&gt;619.82&lt;/td&gt;&lt;td&gt;518.27&lt;/td&gt;&lt;td&gt;443.74&lt;/td&gt;&lt;td&gt;15.2%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;算法：各情境的 10 年現金流與終值改用門檻當折現率，經同一股權橋換成每股；股價等於這個價格時，該情境成真的現價隱含年報酬就等於門檻（兩者互為反函數）。&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;二、五年報酬矩陣：現價買進、持有 5 年的年化報酬（三情境 × 三種第 5 年倍數；推導，條件式，非預期報酬）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;第 5 年 EBIT（估值輸入單位，推導）&lt;/th&gt;&lt;th&gt;維持現在 10.5 倍&lt;/th&gt;&lt;th&gt;縮四分之一 7.9 倍&lt;/th&gt;&lt;th&gt;回到參考帶中位（Software (System &amp;amp; Application)） 20.9 倍&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;8,048.1&lt;/td&gt;&lt;td&gt;3.9%&lt;/td&gt;&lt;td&gt;-0.7%&lt;/td&gt;&lt;td&gt;16.8%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;13,731.2&lt;/td&gt;&lt;td&gt;15.6%&lt;/td&gt;&lt;td&gt;10.4%&lt;/td&gt;&lt;td&gt;29.9%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;18,299.9&lt;/td&gt;&lt;td&gt;22.4%&lt;/td&gt;&lt;td&gt;16.9%&lt;/td&gt;&lt;td&gt;37.6%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;算法：現價買進、持有 5 年：第 1–5 年自由現金流與第 5 年企業價值（倍數 × 該情境第 5 年 EBIT）折回今天、經今日股權橋與股數換成每股，解出使每股等於現價的年報酬（與現價隱含年報酬同一算法，只是第 5 年改用倍數計價）；不另估 5 年後的淨債務與股數。企業價值 ÷ 當年 EBIT 口徑與市價隱含第 15 年倍數、參考帶相同。推導。現在倍數＝市場企業價值 97,432.0 ÷ 近四季營業利益 9,271.0（估值輸入 company_metrics.ebit）＝10.5 倍；縮四分之一＝現在倍數 × 0.75。參考帶：產業層「Software (System &amp;amp; Application)」中位 20.9 倍（機械回測樣本，非市場全體；分產業的筆數與公司數少，僅供參考）。&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;三、林區比值（只給比值與口徑；成長率與本益比的口徑同「PEG 與林區檢查」表的基準情境推估那一列）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;數值&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;林區分類&lt;/td&gt;&lt;td&gt;穩定成長股&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;成長率（基準情境推估（稅後營業利益年增－股數年變化））&lt;/td&gt;&lt;td&gt;11.2%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;本益比&lt;/td&gt;&lt;td&gt;13.7 倍&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股息殖利率&lt;/td&gt;&lt;td&gt;0.0%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;本益比 ÷ 成長率&lt;/td&gt;&lt;td&gt;1.22&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;（成長率＋股息殖利率）÷ 本益比&lt;/td&gt;&lt;td&gt;0.82&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;林區以本益比約等於成長率為參考（二手來源轉述）；本表不設門檻。只給比值與口徑，不作便宜或昂貴的判斷，不進研究評等與價格位置。非買賣建議。&lt;/p&gt;&lt;/div&gt;&lt;!--/成長型價格參考--&gt;&lt;div class=&quot;note-box&quot;&gt;&lt;b&gt;同業與歷史倍數交叉核對（不進評等）：391–651 美元&lt;/b&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;依同業的本益比、企業價值／營業利益、企業價值／營收、企業價值／自由現金流倍數與自身歷史本益比換算的每股價值，各法 25 百分位的中位數到 75 百分位的中位數；不是股價波動範圍，也不是合理價值。原稱「市場情緒區間」；2026-11-11 起只作交叉核對，不決定價格位置與研究評等（價格位置對稱四級：便宜、偏低、合理、偏貴，只看內在價值；同業與歷史倍數只作標註）。&lt;/p&gt;&lt;p class=&quot;cap&quot; id=&quot;peer-outliers&quot; style=&quot;margin-top:4px&quot;&gt;同業異常值：不計入分位：NOW 73.6 倍（pe，高於同組中位數 34.9 倍的2 倍，不進分位（D4））；NOW 73.9 倍（ev_ebit，高於同組中位數 26.3 倍的2 倍，不進分位（D4））。&lt;/p&gt;&lt;/div&gt;&lt;!--目標區間:第五題--&gt;&lt;div class=&quot;block&quot; id=&quot;target-body&quot;&gt;&lt;h3&gt;各情境成真時的價值（一年後，條件式、非買賣建議）&lt;/h3&gt;&lt;p class=&quot;cap&quot;&gt;條件式目標區間：三種情境各自成真時的每股價值區間，不是股價預測，三段不合成單一數字；非買賣建議。不影響合理價值、價格位置與研究評等。&lt;/p&gt;&lt;p&gt;算法：各情境每股價值（折現率高低兩端）×（1＋股權成本 10.58%）− 未來 12 個月每股股利 0.00 美元（近四季無股利（價值判斷.json 股利殖利率 0）；股利：近十年（2016–2025）均未申報，推定為零（推導值））；回購不加回。起點 2026-11-16 收盤，終點 2027-11-16。三段是各情境在折現率上下兩端的每股價值向前推 12 個月，不是價格機率分布的切片；段與段之間可能有空白，也可能重疊。區間主要寬度來自折現率不確定，不是 12 個月內的營運變化。&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt&quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;機率（政策權重，未經歷史校準）&lt;/th&gt;&lt;th&gt;目標區間（美元）&lt;/th&gt;&lt;th&gt;相對現價&lt;/th&gt;&lt;th&gt;關鍵假設（估值輸入）&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;25%&lt;/td&gt;&lt;td&gt;&lt;b&gt;166.86–212.78&lt;/b&gt;&lt;/td&gt;&lt;td&gt;−32%～−14%&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;第 1 年營收 +7.0%；營業利益率 33.0%；穩態 23.0%；永續成長 2.5%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;50%&lt;/td&gt;&lt;td&gt;&lt;b&gt;293.73–385.19&lt;/b&gt;&lt;/td&gt;&lt;td&gt;+19%～+57%&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;第 1 年營收 +10.0%；營業利益率 35.0%；穩態 35.0%；永續成長 2.5%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;25%&lt;/td&gt;&lt;td&gt;&lt;b&gt;422.41–564.14&lt;/b&gt;&lt;/td&gt;&lt;td&gt;+72%～+129%&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;第 1 年營收 +14.0%；營業利益率 36.0%；穩態 39.0%；永續成長 2.5%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;口徑：報告中「現價隱含年報酬（基準情境，非預期報酬）約 11.8%」是以現價買進、持有該情境全期現金流（含永續價值）的年化報酬；這裡的目標區間是 12 個月後各情境每股價值的前推，兩者口徑不同，不能互相換算（例如不能用前者推 12 個月後的價格）。&lt;/p&gt;&lt;h4 style=&quot;margin-top:14px&quot;&gt;每一段要成立，市場這一面需要什麼、正在顯示什麼&lt;/h4&gt;&lt;ul class=&quot;prose&quot;&gt;&lt;li&gt;保守段代表值 186.9（基準折現率前推）要成立，一年後EV／營業利益需約 8.1 倍（現在 10.5 倍，低於現在倍數）；過去一年逐日重建的交易日中，99% 以上高於這個倍數、不到 1% 低於這個倍數（推導）；同規模同成長低於 p25。這是把價值翻成倍數的讀法，不是預測市場會給這個倍數。&lt;/li&gt;&lt;li&gt;基準段代表值 333.5（基準折現率前推）要成立，一年後EV／營業利益需約 13.2 倍（現在 10.5 倍，高於現在倍數）；過去一年逐日重建的交易日中，19% 高於這個倍數、81% 低於這個倍數（推導）；同規模同成長約第 36 百分位（p25–p75 間線性內插，推導）。這是把價值翻成倍數的讀法，不是預測市場會給這個倍數。&lt;/li&gt;&lt;li&gt;樂觀段代表值 483.9（基準折現率前推）要成立，一年後EV／營業利益需約 17.9 倍（現在 10.5 倍，高於現在倍數）；過去一年逐日重建的交易日中，不到 1% 高於這個倍數、99% 以上低於這個倍數（推導）；同規模同成長約第 53 百分位（p25–p75 間線性內插，推導）。這是把價值翻成倍數的讀法，不是預測市場會給這個倍數。&lt;/li&gt;&lt;li&gt;以 2027-12-17 到期選擇權的價平隱含波動 45.9%（2026-11-17 17:48 UTC 取得；盤中報價，美東 12:48 取得；最近成交 2026-11-17；取價時現價 236.04，起點價 246.00 為 2026-11-16 收盤）定價，12 個月後（2027-11-16）價格落在保守段 19%、基準段 17%、樂觀段 6.9%；低於最低端（166.86） 24%、高於最高端（564.14） 2.6%、段與段之間空白 31%、段與段重疊 0.0%。這是風險中立機率，不是真實機率；不改情境權重、不改估值與評等；選擇權定價含風險溢酬與波動偏態，與三段情境機率是兩回事。報價品質：買權 52.2%、賣權 39.6% 相差 13 個百分點，報價可能過時或含偏斜，只作參考。&lt;/li&gt;&lt;li&gt;公債殖利率下降 1 個百分點時，保守／基準／樂觀段代表值（基準折現率前推，不是區間兩端的平均）為 208.9／377.9／553.1；目前 186.9／333.5／483.9；上升 1 個百分點時為 169.6／298.7／429.9（美元，股權成本同幅變動，其他假設不變）。&lt;/li&gt;&lt;li&gt;分析師預估：本財年每股盈餘預估 24.48，較 30 天前 24.40 +0.3%（持平），近 30 天 0 家上修、3 家下修；下一財年每股盈餘預估 27.43，較 30 天前 27.54 −0.4%（持平），近 30 天 1 家上修、3 家下修。只描述預估修正的方向，不當證據，也不是目標區間的任一端。&lt;/li&gt;&lt;li&gt;券商目標價近 90 天有 16 家調整：上調 9、下調 5、持平 2（只揭露，不是本報告的目標價）。&lt;/li&gt;&lt;li&gt;上季（Aug 2026，9/10/2026 公布）每股盈餘 4.75，共識預估 4.86，驚奇 -2.26%（Nasdaq）；yfinance 另列 2026-08-31 實際 6.13、預估 6.09、驚奇 +0.71%；兩個來源口徑可能不同（可能是調整後或一般會計準則），公司申報的每股盈餘可對照存檔 8-K 2026-09-10 財報新聞稿（本句未逐項比對），只描述、不當證據。&lt;/li&gt;&lt;/ul&gt;&lt;p class=&quot;cap&quot;&gt;以上只引用已存檔的數字描述條件與現況，不是預測；選擇權機率是風險中立機率、不是真實機率，不改情境權重；分析師預估與券商目標價不當證據；細節表在附錄估值細節。&lt;/p&gt;&lt;p&gt;&lt;b&gt;需要重算區間的事件：&lt;/b&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;新任總裁暨執行長 Anil Chakravarthy 2026-12-01 就任；永久財務長尚未任命、創意與生產力事業總裁 David Wadhwani 2026-09-27 卸任（代理財務長 Steven Day 自 2026-06-15 起，2026-09-10 申報仍由代理財務長簽署）。若新管理層公布的 FY2027 營收成長目標落在基準情境門檻 8.5%–11.5% 之外，或 non-GAAP 營業利益率目標明顯偏離 FY2026 的約 45.0%，或回購步調與估值輸入的股數假設明顯不同，三段區間需要重算（8-K 2026-09-08 本文 §3；8-K 2026-06-11 本文 §27；8-K 2026-09-10 本文 §28；8-K 2026-09-10 新聞稿 §7；8-K 2026-09-08 本文 §5）&lt;/li&gt;&lt;li&gt;訂閱取消做法的私人集體訴訟（美國聯邦法院 2026-09 恢復審理，新聞報導，金額影響未知）若出現重大和解或判決金額，三段區間需要重算；10-Q 對法律事項只稱已提列準備金不重大，未點名此案（新聞 N5 §0；10-Q 2026-08-28 Part I, Item 1 ¶227）&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;!--/目標區間:第五題--&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;市價要求的成長：三視角反推、假設對照實績、歷史基準比率與市價溢價來源&lt;/h3&gt;&lt;p&gt;這一節把現價代回估值模型反解「市場要求什麼」，再和公司實績、同規模公司的歷史比例、市場面的過熱訊號對照；只揭露，不改合理價值、價格位置與研究評等。&lt;/p&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;市價隱含什麼、我們假設什麼、公司做到什麼&lt;/h4&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;視角（其他假設照基準，三者擇一）&lt;/th&gt;&lt;th&gt;市價隱含&lt;/th&gt;&lt;th&gt;本報告基準&lt;/th&gt;&lt;th&gt;實績或對照&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;成長&lt;/td&gt;&lt;td&gt;第 1–5 年營收每年約 4.1%&lt;/td&gt;&lt;td&gt;第 1–5 年平均約 8.0%（推算）&lt;/td&gt;&lt;td&gt;近四季 12.0%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;利潤率&lt;/td&gt;&lt;td&gt;第 1 年起每年（含穩態）營業利益率約 29.2%&lt;/td&gt;&lt;td&gt;第 1 年 35.0%、穩態 35.0%&lt;/td&gt;&lt;td&gt;18.8%–36.8%（近 11 年營業利益率）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;折現率&lt;/td&gt;&lt;td&gt;約 11.8%（使基準情境等於現價的折現率）&lt;/td&gt;&lt;td&gt;加權資本成本 10.1%&lt;/td&gt;&lt;td&gt;10 年期公債 5.12%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;市價隱含折現率約 11.8%，比加權資本成本 10.1% 高約 1.7 個百分點：照基準情境假設，現價隱含的長期報酬高於本報告採用的資金成本；市價可能反映了基準情境沒有納入的風險（見第六題），或市場認為基準假設偏樂觀。隱含折現率不是預期報酬；V3 回測（2016–2025，含倖存者偏誤）中，之後一年實際報酬中位多高於隱含值。只揭露，不改研究評等與價格位置；非買賣建議。&lt;/p&gt;&lt;div style=&quot;margin-top:12px&quot;&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;第 1 年營收成長&lt;/th&gt;&lt;th&gt;穩態營業利益率&lt;/th&gt;&lt;th&gt;終端投入資本報酬率（ROIC）&lt;/th&gt;&lt;th&gt;永續成長&lt;/th&gt;&lt;th&gt;對照實績&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;7.0%&lt;/td&gt;&lt;td&gt;23.0%&lt;/td&gt;&lt;td&gt;13.1%&lt;/td&gt;&lt;td&gt;2.5%&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;10.0%&lt;/td&gt;&lt;td&gt;35.0%&lt;/td&gt;&lt;td&gt;13.1%&lt;/td&gt;&lt;td&gt;2.5%&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;14.0%&lt;/td&gt;&lt;td&gt;39.0%&lt;/td&gt;&lt;td&gt;13.1%&lt;/td&gt;&lt;td&gt;2.5%&lt;/td&gt;&lt;td&gt;高於歷史上限（穩態利潤率）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;公司實績&lt;/td&gt;&lt;td&gt;近四季 12.0%&lt;/td&gt;&lt;td&gt;近四季 35.7%；18.8%–36.8%（近 11 年營業利益率）&lt;/td&gt;&lt;td&gt;近四季未取得（財務指標無 ROIC_TTM）&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;p style=&quot;margin-top:8px&quot;&gt;&lt;b&gt;為何樂觀情境的穩態利潤率高於歷史上限（作者說明）：&lt;/b&gt;樂觀第 4–5 年營業利益率 39%～40%、穩態 39%，高於 11 年最高 36.8%（FY2021）。依據：FY2025 已達 36.6%；FY2026 公司指引一般會計口徑 35.0%、non-GAAP 45.0%，差距主要是股權薪酬 8.3 與攤銷 0.8 個百分點（8-K 2026-09-10 新聞稿 §7、§20）。作者判斷：樂觀假設兩種口徑差距由約 10 個百分點縮到約 5 個，不超過 non-GAAP 指引；參考幅度上限 49% 不用。&lt;/p&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;市價隱含三視角：把現價代回基準情境，一次只放開一個假設反解（成長、利潤率、折現率），三者擇一成立即可，不是同時需要；折現率視角就是第四題「現價隱含年報酬（基準情境，非預期報酬）」。假設對照：終端 ROIC 低於近四季一半時標「保守於實績」，括號寫原因：產業上限、公司近五年中位上限或等於資金成本是估值框架的上限設定（估值政策），作者選值的理由在估值輸入，都不是資料錯誤；穩態利潤率高於歷史上限標「高於歷史上限」；利潤率仍在改善中的公司（轉型、規模擴張期），歷史上限不一定是天花板，標記只提醒讀者對照，不代表假設錯誤。出處：估值結果.json（reverse_dcf、implied_return、discount）、估值輸入.json（scenarios）、財務指標.json（ROIC_TTM）、產業指標.json（景氣正常化）、成長推估底稿.json 與財務歷史.json（近四季）；推導，只揭露，不改合理價值、價格位置與研究評等。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;市價隱含的成長與歷史基準比率&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;市價隱含 ADBE 未來 10 年營收實質年增約 2.2%–2.7%（名目 4.7% 減通膨 2.0%–2.5% 的近似，推導）；1950–2015 年營收 250 億美元以上的公司中，10 年間做到實質年增 0% 以上的約 64.6%（Mauboussin 等，2016，表 4）。此為揭露，不是市價錯誤的證明。&lt;/p&gt;&lt;p&gt;現價要成立，需把基準情境第 1 年營收成長 10.0% 延續約 4 年（之後新投資報酬等於折現率，不再創造價值；推導，只揭露）。&lt;/p&gt;&lt;p&gt;&lt;b&gt;隱含假設罕見度：一般&lt;/b&gt;（同規模公司 10 年做到的歷史比例 ≥50% 一般、10%–50% 樂觀、&amp;lt;10% 歷史罕見；只揭露，不改研究評等與價格位置）&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;超額報酬期間&lt;/th&gt;&lt;th&gt;市價隱含營收年增（名目）&lt;/th&gt;&lt;th&gt;約實質（名目減通膨 2.0%–2.5% 的近似，推導）&lt;/th&gt;&lt;th&gt;歷史基準比率（1950–2015）&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;10 年&lt;/td&gt;&lt;td&gt;4.7%&lt;/td&gt;&lt;td&gt;2.2%–2.7%&lt;/td&gt;&lt;td&gt;營收 250 億美元以上：10 年實質年增 0% 以上約 64.6%（該組 10 年實質年增中位數 1.8%）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;15 年&lt;/td&gt;&lt;td&gt;3.7%&lt;/td&gt;&lt;td&gt;1.2%–1.7%&lt;/td&gt;&lt;td&gt;原文只有 10 年分布，15、20 年無對照&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;20 年&lt;/td&gt;&lt;td&gt;3.3%&lt;/td&gt;&lt;td&gt;0.8%–1.3%&lt;/td&gt;&lt;td&gt;原文只有 10 年分布，15、20 年無對照&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;做法：超額報酬期間內營收年增固定、利潤率與銷售對資本比取基準情境第 5 年；期間結束後新投資報酬等於折現率（不再創造價值）；永續成長照基準情境。折現率 10.10%、第 5 年利潤率 36.0%。來源：Mauboussin, Callahan &amp;amp; Majd（2016）〈The Base Rate Book〉表 4（第三方轉載，原表 1950–2015 年、實質成長、有存活偏差）。這張表只說明「市價需要多強、多久的成長才成立」，不改合理價值、買入上限與價格位置；歷史比例低代表市價需要少見的結果，不代表市價錯誤。通膨假設 2.0%–2.5% 依 Morningstar 2020-10 方法，實質年增為名目直接減通膨的近似。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;市價溢價來源&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;現價未高於合理價值上緣，下表只描述市場面，不代表有溢價。有資料的列都沒有過熱訊號。基本面預期、倍數重估、資金與情緒、總經與利率無訊號。只揭露，不改研究評等與價格位置，也不代表市價錯誤。&lt;/p&gt;&lt;p&gt;EPS 預估：+1y（財年未對應） 預估 90 天 0.3%（持平；判斷窗口為 90 天，±2% 內視為持平），近 30 天上修減下修 -2 家；yfinance 預估是取得當下快照，股價 90 天變化以批次收盤日為終點，兩者日期可能差幾天；取得 2026-11-05。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;來源類別&lt;/th&gt;&lt;th&gt;數值&lt;/th&gt;&lt;th&gt;過熱訊號&lt;/th&gt;&lt;th&gt;說明／存檔位置&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;隱含假設罕見度&lt;/td&gt;&lt;td&gt;基本面預期&lt;/td&gt;&lt;td&gt;一般&lt;/td&gt;&lt;td&gt;無&lt;/td&gt;&lt;td&gt;價值判斷.json#/市價隱含假設&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;倍數擴張&lt;/td&gt;&lt;td&gt;倍數重估&lt;/td&gt;&lt;td&gt;近 1 年（2025-11-14 起）股價 -26%：EPS +0.11、本益比 -0.41（對數）→ 倍數收縮為主&lt;/td&gt;&lt;td&gt;無&lt;/td&gt;&lt;td&gt;價值判斷.json#/報酬拆解&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;預估背離&lt;/td&gt;&lt;td&gt;倍數重估&lt;/td&gt;&lt;td&gt;+1y（財年未對應） EPS 預估 90 天 +0.3%（持平；90 天變化 ±2% 內視為持平），同期股價 -6.5% → 預估未跟上下跌，偏情緒&lt;/td&gt;&lt;td&gt;無&lt;/td&gt;&lt;td&gt;價值判斷.json#/預估修正&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;本益比水位&lt;/td&gt;&lt;td&gt;倍數重估&lt;/td&gt;&lt;td&gt;現在 13.7 倍，自身五年 p75 46.3 倍&lt;/td&gt;&lt;td&gt;無&lt;/td&gt;&lt;td&gt;市場資料/歷史本益比.json#/pe_p75&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股債利差&lt;/td&gt;&lt;td&gt;總經與利率&lt;/td&gt;&lt;td&gt;近期百分位 89%（0% 最貴）&lt;/td&gt;&lt;td&gt;無&lt;/td&gt;&lt;td&gt;市場資料/歷史本益比.json#/股債利差/近期百分位&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;整體市場風險溢價&lt;/td&gt;&lt;td&gt;總經與利率&lt;/td&gt;&lt;td&gt;Damodaran 隱含風險溢價 4.20%（2026-10-01）&lt;/td&gt;&lt;td&gt;不適用&lt;/td&gt;&lt;td&gt;只存當月值，沒有歷史序列可比中位數；要下載 Damodaran 歷史表需使用者同意&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;動能&lt;/td&gt;&lt;td&gt;資金與情緒&lt;/td&gt;&lt;td&gt;相對 200 日均線 -1%；12 個月（2025-11-13 起） -26% 對 S&amp;amp;P500 +11%&lt;/td&gt;&lt;td&gt;無&lt;/td&gt;&lt;td&gt;市場資料/市場溫度.json#/趨勢、#/動能&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;部位與衍生品&lt;/td&gt;&lt;td&gt;資金與情緒&lt;/td&gt;&lt;td&gt;選擇權賣權對買權量比 中性；空單分位 86%、回補天數分位 90%（有軋空條件）&lt;/td&gt;&lt;td&gt;無&lt;/td&gt;&lt;td&gt;股價在 200 日均線下且 12 個月下跌，熱度不視為溢價來源&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;擁擠度&lt;/td&gt;&lt;td&gt;資金與情緒&lt;/td&gt;&lt;td&gt;20 日均換手率在自身五年 70% 分位；被發現程度 高&lt;/td&gt;&lt;td&gt;無&lt;/td&gt;&lt;td&gt;市場資料/市場溫度.json#/流動性/20日均換手率_分位&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;股價漲跌拆解：EPS 成長 vs 本益比變化（年化對數點，推導；不含股利、申報 EPS）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;期間&lt;/th&gt;&lt;th&gt;股價年化&lt;/th&gt;&lt;th&gt;EPS 貢獻&lt;/th&gt;&lt;th&gt;本益比貢獻&lt;/th&gt;&lt;th&gt;本益比&lt;/th&gt;&lt;th&gt;主因&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;1年&lt;/td&gt;&lt;td&gt;-25.7%&lt;/td&gt;&lt;td&gt;+0.11&lt;/td&gt;&lt;td&gt;-0.41&lt;/td&gt;&lt;td&gt;20.7 → 13.7&lt;/td&gt;&lt;td&gt;倍數收縮為主&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;3年&lt;/td&gt;&lt;td&gt;-25.8%&lt;/td&gt;&lt;td&gt;+0.16&lt;/td&gt;&lt;td&gt;-0.46&lt;/td&gt;&lt;td&gt;54.2 → 13.7&lt;/td&gt;&lt;td&gt;倍數收縮為主&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;門檻：使用者 2026-11-04 照草案核定（程式/市場溢價來源.py 常數）。各列只描述市場面，不改合理價值、研究評等與價格位置，非買賣建議。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;multiple-conditions&quot;&gt;&lt;h3&gt;長期倍數條件：要漲 3／5／10 倍需要什麼&lt;/h3&gt;&lt;p&gt;反過來問：股價要在 5 年或 10 年內每股漲到 3、5、10 倍，期末營收、利潤率、估值倍數要做到多少，歷史上同規模公司有多少做到過。&lt;b&gt;條件反推，非預測、非機率、非目標價、非買賣建議&lt;/b&gt;；不改研究評等、價格位置與目標區間。&lt;/p&gt;&lt;p class=&quot;cap&quot;&gt;主列＝產業倍數＋基準穩態利潤率；括號是三種期末倍數口徑（不重估、產業、自身本益比 p25）的範圍。股數年稀釋率 -3.2%（推導）。罕見度：5 年用自有 SEC 名目分布、10 年用 Base Rate Book（1950–2015，實質）。&lt;/p&gt;&lt;ul&gt;&lt;li&gt;3 倍／5 年：營收年增約 -3.8%（3 種期末倍數口徑 -3.8%–20.9%），一般（營收 250 億美元以上的公司 5 年約 86.5% 做到）；資金自足&lt;/li&gt;&lt;li&gt;3 倍／10 年：營收年增約 -3.5%（3 種期末倍數口徑 -3.5%–8.2%），一般（營收 250 億美元以上的公司 10 年約 96.5% 做到）；資金自足&lt;/li&gt;&lt;li&gt;5 倍／5 年：營收年增約 6.5%（3 種期末倍數口徑 6.5%–33.8%），樂觀（營收 250 億美元以上的公司 5 年約 44.6% 做到）；資金自足&lt;/li&gt;&lt;li&gt;5 倍／10 年：營收年增約 1.5%（3 種期末倍數口徑 1.5%–13.8%），一般（營收 250 億美元以上的公司 10 年約 87.5% 做到）；資金自足&lt;/li&gt;&lt;li&gt;10 倍／5 年：營收年增約 22.3%（3 種期末倍數口徑 22.3%–53.7%），歷史罕見（營收 250 億美元以上的公司 5 年約 2% 做到）；資金自足&lt;/li&gt;&lt;li&gt;10 倍／10 年：營收年增約 8.8%（3 種期末倍數口徑 8.8%–22.0%），樂觀（營收 250 億美元以上的公司 10 年約 27.5% 做到）；資金自足&lt;/li&gt;&lt;/ul&gt;&lt;details&gt;&lt;summary&gt;全部格子&lt;/summary&gt;&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;倍數／期間&lt;/th&gt;&lt;th&gt;期末倍數口徑&lt;/th&gt;&lt;th&gt;利潤率口徑&lt;/th&gt;&lt;th&gt;需要營收年增&lt;/th&gt;&lt;th&gt;期末營收為現在&lt;/th&gt;&lt;th&gt;罕見度&lt;/th&gt;&lt;th&gt;資金&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;3 倍／5 年&lt;/td&gt;&lt;td&gt;不重估（13.5）&lt;/td&gt;&lt;td&gt;近四季（35.7%）&lt;/td&gt;&lt;td&gt;20.4%&lt;/td&gt;&lt;td&gt;2.5 倍&lt;/td&gt;&lt;td&gt;歷史罕見&lt;/td&gt;&lt;td&gt;自足&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;3 倍／5 年&lt;/td&gt;&lt;td&gt;不重估（13.5）&lt;/td&gt;&lt;td&gt;基準穩態（35.0%）&lt;/td&gt;&lt;td&gt;20.9%&lt;/td&gt;&lt;td&gt;2.6 倍&lt;/td&gt;&lt;td&gt;歷史罕見&lt;/td&gt;&lt;td&gt;自足&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;3 倍／5 年&lt;/td&gt;&lt;td&gt;產業（42.3）&lt;/td&gt;&lt;td&gt;近四季（35.7%）&lt;/td&gt;&lt;td&gt;-4.2%&lt;/td&gt;&lt;td&gt;0.8 倍&lt;/td&gt;&lt;td&gt;一般&lt;/td&gt;&lt;td&gt;自足&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;3 倍／5 年&lt;/td&gt;&lt;td&gt;產業（42.3）&lt;/td&gt;&lt;td&gt;基準穩態（35.0%）&lt;/td&gt;&lt;td&gt;-3.8%&lt;/td&gt;&lt;td&gt;0.8 倍&lt;/td&gt;&lt;td&gt;一般&lt;/td&gt;&lt;td&gt;自足&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;3 倍／5 年&lt;/td&gt;&lt;td&gt;均值回歸（22.7）&lt;/td&gt;&lt;td&gt;近四季（35.7%）&lt;/td&gt;&lt;td&gt;8.5%&lt;/td&gt;&lt;td&gt;1.5 倍&lt;/td&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;自足&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;3 倍／5 年&lt;/td&gt;&lt;td&gt;均值回歸（22.7）&lt;/td&gt;&lt;td&gt;基準穩態（35.0%）&lt;/td&gt;&lt;td&gt;8.9  年&lt;/td&gt;&lt;td&gt;均值回歸（22.7）&lt;/td&gt;&lt;td&gt;近四季（35.7%）&lt;/td&gt;&lt;td&gt;15.5%&lt;/td&gt;&lt;td&gt;4.2 倍&lt;/td&gt;&lt;td&gt;歷史罕見&lt;/td&gt;&lt;td&gt;自足&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;10 倍／10 年&lt;/td&gt;&lt;td&gt;均值回歸（22.7）&lt;/td&gt;&lt;td&gt;基準穩態（35.0%）&lt;/td&gt;&lt;td&gt;15.8%&lt;/td&gt;&lt;td&gt;4.3 倍&lt;/td&gt;&lt;td&gt;歷史罕見&lt;/td&gt;&lt;td&gt;自足&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/details&gt;&lt;p class=&quot;cap&quot;&gt;限制：&lt;/p&gt;&lt;ul class=&quot;cap&quot;&gt;&lt;li&gt;Base Rate Book 1950–2015、只含存續公司（存活偏差）；原表 10 年欄，5 年期待建立&lt;/li&gt;&lt;li&gt;非營業淨資產假設不變；資金缺口另列，不回頭改期末市值&lt;/li&gt;&lt;li&gt;均值回歸以本益比近似 EV÷稅後營業利益；產業倍數是 Damodaran 目前值，不是成熟期值&lt;/li&gt;&lt;li&gt;罕見度是歷史上多少公司做到，不是這家公司做到的機率&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;!--目標區間:附錄--&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;目標區間的倍數核對（只列不合成）&lt;/h3&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt&quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;倍數區段&lt;/th&gt;&lt;th&gt;倍數（EV／營業利益）&lt;/th&gt;&lt;th&gt;第 1 年獲利（百萬美元）&lt;/th&gt;&lt;th&gt;核對區間（美元）&lt;/th&gt;&lt;th&gt;代表值需要倍數&lt;/th&gt;&lt;th&gt;主方法代表值對核對區間中點&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;同規模同成長 p25～中位&lt;/td&gt;&lt;td&gt;10.62–16.68&lt;/td&gt;&lt;td&gt;9,170&lt;/td&gt;&lt;td&gt;245.99–387.73&lt;/td&gt;&lt;td&gt;8.1&lt;/td&gt;&lt;td&gt;−41%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;現在倍數～自身近五年 p25&lt;/td&gt;&lt;td&gt;10.51–17.66&lt;/td&gt;&lt;td&gt;9,998&lt;/td&gt;&lt;td&gt;265.53–448.03&lt;/td&gt;&lt;td&gt;13.2&lt;/td&gt;&lt;td&gt;−7%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;自身近五年中位～p75&lt;/td&gt;&lt;td&gt;28.22–36.39&lt;/td&gt;&lt;td&gt;10,658&lt;/td&gt;&lt;td&gt;765.46–987.73&lt;/td&gt;&lt;td&gt;17.9&lt;/td&gt;&lt;td&gt;−45%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;各情境第 1 年營業利益（假設，推導；不是公司指引）。每股 =（倍數 × 獲利 − 股權橋 1,123）÷ 391.5 百萬股，與估值引擎同口徑。倍數維持現在倍數不變、只看獲利，每股 ＝（現在倍數 × 第 1 年獲利 − 股權橋）÷ 股數：保守 243.3、基準 265.5、樂觀 283.2（美元）。倍數核對回答「市場一年後照這種擔憂程度給倍數，價格會在哪」；與主方法的差距是價值與市場慣例的落差，不合成、不平均。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;目標區間的企業價值前推核對&lt;/h3&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt&quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;股權成本前推（每股，折現率基準）&lt;/th&gt;&lt;th&gt;企業價值前推（每股）&lt;/th&gt;&lt;th&gt;相對差距&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;186.92&lt;/td&gt;&lt;td&gt;186.39&lt;/td&gt;&lt;td&gt;0.28%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;333.54&lt;/td&gt;&lt;td&gt;332.37&lt;/td&gt;&lt;td&gt;0.35%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;483.94&lt;/td&gt;&lt;td&gt;482.11&lt;/td&gt;&lt;td&gt;0.38%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;EV₀×（1＋WACC）−股權橋 與 每股價值×（1＋股權成本）的差；差距≥1% 只標註（槓桿較高時前者未計利息），不改目標區間。最大相對差距 0.38%（小於 1%）。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;各段代表值需要的倍數與歷史位置&lt;/h3&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt&quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;需要倍數（EV／營業利益）&lt;/th&gt;&lt;th&gt;相對現在 10.5 倍&lt;/th&gt;&lt;th&gt;自身近一年高於／低於此倍數的交易日比例&lt;/th&gt;&lt;th&gt;自身近五年（存檔四分位內插）&lt;/th&gt;&lt;th&gt;同規模同成長&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;8.1&lt;/td&gt;&lt;td&gt;低於&lt;/td&gt;&lt;td&gt;99% 以上／不到 1%&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;低於 p25&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;低於 p25&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;13.2&lt;/td&gt;&lt;td&gt;高於&lt;/td&gt;&lt;td&gt;19%／81%&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;低於 p25&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;約第 36 百分位（p25–p75 間線性內插，推導）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;17.9&lt;/td&gt;&lt;td&gt;高於&lt;/td&gt;&lt;td&gt;不到 1%／99% 以上&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;約第 26 百分位（p25–p75 間線性內插，推導）&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;約第 53 百分位（p25–p75 間線性內插，推導）&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;需要倍數＝（代表值×股數＋股權橋）÷ 情境第 1 年獲利（推導）；是把價值翻成倍數的讀法，不是預測市場會給這個倍數。自身近一年比例：近一年每日 EV／近四季獲利（申報日後才可用）重建，四分位與市場給價存檔一致；推導（2025-11-14 至 2026-11-16，252 個交易日）。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;約 12 個月選擇權隱含分布下，各段的風險中立機率&lt;/h3&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt&quot;&gt;&lt;tr&gt;&lt;th&gt;保守段&lt;/th&gt;&lt;th&gt;基準段&lt;/th&gt;&lt;th&gt;樂觀段&lt;/th&gt;&lt;th&gt;低於最低端&lt;/th&gt;&lt;th&gt;高於最高端&lt;/th&gt;&lt;th&gt;段與段空白&lt;/th&gt;&lt;th&gt;段與段重疊&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;19%&lt;/td&gt;&lt;td&gt;17%&lt;/td&gt;&lt;td&gt;6.9%&lt;/td&gt;&lt;td&gt;24%&lt;/td&gt;&lt;td&gt;2.6%&lt;/td&gt;&lt;td&gt;31%&lt;/td&gt;&lt;td&gt;0.0%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;風險中立機率，不是真實機率；不改情境權重、不改估值與評等。到期日 2027-12-17（離終點日 31 天）價平隱含波動 45.9%（買權 52%、賣權 40%），最近成交 2026-11-17 17:01:05+00:00（盤中報價，美東 12:48 取得；最近成交 2026-11-17；取價時現價 236.04，起點價 246.00 為 2026-11-16 收盤）；無風險利率 4.65%（FRED DGS1，2026-11-13 觀測 4.65%，資料庫/利率_FRED.json）、股利率 0.00%；起點價格 246.00（2026-11-16 收盤）。對數常態；漂移＝無風險利率（固定用 1 年期 DGS1，期間固定 1 年，不依到期日做期限插補）−股利率；波動＝價平隱含波動（不含波動微笑與偏態）；以批次收盤價為起點、12 個月為期間。各段機率是價格落在該段價值區間內的機率，段與段重疊處在各段機率中重複計入。報價品質：買權 52.2%、賣權 39.6% 相差 13 個百分點，報價可能過時或含偏斜，只作參考。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;預估修正趨勢（只描述，不當證據）&lt;/h3&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt&quot;&gt;&lt;tr&gt;&lt;th&gt;期間&lt;/th&gt;&lt;th&gt;每股盈餘預估&lt;/th&gt;&lt;th&gt;7 天前&lt;/th&gt;&lt;th&gt;30 天前&lt;/th&gt;&lt;th&gt;60 天前&lt;/th&gt;&lt;th&gt;90 天前&lt;/th&gt;&lt;th&gt;較 30 天前&lt;/th&gt;&lt;th&gt;近 7 天上修／下修家數&lt;/th&gt;&lt;th&gt;近 30 天上修／下修家數&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;本季&lt;/td&gt;&lt;td&gt;6.33&lt;/td&gt;&lt;td&gt;6.33&lt;/td&gt;&lt;td&gt;6.33&lt;/td&gt;&lt;td&gt;6.32&lt;/td&gt;&lt;td&gt;6.32&lt;/td&gt;&lt;td&gt;持平&lt;/td&gt;&lt;td&gt;0／1&lt;/td&gt;&lt;td&gt;1／1&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;下一季&lt;/td&gt;&lt;td&gt;6.75&lt;/td&gt;&lt;td&gt;6.76&lt;/td&gt;&lt;td&gt;6.76&lt;/td&gt;&lt;td&gt;6.74&lt;/td&gt;&lt;td&gt;6.73&lt;/td&gt;&lt;td&gt;持平&lt;/td&gt;&lt;td&gt;0／1&lt;/td&gt;&lt;td&gt;0／2&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;本財年&lt;/td&gt;&lt;td&gt;24.48&lt;/td&gt;&lt;td&gt;24.48&lt;/td&gt;&lt;td&gt;24.40&lt;/td&gt;&lt;td&gt;24.33&lt;/td&gt;&lt;td&gt;24.32&lt;/td&gt;&lt;td&gt;持平&lt;/td&gt;&lt;td&gt;0／2&lt;/td&gt;&lt;td&gt;0／3&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;下一財年&lt;/td&gt;&lt;td&gt;27.43&lt;/td&gt;&lt;td&gt;27.51&lt;/td&gt;&lt;td&gt;27.54&lt;/td&gt;&lt;td&gt;27.36&lt;/td&gt;&lt;td&gt;27.35&lt;/td&gt;&lt;td&gt;持平&lt;/td&gt;&lt;td&gt;0／2&lt;/td&gt;&lt;td&gt;1／3&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;分析師預估與券商目標價只描述，不當證據，也不是目標區間任一端；上修／下修門檻為較 30 天前變動 ±1%（本工具設定；與「市價溢價來源」預估修正以 90 天 ±2% 判持平是兩個口徑）。資料取得 2026-11-05T23:01:20（台北時間）（yfinance eps_trend、eps_revisions）。券商目標價近 90 天 16 家調整：上調 9、下調 5、持平 2；上季財報驚奇（Nasdaq）：Aug 2026，9/10/2026 公布，每股盈餘 4.75、共識 4.86、驚奇 -2.26%；（yfinance）：2026-08-31，實際 6.13、預估 6.08663。兩個來源口徑可能不同（可能是調整後或一般會計準則）；公司申報的每股盈餘可對照存檔 8-K 2026-09-10 財報新聞稿（事件/8K事件.json），本工具未逐項比對，只描述，不比較、不當證據。每批另存快照自建歷史：1 筆（2026-11-05 至 2026-11-05）。&lt;/p&gt;&lt;/div&gt;&lt;!--/目標區間:附錄--&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;三個情境怎麼設（作者判斷）&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;保守壓利潤率、不壓營收：穩態營業利益率 23%，約為基準 35% 的 0.66 倍。&lt;/strong&gt;理由是 RPO 約為營收 0.85 倍、2015–2025 營收沒有下降年，AI 衝擊較可能先表現在降價與算力成本；23% 仍在公司 11 年 GAAP 範圍內（最低 FY2015 的 18.8%）。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;樂觀成長 14、13、12、11、10%（平均 12.0%），低於五年年複合 13.1%，因 FY2021 疫情年 +22.7% 不會重演，扣掉後四年年複合 10.8%&lt;span class=&quot;src&quot;&gt;（推算）&lt;/span&gt;。&lt;/strong&gt;樂觀利潤率到 40%、不用參考幅度上限 49%，理由見假設對照的「高於歷史上限」說明。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;此方法在本工作流的實例驗證&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;訂閱軟體卡目前「有條件可用」，待補併購成長，以及攤銷與現金稅（共三條）；本報告三條都做過敏感度，皆為推算，只揭露，不進合理價值。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;敏感度以本輪估值輸入（2026-11-16 收盤）試算，估值引擎同一輸入只改該項，幅度約 −3.1%～+2.7%&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;。&lt;/strong&gt;公司稱 Semrush 影響不重大、未提供備考數&lt;span class=&quot;src&quot;&gt;（10-Q Part I, Item 1 ¶93）&lt;/span&gt;。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;figure&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt signals&quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;本報告處理（推算）&lt;/th&gt;&lt;th&gt;中點敏感度（本輪試算）&lt;/th&gt;&lt;th&gt;出處&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;併購成長&lt;/td&gt;&lt;td&gt;Q2 新聞稿揭露 Semrush 約 480 百萬 ARR、Q2 訂閱收入約 40 百萬；扣 Semrush（約 120 百萬＝480÷4）與匯率（約 40 百萬）後 Q3 年增約 10.2%、Q4 指引中點約 8.2%、FY2026 期末 ARR 約 8.3%。基準第 1 年 +10% 含 Semrush 補滿全年約 1.2 個百分點（內生約 8.8%），第 2 年 9%，第 3 年 8% 起每年減 1 個百分點。&lt;/td&gt;&lt;td&gt;第 2～5 年各減 1 個百分點：約 295（−2.6%）&lt;/td&gt;&lt;td&gt;8-K 2026-06-11 新聞稿 §2、§4；10-Q Part I, Item 2 ¶68；Part I, Item 1 ¶93&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;攤銷&lt;/td&gt;&lt;td&gt;GAAP 口徑，第 1 年利潤率 35% 已含 Semrush 攤銷；只加回購入無形資產攤銷（2027 年預計 214 百萬，約營收 0.8%）；同時扣 FY2022 起平均併購支出約 360 百萬／年（約營收 1.4%，稅後換算營業利益率約 1.8 個百分點）。&lt;/td&gt;&lt;td&gt;加回：約 310（+2.4%）；加回並扣併購支出：約 293（−3.1%）&lt;/td&gt;&lt;td&gt;10-Q Part I, Item 1 ¶164&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;現金稅&lt;/td&gt;&lt;td&gt;稅率用 22%：前九個月實付 1,529 百萬、約占稅前 21.8%，帳列 1,589（22.6%）；10-Q 預期 FY2026 起現金稅率下降。&lt;/td&gt;&lt;td&gt;稅率改 20%：約 311（+2.7%）&lt;/td&gt;&lt;td&gt;10-Q Part I, Item 1 ¶38；Part I, Item 2 ¶118&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;估值方法與參數&lt;/h3&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;方法&lt;/th&gt;&lt;th&gt;低&lt;/th&gt;&lt;th&gt;中&lt;/th&gt;&lt;th&gt;高&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;DCF 保守&lt;/td&gt;&lt;td&gt;151&lt;/td&gt;&lt;td&gt;169&lt;/td&gt;&lt;td&gt;192&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;DCF 基準&lt;/td&gt;&lt;td&gt;266&lt;/td&gt;&lt;td&gt;302&lt;/td&gt;&lt;td&gt;348&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;DCF 樂觀&lt;/td&gt;&lt;td&gt;382&lt;/td&gt;&lt;td&gt;438&lt;/td&gt;&lt;td&gt;510&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;歷史本益比&lt;/td&gt;&lt;td&gt;407&lt;/td&gt;&lt;td&gt;660&lt;/td&gt;&lt;td&gt;829&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;同業本益比&lt;/td&gt;&lt;td&gt;381&lt;/td&gt;&lt;td&gt;506&lt;/td&gt;&lt;td&gt;651&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;同業企業價值／營業利益&lt;/td&gt;&lt;td&gt;507&lt;/td&gt;&lt;td&gt;584&lt;/td&gt;&lt;td&gt;703&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;同業企業價值／營收&lt;/td&gt;&lt;td&gt;320&lt;/td&gt;&lt;td&gt;330&lt;/td&gt;&lt;td&gt;471&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;同業 EV/自由現金流&lt;/td&gt;&lt;td&gt;391&lt;/td&gt;&lt;td&gt;467&lt;/td&gt;&lt;td&gt;549&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p style=&quot;font-size:14px&quot;&gt;折現率基準 10.1%（區間 9.1%–11.1%）：無風險利率 5.12%、市場風險溢價 4.20%、beta 1.3。DCF 為 15 年：前 5 年依情境，後 10 年成長與利潤率逐步回到永續水準。&lt;/p&gt;&lt;p style=&quot;font-size:14px&quot;&gt;同業：CRM（企業訂閱應用軟體（CRM、行銷雲與 ADBE Experience Cloud 直接競爭）；營收成長 10.8% 與 ADBE 接近；規模約兩倍）, INTU（以中小企業與消費者為主的訂閱軟體，市值約 95 十億美元與 ADBE 相近，成長 13.7%，同樣面對生成式 AI 取代工具的質疑）, ADSK（設計與創作專業軟體（AutoCAD、Maya），訂閱制，客群與 ADBE 創意專業用戶重疊，營業利益率 27.9%（同業營運比較.json 近四季）低於 ADBE 35.7%，但同屬高利潤訂閱軟體）, NOW（大型企業訂閱軟體平台，市值約 106 十億美元與 ADBE 相近；成長 20.5% 高於 ADBE，倍數偏高，作為同業上緣參考）, WDAY（企業訂閱應用軟體（人資、財務），成長 12.8% 與 ADBE 相近；GAAP 營業利益率 12.0%（同業營運比較.json 近四季）較低使 P/E、EV/EBIT 偏高）。排除：MSFT：A、D：業務含 Azure 雲端基礎設施、作業系統與遊戲，市值約 40 倍，資本支出大使 EV/FCF 66 倍失真；只作營運參考, FIG：D、E：Figma 是設計工具直接競爭者，但 GAAP 營業虧損（同業營運比較.json 近四季截止 2026-09-30，營業利益率 −40.7%，股權薪酬約占營收 49.6%）、最近一季營收年增 42.8%，P/E 與 EV/EBIT 不可算，EV/Sales 反映高成長，不可比；只作營運參考。&lt;/p&gt;&lt;p style=&quot;font-size:14px&quot;&gt;產業公版：穩定現金流／訂閱軟體；驗證狀態：已驗證兩家（ADBE 可用、CRM 有條件可用；2026-11-07 使用者核定，A 案重跑兩家通過後）；本公司是第 1 家實例（實例結果：可用）。&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;details id=&quot;wp-value&quot;&gt;&lt;summary&gt;價值判斷：PEG、林區資產負債表檢查與交叉檢查&lt;/summary&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;PEG 與林區檢查&lt;/h3&gt;&lt;div class=&quot;wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;PEG：可計算的成長口徑（紅線為 1 與 2）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 500 142&quot; role=&quot;img&quot; aria-label=&quot;PEG&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;168.0&quot; x2=&quot;168.0&quot; y1=&quot;6&quot; y2=&quot;136&quot; class=&quot;zero&quot;/&gt;&lt;line x1=&quot;292.5&quot; x2=&quot;292.5&quot; y1=&quot;4&quot; y2=&quot;138&quot; class=&quot;price&quot;/&gt;&lt;line x1=&quot;417.1&quot; x2=&quot;417.1&quot; y1=&quot;4&quot; y2=&quot;138&quot; class=&quot;price&quot;/&gt;&lt;text x=&quot;158&quot; y=&quot;23&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;過去三年 EPS 年增&lt;/text&gt;&lt;rect x=&quot;168.0&quot; y=&quot;9&quot; width=&quot;93.7&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;269.7&quot; y=&quot;23&quot; class=&quot;val&quot;&gt;0.8&lt;/text&gt;&lt;text x=&quot;158&quot; y=&quot;63&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;近四季對上一財年&lt;/text&gt;&lt;rect x=&quot;168.0&quot; y=&quot;49&quot; width=&quot;236.1&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;412.1&quot; y=&quot;63&quot; class=&quot;val&quot;&gt;1.9&lt;/text&gt;&lt;text x=&quot;158&quot; y=&quot;103&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;基準情境推估&lt;/text&gt;&lt;rect x=&quot;168.0&quot; y=&quot;89&quot; width=&quot;152.1&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;328.1&quot; y=&quot;103&quot; class=&quot;val&quot;&gt;1.2&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;PEG 與林區加股利比率（可計算的成長口徑）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;成長口徑&lt;/th&gt;&lt;th&gt;成長率&lt;/th&gt;&lt;th&gt;PEG&lt;/th&gt;&lt;th&gt;判讀&lt;/th&gt;&lt;th&gt;加股利比率&lt;/th&gt;&lt;th&gt;判讀&lt;/th&gt;&lt;th&gt;加股東收益率比率（現代延伸）&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;過去三年 EPS 年增&lt;/td&gt;&lt;td&gt;18.2%&lt;/td&gt;&lt;td&gt;0.8&lt;/td&gt;&lt;td&gt;便宜&lt;/td&gt;&lt;td&gt;1.33&lt;/td&gt;&lt;td&gt;普通&lt;/td&gt;&lt;td&gt;1.87&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;近四季對上一財年（申報 EPS）&lt;/td&gt;&lt;td&gt;7.2%&lt;/td&gt;&lt;td&gt;1.9&lt;/td&gt;&lt;td&gt;合理&lt;/td&gt;&lt;td&gt;0.53&lt;/td&gt;&lt;td&gt;差&lt;/td&gt;&lt;td&gt;1.07&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準情境推估（稅後營業利益年增－股數年變化）&lt;/td&gt;&lt;td&gt;11.2%&lt;/td&gt;&lt;td&gt;1.2&lt;/td&gt;&lt;td&gt;合理&lt;/td&gt;&lt;td&gt;0.82&lt;/td&gt;&lt;td&gt;差&lt;/td&gt;&lt;td&gt;1.37&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;加股東收益率比率＝（成長率＋股利殖利率＋淨回購殖利率）÷本益比，把回購也算進股東回饋、並扣掉發給員工的股票；這是現代延伸，不是林區原版，也沒有政策門檻，只列數字。 PEG 用的每股盈餘 17.91 美元：PEG 所用 EPS 為一般會計 EPS，未扣非經常項目，含股權薪酬（近四季淨利每股 18.08、每股股權薪酬 5.14）。&lt;/p&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:4px&quot;&gt;PEG 的判讀標籤依估值政策門檻；高風險、成長極高或極低的公司，PEG 有系統性偏誤（同樣成長下風險越高 PEG 越低），不能只憑標籤判斷便宜或昂貴。&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;林區式資產負債表與市場檢查&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;數值&lt;/th&gt;&lt;th&gt;林區的看法&lt;/th&gt;&lt;th&gt;判讀&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;本益比&lt;/td&gt;&lt;td&gt;13.74&lt;/td&gt;&lt;td&gt;與自身歷史比較&lt;/td&gt;&lt;td&gt;偏便宜：申報 EPS 為 13.7 倍，位於過去五年第 5% 百分位（自身近五年 p25／p75 外才判偏便宜／偏貴）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;每股淨現金&lt;/td&gt;&lt;td&gt;-1.85&lt;/td&gt;&lt;td&gt;淨現金可提供下檔保護（林區 O31、LAK02）&lt;/td&gt;&lt;td&gt;不評好壞：淨負債約每股 1.85 美元，沒有淨現金的下檔保護；占股價 -0.8%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;負債對權益&lt;/td&gt;&lt;td&gt;0.54&lt;/td&gt;&lt;td&gt;一般越低越好（林區 L25）&lt;/td&gt;&lt;td&gt;不評好壞：有息負債約為股東權益的 0.54 倍；沒有公認門檻，償債能力見收現段償債指標&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;每股自由現金流（近四季）&lt;/td&gt;&lt;td&gt;26.29&lt;/td&gt;&lt;td&gt;比每股盈餘更接近現金（林區 O37、修正10）&lt;/td&gt;&lt;td&gt;不評好壞：自由現金流殖利率 10.7%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股數年變化（近三財年）&lt;/td&gt;&lt;td&gt;-3.2%&lt;/td&gt;&lt;td&gt;持續買回、且價格合理、資金來自本業現金時才是好訊號（林區 L16、O19）&lt;/td&gt;&lt;td&gt;好：近三財年平均每年 -3.2%；最近一季對去年同季 -6.7%（2025-08-29→2026-08-28）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;存貨增速 vs 營收增速&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;存貨增速高於營收是警訊（林區 O50）&lt;/td&gt;&lt;td&gt;資料限制：無資料&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;內部人公開市場買進&lt;/td&gt;&lt;td&gt;1&lt;/td&gt;&lt;td&gt;內部人自掏腰包買進是強訊號&lt;/td&gt;&lt;td&gt;好：近期有 1 人自掏腰包買進，依林區屬強訊號&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;林區以外的交叉檢查（只揭露，不改研究評等與價格位置）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;檢查&lt;/th&gt;&lt;th&gt;結果&lt;/th&gt;&lt;th&gt;判讀&lt;/th&gt;&lt;th&gt;依據與限制&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Piotroski F 分數（財報是否在改善）&lt;/td&gt;&lt;td&gt;6 ／ 8 項（2024-11-29→2025-11-28）&lt;/td&gt;&lt;td&gt;中&lt;/td&gt;&lt;td&gt;未通過：長期負債 ÷ 平均總資產比上年低、流動比率比上年高。Piotroski（2000）研究文獻/Piotroski2000_財報訊號.json 第 9–11、15 頁；8–9 分高分組、0–2 分低分組&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Beneish M 分數（盈餘被美化的機率）&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;不適用&lt;/td&gt;&lt;td&gt;缺 銷管費用&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Greenblatt 盈餘殖利率與資本報酬率&lt;/td&gt;&lt;td&gt;盈餘殖利率 9.6%&lt;/td&gt;&lt;td&gt;高於 10 年公債 5.1%&lt;/td&gt;&lt;td&gt;盈餘殖利率＝近四季營業利益 ÷（市值＋有息負債－現金與證券），推導；ROIC 為本專案稅後口徑，非 Greenblatt 原式稅前；不做排名；ROIC 不適用：營運投入資本為負（例如預收款或應付款大於營運資產），投資報酬率無意義，改看自由現金流與增量回報&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;details id=&quot;wp-6&quot;&gt;&lt;summary&gt;6 財務：償債指標、融資活動、存活檢查與利率壓力測試（含判定規則與限制）&lt;/summary&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;融資活動與償債：錢還給誰、有沒有借錢、還不還得起&lt;/h3&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;償債能力指標（利息保障依 Damodaran 合成評等對照；其他沒有公認門檻，只寫事實）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;指標&lt;/th&gt;&lt;th&gt;數值&lt;/th&gt;&lt;th&gt;判讀&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;EBIT ÷ 利息費用&lt;/td&gt;&lt;td&gt;35.66&lt;/td&gt;&lt;td&gt;相當於 AAA 級：本業獲利 EBIT 92.7 億美元，是利息費用 2.6 億美元的 35.7 倍；依 Damodaran 合成評等大型公司對照表（2026 年 1 月；市值 963.1 億美元，在 50 億美元以上）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;（營運現金流＋實付利息）÷ 實付利息&lt;/td&gt;&lt;td&gt;44.75&lt;/td&gt;&lt;td&gt;不評好壞：實付利息 2.5 億美元，營運現金流加回利息後可付約 45 倍&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;有息負債 ÷ EBITDA&lt;/td&gt;&lt;td&gt;0.63&lt;/td&gt;&lt;td&gt;不評好壞：以近四季 EBITDA 100.4 億美元計，約 0.6 年可還清有息負債&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;淨負債 ÷ EBITDA&lt;/td&gt;&lt;td&gt;0.07&lt;/td&gt;&lt;td&gt;不評好壞：扣掉現金後約 0.1 年 EBITDA 可還清&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;營運現金流 ÷ 有息負債&lt;/td&gt;&lt;td&gt;169.8%&lt;/td&gt;&lt;td&gt;不評好壞：一年的營運現金流約可還掉 170% 的有息負債（約 0.6 年還清）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;現金與證券 ÷ 一年內到期債務&lt;/td&gt;&lt;td&gt;3.53&lt;/td&gt;&lt;td&gt;不評好壞：現金與證券是一年內到期債務的 3.5 倍（已核對：資產負債表流動債務 1,597 = 優先票據流動部分 1,349（帳面，面額 1,350）＋商業本票 248（帳面，面額 250）；來源 10-Q 2026-08-28 Part I, Item 1 ¶246、¶259。）&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;有息負債 6,363 = 長期優先票據 4,766 + 流動債務 1,597（推導）；工具原抓 4,766 僅含長期部分，已用公司輸入檔 科目對應.json 修正（long_debt_noncurrent 納入 LongTermDebt），淨現金由原 +873 變為淨負債 724（現金與證券 5,639 - 有息負債 6,363）。；有息負債完整度標『部分缺漏』是因為工具找不到獨立『短期借款』科目；商業本票已包含在流動債務 1,597 內；其他短期借款是否存在未另行核對。；利息保障倍數 35.7（EBIT 9,271÷利息費用 260）、有息負債÷EBITDA 0.63；門檻未經政策核定，只列數字。；信用與存活重跑（2026-11-18，收盤日 2026-11-16，資產負債表日 2026-08-28）：機構評級取自 SEC 全文搜尋 FWP（發行定價文件）2025-01-14 與 2024-04-01，兩份均寫 Moody&amp;#x27;s A1、S&amp;amp;P A+，展望未取得、評級日期早於 10-Q，可能已變；原句存檔於 全文搜尋/信用評級搜尋.json，10-Q／10-K 本身只寫評級變動可能影響債務成本、未寫評級。存活檢查『無明顯警訊』：現金加未動用信貸 7,139 對一年內到期本金 1,600 加利息 260 為 3.8 倍，對兩年內 2,400 加利息 520 為 2.4 倍；利息保障 35.7 倍；+200bp 後 22.4 倍（推導，工具輸出）。利息 260 為近四季逐季加總，非單季年化。&lt;/p&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;可用授信與到期（作者判讀，融資償債判讀.json）：一年內到期債務 1,597 百萬（優先票據流動部分 1,349＋商業本票 248）；現金與短期投資 5,639 百萬；1,500 百萬無擔保循環信貸全數未動用，到 2027-06-30；優先票據無財務契約&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;融資活動現金流：還給股東與借還款（本財年年初至 2026-08-28 累計，10-Q 2026-08-28）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;對象｜分類&lt;/th&gt;&lt;th&gt;金額&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股東｜回購&lt;/td&gt;&lt;td&gt;-68.2 億美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股東｜員工股票代扣稅與相關淨額&lt;/td&gt;&lt;td&gt;-306.0 百萬美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股東小計&lt;/td&gt;&lt;td&gt;-71.3 億美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;債權人｜償還&lt;/td&gt;&lt;td&gt;-250.0 百萬美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;債權人｜借入&lt;/td&gt;&lt;td&gt;493.0 百萬美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;債權人小計&lt;/td&gt;&lt;td&gt;243.0 百萬美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;其他｜庫藏股再發行收入 +262 與其他融資活動淨額 -192（皆為原表列名，MD&amp;amp;A 未細分）&lt;/td&gt;&lt;td&gt;70.0 百萬美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;其他小計&lt;/td&gt;&lt;td&gt;70.0 百萬美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;對照：同期營運現金流&lt;/td&gt;&lt;td&gt;76.5 億美元&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;融資活動是公司與出資人（股東、債權人）之間的現金往來，不等於借款：回購、股利是還給股東，借入、償還才是借款；負數＝現金流出。本表期間與下方借款用途、上方現金流分層（近四季）不同。&lt;/p&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;借款用途（研究判讀）：再融資為主，另有短期商業本票；回購主要由營運現金流支應，借款不是回購的主要資金來源；期間 FY2026 前九個月（2025-11-29～2026-08-28）；依據：10-Q 2026-08-28 Part I, Item 2 ¶155、10-Q 2026-08-28 Part I, Item 2 ¶152、10-Q 2026-08-28 Part I, Item 1 ¶259、10-Q 2026-08-28 Part I, Item 2 ¶142、10-Q 2026-08-28 Part I, Item 2 ¶137&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;survival-detail&quot;&gt;&lt;h3&gt;存活檢查：現金對債務（12～24 個月，推導，非違約預測）&lt;/h3&gt;&lt;p style=&quot;margin:0 0 6px&quot;&gt;&lt;b&gt;信用評級&lt;/b&gt;　機構 Moody&amp;#x27;s A1、S&amp;amp;P A+（SEC 全文搜尋 FWP 2025-01-14 0001193125-25-006212 #0）／推導 AAA（Damodaran 合成評等，利息保障 35.7 倍，推導）｜投資等級（BBB-／Baa3 以上）；推導比機構高 4 級（推導只看利息保障，不含規模、產業與擔保結構，僅供對照）&lt;/p&gt;&lt;p style=&quot;margin:0 0 6px&quot;&gt;&lt;b&gt;存活檢查（完整理由）&lt;/b&gt;　無明顯警訊（推導，非違約預測）：現金加未動用信貸 71 億美元，一年內到期債務 16 億美元（另利息 260.0 百萬美元），可付 3.8 倍；現金加未動用信貸 71 億美元，兩年內到期債務 24 億美元（另利息 520.0 百萬美元），可付 2.4 倍；利息保障 35.7 倍；會計師未提出繼續經營疑慮。&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;燈號：無明顯警訊（一般公司：現金對債務；資料截至 2026-08-28，收盤日 2026-11-16）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;判定&lt;/th&gt;&lt;th&gt;內容與出處&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;會計師繼續經營疑慮&lt;/td&gt;&lt;td&gt;無明顯警訊&lt;/td&gt;&lt;td&gt;會計師與管理層未提出繼續經營疑慮（掃描 10-Q 2026-08-28、10-K 2025-11-28）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;流動性：12 個月&lt;/td&gt;&lt;td&gt;無明顯警訊&lt;/td&gt;&lt;td&gt;現金加未動用信貸 7,139.0，一年內到期本金 1,600.0，加利息 260.0，可付 3.8 倍&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;流動性：24 個月&lt;/td&gt;&lt;td&gt;無明顯警訊&lt;/td&gt;&lt;td&gt;現金加未動用信貸 7,139.0，兩年內到期本金 2,400.0，加利息 520.0，可付 2.4 倍&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;利息保障&lt;/td&gt;&lt;td&gt;無明顯警訊&lt;/td&gt;&lt;td&gt;利息保障 35.7 倍&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Altman Z 分數&lt;/td&gt;&lt;td&gt;輔助（不改燈號）&lt;/td&gt;&lt;td&gt;Altman Z 7.31（安全區，只當輔助）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;回饋股東對自由現金流&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;近四季回購加股利 93 億美元，未超過自由現金流 106 億美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;信用評級（機構）&lt;/td&gt;&lt;td&gt;投資等級&lt;/td&gt;&lt;td&gt;Moody&amp;#x27;s A1（SEC 全文搜尋 FWP 2025-01-14 0001193125-25-006212 #0）；S&amp;amp;P A+（SEC 全文搜尋 FWP 2025-01-14 0001193125-25-006212 #0）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;信用評級（推導）&lt;/td&gt;&lt;td&gt;投資等級&lt;/td&gt;&lt;td&gt;AAA：Damodaran 合成評等 2026 年 1 月（大型公司表），利息保障 35.7 倍（融資償債底稿.json#/償債能力指標）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;機構與推導比對&lt;/td&gt;&lt;td&gt;提示&lt;/td&gt;&lt;td&gt;推導比機構高 4 級（推導只看利息保障，不含規模、產業與擔保結構，僅供對照）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;債券市場參考&lt;/td&gt;&lt;td&gt;信用評級 A&lt;/td&gt;&lt;td&gt;ICE BofA 公司債選擇權調整利差：投資等級整體 0.90 個百分點（2026-11-16，FRED BAMLC0A0CM）；BBB 級 1.12 個百分點（2026-11-16，FRED BAMLC0A4CBBB）；投機等級整體 3.34 個百分點（2026-11-16，FRED BAMLH0A0HYM2）；A 級 0.74 個百分點（2026-11-16，FRED BAMLC0A3CA）；個別債券殖利率與價格未取得（TRACE／FINRA 不在固定來源）&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;作者自債務附註填的近期到期明細（信用揭露.json 近期到期；只到月份時取該月 1 日），一年內至少等於資產負債表一年內到期債務；利息口徑：近四季利息費用（融資償債底稿）；未動用信貸：10-Q 2026-08-28 Part I, Item 2 ¶150（全額未動用；循環信貸期限到 2027-06-30（24 個月存活檢查仍計入全額，不計時約 1.9 倍，燈號不變）；10-Q 風險因素另稱債務工具要求遵守特定契約（Part II, Item 1A ¶117），門檻未揭露，未判契約）&lt;/p&gt;&lt;h3 style=&quot;margin-top:14px&quot;&gt;利率壓力測試（固定情境：利率上升 1、2 個百分點與下降 1 個百分點，不預測聯準會；推導）&lt;/h3&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;單位百萬美元；狀態：已試算&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;浮動利率債利息變動&lt;/th&gt;&lt;th&gt;再融資利息變動&lt;/th&gt;&lt;th&gt;壓力後一年利息&lt;/th&gt;&lt;th&gt;利息保障&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;目前利率（只算再融資）&lt;/td&gt;&lt;td&gt;0.0&lt;/td&gt;&lt;td&gt;51.4&lt;/td&gt;&lt;td&gt;311.4&lt;/td&gt;&lt;td&gt;29.8 倍&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;+1 個百分點&lt;/td&gt;&lt;td&gt;27.0&lt;/td&gt;&lt;td&gt;75.4&lt;/td&gt;&lt;td&gt;362.4&lt;/td&gt;&lt;td&gt;25.6 倍&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;+2 個百分點&lt;/td&gt;&lt;td&gt;54.0&lt;/td&gt;&lt;td&gt;99.4&lt;/td&gt;&lt;td&gt;413.4&lt;/td&gt;&lt;td&gt;22.4 倍&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;−1 個百分點&lt;/td&gt;&lt;td&gt;-27.0&lt;/td&gt;&lt;td&gt;27.4&lt;/td&gt;&lt;td&gt;260.4&lt;/td&gt;&lt;td&gt;35.6 倍&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;目前利率：聯邦基金利率 3.88%（2026-11-13，FRED DFF）、SOFR 3.93%（2026-11-16，FRED SOFR）、十年期公債 5.15%（2026-11-13，FRED DGS10）；估值折現率用的 10 年期公債是 5.12%（2026-11-16，美國財政部），來源與日期不同；浮動利率債 2,700.0，占總債務 42%（10-K 2025-11-28 Item 7A ¶23；10-Q 2026-08-28 Part I, Item 1 ¶142；以利率交換把 27 億美元固定利率票據轉成浮動，SOFR OIS 加固定點數，其餘票據固定利率；公司未給每 100bp 利息變動金額，故以名目 2,700 計；總債務為票據面額 6,150 加商業本票 250）；兩年內到期須再融資本金 2,400.0，原票面 3.75%（作者填票面利率（信用揭露.json 近期到期）），再融資利率 5.89%（10 年期公債 5.15%（2026-11-13）＋ A 級 OAS 0.74 個百分點（機構最低評級），推導）；利息保障基準：利息保障（EBIT÷一年利息），目前 35.7 倍；利率上升 2 個百分點（+200bp，bp＝基點，100bp＝1 個百分點）後低於 1.5 倍才在燈號理由加一條（不改燈號、不改研究評等）；通膨、物價、消費者等間接影響不在此表&lt;/p&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;&lt;a href=&quot;#survival-rules&quot;&gt;判定規則與限制見本節下方&lt;/a&gt;（寫死在程式，不改研究評等）。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;survival-rules&quot;&gt;&lt;h3&gt;存活檢查與利率壓力測試：判定規則與限制&lt;/h3&gt;&lt;p class=&quot;cap&quot;&gt;規則版本：v1.1（2026-11-03 第二輪：加 KBRA、利率壓力測試、首頁精簡；仍只顯示提示、不改研究評等）&lt;/p&gt;&lt;ul class=&quot;cap&quot;&gt;&lt;li&gt;總燈號：各項取最嚴重：任一高風險→高風險；否則任一需留意→需留意；12 個月流動性或繼續經營無法判定→資料不足；其餘→無明顯警訊。Z 分數與推導評級只列理由、不改燈號。&lt;/li&gt;&lt;li&gt;繼續經營：最新年報或其後季報出現會計師或管理層「substantial doubt … going concern」肯定句 → 高風險（否定句、假設句只列出不計）；只出現在前一份年報 → 需留意&lt;/li&gt;&lt;li&gt;流動性_12個月：現金與證券＋未動用信貸 ≥ 一年內到期本金＋一年利息 → 無明顯警訊；不足但加近四季自由現金流（已扣實付利息）後 ≥ 一年內到期本金 → 需留意；仍不足 → 高風險&lt;/li&gt;&lt;li&gt;流動性_24個月：同上改兩年（本金、利息、自由現金流各計兩年）；不足但加兩年自由現金流 ≥ 本金的 50% → 需留意；更低 → 高風險&lt;/li&gt;&lt;li&gt;燒錢：近四季自由現金流為負：現金還能燒幾個月＝（現金與證券＋未動用信貸－一年內到期本金）÷ 每月燒錢；&amp;lt;12 個月 高風險、12～24 個月 需留意&lt;/li&gt;&lt;li&gt;利息保障：EBIT ÷ 利息費用 &amp;lt; 1.5 倍 → 需留意&lt;/li&gt;&lt;li&gt;契約：作者自 信用揭露.json 填公司揭露的契約門檻與實際值：已違反 → 高風險；餘裕 &amp;lt; 15% → 需留意；未揭露不判&lt;/li&gt;&lt;li&gt;信用評級：機構評級（S&amp;amp;P、Moody&amp;#x27;s、Fitch、KBRA，取各機構最新、以最低者判等級）低於 BBB-／Baa3 → 需留意；只有推導評級為投機等級 → 只列理由&lt;/li&gt;&lt;li&gt;利率壓力測試：固定情境 +100bp／+200bp／-100bp（不預測聯準會）：利息增加＝浮動利率債×利率變動（作者填 Item 7A 每 100bp 利息變動時改用該值）＋兩年內到期本金×（再融資利率＋利率變動－原票面利率）；再融資利率＝收盤日 10 年期公債殖利率＋該評級 ICE BofA OAS（推導）；壓力後利息保障＝EBIT÷（一年利息＋利息增加），EBIT 分母異常時改用現金利息保障。+200bp 後低於 1.5 倍 → 理由加一條、首頁也加（只列理由、不改燈號）；浮動利率債未揭露或未填 → 該情境未取得；金融業不套&lt;/li&gt;&lt;li&gt;金融業：銀行券商、保險不套現金對債務：研究評等輸入 監理紅線 低於門檻 → 高風險；高於門檻不到 20%（相對）→ 需留意；未填 → 資料不足&lt;/li&gt;&lt;/ul&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;使用限制&lt;/p&gt;&lt;ul class=&quot;cap&quot;&gt;&lt;li&gt;推導，非違約預測：燈號只看 12～24 個月付不付得出錢與已揭露的警訊，不是違約機率，也不改研究評等（第一版）。&lt;/li&gt;&lt;li&gt;Altman Z 分數會誤判兩類公司：權益為負（如舉債回購）與保留盈餘因長期回購或股利變負，所以只當輔助、不單獨下結論、不改燈號。&lt;/li&gt;&lt;li&gt;金融業（銀行券商、保險）的存款與保單負債是營業資金，改看監理資本（如 CET1），不套現金對債務。&lt;/li&gt;&lt;li&gt;超過 2～3 年的到期與再融資風險留在正文債務到期表，不進燈號。&lt;/li&gt;&lt;li&gt;到期年度桶以到期表資料日（年報）起算：桶的結束日落在窗口內才計入；跨窗口的桶另列，若作者在 信用揭露.json 填了近期到期明細就改用明細。&lt;/li&gt;&lt;li&gt;個別債券價格與殖利率（TRACE／FINRA）不在固定來源：未取得；市場參考只用 FRED 的 ICE BofA 各評級公司債利差（大盤層級）。&lt;/li&gt;&lt;li&gt;機構評級只認公司自己在 SEC 申報寫出的 S&amp;amp;P、Moody&amp;#x27;s、Fitch、KBRA 評級並附原句；沒揭露寫未揭露，不從新聞或記憶補。&lt;/li&gt;&lt;li&gt;利率壓力測試只用固定情境（+100bp、+200bp、−100bp），不預測聯準會；以 10 年期公債估再融資成本，實際年期與擔保結構不同會有誤差；浮動利率債若也在兩年內到期會重複計算（偏保守）；通膨、物價、消費者等間接影響不進燈號；金融業不套，維持看資本適足率。&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/details&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;more&quot; data-layer=&quot;附錄&quot;&gt;&lt;div class=&quot;qno&quot;&gt;附錄&lt;/div&gt;&lt;h2&gt;附錄：估值細節、論點檢查、名詞、表格與資料來源（預設摺疊）&lt;/h2&gt;&lt;details id=&quot;valdetail&quot;&gt;&lt;summary&gt;估值細節：利率、同業與產業對照、券商目標價&lt;/summary&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;券商目標價&lt;/h3&gt;&lt;figure class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;券商目標價範圍對照本報告合理價值與收盤價（美元；yfinance，取得 2026-11-05；第三方看法，只揭露，不是本報告目標價、不進評等）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 150&quot; role=&quot;img&quot; aria-label=&quot;券商目標價&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;230.0&quot; x2=&quot;230.0&quot; y1=&quot;8&quot; y2=&quot;128&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;230.0&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;0&lt;/text&gt;&lt;line x1=&quot;316.7&quot; x2=&quot;316.7&quot; y1=&quot;8&quot; y2=&quot;128&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;316.7&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;200&lt;/text&gt;&lt;line x1=&quot;403.3&quot; x2=&quot;403.3&quot; y1=&quot;8&quot; y2=&quot;128&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;403.3&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;400&lt;/text&gt;&lt;line x1=&quot;490.0&quot; x2=&quot;490.0&quot; y1=&quot;8&quot; y2=&quot;128&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;490.0&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;600&lt;/text&gt;&lt;text x=&quot;220&quot; y=&quot;27&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;券商目標價（最低–最高，點＝平均）&lt;/text&gt;&lt;line x1=&quot;290.7&quot; x2=&quot;391.6&quot; y1=&quot;22&quot; y2=&quot;22&quot; stroke=&quot;var(--c6)&quot; stroke-width=&quot;3&quot; opacity=&quot;.55&quot;/&gt;&lt;circle cx=&quot;346.3&quot; cy=&quot;22&quot; r=&quot;7&quot; fill=&quot;var(--c6)&quot;&gt;&lt;title&gt;券商目標價（最低–最高，點＝平均）：268&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;403.6&quot; y=&quot;27&quot; class=&quot;val&quot;&gt;268&lt;/text&gt;&lt;text x=&quot;220&quot; y=&quot;67&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;本報告合理價值（只含折現率）&lt;/text&gt;&lt;line x1=&quot;345.3&quot; x2=&quot;381.6&quot; y1=&quot;62&quot; y2=&quot;62&quot; stroke=&quot;var(--c1)&quot; stroke-width=&quot;3&quot; opacity=&quot;.55&quot;/&gt;&lt;circle cx=&quot;361.1&quot; cy=&quot;62&quot; r=&quot;7&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;本報告合理價值（只含折現率）：302&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;393.6&quot; y=&quot;67&quot; class=&quot;val&quot;&gt;302&lt;/text&gt;&lt;text x=&quot;220&quot; y=&quot;107&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;收盤價&lt;/text&gt;&lt;circle cx=&quot;336.6&quot; cy=&quot;102&quot; r=&quot;7&quot; fill=&quot;var(--ink)&quot;&gt;&lt;title&gt;收盤價：246&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;348.6&quot; y=&quot;107&quot; class=&quot;val&quot;&gt;246&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;市場怎麼看：券商目標價與它隱含的成長&lt;/h4&gt;&lt;p&gt;33 家券商的平均目標價 268.30 美元（中位 260.00，最低 140.00、最高 373.00）；比 2026-11-16 收盤價 246.00 高約 9%；換成本模型的語言，平均目標價要求未來 5 年營收每年成長約 3%，不高於同規模公司次年成長的 p75（+10.8%）；分析師自己預估明年每股盈餘成長 +12.1%；近 90 天有 16 家調整目標價：上調 9、下調 5、持平 2。&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;券商目標價與隱含成長（yfinance，取得 2026-11-05）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;目標價（美元）&lt;/th&gt;&lt;th&gt;折回今天（推導）&lt;/th&gt;&lt;th&gt;隱含未來 5 年營收年增&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;平均目標價&lt;/td&gt;&lt;td&gt;268.30&lt;/td&gt;&lt;td&gt;243.03&lt;/td&gt;&lt;td&gt;+2.8%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;中位目標價&lt;/td&gt;&lt;td&gt;260.00&lt;/td&gt;&lt;td&gt;235.51&lt;/td&gt;&lt;td&gt;+2.2%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;最低目標價&lt;/td&gt;&lt;td&gt;140.00&lt;/td&gt;&lt;td&gt;126.81&lt;/td&gt;&lt;td&gt;-10.1%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;最高目標價&lt;/td&gt;&lt;td&gt;373.00&lt;/td&gt;&lt;td&gt;337.86&lt;/td&gt;&lt;td&gt;+9.2%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;Nasdaq 共識目標價 260.14（最低 195.00、最高 373.00；買進 5、持有 11、賣出 6）。券商目標價是第三方對 12 個月後股價的看法，多用「預估盈餘 × 主觀本益比」，通常偏樂觀；本區只揭露，不是本報告的目標價、不當證據、不影響估值與研究評等。「折回今天」以股權成本折現（未加回期間股利），「隱含成長」以本報告基準情境的其他假設反推，是用本模型理解他們的價格，不是券商自己的假設（推導）。資料取得時間與本報告收盤日不同。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;利率的影響：公債殖利率變動與股債利差&lt;/h3&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;利率影響中等：10 年期公債殖利率下降 1 個百分點、其他假設不變，合理價值中點從約 302 升到約 346（+14%）；上升 1 個百分點則降到約 268（−11%）。&lt;/strong&gt;股債利差只看相對自身歷史的位置，不影響估值與評等。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;grid2 wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;公債殖利率每變動 1 個百分點，合理價值中點的變化（美元；紅色虛線為現價 246.00）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 500 142&quot; role=&quot;img&quot; aria-label=&quot;利率敏感度&quot;
