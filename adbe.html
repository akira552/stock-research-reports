;/&gt;&lt;text x=&quot;420.0&quot; y=&quot;220&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;10 季&lt;/text&gt;&lt;line x1=&quot;545.0&quot; x2=&quot;545.0&quot; y1=&quot;8&quot; y2=&quot;204&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;545.0&quot; y=&quot;220&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;15 季&lt;/text&gt;&lt;line x1=&quot;395.0&quot; x2=&quot;395.0&quot; y1=&quot;8&quot; y2=&quot;204&quot; stroke=&quot;var(--neg)&quot; stroke-dasharray=&quot;5 4&quot; stroke-width=&quot;1.6&quot;&gt;&lt;title&gt;下行段中位 9 季&lt;/title&gt;&lt;/line&gt;&lt;line x1=&quot;395.0&quot; x2=&quot;395.0&quot; y1=&quot;8&quot; y2=&quot;204&quot; stroke=&quot;var(--pos)&quot; stroke-dasharray=&quot;5 4&quot; stroke-width=&quot;1.6&quot;&gt;&lt;title&gt;上行段中位 9 季&lt;/title&gt;&lt;/line&gt;&lt;text x=&quot;162&quot; y=&quot;23&quot; class=&quot;lb s&quot; text-anchor=&quot;end&quot;&gt;2009-02→2010-03&lt;/text&gt;&lt;rect x=&quot;170&quot; y=&quot;12&quot; width=&quot;100.0&quot; height=&quot;15&quot; rx=&quot;2&quot; fill=&quot;var(--neg)&quot; opacity=&quot;.35&quot;/&gt;&lt;text x=&quot;275.0&quot; y=&quot;24&quot; class=&quot;vl s&quot;&gt;4 季 下行（資料起點，不計）&lt;/text&gt;&lt;text x=&quot;162&quot; y=&quot;47&quot; class=&quot;lb s&quot; text-anchor=&quot;end&quot;&gt;2010-03→2011-06&lt;/text&gt;&lt;rect x=&quot;170&quot; y=&quot;36&quot; width=&quot;125.0&quot; height=&quot;15&quot; rx=&quot;2&quot; fill=&quot;var(--pos)&quot; opacity=&quot;.85&quot;/&gt;&lt;text x=&quot;300.0&quot; y=&quot;48&quot; class=&quot;vl s&quot;&gt;5 季 上行&lt;/text&gt;&lt;text x=&quot;162&quot; y=&quot;71&quot; class=&quot;lb s&quot; text-anchor=&quot;end&quot;&gt;2011-06→2014-08&lt;/text&gt;&lt;rect x=&quot;170&quot; y=&quot;60&quot; width=&quot;325.0&quot; height=&quot;15&quot; rx=&quot;2&quot; fill=&quot;var(--neg)&quot; opacity=&quot;.85&quot;/&gt;&lt;text x=&quot;500.0&quot; y=&quot;72&quot; class=&quot;vl s&quot;&gt;13 季 下行&lt;/text&gt;&lt;text x=&quot;162&quot; y=&quot;95&quot; class=&quot;lb s&quot; text-anchor=&quot;end&quot;&gt;2014-08→2018-08&lt;/text&gt;&lt;rect x=&quot;170&quot; y=&quot;84&quot; width=&quot;400.0&quot; height=&quot;15&quot; rx=&quot;2&quot; fill=&quot;var(--pos)&quot; opacity=&quot;.85&quot;/&gt;&lt;text x=&quot;575.0&quot; y=&quot;96&quot; class=&quot;vl s&quot;&gt;16 季 上行&lt;/text&gt;&lt;text x=&quot;162&quot; y=&quot;119&quot; class=&quot;lb s&quot; text-anchor=&quot;end&quot;&gt;2018-08→2019-08&lt;/text&gt;&lt;rect x=&quot;170&quot; y=&quot;108&quot; width=&quot;100.0&quot; height=&quot;15&quot; rx=&quot;2&quot; fill=&quot;var(--neg)&quot; opacity=&quot;.85&quot;/&gt;&lt;text x=&quot;275.0&quot; y=&quot;120&quot; class=&quot;vl s&quot;&gt;4 季 下行&lt;/text&gt;&lt;text x=&quot;162&quot; y=&quot;143&quot; class=&quot;lb s&quot; text-anchor=&quot;end&quot;&gt;2019-08→2021-12&lt;/text&gt;&lt;rect x=&quot;170&quot; y=&quot;132&quot; width=&quot;225.0&quot; height=&quot;15&quot; rx=&quot;2&quot; fill=&quot;var(--pos)&quot; opacity=&quot;.85&quot;/&gt;&lt;text x=&quot;400.0&quot; y=&quot;144&quot; class=&quot;vl s&quot;&gt;9 季 上行&lt;/text&gt;&lt;text x=&quot;162&quot; y=&quot;167&quot; class=&quot;lb s&quot; text-anchor=&quot;end&quot;&gt;2021-12→2024-03&lt;/text&gt;&lt;rect x=&quot;170&quot; y=&quot;156&quot; width=&quot;225.0&quot; height=&quot;15&quot; rx=&quot;2&quot; fill=&quot;var(--neg)&quot; opacity=&quot;.85&quot;/&gt;&lt;text x=&quot;400.0&quot; y=&quot;168&quot; class=&quot;vl s&quot;&gt;9 季 下行&lt;/text&gt;&lt;text x=&quot;162&quot; y=&quot;191&quot; class=&quot;lb s&quot; text-anchor=&quot;end&quot;&gt;目前（2024-03 起）&lt;/text&gt;&lt;rect x=&quot;170&quot; y=&quot;180&quot; width=&quot;250.0&quot; height=&quot;15&quot; rx=&quot;2&quot; fill=&quot;var(--pos)&quot; opacity=&quot;.85&quot; stroke=&quot;var(--ink)&quot; stroke-width=&quot;1.5&quot; stroke-dasharray=&quot;3 2&quot;/&gt;&lt;text x=&quot;425.0&quot; y=&quot;192&quot; class=&quot;vl s&quot;&gt;10 季 上行&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;lg&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--neg)&quot;&gt;&lt;/i&gt;下行段&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--pos)&quot;&gt;&lt;/i&gt;上行段&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--ink)&quot;&gt;&lt;/i&gt;目前這一段（虛框，尚未結束）&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;每條是兩個轉折之間的一段有多長；虛線是歷史中位（下行 9 季、上行 9 季）。拿目前這段的長度對照中位，看走到哪；淡色段的起點是資料起點，不計入統計。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估底稿.json#/週期/營業利益率_近四季（之字形門檻 2%）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;p class=&quot;lead&quot;&gt;近四季營業利益率轉折：峰 2009-02（27.6%）、谷 2010-03（21.9%）、峰 2011-06（28.8%）、谷 2014-08（9.5%）、峰 2018-08（32.3%）、谷 2019-08（28.4%）、峰 2021-12（36.8%）、谷 2024-03（29.9%）；目前 上行。&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;近四季營收年增的轉折：2011 年 3 月峰 31.5%、2013 年 11 月谷 −7.9%、2018 年 3 月峰 25.1%、2020 年 11 月谷 15.2%、2021 年 12 月峰 22.7%；之後最低 2023 年 9 月 9.9%，最新 12.0%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src62&quot;&gt;[62]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src64&quot;&gt;[64]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;2013 年的谷是改賣訂閱的轉換期，2020–2021 年的峰是疫情需求，這些轉折主要是公司事件，不是一般景氣循環。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src62&quot;&gt;[62]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src52&quot;&gt;[52]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;工具判定目前仍屬 2021 年 12 月峰之後的下行段（19 季），因為 2023 年 9 月以來只回升約 2.2 個百分點，未達 5 個百分點的確認門檻；實際上 2023 財年起增速一直在 10%～12% 的平台。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src64&quot;&gt;[64]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src54&quot;&gt;[54]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;2024 財年認列 Figma 併購終止費 10 億美元；2024 年 3 月那一季營業利益 9.07 億美元，前一季 17.43 億、後一季 18.85 億，近四季營業利益率在該季落到谷底 30.0%；之後四季（2024 年 5 月至 2025 年 2 月）單季營業利益率 34.9%～37.9%，但近四季值在 2024 年 5 月、8 月、11 月三季仍是 30.5%～31.4%（終止費仍在近四季視窗內），要到 2025 年 2 月那一季終止費滾出視窗才回到 36.3%，之後在 35.7%～36.7% 之間。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src53&quot;&gt;[53]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src54&quot;&gt;[54]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src63&quot;&gt;[63]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;該季營業利益比前後季少 8.4 億～9.8 億美元（推算），與 10 億終止費相當，所以 30.0% 的谷應是這筆一次性費用造成；加回 10 億後該季近四季營業利益率約 35.0%（推算：69.71÷199.36 億），不是景氣或經營轉折。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src54&quot;&gt;[54]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src53&quot;&gt;[53]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;h3&gt;② 訂單能見度&lt;/h3&gt;&lt;p class=&quot;s&quot;&gt;RPO 221.6 億美元，約為最近一季營收的 3.3 季；不含部分企業承諾款，約 67% 預計在 12 個月內認列。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src65&quot;&gt;[65]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src66&quot;&gt;[66]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;RPO 增速由 2025 財年末 13% 降到 8%，未來一年要認列的合約增速低於目前營收增速。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src25&quot;&gt;[25]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src24&quot;&gt;[24]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;公司第四季營收目標 68.0 億～68.5 億美元，對去年同季 61.94 億約年增 9.8%～10.6%（推算）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src61&quot;&gt;[61]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src54&quot;&gt;[54]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;h3&gt;③ 公司特有週期&lt;/h3&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;Semrush 2026-04-28 併入，2027 財年第二至第三季滿一年，屆時營收年增少掉這塊併購貢獻。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src8&quot;&gt;[8]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src16&quot;&gt;[16]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;執行長 2026-12-01 交接給內部的 Anil Chakravarthy，財務長由代理；Citi 分析師報告點出新執行長上任時財務長與數位媒體主管仍空缺，並看淡 2027 財年展望。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src67&quot;&gt;[67]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src68&quot;&gt;[68]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src46&quot;&gt;[46]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/section&gt;&lt;section id=&quot;s6&quot;&gt;&lt;h2&gt;7　觀察清單：下季要看什麼&lt;/h2&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;觀察清單：目前值離改判門檻多遠&lt;/figcaption&gt;&lt;div class=&quot;wg&quot;&gt;&lt;div class=&quot;wgt&quot;&gt;&lt;b&gt;RPO 增速減營收增速&lt;/b&gt;&lt;span&gt;維持條件：RPO增速減營收增速 &amp;gt;= -5.0%&lt;/span&gt;&lt;/div&gt;&lt;svg viewBox=&quot;0 0 680 60&quot; role=&quot;img&quot; aria-label=&quot;RPO 增速減營收增速&quot;&gt;&lt;rect x=&quot;89.2&quot; y=&quot;14&quot; width=&quot;576.8&quot; height=&quot;20&quot; fill=&quot;var(--pos)&quot; opacity=&quot;.12&quot;/&gt;&lt;line x1=&quot;14.0&quot; x2=&quot;666.0&quot; y1=&quot;24&quot; y2=&quot;24&quot; stroke=&quot;var(--line)&quot; stroke-width=&quot;2&quot;/&gt;&lt;line x1=&quot;89.2&quot; x2=&quot;89.2&quot; y1=&quot;8&quot; y2=&quot;40&quot; stroke=&quot;var(--ink)&quot; stroke-dasharray=&quot;4 3&quot; stroke-width=&quot;1.6&quot;/&gt;&lt;text x=&quot;89.2&quot; y=&quot;54&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;門檻 -5.0%&lt;/text&gt;&lt;circle cx=&quot;590.8&quot; cy=&quot;24&quot; r=&quot;7&quot; fill=&quot;var(--pos)&quot;/&gt;&lt;text x=&quot;590.8&quot; y=&quot;9&quot; class=&quot;vl s&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--pos)&quot;&gt;目前 -3.6%&lt;/text&gt;&lt;/svg&gt;&lt;/div&gt;&lt;div class=&quot;wg&quot;&gt;&lt;div class=&quot;wgt&quot;&gt;&lt;b&gt;單季營收年增&lt;/b&gt;&lt;span&gt;維持條件：營收單季年增 &amp;gt;= 8.0%&lt;/span&gt;&lt;/div&gt;&lt;svg viewBox=&quot;0 0 680 60&quot; role=&quot;img&quot; aria-label=&quot;單季營收年增&quot;&gt;&lt;rect x=&quot;365.9&quot; y=&quot;14&quot; width=&quot;300.1&quot; height=&quot;20&quot; fill=&quot;var(--pos)&quot; opacity=&quot;.12&quot;/&gt;&lt;line x1=&quot;14.0&quot; x2=&quot;666.0&quot; y1=&quot;24&quot; y2=&quot;24&quot; stroke=&quot;var(--line)&quot; stroke-width=&quot;2&quot;/&gt;&lt;line x1=&quot;365.9&quot; x2=&quot;365.9&quot; y1=&quot;8&quot; y2=&quot;40&quot; stroke=&quot;var(--ink)&quot; stroke-dasharray=&quot;4 3&quot; stroke-width=&quot;1.6&quot;/&gt;&lt;text x=&quot;365.9&quot; y=&quot;54&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;門檻 8.0%&lt;/text&gt;&lt;circle cx=&quot;581.0&quot; cy=&quot;24&quot; r=&quot;7&quot; fill=&quot;var(--pos)&quot;/&gt;&lt;text x=&quot;581.0&quot; y=&quot;9&quot; class=&quot;vl s&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--pos)&quot;&gt;目前 12.9%&lt;/text&gt;&lt;/svg&gt;&lt;/div&gt;&lt;div class=&quot;wg&quot;&gt;&lt;div class=&quot;wgt&quot;&gt;&lt;b&gt;近四季營業利益率&lt;/b&gt;&lt;span&gt;維持條件：營業利益率_近四季 &amp;gt;= 33.0%&lt;/span&gt;&lt;/div&gt;&lt;svg viewBox=&quot;0 0 680 60&quot; role=&quot;img&quot; aria-label=&quot;近四季營業利益率&quot;&gt;&lt;rect x=&quot;538.1&quot; y=&quot;14&quot; width=&quot;127.9&quot; height=&quot;20&quot; fill=&quot;var(--pos)&quot; opacity=&quot;.12&quot;/&gt;&lt;line x1=&quot;14.0&quot; x2=&quot;666.0&quot; y1=&quot;24&quot; y2=&quot;24&quot; stroke=&quot;var(--line)&quot; stroke-width=&quot;2&quot;/&gt;&lt;line x1=&quot;538.1&quot; x2=&quot;538.1&quot; y1=&quot;8&quot; y2=&quot;40&quot; stroke=&quot;var(--ink)&quot; stroke-dasharray=&quot;4 3&quot; stroke-width=&quot;1.6&quot;/&gt;&lt;text x=&quot;538.1&quot; y=&quot;54&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;門檻 33.0%&lt;/text&gt;&lt;circle cx=&quot;581.0&quot; cy=&quot;24&quot; r=&quot;7&quot; fill=&quot;var(--pos)&quot;/&gt;&lt;text x=&quot;581.0&quot; y=&quot;9&quot; class=&quot;vl s&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--pos)&quot;&gt;目前 35.7%&lt;/text&gt;&lt;/svg&gt;&lt;/div&gt;&lt;div class=&quot;lg&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--pos)&quot;&gt;&lt;/i&gt;仍在維持條件內&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--neg)&quot;&gt;&lt;/i&gt;已越過門檻&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;只畫能自動對照的觀察項（有檢驗鍵與門檻）：淡綠帶是維持目前判斷的範圍，虛線是門檻，圓點是底稿最新值；越過門檻就照表中「改判方向」重看。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估.json#/內容/觀察清單（檢驗鍵、比較、門檻）＋商業評估底稿.json#/指標（目前值）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;div class=&quot;cards&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;商業專業與消費者客戶群訂閱收入年增&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;人工對照&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;目前值&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;2026 財年第三季 19.05 億美元、年增 16%（固定匯率 15%）&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src9&quot;&gt;[9]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src69&quot;&gt;[69]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;看什麼&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;入門端（Acrobat 個人方案、Express）有沒有被 Google Pics、Canva 等免費 AI 工具吃掉&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;改判方向&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;若連兩季年增低於 10%，則入門端替代的卡點成形，卡點風險與成長動能降分&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;RPO 增速減營收增速&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;自動對照&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;目前值&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;−3.6 個百分點（RPO 年增 8.4%，近四季營收年增 12.0%）&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src3&quot;&gt;[3]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;看什麼&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;合約積壓是否持續落後營收&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;改判方向&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;若差距擴大到 −5 個百分點以下，則未來營收增速下移的機率升高，週期位置降分&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;單季營收年增&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;自動對照&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;目前值&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;2026-08-28 季 12.9%（前三季 10.5%、12.0%、12.7%）&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src70&quot;&gt;[70]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;看什麼&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;Semrush 滿一年後的內生成長&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;改判方向&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;若單季年增低於 8%，則成長平台下移一階，成長動能降分&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;近四季營業利益率&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;自動對照&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;目前值&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;35.7%（近 20 季 30.0%～36.8%）&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src49&quot;&gt;[49]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;看什麼&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;AI 運算成本與價格較低方案是否壓縮利潤率&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;改判方向&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;若低於 33%，則模式穩固度需重看&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;正式財務長與數位媒體主管任命&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;人工對照&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;目前值&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;財務長自 2026-06 起由 Steven Day 代理；創意與生產力事業總裁 2026-09-27 卸任&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src68&quot;&gt;[68]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src71&quot;&gt;[71]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;看什麼&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;新執行長上任後的管理層補齊與 2027 財年策略&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;改判方向&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;若2027 財年上半年仍未任命正式財務長或數位媒體主管，則說法可信度與卡點風險重看&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;h3&gt;推論紀錄（下一季財報後自動對照）&lt;/h3&gt;&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;推論&lt;/th&gt;&lt;th&gt;方法&lt;/th&gt;&lt;th&gt;檢驗指標&lt;/th&gt;&lt;th&gt;條件&lt;/th&gt;&lt;th&gt;基準季&lt;/th&gt;&lt;th&gt;檢驗時點&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;P1&lt;/td&gt;&lt;td&gt;2026 財年第四季（至 2026-11-27）單季營收年增不低於 9%（公司目標下緣約 9.8%）&lt;/td&gt;&lt;td&gt;公司特有&lt;/td&gt;&lt;td&gt;營收單季年增&lt;/td&gt;&lt;td&gt;&amp;gt;= 0.09&lt;/td&gt;&lt;td&gt;2026-08-28&lt;/td&gt;&lt;td&gt;2026 財年 10-K（約 2027 年 1 月）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;P2&lt;/td&gt;&lt;td&gt;2027 財年第三季（至 2027-08-27）單季營收年增低於 11%（Semrush 滿一年、併購貢獻消失）&lt;/td&gt;&lt;td&gt;公司特有&lt;/td&gt;&lt;td&gt;營收單季年增&lt;/td&gt;&lt;td&gt;&amp;lt; 0.11&lt;/td&gt;&lt;td&gt;2026-08-28&lt;/td&gt;&lt;td&gt;2027 財年第三季 10-Q（約 2027 年 9–10 月）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;P3&lt;/td&gt;&lt;td&gt;近四季營業利益率維持在 33% 以上（扣一次性費用後近 20 季都在 35% 上下）&lt;/td&gt;&lt;td&gt;自身歷史&lt;/td&gt;&lt;td&gt;營業利益率_近四季&lt;/td&gt;&lt;td&gt;&amp;gt;= 0.33&lt;/td&gt;&lt;td&gt;2026-08-28&lt;/td&gt;&lt;td&gt;2026 財年 10-K 起每季（約 2027 年 1 月起）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;P4&lt;/td&gt;&lt;td&gt;2026 財年末 RPO 增速仍低於近四季營收增速（合約積壓放緩延續）&lt;/td&gt;&lt;td&gt;訂單能見度&lt;/td&gt;&lt;td&gt;RPO增速減營收增速&lt;/td&gt;&lt;td&gt;&amp;lt; 0.0&lt;/td&gt;&lt;td&gt;2026-08-28&lt;/td&gt;&lt;td&gt;2026 財年 10-K（約 2027 年 1 月）&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;lead&quot;&gt;每條推論從檢驗期末起，每個新季度記一筆命中或落空（預測帳本，公司資料夾 商業評估檢驗.json）；方法準確度跨公司統計見 優化/商業評估預測帳本.json。&lt;/p&gt;&lt;/section&gt;&lt;section id=&quot;sg&quot;&gt;&lt;h2&gt;商業動能明細&lt;span class=&quot;ruleok&quot;&gt;評分規則第一版，2026-11-07 使用者核定&lt;/span&gt;&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;五個面向各 1–5 分，相對同產業卡同業評比；機械建議分由工具依同業位置、卡住訊號與驗證比例算出，作者可調整但要寫理由。加權分 3.65 → B 級。等級門檻：A ≥ 4.2、B ≥ 3.5、C ≥ 2.8、D ≥ 2.1、其餘 E。&lt;/p&gt;&lt;div class=&quot;cards&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;模式穩固度&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;權重 &lt;span class=&quot;num&quot;&gt;25%&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;fs&quot;&gt;&lt;span&gt;作者分 &lt;span class=&quot;num v&quot;&gt;5&lt;/span&gt;&lt;/span&gt;&lt;span&gt;機械建議 &lt;span class=&quot;num&quot;&gt;5&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;近四季營業利益率同業百分位 1.0&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;理由&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;近四季營業利益率 35.7%，同業百分位 1.0；訂閱占營收 96% 以上，沒有客戶占營收 10% 以上，營運投入資本為負。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src13&quot;&gt;[13]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src10&quot;&gt;[10]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src58&quot;&gt;[58]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;同業對照&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;同業營業利益率：INTU 28.8%、ADSK 27.9%、CRM 21.5%、WDAY 12.0%、NOW 9.7%（yfinance 口徑，截止日 2026-07-31 至 2026-09-30）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src72&quot;&gt;[72]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;成長動能&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;權重 &lt;span class=&quot;num&quot;&gt;25%&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;fs&quot;&gt;&lt;span&gt;作者分 &lt;span class=&quot;num v&quot;&gt;3&lt;/span&gt;&lt;/span&gt;&lt;span&gt;機械建議 &lt;span class=&quot;num&quot;&gt;3&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;最近一季營收年增同業百分位 0.4（yfinance 口徑）&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;理由&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;最新一季營收年增 12.9%，同業百分位 0.4；其中含 Semrush 併購貢獻，第四季目標對應年增約 10%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src73&quot;&gt;[73]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src61&quot;&gt;[61]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;AI 優先產品成長快但基數小，內生成長大致維持在一成，與機械建議分一致。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src23&quot;&gt;[23]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src32&quot;&gt;[32]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;同業對照&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;同業最新一季營收年增：NOW 20.5%、ADSK 16.1%、INTU 13.7%、WDAY 12.8%、CRM 10.8%；Adobe 12.9% 居中。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src73&quot;&gt;[73]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;卡點風險&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;權重 &lt;span class=&quot;num&quot;&gt;20%&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;fs&quot;&gt;&lt;span&gt;作者分 &lt;span class=&quot;num v&quot;&gt;3&lt;/span&gt;&lt;/span&gt;&lt;span&gt;機械建議 &lt;span class=&quot;num&quot;&gt;4&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;計分採用的亮燈 1 條（S2）；資料未取得 2 條&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;理由&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;機械訊號亮 1 條（RPO 跟不上營收，計分採用）；淨收入留存率與付費客戶數未揭露，兩條作者訊號無法判定。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src74&quot;&gt;[74]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src27&quot;&gt;[27]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;機械建議 4 分，作者給 3 分：訊號外還有入門端被免費 AI 工具替代、管理層換手（執行長交接、財務長代理、創意事業總裁卸任）兩個卡點，且留存與付費客戶兩條訊號因未揭露而看不到。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src4&quot;&gt;[4]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src40&quot;&gt;[40]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src67&quot;&gt;[67]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src68&quot;&gt;[68]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;同業對照&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;同業的資本支出占營收：CRM 1.4%，Adobe 0.8%，卡點不在資本投入而在入門端用戶與合約積壓。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src75&quot;&gt;[75]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src57&quot;&gt;[57]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-待查&quot;&gt;待查&lt;/span&gt;待查：CRM、INTU、ADSK、NOW、WDAY 尚未做商業評估，卡住訊號亮燈數無法逐條對照。&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;週期位置&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;權重 &lt;span class=&quot;num&quot;&gt;15%&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;fs&quot;&gt;&lt;span&gt;作者分 &lt;span class=&quot;num v&quot;&gt;3&lt;/span&gt;&lt;/span&gt;&lt;span&gt;機械建議 &lt;span class=&quot;num&quot;&gt;3&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;營收近四季年增目前下行，距最近轉折 19 季；歷史下行段中位 11.0 季&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;理由&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;工具判定營收近四季年增仍在 2021 年峰之後的下行段（19 季，歷史下行段中位 11 季）；近四季營業利益率在 2024 年谷之後的上行段（10 季）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src64&quot;&gt;[64]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src76&quot;&gt;[76]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;增速實際在 10%～12% 平台、近四季略升，但第四季目標與 Semrush 滿一年指向回落，位置居中，與機械建議分一致。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src54&quot;&gt;[54]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src61&quot;&gt;[61]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;同業對照&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;同業中 NOW（20.5%）、ADSK（16.1%）最新一季增速高於 Adobe，CRM（10.8%）低於 Adobe。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src73&quot;&gt;[73]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-待查&quot;&gt;待查&lt;/span&gt;待查：同業尚未做商業評估，各自的週期轉折無法對照。&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;說法可信度&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;權重 &lt;span class=&quot;num&quot;&gt;15%&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;fs&quot;&gt;&lt;span&gt;作者分 &lt;span class=&quot;num v&quot;&gt;4&lt;/span&gt;&lt;/span&gt;&lt;span&gt;機械建議 &lt;span class=&quot;num&quot;&gt;4&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;已判定 3 條，驗證比例 0.67&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;理由&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;說的 vs 做的 4 條：已驗證 1、部分支持 2、待查 1（分部合併口徑）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src5&quot;&gt;[5]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src18&quot;&gt;[18]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src15&quot;&gt;[15]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;財務目標兌現且上修，但分部合併減少揭露、免費增值轉付費沒有數字，所以不給滿分。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src19&quot;&gt;[19]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src15&quot;&gt;[15]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;同業對照&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;Autodesk 10-K 把 Adobe 列為主要全球競爭者，與 Adobe 自述的專業工具地位一致。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src36&quot;&gt;[36]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-待查&quot;&gt;待查&lt;/span&gt;待查：同業尚未做商業評估，說的 vs 做的驗證比例無法對照。&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;相對同業：成長與利潤率&lt;/figcaption&gt;&lt;svg viewBox=&quot;0 0 680 300&quot; role=&quot;img&quot; aria-label=&quot;同業位置：營收年增與營業利益率&quot;&gt;&lt;line x1=&quot;56.0&quot; x2=&quot;56.0&quot; y1=&quot;16&quot; y2=&quot;260&quot; class=&quot;zl&quot;/&gt;&lt;text x=&quot;56.0&quot; y=&quot;276&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;0%&lt;/text&gt;&lt;line x1=&quot;174.8&quot; x2=&quot;174.8&quot; y1=&quot;16&quot; y2=&quot;260&qu
