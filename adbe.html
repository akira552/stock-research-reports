.8&quot; x2=&quot;381.8&quot; y1=&quot;283&quot; y2=&quot;305&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;3&quot;/&gt;&lt;text x=&quot;438.9&quot; y=&quot;298&quot; class=&quot;ax&quot;&gt;391–549&lt;/text&gt;&lt;line x1=&quot;243.7&quot; x2=&quot;243.7&quot; y1=&quot;26&quot; y2=&quot;332&quot; class=&quot;price&quot;/&gt;&lt;text x=&quot;243.7&quot; y=&quot;18&quot; class=&quot;pricelab&quot; text-anchor=&quot;middle&quot;&gt;市價 246.00&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c1)&quot;&gt;&lt;/i&gt;現金流折現&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c2)&quot;&gt;&lt;/i&gt;自身歷史&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c3)&quot;&gt;&lt;/i&gt;同業比較&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--neg)&quot;&gt;&lt;/i&gt;目前市價&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;scenario-plain&quot;&gt;&lt;h3&gt;合理價值怎麼來：三個情境&lt;/h3&gt;&lt;p&gt;合理價值是三個情境每股價值的加權：中點 302.48 美元，換不同折現率重算後的區間 266.04–349.81 美元；買入上限 241.99 美元是中點再打 20% 安全邊際折扣（股價在此以下才有這個安全邊際）。情境表說明合理價值怎麼組成，不是單一目標價；非買賣建議。&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt&quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;每股價值（美元）&lt;/th&gt;&lt;th&gt;權重&lt;/th&gt;&lt;th&gt;這個情境假設什麼&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;169.04&lt;/td&gt;&lt;td&gt;25%&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;營收年增 +7.0% 逐步到 +3.0%；營業利益率 33.0%，長期 23.0%；之後每年成長 2.5%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;301.63&lt;/td&gt;&lt;td&gt;50%&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;營收年增 +10.0% 逐步到 +6.0%；營業利益率 35.0%，長期 35.0%；之後每年成長 2.5%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;437.64&lt;/td&gt;&lt;td&gt;25%&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;營收年增 +14.0% 逐步到 +10.0%；營業利益率 36.0%，長期 39.0%；之後每年成長 2.5%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class= 2=&quot;490.0&quot; y1=&quot;8&quot; y2=&quot;128&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;490.0&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;40 倍&lt;/text&gt;&lt;rect x=&quot;276.1&quot; y=&quot;11&quot; width=&quot;178.2&quot; height=&quot;22&quot; rx=&quot;4&quot; fill=&quot;var(--line)&quot;&gt;&lt;title&gt;Software (System &amp;amp; Application) 參考帶 p25–p75（機械回測樣本，非市場全體；分產業的筆數與公司數少，僅供參考）&lt;/title&gt;&lt;/rect&gt;&lt;line x1=&quot;342.0&quot; x2=&quot;342.0&quot; y1=&quot;11&quot; y2=&quot;33&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;170&quot; y=&quot;27&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;參考帶（Software (Sy&lt;/text&gt;&lt;text x=&quot;462.4&quot; y=&quot;27&quot; class=&quot;val&quot;&gt;12 倍–35 倍&lt;/text&gt;&lt;text x=&quot;170&quot; y=&quot;67&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;模型假設（第 15 年）&lt;/text&gt;&lt;circle cx=&quot;246.0&quot; cy=&quot;62&quot; r=&quot;7&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;模型假設（第 15 年）：9 倍&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;258.0&quot; y=&quot;67&quot; class=&quot;val&quot;&gt;9 倍&lt;/text&gt;&lt;text x=&quot;170&quot; y=&quot;107&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;市價隱含（第 15 年）&lt;/text&gt;&lt;line x1=&quot;198.4&quot; x2=&quot;223.8&quot; y1=&quot;102&quot; y2=&quot;102&quot; stroke=&quot;var(--neg)&quot; stroke-width=&quot;3&quot; opacity=&quot;.55&quot;/&gt;&lt;circle cx=&quot;210.1&quot; cy=&quot;102&quot; r=&quot;7&quot; fill=&quot;var(--neg)&quot;&gt;&lt;title&gt;市價隱含（第 15 年）：4 倍&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;235.8&quot; y=&quot;107&quot; class=&quot;val&quot;&gt;4 倍&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;p&gt;&lt;b&gt;成長端：&lt;/b&gt;市價要求未來 5 年營收年增約 4.1%（折現率高低 1.9%～6.1%），低於模型基準 5 年平均 8.0%、低於過去（2015–2025）實績 17.4%。&lt;/p&gt;&lt;p&gt;&lt;b&gt;倍數端：&lt;/b&gt;市價隱含第 15 年 EV/EBIT 約 3.9 倍，低於模型 8.5 倍，低於Software (System &amp;amp; Application)參考帶 p25–p75（12.4–35.4 倍）。&lt;/p&gt;&lt;p&gt;成功幾率（歷史基準比率）：模型基準 10 年實質年增 4.5%，同規模（營收 250 億美元以上）公司歷史上做到的比例 65%（歷史基準比率，非預測）。&lt;/p&gt;&lt;p class=&quot;cap&quot;&gt;兩端是同一條「模型價值＝市價」換不同未知數反解，方向必然一致，不是兩個獨立證據；幅度才有資訊。只描述，不進研究評等、不改價格位置與合理價值，不是目標價，非買賣建議。成長性四問細表、三視角反推、長期倍數條件（算法與完整表見&lt;a href=&quot;#wp-5&quot;&gt;計算底稿 5&lt;/a&gt;）。&lt;/p&gt;&lt;div class=&quot;note-box&quot;&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:14px&quot;&gt;營收成長：實績 vs 本報告假設 vs 市價要求&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;營收年增&lt;/th&gt;&lt;th&gt;期間或出處&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;FY2023&lt;/td&gt;&lt;td&gt;+10.2%&lt;/td&gt;&lt;td&gt;財務歷史&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;FY2024&lt;/td&gt;&lt;td&gt;+10.8%&lt;/td&gt;&lt;td&gt;財務歷史&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;FY2025&lt;/td&gt;&lt;td&gt;+10.5%&lt;/td&gt;&lt;td&gt;財務歷史&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;三年年均（FY2022→FY2025）&lt;/td&gt;&lt;td&gt;+10.5%&lt;/td&gt;&lt;td&gt;推算&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;近四季合計對去年同期&lt;/td&gt;&lt;td&gt;+12.0%&lt;/td&gt;&lt;td&gt;2025-08-30～2026-08-28（FY2025 Q4＋FY2026 Q1–Q3）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;FY2026 Q1／Q2／Q3 對去年同季&lt;/td&gt;&lt;td&gt;+12.0%／+12.7%／+12.9%&lt;/td&gt;&lt;td&gt;財務歷史&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Q4 指引中點對去年同季&lt;/td&gt;&lt;td&gt;約 +10.2%（推算；扣 Semrush 約 +8.2%）&lt;/td&gt;&lt;td&gt;8-K 2026-09-10 新聞稿 §6&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;本報告基準情境&lt;/td&gt;&lt;td&gt;第 1 年 +10%（含 Semrush 補滿全年約 1.2 個百分點，內生約 8.8%，推算），5 年遞減到 +6%&lt;/td&gt;&lt;td&gt;估值輸入&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;市價要求（基準折現率 10.1%）&lt;/td&gt;&lt;td&gt;未來 5 年每年約 +4.1%（市價反推未來 5 年營收年增；市價 246.00 美元、收盤 2026-11-16；折現率 10.10%；推導）（或成長照基準時長期利潤率約 29.2%（市價反推第 1 年起每年固定的營業利益率，含穩態；市價 246.00 美元、收盤 2026-11-16；折現率 10.10%；推導），兩者擇一）&lt;/td&gt;&lt;td&gt;估值結果 市價反推&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;市價要求（低／高折現率）&lt;/td&gt;&lt;td&gt;約 +1.9%（市價反推未來 5 年營收年增；市價 246.00 美元、收盤 2026-11-16；折現率 9.10%；推導）／+6.1%（市價反推未來 5 年營收年增；市價 246.00 美元、收盤 2026-11-16；折現率 11.10%；推導）&lt;/td&gt;&lt;td&gt;估值結果 市價反推&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p&gt;要撐住現價，市場等於要求未來 5 年營收每年成長約 4.1%（換折現率高低兩端約 1.9% 到 6.1%）。這個要求在同規模公司的歷史上屬「一般」。現價未高於合理價值上緣，下表只描述市場面，不代表有溢價。&lt;/p&gt;&lt;p class=&quot;cap&quot;&gt;三視角反推、假設對照實績、歷史基準比率與市價溢價來源（算法與完整表見&lt;a href=&quot;#wp-5&quot;&gt;計算底稿 5&lt;/a&gt;）。&lt;/p&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;作者的計算核對、方法限制與口徑說明：「三個情境怎麼設（作者判斷）」、「此方法在本工作流的實例驗證」（算法與完整表見&lt;a href=&quot;#wp-5&quot;&gt;計算底稿 5&lt;/a&gt;）。&lt;/p&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;白話說&lt;/b&gt;如果你在 246.00 美元 買進，市價只要求營收每年長約 4.1%（市價反推未來 5 年營收年增；市價 246.00 美元、收盤 2026-11-16；折現率 10.10%；推導）；公司過去三年每年長約一成。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;要留意&lt;/b&gt;約 34% 價值來自終值，利率與長期利潤率假設一變動，合理價值就跟著動，見改判訊號。&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;value&quot;&gt;&lt;div class=&quot;qno&quot;&gt;價值判斷&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;價值判斷：用彼得林奇的方法再看一次&lt;/div&gt;&lt;h2&gt;穩定成長股，本益比在自身歷史低檔，PEG（本益比對成長比）屬合理&lt;/h2&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;林區分類&lt;/b&gt;穩定成長股；兼具高現金流的大型訂閱軟體；市場以 AI 取代風險定價，倍數接近歷史低檔（近四季 GAAP P/E 13.7，收盤 2026-11-16；近 5 年 p25 22.9，歷史本益比 2026-11-05 計算）&lt;br&gt;穩定成長股要問：本益比相對成長率與自身歷史是否合理、成長能否維持、有沒有過度多角化或併購稀釋；適合在價格回到合理時持有，不期待數倍報酬。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;研究評等&lt;/b&gt;&lt;span style=&quot;font-size:20px;font-weight:700&quot;&gt;生意品質一流 ／ 價格偏低（低於市場常態）&lt;/span&gt;&lt;br&gt;生意品質依五項證據評定；價格位置三級（買入區、合理、偏貴），依買入上限與合理價值高端判斷，同業與歷史倍數只作交叉核對。非買賣建議。&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;林區分類為穩定成長股：近三個財年營收每年增約一成。&lt;/strong&gt;近四季本益比 13.7 倍（一般會計 EPS，每股盈餘，未扣非經常 17.91 美元；收盤 2026-11-16），低於近五年 p25 約 22.9 倍、接近最低約 11.1 倍（歷史本益比，2026-11-05 計算），可能反映市場用很低倍數定價 AI 取代風險（主張 ADBE-C06）。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;&lt;a class=&quot;term&quot; href=&quot;#g15&quot;&gt;PEG&lt;/a&gt; 三種口徑結論不同：過去三年每股盈餘年增 18.2% 時 0.75 便宜；近四季對上一財年 +7.2% 時 1.90；基準情境推估 11.2% 時 1.22 合理。&lt;/strong&gt;過去三年受回購推升，不以「便宜」下結論。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;PEG 所用每股盈餘 17.91 是一般會計近四季稀釋口徑，一次性項目兩邊都未扣。&lt;/strong&gt;損失面：商譽減損 70、或有損失 92、併購費用 25 百萬&lt;span class=&quot;src&quot;&gt;（前九個月稅前合計 187 百萬，約每股 0.46 美元，推算；10-Q Item 1 ¶264）&lt;/span&gt;。收益面：FY2026 全年預估投資淨利益每股 0.04 美元&lt;span class=&quot;src&quot;&gt;（8-K 2026-09-10 新聞稿 §20）&lt;/span&gt;。公司只給合計稅務調整，逐項稅後影響未揭露，不調整。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;資產負債表與內部人沒有警訊：淨負債小、利息保障約 36 倍。&lt;/strong&gt;董事 Ricks 2026-06-25 公開市場買進 10,000 股；執行長 Narayen 2026-09-16 賣出 125,000 股，申報未標示 10b5-1（預設交易計畫）計畫，不推測動機。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;grid2 wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;現金與證券 vs 有息負債（億美元），上方為淨現金&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 300&quot; role=&quot;img&quot; aria-label=&quot;資產負債&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;266.0&quot; y2=&quot;266.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;270.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;0.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;205.5&quot; y2=&quot;205.5&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;209.5&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;25.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;145.0&quot; y2=&quot;145.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;149.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;50.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;84.5&quot; y2=&quot;84.5&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;88.5&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;75.0&lt;/text&gt;&lt;lin ect&gt;&lt;text x=&quot;357.0&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY25&lt;/text&gt;&lt;text x=&quot;357.0&quot; y=&quot;16.0&quot; class=&quot;note&quot; text-anchor=&quot;middle&quot;&gt;淨 3.9&lt;/text&gt;&lt;rect x=&quot;436.3&quot; y=&quot;129.5&quot; width=&quot;40.7&quot; height=&quot;136.5&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;現金與證券 2026-08：56.4&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;479.0&quot; y=&quot;112.0&quot; width=&quot;40.7&quot; height=&quot;154.0&quot; rx=&quot;2&quot; fill=&quot;var(--c5)&quot;&gt;&lt;title&gt;有息負債 2026-08：63.6&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;479.0&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;2026-08&lt;/text&gt;&lt;text x=&quot;479.0&quot; y=&quot;16.0&quot; class=&quot;note&quot; text-anchor=&quot;middle&quot;&gt;淨 -7.2&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c1)&quot;&gt;&lt;/i&gt;現金與證券&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c5)&quot;&gt;&lt;/i&gt;有息負債&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;近 6 個月內部人公開市場買賣（百萬美元）；綠色為買進&lt;/p&gt;&lt;svg viewBox=&quot;0 0 500 142&quot; role=&quot;img&quot; aria-label=&quot;內部人&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;182.0&quot; x2=&quot;182.0&quot; y1=&quot;6&quot; y2=&quot;136&quot; class=&quot;zero&quot;/&gt;&lt;text x=&quot;172&quot; y=&quot;23&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;Ricks（買進）&lt;/text&gt;&lt;rect x=&quot;182.0&quot; y=&quot;9&quot; width=&quot;14.7&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c1)&quot;/&gt;&lt;text x=&quot;204.7&quot; y=&quot;23&quot; class=&quot;val&quot;&gt;1.9&lt;/text&gt;&lt;text x=&quot;172&quot; y=&quot;63&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;Narayen（非計畫賣出）&lt;/text&gt;&lt;rect x=&quot;182.0&quot; y=&quot;49&quot; width=&quot;236.4&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--neg)&quot;/&gt;&lt;text x=&quot;426.4&quot; y=&quot;63&quot; class=&quot;val&quot;&gt;31&lt;/text&gt;&lt;text x=&quot;172&quot; y=&quot;103&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;Forusz（非計畫賣出）&lt;/text&gt;&lt;rect x=&quot;182.0&quot; y=&quot;89&quot; width=&quot;2.0&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--neg)&quot;/&gt;&lt;text x=&quot;190.8&quot; y=&quot;103&quot; class=&quot;val&quot;&gt;0.1&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;生意品質：A（規則：無「弱」且至少三項「強」＝A）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;評等&lt;/th&gt;&lt;th&gt;理由&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;護城河&lt;/td&gt;&lt;td&gt;中&lt;/td&gt;&lt;td&gt;專業工作流程與檔案格式的轉換成本是主要來源，近四季毛利率 89.3%、客戶預付使營運投入資本為負；其他公司申報把 Adobe 列為主要對手或整合平台。但續約率、席次與價格未揭露，入門端有生成式 AI 工具替代壓力（新聞 N2、N7），維持中（主張 ADBE-C01、ADBE-C10；見護城河與成長故事）。 2026-11-18 估值段依改善規格 v2 雙鑰匙：鑰匙一（不含商譽本業 ROIC 近五年 5/5 年高於 WACC）通過、鑰匙二（留存率或轉換成本的外部量化）未通過＝窄（評等換算中）；證據段若取得留存或轉換成本的第三方證據再升寬。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;投入資本報酬與增量回報&lt;/td&gt;&lt;td&gt;強&lt;/td&gt;&lt;td&gt;財務投入資本口徑 ROIC 近五年中位約 44%，遠高於 WACC 約 10%；研發資本化後結論不翻轉。營運投入資本為負，增量 ROIC 不適用，Semrush 回報未知（主張 ADBE-C02；見第二題）。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;自由現金流品質&lt;/td&gt;&lt;td&gt;強&lt;/td&gt;&lt;td&gt;近四季自由現金流 10,592 為淨利的 1.45 倍，扣股權薪酬後仍高於淨利；主因遞延收入預收（主張 ADBE-C03；見第三・四題）。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;資產負債表&lt;/td&gt;&lt;td&gt;強&lt;/td&gt;&lt;td&gt;淨負債 724、利息保障約 36 倍，循環信貸未動用、票據無財務契約（主張 ADBE-C07；見第六題）。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;治理與資本配置&lt;/td&gt;&lt;td&gt;中&lt;/td&gt;&lt;td&gt;資本配置佳：回購由營運現金流支應，Q3 均價約 235（推算）低於前三季約 261，股數三年每年減約 3%（主張 ADBE-C08；見第三・四題）。治理有中度變動：CEO 交接、正式 CFO 未見、ROSCA（線上購物者信心恢復法）和解金額未揭露、私人集體訴訟恢復（主張 ADBE-C09；見第六、七題）。&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;PEG 三口徑、林區資產負債表檢查與 F 分數等交叉檢查（算法與完整表見&lt;a href=&quot;#wp-value&quot;&gt;計算底稿 價值判斷&lt;/a&gt;）。&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;capital&quot;&gt;&lt;div class=&quot;qno&quot;&gt;問題 06&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;管理層怎麼用錢、怎麼管資產？&lt;/div&gt;&lt;h2&gt;錢主要拿去回購，借款只做再融資，管理層正在換手&lt;/h2&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;錢主要回到股東手上：近四季營運現金流 10,806 百萬美元，扣資本支出與回購後剩約 1,297 百萬&lt;span class=&quot;src&quot;&gt;（推算，近四季現金流量表加總）&lt;/span&gt;，再扣併購與員工代扣稅後缺口約 663 百萬，由現金支應；借款以再融資與商業本票為主（主張 ADBE-C07）。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;近四季營運現金流的去向（億美元）：第一列為營運現金流，往下逐項扣除，最後一列為剩餘或缺口；缺口由手上現金或借款支應；同期淨借款 2.4 億美元（短債淨變化依申報原表確認為零），不列入上方扣項&lt;/p&gt;&lt;svg viewBox=&quot;0 0 500 258&quot; role=&quot;img&quot; aria-label=&quot;資金去向&quot; class=&quot;chart&quot; style=&quot;max-width:650px&quot;&gt;&lt;line x1=&quot;175.9&quot; x2=&quot;175.9&quot; y1=&quot;6&quot; y2=&quot;254&quot; class=&quot;zero&quot;/&gt;&lt;text x=&quot;140&quot; y=&quot;37.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;近四季營運現金流&lt;/text&gt;&lt;rect x=&quot;175.9&quot; y=&quot;22.0&quot; width=&quot;249.5&quot; height=&quot;20&quot; rx=&quot;4&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;近四季營運現金流：108&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;433.4&quot; y=&quot;37.0&quot; class=&quot;val&quot;&gt;108&lt;/text&gt;&lt;line x1=&quot;425.4&quot; x2=&quot;425.4&quot; y1=&quot;42.0&quot; y2=&quot;62.0&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;1&quot; stroke-dasharray=&quot;2 3&quot;/&gt;&lt;text x=&quot;140&quot; y=&quot;77.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;回購&lt;/text&gt;&lt;rect x=&quot;210.8&quot; y=&quot;62.0&quot; width=&quot;214.6&quot; height=&quot;20&quot; rx=&quot;4&quot; fill=&quot;var(--c2)&quot;&gt;&lt;title&gt;回購：−93.0&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;433.4&quot; y=&quot;77.0&quot; class=&quot;val&quot;&gt;−93.0&l lt;td&gt;57%&lt;/td&gt;&lt;td&gt;-1.2%&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2021&lt;/td&gt;&lt;td&gt;148&lt;/td&gt;&lt;td&gt;34.4%&lt;/td&gt;&lt;td&gt;30.76&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;39.5&lt;/td&gt;&lt;td&gt;57%&lt;/td&gt;&lt;td&gt;-0.9%&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2022&lt;/td&gt;&lt;td&gt;141&lt;/td&gt;&lt;td&gt;33.0%&lt;/td&gt;&lt;td&gt;29.84&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;65.5&lt;/td&gt;&lt;td&gt;89%&lt;/td&gt;&lt;td&gt;-2.1%&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2023&lt;/td&gt;&lt;td&gt;165&lt;/td&gt;&lt;td&gt;35.5%&lt;/td&gt;&lt;td&gt;35.98&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;44.0&lt;/td&gt;&lt;td&gt;63%&lt;/td&gt;&lt;td&gt;-2.5%&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2024&lt;/td&gt;&lt;td&gt;141&lt;/td&gt;&lt;td&gt;36.3%&lt;/td&gt;&lt;td&gt;31.37&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;95.0&lt;/td&gt;&lt;td&gt;121%&lt;/td&gt;&lt;td&gt;-2.0%&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2025&lt;/td&gt;&lt;td&gt;116&lt;/td&gt;&lt;td&gt;55.4%&lt;/td&gt;&lt;td&gt;27.22&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;113&lt;/td&gt;&lt;td&gt;115%&lt;/td&gt;&lt;td&gt;-5.0%&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;長期財務.json（股東權益、稀釋股數〔分割調整〕、總資產；每股帳面＝股東權益 ÷ 稀釋股數，推導；股利支付、回購、營運現金流、資本支出在財務歷史.json 沒有該年時用）；產業指標.json 逐年（ROE）；財務歷史.json annual（股利、回購、營運現金流、資本支出）。用到：財務歷史、長期財務。ROE 註記門檻：ROE 高於 60% 或股東權益 ÷ 總資產低於 10%；近三年回購合計達當年股東權益 50% 以上才歸因於回購。（股利＋回購）÷ 年底市值：專案沒有逐年年底市值資料，不列該欄。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;capital-plain&quot;&gt;&lt;h3&gt;融資與償債：還不還得起&lt;/h3&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;b&gt;信用評級&lt;/b&gt;　機構 Moody&amp;#x27;s A1、S&amp;amp;P A+（SEC 全文搜尋 FWP 2025-01-14 0001193125-25-006212 #0）／推導 AAA（Damodaran 合成評等，利息保障 35.7 倍，推導）｜投資等級（BBB-／Baa3 以上）；推導比機構高 4 級（推導只看利息保障，不含規模、產業與擔保結構，僅供對照）&lt;/p&gt;&lt;p&gt;&lt;b&gt;存活檢查（12～24 個月，推導，非違約預測）&lt;/b&gt;　無明顯警訊（推導，非違約預測）：現金加未動用信貸 71 億美元，一年內到期債務 16 億美元（另利息 260.0 百萬美元），可付 3.8 倍；現金加未動用信貸 71 億美元，兩年內到期債務 24 億美元（另利息 520.0 百萬美元），可付 2.4 倍；利息保障 35.7 倍；會計師未提出繼續經營疑慮。&lt;/p&gt;&lt;p&gt;&lt;b&gt;利率壓力測試&lt;/b&gt;　+200bp 後利息保障 22.4 倍（目前 35.7 倍，推導）&lt;/p&gt;&lt;p&gt;&lt;b&gt;借款用途&lt;/b&gt;　再融資為主，另有短期商業本票；回購主要由營運現金流支應，借款不是回購的主要資金來源&lt;/p&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;償債指標、融資活動表、存活檢查明細與利率壓力測試（算法與完整表見&lt;a href=&quot;#wp-6&quot;&gt;計算底稿 6&lt;/a&gt;）。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;survival-charts&quot;&gt;&lt;h3&gt;存活檢查與利率壓力測試（圖）&lt;/h3&gt;&lt;div class=&quot;grid2 wide&quot;&gt;&lt;figure class=figure&gt;&lt;p class=cap&gt;存活檢查（12～24 個月）：手上的錢對到期債務加利息（億美元；可付 3.8 倍／2.4 倍；燈號 無明顯警訊；資料截至 2026-08-28；信用與存活.json；推導，非違約預測）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 500 222&quot; role=&quot;img&quot; aria-label=&quot;存活檢查&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;223.0&quot; x2=&quot;223.0&quot; y1=&quot;6&quot; y2=&quot;216&quot; class=&quot;zero&quot;/&gt;&lt;text x=&quot;213&quot; y=&quot;23&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;現金與流動證券&lt;/text&gt;&lt;rect x=&quot;223.0&quot; y=&quot;9&quot; width=&quot;106.0&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c1)&quot;/&gt;&lt;text x=&quot;337.0&quot; y=&quot;23&quot; class=&quot;val&quot;&gt;56.4&lt;/text&gt;&lt;text x=&quot;213&quot; y=&quot;63&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;未動用信貸&lt;/text&gt;&lt;rect x=&quot;223.0&quot; y=&quot;49&quot; width=&quot;28.2&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c1)&quot;/&gt;&lt;text x=&quot;259.2&quot; y=&quot;63&quot; class=&quot;val&quot;&gt;15.0&lt;/text&gt;&lt;text x=&quot;213&quot; y=&quot;103&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;12 個月要付：本金＋利息&lt;/text&gt;&lt;rect x=&quot;223.0&quot; y=&quot;89&quot; width=&quot;35.0&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--neg)&quot;/&gt;&lt;text x=&quot;266.0&quot; y=&quot;103&quot; class=&quot;val&quot;&gt;18.6&lt;/text&gt;&lt;text x=&quot;213&quot; y=&quot;143&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;24 個月要付：本金＋兩年利息&lt;/text&gt;&lt;rect x=&quot;223.0&quot; y=&quot;129&quot; width=&quot;54.9&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--neg)&quot;/&gt;&lt;text x=&quot;285.9&quot; y=&quot;143&quot; class=&quot;val&quot;&gt;29.2&lt;/text&gt;&lt;text x=&quot;213&quot; y=&quot;183&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;近四季自由現金流&lt;/text&gt;&lt;rect x=&quot;223.0&quot; y=&quot;169&quot; width=&quot;199.1&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;430.1&quot; y=&quot;183&quot; class=&quot;val&quot;&gt;106&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;figure class=figure&gt;&lt;p class=cap&gt;利率壓力測試：各固定情境下的利息保障（倍；紅色虛線 1.5 倍＝提示門檻；不預測聯準會；推導）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 500 222&quot; role=&quot;img&quot; aria-label=&quot;利率壓力測試&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;183.0&quot; x2=&quot;183.0&quot; y1=&quot;6&quot; y2=&quot;216&quot; class=&quot;zero&quot;/&gt;&lt;line x1=&quot;192.9&quot; x2=&quot;192.9&quot; y1=&quot;4&quot; y2=&quot;218&quot; class=&quot;price&quot;/&gt;&lt;text x=&quot;173&quot; y=&quot;23&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;目前&lt;/text&gt;&lt;rect x=&quot;183.0&quot; y=&quot;9&quot; width=&quot;235.5&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c1)&quot;/&gt;&lt;text x=&quot;426.5&quot; y=&quot;23&quot; class=&quot;val&quot;&gt;35.7 倍&lt;/text&gt;&lt;text x=&quot;173&quot; y=&quot;63&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;目前利率（只算再融資）&lt;/text&gt;&lt;rect x=&quot;183.0&quot; y=&quot;49&quot; width=&quot;196.6&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c1)&quot;/&gt;&lt;text x=&quot;387.6&quot; y=&quot;63&quot; class=&quot;val&quot;&gt;29.8 倍&lt;/text&gt;&lt;text x=&quot;173&quot; y=&quot;103&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;利率 +1 個百分點&lt;/text&gt;&lt;rect x=&quot;183.0&quot; y=&quot;89&quot; width=&quot;168.9&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c1)&quot;/&gt;&lt;text x=&quot;359.9&quot; y=&quot;103&quot; class=&quot;val&quot;&gt;25.6 倍&lt;/text&gt;&lt;text x=&quot;173&quot; y=&quot;143&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;利率 +2 個百分點&lt;/text&gt;&lt;rect x=&quot;183.0&quot; y=&quot;129&quot; width=&quot;148.1&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c1)&quot;/&gt;&lt;text x=&quot;339.1&quot; y=&quot;143&quot; class=&quot;val&quot;&gt;22.4 倍&lt;/text&gt;&lt;text x=&quot;173&quot; y=&quot;183&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;利率 −1 個百分點&lt;/text&gt;&lt;rect x=&quot;183.0&quot; y=&quot;169&quot; width=&quot;235.1&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c1)&quot;/&gt;&lt;text x=&quot;426.1&quot; y=&quot;183&quot; class=&quot;val&quot;&gt;35.6 倍&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;燈號規則寫死在程式（信用與存活.py）：現金＋未動用信貸要能付 12 個月本金與利息，否則看自由現金流；利率上升 2 個百分點後利息保障低於 1.5 倍才加一條理由。只顯示、不改研究評等；明細表、規則與限制（算法與完整表見&lt;a href=&quot;#wp-6&quot;&gt;計算底稿 6&lt;/a&gt;）。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;財務管理&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;資本結構穩健：2026-08-28 有息負債 6,363 百萬美元，現金與短期投資 5,639 百萬美元，淨負債 724 百萬美元；一年內到期 1,597 百萬，是 2027 年 2、4 月票據加商業本票，現金約 3.5 倍覆蓋。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;1,500 百萬循環信貸全額未動用，票據無財務契約&lt;span class=&quot;src&quot;&gt;（10-Q Part I, Item 2 ¶148、¶152）&lt;/span&gt;；部分票據以利率交換轉成浮動&lt;span class=&quot;src&quot;&gt;（10-Q Part I, Item 1 ¶248）&lt;/span&gt;。&lt;/strong&gt;利息保障約 35.7 倍；利率壓力：+200bp（基點，0.01 個百分點）後利息保障 22.4 倍&lt;span class=&quot;src&quot;&gt;（目前 35.7 倍，推導）&lt;/span&gt;。信用評級 機構穆迪（Moody&amp;#x27;s） A1、標普（S&amp;amp;P） A+（SEC 全文搜尋 FWP 2025-01-14 0001193125-25-006212 #0）｜投資等級；出自 2025-01-14 發行文件，展望未取得、可能過時，推導評級只作對照。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;figure&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt signals&quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;數值&lt;/th&gt;&lt;th&gt;期間&lt;/th&gt;&lt;th&gt;出處&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;有息負債&lt;/td&gt;&lt;td&gt;6,363 百萬美元&lt;/td&gt;&lt;td&gt;2026-08-28&lt;/td&gt;&lt;td&gt;融資償債底稿&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;淨負債&lt;/td&gt;&lt;td&gt;724 百萬美元&lt;/td&gt;&lt;td&gt;2026-08-28&lt;/td&gt;&lt;td&gt;融資償債底稿&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;一年內到期債務&lt;/td&gt;&lt;td&gt;1,597 百萬美元（票據 1,349＋商業本票 248）&lt;/td&gt;&lt;td&gt;2026-08-28&lt;/td&gt;&lt;td&gt;10-Q Part I, Item 1 ¶246、¶259&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;利息保障（營業利益÷利息費用）&lt;/td&gt;&lt;td&gt;約 35.7 倍&lt;/td&gt;&lt;td&gt;近四季&lt;/td&gt;&lt;td&gt;融資償債底稿&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;有息負債÷EBITDA（稅息折舊攤銷前利益）&lt;/td&gt;&lt;td&gt;0.63 倍&lt;/td&gt;&lt;td&gt;近四季&lt;/td&gt;&lt;td&gt;融資償債底稿&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;近四季借還款淨額&lt;/td&gt;&lt;td&gt;淨借入 243 百萬美元&lt;/td&gt;&lt;td&gt;近四季&lt;/td&gt;&lt;td&gt;融資償債底稿&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;資產變化&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;主要資產變化都有解釋：商譽從 FY2025 底 12,857 增到 14,037 百萬美元，來自 Semrush 收購&lt;span class=&quot;src&quot;&gt;（10-Q Part I, Item 1 ¶88）&lt;/span&gt;；應收帳款年減 0.6%、遞延收入年增 11.1%，與營收同向。&lt;/p&gt;&lt;p&gt;唯一偏離是應付帳款：從 337 增到 529 百萬美元、年增約 57%，遠快於近四季營收的 12.0%；公司沒直接說明，Q3 單季訂閱成本年增 24%（前九個月 17%）主因託管與資料中心&lt;span class=&quot;src&quot;&gt;（10-Q Part I, Item 2 ¶71、¶77）&lt;/span&gt;，屬部分解釋，追蹤條件見改判訊號。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;figure&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt signals&quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;期初→期末（百萬美元）&lt;/th&gt;&lt;th&gt;變化&lt;/th&gt;&lt;th&gt;同期營收（近四季對前四季，與餘額同為 2025-08-29→2026-08-28）&lt;/th&gt;&lt;th&gt;判讀&lt;/th&gt;&lt;th&gt;出處&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;應收帳款&lt;/td&gt;&lt;td&gt;2,093→2,081&lt;/td&gt;&lt;td&gt;−0.6%&lt;/td&gt;&lt;td&gt;+12.0%&lt;/td&gt;&lt;td class=&quot;st-正常&quot;&gt;正常&lt;/td&gt;&lt;td&gt;財務指標 資產變化訊號&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;遞延收入&lt;/td&gt;&lt;td&gt;6,385→7,094&lt;/td&gt;&lt;td&gt;+11.1%&lt;/td&gt;&lt;td&gt;+12.0%&lt;/td&gt;&lt;td class=&quot;st-正常&quot;&gt;正常&lt;/td&gt;&lt;td&gt;財務指標 資產變化訊號&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;應付帳款&lt;/td&gt;&lt;td&gt;337→529&lt;/td&gt;&lt;td&gt;+57.0%&lt;/td&gt;&lt;td&gt;+12.0%&lt;/td&gt;&lt;td class=&quot;st-部分解釋&quot;&gt;部分解釋&lt;/td&gt;&lt;td&gt;10-Q Part I, Item 2 ¶77（訂閱成本）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;商譽&lt;/td&gt;&lt;td&gt;12,857→14,037（FY2025 底→Q3）&lt;/td&gt;&lt;td&gt;+9.2%&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td class=&quot;st-已解釋&quot;&gt;已解釋&lt;/td&gt;&lt;td&gt;10-Q Part I, Item 1 ¶88&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;公司內部治理&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;董事會獨立性高：11 位候選人中 10 位獨立，設獨立首席董事，有追回機制。&lt;/strong&gt;但年度獎金看營收與&lt;a class=&quot;term&quot; href=&quot;#g18&quot;&gt;非 GAAP&lt;/a&gt; 每股盈餘，長期績效股看相對股東總報酬與淨新增銷售，沒有資本報酬指標。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;實際結果偏弱：FY2020 底投入 100 美元，到 FY2025 底剩 67.11 美元，同業指數 187.96；CEO 實際支付薪酬 FY2025 為負 17.39 百萬美元，薪酬約為員工中位數 217 倍&lt;span class=&quot;src&quot;&gt;（推算）&lt;/span&gt;。&lt;/strong&gt;股東投票支持率未取得。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;figure&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt signals&quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;內容&lt;/th&gt;&lt;th&gt;出處&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;董事長與執行長&lt;/td&gt;&lt;td&gt;Narayen 兼任；2026-12-01 起轉執行董事長，Chakravarthy 任執行長&lt;/td&gt;&lt;td&gt;8-K 2026-09-08&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;年度獎金指標&lt;/td&gt;&lt;td&gt;營收、非 GAAP 每股盈餘；FY2025 發放 104%&lt;/td&gt;&lt;td&gt;委託書&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;CEO 總薪酬／實際支付&lt;/td&gt;&lt;td&gt;51.17／−17.39 百萬美元（FY2025）&lt;/td&gt;&lt;td&gt;委託書薪酬與績效表&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;五年股東總報酬&lt;/td&gt;&lt;td&gt;100→67.11；同業指數 187.96&lt;/td&gt;&lt;td&gt;委託書薪酬與績效表&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股東投票支持率&lt;/td&gt;&lt;td&gt;未取得&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;業務治理&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;FY2026 起只剩單一分部，各業務利潤率不再分開揭露；依賴第三方雲端與資料中心，AI 推論成本正推升訂閱成本（見供應鏈段）。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;法規風險在訂閱取消做法：美國司法部 &lt;a class=&quot;term&quot; href=&quot;#g19&quot;&gt;ROSCA&lt;/a&gt; 訴訟 2026-03 和解撤案，私人集體訴訟 2026-09 被法院恢復（新聞 N5）。&lt;/strong&gt;前九個月或有損失 92 百萬含此和解，未拆分&lt;span class=&quot;src&quot;&gt;（10-Q Part I, Item 1 ¶229、¶264；Part I, Item 2 ¶97）&lt;/span&gt;。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;figure&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt signals&quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;內容&lt;/th&gt;&lt;th&gt;出處&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;分部&lt;/td&gt;&lt;td&gt;FY2026 起三分部合併為單一分部&lt;/td&gt;&lt;td&gt;10-Q Part I, Item 1 ¶262&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;ROSCA 政府訴訟&lt;/td&gt;&lt;td&gt;2026-03-12 和解、03-13 撤案；個別金額未揭露（前九個月或有損失 92 百萬含此和解，未拆分）&lt;/td&gt;&lt;td&gt;10-Q Part I, Item 1 ¶229、¶264；Part I, Item 2 ¶97&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;私人集體訴訟&lt;/td&gt;&lt;td&gt;2026-09 恢復；禁制令與返還利得請求被駁回&lt;/td&gt;&lt;td&gt;新聞 N5&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;證券集體訴訟（In Re Adobe Inc. Securities Litigation）&lt;/td&gt;&lt;td&gt;2023-10 起訴，進度見原文&lt;/td&gt;&lt;td&gt;10-Q Part I, Item 1 ¶230&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;白話說&lt;/b&gt;每 100 美元營運現金流，約 2 美元做資本支出、86 美元回購，剩約 12 美元，再被併購與代扣稅用完。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;要留意&lt;/b&gt;應付帳款年增約 57%，遠快於營收，公司只部分說明，見改判訊號。&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;events&quot;&gt;&lt;div class=&quot;qno&quot;&gt;問題 07&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;近半年發生了什麼重大事件？&lt;/div&gt;&lt;h2&gt;CEO 交接、CFO 代理，財報上修、新品發布&lt;/h2&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;最重要的是管理層換手：CFO Durn 2026-06-15 離職，由 Steven Day（2006 年加入 Adobe）代理；Chakravarthy 將於 2026-12-01 接任 CEO，Narayen 轉任執行董事長；創意事業總裁 Wadhwani 09-27 卸任，正式 CFO 仍未見。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;營運面是好消息：Q3 營收創新高並上修全年目標&lt;span class=&quot;src&quot;&gt;（8-K 2026-09-10）&lt;/span&gt;，Topaz Labs（影像與影片畫質增強 AI 公司）併購已完成；11 月 MAX 大會推出可讓第三方 AI 代理操作 Photoshop 的連接器（新聞 N10）。&lt;/strong&gt;反方是花旗（Citi）降評（意見，新聞 N8）與黑五新用戶折扣擴大（新聞 N12）。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;8-K 與重大公告（2026-06 至 2026-11）&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;近 6 個月的 8-K 與重大公告，金額與日期以原文為準。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;figure&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt signals&quot;&gt;&lt;tr&gt;&lt;th&gt;日期&lt;/th&gt;&lt;th&gt;類型&lt;/th&gt;&lt;th&gt;事件&lt;/th&gt;&lt;th&gt;對判斷的影響&lt;/th&gt;&lt;th&gt;出處&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2026-06-11&lt;/td&gt;&lt;td&gt;8-K 2.02、5.02&lt;/td&gt;&lt;td&gt;Q2 財報；CFO Durn 辭任，Steven Day 代理&lt;/td&gt;&lt;td&gt;資本配置政策待正式 CFO&lt;/td&gt;&lt;td&gt;8-K 2026-06-11 本文 §27&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2026-07-17&lt;/td&gt;&lt;td&gt;8-K 5.02&lt;/td&gt;&lt;td&gt;法務長 Pentland 留任協議（遣散與加速歸屬條件）&lt;/td&gt;&lt;td&gt;留任關鍵主管，影響小&lt;/td&gt;&lt;td&gt;8-K 2026-07-17 本文 §3&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2026-09-08&lt;/td&gt;&lt;td&gt;8-K 5.02、7.01&lt;/td&gt;&lt;td&gt;Chakravarthy 12-01 接任 CEO；創意事業總裁 Wadhwani 09-27 卸任&lt;/td&gt;&lt;td&gt;內部交接，執行風險列入治理&lt;/td&gt;&lt;td&gt;8-K 2026-09-08 本文 §3、§5&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2026-09-10&lt;/td&gt;&lt;td&gt;8-K 2.02&lt;/td&gt;&lt;td&gt;Q3 營收 6,760 百萬美元創新高；上修全年目標；Q4 指引 6,800–6,850 百萬&lt;/td&gt;&lt;td&gt;支持基準首年 +10%&lt;/td&gt;&lt;td&gt;8-K 2026-09-10 新聞稿 §3、§6&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2026-09-23&lt;/td&gt;&lt;td&gt;公司公告&lt;/td&gt;&lt;td&gt;06-24 簽約、09-23 完成收購 Topaz Labs，約 340 百萬美元&lt;/td&gt;&lt;td&gt;小型補強，營收貢獻待 FY2026 10-K&lt;/td&gt;&lt;td&gt;10-Q Part I, Item 1 ¶216；Adobe 官方部落格 2026-09-23&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2026-11-09&lt;/td&gt;&lt;td&gt;公司新聞稿&lt;/td&gt;&lt;td&gt;與迪士尼簽多年策略聯盟&lt;/td&gt;&lt;td&gt;質性背景，金額未揭露&lt;/td&gt;&lt;td&gt;新聞 N11&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2026-11-10&lt;/td&gt;&lt;td&gt;公司新聞稿&lt;/td&gt;&lt;td&gt;Adobe MAX 2026：第三方 AI 連接器、本機 MCP 整合預覽&lt;/td&gt;&lt;td&gt;產品面支持，無營收數字&lt;/td&gt;&lt;td&gt;新聞 N10&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;白話說&lt;/b&gt;就像一家老店換店長：招牌菜（訂閱軟體）照賣、營收還在長，但新店長要用多少錢回購、併購，要等正式財務長到任才知道。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;要留意&lt;/b&gt;新執行長 2026-12 上任後的首次指引與資本配置政策可能改變判斷，見改判訊號。&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;news&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;近期新聞查證&lt;/p&gt;&lt;h3&gt;十二則新聞：實績與新品是公司說法，降評與折扣是反方&lt;/h3&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;12 則相關新聞讀原文並對回 8-K、10-Q，引句都找到原文，下表依比重列 5 則。&lt;/strong&gt;支持面多是公司事實與產品發布（Q3 財報、MAX 大會、迪士尼聯盟）；反方面是 Citi 降評、HSBC（滙豐，券商研究部門）轉趨審慎、Google Pics（Google 的 AI 設計工具）與 Canva AI 2.0（Canva 的 AI 設計功能）、黑五折扣擴大、私人集體訴訟恢復。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;付費或轉址受限的報導讀不到，未引用，反方可能被低估；券商評等與目標價是意見，不作證據。&lt;/strong&gt;AI 優先產品 ARR 約 650 百萬是媒體轉述。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;新聞摘要（依日期排序）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;編號&lt;/th&gt;&lt;th&gt;日期&lt;/th&gt;&lt;th&gt;媒體&lt;/th&gt;&lt;th&gt;標題&lt;/th&gt;&lt;th&gt;立場&lt;/th&gt;&lt;th&gt;查證狀態&lt;/th&gt;&lt;th&gt;我們的判讀&lt;/th&gt;&lt;th&gt;原文網址&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;N5&lt;/td&gt;&lt;td&gt;2026-09-06&lt;/td&gt;&lt;td&gt;ChannelNews（科技產業新聞網站）&lt;/td&gt;&lt;td&gt;美國法官恢復針對 Adobe 訂閱取消做法的集體訴訟&lt;/td&gt;&lt;td&gt;反方&lt;/td&gt;&lt;td&gt;事實（法院裁定，經媒體報導）&lt;/td&gt;&lt;td&gt;政府訴訟和解後私人訴訟仍在；禁制令被駁回，金額影響未知。&lt;/td&gt;&lt;td class=&quot;link&quot;&gt;&lt;a href=&quot;https://www.channelnews.com.au/us-judge-revives-class-action-against-adobe-over-dodgy-subscription-cancellation/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;原文&lt;/a&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;N2&lt;/td&gt;&lt;td&gt;2026-10-13&lt;/td&gt;&lt;td&gt;Yahoo Finance（財經新聞網站；Investing.com（財經新聞網站））&lt;/td&gt;&lt;td&gt;HSBC 對 Adobe 轉趨審慎，點出免費仿製軟體風險&lt;/td&gt;&lt;td&gt;反方&lt;/td&gt;&lt;td&gt;分析師說法&lt;/td&gt;&lt;td&gt;AI 仿製先衝擊業餘用戶；HSBC 只下修營收約 1%，屬意見，列護城河待追蹤威脅。&lt;/td&gt;&lt;td class=&quot;link&quot;&gt;&lt;a href=&quot;https://finance.yahoo.com/markets/stocks/articles/hsbc-cautious-adobe-flags-headline-122745509.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;原文&lt;/a&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;N8&lt;/td&gt;&lt;td&gt;2026-11-04&lt;/td&gt;&lt;td&gt;Invezz（財經新聞網站）&lt;/td&gt;&lt;td&gt;Citi 把 Adobe 降為賣出，成長疑慮未解&lt;/td&gt;&lt;td&gt;反方&lt;/td&gt;&lt;td&gt;分析師說法（媒體轉述）&lt;/td&gt;&lt;td&gt;Citi 稱新客導向低單價方案、FY2027 淨新增 ARR 估計降到 1.5 十億美元；屬意見，12 月 FY2027 指引才是驗證點。&lt;/td&gt;&lt;td class=&quot;link&quot;&gt;&lt;a href=&quot;https://invezz.com/pk/news/2026/11/04/adobe-stock-rises-despite-citi-downgrade-as-growth-concerns-persist/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;原文&lt;/a&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;N10&lt;/td&gt;&lt;td&gt;2026-11-10&lt;/td&gt;&lt;td&gt;Adobe Newsroom（公司官方）&lt;/td&gt;&lt;td&gt;Adobe MAX 2026：第三方 AI 連接器與本機 MCP 整合預覽&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;公司說法（產品發布）&lt;/td&gt;&lt;td&gt;想讓 Adobe 檔案成為 AI 代理呼叫的對象；但介面移到第三方可能稀釋定價，無營收數字。&lt;/td&gt;&lt;td class=&quot;link&quot;&gt;&lt;a href=&quot;https://news.adob
