ot; fill=&quot;var(--neg)&quot;&gt;5.1%&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c1)&quot;&gt;&lt;/i&gt;盈餘殖利率（1 ÷ 申報本益比）&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--neg)&quot;&gt;&lt;/i&gt;10 年期公債&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;股債利差只作「相對自身歷史的位置」：名目利率對實質盈餘有方法限制，不影響估值與研究評等。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;同業與產業對照&lt;/h3&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;與個別同業比較&lt;/h4&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;Adobe 的利潤率在估值同業五家中最高：近四季營業利益率 35.7%，高於 Intuit（報稅與會計軟體公司）28.8% 與 Autodesk 27.9%；成長屬中段，最新一季營收年增 12.9%，低於 ServiceNow（企業 IT 工作流程平台）20.5%。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;倍數卻偏低：Adobe 近四季本益比約 13.7 倍，估值同業（CRM、INTU、ADSK、WDAY）中位 28.2 倍。&lt;/strong&gt;同業同樣受 AI 取代擔憂；微軟與 Figma（協作式設計工具公司）只作營運參考，不進估值。Adobe 用 SEC 申報近四季（截至 2026-08-28）；同業為 yfinance 季報加總，2026-11-18 查詢，CRM、INTU、ADSK、WDAY 截至 2026-07-31，NOW、微軟、Figma 截至 2026-09-30；營收年增是最近一季對去年同季，只作方向參考。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;與個別同業比較：利潤率與投入強度（近四季）。資料期間：本公司 SEC 近四季（截至 2026-08-28）；同業為資料商（yfinance 季報加總）近四季，截至 CRM 2026-07-31、INTU 2026-07-31、ADSK 2026-07-31、NOW 2026-09-30、WDAY 2026-07-31、MSFT 2026-09-30、FIG 2026-09-30；資料商查詢 2026-11-18（批次收盤 2026-11-16）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 300&quot; role=&quot;img&quot; aria-label=&quot;同業比較&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;266.0&quot; y2=&quot;266.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;270.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;-50%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;217.6&quot; y2=&quot;217.6&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;221.6&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;-25%&lt;/text&gt;&lt 1&quot; y=&quot;169.2&quot; width=&quot;12.2&quot; height=&quot;78.8&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;營業利益率 FIG：-41%&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;502.4&quot; y=&quot;66.6&quot; width=&quot;12.2&quot; height=&quot;102.6&quot; rx=&quot;2&quot; fill=&quot;var(--c2)&quot;&gt;&lt;title&gt;研發占營收 FIG：53%&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;516.6&quot; y=&quot;165.4&quot; width=&quot;12.2&quot; height=&quot;3.8&quot; rx=&quot;2&quot; fill=&quot;var(--c3)&quot;&gt;&lt;title&gt;資本支出占營收 FIG：2%&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;509.5&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FIG&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c1)&quot;&gt;&lt;/i&gt;營業利益率&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c2)&quot;&gt;&lt;/i&gt;研發占營收&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c3)&quot;&gt;&lt;/i&gt;資本支出占營收&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt signals&quot;&gt;&lt;tr&gt;&lt;th&gt;公司&lt;/th&gt;&lt;th&gt;商業模式&lt;/th&gt;&lt;th&gt;服務導向&lt;/th&gt;&lt;th&gt;營業利益率&lt;/th&gt;&lt;th&gt;研發占營收&lt;/th&gt;&lt;th&gt;資本支出占營收&lt;/th&gt;&lt;th&gt;最新一季營收年增&lt;/th&gt;&lt;th&gt;與 Adobe 的主要差異&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;ADBE&lt;/td&gt;&lt;td&gt;創作、文件與行銷軟體訂閱&lt;/td&gt;&lt;td&gt;高&lt;/td&gt;&lt;td&gt;35.7%&lt;/td&gt;&lt;td&gt;18.1%&lt;/td&gt;&lt;td&gt;0.8%&lt;/td&gt;&lt;td&gt;12.9%&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;CRM&lt;/td&gt;&lt;td&gt;企業客戶關係與行銷雲訂閱&lt;/td&gt;&lt;td&gt;高&lt;/td&gt;&lt;td&gt;21.5%&lt;/td&gt;&lt;td&gt;14.5%&lt;/td&gt;&lt;td&gt;1.4%&lt;/td&gt;&lt;td&gt;10.8%&lt;/td&gt;&lt;td&gt;行銷雲與 Experience Cloud（Adobe 的企業行銷軟體）直接競爭，利潤率較低&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;INTU&lt;/td&gt;&lt;td&gt;中小企業與個人報稅、會計訂閱&lt;/td&gt;&lt;td&gt;高&lt;/td&gt;&lt;td&gt;28.8%&lt;/td&gt;&lt;td&gt;15.7%&lt;/td&gt;&lt;td&gt;1.0%&lt;/td&gt;&lt;td&gt;13.7%&lt;/td&gt;&lt;td&gt;客群偏消費者與中小企業，同樣面對 AI 取代疑慮&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;ADSK&lt;/td&gt;&lt;td&gt;設計與工程軟體訂閱&lt;/td&gt;&lt;td&gt;高&lt;/td&gt;&lt;td&gt;27.9%&lt;/td&gt;&lt;td&gt;22.1%&lt;/td&gt;&lt;td&gt;1.2%&lt;/td&gt;&lt;td&gt;16.1%&lt;/td&gt;&lt;td&gt;客群在建築與製造，與創意專業用戶部分重疊&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;NOW&lt;/td&gt;&lt;td&gt;企業 IT 與工作流程平台&lt;/td&gt;&lt;td&gt;高&lt;/td&gt;&lt;td&gt;9.7%&lt;/td&gt;&lt;td&gt;22.5%&lt;/td&gt;&lt;td&gt;3.8%&lt;/td&gt;&lt;td&gt;20.5%&lt;/td&gt;&lt;td&gt;成長較快但 GAAP 利潤率低&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;WDAY&lt;/td&gt;&lt;td&gt;企業人資與財務雲端軟體&lt;/td&gt;&lt;td&gt;高&lt;/td&gt;&lt;td&gt;12.0%&lt;/td&gt;&lt;td&gt;27.7%&lt;/td&gt;&lt;td&gt;2.3%&lt;/td&gt;&lt;td&gt;12.8%&lt;/td&gt;&lt;td&gt;成長相近，股權薪酬占比高使利潤率低&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;MSFT（營運參考）&lt;/td&gt;&lt;td&gt;雲端基礎設施、辦公與作業系統&lt;/td&gt;&lt;td&gt;混合&lt;/td&gt;&lt;td&gt;47.1%&lt;/td&gt;&lt;td&gt;10.5%&lt;/td&gt;&lt;td&gt;39.2%&lt;/td&gt;&lt;td&gt;18.8%&lt;/td&gt;&lt;td&gt;資本支出大，不進估值&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;FIG（營運參考）&lt;/td&gt;&lt;td&gt;協作式設計工具&lt;/td&gt;&lt;td&gt;高&lt;/td&gt;&lt;td&gt;−40.7%&lt;/td&gt;&lt;td&gt;53.0%&lt;/td&gt;&lt;td&gt;2.0%&lt;/td&gt;&lt;td&gt;42.8%&lt;/td&gt;&lt;td&gt;設計工具直接對手，仍虧損，不進估值&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;我們的假設 vs 產業常見範圍&lt;/h4&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;本報告假設比軟體產業平均好，但有實績支撐：基準第 1 年利潤率 35% 高於產業 33.0%，銷售對投入資本 3.0 倍高於產業 1.54 倍，因客戶預付、需要的投入資本很少（Damodaran，2026-01）。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;3.0 是含 Magento（Adobe 旗下電商平台）、Marketo（行銷自動化軟體）併購的 10 年增量；扣掉商譽與無形資產後投入資本為負，算不出不含併購的比率。&lt;/strong&gt;永續期 ROIC 13.1% 低於產業 29.3%，折現率 10.1% 高於產業 9.3%，兩項都偏保守。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;figure&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt signals&quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;本報告&lt;/th&gt;&lt;th&gt;產業值&lt;/th&gt;&lt;th&gt;本報告口徑&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;營業利益率&lt;/td&gt;&lt;td&gt;35%&lt;/td&gt;&lt;td&gt;33.0%&lt;/td&gt;&lt;td&gt;基準第 1 年&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;研發占營收&lt;/td&gt;&lt;td&gt;18.1%&lt;/td&gt;&lt;td&gt;16.0%&lt;/td&gt;&lt;td&gt;近四季實際&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股權薪酬占營收&lt;/td&gt;&lt;td&gt;8.0%&lt;/td&gt;&lt;td&gt;7.8%&lt;/td&gt;&lt;td&gt;近四季實際&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;銷售對投入資本&lt;/td&gt;&lt;td&gt;3.0 倍&lt;/td&gt;&lt;td&gt;1.54 倍&lt;/td&gt;&lt;td&gt;基準假設&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;資本報酬率（ROC）&lt;/td&gt;&lt;td&gt;13.1%&lt;/td&gt;&lt;td&gt;29.3%&lt;/td&gt;&lt;td&gt;永續期 ROIC（窄分級）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Beta（股價對大盤的敏感度）&lt;/td&gt;&lt;td&gt;1.30&lt;/td&gt;&lt;td&gt;1.28&lt;/td&gt;&lt;td&gt;估值假設&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;資本成本&lt;/td&gt;&lt;td&gt;10.1%&lt;/td&gt;&lt;td&gt;9.3%&lt;/td&gt;&lt;td&gt;基準折現率&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;稅率&lt;/td&gt;&lt;td&gt;22%&lt;/td&gt;&lt;td&gt;18.5%&lt;/td&gt;&lt;td&gt;估值稅率&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;企業價值對營業利益&lt;/td&gt;&lt;td&gt;10.5 倍（EV／營業利益，主尺；分母近四季營業利益 2025-11-28～2026-08-28、模型股權橋企業價值；收盤 2026-11-16）&lt;/td&gt;&lt;td&gt;34.4 倍&lt;/td&gt;&lt;td&gt;目前市場倍數（收盤 2026-11-16，模型股權橋企業價值÷近四季營業利益）&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;details id=&quot;claims&quot;&gt;&lt;summary&gt;論點檢查：每條判斷的證據狀態&lt;/summary&gt;&lt;div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;依風險分類的主張（證據狀態：支持／部分支持／提出反證／資料不足）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;編號&lt;/th&gt;&lt;th&gt;風險類別&lt;/th&gt;&lt;th&gt;主張&lt;/th&gt;&lt;th&gt;角色&lt;/th&gt;&lt;th&gt;證據狀態&lt;/th&gt;&lt;th&gt;什麼會改變判斷&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;ADBE-C07&lt;/td&gt;&lt;td&gt;R2 償債負擔與永久損失&lt;/td&gt;&lt;td&gt;資產負債表撐得住：有息負債 6,363、淨負債 724，利息保障約 36 倍，有息負債約 0.6 倍 EBITDA；一年內到期 1,597 有 3.5 倍現金與證券覆蓋，1,500 循環信貸未動用、票據無財務契約。&lt;/td&gt;&lt;td&gt;支持論點&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;淨負債÷EBITDA 超過 1.5 倍，或近四季借還款淨額轉為大額正值且用於回購&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;ADBE-C01&lt;/td&gt;&lt;td&gt;R3 成長退坡與競爭&lt;/td&gt;&lt;td&gt;Adobe 的優勢主要來自專業工作流程與檔案格式的轉換成本（Creative Cloud、Acrobat／PDF）：Q3 總 ARR 年增 11.2%、客戶群訂閱收入年增 14%、毛利率約 89%，其他公司申報也把 Adobe 當主要對手與整合平台；但生成式 AI 讓入門與業餘端的替代成本下降，這是受考驗的優勢。&lt;/td&gt;&lt;td&gt;支持論點&lt;/td&gt;&lt;td&gt;部分支持&lt;/td&gt;&lt;td&gt;Creative &amp;amp; Marketing Professionals 訂閱收入年增連續兩季低於 8%，或總 ARR 年增低於 8%；公司揭露續約率或淨新增 ARR，且顯示專業用戶留存穩定、價格調整後未流失&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;ADBE-C04&lt;/td&gt;&lt;td&gt;R3 成長退坡與競爭&lt;/td&gt;&lt;td&gt;成長來源：ARR 年增 11.2% 主要來自 Creative Cloud 旗艦、Acrobat、Experience Manager 等訂閱核心，並含 Semrush 併購貢獻；AI 優先產品 ARR 年增逾 150%，但媒體轉述金額約 650 百萬，只占總 ARR 約 2.4%（推算）。&lt;/td&gt;&lt;td&gt;支持論點&lt;/td&gt;&lt;td&gt;部分支持&lt;/td&gt;&lt;td&gt;FY2026 10-K 期末 ARR 扣除 Semrush 後年增低於 8%，或 FY2027 期末 ARR 目標（不含新併購）低於 8%（目前扣除後約 8.3%，推算）；AI-first ARR 達總 ARR 5% 以上且總 ARR 年增未放緩&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;ADBE-C05&lt;/td&gt;&lt;td&gt;R3 成長退坡與競爭&lt;/td&gt;&lt;td&gt;成長速度與持續時間：基準第 1 年 +10%、5 年遞減到 6%，與 Q4 指引對應的約 10% 年增、期末 ARR 年增 10.2% 與同類公司次年中位 10.2% 一致（指引與 ARR 都含 Semrush，扣除後約 8.2%、8.3%，推算；第 1 年約 1.2 個百分點是 Semrush 補滿全年）；近四季 +12.0% 含併購，10 年年複合 17.4% 多來自轉訂閱與早期併購，不能外推。&lt;/td&gt;&lt;td&gt;支持論點&lt;/td&gt;&lt;td&gt;部分支持&lt;/td&gt;&lt;td&gt;2026-12 公布的 FY2027 營收指引中點年增低於 8%（名目，含 Semrush 剩餘併入約 0.8 個百分點，推算），或期末 ARR 目標（不含新併購，與扣 Semrush 的 8.3% 比）低於 8%；FY2027 營收指引中點年增 10% 以上且期末 ARR 目標 8.5% 以上（與扣 Semrush 的 8.3% 同口徑）；介於下修與維持之間不改判，列待確認&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;ADBE-C10&lt;/td&gt;&lt;td&gt;R3 成長退坡與競爭&lt;/td&gt;&lt;td&gt;生成式 AI 工具（Google Pics 內建於 Workspace、Canva AI 2.0、AI 仿製軟體）對入門級設計與創意市場是產業層面的競爭壓力，與 Adobe 專業工作流程的優勢分開看；高成長的 Figma 上市後市值也跌掉約三分之二，說明市場對整個設計軟體類別以 AI 取代風險定價。&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;部分支持&lt;/td&gt;&lt;td&gt;Business Professionals &amp;amp; Consumers 訂閱收入年增跌破 10%，或公司揭露免費增值轉換放緩；連續兩季 Business Professionals &amp;amp; Consumers 訂閱收入年增維持 14% 以上&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;ADBE-C12&lt;/td&gt;&lt;td&gt;R3 成長退坡與競爭&lt;/td&gt;&lt;td&gt;情境幅度：樂觀第 1–5 年營收成長 14/13/12/11/10%（平均 12.0%）低於近五年年複合 13.1%，因為五年複合含 FY2021 疫情年 +22.7%，扣掉後 FY2021→FY2025 年複合 10.8%（推算），樂觀仍高於這個速度與 FY2026 期末 ARR 目標 10.2%；樂觀利潤率 36%→40%、穩態 39%（2026-11-16 依 A2 同一把尺拉寬，加權合理價值中點÷基準每股 1.003）；保守穩態營業利益率 23%（基準 35% 的約 0.66 倍）代表 AI 衝擊先表現在降價、算力與研發成本，落在公司 11 年 GAAP 營業利益率 18.8%（FY2015）到 36.8%（FY2021）的範圍內，市價隱含的 29.2% 介於保守與基準之間。&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;部分支持&lt;/td&gt;&lt;td&gt;FY2027 指引或季報顯示 GAAP 營業利益率年減 3 個百分點以上，或公司揭露降價／方案調整壓低平均單價；總 ARR 年增連續兩季高於 13%（扣除 Semrush 併購後仍高於 11%）且 GAAP 營業利益率維持 35% 以上&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;ADBE-C02&lt;/td&gt;&lt;td&gt;R4 投入回報不足&lt;/td&gt;&lt;td&gt;高報酬能否持續：財務投入資本口徑 ROIC 近五年中位約 44%，營運投入資本為負（客戶預付）；研發依軟體業 30.8% 折舊率資本化後，FY2025 NOPAT 由 7,107 增至約 8,147、每股盈餘多約 2.44（5 年直線約 2.42），結論不因攤銷年限翻轉。&lt;/td&gt;&lt;td&gt;支持論點&lt;/td&gt;&lt;td&gt;部分支持&lt;/td&gt;&lt;td&gt;Semrush 或 Topaz 相關商譽減損，或財務投入資本口徑 ROIC 跌破 25%；FY2026 10-K 揭露 Semrush 營收貢獻且利潤率接近集團&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;ADBE-C03&lt;/td&gt;&lt;td&gt;R5 收入與盈餘品質&lt;/td&gt;&lt;td&gt;盈餘能變成現金：近四季營運現金流 10,806 高於淨利 7,284，扣資本支出後 10,592，回購後仍剩約 1,297；遞延收入與 RPO 撐住預收，PEG 所用 EPS 為含股權薪酬的一般會計口徑。&lt;/td&gt;&lt;td&gt;支持論點&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;營運現金流÷淨利連續兩季低於 1.0，或遞延收入年減&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;ADBE-C09&lt;/td&gt;&lt;td&gt;R6 治理與資料可信度&lt;/td&gt;&lt;td&gt;治理有中度變動：CEO 由內部人 Chakravarthy 2026-12-01 接任、CFO 2026-06 起由內部代理，正式 CFO 未見，創意與生產力事業總裁 2026-09-27 卸任；政府 ROSCA 訴訟已和解撤案（金額未揭露），但同一提前解約費做法的私人集體訴訟被法院恢復。&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;部分支持&lt;/td&gt;&lt;td&gt;正式 CFO 自外部任命並宣布改變回購或併購政策；私人集體訴訟揭露重大和解或判決金額，或 10-K 新增訂閱做法相關或有負債&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;ADBE-C06&lt;/td&gt;&lt;td&gt;R7 估值與市場預期&lt;/td&gt;&lt;td&gt;PEG 看起來便宜（過去三年 EPS 年增口徑 0.75），但基準情境口徑 1.22 屬合理（近四季對上一財年口徑 1.90 只錯開三季、不是年增，所用 EPS 17.91 也未扣前九個月非經常項目 187 百萬）；市價反推只要求 5 年營收年增約 4.1%（或基準成長下穩態營業利益率 29.2%；收盤 2026-11-16），本益比落在近五年最低到 p25 之間——便宜反映的是市場對 AI 取代、降價與管理層換手的定價，而不是再投資報酬低。&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;部分支持&lt;/td&gt;&lt;td&gt;總 ARR 年增跌到 5% 以下（接近市價隱含 4.1%）；ARR 年增維持 10% 以上至 FY2027 而本益比仍在歷史 p25 以下&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;ADBE-C08&lt;/td&gt;&lt;td&gt;R9 稀釋與股東回饋&lt;/td&gt;&lt;td&gt;Q3 回購均價低於前三季：Q3 買回 9.5 百萬股、加權均價約 235（推算），前三季約 261（媒體依 10-Q 推算）；Q3 內最後一段 260 美元仍買 3.5 百萬股，看不出刻意在跌時加快，資金來自營運現金流，三年股數年減約 3.2%；但回購占自由現金流約 88%，扣股權薪酬後淨回購殖利率約 7.5%。&lt;/td&gt;&lt;td&gt;支持論點&lt;/td&gt;&lt;td&gt;部分支持&lt;/td&gt;&lt;td&gt;回購改由淨借款支應，或回購均價高於合理價值上緣；新管理層宣布回購金額低於近四季的一半，轉為以大型併購為主&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;並列：研究評等 生意品質一流 ／ 價格偏低（低於市場常態）；價格位置 偏低；現價隱含年報酬（基準情境，非預期報酬） 11.8%。各列狀態與價格分開呈現，不合成分數，狀態件數也不代表強弱（非買賣建議）。另有 1 條本次未檢驗，不代表沒有風險。沒有寫主張的風險類別：R1 資金與流動性。&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;details id=&quot;risks-more&quot;&gt;&lt;summary&gt;其他風險與改判條件（超過首頁上限的部分）&lt;/summary&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;risk-tbl&quot; style=&quot;min-width:0;width:100%&quot;&gt;&lt;tr&gt;&lt;th style=&quot;white-space:normal;width:64%&quot;&gt;情況（看哪個指標、門檻多少）&lt;/th&gt;&lt;th style=&quot;white-space:normal;width:22%&quot;&gt;會改變什麼判斷&lt;/th&gt;&lt;th style=&quot;white-space:normal;width:14%&quot;&gt;歷史基準比率&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;Semrush、Topaz 併購回報待驗證，商譽減損會拉低報酬率&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;未設門檻：持續觀察&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;AI 推論與雲端託管成本上升，可能壓縮約 89% 的毛利率&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;未設門檻：持續觀察&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/details&gt;&lt;details id=&quot;glossary&quot;&gt;&lt;summary&gt;名詞小抄&lt;/summary&gt;&lt;dl class=&quot;gl&quot;&gt;&lt;dt id=&quot;g0&quot;&gt;FY（財年）&lt;/dt&gt;&lt;dd&gt;Adobe 的財年約在每年 11 月底或 12 月初結束，例如 FY2025 截至 2025-11-28；FY2026 Q3 指截至 2026-08-28 的那一季。&lt;/dd&gt;&lt;dt id=&quot;g1&quot;&gt;ARR（年化經常性收入）&lt;/dt&gt;&lt;dd&gt;把目前所有訂閱合約換算成一年的收入，是訂閱公司最常用的成長指標；Adobe 只算兩個客戶群的訂閱。&lt;/dd&gt;&lt;dt id=&quot;g2&quot;&gt;RPO（剩餘履約義務）&lt;/dt&gt;&lt;dd&gt;客戶已簽約、但公司還沒交付而尚未認列的收入總額；cRPO 是其中 12 個月內會認列的部分。&lt;/dd&gt;&lt;dt id=&quot;g3&quot;&gt;遞延收入&lt;/dt&gt;&lt;dd&gt;客戶預先付款、公司還沒提供服務的部分，先記成負債，之後才轉成營收。&lt;/dd&gt;&lt;dt id=&quot;g4&quot;&gt;創意與行銷專業客戶群（Creative &amp;amp; Marketing Professionals）&lt;/dt&gt;&lt;dd&gt;Adobe 的客戶分類之一：設計師、影音創作者與企業行銷團隊，主要用 Creative Cloud 與行銷軟體。&lt;/dd&gt;&lt;dt id=&quot;g5&quot;&gt;商業專業與消費者客戶群（Business Professionals &amp;amp; Consumers）&lt;/dt&gt;&lt;dd&gt;Adobe 的客戶分類之一：一般上班族、學生與個人，主要用 Acrobat 與 Express。&lt;/dd&gt;&lt;dt id=&quot;g6&quot;&gt;AI 優先產品（AI-first）&lt;/dt&gt;&lt;dd&gt;Adobe 對以生成式 AI 為核心的新產品（例如 Firefly 方案）的分類，公司只揭露成長率。&lt;/dd&gt;&lt;dt id=&quot;g7&quot;&gt;免費增值（freemium）&lt;/dt&gt;&lt;dd&gt;先提供免費版吸引用戶，再引導部分用戶升級付費。&lt;/dd&gt;&lt;dt id=&quot;g8&quot;&gt;自由現金流&lt;/dt&gt;&lt;dd&gt;營運現金流扣掉資本支出後，公司真正可以自由運用的現金。&lt;/dd&gt;&lt;dt id=&quot;g9&quot;&gt;ROIC（投入資本報酬率）&lt;/dt&gt;&lt;dd&gt;每投入 1 元營運資本一年賺回多少稅後營業利益；本報告用財務投入資本（權益＋長期負債－現金與短期投資）口徑。&lt;/dd&gt;&lt;dt id=&quot;g10&quot;&gt;WACC（加權平均資金成本）&lt;/dt&gt;&lt;dd&gt;公司股東與債權人要求的平均報酬率，用來把未來現金流折回現在。&lt;/dd&gt;&lt;dt id=&quot;g11&quot;&gt;合理價值與買入上限&lt;/dt&gt;&lt;dd&gt;三個情境估值加權後的區間；買入上限是合理價值中點打八折，留 20% 安全邊際。&lt;/dd&gt;&lt;dt id=&quot;g12&quot;&gt;市價反推&lt;/dt&gt;&lt;dd&gt;把現價當答案，倒推市場隱含的營收成長或利潤率；成長與利潤率是兩種解法擇一，不是同時要求。&lt;/dd&gt;&lt;dt id=&quot;g13&quot;&gt;終值占比&lt;/dt&gt;&lt;dd&gt;估值中來自明確預測期之後的部分；占比越高，估值越受長期假設影響。&lt;/dd&gt;&lt;dt id=&quot;g14&quot;&gt;p25／p75（百分位）&lt;/dt&gt;&lt;dd&gt;把一段期間的數值由小到大排列，第 25％、第 75％ 位置的值；本報告用來看本益比與倍數落在自身歷史的哪個位置。&lt;/dd&gt;&lt;dt id=&quot;g15&quot;&gt;PEG（本益比對成長比）&lt;/dt&gt;&lt;dd&gt;本益比除以每股盈餘成長率；約 1 以下通常被視為便宜，但取決於用哪種成長口徑。&lt;/dd&gt;&lt;dt id=&quot;g16&quot;&gt;EV／營業利益（EV/EBIT）&lt;/dt&gt;&lt;dd&gt;企業價值（市值加淨負債）除以營業利益，比較不同負債結構公司的估值倍數。&lt;/dd&gt;&lt;dt id=&quot;g17&quot;&gt;股東收益率&lt;/dt&gt;&lt;dd&gt;股利殖利率加回購殖利率，代表股東現在就以現金或股數減少形式拿到的回報。&lt;/dd&gt;&lt;dt id=&quot;g18&quot;&gt;非 GAAP&lt;/dt&gt;&lt;dd&gt;公司自行排除股權薪酬、無形資產攤銷等項目後的獲利口徑，不是會計準則數字。&lt;/dd&gt;&lt;dt id=&quot;g19&quot;&gt;ROSCA&lt;/dt&gt;&lt;dd&gt;美國規範線上訂閱揭露條款與取消機制的法律，Adobe 被司法部依此起訴後已和解。&lt;/dd&gt;&lt;dt id=&quot;g20&quot;&gt;10b5-1 計畫&lt;/dt&gt;&lt;dd&gt;內部人事先登記的股票買賣計畫，按預定時間或價格執行，用來避免內線交易疑慮。&lt;/dd&gt;&lt;dt id=&quot;g21&quot;&gt;研發資本化&lt;/dt&gt;&lt;dd&gt;把研發費用當成可用好幾年的投資攤提，而不是當年全部認列費用，用來檢查報酬率是否被低估。&lt;/dd&gt;&lt;dt id=&quot;g22&quot;&gt;護城河分級（寬／窄／無）&lt;/dt&gt;&lt;dd&gt;本報告用兩把鑰匙判斷：報酬率長期高於資金成本，加上有留存或轉換成本的量化證據；兩把都過是寬，只過一把是窄。&lt;/dd&gt;&lt;dt id=&quot;g23&quot;&gt;MCP（模型上下文協定）&lt;/dt&gt;&lt;dd&gt;讓 AI 代理呼叫外部軟體與檔案的介面標準；Adobe 在 MAX 大會預覽了這類整合。&lt;/dd&gt;&lt;dt id=&quot;g24&quot;&gt;市價隱含第 15 年倍數&lt;/dt&gt;&lt;dd&gt;把現價當答案，倒推第 15 年（明示期最後一年）企業價值對營業利益要幾倍才合理；只描述市場要求，不是目標價。&lt;/dd&gt;&lt;/dl&gt;&lt;/details&gt;&lt;details id=&quot;numbers-table&quot;&gt;&lt;summary&gt;完整數字表格：三大報表摘要（年度與 8 季，供查；圖在正文「完整數字」）&lt;/summary&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:14px&quot;&gt;損益表（年度與近四季）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;億美元&lt;/th&gt;&lt;th&gt;FY22&lt;/th&gt;&lt;th&gt;FY23&lt;/th&gt;&lt;th&gt;FY24&lt;/th&gt;&lt;th&gt;FY25&lt;/th&gt;&lt;th&gt;近四季&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;營收&lt;/td&gt;&lt;td&gt;176&lt;/td&gt;&lt;td&gt;194&lt;/td&gt;&lt;td&gt;215&lt;/td&gt;&lt;td&gt;238&lt;/td&gt;&lt;td&gt;260&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;毛利&lt;/td&gt;&lt;td&gt;154&lt;/td&gt;&lt;td&gt;171&lt;/td&gt;&lt;td&gt;191&lt;/td&gt;&lt;td&gt;212&lt;/td&gt;&lt;td&gt;232&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;研發費用&lt;/td&gt;&lt;td&gt;29.9&lt;/td&gt;&lt;td&gt;34.7&lt;/td&gt;&lt;td&gt;39.4&lt;/td&gt;&lt;td&gt;42.9&lt;/td&gt;&lt;td&gt;46.9&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;營業利益&lt &lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;div class=&quot;wrap&quot;&gt;&lt;div class=&quot;top&quot;&gt;&lt;span&gt;&lt;b&gt;Adobe（ADBE）&lt;/b&gt;｜商業評估&lt;/span&gt;&lt;span&gt;資料截止 2026-11-16｜基準季 2026-08-28｜&lt;a href=&quot;報告.html&quot;&gt;估值報告（另頁）&lt;/a&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;hero&quot;&gt;&lt;div&gt;&lt;div class=&quot;eyebrow&quot;&gt;商業評估｜訂閱軟體／—&lt;/div&gt;&lt;h1&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;Adobe 是以專業創作與文件工作流程收訂閱費的成熟生意，利潤率在訂閱軟體同業中最高、營收每年成長約一成；要盯的是入門端被生成式 AI 工具替代，以及合約積壓（RPO）增速已落後營收。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src2&quot;&gt;[2]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src3&quot;&gt;[3]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src4&quot;&gt;[4]&lt;/a&gt;&lt;/sup&gt;&lt;/h1&gt;&lt;p class=&quot;lead&quot;&gt;本頁只用官方文件、財報與新聞，回答商業模式是否成立、成長點在哪、是否卡住、未來怎麼變、週期多久。&lt;b&gt;不含價格、估值或任何買賣建議&lt;/b&gt;，也不影響估值報告的研究評等。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;gradebox&quot;&gt;&lt;div class=&quot;lab&quot;&gt;商業動能（五級 A–E；原名「商業評估等級」，2026-11-17 改名）&lt;span class=&quot;ruleok&quot;&gt;評分規則第一版，2026-11-07 使用者核定&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;g&quot;&gt;B&lt;small&gt;級&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;加權分 3.65／5｜相對同業：CRM、INTU、ADSK、NOW、WDAY&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;模式成立，有一兩個需要追蹤的卡點&lt;/div&gt;&lt;div class=&quot;note&quot;&gt;商業評估等級（A–E 五級）只看商業模式是否成立、成長是否卡住、週期在哪，相對同產業卡同業評比；它不是估值報告研究評等裡的「生意品質 A／B／C」（那是看護城河、投入資本報酬、現金流品質、資產負債表與治理的絕對標準），不進研究評等、不影響估值、不涉任何價格。&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;nav class=&quot;qnav&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;&lt;a href=&quot;#s0&quot;&gt;重點&lt;/a&gt;&lt;a href=&quot;#s1&quot;&gt;1 商業輪廓&lt;/a&gt;&lt;a href=&quot;#s2&quot;&gt;2 說的 vs 做的&lt;/a&gt;&lt;a href=&quot;#s3&quot;&gt;3 成長與卡點&lt;/a&gt;&lt;a href=&quot;#sa&quot;&gt;4 優勢與持續期間&lt;/a&gt;&lt;a href=&quot;#s4&quot;&gt;5 生命週期&lt;/a&gt;&lt;a href=&quot;#s5&quot;&gt;6 週期&lt;/a&gt;&lt;a href=&quot;#s6&quot;&gt;7 觀察清單&lt;/a&gt;&lt;a href=&quot;#sg&quot;&gt;等級明細&lt;/a&gt;&lt;a href=&quot;#src&quot;&gt;出處&lt;/a&gt;&lt;/div&gt;&lt;/nav&gt;&lt;div class=&quot;wrap&quot;&gt;&lt;section id=&quot;s0&quot;&gt;&lt;h2&gt;一眼看重點&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;先看等級怎麼來、這頁的證據有多扎實；細節在下面各節。&lt;/p&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;等級怎麼來：五個面向&lt;/figcaption&gt;&lt;svg viewBox=&quot;0 0 640 260&quot; role=&quot;img&quot; aria-label=&quot;商業評估等級五面向：作者分與機械建議分&quot;&gt;&lt;line x1=&quot;150.0&quot; x2=&quot;150.0&quot; y1=&quot;20&quot; y2=&quot;232&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;150.0&quot; y=&quot;250&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;1 分&lt;/text&gt;&lt;line x1=&quot;255.0&quot; x2=&quot;255.0&quot; y1=&quot;20&quot; y2=&quot;232&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;255.0&quot; y=&quot;250&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;2 分&lt;/text&gt;&lt;line x1=&quot;360.0&quot; x2=&quot;360.0&quot; y1=&quot;20&quot; y2=&quot;232&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;360.0&quot; y=&quot;250&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;3 分&lt;/text&gt;&lt;line x1=&quot;465.0&quot; x2=&quot;465.0&quot; y1=&quot;20&quot; y2=&quot;232&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;465.0&quot; y=&quot;250&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;4 分&lt;/text&gt;&lt;line x1=&quot;570.0&quot; x2=&quot;570.0&quot; y1=&quot;20&quot; y2=&quot;232&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;570.0&quot; y=&quot;250&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;5 分&lt;/text&gt;&lt;text x=&quot;140&quot; y=&quot;55.0&quot; class=&quot;lb&quot; text-anchor=&quot;end&quot;&gt;模式穩固度&lt;tspan class=&quot;ax&quot;&gt; 25%&lt;/tspan&gt;&lt;/text&gt;&lt;rect x=&quot;150.0&quot; y=&quot;43.0&quot; width=&quot;420.0&q t;3&lt;/text&gt;&lt;text x=&quot;140&quot; y=&quot;215.0&quot; class=&quot;lb&quot; text-anchor=&quot;end&quot;&gt;說法可信度&lt;tspan class=&quot;ax&quot;&gt; 15%&lt;/tspan&gt;&lt;/text&gt;&lt;rect x=&quot;150.0&quot; y=&quot;203.0&quot; width=&quot;315.0&quot; height=&quot;14&quot; rx=&quot;3&quot; fill=&quot;var(--biz)&quot; opacity=&quot;.85&quot;/&gt;&lt;path d=&quot;M465.0,198.0 l6,-8 h-12z&quot; fill=&quot;var(--accent)&quot;&gt;&lt;title&gt;機械建議 4&lt;/title&gt;&lt;/path&gt;&lt;text x=&quot;473.0&quot; y=&quot;215.0&quot; class=&quot;vl&quot;&gt;4&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;lg&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--biz)&quot;&gt;&lt;/i&gt;作者分&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--accent)&quot;&gt;&lt;/i&gt;機械建議分&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;藍條是作者分（1–5），橘色三角是工具的機械建議分；兩者不同的面向在等級明細寫了偏離理由。加權分 3.65 → B 級（A ≥ 4.2、B ≥ 3.5、C ≥ 2.8、D ≥ 2.1）。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估.json#/評等/面向（作者分、權重、機械建議）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;這頁的句子有多少是事實&lt;/figcaption&gt;&lt;svg viewBox=&quot;0 0 640 58&quot; role=&quot;img&quot; aria-label=&quot;句子標記組成&quot;&gt;&lt;rect x=&quot;4.0&quot; y=&quot;6&quot; width=&quot;403.8&quot; height=&quot;26&quot; fill=&quot;var(--biz)&quot;&gt;&lt;title&gt;事實 69&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;205.9&quot; y=&quot;24&quot; class=&quot;inb&quot; text-anchor=&quot;middle&quot;&gt;事實 69&lt;/text&gt;&lt;rect x=&quot;407.8&quot; y=&quot;6&quot; width=&quot;152.1&quot; height=&quot;26&quot; fill=&quot;var(--accent)&quot;&gt;&lt;title&gt;推論 26&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;483.9&quot; y=&quot;24&quot; class=&quot;inb&quot; text-anchor=&quot;middle&quot;&gt;推論 26&lt;/text&gt;&lt;rect x=&quot;559.9&quot; y=&quot;6&quot; width=&quot;35.1&quot; height=&quot;26&quot; fill=&quot;var(--c6)&quot;&gt;&lt;title&gt;作者判斷 6&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;595.0&quot; y=&quot;6&quot; width=&quot;41.0&quot; height=&quot;26&quot; fill=&quot;var(--neg)&quot;&gt;&lt;title&gt;待查 7&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;4&quot; y=&quot;52&quot; class=&quot;ax&quot;&gt;合計 108&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;lg&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--biz)&quot;&gt;&lt;/i&gt;事實 69&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--accent)&quot;&gt;&lt;/i&gt;推論 26&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c6)&quot;&gt;&lt;/i&gt;作者判斷 6&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--neg)&quot;&gt;&lt;/i&gt;待查 7&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;全頁句子依標記分類：事實（原文或財報直接寫的）占 64%；推論與作者判斷是從事實推出或取捨的結論，待查是找不到證據的地方。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估.json#/標記統計&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/section&gt;&lt;section id=&quot;s1&quot;&gt;&lt;h2&gt;1　商業輪廓：賣什麼、賣給誰、怎麼收錢&lt;/h2&gt;&lt;div&gt;&lt;span class=&quot;chip&quot;&gt;訂閱&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;用量計費&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;一次性授權&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cards c3&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;賣什麼&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;創意軟體（Creative Cloud 旗艦應用，如 Photoshop、Illustrator、Premiere）、文件軟體（Acrobat、Acrobat Reader）、生成式 AI（Firefly）與行銷體驗軟體（Adobe Experience Manager 等）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src5&quot;&gt;[5]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src6&quot;&gt;[6]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src7&quot;&gt;[7]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;2026-04-28 完成收購 Semrush（品牌能見度與搜尋最佳化平台，約 18.7 億美元），併入行銷產品線。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src8&quot;&gt;[8]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;賣給誰&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;兩個客戶群：創意與行銷專業人士（Creative &amp;amp; Marketing Professionals），以及商業專業人士與消費者（Business Professionals &amp;amp; Consumers）；2026 財年第三季訂閱收入分別 46.51 億、19.05 億美元。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src9&quot;&gt;[9]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;沒有任何客戶占營收或應收帳款 10% 以上。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src10&quot;&gt;[10]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;怎麼收錢&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;大企業由業務團隊直銷；個人與小型企業經官網 adobe.com 與應用程式商店購買；另有訂閱、按次付費等模式，Creative Cloud 與 Firefly 方案每月附生成點數，免費方案只給少量點數。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src11&quot;&gt;[11]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;訂閱收入主要在合約期間平均認列；部分依交易量計費的產品按用量認列。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src12&quot;&gt;[12]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;營收從哪裡來（2025-11-28 (FY)）&lt;/figcaption&gt;&lt;div class=&quot;sub-t&quot;&gt;依產品（ProductOrService）&lt;/div&gt;&lt;svg viewBox=&quot;0 0 640 190&quot; role=&quot;img&quot; aria-label=&quot;橫條&quot;&gt;&lt;text x=&quot;252&quot; y=&quot;20&quot; class=&quot;lb s&quot; text-anchor=&quot;end&quot;&gt;Subscription&lt;title&gt;Subscription&lt;/title&gt;&lt;/text&gt;&lt;rect x=&quot;260&quot; y=&quot;9&quot; width=&quot;230.0&quot; height=&quot;15&quot; rx=&quot;2&quot; fill=&quot;var(--biz)&quot; opacity=&quot;.8&quot;/&gt;&lt;text x=&quot;496.0&quot; y=&quot;21&quot; class=&quot;vl s&quot;&gt;96.4%&lt;tspan class=&quot;ax&quot;&gt; 年增 11.6%&lt;/tspan&gt;&lt;/text&gt;&lt;text x=&quot;252&quot; y=&quot;46&quot; class=&quot;lb s&quot; text-anchor=&quot;end&quot;&gt;Subscription - Digital Media and Dig…&lt;title&gt;Subscription - Digital Media and Digital Experience&lt;/title&gt;&lt;/text&gt;&lt;rect x=&quot;260&quot; y=&quot;35&quot; width=&quot;228.9&quot; heig 2&quot; y=&quot;74.0&quot; class=&quot;lb s&quot; text-anchor=&quot;end&quot;&gt;業務費用率&lt;/text&gt;&lt;line x1=&quot;222.2&quot; x2=&quot;220.8&quot; y1=&quot;69.0&quot; y2=&quot;69.0&quot; stroke=&quot;var(--biz)&quot; stroke-width=&quot;3&quot; opacity=&quot;.5&quot;/&gt;&lt;circle cx=&quot;222.2&quot; cy=&quot;69.0&quot; r=&quot;5&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;去年同期 27.4%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;220.8&quot; cy=&quot;69.0&quot; r=&quot;5.5&quot; fill=&quot;var(--biz)&quot;&gt;&lt;title&gt;本期 27.0%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;232.2&quot; y=&quot;74.0&quot; class=&quot;vl s&quot;&gt;27.0%&lt;tspan class=&quot;ax&quot;&gt; -0.3 點&lt;/tspan&gt;&lt;/text&gt;&lt;text x=&quot;102&quot; y=&quot;108.0&quot; class=&quot;lb s&quot; text-anchor=&quot;end&quot;&gt;銷管費用率&lt;/text&gt;&lt;line x1=&quot;250.2&quot; x2=&quot;250.4&quot; y1=&quot;103.0&quot; y2=&quot;103.0&quot; stroke=&quot;var(--biz)&quot; stroke-width=&quot;3&quot; opacity=&quot;.5&quot;/&gt;&lt;circle cx=&quot;250.2&quot; cy=&quot;103.0&quot; r=&quot;5&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;去年同期 34.2%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;250.4&quot; cy=&quot;103.0&quot; r=&quot;5.5&quot; fill=&quot;var(--biz)&quot;&gt;&lt;title&gt;本期 34.2%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;260.4&quot; y=&quot;108.0&quot; class=&quot;vl s&quot;&gt;34.2%&lt;tspan class=&quot;ax&quot;&gt; +0.1 點&lt;/tspan&gt;&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;lg&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--biz)&quot;&gt;&lt;/i&gt;本期&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--muted)&quot;&gt;&lt;/i&gt;去年同期&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--neg)&quot;&gt;&lt;/i&gt;變差超過 1 點&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;空心點是去年同期、實心點是本期，右側是變化（百分點）；費用率升或毛利率降超過 1 點標紅。分母是含全部收入的營收。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估底稿.json#/費用率（財報/10-Q_2026-08-28_損益表.json）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/section&gt;&lt;section id=&quot;s2&quot;&gt;&lt;h2&gt;2　商業模式驗證：說的 vs 做的&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;管理層在 10-K、10-Q、8-K 的說法，對照財報數字。判定：已驗證／部分支持／說法未獲數字支持／待查。&lt;/p&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;說的 vs 做的：判定分布&lt;/figcaption&gt;&lt;svg viewBox=&quot;0 0 640 58&quot; role=&quot;img&quot; aria-label=&quot;說的vs做的判定&quot;&gt;&lt;rect x=&quot;4.0&quot; y=&quot;6&quot; width=&quot;158.0&quot; height=&quot;26&quot; fill=&quot;var(--pos)&quot;&gt;&lt;title&gt;已驗證 1&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;83.0&quot; y=&quot;24&quot; class=&quot;inb&quot; text-anchor=&quot;middle&quot;&gt;已驗證 1&lt;/text&gt;&lt;rect x=&quot;162.0&quot; y=&quot;6&quot; width=&quot;316.0&quot; height=&quot;26&quot; fill=&quot;var(--warn)&quot;&gt;&lt;title&gt;部分支持 2&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;320.0&quot; y=&quot;24&quot; class=&quot;inb&quot; text-anchor=&quot;middle&quot;&gt;部分支持 2&lt;/text&gt;&lt;rect x=&quot;478.0&quot; y=&quot;6&quot; width=&quot;158.0&quot; height=&quot;26&quot; fill=&quot;var(--muted)&quot;&gt;&lt;title&gt;待查 1&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;557.0&quot; y=&quot;24&quot; class=&quot;inb&quot; text-anchor=&quot;middle&quot;&gt;待查 1&lt;/text&gt;&lt;text x=&quot;4&quot; y=&quot;52&quot; class=&quot;ax&quot;&gt;合計 4&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;lg&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--pos)&quot;&gt;&lt;/i&gt;已驗證 1&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--warn)&quot;&gt;&lt;/i&gt;部分支持 2&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--muted)&quot;&gt;&lt;/i&gt;待查 1&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;管理層 4 條說法對照財報數字的結果；3 條不是「已驗證」，下方用色框標出（有問題的證據）。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估.json#/內容/說的vs做的/判定&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;div class=&quot;callout warnc&quot;&gt;&lt;b&gt;有問題的證據（判定不是「已驗證」）&lt;/b&gt;&lt;ul class=&quot;badl&quot;&gt;&lt;li&gt;&lt;a href=&quot;#cl1&quot;&gt;總 ARR 成長由核心訂閱帶動&lt;/a&gt; &lt;span class=&quot;v v-部分支持&quot;&gt;部分支持&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a href=&quot;#cl3&quot;&gt;以免費增值擴大用戶帶來長期持久成長&lt;/a&gt; &lt;span class=&quot;v v-部分支持&quot;&gt;部分支持&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a href=&quot;#cl4&quot;&gt;分部合併反映統一銷售與整合產品（口徑改變）&lt;/a&gt; &lt;span class=&quot;v v-待查&quot;&gt;待查&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;div class=&quot;cards&quot;&gt;&lt;div class=&quot;card claim cv-部分支持&quot; id=&quot;cl1&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;總 ARR 成長由核心訂閱帶動&lt;/b&gt;&lt;span class=&quot;v v-部分支持&quot;&gt;部分支持&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;管理層說法&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;10-Q：第三季期末總 ARR 275.0 億美元、年增 11.2%，由 Creative Cloud 旗艦應用、Acrobat、Adobe Experience Manager 與代理式網頁應用帶動，包含 Semrush 的貢獻。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src5&quot;&gt;[5]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對照數字&lt;/div&gt;&lt;ul class=&quot;ev&quot;&gt;&lt;li class=&quot;s&quot;&gt;第二季期末總 ARR 271.0 億美元，其中約 4.8 億來自 Semrush，約占 1.8%（推算）；第三季的 Semrush 貢獻未揭露。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src16&quot;&gt;[16]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;li class=&quot;s&quot;&gt;客戶群訂閱收入第三季 65.56 億美元、年增 14%；全年目標的期末 ARR 年增 10.2%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src9&quot;&gt;[9]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src17&quot;&gt;[17]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;lbl&quot;&gt;說明&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;ARR 與訂閱收入確實雙位數成長，但其中約 1.8 個百分點來自併購，第三季併購貢獻未拆開，內生成長只能推估約一成。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src16&quot;&gt;[16]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src5&quot;&gt;[5]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card claim cv-已驗證&quot; id=&quot;cl2&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;雙位數營收成長並上修全年目標&lt;/b&gt;&lt;span class=&quot;v v-已驗證&quot;&gt;已驗證&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;管理層說法&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;代理財務長 Steve Day：第三季營收與每股盈餘雙位數成長，並上修全年營收與每股盈餘目標。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src18&quot;&gt;[18]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對照數字&lt;/div&gt;&lt;ul class=&quot;ev&quot;&gt;&lt;li class=&quot;s&quot;&gt;第三季營收 67.6 億美元、年增 13%（固定匯率 12%），高於 6 月給的第三季目標 66.7 億～67.2 億美元。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src19&quot;&gt;[19]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src20&quot;&gt;[20]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;li class=&quot;s&quot;&gt;全年營收目標由 265.0 億～266.0 億美元調到 265.76 億～266.26 億美元。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src21&quot;&gt;[21]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src17&quot;&gt;[17]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;li class=&quot;s&quot;&gt;SEC 季度資料：2026-08-28 季單季營收年增 12.9%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src22&quot;&gt;[22]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;lbl&quot;&gt;說明&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;實際營收高於公司自己的區間上緣、全年目標上下緣都上調，說法和數字一致。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src19&quot;&gt;[19]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src20&quot;&gt;[20]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card claim cv-部分支持&quot; id=&quot;cl3&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;以免費增值擴大用戶帶來長期持久成長&lt;/b&gt;&lt;span class=&quot;v v-部分支持&quot;&gt;部分支持&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;管理層說法&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;代理財務長：公司以免費增值（freemium）策略擴大用戶基礎、以代理式體驗加深使用，帶來長期持久的成長；新聞稿稱創意與生產力產品月活躍用戶突破 10 億。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src18&quot;&gt;[18]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src23&quot;&gt;[23]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對照數字&lt;/div&gt;&lt;ul class=&quot;ev&quot;&gt;&lt;li class=&quot;s&quot;&gt;RPO 221.6 億美元，年增 8%；2025 財年末時年增 13%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src24&quot;&gt;[24]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src25&quot;&gt;[25]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;li class=&quot;s&quot;&gt;RPO 增速減近四季營收增速為 −3.6 個百分點；合約負債年增 10.3%，比營收增速低 1.8 個百分點。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src3&quot;&gt;[3]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src26&quot;&gt;[26]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;li class=&quot;s&quot;&gt;付費用戶數與淨收入留存率公司未揭露。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src27&quot;&gt;[27]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;li class=&quot;s&quot;&gt;媒體報導 2026 年 11 月黑色星期五促銷，Creative Cloud Pro 年訂閱折扣 57%；Citi 分析師報告稱公司優先擴大用戶、把新客導向較低單價方案，而不是靠調價。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src28&quot;&gt;[28]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src29&quot;&gt;[29]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;lbl&quot;&gt;說明&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;用戶規模有數字，但已簽未認列的合約增速放慢到營收以下，加上新客導向低單價方案與大幅促銷的報導，免費用戶轉成付費、而且是較長合約與較高單價的證據還看不到。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src24&quot;&gt;[24]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src3&quot;&gt;[3]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src29&quot;&gt;[29]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src28&quot;&gt;[28]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card claim cv-待查&quot; id=&quot;cl4&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;分部合併反映統一銷售與整合產品（口徑改變）&lt;/b&gt;&lt;span class=&quot;v v-待查&quot;&gt;待查&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;管理層說法&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;10-Q：2026 財年第一季把數位媒體、數位體驗、出版與廣告三分部併為單一分部，反映公司轉向統一銷售與整合式產品創新。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src15&quot;&gt;[15]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對照數字&lt;/div&gt;&lt;ul class=&quot;ev&quot;&gt;&lt;li class=&quot;s&quot;&gt;合併後只揭露兩個客戶群的訂閱收入，不再揭露各產品線的營業利益。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src9&quot;&gt;[9]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src15&quot;&gt;[15]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;lbl&quot;&gt;說明&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-待查&quot;&gt;待查&lt;/span&gt;待查：要找統一銷售後交叉銷售或多產品客戶比例的揭露，才能判斷合併是經營方式真的改變，還是只是減少揭露。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;s3&quot;&gt;&lt;h2&gt;3　成長引擎與卡點&lt;/h2&gt;&lt;h3&gt;成長從哪裡來（量、價、新產品、新市場、併購）&lt;/h3&gt;&lt;div class=&quot;cards&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;span class=&quot;chip&quot;&gt;量&lt;/span&gt;&lt;span class=&quot;qz&quot;&gt;能否量化：可量化&lt;/span&gt;&lt;/div&gt;&lt;b&gt;Acrobat 與入門創作工具的用戶擴張&lt;/b&gt;&lt;div class=&quot;lbl&quot;&gt;證據&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;商業專業與消費者客戶群第三季訂閱收入 19.05 億美元、年增 16%，主因 Acrobat。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src9&quot;&gt;[9]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src30&quot;&gt;[30]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;媒體轉述法說會：Acrobat 加 Express 月活躍用戶超過 9 億、年增逾 25%（公司申報只寫總月活躍用戶 10 億）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src31&quot;&gt;[31]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src23&quot;&gt;[23]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;span class=&quot;chip&quot;&gt;量&lt;/span&gt;&lt;span class=&quot;qz&quot;&gt;能否量化：可量化&lt;/span&gt;&lt;/div&gt;&lt;b&gt;專業創作與行銷客戶的核心訂閱&lt;/b&gt;&lt;div class=&quot;lbl&quot;&gt;證據&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;創意與行銷專業客戶群第三季訂閱收入 46.51 億美元、年增 13%，由 Creative Cloud 旗艦應用與 Adobe Experience Manager 帶動，含 Semrush。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src9&quot;&gt;[9]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src30&quot;&gt;[30]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;span class=&quot;chip&quot;&gt;新產品&lt;/span&gt;&lt;span class=&quot;qz&quot;&gt;能否量化：待查&lt;/span&gt;&lt;/div&gt;&lt;b&gt;AI 優先產品（Firefly 應用、點數包、Acrobat AI Assistant）&lt;/b&gt;&lt;div class=&quot;lbl&quot;&gt;證據&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;新聞稿：AI 優先產品 ARR 年增逾 150%；金額公司未揭露，媒體轉述超過 6.5 億美元，約占總 ARR 2.4%（推算）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src23&quot;&gt;[23]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src32&quot;&gt;[32]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;成長快但基數小，短期內不足以改變總營收增速。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src19&quot;&gt;[19]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src32&quot;&gt;[32]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;span class=&quot;chip&quot;&gt;併購&lt;/span&gt;&lt;span class=&quot;qz&quot;&gt;能否量化：可量化&lt;/span&gt;&lt;/div&gt;&lt;b&gt;Semrush、Topaz Labs（非內生）&lt;/b&gt;&lt;div class=&quot;lbl&quot;&gt;證據&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;Semrush 2026-04-28 完成收購（18.7 億美元），第二季期末貢獻 ARR 約 4.8 億美元；Topaz Labs 2026-09-23 完成收購，保留獨立品牌。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src8&quot;&gt;[8]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src16&quot;&gt;[16]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src33&quot;&gt;[33]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src34&quot;&gt;[34]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;這部分成長不是內生；Semrush 滿一年後（2027 財年第二至第三季）營收年增會少掉這塊併購貢獻。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src8&quot;&gt;[8]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src16&quot;&gt;[16]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;近 12 季：營收年增與營業利益率&lt;/figcaption&gt;&lt;svg viewBox=&quot;0 0 680 250&quot; role=&quot;img&quot; aria-label=&quot;近幾季單季營收年增與營業利益率&quot;&gt;&lt;line x1=&quot;50&quot; x2=&quot;640&quot; y1=&quot;216.0&quot; y2=&quot;216.0&quot; class=&quot;zl&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;220.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;0%&lt;/text&gt;&lt;line x1=&quot;50&quot; x2=&quot;640&quot; y1=&quot;167.0&quot; y2=&quot;167.0&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;171.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;10%&lt;/text&gt;&lt;line x1=&quot;50&quot; x2=&quot;640&quot; y1=&quot;118.0&quot; y2=&quot;118.0&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;122.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;20%&lt;/text&gt;&lt;line x1=&quot;50&quot; x2=&quot;640&quot; y1=&quot;69.0&quot; y2=&quot;69.0&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;73.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;30%&lt;/text&gt;&lt;line x1=&quot;50&quot; x2=&quot;640&quot; y1=&quot;20.0&quot; y2=&quot;20.0&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;24.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;40%&lt;/text&gt;&lt;text x=&quot;113.6&quot; y=&quot;238&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;2024-03&lt;/text&gt;&lt;text x=&quot;2 &gt;&lt;/i&gt;亮燈門檻（虛線）&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;G4 另有條件「營收近四季年增低於一年前」，兩個條件都成立才亮燈（目前未亮）。&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;每列一個用財報數字算的訊號：點是目前值，虛線是門檻，點落進淡紅色帶就亮燈；看離門檻還有多少餘裕。是非題型訊號（如連續放緩）不在此圖，見上方燈號。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估.json#/內容/卡住訊號（值、門檻、比較）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;div class=&quot;sub-h&quot;&gt;機械訊號（財報數字算得出）&lt;/div&gt;&lt;div class=&quot;cards&quot;&gt;&lt;div class=&quot;card sig&quot; id=&quot;sig-G1&quot; style=&quot;--tc:var(--lt-未亮, var(--muted))&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;G1　營收增速連續放緩&lt;/b&gt;&lt;span class=&quot;light l-未亮&quot;&gt;未亮&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;成長是不是一季比一季慢？&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;值&lt;/div&gt;&lt;div class=&quot;sv&quot;&gt;否&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;機械值，期末 2026-08-28；門檻  &lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;判讀&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card sig&quot; id=&quot;sig-G2&quot; style=&quot;--tc:var(--lt-未亮, var(--muted))&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;G2　營業利益率走弱&lt;/b&gt;&lt;span class=&quot;light l-未亮&quot;&gt;未亮&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;規模變大，利潤率有沒有跟著變好？&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;值&lt;/div&gt;&lt;div class=&quot;sv&quot;&gt;-0.5 個百分點&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;機械值，期末 2026-08-28；門檻 &amp;lt; -1.0 個百分點&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;判讀&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card sig&quot; id=&quot;sig-G3&quot; style=&quot;--tc:var(--lt-未亮, var(--muted))&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;G3　收款變慢&lt;/b&gt;&lt;span class=&quot;light l-未亮&quot;&gt;未亮&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;營收成長是不是靠放寬收款條件？&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;值&lt;/div&gt;&lt;div class=&quot;sv&quot;&gt;-12.6 個百分點&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;機械值，期末 2026-08-28；門檻 &amp;gt; +10.0 個百分點 --tc:var(--lt-資料未取得, var(--muted))&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;S5　付費客戶增速放緩&lt;/b&gt;&lt;span class=&quot;light l-資料未取得&quot;&gt;資料未取得&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;新客戶還在進來嗎？&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;值&lt;/div&gt;&lt;div class=&quot;sv&quot;&gt;未揭露&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;作者從原文填&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;判讀&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;公司揭露的是月活躍用戶（含免費用戶），付費客戶數未揭露。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src23&quot;&gt;[23]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-待查&quot;&gt;待查&lt;/span&gt;待查：要找付費訂閱數或大型企業客戶數的揭露；月活躍用戶含免費方案，不能代替付費客戶數。&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;h3 id=&quot;ext&quot;&gt;外部驗證：競爭者、客戶、供應商怎麼描述這家公司&lt;/h3&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;外部驗證：誰支持、誰反駁&lt;/figcaption&gt;&lt;div class=&quot;emx&quot; style=&quot;grid-template-columns:repeat(3,1fr)&quot;&gt;&lt;div class=&quot;emc&quot; style=&quot;--tc:var(--pos)&quot;&gt;&lt;div class=&quot;emh&quot;&gt;支持 &lt;b&gt;4&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;emi&quot;&gt;&lt;b&gt;Autodesk&lt;/b&gt;&lt;span&gt;競爭者&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;emi&quot;&gt;&lt;b&gt;Getty Images&lt;/b&gt;&lt;span&gt;競爭者兼內容夥伴&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;emi&quot;&gt;&lt;b&gt;Box&lt;/b&gt;&lt;span&gt;技術整合夥伴&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;emi&quot;&gt;&lt;b&gt;Walt Disney&lt;/b&gt;&lt;span&gt;客戶兼合作夥伴&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;emc&quot; style=&quot;--tc:var(--warn)&quot;&gt;&lt;div class=&quot;emh&quot;&gt;部分支持 &lt;b&gt;0&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;emc&quot; style=&quot;--tc:var(--neg)&quot;&gt;&lt;div class=&quot;emh&quot;&gt;反駁 &lt;b&gt;3&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;emi&quot;&gt;&lt;b&gt;Google（Pics）&lt;/b&gt;&lt;span&gt;競爭者&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;emi&quot;&gt;&lt;b&gt;HSBC 分析師&lt;/b&gt;&lt;span&gt;外部分析師&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;emi&quot;&gt;&lt;b&gt;Citi、Wells Fargo 分析師&lt;/b&gt;&lt;span&gt;外部分析師&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;7 個外部來源（競爭者、客戶、供應商、夥伴的申報或報導）怎麼描述本公司：支持 4、部分支持 0、反駁 3。依「對本公司說法」欄的開頭分類。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估.json#/內容/外部驗證（對方、關係、支持）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;div class=&quot;cards&quot;&gt;&lt;div class=&quot;card ext&quot; style=&quot;--tc:var(--pos)&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;Autodesk&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;競爭者&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;對方文件怎麼說&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;Autodesk 10-K 把 Adobe 列為主要全球競爭者之一。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src36&quot;&gt;[36]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對本公司說法&lt;/div&gt;&lt;div class=&quot;stc&quot;&gt;支持（專業設計軟體的主要玩家）&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card ext&quot; style=&quot;--tc:var(--pos)&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;Getty Images&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;競爭者兼內容夥伴&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;對方文件怎麼說&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;Getty 10-K 說客戶可透過 Adobe Creative Cloud 等外掛使用其內容，並把 Canva、Adobe 的整合方案列為創意內容的主要競爭者。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src37&quot;&gt;[37]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src38&quot;&gt;[38]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對本公司說法&lt;/div&gt;&lt;div class=&quot;stc&quot;&gt;支持（第三方把內容接進 Adobe 工作流程）&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card ext&quot; style=&quot;--tc:var(--pos)&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;Box&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;技術整合夥伴&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;對方文件怎麼說&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;Box 10-K 把 Adobe 列在其技術整合夥伴生態系中。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src39&quot;&gt;[39]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對本公司說法&lt;/div&gt;&lt;div class=&quot;stc&quot;&gt;支持（企業工作流程整合）&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card ext&quot; style=&quot;--tc:var(--neg)&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;Google（Pics）&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;競爭者&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;對方文件怎麼說&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;新聞報導 Google 推出以提示詞生成設計的 AI 工具 Pics，內建於 Workspace 的 Docs 與 Slides，與 Canva、Adobe Express 競爭。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src40&quot;&gt;[40]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src41&quot;&gt;[41]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對本公司說法&lt;/div&gt;&lt;div class=&quot;stc&quot;&gt;反駁（入門設計端的替代壓力）&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card ext&quot; style=&quot;--tc:var(--neg)&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;HSBC 分析師&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;外部分析師&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;對方文件怎麼說&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;HSBC 分析師指出一家只有數人的公司發布自動寫碼產生的免費仿製軟體（含 Photoshop、Illustrator、Premiere、Acrobat 的版本），並把 Adobe 視為 AI 顛覆的現實候選者。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src42&quot;&gt;[42]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src43&quot;&gt;[43]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對本公司說法&lt;/div&gt;&lt;div class=&quot;stc&quot;&gt;反駁（軟體複製門檻下降）&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card ext&quot; style=&quot;--tc:var(--pos)&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;Walt Disney&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;客戶兼合作夥伴&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;對方文件怎麼說&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;Adobe 與 Disney 在 Adobe MAX 宣布多年期策略聯盟；聯合新聞稿說 Disney Imagineering 研發部門已用 Adobe Firefly Foundry 的草圖轉圖像與客製圖像模型產出概念美術。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src44&quot;&gt;[44]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src45&quot;&gt;[45]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對本公司說法&lt;/div&gt;&lt;div class=&quot;stc&quot;&gt;支持（大型內容客戶採用 Firefly 企業客製模型；屬雙方聯合發布，非第三方獨立評價）&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card ext&quot; style=&quot;--tc:var(--neg)&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;Citi、Wells Fargo 分析師&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;外部分析師&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;對方文件怎麼說&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;Citi 分析師報告看淡 2027 財年展望、點出領導層多個職缺；Wells Fargo 分析師指出內生成長轉弱、管理層交接的執行風險，以及由調價轉向免費增值的變現方式。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src46&quot;&gt;[46]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src47&quot;&gt;[47]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src48&quot;&gt;[48]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對本公司說法&lt;/div&gt;&lt;div class=&quot;stc&quot;&gt;反駁（內生成長與變現方式受質疑）&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;sa&quot;&gt;&lt;h2&gt;4　優勢來源與持續期間&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;每種優勢都要同時有「好處」與「屏障」證據（Helmer《7 Powers》的檢驗）：只有好處、沒有屏障的優勢只算&lt;b&gt;暫時領先&lt;/b&gt;。再分兩維：超額報酬有多大、能撐多久（Mauboussin《Measuring the Moat》的問法）；Morningstar 五種來源只當分類參考。本節只談商業面的屏障，不含價格或估值，也不是估值報告的護城河評分，不進商業動能等級。&lt;/p&gt;&lt;div class=&quot;callout&quot;&gt;&lt;b&gt;總結&lt;/b&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;主要優勢是專業工作流程的轉換成本，換到同業最高的利潤率，屏障證據是媒體對訓練與檔案格式綁定的描述，持續期間主要靠自身歷史支撐；生成式 AI 的商業安全定位沒有屏障事實，只算暫時領先，而入門端的屏障正被免費 AI 工具削弱。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src49&quot;&gt;[49]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src50&quot;&gt;[50]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src4&quot;&gt;[4]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src40&quot;&gt;[40]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;優勢地圖：多大、多久&lt;/figcaption&gt;&lt;div class=&quot;amx&quot;&gt;&lt;div class=&quot;amy&quot;&gt;持續期間 →&lt;/div&gt;&lt;div class=&quot;amg&quot;&gt;&lt;div class=&quot;amr&quot; style=&quot;grid-template-columns:80px repeat(4,1fr)&quot;&gt;&lt;div class=&quot;aml&quot;&gt;10年以上&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amc unk&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;amr&quot; style=&quot;grid-template-columns:80px repeat(4,1fr)&quot;&gt;&lt;div class=&quot;aml&quot;&gt;5–10年&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;span class=&quot;ab ab-有屏障證據&quot; title=&quot;專業創作工作流程的轉換成本：有屏障證據&quot;&gt;1&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;amc unk&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;amr&quot; style=&quot;grid-template-columns:80px repeat(4,1fr)&quot;&gt;&lt;div class=&quot;aml&quot;&gt;不足5年&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amc unk&quot;&gt;&lt;span class=&quot;ab ab-暫時領先&quot; title=&quot;商業安全的生成式 AI（授權訓練資料與智財賠償）：暫時領先&quot;&gt;2&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;amr&quot; style=&quot;grid-template-columns:80px repeat(4,1fr)&quot;&gt;&lt;div class=&quot;aml&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amx-l&quot;&gt;小&lt;/div&gt;&lt;div class=&quot;amx-l&quot;&gt;中&lt;/div&gt;&lt;div class=&quot;amx-l&quot;&gt;大&lt;/div&gt;&lt;div class=&quot;amx-l&quot;&gt;不明&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;amxt&quot;&gt;超額報酬大小 →&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;ol class=&quot;akey&quot;&gt;&lt;li&gt;&lt;span class=&quot;ab ab-有屏障證據&quot;&gt;1&lt;/span&gt;專業創作工作流程的轉換成本（轉換成本；有屏障證據）&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;ab ab-暫時領先&quot;&gt;2&lt;/span&gt;商業安全的生成式 AI（授權訓練資料與智財賠償）（獨占資源；暫時領先）&lt;/li&gt;&lt;/ol&gt;&lt;div class=&quot;lg&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--pos)&quot;&gt;&lt;/i&gt;有屏障證據&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--warn)&quot;&gt;&lt;/i&gt;暫時領先&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;每個圓圈是一項優勢：越往右超額報酬越大、越往上能撐越久。綠＝屏障有事實證據；橘＝只有好處或屏障只有推論（暫時領先，持續期間最多不足 5 年）。作者寫「不明」的維度放在虛線格，不補值。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估.json#/內容/優勢來源/優勢（超額報酬大小、持續期間、判定）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;每項優勢有多少證據&lt;/figcaption&gt;&lt;svg viewBox=&quot;0 0 680 128&quot; role=&quot;img&quot; aria-label=&quot;優勢的證據數：好處與屏障&quot;&gt;&lt;text x=&quot;254&quot; y=&quot;124&quot; class=&quot;ax&quot;&gt;好處句數&lt;/text&gt;&lt;text x=&quot;459.0&quot; y=&quot;124&quot; class=&quot;ax&quot;&gt;屏障句數（事實／推論）&lt;/text&gt;&lt;text x=&quot;242&quot; y=&quot;32&quot; class=&quot;lb s&quot; text-anchor=&quot;end&quot;&gt;1 專業創作工作流程的轉換成本&lt;title&gt;1 專業創作工作流程的轉換成本&lt;/title&gt;&lt;/text&gt;&lt;rect x=&quot;250&quot; y=&quot;20&quot; width=&quot;165.0&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;420.0&quot; y=&quot;33&quot; class=&quot;vl s&quot;&gt;5&lt;/text&gt;&lt;rect x=&quot;455.0&quot; y=&quot;20&quot; width=&quot;33.0&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;var(--pos)&quot;/&gt;&lt;rect x=&quot;488.0&quot; y=&quot;20&quot; width=&quot;33.0&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;var(--accent)&quot; opacity=&quot;.7&quot;/&gt;&lt;text x=&quot;526.0&quot; y=&quot;33&quot; class=&quot;vl s&quot;&gt;1／1&lt;/text&gt;&lt;text x=&quot;242&quot; y=&quot;78&quot; class=&quot;lb s&quot; text-anchor=&quot;end&quot;&gt;2 商業安全的生成式 AI（授權訓練…&lt;title&gt;2 商業安全的生成式 AI（授權訓練資料與智財賠償）&lt;/title&gt;&lt;/text&gt;&lt;rect x=&quot;250&quot; y=&quot;66&quot; width=&quot;66.0&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;321.0&quot; y=&quot;79&quot; class=&quot;vl s&quot;&gt;2&lt;/text&gt;&lt;rect x=&quot;455.0&quot; y=&quot;66&quot; width=&quot;0.0&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;var(--pos)&quot;/&gt;&lt;rect x=&quot;455.0&quot; y=&quot;66&quot; width=&quot;33.0&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;var(--accent)&quot; opacity=&quot;.7&quot;/&gt;&lt;text x=&quot;493.0&quot; y=&quot;79&quot; class=&quot;vl s&quot;&gt;0／1&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;lg&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c3)&quot;&gt;&lt;/i&gt;好處&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--pos)&quot;&gt;&lt;/i&gt;屏障：事實&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--accent)&quot;&gt;&lt;/i&gt;屏障：推論&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;左邊是「它帶來什麼」的句數，右邊是「為什麼對手拿不走」的句數；屏障至少一句是事實（綠）才算有屏障證據。句數多不等於優勢強，只表示證據量。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估.json#/內容/優勢來源/優勢（好處、屏障的標記）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;div class=&quot;card advc&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;&lt;span class=&quot;num-b 有屏障證據&quot;&gt;1&lt;/span&gt;專業創作工作流程的轉換成本&lt;/b&gt;&lt;span class=&quot;vd vd-有屏障證據&quot;&gt;有屏障證據&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;轉換成本（Switching Costs）｜晨星：轉換成本&lt;/div&gt;&lt;div class=&quot;two&quot;&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;好處（它帶來什麼）&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;訂閱占營收 96% 以上，近四季營業利益率 35.7%，近 20 季在 30.0%～36.8% 之間。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src13&quot;&gt;[13]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src49&quot;&gt;[49]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;客戶持續續訂、公司能維持高利潤率，代表專業用戶留在 Adobe 的工作流程裡。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src49&quot;&gt;[49]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src9&quot;&gt;[9]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;第三方把自己的產品接進 Adobe：Getty 的內容可透過 Adobe Creative Cloud 外掛取用，Box 把 Adobe 列為技術整合夥伴。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src37&quot;&gt;[37]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src39&quot;&gt;[39]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;公司自述 Illustrator 是業界標準的向量繪圖應用，全球各類設計師使用。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src6&quot;&gt;[6]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;周邊夥伴主動接進 Adobe、公司產品被當成設計工作的標準工具，代表用戶與夥伴偏好留在 Adobe 的生態裡；這是好處，不是對手拿不走的原因。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src37&quot;&gt;[37]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src39&quot;&gt;[39]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src6&quot;&gt;[6]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;屏障（為什麼對手拿不走）&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;媒體報導寫：Adobe 的優勢一向是工作流程綁定，專業人士花多年學習它的工具，代理商圍繞它的檔案格式建立整條製作流程，要換掉就得重新訓練人員、重建流程。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src50&quot;&gt;[50]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;對手即使功能追上，客戶仍要自己承擔重新訓練與重建流程的成本，所以這部分不是用功能或降價就能搶走；但公司未揭露續約率或流失率，屏障的強度沒有公司數字可量。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src50&quot;&gt;[50]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src9&quot;&gt;[9]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;two&quot;&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;超額報酬大小&lt;/div&gt;&lt;span class=&quot;lv&quot;&gt;大&lt;/span&gt;&lt;div class=&quot;s&quot;&gt;近四季營業利益率 35.7%，高於所有訂閱軟體同業（INTU 28.8%、ADSK 27.9%、CRM 21.5%、WDAY 12.0%、NOW 9.7%），同業百分位 1.0；財務投入資本口徑 ROIC 近五年中位約 44%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src49&quot;&gt;[49]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src51&quot;&gt;[51]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;持續期間&lt;/div&gt;&lt;span class=&quot;lv&quot;&gt;5–10年&lt;/span&gt;&lt;div class=&quot;s&quot;&gt;2015–2025 財年營收下降年數 0／10，近 20 季近四季營業利益率在 30.0%～36.8% 之間。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src52&quot;&gt;[52]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src49&quot;&gt;[49]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;區間低點 30.0% 是 2024 財年 Figma 併購終止費 10 億美元一次性費用所致（推算見週期推論），排除後利潤率區間更窄。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src53&quot;&gt;[53]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src54&quot;&gt;[54]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;屏障事實目前只有一則媒體描述（訓練成本與檔案格式綁定），5–10 年主要靠自身歷史支撐：經過 Figma、Canva 等對手與轉訂閱期，營收十年沒有下降、利潤率維持窄幅；而公司自列的競爭已包括 AI 優先創作工具與內建於大型平台的創作工具，入門端的屏障在變薄，所以給 5–10 年而不是 10 年以上。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src50&quot;&gt;[50]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src52&quot;&gt;[52]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src55&quot;&gt;[55]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src4&quot;&gt;[4]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src40&quot;&gt;[40]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card advc&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;&lt;span class=&quot;num-b 暫時領先&quot;&gt;2&lt;/span&gt;商業安全的生成式 AI（授權訓練資料與智財賠償）&lt;/b&gt;&lt;span class=&quot;vd vd-暫時領先&quot;&gt;暫時領先&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;獨占資源（Cornered Resource）｜晨星：無形資產&lt;/div&gt;&lt;div class=&quot;two&quot;&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;好處（它帶來什麼）&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;AI 優先產品 ARR 年增逾 150%；企業客戶在多數 Firefly 工作流程可取得智財賠償。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src23&quot;&gt;[23]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src7&quot;&gt;[7]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;Firefly 模型只用 Adobe 有權使用的資料訓練，每個生成檔案附內容憑證。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src7&quot;&gt;[7]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;屏障（為什麼對手拿不走）&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;授權訓練資料、內容憑證與賠償承諾是產品設計，對手也能以資金買到授權資料或提供賠償承諾；公司沒有揭露對手拿不走的原因（例如獨家授權或期限），屏障只有推論，判為暫時領先。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src7&quot;&gt;[7]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src55&quot;&gt;[55]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;two&quot;&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;超額報酬大小&lt;/div&gt;&lt;span class=&quot;lv&quot;&gt;不明&lt;/span&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-待查&quot;&gt;待查&lt;/span&gt;待查：AI 優先產品的營收或利潤公司未揭露，ARR 金額只有媒體轉述。&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;持續期間&lt;/div&gt;&lt;span class=&quot;lv&quot;&gt;不足5年&lt;/span&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;授權資料可由對手另行取得，生成式模型更新快，這項優勢較接近暫時領先。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src7&quot;&gt;[7]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src56&quot;&gt;[56]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;超額報酬的機械參考：利潤率位置&lt;/figcaption&gt;&lt;svg viewBox=&quot;0 0 680 92&quot; role=&quot;img&quot; aria-label=&quot;近四季營業利益率在近20季範圍的位置&quot;&gt;&lt;line x1=&quot;30.0&quot; x2=&quot;30.0&quot; y1=&quot;18&quot; y2=&quot;64&quot; class=&quot;zl&quot;/&gt;&lt;text x=&quot;30.0&quot; y=&quot;84&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;0%&lt;/text&gt;&lt;line x1=&quot;185.0&quot; x2=&quot;185.0&quot; y1=&quot;18&quot; y2=&quot;64&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;185.0&quot; y=&quot;84&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;10%&lt;/text&gt;&lt;line x1=&quot;340.0&quot; x2=&quot;340.0&quot; y1=&quot;18&quot; y2=&quot;64&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;340.0&quot; y=&quot;84&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;20%&lt;/text&gt;&lt;line x1=&quot;495.0&quot; x2=&quot;495.0&quot; y1=&quot;18&quot; y2=&quot;64&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;495.0&quot; y=&quot;84&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;30%&lt;/text&gt;&lt;line x1=&quot;650.0&quot; x2=&quot;650.0&quot; y1=&quot;18&quot; y2=&quot;64&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;650.0&quot; y=&quot;84&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;40%&lt;/text&gt;&lt;rect x=&quot;494.2&quot; y=&quot;30&quot; width=&quot;105.6&quot; height=&quot;22&quot; rx=&quot;4&quot; fill=&quot;var(--biz)&quot; opacity=&quot;.22&quot;/&gt;&lt;text x=&quot;494.2&quot; y=&quot;24&quot; class=&quot;ax&quot;&gt;近 20 季範圍 29.9%～36.8%&lt;/text&gt;&lt;circle cx=&quot;583.4&quot; cy=&quot;41&quot; r=&quot;7&quot; fill=&quot;var(--biz)&quot;/&gt;&lt;text x=&quot;583.4&quot; y=&quot;76&quot; class=&quot;vl s&quot; text-anchor=&quot;middle&quot;&gt;近四季 35.7%&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;藍帶是近 20 季的近四季營業利益率範圍，圓點是最新值；同業營業利益率百分位 1.0（1＝同業最高）。只供對照「超額報酬大小」，不是分數、不進等級，也不是估值報告的護城河評分。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估底稿.json#/優勢參考&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;p class=&quot;lead&quot;&gt;機械參考（供對照超額報酬，不是分數）：近四季營業利益率 35.7%，近 20 季範圍 29.9%～36.8%，同業營業利益率百分位 1.0。&lt;/p&gt;&lt;div class=&quot;note&quot;&gt;判定規則：屏障欄至少一句標「事實」並附出處才算「有屏障證據」；否則只算「暫時領先」，持續期間最多寫「不足5年」。&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;s4&quot;&gt;&lt;h2&gt;5　生命週期與未來變化&lt;/h2&gt;&lt;div class=&quot;stages&quot;&gt;&lt;div class=&quot;&quot;&gt;起步&lt;/div&gt;&lt;div class=&quot;&quot;&gt;成長&lt;/div&gt;&lt;div class=&quot;on&quot;&gt;成熟&lt;/div&gt;&lt;div class=&quot;&quot;&gt;衰退&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;lead&quot;&gt;估值報告的林區分類（引用，不重判）：穩定成長股&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;近四季營收 259.7 億美元、年增 12.0%；2015–2025 財年營收沒有下降年，但 2022 財年起年增降到 10%～12%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src2&quot;&gt;[2]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src52&quot;&gt;[52]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;近四季資本支出只占營收 0.8%，營運投入資本為負（客戶預付的遞延收入大於應收與設備）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src57&quot;&gt;[57]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src58&quot;&gt;[58]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;成長靠既有產品線的訂閱擴張與併購補充，沒有需要大量投資的新市場，這是成熟期的型態。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src30&quot;&gt;[30]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src8&quot;&gt;[8]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;研究報告的林區分類是「穩定成長股」，與本頁的成熟期判斷一致：規模大、成長穩定在一成上下。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src59&quot;&gt;[59]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src60&quot;&gt;[60]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;callout&quot;&gt;&lt;b&gt;最可能的轉變：維持成熟期；下行方向是入門端被生成式 AI 工具替代、轉向成熟後段，上行方向是 AI 優先產品放大後回到較快成長&lt;/b&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;若商業專業與消費者客戶群訂閱收入年增連兩季低於 10%，且 RPO 增速持續低於營收，代表入門端流失開始影響合約，轉向成熟後段。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src9&quot;&gt;[9]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src3&quot;&gt;[3]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;若扣除併購後營收年增回到 12% 以上，且 AI 優先產品占總 ARR 明顯上升，則延續成長期的特徵。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src23&quot;&gt;[23]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src16&quot;&gt;[16]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lead&quot;&gt;怎麼檢驗&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;看 2026 財年 10-K 與 2027 財年各季 10-Q 的客戶群訂閱收入、RPO 與 2027 財年目標（觀察清單第 1、2 條）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src9&quot;&gt;[9]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src24&quot;&gt;[24]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;s5&quot;&gt;&lt;h2&gt;6　週期推論&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;三種證據都寫成「區間＋條件」，不給單一日期。&lt;/p&gt;&lt;div class=&quot;callout&quot;&gt;&lt;b&gt;綜合：未來 2–4 季（2026 財年第四季至 2027 財年第三季）營收增速由約 12% 回落到 8%–10% 的區間&lt;/b&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;第四季目標對應年增約 10%，Semrush 在 2027 財年第二至第三季滿一年後併購貢獻消失，RPO 增速已低於營收；三者同向時，近四季營收年增在 2027 財年中回到 8%–10%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src61&quot;&gt;[61]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src8&quot;&gt;[8]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src3&quot;&gt;[3]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;若 2027 財年目標的期末 ARR 年增仍在 10% 以上、RPO 增速回到營收之上，則增速維持在 10%–12% 的平台，回落延後。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src17&quot;&gt;[17]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src24&quot;&gt;[24]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;Adobe 的營收週期由產品轉型、併購與用戶結構決定，不跟一般景氣同步；利潤率靠訂閱撐住、波動小，這一輪要看的是增速平台會不會往下移一階。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src62&quot;&gt;[62]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src63&quot;&gt;[63]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;h3&gt;① 自身歷史循環&lt;/h3&gt;&lt;div class=&quot;chart&quot;&gt;&lt;svg viewBox=&quot;0 0 720 240&quot; role=&quot;img&quot; aria-label=&quot;近四季營收年增（2010-03-05～2026-08-28（67 季））&quot;&gt;&lt;line x1=&quot;46&quot; x2=&quot;704&quot; y1=&quot;210.0&quot; y2=&quot;210.0&quot; stroke=&quot;var(--line)&quot; stroke-width=&quot;1&quot;/&gt;&lt;text x=&quot;40&quot; y=&quot;214.0&quot; font-size=&quot;11&quot; text-anchor=&quot;end&quot; fill=&quot;var(--muted)&quot;&gt;-13%&lt;/text&gt;&lt;line x1=&quot;46&quot; x2=&quot;704&quot; y1=&quot;156.3&quot; y2=&quot;156.3&quot; stroke=&quot;var(--line)&quot; stroke-width=&quot;1.4&quot;/&gt;&lt;text x=&quot;40&quot; y=&quot;160.3&quot; font-size=&quot;11&quot; text-anchor=&quot;end&quot; fill=&quot;var(--muted)&quot;&gt;0%&lt;/text&gt;&lt;line x1=&quot;46&quot; x2=&quot;704&quot; y1=&quot;28.0&quot; y2=&quot;28.0&quot; stroke=&quot;var(--line)&quot; stroke-width=&quot;1&quot;/&gt;&lt;text x=&quot;40&quot; y=&quot;32.0&quot; font-size=&quot;11&quot; text-anchor=&quot;end&quot; fill=&quot;var(--muted)&quot;&gt;32%&lt;/text&gt;&lt;text x=&quot;46.0&quot; y=&quot;232&quot; font-size=&quot;11&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--muted)&quot;&gt;2010-03&lt;/text&gt;&lt;text x=&quot;155.7&quot; y=&quot;232&quot; font-size=&quot;11&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--muted)&quot;&gt;2012-11&lt;/text&gt;&lt;text x=&quot;265.3&quot; y=&quot;232&quot; font-size=&quot;11&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--muted)&quot;&gt;20
