&lt;div class=&quot;wrap&quot;&gt;&lt;div class=&quot;top&quot;&gt;&lt;div&gt;&lt;b&gt;ADBE&lt;/b&gt;　Adobe Inc.（Adobe）&lt;/div&gt;&lt;div&gt;財報截至 2026-08-28&lt;/div&gt;&lt;div class=&quot;dl&quot;&gt;&lt;button type=&quot;button&quot; data-dl=&quot;html&quot; data-name=&quot;ADBE_研究報告.html&quot;&gt;下載網頁&lt;/button&gt;&lt;button type=&quot;button&quot; data-dl=&quot;csv&quot; data-name=&quot;ADBE_報告表格.csv&quot;&gt;下載表格（Excel 可開）&lt;/button&gt;&lt;button type=&quot;button&quot; onclick=&quot;window.print()&quot; title=&quot;可選「另存為 PDF」&quot;&gt;列印／另存 PDF&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;front&quot; id=&quot;front&quot; data-layer=&quot;首頁&quot;&gt;&lt;header class=&quot;hero&quot;&gt;&lt;div&gt;&lt;span class=&quot;stance&quot;&gt;生意品質一流／價格偏低（低於市場常態）&lt;/span&gt;&lt;span class=&quot;stance rating&quot;&gt;研究評等　生意品質一流 ／ 價格偏低（低於市場常態）（非買賣建議）&lt;/span&gt;&lt;h1&gt;訂閱現金機器被 &lt;abbr title=&quot;AI（Artificial Intelligence）&quot;&gt;人工智慧&lt;/abbr&gt; 恐懼壓到歷史低倍數：生意一流、價格偏低，要盯入門端折扣與流失&lt;/h1&gt;&lt;p class=&quot;summary&quot;&gt;Adobe 靠創作與文件軟體的訂閱賺錢，近四季營收年增 12.0%，自由現金流 10,592 百萬美元。合理價值約 266.04–349.81 美元，2026-11-16 收盤 246.00 美元 略高於買入上限 241.99 美元、低於合理區間下緣。市價只要求營收每年約 4.1%（市價反推未來 5 年營收年增；市價 246.00 美元、收盤 2026-11-16；折現率 10.10%；推導），低於實績；但 人工智慧 替代入門用戶與折扣擴大的壓力尚未被證偽。&lt;/p&gt;&lt;/div&gt;&lt;/header&gt;&lt;div class=&quot;layer&quot; id=&quot;layer-30s&quot; style=&quot;margin-top:22px&quot;&gt;&lt;div class=&quot;cap&quot; style=&quot;font-weight:700;letter-spacing:.1em&quot;&gt;30 秒版&lt;/div&gt;&lt;section class=&quot;note-box&quot; id=&quot;expected-return&quot; style=&quot;margin-top:18px&quot;&gt;&lt;h3&gt;以現價買進的預期年報酬&lt;/h3&gt;&lt;p style=&quot;font-size:20px;font-weight:700;margin:4px 0 8px&quot;&gt;基準情境成真時，每年約 11.8%&lt;/p&gt;&lt;div class=&quot;rows&quot;&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;10 年期美國公債&lt;/span&gt;&lt;span&gt;5.1%&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;本報告要求報酬（&lt;abbr title=&quot;WACC（Weighted Average Cost of Capital）&quot;&gt;資金成本&lt;/abbr&gt;）&lt;/span&gt;&lt;span&gt;10.1%&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;保守情境成真時&lt;/span&gt;&lt;span&gt;7.5%&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;樂觀情境成真時&lt;/span&gt;&lt;span&gt;15.2%&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin:8px 0 0&quot;&gt;條件式推算：各情境成真、以收盤價買進時的年化報酬（使估值等於現價的折現率）；不是機率加權結果，也不是預測；非買賣建議，不進研究評等。&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;note-box&quot; id=&quot;bet&quot; style=&quot;margin-top:18px&quot;&gt;&lt;h3&gt;你在賭什麼：要讓現價 246.00 合理，長期營業利益率得維持多少？&lt;/h3&gt;&lt;p class=&quot;cap&quot; style=&quot;margin:0&quot;&gt;欄是折現率，列是成長情境&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table style=&quot;min-width:0;font-size:14px&quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th style=&quot;white-space:nowrap;text-align:center&quot;&gt;10.1%&lt;br&gt;&lt;small&gt;本報告&lt;/small&gt;&lt;/th&gt;&lt;th style=&quot;white-space:nowrap;text-align:center&quot;&gt;9.0%&lt;/th&gt;&lt;th style=&quot;white-space:nowrap;text-align:center&quot;&gt;11.8%&lt;br&gt;&lt;small&gt;市價反推&lt;/small&gt;&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td style=&quot;text-align:center&quot;&gt;&lt;b style=&quot;color:#b7791f&quot;&gt;36%&lt;/b&gt;&lt;/td&gt;&lt;td style=&quot;text-align:center&quot;&gt;&lt;b style=&quot;color:var(--pos)&quot;&gt;29%&lt;/b&gt;&lt;/td&gt;&lt;td style=&quot;text-align:center&quot;&gt;&lt;b style=&quot;color:#b7791f&quot;&gt;49%&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td style=&quot;text-align:center&quot;&gt;&lt;b style=&quot;color:var(--pos)&quot;&gt;26%&lt;/b&gt;&lt;/td&gt;&lt;td style=&quot;text-align:center&quot;&gt;&lt;b style=&quot;color:var(--pos)&quot;&gt;20%&lt;/b&gt;&lt;/td&gt;&lt;td style=&quot;text-align:center&quot;&gt;&lt;b style=&quot;color:var(--pos)&quot;&gt;35%&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td style=&quot;text-align:center&quot;&gt;&lt;b style=&quot;color:var(--pos)&quot;&gt;17%&lt;/b&gt;&lt;/td&gt;&lt;td style=&quot;text-align:center&quot;&gt;&lt;b style=&quot;color:var(--pos)&quot;&gt;13%&lt;/b&gt;&lt;/td&gt;&lt;td style=&quot;text-align:center&quot;&gt;&lt;b style=&quot;color:var(--pos)&quot;&gt;23%&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;目前營業利益率 35.7%（近四季）。綠＝不高於目前，現在就做得到；黃＝要比現在更好；紅＝解不到或高於 80%。利潤率由目前逐年走到該值，其他假設照各情境；條件式推算，非預測、非買賣建議。&lt;/p&gt;&lt;/section&gt;&lt;section id=&quot;lights&quot; style=&quot;margin-top:18px&quot;&gt;&lt;h3&gt;四個面向&lt;/h3&gt;&lt;div class=&quot;kpis&quot;&gt;&lt;div class=&quot;kpi&quot; style=&quot;border-left:4px solid var(--pos)&quot;&gt;&lt;div class=&quot;l&quot;&gt;生意品質&lt;/div&gt;&lt;div class=&quot;v&quot; style=&quot;color:var(--pos)&quot;&gt;一流&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;護城河、投入資本報酬、現金流品質、資產負債表、治理五項合評&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot; style=&quot;border-left:4px solid var(--pos)&quot;&gt;&lt;div class=&quot;l&quot;&gt;商業動能&lt;/div&gt;&lt;div class=&quot;v&quot; style=&quot;color:var(--pos)&quot;&gt;B（五級 A–E）&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;商業評估分頁：模式穩固度、成長動能、卡住訊號&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot; style=&quot;border-left:4px solid var(--pos)&quot;&gt;&lt;div class=&quot;l&quot;&gt;信用與存活&lt;/div&gt;&lt;div class=&quot;v&quot; style=&quot;color:var(--pos)&quot;&gt;無明顯警訊&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;機構 Moody&amp;#x27;s A1、S&amp;amp;P A+；12～24 個月存活檢查（推導，非違約預測）&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot; style=&quot;border-left:4px solid var(--pos)&quot;&gt;&lt;div class=&quot;l&quot;&gt;價格&lt;/div&gt;&lt;div class=&quot;v&quot; style=&quot;color:var(--pos)&quot;&gt;偏低&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;低於市場常態；對照合理價值區間與買入上限，非買賣建議&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;/div&gt;&lt;div class=&quot;layer&quot; id=&quot;layer-try&quot; style=&quot;margin-top:22px&quot;&gt;&lt;div class=&quot;cap&quot; style=&quot;font-weight:700;letter-spacing:.1em&quot;&gt;自己試試看&lt;/div&gt;&lt;section class=&quot;note-box&quot; id=&quot;tool&quot; style=&quot;margin-top:18px&quot;&gt;&lt;h3&gt;調整假設，看每股值多少&lt;/h3&gt;&lt;div class=&quot;seg&quot; style=&quot;display:flex;gap:6px&quot;&gt;&lt;button type=&quot;button&quot; data-s=&quot;保守&quot; aria-pressed=&quot;false&quot; style=&quot;flex:1;padding:6px&quot;&gt;保守&lt;br&gt;&lt;small&gt;第 1 年 +7%&lt;/small&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; data-s=&quot;基準&quot; aria-pressed=&quot;true&quot; style=&quot;flex:1;padding:6px&quot;&gt;基準&lt;br&gt;&lt;small&gt;第 1 年 +10%&lt;/small&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; data-s=&quot;樂觀&quot; aria-pressed=&quot;false&quot; style=&quot;flex:1;padding:6px&quot;&gt;樂觀&lt;br&gt;&lt;small&gt;第 1 年 +14%&lt;/small&gt;&lt;/button&gt;&lt;/div&gt;&lt;label style=&quot;display:block;margin-top:10px&quot;&gt;10 年後的營業利益率 &lt;b id=&quot;t-mv&quot;&gt;&lt;/b&gt;&lt;input id=&quot;t-m&quot; type=&quot;range&quot; min=&quot;8.0&quot; max=&quot;54.0&quot; step=&quot;0.5&quot; style=&quot;width:100%&quot;&gt;&lt;/label&gt;&lt;small class=&quot;cap&quot;&gt;目前 35.7%；第 1～5 年照情境，之後逐年走到這個數字&lt;/small&gt;&lt;label style=&quot;display:block;margin-top:10px&quot;&gt;折現率（要求的報酬） &lt;b id=&quot;t-wv&quot;&gt;&lt;/b&gt;&lt;input id=&quot;t-w&quot; type=&quot;range&quot; min=&quot;7.1&quot; max=&quot;13.1&quot; step=&quot;0.1&quot; style=&quot;width:100%&quot;&gt;&lt;/label&gt;&lt;small class=&quot;cap&quot;&gt;本報告 10.1%；10 年期美國公債 5.12%&lt;/small&gt;&lt;div class=&quot;rows&quot; style=&quot;margin-top:10px&quot;&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;每股價值（這組假設）&lt;/span&gt;&lt;span&gt;&lt;b id=&quot;t-out&quot; style=&quot;font-size:22px&quot;&gt;&lt;/b&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;與現價 246.00 比&lt;/span&gt;&lt;span id=&quot;t-diff&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;p id=&quot;t-say&quot; style=&quot;margin:6px 0 0&quot;&gt;&lt;/p&gt;&lt;p class=&quot;cap&quot;&gt;簡化模型：同估值引擎的式子，只改這三項；預設值與引擎各情境一致，和完整報告的機率加權合理價值可能差 ±10%。本報告合理價值區間 266.04–349.81（三情境機率加權）。非目標價、非買賣建議。&lt;/p&gt;&lt;script type=&quot;application/json&quot; id=&quot;tool-data&quot;&gt;{&quot;base_revenue&quot;: 25970, &quot;bridge&quot;: {&quot;cash&quot;: 4359, &quot;securities&quot;: 1280, &quot;securities_haircut&quot;: 0.0, &quot;operating_cash_reserve&quot;: 0, &quot;debt&quot;: 6762, &quot;other_claims&quot;: 0, &quot;shares&quot;: 391.5}, &quot;wacc&quot;: 0.10095701953022675, &quot;price&quot;: 246.0, &quot;情境&quot;: {&quot;保守&quot;: {&quot;growth&quot;: [0.07, 0.05, 0.04, 0.03, 0.03], &quot;ebit_margin&quot;: [0.33, 0.31, 0.29, 0.27, 0.25], &quot;terminal_margin&quot;: 0.23, &quot;sales_to_capital&quot;: 2.1, &quot;tax&quot;: 0.22, &quot;terminal_g&quot;: 0.025, &quot;terminal_roic&quot;: 0.131, &quot;fade_years&quot;: 10}, &quot;基準&quot;: {&quot;growth&quot;: [0.1, 0.09, 0.08, 0.07, 0.06], &quot;ebit_margin&quot;: [0.35, 0.355, 0.36, 0.36, 0.36], &quot;terminal_margin&quot;: 0.35, &quot;sales_to_capital&quot;: 3.0, &quot;tax&quot;: 0.22, &quot;terminal_g&quot;: 0.025, &quot;terminal_roic&quot;: 0.131, &quot;fade_years&quot;: 10}, &quot;樂觀&quot;: {&quot;growth&quot;: [0.14, 0.13, 0.12, 0.11, 0.1], &quot;ebit_margin&quot;: [0.36, 0.37, 0.38, 0.39, 0.4], &quot;terminal_margin&quot;: 0.39, &quot;sales_to_capital&quot;: 4.0, &quot;tax&quot;: 0.22, &quot;terminal_g&quot;: 0.025, &quot;terminal_roic&quot;: 0.131, &quot;fade_years&quot;: 10}}}&lt;/script&gt;&lt;script&gt;

 m=s.ebit_margin.concat(fade(s.ebit_margin[s.ebit_margin.length-1],s.terminal_margin,nf)),n=g.length,

 tx=ext(s.tax,n),rev=P.base_revenue,ev=0,last=null;
 for(var i=0;i&lt;n;i++){var prev=rev;rev=rev*(1+g[i]);var nop=rev*m[i]*(1-tx[i]);var d=s.decline_sales_to_capital;
  var re=(rev-prev)/((d&amp;&amp;rev&lt;prev)?d:stc[i]);ev+=(nop-re)/Math.pow(1+w,i+1);last={rev:rev,m:m[i],y:i+1}}
 var tt=Array.isArray(s.tax)?s.tax[s.tax.length-1]:s.tax,gg=s.terminal_g;if(!(w&gt;gg&amp;&amp;s.terminal_roic&gt;gg))return null;
 var tn=last.rev*(1+gg)*last.m*(1-tt),tv=tn*(1-gg/s.terminal_roic)/(w-gg);ev+=tv/Math.pow(1+w,last.y);
 var b=P.bridge,eq=ev-(b.debt||0)+(b.cash||0)+(b.securities||0)*(1-(b.securities_haircut||0))-(b.operating_cash_reserve||0)-(b.other_claims||0);return eq/b.shares}

&lt;/script&gt;&lt;/section&gt;&lt;section class=&quot;note-box&quot; id=&quot;ledger&quot; style=&quot;margin-top:18px&quot;&gt;&lt;h3&gt;上次預測對答案&lt;/h3&gt;&lt;p&gt;&lt;b&gt;上次（通過版_20261107_收盤1105）以來改了什麼：&lt;/b&gt;研究評等 生意 A ／ 價格合理 → 生意品質一流 ／ 價格偏低（低於市場常態）；價格位置 合理 → 偏低；合理價值中點 306.1075782709428 → 302.4839781544268；收盤價 246.44 → 246.0。期間落空：無落空項目。&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;狀態&lt;/th&gt;&lt;th&gt;預測&lt;/th&gt;&lt;th&gt;檢驗時點&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b style=&quot;color:var(--muted)&quot;&gt;待公布&lt;/b&gt;&lt;/td&gt;&lt;td&gt;P1　2026 財年第四季（至 2026-11-27）單季營收年增不低於 9%（公司目標下緣約 9.8%）&lt;/td&gt;&lt;td&gt;2026 財年 10-K（約 2027 年 1 月）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b style=&quot;color:var(--muted)&quot;&gt;待公布&lt;/b&gt;&lt;/td&gt;&lt;td&gt;P2　2027 財年第三季（至 2027-08-27）單季營收年增低於 11%（Semrush 滿一年、併購貢獻消失）&lt;/td&gt;&lt;td&gt;2027 財年第三季 10-Q（約 2027 年 9–10 月）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b style=&quot;color:var(--muted)&quot;&gt;待公布&lt;/b&gt;&lt;/td&gt;&lt;td&gt;P3　近四季營業利益率維持在 33% 以上（扣一次性費用後近 20 季都在 35% 上下）&lt;/td&gt;&lt;td&gt;2026 財年 10-K 起每季（約 2027 年 1 月起）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b style=&quot;color:var(--muted)&quot;&gt;待公布&lt;/b&gt;&lt;/td&gt;&lt;td&gt;P4　2026 財年末 &lt;abbr title=&quot;RPO（Remaining Performance Obligations）&quot;&gt;剩餘履約義務&lt;/abbr&gt; 增速仍低於近四季營收增速（合約積壓放緩延續）&lt;/td&gt;&lt;td&gt;2026 財年 10-K（約 2027 年 1 月）&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;來源：商業評估的推論紀錄與觀察清單（預測帳本）；另有觀察清單 5 條待公布，見商業評估分頁。新財報進來後變成命中或落空；只描述，不是買賣建議。&lt;/p&gt;&lt;/section&gt;&lt;/div&gt;&lt;div class=&quot;layer&quot; id=&quot;layer-3min&quot; style=&quot;margin-top:22px&quot;&gt;&lt;div class=&quot;cap&quot; style=&quot;font-weight:700;letter-spacing:.1em&quot;&gt;3 分鐘版&lt;/div&gt;&lt;div class=&quot;grid2 front-pts&quot; style=&quot;margin-top:18px&quot;&gt;&lt;div&gt;&lt;h3&gt;三個看好的理由&lt;/h3&gt;&lt;ol class=&quot;pts&quot;&gt;&lt;li&gt;訂閱占 96% 的現金機器：近四季營收年增 12.0%，自由現金流約為淨利 1.45 倍。&lt;/li&gt;&lt;li&gt;市價只要求未來 5 年營收每年約 4.1%（市價反推未來 5 年營收年增；市價 246.00 美元、收盤 2026-11-16；折現率 10.10%；推導），遠低於近三年實績約一成。&lt;/li&gt;&lt;li&gt;回購殖利率約 9.7%、本益比在自身五年低檔，市場在定價 人工智慧 取代風險。&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;&lt;div&gt;&lt;h3&gt;三個風險&lt;/h3&gt;&lt;ol class=&quot;pts risk&quot;&gt;&lt;li&gt;生成式 人工智慧 壓低入門門檻，新用戶折扣擴大到 57%，入門用戶可能流失。&lt;/li&gt;&lt;li&gt;執行長 12 月交接、財務長未定，回購與併購政策可能改變。&lt;/li&gt;&lt;li&gt;公司不揭露續約率，流失要幾季後才會反映在營收。&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;note-box&quot; id=&quot;when-fair&quot;&gt;&lt;b&gt;什麼條件下現價算合理&lt;/b&gt;&lt;ul&gt;&lt;li&gt;高成長多撐兩年（第 1 年成長率多維持兩年，其他照基準）：每股約 333.79（比現價高 36%）&lt;/li&gt;&lt;li&gt;長期營業利益率維持目前 35.7%（其他照基準）：每股約 304.42（比現價高 24%）&lt;/li&gt;&lt;li&gt;成長照樂觀、利潤率照基準：每股約 389.06（比現價高 58%）&lt;/li&gt;&lt;/ul&gt;&lt;p class=&quot;cap&quot;&gt;用估值引擎同一條式子、本報告折現率 10.1% 算；每條只改一項假設，其他照基準情境。買入上限放在下方「完整底稿」的價格框。非目標價、非買賣建議。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;note-box mv&quot;&gt;&lt;b&gt;市場價格隱含什麼、我們哪裡不同&lt;/b&gt;&lt;p&gt;現價 246.00 美元 隱含未來 5 年營收每年約 4.1%（市價反推未來 5 年營收年增；市價 246.00 美元、收盤 2026-11-16；折現率 10.10%；推導），或成長照基準時長期營業利益率約 29.2%（市價反推第 1 年起每年固定的營業利益率，含穩態；市價 246.00 美元、收盤 2026-11-16；折現率 10.10%；推導）（兩者擇一）；本報告基準首年 +10% 遞減到 6%、利潤率約 35%。差別在 人工智慧 是否壓低價格與入門用戶。&lt;/p&gt;&lt;/div&gt;&lt;div id=&quot;triggers&quot; class=&quot;tm&quot;&gt;&lt;h3&gt;風險與改變判斷&lt;/h3&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;risk-tbl&quot; style=&quot;min-width:0;width:100%&quot;&gt;&lt;tr&gt;&lt;th style=&quot;white-space:normal;width:64%&quot;&gt;情況（看哪個指標、門檻多少）&lt;/th&gt;&lt;th style=&quot;white-space:normal;width:22%&quot;&gt;會改變什麼判斷&lt;/th&gt;&lt;th style=&quot;white-space:normal;width:14%&quot;&gt;歷史基準比率&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;創意與行銷客群訂閱或 &lt;abbr title=&quot;ARR（Annual Recurring Revenue）&quot;&gt;年度經常性收入&lt;/abbr&gt;（年化經常性收入）年增連兩季低於 8%&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;護城河與基準成長下修（C01、C05）&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;2026-12 的 2027 財年 營收指引中點或 年度經常性收入 目標低於 8%&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;基準成長下修；正式 &lt;abbr title=&quot;CFO（Chief Financial Officer）&quot;&gt;財務長&lt;/abbr&gt; 改變回購政策則重看（C05、C09）&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;新用戶折扣擴及續約或常態化，或 &lt;abbr title=&quot;GAAP（Generally Accepted Accounting Principles）&quot;&gt;美國會計準則&lt;/abbr&gt; 營業利益率年減 3 個百分點以上&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;保守情境權重上調（C10、C12）&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;研發占營收升過 20% 而營收年增低於 8%，或財務口徑 &lt;abbr title=&quot;ROIC（Return on Invested Capital）&quot;&gt;投入資本報酬率&lt;/abbr&gt;（投入資本報酬率）低於 25%&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;投入回報轉弱、生意品質重看（C02）&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;65%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;營運現金流÷淨利連兩季低於 1.0、遞延收入年減，或回購改靠淨借款&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;現金流與資本配置下修（C03、C07）&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;應付帳款連兩季年增仍遠快於營收且公司未說明&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;資產變化改列未解釋、治理評分重看&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;生成式 人工智慧 壓低入門門檻、新客導向低價方案，Express（簡易設計工具）與業餘用戶可能流失（新聞 N7、N8）&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;未設門檻：持續觀察&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;新用戶折扣由 50% 擴大到 57%，若擴及續約會壓低平均單價（新聞 N12）&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;未設門檻：持續觀察&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;&lt;abbr title=&quot;CEO（Chief Executive Officer）&quot;&gt;執行長&lt;/abbr&gt;（執行長）交接、創意事業總裁卸任、正式 財務長（財務長）未定，執行有變數&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;未設門檻：持續觀察&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;訂閱取消做法的私人集體訴訟仍在進行，金額影響未知（新聞 N5）&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;未設門檻：持續觀察&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;歷史基準比率＝成功幾率口徑，是同規模公司歷史上做到的比例，不是這家公司的預測；「—」＝沒有可對照的歷史基準，不估機率。營收成長類的列：同規模（營收 250 億美元以上）公司 10 年實質年增做到模型基準 4.5% 的歷史比例（超額報酬期間檢查.json 基準比率；Base Rate Book）。&lt;/p&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; id=&quot;sanity-front&quot;&gt;&lt;b&gt;合理性檢查：&lt;/b&gt;紅燈 2、黃燈 4（紅：&lt;abbr title=&quot;DCF（Discounted Cash Flow）&quot;&gt;現金流折現&lt;/abbr&gt; 中點與其他方法中點差距、終值倍數落點）。只提醒、不改評等；逐項與作者說明見計算底稿 5。&lt;/p&gt;&lt;/div&gt;&lt;p class=&quot;cap fnote&quot;&gt;資料日期：財報截至 2026-08-28；市場資料 2026-11-16 收盤 246.00 美元。研究用途，非買賣建議，不構成任何投資建議，也不提供單一目標價。本研究只評估公司本身，不評估讀者自身的資金期限與等待能力。完整數字見正文&lt;a href=&quot;#numbers&quot;&gt;「完整數字」&lt;/a&gt;；名詞與每條判斷的證據狀態見&lt;a href=&quot;#more&quot;&gt;附錄&lt;/a&gt;。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;

&lt;main class=&quot;wrap&quot;&gt;&lt;details id=&quot;full&quot; class=&quot;fullwrap&quot;&gt;&lt;summary style=&quot;cursor:pointer;font-weight:700;font-size:18px;padding:14px 0&quot;&gt;完整底稿：價格框與買入上限、正文七題、計算底稿、附錄與出處（點開）&lt;/summary&gt;&lt;div data-layer=&quot;正文&quot;&gt;&lt;section class=&quot;q&quot; id=&quot;price-detail&quot; data-layer=&quot;完整底稿&quot;&gt;&lt;div class=&quot;qno&quot;&gt;價格&lt;/div&gt;&lt;h2&gt;價格框、合理價值與市價隱含倍數&lt;/h2&gt;&lt;div class=&quot;hero&quot;&gt;&lt;aside class=&quot;pricebox&quot;&gt;&lt;div class=&quot;sub&quot;&gt;2026-11-16 收盤 246.00 美元&lt;/div&gt;&lt;div class=&quot;big&quot;&gt;246.00&lt;span style=&quot;font-size:18px&quot;&gt; 美元&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;zones&quot;&gt;&lt;div class=&quot;zone buy&quot; style=&quot;grid-column:1/-1&quot;&gt;&lt;span&gt;買入上限（不確定性低）&lt;/span&gt;&lt;b&gt;242 美元&lt;/b&gt;&lt;small&gt;股價在此以下才有 20% 安全邊際；＝合理價值中點 302.48 ×（1−20%）。非買賣建議。&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;rows&quot;&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;股價 ÷ 合理價值中點&lt;/span&gt;&lt;span&gt;0.81 倍&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;10 年期美國公債&lt;/span&gt;&lt;span&gt;5.12%&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;r&quot;&gt;&lt;span&gt;市價隱含 5 年營收年增&lt;/span&gt;&lt;span&gt;4.1%&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;現金（2026-08-28）&lt;/span&gt;&lt;span&gt;43.6 億美元&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;流動有價證券&lt;/span&gt;&lt;span&gt;12.8 億美元&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;有息負債&lt;/span&gt;&lt;span&gt;63.6 億美元&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;淨負債（現金＋流動有價證券−有息負債）&lt;/span&gt;&lt;span&gt;7.2 億美元&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;近四季回購&lt;/span&gt;&lt;span&gt;93.0 億美元&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;近四季公開市場回購均價（在合理價值區間內）&lt;/span&gt;&lt;span&gt;279.34 美元&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot; style=&quot;display:block&quot;&gt;&lt;span&gt;股東回報與權益（2021–2025）：&lt;/span&gt;&lt;span style=&quot;font-weight:400&quot;&gt;近五年平均 ROE 39%；股東權益 148→116 億美元；股利＋回購占自由現金流 92%（逐年表見第六題）&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; id=&quot;cont-note&quot; style=&quot;margin:10px 0 0&quot;&gt;這個數字只描述現價與本報告合理價值中點的距離，不改價格位置與研究評等。非買賣建議。&lt;/p&gt;&lt;/aside&gt;&lt;/div&gt;&lt;section class=&quot;note-box&quot; id=&quot;value-trio&quot; style=&quot;margin-top:18px&quot;&gt;&lt;h3&gt;合理價值與市價隱含第 15 年倍數&lt;/h3&gt;&lt;div class=&quot;zones&quot; style=&quot;grid-template-columns:repeat(2,1fr)&quot;&gt;&lt;div class=&quot;zone&quot;&gt;&lt;span&gt;合理價值（只含折現率）&lt;/span&gt;&lt;b&gt;266–350 美元&lt;/b&gt;&lt;small&gt;中點 302.48 美元；三情境機率加權&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;zone mkt&quot;&gt;&lt;span&gt;市價隱含第 15 年倍數（EV/EBIT，基準情境）&lt;/span&gt;&lt;b&gt;3.9 倍&lt;/b&gt;&lt;small&gt;模型假設 8.5 倍，市價隱含是模型的 0.5 倍；折現率區間 2.4–5.7 倍；參考帶（產業：Software (System &amp;amp; Application)，104 筆、5 家）中位 20.9 倍、四分位 12.4–35.4 倍、p90 54.5 倍（機械回測樣本，非市場全體；分產業的筆數與公司數少，僅供參考）；只描述，不進評等&lt;br&gt;特例：明示期 15 年，參考帶是 10 年機械回測，倍數不直接比，僅供參考&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;參考帶中位（Software (System &amp;amp; Application)） 20.9 倍時，機率加權每股約 454 美元（條件式，非目標價、非買賣建議，不進評等；各倍數對照見計算底稿 5）。&lt;/p&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;&lt;b&gt;合理價值 vs 市價隱含倍數（作者判讀）：&lt;/b&gt;市價隱含第 15 年（明示期最後一年）企業價值對營業利益約 3.9 倍，只有模型終值倍數 8.5 倍 的 0.46，也遠低於軟體業參考帶 p25 約 12.4 倍：市價幾乎不給明示期之後的價值。特例：本模型明示期 15 年、參考帶是 10 年機械回測，倍數不直接比。只描述，不進評等、非目標價。&lt;/p&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:10px;font-size:15px;line-height:1.7&quot;&gt;上面的合理價值只含折現率高低；三情境全幅 151～510（情境與折現率一起算，約中點的 119%）；寬主要來自情境（差距 89%），不是折現率（28%）。情境差距＝（樂觀－保守）÷基準，折現率寬度＝（高－低）÷中點；非買賣建議。&lt;/p&gt;&lt;div class=&quot;tw&quot; style=&quot;margin-top:14px&quot;&gt;&lt;table class=&quot;txt&quot; style=&quot;min-width:0;font-size:16px&quot;&gt;&lt;tr&gt;&lt;th style=&quot;padding:9px 12px;font-size:15px&quot;&gt;情境&lt;/th&gt;&lt;th style=&quot;padding:9px 12px;font-size:15px&quot;&gt;每股價值&lt;/th&gt;&lt;th style=&quot;padding:9px 12px;font-size:15px&quot;&gt;權重&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;padding:9px 12px&quot;&gt;保守&lt;/td&gt;&lt;td style=&quot;padding:9px 12px;font-size:20px;font-weight:700&quot;&gt;169.04&lt;/td&gt;&lt;td style=&quot;padding:9px 12px&quot;&gt;25%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;padding:9px 12px&quot;&gt;基準&lt;div style=&quot;font-size:13px;line-height:1.5;color:var(--muted);margin-top:2px&quot;&gt;與外部 DCF 單點同口徑；今天的現值，不是 12 個月目標價，非買賣建議&lt;/div&gt;&lt;/td&gt;&lt;td style=&quot;padding:9px 12px;font-size:20px;font-weight:700&quot;&gt;301.63&lt;/td&gt;&lt;td style=&quot;padding:9px 12px&quot;&gt;50%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;padding:9px 12px&quot;&gt;樂觀&lt;/td&gt;&lt;td style=&quot;padding:9px 12px;font-size:20px;font-weight:700&quot;&gt;437.64&lt;/td&gt;&lt;td style=&quot;padding:9px 12px&quot;&gt;25%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:10px;font-size:15px;line-height:1.7&quot;&gt;中點是三個情境的加權，上下緣是換折現率重算；算式見&lt;a href=&quot;#valuation&quot;&gt;第五題&lt;/a&gt;。情境表說明合理價值怎麼組成，不是單一目標價。&lt;/p&gt;&lt;/section&gt;&lt;div class=&quot;kpis&quot;&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;l&quot;&gt;近四季營收年增&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;12.0%&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;近四季 2025-08-30～2026-08-28 對前四季；含 Semrush（品牌能見度平台）併購&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;l&quot;&gt;剩餘履約義務（RPO）&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;22,160 百萬美元&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;2026-08-28，約為近四季營收 0.85 倍（8-K 2026-09-10 新聞稿 §4）&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;l&quot;&gt;每股自由現金流扣股權薪酬&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;21.15 美元&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;近四季（推導）；未扣前 26.29 美元&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;l&quot;&gt;營業利益率&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;35.7%&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;近四季一般會計口徑；FY2026 公司指引 35.0%&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;note-box&quot; id=&quot;survival&quot; style=&quot;border-left-color:var(--pos)&quot;&gt;&lt;p style=&quot;margin:0&quot;&gt;&lt;b&gt;信用評級&lt;/b&gt;　機構 Moody&amp;#x27;s A1、S&amp;amp;P A+（SEC 全文搜尋 FWP 2025-01-14 0001193125-25-006212 #0）｜投資等級　｜　&lt;a href=&quot;#survival-detail&quot;&gt;&lt;b&gt;存活檢查（12～24 個月）&lt;/b&gt;&lt;/a&gt;　&lt;b style=&quot;color:var(--pos)&quot;&gt;無明顯警訊&lt;/b&gt;（推導，非違約預測；理由見第六題計算底稿）&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;business&quot;&gt;&lt;div class=&quot;qno&quot;&gt;問題 01&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;生意怎麼賺錢？&lt;/div&gt;&lt;h2&gt;賣專業創作與文件軟體的訂閱，96% 收入是訂閱&lt;/h2&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;Adobe 幾乎全靠訂閱賺錢：&lt;a class=&quot;term&quot; href=&quot;#g0&quot;&gt;FY&lt;/a&gt;2025 營收 23,769 百萬美元，訂閱占 96%。&lt;/strong&gt;最新一季&lt;a class=&quot;term&quot; href=&quot;#g4&quot;&gt;創意與行銷專業客戶群&lt;/a&gt;訂閱收入年增 13%、&lt;a class=&quot;term&quot; href=&quot;#g5&quot;&gt;商業專業與消費者客戶群&lt;/a&gt;年增 16%&lt;span class=&quot;src&quot;&gt;（10-Q Part I, Item 2 ¶58）&lt;/span&gt;，兩個客群都在長。&lt;/p&gt;&lt;p&gt;限制是 FY2026 起三個分部併成一個，只揭露客戶群訂閱收入，不再揭露各產品線利潤&lt;span class=&quot;src&quot;&gt;（10-Q Part I, Item 1 ¶262）&lt;/span&gt;；入門用戶受 AI 衝擊多少，財報分辨不出來。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;產品線營收占比（近四季，億美元；逐年金額與成長見下方明細表；圖的占比分母為圖中各線合計）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 480 280&quot; role=&quot;img&quot; aria-label=&quot;產品線營收&quot; class=&quot;chart&quot; style=&quot;max-width:624px&quot;&gt;&lt;path d=&quot;M240.0,52.0 A88,88 0 1 1 223.4,53.6 L229.8,87.0 A54,54 0 1 0 240.0,86.0 Z&quot; fill=&quot;var(--c1)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;訂閱：252（97%）&lt;/title&gt;&lt;/path&gt;&lt;path d=&quot;M223.4,53.6 A88,88 0 0 1 240.0,52.0 L240.0,86.0 A54,54 0 0 0 229.8,87.0 Z&quot; fill=&quot;var(--muted)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;其他：7.8（3%）&lt;/title&gt;&lt;/path&gt;&lt;polyline points=&quot;248.7,231.6 249.5,249.5 346.0,249.5&quot; fill=&quot;none&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;1&quot;/&gt;&lt;text x=&quot;354.0&quot; y=&quot;246.5&quot; class=&quot;lab&quot; text-anchor=&quot;start&quot;&gt;訂閱&lt;/text&gt;&lt;text x=&quot;354.0&quot; y=&quot;264.5&quot; class=&quot;val&quot; text-anchor=&quot;start&quot;&gt;97%&lt;tspan class=&quot;ax&quot; font-weight=&quot;400&quot;&gt;　252&lt;/tspan&gt;&lt;/text&gt;&lt;polyline points=&quot;231.3,48.4 230.5,30.5 134.0,30.5&quot; fill=&quot;none&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;1&quot;/&gt;&lt;text x=&quot;126.0&quot; y=&quot;27.5&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;其他&lt;/text&gt;&lt;text x=&quot;126.0&quot; y=&quot;45.5&quot; class=&quot;val&quot; text-anchor=&quot;end&quot;&gt;3%&lt;tspan class=&quot;ax&quot; font-weight=&quot;400&quot;&gt;　7.8&lt;/tspan&gt;&lt;/text&gt;&lt;text x=&quot;240.0&quot; y=&quot;136.0&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;近四季&lt;/text&gt;&lt;text x=&quot;240.0&quot; y=&quot;158.0&quot; class=&quot;val&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:18px&quot;&gt;260&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;白話說&lt;/b&gt;每 100 美元營收，約 96 美元來自訂閱、約 2 美元服務、約 1 美元永久授權產品；營收成本只吃掉約 11 美元。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;要留意&lt;/b&gt;訂閱多為年約預收，客戶流失會先出現在 ARR 與客戶群成長，再到營收，見改判訊號。&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;產品線營收明細（億美元；占比為最近財年，分母為各線合計）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;產品線&lt;/th&gt;&lt;th&gt;FY23&lt;/th&gt;&lt;th&gt;FY24&lt;/th&gt;&lt;th&gt;FY25&lt;/th&gt;&lt;th&gt;近四季&lt;/th&gt;&lt;th&gt;最近財年年增&lt;/th&gt;&lt;th&gt;占比&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;訂閱&lt;/td&gt;&lt;td&gt;183&lt;/td&gt;&lt;td&gt;205&lt;/td&gt;&lt;td&gt;229&lt;/td&gt;&lt;td&gt;252&lt;/td&gt;&lt;td&gt;11.6%&lt;/td&gt;&lt;td&gt;96%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;服務與其他&lt;/td&gt;&lt;td&gt;7&lt;/td&gt;&lt;td&gt;6&lt;/td&gt;&lt;td&gt;5&lt;/td&gt;&lt;td&gt;5&lt;/td&gt;&lt;td&gt;-9.7%&lt;/td&gt;&lt;td&gt;2%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;永久授權產品&lt;/td&gt;&lt;td&gt;5&lt;/td&gt;&lt;td&gt;4&lt;/td&gt;&lt;td&gt;3&lt;/td&gt;&lt;td&gt;3&lt;/td&gt;&lt;td&gt;-15.8%&lt;/td&gt;&lt;td&gt;1%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;business-profile&quot;&gt;&lt;h3&gt;生意介紹：年報重點&lt;/h3&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;Adobe 是賣創作、文件與行銷軟體訂閱的公司，FY2025 營收 23,769 百萬美元，訂閱占約 96%。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;賣什麼&lt;/p&gt;&lt;h4&gt;三類軟體訂閱，創作工具是主力&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;創作工具是主力：Creative Cloud 旗艦應用（Photoshop、Illustrator、Premiere Pro 等）給設計與影音專業人士；Acrobat 與 Express 給上班族、學生做文件與簡易設計；Firefly（Adobe 的生成式 AI 工具）是生成式 AI 模型，嵌在各產品裡&lt;span class=&quot;src&quot;&gt;（10-K Item 7 ¶16）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;行銷軟體賣給企業：Adobe Experience Platform、GenStudio 等幫行銷團隊管理客戶資料與內容產出&lt;span class=&quot;src&quot;&gt;（10-K Item 1 ¶113）&lt;/span&gt;。&lt;/strong&gt;FY2025 創意與行銷專業客戶群訂閱 16,303 百萬、商業專業與消費者客戶群 6,495 百萬美元&lt;span class=&quot;src&quot;&gt;（10-K Item 7 ¶70）&lt;/span&gt;。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;誰付錢、怎麼賣&lt;/p&gt;&lt;h4&gt;客戶分散，沒有單一大客戶&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;付錢的是個人創作者、企業行銷團隊與一般上班族：個人與小公司多經官網與應用程式商店購買，大企業走直銷，另有經銷商與系統整合商&lt;span class=&quot;src&quot;&gt;（10-K Item 1 ¶118、¶120）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;沒有任何客戶占營收或應收帳款 10% 以上&lt;span class=&quot;src&quot;&gt;（10-K Item 8 ¶181）&lt;/span&gt;，客戶集中風險低；應收天數 2026-08-28 約 29 天&lt;span class=&quot;src&quot;&gt;（財務指標，近四季營收口徑）&lt;/span&gt;，收款快。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;營收結構：誰在拉動&lt;/p&gt;&lt;h4&gt;九成六是訂閱，商業與消費者客群長得較快&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;營收幾乎都是訂閱：FY2025 訂閱約占 96%，服務與永久授權合計約 4%（財務歷史；產品線圖）。&lt;/strong&gt;最新一季客戶群訂閱收入 6,556 百萬美元、年增 14%&lt;span class=&quot;src&quot;&gt;（10-Q Part I, Item 2 ¶22）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;拉動成長的是兩個客群：Q3 創意與行銷專業客戶群 4,651 百萬、年增 13%，商業專業與消費者客戶群 1,905 百萬、年增 16%&lt;span class=&quot;src&quot;&gt;（10-Q Part I, Item 2 ¶58）&lt;/span&gt;；後者含 Acrobat 與 Express，也是最受免費 AI 工具衝擊的一群。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;市場、地區與重點專案&lt;/p&gt;&lt;h4&gt;美洲過半，歐洲成長最快但含匯率&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;FY2025 美洲營收 14,120 百萬美元、占 59%，歐非中東 6,289 百萬、占 27%，亞太 3,360 百萬、占 14%；三區都成長，歐非中東年增 13% 最快&lt;span class=&quot;src&quot;&gt;（10-K Item 7 ¶73、¶74）&lt;/span&gt;。&lt;/strong&gt;美國以外合計約 41%，匯率是名目成長的變數。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;最新一季歐非中東年增 17%，部分來自美元走弱，匯率約貢獻 40 百萬美元&lt;span class=&quot;src&quot;&gt;（10-Q Part I, Item 2 ¶66、¶68）&lt;/span&gt;。&lt;/strong&gt;軟體公司沒有工廠或建設專案；重點專案是 Semrush（2026-04 完成）與 Topaz Labs（2026-09 完成）兩件併購&lt;span class=&quot;src&quot;&gt;（10-Q Part I, Item 1 ¶93、¶216）&lt;/span&gt;。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;跟誰競爭&lt;/p&gt;&lt;h4&gt;公司自己承認進入門檻低，AI 新進者是主要威脅&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;年報說競爭者包括大型軟體公司、AI 公司、作業系統與社群媒體公司，市場特徵是進入門檻低、產品週期短、客戶對價格敏感&lt;span class=&quot;src&quot;&gt;（10-K Item 1 ¶30；Item 1A ¶6）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;外部證據：Google 把 AI 設計工具 Pics 放進 Workspace（新聞 N7），Canva AI 2.0 直指 Adobe 與 Figma（新聞 N9）；DocuSign 10-K 把 Acrobat Sign 列為主要電子簽章對手。&lt;/strong&gt;我們的判讀：專業工作流程仍難替代，入門端競爭最激烈。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;管理層怎麼說&lt;/p&gt;&lt;h4&gt;公司說 AI 帶動成長，實績是名目一成左右&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;公司說法：FY2025 各產品需求強勁，靠 AI 驅動的差異化方案擴大客群&lt;span class=&quot;src&quot;&gt;（10-K Item 7 ¶14）&lt;/span&gt;；FY2026 期末 &lt;a class=&quot;term&quot; href=&quot;#g1&quot;&gt;ARR&lt;/a&gt; 目標年增 10.2%，全年營收指引 26,576–26,626 百萬美元&lt;span class=&quot;src&quot;&gt;（8-K 2026-09-10 新聞稿 §7）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;實績對照：Q3 ARR 27.50 十億美元、年增 11.2%&lt;span class=&quot;src&quot;&gt;（10-Q Part I, Item 2 ¶21）&lt;/span&gt;，但含 Semrush；扣掉後約 9%&lt;span class=&quot;src&quot;&gt;（推算，見第二題）&lt;/span&gt;。&lt;/strong&gt;FY2026 前三季營收都落在指引上緣之上（見第二題指引達成圖）。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;年報列的主要風險&lt;/p&gt;&lt;h4&gt;年報最相關的四條風險&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;①競爭加劇、對手資源多，可能更快推出類似產品&lt;span class=&quot;src&quot;&gt;（10-K Item 1A ¶6）&lt;/span&gt;；②訂閱收入按期認列，流失率上升要幾季後才反映在營收&lt;span class=&quot;src&quot;&gt;（10-K Item 1A ¶102）&lt;/span&gt;；③資料中心搬遷或第三方託管中斷會影響服務&lt;span class=&quot;src&quot;&gt;（10-K Item 1A ¶39）&lt;/span&gt;；④營收大量來自美國以外，受地緣與匯率影響&lt;span class=&quot;src&quot;&gt;（10-K Item 1A ¶57）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;我們的判讀：第②條最關鍵，因為公司不揭露續約率，入門端流失會比營收先發生，所以改判訊號盯 ARR 與客群訂閱成長&lt;span class=&quot;src&quot;&gt;（作者判斷，依 10-K Item 1A ¶102）&lt;/span&gt;。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;規模與營運&lt;/p&gt;&lt;h4&gt;三萬多名員工，美國與海外各半&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;2025-11-28 員工 31,360 人，美國與海外各占 50%，FY2025 離職率 9.9%&lt;span class=&quot;src&quot;&gt;（10-K Item 1 ¶156）&lt;/span&gt;；採混合辦公&lt;span class=&quot;src&quot;&gt;（10-K Item 1 ¶157）&lt;/span&gt;。&lt;/strong&gt;營收季節性不明顯，各季逐季增加（財務歷史）。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;moat&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;護城河與成長故事&lt;/p&gt;&lt;h3&gt;轉換成本是主要護城河，但留存未揭露、入門端受壓，評為窄&lt;/h3&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;護城河主要是轉換成本：Photoshop（影像編輯軟體）、Acrobat（PDF 文件軟體）與 PDF 是專業工作流程與檔案格式的業界標準。&lt;/strong&gt;財務上：近四季毛利率 89.3%、ARR 年增 11.2%（主張 ADBE-C01）；MAX 大會讓第三方 AI 代理直接改 Adobe 原生檔，想把格式變成 AI 呼叫的對象（新聞 N10）。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;反方證據也真實：Google 把 Pics 內建到 Workspace（Google 的辦公套件；新聞 N7），黑五新用戶首年折扣由 50% 擴大到 57%（新聞 N12）。&lt;/strong&gt;公司未揭露續約率與流失率，護城河雙鑰匙只過一把，評為窄（主張 ADBE-C10）。&lt;/p&gt;&lt;p&gt;生命週期屬成熟期的延續成長：近十年營收沒有衰退年，&lt;a class=&quot;term&quot; href=&quot;#g2&quot;&gt;RPO&lt;/a&gt; 約為營收 0.85 倍，所以超額報酬以窄分級上限 10 年遞減&lt;span class=&quot;src&quot;&gt;（推導，明細見計算底稿 5）&lt;/span&gt;。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;grid2 wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;護城河的變化：毛利率與高毛利業務占比&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 280&quot; role=&quot;img&quot; aria-label=&quot;護城河趨勢&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;246.0&quot; y2=&quot;246.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;250.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;-50%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;171.3&quot; y2=&quot;171.3&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;175.3&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;0%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;96.7&quot; y2=&quot;96.7&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;100.7&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;50%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;22.0&quot; y2=&quot;22.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;26.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;100%&lt;/text&gt;&lt;text x=&quot;72.0&quot; y=&quot;268&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY22&lt;/text&gt;&lt;text x=&quot;181.5&quot; y=&quot;268&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY23&lt;/text&gt;&lt;text x=&quot;291.0&quot; y=&quot;268&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY24&lt;/text&gt;&lt;text x=&quot;400.5&quot; y=&quot;268&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY25&lt;/text&gt;&lt;text x=&quot;510.0&quot; y=&quot;268&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;近三季&lt;/text&gt;&lt;polyline points=&quot;72.0,37.0 181.5,36.9 291.0,35.1 400.5,35.2 510.0,35.7&quot; fill=&quot;none&quot; stroke=&quot;var(--c1)&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;circle cx=&quot;72.0&quot; cy=&quot;37.0&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c1)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;Subscription毛利率 FY22：90%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;181.5&quot; cy=&quot;36.9&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c1)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;Subscription毛利率 FY23：90%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;291.0&quot; cy=&quot;35.1&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c1)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;Subscription毛利率 FY24：91%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;400.5&quot; cy=&quot;35.2&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c1)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;Subscription毛利率 FY25：91%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;510.0&quot; cy=&quot;35.7&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c1)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;Subscription毛利率 近三季：91%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;518.0&quot; y=&quot;39.7&quot; class=&quot;val&quot; fill=&quot;var(--c1)&quot;&gt;91%&lt;/text&gt;&lt;polyline points=&quot;72.0,31.8 181.5,31.4 291.0,31.7 400.5,32.6 510.0,31.7&quot; fill=&quot;none&quot; stroke=&quot;var(--c2)&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;circle cx=&quot;72.0&quot; cy=&quot;31.8&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c2)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;Product毛利率 FY22：93%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;181.5&quot; cy=&quot;31.4&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c2)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;Product毛利率 FY23：94%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;291.0&quot; cy=&quot;31.7&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c2)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;Product毛利率 FY24：94%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;400.5&quot; cy=&quot;32.6&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c2)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;Product毛利率 FY25：93%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;510.0&quot; cy=&quot;31.7&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c2)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;Product毛利率 近三季：93%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;518.0&quot; y=&quot;35.7&quot; class=&quot;val&quot; fill=&quot;var(--c2)&quot;&gt;93%&lt;/text&gt;&lt;polyline points=&quot;72.0,127.4 181.5,135.0 291.0,155.4 400.5,160.5 510.0,186.1&quot; fill=&quot;none&quot; stroke=&quot;var(--c6)&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;circle cx=&quot;72.0&quot; cy=&quot;127.4&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c6)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;Services and other毛利率 FY22：29%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;181.5&quot; cy=&quot;135.0&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c6)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;Services and other毛利率 FY23：24%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;291.0&quot; cy=&quot;155.4&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c6)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;Services and other毛利率 FY24：11%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;400.5&quot; cy=&quot;160.5&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c6)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;Services and other毛利率 FY25：7%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;510.0&quot; cy=&quot;186.1&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c6)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;Services and other毛利率 近三季：-10%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;518.0&quot; y=&quot;190.1&quot; class=&quot;val&quot; fill=&quot;var(--c6)&quot;&gt;-10%&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c1)&quot;&gt;&lt;/i&gt;Subscription毛利率&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c2)&quot;&gt;&lt;/i&gt;Product毛利率&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c6)&quot;&gt;&lt;/i&gt;Services and other毛利率&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;護城河五類來源逐一檢查&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;來源&lt;/th&gt;&lt;th&gt;Adobe 的情況&lt;/th&gt;&lt;th&gt;證據&lt;/th&gt;&lt;th&gt;判讀與失效條件&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;轉換成本&lt;/td&gt;&lt;td&gt;專業工作流程、PDF 檔案格式、企業系統整合&lt;/td&gt;&lt;td&gt;毛利率 89.3%；ARR 年增 11.2%（10-Q Part I, Item 2 ¶21）&lt;/td&gt;&lt;td&gt;有，主要來源；客群訂閱連兩季年增低於 8% 即轉弱&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;無形資產（品牌與定價權）&lt;/td&gt;&lt;td&gt;Photoshop、Acrobat 品牌&lt;/td&gt;&lt;td&gt;其他公司申報把 Adobe 列為主要對手；反證：新用戶首年折扣 57%（新聞 N12）&lt;/td&gt;&lt;td&gt;有，輔助；新用戶折扣擴及續約或常態化即失效&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;網路效應&lt;/td&gt;&lt;td&gt;檔案交換與外掛生態&lt;/td&gt;&lt;td&gt;Getty Images（圖庫與影像內容公司）、Asana 把 Creative Cloud（創意軟體訂閱）列為整合平台&lt;/td&gt;&lt;td&gt;弱到中&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;成本優勢&lt;/td&gt;&lt;td&gt;AI 推論成本上升&lt;/td&gt;&lt;td&gt;Q3 訂閱成本年增 24%（10-Q Part I, Item 2 ¶71）&lt;/td&gt;&lt;td&gt;不明顯&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;有效規模&lt;/td&gt;&lt;td&gt;對手多（Canva，線上設計平台、Figma、Google）&lt;/td&gt;&lt;td&gt;新聞 N7；10-K Item 1 ¶30&lt;/td&gt;&lt;td&gt;無&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;外部證據：其他公司的 SEC 申報&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;其他公司申報把 Adobe 列為對手或整合平台，顯示 Adobe 被視為平台，但沒有留存率或轉換成本的量化，不能證明定價力；這是鑰匙二不通過的原因。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;公司&lt;/th&gt;&lt;th&gt;申報&lt;/th&gt;&lt;th&gt;原句重點&lt;/th&gt;&lt;th&gt;意義&lt;/th&gt;&lt;th&gt;原文網址&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Getty Images&lt;/td&gt;&lt;td&gt;10-K（2026-03-16）&lt;/td&gt;&lt;td&gt;客戶可透過 Adobe Creative Cloud 等外掛把 Getty 內容整合進工作流程&lt;/td&gt;&lt;td&gt;Adobe 是創作工作流程的入口&lt;/td&gt;&lt;td class=&quot;link&quot;&gt;&lt;a href=&quot;https://www.sec.gov/Archives/edgar/data/1898496/000162828026018160/gety-20251231.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;原文&lt;/a&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Autodesk（設計與工程軟體公司）&lt;/td&gt;&lt;td&gt;10-K（2026-03-03）&lt;/td&gt;&lt;td&gt;主要全球競爭者包括 Adobe&lt;/td&gt;&lt;td&gt;設計軟體大廠視 Adobe 為對手&lt;/td&gt;&lt;td class=&quot;link&quot;&gt;&lt;a href=&quot;https://www.sec.gov/Archives/edgar/data/769397/000076939726000015/adsk-20260131.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;原文&lt;/a&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;DocuSign（電子簽章公司）&lt;/td&gt;&lt;td&gt;10-K（2026-03-18）&lt;/td&gt;&lt;td&gt;Adobe Acrobat Sign 是主要全球電子簽章競爭者&lt;/td&gt;&lt;td&gt;Acrobat 在文件流程有地位&lt;/td&gt;&lt;td class=&quot;link&quot;&gt;&lt;a href=&quot;https://www.sec.gov/Archives/edgar/data/1261333/000126133326000021/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;原文&lt;/a&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Asana（工作管理軟體公司）&lt;/td&gt;&lt;td&gt;10-K（2026-03-13）&lt;/td&gt;&lt;td&gt;把 Adobe Creative Cloud 列為整合的工作流平台&lt;/td&gt;&lt;td&gt;生態整合，無留存量化&lt;/td&gt;&lt;td class=&quot;link&quot;&gt;&lt;a href=&quot;https://www.sec.gov/Archives/edgar/data/1477720/000147772026000021/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;原文&lt;/a&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;supply&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;供應鏈與生產地&lt;/p&gt;&lt;h3&gt;沒有實體產品，關鍵依賴是第三方雲端與資料中心&lt;/h3&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;Adobe 不製造實體產品，供應鏈主要是第三方雲端託管與資料中心，用於雲端服務與生成式 AI 推論&lt;span class=&quot;src&quot;&gt;（10-Q Part I, Item 2 ¶75）&lt;/span&gt;；Q3 訂閱成本年增 24%，託管與資料中心貢獻 22 個百分點&lt;span class=&quot;src&quot;&gt;（10-Q Part I, Item 2 ¶77）&lt;/span&gt;。&lt;/strong&gt;10-K、10-Q 找不到主要雲端供應商名稱與集中度。美國以外營收約 41%（FY2025），地區占比見圖。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;grid2 wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;APAC：占全部營收 vs 占全部長期資產&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 280&quot; role=&quot;img&quot; aria-label=&quot;地區占比&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;246.0&quot; y2=&quot;246.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;250.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;6%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;201.2&quot; y2=&quot;201.2&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;205.2&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;7%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;156.4&quot; y2=&quot;156.4&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;160.4&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;8%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;111.6&quot; y2=&quot;111.6&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;115.6&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;9%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;66.8&quot; y2=&quot;66.8&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;70.8&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;10%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;22.0&quot; y2=&quot;22.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;26.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;11%&lt;/text&gt;&lt;text x=&quot;72.0&quot; y=&quot;268&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY22&lt;/text&gt;&lt;text x=&quot;218.0&quot; y=&quot;268&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY23&lt;/text&gt;&lt;text x=&quot;364.0&quot; y=&quot;268&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY24&lt;/text&gt;&lt;text x=&quot;510.0&quot; y=&quot;268&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY25&lt;/text&gt;&lt;polyline points=&quot;72.0,70.6 218.0,100.3 364.0,116.2 510.0,117.5&quot; fill=&quot;none&quot; stroke=&quot;var(--c2)&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;circle cx=&quot;72.0&quot; cy=&quot;70.6&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c2)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;占營收 FY22：10%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;218.0&quot; cy=&quot;100.3&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c2)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;占營收 FY23：9%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;364.0&quot; cy=&quot;116.2&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c2)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;占營收 FY24：9%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;510.0&quot; cy=&quot;117.5&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c2)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;占營收 FY25：9%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;518.0&quot; y=&quot;121.5&quot; class=&quot;val&quot; fill=&quot;var(--c2)&quot;&gt;9%&lt;/text&gt;&lt;polyline points=&quot;72.0,167.3 218.0,69.0 364.0,56.6 510.0,84.3&quot; fill=&quot;none&quot; stroke=&quot;var(--neg)&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;circle cx=&quot;72.0&quot; cy=&quot;167.3&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--neg)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;占長期資產 FY22：8%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;218.0&quot; cy=&quot;69.0&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--neg)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;占長期資產 FY23：10%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;364.0&quot; cy=&quot;56.6&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--neg)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;占長期資產 FY24：10%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;510.0&quot; cy=&quot;84.3&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--neg)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;占長期資產 FY25：10%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;518.0&quot; y=&quot;88.3&quot; class=&quot;val&quot; fill=&quot;var(--neg)&quot;&gt;10%&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c2)&quot;&gt;&lt;/i&gt;占營收&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--neg)&quot;&gt;&lt;/i&gt;占長期資產&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;雲端與營運依賴&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;內容&lt;/th&gt;&lt;th&gt;出處&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;雲端託管&lt;/td&gt;&lt;td&gt;第三方託管服務與資料中心，含 AI 推論成本&lt;/td&gt;&lt;td&gt;10-Q Part I, Item 2 ¶75&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;成本變化&lt;/td&gt;&lt;td&gt;Q3 訂閱成本 633 百萬美元，年增 24%&lt;/td&gt;&lt;td&gt;10-Q Part I, Item 2 ¶71&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;主要供應商&lt;/td&gt;&lt;td&gt;未揭露名稱與集中度&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;growth&quot;&gt;&lt;div class=&quot;qno&quot;&gt;問題 02&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;還在成長嗎？&lt;/div&gt;&lt;h2&gt;還在長，每年一成上下；扣併購與匯率後沒加速&lt;/h2&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;成長穩定但名目略快：近三個財年營收每年增約一成；最新一季年增 12.9% 含 Semrush 的併購貢獻，扣 Semrush 與匯率後約 10.2%&lt;span class=&quot;src&quot;&gt;（推算）&lt;/span&gt;，沒有加速。&lt;/p&gt;&lt;p&gt;成長主要來自既有訂閱：ARR 年增 11.2% 主要由 Creative Cloud 旗艦、Acrobat、Experience Manager（企業內容管理軟體）帶動&lt;span class=&quot;src&quot;&gt;（10-Q Part I, Item 2 ¶21）&lt;/span&gt;；&lt;a class=&quot;term&quot; href=&quot;#g6&quot;&gt;AI 優先產品&lt;/a&gt; ARR 年增逾 150%，但約 650 百萬只占約 2.4%&lt;span class=&quot;src&quot;&gt;（推算，媒體轉述）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;公司說到做到：FY2026 前三季營收都高於指引上緣。&lt;/strong&gt;Q4 指引中點約 6,825 百萬美元，年增約 10%&lt;span class=&quot;src&quot;&gt;（推算）&lt;/span&gt;，扣 Semrush 後約 8.2%&lt;span class=&quot;src&quot;&gt;（推算）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;反方是入門端：若免費 AI 工具吃掉 Express 與業餘用戶，放緩會先出現在商業專業與消費者客戶群；付費席次與單價公司都未揭露，量與價無法拆開。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;最近 8 季營收（億美元），上方為比去年同季&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 300&quot; role=&quot;img&quot; aria-label=&quot;8 季營收&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;266.0&quot; y2=&quot;266.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;270.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;0.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;205.5&quot; y2=&quot;205.5&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;209.5&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;20.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;145.0&quot; y2=&quot;145.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;149.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;40.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;84.5&quot; y2=&quot;84.5&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;88.5&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;60.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;24.0&quot; y2=&quot;24.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;28.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;80.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;266.0&quot; y2=&quot;266.0&quot; class=&quot;zero&quot;/&gt;&lt;rect x=&quot;61.1&quot; y=&quot;96.4&quot; width=&quot;40.7&quot; height=&quot;169.6&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;單季營收 FY24 Q4：56.1&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;82.5&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY24 Q4&lt;/text&gt;&lt;rect x=&quot;122.2&quot; y=&quot;93.2&quot; width=&quot;40.7&quot; height=&quot;172.8&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;單季營收 FY25 Q1：57.1&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;143.5&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY25 Q1&lt;/text&gt;&lt;rect x=&quot;183.2&quot; y=&quot;88.3&quot; width=&quot;40.7&quot; height=&quot;177.7&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;單季營收 FY25 Q2：58.7&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;204.5&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY25 Q2&lt;/text&gt;&lt;rect x=&quot;244.2&quot; y=&quot;84.9&quot; width=&quot;40.7&quot; height=&quot;181.1&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;單季營收 FY25 Q3：59.9&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;265.5&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY25 Q3&lt;/text&gt;&lt;rect x=&quot;305.1&quot; y=&quot;78.6&quot; width=&quot;40.7&quot; height=&quot;187.4&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;單季營收 FY25 Q4：61.9&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;326.5&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY25 Q4&lt;/text&gt;&lt;text x=&quot;326.5&quot; y=&quot;16.0&quot; class=&quot;note&quot; text-anchor=&quot;middle&quot;&gt;+10%&lt;/text&gt;&lt;rect x=&quot;366.1&quot; y=&quot;72.5&quot; width=&quot;40.7&quot; height=&quot;193.5&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;單季營收 FY26 Q1：64.0&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;387.5&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY26 Q1&lt;/text&gt;&lt;text x=&quot;387.5&quot; y=&quot;16.0&quot; class=&quot;note&quot; text-anchor=&quot;middle&quot;&gt;+12%&lt;/text&gt;&lt;rect x=&quot;427.1&quot; y=&quot;65.8&quot; width=&quot;40.7&quot; height=&quot;200.2&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;單季營收 FY26 Q2：66.2&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;448.5&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY26 Q2&lt;/text&gt;&lt;text x=&quot;448.5&quot; y=&quot;16.0&quot; class=&quot;note&quot; text-anchor=&quot;middle&quot;&gt;+13%&lt;/text&gt;&lt;rect x=&quot;488.1&quot; y=&quot;61.5&quot; width=&quot;40.7&quot; height=&quot;204.5&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;單季營收 FY26 Q3：67.6&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;509.5&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY26 Q3&lt;/text&gt;&lt;text x=&quot;509.5&quot; y=&quot;16.0&quot; class=&quot;note&quot; text-anchor=&quot;middle&quot;&gt;+13%&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c1)&quot;&gt;&lt;/i&gt;單季營收&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;成長來源拆解（量、價、新產品、新市場、併購）&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;能拆的只有併購與匯率：Q3 名目年增 12.9%，扣 Semrush 約 120 百萬與匯率約 40 百萬後約 10.2%&lt;span class=&quot;src&quot;&gt;（推算；8-K 2026-06-11 新聞稿 §2、§4；10-Q Part I, Item 2 ¶68）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;量與價未揭露&lt;span class=&quot;src&quot;&gt;（查過 10-K Item 7、10-Q Item 2）&lt;/span&gt;：公司不公布付費席次、平均單價與流失率；新用戶折扣由去年 50% 擴大到 57%（新聞 N12），價格面偏向讓利。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;figure&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt signals&quot;&gt;&lt;tr&gt;&lt;th&gt;來源&lt;/th&gt;&lt;th&gt;Q3 FY2026 貢獻&lt;/th&gt;&lt;th&gt;依據&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;量（付費席次）&lt;/td&gt;&lt;td&gt;未揭露&lt;/td&gt;&lt;td&gt;查過 10-K Item 7、10-Q Item 2&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;價（平均單價）&lt;/td&gt;&lt;td&gt;未揭露；新用戶首年折扣擴大&lt;/td&gt;&lt;td&gt;新聞 N12&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;新產品（AI 優先產品）&lt;/td&gt;&lt;td&gt;ARR 約 650 百萬、年增逾 150%，占總 ARR 約 2.4%（推算）&lt;/td&gt;&lt;td&gt;新聞 N1（媒體轉述）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;新市場（地區）&lt;/td&gt;&lt;td&gt;歐非中東年增 17%，匯率約 +40 百萬美元&lt;/td&gt;&lt;td&gt;10-Q Part I, Item 2 ¶66、¶68&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;併購（Semrush）&lt;/td&gt;&lt;td&gt;約 120 百萬／季，約 2 個百分點（推算）&lt;/td&gt;&lt;td&gt;8-K 2026-06-11 新聞稿 §2、§4&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;內生（扣併購與匯率）&lt;/td&gt;&lt;td&gt;約 +10.2%（推算）&lt;/td&gt;&lt;td&gt;估值輸入 併購拆分&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;投入與回報&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;研發是最大投入：近四季 4,694 百萬美元、占營收 18.1%，高於軟體產業約 16%；FY2022 到 FY2025 每多花 1 元研發，毛利多 4.42 元，投入與成果同向。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;&lt;a class=&quot;term&quot; href=&quot;#g9&quot;&gt;ROIC&lt;/a&gt; 近五年中位約 44%，遠高於本報告資金成本 10.1%，&lt;a class=&quot;term&quot; href=&quot;#g21&quot;&gt;研發資本化&lt;/a&gt;後結論不翻轉（主張 ADBE-C02）；營運投入資本為負，增量ROIC 算不出來。&lt;/strong&gt;Semrush 收購價 1,874 百萬美元，回報待之後申報判斷。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;研發與設備投資（億美元），上方為研發占營收&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 300&quot; role=&quot;img&quot; aria-label=&quot;投入&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;266.0&quot; y2=&quot;266.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;270.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;0.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;185.3&quot; y2=&quot;185.3&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;189.3&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;20.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;104.7&quot; y2=&quot;104.7&quot; class=&q lt;/circle&gt;&lt;text x=&quot;503.0&quot; y=&quot;85.1&quot; class=&quot;val&quot; fill=&quot;var(--c1)&quot;&gt;13%&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c1)&quot;&gt;&lt;/i&gt;單季營收比去年同季&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c2)&quot;&gt;&lt;/i&gt;近四季合計&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/div&gt;&lt;!--/新圖表--&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;白話說&lt;/b&gt;去年每 100 美元的營收，近四季變成約 112 美元；扣掉併購與匯率後仍約一成（推算）。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;要留意&lt;/b&gt;Q4 指引隱含成長放慢到約一成；FY2027 指引若再降要下修，見改判訊號。&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;cash&quot;&gt;&lt;div class=&quot;qno&quot;&gt;問題 03・04&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;賺的錢是真的嗎？股東實際拿到什麼？&lt;/div&gt;&lt;h2&gt;是真的，自由現金流比帳上淨利多約四成五&lt;/h2&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;盈餘變成現金的能力很強：近四季營運現金流 10,806 百萬美元，高於淨利 7,284 百萬；扣資本支出後&lt;a class=&quot;term&quot; href=&quot;#g8&quot;&gt;自由現金流&lt;/a&gt; 10,592 百萬。&lt;/strong&gt;主因是客戶預付年約：剩餘履約義務（RPO）22,160 百萬&lt;span class=&quot;src&quot;&gt;（8-K 2026-09-10 新聞稿 §4）&lt;/span&gt;、&lt;a class=&quot;term&quot; href=&quot;#g3&quot;&gt;遞延收入&lt;/a&gt;年增 11.1%，錢先進來，收入後認列。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;要扣掉的是股權薪酬：近四季 2,071 百萬美元、占營收約 8%，是用股票支付的員工成本；扣掉後自由現金流約 8,521 百萬&lt;span class=&quot;src&quot;&gt;（10,592 減 2,071，推算）&lt;/span&gt;，仍高於淨利（主張 ADBE-C03）。&lt;/strong&gt;帳上有小額淨負債，償債能力見第六題。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;毛利率與營業利益率&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 280&quot; role=&quot;img&quot; aria-label=&quot;利潤率&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;246.0&quot; y2=&quot;246.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;250.0&quot; class=&quot;ax&quot; text 26.5&quot; height=&quot;117.5&quot; rx=&quot;2&quot; fill=&quot;var(--c4)&quot;&gt;&lt;title&gt;淨利 近四季：72.8&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;464.8&quot; y=&quot;91.7&quot; width=&quot;26.5&quot; height=&quot;174.3&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;營運現金流 近四季：108&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;493.2&quot; y=&quot;95.1&quot; width=&quot;26.5&quot; height=&quot;170.9&quot; rx=&quot;2&quot; fill=&quot;var(--c2)&quot;&gt;&lt;title&gt;自由現金流 近四季：106&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;479.0&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;近四季&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c4)&quot;&gt;&lt;/i&gt;淨利&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c1)&quot;&gt;&lt;/i&gt;營運現金流&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c2)&quot;&gt;&lt;/i&gt;自由現金流&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;錢從哪一層開始不夠：現金流分層&lt;/h3&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;現金流分層（近四季，至 2026-08-28）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;層次&lt;/th&gt;&lt;th&gt;金額&lt;/th&gt;&lt;th&gt;正負&lt;/th&gt;&lt;th&gt;完整度&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;一、營運現金流&lt;/td&gt;&lt;td&gt;108 億美元&lt;/td&gt;&lt;td&gt;正&lt;/td&gt;&lt;td&gt;完整&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;二、一般資本支出後&lt;/td&gt;&lt;td&gt;106 億美元&lt;/td&gt;&lt;td&gt;正&lt;/td&gt;&lt;td&gt;完整&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;三、回購與股利後&lt;/td&gt;&lt;td&gt;13.0 億美元&lt;/td&gt;&lt;td&gt;正&lt;/td&gt;&lt;td&gt;完整&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;延伸：再扣併購與員工代扣稅&lt;/td&gt;&lt;td&gt;-6.6 億美元&lt;/td&gt;&lt;td&gt;負&lt;/td&gt;&lt;td&gt;完整&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;數值正負不等於安全或危險：第二層為負代表所列投入超過當期營運現金，不等於營業虧損；資本支出尚未區分維持與擴張。；股利：確認為零：近四季組成欄（10-K 欄 2025-11-28 (FY)、10-Q 欄 2026-08-28 (YTD)、10-Q 欄 2025-08-29 (YTD)）的融資活動逐項加總等於小計，且沒有股利列；另有未分類融資列，金額已列於報表對帳&lt;/p&gt;&lt;p class=&quot;cap&quot;&gt;（算法與完整表見&lt;a href=&quot;#wp-3-4&quot;&gt;計算底稿 3・4&lt;/a&gt;）&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;白話說&lt;/b&gt;每 100 美元帳上淨利，近四季實際收進約 148 美元營運現金，扣資本支出後約 145 美元。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;要留意&lt;/b&gt;現金流強靠預收；若續約放緩，遞延收入會先下降，見改判訊號。&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;shareholders&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;股東實際拿到什麼？&lt;/p&gt;&lt;h3&gt;不發股利，靠大額回購每年減少約 3% 股數&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;股東回報全靠回購：近四季回購 9,295 百萬美元、股利為零，合計約占自由現金流 88%。&lt;/strong&gt;股數年變化：-5.0%（近一財年；股數期間 2015–2025）；-3.2%（近三財年年化）；-1.7%（近十財年年化）。每股自由現金流從 FY2022 的 15.71 美元增到近四季 26.29 美元，扣股權薪酬後每股約 21.15 美元&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;Q3 買回 9.5 百萬股，加權均價約 235 美元&lt;span class=&quot;src&quot;&gt;（推算，10-Q Part II Item 2 ¶2）&lt;/span&gt;，低於 FY2026 前三季（含 Q3）合計均價約 261 美元&lt;span class=&quot;src&quot;&gt;（媒體推算，新聞 N6）&lt;/span&gt;；剩餘授權約 24,549 百萬美元。&lt;/strong&gt;限制是股權薪酬一年約 2,071 百萬，回購約兩成只是抵銷稀釋。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;現價隱含年報酬（各情境成真時，非預期報酬）；紅色虛線為公債殖利率 5.12%。基準情境下，現價隱含的年報酬只比公債高 6.6 個百分點，模型的加權資本成本（基準）比公債高 5.0 個百分點，兩者的差距對應市價與合理價值的落差&lt;/p&gt;&lt;svg viewBox=&quot;0 0 500 182&quot; role=&quot;img&quot; aria-label=&quot;現價隱含年報酬對公債&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;168.0&quot; x2=&quot;168.0&quot; y1=&quot;6&quot; y2=&quot;176&quot; class=&quot;zero&quot;/&gt;&lt;line x1=&quot;252.0&quot; x2=&quot;252.0&quot; y1=&quot;4&quot; y2=&quot;178&quot; class=&quot;price&quot;/&gt;&lt;text x=&quot;158&quot; y=&quot;23&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;保守情境成真&lt;/text&gt;&lt;rect x=&quot;168.0&quot; y=&quot;9&quot; width=&quot;123.8&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c4)&quot;/&gt;&lt;text x=&quot;299.8&quot; y=&quot;23&quot; class=&quot;val&quot;&gt;7.55%&lt;/text&gt;&lt;text x=&quot;158&quot; y=&quot;63&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;基準情境成真&lt;/text&gt;&lt;rect x=&quot;168.0&quot; y=&quot;49&quot; width=&quot;192.8&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c1)&quot;/&gt;&lt;text x=&quot;368.8&quot; y=&quot;63&quot; class=&quot;val&quot;&gt;11.76%&lt;/text&gt;&lt;text x=&quot;158&quot; y=&quot;103&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;樂觀情境成真&lt;/text&gt;&lt;rect x=&quot;168.0&quot; y=&quot;89&quot; width=&quot;249.1&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;425.1&quot; y=&quot;103&quot; class=&quot;val&quot;&gt;15.19%&lt;/text&gt;&lt;text x=&quot;158&quot; y=&quot;143&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot; font-weight=&amp;quot;700&amp;quot;&gt;10 年期美國公債&lt;/text&gt;&lt;rect x=&quot;168.0&quot; y=&quot;129&quot; width=&quot;84.0&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--muted)&quot;/&gt;&lt;text x=&quot;260.0&quot; y=&quot;143&quot; class=&quot;val&quot;&gt;5.12%&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;每股自由現金流（美元）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 300&quot; role=&quot;img&quot; aria-label=&quot;每股自由現金流&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;266.0&quot; y2=&quot;266.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;270.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;0.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;185.3&quot; y2=&quot;185.3&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;189.3&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;10.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;104.7&quot; y2=&quot;104.7&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;108.7&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;20.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;24.0&quot; y2=&quot;24.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;28.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;30.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;266.0&quot; y2=&quot;266.0&quot; class=&quot;zero&quot;/&gt;&lt;rect x=&quot;66.6&quot; y=&quot;139.3&quot; width=&quot;32.2&quot; height=&quot;126.7&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;每股自由現金流 FY22：15.7&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;100.8&quot; y=&quot;164.0&quot; width=&quot;32.2&quot; height=&quot;102.0&quot; rx=&quot;2&quot; fill=&quot;var(--c4)&quot;&gt;&lt;title&gt;扣除股權薪酬後 FY22：12.6&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;100.8&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY22&lt;/text&gt;&lt;rect x=&quot;164.2&quot; y=&quot;144.0&quot; width=&quot;32.2&quot; height=&quot;122.0&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;每股自由現金流 FY23：15.1&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;198.4&quot; y=&quot;174.2&quot; width=&quot;32.2&quot; height=&quot;91.8&quot; rx=&quot;2&quot; fill=&quot;var(--c4)&quot;&gt;&lt;title&gt;扣除股權薪酬後 FY23：11.4&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;198.4&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY23&lt;/text&gt;&lt;rect x=&quot;261.8&quot; y=&quot;124.8&quot; width=&quot;32.2&quot; height=&quot;141.2&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;每股自由現金流 FY24：17.5&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;296.0&quot; y=&quot;157.7&quot; width=&quot;32.2&quot; height=&quot;108.3&quot; rx=&quot;2&quot; fill=&quot;var(--c4)&quot;&gt;&lt;title&gt;扣除股權薪酬後 FY24：13.4&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;296.0&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY24&lt;/text&gt;&lt;rect x=&quot;359.4&quot; y=&quot;79.9&quot; width=&quot;32.2&quot; height=&quot;186.1&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;每股自由現金流 FY25：23.1&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;393.6&quot; y=&quot;116.6&quot; width=&quot;32.2&quot; height=&quot;149.4&quot; rx=&quot;2&quot; fill=&quot;var(--c4)&quot;&gt;&lt;title&gt;扣除股權薪酬後 FY25：18.5&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;393.6&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY25&lt;/text&gt;&lt;rect x=&quot;457.0&quot; y=&quot;53.9&quot; width=&quot;32.2&quot; height=&quot;212.1&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;每股自由現金流 近四季：26.3&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;491.2&quot; y=&quot;95.4&quot; width=&quot;32.2&quot; height=&quot;170.6&quot; rx=&quot;2&quot; fill=&quot;var(--c4)&quot;&gt;&lt;title&gt;扣除股權薪酬後 近四季：21.1&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;491.2&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;近四季&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c1)&quot;&gt;&lt;/i&gt;每股自由現金流&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c4)&quot;&gt;&lt;/i&gt;扣除股權薪酬後&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;白話說&lt;/b&gt;如果你有 100 股不動，股數照近三年每年減 3.2% 的速度，三年後你占公司的比例約多 10%（推算）。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;要留意&lt;/b&gt;回購金額接近自由現金流；若改由借款支應或均價高於合理上緣，見改判訊號。&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;股東回報與市價隱含報酬拆解&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;&lt;a class=&quot;term&quot; href=&quot;#g17&quot;&gt;股東收益率&lt;/a&gt; 9.7% 高於 10 年期公債 5.12%，主要押在現金回饋。&lt;/strong&gt;照基準假設的隱含年報酬約 11.8%&lt;span class=&quot;src&quot;&gt;（基準情境成真時、以收盤 2026-11-16 股價買進的推算年報酬；條件式，非預期報酬、非買賣建議）&lt;/span&gt;：回購約 9.7%、每股成長與其他約 2.1%&lt;span class=&quot;src&quot;&gt;（推算，假設倍數不變）&lt;/span&gt;，不是預期報酬保證。&lt;/p&gt;&lt;p&gt;回報品質中上：近十年每年都有回購，扣股權薪酬後淨回購殖利率 7.5%（回購扣股權薪酬；收盤 2026-11-16）；資金來自自由現金流，但回饋占比 88% 屬「注意」，幾乎沒有加碼餘裕。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;現價隱含年報酬（基準情境，非預期報酬）從哪裡來：股利、回購是現在拿到的現金，其餘要靠每股成長（紅色虛線為 10 年期美國公債 5.12%）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 500 196&quot; role=&quot;img&quot; aria-label=&quot;市價隱含報酬拆解&quot; class=&quot;chart&quot; style=&quot;max-width:650px&quot;&gt;&lt;line x1=&quot;250.0&quot; x2=&quot;250.0&quot; y1=&quot;24&quot; y2=&quot;192&quot; class=&quot;zero&quot;/&gt;&lt;line x1=&quot;327.9&quot; x2=&quot;327.9&quot; y1=&quot;22&quot; y2=&quot;192&quot; class=&quot;price&quot;/&gt;&lt;text x=&quot;327.9&quot; y=&quot;16&quot; class=&quot;pricelab&quot; text-anchor=&quot;middle&quot;&gt;公債 5.12%&lt;/text&gt;&lt;text x=&quot;240&quot; y=&quot;55.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;股利殖利率&lt;/text&gt;&lt;rect x=&quot;250.0&quot; y=&quot;40.0&quot; width=&quot;2.0&quot; height=&quot;20&quot; rx=&quot;4&quot; fill=&quot;var(--c2)&quot;&gt;&lt;title&gt;股利殖利率：0.00%&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;258.0&quot; y=&quot;55.0&quot; class=&quot;val&quot;&gt;0.00%&lt;/text&gt;&lt;line x1=&quot;250.0&quot; x2=&quot;250.0&quot; y1=&quot;60.0&quot; y2=&quot;80.0&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;1&quot; stroke-dasharray=&quot;2 3&quot;/&gt;&lt;text x=&quot;240&quot; y=&quot;95.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;回購殖利率&lt;/text&gt;&lt;rect x=&quot;250.0&quot; y=&quot;80.0&quot; width=&quot;146.8&quot; height=&quot;20&quot; rx=&quot;4&quot; fill=&quot;var(--c6)&quot;&gt;&lt;title&gt;回購殖利率：+9.65%&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;404.8&quot; y=&quot;95.0&quot; class=&quot;val&quot;&gt;+9.65%&lt;/text&gt;&lt;line x1=&quot;396.8&quot; x2=&quot;396.8&quot; y1=&quot;100.0&quot; y2=&quot;120.0&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;1&quot; stroke-dasharray=&quot;2 3&quot;/&gt;&lt;text x=&quot;240&quot; y=&quot;135.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;每股成長與其他（推算）&lt;/text&gt;&lt;rect x=&quot;396.8&quot; y=&quot;120.0&quot; width=&quot;32.0&quot; height=&quot;20&quot; rx=&quot;4&quot; fill=&quot;var(--c3)&quot;&gt;&lt;title&gt;每股成長與其他（推算）：+2.11%&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;436.8&quot; y=&quot;135.0&quot; class=&quot;val&quot;&gt;+2.11%&lt;/text&gt;&lt;line x1=&quot;428.8&quot; x2=&quot;428.8&quot; y1=&quot;140.0&quot; y2=&quot;160.0&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;1&quot; stroke-dasharray=&quot;2 3&quot;/&gt;&lt;text x=&quot;240&quot; y=&quot;175.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;合計：現價隱含年報酬（基準情境，非預期報酬）&lt;/text&gt;&lt;rect x=&quot;250.0&quot; y=&quot;160.0&quot; width=&quot;178.8&quot; height=&quot;20&quot; rx=&quot;4&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;合計：現價隱含年報酬（基準情境，非預期報酬）：11.76%&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;436.8&quot; y=&quot;175.0&quot; class=&quot;val&quot;&gt;11.76%&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;股利、回購、股數變化與政策門檻的逐項判讀（算法與完整表見&lt;a href=&quot;#wp-3-4&quot;&gt;計算底稿 3・4&lt;/a&gt;）。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;market&quot;&gt;&lt;div class=&quot;qno&quot;&gt;市場背景&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;看價格之前：大盤與這檔股票現在的市場狀態&lt;/div&gt;&lt;h2&gt;大盤 2 個面向相對歷史偏高；股價近 12 個月落後大盤（-26% 對 +11%）&lt;/h2&gt;&lt;style&gt;.mkt-cards{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:14px 0}.mkt-cards .kpi{padding:10px 12px}.mkt-cards .v{font-size:20px}.mkt-cards .l,.mkt-cards .n{font-size:12px}&lt;/style&gt;&lt;div class=&quot;kpis mkt-cards&quot;&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;l&quot;&gt;大盤｜估值&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;偏高&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;偏高 1／有分位 2 項&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;l&quot;&gt;大盤｜信用&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;中性&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;偏高 0／有分位 3 項&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;l&quot;&gt;大盤｜槓桿&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;偏高&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;偏高 1／有分位 1 項&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;l&quot;&gt;大盤｜情緒&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;中性&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;偏高 0／有分位 2 項&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;l&quot;&gt;大盤｜廣度&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;中性&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;偏高 0／有分位 2 項&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;l&quot;&gt;個股｜近 12 個月報酬&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;-26%&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;同期 S&amp;amp;P 500 +11%（2026-11-16 收盤）&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;l&quot;&gt;個股｜52 週區間位置&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;32%&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;0%＝低 193.41、100%＝高 357.53（推算）&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;l&quot;&gt;個股｜距 200 日均線&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;-0.6%&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;200 日均線 247.43&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;l&quot;&gt;個股｜60 日年化波動&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;39%&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;日報酬標準差年化（收盤）&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;l&quot;&gt;個股｜20 日均成交金額&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;10 億美元&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;自身近 5 年 &gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;valuation&quot;&gt;&lt;div class=&quot;qno&quot;&gt;問題 05&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;現在的價格貴不貴？&lt;/div&gt;&lt;h2&gt;價格偏低：低於合理區間下緣、略高於買入上限&lt;/h2&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;價格偏低：合理價值約 266.04–349.81 美元（中點 302.48 美元），2026-11-16 收盤 246.00 美元 低於下緣、略高於買入上限 241.99 美元，價格位置為「偏低」。&lt;/strong&gt;以現價買進，基準情境成真時年報酬約 11.8%&lt;span class=&quot;src&quot;&gt;（基準情境成真時、以收盤 2026-11-16 股價買進的推算年報酬；條件式，非預期報酬、非買賣建議）&lt;/span&gt;&lt;span class=&quot;src&quot;&gt;（推算，非預期報酬）&lt;/span&gt;，高於 10 年期公債 5.12%。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;基準情境的故事是成長慢慢降溫、利潤率守住：營收第 1 年增 10%，五年內降到 6%，營業利益率約 35%～36%，接近目前水準。&lt;/strong&gt;市價只要求營收每年約 4.1%&lt;span class=&quot;src&quot;&gt;（市價反推未來 5 年營收年增；市價 246.00 美元、收盤 2026-11-16；折現率 10.10%；推導）&lt;/span&gt;，或成長照基準時長期營業利益率約 29.2%&lt;span class=&quot;src&quot;&gt;（市價反推第 1 年起每年固定的營業利益率，含穩態；市價 246.00 美元、收盤 2026-11-16；折現率 10.10%；推導）&lt;/span&gt;（兩者擇一），都比實績保守。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;反方是 AI 先壓低價格：保守情境每股約 169.04 美元，比現價低約 31%，假設成長降到 3%、利潤率降到 23%。&lt;/strong&gt;基準約 34% 的價值來自預測期之後；折現率的 beta 改用較低端時中點約高 12%&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;，價格位置不變。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;各方法的每股價值區間（美元）：綠底為合理價值，虛線為買入上限與市價&lt;/p&gt;&lt;svg viewBox=&quot;0 0 680 358&quot; role=&quot;img&quot; aria-label=&quot;估值區間&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;183.6&quot; x2=&quot;183.6&quot; y1=&quot;28&quot; y2=&quot;332&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;183.6&quot; y=&quot;350&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;150&lt;/text&gt;&lt;line x1=&quot;214.9&quot; x2=&quot;214.9&quot; y1=&quot;28&quot; y2=&quot;332&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;214.9&quot; y=&quot;350&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;200&lt;/text&gt;&lt;line x1=&q
