&lt;div class=&quot;front&quot; id=&quot;front&quot; data-layer=&quot;首頁&quot;&gt;&lt;header class=&quot;hero&quot;&gt;&lt;div&gt;&lt;span class=&quot;stance&quot;&gt;生意 B／價格合理&lt;/span&gt;&lt;span class=&quot;stance rating&quot;&gt;研究評等　生意 B ／ 價格合理（非買賣建議）&lt;/span&gt;&lt;h1&gt;遊戲、音樂與感測器撐起穩定成長，市價已落在合理價值區間上半部，要求的成長比過去快。&lt;/h1&gt;&lt;p class=&quot;summary&quot;&gt;Sony 分拆金融後，靠 PlayStation（Sony 遊戲主機品牌）軟體與網路服務、音樂版權與影像感測器賺錢，近四季營業利益率約 13.7%（推導），為近年最高。合理價值 20.50–28.53 美元（中點 24.08 美元），2026-11-13 收盤 27.07 美元，價格位置 合理。市價反推未來五年營收每年約 8.0%（市價反推未來 5 年營收年增；市價 27.07 美元、收盤 2026-11-13；折現率 8.08%；推導），也高於近三年日圓年複合約 7.3%（FY2022 起點用不含金融分部的產品與服務銷售額，推導；含日圓走弱的換算效果）。研究評等 生意 B／價格合理，非買賣建議。&lt;/p&gt;&lt;/div&gt;&lt;aside class=&quot;pricebox&quot;&gt;&lt;div class=&quot;sub&quot;&gt;2026-11-13 收盤 27.07 美元&lt;/div&gt;&lt;div class=&quot;big&quot;&gt;27.07&lt;span style=&quot;font-size:18px&quot;&gt; 美元&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;zones&quot;&gt;&lt;div class=&quot;zone buy&quot; style=&quot;grid-column:1/-1&quot;&gt;&lt;span&gt;買入區上緣（不確定性高）&lt;/span&gt;&lt;b&gt;14 美元&lt;/b&gt;&lt;small&gt;股價在此以下才有 40% 安全邊際；＝合理價值中點 24.08 ×（1−40%）。非買賣建議。&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;rows&quot;&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;股價 ÷ 合理價值中點&lt;/span&gt;&lt;span&gt;1.12 倍&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;10 年期美國公債&lt;/span&gt;&lt;span&gt;5.15%&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;r&quot;&gt;&lt;span&gt;市價隱含 5 年營收年增&lt;/span&gt;&lt;span&gt;8.0%&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;現金與證券（2026-03-31）&lt;/span&gt;&lt;span&gt;139 億美元&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;有息負債&lt;/span&gt;&lt;span&gt;65.5 億美元&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;淨現金&lt;/span&gt;&lt;span&gt;73.4 億美元&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;近四季回購&lt;/span&gt;&lt;span&gt;34.7 億美元&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot; style=&quot;display:block&quot;&gt;&lt;span&gt;股東回報與權益（2020–2024）：&lt;/span&gt;&lt;span style=&quot;font-weight:400&quot;&gt;近五年平均 ROE 15%；股東權益 455→546 億美元（逐年表見第六題）&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; id=&quot;cont-note&quot; style=&quot;margin:10px 0 0&quot;&gt;這個數字只描述現價與本報告合理價值中點的距離，不改價格位置與研究評等。非買賣建議。&lt;/p&gt;&lt;/aside&gt;&lt;/header&gt;&lt;section class=&quot;note-box&quot; id=&quot;value-trio&quot; style=&quot;margin-top:18px&quot;&gt;&lt;h3&gt;合理價值與市價隱含第 10 年倍數&lt;/h3&gt;&lt;div class=&quot;zones&quot; style=&quot;grid-template-columns:repeat(2,1fr)&quot;&gt;&lt;div class=&quot;zone&quot;&gt;&lt;span&gt;合理價值（只含折現率）&lt;/span&gt;&lt;b&gt;20–29 美元&lt;/b&gt;&lt;small&gt;中點 24.08 美元；三情境機率加權&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;zone mkt&quot;&gt;&lt;span&gt;市價隱含第 10 年倍數（EV/EBIT，基準情境）&lt;/span&gt;&lt;b&gt;14.9 倍&lt;/b&gt;&lt;small&gt;模型假設 11.6 倍，市價隱含是模型的 1.3 倍；折現率區間 13.6–16.4 倍；參考帶（跨產業，1046 筆、51 家）中位 15.5 倍、四分位 7.8–27.6 倍、p90 42.7 倍（機械回測樣本，非市場全體；分產業的筆數與公司數少，僅供參考）；只描述，不進評等&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;參考帶中位（跨產業） 15.5 倍時，機率加權每股約 29 美元（條件式，非目標價、非買賣建議，不進評等；各倍數對照見計算底稿 5）。&lt;/p&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;&lt;b&gt;合理價值 vs 市價隱含倍數（作者判讀）：&lt;/b&gt;市價隱含第 10 年 EV/EBIT 約 14.9 倍，比模型終值倍數 11.6 倍 高（比值 1.29），但低於跨產業參考帶中位 15.5 倍；市價要求的倍數不算罕見，只描述，不當評等理由。&lt;/p&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:10px;font-size:15px;line-height:1.7&quot;&gt;上面的合理價值只含折現率高低；三情境全幅 12～45（情境與折現率一起算，約中點的 139%）；寬主要來自情境（差距 105%），不是折現率（33%）。情境差距＝（樂觀－保守）÷基準，折現率寬度＝（高－低）÷中點；非買賣建議。&lt;/p&gt;&lt;div class=&quot;tw&quot; style=&quot;margin-top:14px&quot;&gt;&lt;table class=&quot;txt&quot; style=&quot;min-width:0;font-size:16px&quot;&gt;&lt;tr&gt;&lt;th style=&quot;padding:9px 12px;font-size:15px&quot;&gt;情境&lt;/th&gt;&lt;th style=&quot;padding:9px 12px;font-size:15px&quot;&gt;每股價值&lt;/th&gt;&lt;th style=&quot;padding:9px 12px;font-size:15px&quot;&gt;權重&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;padding:9px 12px&quot;&gt;保守&lt;/td&gt;&lt;td style=&quot;padding:9px 12px;font-size:20px;font-weight:700&quot;&gt;13.23&lt;/td&gt;&lt;td style=&quot;padding:9px 12px&quot;&gt;25%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;padding:9px 12px&quot;&gt;基準&lt;div style=&quot;font-size:13px;line-height:1.5;color:var(--muted);margin-top:2px&quot;&gt;與外部 DCF 單點同口徑；今天的現值，不是 12 個月目標價，非買賣建議&lt;/div&gt;&lt;/td&gt;&lt;td style=&quot;padding:9px 12px;font-size:20px;font-weight:700&quot;&gt;22.91&lt;/td&gt;&lt;td style=&quot;padding:9px 12px&quot;&gt;50%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;padding:9px 12px&quot;&gt;樂觀&lt;/td&gt;&lt;td style=&quot;padding:9px 12px;font-size:20px;font-weight:700&quot;&gt;37.27&lt;/td&gt;&lt;td style=&quot;padding:9px 12px&quot;&gt;25%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:10px;font-size:15px;line-height:1.7&quot;&gt;中點是三個情境的加權，上下緣是換折現率重算；算式見&lt;a href=&quot;#valuation&quot;&gt;第五題&lt;/a&gt;。情境表說明合理價值怎麼組成，不是單一目標價。&lt;/p&gt;&lt;/section&gt;&lt;!--目標區間:首頁--&gt;&lt;div class=&quot;note-box tgt&quot; id=&quot;target-front&quot;&gt;&lt;h3&gt;12 個月條件式目標區間&lt;/h3&gt;&lt;p style=&quot;margin:0 0 6px&quot;&gt;如果三種情境各自成真，一年後（至 2027-11-13）每股價值大約落在：保守 12.52–16.17、基準 21.09–29.08、樂觀 33.54–48.76 美元。這是條件式區間，不是股價預測，三段不合成單一數字。&lt;/p&gt;&lt;figure class=&quot;figure wide&quot;&gt;&lt;svg viewBox=&quot;0 0 860 232&quot; role=&quot;img&quot; aria-label=&quot;今天的價值區間與 12 個月後的條件式目標區間（條件式、非買賣建議）&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;240.6&quot; x2=&quot;240.6&quot; y1=&quot;24&quot; y2=&quot;198&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;240.6&quot; y=&quot;212&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;20&lt;/text&gt;&lt;line x1=&quot;341.5&quot; x2=&quot;341.5&quot; y1=&quot;24&quot; y2=&quot;198&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;341.5&quot; y=&quot;212&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;30&lt;/text&gt;&lt;line x1=&quot;442.3&quot; x2=&quot;442.3&quot; y1=&quot;24&quot; y2=&quot;198&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;442.3&quot; y=&quot;212&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;40&lt;/text&gt;&lt;line x1=&quot;543.2&quot; x2=&quot;543.2&quot; y1=&quot;24&quot; y2=&quot;198&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;543.2&quot; y=&quot;212&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;50&lt;/text&gt;&lt;text x=&quot;4&quot; y=&quot;16&quot; class=&quot;lab&quot; font-weight=&quot;700&quot;&gt;今天（依證據的價值；倍數列只作交叉核對）&lt;/text&gt;&lt;text x=&quot;142&quot; y=&quot;42.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;合理價值&lt;/text&gt;&lt;rect x=&quot;245.6&quot; y=&quot;30.0&quot; width=&quot;81.1&quot; height=&quot;16&quot; rx=&quot;8&quot; fill=&quot;var(--pos)&quot; opacity=&quot;0.8&quot;&gt;&lt;title&gt;合理價值：20.5–28.5&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;332.6&quot; y=&quot;42.0&quot; class=&quot;ax&quot;&gt;20.5–28.5；買入區上緣 14.4&lt;/text&gt;&lt;text x=&quot;142&quot; y=&quot;70.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;倍數交叉核對（不進評等）&lt;/text&gt;&lt;rect x=&quot;375.5&quot; y=&quot;58.0&quot; width=&quot;129.4&quot; height=&quot;16&quot; rx=&quot;8&quot; fill=&quot;var(--muted)&quot; opacity=&quot;0.35&quot;&gt;&lt;title&gt;倍數交叉核對（不進評等）：33.4–46.2&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;510.9&quot; y=&quot;70.0&quot; class=&quot;ax&quot;&gt;33.4–46.2&lt;/text&gt;&lt;text x=&quot;4&quot; y=&quot;96&quot; class=&quot;lab&quot; font-weight=&quot;700&quot;&gt;12 個月後（條件式目標區間，不進評等）&lt;/text&gt;&lt;text x=&quot;142&quot; y=&quot;122.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;保守 25%&lt;/text&gt;&lt;rect x=&quot;165.2&quot; y=&quot;110.0&quot; width=&quot;36.7&quot; height=&quot;16&quot; rx=&quot;8&quot; fill=&quot;var(--c5)&quot; opacity=&quot;0.85&quot;&gt;&lt;title&gt;保守 25%：12.5–16.2&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;207.9&quot; y=&quot;122.0&quot; class=&quot;ax&quot;&gt;12.52–16.17｜相對現價 −54%～−40%&lt;/text&gt;&lt;text x=&quot;142&quot; y=&quot;150.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;基準 50%&lt;/text&gt;&lt;rect x=&quot;251.6&quot; y=&quot;138.0&quot; width=&quot;80.6&quot; height=&quot;16&quot; rx=&quot;8&quot; fill=&quot;var(--c1)&quot; opacity=&quot;0.85&quot;&gt;&lt;title&gt;基準 50%：21.1–29.1&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;338.2&quot; y=&quot;150.0&quot; class=&quot;ax&quot;&gt;21.09–29.08｜相對現價 −22%～+7%&lt;/text&gt;&lt;text x=&quot;142&quot; y=&quot;178.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;樂觀 25%&lt;/text&gt;&lt;rect x=&quot;377.2&quot; y=&quot;166.0&quot; width=&quot;153.5&quot; height=&quot;16&quot; rx=&quot;8&quot; fill=&quot;var(--c2)&quot; opacity=&quot;0.85&quot;&gt;&lt;title&gt;樂觀 25%：33.5–48.8&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;536.7&quot; y=&quot;178.0&quot; class=&quot;ax&quot;&gt;33.54–48.76｜相對現價 +24%～+80%&lt;/text&gt;&lt;line x1=&quot;184.6&quot; x2=&quot;184.6&quot; y1=&quot;27&quot; y2=&quot;49&quot; class=&quot;buyline&quot;/&gt;&lt;line x1=&quot;311.9&quot; x2=&quot;311.9&quot; y1=&quot;24&quot; y2=&quot;198&quot; class=&quot;price&quot;/&gt;&lt;text x=&quot;311.9&quot; y=&quot;228&quot; class=&quot;pricelab&quot; text-anchor=&quot;middle&quot;&gt;現價 27.07&lt;/text&gt;&lt;/svg&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;條件式、非買賣建議；2026-11-13 至 2027-11-13；機率為政策權重，未經歷史校準；細節見第五題。&lt;/p&gt;&lt;/figure&gt;&lt;/div&gt;&lt;!--/目標區間:首頁--&gt;&lt;div class=&quot;kpis&quot;&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;l&quot;&gt;上半年營收年增&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;+9.4%&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;FY2026 上半年（至 2026-09-30），日圓；近四季合計年增工具未取得（6-K 2026-11-05#3 新聞稿 §3）&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;l&quot;&gt;營業利益率&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;13.7%&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;近四季持續營運，推導；FY2022–FY2025 介於 9.2%～11.6%&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;l&quot;&gt;ROIC（投入資本報酬率）&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;13.4%～16.5%&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;年度與近四季口徑，皆推導；WACC（加權平均資金成本）8.1%&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;l&quot;&gt;股東收益率&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;2.7%&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;股利 0.6%＋回購 2.2%，FY2025（至 2026-03-31）；10 年期公債 5.15%&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;p style=&quot;margin:6px 0 0&quot;&gt;&lt;a href=&quot;#foreign&quot;&gt;&lt;b&gt;外國發行人&lt;/b&gt;&lt;/a&gt;　申報 20-F／6-K，會計準則 IFRS，報告幣別 JPY，金額換成美元（收盤日匯率 1 JPY＝0.0063 美元，DEXJPUS，2026-11-06；流量用期間平均、存量用期末）；季度數字來自 6-K 新聞稿（非 XBRL）&lt;/p&gt;&lt;div class=&quot;note-box&quot; id=&quot;survival&quot; style=&quot;border-left-color:var(--pos)&quot;&gt;&lt;p style=&quot;margin:0&quot;&gt;&lt;b&gt;信用評級&lt;/b&gt;　機構 Moody&amp;#x27;s A2、S&amp;amp;P A+（SEC 全文搜尋 FWP 2026-06-24 0001104659-26-076979 #0）｜投資等級　｜　&lt;a href=&quot;#survival-detail&quot;&gt;&lt;b&gt;存活檢查（12～24 個月）&lt;/b&gt;&lt;/a&gt;　&lt;b style=&quot;color:var(--pos)&quot;&gt;無明顯警訊&lt;/b&gt;（推導，非違約預測；理由見第六題計算底稿）&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;grid2 front-pts&quot;&gt;&lt;div&gt;&lt;h3&gt;三個論點&lt;/h3&gt;&lt;ol class=&quot;pts&quot;&gt;&lt;li&gt;上半年營收成長大半是日圓走弱；扣掉匯率，網路服務、音樂與電影是實質成長來源，主機台數下滑沒有拖垮獲利（主張 SONY-C05；推導）。&lt;/li&gt;&lt;li&gt;資本報酬高於資金成本：年度 ROIC 約 13.4%、近四季約 16.5%（推導），對 WACC 8.1%。&lt;/li&gt;&lt;li&gt;淨現金、A 級信評、未動用授信，分拆後仍持續回購，資產負債表強（主張 SONY-C04）。&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;&lt;div&gt;&lt;h3&gt;三個風險&lt;/h3&gt;&lt;ol class=&quot;pts risk&quot;&gt;&lt;li&gt;記憶體漲價與主機供貨受限，可能壓縮 PS5（現行第五代 PlayStation 主機）末期到 PS6（下一代主機，公司未公布時程）世代的硬體利潤。&lt;/li&gt;&lt;li&gt;近四季利潤含未揭露金額的美國關稅退款，不會重複發生。&lt;/li&gt;&lt;li&gt;影像感測器面對點名競爭者，行動感測器銷售已下滑。&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;note-box mv&quot;&gt;&lt;b&gt;市場價格隱含什麼、我們哪裡不同&lt;/b&gt;&lt;p&gt;市價隱含未來五年營收每年約 8.0%（市價反推未來 5 年營收年增；市價 27.07 美元、收盤 2026-11-13；折現率 8.08%；推導），高於我們基準的 4.0%，也略高於近三年日圓年複合約 7.3%（不含金融分部，推導；含日圓走弱換算）；我們認為軟體與服務能撐住利潤率，但硬體週期會讓成長回到中個位數。&lt;/p&gt;&lt;/div&gt;&lt;div id=&quot;triggers&quot; class=&quot;tm&quot;&gt;&lt;h3&gt;風險與改變判斷&lt;/h3&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;risk-tbl&quot; style=&quot;min-width:0;width:100%&quot;&gt;&lt;tr&gt;&lt;th style=&quot;white-space:normal;width:64%&quot;&gt;情況（看哪個指標、門檻多少）&lt;/th&gt;&lt;th style=&quot;white-space:normal;width:22%&quot;&gt;會改變什麼判斷&lt;/th&gt;&lt;th style=&quot;white-space:normal;width:14%&quot;&gt;歷史基準比率&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;網路服務營收年增轉負（6-K 分部段落），遊戲平台成長論點不成立&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;護城河下修&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;59%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;FY2026 全年營業利益指引下修，或實際低於 1.87 兆日圓 5% 以上&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;基準情境下修&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;年度持續營運 ROIC（推導）低於 10%&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;資本報酬評等下修&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;公司揭露關稅退款超過近四季營業利益 8%&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;利潤率起點下修&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;淨負債÷EBITDA 轉正且高於 1.5 倍&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;資產負債表評等下修&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;收盤價高於合理價值上緣 28.53 美元或低於買入區上緣&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;價格位置改變&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;記憶體價格持續上漲，主機硬體利潤受壓（SONY-C06）&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;未設門檻：持續觀察&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;感測器合資追加出資或延後量產，資本報酬下降&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;未設門檻：持續觀察&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;日圓轉強會讓換算後營收與利潤下降&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;未設門檻：持續觀察&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;FY2025 曾未達營業利益指引約 6%（SONY-C09）&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;未設門檻：持續觀察&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;歷史基準比率＝成功幾率口徑，是同規模公司歷史上做到的比例，不是這家公司的預測；「—」＝沒有可對照的歷史基準，不估機率。營收成長類的列：同規模（營收 500 億美元以上）公司 10 年實質年增做到模型基準 1.7% 的歷史比例（超額報酬期間檢查.json 基準比率；Base Rate Book）。&lt;/p&gt;&lt;/div&gt;&lt;p class=&quot;cap fnote&quot;&gt;資料日期：財報截至 2026-09-30；市場資料 2026-11-13 收盤 27.07 美元。首家產業，公版待驗證（穩定現金流／品牌消費與硬體；產業公版的估值法與指標選擇尚未經兩家以上驗證）。本報告為研究用途，研究評等與條件式目標區間都不是買賣建議；數字以 2026-11-13 收盤與本輪存檔申報為準。本研究只評估公司本身，不評估讀者自身的資金期限與等待能力。完整數字見正文&lt;a href=&quot;#numbers&quot;&gt;「完整數字」&lt;/a&gt;；名詞與每條判斷的證據狀態見&lt;a href=&quot;#more&quot;&gt;附錄&lt;/a&gt;。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;nav class=&quot;qnav&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;&lt;a href=&quot;#business&quot;&gt;01　生意怎麼賺錢？&lt;/a&gt;&lt;a href=&quot;#growth&quot;&gt;02　成長從哪裡來？&lt;/a&gt;&lt;a href=&quot;#cash&quot;&gt;03・04　賺到的錢是真的現金嗎？股東拿到多少？&lt;/a&gt;&lt;a href=&quot;#market&quot;&gt;市場背景&lt;/a&gt;&lt;a href=&quot;#valuation&quot;&gt;05　現在的價格合理嗎？&lt;/a&gt;&lt;a href=&quot;#value&quot;&gt;價值判斷與評等&lt;/a&gt;&lt;a href=&quot;#capital&quot;&gt;06　資本與治理有什麼要注意？&lt;/a&gt;&lt;a href=&quot;#events&quot;&gt;07　最近發生了什麼？&lt;/a&gt;&lt;a href=&quot;#numbers&quot;&gt;完整數字&lt;/a&gt;&lt;a href=&quot;#workpaper&quot;&gt;計算底稿&lt;/a&gt;&lt;a href=&quot;#more&quot;&gt;附錄&lt;/a&gt;&lt;/div&gt;&lt;/nav&gt;
&lt;main class=&quot;wrap&quot;&gt;&lt;div data-layer=&quot;正文&quot;&gt;&lt;section class=&quot;q&quot; id=&quot;business&quot;&gt;&lt;div class=&quot;qno&quot;&gt;問題 01&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;生意怎麼賺錢？&lt;/div&gt;&lt;h2&gt;靠遊戲、音樂、電影內容與感測器賺錢，消費電子是配角。&lt;/h2&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;Sony 的獲利來自內容與平台，硬體只是入口：上半年營業利益最大的是 &lt;a class=&quot;term&quot; href=&quot;#g0&quot;&gt;G&amp;amp;NS&lt;/a&gt; 4,221 億日圓，其次是 &lt;a class=&quot;term&quot; href=&quot;#g2&quot;&gt;I&amp;amp;SS&lt;/a&gt; 2,768 億、音樂 2,286 億（6-K 2026-11-10 本文 §23–28）。&lt;/strong&gt;分拆金融後，五個事業都賺錢，沒有單一事業超過四成營收。&lt;/p&gt;&lt;p&gt;反方：近四季營業利益率約 13.7%&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;是近年最高，其中含未揭露金額的美國關稅退款與日圓走弱，不能當成常態（主張 SONY-C08）。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;產品線營收占比（近四季，億美元；逐年金額與成長見下方明細表；圖的占比分母為圖中各線合計）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 480 280&quot; role=&quot;img&quot; aria-label=&quot;產品線營收&quot; class=&quot;chart&quot; style=&quot;max-width:624px&quot;&gt;&lt;path d=&quot;M240.0,52.0 A88,88 0 0 1 305.4,198.9 L280.1,176.1 A54,54 0 0 0 240.0,86.0 Z&quot; fill=&quot;var(--c1)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;遊戲與網路服務：304（37%）&lt;/title&gt;&lt;/path&gt;&lt;path d=&quot;M305.4,198.9 A88,88 0 0 1 217.1,225.0 L225.9,192.1 A54,54 0 0 0 280.1,176.1 Z&quot; fill=&quot;var(--c2)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;娛樂技術與服務：145（18%）&lt;/title&gt;&lt;/path&gt;&lt;path d=&quot;M217.1,225.0 A88,88 0 0 1 154.8,162.1 L187.7,153.6 A54,54 0 0 0 225.9,192.1 Z&quot; fill=&quot;var(--c6)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;音樂：139（17%）&lt;/title&gt;&lt;/path&gt;&lt;path d=&quot;M154.8,162.1 A88,88 0 0 1 177.7,77.9 L201.8,101.9 A54,54 0 0 0 187.7,153.6 Z&quot; fill=&quot;var(--c7)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;影像與感測：137（17%）&lt;/title&gt;&lt;/path&gt;&lt;path d=&quot;M177.7,77.9 A88,88 0 0 1 236.7,52.1 L238.0,86.0 A54,54 0 0 0 201.8,101.9 Z&quot; fill=&quot;var(--c3)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;電影：98.8（12%）&lt;/title&gt;&lt;/path&gt;&lt;path d=&quot;M236.7,52.1 A88,88 0 0 1 240.0,52.0 L240.0,86.0 A54,54 0 0 0 238.0,86.0 Z&quot; fill=&quot;var(--muted)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;其他：5.0（1%）&lt;/title&gt;&lt;/path&gt;&lt;polyline points=&quot;324.0,102.6 331.3,95.2 346.0,95.2&quot; fill=&quot;none&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;1&quot;/&gt;&lt;text x=&quot;354.0&quot; y=&quot;92.2&quot; class=&quot;lab&quot; text-anchor=&quot;start&quot;&gt;遊戲與網路服務&lt;/text&gt;&lt;text x=&quot;354.0&quot; y=&quot;110.2&quot; class=&quot;val&quot; text-anchor=&quot;start&quot;&gt;37%&lt;tspan class=&quot;ax&quot; font-weight=&quot;400&quot;&gt;　304&lt;/tspan&gt;&lt;/text&gt;&lt;polyline points=&quot;266.1,228.2 268.3,245.5 346.0,245.5&quot; fill=&quot;none&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;1&quot;/&gt;&lt;text x=&quot;354.0&quot; y=&quot;242.5&quot; class=&quot;lab&quot; text-anchor=&quot;start&quot;&gt;娛樂技術與服務&lt;/text&gt;&lt;text x=&quot;354.0&quot; y=&quot;260.5&quot; class=&quot;val&quot; text-anchor=&quot;start&quot;&gt;18%&lt;tspan class=&quot;ax&quot; font-weight=&quot;400&quot;&gt;　145&lt;/tspan&gt;&lt;/text&gt;&lt;polyline points=&quot;174.6,204.7 169.0,217.4 134.0,217.4&quot; fill=&quot;none&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;1&quot;/&gt;&lt;text x=&quot;126.0&quot; y=&quot;214.4&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;音樂&lt;/text&gt;&lt;text x=&quot;126.0&quot; y=&quot;232.4&quot; class=&quot;val&quot; text-anchor=&quot;end&quot;&gt;17%&lt;tspan class=&quot;ax&quot; font-weight=&quot;400&quot;&gt;　139&lt;/tspan&gt;&lt;/text&gt;&lt;polyline points=&quot;151.2,115.9 143.5,111.2 134.0,111.2&quot; fill=&quot;none&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;1&quot;/&gt;&lt;text x=&quot;126.0&quot; y=&quot;108.2&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;影像與感測&lt;/text&gt;&lt;text x=&quot;126.0&quot; y=&quot;126.2&quot; class=&quot;val&quot; text-anchor=&quot;end&quot;&gt;17%&lt;tspan class=&quot;ax&quot; font-weight=&quot;400&quot;&gt;　137&lt;/tspan&gt;&lt;/text&gt;&lt;polyline points=&quot;203.1,55.7 199.9,68.0 134.0,68.0&quot; fill=&quot;none&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;1&quot;/&gt;&lt;text x=&quot;126.0&quot; y=&quot;65.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;電影&lt;/text&gt;&lt;text x=&quot;126.0&quot; y=&quot;83.0&quot; class=&quot;val&quot; text-anchor=&quot;end&quot;&gt;12%&lt;tspan class=&quot;ax&quot; font-weight=&quot;400&quot;&gt;　98.8&lt;/tspan&gt;&lt;/text&gt;&lt;polyline points=&quot;238.3,48.0 238.1,30.0 134.0,30.0&quot; fill=&quot;none&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;1&quot;/&gt;&lt;text x=&quot;126.0&quot; y=&quot;27.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;其他&lt;/text&gt;&lt;text x=&quot;126.0&quot; y=&quot;45.0&quot; class=&quot;val&quot; text-anchor=&quot;end&quot;&gt;1%&lt;tspan class=&quot;ax&quot; font-weight=&quot;400&quot;&gt;　5.0&lt;/tspan&gt;&lt;/text&gt;&lt;text x=&quot;240.0&quot; y=&quot;136.0&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;近四季&lt;/text&gt;&lt;text x=&quot;240.0&quot; y=&quot;158.0&quot; class=&quot;val&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:18px&quot;&gt;828&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;白話說&lt;/b&gt;每 100 日圓營收，約 37 日圓來自遊戲與網路服務、17 日圓音樂、17 日圓感測器（FY2025，推導）。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;要留意&lt;/b&gt;近四季利潤率含一次性關稅退款，方向見改判訊號。&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;產品線營收明細（億美元；占比為最近財年，分母為各線合計）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;產品線&lt;/th&gt;&lt;th&gt;FY23&lt;/th&gt;&lt;th&gt;FY24&lt;/th&gt;&lt;th&gt;FY25&lt;/th&gt;&lt;th&gt;近四季&lt;/th&gt;&lt;th&gt;最近財年年增&lt;/th&gt;&lt;th&gt;占比&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;遊戲與網路服務&lt;/td&gt;&lt;td&gt;289&lt;/td&gt;&lt;td&gt;298&lt;/td&gt;&lt;td&gt;304&lt;/td&gt;&lt;td&gt;304&lt;/td&gt;&lt;td&gt;1.8%&lt;/td&gt;&lt;td&gt;37%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;音樂&lt;/td&gt;&lt;td&gt;111&lt;/td&gt;&lt;td&gt;120&lt;/td&gt;&lt;td&gt;139&lt;/td&gt;&lt;td&gt;139&lt;/td&gt;&lt;td&gt;16.2%&lt;/td&gt;&lt;td&gt;17%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;電影&lt;/td&gt;&lt;td&gt;103&lt;/td&gt;&lt;td&gt;98&lt;/td&gt;&lt;td&gt;99&lt;/td&gt;&lt;td&gt;99&lt;/td&gt;&lt;td&gt;0.3%&lt;/td&gt;&lt;td&gt;12%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;娛樂技術與服務&lt;/td&gt;&lt;td&gt;167&lt;/td&gt;&lt;td&gt;155&lt;/td&gt;&lt;td&gt;145&lt;/td&gt;&lt;td&gt;145&lt;/td&gt;&lt;td&gt;-6.4%&lt;/td&gt;&lt;td&gt;18%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;影像與感測&lt;/td&gt;&lt;td&gt;104&lt;/td&gt;&lt;td&gt;112&lt;/td&gt;&lt;td&gt;137&lt;/td&gt;&lt;td&gt;137&lt;/td&gt;&lt;td&gt;21.6%&lt;/td&gt;&lt;td&gt;17%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;其他&lt;/td&gt;&lt;td&gt;5&lt;/td&gt;&lt;td&gt;5&lt;/td&gt;&lt;td&gt;5&lt;/td&gt;&lt;td&gt;5&lt;/td&gt;&lt;td&gt;-8.5%&lt;/td&gt;&lt;td&gt;1%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;business-profile&quot;&gt;&lt;h3&gt;生意介紹：年報重點&lt;/h3&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;Sony 是五個事業組成的娛樂與感測器公司：遊戲、音樂、電影三個內容事業，加上消費電子與影像感測器兩個硬體事業。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;賣什麼&lt;/p&gt;&lt;h4&gt;內容與平台占一半以上，硬體與感測器占三成多&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;遊戲與網路服務（G&amp;amp;NS）賣 PlayStation 主機、遊戲軟體與 PS Plus 等網路服務；音樂賣唱片與串流授權、音樂版權；電影（Pictures）製作與發行電影、電視節目與媒體頻道&lt;span class=&quot;src&quot;&gt;（20-F 2026-03-31 Item 4 ¶96–99）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;娛樂技術與服務（&lt;a class=&quot;term&quot; href=&quot;#g1&quot;&gt;ET&amp;amp;S&lt;/a&gt;）賣相機、電視、音響與手機；影像與感測解決方案（I&amp;amp;SS）賣 CMOS 影像感測器，主要用在智慧型手機，也用在相機、監控、工廠自動化與汽車&lt;span class=&quot;src&quot;&gt;（20-F 2026-03-31 Item 4 ¶71）&lt;/span&gt;。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;誰付錢、怎麼賣&lt;/p&gt;&lt;h4&gt;消費者付最多，感測器靠少數手機大廠&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;遊戲、音樂、電影與消費電子的最終付費者是一般消費者，透過 PlayStation Store（Sony 的遊戲數位商店）、串流平台、戲院與零售通路付錢；音樂串流收入集中在少數數位平台，公司把「數位音樂經銷商集中」列為風險&lt;span class=&quot;src&quot;&gt;（20-F 2026-03-31 Item 3 ¶65）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;影像感測器賣給手機廠，公司說行動感測器出貨受「主要客戶」新機帶動，但未揭露客戶名稱與占比（6-K 2026-02-05#3 本文 §23；未揭露）。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;營收結構：誰在拉動&lt;/p&gt;&lt;h4&gt;遊戲占三成多，音樂成長最快&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;FY2025 對外營收中，G&amp;amp;NS 約 36.7%、ET&amp;amp;S 約 17.5%、音樂約 16.8%、I&amp;amp;SS 約 16.5%、電影約 11.9%&lt;span class=&quot;src&quot;&gt;（推導，XBRL 分部對外營收，美元換算）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;FY2025 對上一年，音樂與 I&amp;amp;SS 是拉動來源，遊戲硬體與 ET&amp;amp;S 下滑：遊戲硬體約 92 億美元，比前一年少約 11%&lt;span class=&quot;src&quot;&gt;（推導，同上口徑）&lt;/span&gt;。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;市場、地區與重點專案&lt;/p&gt;&lt;h4&gt;美國占三分之一，重點專案是與台積電合資的感測器廠&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;FY2025 營收美國 32.6%、歐洲 22.7%、亞太 13.6%、中國 11.4%、日本 10.7%&lt;span class=&quot;src&quot;&gt;（推導，20-F 2026-03-31 Item 4 ¶108）&lt;/span&gt;；美國比前一年少 1.5%，中國與歐洲分別增約 14.8%、7.4%&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;，近一年成長主要由中國與歐洲拉動。&lt;/p&gt;&lt;p&gt;重點專案：Sony 與台積電簽定&lt;a class=&quot;term&quot; href=&quot;#g7&quot;&gt;合資&lt;/a&gt;協議，Sony 約出資 4,650 億日圓（含熊本縣合志市新廠資產），台積電約 2,820 億日圓，依需求分階段投入，尚待主管機關核准（6-K 2026-08-11 本文 §8–11）；FY2025 I&amp;amp;SS 資本投資約 2,653 億日圓&lt;span class=&quot;src&quot;&gt;（20-F 2026-03-31 Item 4 ¶44）&lt;/span&gt;。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;跟誰競爭&lt;/p&gt;&lt;h4&gt;內容靠人才與作品，硬體靠價格與技術&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;公司說遊戲、音樂、電影要搶創作者與內容，硬體與感測器則在價格與功能上競爭，連影像感測器也可能被對手技術追上&lt;span class=&quot;src&quot;&gt;（20-F 2026-03-31 Item 3 ¶10–11）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;外部證據：EA 約 39% 淨營收經由 Sony 平台銷售、Sony Music 屬合計約 70% 的三大唱片，onsemi 點名 Sony 為感測器競爭者（全文搜尋 Q1 EA #1、Q4 WMG #0、Q3 onsemi #0）。&lt;/strong&gt;我們的判讀：內容平台有護城河，感測器較弱。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;管理層怎麼說&lt;/p&gt;&lt;h4&gt;公司說法：全年獲利指引5 月首次指引後兩度上修&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;公司說法：FY2026 營收指引 13.0 兆日圓、營業利益 1.87 兆，比 5 月的 12.3 兆、1.60 兆兩度上修（6-K 2026-11-05#3 本文 §10；6-K 2026-05-08#4 新聞稿 §18）；同時把記憶體價格持續上漲列為本年度主要挑戰（6-K 2026-07-31#1 本文 §21）。&lt;/p&gt;&lt;p&gt;和實績對照：上半年營收年增 9.4%（6-K 2026-11-05#3 新聞稿 §3），但 FY2025 最後一版營業利益指引 1.54 兆，實際 1.45 兆，未達約 6%&lt;span class=&quot;src&quot;&gt;（6-K 2026-02-05#4 本文 §14；20-F 2026-03-31）&lt;/span&gt;。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;年報列的主要風險&lt;/p&gt;&lt;h4&gt;最相關的四項年報風險&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;①競爭：多事業面對大型與專業對手，價格戰壓低利潤&lt;span class=&quot;src&quot;&gt;（Item 3 ¶9–11）&lt;/span&gt;。&lt;/strong&gt;②重資本：感測器產能投資可能無法如期回收，FY2024、FY2025 各投入約 2,274 億、2,467 億日圓&lt;span class=&quot;src&quot;&gt;（Item 3 ¶27）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;③內容通路集中：數位音樂平台集中、平台自製內容，可能壓低音樂與電影收入&lt;span class=&quot;src&quot;&gt;（Item 3 ¶65）&lt;/span&gt;。&lt;/strong&gt;④合資：Sony Honda Mobility 停止電動車開發，FY2025 增認約 449 億日圓&lt;a class=&quot;term&quot; href=&quot;#g6&quot;&gt;權益法&lt;/a&gt;損失&lt;span class=&quot;src&quot;&gt;（Item 3 ¶26；以上皆 20-F 2026-03-31）&lt;/span&gt;。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;規模與營運&lt;/p&gt;&lt;h4&gt;主要產能在日本九州&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;感測器主要產地在熊本、長崎、大分、鹿兒島；7 月地震使熊本廠停產，8 月中恢復，其他廠區無重大損壞（6-K 2026-07-31#1 本文 §3；新聞 N4）。&lt;/strong&gt;員工與據點數本報告未引用&lt;span class=&quot;src&quot;&gt;（查過 20-F 2026-03-31 Item 4 ¶199–201，不影響結論）&lt;/span&gt;。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;moat&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;護城河與成長故事&lt;/p&gt;&lt;h3&gt;遊戲平台與音樂版權有外部證據，感測器較弱，整體護城河中、分級窄。&lt;/h3&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;PlayStation 平台與音樂版權是 Sony 最有第三方證據的護城河：發行商依賴 Sony 平台，三大唱片的地位也寫在同業年報（主張 SONY-C01）。&lt;/strong&gt;影像感測器市占公司未揭露，又有對手點名競爭，所以整體只評中、分級窄、超額報酬期間設 5 年。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;生命週期：Sony 處在成熟穩定成長期，FY2022～FY2025 日圓營收年複合約 7.3%（FY2022 用不含金融分部的產品與服務銷售額，含日圓走弱換算），增量營業利益率約 27.1% 高於平均&lt;span class=&quot;src&quot;&gt;（FY2022 扣除金融分部營業利益，推導）&lt;/span&gt;，營運槓桿在發揮。&lt;/strong&gt;市場空間與滲透率公司未揭露，成長跑道六項明細放在計算底稿 5。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;外部證據：別家公司年報怎麼寫 Sony&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;外部證據只涵蓋遊戲與音樂兩個分部；電影、消費電子沒有找到第三方文件支持，所以不把護城河評到寬。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;公司與文件&lt;/th&gt;&lt;th&gt;原文重點&lt;/th&gt;&lt;th&gt;對 Sony 的意義&lt;/th&gt;&lt;th&gt;出處&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;EA（Electronic Arts，美國遊戲發行商）10-K&lt;/td&gt;&lt;td&gt;對 Sony 直接銷售約占 FY2025 淨營收 39%&lt;/td&gt;&lt;td&gt;大型發行商依賴 PlayStation 平台&lt;/td&gt;&lt;td&gt;全文搜尋 Q1 EA #1、#3&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Take-Two（美國遊戲發行商）10-K&lt;/td&gt;&lt;td&gt;與 Sony 有 PlayStation 開發與發行協議&lt;/td&gt;&lt;td&gt;第三方大作需上 Sony 平台&lt;/td&gt;&lt;td&gt;全文搜尋 Q1 Take-Two #0–#3&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;WMG（華納音樂集團）10-K&lt;/td&gt;&lt;td&gt;三大唱片合計約占全球錄製音樂 70%&lt;/td&gt;&lt;td&gt;Sony Music 屬寡占的一員&lt;/td&gt;&lt;td&gt;全文搜尋 Q4 WMG #0&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Spotify（音樂串流平台）20-F&lt;/td&gt;&lt;td&gt;多數錄音由三大唱片與 Merlin（獨立唱片公司的數位授權聯盟）授權&lt;/td&gt;&lt;td&gt;串流平台需要 Sony 的版權&lt;/td&gt;&lt;td&gt;全文搜尋 Q4 Spotify #0–#1&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;onsemi（美國功率與感測器半導體公司）10-K&lt;/td&gt;&lt;td&gt;點名 Sony 為影像感測器競爭者&lt;/td&gt;&lt;td&gt;感測器有對手，護城河較弱&lt;/td&gt;&lt;td&gt;全文搜尋 Q3 onsemi #0&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;supply&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;供應鏈與地區&lt;/p&gt;&lt;h3&gt;主機晶片靠 AMD（美國處理器公司），感測器產能和台積電綁在一起，營收近九成在日本以外。&lt;/h3&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;PS5 的系統晶片由 AMD 提供（全文搜尋 Q1 AMD #0、#2），記憶體價格上漲已被公司列為本年度主要挑戰（6-K 2026-07-31#1 本文 §21）；感測器下一代產能與台積電合資（6-K 2026-08-11 本文 §8）。&lt;/strong&gt;供應商占採購比例公司未揭露，所以不畫依賴度圖。&lt;/p&gt;&lt;p&gt;FY2025 日本以外營收約 89%&lt;span class=&quot;src&quot;&gt;（推導，20-F 2026-03-31 Item 4 ¶108）&lt;/span&gt;，美國最大；日圓走弱會把海外收入換算得更高，上半年 G&amp;amp;NS、I&amp;amp;SS 營業利益各有約 277 億、491 億日圓來自匯率（6-K 2026-11-10 本文 §23、§28）。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;grid2 wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;Asia Pacific：占全部營收 vs 占全部長期資產&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 280&quot; role=&quot;img&quot; aria-label=&quot;地區占比&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;246.0&quot; y2=&quot;246.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;250.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;0%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;190.0&quot; y2=&quot;190.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;194.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;5%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;134.0&quot; y2=&quot;134.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;138.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;10%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;78.0&quot; y2=&quot;78.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;82.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;15%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;22.0&quot; y2=&quot;22.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;26.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;20%&lt;/text&gt;&lt;text x=&quot;72.0&quot; y=&quot;268&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY22&lt;/text&gt;&lt;text x=&quot;218.0&quot; y=&quot;268&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY23&lt;/text&gt;&lt;text x=&quot;364.0&quot; y=&quot;268&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY24&lt;/text&gt;&lt;text x=&quot;510.0&quot; y=&quot;268&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY25&lt;/text&gt;&lt;polyline points=&quot;72.0,86.4 218.0,80.9 364.0,93.3 510.0,93.9&quot; fill=&quot;none&quot; stroke=&quot;var(--c2)&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;circle cx=&quot;72.0&quot; cy=&quot;86.4&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c2)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;占營收 FY22：14%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;218.0&quot; cy=&quot;80.9&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c2)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;占營收 FY23：15%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;364.0&quot; cy=&quot;93.3&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c2)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;占營收 FY24：14%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;510.0&quot; cy=&quot;93.9&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c2)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;占營收 FY25：14%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;518.0&quot; y=&quot;97.9&quot; class=&quot;val&quot; fill=&quot;var(--c2)&quot;&gt;14%&lt;/text&gt;&lt;polyline points=&quot;72.0,90.8 218.0,82.4 364.0,205.5 510.0,206.3&quot; fill=&quot;none&quot; stroke=&quot;var(--neg)&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;circle cx=&quot;72.0&quot; cy=&quot;90.8&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--neg)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;占長期資產 FY22：14%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;218.0&quot; cy=&quot;82.4&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--neg)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;占長期資產 FY23：15%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;364.0&quot; cy=&quot;205.5&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--neg)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;占長期資產 FY24：4%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;510.0&quot; cy=&quot;206.3&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--neg)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;占長期資產 FY25：4%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;518.0&quot; y=&quot;210.3&quot; class=&quot;val&quot; fill=&quot;var(--neg)&quot;&gt;4%&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c2)&quot;&gt;&lt;/i&gt;占營收&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--neg)&quot;&gt;&lt;/i&gt;占長期資產&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;growth&quot;&gt;&lt;div class=&quot;qno&quot;&gt;問題 02&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;成長從哪裡來？&lt;/div&gt;&lt;h2&gt;上半年成長大半來自日圓走弱；扣掉匯率只有音樂與電影實質成長，網路服務增加但遊戲、ET&amp;amp;S、I&amp;amp;SS 實質下滑。&lt;/h2&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;上半年營收年增 9.4%，主要靠網路服務、遊戲軟體、音樂串流與電影，主機台數與行動感測器反而下滑（主張 SONY-C05；6-K 2026-11-10 本文 §22–28）。&lt;/strong&gt;全年指引在 5 月首次發布後已兩度上修到營收 13.0 兆、營業利益 1.87 兆日圓（6-K 2026-11-05#3 本文 §10）。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;拆開看，匯率是最大單項：四個分部的營收增幅中，匯率貢獻約 3,775 億日圓&lt;span class=&quot;src&quot;&gt;（推導，電影以美元揭露未拆）&lt;/span&gt;。&lt;/strong&gt;扣掉匯率，音樂、電影實質成長，遊戲、ET&amp;amp;S 與 I&amp;amp;SS 實質下滑&lt;span class=&quot;src&quot;&gt;（I&amp;amp;SS 營收 +676 億、匯率 +815 億，扣匯率約 −139 億日圓，6-K 2026-11-10 本文 §28，推導）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;我們的基準情境五年營收年增平均 4.0%，低於 FY2022～FY2025 日圓年複合約 7.3%&lt;span class=&quot;src&quot;&gt;（FY2022 用不含金融分部的產品與服務銷售額，推導）&lt;/span&gt;：這段成長含日圓走弱的換算效果，上半年的 9.4% 也有匯率與電影大片加持，不外推（作者判斷）。&lt;/p&gt;&lt;p&gt;反方：記憶體價格與主機供貨受限可能延到 PS6 世代，FY2025 最後一版營業利益指引也曾未達約 6%（主張 SONY-C06、SONY-C09）。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;毛利率與營業利益率&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 280&quot; role=&quot;img&quot; aria-label=&quot;利潤率&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;246.0&quot; y2=&quot;246.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;250.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;0%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;190.0&quot; y2=&quot;190.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;194.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;10%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;134.0&quot; y2=&quot;134.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;138.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;20%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;78.0&quot; y2=&quot;78.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;82.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;30%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;22.0&quot; y2=&quot;22.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;26.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;40%&lt;/text&gt;&lt;text x=&quot;72.0&quot; y=&quot;268&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY22&lt;/text&gt;&lt;text x=&quot;181.5&quot; y=&quot;268&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY23&lt;/text&gt;&lt;text x=&quot;291.0&quot; y=&quot;268&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY24&lt;/text&gt;&lt;text x=&quot;400.5&quot; y=&quot;268&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY25&lt;/text&gt;&lt;text x=&quot;510.0&quot; y=&quot;268&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;近四季&lt;/text&gt;&lt;polyline points=&quot;72.0,52.1 181.5,88.3 291.0,81.7 400.5,73.5 510.0,73.5&quot; fill=&quot;none&quot; stroke=&quot;var(--c2)&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;circle cx=&quot;72.0&quot; cy=&quot;52.1&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c2)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;毛利率 FY22：35%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;181.5&quot; cy=&quot;88.3&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c2)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;毛利率 FY23：28%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;291.0&quot; cy=&quot;81.7&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c2)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;毛利率 FY24：29%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;400.5&quot; cy=&quot;73.5&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c2)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;毛利率 FY25：31%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;510.0&quot; cy=&quot;73.5&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c2)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;毛利率 近四季：31%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;518.0&quot; y=&quot;77.5&quot; class=&quot;val&quot; fill=&quot;var(--c2)&quot;&gt;31%&lt;/text&gt;&lt;polyline points=&quot;72.0,179.5 181.5,194.5 291.0,186.6 400.5,181.0 510.0,181.0&quot; fill=&quot;none&quot; stroke=&quot;var(--c1)&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;circle cx=&quot;72.0&quot; cy=&quot;179.5&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c1)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;營業利益率 FY22：12%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;181.5&quot; cy=&quot;194.5&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c1)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;營業利益率 FY23：9%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;291.0&quot; cy=&quot;186.6&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c1)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;營業利益率 FY24：11%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;400.5&quot; cy=&quot;181.0&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c1)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;營業利益率 FY25：12%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;510.0&quot; cy=&quot;181.0&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c1)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;營業利益率 近四季：12%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;518.0&quot; y=&quot;185.0&quot; class=&quot;val&quot; fill=&quot;var(--c1)&quot;&gt;12%&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c2)&quot;&gt;&lt;/i&gt;毛利率&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c1)&quot;&gt;&lt;/i&gt;營業利益率&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;成長來源拆解（FY2026 上半年，日圓）&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;量：主機台數下滑，單季 PS5 出貨 260 萬台、去年同期 400 萬台（新聞 N1）；行動感測器與 ET&amp;amp;S 銷售量也下滑（6-K 2026-11-10 本文 §27–28）。&lt;/strong&gt;價：公司未揭露售價變動，只說 I&amp;amp;SS 產品組合改善。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;新產品：電影《Spider-Man: Brand New Day》帶動電影營收增 1,556 億日圓（6-K 2026-11-10 本文 §26）；遊戲新作與網路服務帶動 G&amp;amp;NS。&lt;/strong&gt;新市場：未揭露。併購：FY2025（至 2026-03-31）併購支出約 12 億美元，營收貢獻未揭露（財務歷史 FY2025，外國發行人無季度資料）。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;投入與回報&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;投入有回報：FY2022 到近四季營收增加約 2.92 兆日圓、營業利益增加約 7,931 億，增量營業利益率約 27.1%&lt;span class=&quot;src&quot;&gt;（FY2022 扣除金融分部收入與營業利益 318,118 百萬日圓，推導）&lt;/span&gt;，高於同期平均利潤率。&lt;/p&gt;&lt;p&gt;限制：工具的增量 &lt;a class=&quot;term&quot; href=&quot;#g4&quot;&gt;ROIC&lt;/a&gt; 因投入資本口徑變動（分拆金融）不適用，研發資本化對照也無法計算；感測器 FY2025 擴產投資約 2,467 億日圓的回收要看合資進度&lt;span class=&quot;src&quot;&gt;（20-F 2026-03-31 Item 3 ¶27）&lt;/span&gt;。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;白話說&lt;/b&gt;上半年營收每多 100 日圓，至少約 70 日圓來自日圓走弱的換算效果（四個分部合計，電影未拆，推導）。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;要留意&lt;/b&gt;上半年成長含匯率與電影大片，方向見改判訊號。&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;cash&quot;&gt;&lt;div class=&quot;qno&quot;&gt;問題 03・04&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;賺到的錢是真的現金嗎？股東拿到多少？&lt;/div&gt;&lt;h2&gt;營運現金流充足，但自由現金流在 IFRS（國際財務報導準則）下要再扣租賃與付息。&lt;/h2&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;FY2025 營運現金流約 1.97 兆日圓，對有息負債約 2 倍&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;，應收與合約負債穩定，沒有收現惡化跡象（主張 SONY-C03；融資償債判讀 收入與收現）。&lt;/p&gt;&lt;p&gt;限制：&lt;a class=&quot;term&quot; href=&quot;#g3&quot;&gt;IFRS&lt;/a&gt; 把付息列在融資活動、租賃本金另計，營運現金流看起來偏高；半年度 6-K 現金流量表含停業的金融分部，近四季持續營運自由現金流與每股自由現金流扣股權薪酬都未取得，我們不寫成強。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;現價隱含年報酬（各情境成真時，非預期報酬）；紅色虛線為公債殖利率 5.15%。基準情境下，現價隱含的年報酬只比公債高 2.2 個百分點，模型的加權資本成本（基準）比公債高 2.9 個百分點，兩者的差距對應市價與合理價值的落差&lt;/p&gt;&lt;svg t;&gt;&lt;title&gt;營運現金流 近四季：129&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;493.2&quot; y=&quot;92.4&quot; width=&quot;26.5&quot; height=&quot;125.2&quot; rx=&quot;2&quot; fill=&quot;var(--c2)&quot;&gt;&lt;title&gt;自由現金流 近四季：129&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;479.0&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;近四季&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c4)&quot;&gt;&lt;/i&gt;淨利&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c1)&quot;&gt;&lt;/i&gt;營運現金流&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c2)&quot;&gt;&lt;/i&gt;自由現金流&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;錢從哪一層開始不夠：現金流分層&lt;/h3&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;現金流分層（近四季，至 2026-03-31）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;層次&lt;/th&gt;&lt;th&gt;金額&lt;/th&gt;&lt;th&gt;正負&lt;/th&gt;&lt;th&gt;完整度&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;一、營運現金流&lt;/td&gt;&lt;td&gt;129 億美元&lt;/td&gt;&lt;td&gt;正&lt;/td&gt;&lt;td&gt;完整&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;二、一般資本支出後&lt;/td&gt;&lt;td&gt;已知部分 129 億美元&lt;/td&gt;&lt;td&gt;無法判定&lt;/td&gt;&lt;td&gt;缺一般資本支出&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;三、回購與股利後&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;無法判定&lt;/td&gt;&lt;td&gt;未取得&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;延伸：再扣併購與員工代扣稅&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;無法判定&lt;/td&gt;&lt;td&gt;未取得&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;數值正負不等於安全或危險：第二層為負代表所列投入超過當期營運現金，不等於營業虧損；資本支出尚未區分維持與擴張。&lt;/p&gt;&lt;p class=&quot;cap&quot;&gt;（算法與完整表見&lt;a href=&quot;#wp-3-4&quot;&gt;計算底稿 3・4&lt;/a&gt;）&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;白話說&lt;/b&gt;每 100 日圓營運現金流，要先扣租賃本金與付息，才是能分給股東的錢。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;要留意&lt;/b&gt;IFRS 營運現金流不能直接和美股公司比，方向見改判訊號。&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;shareholders&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;股東拿到多少？&lt;/p&gt;&lt;h3&gt;以回購為主，FY2025（至 2026-03-31）股東收益率約 2.7%。&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;Sony 把現金主要用在回購：FY2025（至 2026-03-31）股利殖利率 0.6%、回購殖利率 2.2%（收盤 2026-11-13），合計股東收益率 2.7%（主張 SONY-C11）。&lt;/strong&gt;已發行股數從 2026-03-31 的 61.5 億股降到 9 月底的 59.7 億股（6-K 2026-11-05#3 本文 §11）。&lt;/p&gt;&lt;p&gt;限制：股權薪酬抵銷後的淨回購殖利率未取得，股利占自由現金流也算不出來；股利連續成長 0 年，Sony 不是靠股利的公司。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;股東回饋對自由現金流（億美元）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 300&quot; role=&quot;img&quot; aria-label=&quot;股東回饋&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;266.0&quot; y2=&quot;266.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;270.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;0.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;205.5&quot; y2=&quot;205.5&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;209.5&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;50.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;145.0&quot; y2=&quot;145.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;149.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;100&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;84.5&quot; y2=&quot;84.5&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;88.5&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;150&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;24.0&quot; y2=&quot;24.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;28.0&quot; class=&quot;ax&quot; text-anchor=&quot;end 6.5&quot; height=&quot;156.4&quot; rx=&quot;2&quot; fill=&quot;var(--c2)&quot;&gt;&lt;title&gt;自由現金流 FY25：129&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;357.0&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY25&lt;/text&gt;&lt;rect x=&quot;436.3&quot; y=&quot;224.0&quot; width=&quot;26.5&quot; height=&quot;42.0&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;回購 近四季：34.7&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;464.8&quot; y=&quot;255.1&quot; width=&quot;26.5&quot; height=&quot;10.9&quot; rx=&quot;2&quot; fill=&quot;var(--c3)&quot;&gt;&lt;title&gt;股利 近四季：9.0&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;493.2&quot; y=&quot;109.6&quot; width=&quot;26.5&quot; height=&quot;156.4&quot; rx=&quot;2&quot; fill=&quot;var(--c2)&quot;&gt;&lt;title&gt;自由現金流 近四季：129&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;479.0&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;近四季&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c1)&quot;&gt;&lt;/i&gt;回購&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c3)&quot;&gt;&lt;/i&gt;股利&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c2)&quot;&gt;&lt;/i&gt;自由現金流&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;白話說&lt;/b&gt;每 100 美元市值，FY2025（至 2026-03-31）拿回約 0.6 美元股利，公司再買回約 2.2 美元股票。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;要留意&lt;/b&gt;回購價位是否划算無法判斷，方向見改判訊號。&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;股東回報與市價隱含報酬拆解&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;現價隱含年報酬（基準情境，非預期報酬）約 7.3%&lt;span class=&quot;src&quot;&gt;（基準情境成真時、以收盤 2026-11-13 股價買進的推算年報酬；條件式，非預期報酬、非買賣建議）&lt;/span&gt;＝股利 0.6%＋回購 2.2%＋每股成長與其他 4.6%&lt;span class=&quot;src&quot;&gt;（推算，假設估值倍數不變）&lt;/span&gt;，比 10 年期公債 5.15% 高約 2 個百分點。&lt;/strong&gt;股東收益率只有公債約一半，回報品質 gt;&lt;span&gt;&lt;i style=&quot;background:var(--pos)&quot;&gt;&lt;/i&gt;合理價值區間&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c7)&quot;&gt;&lt;/i&gt;同業與歷史倍數（交叉核對，不進評等）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;流動性、空單與參考值的資料日期與存檔（算法與完整表見&lt;a href=&quot;#wp-mkt&quot;&gt;計算底稿 市場背景&lt;/a&gt;）。&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;valuation&quot;&gt;&lt;div class=&quot;qno&quot;&gt;問題 05&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;現在的價格合理嗎？&lt;/div&gt;&lt;h2&gt;落在合理價值區間上半部，價格位置合理。&lt;/h2&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;合理價值 20.50–28.53 美元（中點 24.08 美元），2026-11-13 收盤 27.07 美元，是中點的 1.12 倍（收盤 2026-11-13 股價 27.07 美元 ÷ 合理價值中點 24.08 美元；只描述距離，非買賣建議），價格位置 合理；買入區上緣 14.45 美元。&lt;/strong&gt;研究評等 生意 B／價格合理，非買賣建議。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;基準情境的故事是：遊戲軟體、網路服務與音樂串流讓營收每年成長約 4%，關稅退款不重演、主機進入世代交替，營業利益率穩在約 14%。&lt;/strong&gt;保守情境是記憶體漲價與硬體週期拖累兩年；樂觀情境是網路服務與感測器同時擴張。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;限制：情境差距約 105%，不確定性高；若改用 FY2025 年度基期，合理價值中點約 +0.8%&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;，但 ROIC 從約 16.5% 變約 13.4%（計算核對第 1 項）。&lt;/strong&gt;目標區間表的「近四季營業利益率 11.6%」是工具以 FY2025（至 2026-03-31）代替近四季（外國發行人無季度 XBRL）；到 2026-09-30 的近四季約 13.7%&lt;span class=&quot;src&quot;&gt;（1,777,406÷13,017,315，含未揭露金額的關稅退款，推導）&lt;/span&gt;，落在基準帶 13.15%–14.15%。成長端圖的「過去實績（2021–2025 年複合）」是美元、含 FY2022 金融分部收入的工具口徑，日圓不含金融約 7.3%&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;公債殖利率每變動 1 個百分點，合理價值中點的變化（美元；紅色虛線為現價 27.07）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 500 142&quot; role=&quot;img&quot; aria-label=&quot;利率敏感度&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;168.0&quot; x2=&quot;168.0&quot; y1=&quot;6&quot; y2=&quot;136&quot; class=&quot;zero&quot;/&gt;&lt;line x1=&quot;394.2&quot; x2=&quot;394.2&quot; y1=&quot;4&quot; y2=&quot; =&quot;226&quot; class=&quot;zonelab&quot; text-anchor=&quot;middle&quot;&gt;合理價值 20–29&lt;/text&gt;&lt;line x1=&quot;221.3&quot; x2=&quot;221.3&quot; y1=&quot;26&quot; y2=&quot;230&quot; class=&quot;buyline&quot;/&gt;&lt;text x=&quot;221.3&quot; y=&quot;18&quot; class=&quot;buylab&quot; text-anchor=&quot;middle&quot;&gt;買入區上緣 14&lt;/text&gt;&lt;text x=&quot;160&quot; y=&quot;61&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;DCF 保守&lt;/text&gt;&lt;rect x=&quot;190.0&quot; y=&quot;47&quot; width=&quot;38.2&quot; height=&quot;18&quot; rx=&quot;9&quot; fill=&quot;var(--c1)&quot; opacity=&quot;.85&quot;&gt;&lt;title&gt;DCF 保守：12–15（中位 13）&lt;/title&gt;&lt;/rect&gt;&lt;line x1=&quot;207.5&quot; x2=&quot;207.5&quot; y1=&quot;45&quot; y2=&quot;67&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;3&quot;/&gt;&lt;text x=&quot;234.2&quot; y=&quot;60&quot; class=&quot;ax&quot;&gt;12–15&lt;/text&gt;&lt;text x=&quot;160&quot; y=&quot;95&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;DCF 基準&lt;/text&gt;&lt;rect x=&quot;280.0&quot; y=&quot;81&quot; width=&quot;83.9&quot; height=&quot;18&quot; rx=&quot;9&quot; fill=&quot;var(--c1)&quot; opacity=&quot;.85&quot;&gt;&lt;title&gt;DCF 基準：20–27（中位 23）&lt;/title&gt;&lt;/rect&gt;&lt;line x1=&quot;317.7&quot; x2=&quot;317.7&quot; y1=&quot;79&quot; y2=&quot;101&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;3&quot;/&gt;&lt;text x=&quot;369.9&quot; y=&quot;94&quot; class=&quot;ax&quot;&gt;20–27&lt;/text&gt;&lt;text x=&quot;160&quot; y=&quot;129&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;DCF 樂觀&lt;/text&gt;&lt;rect x=&quot;410.7&quot; y=&quot;115&quot; width=&quot;159.8&quot; height=&quot;18&quot; rx=&quot;9&quot; fill=&quot;var(--c1)&quot; opacity=&quot;.85&quot;&gt;&lt;title&gt;DCF 樂觀：31–45（中位 37）&lt;/title&gt;&lt;/rect&gt;&lt;line x1=&quot;481.1&quot; x2=&quot;481.1&quot; y1=&quot;113&quot; y2=&quot;135&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;3&quot;/&gt;&lt;text x=&quot;576.5&quot; y=&quot;128&quot; class=&quot;ax&quot;&gt;31–45&lt;/text&gt;&lt;text x=&quot;160&quot; y=&quot;163&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;同業本益比&lt;/text&gt;&lt;rect x=&quot;443.3&quot; y=&quot;149&quot; width=&quot;116.2&quot; height=&quot;18&quot; rx=&quot;9&quot; fill=&quot;var(--c2)&quot; opacity=&quot;.85&quot;&gt;&lt;title&gt;同業本益比：34–44（中位 35）&lt;/title&gt;&lt;/rect&gt;&lt;line x1=&quot;453.3&quot; x2=&quot;453.3&quot; y1=&quot;147&quot; y2=&quot;169&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;3&quot;/&gt;&lt;text x=&quot;565.4&quot; y=&quot;162&quot; class=&quot;ax&quot;&gt;34–44&lt;/text&gt;&lt;text x=&quot;160&quot; y=&quot;197&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;同業企業價值／營業利益&lt;/text&gt;&lt;rect x=&quot;430.2&quot; y=&quot;183&quot; width=&quot;175.9&quot; height=&quot;18&quot; rx=&quot;9&quot; fill=&quot;var(--c2)&quot; opacity=&quot;.85&quot;&gt;&lt;title&gt;同業企業價值／營業利益：33–48（中位 34）&lt;/title&gt;&lt;/rect&gt;&lt;line x1=&quot;445.1&quot; x2=&quot;445.1&quot; y1=&quot;181&quot; y2=&quot;203&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;3&quot;/&gt;&lt;text x=&quot;612.1&quot; y=&quot;196&quot; class=&quot;ax&quot;&gt;33–48&lt;/text&gt;&lt;line x1=&quot;365.0&quot; x2=&quot;365.0&quot; y1=&quot;26&quot; y2=&quot;230&quot; class=&quot;price&quot;/&gt;&lt;text x=&quot;365.0&quot; y=&quot;18&quot; class=&quot;pricelab&quot; text-anchor=&quot;middle&quot;&gt;市價 27.07&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c1)&quot;&gt;&lt;/i&gt;現金流折現&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c2)&quot;&gt;&lt;/i&gt;同業比較&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--neg)&quot;&gt;&lt;/i&gt;目前市價&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;scenario-plain&quot;&gt;&lt;h3&gt;合理價值怎麼來：三個情境&lt;/h3&gt;&lt;p&gt;合理價值是三個情境每股價值的加權：中點 24.08 美元，換不同折現率重算後的區間 20.50–28.53 美元；買入區上緣 14.45 美元是中點再打 40% 安全邊際折扣（股價在此以下才有這個安全邊際）。情境表說明合理價值怎麼組成，不是單一目標價；非買賣建議。&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt&quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;每股價值（美元）&lt;/th&gt;&lt;th&gt;權重&lt;/th&gt;&lt;th&gt;這個情境假設什麼&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;13.23&lt;/td&gt;&lt;td&gt;25%&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;營收年增 -6.0% 逐步到 +2.0%；營業利益率 12.5%，長期 10.5%；之後每年成長 2.5%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;22.91&lt;/td&gt;&lt;td&gt;50%&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;營收年增 +3.0% 逐步到 +4.0%；營業利益率 13.8%，長期 13.5%；之後每年成長 3.0%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;37.27&lt;/td&gt;&lt;td&gt;25%&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;營收年增 +10.0% 逐步到 +7.0%；營業利益率 14.5%，長期 16.5%；之後每年成長 3.5%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;（算法與完整表見&lt;a href=&quot;#wp-5&quot;&gt;計算底稿 5&lt;/a&gt;）&lt;/p&gt;&lt;/div&gt;&lt;!--新圖表--&gt;&lt;div class=&quot;wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;三情境路徑：左為營收（億美元）、右為營業利益率；實線為實績，虛線為模型三情境第 1～10 年（估值結果 dcf 逐年列；起點為近四季，估值基期營收 823 億美元）。只描述模型假設，不是預測&lt;/p&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div&gt;&lt;svg viewBox=&quot;0 0 520 280&quot; role=&quot;img&quot; aria-label=&quot;三情境營收路徑&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;56&quot; x2=&quot;476&quot; y1=&quot;246.0&quot; y2=&quot;246.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;48&quot; y=&quot;250.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;500&lt;/text&gt;&lt;line x1=&quot;56&quot; x2=&quot;476&quot; y1=&quot;200.4&quot; y2=&quot;200.4&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;48&quot; y=&quot;204.4&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;750&lt;/text&gt;&lt;line x1=&quot;56&quot; x2=&quot;476&quot; y1=&quot;154.8&quot; y2=&quot;154.8&quot; class=&quot;grid&quot;/&gt;&lt t;title&gt;保守：13&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;248.2&quot; y=&quot;109.0&quot; class=&quot;val&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--c4)&quot;&gt;保守 13&lt;/text&gt;&lt;circle cx=&quot;320.6&quot; cy=&quot;123.0&quot; r=&quot;7&quot; fill=&quot;var(--c1)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;1.5&quot;&gt;&lt;title&gt;基準：23&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;320.6&quot; y=&quot;147.0&quot; class=&quot;val&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--c1)&quot;&gt;基準 23&lt;/text&gt;&lt;circle cx=&quot;428.3&quot; cy=&quot;123.0&quot; r=&quot;7&quot; fill=&quot;var(--c2)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;1.5&quot;&gt;&lt;title&gt;樂觀：38&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;428.3&quot; y=&quot;109.0&quot; class=&quot;val&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--c2)&quot;&gt;樂觀 38&lt;/text&gt;&lt;text x=&quot;140&quot; y=&quot;190.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;年報酬 9%&lt;/text&gt;&lt;circle cx=&quot;234.7&quot; cy=&quot;185.0&quot; r=&quot;7&quot; fill=&quot;var(--c4)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;1.5&quot;&gt;&lt;title&gt;保守：12&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;234.7&quot; y=&quot;171.0&quot; class=&quot;val&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--c4)&quot;&gt;保守 12&lt;/text&gt;&lt;circle cx=&quot;291.5&quot; cy=&quot;185.0&quot; r=&quot;7&quot; fill=&quot;var(--c1)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;1.5&quot;&gt;&lt;title&gt;基準：19&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;291.5&quot; y=&quot;209.0&quot; class=&quot;val&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--c1)&quot;&gt;基準 19&lt;/text&gt;&lt;circle cx=&quot;373.8&quot; cy=&quot;185.0&quot; r=&quot;7&quot; fill=&quot;var(--c2)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;1.5&quot;&gt;&lt;title&gt;樂觀：31&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;373.8&quot; y=&quot;171.0&quot; class=&quot;val&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--c2)&quot;&gt;樂觀 31&lt;/text&gt;&lt;text x=&quot;140&quot; y=&quot;252.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;年報酬 10%&lt;/text&gt;&lt;circle cx=&quot;224.7&quot; cy=&quot;247.0&quot; r=&quot;7&quot; fill=&quot;var(--c4)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;1.5&quot;&gt;&lt;title&gt;保守：10&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;224.7&quot; y=&quot;233.0&quot; class=&quot;val&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--c4)&quot;&gt;保守 10&lt;/text&gt;&lt;circle cx=&quot;270.6&quot; cy=&quot;247.0&quot; r=&quot;7&quot; fill=&quot;var(--c1)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;1.5&quot;&gt;&lt;title&gt;基準：16&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;270.6&quot; y=&quot;271.0&quot; class=&quot;val&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--c1)&quot;&gt;基準 16&lt;/text&gt;&lt;circle cx=&quot;336.2&quot; cy=&quot;247.0&quot; r=&quot;7&quot; fill=&quot;var(--c2)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;1.5&quot;&gt;&lt;title&gt;樂觀：25&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;336.2&quot; y=&quot;233.0&quot; class=&quot;val&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--c2)&quot;&gt;樂觀 25&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;!--/新圖表--&gt;&lt;!--目標區間:正文--&gt;&lt;div class=&quot;block&quot; id=&quot;target-plain&quot;&gt;&lt;h3&gt;12 個月條件式目標區間（條件式、非買賣建議）&lt;/h3&gt;&lt;p&gt;如果三種情境各自成真，一年後（至 2027-11-13）每股價值大約落在：保守 12.52–16.17、基準 21.09–29.08、樂觀 33.54–48.76 美元。這是條件式區間，不是股價預測，三段不合成單一數字。&lt;/p&gt;&lt;h4 style=&quot;margin-top:14px&quot;&gt;下四季申報可以對照什麼&lt;/h4&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt&quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;近四季營收年增&lt;/th&gt;&lt;th&gt;近四季營業利益率&lt;/th&gt;&lt;th&gt;公司特定事件（原文位置）&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;&amp;lt; -1.5%&lt;/td&gt;&lt;td&gt;&amp;lt; 13.15%&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;記憶體價格持續上升使 G&amp;amp;NS 或 ET&amp;amp;S 半年度營業利益率下降，或 FY2026 指引下修；公司已把記憶體價格列為 FY26 主要經營挑戰（6-K 2026-07-31#1 本文 §21）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;-1.5%–6.5%&lt;/td&gt;&lt;td&gt;13.15%–14.15%&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;FY2026（至 2027-03-31）實際營收與營業利益達到 11 月上修後的預測 13.0 兆／1.87 兆日圓（隱含下半年營收約與 FY2025 下半年持平），基準情境第 1 年成長 3.0% 較接近（6-K 2026-11-05#3 本文 §10）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;&amp;gt; 6.5%&lt;/td&gt;&lt;td&gt;&amp;gt; 14.15%&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;網路服務與第一方軟體持續推升 G&amp;amp;NS 營業利益（上半年年增 1,538 億日圓、硬體台數下滑仍增），且下半年在不含關稅退款下維持利潤率（6-K 2026-11-10 本文 §23）&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;近四季營業利益率 11.6%，較接近保守情境。門檻以相鄰情境第 1 年假設的中線為界，只描述哪個情境比較接近，不改機率與研究評等；近四季是未調整的報表數字，作者訂第 1 年假設時若扣除不外推的項目（見本題正文），扣除後可能較接近別的情境；下四季申報後對照，不自動重算目標區間。&lt;/p&gt;&lt;p class=&quot;cap&quot;&gt;算法、關鍵假設、各段需要的市場條件與失效事件（算法與完整表見&lt;a href=&quot;#wp-5&quot;&gt;計算底稿 5&lt;/a&gt;）。&lt;/p&gt;&lt;/div&gt;&lt;!--/目標區間:正文--&gt;&lt;div class=&quot;block&quot; id=&quot;market-demand&quot;&gt;&lt;h3&gt;市價在要求什麼：成長端與倍數端，對照過去實績與模型假設&lt;/h3&gt;&lt;div class=&quot;grid2 wide&quot;&gt;&lt;figure class=figure&gt;&lt;p class=cap&gt;成長端：市價要成立，未來 5 年營收每年要成長多少（紅點基準折現率、線段高低折現率），對照過去實績與模型基準假設（成長推估底稿.json 六、成長性四問並列；推導，只描述）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 150&quot; role=&quot;img&quot; aria-label=&quot;市價要求的成長&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;230.0&quot; x2=&quot;230.0&quot; y1=&quot;8&quot; y2=&quot;128&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;230.0&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;0%&lt;/text&gt;&lt;line x1=&quot;316.7&quot; x2=&quot;316.7&quot; y1=&quot;8&quot; y2=&quot;128&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;316.7&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;5%&lt;/text&gt;&lt;line x1=&quot;403.3&quot; x2=&quot;403.3&quot; y1=&quot;8&quot; y2=&quot;128&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;403.3&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;10%&lt;/text&gt;&lt;line x1=&quot;490.0&quot; x2=&quot;490.0&quot; y1=&quot;8&quot; y2=&quot;128&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;490.0&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;15%&lt;/text&gt;&lt;text x=&quot;220&quot; y=&quot;27&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;過去實績（2021–2025 年複合）&lt;/text&gt;&lt;circle cx=&quot;231.3&quot; cy=&quot;22&quot; r=&quot;7&quot; fill=&quot;var(--c3)&quot;&gt;&lt;title&gt;過去實績（2021–2025 年複合）：0%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;243.3&quot; y=&quot;27&quot; class=&quot;val&quot;&gt;0%&lt;/text&gt;&lt;text x=&quot;220&quot; y=&quot;67&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;模型基準（未來 5 年平均）&lt;/text&gt;&lt;circle cx=&quot;299.3&quot; cy=&quot;62&quot; r=&quot;7&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;模型基準（未來 5 年平均）：4%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;311.3&quot; y=&quot;67&quot; class=&quot;val&quot;&gt;4%&lt;/text&gt;&lt;text x=&quot;220&quot; y=&quot;107&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;市價要求（未來 5 年年增）&lt;/text&gt;&lt;line x1=&quot;300.6&quot; x2=&quot;442.9&quot; y1=&quot;102&quot; y2=&quot;102&quot; stroke=&quot;var(--neg)&quot; stroke-width=&quot;3&quot; opacity=&quot;.55&quot;/&gt;&lt;circle cx=&quot;369.0&quot; cy=&quot;102&quot; r=&quot;7&quot; fill=&quot;var(--neg)&quot;&gt;&lt;title&gt;市價要求（未來 5 年年增）：8%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;454.9&quot; y=&quot;107&quot; class=&quot;val&quot;&gt;8%&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;figure class=figure&gt;&lt;p class=cap&gt;倍數端：市價要成立，第 10 年出場 EV/EBIT 要多少倍（紅點基準折現率、線段高低折現率），對照模型假設與分產業參考帶 p25–p75（灰帶，直線為中位；估值結果.json#/market_implied_terminal；只描述，不是目標價、不進評等）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 150&quot; role=&quot;img&quot; aria-label=&quot;市價隱含第 10 年倍數&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;172.0&quot; x2=&quot;172.0&quot; y1=&quot;8&quot; y2=&quot;128&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;172.0&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;0 倍&lt;/text&gt;&lt;line x1=&quot;278.0&quot; x2=&quot;278.0&quot; y1=&quot;8&quot; y2=&quot;128&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;278.0&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;10 倍&lt;/text&gt;&lt;line x1=&quot;384.0&quot; x2=&quot;384.0&quot; y1=&quot;8&quot; y2=&quot;128&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;384.0&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;20 倍&lt;/text&gt;&lt;line x1=&quot;490.0&quot; x2=&quot;490.0&quot; y1=&quot;8&quot; y2=&quot;128&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;490.0&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;30 倍&lt;/text&gt;&lt;rect x=&quot;254.7&quot; y=&quot;11&quot; width=&quot;209.9&quot; height=&quot;22&quot; rx=&quot;4&quot; fill=&quot;var(--line)&quot;&gt;&lt;title&gt;跨產業 參考帶 p25–p75（機械回測樣本，非市場全體；分產業的筆數與公司數少，僅供參考）&lt;/title&gt;&lt;/rect&gt;&lt;line x1=&quot;336.3&quot; x2=&quot;336.3&quot; y1=&quot;11&quot; y2=&quot;33&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;162&quot; y=&quot;27&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;參考帶（跨產業）&lt;/text&gt;&lt;text x=&quot;472.6&quot; y=&quot;27&quot; class=&quot;val&quot;&gt;8 倍–28 倍&lt;/text&gt;&lt;text x=&quot;162&quot; y=&quot;67&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;模型假設（第 10 年）&lt;/text&gt;&lt;circle cx=&quot;294.4&quot; cy=&quot;62&quot; r=&quot;7&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;模型假設（第 10 年）：12 倍&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;306.4&quot; y=&quot;67&quot; class=&quot;val&quot;&gt;12 倍&lt;/text&gt;&lt;text x=&quot;162&quot; y=&quot;107&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;市價隱含（第 10 年）&lt;/text&gt;&lt;line x1=&quot;316.4&quot; x2=&quot;345.5&quot; y1=&quot;102&quot; y2=&quot;102&quot; stroke=&quot;var(--neg)&quot; stroke-width=&quot;3&quot; opacity=&quot;.55&quot;/&gt;&lt;circle cx=&quot;329.6&quot; cy=&quot;102&quot; r=&quot;7&quot; fill=&quot;var(--neg)&quot;&gt;&lt;title&gt;市價隱含（第 10 年）：15 倍&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;357.5&quot; y=&quot;107&quot; class=&quot;val&quot;&gt;15 倍&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;p&gt;&lt;b&gt;成長端：&lt;/b&gt;市價要求未來 5 年營收年增約 8.0%（折現率高低 4.1%～12.3%），高於模型基準 5 年平均 4.0%、高於過去（2021–2025）實績 0.1%。&lt;/p&gt;&lt;p&gt;&lt;b&gt;倍數端：&lt;/b&gt;市價隱含第 10 年 EV/EBIT 約 14.9 倍，高於模型 11.6 倍，在跨產業參考帶 p25–p75（7.8–27.6 倍）內。&lt;/p&gt;&lt;p&gt;成功幾率（歷史基準比率）：模型基準 10 年實質年增 1.7%，同規模（營收 500 億美元以上）公司歷史上做到的比例 59%（歷史基準比率，非預測）。&lt;/p&gt;&lt;p class=&quot;cap&quot;&gt;兩端是同一條「模型價值＝市價」換不同未知數反解，方向必然一致，不是兩個獨立證據；幅度才有資訊。只描述，不進研究評等、不改價格位置與合理價值，不是目標價，非買賣建議。成長性四問細表、三視角反推、長期倍數條件（算法與完整表見&lt;a href=&quot;#wp-5&quot;&gt;計算底稿 5&lt;/a&gt;）。&lt;/p&gt;&lt;div class=&quot;note-box&quot;&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:14px&quot;&gt;市價要求的成長 vs 實績與指引&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;營收年增&lt;/th&gt;&lt;th&gt;出處&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;市價反推（基準折現率，未來 5 年）&lt;/td&gt;&lt;td&gt;8.0%（市價反推未來 5 年營收年增；市價 27.07 美元、收盤 2026-11-13；折現率 8.08%；推導）&lt;/td&gt;&lt;td&gt;估值結果 reverse_dcf&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;我們的基準情境（5 年平均）&lt;/td&gt;&lt;td&gt;4.0%&lt;/td&gt;&lt;td&gt;估值輸入 scenarios&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;FY2022～FY2025 日圓年複合&lt;/td&gt;&lt;td&gt;7.3%（推導，FY2022 用產品與服務銷售額、不含金融分部）&lt;/td&gt;&lt;td&gt;20-F 2025-03-31 損益表（FY2022 產品與服務銷售額 10,095,841）；財務歷史_原幣&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;FY2026 公司指引對 FY2025&lt;/td&gt;&lt;td&gt;4.2%&lt;/td&gt;&lt;td&gt;6-K 2026-11-05#3 本文 §10&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p&gt;要撐住現價，市場等於要求未來 5 年營收每年成長約 8.0%（換折現率高低兩端約 4.1% 到 12.3%）。這個要求在同規模公司的歷史上屬「樂觀」。現價未高於合理價值上緣，下表只描述市場面，不代表有溢價。&lt;/p&gt;&lt;p class=&quot;cap&quot;&gt;三視角反推、假設對照實績、歷史基準比率與市價溢價來源（算法與完整表見&lt;a href=&quot;#wp-5&quot;&gt;計算底稿 5&lt;/a&gt;）。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;白話說&lt;/b&gt;基準情境成真、以收盤價買進，推算年報酬約 7.3%（基準情境成真時、以收盤 2026-11-13 股價買進的推算年報酬；條件式，非預期報酬、非買賣建議），條件式、非預期報酬。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;要留意&lt;/b&gt;合理價值對利率很敏感，方向見改判訊號。&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;value&quot;&gt;&lt;div class=&quot;qno&quot;&gt;價值判斷&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;價值判斷：用彼得林奇的方法再看一次&lt;/div&gt;&lt;h2&gt;穩定成長股，價格合理，但成長要比過去快才撐得住。&lt;/h2&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;林區分類&lt;/b&gt;穩定成長；兼具兼具週期股（影像感測器、遊戲主機世代）&lt;br&gt;價格是否合理、成長是否還能維持高個位數到低兩位數的獲利成長、有沒有多角化失敗&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;研究評等&lt;/b&gt;&lt;span style=&quot;font-size:20px;font-weight:700&quot;&gt;生意 B ／ 價格合理&lt;/span&gt;&lt;br&gt;生意品質依五項證據評定；價格位置三級（買入區、合理、偏貴），依買入上限與合理價值高端判斷，同業與歷史倍數只作交叉核對。非買賣建議。&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;林區分類是穩定成長、兼具週期：日圓營收年複合約 7.3%&lt;span class=&quot;src&quot;&gt;（不含金融分部，推導）&lt;/span&gt;，主機世代與感測器景氣會讓獲利起伏（研究評等輸入 林區分類）。&lt;/strong&gt;核心本益比 20.1 倍（扣非經常 EPS；收盤 2026-11-13），以近四季扣非經常成長算 PEG 0.82&lt;span class=&quot;src&quot;&gt;（成長口徑 近四季對上一財年、扣非經常 24.4%；收盤 2026-11-13）&lt;/span&gt;，但用基準情境推估的成長算是 4.44&lt;span class=&quot;src&quot;&gt;（成長口徑 基準情境推估、稅後營業利益年增－股數年變化 4.5%；收盤 2026-11-13）&lt;/span&gt;，差距來自近四季獲利含關稅退款與日圓走弱。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;生意品質 B：護城河、資本報酬、自由現金流品質、治理都是中，資產負債表強。&lt;/strong&gt;林區會問的問題是「成長能不能延續」：我們的答案是軟體與服務能延續、硬體不行（作者判斷）。價格位置 合理 只看收盤 27.07 美元 落在買入區上緣 14.45 美元 與合理價值區間上緣之間；市價隱含假設罕見度 樂觀 只揭露，不進價格位置。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;grid2 wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;現金與證券 vs 有息負債（億美元），上方為淨現金&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 300&quot; role=&quot;img&quot; aria-label=&quot;資產負債&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;266.0&quot; y2=&quot;266.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;270.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;0.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;185.3&quot; y2=&quot;185.3&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;189.3&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;100&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;104.7&quot; y2=&quot;104.7&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;108.7&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;200&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;24.0&quot; y2=&quot;24.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;28.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;300&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;266.0&quot; y2=&quot;266.0&quot; class=&quot;zero&quot;/&gt;&lt;rect x=&quot;70.3&quot; y=&quot;164.3&quot; width=&quot;40.7&quot; height=&quot;101.7&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;現金與證券 FY23：126&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;113.0&quot; y=&quot;47.9&quot; width=&quot;40.7&quot; height=&quot;218.1&quot; rx=&quot;2&quot; fill=&quot;var(--c5)&quot;&gt;&lt;title&gt;有息負債 FY23：270&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;113.0&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY23&lt;/text&gt;&lt;text x=&quot;113.0&quot; y=&quot;16.0&quot; class=&quot;note&quot; text-anchor=&quot;middle&quot;&gt;淨 -144&lt;/text&gt;&lt;rect x=&quot;192.3&quot; y=&quot;105.6&quot; width=&quot;40.7&quot; height=&quot;160.4&quot
