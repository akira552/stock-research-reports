ound:var(--c5)&quot;&gt;&lt;/i&gt;有息負債&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;近 6 個月內部人公開市場買賣（百萬美元）；無任何買進&lt;/p&gt;&lt;svg viewBox=&quot;0 0 500 422&quot; role=&quot;img&quot; aria-label=&quot;內部人&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;191.0&quot; x2=&quot;191.0&quot; y1=&quot;6&quot; y2=&quot;416&quot; class=&quot;zero&quot;/&gt;&lt;text x=&quot;181&quot; y=&quot;23&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;Stringer（非計畫賣出）&lt;/text&gt;&lt;rect x=&quot;191.0&quot; y=&quot;9&quot; width=&quot;228.2&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--neg)&quot;/&gt;&lt;text x=&quot;427.2&quot; y=&quot;23&quot; class=&quot;val&quot;&gt;12&lt;/text&gt;&lt;text x=&quot;181&quot; y=&quot;63&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;Yoshida（非計畫賣出）&lt;/text&gt;&lt;rect x=&quot;191.0&quot; y=&quot;49&quot; width=&quot;168.2&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--neg)&quot;/&gt;&lt;text x=&quot;367.2&quot; y=&quot;63&quot; class=&quot;val&quot;&gt;9.0&lt;/text&gt;&lt;text x=&quot;181&quot; y=&quot;103&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;Totoki（非計畫賣出）&lt;/text&gt;&lt;rect x=&quot;191.0&quot; y=&quot;89&quot; width=&quot;88.0&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--neg)&quot;/&gt;&lt;text x=&quot;287.0&quot; y=&quot;103&quot; class=&quot;val&quot;&gt;4.7&lt;/text&gt;&lt;text x=&quot;181&quot; y=&quot;143&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;Kodera（非計畫賣出）&lt;/text&gt;&lt;rect x=&quot;191.0&quot; y=&quot;129&quot; width=&quot;34.1&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--neg)&quot;/&gt;&lt;text x=&quot;233.1&quot; y=&quot;143&quot; class=&quot;val&quot;&gt;1.8&lt;/text&gt;&lt;text x=&quot;181&quot; y=&quot;183&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;Ahuja（預設計畫賣出）&lt;/text&gt;&lt;rect x=&quot;191.0&quot; y=&quot;169&quot; width=&quot;14.4&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;213.4&quot; y=&quot;183&quot; class=&quot;val&quot;&gt;0.8&lt;/text&gt;&lt;text x=&quot;181&quot; y=&quot;223&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;Mitomo（非計畫賣出）&lt;/text&gt;&lt;rect x=&quot;191.0&quot; y=&quot;209&quot; width=&quot;9.8&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--neg)&quot;/&gt;&lt;text x=&quot;208.8&quot; y=&quot;223&quot; class=&quot;val&quot;&gt;0.5&lt;/text&gt;&lt;text x=&quot;181&quot; y=&quot;263&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;Tanaka（非計畫賣出）&lt;/text&gt;&lt;rect x=&quot;191.0&quot; y=&quot;249&quot; width=&quot;8.9&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--neg)&quot;/&gt;&lt;text x=&quot;207.9&quot; y=&quot;263&quot; class=&quot;val&quot;&gt;0.5&lt;/text&gt;&lt;text x=&quot;181&quot; y=&quot;303&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;Ahuja（非計畫賣出）&lt;/text&gt;&lt;rect x=&quot;191.0&quot; y=&quot;289&quot; width=&quot;6.6&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--neg)&quot;/&gt;&lt;text x=&quot;205.6&quot; y=&quot;303&quot; class=&quot;val&quot;&gt;0.4&lt;/text&gt;&lt;text x=&quot;181&quot; y=&quot;343&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;Platt（預設計畫賣出）&lt;/text&gt;&lt;rect x=&quot;191.0&quot; y=&quot;329&quot; width=&quot;6.5&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;205.5&quot; y=&quot;343&quot; class=&quot;val&quot;&gt;0.3&lt;/text&gt;&lt;text x=&quot;181&quot; y=&quot;383&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;Ito（非計畫賣出）&lt;/text&gt;&lt;rect x=&quot;191.0&quot; y=&quot;369&quot; width=&quot;4.1&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--neg)&quot;/&gt;&lt;text x=&quot;203.1&quot; y=&quot;383&quot; class=&quot;val&quot;&gt;0.2&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;生意品質：B（規則：無「弱」且至少三項「強」＝A）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;評等&lt;/th&gt;&lt;th&gt;理由&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;護城河&lt;/td&gt;&lt;td&gt;中&lt;/td&gt;&lt;td&gt;PlayStation 平台：EA 對 Sony 直接銷售占其 FY2025 淨營收約 39%（EA 10-K，全文搜尋 Q1）；Sony Music 為三大唱片之一、三家合計約占全球錄製音樂營收 70%（WMG 10-K），Spotify 多數錄音由三大與 Merlin 授權（Spotify 20-F）；反向：影像感測器有 Samsung（三星）、OmniVision（影像感測器公司）點名競爭（onsemi 10-K），上半年行動感測器銷售減少（6-K 2026-11-10 本文 §28）。兩個分部有外部證據、其餘沒有，評中（主張 SONY-C01）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;投入資本報酬與增量回報&lt;/td&gt;&lt;td&gt;中&lt;/td&gt;&lt;td&gt;近四季持續營運 ROIC 約 16.5%（推導：稅後營業利益約 1.32 兆日圓÷2026-09-30 投入資本約 7.99 兆）；改用 FY2025 年度營業利益 1,447,507 百萬日圓約 13.4%（推導，計算核對第 1 項）；近五年長期財務口徑 13.4%～18.8%（含分拆前金融分部，近似）每年高於 WACC 8.1%。近四季含未揭露金額的關稅退款與日圓走弱，研發資本化對照無法計算，評中（主張 SONY-C02、SONY-C08）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;自由現金流品質&lt;/td&gt;&lt;td&gt;中&lt;/td&gt;&lt;td&gt;FY2025 營運現金流約 1.97 兆日圓，對有息負債 1.97 倍（融資償債底稿 償債能力指標）；IFRS 付息列融資、租賃本金另計，營運現金流偏高，分拆前年度含金融分部，近四季持續營運自由現金流無法乾淨重算；應收與合約負債穩定（融資償債判讀 收入與收現）。評中（主張 SONY-C03、SONY-C08）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;資產負債表&lt;/td&gt;&lt;td&gt;強&lt;/td&gt;&lt;td&gt;現金與證券÷一年內到期債務 10.15 倍、淨負債÷EBITDA -0.42（融資償債底稿 償債能力指標，2026-03-31）；2026-09-30 現金 2.01 兆日圓大於有息負債（不含租賃）1.45 兆；未動用承諾授信 789.6 十億日圓、商業本票額度 1,299.3 十億日圓（融資償債判讀 可用授信與到期）；評級 Moody&amp;#x27;s A2、S&amp;amp;P A+。評強（主張 SONY-C04）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;治理與資本配置&lt;/td&gt;&lt;td&gt;中&lt;/td&gt;&lt;td&gt;分拆 Sony Financial Group 聚焦娛樂與感測器；FY2025（至 2026-03-31）回購殖利率約 2.2%（價值判斷 股東回報），股權薪酬抵銷未取得；FY2026 指引在 5 月首次發布後兩度上修，但 FY2025 最後一版營業利益指引未達約 6%（融資償債判讀 年度指引追蹤）。評中（主張 SONY-C09、SONY-C11）&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;PEG 三口徑、林區資產負債表檢查與 F 分數等交叉檢查（算法與完整表見&lt;a href=&quot;#wp-value&quot;&gt;計算底稿 價值判斷&lt;/a&gt;）。&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;capital&quot;&gt;&lt;div class=&quot;qno&quot;&gt;問題 06&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;資本與治理有什麼要注意？&lt;/div&gt;&lt;h2&gt;淨現金、A 級信評，治理重點是分拆後的資本配置與合資。&lt;/h2&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;資產負債表強：有息負債 6,550.1 百萬美元，淨現金 7,335.3 百萬美元，信用評級 機構 Moody&amp;#x27;s A2、S&amp;amp;P A+（SEC 全文搜尋 FWP 2026-06-24 0001104659-26-076979 #0）｜投資等級；存活檢查 無明顯警訊&lt;span class=&quot;src&quot;&gt;（推導，非違約預測）&lt;/span&gt;：現金與證券可付一年內到期債務本金 10.2 倍（利息未取得，未含利息）。&lt;/strong&gt;（主張 SONY-C04）。&lt;/p&gt;&lt;p&gt;要注意的是投資：感測器合資 Sony 約出資 4,650 億日圓，Sony Honda Mobility（Sony 與本田的電動車合資公司）已停止電動車開發，兩者都會影響未來的資本報酬&lt;span class=&quot;src&quot;&gt;（6-K 2026-08-11 本文 §8；20-F 2026-03-31 Item 3 ¶26）&lt;/span&gt;。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;近四季營運現金流的去向（億美元）：第一列為營運現金流，往下逐項扣除，最後一列為剩餘或缺口&lt;/p&gt;&lt;svg viewBox=&quot;0 0 500 258&quot; role=&quot;img&quot; aria-label=&quot;資金去向&quot; class=&quot;chart&quot; style=&quot;max-width:650px&quot;&gt;&lt;line x1=&quot;150.0&quot; x2=&quot;150.0&quot; y1=&quot;6&quot; y2=&quot;254&quot; class=&quot;zero&quot;/&gt;&lt;text x=&quot;140&quot; y=&quot;37.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;近四季營運現金流&lt;/text&gt;&lt;rect x=&quot;150.0&quot; y=&quot;22.0&quot; width=&quot;275.0&quot; height=&quot;20&quot; rx=&quot;4&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;近四季營運現金流：129&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;433.0&quot; y=&quot;37.0&quot; class=&quot;val&quot;&gt;129&lt;/text&gt;&lt;line x1=&quot;425.0&quot; x2=&quot;425.0&quot; y1=&quot;42.0&quot; y2=&quot;62.0&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;1&quot; stroke-dasharray=&quot;2 3&quot;/&gt;&lt;text x=&quot;140&quot; y=&quot;77.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;回購&lt;/text&gt;&lt;rect x=&quot;351.2&quot; y=&quot;62.0&quot; width=&quot;73.8&quot; height=&quot;20&quot; rx=&quot;4&quot; fill=&quot;var(--c2)&quot;&gt;&lt;title&gt;回購：−34.7&lt;/title&gt 9&quot; width=&quot;40.7&quot; height=&quot;218.1&quot; rx=&quot;2&quot; fill=&quot;var(--c5)&quot;&gt;&lt;title&gt;有息負債 FY23：270&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;113.0&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY23&lt;/text&gt;&lt;text x=&quot;113.0&quot; y=&quot;16.0&quot; class=&quot;note&quot; text-anchor=&quot;middle&quot;&gt;淨 -144&lt;/text&gt;&lt;rect x=&quot;192.3&quot; y=&quot;105.6&quot; width=&quot;40.7&quot; height=&quot;160.4&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;現金與證券 FY24：199&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;235.0&quot; y=&quot;72.3&quot; width=&quot;40.7&quot; height=&quot;193.7&quot; rx=&quot;2&quot; fill=&quot;var(--c5)&quot;&gt;&lt;title&gt;有息負債 FY24：240&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;235.0&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY24&lt;/text&gt;&lt;text x=&quot;235.0&quot; y=&quot;16.0&quot; class=&quot;note&quot; text-anchor=&quot;middle&quot;&gt;淨 -41.2&lt;/text&gt;&lt;rect x=&quot;314.3&quot; y=&quot;154.0&quot; width=&quot;40.7&quot; height=&quot;112.0&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;現金與證券 FY25：139&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;357.0&quot; y=&quot;213.2&quot; width=&quot;40.7&quot; height=&quot;52.8&quot; rx=&quot;2&quot; fill=&quot;var(--c5)&quot;&gt;&lt;title&gt;有息負債 FY25：65.5&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;357.0&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY25&lt;/text&gt;&lt;text x=&quot;357.0&quot; y=&quot;16.0&quot; class=&quot;note&quot; text-anchor=&quot;middle&quot;&gt;淨 73.4&lt;/text&gt;&lt;rect x=&quot;436.3&quot; y=&quot;154.0&quot; width=&quot;40.7&quot; height=&quot;112.0&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;現金與證券 2026-03：139&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;479.0&quot; y=&quot;213.2&quot; width=&quot;40.7&quot; height=&quot;52.8&quot; rx=&quot;2&quot; fill=&quot;var(--c5)&quot;&gt;&lt;title&gt;有息負債 2026-03：65.5&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;479.0&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;2026-03&lt;/text&gt;&lt;text x=&quot;479.0&quot; y=&quot;16.0&quot; class=&quot;note&quot; text-anchor=&quot;middle&quot;&gt;淨 73.4&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c1)&quot;&gt;&lt;/i&gt;現金與證券&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c5)&quot;&gt;&lt;/i&gt;有息負債&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;shareholder-equity&quot;&gt;&lt;h3&gt;股東回報與權益（逐年）&lt;/h3&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;財年&lt;/th&gt;&lt;th&gt;股東權益（億美元）&lt;/th&gt;&lt;th&gt;ROE&lt;/th&gt;&lt;th&gt;每股帳面（美元，推導）&lt;/th&gt;&lt;th&gt;股利（億美元）&lt;/th&gt;&lt;th&gt;回購（億美元）&lt;/th&gt;&lt;th&gt;（股利＋回購）÷ 自由現金流&lt;/th&gt;&lt;th&gt;稀釋股數年變化&lt;/th&gt;&lt;th&gt;註記&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2019&lt;/td&gt;&lt;td&gt;557&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2020&lt;/td&gt;&lt;td&gt;455&lt;/td&gt;&lt;td&gt;19.2%&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;5.8&lt;/td&gt;&lt;td&gt;0.0&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2021&lt;/td&gt;&lt;td&gt;588&lt;/td&gt;&lt;td&gt;15.1%&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;6.6&lt;/td&gt;&lt;td&gt;7.9&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2022&lt;/td&gt;&lt;td&gt;461&lt;/td&gt;&lt;td&gt;14.2%&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;6.4&lt;/td&gt;&lt;td&gt;7.3&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2023&lt;/td&gt;&lt;td&gt;502&lt;/td&gt;&lt;td&gt;14.0%&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;6.8&lt;/td&gt;&lt;td&gt;14.1&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2024&lt;/td&gt;&lt;td&gt;546&lt;/td&gt;&lt;td&gt;14.3%&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;7.6&lt;/td&gt;&lt;td&gt;18.8&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;長期財務.json（股東權益、稀釋股數〔分割調整〕、總資產；每股帳面＝股東權益 ÷ 稀釋股數，推導；股利支付、回購、營運現金流、資本支出在財務歷史.json 沒有該年時用）；產業指標.json 逐年（ROE）；財務歷史.json annual（股利、回購、營運現金流、資本支出）。用到：財務歷史、長期財務。ROE 註記門檻：ROE 高於 60% 或股東權益 ÷ 總資產低於 10%；近三年回購合計達當年股東權益 50% 以上才歸因於回購。（股利＋回購）÷ 年底市值：專案沒有逐年年底市值資料，不列該欄。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;capital-plain&quot;&gt;&lt;h3&gt;融資與償債：還不還得起&lt;/h3&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;b&gt;信用評級&lt;/b&gt;　機構 Moody&amp;#x27;s A2、S&amp;amp;P A+（SEC 全文搜尋 FWP 2026-06-24 0001104659-26-076979 #0）／推導 未取得｜投資等級（BBB-／Baa3 以上）&lt;/p&gt;&lt;p&gt;&lt;b&gt;存活檢查（12～24 個月，推導，非違約預測）&lt;/b&gt;　無明顯警訊（推導，非違約預測）：現金與證券 139 億美元，一年內到期債務 14 億美元，可付本金 10.2 倍（未含利息）；兩年內到期債務未取得；會計師未提出繼續經營疑慮。&lt;/p&gt;&lt;p&gt;&lt;b&gt;利率壓力測試&lt;/b&gt;　未取得（缺 浮動利率債、兩年內到期本金、利息保障基準，對應情境未取得（不補值））&lt;/p&gt;&lt;p&gt;&lt;b&gt;借款用途&lt;/b&gt;　無法判定（淨償債，非新增借款）&lt;/p&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;償債指標、融資活動表、存活檢查明細與利率壓力測試（算法與完整表見&lt;a href=&quot;#wp-6&quot;&gt;計算底稿 6&lt;/a&gt;）。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;財務管理&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;借款用途無法判定：FY2025 是淨償債，持續營運融資活動淨流出約 8,340 億日圓，主要是回購、股利、租賃與長債淨償還&lt;span class=&quot;src&quot;&gt;（融資償債判讀 借款用途；20-F 2026-03-31 現金流量表（融資活動，持續營運））&lt;/span&gt;。&lt;/strong&gt;近四季借還款淨額 淨償還 708.3 百萬美元（部分缺漏）。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;2026-03-31 未動用承諾授信 789.6 十億日圓、商業本票額度 1,299.3 十億日圓&lt;span class=&quot;src&quot;&gt;（融資償債判讀 可用授信與到期；20-F 2026-03-31 Item 5 ¶180–181）&lt;/span&gt;，9 月底未動用承諾授信約 782.1 十億日圓；2026 年 6 月發行 10 億美元公司債作一般用途（6-K 2026-11-10 本文 §45–46）。&lt;/strong&gt;長債逐年到期表工具未取得。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;資產變化&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;分拆金融是最大的資產變化：短期借款從約 1.84 兆日圓降到約 510 億，是金融分部不再合併，不是現金償還（融資償債判讀 借款用途）。&lt;/p&gt;&lt;p&gt;工具的營運投入資本因分拆變成負值，ROIC 與增量 ROIC 改用作者推導（主張 SONY-C02）；存貨天數約 49 天，存貨減少約 6%、營收增約 3.7%&lt;span class=&quot;src&quot;&gt;（日圓，推導）&lt;/span&gt;，沒有堆貨跡象。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;公司內部治理&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;十時裕樹（Hiroki Totoki）由時任董事長兼執行長吉田憲一郎向提名委員會提名接任，原任社長兼營運長與財務長&lt;span class=&quot;src&quot;&gt;（20-F 2025-03-31 Item 6 ¶274）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;股權薪酬稀釋數字未取得，淨回購殖利率算不出來；治理與資本配置評中（研究評等輸入）。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;業務治理&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;分拆 Sony Financial Group 後聚焦娛樂與感測器，方向清楚；但 FY2025 最後一版營業利益指引未達約 6%，FY2026 才連續上修，指引可信度還要再看一年（主張 SONY-C09）。&lt;/p&gt;&lt;p&gt;合資風險公司自己寫在年報：合資可能要追加出資、失去技術控制或認列減損&lt;span class=&quot;src&quot;&gt;（20-F 2026-03-31 Item 3 ¶26）&lt;/span&gt;。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;白話說&lt;/b&gt;現金與證券 13,885.3 百萬美元，高於有息負債 6,550.1 百萬美元（2026-03-31）。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;要留意&lt;/b&gt;合資出資分階段，未來資本支出可能上升，方向見改判訊號。&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;events&quot;&gt;&lt;div class=&quot;qno&quot;&gt;問題 07&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;最近發生了什麼？&lt;/div&gt;&lt;h2&gt;指引上修、地震復工、與台積電簽合資，年底有 GTA VI（Take-Two 旗下遊戲新作）發售。&lt;/h2&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;近半年的事件偏正面：全年獲利指引從 5 月首次指引的 1.60 兆兩度上修到 1.87 兆日圓，熊本廠 7 月 28 日地震停產、8 月 4 日起分階段復工、8 月中回到震前產能（新聞 N4 §2–3）（主張 SONY-C07、SONY-C09）。&lt;/p&gt;&lt;p&gt;反方：美國關稅退款讓近四季利潤偏高，媒體轉述約 800 億日圓但公司未揭露；記憶體價格與主機供貨仍是下半年的主要變數（主張 SONY-C06、SONY-C08）。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;事件表（2026-05 起選列，非完整清單）&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;只列影響估值假設或改判條件的事件，出處都是本輪存檔 6-K 與新聞。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;figure&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt signals&quot;&gt;&lt;tr&gt;&lt;th&gt;日期&lt;/th&gt;&lt;th&gt;事件&lt;/th&gt;&lt;th&gt;影響&lt;/th&gt;&lt;th&gt;出處&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2026-05-08&lt;/td&gt;&lt;td&gt;FY2026 首次指引：營收 12.3 兆、營業利益 1.60 兆；與台積電簽感測器初步協議&lt;/td&gt;&lt;td&gt;指引起點&lt;/td&gt;&lt;td&gt;6-K 2026-05-08#4 新聞稿 §18；6-K 2026-08-11 本文 §11&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2026-06&lt;/td&gt;&lt;td&gt;發行 10 億美元公司債，一般用途&lt;/td&gt;&lt;td&gt;財務彈性&lt;/td&gt;&lt;td&gt;6-K 2026-11-10 本文 §45&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2026-07&lt;/td&gt;&lt;td&gt;熊本地震，感測器主力廠停產，8 月中復工&lt;/td&gt;&lt;td&gt;I&amp;amp;SS 短期產量&lt;/td&gt;&lt;td&gt;6-K 2026-07-31#1 本文 §3；新聞 N4&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2026-07-31&lt;/td&gt;&lt;td&gt;指引上修到 12.5 兆、1.72 兆；記憶體漲價列主要挑戰&lt;/td&gt;&lt;td&gt;上修但成本風險&lt;/td&gt;&lt;td&gt;6-K 2026-07-31#2 本文 §10；6-K 2026-07-31#1 本文 §21&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2026-08-11&lt;/td&gt;&lt;td&gt;與台積電簽合資正式協議，Sony 約出資 4,650 億日圓&lt;/td&gt;&lt;td&gt;感測器產能與資本支出&lt;/td&gt;&lt;td&gt;6-K 2026-08-11 本文 §8&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2026-11-05&lt;/td&gt;&lt;td&gt;上半年營收 +9.4%，指引再上修到 13.0 兆、1.87 兆&lt;/td&gt;&lt;td&gt;基準情境依據&lt;/td&gt;&lt;td&gt;6-K 2026-11-05#3 本文 §10&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;白話說&lt;/b&gt;全年營業利益指引從 1.60 兆升到 1.87 兆日圓，等於每 100 日圓原指引多出約 17 日圓。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;要留意&lt;/b&gt;指引上修含匯率與關稅退款，方向見改判訊號。&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;news&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;近期新聞查證&lt;/p&gt;&lt;h3&gt;新聞大致支持軟體與音樂成長，關稅退款金額只有媒體轉述。&lt;/h3&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;我們讀了 4 則新聞原文，引句都核對過；Reuters 與 EE Times Asia 無法取得原文，不引用。&lt;/strong&gt;關稅退款約 800 億日圓是 GamesRadar+（遊戲新聞網站）轉述 Game File（遊戲產業電子報），未經 6-K 證實。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;新聞摘要（依日期排序）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;日期&lt;/th&gt;&lt;th&gt;來源&lt;/th&gt;&lt;th&gt;重點&lt;/th&gt;&lt;th&gt;我們的判讀&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2026-08-05&lt;/td&gt;&lt;td&gt;GamesRadar+&lt;/td&gt;&lt;td&gt;Sony 估計美國關稅退款約 5.08 億美元，七成在 4–6 月收到&lt;/td&gt;&lt;td&gt;反方：近四季利潤含不重複收入，金額未經公司揭露（SONY-C08）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2026-08-21&lt;/td&gt;&lt;td&gt;PetaPixel&lt;/td&gt;&lt;td&gt;熊本感測器廠地震後恢復全面運作&lt;/td&gt;&lt;td&gt;背景：停產期短，損失金額公司未揭露（SONY-C07）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2026-11-05&lt;/td&gt;&lt;td&gt;Engadget&lt;/td&gt;&lt;td&gt;PS5 單季 260 萬台低於去年 400 萬，軟體與網路服務成長&lt;/td&gt;&lt;td&gt;支持：成長靠軟體與服務，主機受供貨限制（SONY-C05）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2026-11-05&lt;/td&gt;&lt;td&gt;Music Week&lt;/td&gt;&lt;td&gt;音樂分部單季營收年增 10.3%，串流成長&lt;/td&gt;&lt;td&gt;支持：音樂版權持續成長（SONY-C05）&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;numbers&quot;&gt;&lt;div class=&quot;qno&quot;&gt;完整數字&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;三大報表摘要（年度與 8 季）&lt;/div&gt;&lt;h2&gt;營收、獲利、現金流與資產負債一次看&lt;/h2&gt;&lt;div class=&quot;grid2 wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;損益：年度與近四季（億美元）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 300&quot; role=&quot;img&quot; aria-label=&quot;損益（年度）&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;266.0&quot; y2=&quot;266.0&quot; quot;&gt;2026-03-31&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c1)&quot;&gt;&lt;/i&gt;現金與短期投資&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--neg)&quot;&gt;&lt;/i&gt;借款（短期＋長期）&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c2)&quot;&gt;&lt;/i&gt;股東權益&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;數字取自 財務歷史.json（SEC 申報）；缺值不補、不畫。逐列表格見&lt;a href=&quot;#numbers-table&quot;&gt;附錄「完整數字表格」&lt;/a&gt;。&lt;/p&gt;&lt;/section&gt;&lt;/div&gt;
&lt;section class=&quot;q&quot; id=&quot;workpaper&quot; data-layer=&quot;計算底稿&quot;&gt;&lt;div class=&quot;qno&quot;&gt;計算底稿&lt;/div&gt;&lt;h2&gt;計算底稿：正文結果的算法與完整表（預設摺疊）&lt;/h2&gt;&lt;p class=&quot;wpnote&quot;&gt;正文每個估值、償債結果都從這裡算出；背景計算照做、送審照核。不讀也不影響理解結論；非買賣建議。&lt;/p&gt;&lt;details id=&quot;wp-3-4&quot;&gt;&lt;summary&gt;3・4 現金與股東：報表對帳與股東回報判讀&lt;/summary&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;現金流報表對帳&lt;/h3&gt;&lt;p&gt;報表對帳（20-F 2026-03-31，現金及約當現金（未含受限現金或公司未分列））：期初 19,809.5＋營運 12,929.3＋投資 -13,095.0＋融資 -5,600.5＋其他 635.4＝期末 14,678.8 百萬美元｜完整&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;股東回報判讀表&lt;/h3&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;股東回報（判讀依估值政策門檻，2026-10-14 核定；不影響估值與價格位置）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;數值&lt;/th&gt;&lt;th&gt;判讀&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股利殖利率&lt;/td&gt;&lt;td&gt;0.56%&lt;/td&gt;&lt;td&gt;不評好壞：依估值政策，股利殖利率高低不設門檻（高殖利率常因股價下跌）；占股東收益率 21%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;回購殖利率&lt;/td&gt;&lt;td&gt;2.18%&lt;/td&gt;&lt;td&gt;不評好壞：近四季回購約 34.7 億美元，是市值 1,588.9 億美元的 2.18%；划不划算看「股東收益率」「淨回購」「回購均價」&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股東收益率（股利＋回購）&lt;/td&gt;&lt;td&gt;2.75%（公債的 53%）&lt;/td&gt;&lt;td&gt;中性：2.75% 是 10 年期公債 5.15% 的 53%，現金回饋只補上一部分，其餘要靠成長&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;淨回購殖利率&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;資料限制：未取得回購或股權薪酬&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股數年變化（1／3／10 財年）&lt;/td&gt;&lt;td&gt;—／—／—&lt;/td&gt;&lt;td&gt;資料限制：1 財年資料不足；3 財年資料不足；10 財年資料不足（只有 2020–2024）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;近十年有回購的年數&lt;/td&gt;&lt;td&gt;5／10（其中5年缺回購資料，不視為零）&lt;/td&gt;&lt;td&gt;中性：只有 5 年有回購，未達政策「穩定」要求的 8 年；另有 5 年缺資料&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股利連續成長年數&lt;/td&gt;&lt;td&gt;0&lt;/td&gt;&lt;td&gt;中性：連續 0 年調高，未達政策「近十年年年調高」&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;details id=&quot;wp-mkt&quot;&gt;&lt;summary&gt;市場背景：大盤一句、流動性、空單與參考值的資料日期與存檔&lt;/summary&gt;&lt;p class=&quot;cap&quot;&gt;大盤狀態（市場總覽；只揭露，不進研究評等、價格位置與合理價值）：S&amp;amp;P 500（以 SPY 代表）前十大持股合計 37.3%，最大產業科技 38.2%；那斯達克 100（QQQ）科技占 58.0%；等權重 RSP 減市值加權 SPY 近3個月報酬差 1.7 個百分點，位在 2003 年以來第 79 分位（持平）。高收益債利差 3.30，位在 2023 年以來第 81 分位（偏高）；金融狀況指數 -0.46，位在 1971 年以來第 44 分位（中性）；VIX 18.70，位在 1990 年以來第 56 分位（中性）；融資推估（聯準會，推估）0.74 兆美元（2026-06-30），年增 46.6%（第 92 分位，偏高），占國內公司股權市值 0.68%（第 8 分位，偏低）。（市場總覽收盤日 2026-11-12，市場/市場總覽.json）。&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;流動性、空單與參考值（只列事實與資料日期，不判冷熱、不是買賣訊號；非買賣建議）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;類別&lt;/th&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;數值&lt;/th&gt;&lt;th&gt;資料日期&lt;/th&gt;&lt;th&gt;說明與存檔&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;流動性&lt;/td&gt;&lt;td&gt;20 日均成交量&lt;/td&gt;&lt;td&gt;4,889,720 股&lt;/td&gt;&lt;td&gt;2026-11-13 收盤&lt;/td&gt;&lt;td&gt;90 日均量 4,474,974 股（20 日 ÷ 90 日 1.09 倍）｜市場資料/市場溫度.json#/量能&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;流動性&lt;/td&gt;&lt;td&gt;20 日均成交金額&lt;/td&gt;&lt;td&gt;1.3 億美元&lt;/td&gt;&lt;td&gt;2026-11-13 收盤&lt;/td&gt;&lt;td&gt;市場資料/市場溫度.json#/流動性/20日均成交金額&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;流動性&lt;/td&gt;&lt;td&gt;20 日均周轉率（每日）&lt;/td&gt;&lt;td&gt;0.08%&lt;/td&gt;&lt;td&gt;2026-11-13 收盤&lt;/td&gt;&lt;td&gt;缺 SEC 封面股數，換手率用 yfinance 現行股數（推導）；自身近 5 年第 77% 百分位｜市場資料/市場溫度.json#/流動性/20日均換手率&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;空單&lt;/td&gt;&lt;td&gt;放空比率（空單占流通股）&lt;/td&gt;&lt;td&gt;0.25%&lt;/td&gt;&lt;td&gt;2026-10-30 結算&lt;/td&gt;&lt;td&gt;空單 14,572,130 股；前月（2026-09-30）10,899,692 股，增加 33.7%；交易所每月兩次申報，經 yfinance 取得（2026-11-14）｜市場資料/市場溫度.json#/流動性/空單&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;空單&lt;/td&gt;&lt;td&gt;回補天數&lt;/td&gt;&lt;td&gt;3.50 天&lt;/td&gt;&lt;td&gt;2026-10-30 結算&lt;/td&gt;&lt;td&gt;空單 ÷ 日均量（yfinance）；自算 ÷ 90 日均量 3.26 天｜市場資料/市場溫度.json#/流動性/空單&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;參考值&lt;/td&gt;&lt;td&gt;52 週區間位置&lt;/td&gt;&lt;td&gt;72%&lt;/td&gt;&lt;td&gt;2026-11-13 收盤&lt;/td&gt;&lt;td&gt;0%＝52 週低 19.32、100%＝52 週高 30.12（收盤，推算）｜市場資料/市場溫度.json#/趨勢&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;參考值&lt;/td&gt;&lt;td&gt;近 12 個月股價報酬&lt;/td&gt;&lt;td&gt;-10.5%&lt;/td&gt;&lt;td&gt;2026-11-13 收盤&lt;/td&gt;&lt;td&gt;同期 S&amp;amp;P 500 +11.6%｜市場資料/市場溫度.json#/動能&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;參考值&lt;/td&gt;&lt;td&gt;60 日歷史年化波動&lt;/td&gt;&lt;td&gt;26.0%&lt;/td&gt;&lt;td&gt;2026-11-13 收盤&lt;/td&gt;&lt;td&gt;日報酬標準差年化（收盤）｜市場資料/市場溫度.json#/波動&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;參考值&lt;/td&gt;&lt;td&gt;距 200 日均線&lt;/td&gt;&lt;td&gt;+20.5%&lt;/td&gt;&lt;td&gt;2026-11-13 收盤&lt;/td&gt;&lt;td&gt;200 日均線 22.46｜市場資料/市場溫度.json#/趨勢&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;wide&quot;&gt;&lt;/div&gt;&lt;/details&gt;&lt;details id=&quot;wp-5&quot;&gt;&lt;summary&gt;5 估值：情境算式、市價隱含第 10 年倍數、同業與歷史倍數交叉核對、條件式區間算法、市價反推、溢價來源與作者計算說明&lt;/summary&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;作者計算說明&lt;/h3&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;參數：WACC 8.08%（區間 7.33%～8.91%），beta（股價相對大盤的波動係數）0.77＝2 年週 beta 0.66 與 Damodaran Electronics (Consumer &amp;amp; Office) 重新加槓桿 0.88 的平均；無風險 5.15%、ERP 4.2%；營運稅率 26%；銷售對資本比 基準 1.7、保守 1.5、樂觀 1.9（估值輸入 evidence_notes 折現率、稅率、再投資）。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;基期：近四季（2025-10～2026-09）持續營運營收 13,017,315 百萬日圓、營業利益 1,777,406 百萬日圓&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;，以 2026-11-06 DEXJPUS 158.23 換算美元。&lt;/strong&gt;基準第 1–5 年成長 3.0%、4.5%、4.5%、4.0%、4.0%，穩態營業利益率 13.5%；保守穩態 10.5%、樂觀 16.5%，上下用同一段歷史與幅度（A2）。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;股權橋：債務含租賃、扣非控制權益與確定福利負債，其他金融資產與權益法投資（含 SFGI 股份）不加回（保守）；營運保留現金 0；股數用 FY2026 上半年加權平均流通股數 5,869.6 百萬股（6-K 2026-11-05#3 新聞稿 §11），改用 2026-09-30 期末流通股數 5,839.8 百萬股（已發行 5,965.3－庫藏 125.5，6-K 2026-10-14 本文 §6），每股價值約 +0.5%&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;，不改價格位置。&lt;/strong&gt;若把其他金融資產加回，中點約 +6.0%、買入區上緣約 +24%&lt;span class=&quot;src&quot;&gt;（推導，計算核對第 4 項）&lt;/span&gt;，仍不改價格位置。&lt;/p&gt;&lt;p&gt;計算核對 6 項缺口判斷逐項還原，中點變動 0%～+6.0%，都沒有讓收盤價跨出原價格位置；過門檻的只有第 1 項（基期與匯率，中點 +0.8%），因同一基期是 ROIC 理由的依據，研究評等理由已並列年度口徑 13.4%（計算核對/計算核對.md）。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;超額報酬期間：分級窄、三情境衰退期 5 年，永續期 ROIC 基準與樂觀 13.0%、保守 8.1%。&lt;/strong&gt;只延長衰退期到 10 年，中點約 25.1（+4.3%）；衰退 10 年加永續期 ROIC＝WACC，中點約 22.8（−5.5%），兩者都仍在合理區（超額報酬期間檢查）。&lt;/p&gt;&lt;p&gt;成長跑道六項：①市場空間與滲透率 未揭露；②定價能力 部分&lt;span class=&quot;src&quot;&gt;（硬體台數降但網路服務增，毛利率 FY2023 28.2% 起回升到 FY2025 30.8%，FY2022 不含金融分部約 28.9%，推導）&lt;/span&gt;；③營運槓桿 有證據&lt;span class=&quot;src&quot;&gt;（增量營業利益率約 27.1%，FY2022 扣除金融分部，推導）&lt;/span&gt;；④指引達成 部分（FY2025 營業利益未達約 6%，FY2026 5 月首次指引後兩度上修）；⑤資金 有證據&lt;span class=&quot;src&quot;&gt;（自有現金流，股數年減約 1–2%，推導）&lt;/span&gt;；⑥新事業 部分（Sony Honda Mobility 權益法損失，只列事實）。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;一次性項目：近四季本益比、EV/EBIT 與同業換算都用同一組分母，美國關稅退款金額 6-K 未揭露、三處都未扣；媒體轉述約 800 億日圓，若屬實約占近四季營業利益 4.5%&lt;span class=&quot;src&quot;&gt;（推導，主張 SONY-C08）&lt;/span&gt;。&lt;/strong&gt;Sony Financial Group（已分拆的金融子公司）權益法初始認列利益與減損同額 188,888 百萬日圓相抵（6-K 2026-05-19 本文 §109–110）。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;合理價值 vs 報酬門檻價：以收盤價買進要年報酬 8%，保守、基準、樂觀三情境對應的每股價格分別是 13.40 美元&lt;span class=&quot;src&quot;&gt;（保守情境成真、年報酬 8% 所對應的每股價格；收盤 2026-11-13 股價 27.07 美元；條件式推算，非目標價、非買賣建議）&lt;/span&gt;、23.27 美元&lt;span class=&quot;src&quot;&gt;（基準情境成真、年報酬 8% 所對應的每股價格；收盤 2026-11-13 股價 27.07 美元；條件式推算，非目標價、非買賣建議）&lt;/span&gt;、37.94 美元&lt;span class=&quot;src&quot;&gt;（樂觀情境成真、年報酬 8% 所對應的每股價格；收盤 2026-11-13 股價 27.07 美元；條件式推算，非目標價、非買賣建議）&lt;/span&gt;；第 5 年倍數維持 14.5 倍&lt;span class=&quot;src&quot;&gt;（第 5 年企業價值 ÷ 當年 EBIT，維持現在；推導）&lt;/span&gt; 時，三情境五年年報酬分別約 -1.4%&lt;span class=&quot;src&quot;&gt;（保守情境成真、現價買進持有 5 年、第 5 年企業價值 ÷ EBIT 14.5 倍〔維持現在〕；推導，條件式，非預期報酬、非買賣建議）&lt;/span&gt;、8.7%&lt;span class=&quot;src&quot;&gt;（基準情境成真、現價買進持有 5 年、第 5 年企業價值 ÷ EBIT 14.5 倍〔維持現在〕；推導，條件式，非預期報酬、非買賣建議）&lt;/span&gt;、17.3%&lt;span class=&quot;src&quot;&gt;（樂觀情境成真、現價買進持有 5 年、第 5 年企業價值 ÷ EBIT 14.5 倍〔維持現在〕；推導，條件式，非預期報酬、非買賣建議）&lt;/span&gt;。&lt;/strong&gt;本益比對成長比值 4.44&lt;span class=&quot;src&quot;&gt;（本益比 ÷ 成長率；成長口徑 基準情境推估（稅後營業利益年增－股數年變化） 4.5%、本益比 20.1 倍；只給比值，不作判斷，非買賣建議）&lt;/span&gt;。三情境並列，只描述，條件式推算，非買賣建議。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;!--新圖表--&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;缺口判斷影響幅度&lt;/h3&gt;&lt;div class=&quot;wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;市價隱含第 10 年倍數（倍）：基準折現率下市價隱含 14.9 倍、模型 11.6 倍（約 1.3 倍差距）；參考帶 p25–p75 7.8–27.6 倍（機械回測樣本，非市場全體；分產業的筆數與公司數少，僅供參考）。只描述，不進評等、不是目標價（估值結果.json#/market_implied_terminal）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 620 242&quot; role=&quot;img&quot; aria-label=&quot;市價隱含第 10 年倍數&quot; class=&quot;chart&quot; style=&quot;max-width:775px&quot;&gt;&lt;line x1=&quot;252.0&quot; x2=&quot;252.0&quot; y1=&quot;22&quot; y2=&quot;216&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;252.0&quot; y=&quot;234&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;5&lt;/text&gt;&lt;line x1=&quot;319.6&quot; x2=&quot;319.6&quot; y1=&quot;22&quot; y2=&quot;216&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;319.6&quot; y=&quot;234&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;10&lt;/text&gt;&lt;line x1=&quot;387.2&quot; x2=&quot;387.2&quot; y1=&quot;22&quot; y2=&quot;216&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;387.2&quot; y=&quot;234&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;15&lt;/text&gt;&lt;line x1=&quot;454.8&quot; x2=&quot;454.8&quot; y1=&quot;22&quot; y2=&quot;216&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;454.8&quot; y=&quot;234&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;20&lt;/text&gt;&lt;line x1=&quot;522.4&quot; x2=&quot;522.4&quot; y1=&quot;22&quot; y2=&quot;216&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;522.4&quot; y=&quot;234&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;25&lt;/text&gt;&lt;line x1=&quot;590.0&quot; x2=&quot;590.0&quot; y1=&quot;22
