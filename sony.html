ot; text-anchor=&quot;end&quot;&gt;參考帶（跨產業）&lt;/text&gt;&lt;rect x=&quot;289.9&quot; y=&quot;174.0&quot; width=&quot;267.7&quot; height=&quot;22&quot; rx=&quot;4&quot; fill=&quot;var(--c7)&quot; opacity=&quot;.28&quot;&gt;&lt;title&gt;p25–p75：8–28&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;289.9&quot; y=&quot;211.0&quot; class=&quot;ax&quot; text-anchor=&quot;start&quot;&gt;p25–p75 8–28&lt;/text&gt;&lt;circle cx=&quot;394.0&quot; cy=&quot;185.0&quot; r=&quot;6&quot; fill=&quot;var(--c7)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;1.5&quot;&gt;&lt;title&gt;中位：16&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;394.0&quot; y=&quot;171.0&quot; class=&quot;val&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--c7)&quot;&gt;中位 16&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;缺口判斷影響幅度：拿掉各項作者判斷、其他不變時，合理價值中點的變動（計算核對.json，2026-11-13）；紅色為過門檻（中點±10%或價格位置跨界或生意等級理由），6 項中 1 項過門檻；虛線為 ±10%。正值＝拿掉後中點變高&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 252&quot; role=&quot;img&quot; aria-label=&quot;缺口判斷影響幅度&quot; class=&quot;chart&quot; style=&quot;max-width:700px&quot;&gt;&lt;line x1=&quot;388.0&quot; x2=&quot;388.0&quot; y1=&quot;6&quot; y2=&quot;246&quot; class=&quot;zero&quot;/&gt;&lt;line x1=&quot;297.7&quot; x2=&quot;297.7&quot; y1=&quot;4&quot; y2=&quot;248&quot; class=&quot;price&quot;/&gt;&lt;line x1=&quot;478.3&quot; x2=&quot;478.3&quot; y1=&quot;4&quot; y2=&quot;248&quot; class=&quot;price&quot;/&gt;&lt;text x=&quot;266&quot; y=&quot;25&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;1. 近四季基期與匯率口徑&lt;/text&gt;&lt;rect x=&quot;388.0&quot; y=&quot;11&quot; width=&quot;7.2&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--neg)&quot;/&gt;&lt;text x=&quot;403.2&quot; y=&quot;25&quot; class=&quot;val&quot;&gt;+0.8%&lt;/text&gt;&lt;text x=&quot;266&quot; y=&quot;63&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;2. 有息負債口徑&lt;/text&gt;&lt;rect x=&quot;388.0&quot; y=&quot;49&quot; width=&quot;42.5&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;438.5&quot; y=&quot;63&quot; class=&quot;val&quot;&gt;+4.7%&lt;/text&gt;&lt;text x=&quot;266&quot; y=&quot;101&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;3. 其他請求權：非控制權益＋確定福利…&lt;/text&gt;&lt;rect x=&quot;388.0&quot; y=&quot;87&quot; width=&quot;24.4&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;420.4&quot; y=&quot;101&quot; class=&quot;val&quot;&gt;+2.7%&lt;/text&gt;&lt;text x=&quot;266&quot; y=&quot;139&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;4. 有價證券與權益法投資不加回&lt;/text&gt;&lt;rect x=&quot;388.0&quot; y=&quot;125&quot; width=&quot;54.2&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;450.2&quot; y=&quot;139&quot; class=&quot;val&quot;&gt;+6.0%&lt;/text&gt;&lt;text x=&quot;266&quot; y=&quot;177&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;5. 股數用 2026-09-30 流…&lt;/text&gt;&lt;rect x=&quot;388.0&quot; y=&quot;163&quot; width=&quot;6.3&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;402.3&quot; y=&quot;177&quot; class=&quot;val&quot;&gt;+0.7%&lt;/text&gt;&lt;text x=&quot;266&quot; y=&quot;215&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;6. 上一財年 EPS 用持續營運口徑&lt;/text&gt;&lt;rect x=&quot;388.0&quot; y=&quot;201&quot; width=&quot;2.0&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;396.0&quot; y=&quot;215&quot; class=&quot;val&quot;&gt;+0.0%&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;/div&gt;&lt;!--/新圖表--&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;合理價值怎麼來：三個情境與權重&lt;/h3&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt&quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;每股價值（基準折現率 8.1%）&lt;/th&gt;&lt;th&gt;權重&lt;/th&gt;&lt;th&gt;折現率高端 8.9%&lt;/th&gt;&lt;th&gt;折現率低端 7.3%&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;13.23&lt;/td&gt;&lt;td&gt;25%&lt;/td&gt;&lt;td&gt;11.70&lt;/td&gt;&lt;td&gt;15.06&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;22.91&lt;/td&gt;&lt;td&gt;50%&lt;/td&gt;&lt;td&gt;19.60&lt;/td&gt;&lt;td&gt;26.97&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;37.27&lt;/td&gt;&lt;td&gt;25%&lt;/td&gt;&lt;td&gt;31.09&lt;/td&gt;&lt;td&gt;45.13&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;加權（合理價值）&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;b&gt;24.08&lt;/b&gt;&lt;/td&gt;&lt;td&gt;100%&lt;/td&gt;&lt;td&gt;&lt;b&gt;20.50&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;b&gt;28.53&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;中點是三個情境的加權：0.25×13.23＋0.5×22.91＋0.25×37.27≈24.08（一般權重組合）。區間上下緣是同樣三個情境、權重不變，只把折現率換成區間高端或低端重算後加權：高端約 8.9% → 20.50（下緣），低端約 7.3% → 28.53（上緣）。買入區上緣 14.45＝中點 × (1－安全邊際 40%，不確定性高)，股價在此以下才有 40% 安全邊際。情境表說明合理價值怎麼組成，不是單一目標價；非買賣建議。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;市價隱含第 10 年倍數（只描述，不進評等）&lt;/h3&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;基準情境：市價隱含 vs 模型假設的第 10 年 EV/EBIT（金額百萬美元）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;折現率&lt;/th&gt;&lt;th&gt;WACC&lt;/th&gt;&lt;th&gt;市場 EV&lt;/th&gt;&lt;th&gt;明示期現值&lt;/th&gt;&lt;th&gt;終值折現因子&lt;/th&gt;&lt;th&gt;第 10 年 EBIT&lt;/th&gt;&lt;th&gt;市價隱含倍數&lt;/th&gt;&lt;th&gt;模型終值倍數&lt;/th&gt;&lt;th&gt;隱含÷模型&lt;/th&gt;&lt;th&gt;現在 EV／次年 EBIT&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;低折現率&lt;/td&gt;&lt;td&gt;7.33%&lt;/td&gt;&lt;td&gt;163,247&lt;/td&gt;&lt;td&gt;55,998&lt;/td&gt;&lt;td&gt;0.493&lt;/td&gt;&lt;td&gt;15,970&lt;/td&gt;&lt;td&gt;13.6 倍&lt;/td&gt;&lt;td&gt;13.5 倍&lt;/td&gt;&lt;td&gt;1.01&lt;/td&gt;&lt;td&gt;14.0 倍&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;8.08%&lt;/td&gt;&lt;td&gt;163,247&lt;/td&gt;&lt;td&gt;54,005&lt;/td&gt;&lt;td&gt;0.460&lt;/td&gt;&lt;td&gt;15,970&lt;/td&gt;&lt;td&gt;14.9 倍&lt;/td&gt;&lt;td&gt;11.6 倍&lt;/td&gt;&lt;td&gt;1.29&lt;/td&gt;&lt;td&gt;14.0 倍&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;高折現率&lt;/td&gt;&lt;td&gt;8.91%&lt;/td&gt;&lt;td&gt;163,247&lt;/td&gt;&lt;td&gt;51,910&lt;/td&gt;&lt;td&gt;0.426&lt;/td&gt;&lt;td&gt;15,970&lt;/td&gt;&lt;td&gt;16.4 倍&lt;/td&gt;&lt;td&gt;9.9 倍&lt;/td&gt;&lt;td&gt;1.65&lt;/td&gt;&lt;td&gt;14.0 倍&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;算式：市場 EV＝模型 EV +（現價 − 模型每股價值）× 股數（股權橋與模型相同）；隱含倍數＝（市場 EV − 明示期現值）÷ 終值折現因子 ÷ 第 10 年 EBIT；模型終值倍數＝模型終值 ÷ 第 10 年 EBIT。參考帶：p25 7.8、中位 15.5、p75 27.6、p90 42.7 倍（機械回測樣本，非市場全體；分產業的筆數與公司數少，僅供參考；機械回測訓練期 2016–2021 全部回測日（審查工作區 回測資料/隱含倍數結果.json，1,810 筆中訓練期 1,046 筆；產業＝回測樣本的 Damodaran 產業）；重算：python3 程式/回測_隱含倍數參考帶.py &amp;lt;隱含倍數結果.json&amp;gt;）。只描述，不進價格位置、研究評等與合理價值。&lt;/p&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;&lt;b&gt;合理價值 vs 市價隱含倍數（作者判讀）：&lt;/b&gt;市價隱含第 10 年 EV/EBIT 約 14.9 倍，比模型終值倍數 11.6 倍 高（比值 1.29），但低於跨產業參考帶中位 15.5 倍；市價要求的倍數不算罕見，只描述，不當評等理由。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;如果 10 年後倍數是 15.5 倍，機率加權每股約 29 美元（條件式，非目標價、非買賣建議，不進評等）&lt;/h3&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;第 10 年 EV/EBIT 倍數對照（三情境各用自己的明示期 FCFF 與第 10 年 EBIT；權重 一般：保守 25%／基準 50%／樂觀 25%；基準 WACC 8.08%）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;第 10 年倍數&lt;/th&gt;&lt;th&gt;機率加權每股（美元）&lt;/th&gt;&lt;th&gt;折現率低高區間&lt;/th&gt;&lt;th&gt;白話換算&lt;/th&gt;&lt;th&gt;現價相對&lt;/th&gt;&lt;th&gt;說明&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;模型假設倍數&lt;/td&gt;&lt;td&gt;11.6 倍&lt;/td&gt;&lt;td&gt;24.08&lt;/td&gt;&lt;td&gt;20.50–28.53&lt;/td&gt;&lt;td&gt;等於折現率減永續成長約 5.1%（模型 5.1%）&lt;/td&gt;&lt;td&gt;現價在區間內&lt;/td&gt;&lt;td&gt;各情境用自己的模型終值倍數（表列為基準情境）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;穩態理論上限&lt;/td&gt;&lt;td&gt;15.0 倍&lt;/td&gt;&lt;td&gt;28.74&lt;/td&gt;&lt;td&gt;26.89–30.54&lt;/td&gt;&lt;td&gt;等於折現率減永續成長約 3.9%（模型 5.1%）&lt;/td&gt;&lt;td&gt;現價在區間內&lt;/td&gt;&lt;td&gt;（1−t）（1+g）÷（WACC−g）：再投資為零（ROIC 無限大）時的上限；t＝第 10 年 1−NOPAT÷EBIT&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;參考帶中位（跨產業）&lt;/td&gt;&lt;td&gt;15.5 倍&lt;/td&gt;&lt;td&gt;29.39&lt;/td&gt;&lt;td&gt;27.49–31.23&lt;/td&gt;&lt;td&gt;等於折現率減永續成長約 3.8%（模型 5.1%）&lt;/td&gt;&lt;td&gt;現價低於區間&lt;/td&gt;&lt;td&gt;所選參考帶（跨產業）中位&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;同業今日 EV/EBIT 中位&lt;/td&gt;&lt;td&gt;18.2 倍&lt;/td&gt;&lt;td&gt;33.02&lt;/td&gt;&lt;td&gt;30.85–35.12&lt;/td&gt;&lt;td&gt;等於折現率減永續成長約 3.2%（模型 5.1%）&lt;/td&gt;&lt;td&gt;現價低於區間&lt;/td&gt;&lt;td&gt;估值結果 multiples.ev_ebit.peer_quartiles.p50（今天的倍數，不是 10 年後）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;參考帶 p75（跨產業）&lt;/td&gt;&lt;td&gt;27.6 倍&lt;/td&gt;&lt;td&gt;45.58&lt;/td&gt;&lt;td&gt;42.48–48.59&lt;/td&gt;&lt;td&gt;等於折現率減永續成長約 2.1%（模型 5.1%）&lt;/td&gt;&lt;td&gt;現價低於區間&lt;/td&gt;&lt;td&gt;所選參考帶（跨產業）p75&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;市價隱含&lt;/td&gt;&lt;td&gt;14.9 倍&lt;/td&gt;&lt;td&gt;28.55&lt;/td&gt;&lt;td&gt;26.71–30.33&lt;/td&gt;&lt;td&gt;等於折現率減永續成長約 3.9%（模型 5.1%）&lt;/td&gt;&lt;td&gt;現價在區間內&lt;/td&gt;&lt;td&gt;基準情境、基準折現率反推（只用基準情境，套到三情境後加權不必等於現價）&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;如果 10 年後倍數是 X，三情境各用自己的明示期 FCFF 與第 10 年 EBIT、以基準折現率折現，依政策情境機率權重加權的每股價值；區間只換折現率（①模型列為合理價值區間）。「折現率減永續成長」＝(1+g)(1−t)(1−g/ROIC)÷倍數（基準情境永續參數）。條件式，非目標價、非買賣建議，不進評等。模型假設倍數那一列等於合理價值（中點 24.08）。&lt;/p&gt;&lt;/div&gt;&lt;!--成長型價格參考--&gt;&lt;div class=&quot;block&quot; id=&quot;growth-ref&quot;&gt;&lt;h3&gt;成長型價格參考：報酬門檻價、五年報酬矩陣、林區比值（只描述，不進評等，非買賣建議）&lt;/h3&gt;&lt;p class=&quot;cap&quot;&gt;這一段只描述，不進研究評等、不改價格位置，也不是目標價；三種情境並列、不合成單一數字，數字是「該情境成真時」的條件式推算，不是預期報酬。非買賣建議。&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;一、報酬門檻價：收盤 2026-11-13 股價 27.07 美元（三情境並列；條件式推算，非目標價）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;年報酬 7% 的每股價格（美元）&lt;/th&gt;&lt;th&gt;年報酬 8% 的每股價格（美元）&lt;/th&gt;&lt;th&gt;年報酬 9% 的每股價格（美元）&lt;/th&gt;&lt;th&gt;年報酬 10% 的每股價格（美元）&lt;/th&gt;&lt;th&gt;現價隱含年報酬&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;16.04&lt;/td&gt;&lt;td&gt;13.40&lt;/td&gt;&lt;td&gt;11.55&lt;/td&gt;&lt;td&gt;10.18&lt;/td&gt;&lt;td&gt;5.0%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;29.23&lt;/td&gt;&lt;td&gt;23.27&lt;/td&gt;&lt;td&gt;19.29&lt;/td&gt;&lt;td&gt;16.45&lt;/td&gt;&lt;td&gt;7.3%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;49.62&lt;/td&gt;&lt;td&gt;37.94&lt;/td&gt;&lt;td&gt;30.52&lt;/td&gt;&lt;td&gt;25.39&lt;/td&gt;&lt;td&gt;9.6%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;算法：各情境的 10 年現金流與終值改用門檻當折現率，經同一股權橋換成每股；股價等於這個價格時，該情境成真的現價隱含年報酬就等於門檻（兩者互為反函數）。&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;二、五年報酬矩陣：現價買進、持有 5 年的年化報酬（三情境 × 三種第 5 年倍數；推導，條件式，非預期報酬）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;第 5 年 EBIT（估值輸入單位，推導）&lt;/th&gt;&lt;th&gt;維持現在 14.5 倍&lt;/th&gt;&lt;th&gt;縮四分之一 10.9 倍&lt;/th&gt;&lt;th&gt;回到參考帶中位（跨產業） 15.5 倍&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;8,154.3&lt;/td&gt;&lt;td&gt;-1.4%&lt;/td&gt;&lt;td&gt;-6.2%&lt;/td&gt;&lt;td&gt;-0.3%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;14,011.9&lt;/td&gt;&lt;td&gt;8.7%&lt;/td&gt;&lt;td&gt;3.3%&lt;/td&gt;&lt;td&gt;9.9%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;21,451.5&lt;/td&gt;&lt;td&gt;17.3%&lt;/td&gt;&lt;td&gt;11.4%&lt;/td&gt;&lt;td&gt;18.7%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;算法：現價買進、持有 5 年：第 1–5 年自由現金流與第 5 年企業價值（倍數 × 該情境第 5 年 EBIT）折回今天、經今日股權橋與股數換成每股，解出使每股等於現價的年報酬（與現價隱含年報酬同一算法，只是第 5 年改用倍數計價）；不另估 5 年後的淨債務與股數。企業價值 ÷ 當年 EBIT 口徑與市價隱含第 10 年倍數、參考帶相同。推導。現在倍數＝市場企業價值 163,247.5 ÷ 近四季營業利益 11,233.1（估值輸入 company_metrics.ebit）＝14.5 倍；縮四分之一＝現在倍數 × 0.75。參考帶：跨產業層「跨產業」中位 15.5 倍（機械回測樣本，非市場全體；分產業的筆數與公司數少，僅供參考）。&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;三、林區比值（只給比值與口徑；成長率與本益比的口徑同「PEG 與林區檢查」表的基準情境推估那一列）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;數值&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;林區分類&lt;/td&gt;&lt;td&gt;穩定成長&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;成長率（基準情境推估（稅後營業利益年增－股數年變化））&lt;/td&gt;&lt;td&gt;4.5%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;本益比&lt;/td&gt;&lt;td&gt;20.1 倍&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股息殖利率&lt;/td&gt;&lt;td&gt;0.6%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;本益比 ÷ 成長率&lt;/td&gt;&lt;td&gt;4.44&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;（成長率＋股息殖利率）÷ 本益比&lt;/td&gt;&lt;td&gt;0.25&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;林區以本益比約等於成長率為參考（二手來源轉述）；本表不設門檻。只給比值與口徑，不作便宜或昂貴的判斷，不進研究評等與價格位置。非買賣建議。&lt;/p&gt;&lt;/div&gt;&lt;!--/成長型價格參考--&gt;&lt;div class=&quot;note-box&quot;&gt;&lt;b&gt;同業與歷史倍數交叉核對（不進評等）：33–46 美元&lt;/b&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;依同業的本益比、企業價值／營業利益倍數換算的每股價值，各法 25 百分位的中位數到 75 百分位的中位數；不是股價波動範圍，也不是合理價值。原稱「市場情緒區間」；2026-11-11 起只作交叉核對，不決定價格位置與研究評等（價格位置三級：買入區、合理、偏貴，只看買入區上緣與合理價值高端）。同業僅 3 家，分位僅供參考。&lt;/p&gt;&lt;/div&gt;&lt;!--目標區間:第五題--&gt;&lt;div class=&quot;block&quot; id=&quot;target-body&quot;&gt;&lt;h3&gt;12 個月條件式目標區間：三種情境各自成真時的價值（條件式、非買賣建議）&lt;/h3&gt;&lt;p class=&quot;cap&quot;&gt;條件式目標區間：三種情境各自成真時的每股價值區間，不是股價預測，三段不合成單一數字；非買賣建議。不影響合理價值、價格位置與研究評等。&lt;/p&gt;&lt;p&gt;算法：各情境每股價值（折現率高低兩端）×（1＋股權成本 8.38%）− 未來 12 個月每股股利 0.15 美元（近四季實際每股股利 ＝ 價值判斷.json 股利殖利率 0.5647% × 現價 27.07（推導））；回購不加回。起點 2026-11-13 收盤，終點 2027-11-13。三段是各情境在折現率上下兩端的每股價值向前推 12 個月，不是價格機率分布的切片；段與段之間可能有空白，也可能重疊。區間主要寬度來自折現率不確定，不是 12 個月內的營運變化。&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt&quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;機率（政策權重，未經歷史校準）&lt;/th&gt;&lt;th&gt;目標區間（美元）&lt;/th&gt;&lt;th&gt;相對現價&lt;/th&gt;&lt;th&gt;關鍵假設（估值輸入）&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;25%&lt;/td&gt;&lt;td&gt;&lt;b&gt;12.52–16.17&lt;/b&gt;&lt;/td&gt;&lt;td&gt;−54%～−40%&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;第 1 年營收 -6.0%；營業利益率 12.5%；穩態 10.5%；永續成長 2.5%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;50%&lt;/td&gt;&lt;td&gt;&lt;b&gt;21.09–29.08&lt;/b&gt;&lt;/td&gt;&lt;td&gt;−22%～+7%&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;第 1 年營收 +3.0%；營業利益率 13.8%；穩態 13.5%；永續成長 3.0%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;25%&lt;/td&gt;&lt;td&gt;&lt;b&gt;33.54–48.76&lt;/b&gt;&lt;/td&gt;&lt;td&gt;+24%～+80%&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;第 1 年營收 +10.0%；營業利益率 14.5%；穩態 16.5%；永續成長 3.5%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;口徑：報告中「現價隱含年報酬（基準情境，非預期報酬）約 7.3%」是以現價買進、持有該情境全期現金流（含永續價值）的年化報酬；這裡的目標區間是 12 個月後各情境每股價值的前推，兩者口徑不同，不能互相換算（例如不能用前者推 12 個月後的價格）。&lt;/p&gt;&lt;h4 style=&quot;margin-top:14px&quot;&gt;每一段要成立，市場這一面需要什麼、正在顯示什麼&lt;/h4&gt;&lt;ul class=&quot;prose&quot;&gt;&lt;li&gt;以 2028-01-21 到期選擇權的價平隱含波動 35.0%（2026-11-14 08:15 UTC 取得；最近成交 2026-11-13，不在取得當天；取價時現價 27.07，起點價 27.07 為 2026-11-13 收盤）定價，12 個月後（2027-11-13）價格落在保守段 6.2%、基準段 35%、樂觀段 21%；低於最低端（12.52） 1.6%、高於最高端（48.76） 4.1%、段與段之間空白 32%、段與段重疊 0.0%。這是風險中立機率，不是真實機率；不改情境權重、不改估值與評等；選擇權定價含風險溢酬與波動偏態，與三段情境機率是兩回事。&lt;/li&gt;&lt;li&gt;公債殖利率下降 1 個百分點時，保守／基準／樂觀段代表值（基準折現率前推，不是區間兩端的平均）為 16.6／30.1／50.8；目前 14.2／24.7／40.2；上升 1 個百分點時為 12.5／21.0／33.2（美元，股權成本同幅變動，其他假設不變）。&lt;/li&gt;&lt;li&gt;分析師預估：本財年每股盈餘預估 1.52，較 30 天前 1.42 +7.1%（上修），近 30 天 2 家上修、0 家下修；下一財年每股盈餘預估 1.49，較 30 天前 1.43 +3.7%（上修），近 30 天 2 家上修、0 家下修。只描述預估修正的方向，不當證據，也不是目標區間的任一端。&lt;/li&gt;&lt;li&gt;上季（Sep 2026，11/5/2026 公布）每股盈餘 0.48，共識預估 0.38，驚奇 26.32%（Nasdaq）；yfinance 另列 2026-09-30 實際 0.48481、預估 0.38、驚奇 +28.06%；兩個來源口徑可能不同（可能是調整後或一般會計準則），公司申報的每股盈餘可對照存檔 6-K 2026-11-05 財報新聞稿（本句未逐項比對），只描述、不當證據。&lt;/li&gt;&lt;/ul&gt;&lt;p class=&quot;cap&quot;&gt;以上只引用已存檔的數字描述條件與現況，不是預測；選擇權機率是風險中立機率、不是真實機率，不改情境權重；分析師預估與券商目標價不當證據；細節表在附錄估值細節。&lt;/p&gt;&lt;ul class=&quot;cap&quot;&gt;&lt;li&gt;不列倍數核對：市場資料/市場給價.json 只有 824 位元組，標示不適用（SEC 季資料或日線不足，無法計算自身倍數歷史）。&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;!--/目標區間:第五題--&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;市價要求的成長：三視角反推、假設對照實績、歷史基準比率與市價溢價來源&lt;/h3&gt;&lt;p&gt;這一節把現價代回估值模型反解「市場要求什麼」，再和公司實績、同規模公司的歷史比例、市場面的過熱訊號對照；只揭露，不改合理價值、價格位置與研究評等。&lt;/p&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;市價隱含什麼、我們假設什麼、公司做到什麼&lt;/h4&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;視角（其他假設照基準，三者擇一）&lt;/th&gt;&lt;th&gt;市價隱含&lt;/th&gt;&lt;th&gt;本報告基準&lt;/th&gt;&lt;th&gt;實績或對照&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;成長&lt;/td&gt;&lt;td&gt;第 1–5 年營收每年約 8.0%&lt;/td&gt;&lt;td&gt;第 1–5 年平均約 4.0%（推算）&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;利潤率&lt;/td&gt;&lt;td&gt;第 1 年起每年（含穩態）營業利益率約 15.8%&lt;/td&gt;&lt;td&gt;第 1 年 13.8%、穩態 13.5%&lt;/td&gt;&lt;td&gt;9.28%–12.1%（近 5 年營業利益率）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;折現率&lt;/td&gt;&lt;td&gt;約 7.3%（使基準情境等於現價的折現率）&lt;/td&gt;&lt;td&gt;加權資本成本 8.1%&lt;/td&gt;&lt;td&gt;10 年期公債 5.15%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;市價隱含折現率約 7.3%，與加權資本成本 8.1% 相差不到 1 個百分點：照基準情境假設，現價大致反映本報告採用的資金成本。隱含折現率不是預期報酬；V3 回測（2016–2025，含倖存者偏誤）中，之後一年實際報酬中位多高於隱含值。只揭露，不改研究評等與價格位置；非買賣建議。&lt;/p&gt;&lt;div style=&quot;margin-top:12px&quot;&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;第 1 年營收成長&lt;/th&gt;&lt;th&gt;穩態營業利益率&lt;/th&gt;&lt;th&gt;終端投入資本報酬率（ROIC）&lt;/th&gt;&lt;th&gt;永續成長&lt;/th&gt;&lt;th&gt;對照實績&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;-6.0%&lt;/td&gt;&lt;td&gt;10.5%&lt;/td&gt;&lt;td&gt;8.1%&lt;/td&gt;&lt;td&gt;2.5%&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;3.0%&lt;/td&gt;&lt;td&gt;13.5%&lt;/td&gt;&lt;td&gt;13.0%&lt;/td&gt;&lt;td&gt;3.0%&lt;/td&gt;&lt;td&gt;高於歷史上限（穩態利潤率）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;10.0%&lt;/td&gt;&lt;td&gt;16.5%&lt;/td&gt;&lt;td&gt;13.0%&lt;/td&gt;&lt;td&gt;3.5%&lt;/td&gt;&lt;td&gt;高於歷史上限（穩態利潤率）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;公司實績&lt;/td&gt;&lt;td&gt;未取得&lt;/td&gt;&lt;td&gt;近四季 11.6%；9.28%–12.1%（近 5 年營業利益率）&lt;/td&gt;&lt;td&gt;近四季未取得（財務指標無 ROIC_TTM）&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;p style=&quot;margin-top:8px&quot;&gt;&lt;b&gt;為何基準、樂觀情境的穩態利潤率高於歷史上限（作者說明）：&lt;/b&gt;樂觀穩態營業利益率 16.5% 高於 FY2022～近四季最高約 13.7%：FY2026 指引已隱含約 14.4%（1.87÷13.0 兆，6-K 2026-11-05#3 本文 §10，推導），樂觀再假設網路服務與音樂這類高利潤收入占比續升、感測器合資產能放量，屬情境假設、未經實績驗證。&lt;/p&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;市價隱含三視角：把現價代回基準情境，一次只放開一個假設反解（成長、利潤率、折現率），三者擇一成立即可，不是同時需要；折現率視角就是第四題「現價隱含年報酬（基準情境，非預期報酬）」。假設對照：終端 ROIC 低於近四季一半時標「保守於實績」，括號寫原因：產業上限、公司近五年中位上限或等於資金成本是估值框架的上限設定（估值政策），作者選值的理由在估值輸入，都不是資料錯誤；穩態利潤率高於歷史上限標「高於歷史上限」；利潤率仍在改善中的公司（轉型、規模擴張期），歷史上限不一定是天花板，標記只提醒讀者對照，不代表假設錯誤。出處：估值結果.json（reverse_dcf、implied_return、discount）、估值輸入.json（scenarios）、財務指標.json（ROIC_TTM）、產業指標.json（景氣正常化）、成長推估底稿.json 與財務歷史.json（近四季）；推導，只揭露，不改合理價值、價格位置與研究評等。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;市價隱含的成長與歷史基準比率&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;市價隱含 SONY 未來 10 年營收實質年增約 6.2%–6.7%（名目 8.7% 減通膨 2.0%–2.5% 的近似，推導）；1950–2015 年營收 500 億美元以上的公司中，10 年間做到實質年增 5% 以上的約 21.1%（Mauboussin 等，2016，表 4）。此為揭露，不是市價錯誤的證明。&lt;/p&gt;&lt;p&gt;把基準情境第 1 年營收成長 3.0% 延續 40 年，每股價值仍低於現價（推導；之後新投資報酬等於折現率）。&lt;/p&gt;&lt;p&gt;&lt;b&gt;隱含假設罕見度：樂觀&lt;/b&gt;（同規模公司 10 年做到的歷史比例 ≥50% 一般、10%–50% 樂觀、&amp;lt;10% 歷史罕見；只揭露，不改研究評等與價格位置）&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;超額報酬期間&lt;/th&gt;&lt;th&gt;市價隱含營收年增（名目）&lt;/th&gt;&lt;th&gt;約實質（名目減通膨 2.0%–2.5% 的近似，推導）&lt;/th&gt;&lt;th&gt;歷史基準比率（1950–2015）&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;10 年&lt;/td&gt;&lt;td&gt;8.7%&lt;/td&gt;&lt;td&gt;6.2%–6.7%&lt;/td&gt;&lt;td&gt;營收 500 億美元以上：10 年實質年增 5% 以上約 21.1%（該組 10 年實質年增中位數 1.1%）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;15 年&lt;/td&gt;&lt;td&gt;6.6%&lt;/td&gt;&lt;td&gt;4.1%–4.6%&lt;/td&gt;&lt;td&gt;原文只有 10 年分布，15、20 年無對照&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;20 年&lt;/td&gt;&lt;td&gt;5.6%&lt;/td&gt;&lt;td&gt;3.1%–3.6%&lt;/td&gt;&lt;td&gt;原文只有 10 年分布，15、20 年無對照&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;做法：超額報酬期間內營收年增固定、利潤率與銷售對資本比取基準情境第 5 年；期間結束後新投資報酬等於折現率（不再創造價值）；永續成長照基準情境。折現率 8.08%、第 5 年利潤率 14.0%。來源：Mauboussin, Callahan &amp;amp; Majd（2016）〈The Base Rate Book〉表 4（第三方轉載，原表 1950–2015 年、實質成長、有存活偏差）。這張表只說明「市價需要多強、多久的成長才成立」，不改合理價值、買入區上緣與價格位置；歷史比例低代表市價需要少見的結果，不代表市價錯誤。通膨假設 2.0%–2.5% 依 Morningstar 2020-10 方法，實質年增為名目直接減通膨的近似。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;市價溢價來源&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;現價未高於合理價值上緣，下表只描述市場面，不代表有溢價。溢價訊號集中在資金與情緒（動能、部位與衍生品、擁擠度）、基本面預期（隱含假設罕見度）。只揭露，不改研究評等與價格位置，也不代表市價錯誤。&lt;/p&gt;&lt;p&gt;EPS 預估：+1y（財年未對應） 預估 90 天 4.8%（上修；判斷窗口為 90 天，±2% 內視為持平），近 30 天上修減下修 2 家；yfinance 預估是取得當下快照，股價 90 天變化以批次收盤日為終點，兩者日期可能差幾天；取得 2026-11-14，晚於收盤日 2026-11-13。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;來源類別&lt;/th&gt;&lt;th&gt;數值&lt;/th&gt;&lt;th&gt;過熱訊號&lt;/th&gt;&lt;th&gt;說明／存檔位置&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;隱含假設罕見度&lt;/td&gt;&lt;td&gt;基本面預期&lt;/td&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;有&lt;/td&gt;&lt;td&gt;價值判斷.json#/市價隱含假設&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;倍數擴張&lt;/td&gt;&lt;td&gt;倍數重估&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;不適用&lt;/td&gt;&lt;td&gt;歷史本益比.json 沒有每日資料&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;預估背離&lt;/td&gt;&lt;td&gt;倍數重估&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;不適用&lt;/td&gt;&lt;td&gt;價值判斷.json#/預估修正&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;本益比水位&lt;/td&gt;&lt;td&gt;倍數重估&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;不適用&lt;/td&gt;&lt;td&gt;虧損或歷史不足，沒有本益比區間&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股債利差&lt;/td&gt;&lt;td&gt;總經與利率&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;不適用&lt;/td&gt;&lt;td&gt;市場資料/歷史本益比.json#/股債利差/近期百分位&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;整體市場風險溢價&lt;/td&gt;&lt;td&gt;總經與利率&lt;/td&gt;&lt;td&gt;Damodaran 隱含風險溢價 4.20%（2026-10-01）&lt;/td&gt;&lt;td&gt;不適用&lt;/td&gt;&lt;td&gt;只存當月值，沒有歷史序列可比中位數；要下載 Damodaran 歷史表需使用者同意&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;動能&lt;/td&gt;&lt;td&gt;資金與情緒&lt;/td&gt;&lt;td&gt;相對 200 日均線 +21%；12 個月（2025-11-12 起） -11% 對 S&amp;amp;P500 +12%&lt;/td&gt;&lt;td&gt;有&lt;/td&gt;&lt;td&gt;市場資料/市場溫度.json#/趨勢、#/動能&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;部位與衍生品&lt;/td&gt;&lt;td&gt;資金與情緒&lt;/td&gt;&lt;td&gt;選擇權賣權對買權量比 偏熱；空單分位 0%、回補天數分位 80%&lt;/td&gt;&lt;td&gt;有&lt;/td&gt;&lt;td&gt;市場資料/市場溫度.json#/選擇權情緒、#/流動性&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;擁擠度&lt;/td&gt;&lt;td&gt;資金與情緒&lt;/td&gt;&lt;td&gt;20 日均換手率在自身五年 77% 分位；被發現程度 低&lt;/td&gt;&lt;td&gt;有&lt;/td&gt;&lt;td&gt;市場資料/市場溫度.json#/流動性/20日均換手率_分位&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;門檻：使用者 2026-11-04 照草案核定（程式/市場溢價來源.py 常數）。各列只描述市場面，不改合理價值、研究評等與價格位置，非買賣建議。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;multiple-conditions&quot;&gt;&lt;h3&gt;長期倍數條件：要漲 3／5／10 倍需要什麼&lt;/h3&gt;&lt;p&gt;反過來問：股價要在 5 年或 10 年內每股漲到 3、5、10 倍，期末營收、利潤率、估值倍數要做到多少，歷史上同規模公司有多少做到過。&lt;b&gt;條件反推，非預測、非機率、非目標價、非買賣建議&lt;/b&gt;；不改研究評等、價格位置與目標區間。&lt;/p&gt;&lt;p class=&quot;cap&quot;&gt;主列＝產業倍數＋基準穩態利潤率；括號是三種期末倍數口徑（不重估、產業、自身本益比 p25）的範圍。股數年稀釋率 0.0%（推導）。罕見度：5 年用自有 SEC 名目分布、10 年用 Base Rate Book（1950–2015，實質）。&lt;/p&gt;&lt;ul&gt;&lt;li&gt;3 倍／5 年（產業倍數不適用，改列不重估口徑）：營收年增約 20.4%（其他期末倍數口徑不適用），歷史罕見（營收 500 億美元以上的公司 5 年約 2.2% 做到）；資金自足&lt;/li&gt;&lt;li&gt;3 倍／10 年（產業倍數不適用，改列不重估口徑）：營收年增約 9.7%（其他期末倍數口徑不適用），樂觀（營收 500 億美元以上的公司 10 年約 21.1% 做到）；資金自足&lt;/li&gt;&lt;li&gt;5 倍／5 年（產業倍數不適用，改列不重估口徑）：營收年增約 33.3%（其他期末倍數口徑不適用），歷史罕見（營收 500 億美元以上的公司 5 年約 0% 做到）；資金有缺口&lt;/li&gt;&lt;li&gt;5 倍／10 年（產業倍數不適用，改列不重估口徑）：營收年增約 15.4%（其他期末倍數口徑不適用），歷史罕見（營收 500 億美元以上的公司 10 年約 3.9% 做到）；資金自足&lt;/li&gt;&lt;li&gt;10 倍／5 年（產業倍數不適用，改列不重估口徑）：營收年增約 53.0%（其他期末倍數口徑不適用），歷史罕見（營收 500 億美元以上的公司 5 年約 0% 做到）；資金有缺口&lt;/li&gt;&lt;li&gt;10 倍／10 年（產業倍數不適用，改列不重估口徑）：營收年增約 23.7%（其他期末倍數口徑不適用），歷史罕見（營收 500 億美元以上的公司 10 年約 0% 做到）；資金有缺口&lt;/li&gt;&lt;/ul&gt;&lt;details&gt;&lt;summary&gt;全部格子&lt;/summary&gt;&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;倍數／期間&lt;/th&gt;&lt;th&gt;期末倍數口徑&lt;/th&gt;&lt;th&gt;利潤率口徑&lt;/th&gt;&lt;th&gt;需要營收年增&lt;/th&gt;&lt;th&gt;期末營收為現在&lt;/th&gt;&lt;th&gt;罕見度&lt;/th&gt;&lt;th&gt;資金&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;3 倍／5 年&lt;/td&gt;&lt;td&gt;不重估（22.9）&lt;/td&gt;&lt;td&gt;近四季（11.6%）&lt;/td&gt;&lt;td&gt;24.1%&lt;/td&gt;&lt;td&gt;2.9 倍&lt;/td&gt;&lt;td&gt;歷史罕見&lt;/td&gt;&lt;td&gt;有缺口&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;3 倍／5 年&lt;/td&gt;&lt;td&gt;不重估（22.9）&lt;/td&gt;&lt;td&gt;基準穩態（13.5%）&lt;/td&gt;&lt;td&gt;20.4%&lt;/td&gt;&lt;td&gt;2.5 倍&lt;/td&gt;&lt;td&gt;歷史罕見&lt;/td&gt;&lt;td&gt;自足&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;3 倍／10 年&lt;/td&gt;&lt;td&gt;不重估（22.9）&lt;/td&gt;&lt;td&gt;近四季（11.6%）&lt;/td&gt;&lt;td&gt;11.4%&lt;/td&gt;&lt;td&gt;2.9 倍&lt;/td&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;自足&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;3 倍／10 年&lt;/td&gt;&lt;td&gt;不重估（22.9）&lt;/td&gt;&lt;td&gt;基準穩態（13.5%）&lt;/td&gt;&lt;td&gt;9.7%&lt;/td&gt;&lt;td&gt;2.5 倍&lt;/td&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;自足&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;5 倍／5 年&lt;/td&gt;&lt;td&gt;不重估（22.9）&lt;/td&gt;&lt;td&gt;近四季（11.6%）&lt;/td&gt;&lt;td&gt;37.4%&lt;/td&gt;&lt;td&gt;4.9 倍&lt;/td&gt;&lt;td&gt;歷史罕見&lt;/td&gt;&lt;td&gt;有缺口&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;5 倍／5 年&lt;/td&gt;&lt;td&gt;不重估（22.9）&lt;/td&gt;&lt;td&gt;基準穩態（13.5%）&lt;/td&gt;&lt;td&gt;33.3%&lt;/td&gt;&lt;td&gt;4.2 倍&lt;/td&gt;&lt;td&gt;歷史罕見&lt;/td&gt;&lt;td&gt;有缺口&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;5 倍／10 年&lt;/td&gt;&lt;td&gt;不重估（22.9）&lt;/td&gt;&lt;td&gt;近四季（11.6%）&lt;/td&gt;&lt;td&gt;17.2%&lt;/td&gt;&lt;td&gt;4.9 倍&lt;/td&gt;&lt;td&gt;歷史罕見&lt;/td&gt;&lt;td&gt;自足&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;5 倍／10 年&lt;/td&gt;&lt;td&gt;不重估（22.9）&lt;/td&gt;&lt;td&gt;基準穩態（13.5%）&lt;/td&gt;&lt;td&gt;15.4%&lt;/td&gt;&lt;td&gt;4.2 倍&lt;/td&gt;&lt;td&gt;歷史罕見&lt;/td&gt;&lt;td&gt;自足&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;10 倍／5 年&lt;/td&gt;&lt;td&gt;不重估（22.9）&lt;/td&gt;&lt;td&gt;近四季（11.6%）&lt;/td&gt;&lt;td&gt;57.7%&lt;/td&gt;&lt;td&gt;9.8 倍&lt;/td&gt;&lt;td&gt;歷史罕見&lt;/td&gt;&lt;td&gt;有缺口&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;10 倍／5 年&lt;/td&gt;&lt;td&gt;不重估（22.9）&lt;/td&gt;&lt;td&gt;基準穩態（13.5%）&lt;/td&gt;&lt;td&gt;53.0%&lt;/td&gt;&lt;td&gt;8.4 倍&lt;/td&gt;&lt;td&gt;歷史罕見&lt;/td&gt;&lt;td&gt;有缺口&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;10 倍／10 年&lt;/td&gt;&lt;td&gt;不重估（22.9）&lt;/td&gt;&lt;td&gt;近四季（11.6%）&lt;/td&gt;&lt;td&gt;25.6%&lt;/td&gt;&lt;td&gt;9.8 倍&lt;/td&gt;&lt;td&gt;歷史罕見&lt;/td&gt;&lt;td&gt;有缺口&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;10 倍／10 年&lt;/td&gt;&lt;td&gt;不重估（22.9）&lt;/td&gt;&lt;td&gt;基準穩態（13.5%）&lt;/td&gt;&lt;td&gt;23.7%&lt;/td&gt;&lt;td&gt;8.4 倍&lt;/td&gt;&lt;td&gt;歷史罕見&lt;/td&gt;&lt;td&gt;有缺口&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/details&gt;&lt;p class=&quot;cap&quot;&gt;限制：&lt;/p&gt;&lt;ul class=&quot;cap&quot;&gt;&lt;li&gt;Base Rate Book 1950–2015、只含存續公司（存活偏差）；原表 10 年欄，5 年期待建立&lt;/li&gt;&lt;li&gt;非營業淨資產假設不變；資金缺口另列，不回頭改期末市值&lt;/li&gt;&lt;li&gt;均值回歸以本益比近似 EV÷稅後營業利益；產業倍數是 Damodaran 目前值，不是成熟期值&lt;/li&gt;&lt;li&gt;罕見度是歷史上多少公司做到，不是這家公司做到的機率&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;!--目標區間:附錄--&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;目標區間的企業價值前推核對&lt;/h3&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt&quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;股權成本前推（每股，折現率基準）&lt;/th&gt;&lt;th&gt;企業價值前推（每股）&lt;/th&gt;&lt;th&gt;相對差距&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;14.19&lt;/td&gt;&lt;td&gt;14.21&lt;/td&gt;&lt;td&gt;0.14%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;24.68&lt;/td&gt;&lt;td&gt;24.67&lt;/td&gt;&lt;td&gt;0.04%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;40.24&lt;/td&gt;&lt;td&gt;40.18&lt;/td&gt;&lt;td&gt;0.14%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;EV₀×（1＋WACC）−股權橋 與 每股價值×（1＋股權成本）的差；差距≥1% 只標註（槓桿較高時前者未計利息），不改目標區間。最大相對差距 0.14%（小於 1%）。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;約 12 個月選擇權隱含分布下，各段的風險中立機率&lt;/h3&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt&quot;&gt;&lt;tr&gt;&lt;th&gt;保守段&lt;/th&gt;&lt;th&gt;基準段&lt;/th&gt;&lt;th&gt;樂觀段&lt;/th&gt;&lt;th&gt;低於最低端&lt;/th&gt;&lt;th&gt;高於最高端&lt;/th&gt;&lt;th&gt;段與段空白&lt;/th&gt;&lt;th&gt;段與段重疊&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;6.2%&lt;/td&gt;&lt;td&gt;35%&lt;/td&gt;&lt;td&gt;21%&lt;/td&gt;&lt;td&gt;1.6%&lt;/td&gt;&lt;td&gt;4.1%&lt;/td&gt;&lt;td&gt;32%&lt;/td&gt;&lt;td&gt;0.0%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;風險中立機率，不是真實機率；不改情境權重、不改估值與評等。到期日 2028-01-21（離終點日 69 天）價平隱含波動 35.0%（買權 39%、賣權 31%），最近成交 2026-11-13 17:56:08+00:00（最近成交 2026-11-13，不在取得當天；取價時現價 27.07，起點價 27.07 為 2026-11-13 收盤）；無風險利率 4.65%（FRED DGS1，2026-11-12 觀測 4.65%，資料庫/利率_FRED.json）、股利率 0.56%；起點價格 27.07（2026-11-13 收盤）。對數常態；漂移＝無風險利率（固定用 1 年期 DGS1，期間固定 1 年，不依到期日做期限插補）−股利率；波動＝價平隱含波動（不含波動微笑與偏態）；以批次收盤價為起點、12 個月為期間。各段機率是價格落在該段價值區間內的機率，段與段重疊處在各段機率中重複計入。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;預估修正趨勢（只描述，不當證據）&lt;/h3&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt&quot;&gt;&lt;tr&gt;&lt;th&gt;期間&lt;/th&gt;&lt;th&gt;每股盈餘預估&lt;/th&gt;&lt;th&gt;7 天前&lt;/th&gt;&lt;th&gt;30 天前&lt;/th&gt;&lt;th&gt;60 天前&lt;/th&gt;&lt;th&gt;90 天前&lt;/th&gt;&lt;th&gt;較 30 天前&lt;/th&gt;&lt;th&gt;近 7 天上修／下修家數&lt;/th&gt;&lt;th&gt;近 30 天上修／下修家數&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;本季&lt;/td&gt;&lt;td&gt;0.39&lt;/td&gt;&lt;td&gt;0.40&lt;/td&gt;&lt;td&gt;0.41&lt;/td&gt;&lt;td&gt;0.42&lt;/td&gt;&lt;td&gt;0.42&lt;/td&gt;&lt;td&gt;下修&lt;/td&gt;&lt;td&gt;0／1&lt;/td&gt;&lt;td&gt;0／1&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;下一季&lt;/td&gt;&lt;td&gt;0.23&lt;/td&gt;&lt;td&gt;0.23&lt;/td&gt;&lt;td&gt;0.26&lt;/td&gt;&lt;td&gt;0.25&lt;/td&gt;&lt;td&gt;0.25&lt;/td&gt;&lt;td&gt;下修&lt;/td&gt;&lt;td&gt;0／1&lt;/td&gt;&lt;td&gt;0／1&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;本財年&lt;/td&gt;&lt;td&gt;1.52&lt;/td&gt;&lt;td&gt;1.50&lt;/td&gt;&lt;td&gt;1.42&lt;/td&gt;&lt;td&gt;1.36&lt;/td&gt;&lt;td&gt;1.37&lt;/td&gt;&lt;td&gt;上修&lt;/td&gt;&lt;td&gt;1／0&lt;/td&gt;&lt;td&gt;2／0&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;下一財年&lt;/td&gt;&lt;td&gt;1.49&lt;/td&gt;&lt;td&gt;1.47&lt;/td&gt;&lt;td&gt;1.43&lt;/td&gt;&lt;td&gt;1.41&lt;/td&gt;&lt;td&gt;1.42&lt;/td&gt;&lt;td&gt;上修&lt;/td&gt;&lt;td&gt;2／0&lt;/td&gt;&lt;td&gt;2／0&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;分析師預估與券商目標價只描述，不當證據，也不是目標區間任一端；上修／下修門檻為較 30 天前變動 ±1%（本工具設定；與「市價溢價來源」預估修正以 90 天 ±2% 判持平是兩個口徑）。資料取得 2026-11-14T15:55:38（台北時間）（yfinance eps_trend、eps_revisions）。上季財報驚奇（Nasdaq）：Sep 2026，11/5/2026 公布，每股盈餘 0.48、共識 0.38、驚奇 26.32%；（yfinance）：2026-09-30，實際 0.48481、預估 0.37859。兩個來源口徑可能不同（可能是調整後或一般會計準則）；公司申報的每股盈餘可對照存檔 6-K 2026-11-05 財報新聞稿（事件/8K事件.json），本工具未逐項比對，只描述，不比較、不當證據。每批另存快照自建歷史：1 筆（2026-11-14 至 2026-11-14）。&lt;/p&gt;&lt;/div&gt;&lt;!--/目標區間:附錄--&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;估值方法與參數&lt;/h3&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;方法&lt;/th&gt;&lt;th&gt;低&lt;/th&gt;&lt;th&gt;中&lt;/th&gt;&lt;th&gt;高&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;DCF 保守&lt;/td&gt;&lt;td&gt;12&lt;/td&gt;&lt;td&gt;13&lt;/td&gt;&lt;td&gt;15&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;DCF 基準&lt;/td&gt;&lt;td&gt;20&lt;/td&gt;&lt;td&gt;23&lt;/td&gt;&lt;td&gt;27&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;DCF 樂觀&lt;/td&gt;&lt;td&gt;31&lt;/td&gt;&lt;td&gt;37&lt;/td&gt;&lt;td&gt;45&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;同業本益比&lt;/td&gt;&lt;td&gt;34&lt;/td&gt;&lt;td&gt;35&lt;/td&gt;&lt;td&gt;44&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;同業企業價值／營業利益&lt;/td&gt;&lt;td&gt;33&lt;/td&gt;&lt;td&gt;34&lt;/td&gt;&lt;td&gt;48&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p style=&quot;font-size:14px&quot;&gt;折現率基準 8.1%（區間 7.3%–8.9%）：無風險利率 5.15%、市場風險溢價 4.20%、beta 0.77。DCF 為 10 年：前 5 年依情境，後 5 年成長與利潤率逐步回到永續水準。&lt;/p&gt;&lt;p style=&quot;font-size:14px&quot;&gt;同業：DIS（電影、電視與媒體網路，對應 Pictures 分部；含主題樂園，不完全可比）, WMG（錄製音樂與版權，對應 Music 分部）, AAPL（消費硬體平台＋服務，對應 G&amp;amp;NS 主機與 ET&amp;amp;S；規模與利潤率遠高於 Sony，只作參考；市值相差超過 10 倍，仍列入是因同屬「消費硬體＋平台服務」商業模式（主機、裝置帶動網路服務與內容收入），利潤結構可作參考，不單獨據以下結論）。排除：EA：F：市場快照無 2026-11-13 有效倍數（快照無租賃欄、無倍數），不列。&lt;/p&gt;&lt;p style=&quot;font-size:14px&quot;&gt;產業公版：穩定現金流／品牌消費與硬體／硬體平台；驗證狀態：待驗證（兩家，分屬兩個子型）；本公司尚未列入實例。首家產業，公版的估值法與指標選擇尚未經兩家以上驗證，審查與讀者請多看適用性。&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;details id=&quot;wp-value&quot;&gt;&lt;summary&gt;價值判斷：PEG、林區資產負債表檢查與交叉檢查&lt;/summary&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;PEG 與林區檢查&lt;/h3&gt;&lt;div class=&quot;wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;PEG：可計算的成長口徑（紅線為 1 與 2）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 500 102&quot; role=&quot;img&quot; aria-label=&quot;PEG&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;168.0&quot; x2=&quot;168.0&quot; y1=&quot;6&quot; y2=&quot;96&quot; class=&quot;zero&quot;/&gt;&lt;line x1=&quot;224.1&quot; x2=&quot;224.1&quot; y1=&quot;4&quot; y2=&quot;98&quot; class=&quot;price&quot;/&gt;&lt;line x1=&quot;280.1&quot; x2=&quot;280.1&quot; y1=&quot;4&quot; y2=&quot;98&quot; class=&quot;price&quot;/&gt;&lt;text x=&quot;158&quot; y=&quot;23&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;近四季對上一財年&lt;/text&gt;&lt;rect x=&quot;168.0&quot; y=&quot;9&quot; width=&quot;46.2&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;222.2&quot; y=&quot;23&quot; class=&quot;val&quot;&gt;0.8&lt;/text&gt;&lt;text x=&quot;158&quot; y=&quot;63&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;基準情境推估&lt;/text&gt;&lt;rect x=&quot;168.0&quot; y=&quot;49&quot; width=&quot;249.1&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;425.1&quot; y=&quot;63&quot; class=&quot;val&quot;&gt;4.4&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;PEG 與林區加股利比率（可計算的成長口徑）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;成長口徑&lt;/th&gt;&lt;th&gt;成長率&lt;/th&gt;&lt;th&gt;PEG&lt;/th&gt;&lt;th&gt;判讀&lt;/th&gt;&lt;th&gt;加股利比率&lt;/th&gt;&lt;th&gt;判讀&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;近四季對上一財年（扣非經常）&lt;/td&gt;&lt;td&gt;24.4%&lt;/td&gt;&lt;td&gt;0.8&lt;/td&gt;&lt;td&gt;便宜&lt;/td&gt;&lt;td&gt;1.24&lt;/td&gt;&lt;td&gt;普通&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準情境推估（稅後營業利益年增－股數年變化）&lt;/td&gt;&lt;td&gt;4.5%&lt;/td&gt;&lt;td&gt;4.4&lt;/td&gt;&lt;td&gt;偏貴&lt;/td&gt;&lt;td&gt;0.25&lt;/td&gt;&lt;td&gt;差&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:4px&quot;&gt;PEG 的判讀標籤依估值政策門檻；高風險、成長極高或極低的公司，PEG 有系統性偏誤（同樣成長下風險越高 PEG 越低），不能只憑標籤判斷便宜或昂貴。&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;林區式資產負債表與市場檢查&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;數值&lt;/th&gt;&lt;th&gt;林區的看法&lt;/th&gt;&lt;th&gt;判讀&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;本益比&lt;/td&gt;&lt;td&gt;20.08&lt;/td&gt;&lt;td&gt;與自身歷史比較&lt;/td&gt;&lt;td&gt;資料限制：扣非經常 EPS 為 20.1 倍；可比的正值申報 EPS 歷史不足，不計算歷史百分位&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;每股淨現金&lt;/td&gt;&lt;td&gt;1.25&lt;/td&gt;&lt;td&gt;淨現金可提供下檔保護（林區 O31、LAK02）&lt;/td&gt;&lt;td&gt;好：有淨現金，可提供下檔保護；占股價 4.6%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;負債對權益&lt;/td&gt;&lt;td&gt;0.13&lt;/td&gt;&lt;td&gt;一般越低越好（林區 L25）&lt;/td&gt;&lt;td&gt;不評好壞：有息負債約為股東權益的 0.13 倍；沒有公認門檻，償債能力見收現段償債指標&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;每股自由現金流（近四季）&lt;/td&gt;&lt;td&gt;未取得&lt;/td&gt;&lt;td&gt;比每股盈餘更接近現金（林區 O37、修正10）&lt;/td&gt;&lt;td&gt;不評好壞：自由現金流殖利率 0.0%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股數年變化（近三財年）&lt;/td&gt;&lt;td&gt;未取得&lt;/td&gt;&lt;td&gt;持續買回、且價格合理、資金來自本業現金時才是好訊號（林區 L16、O19）&lt;/td&gt;&lt;td&gt;資料限制：無資料&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;存貨增速 vs 營收增速&lt;/td&gt;&lt;td&gt;-6%&lt;/td&gt;&lt;td&gt;存貨增速高於營收是警訊（林區 O50）&lt;/td&gt;&lt;td&gt;不評好壞：存貨 -6%（2025-03-31→2026-03-31）；同期營收單季不齊，不比較&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;內部人公開市場買進&lt;/td&gt;&lt;td&gt;0&lt;/td&gt;&lt;td&gt;內部人自掏腰包買進是強訊號&lt;/td&gt;&lt;td&gt;中性：近期無人買進；賣出原因多，訊號較弱&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;林區以外的交叉檢查（只揭露，不改研究評等與價格位置）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;檢查&lt;/th&gt;&lt;th&gt;結果&lt;/th&gt;&lt;th&gt;判讀&lt;/th&gt;&lt;th&gt;依據與限制&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Piotroski F 分數（財報是否在改善）&lt;/td&gt;&lt;td&gt;5 ／ 7 項（2025-03-31→2026-03-31）&lt;/td&gt;&lt;td&gt;中&lt;/td&gt;&lt;td&gt;未通過：ROA＞0（淨利 ÷ 期初總資產）、ROA 比上年高。Piotroski（2000）研究文獻/Piotroski2000_財報訊號.json 第 9–11、15 頁；8–9 分高分組、0–2 分低分組&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Beneish M 分數（盈餘被美化的機率）&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;不適用&lt;/td&gt;&lt;td&gt;缺 應收、流動資產、流動負債&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Greenblatt 盈餘殖利率與資本報酬率&lt;/td&gt;&lt;td&gt;盈餘殖利率 6.3%&lt;/td&gt;&lt;td&gt;高於 10 年公債 5.1%&lt;/td&gt;&lt;td&gt;盈餘殖利率＝近四季營業利益 ÷（市值＋有息負債－現金與證券），推導；ROIC 為本專案稅後口徑，非 Greenblatt 原式稅前；不做排名；ROIC 不適用：營運投入資本為負（例如預收款或應付款大於營運資產），投資報酬率無意義，改看自由現金流與增量回報&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;details id=&quot;wp-6&quot;&gt;&lt;summary&gt;6 財務：償債指標、融資活動、存活檢查與利率壓力測試（含判定規則與限制）&lt;/summary&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;融資活動與償債：錢還給誰、有沒有借錢、還不還得起&lt;/h3&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;償債能力指標（利息保障依 Damodaran 合成評等對照；其他沒有公認門檻，只寫事實）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;指標&lt;/th&gt;&lt;th&gt;數值&lt;/th&gt;&lt;th&gt;判讀&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;EBIT ÷ 利息費用&lt;/td&gt;&lt;td&gt;未取得&lt;/td&gt;&lt;td&gt;資料限制：本業獲利能付幾倍利息無法計算（利息費用未取得：公司未單獨揭露或科目未對應）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;（營運現金流＋實付利息）÷ 實付利息&lt;/td&gt;&lt;td&gt;未取得&lt;/td&gt;&lt;td&gt;資料限制：用實際現金算的付息能力無法計算（實付利息未取得：附註未申報此項或科目未對應）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;有息負債 ÷ EBITDA&lt;/td&gt;&lt;td&gt;0.38&lt;/td&gt;&lt;td&gt;不評好壞：以近四季 EBITDA 174.7 億美元計，約 0.4 年可還清有息負債&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;淨負債 ÷ EBITDA&lt;/td&gt;&lt;td&gt;-0.42&lt;/td&gt;&lt;td&gt;不評好壞：現金多於有息負債（淨現金）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;營運現金流 ÷ 有息負債&lt;/td&gt;&lt;td&gt;197.4%&lt;/td&gt;&lt;td&gt;不評好壞：一年的營運現金流約可還掉 197% 的有息負債（約 0.5 年還清）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;現金與證券 ÷ 一年內到期債務&lt;/td&gt;&lt;td&gt;10.15&lt;/td&gt;&lt;td&gt;不評好壞：現金與證券是一年內到期債務的 10.2 倍（完整）&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;可用授信與到期（作者判讀，融資償債判讀.json）：未動用承諾授信 789.6 十億日圓，商業本票額度 1,299.3 十億日圓皆未動用；長債到期表工具未取得&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;融資活動現金流：還給股東與借還款（本財年年初至 2026-03-31 累計，20-F 2026-03-31）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;對象｜分類&lt;/th&gt;&lt;th&gt;金額&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股東｜回購&lt;/td&gt;&lt;td&gt;-34.7 億美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股東｜股利&lt;/td&gt;&lt;td&gt;-897.3 百萬美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股東小計&lt;/td&gt;&lt;td&gt;-43.7 億美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;債權人｜償還&lt;/td&gt;&lt;td&gt;-899.5 百萬美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;債權人｜借入&lt;/td&gt;&lt;td&gt;191.2 百萬美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;債權人小計&lt;/td&gt;&lt;td&gt;-708.3 百萬美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;其他｜其他（未歸類）&lt;/td&gt;&lt;td&gt;-56.2 億美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;其他｜租賃本金（IFRS 16）&lt;/td&gt;&lt;td&gt;-571.1 百萬美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;其他｜少數股東往來&lt;/td&gt;&lt;td&gt;122.6 百萬美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;其他小計&lt;/td&gt;&lt;td&gt;-60.6 億美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;對照：同期營運現金流&lt;/td&gt;&lt;td&gt;129 億美元&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;融資活動是公司與出資人（股東、債權人）之間的現金往來，不等於借款：回購、股利是還給股東，借入、償還才是借款；負數＝現金流出。本表期間與下方借款用途、上方現金流分層（近四季）不同。&lt;/p&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;借款用途（研究判讀）：無法判定（淨償債，非新增借款）；期間 FY2025（截至 2026-03-31）；缺口：20-F 未見單筆借款明確用途；FY2025 長期債發行 29 十億日圓、償還 135 十億日圓，屬淨償還；依據：20-F 2026-03-31 現金流量表（融資活動，持續營運）&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;survival-detail&quot;&gt;&lt;h3&gt;存活檢查：現金對債務（12～24 個月，推導，非違約預測）&lt;/h3&gt;&lt;p style=&quot;margin:0 0 6px&quot;&gt;&lt;b&gt;信用評級&lt;/b&gt;　機構 Moody&amp;#x27;s A2、S&amp;amp;P A+（SEC 全文搜尋 FWP 2026-06-24 0001104659-26-076979 #0）／推導 未取得｜投資等級（BBB-／Baa3 以上）&lt;/p&gt;&lt;p style=&quot;margin:0 0 6px&quot;&gt;&lt;b&gt;存活檢查（完整理由）&lt;/b&gt;　無明顯警訊（推導，非違約預測）：現金與證券 139 億美元，一年內到期債務 14 億美元，可付本金 10.2 倍（未含利息）；兩年內到期債務未取得；會計師未提出繼續經營疑慮。&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;燈號：無明顯警訊（一般公司：現金對債務；資料截至 2026-03-31，收盤日 2026-11-13）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;判定&lt;/th&gt;&lt;th&gt;內容與出處&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;會計師繼續經營疑慮&lt;/td&gt;&lt;td&gt;無明顯警訊&lt;/td&gt;&lt;td&gt;會計師與管理層未提出繼續經營疑慮（掃描 20-F 2026-03-31、20-F 2025-03-31）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;流動性：12 個月&lt;/td&gt;&lt;td&gt;無明顯警訊&lt;/td&gt;&lt;td&gt;現金與證券 13,885.3（未動用信貸未取得，未計入），一年內到期本金 1,367.8（利息未取得，未計入），可付本金 10.2 倍（未含利息）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;流動性：24 個月&lt;/td&gt;&lt;td&gt;資料不足&lt;/td&gt;&lt;td&gt;24 個月到期本金或現金未取得，無法比較&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;利息保障&lt;/td&gt;&lt;td&gt;資料不足&lt;/td&gt;&lt;td&gt;利息保障無法計算（利息未取得；EBIT 已取得）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;信用評級（機構）&lt;/td&gt;&lt;td&gt;投資等級&lt;/td&gt;&lt;td&gt;Moody&amp;#x27;s A2（SEC 全文搜尋 FWP 2026-06-24 0001104659-26-076979 #0）；S&amp;amp;P A+（SEC 全文搜尋 FWP 2026-06-24 0001104659-26-076979 #0）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;信用評級（推導）&lt;/td&gt;&lt;td&gt;未取得&lt;/td&gt;&lt;td&gt;利息保障倍數無法計算（利息 未取得）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;債券市場參考&lt;/td&gt;&lt;td&gt;A 級&lt;/td&gt;&lt;td&gt;ICE BofA 公司債選擇權調整利差：投資等級整體 0.89 個百分點（2026-11-12，FRED BAMLC0A0CM）；BBB 級 1.11 個百分點（2026-11-12，FRED BAMLC0A4CBBB）；投機等級整體 3.20 個百分點（2026-11-12，FRED BAMLH0A0HYM2）；A 級 0.73 個百分點（2026-11-12，FRED BAMLC0A3CA）；個別債券殖利率與價格未取得（TRACE／FINRA 不在固定來源）&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;資產負債表一年內到期債務（沒有到期年度桶，24 個月未取得）；利息口徑：未取得；未動用信貸：未取得（信用揭露.json 未填；不計入）&lt;/p&gt;&lt;h3 style=&quot;margin-top:14px&quot;&gt;利率壓力測試（固定情境：利率上升 1、2 個百分點與下降 1 個百分點，不預測聯準會；推導）&lt;/h3&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;單位百萬美元；狀態：未取得&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;浮動利率債利息變動&lt;/th&gt;&lt;th&gt;再融資利息變動&lt;/th&gt;&lt;th&gt;壓力後一年利息&lt;/th&gt;&lt;th&gt;利息保障&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;目前利率（只算再融資）&lt;/td&gt;&lt;td&gt;0.0&lt;/td&gt;&lt;td&gt;未取得&lt;/td&gt;&lt;td&gt;未取得&lt;/td&gt;&lt;td&gt;未取得&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;+1 個百分點&lt;/td&gt;&lt;td&gt;未取得&lt;/td&gt;&lt;td&gt;未取得&lt;/td&gt;&lt;td&gt;未取得&lt;/td&gt;&lt;td&gt;未取得&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;+2 個百分點&lt;/td&gt;&lt;td&gt;未取得&lt;/td&gt;&lt;td&gt;未取得&lt;/td&gt;&lt;td&gt;未取得&lt;/td&gt;&lt;td&gt;未取得&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;−1 個百分點&lt;/td&gt;&lt;td&gt;未取得&lt;/td&gt;&lt;td&gt;未取得&lt;/td&gt;&lt;td&gt;未取得&lt;/td&gt;&lt;td&gt;未取得&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;目前利率：聯邦基金利率 3.88%（2026-11-12，FRED DFF）、SOFR 3.90%（2026-11-12，FRED SOFR）、十年期公債 5.10%（2026-11-12，FRED DGS10）；估值折現率用的 10 年期公債是 5.15%（2026-11-13，美國財政部），來源與日期不同；浮動利率債未取得（作者未填 信用揭露.json 利率結構：10-K 債務表與 Item 7A 利率敏感度；候選句見 原文候選/利率敏感度）；兩年內到期須再融資本金 未取得，原票面 未取得（兩年內到期本金未取得），再融資利率 5.83%（10 年期公債 5.10%（2026-11-12）＋ A 級 OAS 0.73 個百分點（機構最低評級），推導）；利息保障基準：未取得，目前 未取得；利率上升 2 個百分點（+200bp，bp＝基點，100bp＝1 個百分點）後低於 1.5 倍才在燈號理由加一條（不改燈號、不改研究評等）；通膨、物價、消費者等間接影響不在此表；缺 浮動利率債、兩年內到期本金、利息保障基準，對應情境未取得（不補值）&lt;/p&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;&lt;a href=&quot;#survival-rules&quot;&gt;判定規則與限制見本節下方&lt;/a&gt;（寫死在程式，不改研究評等）。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;survival-rules&quot;&gt;&lt;h3&gt;存活檢查與利率壓力測試：判定規則與限制&lt;/h3&gt;&lt;p class=&quot;cap&quot;&gt;規則版本：v1.1（2026-11-03 第二輪：加 KBRA、利率壓力測試、首頁精簡；仍只顯示提示、不改研究評等）&lt;/p&gt;&lt;ul class=&quot;cap&quot;&gt;&lt;li&gt;總燈號：各項取最嚴重：任一高風險→高風險；否則任一需留意→需留意；12 個月流動性或繼續經營無法判定→資料不足；其餘→無明顯警訊。Z 分數與推導評級只列理由、不改燈號。&lt;/li&gt;&lt;li&gt;繼續經營：最新年報或其後季報出現會計師或管理層「substantial doubt … going concern」肯定句 → 高風險（否定句、假設句只列出不計）；只出現在前一份年報 → 需留意&lt;/li&gt;&lt;li&gt;流動性_12個月：現金與證券＋未動用信貸 ≥ 一年內到期本金＋一年利息 → 無明顯警訊；不足但加近四季自由現金流（已扣實付利息）後 ≥ 一年內到期本金 → 需留意；仍不足 → 高風險&lt;/li&gt;&lt;li&gt;流動性_24個月：同上改兩年（本金、利息、自由現金流各計兩年）；不足但加兩年自由現金流 ≥ 本金的 50% → 需留意；更低 → 高風險&lt;/li&gt;&lt;li&gt;燒錢：近四季自由現金流為負：現金還能燒幾個月＝（現金與證券＋未動用信貸－一年內到期本金）÷ 每月燒錢；&amp;lt;12 個月 高風險、12～24 個月 需留意&lt;/li&gt;&lt;li&gt;利息保障：EBIT ÷ 利息費用 &amp;lt; 1.5 倍 → 需留意&lt;/li&gt;&lt;li&gt;契約：作者自 信用揭露.json 填公司揭露的契約門檻與實際值：已違反 → 高風險；餘裕 &amp;lt; 15% → 需留意；未揭露不判&lt;/li&gt;&lt;li&gt;信用評級：機構評級（S&amp;amp;P、Moody&amp;#x27;s、Fitch、KBRA，取各機構最新、以最低者判等級）低於 BBB-／Baa3 → 需留意；只有推導評級為投機等級 → 只列理由&lt;/li&gt;&lt;li&gt;利率壓力測試：固定情境 +100bp／+200bp／-100bp（不預測聯準會）：利息增加＝浮動利率債×利率變動（作者填 Item 7A 每 100bp 利息變動時改用該值）＋兩年內到期本金×（再融資利率＋利率變動－原票面利率）；再融資利率＝收盤日 10 年期公債殖利率＋該評級 ICE BofA OAS（推導）；壓力後利息保障＝EBIT÷（一年利息＋利息增加），EBIT 分母異常時改用現金利息保障。+200bp 後低於 1.5 倍 → 理由加一條、首頁也加（只列理由、不改燈號）；浮動利率債未揭露或未填 → 該情境未取得；金融業不套&lt;/li&gt;&lt;li&gt;金融業：銀行券商、保險不套現金對債務：研究評等輸入 監理紅線 低於門檻 → 高風險；高於門檻不到 20%（相對）→ 需留意；未填 → 資料不足&lt;/li&gt;&lt;/ul&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;使用限制&lt;/p&gt;&lt;ul class=&quot;cap&quot;&gt;&lt;li&gt;推導，非違約預測：燈號只看 12～24 個月付不付得出錢與已揭露的警訊，不是違約機率，也不改研究評等（第一版）。&lt;/li&gt;&lt;li&gt;Altman Z 分數會誤判兩類公司：權益為負（如舉債回購）與保留盈餘因長期回購或股利變負，所以只當輔助、不單獨下結論、不改燈號。&lt;/li&gt;&lt;li&gt;金融業（銀行券商、保險）的存款與保單負債是營業資金，改看監理資本（如 CET1），不套現金對債務。&lt;/li&gt;&lt;li&gt;超過 2～3 年的到期與再融資風險留在正文債務到期表，不進燈號。&lt;/li&gt;&lt;li&gt;到期年度桶以到期表資料日（年報）起算：桶的結束日落在窗口內才計入；跨窗口的桶另列，若作者在 信用揭露.json 填了近期到期明細就改用明細。&lt;/li&gt;&lt;li&gt;個別債券價格與殖利率（TRACE／FINRA）不在固定來源：未取得；市場參考只用 FRED 的 ICE BofA 各評級公司債利差（大盤層級）。&lt;/li&gt;&lt;li&gt;機構評級只認公司自己在 SEC 申報寫出的 S&amp;amp;P、Moody&amp;#x27;s、Fitch、KBRA 評級並附原句；沒揭露寫未揭露，不從新聞或記憶補。&lt;/li&gt;&lt;li&gt;利率壓力測試只用固定情境（+100bp、+200bp、−100bp），不預測聯準會；以 10 年期公債估再融資成本，實際年期與擔保結構不同會有誤差；浮動利率債若也在兩年內到期會重複計算（偏保守）；通膨、物價、消費者等間接影響不進燈號；金融業不套，維持看資本適足率。&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/details&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;more&quot; data-layer=&quot;附錄&quot;&gt;&lt;div class=&quot;qno&quot;&gt;附錄&lt;/div&gt;&lt;h2&gt;附錄：估值細節、論點檢查、名詞、表格與資料來源（預設摺疊）&lt;/h2&gt;&lt;details id=&quot;valdetail&quot;&gt;&lt;summary&gt;估值細節：利率、同業與產業對照、券商目標價&lt;/summary&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;券商目標價&lt;/h3&gt;&lt;figure class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;券商目標價範圍對照本報告合理價值與收盤價（美元；yfinance，取得 2026-11-14；第三方看法，只揭露，不是本報告目標價、不進評等）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 150&quot; role=&quot;img&quot; aria-label=&quot;券商目標價&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;230.0&quot; x2=&quot;230.0&quot; y1=&quot;8&quot; y2=&quot;128&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;230.0&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;0&lt;/text&gt;&lt;line x1=&quot;295.0&quot; x2=&quot;295.0&quot; y1=&quot;8&quot; y2=&quot;128&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;295.0&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;10&lt;/text&gt;&lt;line x1=&quot;360.0&quot; x2=&quot;360.0&quot; y1=&quot;8&quot; y2=&quot;128&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;360.0&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;20&lt;/text&gt;&lt;line x1=&quot;425.0&quot; x2=&quot;425.0&quot; y1=&quot;8&quot; y2=&quot;128&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;425.0&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;30&lt;/text&gt;&lt;line x1=&quot;490.0&quot; x2=&quot;490.0&quot; y1=&quot;8&quot; y2=&quot;128&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;490.0&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;40&lt;/text&gt;&lt;text x=&quot;220&quot; y=&quot;27&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;券商目標價（最低–最高，點＝平均）&lt;/text&gt;&lt;line x1=&quot;399.0&quot; x2=&quot;451.0&quot; y1=&quot;22&quot; y2=&quot;22&quot; stroke=&quot;var(--c6)&quot; stroke-width=&quot;3&quot; opacity=&quot;.55&quot;/&gt;&lt;circle cx=&quot;436.4&quot; cy=&quot;22&quot; r=&quot;7&quot; fill=&quot;var(--c6)&quot;&gt;&lt;title&gt;券商目標價（最低–最高，點＝平均）：32&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;463.0&quot; y=&quot;27&quot; class=&quot;val&quot;&gt;32&lt;/text&gt;&lt;text x=&quot;220&quot; y=&quot;67&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;本報告合理價值（只含折現率）&lt;/text&gt;&lt;line x1=&quot;363.2&quot; x2=&quot;415.5&quot; y1=&quot;62&quot; y2=&quot;62&quot; stroke=&quot;var(--c1)&quot; stroke-width=&quot;3&quot; opacity=&quot;.55&quot;/&gt;&lt;circle cx=&quot;386.5&quot; cy=&quot;62&quot; r=&quot;7&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;本報告合理價值（只含折現率）：24&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;427.5&quot; y=&quot;67&quot; class=&quot;val&quot;&gt;24&lt;/text&gt;&lt;text x=&quot;220&quot; y=&quot;107&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;收盤價&lt;/text&gt;&lt;circle cx=&quot;406.0&quot; cy=&quot;102&quot; r=&quot;7&quot; fill=&quot;var(--ink)&quot;&gt;&lt;title&gt;收盤價：27&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;418.0&quot; y=&quot;107&quot; class=&quot;val&quot;&gt;27&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;市場怎麼看：券商目標價與它隱含的成長&lt;/h4&gt;&lt;p&gt;4 家券商的平均目標價 31.75 美元（中位 33.50，最低 26.00、最高 34.00）；比 2026-11-13 收盤價 27.07 高約 17%；換成本模型的語言，平均目標價要求未來 5 年營收每年成長約 10%；分析師自己預估明年每股盈餘成長 -2.2%。&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;券商目標價與隱含成長（yfinance，取得 2026-11-14）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;目標價（美元）&lt;/th&gt;&lt;th&gt;折回今天（推導）&lt;/th&gt;&lt;th&gt;隱含未來 5 年營收年增&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;平均目標價&lt;/td&gt;&lt;td&gt;31.75&lt;/td&gt;&lt;td&gt;29.29&lt;/td&gt;&lt;td&gt;+9.9%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;中位目標價&lt;/td&gt;&lt;td&gt;33.50&lt;/td&gt;&lt;td&gt;30.91&lt;/td&gt;&lt;td&gt;+11.1%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;最低目標價&lt;/td&gt;&lt;td&gt;26.00&lt;/td&gt;&lt;td&gt;23.99&lt;/td&gt;&lt;td&gt;+5.1%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;最高目標價&lt;/td&gt;&lt;td&gt;34.00&lt;/td&gt;&lt;td&gt;31.37&lt;/td&gt;&lt;td&gt;+11.4%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;Nasdaq 共識目標價 31.90（最低 31.90、最高 31.90；買進 1、持有 0、賣出 0）。券商目標價是第三方對 12 個月後股價的看法，多用「預估盈餘 × 主觀本益比」，通常偏樂觀；本區只揭露，不是本報告的目標價、不當證據、不影響估值與研究評等。「折回今天」以股權成本折現（未加回期間股利），「隱含成長」以本報告基準情境的其他假設反推，是用本模型理解他們的價格，不是券商自己的假設（推導）。資料取得時間與本報告收盤日不同。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;利率的影響：公債殖利率變動與股債利差&lt;/h3&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;利率影響大：10 年期公債殖利率下降 1 個百分點、其他不變，合理價值中點從約 24 升到約 30；上升 1 個百分點則降到約 20。&lt;/strong&gt;白話說，公債殖利率 5.15% 已經不低，Sony 股東收益率 2.7% 只有公債約一半，價值要靠未來成長補上。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;grid2 wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;公債殖利率每變動 1 個百分點，合理價值中點的變化（美元；紅色虛線為現價 27.07）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 500 142&quot; role=&quot;img&quot; aria-label=&quot;利率敏感度&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;168.0&quot; x2=&quot;168.0&quot; y1=&quot;6&quot; y2=&quot;136&quot; class=&quot;zero&quot;/&gt;&lt;line x1=&quot;394.2&quot; x2=&quot;394.2&quot; y1=&quot;4&quot; y2=&quot;138&quot; class=&quot;price&quot;/&gt;&lt;text x=&quot;158&quot; y=&quot;23&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;公債−1%（4.15%）&lt;/text&gt;&lt;rect x=&quot;168.0&quot; y=&quot;9&quot; width=&quot;249.1&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c1)&quot;/&gt;&lt;text x=&quot;425.1&quot; y=&quot;23&quot; class=&quot;val&quot;&gt;30&lt;/text&gt;&lt;text x=&quot;158&quot; y=&quot;63&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;目前公債（5.15%）&lt;/text&gt;&lt;rect x=&quot;168.0&quot; y=&quot;49&quot; width=&quot;201.2&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;377.2&quot; y=&quot;63&quot; class=&quot;val&quot;&gt;24&lt;/text&gt;&lt;text x=&quot;158&quot; y=&quot;103&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;公債＋1%（6.15%）&lt;/text&gt;&lt;rect x=&quot;168.0&quot; y=&quot;89&quot; width=&quot;168.5&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c2)&quot;/&gt;&lt;text x=&quot;344.5&quot; y=&quot;103&quot; class=&quot;val&quot;&gt;20&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;股債利差只作「相對自身歷史的位置」：名目利率對實質盈餘有方法限制，不影響估值與研究評等。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;同業與產業對照&lt;/h3&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;與個別同業比較&lt;/h4&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;同業用 DIS（迪士尼）、WMG、AAPL（蘋果）三家，只作交叉核對：營業利益率 Sony 11.6%（SONY，資料商 yfinance，近四季截至 2026-03-31）、DIS 15.2%（DIS，資料商 yfinance，近四季截至 2026-06-30）、WMG 16.1%（WMG，資料商 yfinance，近四季截至 2026-06-30）、AAPL 33.0%（AAPL，資料商 yfinance，近四季截至 2026-09-30）&lt;span class=&quot;src&quot;&gt;（資料商口徑）&lt;/span&gt;。&lt;/strong&gt;EA 快照沒有有效倍數，排除。&lt;/p&gt;&lt;p&gt;Sony 利潤率低於三家，因為硬體與感測器占比高；AAPL 倍數遠高於其他兩家，同業倍數中位以 WMG 為準，不進研究評等。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;與個別同業比較：利潤率與投入強度（近四季）。資料期間：本公司 SEC 近四季（截至 2026-03-31）；同業為資料商（yfinance 季報加總）近四季，截至 DIS 2026-06-30＊、WMG 2026-06-30、AAPL 2026-09-30＊、EA 2026-06-30；＊資料商「營收年增」是最新單季對去年同季（不是近四季），最新一季截止日與近四季不同；資料商查詢 2026-11-14（批次收盤 2026-11-13）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 300&quot; role=&quot;img&quot; aria-label=&quot;同業比較&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;266.0&quot; y2=&quot;266.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;270.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;0%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;205.5&quot; y2=&quot;205.5&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;209.5&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;10%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;145.0&quot; y2=&quot;145.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;149.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;20%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;84.5&quot; y2=&quot;84.5&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;88.5&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;30%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;24.0&quot; y2=&quot;24.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;28.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;40%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;266.0&quot; y2=&quot;266.0&quot; class=&quot;zero&quot;/&gt;&lt;rect x=&quot;66.6&quot; y=&quot;195.8&quot; width=&quot;20.8&quot; height=&quot;70.2&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;營業利益率 SONY：12%&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;100.8&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;SONY&lt;/text&gt;&lt;rect x=&quot;164.2&quot; y=&quot;174.0&quot; width=&quot;20.8&quot; height=&quot;92.0&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;營業利益率 DIS：15%&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;209.8&quot; y=&quot;212.8&quot; width=&quot;20.8&quot; height=&quot;53.2&quot; rx=&quot;2&quot; fill=&quot;var(--c3)&quot;&gt;&lt;title&gt;資本支出占營收 DIS：9%&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;198.4&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;DIS&lt;/text&gt;&lt;rect x=&quot;261.8&quot; y=&quot;168.5&quot; width=&quot;20.8&quot; height=&quot;97.5&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;營業利益率 WMG：16%&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;307.4&quot; y=&quot;212.1&quot; width=&quot;20.8&quot; height=&quot;53.9&quot; rx=&quot;2&quot; fill=&quot;var(--c3)&quot;&gt;&lt;title&gt;資本支出占營收 WMG：9%&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;296.0&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;WMG&lt;/text&gt;&lt;rect x=&quot;359.4&quot; y=&quot;66.3&quot; width=&quot;20.8&quot; height=&quot;199.7&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;營業利益率 AAPL：33%&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;382.2&quot; y=&quot;208.2&quot; width=&quot;20.8&quot; height=&quot;57.8&quot; rx=&quot;2&quot; fill=&quot;var(--c2)&quot;&gt;&lt;title&gt;研發占營收 AAPL：10%&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;405.0&quot; y=&quot;254.6&quot; width=&quot;20.8&quot; height=&quot;11.4&quot; rx=&quot;2&quot; fill=&quot;var(--c3)&quot;&gt;&lt;title&gt;資本支出占營收 AAPL：2%&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;393.6&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;AAPL&lt;/text&gt;&lt;rect x=&quot;457.0&quot; y=&quot;157.7&quot; width=&quot;20.8&quot; height=&quot;108.3&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;營業利益率 EA：18%&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;479.8&quot; y=&quot;45.1&quot; width=&quot;20.8&quot; height=&quot;220.9&quot; rx=&quot;2&quot; fill=&quot;var(--c2)&quot;&gt;&lt;title&gt;研發占營收 EA：37%&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;502.6&quot; y=&quot;248.0&quot; width=&quot;20.8&quot; height=&quot;18.0&quot; rx=&quot;2&quot; fill=&quot;var(--c3)&quot;&gt;&lt;title&gt;資本支出占營收 EA：3%&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;491.2&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;EA&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c1)&quot;&gt;&lt;/i&gt;營業利益率&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c2)&quot;&gt;&lt;/i&gt;研發占營收&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c3)&quot;&gt;&lt;/i&gt;資本支出占營收&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;我們的假設 vs 產業常見範圍&lt;/h4&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;基準情境營業利益率約 14%，高於 Damodaran「消費與辦公電子」產業基準的 −4.5%（美國 8 家，2026 年 1 月，產業基準對照.json）。&lt;/strong&gt;這組樣本少、多為虧損硬體公司，Sony 收入以遊戲、音樂與電影為主，產業值只作範圍參考（作者判斷）。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;銷售對投入資本三情境取 1.5～1.9 倍，低於產業基準的 5.6 倍，反映內容與版權資產較重（作者判斷）。&lt;/strong&gt;資本成本 8.1%，與產業基準 7.6% 相近（產業基準對照.json）。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;details id=&quot;claims&quot;&gt;&lt;summary&gt;論點檢查：每條判斷的證據狀態&lt;/summary&gt;&lt;div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;依風險分類的主張（證據狀態：支持／部分支持／提出反證／資料不足）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;編號&lt;/th&gt;&lt;th&gt;風險類別&lt;/th&gt;&lt;th&gt;主張&lt;/th&gt;&lt;th&gt;角色&lt;/th&gt;&lt;th&gt;證據狀態&lt;/th&gt;&lt;th&gt;什麼會改變判斷&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;SONY-C04&lt;/td&gt;&lt;td&gt;R1 資金與流動性&lt;/td&gt;&lt;td&gt;現金與證券是一年內到期債務的 10 倍，淨負債÷EBITDA 為 -0.42，承諾授信與商業本票額度都未動用。&lt;/td&gt;&lt;td&gt;支持論點&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;淨負債÷EBITDA 轉為正值且高於 1.5 倍，或現金與證券÷一年內到期債務低於 2 倍&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;SONY-C01&lt;/td&gt;&lt;td&gt;R3 成長退坡與競爭&lt;/td&gt;&lt;td&gt;PlayStation 平台與音樂版權目錄有外部文件支持的護城河，影像感測器則面對點名的競爭者，整體護城河評為中、分級窄。&lt;/td&gt;&lt;td&gt;支持論點&lt;/td&gt;&lt;td&gt;部分支持&lt;/td&gt;&lt;td&gt;G&amp;amp;NS 網路服務營收連兩個半年度年減，或主要發行商 10-K 揭露 Sony 平台占比低於 30%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;SONY-C05&lt;/td&gt;&lt;td&gt;R3 成長退坡與競爭&lt;/td&gt;&lt;td&gt;上半年成長主要來自網路服務、遊戲軟體、音樂串流與電影，主機台數與行動裝置感測器反而下滑。&lt;/td&gt;&lt;td&gt;支持論點&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;網路服務營收年增率轉負，或音樂美元口徑串流成長低於 3%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;SONY-C02&lt;/td&gt;&lt;td&gt;R4 投入回報不足&lt;/td&gt;&lt;td&gt;近四季持續營運 ROIC 約 16.5%（推導），年度口徑約 13.4%（推導），近五年每年高於 WACC 8.1%。&lt;/td&gt;&lt;td&gt;支持論點&lt;/td&gt;&lt;td&gt;部分支持&lt;/td&gt;&lt;td&gt;年度持續營運 ROIC（推導）低於 10%，或營業利益率連兩個半年度下滑超過 2 個百分點&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;SONY-C03&lt;/td&gt;&lt;td&gt;R5 收入與盈餘品質&lt;/td&gt;&lt;td&gt;FY2025 營運現金流約 1.97 兆日圓，但 IFRS 下付息列融資、租賃本金另計，自由現金流要扣租賃本金與付息後再看。&lt;/td&gt;&lt;td&gt;支持論點&lt;/td&gt;&lt;td&gt;部分支持&lt;/td&gt;&lt;td&gt;年度營運現金流扣資本支出與租賃本金後轉負，或低於歸屬淨利 50%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;SONY-C08&lt;/td&gt;&lt;td&gt;R5 收入與盈餘品質&lt;/td&gt;&lt;td&gt;近四季營業利益含美國關稅退款，公司未揭露金額，媒體轉述約 800 億日圓。&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;部分支持&lt;/td&gt;&lt;td&gt;公司揭露退款金額超過近四季營業利益 8%，或訴訟要求返還&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;SONY-C09&lt;/td&gt;&lt;td&gt;R6 治理與資料可信度&lt;/td&gt;&lt;td&gt;FY2026 全年指引在 5 月首次發布後兩度上修，但 FY2025 最後一版營業利益指引未達約 6%。&lt;/td&gt;&lt;td&gt;支持論點&lt;/td&gt;&lt;td&gt;部分支持&lt;/td&gt;&lt;td&gt;FY2026 實際營業利益低於 11 月指引 1.87 兆日圓 5% 以上&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;SONY-C10&lt;/td&gt;&lt;td&gt;R7 估值與市場預期&lt;/td&gt;&lt;td&gt;收盤 27.07 美元落在合理價值區間 20.50–28.53 的上半部，市價反推基準營收年增約 8.0%，高於近三年日圓年複合約 7.3%（不含金融分部，推導）。&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;收盤價高於合理價值上緣 28.53 或低於買入上限 14.45&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;SONY-C06&lt;/td&gt;&lt;td&gt;R8 宏觀與共同曝險&lt;/td&gt;&lt;td&gt;記憶體價格上升與主機供貨受限，是 FY2026 下半年到 PS6 世代的主要成本風險。&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;部分支持&lt;/td&gt;&lt;td&gt;FY2026 全年指引下修或 G&amp;amp;NS 營業利益率半年度下降超過 3 個百分點&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;SONY-C07&lt;/td&gt;&lt;td&gt;R8 宏觀與共同曝險&lt;/td&gt;&lt;td&gt;7 月熊本地震使影像感測器主力廠 7 月 28 日停產，8 月 4 日起分階段復工，8 月中回到震前產能，公司未單獨揭露損失金額。&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;部分支持&lt;/td&gt;&lt;td&gt;下半年 6-K 揭露地震相關損失超過 I&amp;amp;SS 半年營業利益 10%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;SONY-C11&lt;/td&gt;&lt;td&gt;R9 稀釋與股東回饋&lt;/td&gt;&lt;td&gt;分拆金融後持續回購，FY2025（至 2026-03-31）回購殖利率約 2.2%。&lt;/td&gt;&lt;td&gt;支持論點&lt;/td&gt;&lt;td&gt;部分支持&lt;/td&gt;&lt;td&gt;回購停止或稀釋後流通股數年增超過 1%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;並列：研究評等 生意 B ／ 價格合理；價格位置 合理；現價隱含年報酬（基準情境，非預期報酬） 7.3%。各列狀態與價格分開呈現，不合成分數，狀態件數也不代表強弱（非買賣建議）。沒有寫主張的風險類別：R2 償債負擔與永久損失。&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;details id=&quot;foreign&quot;&gt;&lt;summary&gt;外國發行人須知：準則與幣別、匯率、股類與 ADR、比較調整、揭露對照&lt;/summary&gt;&lt;div class=&quot;block&quot;&gt;&lt;p class=&quot;cap&quot;&gt;申報：20-F（年報）＋6-K（季度與事件）｜會計準則：IFRS｜報告幣別：JPY｜財年結束：0331｜季度來源：6-K季度（近 15 個月 6-K 期末為季末者 3 期（2025-09-30, 2026-03-31, 2026-06-30）；新聞稿表格由 取得6K季報.py 解析）&lt;/p&gt;&lt;h3&gt;匯率（1 JPY 兌美元）&lt;/h3&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;用途&lt;/th&gt;&lt;th&gt;匯率鍵&lt;/th&gt;&lt;th&gt;美元／JPY&lt;/th&gt;&lt;th&gt;方法&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;最近財年平均&lt;/td&gt;&lt;td&gt;平均_2025-04-01_2026-03-31&lt;/td&gt;&lt;td&gt;0.00665&lt;/td&gt;&lt;td&gt;期間每日美元／外幣算術平均（不填週末假日）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;最近資產負債表日&lt;/td&gt;&lt;td&gt;期末_2026-03-31&lt;/td&gt;&lt;td&gt;0.00629&lt;/td&gt;&lt;td&gt;實際日期 2026-03-31&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;收盤日（市值、每股價值換回美元）&lt;/td&gt;&lt;td&gt;收盤_2026-11-06&lt;/td&gt;&lt;td&gt;0.00632&lt;/td&gt;&lt;td&gt;收盤日當天或之前最近一筆&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;來源：FRED H.10（聯準會 H.10 日匯率，經 FRED 轉載），序列 DEXJPUS，存檔 市場資料/匯率/DEXJPUS_2014-01-01_2026-11-13.csv（sha256 6206cbf0dd98…）。流量用期間每日平均、存量用期末、股數不換；匯率不預測，情境假設匯率維持收盤日水準。原幣三表見 財務歷史_原幣.json。&lt;/p&gt;&lt;h3&gt;股類與 ADR&lt;/h3&gt;&lt;p class=&quot;cap&quot;&gt;ADR 比例：未揭露（封面提到 ADR 但沒有比例句，作者確認 Item 12.D）。各類股（20-F 封面）：: Outstanding as of March 31, 2026 March 31, 2026 Title of Class (Tokyo Time) (New York Time) Common Stock 5,907,667,254 American Depositary Shares 523,381,332 Indicate by check mark if the registrant。&lt;/p&gt;&lt;h3&gt;與美國 GAAP 公司比較時的調整（只揭露，不全面轉 GAAP；不是公司優劣）&lt;/h3&gt;&lt;ul class=&quot;cap&quot;&gt;&lt;li&gt;租賃（IFRS 16）：沒有營業租賃費用，EBITDA 與營運現金流比美國 GAAP 公司高；自由現金流另列扣租賃本金版（近四季租賃本金 571 百萬美元）&lt;/li&gt;&lt;li&gt;利息分類（IAS 7）：實付利息列在未取得活動&lt;/li&gt;&lt;li&gt;開發成本資本化（IAS 38）：研發費用可能偏低、無形資產偏高；資本化金額見附註&lt;/li&gt;&lt;li&gt;存貨（IAS 2）：禁用 LIFO；與用 LIFO 的美國同業毛利不可直接比&lt;/li&gt;&lt;li&gt;減損迴轉（IAS 36）：可能有迴轉利益，視為一次性項目&lt;/li&gt;&lt;li&gt;每股盈餘與類股（IAS 33）：多類股時不加總各類 EPS，依經濟權益配對&lt;/li&gt;&lt;/ul&gt;&lt;h3&gt;揭露對照（美國申報人文件 → 本公司對應）&lt;/h3&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;美國申報人&lt;/th&gt;&lt;th&gt;本公司&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;10-K 年報&lt;/td&gt;&lt;td&gt;20-F（Item 3 風險、4 業務、5 經營與財務檢討、18 財報）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;10-Q 季報&lt;/td&gt;&lt;td&gt;6-K 新聞稿表格（非 XBRL，程式解析，原文出處在 財報/6K季報索引.json）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;8-K 重大事件&lt;/td&gt;&lt;td&gt;6-K（沒有 Item 代碼；分類為關鍵字初篩）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;DEF 14A 委託書、Pay vs Performance&lt;/td&gt;&lt;td&gt;不適用：外國私人發行人；薪酬改引 &lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;div class=&quot;wrap&quot;&gt;&lt;div class=&quot;top&quot;&gt;&lt;span&gt;&lt;b&gt;索尼集團（SONY）&lt;/b&gt;｜商業評估&lt;/span&gt;&lt;span&gt;資料截止 2026-11-10｜基準季 2026-09-30｜&lt;a href=&quot;報告.html&quot;&gt;估值報告（另頁）&lt;/a&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;hero&quot;&gt;&lt;div&gt;&lt;div class=&quot;eyebrow&quot;&gt;商業評估｜品牌消費與硬體／硬體平台&lt;/div&gt;&lt;h1&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;Sony 是以 PlayStation 平台、音樂版權與影像感測器為三根支柱的多角化集團；FY2026 上半年（至 2026-09）營收增加約七成來自日圓走弱（推算），扣掉匯率只有音樂與電影實質成長，主機硬體台數下滑。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src2&quot;&gt;[2]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src3&quot;&gt;[3]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src4&quot;&gt;[4]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src5&quot;&gt;[5]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src6&quot;&gt;[6]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src7&quot;&gt;[7]&lt;/a&gt;&lt;/sup&gt;&lt;/h1&gt;&lt;p class=&quot;lead&quot;&gt;本頁只用官方文件、財報與新聞，回答商業模式是否成立、成長點在哪、是否卡住、未來怎麼變、週期多久。&lt;b&gt;不含價格、估值或任何買賣建議&lt;/b&gt;，也不影響估值報告的研究評等。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;gradebox&quot;&gt;&lt;div class=&quot;lab&quot;&gt;商業評估等級（五級 A–E）&lt;span class=&quot;ruleok&quot;&gt;評分規則第一版，2026-11-07 使用者核定&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;g&quot;&gt;C&lt;small&gt;級&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;加權分 2.9／5｜相對同業：DIS、WMG、AAPL&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;與同業相當，或有明顯卡點｜上限：卡住訊號超過一半資料未取得 → 最高 B（資料不足）&lt;/div&gt;&lt;div class=&quot;note&quot;&gt;商業評估等級（A–E 五級）只看商業模式是否成立、成長是否卡住、週期在哪，相對同產業卡同業評比；它不是估值報告研究評等裡的「生意品質 A／B／C」（那是看護城河、投入資本報酬、現金流品質、資產負債表與治理的絕對標準），不進研究評等、不影響估值、不涉任何價格。&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;nav class=&quot;qnav&qu
