、營運現金流、資本支出）。用到：財務歷史、長期財務。ROE 註記門檻：ROE 高於 60% 或股東權益 ÷ 總資產低於 10%；近三年回購合計達當年股東權益 50% 以上才歸因於回購。（股利＋回購）÷ 年底市值：專案沒有逐年年底市值資料，不列該欄。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;capital-plain&quot;&gt;&lt;h3&gt;融資與償債：還不還得起&lt;/h3&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;b&gt;信用評級&lt;/b&gt;　機構 未揭露（10-K、10-Q、8-K、SEC 全文搜尋 查無 S&amp;amp;P、Moody&amp;#x27;s、Fitch、KBRA 評級）／推導 D（Damodaran 合成評等，利息保障 -10.3 倍，近四季新借款多、利息偏低、評級可能偏高，推導）｜依推導：⚠ 投機等級（低於 BBB-／Baa3）&lt;/p&gt;&lt;p&gt;&lt;b&gt;存活檢查（12～24 個月，推導，非違約預測）&lt;/b&gt;　需留意（推導，非違約預測）：利息保障 -10.3 倍（偏薄）（新借款多、利息偏低，倍數可能偏高）；會計師未提出繼續經營疑慮；信用評級 D（推導，投機等級，僅提示）；Altman Z 1.33（困境區，輔助；權益或保留盈餘為負，可能誤判）；利率 +200bp 後利息保障 -9.8 倍。&lt;/p&gt;&lt;p&gt;&lt;b&gt;利率壓力測試&lt;/b&gt;　+200bp 後利息保障 -9.8 倍（目前 -10.3 倍，推導）&lt;/p&gt;&lt;p&gt;&lt;b&gt;借款用途&lt;/b&gt;　擴張（可轉債供稀土 Mill 與 Donald 專案開發及一般營運）；2026-09 另有待 VAC 收購的 2.5 億美元定期貸款承諾（未動用）&lt;/p&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;償債指標、融資活動表、存活檢查明細與利率壓力測試（算法與完整表見&lt;a href=&quot;#wp-6&quot;&gt;計算底稿 6&lt;/a&gt;）。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;survival-charts&quot;&gt;&lt;h3&gt;存活檢查與利率壓力測試（圖）&lt;/h3&gt;&lt;div class=&quot;grid2 wide&quot;&gt;&lt;figure class=figure&gt;&lt;p class=cap&gt;存活檢查（12～24 個月）：手上的錢對到期債務加利息（億美元；可付 74.7 倍／41.4 倍；燈號 需留意；資料截至 2026-09-30；信用與存活；推導，非違約預測）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 500 142&quot; role=&quot;img&quot; aria-label=&quot;存活檢查&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;223.0&quot; x2=&quot;223.0&quot; y1=&quot;6&quot; y2=&quot;136&quot; class=&quot;zero&quot;/&gt;&lt;text x=&quot;213&quot; y=&quot;23&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;現金與流動證券&lt;/text&gt;&lt;rect x=&quot;223.0&quot; y=&quot;9&quot; width=&quot;199.1&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c1)&quot;/&gt;&lt;text x=&quot;430.1&quot; y=&quot;23&quot; class=&quot;val&quot;&gt;8.6&lt;/text&gt;&lt;text x=&quot;213&quot; y=&quot;63&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;12 個月要付：本金＋利息&lt;/text&gt;&lt;rect x=&quot;223.0&quot; y=&quot;49&quot; width=&quot;2.7&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--neg)&quot;/&gt;&lt;text x=&quot;233.7&quot; y=&quot;63&quot; class=&quot;val&quot;&gt;0.1&lt;/text&gt;&lt;text x=&quot;213&quot; y=&quot;103&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;24 個月要付：本金＋兩年利息&lt;/text&gt;&lt;rect x=&quot;223.0&quot; y=&quot;89&quot; width=&quot;4.8&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--neg)&quot;/&gt;&lt;text x=&quot;235.8&quot; y=&quot;103&quot; class=&quot;val&quot;&gt;0.2&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;figure class=figure&gt;&lt;p class=cap&gt;利率壓力測試：各固定情境下的利息保障（倍；紅色虛線 1.5 倍＝提示門檻；不預測聯準會；推導）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 500 222&quot; role=&quot;img&quot; aria-label=&quot;利率壓力測試&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;406.1&quot; x2=&quot;406.1&quot; y1=&quot;6&quot; y2=&quot;216&quot; class=&quot;zero&quot;/&gt;&lt;line x1=&quot;438.7&quot; x2=&quot;438.7&quot; y1=&quot;4&quot; y2=&quot;218&quot; class=&quot;price&quot;/&gt;&lt;text x=&quot;173&quot; y=&quot;23&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;目前&lt;/text&gt;&lt;rect x=&quot;183.0&quot; y=&quot;9&quot; width=&quot;223.1&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--neg)&quot;/&gt;&lt;text x=&quot;414.1&quot; y=&quot;23&quot; class=&quot;val&quot;&gt;-10.3 倍&lt;/text&gt;&lt;text x=&quot;173&quot; y=&quot;63&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;目前利率（只算再融資）&lt;/text&gt;&lt;rect x=&quot;190.4&quot; y=&quot;49&quot; width=&quot;215.8&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--neg)&quot;/&gt;&lt;text x=&quot;414.1&quot; y=&quot;63&quot; class=&quot;val&quot;&gt;-9.9 倍&lt;/text&gt;&lt;text x=&quot;173&quot; y=&quot;103&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;利率 +1 個百分點&lt;/text&gt;&lt;rect x=&quot;191.3&quot; y=&quot;89&quot; width=&quot;214.9&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--neg)&quot;/&gt;&lt;text x=&quot;414.1&quot; y=&quot;103&quot; class=&quot;val&quot;&gt;-9.9 倍&lt;/text&gt;&lt;text x=&quot;173&quot; y=&quot;143&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;利率 +2 個百分點&lt;/text&gt;&lt;rect x=&quot;192.3&quot; y=&quot;129&quot; width=&quot;213.8&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--neg)&quot;/&gt;&lt;text x=&quot;414.1&quot; y=&quot;143&quot; class=&quot;val&quot;&gt;-9.8 倍&lt;/text&gt;&lt;text x=&quot;173&quot; y=&quot;183&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;利率 −1 個百分點&lt;/text&gt;&lt;rect x=&quot;189.3&quot; y=&quot;169&quot; width=&quot;216.8&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--neg)&quot;/&gt;&lt;text x=&quot;414.1&quot; y=&quot;183&quot; class=&quot;val&quot;&gt;-10.0 倍&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;燈號規則：現金＋未動用信貸要能付 12 個月本金與利息，否則看自由現金流；利率上升 2 個百分點後利息保障低於 1.5 倍才加一條理由。只顯示、不改研究評等；明細表、規則與限制（算法與完整表見&lt;a href=&quot;#wp-6&quot;&gt;計算底稿 6&lt;/a&gt;）。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;財務管理&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;借款用途是擴張：2025-10 發行可轉債 700 百萬，用於稀土與 Donald 專案及一般營運；VAC 另有高盛 2.5 億美元定期貸款承諾，未動用（融資償債判讀）。&lt;/strong&gt;工具淨現金 200.2 百萬美元&lt;span class=&quot;src&quot;&gt;（作者校正：原文 10-Q 2026-09-30；Part I, Item 1 ¶14）&lt;/span&gt; 用可轉債帳面並含 Donald 墊款；估值股權橋改用債務面額、不含墊款，淨額 153.7&lt;span class=&quot;src&quot;&gt;（推導，見計算底稿 5）&lt;/span&gt;。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;資產變化&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;資產大幅增加主要是募資換來的國庫券，不是營運資產；應收帳款年增 +122.8%（2026-09-30 對 2025-09-30），部分解釋為季末出貨集中，下季要看是否收回。&lt;/strong&gt;重礦砂 Kwale&lt;span class=&quot;src&quot;&gt;（已停產的重礦砂營運，10-K Item 1A ¶170）&lt;/span&gt;停產相關資產與關閉風險見年報&lt;span class=&quot;src&quot;&gt;（10-K Item 1A ¶170）&lt;/span&gt;。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;公司內部治理&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;最大的治理疑點是 VAC 揭露時點：8-K 2026-10-13 承認談判時已知客戶爭議，合併協議因此納入和解金額假設與收購價調整條款&lt;span class=&quot;src&quot;&gt;（8-K 2026-10-13 §78、§141）&lt;/span&gt;。&lt;/strong&gt;這屬資本配置判斷與揭露品質問題，尚無違法證據。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;業務治理&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;專案時程已延後：Donald FID（Donald 專案的&lt;a class=&quot;term&quot; href=&quot;#g1&quot;&gt;最終投資決定&lt;/a&gt;）由 2026 年第三季初改到年底前，Vara Mada 仍等馬達加斯加財政與穩定條款（UUUU-C08）；公司時程曾經落空，基準情境因此晚一年。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;白話說&lt;/b&gt;可轉債利率 0.75%，每年利息約 5 百萬，相對現金與國庫券很小（推導）。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;要留意&lt;/b&gt;淨現金看口徑：工具值用債務帳面並含 Donald 墊款，估值用面額（見改判訊號）。&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;events&quot;&gt;&lt;div class=&quot;qno&quot;&gt;問題 07&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;接下來要盯什麼？&lt;/div&gt;&lt;h2&gt;盯專案 FID、OSC 貸款與 VAC 爭議。&lt;/h2&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;未來 12 個月的關鍵是融資與決策：Donald 年底前 FID、OSC 7.25 億美元有條件貸款定約、Vara Mada 財政條款、VAC 仲裁與交割；目標區間保守 0.54–0.77 美元（2026-11-16 起 12 個月；條件式、非買賣建議）、基準 2.75–3.31 美元（2026-11-16 起 12 個月；條件式、非買賣建議）、樂觀 5.29–6.42 美元（2026-11-16 起 12 個月；條件式、非買賣建議）（2026-11-16 至 2027-11-16，條件式、非買賣建議）。&lt;/p&gt;&lt;p&gt;保守區間 0.54–0.77 美元（2026-11-16 起 12 個月；條件式、非買賣建議） 對應 Vara Mada 只有 15% 成功機率；VAC 若完成，三情境都要重算（目標區間失效條件）。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;事件表&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;下表列已知事件與它會影響哪個情境；只列本輪存檔原文看得到的事件，不代表完整清單。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;figure&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt signals&quot;&gt;&lt;tr&gt;&lt;th&gt;事件&lt;/th&gt;&lt;th&gt;影響&lt;/th&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;出處&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;VAC 收購完成（現金約 718 百萬＋約 6,585 萬股）&lt;/td&gt;&lt;td&gt;目標區間失效、三情境重算&lt;/td&gt;&lt;td&gt;全部&lt;/td&gt;&lt;td&gt;10-Q 2026-09-30 Item 1 ¶48；8-K 2026-10-13 §890&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Vara Mada 政府財政條款未定&lt;/td&gt;&lt;td&gt;FID 可能延到 12 個月以後&lt;/td&gt;&lt;td&gt;全部&lt;/td&gt;&lt;td&gt;10-Q 2026-06-30 Item 2 ¶62&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Donald 年底前 FID 與澳洲貸款定約&lt;/td&gt;&lt;td&gt;基準成功機率 70%，樂觀 95%&lt;/td&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;新聞 N4（2026-10-26 新聞稿）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;OSC 7.25 億美元貸款定約&lt;/td&gt;&lt;td&gt;稀土第二期取得債務資金&lt;/td&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;10-Q 2026-09-30 Item 2 ¶285&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;VAC 客戶仲裁不利或 OSC 未定約&lt;/td&gt;&lt;td&gt;第二期延後、資金需求增加&lt;/td&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;8-K 2026-10-13 §78、§141&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;管理層與董事會異動&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;經營團隊按計畫交棒：總裁 Ross Bhappu（現任總裁兼執行長）於 2026-04-15 接任執行長，前執行長 Mark Chalmers（前執行長，2026-04-15 退休）退休、轉任兩年顧問並辭去董事，公司寫明非因意見不合&lt;span class=&quot;src&quot;&gt;（8-K 2026-03-03 §3–4）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;法務長 David Frydenlund（前法務長）預定 2026-10 退休，由 Nathan Longenecker（現任法務長）接任&lt;span class=&quot;src&quot;&gt;（8-K 2026-05-15 §3–4）&lt;/span&gt;；董事 J. Birks Bovaird（J. Birks Bovaird，未再連任的董事）、Alexander Morrison（未再連任的董事）未再連任&lt;span class=&quot;src&quot;&gt;（8-K 04-17 §3）&lt;/span&gt;；Jeffrey Olsen（2026-11-03 新任董事）11-03 任董事&lt;span class=&quot;src&quot;&gt;（8-K 11-09 §3）&lt;/span&gt;。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;白話說&lt;/b&gt;Donald 若在年底前 FID，樂觀情境的時程假設就有一項成真。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;要留意&lt;/b&gt;事件表只列已揭露事件，不是完整清單（見改判訊號）。&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;news&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;近期新聞查證&lt;/p&gt;&lt;h3&gt;新聞重點是 VAC 爭議與 Donald 延後，兩者都偏向風險。&lt;/h3&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;我們只引用能讀到原文的新聞，付費牆報導不引用；新聞只當線索，事實以 SEC 申報為準。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;新聞摘要（依日期排序）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;日期&lt;/th&gt;&lt;th&gt;來源與標題&lt;/th&gt;&lt;th&gt;立場&lt;/th&gt;&lt;th&gt;我們的判讀&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2026-06-23&lt;/td&gt;&lt;td&gt;Energy Fuels：宣布以 19 億美元股權價值收購 VAC&lt;/td&gt;&lt;td&gt;背景&lt;/td&gt;&lt;td&gt;當時預計 Donald 第三季初 FID，後來改年底，時程已延後（C08）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2026-10-14&lt;/td&gt;&lt;td&gt;The Globe and Mail（TipRanks）：VAC 協議修訂與客戶爭議&lt;/td&gt;&lt;td&gt;反方&lt;/td&gt;&lt;td&gt;8-K 承認談判時已知爭議，揭露時點有疑慮（C07）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2026-10-14&lt;/td&gt;&lt;td&gt;scanx.trade：律師事務所調查 VAC 揭露&lt;/td&gt;&lt;td&gt;反方&lt;/td&gt;&lt;td&gt;只是待驗證訊號，不構成違法證據，正式立案才改判&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2026-10-26&lt;/td&gt;&lt;td&gt;Energy Fuels：Donald 取得政府融資里程碑&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;貸款是 Donald 的修復路徑，但 FID 已延到年底（C08）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2026-11-09&lt;/td&gt;&lt;td&gt;Zacks：第三季因投資損失未達預期，鈾銷售成長&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;營收成長來自鈾出貨；每股虧損擴大主因有價證券損失（C11）&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;numbers&quot;&gt;&lt;div class=&quot;qno&quot;&gt;完整數字&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;三大報表摘要（年度與 8 季）&lt;/div&gt;&lt;h2&gt;營收、獲利、現金流與資產負債一次看&lt;/h2&gt;&lt;div class=&quot;grid2 wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;損益：年度與近四季（百萬美元）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 300&quot; role=&quot;img&quot; aria-label=&quot;損益（年度）&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1 &lt;section class=&quot;q&quot; id=&quot;workpaper&quot; data-layer=&quot;計算底稿&quot;&gt;&lt;div class=&quot;qno&quot;&gt;計算底稿&lt;/div&gt;&lt;h2&gt;計算底稿：正文結果的算法與完整表（預設摺疊）&lt;/h2&gt;&lt;p class=&quot;wpnote&quot;&gt;正文每個估值、償債結果都從這裡算出；背景計算照做、送審照核。不讀也不影響理解結論；非買賣建議。&lt;/p&gt;&lt;details id=&quot;wp-3-4&quot;&gt;&lt;summary&gt;3・4 現金與股東：報表對帳與股東回報判讀&lt;/summary&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;現金流報表對帳&lt;/h3&gt;&lt;p&gt;報表對帳（10-Q 2026-09-30，現金、約當現金及受限現金）：期初 87.2＋營運 -38.5＋投資 -91.7＋融資 141.7＋其他 0.7＝期末 99.5 百萬美元｜完整&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;股東回報判讀表&lt;/h3&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;股東回報（判讀依估值政策門檻，2026-10-14 核定；不影響估值與價格位置）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;數值&lt;/th&gt;&lt;th&gt;判讀&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股利殖利率&lt;/td&gt;&lt;td&gt;0.00%&lt;/td&gt;&lt;td&gt;不評好壞：近四季沒有配息（近十年未申報股利，以 0 計）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;回購殖利率&lt;/td&gt;&lt;td&gt;0.00%&lt;/td&gt;&lt;td&gt;不評好壞：近四季沒有回購&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股東收益率（股利＋回購）&lt;/td&gt;&lt;td&gt;0.00%（公債的 0%）&lt;/td&gt;&lt;td&gt;不評好壞：主要靠成長，0.00% 只有 10 年期公債 5.12% 的 0%；回饋低是成長型公司的常態，改看成長&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;淨回購殖利率&lt;/td&gt;&lt;td&gt;-0.91%&lt;/td&gt;&lt;td&gt;中性：沒有回購；發給員工的股票約占市值 0.91%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股數年變化（1／3／10 財年）&lt;/td&gt;&lt;td&gt;+30.7%／+12.6%／+21.0%&lt;/td&gt;&lt;td&gt;警示：2025 財年對上一財年 +30.7%（高於政策 2% 線）；近 3 財年平均每年 +12.6%（高於政策 2% 線）；近 10 財年平均每年 +21.0%（高於政策 2% 線）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;近十年有回購的年數&lt;/td&gt;&lt;td&gt;0／10（近十年均未申報回購，推定沒有回購；推導值）&lt;/td&gt;&lt;td&gt;不評好壞：近十年都沒有申報回購&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股利連續成長年數&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;不適用：公司沒有配息&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;警示：持續稀釋&lt;/td&gt;&lt;td&gt;股數 2015–2025 每年增加 21.0%；近 1 財年 +30.7%、近 3 財年 +12.6%&lt;/td&gt;&lt;td&gt;警示：依政策「治理與資本配置」最高只能評「中」；本次該項評「中」，評等不受影響&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;推定為零的項目&lt;/td&gt;&lt;td&gt;回購：近十年（2016–2025）均未申報，推定為零（推導值）；股利：近十年（2016–2025）均未申報，推定為零（推導值）&lt;/td&gt;&lt;td&gt;資料限制：公司近十年沒有這項申報，上表以 0 計算；屬推導值&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;details id=&quot;wp-mkt&quot;&gt;&lt;summary&gt;市場背景：大盤一句、流動性、空單與參考值的資料日期與存檔&lt;/summary&gt;&lt;p class=&quot;cap&quot;&gt;大盤狀態（市場總覽；只揭露，不進研究評等、價格位置與合理價值）：S&amp;amp;P 500（以 SPY 代表）前十大持股合計 37.3%，最大產業科技 38.2%；那斯達克 100（QQQ）科技占 58.0%；等權重 RSP 減市值加權 SPY 近3個月報酬差 1.7 個百分點，位在 2003 年以來第 79 分位（持平）。高收益債利差 3.30，位在 2023 年以來第 81 分位（偏高）；金融狀況指數 -0.46，位在 1971 年以來第 44 分位（中性）；VIX 18.70，位在 1990 年以來第 56 分位（中性）；融資推估（聯準會，推估）0.74 兆美元（2026-06-30），年增 46.6%（第 92 分位，偏高），占國內公司股權市值 0.68%（第 8 分位，偏低）。（市場總覽收盤日 2026-11-12，市場/市場總覽）。&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;流動性、空單與參考值（只列事實與資料日期，不判冷熱、不是買賣訊號；非買賣建議）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;類別&lt;/th&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;數值&lt;/th&gt;&lt;th&gt;資料日期&lt;/th&gt;&lt;th&gt;說明與存檔&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;流動性&lt;/td&gt;&lt;td&gt;20 日均成交量&lt;/td&gt;&lt;td&gt;9,257,170 股&lt;/td&gt;&lt;td&gt;2026-11-16 收盤&lt;/td&gt;&lt;td&gt;90 日均量 7,850,974 股（20 日 ÷ 90 日 1.18 倍）｜市場溫度&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;流動性&lt;/td&gt;&lt;td&gt;20 日均成交金額&lt;/td&gt;&lt;td&gt;68.1 百萬美元&lt;/td&gt;&lt;td&gt;2026-11-16 收盤&lt;/td&gt;&lt;td&gt;市場溫度&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;流動性&lt;/td&gt;&lt;td&gt;20 日均周轉率（每日）&lt;/td&gt;&lt;td&gt;3.50%&lt;/td&gt;&lt;td&gt;2026-11-16 收盤&lt;/td&gt;&lt;td&gt;20 日均量 ÷ SEC 封面流通股數（當時可得，依分割換算）；自身近 5 年第 70% 百分位｜市場溫度&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;空單&lt;/td&gt;&lt;td&gt;放空比率（空單占流通股）&lt;/td&gt;&lt;td&gt;21.83%&lt;/td&gt;&lt;td&gt;2026-10-30 結算&lt;/td&gt;&lt;td&gt;空單 57,815,367 股；前一期（2026-10-15）58,090,237 股，減少 0.5%；FINRA 每月兩次公布的合併空單，取得 2026-11-17｜市場溫度&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;空單&lt;/td&gt;&lt;td&gt;回補天數&lt;/td&gt;&lt;td&gt;6.15 天&lt;/td&gt;&lt;td&gt;2026-10-30 結算&lt;/td&gt;&lt;td&gt;空單 ÷ 日均量（FINRA 自身日均量）；自算 ÷ 90 日均量 7.36 天｜市場溫度&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;參考值&lt;/td&gt;&lt;td&gt;52 週區間位置&lt;/td&gt;&lt;td&gt;0%&lt;/td&gt;&lt;td&gt;2026-11-16 收盤&lt;/td&gt;&lt;td&gt;0%＝52 週低 6.04、100%＝52 週高 27.72（收盤，推算）｜市場溫度&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;參考值&lt;/td&gt;&lt;td&gt;近 12 個月股價報酬&lt;/td&gt;&lt;td&gt;-61.0%&lt;/td&gt;&lt;td&gt;2026-11-16 收盤&lt;/td&gt;&lt;td&gt;同期 S&amp;amp;P 500 +11.3%｜市場溫度&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;參考值&lt;/td&gt;&lt;td&gt;60 日歷史年化波動&lt;/td&gt;&lt;td&gt;63.5%&lt;/td&gt;&lt;td&gt;2026-11-16 收盤&lt;/td&gt;&lt;td&gt;日報酬標準差年化（收盤）｜市場溫度&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;參考值&lt;/td&gt;&lt;td&gt;距 200 日均線&lt;/td&gt;&lt;td&gt;-60.9%&lt;/td&gt;&lt;td&gt;2026-11-16 收盤&lt;/td&gt;&lt;td&gt;200 日均線 15.43｜市場溫度&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;!--空單與交割--&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;空單與交割、軋空條件（FINRA 每日放空、暗池與場外週量、Reg SHO 門檻名單、SEC 交割失敗；只描述，不判股價冷熱、不進研究評等；非買賣建議）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;類別&lt;/th&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;數值&lt;/th&gt;&lt;th&gt;資料日期&lt;/th&gt;&lt;th&gt;說明與存檔&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;空單&lt;/td&gt;&lt;td&gt;空單趨勢（近六期，半月一期）&lt;/td&gt;&lt;td&gt;連續減少 1 期&lt;/td&gt;&lt;td&gt;2026-10-30 結算&lt;/td&gt;&lt;td&gt;08-14 53.0M、08-31 54.1M、09-15 55.7M、09-30 56.2M、10-15 58.1M、10-30 57.8M；近一年區間 34.1M～58.1M｜空單與交割&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;每日放空&lt;/td&gt;&lt;td&gt;放空成交占比（近20日平均）&lt;/td&gt;&lt;td&gt;61.0%&lt;/td&gt;&lt;td&gt;至 2026-11-16&lt;/td&gt;&lt;td&gt;前25日平均 49.1%；當天成交裡有多少是放空賣出（分母是 FINRA 場外回報成交量，不是全部成交）；不是未平倉空單；做市商、造市與避險的放空也算在內，大型股常態約三到四成，只看自己前後變化｜空單與交割&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;交易場所&lt;/td&gt;&lt;td&gt;暗池（ATS）週成交占比&lt;/td&gt;&lt;td&gt;16.4%&lt;/td&gt;&lt;td&gt;2026-10-12 當週&lt;/td&gt;&lt;td&gt;近 8 週 10.5%～16.4%；資料落後約 5 週（自週起日算到收盤日）；在暗池（另類交易系統，掛單不公開）成交的股數占當週總成交；FINRA 週資料約落後 2～4 週公布（小型股 Tier 2 更久）；ATS 與 OTC 分開算、不加總；只描述在哪裡成交，不代表買或賣｜空單與交割&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;交易場所&lt;/td&gt;&lt;td&gt;場外非暗池（OTC）週成交占比&lt;/td&gt;&lt;td&gt;35.2%&lt;/td&gt;&lt;td&gt;2026-10-12 當週&lt;/td&gt;&lt;td&gt;近 8 週 31.8%～37.7%；資料落後約 5 週（自週起日算到收盤日）；不經交易所也不經暗池、由券商自己撮合或內部化成交的占比；FINRA 週資料約落後 2～4 週公布（小型股 Tier 2 更久）；ATS 與 OTC 分開算、不加總；只描述在哪裡成交，不代表買或賣｜空單與交割&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;交割&lt;/td&gt;&lt;td&gt;Reg SHO 門檻名單（FINRA 場外）&lt;/td&gt;&lt;td&gt;未上榜&lt;/td&gt;&lt;td&gt;2026-08-24～2026-11-16&lt;/td&gt;&lt;td&gt;Reg SHO 門檻名單：交割失敗量大（≥1 萬股且 ≥ 流通股 0.5%）連續 5 個交割日的股票會被列入；FINRA 名單只涵蓋場外（OTC）證券；上市股的門檻名單由交易所發布，本欄未上榜不代表不是門檻證券，交易所名單本工具未查｜空單與交割&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;交割&lt;/td&gt;&lt;td&gt;Reg SHO 門檻名單（Nasdaq）&lt;/td&gt;&lt;td&gt;未上榜&lt;/td&gt;&lt;td&gt;2026-08-24～2026-11-16&lt;/td&gt;&lt;td&gt;門檻名單只查 FINRA（場外）與 Nasdaq；NYSE 與其他交易所上市股的名單未查（ICE 條款排除自動擷取），未上榜不代表不是門檻證券｜空單與交割&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;交割&lt;/td&gt;&lt;td&gt;交割失敗（FTD）&lt;/td&gt;&lt;td&gt;最大單日 1,021,760 股（占流通股 0.386%）；未達異常門檻&lt;/td&gt;&lt;td&gt;2026-08-03～2026-10-30&lt;/td&gt;&lt;td&gt;交割失敗：賣方到交割日沒有交出股票的股數（SEC 每半月公布一檔）；異常門檻＝≥1 萬股且 ≥ 流通股 0.5% 連續 5 個交割日；SEC 半月檔約落後 2 週，最新半月檔可能尚未公布（本次未取得：202611a、202611b）｜空單與交割&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;綜合&lt;/td&gt;&lt;td&gt;軋空條件（描述型燈號）&lt;/td&gt;&lt;td&gt;高&lt;/td&gt;&lt;td&gt;2026-10-30 結算&lt;/td&gt;&lt;td&gt;空單占流通股 21.83%（≥ 很多門檻）；回補 6.2 天（≥ 偏慢門檻）；空單最新期較前一期減少 0.5%；未在已查的門檻名單上、交割失敗未達異常門檻；空單占流通股（很多）接近門檻（21.83%／門檻 20%）；規則：空單占流通股 ≥10% 且回補 ≥5 天，再加「空單增加中（連增 ≥3 期或近一年最高）」「占流通股 ≥20%」「交割吃緊」任一＝高；占流通股 ≥10%、交割吃緊、或回補 ≥5 天且空單增加中＝留意；其餘＝低（門檻 2026-11-18 核定，軋空條件門檻）；描述空方部位擁擠程度與回補難易，不判股價冷熱、不是股價會不會漲的判斷；不進研究評等、非買賣建議｜空單與交割&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;資料來源 FINRA、SEC（門檻名單另含 Nasdaq Trader）；FINRA 資料限非商業研究用途；只描述，不判股價冷熱、不進研究評等、非買賣建議。&lt;/p&gt;&lt;!--/空單與交割--&gt;&lt;div class=&quot;wide&quot;&gt;&lt;/div&gt;&lt;/details&gt;&lt;details id=&quot;wp-5&quot;&gt;&lt;summary&gt;5 估值：情境算式、市價隱含第 10 年倍數、同業與歷史倍數交叉核對、條件式區間算法、市價反推、溢價來源與作者計算說明&lt;/summary&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;作者計算說明&lt;/h3&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;方法：產業模組「專案開發」，專案淨現值（NPV）×成功機率加總＋未估 NPV 資產帳面值－總部費用現值－非控制權益＋淨現金，引擎以「儲量NAV（資產淨值，這裡指專案價值加總）」欄位承載（估值輸入 evidence_notes.專案開發）。&lt;/strong&gt;情境權重保守 25%、基準 50%、樂觀 25%，不確定性極高、安全邊際 50%，買入上限 1.42 美元。區間來源（作者說明，偏離政策「區間取折現率高低兩端」的定義）：本方法合理價值區間 2.56–3.12 美元 是價格係數各 ±0.1 的結果，不是折現率高低；專案 NPV 沿用技術報告折現率、總部費用固定用 WACC（加權平均資金成本）9.48%，所以計算底稿與附錄中「只含折現率」「把折現率換成區間兩端（9.7%、11.7%）」的產生器說法不適用本公司；9.7%–11.7% 是股權成本 10.7% ±1 個百分點，基準 9.5% 是 WACC，口徑不同。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;情境用同一把尺：Vara Mada 成功機率 15%／40%／85%、Donald 50%／70%／95%；價格係數 0.8／1.0／1.0（區間各 ±0.1）；總部費用折 15／10／10 年；Pinyon Plain 鈾價 43.25／61.40／72.47 美元/磅（保守＝總經景氣位置 基準〔十年中位〕、基準＝樂觀〔75 百分位〕、樂觀＝目前實質價），比模組預設 33.67／43.25／61.40 各高一級；作者判斷：礦命約 3 年，2026 前九個月以長約售出 84 萬磅、加權均價 74.19 美元/磅&lt;span class=&quot;src&quot;&gt;（10-Q 2026-09-30 Item 2 ¶265）&lt;/span&gt;，十年中位價低於現有長約價；照模組預設，中點約 −3%&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;，價格位置不變。&lt;/strong&gt;加權中點 ÷ 基準每股＝2.838÷2.735＝1.04&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;。成功機率全為作者判斷：Vara Mada 需馬達加斯加議會核准投資協議或修法、獨居石加入採礦許可&lt;span class=&quot;src&quot;&gt;（10-Q 2026-09-30 Item 2 ¶71–72）&lt;/span&gt;；Donald 已延 FID 一次（新聞 N5 §11）。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;折現率：各專案沿用技術報告折現率（Vara Mada 10% 實質，比公司 WACC 嚴；Donald、Pinyon Plain 8%），NPV 基準日未滾動到收盤日&lt;span class=&quot;src&quot;&gt;（偏保守約一年，推導）&lt;/span&gt;。&lt;/strong&gt;總部費用用 WACC 9.48% 折現；beta（股價相對大盤的波動係數）1.33＝Damodaran 金屬礦業重新加槓桿 1.293 與 2 年週 beta 1.367 的平均（估值輸入 evidence_notes.折現率）。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;股權橋：現金 76.4＋流動有價證券 779.5&lt;span class=&quot;src&quot;&gt;（國庫券與機構債 759.1、上市股票 20.3，10-Q Item 1 ¶14、¶94–95）&lt;/span&gt;－債務面額 702.2＝股權橋淨額 153.7&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;。&lt;/strong&gt;工具 200.2 百萬美元&lt;span class=&quot;src&quot;&gt;（作者校正：原文 10-Q 2026-09-30；Part I, Item 1 ¶14）&lt;/span&gt; 用可轉債帳面淨額，又含非流動有價證券 25.2&lt;span class=&quot;src&quot;&gt;（Donald 墊款，¶96，已在 Donald 賺得計算內）&lt;/span&gt;，兩者差 46.5 是口徑不同&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;。受限現金 23.0 與復墾負債 24.2 大致相抵，兩者不列（作者判斷）。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;總部費用：近四季銷售管理費用 73.052／年&lt;span class=&quot;src&quot;&gt;（含股份報酬，不含交易整合費用；後者在損益表與分部附註是另一科目，10-Q Item 1 ¶295、¶302）&lt;/span&gt;，基準折 10 年＝459.1、保守折 15 年＝572.6，加非控制權益 4.9&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;。&lt;/strong&gt;若改成永續，中點約再降 38%&lt;span class=&quot;src&quot;&gt;（推導；每股以 0 為下限時約 36%）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;計算核對（2026-11-18，三項過門檻）：①流動有價證券進股權橋，拿掉時現行中點 2.84 美元→約 −0.11（約 −104%；每股以 0 為下限約 0.59、−79%；核對當時舊版中點 3.40 基準為 −86.7%；原文支持，維持）；②未估 NPV 資產以帳面計入，填 0 時現行中點約 −48%（下限 0 時約 −41%；舊版 3.40 基準為 −40.1%；原文支持，維持）；③總部費用採用建議值，修正重複扣除的交易整合費用後，若照原扣法中點 3.40，修正後 2.84&lt;span class=&quot;src&quot;&gt;（−16.4%，推導）&lt;/span&gt;。&lt;/strong&gt;未過門檻兩項 +2.4%、+7.3%（舊版 3.40 基準）不改。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;樂觀低於現價：樂觀已設定 Vara Mada 取得投資協議並 FID（85%）、Donald 投產（95%），每股 5.29 美元；兩案都 100% 且價格係數 1.0 時每股約 6.05，與現價相當&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;。&lt;/strong&gt;市價反推另一種解法是基準機率下價格係數約 2.30；兩種解法各自單獨成立，不是同時條件。市場也可能另給稀土第二期、Dubbo、VAC 價值，這些都未揭露 NPV。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;資金與稀釋&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;：資金需求約 1,538&lt;span class=&quot;src&quot;&gt;（Vara Mada FID 前 121＋第一期 769、8-K 2026-01-13 §57；稀土第二期 410、10-Q Item 2 ¶39；Donald 尚需 73.8、¶78；三年營運現金流出約 164）&lt;/span&gt;；可用約 1,581&lt;span class=&quot;src&quot;&gt;（現金與流動證券 855.9＋OSC 有條件貸款 725、¶285）&lt;/span&gt;。&lt;/strong&gt;OSC&lt;span class=&quot;src&quot;&gt;（提供 20 年期有條件貸款承諾的美國政府貸款方，10-Q Item 2 ¶285）&lt;/span&gt;不落實時缺口約 682；以現價增資因高於每股價值，對既有股東每股反而增加，股價跌到每股價值以下增資才會稀釋。VAC 現金約 718 與 65.85 百萬股未納入（宣布未完成）。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;FCFF 交叉核對（只並列，不進合理價值）：同一折現率與股權橋另跑，每股保守 0.00、基準 1.77、樂觀 8.71，加權 3.06，比主方法高約 8%&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;；穩態營業利益率取 Damodaran 金屬礦業 23.85%，市價反推要 33.9%。&lt;/strong&gt;此試算為暫存，未存檔（設定見估值輸入 evidence_notes.公司層級FCFF交叉核對）。&lt;/p&gt;&lt;p&gt;成長跑道六項：①市場空間——公司給產能目標（第二期合計約 6,000 噸 NdPr／年、Vara Mada 第一期約 84 萬噸鈦鐵礦），市場規模與滲透率未揭露；②定價能力——價格接受者，毛利率提升來自鈾價與成本；③營運槓桿——銷管費用占營收 2023–近四季 74%、47%、98%、62%，未持續下降；④指引達成——只給鈾量指引，近兩季維持；⑤資金——發股與可轉債，股數 +68%；⑥新事業——稀土金屬首度貢獻 0.44 百萬，只列事實不估值。&lt;/p&gt;&lt;p&gt;營收倍數對照（只揭露）：EV（企業價值，市值加淨負債）／營收現在 12.4 倍（EV／營收，主尺；分母近四季營收 2025-12-31～2026-09-30、模型股權橋企業價值；收盤 2026-11-16）；同業與歷史倍數只作交叉核對，不進評等。&lt;/p&gt;&lt;p&gt;此方法在本工作流的實例驗證：產業模組「專案開發」（專案 NPV×成功機率）本公司是首次使用；「商品價格接受者／能源礦業／金屬礦」產業公版預填待實例驗證。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;合理價值怎麼來：三個情境與權重&lt;/h3&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt&quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;每股價值（基準折現率 9.5%）&lt;/th&gt;&lt;th&gt;權重&lt;/th&gt;&lt;th&gt;區間較低值&lt;/th&gt;&lt;th&gt;區間較高值&lt;/th&gt;&lt;th&gt;外部假設（推導，引用自總經景氣位置）&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;0.59&lt;/td&gt;&lt;td&gt;25%&lt;/td&gt;&lt;td&gt;0.49&lt;/td&gt;&lt;td&gt;0.69&lt;/td&gt;&lt;td&gt;鈾（U3O8） 43.25 美元/磅（2026-09 的美元，實質（FRED PURANUSDM，CPI 平減））&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;2.73&lt;/td&gt;&lt;td&gt;50%&lt;/td&gt;&lt;td&gt;2.48&lt;/td&gt;&lt;td&gt;2.99&lt;/td&gt;&lt;td&gt;鈾（U3O8） 61.40 美元/磅（2026-09 的美元，實質（FRED PURANUSDM，CPI 平減））&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;5.29&lt;/td&gt;&lt;td&gt;25%&lt;/td&gt;&lt;td&gt;4.78&lt;/td&gt;&lt;td&gt;5.80&lt;/td&gt;&lt;td&gt;鈾（U3O8） 72.47 美元/磅（2026-09 的美元，實質（FRED PURANUSDM，CPI 平減））&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;加權（合理價值）&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;b&gt;2.84&lt;/b&gt;&lt;/td&gt;&lt;td&gt;100%&lt;/td&gt;&lt;td&gt;&lt;b&gt;2.56&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;b&gt;3.12&lt;/b&gt;&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;中點是三個情境的加權：0.25×0.59＋0.5×2.73＋0.25×5.29≈2.84（一般權重組合）。區間上下緣是同樣三個情境、權重不變，只把折現率換成區間兩端（9.7%、11.7%）重算，各情境取較低值加權為 2.56（下緣）、較高值加權為 3.12（上緣）。買入上限 1.42＝中點 × (1－安全邊際 50%，不確定性極高)，股價在此以下才有 50% 安全邊際。情境表說明合理價值怎麼組成，不是單一目標價；非買賣建議。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;市價隱含第 10 年倍數（不適用）&lt;/h3&gt;&lt;p class=&quot;cap&quot;&gt;本方法不適用 EV/EBIT 隱含倍數；改引用本方法市價反推（估值結果）（主方法 儲量NAV）。&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;本方法的市價反推（估值結果）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;折現率&lt;/th&gt;&lt;th&gt;反推指標&lt;/th&gt;&lt;th&gt;值&lt;/th&gt;&lt;th&gt;折現率／比率&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;隱含商品價格係數（相對 SEC 價格）&lt;/td&gt;&lt;td&gt;2.30&lt;/td&gt;&lt;td&gt;100.00%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;&lt;b&gt;合理價值 vs 市價隱含倍數（作者判讀）：&lt;/b&gt;本方法不適用 EV/EBIT（息稅前利益）隱含倍數，改看主方法市價反推：現價 6.04 美元 在基準成功機率下，相當於專案價值是技術報告的約 2.30 倍；或兩大專案都視為幾乎確定成功（推導）。只描述，不當評等理由。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;合理性與一致性檢查（只顯示，不改估值與評等）&lt;/h3&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;每項都有反方向版本；「方向」是亮燈時模型偏保守還是偏積極&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;編號&lt;/th&gt;&lt;th&gt;檢查&lt;/th&gt;&lt;th&gt;燈號&lt;/th&gt;&lt;th&gt;方向&lt;/th&gt;&lt;th&gt;說明&lt;/th&gt;&lt;th&gt;反方向條件&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;S1&lt;/td&gt;&lt;td&gt;合理價中點隱含本益比對照營收成長&lt;/td&gt;&lt;td&gt;不適用&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;EPS 不為正或缺營收成長&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;S2&lt;/td&gt;&lt;td&gt;DCF 中點與其他方法中點差距&lt;/td&gt;&lt;td&gt;紅&lt;/td&gt;&lt;td&gt;偏保守&lt;/td&gt;&lt;td&gt;其他方法中點的中位數 18.27（1 法：自身・近五年（2021-11-16 起）〔EV／營收〕）÷ DCF 中點 2.84&lt;/td&gt;&lt;td&gt;反方向：比值 &amp;lt; 0.67 黃、&amp;lt; 0.5 紅（DCF 比其他方法高很多）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;S3&lt;/td&gt;&lt;td&gt;折現率減市價反推折現率&lt;/td&gt;&lt;td&gt;不適用&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;缺折現率或反推值&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;S4&lt;/td&gt;&lt;td&gt;終值占總價值比例&lt;/td&gt;&lt;td&gt;不適用&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;非 DCF 方法&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;S5&lt;/td&gt;&lt;td&gt;終值倍數落點&lt;/td&gt;&lt;td&gt;不適用&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;缺模型倍數或參考帶&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;S6&lt;/td&gt;&lt;td&gt;保守（或積極）假設疊加項數&lt;/td&gt;&lt;td&gt;綠&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;保守：折現率（區間向上偏或高於反推 2 點以上）、安全邊際 50%；積極：無&lt;/td&gt;&lt;td&gt;反方向：積極項數 3 黃、4 以上紅（已含）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;S9&lt;/td&gt;&lt;td&gt;樂觀情境低於現價要說明&lt;/td&gt;&lt;td&gt;綠&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;樂觀情境每股 5.29 低於現價 6.04；作者已說明&lt;/td&gt;&lt;td&gt;反方向：保守情境高於現價時黃燈，要說明保守是否設太高&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;S10&lt;/td&gt;&lt;td&gt;DCF 情境範圍與其他方法是否完全錯開&lt;/td&gt;&lt;td&gt;紅&lt;/td&gt;&lt;td&gt;偏保守&lt;/td&gt;&lt;td&gt;樂觀 5.29、保守 0.59；其他方法最低下緣 12.02、最高上緣 33.42&lt;/td&gt;&lt;td&gt;反方向：保守高於所有其他方法上緣紅（已含）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;S7&lt;/td&gt;&lt;td&gt;折現率跨公司排序&lt;/td&gt;&lt;td&gt;綠&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;反方向：本公司風險分高 2 以上、折現率卻較低時，記在對方公司（同一規則兩頭都檢）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;S8&lt;/td&gt;&lt;td&gt;品質倒掛&lt;/td&gt;&lt;td&gt;不適用&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;近四季 EPS 不為正&lt;/td&gt;&lt;td&gt;反方向：生意 C 高於 B 中位（已含）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;C1&lt;/td&gt;&lt;td&gt;護城河用詞統一寬／窄／無&lt;/td&gt;&lt;td&gt;黃&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;出現強／中／弱用法&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;C2&lt;/td&gt;&lt;td&gt;兩頁不並存兩套字母評等&lt;/td&gt;&lt;td&gt;黃&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;估值頁生意 C、商業評估 D 級（不同字母容易被讀成同一把尺）&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;C3&lt;/td&gt;&lt;td&gt;假設與自己的護城河評分一致（P4）&lt;/td&gt;&lt;td&gt;綠&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;C4&lt;/td&gt;&lt;td&gt;同一事件期間描述一致（指引達成連續季數）&lt;/td&gt;&lt;td&gt;綠&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;C5&lt;/td&gt;&lt;td&gt;同一指標不同段落同值&lt;/td&gt;&lt;td&gt;黃&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;淨現金：完整底稿#price-detail「淨現金（現金＋流動有價證券−有息負債） 1.7 億美元」 對 完整底稿#price-detail「淨現金（再加非流動有價證券） 2.0 億美元」 等 2 組（同一指標不同段落數字不同；改寫 {{欄位}} 或在文中說明口徑差異）&lt;/td&gt;&lt;td&gt;不分方向：任一處寫高或寫低都會亮；條件句、敏感度試算、其他期間與情境的數字不比（寧可漏報）&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;!--成長型價格參考--&gt;&lt;div class=&quot;block&quot; id=&quot;growth-ref&quot;&gt;&lt;h3&gt;成長型價格參考：報酬門檻價、五年報酬矩陣、林區比值（只描述，不進評等，非買賣建議）&lt;/h3&gt;&lt;p class=&quot;cap&quot;&gt;這一段只描述，不進研究評等、不改價格位置，也不是目標價；三種情境並列、不合成單一數字，數字是「該情境成真時」的條件式推算，不是預期報酬。非買賣建議。&lt;/p&gt;&lt;p class=&quot;cap&quot;&gt;報酬門檻價與五年報酬矩陣：不適用（儲量NAV）。報酬門檻價與五年報酬矩陣目前只做現金流折現（FCFF）主方法；本方法不適用。只描述，不進研究評等、價格位置與合理價值；三種情境並列，不合成單一數字；條件式推算，不是預期報酬、不是目標價。非買賣建議&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;三、林區比值（只給比值與口徑；成長率與本益比的口徑同「PEG 與林區檢查」表的基準情境推估那一列）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;數值&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;林區分類&lt;/td&gt;&lt;td&gt;週期型&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;成長率（基準情境推估）&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;本益比&lt;/td&gt;&lt;td&gt;-12.6 倍&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股息殖利率&lt;/td&gt;&lt;td&gt;0.0%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;本益比 ÷ 成長率&lt;/td&gt;&lt;td&gt;不適用（虧損或本益比無意義）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;（成長率＋股息殖利率）÷ 本益比&lt;/td&gt;&lt;td&gt;不適用（虧損或本益比無意義）&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;林區以本益比約等於成長率為參考（二手來源轉述）；本表不設門檻。只給比值與口徑，不作便宜或昂貴的判斷，不進研究評等與價格位置。非買賣建議。&lt;/p&gt;&lt;/div&gt;&lt;!--/成長型價格參考--&gt;&lt;!--目標區間:第五題--&gt;&lt;div class=&quot;block&quot; id=&quot;target-body&quot;&gt;&lt;h3&gt;各情境成真時的價值（一年後，條件式、非買賣建議）&lt;/h3&gt;&lt;p class=&quot;cap&quot;&gt;條件式目標區間：三種情境各自成真時的每股價值區間，不是股價預測，三段不合成單一數字；非買賣建議。不影響合理價值、價格位置與研究評等。&lt;/p&gt;&lt;p&gt;算法：各情境每股價值（折現率高低兩端）×（1＋股權成本 10.71%）− 未來 12 個月每股股利 0.00 美元（近四季無股利（價值判斷 股利殖利率 0）；回購：近十年（2016–2025）均未申報，推定為零（推導值）；股利：近十年（2016–2025）均未申報，推定為零（推導值））；回購不加回。起點 2026-11-16 收盤，終點 2027-11-16。三段是各情境在折現率上下兩端的每股價值向前推 12 個月，不是價格機率分布的切片；段與段之間可能有空白，也可能重疊。區間主要寬度來自折現率不確定，不是 12 個月內的營運變化。&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt&quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;機率（政策權重，未經歷史校準）&lt;/th&gt;&lt;th&gt;目標區間（美元）&lt;/th&gt;&lt;th&gt;相對現價&lt;/th&gt;&lt;th&gt;關鍵假設（估值輸入）&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;25%&lt;/td&gt;&lt;td&gt;&lt;b&gt;0.54–0.77&lt;/b&gt;&lt;/td&gt;&lt;td&gt;−91%～−87%&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;見估值輸入該情境（external_assumptions、net_debt、other_business_value、other_claims、price_factor、price_factor_range、standardized_measure）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;50%&lt;/td&gt;&lt;td&gt;&lt;b&gt;2.75–3.31&lt;/b&gt;&lt;/td&gt;&lt;td&gt;−55%～−45%&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;見估值輸入該情境（external_assumptions、net_debt、other_business_value、other_claims、price_factor、price_factor_range、standardized_measure）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;25%&lt;/td&gt;&lt;td&gt;&lt;b&gt;5.29–6.42&lt;/b&gt;&lt;/td&gt;&lt;td&gt;−12%～+6%&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;見估值輸入該情境（external_assumptions、net_debt、other_business_value、other_claims、price_factor、price_factor_range、standardized_measure）&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;口徑：報告中「現價隱含年報酬（基準情境，非預期報酬）」是以現價買進、持有該情境全期現金流（含永續價值）的年化報酬；這裡的目標區間是 12 個月後各情境每股價值的前推，兩者口徑不同，不能互相換算（例如不能用前者推 12 個月後的價格）。&lt;/p&gt;&lt;h4 style=&quot;margin-top:14px&quot;&gt;每一段要成立，市場這一面需要什麼、正在顯示什麼&lt;/h4&gt;&lt;ul class=&quot;prose&quot;&gt;&lt;li&gt;以 2028-01-21 到期選擇權的價平隱含波動 85.3%（2026-11-17 18:46 UTC 取得；盤中報價，美東 13:46 取得；最近成交 2026-11-17；取價時現價 5.99，起點價 6.04 為 2026-11-16 收盤）定價，12 個月後（2027-11-16）價格落在保守段 1.3%、基準段 7.9%、樂觀段 8.6%；低於最低端（0.54） 0.7%、高於最高端（6.42） 33%、段與段之間空白 49%、段與段重疊 0.0%。這是風險中立機率，不是真實機率；不改情境權重、不改估值與評等；選擇權定價含風險溢酬與波動偏態，與三段情境機率是兩回事。報價品質：買權 90.7%、賣權 79.8% 相差 11 個百分點，報價可能過時或含偏斜，只作參考。&lt;/li&gt;&lt;li&gt;分析師預估：本財年每股盈餘預估 -0.28，較 30 天前 -0.28 +0.0%（持平），近 30 天 1 家上修、2 家下修；下一財年每股盈餘預估 0.48，較 30 天前 0.48 +0.0%（持平），近 30 天 1 家上修、1 家下修。只描述預估修正的方向，不當證據，也不是目標區間的任一端。&lt;/li&gt;&lt;li&gt;券商目標價近 90 天有 2 家調整：上調 0、下調 2、持平 0（只揭露，不是本報告的目標價）。&lt;/li&gt;&lt;li&gt;上季（Sep 2026，11/4/2026 公布）每股盈餘 -0.2，共識預估 -0.1，驚奇 -100%（Nasdaq）；yfinance 另列 2026-09-30 實際 -0.2、預估 -0.04、驚奇 -445.40%；兩個來源口徑可能不同，且可能與公司申報的每股盈餘都不同；此季財報新聞稿不在存檔 8-K，未對照申報，只描述、不當證據。&lt;/li&gt;&lt;/ul&gt;&lt;p class=&quot;cap&quot;&gt;以上只引用已存檔的數字描述條件與現況，不是預測；選擇權機率是風險中立機率、不是真實機率，不改情境權重；分析師預估與券商目標價不當證據；細節表在附錄估值細節。&lt;/p&gt;&lt;p&gt;&lt;b&gt;需要重算區間的事件：&lt;/b&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;VAC 收購完成：支付現金約 718.0 百萬並發行約 65.85 百萬股新股（約占目前股數 25%，推導），且併入 VAC 營收、債務與 Sumter 廠客戶仲裁結果；現行三情境未納入 VAC，完成後區間需重算（10-Q 2026-09-30 Part I, Item 1 ¶48；8-K 2026-10-13 本文 §890）&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;b&gt;時程可能延後、落在 12 個月之外的事件：&lt;/b&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;Vara Mada 正面 FID 需先與馬達加斯加政府完成財政與穩定條款，12 個月內可能無法定案（10-Q 2026-06-30 Part I, Item 2 ¶62；10-Q 2026-09-30 Part I, Item 2 ¶70）&lt;/li&gt;&lt;/ul&gt;&lt;ul class=&quot;cap&quot;&gt;&lt;li&gt;三情境第 1 年營收成長或營業利益率未由保守到樂觀遞增，或該估值法沒有這兩個欄位：不列觸發條件的數字門檻。&lt;/li&gt;&lt;li&gt;估值法為儲量NAV：依主方法每股價值前推，待金融業／REIT／產業分支工作線核定。&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;!--/目標區間:第五題--&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;市價要求的成長：三視角反推、假設對照實績、歷史基準比率與市價溢價來源&lt;/h3&gt;&lt;p&gt;這一節把現價代回估值模型反解「市場要求什麼」，再和公司實績、同規模公司的歷史比例、市場面的過熱訊號對照；只揭露，不改合理價值、價格位置與研究評等。&lt;/p&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;市價溢價來源&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;有資料的列都沒有過熱訊號。倍數重估、資金與情緒無訊號。只揭露，不改研究評等與價格位置，也不代表市價錯誤。&lt;/p&gt;&lt;p&gt;EPS 預估：+1y（財年未對應） 預估 90 天 0.0%（持平；判斷窗口為 90 天，±2% 內視為持平），近 30 天上修減下修 0 家；yfinance 預估是取得當下快照，股價 90 天變化以批次收盤日為終點，兩者日期可能差幾天；預估取得日 2026-11-14、股價終點收盤日 2026-11-16；取得 2026-11-14。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;來源類別&lt;/th&gt;&lt;th&gt;數值&lt;/th&gt;&lt;th&gt;過熱訊號&lt;/th&gt;&lt;th&gt;說明／存檔位置&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;隱含假設罕見度&lt;/td&gt;&lt;td&gt;基本面預期&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;不適用&lt;/td&gt;&lt;td&gt;不適用：估值結果沒有市價隱含成長（非 FCFF 方法或狀態未計算）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;倍數擴張&lt;/td&gt;&lt;td&gt;倍數重估&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;不適用&lt;/td&gt;&lt;td&gt;近四季 EPS 在 2024-05-02 之後不為正，本益比序列停在 2024-05-02；收盤日 2026-11-16 的本益比、股債利差「目前」不適用（不是現在的值）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;預估背離&lt;/td&gt;&lt;td&gt;倍數重估&lt;/td&gt;&lt;td&gt;+1y（財年未對應） EPS 預估 90 天 +0.0%（持平；90 天變化 ±2% 內視為持平），同期股價 -57.1% → 預估未跟上下跌，偏情緒&lt;/td&gt;&lt;td&gt;無&lt;/td&gt;&lt;td&gt;價值判斷&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;本益比水位&lt;/td&gt;&lt;td&gt;倍數重估&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;不適用&lt;/td&gt;&lt;td&gt;近四季 EPS 在 2024-05-02 之後不為正，本益比序列停在 2024-05-02；收盤日 2026-11-16 的本益比、股債利差「目前」不適用（不是現在的值）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股債利差&lt;/td&gt;&lt;td&gt;總經與利率&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;不適用&lt;/td&gt;&lt;td&gt;歷史本益比&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;整體市場風險溢價&lt;/td&gt;&lt;td&gt;總經與利率&lt;/td&gt;&lt;td&gt;Damodaran 隱含風險溢價 4.20%（2026-10-01）&lt;/td&gt;&lt;td&gt;不適用&lt;/td&gt;&lt;td&gt;只存當月值，沒有歷史序列可比中位數；要下載 Damodaran 歷史表需取得授權&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;動能&lt;/td&gt;&lt;td&gt;資金與情緒&lt;/td&gt;&lt;td&gt;相對 200 日均線 -61%；12 個月（2025-11-13 起） -61% 對 S&amp;amp;P500 +11%&lt;/td&gt;&lt;td&gt;無&lt;/td&gt;&lt;td&gt;市場溫度、#/動能&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;部位與衍生品&lt;/td&gt;&lt;td&gt;資金與情緒&lt;/td&gt;&lt;td&gt;選擇權賣權對買權量比 偏冷；空單分位 100%、回補天數分位 100%（有軋空條件）&lt;/td&gt;&lt;td&gt;無&lt;/td&gt;&lt;td&gt;股價在 200 日均線下且 12 個月下跌，熱度不視為溢價來源&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;擁擠度&lt;/td&gt;&lt;td&gt;資金與情緒&lt;/td&gt;&lt;td&gt;20 日均換手率在自身五年 70% 分位；被發現程度 高&lt;/td&gt;&lt;td&gt;無&lt;/td&gt;&lt;td&gt;市場溫度&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;門檻： 2026-11-04 照草案核定。各列只描述市場面，不改合理價值、研究評等與價格位置，非買賣建議。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;!--目標區間:附錄--&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;目標區間的倍數核對（只列不合成）&lt;/h3&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt&quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;倍數區段&lt;/th&gt;&lt;th&gt;倍數（EV／營收）&lt;/th&gt;&lt;th&gt;第 1 年獲利（百萬美元）&lt;/th&gt;&lt;th&gt;核對區間（美元）&lt;/th&gt;&lt;th&gt;代表值需要倍數&lt;/th&gt;&lt;th&gt;主方法代表值對核對區間中點&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;同規模同成長 p25～中位&lt;/td&gt;&lt;td colspan=&quot;5&quot;&gt;未列（缺第 1 年獲利或倍數尺）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;現在倍數～自身近五年 p25&lt;/td&gt;&lt;td colspan=&quot;5&quot;&gt;未列（缺第 1 年獲利或倍數尺）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;自身近五年中位～p75&lt;/td&gt;&lt;td colspan=&quot;5&quot;&gt;未列（缺第 1 年獲利或倍數尺）&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;各情境第 1 年營收（假設，推導；不是公司指引）。每股 =（倍數 × 獲利 − 股權橋 -149）÷ 264.8 百萬股，與估值模型同口徑。倍數核對回答「市場一年後照這種擔憂程度給倍數，價格會在哪」；與主方法的差距是價值與市場慣例的落差，不合成、不平均。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;約 12 個月選擇權隱含分布下，各段的風險中立機率&lt;/h3&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt&quot;&gt;&lt;tr&gt;&lt;th&gt;保守段&lt;/th&gt;&lt;th&gt;基準段&lt;/th&gt;&lt;th&gt;樂觀段&lt;/th&gt;&lt;th&gt;低於最低端&lt;/th&gt;&lt;th&gt;高於最高端&lt;/th&gt;&lt;th&gt;段與段空白&lt;/th&gt;&lt;th&gt;段與段重疊&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;1.3%&lt;/td&gt;&lt;td&gt;7.9%&lt;/td&gt;&lt;td&gt;8.6%&lt;/td&gt;&lt;td&gt;0.7%&lt;/td&gt;&lt;td&gt;33%&lt;/td&gt;&lt;td&gt;49%&lt;/td&gt;&lt;td&gt;0.0%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;風險中立機率，不是真實機率；不改情境權重、不改估值與評等。到期日 2028-01-21（離終點日 66 天）價平隱含波動 85.3%（買權 91%、賣權 80%），最近成交 2026-11-17 18:25:08+00:00（盤中報價，美東 13:46 取得；最近成交 2026-11-17；取價時現價 5.99，起點價 6.04 為 2026-11-16 收盤）；無風險利率 4.65%（FRED DGS1，2026-11-13 觀測 4.65%，資料庫/利率_FRED）、股利率 0.00%；起點價格 6.04（2026-11-16 收盤）。對數常態；漂移＝無風險利率（固定用 1 年期 DGS1，期間固定 1 年，不依到期日做期限插補）−股利率；波動＝價平隱含波動（不含波動微笑與偏態）；以批次收盤價為起點、12 個月為期間。各段機率是價格落在該段價值區間內的機率，段與段重疊處在各段機率中重複計入。報價品質：買權 90.7%、賣權 79.8% 相差 11 個百分點，報價可能過時或含偏斜，只作參考。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;預估修正趨勢（只描述，不當證據）&lt;/h3&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt&quot;&gt;&lt;tr&gt;&lt;th&gt;期間&lt;/th&gt;&lt;th&gt;每股盈餘預估&lt;/th&gt;&lt;th&gt;7 天前&lt;/th&gt;&lt;th&gt;30 天前&lt;/th&gt;&lt;th&gt;60 天前&lt;/th&gt;&lt;th&gt;90 天前&lt;/th&gt;&lt;th&gt;較 30 天前&lt;/th&gt;&lt;th&gt;近 7 天上修／下修家數&lt;/th&gt;&lt;th&gt;近 30 天上修／下修家數&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;本季&lt;/td&gt;&lt;td&gt;-0.05&lt;/td&gt;&lt;td&gt;0.00&lt;/td&gt;&lt;td&gt;0.00&lt;/td&gt;&lt;td&gt;0.00&lt;/td&gt;&lt;td&gt;0.00&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;0／0&lt;/td&gt;&lt;td&gt;0／0&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;下一季&lt;/td&gt;&lt;td&gt;-0.01&lt;/td&gt;&lt;td&gt;-0.03&lt;/td&gt;&lt;td&gt;-0.02&lt;/td&gt;&lt;td&gt;-0.02&lt;/td&gt;&lt;td&gt;-0.02&lt;/td&gt;&lt;td&gt;下修&lt;/td&gt;&lt;td&gt;0／1&lt;/td&gt;&lt;td&gt;0／1&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;本財年&lt;/td&gt;&lt;td&gt;-0.28&lt;/td&gt;&lt;td&gt;-0.28&lt;/td&gt;&lt;td&gt;-0.28&lt;/td&gt;&lt;td&gt;-0.28&lt;/td&gt;&lt;td&gt;-0.30&lt;/td&gt;&lt;td&gt;持平&lt;/td&gt;&lt;td&gt;1／2&lt;/td&gt;&lt;td&gt;1／2&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;下一財年&lt;/td&gt;&lt;td&gt;0.48&lt;/td&gt;&lt;td&gt;0.48&lt;/td&gt;&lt;td&gt;0.48&lt;/td&gt;&lt;td&gt;0.48&lt;/td&gt;&lt;td&gt;0.48&lt;/td&gt;&lt;td&gt;持平&lt;/td&gt;&lt;td&gt;1／0&lt;/td&gt;&lt;td&gt;1／1&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;分析師預估與券商目標價只描述，不當證據，也不是目標區間任一端；上修／下修門檻為較 30 天前變動 ±1%（本工具設定；與「市價溢價來源」預估修正以 90 天 ±2% 判持平是兩個口徑）。資料取得 2026-11-14T23:37:37（台北時間）（yfinance eps_trend、eps_revisions）。券商目標價近 90 天 2 家調整：上調 0、下調 2、持平 0；上季財報驚奇（Nasdaq）：Sep 2026，11/4/2026 公布，每股盈餘 -0.2、共識 -0.1、驚奇 -100%；（yfinance）：2026-09-30，實際 -0.2、預估 -0.03667。兩個來源口徑可能不同（可能是調整後或一般會計準則，也可能與公司申報的每股盈餘都不同）；此季財報新聞稿不在存檔 8-K，未對照申報，只描述，不比較、不當證據。每批另存快照自建歷史：1 筆（2026-11-14 至 2026-11-14）。&lt;/p&gt;&lt;/div&gt;&lt;!--/目標區間:附錄--&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;專案價值拆解（基準情境）&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;基準股權價值有八成靠 Vara Mada 的機率加權價值撐著，總部費用扣掉的部分和未估資產帳面值大致相當&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;；股數 264.8 百萬股，VAC 對價股未納入。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;figure&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt signals&quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;技術報告價值（百萬美元）&lt;/th&gt;&lt;th&gt;成功機率 保守／基準／樂觀&lt;/th&gt;&lt;th&gt;基準計入（百萬美元，推導）&lt;/th&gt;&lt;th&gt;出處&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Vara Mada（100%，稅後實質 NPV10）&lt;/td&gt;&lt;td&gt;1,415&lt;/td&gt;&lt;td&gt;15%／40%／85%&lt;/td&gt;&lt;td&gt;566.0&lt;/td&gt;&lt;td&gt;8-K 2026-01-13 §60–61&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Donald 第一期（賺得 49% 後權益）&lt;/td&gt;&lt;td&gt;95.5（推導）&lt;/td&gt;&lt;td&gt;50%／70%／95%&lt;/td&gt;&lt;td&gt;66.9&lt;/td&gt;&lt;td&gt;8-K 2026-02-26 §695、§787；10-Q Item 2 ¶76–78&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Pinyon Plain（生產中，依情境鈾價縮放）&lt;/td&gt;&lt;td&gt;13.4／40.8／57.5&lt;/td&gt;&lt;td&gt;100%&lt;/td&gt;&lt;td&gt;40.8&lt;/td&gt;&lt;td&gt;8-K 2026-02-26 §51–52&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;未估 NPV 資產帳面（稀土第二期、Dubbo、設施、營運資金）&lt;/td&gt;&lt;td&gt;未揭露&lt;/td&gt;&lt;td&gt;帳面計入&lt;/td&gt;&lt;td&gt;360.9&lt;/td&gt;&lt;td&gt;10-Q Item 1 ¶14、¶106&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;淨現金（現金＋流動有價證券－債務面額）&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;153.7&lt;/td&gt;&lt;td&gt;10-Q Item 1 ¶14、¶94–95&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;減：總部費用現值與非控制權益&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;保守 15 年／基準 10 年&lt;/td&gt;&lt;td&gt;−464.0&lt;/td&gt;&lt;td&gt;10-Q Item 1 ¶295、¶302&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股權價值&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;724.2（每股 2.73）&lt;/td&gt;&lt;td&gt;估值結果 dcf/基準&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;估值方法與參數&lt;/h3&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;方法&lt;/th&gt;&lt;th&gt;低&lt;/th&gt;&lt;th&gt;中&lt;/th&gt;&lt;th&gt;高&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;儲量 NAV 保守&lt;/td&gt;&lt;td&gt;0&lt;/td&gt;&lt;td&gt;1&lt;/td&gt;&lt;td&gt;1&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;儲量 NAV 基準&lt;/td&gt;&lt;td&gt;2&lt;/td&gt;&lt;td&gt;3&lt;/td&gt;&lt;td&gt;3&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;儲量 NAV 樂觀&lt;/td&gt;&lt;td&gt;5&lt;/td&gt;&lt;td&gt;5&lt;/td&gt;&lt;td&gt;6&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p style=&quot;font-size:14px&quot;&gt;折現率基準 9.5%（區間 9.7%–11.7%）：無風險利率 5.12%、市場風險溢價 4.20%、beta 1.33。主方法為「儲量NAV」，依 skills/產業估值方法 的方法卡；股權法以股權成本 10.7%（區間 9.7%–11.7%）折現。&lt;/p&gt;&lt;p style=&quot;font-size:14px&quot;&gt;同業：。排除：CCJ：D、F：Cameco 為鈾業成熟同業，但本公司近四季 EBITDA -88.2 為負，EV/EBITDA 無法換算；且以 40-F／IFRS 申報，不在本工作流同業資料口徑, MP：D：MP Materials 為美國稀土同業，近年營業利益為負，倍數失真, UEC：D：Uranium Energy 為美國鈾礦同業，近年營業利益為負，倍數失真, FCX：A、C：產業卡同業池提示，銅金大型礦商，規模與產品組合差距過大。&lt;/p&gt;&lt;p style=&quot;font-size:14px&quot;&gt;產業公版：商品價格接受者／能源礦業／金屬礦；驗證狀態：公開資料預填，待實例驗證（0 家）；本公司尚未列入實例。首家產業，公版的估值法與指標選擇尚未經兩家以上驗證，審查與讀者請多看適用性。&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;details id=&quot;wp-value&quot;&gt;&lt;summary&gt;價值判斷：PEG、林區資產負債表檢查與交叉檢查&lt;/summary&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;PEG 與林區檢查&lt;/h3&gt;&lt;div class=&quot;wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;PEG：可計算的成長口徑（紅線為 1 與 2）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 500 62&quot; role=&quot;img&quot; aria-label=&quot;PEG&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;217.4&quot; x2=&quot;217.4&quot; y1=&quot;6&quot; y2=&quot;56&quot; class=&quot;zero&quot;/&gt;&lt;line x1=&quot;319.5&quot; x2=&quot;319.5&quot; y1=&quot;4&quot; y2=&quot;58&quot; class=&quot;price&quot;/&gt;&lt;line x1=&quot;421.6&quot; x2=&quot;421.6&quot; y1=&quot;4&quot; y2=&quot;58&quot; class=&quot;price&quot;/&gt;&lt;text x=&quot;158&quot; y=&quot;23&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;近四季對上一財年&lt;/text&gt;&lt;rect x=&quot;168.0&quot; y=&quot;9&quot; width=&quot;49.4&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;225.4&quot; y=&quot;23&quot; class=&quot;val&quot;&gt;-0.5&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;PEG 與林區加股利比率（可計算的成長口徑）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;成長口徑&lt;/th&gt;&lt;th&gt;成長率&lt;/th&gt;&lt;th&gt;PEG&lt;/th&gt;&lt;th&gt;判讀&lt;/th&gt;&lt;th&gt;加股利比率&lt;/th&gt;&lt;th&gt;判讀&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;近四季對上一財年（申報 EPS）&lt;/td&gt;&lt;td&gt;26.1%&lt;/td&gt;&lt;td&gt;-0.5&lt;/td&gt;&lt;td&gt;虧損，PEG 不適用&lt;/td&gt;&lt;td&gt;-2.07&lt;/td&gt;&lt;td&gt;虧損，不適用&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:4px&quot;&gt;PEG 的判讀標籤依估值政策門檻；高風險、成長極高或極低的公司，PEG 有系統性偏誤（同樣成長下風險越高 PEG 越低），不能只憑標籤判斷便宜或昂貴。&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;林區式資產負債表與市場檢查&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;數值&lt;/th&gt;&lt;th&gt;林區的看法&lt;/th&gt;&lt;th&gt;判讀&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;本益比&lt;/td&gt;&lt;td&gt;-12.61&lt;/td&gt;&lt;td&gt;與自身歷史比較&lt;/td&gt;&lt;td&gt;資料限制：申報 EPS 為 -12.6 倍；可比的正值申報 EPS 歷史不足，不計算歷史百分位&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;每股淨現金&lt;/td&gt;&lt;td&gt;0.76&lt;/td&gt;&lt;td&gt;淨現金可提供下檔保護（林區 O31、LAK02）&lt;/td&gt;&lt;td&gt;好：有淨現金，可提供下檔保護；占股價 12.5%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;負債對權益&lt;/td&gt;&lt;td&gt;0.71&lt;/td&gt;&lt;td&gt;一般越低越好（林區 L25）&lt;/td&gt;&lt;td&gt;不評好壞：有息負債約為股東權益的 0.71 倍；沒有公認門檻，償債能力見收現段償債指標&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;每股自由現金流（近四季）&lt;/td&gt;&lt;td&gt;未取得&lt;/td&gt;&lt;td&gt;比每股盈餘更接近現金（林區 O37、修正10）&lt;/td&gt;&lt;td&gt;不評好壞：自由現金流殖利率 0.0%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股數年變化（近三財年）&lt;/td&gt;&lt;td&gt;12.6%&lt;/td&gt;&lt;td&gt;持續買回、且價格合理、資金來自本業現金時才是好訊號（林區 L16、O19）&lt;/td&gt;&lt;td&gt;注意：近三財年平均每年 +12.6%，高於政策 2% 線；最近一季對去年同季 +9.2%（2025-09-30→2026-09-30）；PEG 推估用財務歷史年度稀釋股數 2022→2025 +12.7%（期間不同）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;存貨增速 vs 營收增速&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;存貨增速高於營收是警訊（林區 O50）&lt;/td&gt;&lt;td&gt;資料限制：無資料&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;內部人公開市場買進&lt;/td&gt;&lt;td&gt;2&lt;/td&gt;&lt;td&gt;內部人自掏腰包買進是強訊號&lt;/td&gt;&lt;td&gt;好：近期有 2 人自掏腰包買進，依林區屬強訊號&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;林區以外的交叉檢查（只揭露，不改研究評等與價格位置）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;檢查&lt;/th&gt;&lt;th&gt;結果&lt;/th&gt;&lt;th&gt;判讀&lt;/th&gt;&lt;th&gt;依據與限制&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Piotroski F 分數（財報是否在改善）&lt;/td&gt;&lt;td&gt;1 ／ 7 項（2024-12-31→2025-12-31）&lt;/td&gt;&lt;td&gt;弱&lt;/td&gt;&lt;td&gt;未通過：ROA＞0（淨利 ÷ 期初總資產）、營運現金流＞0、ROA 比上年高、營運現金流＞淨利（應計少）、毛利率比上年高、資產周轉率比上年高（營收 ÷ 期初總資產）。Piotroski（2000）研究文獻/Piotroski2000_財報訊號 第 9–11、15 頁；8–9 分高分組、0–2 分低分組&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Beneish M 分數（盈餘被美化的機率）&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;待核對&lt;/td&gt;&lt;td&gt;Beneish（1999）原文未存檔，係數與分界未核對；折舊用折舊攤銷合計（近似）。待取得下載授權原文存檔後才列入報告&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Greenblatt 盈餘殖利率與資本報酬率&lt;/td&gt;&lt;td&gt;盈餘殖利率 -6.8%；ROIC -106%&lt;/td&gt;&lt;td&gt;低於 10 年公債 5.1%；ROIC -106% 低於 WACC 9.5%&lt;/td&gt;&lt;td&gt;盈餘殖利率＝近四季營業利益 ÷（市值＋有息負債－現金與證券），推導；ROIC 為本專案稅後口徑，非 Greenblatt 原式稅前；不做排名&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;details id=&quot;wp-6&quot;&gt;&lt;summary&gt;6 財務：償債指標、融資活動、存活檢查與利率壓力測試（含判定規則與限制）&lt;/summary&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;融資活動與償債：錢還給誰、有沒有借錢、還不還得起&lt;/h3&gt;&lt;p class=&quot;cap&quot;&gt;利息保障改讀信用與存活的利息口徑（EBIT ÷ 近四季利息費用（作者讀附註：10-K 2025-12-31 Item 8 ¶269；10-Q 2026-09-30 Part I, Item 1 ¶148；推算：可轉債 2025 全年利息 2.329，發行於 2025-10，僅 Q4，＋2026 前九個月 3.908＋3.005＝9.242；韓元貸款利息未計，約 0.1，標推導）），底稿的利息費用科目未對應。&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;償債能力指標（利息保障依 Damodaran 合成評等對照；其他沒有公認門檻，只寫事實）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;指標&lt;/th&gt;&lt;th&gt;數值&lt;/th&gt;&lt;th&gt;判讀&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;EBIT ÷ 利息費用&lt;/td&gt;&lt;td&gt;-10.27&lt;/td&gt;&lt;td&gt;相當於 D 級：EBIT 是利息費用的 -10.3 倍；依 Damodaran 合成評等小型公司對照表（2026 年 1 月；市值 16.0 億美元，低於 50 億美元）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;（營運現金流＋實付利息）÷ 實付利息&lt;/td&gt;&lt;td&gt;-16.14&lt;/td&gt;&lt;td&gt;不評好壞：實付利息 3.2 百萬美元，營運現金流加回利息後可付約 -16 倍；大額新借款只付了部分期間的利息，這個倍數偏高，不能單獨拿來判斷&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;有息負債 ÷ EBITDA&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;資料限制：EBITDA 為負或缺，不算倍數&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;淨負債 ÷ EBITDA&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;資料限制：EBITDA 為負或缺，不算倍數&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;營運現金流 ÷ 有息負債&lt;/td&gt;&lt;td&gt;-8.0%&lt;/td&gt;&lt;td&gt;不評好壞：一年的營運現金流約可還掉 -8% 的有息負債&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;現金與證券 ÷ 一年內到期債務&lt;/td&gt;&lt;td&gt;398.68&lt;/td&gt;&lt;td&gt;資料限制：一年內到期債務只取得部分科目，398.7 倍可能高估（部分缺漏（只取得短期借款；另一項可能未發生或未對應，未核對前不當零））&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;可用授信與到期（作者判讀，融資償債判讀）：可轉債 700 百萬 2031-11-01 到期；韓元貸款 2.21 百萬 2027-05-29 到期；無已動用循環信貸；Goldman 2.5 億承諾為收購專用、尚未動用&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;融資活動現金流：還給股東與借還款（本財年年初至 2026-09-30 累計，10-Q 2026-09-30）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;對象｜分類&lt;/th&gt;&lt;th&gt;金額&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股東｜員工股票代扣稅與相關淨額&lt;/td&gt;&lt;td&gt;-8.2 百萬美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股東｜增資與員工認股&lt;/td&gt;&lt;td&gt;155.8 百萬美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股東小計&lt;/td&gt;&lt;td&gt;147.6 百萬美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;債權人｜借款發行成本&lt;/td&gt;&lt;td&gt;-6.2 百萬美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;債權人小計&lt;/td&gt;&lt;td&gt;-6.2 百萬美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;其他｜少數股東往來&lt;/td&gt;&lt;td&gt;0.4 百萬美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;其他小計&lt;/td&gt;&lt;td&gt;0.4 百萬美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;對照：同期營運現金流&lt;/td&gt;&lt;td&gt;-38.5 百萬美元&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;融資活動是公司與出資人（股東、債權人）之間的現金往來，不等於借款：回購、股利是還給股東，借入、償還才是借款；負數＝現金流出。本表期間與下方借款用途、上方現金流分層（近四季）不同。&lt;/p&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;借款用途（研究判讀）：擴張（可轉債供稀土 Mill 與 Donald 專案開發及一般營運）；2026-09 另有待 VAC 收購的 2.5 億美元定期貸款承諾（未動用）；期間 2025-10 發行；2026-09-30 狀態；依據：10-Q 2026-09-30 Part I, Item 1 ¶139、10-Q 2026-09-30 Part I, Item 1 ¶245、10-K 2025-12-31 Item 7 ¶194&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;survival-detail&quot;&gt;&lt;h3&gt;存活檢查：現金對債務（12～24 個月，推導，非違約預測）&lt;/h3&gt;&lt;p style=&quot;margin:0 0 6px&quot;&gt;&lt;b&gt;信用評級&lt;/b&gt;　機構 未揭露（10-K、10-Q、8-K、SEC 全文搜尋 查無 S&amp;amp;P、Moody&amp;#x27;s、Fitch、KBRA 評級）／推導 D（Damodaran 合成評等，利息保障 -10.3 倍，近四季新借款多、利息偏低、評級可能偏高，推導）｜依推導：⚠ 投機等級（低於 BBB-／Baa3）&lt;/p&gt;&lt;p style=&quot;margin:0 0 6px&quot;&gt;&lt;b&gt;存活檢查（完整理由）&lt;/b&gt;　需留意（推導，非違約預測）：利息保障 -10.3 倍（偏薄）（新借款多、利息偏低，倍數可能偏高）；會計師未提出繼續經營疑慮；信用評級 D（推導，投機等級，僅提示）；Altman Z 1.33（困境區，輔助；權益或保留盈餘為負，可能誤判）；利率 +200bp 後利息保障 -9.8 倍。&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;燈號：需留意（一般公司：現金對債務；資料截至 2026-09-30，收盤日 2026-11-16）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;判定&lt;/th&gt;&lt;th&gt;內容與出處&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;會計師繼續經營疑慮&lt;/td&gt;&lt;td&gt;無明顯警訊&lt;/td&gt;&lt;td&gt;會計師與管理層未提出繼續經營疑慮（掃描 10-Q 2026-09-30、10-K 2025-12-31）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;流動性：12 個月&lt;/td&gt;&lt;td&gt;無明顯警訊&lt;/td&gt;&lt;td&gt;現金與流動證券 855.9（未動用信貸未取得，未計入），一年內到期本金 2.2，加利息 9.2（利息偏低，未含新借款全年利息），可付 74.7 倍（含非流動投資為 76.9 倍）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;流動性：24 個月&lt;/td&gt;&lt;td&gt;無明顯警訊&lt;/td&gt;&lt;td&gt;現金與流動證券 855.9（未動用信貸未取得，未計入），兩年內到期本金 2.2，加利息 18.5（利息偏低，未含新借款全年利息），可付 41.4 倍（含非流動投資為 42.6 倍）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;利息保障&lt;/td&gt;&lt;td&gt;需留意&lt;/td&gt;&lt;td&gt;利息保障 -10.3 倍（近四季借還款淨額 700 占有息負債 103%（大額新借款），近四季利息費用（作者讀附註：10-K 2025-12-31 Item 8 ¶269；10-Q 2026-09-30 Part I, Item 1 ¶148；推算：可轉債 2025 全年利息 2.329（發行於 2025-10，僅 Q4）＋2026 前九個月 3.908＋3.005＝9.242；韓元貸款利息未計（約 0.1），標推導） 9 只含新債的部分期間，偏低；未能年化，倍數可能偏高），EBIT 付利息的餘裕偏薄&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;推導評級為投機等級&lt;/td&gt;&lt;td&gt;輔助（不改燈號）&lt;/td&gt;&lt;td&gt;信用評級 D（推導）為投機等級（只看利息保障，僅提示）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Altman Z 分數&lt;/td&gt;&lt;td&gt;輔助（不改燈號）&lt;/td&gt;&lt;td&gt;Altman Z 1.33（困境區，只當輔助；保留盈餘為負（長期回購、股利或累積虧損），Z 分數會被壓低）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;信用評級（機構）&lt;/td&gt;&lt;td&gt;未揭露&lt;/td&gt;&lt;td&gt;公司申報查無 S&amp;amp;P、Moody&amp;#x27;s、Fitch、KBRA 評級&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;信用評級（推導）&lt;/td&gt;&lt;td&gt;投機等級&lt;/td&gt;&lt;td&gt;D：Damodaran 合成評等 2026 年 1 月（小型公司表），利息保障 -10.3 倍（EBIT ÷ 近四季利息費用（作者讀附註：10-K 2025-12-31 Item 8 ¶269；10-Q 2026-09-30 Part I, Item 1 ¶148；推算：可轉債 2025 全年利息 2.329（發行於 2025-10，僅 Q4）＋2026 前九個月 3.908＋3.005＝9.242；韓元貸款利息未計（約 0.1），標推導））&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;債券市場參考&lt;/td&gt;&lt;td&gt;信用評級 CCC以下&lt;/td&gt;&lt;td&gt;ICE BofA 公司債選擇權調整利差：投資等級整體 0.90 個百分點（2026-11-16，FRED BAMLC0A0CM）；BBB 級 1.12 個百分點（2026-11-16，FRED BAMLC0A4CBBB）；投機等級整體 3.34 個百分點（2026-11-16，FRED BAMLH0A0HYM2）；CCC以下 級 13.10 個百分點（2026-11-16，FRED BAMLH0A3HYC）；個別債券殖利率與價格未取得（TRACE／FINRA 不在固定來源）&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;作者自債務附註填的近期到期明細（信用揭露 近期到期；只到月份時取該月 1 日），一年內至少等於資產負債表一年內到期債務；利息口徑：近四季利息費用（作者讀附註：10-K 2025-12-31 Item 8 ¶269；10-Q 2026-09-30 Part I, Item 1 ¶148；推算：可轉債 2025 全年利息 2.329（發行於 2025-10，僅 Q4）＋2026 前九個月 3.908＋3.005＝9.242；韓元貸款利息未計（約 0.1），標推導）；未動用信貸：未取得（信用揭露 未填；不計入）&lt;/p&gt;&lt;h3 style=&quot;margin-top:14px&quot;&gt;利率壓力測試（固定情境：利率上升 1、2 個百分點與下降 1 個百分點，不預測聯準會；推導）&lt;/h3&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;單位百萬美元；狀態：已試算&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;浮動利率債利息變動&lt;/th&gt;&lt;th&gt;再融資利息變動&lt;/th&gt;&lt;th&gt;壓力後一年利息&lt;/th&gt;&lt;th&gt;利息保障&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;目前利率（只算再融資）&lt;/td&gt;&lt;td&gt;0.0&lt;/td&gt;&lt;td&gt;0.3&lt;/td&gt;&lt;td&gt;9.6&lt;/td&gt;&lt;td&gt;-9.9 倍&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;+1 個百分點&lt;/td&gt;&lt;td&gt;0.0&lt;/td&gt;&lt;td&gt;0.3&lt;/td&gt;&lt;td&gt;9.6&lt;/td&gt;&lt;td&gt;-9.9 倍&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;+2 個百分點&lt;/td&gt;&lt;td&gt;0.0&lt;/td&gt;&lt;td&gt;0.4&lt;/td&gt;&lt;td&gt;9.6&lt;/td&gt;&lt;td&gt;-9.8 倍&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;−1 個百分點&lt;/td&gt;&lt;td&gt;-0.0&lt;/td&gt;&lt;td&gt;0.3&lt;/td&gt;&lt;td&gt;9.5&lt;/td&gt;&lt;td&gt;-10.0 倍&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;目前利率：聯邦基金利率 3.88%（2026-11-13，FRED DFF）、SOFR 3.93%（2026-11-16，FRED SOFR）、十年期公債 5.15%（2026-11-13，FRED DGS10）；估值折現率用的 10 年期公債是 5.12%（2026-11-16，美國財政部），來源與日期不同；浮動利率債 2.2，占總債務 0%（10-Q 2026-09-30 Part I, Item 1 ¶156、¶140；可轉債票面固定 0.75%；僅韓元貸款浮動，約 2.21 百萬美元，未避險揭露；總債務為本金面額）；兩年內到期須再融資本金 2.2，原票面 4.03%（作者填票面利率（信用揭露 近期到期）），再融資利率 18.25%（10 年期公債 5.15%（2026-11-13）＋ CCC以下 級 OAS 13.10 個百分點（推導評級），推導）；利息保障基準：利息保障（EBIT÷一年利息），目前 -10.3 倍；利率上升 2 個百分點（+200bp，bp＝基點，100bp＝1 個百分點）後低於 1.5 倍才在燈號理由加一條（不改燈號、不改研究評等）；通膨、物價、消費者等間接影響不在此表&lt;/p&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;&lt;a href=&quot;#survival-rules&quot;&gt;判定規則與限制見本節下方&lt;/a&gt;（寫死在程式，不改研究評等）。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;survival-rules&quot;&gt;&lt;h3&gt;存活檢查與利率壓力測試：判定規則與限制&lt;/h3&gt;&lt;p class=&quot;cap&quot;&gt;規則版本：v1.1（2026-11-03 第二輪：加 KBRA、利率壓力測試、首頁精簡；仍只顯示提示、不改研究評等）&lt;/p&gt;&lt;ul class=&quot;cap&quot;&gt;&lt;li&gt;總燈號：各項取最嚴重：任一高風險→高風險；否則任一需留意→需留意；12 個月流動性或繼續經營無法判定→資料不足；其餘→無明顯警訊。Z 分數與推導評級只列理由、不改燈號。&lt;/li&gt;&lt;li&gt;繼續經營：最新年報或其後季報出現會計師或管理層「substantial doubt … going concern」肯定句 → 高風險（否定句、假設句只列出不計）；只出現在前一份年報 → 需留意&lt;/li&gt;&lt;li&gt;流動性_12個月：現金與證券＋未動用信貸 ≥ 一年內到期本金＋一年利息 → 無明顯警訊；不足但加近四季自由現金流（已扣實付利息）後 ≥ 一年內到期本金 → 需留意；仍不足 → 高風險&lt;/li&gt;&lt;li&gt;流動性_24個月：同上改兩年（本金、利息、自由現金流各計兩年）；不足但加兩年自由現金流 ≥ 本金的 50% → 需留意；更低 → 高風險&lt;/li&gt;&lt;li&gt;燒錢：近四季自由現金流為負：現金還能燒幾個月＝（現金與證券＋未動用信貸－一年內到期本金）÷ 每月燒錢；&amp;lt;12 個月 高風險、12～24 個月 需留意&lt;/li&gt;&lt;li&gt;利息保障：EBIT ÷ 利息費用 &amp;lt; 1.5 倍 → 需留意&lt;/li&gt;&lt;li&gt;契約：作者自 信用揭露 填公司揭露的契約門檻與實際值：已違反 → 高風險；餘裕 &amp;lt; 15% → 需留意；未揭露不判&lt;/li&gt;&lt;li&gt;信用評級：機構評級（S&amp;amp;P、Moody&amp;#x27;s、Fitch、KBRA，取各機構最新、以最低者判等級）低於 BBB-／Baa3 → 需留意；只有推導評級為投機等級 → 只列理由&lt;/li&gt;&lt;li&gt;利率壓力測試：固定情境 +100bp／+200bp／-100bp（不預測聯準會）：利息增加＝浮動利率債×利率變動（作者填 Item 7A 每 100bp 利息變動時改用該值）＋兩年內到期本金×（再融資利率＋利率變動－原票面利率）；再融資利率＝收盤日 10 年期公債殖利率＋該評級 ICE BofA OAS（推導）；壓力後利息保障＝EBIT÷（一年利息＋利息增加），EBIT 分母異常時改用現金利息保障。+200bp 後低於 1.5 倍 → 理由加一條、首頁也加（只列理由、不改燈號）；浮動利率債未揭露或未填 → 該情境未取得；金融業不套&lt;/li&gt;&lt;li&gt;金融業：銀行券商、保險不套現金對債務：研究評等輸入 監理紅線 低於門檻 → 高風險；高於門檻不到 20%（相對）→ 需留意；未填 → 資料不足&lt;/li&gt;&lt;/ul&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;使用限制&lt;/p&gt;&lt;ul class=&quot;cap&quot;&gt;&lt;li&gt;推導，非違約預測：燈號只看 12～24 個月付不付得出錢與已揭露的警訊，不是違約機率，也不改研究評等（第一版）。&lt;/li&gt;&lt;li&gt;Altman Z 分數會誤判兩類公司：權益為負（如舉債回購）與保留盈餘因長期回購或股利變負，所以只當輔助、不單獨下結論、不改燈號。&lt;/li&gt;&lt;li&gt;金融業（銀行券商、保險）的存款與保單負債是營業資金，改看監理資本（如 CET1），不套現金對債務。&lt;/li&gt;&lt;li&gt;超過 2～3 年的到期與再融資風險留在正文債務到期表，不進燈號。&lt;/li&gt;&lt;li&gt;到期年度桶以到期表資料日（年報）起算：桶的結束日落在窗口內才計入；跨窗口的桶另列，若作者在 信用揭露 填了近期到期明細就改用明細。&lt;/li&gt;&lt;li&gt;個別債券價格與殖利率（TRACE／FINRA）不在固定來源：未取得；市場參考只用 FRED 的 ICE BofA 各評級公司債利差（大盤層級）。&lt;/li&gt;&lt;li&gt;機構評級只認公司自己在 SEC 申報寫出的 S&amp;amp;P、Moody&amp;#x27;s、Fitch、KBRA 評級並附原句；沒揭露寫未揭露，不從新聞或記憶補。&lt;/li&gt;&lt;li&gt;利率壓力測試只用固定情境（+100bp、+200bp、−100bp），不預測聯準會；以 10 年期公債估再融資成本，實際年期與擔保結構不同會有誤差；浮動利率債若也在兩年內到期會重複計算（偏保守）；通膨、物價、消費者等間接影響不進燈號；金融業不套，維持看資本適足率。&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/details&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;more&quot; data-layer=&quot;附錄&quot;&gt;&lt;div class=&quot;qno&quot;&gt;附錄&lt;/div&gt;&lt;h2&gt;附錄：估值細節、論點檢查、名詞、表格與資料來源（預設摺疊）&lt;/h2&gt;&lt;details id=&quot;valdetail&quot;&gt;&lt;summary&gt;估值細節：利率、同業與產業對照、券商目標價&lt;/summary&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;利率的影響：公債殖利率變動與股債利差&lt;/h3&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;利率連動弱：主方法用各技術報告自己的折現率（Vara Mada 10% 實質，Donald 與 Pinyon Plain 8%），不隨公債殖利率重算；10 年期公債 5.12%（2026-11-16）只影響總部費用折現與 FCFF 交叉核對&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;grid2 wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;盈餘殖利率（申報 EPS 口徑）vs 10 年期公債殖利率（2022-03-15～2024-05-02，每季末取樣）；目前利差 +6.49 個百分點，位於期間內 97% 百分位（越低越貴）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 280&quot; role=&quot;img&quot; aria-label=&quot;股債利差&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;246.0&quot; y2=&quot;246.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;250.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;0.0%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;171.3&quot; y2=&quot;171.3&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;175.3&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;5.0%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;96.7&quot; y2=&quot;96.7&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;100.7&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;10.0%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;22.0&quot; y2=&quot;22.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;26.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;15.0%&lt;/text&gt;&lt;text x=&quot;72.0&quot; y=&quot;268&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;2022&lt;/text&gt;&lt;text x=&quot;145.0&quot; y=&quot;268&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;&lt;/text&gt;&lt;text x=&quot;218.0&quot; y=&quot;268&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;&lt;/text&gt;&lt;text x=&quot;291.0&quot; y=&quot;268&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;&lt;/text&gt;&lt;text x=&quot;364.0&quot; y=&quot;268&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;&lt;/text&gt;&lt;text x=&quot;437.0&quot; y=&quot;268&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;2024&lt;/text&gt;&lt;text x=&quot;510.0&quot; y=&quot;268&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;2024-05&lt;/text&gt;&lt;polyline points=&quot;72.0,244.4 145.0,246.0 218.0,143.1 291.0,153.3 364.0,113.1 437.0,98.8 510.0,80.7&quot; fill=&quot;none&quot; stroke=&quot;var(--c1)&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;circle cx=&quot;72.0&quot; cy=&quot;244.4&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c1)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;盈餘殖利率（1 ÷ 申報本益比） 2022-03-31：0.1%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;145.0&quot; cy=&quot;246.0&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c1)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;盈餘殖利率（1 ÷ 申報本益比） 2022-06-30：0.0%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;218.0&quot; cy=&quot;143.1&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c1)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;盈餘殖利率（1 ÷ 申報本益比） 2023-06-30：6.9%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;291.0&quot; cy=&quot;153.3&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c1)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;盈餘殖利率（1 ÷ 申報本益比） 2023-09-29：6.2%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;364.0&quot; cy=&quot;113.1&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c1)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;盈餘殖利率（1 ÷ 申報本益比） 2023-12-29：8.9%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;437.0&quot; cy=&quot;98.8&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c1)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;盈餘殖利率（1 ÷ 申報本益比） 2024-03-28：9.9%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;510.0&quot; cy=&quot;80.7&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c1)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;盈餘殖利率（1 ÷ 申報本益比） 2024-05-02：11.1%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;518.0&quot; y=&quot;84.7&quot; class=&quot;val&quot; fill=&quot;var(--c1)&quot;&gt;11.1%&lt;/text&gt;&lt;polyline points=&quot;72.0,211.4 145.0,201.5 218.0,189.1 291.0,177.5 364.0,188.1 437.0,183.3 510.0,177.6&quot; fill=&quot;none&quot; stroke=&quot;var(--neg)&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;circle cx=&quot;72.0&quot; cy=&quot;211.4&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--neg)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;10 年期公債 2022-03-31：2.3%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;145.0&quot; cy=&quot;201.5&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--neg)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;10 年期公債 2022-06-30：3.0%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;218.0&quot; cy=&quot;189.1&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--neg)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;10 年期公債 2023-06-30：3.8%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;291.0&quot; cy=&quot;177.5&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--neg)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;10 年期公債 2023-09-29：4.6%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;364.0&quot; cy=&quot;188.1&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--neg)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;10 年期公債 2023-12-29：3.9%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;437.0&quot; cy=&quot;183.3&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--neg)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;10 年期公債 2024-03-28：4.2%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;510.0&quot; cy=&quot;177.6&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--neg)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;10 年期公債 2024-05-02：4.6%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;518.0&quot; y=&quot;181.6&quot; class=&quot;val&quot; fill=&quot;var(--neg)&quot;&gt;4.6%&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c1)&quot;&gt;&lt;/i&gt;盈餘殖利率（1 ÷ 申報本益比）&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--neg)&quot;&gt;&lt;/i&gt;10 年期公債&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;股債利差只作「相對自身歷史的位置」：名目利率對實質盈餘有方法限制，不影響估值與研究評等。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;同業與產業對照&lt;/h3&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;與個別同業比較&lt;/h4&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;不列個別同業：同為鈾、稀土、礦砂，連三年 GAAP 營業利益為正、又有 SEC XBRL（SEC 申報的結構化財報數字）的公司找不到（Cameco 以 40-F／IFRS 申報，Lynas、Iluka 不在 SEC）。&lt;/p&gt;&lt;p&gt;主方法用各專案技術報告的價值，不需要同業利潤率；MP Materials（美國稀土礦商）、Uranium Energy（美國鈾礦商）近年營業利益為負，只在 FCFF 交叉核對用 Damodaran（紐約大學教授公布的產業資料庫） Metals &amp;amp; Mining 23.85%（73 家，2026 年 1 月）。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;details id=&quot;claims&quot;&gt;&lt;summary&gt;論點檢查：每條判斷的證據狀態&lt;/summary&gt;&lt;div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;依風險分類的主張（證據狀態：支持／部分支持／提出反證／資料不足）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;編號&lt;/th&gt;&lt;th&gt;風險類別&lt;/th&gt;&lt;th&gt;主張&lt;/th&gt;&lt;th&gt;角色&lt;/th&gt;&lt;th&gt;證據狀態&lt;/th&gt;&lt;th&gt;什麼會改變判斷&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;UUUU-C04&lt;/td&gt;&lt;td&gt;R1 資金與流動性&lt;/td&gt;&lt;td&gt;現有營運資金能撐近期營運，但不夠同時支付 VAC 現金價款與稀土、礦砂專案資本支出，成長需要外部融資。&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;OSC 貸款在 2027 年 6 月前未完成定約，或 VAC 完成後現金與有價證券低於 2 億美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;UUUU-C05&lt;/td&gt;&lt;td&gt;R2 償債負擔與永久損失&lt;/td&gt;&lt;td&gt;債務到期集中在 2031 年的 7 億美元可轉債，2027 年前到期本金很小，近期沒有再融資壓力。&lt;/td&gt;&lt;td&gt;支持論點&lt;/td&gt;&lt;td&gt;部分支持&lt;/td&gt;&lt;td&gt;VAC 完成後合併有息負債超過 15 億美元，或新增 2028 年前到期債務&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;UUUU-C01&lt;/td&gt;&lt;td&gt;R3 成長退坡與競爭&lt;/td&gt;&lt;td&gt;White Mesa 是美國唯一運轉中的傳統鈾廠，並已做稀土分離，有監管牌照型的設施稀缺；但尚未轉成正的資本報酬，護城河評無（雙鑰匙都不過）。&lt;/td&gt;&lt;td&gt;支持論點&lt;/td&gt;&lt;td&gt;部分支持&lt;/td&gt;&lt;td&gt;另一座美國傳統鈾廠（如 Sweetwater）轉為恢復運轉，或 White Mesa 執照更新被否決、轉為附重大條件&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;UUUU-C03&lt;/td&gt;&lt;td&gt;R3 成長退坡與競爭&lt;/td&gt;&lt;td&gt;近期營收成長主要來自鈾銷量增加，價格貢獻小；屬量價循環與出貨時點，不能外推為長期成長率。&lt;/td&gt;&lt;td&gt;支持論點&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;2026 全年鈾銷量低於指引下緣 150 萬磅&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;UUUU-C08&lt;/td&gt;&lt;td&gt;R3 成長退坡與競爭&lt;/td&gt;&lt;td&gt;上游專案時程已延後：Donald FID 從 2026 年第三季初延到年底，Vara Mada 仍等馬達加斯加財政條款。&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;Donald 到 2027 年 3 月底仍未宣布 FID（晚於公司年底目標一季以上），或 Vara Mada 到 2027 年底仍未簽正式投資協議；Donald FID 狀態轉為已宣布（2026 年底前，未晚於公司目標）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;UUUU-C12&lt;/td&gt;&lt;td&gt;R3 成長退坡與競爭&lt;/td&gt;&lt;td&gt;合理價值約八成來自尚未 FID 的 Vara Mada，成功機率是作者判斷；投資協議若久拖不決，合理價值會明顯下修。&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;Vara Mada 投資協議狀態轉為議會通過並簽署，或公司宣布正面 FID；馬達加斯加政府再次暫停專案，或投資協議時程轉為晚於 2028 年&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;UUUU-C02&lt;/td&gt;&lt;td&gt;R4 投入回報不足&lt;/td&gt;&lt;td&gt;投入資本報酬為負，擴產與併購的投入尚未證明回報，跨週期報酬無法以現有資料確認。&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;連續四季營業利益為正且近四季 ROIC 高於 WACC 9.5%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;UUUU-C11&lt;/td&gt;&lt;td&gt;R5 收入與盈餘品質&lt;/td&gt;&lt;td&gt;近期淨損受有價證券公允價值變動放大，看本業要用營業虧損，不用每股淨損。&lt;/td&gt;&lt;td&gt;支持論點&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;有價證券改列持有至到期，或出售時實現損失高於 2,000 萬美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;UUUU-C07&lt;/td&gt;&lt;td&gt;R6 治理與資料可信度&lt;/td&gt;&lt;td&gt;VAC 收購的客戶爭議在宣布時已知、到 10 月才揭露，資本配置與揭露時點有疑慮。&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;部分支持&lt;/td&gt;&lt;td&gt;仲裁結果使收購價下調後 VAC 仍完成，且 Sumter 廠取得新客戶合約；SEC 或法院正式立案指控揭露不實&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;UUUU-C09&lt;/td&gt;&lt;td&gt;R7 估值與市場預期&lt;/td&gt;&lt;td&gt;現價 6.04 高於合理價值高端 3.12，價格位置偏貴。另揭露：要讓專案 NPV 加總等於現價，價格係數約需 2.30（模型基準 1.0；只揭露，不當評等理由）。&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;Vara Mada 投資協議經議會核准且 Donald 宣布 FID，使兩案成功機率可上調到樂觀設定、合理價值中點高於 6.04&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;UUUU-C10&lt;/td&gt;&lt;td&gt;R8 宏觀與共同曝險&lt;/td&gt;&lt;td&gt;鈾價處於十年高檔，鈾價或核能主題轉弱會同時壓縮收入與股價。&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;IMF 鈾月均價連續三個月低於 55 美元/磅&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;UUUU-C06&lt;/td&gt;&lt;td&gt;R9 稀釋與股東回饋&lt;/td&gt;&lt;td&gt;股東持續被稀釋：股數多年增加，ATM 增發持續，VAC 還要再發約 6,585 萬股。&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;稀釋股數連續四季不再增加（季增率轉為 0 或負，不含 VAC 對價股）&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;並列：研究評等 生意品質普通 ／ 價格偏貴（單錨點）；價格位置 偏貴；現價隱含年報酬（基準情境，非預期報酬） —。各列狀態與價格分開呈現，不合成分數，狀態件數也不代表強弱（非買賣建議）。&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;details id=&quot;glossary&quot;&gt;&lt;summary&gt;名詞小抄&lt;/summary&gt;&lt;dl class=&quot;gl&quot;&gt;&lt;dt id=&quot;g0&quot;&gt;專案淨現值（NPV）×成功機率&lt;/dt&gt;&lt;dd&gt;技術報告算出的專案價值，依還沒定案的程度打折後加總，機率是作者判斷。&lt;/dd&gt;&lt;dt id=&quot;g1&quot;&gt;最終投資決定（FID）&lt;/dt&gt;&lt;dd&gt;公司正式決定動用資金建廠或開礦，之前的計畫都還可能改變。&lt;/dd&gt;&lt;dt id=&quot;g2&quot;&gt;重礦砂（HMS）&lt;/dt&gt;&lt;dd&gt;含鈦、鋯與獨居石的海濱礦砂，獨居石可提煉稀土。&lt;/dd&gt;&lt;dt id=&quot;g3&quot;&gt;獨居石（monazite）&lt;/dt&gt;&lt;dd&gt;含稀土與少量鈾的礦物，是 White Mesa 稀土分離的原料。&lt;/dd&gt;&lt;dt id=&quot;g4&quot;&gt;NdPr&lt;/dt&gt;&lt;dd&gt;釹鐠氧化物，做永久磁鐵的主要稀土原料。&lt;/dd&gt;&lt;dt id=&quot;g5&quot;&gt;可轉換公司債&lt;/dt&gt;&lt;dd&gt;到期前可依約換成股票的公司債，換股會稀釋股東。&lt;/dd&gt;&lt;dt id=&quot;g6&quot;&gt;自由現金流量（FCFF）折現&lt;/dt&gt;&lt;dd&gt;把未來每年公司層級可分配現金折回今天加總；本報告只當交叉核對，不進合理價值。&lt;/dd&gt;&lt;dt id=&quot;g7&quot;&gt;市價反推&lt;/dt&gt;&lt;dd&gt;把現在股價代入模型，反算市場隱含的專案價格係數或成功機率，只描述，不是預測。&lt;/dd&gt;&lt;/dl&gt;&lt;/details&gt;&lt;details id=&quot;numbers-table&quot;&gt;&lt;summary&gt;完整數字表格：三大報表摘要（年度與 8 季，供查；圖在正文「完整數字」）&lt;/summary&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:14px&quot;&gt;損益表（年度與近四季）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;百萬美元&lt;/th&gt;&lt;th&gt;FY22&lt;/th&gt;&lt;th&gt;FY23&lt;/th&gt;&lt;th&gt;FY24&lt;/th&gt;&lt;th&gt;FY25&lt;/th&gt;&lt;th&gt;近四季&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;營收&lt;/td&gt;&lt;td&gt;12.5&lt;/td&gt;&lt;td&gt;37.9&lt;/td&gt;&lt;td&gt;78.1&lt;/td&gt;&lt;td&gt;65.9&lt;/td&gt;&lt;td&gt;117.2&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;毛利&lt;/td&gt;&lt;td&gt;4.7&lt;/td&gt;&lt;td&gt;19.7&lt;/td&gt;&lt;td&gt;22.2&lt;/td&gt;&lt;td&gt;13.8&lt;/td&gt;&lt;td&gt;56.2&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;研發費用&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;營業利益&
