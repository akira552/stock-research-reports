;&lt;rect x=&quot;170&quot; y=&quot;516&quot; width=&quot;240.0&quot; height=&quot;15&quot; rx=&quot;2&quot; fill=&quot;var(--pos)&quot; opacity=&quot;.85&quot; stroke=&quot;var(--ink)&quot; stroke-width=&quot;1.5&quot; stroke-dasharray=&quot;3 2&quot;/&gt;&lt;text x=&quot;415.0&quot; y=&quot;528&quot; class=&quot;vl s&quot;&gt;3 季 上行&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;lg&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--neg)&quot;&gt;&lt;/i&gt;下行段&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--pos)&quot;&gt;&lt;/i&gt;上行段&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--ink)&quot;&gt;&lt;/i&gt;目前這一段（虛框，尚未結束）&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;每條是兩個轉折之間的一段有多長；虛線是歷史中位（下行 2 季、上行 1.0 季）。拿目前這段的長度對照中位，看走到哪；淡色段的起點是資料起點，不計入統計。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估底稿 2%）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;p class=&quot;lead&quot;&gt;近四季營業利益率轉折：峰 2016-03（-70.7%）、谷 2016-09（-103.6%）、峰 2016-12（-75.9%）、谷 2017-03（-90.2%）、峰 2017-09（-72.9%）、谷 2018-03（-107.6%）、峰 2018-06（-42.4%）、谷 2019-06（-481.6%）、峰 2019-09（-466.4%）、谷 2020-06（-1738.0%）、峰 2020-12（-1485.3%）、谷 2021-06（-1640.3%）、峰 2022-09（-288.9%）、谷 2022-12（-359.1%）、峰 2023-03（-120.3%）、谷 2023-06（-132.1%）、峰 2024-06（-62.1%）、谷 2024-09（-86.1%）、峰 2024-12（-60.8%）、谷 2025-06（-142.7%）、峰 2025-09（-136.7%）、谷 2025-12（-153.4%）；目前 上行。&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;營收近四季年增自 2016 年以來有 7 個下行段、中位 1 季、最長 4 季，8 個上行段中位 2 季、最長 10 季（2020-03 到 2022-09）；目前是下行，距最近轉折（2026-06 的峰）1 季。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src58&quot;&gt;[58]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;年營收在 2016、2017、2019、2020、2025 年下降；2019 年降到 5.87 百萬、2020 年 1.66 百萬，2020 年是 2016 年以來的谷底。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src59&quot;&gt;[59]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src9&quot;&gt;[9]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;這個谷底對應原文寫的兩件事：Nichols Ranch 自 2019 年因鈾價低迷停產待命，既有井場的產量在 2020 年採完；所以 2019–2020 年的下降屬於鈾價低迷造成的減產，不是單一客戶或一次性事件。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src60&quot;&gt;[60]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src61&quot;&gt;[61]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src9&quot;&gt;[9]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;段長很短、上下翻轉頻繁，主要是出貨時點造成的雜訊；真正的景氣循環要看 2–3 年尺度的鈾價與工廠開停，單季轉折多屬一次性。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src58&quot;&gt;[58]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src15&quot;&gt;[15]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;h3&gt;② 訂單能見度&lt;/h3&gt;&lt;p class=&quot;s&quot;&gt;長約最低未來營收共 150.09 百萬美元：2026 年剩餘期間 0、2027 年 48.39、2028 年 40.47、2029 與 2030 年各 24.71、之後 11.82。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src23&quot;&gt;[23]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;以最近一季營收換算約 5.1 季可見度；但這是最低承諾額，2026 年第四季沒有長約最低額，短期能見度靠現貨銷售。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src62&quot;&gt;[62]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src23&quot;&gt;[23]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;h3&gt;③ 公司特有週期&lt;/h3&gt;&lt;p class=&quot;s&quot;&gt;工廠以批次加工：上一輪 2025 年第四季到 2026 年第二季，下一輪預計 2026 年第四季開始、跑到 2027 年第二季，要先有足夠礦石庫存。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src20&quot;&gt;[20]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;稀土第二期預計 2029 年中完成，前提是執照、融資、原料與最終投資決定。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src26&quot;&gt;[26]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;VAC 併購若完成，公司會加入磁材製造的另一種景氣節奏（汽車、工業、國防需求），本頁以鈾為主的週期判讀將失效。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src32&quot;&gt;[32]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;h3&gt;④ 產業層級週期（聯準會 G.17 工業生產與產能利用率，經 FRED）&lt;/h3&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;美國礦業工業生產 2026 年 9 月年增約 2.8%，比 6 個月前加快約 2.9 個百分點，自 2024 年 1 月的谷起上行 32 個月；這是全國分產業數據，不是 Energy Fuels 自己的數字。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src63&quot;&gt;[63]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src64&quot;&gt;[64]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src65&quot;&gt;[65]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;礦業產能利用率 87.5%，在 2000 年以來約第 72 百分位（工具判中性），近 6 個月升約 3.0 點；金屬與非金屬礦工業生產年增約 3.3%、方向加速。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src66&quot;&gt;[66]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src67&quot;&gt;[67]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src68&quot;&gt;[68]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src69&quot;&gt;[69]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;公司與產業方向大致同步（都在上行），但連動很弱：G.17 礦業以全國產出為主，公司營收由鈾的長約交貨與單一工廠批次加工決定，近四季營收年增 48.9% 遠大於產業的個位數，產業數據只能當背景。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src70&quot;&gt;[70]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src54&quot;&gt;[54]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src20&quot;&gt;[20]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;系列&lt;/th&gt;&lt;th&gt;最新月份&lt;/th&gt;&lt;th&gt;最新值&lt;/th&gt;&lt;th&gt;位置與方向&lt;/th&gt;&lt;th&gt;之字形（月）&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;礦業&lt;/b&gt;&lt;div class=&quot;lead&quot;&gt;IPMINE｜NAICS 21&lt;/div&gt;&lt;/td&gt;&lt;td&gt;2026-09&lt;/td&gt;&lt;td&gt;年增 2.8%&lt;/td&gt;&lt;td&gt;12 個月變化 2.8%；較 6 個月前加速（+2.9 個百分點）&lt;/td&gt;&lt;td&gt;目前上行，距最近轉折 32 個月&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;礦業產能利用率&lt;/b&gt;&lt;div class=&quot;lead&quot;&gt;CAPUTLG21S｜NAICS 21&lt;/div&gt;&lt;/td&gt;&lt;td&gt;2026-09&lt;/td&gt;&lt;td&gt;87.5%&lt;/td&gt;&lt;td&gt;中性（百分位 0.72，2000-01 起）；近6個月 +3.0 點 → 上升&lt;/td&gt;&lt;td&gt;目前上行，距最近轉折 32 個月&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;非石油礦業（金屬與非金屬礦）&lt;/b&gt;&lt;div class=&quot;lead&quot;&gt;IPG212S｜NAICS 212&lt;/div&gt;&lt;/td&gt;&lt;td&gt;2026-09&lt;/td&gt;&lt;td&gt;年增 3.3%&lt;/td&gt;&lt;td&gt;12 個月變化 3.3%；較 6 個月前加速（+6.6 個百分點）&lt;/td&gt;&lt;td&gt;目前上行，距最近轉折 6 個月&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;lead&quot;&gt;來源：Board of Governors of the Federal Reserve System, G.17 Industrial Production and Capacity Utilization，經 FRED；系列編號查證日 2026-11-08，資料取得 2026-11-08。這是全國分產業的數據，只描述產業所處位置與方向，不是公司自己的數字，也不代表公司的週期必然同步。&lt;/p&gt;&lt;/section&gt;&lt;section id=&quot;s6&quot;&gt;&lt;h2&gt;7　觀察清單：下季要看什麼&lt;/h2&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;觀察清單：目前值離改判門檻多遠&lt;/figcaption&gt;&lt;div class=&quot;wg&quot;&gt;&lt;div class=&quot;wgt&quot;&gt;&lt;b&gt;單季營收年增&lt;/b&gt;&lt;span&gt;維持條件：營收單季年增 &amp;gt;= 0.0%&lt;/span&gt;&lt;/div&gt;&lt;svg viewBox=&quot;0 0 680 60&quot; role=&quot;img&quot; aria-label=&quot;單季營收年增&quot;&gt;&lt;rect x=&quot;14.0&quot; y=&quot;14&quot; width=&quot;652.0&quot; height=&quot;20&quot; fill=&quot;var(--pos)&quot; opacity=&quot;.12&quot;/&gt;&lt;line x1=&quot;14.0&quot; x2=&quot;666.0&quot; y1=&quot;24&quot; y2=&quot;24&quot; stroke=&quot;var(--line)&quot; stroke-width=&quot;2&quot;/&gt;&lt;line x1=&quot;14.0&quot; x2=&quot;14.0&quot; y1=&quot;8&quot; y2=&quot;40&quot; stroke=&quot;var(--ink)&quot; stroke-dasharray=&quot;4 3&quot; stroke-width=&quot;1.6&quot;/&gt;&lt;text x=&quot;14.0&quot; y=&quot;54&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;門檻 0.0%&lt;/text&gt;&lt;circle cx=&quot;581.0&quot; cy=&quot;24&quot; r=&quot;7&quot; fill=&quot;var(--pos)&quot;/&gt;&lt;text x=&quot;581.0&quot; y=&quot;9&quot; class=&quot;vl s&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--pos)&quot;&gt;目前 64.8%&lt;/text&gt;&lt;/svg&gt;&lt;/div&gt;&lt;div class=&quot;wg&quot;&gt;&lt;div class=&quot;wgt&quot;&gt;&lt;b&gt;近四季營業利益率&lt;/b&gt;&lt;span&gt;維持條件：營業利益率_近四季 &amp;gt;= -100.0%&lt;/span&gt;&lt;/div&gt;&lt;svg viewBox=&quot;0 0 680 60&quot; role=&quot;img&quot; aria-label=&quot;近四季營業利益率&quot;&gt;&lt;rect x=&quot;89.2&quot; y=&quot;14&quot; width=&quot;576.8&quot; height=&quot;20&quot; fill=&quot;var(--pos)&quot; opacity=&quot;.12&quot;/&gt;&lt;line x1=&quot;14.0&quot; x2=&quot;666.0&quot; y1=&quot;24&quot; y2=&quot;24&quot; stroke=&quot;var(--line)&quot; stroke-width=&quot;2&quot;/&gt;&lt;line x1=&quot;89.2&quot; x2=&quot;89.2&quot; y1=&quot;8&quot; y2=&quot;40&quot; stroke=&quot;var(--ink)&quot; stroke-dasharray=&quot;4 3&quot; stroke-width=&quot;1.6&quot;/&gt;&lt;text x=&quot;89.2&quot; y=&quot;54&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;門檻 -100.0%&lt;/text&gt;&lt;circle cx=&quot;590.8&quot; cy=&quot;24&quot; r=&quot;7&quot; fill=&quot;var(--pos)&quot;/&gt;&lt;text x=&quot;590.8&quot; y=&quot;9&quot; class=&quot;vl s&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--pos)&quot;&gt;目前 -81.0%&lt;/text&gt;&lt;/svg&gt;&lt;/div&gt;&lt;div class=&quot;wg&quot;&gt;&lt;div class=&quot;wgt&quot;&gt;&lt;b&gt;應收增速減營收增速&lt;/b&gt;&lt;span&gt;維持條件：應收增速減營收增速 &amp;lt;= 50.0%&lt;/span&gt;&lt;/div&gt;&lt;svg viewBox=&quot;0 0 680 60&quot; role=&quot;img&quot; aria-label=&quot;應收增速減營收增速&quot;&gt;&lt;rect x=&quot;14.0&quot; y=&quot;14&quot; width=&quot;383.8&quot; height=&quot;20&quot; fill=&quot;var(--pos)&quot; opacity=&quot;.12&quot;/&gt;&lt;line x1=&quot;14.0&quot; x2=&quot;666.0&quot; y1=&quot;24&quot; y2=&quot;24&quot; stroke=&quot;var(--line)&quot; stroke-width=&quot;2&quot;/&gt;&lt;line x1=&quot;397.8&quot; x2=&quot;397.8&quot; y1=&quot;8&quot; y2=&quot;40&quot; stroke=&quot;var(--ink)&quot; stroke-dasharray=&quot;4 3&quot; stroke-width=&quot;1.6&quot;/&gt;&lt;text x=&quot;397.8&quot; y=&quot;54&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;門檻 50.0%&lt;/text&gt;&lt;circle cx=&quot;581.0&quot; cy=&quot;24&quot; r=&quot;7&quot; fill=&quot;var(--neg)&quot;/&gt;&lt;text x=&quot;581.0&quot; y=&quot;9&quot; class=&quot;vl s&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--neg)&quot;&gt;目前 73.9%&lt;/text&gt;&lt;/svg&gt;&lt;/div&gt;&lt;div class=&quot;wg&quot;&gt;&lt;div class=&quot;wgt&quot;&gt;&lt;b&gt;長約可見季數&lt;/b&gt;&lt;span&gt;維持條件：RPO可見季數 &amp;gt;= 3.0 季&lt;/span&gt;&lt;/div&gt;&lt;svg viewBox=&quot;0 0 680 60&quot; role=&quot;img&quot; aria-label=&quot;長約可見季數&quot;&gt;&lt;rect x=&quot;344.9&quot; y=&quot;14&quot; width=&quot;321.1&quot; height=&quot;20&quot; fill=&quot;var(--pos)&quot; opacity=&quot;.12&quot;/&gt;&lt;line x1=&quot;14.0&quot; x2=&quot;666.0&quot; y1=&quot;24&quot; y2=&quot;24&quot; stroke=&quot;var(--line)&quot; stroke-width=&quot;2&quot;/&gt;&lt;line x1=&quot;344.9&quot; x2=&quot;344.9&quot; y1=&quot;8&quot; y2=&quot;40&quot; stroke=&quot;var(--ink)&quot; stroke-dasharray=&quot;4 3&quot; stroke-width=&quot;1.6&quot;/&gt;&lt;text x=&quot;344.9&quot; y=&quot;54&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;門檻 3.0 季&lt;/text&gt;&lt;circle cx=&quot;581.0&quot; cy=&quot;24&quot; r=&quot;7&quot; fill=&quot;var(--pos)&quot;/&gt;&lt;text x=&quot;581.0&quot; y=&quot;9&quot; class=&quot;vl s&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--pos)&quot;&gt;目前 5.1 季&lt;/text&gt;&lt;/svg&gt;&lt;/div&gt;&lt;div class=&quot;lg&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--pos)&quot;&gt;&lt;/i&gt;仍在維持條件內&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--neg)&quot;&gt;&lt;/i&gt;已越過門檻&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;只畫能自動對照的觀察項（有檢驗鍵與門檻）：淡綠帶是維持目前判斷的範圍，虛線是門檻，圓點是底稿最新值；越過門檻就照表中「改判方向」重看。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估、比較、門檻）＋商業評估底稿）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;div class=&quot;cards&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;單季營收年增&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;自動對照&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;目前值&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;2026-09-30 單季營收年增 64.8%，近四季依序 −32.1%、112.1%、496.1%、64.8%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src71&quot;&gt;[71]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src33&quot;&gt;[33]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;看什麼&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;第四季鈾出貨有沒有補上全年銷量指引&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;改判方向&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;若2026 年第四季單季營收低於去年同季（年增 &amp;lt; 0），則銷量指引落空的可能升高，成長動能與說法可信度下修&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;近四季營業利益率&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;自動對照&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;目前值&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;2026-09-30 近四季營業利益率 −81.0%，一年前約 −136.7%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src34&quot;&gt;[34]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src35&quot;&gt;[35]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;看什麼&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;低成本礦的毛利改善能不能延續，併購費用會不會把利潤率拉回去&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;改判方向&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;若近四季營業利益率跌回 −100% 以下，則低成本礦的改善被費用抵銷，模式穩固度下修&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;應收增速減營收增速&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;自動對照&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;目前值&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;2026-09-30 應收年增 122.8%，減近四季營收年增後為 73.9 個百分點。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src37&quot;&gt;[37]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src36&quot;&gt;[36]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;看什麼&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;應收是否隨交貨後收款回落&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;改判方向&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;若下一期仍高於 50 個百分點，則收款變慢的訊號由出貨時點轉為需要追查，卡點風險下修&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;長約可見季數&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;自動對照&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;目前值&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;2026-09-30 長約最低未來營收 150.09 百萬，約為最近一季營收的 5.1 季。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src62&quot;&gt;[62]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src23&quot;&gt;[23]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;看什麼&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;有沒有簽新長約補上逐年遞減的最低交貨額&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;改判方向&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;若可見季數降到 3 季以下，則營收更依賴現貨，週期位置下修&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;稀土第二期最終投資決定與 VAC 交割&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;人工對照&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;目前值&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;第二期預計 2029 年中完成，仍待執照、融資、原料與最終投資決定；VAC 協議 2026 年 10 月 13 日修訂、尚未完成。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src26&quot;&gt;[26]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src6&quot;&gt;[6]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;看什麼&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;8-K 是否公告第二期最終投資決定、融資或 VAC 交割&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;改判方向&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;若VAC 完成交割，則營收組成與週期判讀改以磁材為主，本頁需整份重寫&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;h3&gt;推論紀錄（下一季財報後自動對照）&lt;/h3&gt;&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;推論&lt;/th&gt;&lt;th&gt;方法&lt;/th&gt;&lt;th&gt;檢驗指標&lt;/th&gt;&lt;th&gt;條件&lt;/th&gt;&lt;th&gt;基準季&lt;/th&gt;&lt;th&gt;檢驗時點&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;P1&lt;/td&gt;&lt;td&gt;2026 年第四季單季營收不低於去年同季 27.10 百萬（單季營收年增 ≥ 0）：第四季要再賣 36–86 萬磅才達全年銷量指引，以近期每磅 74–89 美元換算營收應高於去年同季&lt;/td&gt;&lt;td&gt;公司特有&lt;/td&gt;&lt;td&gt;營收單季年增&lt;/td&gt;&lt;td&gt;&amp;gt;= 0&lt;/td&gt;&lt;td&gt;2026-09-30&lt;/td&gt;&lt;td&gt;2026 年 10-K（約 2027 年 2 月底）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;P2&lt;/td&gt;&lt;td&gt;到 2027 年第二季近四季營業利益率仍為負（&amp;lt; 0）：營業利益自 2015 年起每年為負，且 ASM 與 VAC 併購增加費用&lt;/td&gt;&lt;td&gt;自身歷史&lt;/td&gt;&lt;td&gt;營業利益率_近四季&lt;/td&gt;&lt;td&gt;&amp;lt; 0&lt;/td&gt;&lt;td&gt;2026-09-30&lt;/td&gt;&lt;td&gt;2027 年第二季 10-Q（約 2027 年 8 月）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;P3&lt;/td&gt;&lt;td&gt;2027 年 3 月礦業產能利用率仍在 85% 以上（2000 年以來中位約 85.1%），產業上行段延續&lt;/td&gt;&lt;td&gt;產業週期&lt;/td&gt;&lt;td&gt;G17:CAPUTLG21S&lt;/td&gt;&lt;td&gt;&amp;gt;= 85&lt;/td&gt;&lt;td&gt;2026-09-30&lt;/td&gt;&lt;td&gt;G.17 2027 年 3 月資料（約 2027 年 4 月中）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;P4&lt;/td&gt;&lt;td&gt;2026 年底應收增速減營收增速回到 50 個百分點以內：應收增加主要是季末集中交貨，交貨後一季內收款&lt;/td&gt;&lt;td&gt;公司特有&lt;/td&gt;&lt;td&gt;應收增速減營收增速&lt;/td&gt;&lt;td&gt;&amp;lt;= 0.5&lt;/td&gt;&lt;td&gt;2026-09-30&lt;/td&gt;&lt;td&gt;2026 年 10-K（約 2027 年 2 月底）&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;lead&quot;&gt;每條推論從檢驗期末起，每個新季度記一筆命中或落空（預測帳本，公司資料夾 商業評估檢驗）；方法準確度跨公司統計見 商業評估預測帳本。&lt;/p&gt;&lt;/section&gt;&lt;section id=&quot;sg&quot;&gt;&lt;h2&gt;商業動能明細&lt;span class=&quot;ruleok&quot;&gt;評分規則第一版，2026-11-07 核定&lt;/span&gt;&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;五個面向各 1–5 分，相對同產業卡同業評比；機械建議分由工具依同業位置、卡住訊號與驗證比例算出，作者可調整但要寫理由。加權分 2.6 → D 級。等級門檻：A ≥ 4.2、B ≥ 3.5、C ≥ 2.8、D ≥ 2.1、其餘 E。&lt;/p&gt;&lt;div class=&quot;cards&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;模式穩固度&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;權重 &lt;span class=&quot;num&quot;&gt;25%&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;fs&quot;&gt;&lt;span&gt;作者分 &lt;span class=&quot;num v&quot;&gt;2&lt;/span&gt;&lt;/span&gt;&lt;span&gt;機械建議 &lt;span class=&quot;num&quot;&gt;—&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;同業不足 3 家：作者判斷&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;理由&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;營業利益與營運現金流自 2015 年起每年為負，2025 年營業利益 −101.16 百萬、營運現金流 −89.48 百萬。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src3&quot;&gt;[3]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src55&quot;&gt;[55]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;低成本礦把第三季毛利率拉到 61.3%，但營收九成以上來自單一商品、前三大客戶占六成，模式穩固度只給 2 分（同業不足，無機械建議分，作者判斷）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src50&quot;&gt;[50]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src13&quot;&gt;[13]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src8&quot;&gt;[8]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;同業對照&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;研究資料排除的同業中，Uranium Energy 與 MP Materials 都註明近年營業利益為負，Cameco 是成熟鈾業同業但以 40-F／IFRS 申報、不在本工作流資料口徑。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src72&quot;&gt;[72]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-待查&quot;&gt;待查&lt;/span&gt;待查：Cameco、Uranium Energy 的營業利益率與營運現金流數字（需同口徑資料）。&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;成長動能&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;權重 &lt;span class=&quot;num&quot;&gt;25%&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;fs&quot;&gt;&lt;span&gt;作者分 &lt;span class=&quot;num v&quot;&gt;3&lt;/span&gt;&lt;/span&gt;&lt;span&gt;機械建議 &lt;span class=&quot;num&quot;&gt;—&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;同業不足 3 家：作者判斷&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;理由&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;近四季營收年增 48.9%，一年前為 103.7%，主要來自鈾銷量增加與出貨時點。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src54&quot;&gt;[54]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src73&quot;&gt;[73]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src15&quot;&gt;[15]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;數字成長強，但 2026 年第四季沒有長約最低額、稀土第二期未定案、VAC 屬併購，可持續的內生成長證據不足，給 3 分（同業不足，無機械建議分，作者判斷）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src23&quot;&gt;[23]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src26&quot;&gt;[26]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src6&quot;&gt;[6]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;同業對照&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;同業 IsoEnergy 的試採礦石要送到 White Mesa 加工，顯示美國鈾產量增加時本公司工廠是受益者之一。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src44&quot;&gt;[44]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-待查&quot;&gt;待查&lt;/span&gt;待查：Cameco、Uranium Energy 同期營收年增（工作流同業營運比較未收錄）。&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;卡點風險&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;權重 &lt;span class=&quot;num&quot;&gt;20%&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;fs&quot;&gt;&lt;span&gt;作者分 &lt;span class=&quot;num v&quot;&gt;3&lt;/span&gt;&lt;/span&gt;&lt;span&gt;機械建議 &lt;span class=&quot;num&quot;&gt;4&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;計分採用的亮燈 1 條（G3）；資料未取得 2 條&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;理由&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;可取得的 5 條訊號中只有 G3 收款變慢亮燈，產量（E1）與單位成本（E2）都未亮；G4、E3 因季資本支出不足 8 季而未取得。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src74&quot;&gt;[74]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src41&quot;&gt;[41]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src19&quot;&gt;[19]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;比機械建議 4 分低 1 分：卡住訊號沒有涵蓋資金卡點，公司說擴張與併購需要更多資本，募資可能大幅稀釋，Kwale 礦砂也已停產。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src75&quot;&gt;[75]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src76&quot;&gt;[76]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src77&quot;&gt;[77]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;同業對照&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;研究資料排除 MP Materials 與 Uranium Energy 的理由同為近年營業利益為負，美國鈾與稀土同業普遍仍在投入期。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src72&quot;&gt;[72]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-待查&quot;&gt;待查&lt;/span&gt;待查：同業的應收週轉與單位現金成本（需同口徑資料）。&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;週期位置&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;權重 &lt;span class=&quot;num&quot;&gt;15%&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;fs&quot;&gt;&lt;span&gt;作者分 &lt;span class=&quot;num v&quot;&gt;2&lt;/span&gt;&lt;/span&gt;&lt;span&gt;機械建議 &lt;span class=&quot;num&quot;&gt;3&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;營收近四季年增目前下行，距最近轉折 1 季；歷史下行段中位 1 季&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;理由&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;營收近四季年增目前下行、距 2026-06 的峰 1 季；機械建議 3 分。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src58&quot;&gt;[58]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src78&quot;&gt;[78]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;比機械建議低 1 分：機械值只看出貨雜訊造成的短段，鈾的實質價格在近十年約第 92 百分位、長約最低額 2029 年後遞減，商品週期位置偏後段。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src30&quot;&gt;[30]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src23&quot;&gt;[23]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;同業對照&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;同業 Anfield 的 Shootaring Canyon 廠已建成並取得執照但未見運轉揭露，鈾價高位時這類待命產能可能重啟，增加美國加工端的供給。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src43&quot;&gt;[43]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-待查&quot;&gt;待查&lt;/span&gt;待查：Cameco、Uranium Energy 的長約覆蓋年數，以比較能見度。&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;說法可信度&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;權重 &lt;span class=&quot;num&quot;&gt;15%&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;fs&quot;&gt;&lt;span&gt;作者分 &lt;span class=&quot;num v&quot;&gt;3&lt;/span&gt;&lt;/span&gt;&lt;span&gt;機械建議 &lt;span class=&quot;num&quot;&gt;4&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;已判定 4 條，驗證比例 0.75&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;理由&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;四條說法中成本與加工量已驗證，銷量指引與稀土商業化部分支持。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src17&quot;&gt;[17]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src21&quot;&gt;[21]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;比機械建議 4 分（驗證比例 0.75）低 1 分：成本與加工量有實績支持，但四條裡兩條只部分支持——稀土第二期 2029 年中完成要以執照、融資、原料與最終投資決定為前提，第三季稀土營收只有 0.44 百萬；銷量指引前九個月只到下緣約 76%（推算），第四季長約已無最低交貨額，達標要靠現貨。時程與銷量都還沒被數字證明，給 3 分（作者判斷）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src26&quot;&gt;[26]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src21&quot;&gt;[21]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src23&quot;&gt;[23]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;同業對照&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;Anfield 40-F 對美國傳統鈾廠的描述（已建成的只有三座、White Mesa 是其一）與公司 10-K「唯一運轉中」的原文一致，這項說法有外部支持。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src43&quot;&gt;[43]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src2&quot;&gt;[2]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-待查&quot;&gt;待查&lt;/span&gt;待查：同業的指引達成紀錄（工作流尚無同業商業評估）。&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;note&quot;&gt;商業評估等級（A–E 五級）只看商業模式是否成立、成長是否卡住、週期在哪，相對同產業卡同業評比；它不是估值報告研究評等裡的「生意品質 A／B／C」（那是看護城河、投入資本報酬、現金流品質、資產負債表與治理的絕對標準），不進研究評等、不影響估值、不涉任何價格。&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;src&quot;&gt;&lt;h2&gt;出處&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;標記統計：事實 58、推論 37、作者判斷 8、待查 6；原文位置見下方出處清單。&lt;/p&gt;&lt;details open&gt;&lt;summary&gt;展開出處清單&lt;/summary&gt;&lt;ol class=&quot;src&quot;&gt;&lt;li id=&quot;src1&quot;&gt;10-Q 2026-09-30 Part I, Item 2 ¶199&lt;/li&gt;&lt;li id=&quot;src2&quot;&gt;10-K 2025-12-31 Item 1 ¶31&lt;/li&gt;&lt;li id=&quot;src3&quot;&gt;長期財務&lt;/li&gt;&lt;li id=&quot;src4&quot;&gt;10-Q 2026-09-30 Part I, Item 1 ¶38&lt;/li&gt;&lt;li id=&quot;src5&quot;&gt;10-K 2025-12-31 Item 1 ¶22&lt;/li&gt;&lt;li id=&quot;src6&quot;&gt;10-Q 2026-09-30 Part I, Item 2 ¶60&lt;/li&gt;&lt;li id=&quot;src7&quot;&gt;10-K 2025-12-31 Item 1A ¶258&lt;/li&gt;&lt;li id=&quot;src8&quot;&gt;10-K 2025-12-31 Item 8 ¶425&lt;/li&gt;&lt;li id=&quot;src9&quot;&gt;長期財務&lt;/li&gt;&lt;li id=&quot;src10&quot;&gt;10-K 2025-12-31 Item 8 ¶144&lt;/li&gt;&lt;li id=&quot;src11&quot;&gt;10-Q 2026-09-30 Part I, Item 2 ¶265&lt;/li&gt;&lt;li id=&quot;src12&quot;&gt;10-Q 2026-09-30 Part I, Item 2 ¶266&lt;/li&gt;&lt;li id=&quot;src13&quot;&gt;商業評估底稿&lt;/li&gt;&lt;li id=&quot;src14&quot;&gt;商業評估底稿&lt;/li&gt;&lt;li id=&quot;src15&quot;&gt;10-Q 2026-09-30 Part I, Item 2 ¶226&lt;/li&gt;&lt;li id=&quot;src16&quot;&gt;10-K 2025-12-31 Item 7 ¶99&lt;/li&gt;&lt;li id=&quot;src17&q
