&lt;div class=&quot;front&quot; id=&quot;front&quot; data-layer=&quot;首頁&quot;&gt;&lt;header class=&quot;hero&quot;&gt;&lt;div&gt;&lt;span class=&quot;stance&quot;&gt;生意品質普通／價格偏貴（單錨點）&lt;/span&gt;&lt;span class=&quot;stance rating&quot;&gt;研究評等　生意品質普通 ／ 價格偏貴（單錨點）（非買賣建議）&lt;/span&gt;&lt;h1&gt;鈾本業正在變好，但市價已先付了礦砂與稀土專案幾乎確定成功的價錢。&lt;/h1&gt;&lt;p class=&quot;summary&quot;&gt;公司靠美國唯一運轉中的傳統鈾廠 White Mesa（公司在猶他州的鈾與稀土加工廠，10-Q Item 2 ¶285）賣鈾，2026 年前九個月營收跳增，但營業利益與營運現金流仍為負。價值主要看三個專案：Vara Mada（馬達加斯加重礦砂專案，10-Q 2026-06-30 Item 2 ¶62）、Donald（澳洲礦砂與稀土合資專案，合資夥伴 Astron，10-K Item 1A ¶191）與生產中的 Pinyon Plain（公司自有的高品位鈾礦，10-Q Item 2 ¶144）鈾礦，我們把技術報告的專案價值依成功機率打折後加總。合理價值 2.56–3.12 美元（中點 2.84 美元），收盤 6.04 美元 約是中點的 2.13 倍（收盤 2026-11-16 股價 6.04 美元 ÷ 合理價值中點 2.84 美元；只描述距離，非買賣建議），價格位置 偏貴。研究評等非買賣建議。&lt;/p&gt;&lt;/div&gt;&lt;/header&gt;&lt;div class=&quot;layer&quot; id=&quot;layer-30s&quot; style=&quot;margin-top:22px&quot;&gt;&lt;div class=&quot;cap&quot; style=&quot;font-weight:700;letter-spacing:.1em&quot;&gt;30 秒版&lt;/div&gt;&lt;section id=&quot;lights&quot; style=&quot;margin-top:18px&quot;&gt;&lt;h3&gt;四個面向&lt;/h3&gt;&lt;div class=&quot;kpis&quot;&gt;&lt;div class=&quot;kpi&quot; style=&quot;border-left:4px solid #b7791f&quot;&gt;&lt;div class=&quot;l&quot;&gt;生意品質&lt;/div&gt;&lt;div class=&quot;v&quot; style=&quot;color:#b7791f&quot;&gt;普通&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;護城河、投入資本報酬、現金流品質、資產負債表、治理五項合評&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot; style=&quot;border-left:4px solid var(--neg)&quot;&gt;&lt;div class=&quot;l&quot;&gt;商業動能&lt;/div&gt;&lt;div class=&quot;v&quot; style=&quot;color:var(--neg)&quot;&gt;D（五級 A–E）&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;商業評估分頁：模式穩固度、成長動能、卡住訊號&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot; style=&quot;border-left:4px solid #b7791f&quot;&gt;&lt;div class=&quot;l&quot;&gt;信用與存活&lt;/div&gt;&lt;div class=&quot;v&quot; style=&quot;color:#b7791f&quot;&gt;需留意&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;機構 未揭露／推導 D；12～24 個月存活檢查（推導，非違約預測）&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot; style=&quot;border-left:4px solid var(--neg)&quot;&gt;&lt;div class=&quot;l&quot;&gt;價格&lt;/div&gt;&lt;div class=&quot;v&quot; style=&quot;color:var(--neg)&quot;&gt;偏貴&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;單錨點（常態區間要用正常化盈餘，目前不適用）；對照合理價值區間與買入上限，非買賣建議&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;/div&gt;&lt;div class=&quot;layer&quot; id=&quot;layer-try&quot; style=&quot;margin-top:22px&quot;&gt;&lt;div class=&quot;cap&quot; style=&quot;font-weight:700;letter-spacing:.1em&quot;&gt;自己試試看&lt;/div&gt;&lt;section class=&quot;note-box&quot; id=&quot;ledger&quot; style=&quot;margin-top:18px&quot;&gt;&lt;h3&gt;上次預測對答案&lt;/h3&gt;&lt;p&gt;&lt;b&gt;上次（上一版）以來改了什麼：&lt;/b&gt;研究評等 生意 C ／ 價格偏貴 → 生意品質普通 ／ 價格偏貴（單錨點）；合理價值中點 2.0632251790548506 → 2.8375643814098215；收盤價 6.59 → 6.04。期間落空：無落空項目。&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;狀態&lt;/th&gt;&lt;th&gt;預測&lt;/th&gt;&lt;th&gt;檢驗時點&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b style=&quot;color:var(--muted)&quot;&gt;待公布&lt;/b&gt;&lt;/td&gt;&lt;td&gt;P1　2026 年第四季單季營收不低於去年同季 27.10 百萬（單季營收年增 ≥ 0）：第四季要再賣 36–86 萬磅才達全年銷量指引，以近期每磅 74–89 美元換算營收應高於去年同季&lt;/td&gt;&lt;td&gt;2026 年 10-K（約 2027 年 2 月底）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b style=&quot;color:var(--muted)&quot;&gt;待公布&lt;/b&gt;&lt;/td&gt;&lt;td&gt;P2　到 2027 年第二季近四季營業利益率仍為負（&amp;lt; 0）：營業利益自 2015 年起每年為負，且 ASM 與 VAC 併購增加費用&lt;/td&gt;&lt;td&gt;2027 年第二季 10-Q（約 2027 年 8 月）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b style=&quot;color:var(--muted)&quot;&gt;待公布&lt;/b&gt;&lt;/td&gt;&lt;td&gt;P3　2027 年 3 月礦業產能利用率仍在 85% 以上（2000 年以來中位約 85.1%），產業上行段延續&lt;/td&gt;&lt;td&gt;G.17 2027 年 3 月資料（約 2027 年 4 月中）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b style=&quot;color:var(--muted)&quot;&gt;待公布&lt;/b&gt;&lt;/td&gt;&lt;td&gt;P4　2026 年底應收增速減營收增速回到 50 個百分點以內：應收增加主要是季末集中交貨，交貨後一季內收款&lt;/td&gt;&lt;td&gt;2026 年 10-K（約 2027 年 2 月底）&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;來源：商業評估的推論紀錄與觀察清單（預測帳本）；另有觀察清單 5 條待公布，見商業評估分頁。新財報進來後變成命中或落空；只描述，不是買賣建議。&lt;/p&gt;&lt;/section&gt;&lt;/div&gt;&lt;div class=&quot;layer&quot; id=&quot;layer-3min&quot; style=&quot;margin-top:22px&quot;&gt;&lt;div class=&quot;cap&quot; style=&quot;font-weight:700;letter-spacing:.1em&quot;&gt;3 分鐘版&lt;/div&gt;&lt;div class=&quot;grid2 front-pts&quot; style=&quot;margin-top:18px&quot;&gt;&lt;div&gt;&lt;h3&gt;三個看好的理由&lt;/h3&gt;&lt;ol class=&quot;pts&quot;&gt;&lt;li&gt;White Mesa 是美國唯一運轉中的傳統鈾廠，又能分離稀土，牌照與設施難複製，但雙鑰匙都不過、尚未轉成報酬，護城河評無。&lt;/li&gt;&lt;li&gt;2026 前九個月營收 90.13 百萬、年增約 132%，主要來自鈾銷量增加，價格貢獻小。&lt;/li&gt;&lt;li&gt;手上現金加國庫券約 856 百萬，2031 年前沒有大額債務到期，近期沒有再融資壓力。&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;&lt;div&gt;&lt;h3&gt;三個風險&lt;/h3&gt;&lt;ol class=&quot;pts risk&quot;&gt;&lt;li&gt;合理價值約八成來自未 FID 的 Vara Mada，機率是作者判斷，久拖不決會明顯下修。&lt;/li&gt;&lt;li&gt;Donald 最終投資決定由第三季初延到年底；VAC 客戶爭議宣布時已知、10 月才揭露。&lt;/li&gt;&lt;li&gt;擴產與併購都要外部資金，股數持續增加；VAC 完成還要再發約 6,585 萬股。&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;note-box mv&quot;&gt;&lt;b&gt;市場價格隱含什麼、我們哪裡不同&lt;/b&gt;&lt;p&gt;價格偏貴：收盤 6.04 美元 高於合理價值高端 3.12 美元。市價反推相當於 Vara Mada 與 Donald 兩案都幾乎確定成功（推導，只描述）；本報告給的成功機率是 40% 與 70%。&lt;/p&gt;&lt;/div&gt;&lt;div id=&quot;triggers&quot; class=&quot;tm&quot;&gt;&lt;h3&gt;風險與改變判斷&lt;/h3&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;risk-tbl&quot; style=&quot;min-width:0;width:100%&quot;&gt;&lt;tr&gt;&lt;th style=&quot;white-space:normal;width:64%&quot;&gt;情況（看哪個指標、門檻多少）&lt;/th&gt;&lt;th style=&quot;white-space:normal;width:22%&quot;&gt;會改變什麼判斷&lt;/th&gt;&lt;th style=&quot;white-space:normal;width:14%&quot;&gt;歷史基準比率&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;Vara Mada 投資協議獲核准並 FID，機率往樂觀 85% 移；2027 年底仍未核准&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;基準 40% 下修（UUUU-C12）&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;Donald 到 2027 年第二季仍未 FID&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;基準成功機率 70% 要下修（UUUU-C08）&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;OSC（美國政府貸款方，10-Q Item 2 ¶285）7.25 億美元貸款到 2027 年中未定約&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;稀土第二期延後、要靠增資&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;VAC 客戶爭議進入正式仲裁敗訴或證券訴訟立案&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;治理由中下修為弱（UUUU-C07）&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;鈾長約實現均價跌破 59 美元/磅（前九個月 74.19 的八成，10-Q ¶265）&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;Pinyon Plain 價值與現金流下修&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;增量投入資本報酬到 2027 年仍為負且股數年增超過 15%，投入回報轉弱&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;生意品質不升級&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;鈾價在十年高檔，回落會同時壓縮收入與股價（UUUU-C10）&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;未設門檻：持續觀察&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;VAC 完成要付約 718 百萬現金，取得資產未以 NPV（淨現值，技術報告算出的專案價值）揭露&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;未設門檻：持續觀察&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;拿掉流動有價證券，保守與基準情境股權轉負，合理價值中點約少 104%（每股以 0 為下限時約少 79%；推導，計算核對）&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;未設門檻：持續觀察&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;重礦砂已停售，稀土與礦砂價格不在商品模組（未揭露）&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;未設門檻：持續觀察&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;歷史基準比率＝成功幾率口徑，是同規模公司歷史上做到的比例，不是這家公司的預測；「—」＝沒有可對照的歷史基準，不估機率。&lt;/p&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; id=&quot;sanity-front&quot;&gt;&lt;b&gt;合理性檢查：&lt;/b&gt;紅燈 2、黃燈 3（紅：&lt;abbr title=&quot;DCF（Discounted Cash Flow）&quot;&gt;現金流折現&lt;/abbr&gt; 中點與其他方法中點差距、現金流折現 情境範圍與其他方法是否完全錯開）。只提醒、不改評等；逐項與作者說明見計算底稿 5。&lt;/p&gt;&lt;/div&gt;&lt;p class=&quot;cap fnote&quot;&gt;資料日期：財報截至 2026-09-30；市場資料 2026-11-16 收盤 6.04 美元。首家產業，公版待驗證（商品價格接受者／能源礦業；產業公版的估值法與指標選擇尚未經兩家以上驗證）。本報告為研究用途，研究評等與條件式目標區間都不是買賣建議；推導值已標示，公司未揭露處照寫未揭露。本研究只評估公司本身，不評估讀者自身的資金期限與等待能力。完整數字見正文&lt;a href=&quot;#numbers&quot;&gt;「完整數字」&lt;/a&gt;；名詞與每條判斷的證據狀態見&lt;a href=&quot;#more&quot;&gt;附錄&lt;/a&gt;。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;

&lt;main class=&quot;wrap&quot;&gt;&lt;details id=&quot;full&quot; class=&quot;fullwrap&quot;&gt;&lt;summary style=&quot;cursor:pointer;font-weight:700;font-size:18px;padding:14px 0&quot;&gt;完整底稿：價格框與買入上限、正文七題、計算底稿、附錄與出處（點開）&lt;/summary&gt;&lt;div data-layer=&quot;正文&quot;&gt;&lt;section class=&quot;q&quot; id=&quot;price-detail&quot; data-layer=&quot;完整底稿&quot;&gt;&lt;div class=&quot;qno&quot;&gt;價格&lt;/div&gt;&lt;h2&gt;價格框、合理價值與市價隱含倍數&lt;/h2&gt;&lt;div class=&quot;hero&quot;&gt;&lt;aside class=&quot;pricebox&quot;&gt;&lt;div class=&quot;sub&quot;&gt;2026-11-16 收盤 6.04 美元&lt;/div&gt;&lt;div class=&quot;big&quot;&gt;6.04&lt;span style=&quot;font-size:18px&quot;&gt; 美元&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;zones&quot;&gt;&lt;div class=&quot;zone buy&quot; style=&quot;grid-column:1/-1&quot;&gt;&lt;span&gt;買入上限（不確定性極高）&lt;/span&gt;&lt;b&gt;1.42 美元&lt;/b&gt;&lt;small&gt;股價在此以下才有 50% 安全邊際；＝合理價值中點 2.84 ×（1−50%）。非買賣建議。&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;rows&quot;&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;股價 ÷ 合理價值中點&lt;/span&gt;&lt;span&gt;2.13 倍&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;10 年期美國公債&lt;/span&gt;&lt;span&gt;5.12%&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;r&quot;&gt;&lt;span&gt;市價隱含：隱含商品價格係數（相對 SEC 價格）&lt;/span&gt;&lt;span&gt;2.30&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;現金（2026-09-30）&lt;/span&gt;&lt;span&gt;0.8 億美元&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;流動有價證券&lt;/span&gt;&lt;span&gt;7.8 億美元&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;受限現金（不計入淨現金）&lt;/span&gt;&lt;span&gt;0.2 億美元&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;非流動有價證券（不計入淨現金）&lt;/span&gt;&lt;span&gt;0.3 億美元&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;有息負債&lt;/span&gt;&lt;span&gt;6.8 億美元&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;淨現金（現金＋流動有價證券−有息負債）&lt;/span&gt;&lt;span&gt;1.7 億美元&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;淨現金（再加非流動有價證券）&lt;/span&gt;&lt;span&gt;2.0 億美元&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot; style=&quot;display:block&quot;&gt;&lt;span&gt;股東回報與權益（2021–2025）：&lt;/span&gt;&lt;span style=&quot;font-weight:400&quot;&gt;近五年平均 ROE -3%；股東權益 2.9→6.8 億美元（逐年表見第六題）&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; id=&quot;cont-note&quot; style=&quot;margin:10px 0 0&quot;&gt;這個數字只描述現價與本報告合理價值中點的距離，不改價格位置與研究評等。非買賣建議。&lt;/p&gt;&lt;/aside&gt;&lt;/div&gt;&lt;section class=&quot;note-box&quot; id=&quot;value-trio&quot; style=&quot;margin-top:18px&quot;&gt;&lt;h3&gt;合理價值與市價隱含第 10 年倍數&lt;/h3&gt;&lt;div class=&quot;zones&quot; style=&quot;grid-template-columns:repeat(2,1fr)&quot;&gt;&lt;div class=&quot;zone&quot;&gt;&lt;span&gt;合理價值（只含折現率）&lt;/span&gt;&lt;b&gt;2.56–3.12 美元&lt;/b&gt;&lt;small&gt;中點 2.84 美元；三情境機率加權&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;zone mkt&quot;&gt;&lt;span&gt;市價隱含第 10 年倍數&lt;/span&gt;&lt;b&gt;不適用&lt;/b&gt;&lt;small&gt;本方法（儲量NAV）不適用 EV/EBIT 隱含倍數；主方法的市價反推見下方「市價隱含」列。只描述，不進評等。&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;&lt;b&gt;合理價值 vs 市價隱含倍數（作者判讀）：&lt;/b&gt;本方法不適用 EV/EBIT（息稅前利益）隱含倍數，改看主方法市價反推：現價 6.04 美元 在基準成功機率下，相當於專案價值是技術報告的約 2.30 倍；或兩大專案都視為幾乎確定成功（推導）。只描述，不當評等理由。&lt;/p&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:10px;font-size:15px;line-height:1.7&quot;&gt;上面的合理價值只含折現率高低；三情境全幅 0.49～5.80（情境與折現率一起算，約中點的 187%）；寬主要來自情境（差距 172%），不是折現率（20%）。情境差距＝（樂觀－保守）÷基準，折現率寬度＝（高－低）÷中點；非買賣建議。&lt;/p&gt;&lt;div class=&quot;tw&quot; style=&quot;margin-top:14px&quot;&gt;&lt;table class=&quot;txt&quot; style=&quot;min-width:0;font-size:16px&quot;&gt;&lt;tr&gt;&lt;th style=&quot;padding:9px 12px;font-size:15px&quot;&gt;情境&lt;/th&gt;&lt;th style=&quot;padding:9px 12px;font-size:15px&quot;&gt;每股價值&lt;/th&gt;&lt;th style=&quot;padding:9px 12px;font-size:15px&quot;&gt;權重&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;padding:9px 12px&quot;&gt;保守&lt;/td&gt;&lt;td style=&quot;padding:9px 12px;font-size:20px;font-weight:700&quot;&gt;0.59&lt;/td&gt;&lt;td style=&quot;padding:9px 12px&quot;&gt;25%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;padding:9px 12px&quot;&gt;基準&lt;div style=&quot;font-size:13px;line-height:1.5;color:var(--muted);margin-top:2px&quot;&gt;與外部 DCF 單點同口徑；今天的現值，不是 12 個月目標價，非買賣建議&lt;/div&gt;&lt;/td&gt;&lt;td style=&quot;padding:9px 12px;font-size:20px;font-weight:700&quot;&gt;2.73&lt;/td&gt;&lt;td style=&quot;padding:9px 12px&quot;&gt;50%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;padding:9px 12px&quot;&gt;樂觀&lt;/td&gt;&lt;td style=&quot;padding:9px 12px;font-size:20px;font-weight:700&quot;&gt;5.29&lt;/td&gt;&lt;td style=&quot;padding:9px 12px&quot;&gt;25%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:10px;font-size:15px;line-height:1.7&quot;&gt;中點是三個情境的加權，上下緣是換折現率重算；算式見&lt;a href=&quot;#valuation&quot;&gt;第五題&lt;/a&gt;。情境表說明合理價值怎麼組成，不是單一目標價。&lt;/p&gt;&lt;/section&gt;&lt;div class=&quot;kpis&quot;&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;l&quot;&gt;鈾實現價格&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;長約 74.19／現貨 89.33 美元/磅&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;2026 前九個月加權均價（10-Q 2026-09-30 Item 2 ¶265–266）&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;l&quot;&gt;單位成本&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;約 23 美元/磅&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;Pinyon Plain 礦石一次廠運轉的採運＋加工成本，公司揭露（10-Q Item 2 ¶144）&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;l&quot;&gt;產量指引&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;銷售 150–200 萬磅&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;2026 年鈾銷售指引，前九個月已售 114 萬磅（10-Q Item 2 ¶140）&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;l&quot;&gt;景氣正常化利潤率&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;近四季 −81%&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;營業利益 −94.9／營收 117.2（推導）；主方法看專案價值，不用穩態利潤率&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;note-box&quot; id=&quot;survival&quot; style=&quot;border-left-color:var(--accent)&quot;&gt;&lt;p style=&quot;margin:0&quot;&gt;&lt;b&gt;信用評級&lt;/b&gt;　&lt;span style=&quot;color:var(--neg);font-weight:700&quot;&gt;機構 未揭露／推導 D（只看利息保障倍數，-10.3 倍，近四季新借款多、利息偏低、評級可能偏高）｜依推導：⚠ 投機等級&lt;/span&gt;&lt;/p&gt;&lt;p style=&quot;margin:6px 0 0&quot;&gt;&lt;a href=&quot;#survival-detail&quot;&gt;&lt;b&gt;存活檢查（12～24 個月）&lt;/b&gt;&lt;/a&gt;　&lt;b style=&quot;color:var(--accent)&quot;&gt;需留意&lt;/b&gt;（推導，非違約預測）：利息保障 -10.3 倍（偏薄）（新借款多、利息偏低，倍數可能偏高）；利率 +200bp 後利息保障 -9.8 倍。&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;business&quot;&gt;&lt;div class=&quot;qno&quot;&gt;問題 01&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;生意怎麼賺錢？&lt;/div&gt;&lt;h2&gt;靠賣鈾賺毛利，但費用與擴產讓公司仍在虧損。&lt;/h2&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;公司從自有礦開採鈾礦、在 White Mesa 加工成鈾精礦，賣給核電公司；近四季毛利 56.2 百萬，但銷管費用 73.1，營業虧損 94.9&lt;span class=&quot;src&quot;&gt;（財務歷史，推導）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;反方：近四季毛利率 47.9% 受惠鈾價在十年高檔（UUUU-C10）與低成本礦一次廠運轉，下一次廠運轉的礦石組合與鈾價都會改變毛利。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;產品線營收占比（FY25，億美元；逐年金額與成長見下方明細表；圖的占比分母為圖中各線合計）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 480 280&quot; role=&quot;img&quot; aria-label=&quot;產品線營收&quot; class=&quot;chart&quot; style=&quot;max-width:624px&quot;&gt;&lt;path d=&quot;M240.0,52.0 A88,88 0 1 1 152.6,150.1 L186.4,146.2 A54,54 0 1 0 240.0,86.0 Z&quot; fill=&quot;var(--c1)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;鈾精礦：0.5（73%）&lt;/title&gt;&lt;/path&gt;&lt;path d=&quot;M152.6,150.1 A88,88 0 0 1 224.4,53.4 L230.4,86.9 A54,54 0 0 0 186.4,146.2 Z&quot; fill=&quot;var(--c2)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;重礦砂：0.2（24%）&lt;/title&gt;&lt;/path&gt;&lt;path d=&quot;M224.4,53.4 A88,88 0 0 1 240.0,52.0 L240.0,86.0 A54,54 0 0 0 230.4,86.9 Z&quot; fill=&quot;var(--c6)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;替代原料加工與其他：0.0（3%）&lt;/title&gt;&lt;/path&gt;&lt;polyline points=&quot;308.7,201.2 314.7,213.2 346.0,213.2&quot; fill=&quot;none&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;1&quot;/&gt;&lt;text x=&quot;354.0&quot; y=&quot;210.2&quot; class=&quot;lab&quot; text-anchor=&quot;start&quot;&gt;鈾精礦&lt;/text&gt;&lt;text x=&quot;354.0&quot; y=&quot;228.2&quot; class=&quot;val&quot; text-anchor=&quot;start&quot;&gt;73%&lt;tspan class=&quot;ax&quot; font-weight=&quot;400&quot;&gt;　0.5&lt;/tspan&gt;&lt;/text&gt;&lt;polyline points=&quot;166.1,85.1 159.7,74.4 134.0,74.4&quot; fill=&quot;none&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;1&quot;/&gt;&lt;text x=&quot;126.0&quot; y=&quot;71.4&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;重礦砂&lt;/text&gt;&lt;text x=&quot;126.0&quot; y=&quot;89.4&quot; class=&quot;val&quot; text-anchor=&quot;end&quot;&gt;24%&lt;tspan class=&quot;ax&quot; font-weight=&quot;400&quot;&gt;　0.2&lt;/tspan&gt;&lt;/text&gt;&lt;polyline points=&quot;231.8,48.4 231.1,30.4 134.0,30.4&quot; fill=&quot;none&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;1&quot;/&gt;&lt;text x=&quot;126.0&quot; y=&quot;27.4&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;替代原料加工與其他&lt;/text&gt;&lt;text x=&quot;126.0&quot; y=&quot;45.4&quot; class=&quot;val&quot; text-anchor=&quot;end&quot;&gt;3%&lt;tspan class=&quot;ax&quot; font-weight=&quot;400&quot;&gt;　0.0&lt;/tspan&gt;&lt;/text&gt;&lt;text x=&quot;240.0&quot; y=&quot;136.0&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY25&lt;/text&gt;&lt;text x=&quot;240.0&quot; y=&quot;158.0&quot; class=&quot;val&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:18px&quot;&gt;0.7&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;白話說&lt;/b&gt;每賣 100 元，2026 前九個月約 99 元來自鈾，稀土金屬不到 1 元（10-Q Item 2 ¶226、¶256，推導）。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;要留意&lt;/b&gt;淨損含有價證券未實現損失，看本業要看營業虧損（UUUU-C11）。&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;產品線營收明細（億美元；占比為最近財年，分母為各線合計）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;產品線&lt;/th&gt;&lt;th&gt;FY23&lt;/th&gt;&lt;th&gt;FY24&lt;/th&gt;&lt;th&gt;FY25&lt;/th&gt;&lt;th&gt;近四季&lt;/th&gt;&lt;th&gt;最近財年年增&lt;/th&gt;&lt;th&gt;占比&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;鈾精礦&lt;/td&gt;&lt;td&gt;0&lt;/td&gt;&lt;td&gt;0&lt;/td&gt;&lt;td&gt;0&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;27.3%&lt;/td&gt;&lt;td&gt;73%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;重礦砂&lt;/td&gt;&lt;td&gt;0&lt;/td&gt;&lt;td&gt;0&lt;/td&gt;&lt;td&gt;0&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;-60.3%&lt;/td&gt;&lt;td&gt;24%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;替代原料加工與其他&lt;/td&gt;&lt;td&gt;0&lt;/td&gt;&lt;td&gt;0&lt;/td&gt;&lt;td&gt;0&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;455.7%&lt;/td&gt;&lt;td&gt;3%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;稀土碳酸鹽&lt;/td&gt;&lt;td&gt;0&lt;/td&gt;&lt;td&gt;0&lt;/td&gt;&lt;td&gt;0&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;0%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;business-profile&quot;&gt;&lt;h3&gt;生意介紹：年報重點&lt;/h3&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;一家以鈾為現金來源、正在轉型成「礦到磁鐵」稀土供應鏈的美國礦業公司。&lt;/strong&gt;下面幾塊依序說它賣什麼、誰付錢、營收怎麼組成、專案進度、競爭、管理層說法與年報列的風險，每段附原文出處。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;賣什麼&lt;/p&gt;&lt;h4&gt;現在賣的幾乎只有鈾，稀土金屬剛起步&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;公司分三個報告分部：鈾、稀土、&lt;a class=&quot;term&quot; href=&quot;#g2&quot;&gt;重礦砂&lt;/a&gt;&lt;span class=&quot;src&quot;&gt;（10-K 2025-12-31 Item 1 ¶22）&lt;/span&gt;。&lt;/strong&gt;2025 年營收 65.9 百萬，鈾精礦 48.2、重礦砂 15.8、替代原料加工 1.9&lt;span class=&quot;src&quot;&gt;（Item 8 ¶422）&lt;/span&gt;。2026 年第三季營收 29.18 百萬，其中鈾 28.45、稀土金屬與合金 0.44，重礦砂因 Kwale 停產已無銷售&lt;span class=&quot;src&quot;&gt;（10-Q 2026-09-30 Part I, Item 2 ¶199）&lt;/span&gt;。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;誰付錢、怎麼賣&lt;/p&gt;&lt;h4&gt;客戶是核電公司，前三大占六成&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;鈾大多賣給大型核電公司，公司認為倒帳風險低&lt;span class=&quot;src&quot;&gt;（10-K Item 1A ¶258）&lt;/span&gt;。&lt;/strong&gt;2025 年三家主要客戶分別買 17.2、15.4、7.7 百萬，合計約 61%&lt;span class=&quot;src&quot;&gt;（推導，Item 8 ¶425）&lt;/span&gt;；客戶名稱未揭露。鈾合約在交貨後開票，沒有合約資產或負債&lt;span class=&quot;src&quot;&gt;（Item 8 ¶144）&lt;/span&gt;。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;營收結構：誰在拉動&lt;/p&gt;&lt;h4&gt;2026 年的成長幾乎全靠鈾銷量&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;2026 前九個月營收 90.13 百萬，比去年同期 38.82 增加 51.31，公司說主因是鈾銷量增加與出貨時點，部分被重礦砂沒有銷售抵銷&lt;span class=&quot;src&quot;&gt;（10-Q Part I, Item 2 ¶226）&lt;/span&gt;。&lt;/strong&gt;前九個月長約賣 84 萬磅、現貨賣 30 萬磅&lt;span class=&quot;src&quot;&gt;（¶265–266）&lt;/span&gt;。鈾營收跟著出貨排程跳動，單季不能外推。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;市場、地區與重點專案&lt;/p&gt;&lt;h4&gt;營收六成在美國，大型專案都還沒做最終投資決定&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;2025 年美國客戶約 38.9 百萬、占 59%，加拿大 15.4、占 23%，其餘為沙烏地、中國、日本等重礦砂買家&lt;span class=&quot;src&quot;&gt;（推導，10-K Item 8 ¶428）&lt;/span&gt;。&lt;/strong&gt;重礦砂在 2025 年後停售，地區組合會更集中在美國與加拿大鈾客戶。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;重點專案：White Mesa 稀土第二期預計 2029 年中完成，需執照、融資與 FID&lt;span class=&quot;src&quot;&gt;（10-Q Part I, Item 2 ¶40）&lt;/span&gt;；Whirlwind&lt;span class=&quot;src&quot;&gt;（公司備用中的傳統鈾礦，已完成修復、開始開發，10-Q Item 2 ¶16）&lt;/span&gt;與 Nichols Ranch&lt;span class=&quot;src&quot;&gt;（公司備用中的地浸採鈾專案，10-Q Item 2 ¶16）&lt;/span&gt;兩座備用鈾礦在開工決定後一年內可投產，最快 2027 年每年多約 60 萬磅&lt;span class=&quot;src&quot;&gt;（10-Q Item 2 ¶16；10-K Item 7 ¶17）&lt;/span&gt;；巴西 Bahia 礦砂專案 2026 年鑽探&lt;span class=&quot;src&quot;&gt;（Item 1 ¶120）&lt;/span&gt;。&lt;/strong&gt;Vara Mada、Donald 進度見第七題。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;跟誰競爭&lt;/p&gt;&lt;h4&gt;鈾市場競爭激烈，但美國能加工的廠很少&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;10-K 說鈾業競爭激烈，對手包括其他礦商、交易商與國營或受補貼的業者，公司在部分方面可能處於劣勢&lt;span class=&quot;src&quot;&gt;（Item 1 ¶255）&lt;/span&gt;，且真正的鈾買家相對少&lt;span class=&quot;src&quot;&gt;（Item 1A ¶43）&lt;/span&gt;。&lt;/strong&gt;外部證據：Anfield（Anfield Energy，以 40-F 申報的鈾業公司）40-F 2026-03-31 列美國只有三座已建成並取得執照的傳統鈾廠，White Mesa 是其一。我們的判讀：產品沒有定價權，優勢在加工設施稀缺。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;管理層怎麼說&lt;/p&gt;&lt;h4&gt;公司說法：鈾成本是全球最低之一，實績已部分印證&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;公司說法：Pinyon Plain 礦石採運約 14＋加工約 9＝加權總成本約 23 美元/磅（含少量 La Sal/Pandora 礦），屬全球開採鈾最低成本之列&lt;span class=&quot;src&quot;&gt;（10-Q Part I, Item 2 ¶144）&lt;/span&gt;；又說庫存與 2026 年產量讓它可以視行情做現貨銷售&lt;span class=&quot;src&quot;&gt;（10-K Item 1 ¶211）&lt;/span&gt;。&lt;/strong&gt;對照實績：2026 前九個月毛利率由 2025 年的 20.9% 升到近四季 47.9%&lt;span class=&quot;src&quot;&gt;（推導，財務歷史）&lt;/span&gt;，但銷管費用增加，營業利益仍為負。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;年報列的主要風險&lt;/p&gt;&lt;h4&gt;年報風險：價格、資金、稀釋、專案與客戶&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;①鈾的真正買家少，競爭爭取資本與礦權&lt;span class=&quot;src&quot;&gt;（10-K Item 1A ¶43）&lt;/span&gt;。&lt;/strong&gt;②公司需要更多資本才能做擴張與併購，稀土、礦砂與鈾價波動會影響募資&lt;span class=&quot;src&quot;&gt;（Item 1A ¶200）&lt;/span&gt;。③以發股或可轉債募資可能大幅稀釋股東&lt;span class=&quot;src&quot;&gt;（Item 1A ¶330）&lt;/span&gt;。④Kwale 礦砂停產的後續風險&lt;span class=&quot;src&quot;&gt;（Item 1A ¶170）&lt;/span&gt;。⑤Donald 合資對手 Astron 的履約風險&lt;span class=&quot;src&quot;&gt;（Item 1A ¶191）&lt;/span&gt;。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;規模與營運&lt;/p&gt;&lt;h4&gt;一座廠、多座待命礦&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;White Mesa 同時處理鈾礦與&lt;a class=&quot;term&quot; href=&quot;#g3&quot;&gt;獨居石&lt;/a&gt;，第一期稀土分離產能 850–1,000 噸 &lt;a class=&quot;term&quot; href=&quot;#g4&quot;&gt;NdPr&lt;/a&gt;（釹鐠氧化物，做永久磁鐵的主要稀土原料）／年&lt;span class=&quot;src&quot;&gt;（10-Q Part I, Item 2 ¶27，研究評等輸入引用）&lt;/span&gt;；其他鈾礦維持待命，依合約與行情重啟&lt;span class=&quot;src&quot;&gt;（10-K Item 1 ¶181）&lt;/span&gt;。&lt;/strong&gt;員工人數本報告未引用。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;moat&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;護城河與成長故事&lt;/p&gt;&lt;h3&gt;牌照與設施稀缺是真的，但還沒變成報酬。&lt;/h3&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;護城河評無：White Mesa 是美國唯一運轉中的傳統鈾廠並能分離稀土（UUUU-C01），但產品是價格接受者，投入資本報酬為負（UUUU-C02），雙鑰匙都不過，設施稀缺還沒轉成獲利。&lt;/p&gt;&lt;p&gt;生命週期在專案擴產期：鈾已量產、稀土金屬剛有營收，礦砂與第二期都待 FID；費用率沒有隨營收下降，成長要靠外部資金（成長跑道六項明細見計算底稿 5）。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;外部申報文件怎麼看 White Mesa&lt;/h4&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;三份外部文件都是同業或合作方的申報，只能證明設施稀缺與被當成加工對象，不能證明公司賺得到超額報酬。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;前三大客戶占 2025 年營收&lt;/p&gt;&lt;svg viewBox=&quot;0 0 500 142&quot; role=&quot;img&quot; aria-label=&quot;依賴度&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;230.0&quot; x2=&quot;230.0&quot; y1=&quot;6&quot; y2=&quot;136&quot; class=&quot;zero&quot;/&gt;&lt;text x=&quot;220&quot; y=&quot;23&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;客戶 1（鈾，未具名）（其他）&lt;/text&gt;&lt;rect x=&quot;230.0&quot; y=&quot;9&quot; width=&quot;192.7&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;430.7&quot; y=&quot;23&quot; class=&quot;val&quot;&gt;26%&lt;/text&gt;&lt;text x=&quot;220&quot; y=&quot;63&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;客戶 2（鈾，未具名）（其他）&lt;/text&gt;&lt;rect x=&quot;230.0&quot; y=&quot;49&quot; width=&quot;172.7&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;410.7&quot; y=&quot;63&quot; class=&quot;val&quot;&gt;23%&lt;/text&gt;&lt;text x=&quot;220&quot; y=&quot;103&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;客戶 3（鈾，未具名）（其他）&lt;/text&gt;&lt;rect x=&quot;230.0&quot; y=&quot;89&quot; width=&quot;86.7&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;324.7&quot; y=&quot;103&quot; class=&quot;val&quot;&gt;12%&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;申報人與文件&lt;/th&gt;&lt;th&gt;說法&lt;/th&gt;&lt;th&gt;我們的判讀&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Anfield Energy（以 40-F 向 SEC 申報的鈾業公司）40-F 2026-03-31&lt;/td&gt;&lt;td&gt;美國只有三座取得執照、已建成的傳統鈾廠，其一是 White Mesa&lt;/td&gt;&lt;td&gt;支持加工設施稀缺&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;IperionX（以 20-F 申報、曾與公司簽稀土加工備忘錄的公司）20-F/A 2023-05-30&lt;/td&gt;&lt;td&gt;與公司簽備忘錄，評估把 Titan（IperionX 的礦床，備忘錄評估送 White Mesa 加工）礦稀土送 White Mesa 加工&lt;/td&gt;&lt;td&gt;第三方把它當稀土加工對手方&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Uranium Royalty（以 40-F 申報的鈾業公司）40-F 2023-07-13&lt;/td&gt;&lt;td&gt;描述公司擁有 White Mesa，為既有傳統鈾廠&lt;/td&gt;&lt;td&gt;只證明設施存在，不證明報酬&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;supply&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;供應鏈與地區&lt;/p&gt;&lt;h3&gt;原料自己挖，稀土另靠外部獨居石。&lt;/h3&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;鈾礦主要來自自有的 Pinyon Plain 等礦；稀土第二期原料預計來自 Donald、Vara Mada、Bahia&lt;span class=&quot;src&quot;&gt;（公司在巴西的重礦砂專案，10-K Item 1 ¶120）&lt;/span&gt;與第三方獨居石&lt;span class=&quot;src&quot;&gt;（10-Q Part I, Item 2 ¶38）&lt;/span&gt;，自有礦砂專案延後，原料就要更多外購。&lt;/p&gt;&lt;p&gt;2025 年海外客戶占營收約 41%&lt;span class=&quot;src&quot;&gt;（推導，10-K Item 8 ¶428）&lt;/span&gt;，重礦砂停售後海外占比會下降；稀土產品可能受中國出口管制與美國政策影響，影響方向未量化。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;growth&quot;&gt;&lt;div class=&quot;qno&quot;&gt;問題 02&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;成長從哪裡來？&lt;/div&gt;&lt;h2&gt;近期靠鈾銷量，長期靠尚未定案的稀土與礦砂專案。&lt;/h2&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;近四季營收年增 48.9%，比一年前的 103.7% 放緩（成長推估底稿）；估值不用營收成長路徑，價值看專案能否 FID（第五題）。&lt;/p&gt;&lt;p&gt;拆解看，2026 前九個月鈾營收增加主要是量：銷量由 29 萬磅增到 114 萬磅，價格貢獻小（UUUU-C03）。&lt;/p&gt;&lt;p&gt;長期成長要等稀土第二期、Vara Mada、Donald 定案；估值用成功機率處理時程風險，Vara Mada 基準 40%、Donald 70%（作者判斷）。&lt;/p&gt;&lt;p&gt;反方：公司只給鈾量指引、不給營收指引，2026 年第四季要再賣 36–86 萬磅才落在指引區間，出貨時點會讓單季大幅跳動。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;毛利率與營業利益率&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 280&quot; role=&quot;img&quot; aria-label=&quot;利潤率&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;246.0&quot; y2=&quot;246.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;250.0&quot; 2.0&quot; cy=&quot;50.1&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c2)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;毛利率 FY22：37%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;181.5&quot; cy=&quot;43.5&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c2)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;毛利率 FY23：52%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;291.0&quot; cy=&quot;54.1&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c2)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;毛利率 FY24：28%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;400.5&quot; cy=&quot;57.5&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c2)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;毛利率 FY25：21%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;510.0&quot; cy=&quot;45.3&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c2)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;毛利率 近四季：48%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;518.0&quot; y=&quot;49.3&quot; class=&quot;val&quot; fill=&quot;var(--c2)&quot;&gt;48%&lt;/text&gt;&lt;polyline points=&quot;72.0,227.7 181.5,105.0 291.0,94.1 400.5,135.5 510.0,103.1&quot; fill=&quot;none&quot; stroke=&quot;var(--c1)&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;circle cx=&quot;72.0&quot; cy=&quot;227.7&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c1)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;營業利益率 FY22：-359%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;181.5&quot; cy=&quot;105.0&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c1)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;營業利益率 FY23：-85%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;291.0&quot; cy=&quot;94.1&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c1)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;營業利益率 FY24：-61%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;400.5&quot; cy=&quot;135.5&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c1)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;營業利益率 FY25：-153%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;510.0&quot; cy=&quot;103.1&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c1)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;營業利益率 近四季：-81%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;518.0&quot; y=&quot;107.1&quot; class=&quot;val&quot; fill=&quot;var(--c1)&quot;&gt;-81%&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c2)&quot;&gt;&lt;/i&gt;毛利率&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c1)&quot;&gt;&lt;/i&gt;營業利益率&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;成長來源拆解（量、價、新產品、新市場、併購）&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;量：鈾前九個月營收增加約 67.9 百萬，其中量約 62.2、價約 5.7&lt;span class=&quot;src&quot;&gt;（推導，UUUU-C03）&lt;/span&gt;。&lt;/strong&gt;價：長約均價 74.19 對去年 69.43 美元/磅&lt;span class=&quot;src&quot;&gt;（10-Q ¶265）&lt;/span&gt;。新產品：稀土金屬與合金第三季首度貢獻 0.44 百萬。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;新市場：未揭露。&lt;/strong&gt;併購：ASM&lt;span class=&quot;src&quot;&gt;（Australian Strategic Materials，2026-08-28 完成收購，10-Q Item 2 ¶52）&lt;/span&gt;2026-08-28 完成併入，VAC 待完成&lt;span class=&quot;src&quot;&gt;（10-Q Item 1 ¶46–48）&lt;/span&gt;，兩者營收未計入估值。重礦砂 2025 年後停售，是負向貢獻。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;投入與回報&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;投入沒有換來回報：2023–2025 年增量投入資本報酬 −147.1%；近四季投入資本報酬（ROIC，投入資本報酬率）−105.9%（財務指標）。&lt;/strong&gt;擴產與併購仍在投入期，第二期與礦砂專案投產前，這個比率不會轉正；改判訊號列了投入回報轉弱的追蹤條件。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;!--新圖表--&gt;&lt;div class=&quot;grid2 wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;營收年增率逐季走勢（每季比去年同季；成長推估底稿）；底稿標示：放緩（年增率下降）（近四季單季年增平均 160.2% 對前四季平均 2184.4%（差 -2024.2 個百分點；±1 個百分點內標持平，只是標示））&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 280&quot; role=&quot;img&quot; aria-label=&quot;營收年增率走勢&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;56&quot; x2=&quot;516&quot; y1=&quot;246.0&quot; y2=&quot;246.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;48&quot; y=&quot;250.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;-2000%&lt;/text&gt;&lt;line x1=&quot;56&quot; x2=&quot;516&quot; y1=&quot;208.0&quot; y2=&quot;208.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;48&quot; y=&quot;212.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;0%&lt;/text&gt;&lt;line x1=&quot;56&quot; x2=&quot;516&quot; y1=&quot;170.0&quot; y2=&quot;170.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;48&quot; y=&quot;174.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;2000%&lt;/text&gt;&lt;line x1=&quot;56&quot; x2=&quot;516&quot; y1=&quot;132.0&quot; y2=&quot;132.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;48&quot; y=&quot;136.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;4000%&lt;/text&gt;&lt;line x1=&quot;56&quot; x2=&quot;516&quot; y1=&quot;94.0&quot; y2=&quot;94.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;48&quot; y=&quot;98.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;6000%&lt;/text&gt;&lt;line x1=&quot;56&quot; x2=&quot;516&quot; y1=&quot;56.0&quot; y2=&quot;56.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;48&quot; y=&quot;60.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;8000%&lt;/text&gt;&lt;line x1=&quot;56&quot; x2=&quot;516&quot; y1=&quot;18.0&quot; y2=&quot;18.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;48&quot; y=&quot;22.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;10000%&lt;/text&gt;&lt;line x1=&quot;56&quot; x2=&quot;516&quot; y1=&quot;208.0&quot; y2=&quot;208.0&quot; class=&quot;zero&quot;/&gt;&lt;text x=&quot;68.0&quot; ce)&quot; stroke=&quot;var(--c1)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;單季營收比去年同季 2025-06：-52%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;251.4&quot; cy=&quot;201.6&quot; r=&quot;3.5&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c1)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;單季營收比去年同季 2025-09：338%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;312.6&quot; cy=&quot;208.6&quot; r=&quot;3.5&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c1)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;單季營收比去年同季 2025-12：-32%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;373.7&quot; cy=&quot;205.9&quot; r=&quot;3.5&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c1)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;單季營收比去年同季 2026-03：112%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;434.9&quot; cy=&quot;198.6&quot; r=&quot;3.5&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c1)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;單季營收比去年同季 2026-06：496%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;496.0&quot; cy=&quot;206.8&quot; r=&quot;3.5&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c1)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;單季營收比去年同季 2026-09：65%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;503.0&quot; y=&quot;210.8&quot; class=&quot;val&quot; fill=&quot;var(--c1)&quot;&gt;65%&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c1)&quot;&gt;&lt;/i&gt;單季營收比去年同季&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c2)&quot;&gt;&lt;/i&gt;近四季合計&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/div&gt;&lt;!--/新圖表--&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;白話說&lt;/b&gt;前九個月鈾多賣 85 萬磅，價格只多約 5 美元/磅，營收增加主要來自多賣。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;要留意&lt;/b&gt;出貨時點讓季營收跳動，不宜用單季年增外推（見改判訊號）。&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;cash&quot;&gt;&lt;div class=&quot;qno&quot;&gt;問題 03・04&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;賺到的錢是真的嗎？股東拿到什麼？&lt;/div&gt;&lt;h2&gt;還沒有：營運現金流每年為負，靠募資撐。&lt;/h2&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;營運現金流自 2015 年起每年為負，近四季 −54.7 百萬（融資償債底稿）；股權薪酬 14.5 百萬、約占營收 12.4%，若當成現金成本，現金缺口更大。&lt;/p&gt;&lt;p&gt;反方：應收帳款年增 +122.8%（2026-09-30 對 2025-09-30），比營收年增多 +73.9 個百分點（應收 2026-09-30 對 2025-09-30，對近四季營收年增），部分是季末集中出貨；鈾合約交貨後才開票、付款無條件&lt;span class=&quot;src&quot;&gt;（10-K Item 8 ¶144）&lt;/span&gt;，目前沒有收款問題的證據。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;淨利、營運現金流與自由現金流（億美元）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 300&quot; role=&quot;img&quot; aria-label=&quot;現金品質&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;266.0&quot; y2=&quot;266.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;270.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;-2.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;205.5&quot; y2=&quot;205.5&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;209.5&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;-1.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;145.0&quot; y2=&quot;145.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;149.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;0.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;84.5&quot; y2=&quot;84.5&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;88.5&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;1.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;24.0&quot; y2=&quot;24.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;28.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;2.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;145.0&quot; y2=&quot;145.0&quot; class=&quot;zero&quot;/&gt ect&gt;&lt;text x=&quot;357.0&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY25&lt;/text&gt;&lt;rect x=&quot;436.3&quot; y=&quot;145.0&quot; width=&quot;26.5&quot; height=&quot;70.9&quot; rx=&quot;2&quot; fill=&quot;var(--c4)&quot;&gt;&lt;title&gt;淨利 近四季：-1.2&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;464.8&quot; y=&quot;145.0&quot; width=&quot;26.5&quot; height=&quot;33.1&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;營運現金流 近四季：-0.5&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;493.2&quot; y=&quot;145.0&quot; width=&quot;26.5&quot; height=&quot;33.1&quot; rx=&quot;2&quot; fill=&quot;var(--c2)&quot;&gt;&lt;title&gt;自由現金流 近四季：-0.5&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;479.0&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;近四季&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c4)&quot;&gt;&lt;/i&gt;淨利&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c1)&quot;&gt;&lt;/i&gt;營運現金流&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c2)&quot;&gt;&lt;/i&gt;自由現金流&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;錢從哪一層開始不夠：現金流分層&lt;/h3&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;現金流分層（近四季，至 2026-09-30）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;層次&lt;/th&gt;&lt;th&gt;金額&lt;/th&gt;&lt;th&gt;正負&lt;/th&gt;&lt;th&gt;完整度&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;一、營運現金流&lt;/td&gt;&lt;td&gt;-0.5 億美元&lt;/td&gt;&lt;td&gt;負&lt;/td&gt;&lt;td&gt;完整&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;二、一般資本支出後&lt;/td&gt;&lt;td&gt;已知部分 -0.5 億美元&lt;/td&gt;&lt;td&gt;無法判定&lt;/td&gt;&lt;td&gt;缺一般資本支出&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;三、回購與股利後&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;無法判定&lt;/td&gt;&lt;td&gt;未取得&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;延伸：再扣併購與員工代扣稅&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;無法判定&lt;/td&gt;&lt;td&gt;未取得&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;數值正負不等於安全或危險：第二層為負代表所列投入超過當期營運現金，不等於營業虧損；資本支出尚未區分維持與擴張。；回購：確認為零：近四季組成欄（10-K 欄 2025-12-31 (FY)、10-Q 欄 2026-09-30 (YTD)、10-Q 欄 2025-09-30 (YTD)）的融資活動逐項加總等於小計，且沒有回購列；另有未分類融資列，金額已列於報表對帳；股利：確認為零：近四季組成欄（10-K 欄 2025-12-31 (FY)、10-Q 欄 2026-09-30 (YTD)、10-Q 欄 2025-09-30 (YTD)）的融資活動逐項加總等於小計，且沒有股利列；另有未分類融資列，金額已列於報表對帳&lt;/p&gt;&lt;p class=&quot;cap&quot;&gt;（算法與完整表見&lt;a href=&quot;#wp-3-4&quot;&gt;計算底稿 3・4&lt;/a&gt;）&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;白話說&lt;/b&gt;近四季每賣 100 元，營運現金流約流出 47 元（推導）。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;要留意&lt;/b&gt;淨損被有價證券損益放大，現金流比淨損更能看本業（見改判訊號）。&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;shareholders&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;股東拿到什麼？&lt;/p&gt;&lt;h3&gt;沒有股利、沒有回購，只有稀釋。&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;近十年沒有回購、沒有股利&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;；稀釋股數近三財年每年 +12.6%（近三財年年化；股數期間 2015–2025）、近十年每年 +21.0%（近十財年年化）（UUUU-C06）。&lt;/p&gt;&lt;p&gt;反方：稀釋換來的是現金與國庫券約 856 百萬&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;，若專案投產，每股價值可能追上；但 VAC 完成還要再發約 6,585 萬股，約占目前股數四分之一&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;每股自由現金流（美元）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 300&quot; role=&quot;img&quot; aria-label=&quot;每股自由現金流&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;266.0&quot; y2=&quot;266.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;270.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;-0.6&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;185.3&quot; y2=&quot;185.3&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;189.3&quot; class tle&gt;&lt;/circle&gt;&lt;circle cx=&quot;139.3&quot; cy=&quot;168.7&quot; r=&quot;3.5&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c6)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;股票薪酬占營收 2021：68%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;210.7&quot; cy=&quot;203.7&quot; r=&quot;3.5&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c6)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;股票薪酬占營收 2022：37%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;282.0&quot; cy=&quot;232.1&quot; r=&quot;3.5&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c6)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;股票薪酬占營收 2023：12%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;353.3&quot; cy=&quot;238.1&quot; r=&quot;3.5&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c6)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;股票薪酬占營收 2024：7%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;424.7&quot; cy=&quot;224.2&quot; r=&quot;3.5&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c6)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;股票薪酬占營收 2025：19%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;496.0&quot; cy=&quot;231.9&quot; r=&quot;3.5&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c6)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;股票薪酬占營收 近四季：12%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;503.0&quot; y=&quot;235.9&quot; class=&quot;val&quot; fill=&quot;var(--c6)&quot;&gt;12%&lt;/text&gt;&lt;polyline points=&quot;139.3,219.1 210.7,240.2 282.0,244.0 353.3,237.6 424.7,211.0&quot; fill=&quot;none&quot; stroke=&quot;var(--neg)&quot; stroke-width=&quot;2.4&quot;/&gt;&lt;circle cx=&quot;139.3&quot; cy=&quot;219.1&quot; r=&quot;3.5&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--neg)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;稀釋股數年增 2021：24%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;210.7&quot; cy=&quot;240.2&quot; r=&quot;3.5&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--neg)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;稀釋股數年增 2022：5%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;282.0&quot; cy=&quot;244.0&quot; r=&quot;3.5&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--neg)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;稀釋股數年增 2023：2%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;353.3&quot; cy=&quot;237.6&quot; r=&quot;3.5&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--neg)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;稀釋股數年增 2024：7%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;424.7&quot; cy=&quot;211.0&quot; r=&quot;3.5&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--neg)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;稀釋股數年增 2025：31%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;431.7&quot; y=&quot;215.0&quot; class=&quot;val&quot; fill=&quot;var(--neg)&quot;&gt;31%&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c6)&quot;&gt;&lt;/i&gt;股票薪酬占營收&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--neg)&quot;&gt;&lt;/i&gt;稀釋股數年增&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/div&gt;&lt;!--/新圖表--&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;白話說&lt;/b&gt;2022 年底到 2026-09-30，股數由 157.7 增到 264.8 百萬，增加約 68%（推導）。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;要留意&lt;/b&gt;股東報酬只能來自每股價值成長，不能靠股利或回購（見改判訊號）。&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;股東回報與市價隱含報酬拆解&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;和公債比：主方法不算現價隱含年報酬；FCFF（公司自由現金流，付給股東與債權人之前的現金）交叉核對下，基準情境成真時現價隱含年報酬約 6.5%，比 10 年期公債 5.12% 高約 1.4 個百分點，低於加權資金成本 9.48%&lt;span class=&quot;src&quot;&gt;（推導，暫存試算未存檔，條件式，非預期報酬）&lt;/span&gt;。&lt;/strong&gt;沒有股利與回購墊底，淨回購殖利率 -0.9%（回購扣股權薪酬；收盤 2026-11-16）。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;wide&quot;&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;股利、回購、股數變化與政策門檻的逐項判讀（算法與完整表見&lt;a href=&quot;#wp-3-4&quot;&gt;計算底稿 3・4&lt;/a&gt;）。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;market&quot;&gt;&lt;div class=&quot;qno&quot;&gt;市場背景&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;看價格之前：大盤與這檔股票現在的市場狀態&lt;/div&gt;&lt;h2&gt;大盤 2 個面向相對歷史偏高；股價近 12 個月落後大盤（-61% 對 +11%）&lt;/h2&gt;&lt;style&gt;.mkt-cards{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:14px 0}.mkt-cards .kpi{padding:10px 12px}.mkt-cards .v{font-size:20px}.mkt-cards .l,.mkt-cards .n{font-size:12px}&lt;/style&gt;&lt;div class=&quot;kpis mkt-cards&quot;&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;l&quot;&gt;大盤｜估值&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;偏高&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;偏高 1／有分位 2 項&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;l&quot;&gt;大盤｜信用&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;中性&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;偏高 0／有分位 3 項&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;l&quot;&gt;大盤｜槓桿&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;偏高&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;偏高 1／有分位 1 項&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;l&quot;&gt;大盤｜情緒&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;中性&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;偏高 0／有分位 2 項&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;l&quot;&gt;大盤｜廣度&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;中性&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;偏高 0／有分位 2 項&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;l&quot;&gt;個股｜近 12 個月報酬&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;-61%&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;同期 S&amp;amp;P 500 +11%（2026-11-16 收盤）&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;l&quot;&gt;個股｜52 週區間位置&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;0%&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;0%＝低 6.04、100%＝高 27.72（推算）&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;l&quot;&gt;個股｜距 200 日均線&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;-60.9%&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;200 日均線 15.43&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;l&quot;&gt;個股｜60 日年化波動&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;64%&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;日報酬標準差年化（收盤）&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;l&quot;&gt;個股｜20 日均成交金額&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;1 億美元&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;自身近 5 年第 72% 百分位&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;l&quot;&gt;個股｜放空比率&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;21.83%&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;回補 6.2 天（2026-10-30 結算）&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;l&quot;&gt;個股｜軋空條件&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;高&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;空單 21.83%、回補 6.2 天（2026-10-30 結算）&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;大盤：5 個面向中相對自身歷史偏高 2 個（估值、槓桿），其餘中性；不合成總分（市場總覽收盤日 2026-11-12）。&lt;/p&gt;&lt;p class=&quot;cap&quot;&gt;個股：近 12 個月 -61%，同期 S&amp;amp;P 500 +11%，股價在 52 週區間 0% 的位置，距 200 日均線 -60.9%，放空比率 21.83%。&lt;/p&gt;&lt;p class=&quot;cap&quot;&gt;空單與交割：軋空條件「高」（空單占流通股 21.83%（≥ 很多門檻）；回補 6.2 天（≥ 偏慢門檻）；空單最新期較前一期減少 0.5%；未在已查的門檻名單上、交割失敗未達異常門檻）。只描述空方部位擁擠與回補難易，不判股價冷熱；資料來源 FINRA、SEC。&lt;/p&gt;&lt;p class=&quot;cap&quot;&gt;只揭露市場狀態，不進研究評等、價格位置與合理價值；不是買賣訊號，非買賣建議。&lt;/p&gt;&lt;!--融資水位--&gt;&lt;p class=&quot;cap&quot;&gt;全市場融資水位（聯準會資金流量表 Z.1 融資推估，每季、落後約兩到三個月，推估）：2026-06-30 季末約 0.74 兆美元，年增 46.6%（1946 年起第 92 百分位），占國內公司股權市值 0.68%（第 8 百分位；長期下降，只顯示）。這是全市場槓桿，不是本股融資（美股沒有個股融資餘額）；只描述，不判冷熱。&lt;/p&gt;&lt;!--/融資水位--&gt;&lt;div class=&quot;grid2 wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;大盤位置：各指標在自身歷史的分位（0～100；紅色＝落在貴或擁擠的一端、藍綠＝落在便宜或冷清的一端、灰色中間；虛線為 20／80 門檻；有些指標分位越低越貴，例如盈餘殖利率減公債；市場總覽收盤日 2026-11-12，市場/市場總覽；只揭露，不合成總分）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 500 502&q t;&lt;/i&gt;合理價值區間&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c7)&quot;&gt;&lt;/i&gt;同業與歷史倍數（交叉核對，不進評等）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;流動性、空單與參考值的資料日期與存檔（算法與完整表見&lt;a href=&quot;#wp-mkt&quot;&gt;計算底稿 市場背景&lt;/a&gt;）。&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;valuation&quot;&gt;&lt;div class=&quot;qno&quot;&gt;問題 05&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;現在的價格合理嗎？&lt;/div&gt;&lt;h2&gt;偏貴：市價約是合理價值中點的兩倍。&lt;/h2&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;價格偏貴：我們估的合理價值 2.56–3.12 美元（中點 2.84 美元），收盤 6.04 美元 高於區間上緣，價格位置 偏貴。&lt;/strong&gt;三情境每股為保守 0.59 美元、基準 2.73 美元、樂觀 5.29 美元。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;基準故事：公司價值主要是三個專案，依成功機率打折後加總。&lt;/strong&gt;Vara Mada 技術報告價值 1,415 百萬美元，基準給 40%；Donald 給 70%；生產中的 Pinyon Plain 依鈾價計入。再加上未估專案的帳面值與淨現金，扣掉十年總部費用&lt;span class=&quot;src&quot;&gt;（作者判斷，推導）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;反方與限制：合理價值約八成來自尚未 FID 的 Vara Mada（UUUU-C12）。&lt;/strong&gt;樂觀情境 5.29 美元 仍低於現價；兩案都算 100% 成功時每股約 6.05，才與現價相當&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;。計算核對：不計流動有價證券中點約 −104%（每股以 0 為下限約 −79%），未估專案帳面填 0 約 −48%（下限 0 時約 −41%）；總部費用照原扣法中點為 3.40，修正後低 16%&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;各方法的每股價值區間（美元）：綠底為合理價值，虛線為買入上限與市價&lt;/p&gt;&lt;svg viewBox=&quot;0 0 680 188&quot; role=&quot;img&quot; aria-label=&quot;估值區間&quot; class=&quot;chart&quot;&gt;&lt;rect x=&quot;338.5&quot; y=&quot;26&quot; width=&quot;44.1&quot; height=&quot;136&quot; class=&quot;fvband&quot;/&gt;&lt;text x=&quot;360.5&quot; y=&quot;158&quot; class=&quot;zonelab&quot; text-anchor=&quot;middle&quot;&gt;合理價值 3–3&lt;/text&gt;&lt;line x1=&quot;249.0&quot; x2=&quot;249.0&quot; y1=&quot;26&quot; y2=&quot;162&quot; class=&quot;buyline&quot;/&gt;&lt;text x=&quot;249.0&quot; y=&quot;18&quo ext x=&quot;318.5&quot; y=&quot;312&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;2025-11&lt;/text&gt;&lt;text x=&quot;584.0&quot; y=&quot;312&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;2026-11&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--ink)&quot;&gt;&lt;/i&gt;收盤價&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c3)&quot;&gt;&lt;/i&gt;200 日均線&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--pos)&quot;&gt;&lt;/i&gt;合理價值區間&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c7)&quot;&gt;&lt;/i&gt;同業與歷史倍數（交叉核對，不進評等）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;scenario-plain&quot;&gt;&lt;h3&gt;合理價值怎麼來：三個情境&lt;/h3&gt;&lt;p&gt;合理價值是三個情境每股價值的加權：中點 2.84 美元，換不同折現率重算後的區間 2.56–3.12 美元；買入上限 1.42 美元是中點再打 50% 安全邊際折扣（股價在此以下才有這個安全邊際）。情境表說明合理價值怎麼組成，不是單一目標價；非買賣建議。&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt&quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;每股價值（美元）&lt;/th&gt;&lt;th&gt;權重&lt;/th&gt;&lt;th&gt;這個情境假設什麼&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;0.59&lt;/td&gt;&lt;td&gt;25%&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;鈾（U3O8） 43.25 美元/磅（2026-09 的美元，實質（FRED PURANUSDM，CPI 平減））&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;2.73&lt;/td&gt;&lt;td&gt;50%&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;鈾（U3O8） 61.40 美元/磅（2026-09 的美元，實質（FRED PURANUSDM，CPI 平減））&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;5.29&lt;/td&gt;&lt;td&gt;25%&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;鈾（U3O8） 72.47 美元/磅（2026-09 的美元，實質（FRED PURANUSDM，CPI 平減））&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;（算法與完整表見&lt;a href=&quot;#wp-5&quot;&gt;計算底稿 5&lt;/a&gt;）&lt;/p&gt;&lt;/div&gt;&lt;p id=&quot;cont-plain&quot;&gt;&lt;b&gt;現價離合理價值多遠：&lt;/b&gt;收盤股價 6.04 美元是合理價值中點 2.84 美元的 2.13 倍。這兩個數字只描述現價與本報告合理價值的距離，不改價格位置與研究評等；現價隱含年報酬是基準情境成真時的條件式推算，不是預期報酬。非買賣建議。&lt;/p&gt;&lt;div class=&quot;block&quot; id=&quot;market-demand&quot;&gt;&lt;h3&gt;市價在要求什麼：成長端與倍數端，對照過去實績與模型假設&lt;/h3&gt;&lt;div class=&quot;grid2 wide&quot;&gt;&lt;figure class=figure&gt;&lt;p class=cap&gt;成長端：市價要成立，未來 5 年營收每年要成長多少（紅點基準折現率、線段高低折現率），對照過去實績與模型基準假設（成長推估底稿 六、成長性四問並列；推導，只描述）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 150&quot; role=&quot;img&quot; aria-label=&quot;市價要求的成長&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;230.0&quot; x2=&quot;230.0&quot; y1=&quot;8&quot; y2=&quot;128&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;230.0&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;0%&lt;/text&gt;&lt;line x1=&quot;316.7&quot; x2=&quot;316.7&quot; y1=&quot;8&quot; y2=&quot;128&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;316.7&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;20%&lt;/text&gt;&lt;line x1=&quot;403.3&quot; x2=&quot;403.3&quot; y1=&quot;8&quot; y2=&quot;128&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;403.3&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;40%&lt;/text&gt;&lt;line x1=&quot;490.0&quot; x2=&quot;490.0&quot; y1=&quot;8&quot; y2=&quot;128&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;490.0&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;60%&lt;/text&gt;&lt;text x=&quot;220&quot; y=&quot;27&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;過去實績（2015–2025 年複合）&lt;/text&gt;&lt;circle cx=&quot;233.1&quot; cy=&quot;22&quot; r=&quot;7&quot; fill=&quot;var(--c3)&quot;&gt;&lt;title&gt;過去實績（2015–2025 年複合）：1%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;245.1&quot; y=&quot;27&quot; class=&quot;val&quot;&gt;1%&lt;/text&gt;&lt;text x=&quot;220&quot; y=&quot;67&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;過去實績（近四季年增）&lt;/text&gt;&lt;circle cx=&quot;441.8&quot; cy=&quot;62&quot; r=&quot;7&quot; fill=&quot;var(--c3)&quot;&gt;&lt;title&gt;過去實績（近四季年增）：49%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;453.8&quot; y=&quot;67&quot; class=&quot;val&quot;&gt;49%&lt;/text&gt;&lt;text x=&quot;220&quot; y=&quot;107&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;市價要求（未來 5 年年增）&lt;/text&gt;&lt;text x=&quot;236&quot; y=&quot;107&quot; class=&quot;note&quot;&gt;未取得&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;p&gt;&lt;b&gt;成長端：&lt;/b&gt;&lt;a class=&quot;term&quot; href=&quot;#g7&quot;&gt;市價反推&lt;/a&gt;成長未取得（例如近四季營業利益為負，反推不出），只看倍數端。&lt;/p&gt;&lt;p class=&quot;cap&quot;&gt;只描述，不進研究評等、不改價格位置與合理價值，不是目標價，非買賣建議。成長性四問細表、三視角反推、長期倍數條件（算法與完整表見&lt;a href=&quot;#wp-5&quot;&gt;計算底稿 5&lt;/a&gt;）。&lt;/p&gt;&lt;div class=&quot;note-box&quot;&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:14px&quot;&gt;市價要求的前提 vs 我們的基準（各自單獨成立，不是同時條件）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;市價要求（推導）&lt;/th&gt;&lt;th&gt;我們的基準&lt;/th&gt;&lt;th&gt;出處&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;專案價值相對技術報告（價格係數）&lt;/td&gt;&lt;td&gt;約 2.30 倍&lt;/td&gt;&lt;td&gt;1.0 倍&lt;/td&gt;&lt;td&gt;估值結果 reverse&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Vara Mada 成功機率&lt;/td&gt;&lt;td&gt;約 100%（兩案都成功時每股約 6.05）&lt;/td&gt;&lt;td&gt;40%&lt;/td&gt;&lt;td&gt;估值輸入 專案開發；10-Q Item 2 ¶71–72&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Donald 成功機率&lt;/td&gt;&lt;td&gt;約 100%&lt;/td&gt;&lt;td&gt;70%&lt;/td&gt;&lt;td&gt;新聞 N4；N5 §11&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;未估 NPV 項目（稀土第二期、Dubbo、VAC）&lt;/td&gt;&lt;td&gt;市場可能另給價值（未揭露）&lt;/td&gt;&lt;td&gt;帳面值；VAC 不納入&lt;/td&gt;&lt;td&gt;10-Q Item 2 ¶39；Item 1 ¶48&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p&gt;市價反推的隱含商品價格係數（相對 SEC 價格）約 2.30（推導）。有資料的列都沒有過熱訊號。&lt;/p&gt;&lt;p class=&quot;cap&quot;&gt;三視角反推、假設對照實績、歷史基準比率與市價溢價來源（算法與完整表見&lt;a href=&quot;#wp-5&quot;&gt;計算底稿 5&lt;/a&gt;）。&lt;/p&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;作者的計算核對、方法限制與口徑說明：「專案價值拆解（基準情境）」（算法與完整表見&lt;a href=&quot;#wp-5&quot;&gt;計算底稿 5&lt;/a&gt;）。&lt;/p&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;白話說&lt;/b&gt;市價每 100 元，我們的合理價值中點約 47 元（推導）。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;要留意&lt;/b&gt;合理價值約八成來自未 FID 的 Vara Mada，機率是作者判斷（見改判訊號）。&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;value&quot;&gt;&lt;div class=&quot;qno&quot;&gt;價值判斷&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;價值判斷：用彼得林奇的方法再看一次&lt;/div&gt;&lt;h2&gt;週期型加專案擴產，現價已反映專案成功。&lt;/h2&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;林區分類&lt;/b&gt;週期型；兼具專案擴產期的快速成長（營收基期小、Vara Mada 與稀土第二期尚未決定最終投資）&lt;br&gt;週期型要問現在處在循環哪一段、成本能否撐過低價期；不能把高價期的盈餘外推。鈾價實質值在近十年 92 百分位（總經景氣位置），屬價格高位&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;研究評等&lt;/b&gt;&lt;span style=&quot;font-size:20px;font-weight:700&quot;&gt;生意品質普通 ／ 價格偏貴（單錨點）&lt;/span&gt;&lt;br&gt;生意品質依五項證據評定；價格位置四級（便宜、偏低、合理、偏貴），依買入上限與合理價值高端判斷，同業與歷史倍數只作交叉核對。非買賣建議。&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;林區分類是週期型：鈾價在十年第 92 百分位（UUUU-C10），週期股在價格高點時本益比最容易誤導；公司目前虧損，本益比與 PEG（本益成長比，本益比除以盈餘成長率）都不適用。&lt;/p&gt;&lt;p&gt;兼具專案擴產的快速成長特徵，但基期小、專案未定案；市價相當於 Vara Mada 與 Donald 都幾乎確定成功（第五題，只揭露，不當評等理由）。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;grid2 wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;現金與證券 vs 有息負債（億美元），上方為淨現金&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 300&quot; role=&quot;img&quot; aria-label=&quot;資產負債&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;266.0&quot; y2=&quot;266.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;270.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;0.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;205.5&quot; y2=&quot;205.5&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;209.5&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;2.5&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;145.0&quot; y2=&quot;145.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;149.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;5.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;84.5&quot; y2=&quot;84.5&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;88.5&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;7.5&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;24.0&quot; y2=&quot;24.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;28.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;10.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;266.0&quot; y2=&quot;266.0&quot; class=&quot;zero&quot;/&gt;&lt;rect x=&quot;88.6&quot; y=&quot;55.0&quot; width=&quot;83.4&quot; height=&quot;211.0&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;現金與證券 FY25：8.7&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;174.0&quot; y=&quot;266.0&quot; width=&quot;83.4&quot; height=&quot;1.0&quot; rx=&quot;2&quot; fill=&quot;var(--c5)&quot;&gt;&lt;title&gt;有息負債 FY25：0.0&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;174.0&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY25&lt;/text&gt;&lt;text x=&quot;174.0&quot; y=&quot;16.0&quot; class=&quot;note&quot; text-anchor=&quot;middle&quot;&gt;淨 8.7&lt;/text&gt;&lt;rect x=&quot;332.6&quot; y=&quot;52.8&quot; width=&quot;83.4&quot; height=&quot;213.2&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;現金與證券 2026-09：8.8&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;418.0&quot; y=&quot;101.2&quot; width=&quot;83.4&quot; height=&quot;164.8&quot; rx=&quot;2&quot; fill=&quot;var(--c5)&quot;&gt;&lt;title&gt;有息負債 2026-09：6.8&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;418.0&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;2026-09&lt;/text&gt;&lt;text x=&quot;418.0&quot; y=&quot;16.0&quot; class=&quot;note&quot; text-anchor=&quot;middle&quot;&gt;淨 2.0&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c1)&quot;&gt;&lt;/i&gt;現金與證券&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c5)&quot;&gt;&lt;/i&gt;有息負債&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;近 6 個月內部人公開市場買賣（百萬美元）；綠色為買進；無任何賣出&lt;/p&gt;&lt;svg viewBox=&quot;0 0 500 102&quot; role=&quot;img&quot; aria-label=&quot;內部人&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;168.0&quot; x2=&quot;168.0&quot; y1=&quot;6&quot; y2=&quot;96&quot; class=&quot;zero&quot;/&gt;&lt;text x=&quot;158&quot; y=&quot;23&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;Bhappu（買進）&lt;/text&gt;&lt;rect x=&quot;168.0&quot; y=&quot;9&quot; width=&quot;249.1&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c1)&quot;/&gt;&lt;text x=&quot;425.1&quot; y=&quot;23&quot; class=&quot;val&quot;&gt;1.0&lt;/text&gt;&lt;text x=&quot;158&quot; y=&quot;63&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;D（買進）&lt;/text&gt;&lt;rect x=&quot;168.0&quot; y=&quot;49&quot; width=&quot;13.1&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c1)&quot;/&gt;&lt;text x=&quot;189.1&quot; y=&quot;63&quot; class=&quot;val&quot;&gt;0.1&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;生意品質：C（規則：無「弱」且至少三項「強」＝A）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;評等&lt;/th&gt;&lt;th&gt;理由&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;護城河&lt;/td&gt;&lt;td&gt;無&lt;/td&gt;&lt;td&gt;護城河雙鑰匙都不過（改善規格 v2 3.7）：鑰匙一近五年 ROIC 不可得（2021–2025 稅前虧損，營業利益 2015 年起每年為負，超額報酬期間檢查）；鑰匙二沒有留存率、轉換成本或第三方申報證明超額報酬可持續（估值輸入.超額報酬期間.鑰匙二）。設施稀缺性仍在：White Mesa 是美國唯一運轉中的傳統鈾礦處理廠並能分離稀土氧化物（10-Q 2026-09-30 Item 2 ¶4、¶27；Anfield Energy 40-F 2026-03-31 列美國僅三座已建成傳統鈾廠），但產品是價格接受者，壁壘尚未轉成報酬（UUUU-C01、UUUU-C02）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;投入資本報酬與增量回報&lt;/td&gt;&lt;td&gt;弱&lt;/td&gt;&lt;td&gt;近四季 ROIC -105.9%、2023–2025 增量 ROIC -147.1%（財務指標）；營業利益自 2015 年起每年為負（長期財務）（UUUU-C02：財務指標、#/增量回報/增量ROIC；擴產未投產，見 UUUU-C08）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;自由現金流品質&lt;/td&gt;&lt;td&gt;弱&lt;/td&gt;&lt;td&gt;營運現金流 2015–2025 每年為負，近四季 -54.7、資本支出另計（財務歷史；10-Q 2026-09-30 Item 2 ¶296）；股權薪酬占營收 12.4%（產業基準對照）（UUUU-C04：融資償債底稿、營運現金流；UUUU-C11：第三季淨損含有價證券未實現損失 35.3，本業看營業虧損）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;資產負債表&lt;/td&gt;&lt;td&gt;中&lt;/td&gt;&lt;td&gt;2026-09-30 現金 76.4＋流動有價證券 779.5（主要為美國國庫券），對可轉債面額 700.0（0.75%、2031-11-01 到期）與流動債務 2.2，淨現金約 153.7（10-Q ¶14、¶94–95、¶140，推導）；但 VAC 併購需現金約 718.0（¶48）、Vara Mada 第一期資本支出 769、稀土第二期約 410（8-K 2026-01-13 §57；10-Q Item 2 ¶39），資金需求大於現有現金（UUUU-C04：10-Q Item 2 ¶287 營運資金 932.25；UUUU-C05：10-Q Item 1 ¶140 到期集中 2031；OSC 7.25 億美元貸款仍為有條件承諾，¶285）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;治理與資本配置&lt;/td&gt;&lt;td&gt;中&lt;/td&gt;&lt;td&gt;股數由 2025 年底 240.4 增至 264.8 百萬（10-Q ¶14），2021 年以來每年增發；連續併購（Base Resources、ASM 已完成，VAC 待完成，¶46–48）以股票支付一部分，資本配置成效尚待投產驗證（UUUU-C06：價值判斷 稀釋股數、10-Q Item 1 ¶19 ATM 增發；UUUU-C07：8-K 2026-10-13 §141 承認談判時已知 VAC 客戶合約爭議、10 月才揭露，律師事務所調查未證實，正式立案才改判；評等維持中但為下緣）&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;PEG 三口徑、林區資產負債表檢查與 F 分數等交叉檢查（算法與完整表見&lt;a href=&quot;#wp-value&quot;&gt;計算底稿 價值判斷&lt;/a&gt;）。&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;capital&quot;&gt;&lt;div class=&quot;qno&quot;&gt;問題 06&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;公司怎麼管錢、管人？&lt;/div&gt;&lt;h2&gt;資產負債表短期穩，但併購與揭露時點扣分。&lt;/h2&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;財務上，有息負債 680.9 百萬美元&lt;span class=&quot;src&quot;&gt;（作者校正：原文 10-Q 2026-09-30；Part I, Item 1 ¶14）&lt;/span&gt; 主要是 2031-11-01 到期的 7 億美元可轉債，2027 年前到期本金很小（UUUU-C05）；現金加國庫券足以撐近期營運，但不夠同時付 VAC 現金價款與專案資本支出（UUUU-C04）。&lt;/p&gt;&lt;p&gt;治理上，VAC 客戶爭議在談判時已知、10 月才揭露（UUUU-C07），律師事務所調查未證實違法；治理評中但屬下緣，正式立案才下修。&lt;/p&gt;&lt;/div&gt;&lt;figure clas
