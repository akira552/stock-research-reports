th{font-size:12px;color:var(--muted);font-weight:700;background:var(--soft);white-space:nowrap}
tr:last-child td{border-bottom:none}td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.chip{display:inline-block;font-size:13px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:2px 10px;margin:2px 4px 2px 0}
.v{font-weight:700;white-space:nowrap}.v-已驗證{color:var(--pos)}.v-部分支持{color:var(--accent)}.v-說法未獲數字支持{color:var(--neg)}.v-待查{color:var(--muted)}
.light{font-weight:700;white-space:nowrap}.l-亮燈{color:var(--neg)}.l-未亮{color:var(--pos)}.l-資料未取得{color:var(--muted)}
.stages{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0}
.stages div{text-align:center;padding:10px 4px;border-radius:8px;background:var(--soft);color:var(--muted);font-size:14px}
.stages div.on{background:var(--biz);color:#fff;font-weight:700}
.callout{background:var(--surface);border-left:4px solid var(--biz);border-radius:8px;padding:12px 16px;margin:12px 0}
.callout b{color:var(--biz)}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0}
.chart svg{width:100%;height:auto;display:block}
.chart .cap{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
details{margin:8px 0}summary{cursor:pointer;color:var(--muted);font-size:14px}
ol.src{font-size:12px;color:var(--muted);padding-left:22px;word-break:break-all}
footer{padding:24px 0 48px;font-size:13px;color:var(--muted)}
@media (max-width:760px){.wrap{padding:0 16px}.hero,.grid2{grid-template-columns:1fr}h1{font-size:26px}.gradebox .g{font-size:44px}}

.vd{font-weight:700;white-space:nowrap}.vd-有屏障證據{color:var(--pos)}.vd-暫時領先{color:var(--warn)}
.lv{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:1px 9px;background:var(--soft);color:var(--biz);margin-right:4px}

:root{--c3:#6f9a86;--c6:#8a6f9a;--lt-亮燈:var(--neg);--lt-未亮:var(--pos);--lt-資料未取得:var(--muted)}
@media (prefers-color-scheme:dark){:root:not([data-theme=&quot;light&quot;]){--c3:#8fb9a5;--c6:#a58cb8}}
:root[data-theme=&quot;dark&quot;]{--c3:#8fb9a5;--c6:#a58cb8}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;margin:12px 0}
.cards.c3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:15px;line-height:1.75}
.card .ch{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 10px;margin-bottom:4px}
.card .ch b{font-size:16px}.qz{font-size:12px;color:var(--muted)}
.lbl{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.05em;margin-top:10px}
.card p.s,.card div.s{margin:2px 0 6px}.fs{display:flex;gap:18px;font-size:14px}.fs .v{font-size:20px}ul.ev{margin:4px 0;padding-left:18px}ul.ev li{margin:3px 0}
.claim{border-left:5px solid var(--pos)}.cv-部分支持{border-left-color:var(--warn)}.cv-說法未獲數字支持{border-left-color:var(--neg)}.cv-待查{border-left-color:var(--muted)}
.sig,.ext{border-left:5px solid var(--tc)}.sv{font-weight:700;font-size:17px}
.stc{font-weight:700;color:var(--tc)}
.sub-h{font-size:14px;font-weight:700;color:var(--biz);margin:18px 0 0}
.warnc{border-left-color:var(--warn)}.warnc b{color:var(--warn)}ul.badl{margin:6px 0 0;padding-left:18px}ul.badl li{margin:2px 0}
.advc .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.advc .num-b{display:inline-flex;width:24px;height:24px;border-radius:50%;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700;background:var(--muted);margin-right:6px}
.advc .num-b.有屏障證據{background:var(--pos)}.advc .num-b.暫時領先{background:var(--warn)}
@media (max-width:760px){.advc .two{grid-template-columns:1fr}.cards{grid-template-columns:1fr}}

.fig{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px 12px;margin:14px 0}
.fig svg{width:100%;height:auto;display:block;font-family:inherit}
.ft{font-weight:700;font-size:15px;margin-bottom:6px}
.fig .cap{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.7}.fig .cap b{color:var(--ink)}
.srcl{font-size:12px}
.sub-t{font-size:13px;font-weight:700;color:var(--muted);margin:8px 0 2px}
svg .gl{stroke:var(--line);stroke-width:1}svg .zl{stroke:var(--muted);stroke-width:1.3}
svg .ax{font-size:11px;fill:var(--muted)}svg .lb{font-size:13px;fill:var(--ink)}svg .vl{font-size:13px;font-weight:700;fill:var(--ink)}
svg .s{font-size:12px}svg .inb{font-size:12px;font-weight:700;fill:#fff}
.lg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin-top:6px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.board{display:grid;gap:10px}.bgn{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:4px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.tile{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);border-left:5px solid var(--tc);background:var(--bg);color:var(--ink);text-decoration:none;font-size:14px;line-height:1.4}
.tile .dot{width:10px;height:10px;border-radius:50%;background:var(--tc)}.tile .tst{margin-left:auto;font-size:12px;font-weight:700;color:var(--tc)}
.nos{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:0 6px}
.emx{display:grid;gap:10px}.emc{border-top:4px solid var(--tc);background:var(--bg);border-radius:8px;padding:8px 10px}
.emh{font-size:13px;font-weight:700;color:var(--tc)}.emh b{font-size:20px;margin-left:4px}
.emi{font-size:13px;padding:4px 0;border-bottom:1px dashed var(--line);line-height:1.45}.emi:last-child{border-bottom:none}.emi span{display:block;color:var(--muted);font-size:12px}
.amx{display:flex;gap:6px;align-items:stretch}.amy{writing-mode:vertical-rl;font-size:12px;color:var(--muted);text-align:center}
.amg{flex:1;display:grid;gap:4px}.amr{display:grid;grid-template-columns:80px repeat(3,1fr);gap:4px}
.aml{font-size:12px;color:var(--muted);display:flex;align-items:center;justify-content:flex-end;padding-right:6px}
.amc{min-height:52px;background:var(--bg);border:1px solid var(--line);border-radius:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;padding:6px}
.amc.unk{border-style:dashed;background:transparent}.amx-l{font-size:12px;color:var(--muted);text-align:center}.amxt{font-size:12px;color:var(--muted);text-align:right}
.ab{display:inline-flex;width:26px;height:26px;border-radius:50%;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;background:var(--muted);margin-right:6px;flex:none}
.ab-有屏障證據{background:var(--pos)}.ab-暫時領先{background:var(--warn)}
ol.akey{list-style:none;padding:0;margin:10px 0 0;font-size:14px}ol.akey li{display:flex;align-items:center;margin:4px 0}
.wg{margin:6px 0 10px}.wgt{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;font-size:14px}.wgt span{font-size:12px;color:var(--muted)}
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;div class=&quot;wrap&quot;&gt;&lt;div class=&quot;top&quot;&gt;&lt;span&gt;&lt;b&gt;Energy Fuels（鈾與稀土）（UUUU）&lt;/b&gt;｜商業評估&lt;/span&gt;&lt;span&gt;資料截止 2026-11-16｜基準季 2026-09-30｜&lt;a href=&quot;報告.html&quot;&gt;估值報告（另頁）&lt;/a&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;hero&quot;&gt;&lt;div&gt;&lt;div class=&quot;eyebrow&quot;&gt;商業評估｜能源礦業／金屬礦&lt;/div&gt;&lt;h1&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;Energy Fuels 目前幾乎只靠賣鈾收錢，低成本礦與美國唯一運轉中的傳統鈾廠讓毛利轉好，但費用與擴產讓營業利益自 2015 年起每年為負；稀土與磁鐵是還沒驗證的第二條腿，且部分靠併購取得。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src2&quot;&gt;[2]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src3&quot;&gt;[3]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src4&quot;&gt;[4]&lt;/a&gt;&lt;/sup&gt;&lt;/h1&gt;&lt;p class=&quot;lead&quot;&gt;本頁只用官方文件、財報與新聞，回答商業模式是否成立、成長點在哪、是否卡住、未來怎麼變、週期多久。&lt;b&gt;不含價格、估值或任何買賣建議&lt;/b&gt;，也不影響估值報告的研究評等。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;gradebox&quot;&gt;&lt;div class=&quot;lab&quot;&gt;商業動能（五級 A–E；原名「商業評估等級」，2026-11-17 改名）&lt;span class=&quot;ruleok&quot;&gt;評分規則第一版，2026-11-07 核定&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;g&quot;&gt;D&lt;small&gt;級&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;加權分 2.6／5｜相對同業：&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;模式或成長有實質問題&lt;/div&gt;&lt;div class=&quot;note&quot;&gt;商業評估等級（A–E 五級）只看商業模式是否成立、成長是否卡住、週期在哪，相對同產業卡同業評比；它不是估值報告研究評等裡的「生意品質 A／B／C」（那是看護城河、投入資本報酬、現金流品質、資產負債表與治理的絕對標準），不進研究評等、不影響估值、不涉任何價格。&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;nav class=&quot;qnav&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;&lt;a href=&quot;#s0&quot;&gt;重點&lt;/a&gt;&lt;a href=&quot;#s1&quot;&gt;1 商業輪廓&lt;/a&gt;&lt;a href=&quot;#s2&quot;&gt;2 說的 vs 做的&lt;/a&gt;&lt;a href=&quot;#s3&quot;&gt;3 成長與卡點&lt;/a&gt;&lt;a href=&quot;#sa&quot;&gt;4 優勢與持續期間&lt;/a&gt;&lt;a href=&quot;#s4&quot;&gt;5 生命週期&lt;/a&gt;&lt;a href=&quot;#s5&quot;&gt;6 週期&lt;/a&gt;&lt;a href=&quot;#s6&quot;&gt;7 觀察清單&lt;/a&gt;&lt;a href=&quot;#sg&quot;&gt;等級明細&lt;/a&gt;&lt;a href=&quot;#src&quot;&gt;出處&lt;/a&gt;&lt;/div&gt;&lt;/nav&gt;&lt;div class=&quot;wrap&quot;&gt;&lt;section id=&quot;s0&quot;&gt;&lt;h2&gt;一眼看重點&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;先看等級怎麼來、這頁的證據有多扎實；細節在下面各節。&lt;/p&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;等級怎麼來：五個面向&lt;/figcaption&gt;&lt;svg viewBox=&quot;0 0 640 260&quot; role=&quot;img&quot; aria-label=&quot;商業評估等級五面向：作者分與機械建議分&quot;&gt;&lt;line x1=&quot;150.0&quot; x2=&quot;150.0&quot; y1=&quot;20&quot; y2=&quot;232&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;150.0&quot; y=&quot;250&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;1 分&lt;/text&gt;&lt;line x1=&quot;255.0&quot; x2=&quot;255.0&quot; y1=&quot;20&quot; y2=&quot;232&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;255.0&quot; y=&quot;250&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;2 分&lt;/text&gt;&lt;line x1=&quot;360.0&quot; x2=&quot;360.0&quot; y1=&quot;20&quot; y2=&quot;232&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;360.0&quot; y=&quot;250&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;3 分&lt;/text&gt;&lt;line x1=&quot;465.0&quot; x2=&quot;465.0&quot; y1=&quot;20&quot; y2=&quot;232&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;465.0&quot; y=&quot;250&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;4 分&lt;/text&gt;&lt;line x1=&quot;570.0&quot; x2=&quot;570.0&quot; y1=&quot;20&quot; y2=&quot;232&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;570.0&quot; y=&quot;250&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;5 分&lt;/text&gt;&lt;text x=&quot;140&quot; y=&quot;55.0&quot; class=&quot;lb&quot; text-anchor=&quot;end&quot;&gt;模式穩固度&lt;tspan class=&quot;ax&quot;&gt; 25%&lt;/tspan&gt;&lt;/text&gt;&lt;rect x=&quot;150.0&quot; y=&quot;43.0&quot; width=&quot;105.0&quot; height= ; y=&quot;203.0&quot; width=&quot;210.0&quot; height=&quot;14&quot; rx=&quot;3&quot; fill=&quot;var(--biz)&quot; opacity=&quot;.85&quot;/&gt;&lt;path d=&quot;M465.0,198.0 l6,-8 h-12z&quot; fill=&quot;var(--accent)&quot;&gt;&lt;title&gt;機械建議 4&lt;/title&gt;&lt;/path&gt;&lt;text x=&quot;368.0&quot; y=&quot;215.0&quot; class=&quot;vl&quot;&gt;3&lt;tspan class=&quot;ax&quot;&gt;（機械 4）&lt;/tspan&gt;&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;lg&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--biz)&quot;&gt;&lt;/i&gt;作者分&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--accent)&quot;&gt;&lt;/i&gt;機械建議分&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;藍條是作者分（1–5），橘色三角是工具的機械建議分；兩者不同的面向在等級明細寫了偏離理由。加權分 2.6 → D 級（A ≥ 4.2、B ≥ 3.5、C ≥ 2.8、D ≥ 2.1）。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估、權重、機械建議）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;這頁的句子有多少是事實&lt;/figcaption&gt;&lt;svg viewBox=&quot;0 0 640 58&quot; role=&quot;img&quot; aria-label=&quot;句子標記組成&quot;&gt;&lt;rect x=&quot;4.0&quot; y=&quot;6&quot; width=&quot;336.3&quot; height=&quot;26&quot; fill=&quot;var(--biz)&quot;&gt;&lt;title&gt;事實 58&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;172.1&quot; y=&quot;24&quot; class=&quot;inb&quot; text-anchor=&quot;middle&quot;&gt;事實 58&lt;/text&gt;&lt;rect x=&quot;340.3&quot; y=&quot;6&quot; width=&quot;214.5&quot; height=&quot;26&quot; fill=&quot;var(--accent)&quot;&gt;&lt;title&gt;推論 37&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;447.6&quot; y=&quot;24&quot; class=&quot;inb&quot; text-anchor=&quot;middle&quot;&gt;推論 37&lt;/text&gt;&lt;rect x=&quot;554.8&quot; y=&quot;6&quot; width=&quot;46.4&quot; height=&quot;26&quot; fill=&quot;var(--c6)&quot;&gt;&lt;title&gt;作者判斷 8&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;601.2&quot; y=&quot;6&quot; width=&quot;34.8&quot; height=&quot;26&quot; fill=&quot;var(--neg)&quot;&gt;&lt;title&gt;待查 6&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;4&quot; y=&quot;52&quot; class=&quot;ax&quot;&gt;合計 109&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;lg&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--biz)&quot;&gt;&lt;/i&gt;事實 58&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--accent)&quot;&gt;&lt;/i&gt;推論 37&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c6)&quot;&gt;&lt;/i&gt;作者判斷 8&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--neg)&quot;&gt;&lt;/i&gt;待查 6&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;全頁句子依標記分類：事實（原文或財報直接寫的）占 53%；推論與作者判斷是從事實推出或取捨的結論，待查是找不到證據的地方。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/section&gt;&lt;section id=&quot;s1&quot;&gt;&lt;h2&gt;1　商業輪廓：賣什麼、賣給誰、怎麼收錢&lt;/h2&gt;&lt;div&gt;&lt;span class=&quot;chip&quot;&gt;一次性商品銷售（鈾精礦依長約或現貨交貨，交貨後開票）&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;加工收費（替代原料加工及其他，金額小）&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cards c3&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;賣什麼&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;公司有三個報告分部：鈾、稀土、重礦砂。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src5&quot;&gt;[5]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;2026 年第三季營收 29.18 百萬美元，其中鈾 28.45、稀土金屬與合金 0.44、替代原料加工及其他 0.30，重礦砂沒有營收。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;2026 年 8 月 28 日完成併購 ASM 後，公司在南韓金屬廠生產釹鐠、鏑、鋱金屬與釹鐵硼合金，並另有一件併購磁材廠 VAC 的協議尚待完成。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src4&quot;&gt;[4]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src6&quot;&gt;[6]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;賣給誰&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;鈾大多賣給大型核電公司，公司認為這些客戶規模大、倒帳風險相對低。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src7&quot;&gt;[7]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;2025 年前三大客戶各買 17.16、15.37、7.70 百萬美元，合計約占全年營收 65.92 百萬的 61%（推算），客戶名稱未揭露。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src8&quot;&gt;[8]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src9&quot;&gt;[9]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;怎麼收錢&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;鈾合約在履約義務完成後才開票，付款屆時為無條件，所以鈾合約沒有合約資產或合約負債。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src10&quot;&gt;[10]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;2026 年前九個月以長約賣 84 萬磅、加權均價每磅 74.19 美元，現貨賣 30 萬磅、均價每磅 89.33 美元。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src11&quot;&gt;[11]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src12&quot;&gt;[12]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;營收從哪裡來（2025-12-31 (FY)）&lt;/figcaption&gt;&lt;div class=&quot;sub-t&quot;&gt;依地區（StatementGeographical）&lt;/div&gt;&lt;svg viewBox=&quot;0 0 640 450&quot; role=&quot;img&quot; aria-label=&quot;橫條&quot;&gt;&lt;text x=&quot;252&quot; y=&quot;20&quot; class=&quot;lb s&quot; text-anchor=&quot;end&quot;&gt;United States - Uranium concentrates&lt;title&gt;United States - Uranium concentrates&lt;/title&gt;&lt;/text&gt;&lt;rect x=&quot;260&quot; y=&quot;9&quot; width=&quot;230.0&quot; height=&quot;15&quot; rx=&quot;2&quot; fill=&quot;var(--biz)&quot; opacity=&quot;.8&quot;/&gt;&lt;text x=&quot;496.0&quot; y=&quot;21&quot; class=&quot;vl s&quot;&gt;50.7%&lt;tspan class=&quot;ax&quot;&gt; 年增 37.4%&lt;/tspan&gt;&lt;/text&gt;&lt;text x=&quot;252&quot; y=&quot;46&quot; class=&quot;lb s&quot; text-anchor=&quot;end&quot;&gt;CANADA - Uranium concentrates&lt;title&gt;CANADA - Uranium concentrates&lt;/title&gt;&lt;/text&gt;&lt;rect x=&quot;260&quot; y=&quot;35&quot; width=&quot;105.7&quot; height=&quot;15&quot; rx=&quot;2&quot; fill=&quot;var(--biz)&quot; opacity=&quot;.8&quot;/&gt;&lt;te t;span class=&quot;num&quot;&gt;98.5%&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;num&quot;&gt;62.3%&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;ConsolidationItems&lt;/td&gt;&lt;td&gt;Operating Segments - Rare Earth Elements Segment&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;num&quot;&gt;0.0 億美元&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;num&quot;&gt;1.5%&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;num&quot;&gt;—&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;ConsolidationItems&lt;/td&gt;&lt;td&gt;Operating Segments - Heavy Mineral Sands Segment&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;num&quot;&gt;0.0 億美元&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;num&quot;&gt;0.0%&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;num&quot;&gt;—&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;ConsolidationItems&lt;/td&gt;&lt;td&gt;Segment Reporting, Reconciling Item, Corporate Nonsegment&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;num&quot;&gt;0.0 億美元&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;num&quot;&gt;0.0%&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;num&quot;&gt;—&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;lead&quot;&gt;來源：財報/10-Q_2026-09-30_損益表（XBRL 維度列；同一軸可能有上下層，不可重複加總）&lt;/p&gt;&lt;/details&gt;&lt;div class=&quot;callout&quot;&gt;&lt;b&gt;解讀&lt;/b&gt;&lt;p class=&quot;s&quot;&gt;2026 年第三季分部營收：鈾 28.74 百萬、占 98.5%，稀土 0.44 百萬、占 1.5%，重礦砂為零；2025 全年鈾占 76%、重礦砂占 24%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src13&quot;&gt;[13]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src14&quot;&gt;[14]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;重礦砂在 2025 年後沒有銷售，營收組成從兩條腿縮成幾乎只剩鈾；地區軸與分部軸是同一筆營收的兩種切法，不可相加。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src14&quot;&gt;[14]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src15&quot;&gt;[15]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;稀土與磁鐵目前營收很小，近期營收與毛利幾乎完全看鈾的出貨量與鈾價。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;費用率：本期對去年同期（2026-09-30 (Q3)）&lt;/figcaption&gt;&lt;svg viewBox=&quot;0 0 640 152&quot; role=&quot;img&quot; aria-label=&quot;費用率本期與去年同期&quot;&gt;&lt;line x1=&quot;110.0&quot; x2=&quot;110.0&quot; y1=&quot;16&quot; y2=&quot;128&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;110.0&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;0%&lt;/text&gt;&lt;line x1=&quot;192.0&quot; x2=&quot;192.0&quot; y1=&quot;16&quot; y2=&quot;128&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;192.0&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;20%&lt;/text&gt;&lt;line x1=&quot;274.0&quot; x2=&quot;274.0&quot; y1=&quot;16&quot; y2=&quot;128&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;274.0&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;40%&lt;/text&gt;&lt;line x1=&quot;356.0&quot; x2=&quot;356.0&quot; y1=&quot;16&quot; y2=&quot;128&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;356.0&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;60%&lt;/text&gt;&lt;line x1=&quot;438.0&quot; x2=&quot;438.0&quot; y1=&quot;16&quot; y2=&quot;128&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;438.0&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;80%&lt;/text&gt;&lt;line x1=&quot;520.0&quot; x2=&quot;520.0&quot; y1=&quot;16&quot; y2=&quot;128&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;520.0&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;100%&lt;/text&gt;&lt;text x=&quot;102&quot; y=&quot;40.0&quot; class=&quot;lb s&quot; text-anchor=&quot;end&quot;&gt;毛利率&lt;/text&gt;&lt;line x1=&quot;224.0&quot; x2=&quot;361.2&quot; y1=&quot;35.0&quot; y2=&quot;35.0&quot; stroke=&quot;var(--biz)&quot; stroke-width=&quot;3&quot; opacity=&quot;.5&quot;/&gt;&lt;circle cx=&quot;224.0&quot; cy=&quot;35.0&quot; r=&quot;5&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;去年同期 27.8%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;361.2&quot; cy=&quot;35.0&quot; r=&quot;5.5&quot; fill=&quot;var(--biz)&quot;&gt;&lt;title&gt;本期 61.3%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;371.2&quot; y=&quot;40.0&quot; class=&quot;vl s&quot;&gt;61.3%&lt;tspan class=&quot;ax&quot;&gt; +33.5 點&lt;/tspan&gt;&lt;/text&gt;&lt;text x=&quot;102&quot; y=&quot;74.0&quot; class=&quot;lb s&quot; text-anchor=&quot;end&quot;&gt;業務費用率&lt;/text&gt;&lt;line x1=&quot;472.9&quot; x2=&quot;367.7&quot; y1=&quot;69.0&quot; y2=&quot;69.0&quot; stroke=&quot;var(--biz)&quot; stroke-width=&quot;3&quot; opacity=&quot;.5&quot;/&gt;&lt;circle cx=&quot;472.9&quot; cy=&quot;69.0&quot; r=&quot;5&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;去年同期 88.5%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;367.7&quot; cy=&quot;69.0&quot; r=&quot;5.5&quot; fill=&quot;var(--biz)&quot;&gt;&lt;title&gt;本期 62.8%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;482.9&quot; y=&quot;74.0&quot; class=&quot;vl s&quot;&gt;62.8%&lt;tspan class=&quot;ax&quot;&gt; -25.7 點&lt;/tspan&gt;&lt;/text&gt;&lt;text x=&quot;102&quot; y=&quot;108.0&quot; class=&quot;lb s&quot; text-anchor=&quot;end&quot;&gt;銷管費用率&lt;/text&gt;&lt;line x1=&quot;472.9&quot; x2=&quot;367.7&quot; y1=&quot;103.0&quot; y2=&quot;103.0&quot; stroke=&quot;var(--biz)&quot; stroke-width=&quot;3&quot; opacity=&quot;.5&quot;/&gt;&lt;circle cx=&quot;472.9&quot; cy=&quot;103.0&quot; r=&quot;5&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;去年同期 88.5%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;367.7&quot; cy=&quot;103.0&quot; r=&quot;5.5&quot; fill=&quot;var(--biz)&quot;&gt;&lt;title&gt;本期 62.8%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;482.9&quot; y=&quot;108.0&quot; class=&quot;vl s&quot;&gt;62.8%&lt;tspan class=&quot;ax&quot;&gt; -25.7 點&lt;/tspan&gt;&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;lg&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--biz)&quot;&gt;&lt;/i&gt;本期&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--muted)&quot;&gt;&lt;/i&gt;去年同期&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--neg)&quot;&gt;&lt;/i&gt;變差超過 1 點&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;空心點是去年同期、實心點是本期，右側是變化（百分點）；費用率升或毛利率降超過 1 點標紅。分母是含全部收入的營收。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估底稿）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/section&gt;&lt;section id=&quot;s2&quot;&gt;&lt;h2&gt;2　商業模式驗證：說的 vs 做的&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;管理層在 10-K、10-Q、8-K 的說法，對照財報數字。判定：已驗證／部分支持／說法未獲數字支持／待查。&lt;/p&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;說的 vs 做的：判定分布&lt;/figcaption&gt;&lt;svg viewBox=&quot;0 0 640 58&quot; role=&quot;img&quot; aria-label=&quot;說的vs做的判定&quot;&gt;&lt;rect x=&quot;4.0&quot; y=&quot;6&quot; width=&quot;316.0&quot; height=&quot;26&quot; fill=&quot;var(--pos)&quot;&gt;&lt;title&gt;已驗證 2&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;162.0&quot; y=&quot;24&quot; class=&quot;inb&quot; text-anchor=&quot;middle&quot;&gt;已驗證 2&lt;/text&gt;&lt;rect x=&quot;320.0&quot; y=&quot;6&quot; width=&quot;316.0&quot; height=&quot;26&quot; fill=&quot;var(--warn)&quot;&gt;&lt;title&gt;部分支持 2&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;478.0&quot; y=&quot;24&quot; class=&quot;inb&quot; text-anchor=&quot;middle&quot;&gt;部分支持 2&lt;/text&gt;&lt;text x=&quot;4&quot; y=&quot;52&quot; class=&quot;ax&quot;&gt;合計 4&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;lg&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--pos)&quot;&gt;&lt;/i&gt;已驗證 2&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--warn)&quot;&gt;&lt;/i&gt;部分支持 2&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;管理層 4 條說法對照財報數字的結果；2 條不是「已驗證」，下方用色框標出（有問題的證據）。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;div class=&quot;callout warnc&quot;&gt;&lt;b&gt;有問題的證據（判定不是「已驗證」）&lt;/b&gt;&lt;ul class=&quot;badl&quot;&gt;&lt;li&gt;&lt;a href=&quot;#cl3&quot;&gt;2026 年鈾銷量指引&lt;/a&gt; &lt;span class=&quot;v v-部分支持&quot;&gt;部分支持&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a href=&quot;#cl4&quot;&gt;稀土商業化&lt;/a&gt; &lt;span class=&quot;v v-部分支持&quot;&gt;部分支持&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;div class=&quot;cards&quot;&gt;&lt;div class=&quot;card claim cv-已驗證&quot; id=&quot;cl1&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;鈾開採與加工成本&lt;/b&gt;&lt;span class=&quot;v v-已驗證&quot;&gt;已驗證&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;管理層說法&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;10-K 給出 Pinyon Plain 這一輪加工的總加權成本指引約每磅 23 到 30 美元，屬全球開採鈾最低成本之列。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src16&quot;&gt;[16]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對照數字&lt;/div&gt;&lt;ul class=&quot;ev&quot;&gt;&lt;li class=&quot;s&quot;&gt;10-Q 揭露這輪加工實際採運約每磅 14 美元、加工約 9 美元，總加權成本約每磅 23 美元，落在指引區間低端。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src17&quot;&gt;[17]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;li class=&quot;s&quot;&gt;成品鈾庫存加權成本由 2025 年底約每磅 43 美元降到 2026-09-30 約 34 美元。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src18&quot;&gt;[18]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src19&quot;&gt;[19]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;lbl&quot;&gt;說明&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;實際成本落在說法區間內，且已反映到庫存成本；但「全球最低之列」是公司自評，沒有同業數字可對照。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src17&quot;&gt;[17]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src19&quot;&gt;[19]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card claim cv-已驗證&quot; id=&quot;cl2&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;2026 年鈾加工量&lt;/b&gt;&lt;span class=&quot;v v-已驗證&quot;&gt;已驗證&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;管理層說法&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;10-K 說 2026 年預計加工 150 萬到 250 萬磅成品鈾。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src16&quot;&gt;[16]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對照數字&lt;/div&gt;&lt;ul class=&quot;ev&quot;&gt;&lt;li class=&quot;s&quot;&gt;這輪加工共產出約 240 萬磅成品鈾，其中約 170 萬磅在 2026 年加工包裝，加工在第二季結束。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src17&quot;&gt;[17]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;lbl&quot;&gt;說明&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;2026 年已加工量 170 萬磅落在指引區間內；下一輪加工要等礦石庫存足夠，預計 2026 年第四季開始。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src17&quot;&gt;[17]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src20&quot;&gt;[20]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card claim cv-部分支持&quot; id=&quot;cl3&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;2026 年鈾銷量指引&lt;/b&gt;&lt;span class=&quot;v v-部分支持&quot;&gt;部分支持&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;管理層說法&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;公司 2026 年鈾銷量指引為 150 萬到 200 萬磅，其中一部分視行情做現貨銷售。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src21&quot;&gt;[21]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src22&quot;&gt;[22]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對照數字&lt;/div&gt;&lt;ul class=&quot;ev&quot;&gt;&lt;li class=&quot;s&quot;&gt;前九個月共賣 114 萬磅（長約 84 萬＋現貨 30 萬，推算），第四季要再賣 36 萬到 86 萬磅才落在指引內（推算）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src11&quot;&gt;[11]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src12&quot;&gt;[12]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src21&quot;&gt;[21]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;li class=&quot;s&quot;&gt;長約最低未來營收表中，2026 年剩餘期間為零，2027 年為 48.39 百萬美元。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src23&quot;&gt;[23]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;lbl&quot;&gt;說明&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;前九個月進度約達指引下緣的 76%（推算）；第四季長約已無最低交貨額，達標要靠現貨或其他交貨，要等 10-K 才能判定。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src23&quot;&gt;[23]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src21&quot;&gt;[21]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card claim cv-部分支持&quot; id=&quot;cl4&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;稀土商業化&lt;/b&gt;&lt;span class=&quot;v v-部分支持&quot;&gt;部分支持&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;管理層說法&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;公司把分離釹鐠的商業生產、鋱與鏑的試產與未來商業生產視為稀土業務的核心，並說第一期迴路每年可回收約 850 到 1,000 噸釹鐠氧化物、第二期預計 2029 年中完成。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src24&quot;&gt;[24]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src25&quot;&gt;[25]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src26&quot;&gt;[26]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對照數字&lt;/div&gt;&lt;ul class=&quot;ev&quot;&gt;&lt;li class=&quot;s&quot;&gt;2026 年第三季稀土分部營收只有 0.44 百萬美元、對應成本 0.41 百萬。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;li class=&quot;s&quot;&gt;第二期完成要以取得執照、融資、足夠原料與正面的最終投資決定為前提。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src26&quot;&gt;[26]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;lbl&quot;&gt;說明&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;已有稀土營收，證明能做出產品，但規模離第一期產能很遠，第二期還沒有最終投資決定，商業化程度尚未被數字支持。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src26&quot;&gt;[26]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;s3&quot;&gt;&lt;h2&gt;3　成長引擎與卡點&lt;/h2&gt;&lt;h3&gt;成長從哪裡來（量、價、新產品、新市場、併購）&lt;/h3&gt;&lt;div class=&quot;cards&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;span class=&quot;chip&quot;&gt;量&lt;/span&gt;&lt;span class=&quot;qz&quot;&gt;能否量化：可量化&lt;/span&gt;&lt;/div&gt;&lt;b&gt;鈾銷量增加&lt;/b&gt;&lt;div class=&quot;lbl&quot;&gt;證據&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;2026 年前九個月營收 90.13 百萬，比去年同期增加 51.31 百萬，公司說主因是鈾銷量增加與出貨時點，部分被重礦砂沒有銷售抵銷。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src15&quot;&gt;[15]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;前九個月鈾銷量 114 萬磅，去年同期 29 萬磅（長約 14 萬＋現貨 15 萬，推算）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src11&quot;&gt;[11]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src12&quot;&gt;[12]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;Whirlwind 與 Nichols Ranch 在「開工」決定後一年內可投產，最快 2027 年起每年可多約 60 萬磅。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src27&quot;&gt;[27]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;span class=&quot;chip&quot;&gt;價&lt;/span&gt;&lt;span class=&quot;qz&quot;&gt;能否量化：可量化&lt;/span&gt;&lt;/div&gt;&lt;b&gt;鈾實現單價上升&lt;/b&gt;&lt;div class=&quot;lbl&quot;&gt;證據&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;第三季長約加權售價每磅 88.79 美元，去年同季 69.43 美元；現貨售價 89.50 美元，去年同季 76.50 美元。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src28&quot;&gt;[28]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src29&quot;&gt;[29]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;公司是鈾價的接受者，單價上升來自市場而非定價權；鈾的實質價格在近十年分布約第 92 百分位，價這條引擎往上的空間比往下的小。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src30&quot;&gt;[30]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src31&quot;&gt;[31]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;span class=&quot;chip&quot;&gt;新產品&lt;/span&gt;&lt;span class=&quot;qz&quot;&gt;能否量化：部分可量化&lt;/span&gt;&lt;/div&gt;&lt;b&gt;稀土氧化物、金屬與合金&lt;/b&gt;&lt;div class=&quot;lbl&quot;&gt;證據&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;第二期迴路投產後，釹鐠氧化物產能預計由約 850–1,000 噸／年增到 6,000 噸／年以上，另有約 87 噸鋱與 362 噸鏑氧化物。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src25&quot;&gt;[25]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;目前稀土季營收 0.44 百萬美元，第二期要等最終投資決定，這條引擎在 2029 年前難以成為主要營收（作者判斷）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src26&quot;&gt;[26]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;span class=&quot;chip&quot;&gt;併購&lt;/span&gt;&lt;span class=&quot;qz&quot;&gt;能否量化：待查&lt;/span&gt;&lt;/div&gt;&lt;b&gt;ASM（金屬與合金）與 VAC（磁材）併購&lt;/b&gt;&lt;div class=&quot;lbl&quot;&gt;證據&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;ASM 於 2026 年 8 月 28 日完成併購，帶進南韓金屬廠；VAC 是全球磁材與永久磁鐵製造商，併購協議 2026 年 6 月 23 日簽訂、10 月 13 日修訂，尚未完成。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src4&quot;&gt;[4]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src6&quot;&gt;[6]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src32&quot;&gt;[32]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;這兩筆帶來的營收來自併購，不是內生成長；VAC 若完成，合併後營收組成會大幅轉向磁材，鈾的占比與本頁的週期判讀都要重寫。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src32&quot;&gt;[32]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;近 12 季 -未亮&quot;&gt;未亮&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;成長是不是一季比一季慢？&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;值&lt;/div&gt;&lt;div class=&quot;sv&quot;&gt;否&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;機械值，期末 2026-09-30；門檻  &lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;判讀&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;近四季單季營收年增依序 −32.1%、112.1%、496.1%、64.8%，沒有連續放緩；但單季數字隨出貨時點大幅跳動，這個訊號對本公司辨識力低。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src33&quot;&gt;[33]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src15&quot;&gt;[15]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card sig&quot; id=&quot;sig-G2&quot; style=&quot;--tc:var(--lt-未亮, var(--muted))&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;G2　營業利益率走弱&lt;/b&gt;&lt;span class=&quot;light l-未亮&quot;&gt;未亮&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;規模變大，利潤率有沒有跟著變好？&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;值&lt;/div&gt;&lt;div class=&quot;sv&quot;&gt;+55.7 個百分點&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;機械值，期末 2026-09-30；門檻 &amp;lt; -1.0 個百分點&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;判讀&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;近四季營業利益率 −81.0%，比一年前改善約 55.7 個百分點，未亮燈；改善來自低成本礦與售價，絕對水準仍深度虧損。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src34&quot;&gt;[34]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src35&quot;&gt;[35]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src17&quot;&gt;[17]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card sig&quot; id=&quot;sig-G3&quot; style=&quot;--tc:var(--lt-亮燈, var(--muted))&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;G3　收款變慢&lt;/b&gt;&lt;span class=&quot;light l-亮燈&quot;&gt;亮燈&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;營收成長是不是靠放寬收款條件？&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;值&lt;/div&gt;&lt;div class=&quot;sv&quot;&gt;+73.9 個百分點&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;機械值，期末 2026-09-30；門檻 &amp;gt; +10.0 個百分點&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;判讀&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;應收帳款 26.87 百萬、一年增 122.8%，比近四季營收年增多 73.9 個百分點而亮燈。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src36&quot;&gt;[36]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src37&quot;&gt;[37]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;其中 ASM 併購帶進應收 2.22 百萬，屬口徑因素；扣掉後應收年增仍約 104%（推算），所以不以口徑排除。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src38&quot;&gt;[38]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src36&quot;&gt;[36]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;鈾合約交貨後開票、客戶多為大型核電公司，較可能是季末集中交貨而非放寬收款，但沒有逐客戶帳齡揭露，仍計分。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src10&quot;&gt;[10]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src7&quot;&gt;[7]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card sig&quot; id=&quot;sig-G4&quot; style=&quot;--tc:var(--lt-資料未取得, var(--muted))&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;G4　投入換不到成長&lt;/b&gt;&lt;span class=&quot;light l-資料未取得&quot;&gt;資料未取得&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;資本支出加大，營收增速有沒有跟上？&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;值&lt;/div&gt;&lt;div class=&quot;sv&quot;&gt;—&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;機械值，期末 ；門檻 &amp;gt; +1.0 個百分點；且 營收近四季年增低於一年前&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;判讀&lt;/div&gt;&lt;div&gt;季資本支出或營收不足 8 季&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;季資本支出不足 8 季，機械值未取得；年資料顯示資本支出 2023 年 15.44 百萬、2024 年 22.17 百萬、2025 年 19.26 百萬。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src39&quot;&gt;[39]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src40&quot;&gt;[40]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card sig&quot; id=&quot;sig-E3&quot; style=&quot;--tc:var(--lt-資料未取得, var(--muted))&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;E3　資本支出加大而產量沒跟上&lt;/b&gt;&lt;span class=&quot;light l-資料未取得&quot;&gt;資料未取得&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;投資有沒有換到產量？&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;值&lt;/div&gt;&lt;div class=&quot;sv&quot;&gt;—&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;機械值，期末 ；門檻 &amp;gt; +3.0 個百分點；且 營收近四季年增低於一年前&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;判讀&lt;/div&gt;&lt;div&gt;季資本支出或營收不足 8 季&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;季資本支出不足 8 季，機械值未取得；2025 年營收下降而資本支出仍有 19.26 百萬，投入尚未換到持續的營收成長，但年資料不足以下結論。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src39&quot;&gt;[39]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src40&quot;&gt;[40]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src9&quot;&gt;[9]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub-h&quot;&gt;作者訊號（財報數字看不出，作者讀原文判斷）&lt;/div&gt;&lt;div class=&quot;cards&quot;&gt;&lt;div class=&quot;card sig&quot; id=&quot;sig-E1&quot; style=&quot;--tc:var(--lt-未亮, var(--muted))&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;E1　產量下降&lt;/b&gt;&lt;span class=&quot;light l-未亮&quot;&gt;未亮&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;產量還在增加嗎？&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;值&lt;/div&gt;&lt;div class=&quot;sv&quot;&gt;2026 年已加工約 170 萬磅成品鈾，2025 全年 101.5 萬磅（年增約 67%，推算）&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;作者從原文填&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;判讀&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;2025 年工廠產出 1,015,000 磅成品鈾；2026 年這輪加工中約 170 萬磅在 2026 年加工包裝。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src41&quot;&gt;[41]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src17&quot;&gt;[17]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;第三季為計畫維修、沒有加工，下一輪要等礦石庫存足夠，預計 2026 年第四季開始；產量是批次型，不是連續型。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src20&quot;&gt;[20]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card sig&quot; id=&quot;sig-E2&quot; style=&quot;--tc:var(--lt-未亮, var(--muted))&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;E2　單位成本上升&lt;/b&gt;&lt;span class=&quot;light l-未亮&quot;&gt;未亮&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;每單位開採成本變高了嗎？&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;值&lt;/div&gt;&lt;div class=&quot;sv&quot;&gt;成品鈾庫存加權成本每磅約 34 美元（2025 年底約 43 美元）&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;作者從原文填&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;判讀&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;成品鈾庫存加權成本由 2025 年底每磅約 43 美元降到 2026-09-30 約 34 美元，單位成本下降。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src18&quot;&gt;[18]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src19&quot;&gt;[19]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;下降主要來自高品位的 Pinyon Plain 礦；該礦 2025 年底證實加概略儲量約 257 萬磅鈾，礦石換成較低品位來源後單位成本可能回升。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src42&quot;&gt;[42]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src17&quot;&gt;[17]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;h3 id=&quot;ext&quot;&gt;外部驗證：競爭者、客戶、供應商怎麼描述這家公司&lt;/h3&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;外部驗證：誰支持、誰反駁&lt;/figcaption&gt;&lt;div class=&quot;emx&quot; style=&quot;grid-template-columns:repeat(3,1fr)&quot;&gt;&lt;div class=&quot;emc&quot; style=&quot;--tc:var(--pos)&quot;&gt;&lt;div class=&quot;emh&quot;&gt;支持 &lt;b&gt;3&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;emi&quot;&gt;&lt;b&gt;Anfield Energy&lt;/b&gt;&lt;span&gt;競爭者&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;emi&quot;&gt;&lt;b&gt;IsoEnergy&lt;/b&gt;&lt;span&gt;客戶&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;emi&quot;&gt;&lt;b&gt;IperionX&lt;/b&gt;&lt;span&gt;供應商&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;emc&quot; style=&quot;--tc:var(--warn)&quot;&gt;&lt;div class=&quot;emh&quot;&gt;部分支持 &lt;b&gt;0&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;emc&quot; style=&quot;--tc:var(--neg)&quot;&gt;&lt;div class=&quot;emh&quot;&gt;反駁 &lt;b&gt;0&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;3 個外部來源（競爭者、客戶、供應商、夥伴的申報或報導）怎麼描述本公司：支持 3、部分支持 0、反駁 0。依「對本公司說法」欄的開頭分類。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估、關係、支持）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;div class=&quot;cards&quot;&gt;&lt;div class=&quot;card ext&quot; style=&quot;--tc:var(--pos)&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;Anfield Energy&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;競爭者&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;對方文件怎麼說&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;Anfield 40-F 寫美國只有三座已取得執照、許可並建成的傳統鈾廠：Anfield 自己的 Shootaring Canyon、Rio Tinto 與 Uranium Energy 的 Sweetwater，以及本公司的 White Mesa。對本公司說法：支持，公司 10-K 原文寫的是 White Mesa 是美國唯一「運轉中」的傳統鈾廠，Anfield 只說已建成的有三座、沒說另兩座在運轉，兩者一致，也佐證加工設施稀缺。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src43&quot;&gt;[43]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src2&quot;&gt;[2]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對本公司說法&lt;/div&gt;&lt;div class=&quot;stc&quot;&gt;支持&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card ext&quot; style=&quot;--tc:var(--pos)&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;IsoEnergy&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;客戶&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;對方文件怎麼說&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;IsoEnergy 40-F 寫其試採礦石會運到 Energy Fuels 營運的 White Mesa 工廠加工。對本公司說法：支持，同業的礦要靠 White Mesa 才能加工，與公司說工廠可處理第三方原料一致。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src44&quot;&gt;[44]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對本公司說法&lt;/div&gt;&lt;div class=&quot;stc&quot;&gt;支持&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card ext&quot; style=&quot;--tc:var(--pos)&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;IperionX&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;供應商&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;對方文件怎麼說&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;IperionX 20-F 寫雙方 2021 年簽備忘錄，由 Titan 專案供應獨居石砂給 White Mesa。對本公司說法：支持，外部原料商把 White Mesa 當稀土加工去處；但備忘錄不是長約，供料量待查。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src45&quot;&gt;[45]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對本公司說法&lt;/div&gt;&lt;div class=&quot;stc&quot;&gt;支持&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;sa&quot;&gt;&lt;h2&gt;4　優勢來源與持續期間&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;每種優勢都要同時有「好處」與「屏障」證據（Helmer《7 Powers》的檢驗）：只有好處、沒有屏障的優勢只算&lt;b&gt;暫時領先&lt;/b&gt;。再分兩維：超額報酬有多大、能撐多久（Mauboussin《Measuring the Moat》的問法）；Morningstar 五種來源只當分類參考。本節只談商業面的屏障，不含價格或估值，也不是估值報告的護城河評分，不進商業動能等級。&lt;/p&gt;&lt;div class=&quot;callout&quot;&gt;&lt;b&gt;總結&lt;/b&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;公司的優勢在資源端：一座稀缺的運轉中鈾廠與一個高品位低成本礦；前者有屏障事實但持續期間不明，後者儲量有限、持續期間不足 5 年，兩者都還沒換成公司層級的營業利潤。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src2&quot;&gt;[2]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src42&quot;&gt;[42]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src46&quot;&gt;[46]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;優勢地圖：多大、多久&lt;/figcaption&gt;&lt;div class=&quot;amx&quot;&gt;&lt;div class=&quot;amy&quot;&gt;持續期間 →&lt;/div&gt;&lt;div class=&quot;amg&quot;&gt;&lt;div class=&quot;amr&quot; style=&quot;grid-template-columns:80px repeat(3,1fr)&quot;&gt;&lt;div class=&quot;aml&quot;&gt;不明&lt;/div&gt;&lt;div class=&quot;amc unk&quot;&gt;&lt;span class=&quot;ab ab-有屏障證據&quot; title=&quot;White Mesa：美國唯一運轉中的傳統鈾廠：有屏障證據&quot;&gt;1&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;amc unk&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amc unk&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;amr&quot; style=&quot;grid-template-columns:80px repeat(3,1fr)&quot;&gt;&lt;div class=&quot;aml&quot;&gt;10年以上&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;amr&quot; style=&quot;grid-template-columns:80px repeat(3,1fr)&quot;&gt;&lt;div class=&quot;aml&quot;&gt;5–10年&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;amr&quot; style=&quot;grid-template-columns:80px repeat(3,1fr)&quot;&gt;&lt;div class=&quot;aml&quot;&gt;不足5年&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;span class=&quot;ab ab-有屏障證據&quot; title=&quot;Pinyon Plain 高品位鈾礦的低成本：有屏障證據&quot;&gt;2&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;amr&quot; style=&quot;grid-template-columns:80px repeat(3,1fr)&quot;&gt;&lt;div class=&quot;aml&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amx-l&quot;&gt;小&lt;/div&gt;&lt;div class=&quot;amx-l&quot;&gt;中&lt;/div&gt;&lt;div class=&quot;amx-l&quot;&gt;大&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;amxt&quot;&gt;超額報酬大小 →&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;ol class=&quot;akey&quot;&gt;&lt;li&gt;&lt;span class=&quot;ab ab-有屏障證據&quot;&gt;1&lt;/span&gt;White Mesa：美國唯一運轉中的傳統鈾廠（獨占資源；有屏障證據）&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;ab ab-有屏障證據&quot;&gt;2&lt;/span&gt;Pinyon Plain 高品位鈾礦的低成本（獨占資源；有屏障證據）&lt;/li&gt;&lt;/ol&gt;&lt;div class=&quot;lg&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--pos)&quot;&gt;&lt;/i&gt;有屏障證據&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--warn)&quot;&gt;&lt;/i&gt;暫時領先&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;每個圓圈是一項優勢：越往右超額報酬越大、越往上能撐越久。綠＝屏障有事實證據；橘＝只有好處或屏障只有推論（暫時領先，持續期間最多不足 5 年）。作者寫「不明」的維度放在虛線格，不補值。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估、持續期間、判定）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;每項優勢有多少證據&lt;/figcaption&gt;&lt;svg viewBox=&quot;0 0 680 128&quot; role=&quot;img&quot; aria-label=&quot;優勢的證據數：好處與屏障&quot;&gt;&lt;text x=&quot;254&quot; y=&quot;124&quot; class=&quot;ax&quot;&gt;好處句數&lt;/text&gt;&lt;text x=&quot;459.0&quot; y=&quot;124&quot; class=&quot;ax&quot;&gt;屏障句數（事實／推論）&lt;/text&gt;&lt;text x=&quot;242&quot; y=&quot;32&quot; class=&quot;lb s&quot; text-anchor=&quot;end&quot;&gt;1 White Mesa：美國唯一運轉中的傳統鈾廠&lt;title&gt;1 White Mesa：美國唯一運轉中的傳統鈾廠&lt;/title&gt;&lt;/text&gt;&lt;rect x=&quot;250&quot; y=&quot;20&quot; width=&quot;165.0&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;420.0&quot; y=&quot;33&quot; class=&quot;vl s&quot;&gt;2&lt;/text&gt;&lt;rect x=&quot;455.0&quot; y=&quot;20&quot; width=&quot;82.5&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;var(--pos)&quot;/&gt;&lt;rect x=&quot;537.5&quot; y=&quot;20&quot; width=&quot;82.5&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;var(--accent)&quot; opacity=&quot;.7&quot;/&gt;&lt;text x=&quot;625.0&quot; y=&quot;33&quot; class=&quot;vl s&quot;&gt;1／1&lt;/text&gt;&lt;text x=&quot;242&quot; y=&quot;78&quot; class=&quot;lb s&quot; text-anchor=&quot;end&quot;&gt;2 Pinyon Plain 高品位鈾礦的低成本&lt;title&gt;2 Pinyon Plain 高品位鈾礦的低成本&lt;/title&gt;&lt;/text&gt;&lt;rect x=&quot;250&quot; y=&quot;66&quot; width=&quot;82.5&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;337.5&quot; y=&quot;79&quot; class=&quot;vl s&quot;&gt;1&lt;/text&gt;&lt;rect x=&quot;455.0&quot; y=&quot;66&quot; width=&quot;82.5&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;var(--pos)&quot;/&gt;&lt;rect x=&quot;537.5&quot; y=&quot;66&quot; width=&quot;82.5&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;var(--accent)&quot; opacity=&quot;.7&quot;/&gt;&lt;text x=&quot;625.0&quot; y=&quot;79&quot; class=&quot;vl s&quot;&gt;1／1&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;lg&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c3)&quot;&gt;&lt;/i&gt;好處&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--pos)&quot;&gt;&lt;/i&gt;屏障：事實&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--accent)&quot;&gt;&lt;/i&gt;屏障：推論&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;左邊是「它帶來什麼」的句數，右邊是「為什麼對手拿不走」的句數；屏障至少一句是事實（綠）才算有屏障證據。句數多不等於優勢強，只表示證據量。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估、屏障的標記）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;div class=&quot;card advc&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;&lt;span class=&quot;num-b 有屏障證據&quot;&gt;1&lt;/span&gt;White Mesa：美國唯一運轉中的傳統鈾廠&lt;/b&gt;&lt;span class=&quot;vd vd-有屏障證據&quot;&gt;有屏障證據&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;獨占資源（Cornered Resource）｜晨星：無形資產&lt;/div&gt;&lt;div class=&quot;two&quot;&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;好處（它帶來什麼）&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;工廠有執照每年可生產 800 萬磅以上鈾精礦，也是美國唯一運轉中的鈾、釩、稀土回收設施，可同時處理自有礦、第三方礦與獨居石。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src2&quot;&gt;[2]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src47&quot;&gt;[47]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src48&quot;&gt;[48]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;其他礦商的礦要運來加工（IsoEnergy），讓公司有加工收費與原料來源。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src44&quot;&gt;[44]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;屏障（為什麼對手拿不走）&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;美國只有三座已取得執照、許可並建成的傳統鈾廠，White Mesa 是其中唯一運轉中的一座。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src43&quot;&gt;[43]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src2&quot;&gt;[2]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;對手要取得同等處理能力，得重啟另兩座已建成的廠或新取得執照建廠；新廠所需的執照與興建時間本頁沒有原文，待查。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src43&quot;&gt;[43]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;two&quot;&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;超額報酬大小&lt;/div&gt;&lt;span class=&quot;lv&quot;&gt;小&lt;/span&gt;&lt;div class=&quot;s&quot;&gt;近四季營業利益率 −81.0%，近 20 季範圍 −1,112.6% 到 −60.8%，工廠的稀缺性還沒換成正的營業利潤。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src46&quot;&gt;[46]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src49&quot;&gt;[49]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;持續期間&lt;/div&gt;&lt;span class=&quot;lv&quot;&gt;不明&lt;/span&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-待查&quot;&gt;待查&lt;/span&gt;待查：另兩座已建成鈾廠（Shootaring Canyon、Sweetwater）的重啟時程，以及新建傳統鈾廠的執照年限。&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card advc&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;&lt;span class=&quot;num-b 有屏障證據&quot;&gt;2&lt;/span&gt;Pinyon Plain 高品位鈾礦的低成本&lt;/b&gt;&lt;span class=&quot;vd vd-有屏障證據&quot;&gt;有屏障證據&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;獨占資源（Cornered Resource）｜晨星：成本優勢&lt;/div&gt;&lt;div class=&quot;two&quot;&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;好處（它帶來什麼）&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;這輪加工的總加權成本約每磅 23 美元，第三季長約售價每磅 88.79 美元，第三季毛利率 61.3%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src17&quot;&gt;[17]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src28&quot;&gt;[28]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src50&quot;&gt;[50]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;屏障（為什麼對手拿不走）&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;公司說 Pinyon Plain 是美國史上品位最高的鈾礦之一，礦體品位是地質條件，對手無法複製同一礦體。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src51&quot;&gt;[51]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;Pinyon Plain 2025 年底證實加概略儲量 13.3 萬噸、平均品位 0.97%、含鈾約 257 萬磅。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src42&quot;&gt;[42]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;two&quot;&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;超額報酬大小&lt;/div&gt;&lt;span class=&quot;lv&quot;&gt;中&lt;/span&gt;&lt;div class=&quot;s&quot;&gt;第三季毛利率 61.3%，比去年同季 27.8% 高約 33.5 個百分點，但銷管費用率 62.9% 把毛利吃光，公司層級仍虧損。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src50&quot;&gt;[50]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src52&quot;&gt;[52]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src53&quot;&gt;[53]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;持續期間&lt;/div&gt;&lt;span class=&quot;lv&quot;&gt;不足5年&lt;/span&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;儲量約 257 萬磅，對照 2026 年全公司開採指引 200 萬到 250 萬磅，約只夠 1 到 1.3 年（推算，開採指引含其他礦）；儲量能否續增待查。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src42&quot;&gt;[42]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src21&quot;&gt;[21]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;超額報酬的機械參考：利潤率位置&lt;/figcaption&gt;&lt;svg viewBox=&quot;0 0 680 92&quot; role=&quot;img&quot; aria-label=&quot;近四季營業利益率在近20季範圍的位置&quot;&gt;&lt;line x1=&quot;30.0&quot; x2=&quot;30.0&quot; y1=&quot;18&quot; y2=&quot;64&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;30.0&quot; y=&quot;84&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;-1200%&lt;/text&gt;&lt;line x1=&quot;133.3&quot; x2=&quot;133.3&quot; y1=&quot;18&quot; y2=&quot;64&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;133.3&quot; y=&quot;84&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;-1000%&lt;/text&gt;&lt;line x1=&quot;236.7&quot; x2=&quot;236.7&quot; y1=&quot;18&quot; y2=&quot;64&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;236.7&quot; y=&quot;84&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;-800%&lt;/text&gt;&lt;line x1=&quot;340.0&quot; x2=&quot;340.0&quot; y1=&quot;18&quot; y2=&quot;64&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;340.0&quot; y=&quot;84&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;-600%&lt;/text&gt;&lt;line x1=&quot;443.3&quot; x2=&quot;443.3&quot; y1=&quot;18&quot; y2=&quot;64&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;443.3&quot; y=&quot;84&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;-400%&lt;/text&gt;&lt;line x1=&quot;546.7&quot; x2=&quot;546.7&quot; y1=&quot;18&quot; y2=&quot;64&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;546.7&quot; y=&quot;84&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;-200%&lt;/text&gt;&lt;line x1=&quot;650.0&quot; x2=&quot;650.0&quot; y1=&quot;18&quot; y2=&quot;64&quot; class=&quot;zl&quot;/&gt;&lt;text x=&quot;650.0&quot; y=&quot;84&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;0%&lt;/text&gt;&lt;rect x=&quot;75.2&quot; y=&quot;30&quot; width=&quot;543.4&quot; height=&quot;22&quot; rx=&quot;4&quot; fill=&quot;var(--biz)&quot; opacity=&quot;.22&quot;/&gt;&lt;text x=&quot;75.2&quot; y=&quot;24&quot; class=&quot;ax&quot;&gt;近 20 季範圍 -1112.6%～-60.8%&lt;/text&gt;&lt;circle cx=&quot;608.2&quot; cy=&quot;41&quot; r=&quot;7&quot; fill=&quot;var(--biz)&quot;/&gt;&lt;text x=&quot;608.2&quot; y=&quot;76&quot; class=&quot;vl s&quot; text-anchor=&quot;middle&quot;&gt;近四季 -81.0%&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;藍帶是近 20 季的近四季營業利益率範圍，圓點是最新值；同業不足不排百分位。只供對照「超額報酬大小」，不是分數、不進等級，也不是估值報告的護城河評分。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估底稿&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;p class=&quot;lead&quot;&gt;機械參考（供對照超額報酬，不是分數）：近四季營業利益率 -81.0%，近 20 季範圍 -1112.6%～-60.8%，同業不足不排百分位。&lt;/p&gt;&lt;div class=&quot;note&quot;&gt;判定規則：屏障欄至少一句標「事實」並附出處才算「有屏障證據」；否則只算「暫時領先」，持續期間最多寫「不足5年」。&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;s4&quot;&gt;&lt;h2&gt;5　生命週期與未來變化&lt;/h2&gt;&lt;div class=&quot;stages&quot;&gt;&lt;div class=&quot;&quot;&gt;起步&lt;/div&gt;&lt;div class=&quot;on&quot;&gt;成長&lt;/div&gt;&lt;div class=&quot;&quot;&gt;成熟&lt;/div&gt;&lt;div class=&quot;&quot;&gt;衰退&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;lead&quot;&gt;估值報告的林區分類（引用，不重判）：週期型&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;年營收由 2020 年 1.66 百萬增到 2024 年 78.11 百萬，2025 年降到 65.92 百萬，近四季年增 48.9%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src9&quot;&gt;[9]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src54&quot;&gt;[54]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;營業利益自 2015 年起每年為負，2025 年 −101.16 百萬；營運現金流同樣每年為負。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src3&quot;&gt;[3]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src55&quot;&gt;[55]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;公司正在擴充稀土產能並併購下游金屬與磁材業者，處於投入期而非收成期。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src25&quot;&gt;[25]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src4&quot;&gt;[4]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;研究報告的林區分類為週期型、兼具專案擴產期的快速成長；本頁判成長期，但這是鈾價上行帶動的週期型成長，與林區分類方向一致，差別在本頁著重擴產投入階段。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src56&quot;&gt;[56]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src57&quot;&gt;[57]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;callout&quot;&gt;&lt;b&gt;最可能的轉變：維持成長期；下行方向是鈾價回落使營收退回 2019 年（5.87 百萬）至 2020 年（1.66 百萬）的低谷（週期型回落，不是成熟），上行方向是稀土第二期定案與 VAC 交割後轉為多產品成長&lt;/b&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;下行條件：近四季營收年增轉為負且持續兩季以上，同時鈾的實質價格離開近十年高位（目前約第 92 百分位）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src54&quot;&gt;[54]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src30&quot;&gt;[30]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;目前狀態：10-Q 寫的第二期迴路完工目標是 2029 年中，附帶條件為取得執照、融資、足夠原料與正面的最終投資決定；VAC 全資收購於 2026 年 6 月 23 日簽約、10 月 13 日修訂，10-Q 列為待完成的收購，尚未交割。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src26&quot;&gt;[26]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src6&quot;&gt;[6]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;上行條件（作者選定，尚未發生）：第二期迴路取得最終投資決定並完成融資，或 VAC 完成交割；任一件發生，稀土與磁材才會從計畫變成可計入的營收來源。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src26&quot;&gt;[26]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src6&quot;&gt;[6]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lead&quot;&gt;怎麼檢驗&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;看 2026 年 10-K 的全年鈾銷量是否達 150 萬磅與近四季營收年增；看 8-K 是否公告第二期最終投資決定或 VAC 交割。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src21&quot;&gt;[21]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src26&quot;&gt;[26]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;s5&quot;&gt;&lt;h2&gt;6　週期推論&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;三種證據都寫成「區間＋條件」，不給單一日期。&lt;/p&gt;&lt;div class=&quot;callout&quot;&gt;&lt;b&gt;綜合：未來 1–3 季（2026 年第四季至 2027 年第二季）營收以鈾為主、隨下一輪加工與現貨出貨在高位震盪；2027–2028 年起是否轉入下行段，看鈾價是否離開近十年高位與長約交貨額（2027 年 48.4 百萬、2028 年 40.5 百萬）能否撐住&lt;/b&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;下一輪加工如期在 2026 年第四季開始，2026 年鈾銷量達指引下緣 150 萬磅。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src20&quot;&gt;[20]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src21&quot;&gt;[21]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;鈾的實質價格目前在近十年約第 92 百分位，位置偏高。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src30&quot;&gt;[30]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;自身歷史的下行段通常 1 季就翻轉，但那是出貨雜訊；2–3 年尺度的下行要看鈾價，長約最低額 2029 年後降到每年 24.7 百萬，對營收的托底變弱。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src58&quot;&gt;[58]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src23&quot;&gt;[23]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;h3&gt;① 自身歷史循環&lt;/h3&gt;&lt;div class=&quot;chart&quot;&gt;&lt;svg viewBox=&quot;0 0 720 240&quot; role=&quot;img&quot; aria-label=&quot;近四季營收年增（2016-12-31～2026-09-30（40 季））&quot;&gt;&lt;line x1=&quot;46&quot; x2=&quot;704&quot; y1=&quot;210.0&quot; y2=&quot;210.0&quot; stroke=&quot;var(--line)&quot; stroke-width=&quot;1&quot;/&gt;&lt;text x=&quot;40&quot; y=&quot;214.0&quot; font-size=&quot;11&quot; text-anchor=&quot;end&quot; fill=&quot;var(--muted)&quot;&gt;-86%&lt;/text&gt;&lt;line x1=&quot;46&quot; x2=&quot;704&quot; y1=&quot;188.3&quot; y2=&quot;188.3&quot; stroke=&quot;var(--line)&quot; stroke-width=&quot;1.4&quot;/&gt;&lt;text x=&quot;40&quot; y=&quot;192.3&quot; font-size=&quot;11&quot; text-anchor=&quot;end&quot; fill=&quot;var(--muted)&quot;&gt;0%&lt;/text&gt;&lt;line x1=&quot;46&quot; x2=&quot;704&quot; y1=&quot;28.0&quot; y2=&quot;28.0&quot; stroke=&quot;var(--line)&quot; stroke-width=&quot;1&quot;/&gt;&lt;text x=&quot;40&quot; y=&quot;32.0&quot; font-size=&quot;11&quot; text-anchor=&quot;end&quot; fill=&quot;var(--muted)&quot;&gt;634%&lt;/text&gt;&lt;text x=&quot;46.0&quot; y=&quot;232&quot; font-size=&quot;11&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--muted)&quot;&gt;2016-12&lt;/text&gt;&lt;text x=&quot;147.2&quot; y=&quot;232&quot; font-size=&quot;11&quot
