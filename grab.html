&lt;div class=&quot;front&quot; id=&quot;front&quot; data-layer=&quot;首頁&quot;&gt;&lt;header class=&quot;hero&quot;&gt;&lt;div&gt;&lt;span class=&quot;stance&quot;&gt;生意 B／價格合理&lt;/span&gt;&lt;span class=&quot;stance rating&quot;&gt;研究評等　生意 B ／ 價格合理（非買賣建議）&lt;/span&gt;&lt;h1&gt;東南亞叫車與外送龍頭剛跨過獲利門檻，現價落在合理區，結論對現金口徑很敏感。&lt;/h1&gt;&lt;p class=&quot;summary&quot;&gt;Grab 的平台（叫車＋外送）近四季營收年增約 18%（推導），2025 年首度全年獲利。合理價值 2.88–3.94 美元（中點 3.41 美元），收盤 3.24 美元，價格位置 合理。若只計現金、不計其他投資，中點約低 28.8%，位置變偏貴（推導）；Atome（Atome Financial，東南亞先買後付與放款業者）收購對價與馬來西亞資料中心出資都還沒扣。研究評等非買賣建議。&lt;/p&gt;&lt;/div&gt;&lt;aside class=&quot;pricebox&quot;&gt;&lt;div class=&quot;sub&quot;&gt;2026-11-13 收盤 3.24 美元&lt;/div&gt;&lt;div class=&quot;big&quot;&gt;3.24&lt;span style=&quot;font-size:18px&quot;&gt; 美元&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;zones&quot;&gt;&lt;div class=&quot;zone buy&quot; style=&quot;grid-column:1/-1&quot;&gt;&lt;span&gt;買入區上緣（不確定性中）&lt;/span&gt;&lt;b&gt;2.39 美元&lt;/b&gt;&lt;small&gt;股價在此以下才有 30% 安全邊際；＝合理價值中點 3.41 ×（1−30%）。非買賣建議。&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;rows&quot;&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;股價 ÷ 合理價值中點&lt;/span&gt;&lt;span&gt;0.95 倍&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;10 年期美國公債&lt;/span&gt;&lt;span&gt;5.15%&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;r&quot;&gt;&lt;span&gt;市價隱含 5 年營收年增&lt;/span&gt;&lt;span&gt;12.1%&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;現金與證券（2026-09-30）&lt;/span&gt;&lt;span&gt;28.5 億美元&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;有息負債&lt;/span&gt;&lt;span&gt;20.7 億美元&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;淨現金&lt;/span&gt;&lt;span&gt;7.8 億美元&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;近四季回購&lt;/span&gt;&lt;span&gt;2.7 億美元&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;近四季公開市場回購均價（高於合理價值區間）&lt;/span&gt;&lt;span&gt;4.68 美元&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;r&quot; style=&quot;display:block&quot;&gt;&lt;span&gt;股東回報與權益（2021–2025）：&lt;/span&gt;&lt;span style=&quot;font-weight:400&quot;&gt;近五年平均 ROE -109%；股東權益 77.3→67.3 億美元（逐年表見第六題）&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; id=&quot;cont-note&quot; style=&quot;margin:10px 0 0&quot;&gt;這個數字只描述現價與本報告合理價值中點的距離，不改價格位置與研究評等。非買賣建議。&lt;/p&gt;&lt;/aside&gt;&lt;/header&gt;&lt;section class=&quot;note-box&quot; id=&quot;value-trio&quot; style=&quot;margin-top:18px&quot;&gt;&lt;h3&gt;合理價值與市價隱含第 10 年倍數&lt;/h3&gt;&lt;div class=&quot;zones&quot; style=&quot;grid-template-columns:repeat(2,1fr)&quot;&gt;&lt;div class=&quot;zone&quot;&gt;&lt;span&gt;合理價值（只含折現率）&lt;/span&gt;&lt;b&gt;2.88–3.94 美元&lt;/b&gt;&lt;small&gt;中點 3.41 美元；三情境機率加權&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;zone mkt&quot;&gt;&lt;span&gt;市價隱含第 10 年倍數（EV/EBIT，基準情境）&lt;/span&gt;&lt;b&gt;9.3 倍&lt;/b&gt;&lt;small&gt;模型假設 9.2 倍，市價隱含是模型的 1.0 倍；折現率區間 8.5–10.6 倍；參考帶（大類：服務與教育，152 筆、8 家）中位 19.5 倍、四分位 4.3–29.8 倍、p90 41.2 倍（機械回測樣本，非市場全體；分產業的筆數與公司數少，僅供參考）；只描述，不進評等&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;參考帶中位（服務與教育） 19.5 倍時，機率加權每股約 5.26 美元（條件式，非目標價、非買賣建議，不進評等；各倍數對照見計算底稿 5）。&lt;/p&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;&lt;b&gt;合理價值 vs 市價隱含倍數（作者判讀）：&lt;/b&gt;市價隱含第 10 年 EV/EBIT 約 9.3 倍，與模型終值倍數 9.2 倍 幾乎相同（比值 1.01），落在參考帶 p25 與中位之間；沒有特例，只描述，不當評等理由。&lt;/p&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:10px;font-size:15px;line-height:1.7&quot;&gt;上面的合理價值只含折現率高低；三情境全幅 1.86～6.10（情境與折現率一起算，約中點的 124%）；寬主要來自情境（差距 95%），不是折現率（31%）。情境差距＝（樂觀－保守）÷基準，折現率寬度＝（高－低）÷中點；非買賣建議。&lt;/p&gt;&lt;div class=&quot;tw&quot; style=&quot;margin-top:14px&quot;&gt;&lt;table class=&quot;txt&quot; style=&quot;min-width:0;font-size:16px&quot;&gt;&lt;tr&gt;&lt;th style=&quot;padding:9px 12px;font-size:15px&quot;&gt;情境&lt;/th&gt;&lt;th style=&quot;padding:9px 12px;font-size:15px&quot;&gt;每股價值&lt;/th&gt;&lt;th style=&quot;padding:9px 12px;font-size:15px&quot;&gt;權重&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;padding:9px 12px&quot;&gt;保守&lt;/td&gt;&lt;td style=&quot;padding:9px 12px;font-size:20px;font-weight:700&quot;&gt;2.07&lt;/td&gt;&lt;td style=&quot;padding:9px 12px&quot;&gt;25%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;padding:9px 12px&quot;&gt;基準&lt;div style=&quot;font-size:13px;line-height:1.5;color:var(--muted);margin-top:2px&quot;&gt;與外部 DCF 單點同口徑；今天的現值，不是 12 個月目標價，非買賣建議&lt;/div&gt;&lt;/td&gt;&lt;td style=&quot;padding:9px 12px;font-size:20px;font-weight:700&quot;&gt;3.22&lt;/td&gt;&lt;td style=&quot;padding:9px 12px&quot;&gt;50%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;padding:9px 12px&quot;&gt;樂觀&lt;/td&gt;&lt;td style=&quot;padding:9px 12px;font-size:20px;font-weight:700&quot;&gt;5.14&lt;/td&gt;&lt;td style=&quot;padding:9px 12px&quot;&gt;25%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:10px;font-size:15px;line-height:1.7&quot;&gt;中點是三個情境的加權，上下緣是換折現率重算；算式見&lt;a href=&quot;#valuation&quot;&gt;第五題&lt;/a&gt;。情境表說明合理價值怎麼組成，不是單一目標價。&lt;/p&gt;&lt;/section&gt;&lt;!--目標區間:首頁--&gt;&lt;div class=&quot;note-box tgt&quot; id=&quot;target-front&quot;&gt;&lt;h3&gt;12 個月條件式目標區間&lt;/h3&gt;&lt;p style=&quot;margin:0 0 6px&quot;&gt;如果三種情境各自成真，一年後（至 2027-11-13）每股價值大約落在：保守 2.03–2.48、基準 3.00–4.04、樂觀 4.59–6.68 美元。這是條件式區間，不是股價預測，三段不合成單一數字。&lt;/p&gt;&lt;figure class=&quot;figure wide&quot;&gt;&lt;svg viewBox=&quot;0 0 860 232&quot; role=&quot;img&quot; aria-label=&quot;今天的價值區間與 12 個月後的條件式目標區間（條件式、非買賣建議）&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;398.4&quot; x2=&quot;398.4&quot; y1=&quot;24&quot; y2=&quot;198&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;398.4&quot; y=&quot;212&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;5&lt;/text&gt;&lt;text x=&quot;4&quot; y=&quot;16&quot; class=&quot;lab&quot; font-weight=&quot;700&quot;&gt;今天（依證據的價值；倍數列只作交叉核對）&lt;/text&gt;&lt;text x=&quot;142&quot; y=&quot;42.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;合理價值&lt;/text&gt;&lt;rect x=&quot;234.6&quot; y=&quot;30.0&quot; width=&quot;81.7&quot; height=&quot;16&quot; rx=&quot;8&quot; fill=&quot;var(--pos)&quot; opacity=&quot;0.8&quot;&gt;&lt;title&gt;合理價值：2.9–3.9&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;322.2&quot; y=&quot;42.0&quot; class=&quot;ax&quot;&gt;2.9–3.9；買入區上緣 2.4&lt;/text&gt;&lt;text x=&quot;142&quot; y=&quot;70.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;倍數交叉核對（不進評等）&lt;/text&gt;&lt;rect x=&quot;185.7&quot; y=&quot;58.0&quot; width=&quot;126.3&quot; height=&quot;16&quot; rx=&quot;8&quot; fill=&quot;var(--muted)&quot; opacity=&quot;0.35&quot;&gt;&lt;title&gt;倍數交叉核對（不進評等）：2.3–3.9&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;318.0&quot; y=&quot;70.0&quot; class=&quot;ax&quot;&gt;2.3–3.9&lt;/text&gt;&lt;text x=&quot;4&quot; y=&quot;96&quot; class=&quot;lab&quot; font-weight=&quot;700&quot;&gt;12 個月後（條件式目標區間，不進評等）&lt;/text&gt;&lt;text x=&quot;142&quot; y=&quot;122.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;保守 25%&lt;/text&gt;&lt;rect x=&quot;168.9&quot; y=&quot;110.0&quot; width=&quot;34.8&quot; height=&quot;16&quot; rx=&quot;8&quot; fill=&quot;var(--c5)&quot; opacity=&quot;0.85&quot;&gt;&lt;title&gt;保守 25%：2.0–2.5&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;209.7&quot; y=&quot;122.0&quot; class=&quot;ax&quot;&gt;2.03–2.48｜相對現價 −37%～−23%&lt;/text&gt;&lt;text x=&quot;142&quot; y=&quot;150.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;基準 50%&lt;/text&gt;&lt;rect x=&quot;243.8&quot; y=&quot;138.0&quot; width=&quot;80.5&quot; height=&quot;16&quot; rx=&quot;8&quot; fill=&quot;var(--c1)&quot; opacity=&quot;0.85&quot;&gt;&lt;title&gt;基準 50%：3.0–4.0&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;330.3&quot; y=&quot;150.0&quot; class=&quot;ax&quot;&gt;3.00–4.04｜相對現價 −7%～+25%&lt;/text&gt;&lt;text x=&quot;142&quot; y=&quot;178.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;樂觀 25%&lt;/text&gt;&lt;rect x=&quot;366.6&quot; y=&quot;166.0&quot; width=&quot;162.0&quot; height=&quot;16&quot; rx=&quot;8&quot; fill=&quot;var(--c2)&quot; opacity=&quot;0.85&quot;&gt;&lt;title&gt;樂觀 25%：4.6–6.7&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;534.6&quot; y=&quot;178.0&quot; class=&quot;ax&quot;&gt;4.59–6.68｜相對現價 +42%～+106%&lt;/text&gt;&lt;line x1=&quot;196.3&quot; x2=&quot;196.3&quot; y1=&quot;27&quot; y2=&quot;49&quot; class=&quot;buyline&quot;/&gt;&lt;line x1=&quot;262.2&quot; x2=&quot;262.2&quot; y1=&quot;24&quot; y2=&quot;198&quot; class=&quot;price&quot;/&gt;&lt;text x=&quot;262.2&quot; y=&quot;228&quot; class=&quot;pricelab&quot; text-anchor=&quot;middle&quot;&gt;現價 3.24&lt;/text&gt;&lt;/svg&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;條件式、非買賣建議；2026-11-13 至 2027-11-13；機率為政策權重，未經歷史校準；細節見第五題。&lt;/p&gt;&lt;/figure&gt;&lt;/div&gt;&lt;!--/目標區間:首頁--&gt;&lt;div class=&quot;kpis&quot;&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;l&quot;&gt;平台近四季營收年增&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;18.0%（推導）&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;2025Q4–2026Q3，不含金融服務；6-K 季度新聞稿&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;l&quot;&gt;集團近四季營業利益率&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;5.1%（推導）&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;營業利益 201÷營收 3,970 百萬美元；平台約 7.2%&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;l&quot;&gt;每股自由現金流扣股權薪酬&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;約 0.07 美元（推導）&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;公司調整後自由現金流 533 減股權薪酬 234，除以股數 4,118 百萬&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;l&quot;&gt;外送與叫車 GMV（2026Q3）&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;45.0 億＋23.4 億美元&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;年增 21%、14%；抽成率公司未揭露&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;p style=&quot;margin:6px 0 0&quot;&gt;&lt;a href=&quot;#foreign&quot;&gt;&lt;b&gt;外國發行人&lt;/b&gt;&lt;/a&gt;　申報 20-F／6-K，會計準則 IFRS，報告幣別 美元，不需換算；季度數字來自 6-K 新聞稿（非 XBRL）&lt;/p&gt;&lt;div class=&quot;note-box&quot; id=&quot;survival&quot; style=&quot;border-left-color:var(--muted)&quot;&gt;&lt;p style=&quot;margin:0&quot;&gt;&lt;b&gt;信用評級&lt;/b&gt;　機構 未揭露／推導 AA（只看利息保障倍數，7.2 倍）｜依推導：投資等級&lt;/p&gt;&lt;p style=&quot;margin:6px 0 0&quot;&gt;&lt;a href=&quot;#survival-detail&quot;&gt;&lt;b&gt;存活檢查（12～24 個月）&lt;/b&gt;&lt;/a&gt;　&lt;b style=&quot;color:var(--muted)&quot;&gt;資料不足&lt;/b&gt;（推導，非違約預測）：回購加股利超過自由現金流 387.0 百萬美元。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;grid2 front-pts&quot;&gt;&lt;div&gt;&lt;h3&gt;三個論點&lt;/h3&gt;&lt;ol class=&quot;pts&quot;&gt;&lt;li&gt;平台雙位數成長以內生為主：平台近四季營收年增約 18%（推導），外送利潤率持續擴張。&lt;/li&gt;&lt;li&gt;資產負債表強：總現金流動性約 71 億美元，主要債務是 2030 年到期的零息可轉債。&lt;/li&gt;&lt;li&gt;2026 全年營收指引兩度上修到 41.5–42 億美元，金融服務分部 Q3 首度轉正。&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;&lt;div&gt;&lt;h3&gt;三個風險&lt;/h3&gt;&lt;ol class=&quot;pts risk&quot;&gt;&lt;li&gt;印尼兩輪抽成已由 20% 降到 8%（媒體報導），若擴及四輪，利潤率再受壓。&lt;/li&gt;&lt;li&gt;放款一年成長 200%，信用品質還沒經過完整循環。&lt;/li&gt;&lt;li&gt;Atome 與資料中心出資估值未扣，付款後公司口徑淨流動性約 30 億（推導）。&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;note-box mv&quot;&gt;&lt;b&gt;市場價格隱含什麼、我們哪裡不同&lt;/b&gt;&lt;p&gt;市價隱含平台未來 5 年營收每年約 12.1%（市價反推未來 5 年營收年增；市價 3.24 美元、收盤 2026-11-13；折現率 9.02%；推導），與本報告基準（第 1–5 年平均約 12.3%）相當；市場已計入基準成長，沒有額外的成長安全空間。&lt;/p&gt;&lt;/div&gt;&lt;div id=&quot;triggers&quot; class=&quot;tm&quot;&gt;&lt;h3&gt;風險與改變判斷&lt;/h3&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;risk-tbl&quot; style=&quot;min-width:0;width:100%&quot;&gt;&lt;tr&gt;&lt;th style=&quot;white-space:normal;width:64%&quot;&gt;情況（看哪個指標、門檻多少）&lt;/th&gt;&lt;th style=&quot;white-space:normal;width:22%&quot;&gt;會改變什麼判斷&lt;/th&gt;&lt;th style=&quot;white-space:normal;width:14%&quot;&gt;歷史基準比率&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;平台單季營收年增連兩季低於 12%（6-K 分部營收）&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;成長判斷下修&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;41%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;叫車分部調整後 EBITDA 占 GMV 連兩季低於 8%，或印尼抽成上限擴及四輪&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;重估平台利潤率&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;逾 90 天不良貸款率升破 4% 或準備覆蓋低於 1.5 倍&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;金融分部判斷下修&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;公司口徑淨流動性降到 30 億以下（Atome 與資料中心付款後）&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;資產負債表判斷下修&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;外送分部調整後 EBITDA 占 GMV 回落到 2.1% 以下且獎勵金連兩季上升&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;護城河下修&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;平台營業利益率連兩季低於 7%（推導口徑）&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;投入回報判斷下修&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;印尼抽成上限擴大或司機改列準雇員，壓縮平台利潤率&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;未設門檻：持續觀察&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;放款快速擴張，信用循環未經考驗&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;未設門檻：持續觀察&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;Atome 與資料中心出資共約 20 億（推導），估值未扣&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;未設門檻：持續觀察&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;東南亞貨幣貶值壓低美元營收&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;未設門檻：持續觀察&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;歷史基準比率＝成功幾率口徑，是同規模公司歷史上做到的比例，不是這家公司的預測；「—」＝沒有可對照的歷史基準，不估機率。營收成長類的列：同規模（營收 30–45 億美元）公司 10 年實質年增做到模型基準 7.6% 的歷史比例（超額報酬期間檢查.json 基準比率；Base Rate Book）。&lt;/p&gt;&lt;/div&gt;&lt;p class=&quot;cap fnote&quot;&gt;資料日期：財報截至 2026-09-30（6-K 2026-11-03 季度新聞稿，未經審計）；市場資料 2026-11-13 收盤 3.24 美元。本報告為研究用途，研究評等與條件式目標區間皆非買賣建議；不提供單一目標價。本研究只評估公司本身，不評估讀者自身的資金期限與等待能力。完整數字見正文&lt;a href=&quot;#numbers&quot;&gt;「完整數字」&lt;/a&gt;；名詞與每條判斷的證據狀態見&lt;a href=&quot;#more&quot;&gt;附錄&lt;/a&gt;。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;nav class=&quot;qnav&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;&lt;a href=&quot;#business&quot;&gt;01　生意怎麼賺錢？&lt;/a&gt;&lt;a href=&quot;#growth&quot;&gt;02　成長從哪裡來、能持續嗎？&lt;/a&gt;&lt;a href=&quot;#cash&quot;&gt;03・04　賺到的錢是真的現金嗎？股東拿到什麼回報？&lt;/a&gt;&lt;a href=&quot;#market&quot;&gt;市場背景&lt;/a&gt;&lt;a href=&quot;#valuation&quot;&gt;05　現在價格合理嗎？&lt;/a&gt;&lt;a href=&quot;#value&quot;&gt;價值判斷與評等&lt;/a&gt;&lt;a href=&quot;#capital&quot;&gt;06　財務體質與資本配置可靠嗎？&lt;/a&gt;&lt;a href=&quot;#events&quot;&gt;07　最近發生什麼、接下來看什麼？&lt;/a&gt;&lt;a href=&quot;#numbers&quot;&gt;完整數字&lt;/a&gt;&lt;a href=&quot;#workpaper&quot;&gt;計算底稿&lt;/a&gt;&lt;a href=&quot;#more&quot;&gt;附錄&lt;/a&gt;&lt;/div&gt;&lt;/nav&gt;
&lt;main class=&quot;wrap&quot;&gt;&lt;div data-layer=&quot;正文&quot;&gt;&lt;section class=&quot;q&quot; id=&quot;business&quot;&gt;&lt;div class=&quot;qno&quot;&gt;問題 01&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;生意怎麼賺錢？&lt;/div&gt;&lt;h2&gt;靠外送與叫車抽成和廣告賺錢，金融服務是第二引擎。&lt;/h2&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;Grab 從每筆外送與叫車交易收佣金與服務費，再加商家廣告；外送是最大業務線，2025 年營收 1,800、占集團約 53%&lt;span class=&quot;src&quot;&gt;（20-F 2025-12-31 Item 5 ¶70，占比推導）&lt;/span&gt;。&lt;/strong&gt;產品線圖與明細取自年報分部營收。&lt;/p&gt;&lt;p&gt;限制是公司不揭露各國抽成率，營收是扣掉司機與商家所得後的淨額，不能直接和 &lt;a class=&quot;term&quot; href=&quot;#g0&quot;&gt;GMV&lt;/a&gt; 相比；地區營收只有年度數字&lt;span class=&quot;src&quot;&gt;（Item 5 ¶73）&lt;/span&gt;。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;產品線營收占比（FY25，億美元；逐年金額與成長見下方明細表；圖的占比分母為圖中各線合計）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 480 280&quot; role=&quot;img&quot; aria-label=&quot;產品線營收&quot; class=&quot;chart&quot; style=&quot;max-width:624px&quot;&gt;&lt;path d=&quot;M240.0,52.0 A88,88 0 1 1 221.3,226.0 L228.5,192.8 A54,54 0 1 0 240.0,86.0 Z&quot; fill=&quot;var(--c1)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;外送：18.0（53%）&lt;/title&gt;&lt;/path&gt;&lt;path d=&quot;M221.3,226.0 A88,88 0 0 1 186.4,70.2 L207.1,97.2 A54,54 0 0 0 228.5,192.8 Z&quot; fill=&quot;var(--c2)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;叫車：12.2（36%）&lt;/title&gt;&lt;/path&gt;&lt;path d=&quot;M186.4,70.2 A88,88 0 0 1 239.3,52.0 L239.6,86.0 A54,54 0 0 0 207.1,97.2 Z&quot; fill=&quot;var(--c6)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;金融服務：3.5（10%）&lt;/title&gt;&lt;/path&gt;&lt;path d=&quot;M239.3,52.0 A88,88 0 0 1 240.0,52.0 L240.0,86.0 A54,54 0 0 0 239.6,86.0 Z&quot; fill=&quot;var(--muted)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;其他：0.0（&amp;lt;1%）&lt;/title&gt;&lt;/path&gt;&lt;polyline points=&quot;331.5,149.8 339.4,151.8 346.0,151.8&quot; fill=&quot;none&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;1&quot;/&gt;&lt;text x=&quot;354.0&quot; y=&quot;148.8&quot; class=&quot;lab&quot; text-anchor=&quot;start&quot;&gt;外送&lt;/text&gt;&lt;text x=&quot;354.0&quot; y=&quot;166.8&quot; class=&quot;val&quot; text-anchor=&quot;start&quot;&gt;53%&lt;tspan class=&quot;ax&quot; font-weight=&quot;400&quot;&gt;　18.0&lt;/tspan&gt;&lt;/text&gt;&lt;polyline points=&quot;150.2,160.1 142.4,164.0 134.0,164.0&quot; fill=&quot;none&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;1&quot;/&gt;&lt;text x=&quot;126.0&quot; y=&quot;161.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;叫車&lt;/text&gt;&lt;text x=&quot;126.0&quot; y=&quot;179.0&quot; class=&quot;val&quot; text-anchor=&quot;end&quot;&gt;36%&lt;tspan class=&quot;ax&quot; font-weight=&quot;400&quot;&gt;　12.2&lt;/tspan&gt;&lt;/text&gt;&lt;polyline points=&quot;210.1,53.0 207.5,68.0 134.0,68.0&quot; fill=&quot;none&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;1&quot;/&gt;&lt;text x=&quot;126.0&quot; y=&quot;65.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;金融服務&lt;/text&gt;&lt;text x=&quot;126.0&quot; y=&quot;83.0&quot; class=&quot;val&quot; text-anchor=&quot;end&quot;&gt;10%&lt;tspan class=&quot;ax&quot; font-weight=&quot;400&quot;&gt;　3.5&lt;/tspan&gt;&lt;/text&gt;&lt;polyline points=&quot;239.7,48.0 239.6,30.0 134.0,30.0&quot; fill=&quot;none&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;1&quot;/&gt;&lt;text x=&quot;126.0&quot; y=&quot;27.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;其他&lt;/text&gt;&lt;text x=&quot;126.0&quot; y=&quot;45.0&quot; class=&quot;val&quot; text-anchor=&quot;end&quot;&gt;&amp;lt;1%&lt;tspan class=&quot;ax&quot; font-weight=&quot;400&quot;&gt;　0.0&lt;/tspan&gt;&lt;/text&gt;&lt;text x=&quot;240.0&quot; y=&quot;136.0&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY25&lt;/text&gt;&lt;text x=&quot;240.0&quot; y=&quot;158.0&quot; class=&quot;val&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:18px&quot;&gt;33.7&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;白話說&lt;/b&gt;2026Q3 外送每 100 美元 GMV，Grab 認列約 12.5 美元營收（561÷4,500，推導）。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;要留意&lt;/b&gt;營收是抽成後淨額，GMV 才是交易總額；兩者成長率不同，見改判訊號。&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;產品線營收明細（億美元；占比為最近財年，分母為各線合計）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;產品線&lt;/th&gt;&lt;th&gt;FY23&lt;/th&gt;&lt;th&gt;FY24&lt;/th&gt;&lt;th&gt;FY25&lt;/th&gt;&lt;th&gt;近四季&lt;/th&gt;&lt;th&gt;最近財年年增&lt;/th&gt;&lt;th&gt;占比&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;外送&lt;/td&gt;&lt;td&gt;13&lt;/td&gt;&lt;td&gt;15&lt;/td&gt;&lt;td&gt;18&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;20.6%&lt;/td&gt;&lt;td&gt;53%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;叫車&lt;/td&gt;&lt;td&gt;9&lt;/td&gt;&lt;td&gt;10&lt;/td&gt;&lt;td&gt;12&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;16.4%&lt;/td&gt;&lt;td&gt;36%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;金融服務&lt;/td&gt;&lt;td&gt;2&lt;/td&gt;&lt;td&gt;3&lt;/td&gt;&lt;td&gt;3&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;37.2%&lt;/td&gt;&lt;td&gt;10%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;其他&lt;/td&gt;&lt;td&gt;0&lt;/td&gt;&lt;td&gt;0&lt;/td&gt;&lt;td&gt;0&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;0.0%&lt;/td&gt;&lt;td&gt;0%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;business-profile&quot;&gt;&lt;h3&gt;生意介紹：年報重點&lt;/h3&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;Grab 是東南亞八國的超級 App：叫車、外送抽成是主業，金融服務是第二引擎，2025 年首度全年獲利。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;賣什麼&lt;/p&gt;&lt;h4&gt;三條業務線，外送最大&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;外送與叫車是撮合平台：消費者付車資或餐費，司機與商家拿到扣除 Grab 佣金或服務費後的金額，Grab 只把佣金認列為營收（淨額）&lt;span class=&quot;src&quot;&gt;（20-F 2025-12-31 Item 4 ¶115）&lt;/span&gt;。&lt;/strong&gt;2025 年外送營收 1,800、叫車 1,219 百萬美元&lt;span class=&quot;src&quot;&gt;（20-F 2025-12-31 Item 5 ¶70）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;金融服務含 GrabPay 電子錢包、放款、保險與印尼 OVO，另經營新加坡 GXS Bank 與馬來西亞 GXBank 兩家數位銀行，2025 年營收 347&lt;span class=&quot;src&quot;&gt;（Item 4 ¶116、Item 5 ¶70）&lt;/span&gt;。&lt;/strong&gt;金融服務營收小，但資產負債表上放款與存款都已是大項，是判讀現金流時最要小心的一塊。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;誰付錢、怎麼賣&lt;/p&gt;&lt;h4&gt;三邊網路：消費者付費，司機與商家付佣金&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;錢來自三方：消費者付車資、外送費與平台費，司機與商家被扣佣金，商家另付 GrabPay 交易手續費與廣告費&lt;span class=&quot;src&quot;&gt;（20-F 2025-12-31 Item 4 ¶115、¶118）&lt;/span&gt;。&lt;/strong&gt;2026Q3 月交易用戶約 5,720 萬創新高，活躍司機年增 20%（6-K 2026-11-03#1 新聞稿 §0、§13）。&lt;/p&gt;&lt;p&gt;客戶是大量個人與中小商家，年報沒有列前幾大客戶占比，依賴度風險低（作者判斷）；給消費者的獎勵金直接從營收扣除，所以獎勵金占 GMV 的變化會直接影響營收&lt;span class=&quot;src&quot;&gt;（Item 4 ¶118）&lt;/span&gt;。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;營收結構：誰在拉動&lt;/p&gt;&lt;h4&gt;外送拉動最多，金融服務成長最快但含併購&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;2026Q3 集團營收 1,112，外送 561 約占一半、叫車 349 約占三成一、金融服務 201 約占一成八&lt;span class=&quot;src&quot;&gt;（6-K 2026-11-03#1 新聞稿 §0、§11–§18，占比推導）&lt;/span&gt;。&lt;/strong&gt;外送靠訂單量與廣告拉動，分部&lt;a class=&quot;term&quot; href=&quot;#g1&quot;&gt;調整後 EBITDA&lt;/a&gt; 占 GMV 由 2.1% 升到 2.7%（§12）。&lt;/p&gt;&lt;p&gt;金融服務 Q3 營收年增 124%，含 Superbank（印尼數位銀行）6 月併表與 Stash（美國理財 App）本季併表，營收貢獻未單獨揭露（§17–§18）；不能把它當內生成長。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;分部（2026Q3）&lt;/th&gt;&lt;th&gt;營收（百萬美元）&lt;/th&gt;&lt;th&gt;年增&lt;/th&gt;&lt;th&gt;GMV 或放款&lt;/th&gt;&lt;th&gt;分部調整後 EBITDA&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;外送&lt;/td&gt;&lt;td&gt;561&lt;/td&gt;&lt;td&gt;21%&lt;/td&gt;&lt;td&gt;GMV 4,500&lt;/td&gt;&lt;td&gt;占 GMV 2.7%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;叫車&lt;/td&gt;&lt;td&gt;349&lt;/td&gt;&lt;td&gt;10%&lt;/td&gt;&lt;td&gt;GMV 2,335&lt;/td&gt;&lt;td&gt;207（占 GMV 8.9%）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;金融服務&lt;/td&gt;&lt;td&gt;201&lt;/td&gt;&lt;td&gt;124%&lt;/td&gt;&lt;td&gt;放款 2,711（年增 200%）&lt;/td&gt;&lt;td&gt;12（首度轉正）&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;市場、地區與重點專案&lt;/p&gt;&lt;h4&gt;馬來西亞、新加坡、印尼三國占七成四&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;2025 年營收依地區：馬來西亞 1,039（約 31%、年增 27%）、新加坡 727（約 22%、+26%）、印尼 715（約 21%、+11%），菲律賓、泰國、越南各約 8–9%&lt;span class=&quot;src&quot;&gt;（20-F 2025-12-31 Item 5 ¶73，占比推導）&lt;/span&gt;。&lt;/strong&gt;拉動成長的是馬來西亞與新加坡，印尼成長最慢、又面臨抽成下調。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;重點專案：&lt;a class=&quot;term&quot; href=&quot;#g12&quot;&gt;Atome Financial&lt;/a&gt; 60% 收購（現金 14.9 億美元，預計 2027Q3 前交割，6-K 2026-09-15#1 附件 §9）；馬來西亞 AI 資料中心聯合開發，Grab 承諾出資 7.5 億、依里程碑分階段，待最終協議（6-K 2026-11-09#2 本文 §1–§3）。&lt;/strong&gt;年報 Item 7 只列關係人購車合約&lt;span class=&quot;src&quot;&gt;（281 輛，Item 7 ¶40）&lt;/span&gt;。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;跟誰競爭&lt;/p&gt;&lt;h4&gt;各國都有強勁對手，GoTo 在印尼最直接&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;年報列的對手：外送有 foodpanda、ShopeeFood、Gojek（主要在印尼）與泰國 Line Man Wongnai；叫車有印尼與新加坡的 Gojek、越南 Be Group 與 Xanh SM、泰國 Bolt、新加坡 Tada 與 Ryde&lt;span class=&quot;src&quot;&gt;（20-F 2025-12-31 Item 3 ¶65）&lt;/span&gt;。&lt;/strong&gt;公司稱競爭基礎是便利、可靠與一站式超級 App&lt;span class=&quot;src&quot;&gt;（Item 4 ¶123）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;外部申報也把 Grab 當主要對手：新加坡 Ryde 20-F 稱 Grab 為主要競爭者（全文搜尋 Q1）。&lt;/strong&gt;我們的判讀：規模優勢有數據支持，但各國市占率公司未揭露，看不到定價權（見護城河）。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;管理層怎麼說&lt;/p&gt;&lt;h4&gt;公司說法：9 月把 2028 年目標上調到 EBITDA 17 億（含 Atome）&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;公司說法：2026 年 2 月原目標是 2025–2028 年營收年複合約 20%、2028 年調整後 EBITDA 15 億美元（6-K 2026-02-11#2 新聞稿 §10）；2026-09-15 隨 Atome 收購公告上調為 2028 年調整後 EBITDA 17 億、2025–2028 集團營收年複合 30% 以上，含尚未交割的 Atome（6-K 2026-09-15#3 附件 §0、§16）。&lt;/strong&gt;2026 全年營收指引 41.5–42.0 億、調整後 EBITDA 7.9–8.0 億，是年內第二次上修（6-K 2026-11-03#2 §3、§16）。&lt;/p&gt;&lt;p&gt;和實績對照：2026Q3 集團營收年增 27%（固定匯率 30%）高於 2 月原目標的 20% 路徑、低於上調後的 30% 以上；上調後目標含 Atome 等併購，與 Q3 實績口徑不同，且 Q3 也含金融服務併表（6-K 2026-11-03#1 §0）；本報告基準不直接採用集團指引。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;年報列的主要風險&lt;/p&gt;&lt;h4&gt;監管、競爭與成長階段是三大風險&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;①成長階段：若成長放慢或無法持續獲利，業務與財務會受影響&lt;span class=&quot;src&quot;&gt;（20-F 2025-12-31 Item 3 ¶10）&lt;/span&gt;。&lt;/strong&gt;②印尼監管：草案可能把抽成上限降到 10%、司機改列準雇員並由平台負擔保險&lt;span class=&quot;src&quot;&gt;（Item 3 ¶87）&lt;/span&gt;；兩輪抽成已自 2026-07-01 降到 8%（新聞 N1）。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;③競爭：各國都有區域與單一市場對手，可能以低價搶市&lt;span class=&quot;src&quot;&gt;（Item 3 ¶59、¶65）&lt;/span&gt;。&lt;/strong&gt;④雙重股權：B 類股每股 45 票，創辦人控制公司&lt;span class=&quot;src&quot;&gt;（Item 3 ¶420）&lt;/span&gt;。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;moat&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;護城河與成長故事&lt;/p&gt;&lt;h3&gt;規模型雙邊網路有優勢，但沒有定價權證據。&lt;/h3&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;規模優勢有營運數據支持：用戶、司機、GMV 同步成長，外送分部利潤率擴張（6-K 2026-11-03#1 §0、§12、§16）。&lt;/strong&gt;外部申報也把 Grab 當主要對手：Uber 10-K 把 Grab 列為東南亞叫車競爭者並持股，新加坡 Ryde（新加坡叫車業者）20-F 稱 Grab 為主要競爭者。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;不能說有定價權：叫車利潤率持平、印尼兩輪抽成已下調，各國市占率公司未揭露。&lt;/strong&gt;生命週期在成長後段轉獲利：營運槓桿已出現，但市場空間與滲透率公司未揭露，成長跑道多長還無法量化（明細見計算底稿 5）。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;外部申報中的 Grab&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;外部證據來自 SEC 全文搜尋存檔（全文搜尋 Q1、Q2），只證明競爭地位，不證明市占率。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;申報&lt;/th&gt;&lt;th&gt;日期&lt;/th&gt;&lt;th&gt;內容&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Uber 10-K&lt;/td&gt;&lt;td&gt;2025-02-14&lt;/td&gt;&lt;td&gt;列 Grab 為叫車競爭者（與 Bolt、Didi 等並列），並持有 Grab 股權&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Ryde 20-F&lt;/td&gt;&lt;td&gt;2025-04-28&lt;/td&gt;&lt;td&gt;稱 Grab 為新加坡主要競爭者&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Uber 10-Q&lt;/td&gt;&lt;td&gt;2025-08-06（全文搜尋 Q2）&lt;/td&gt;&lt;td&gt;揭露持有 Grab 投資的利得&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;supply&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;地區分布與營運依賴&lt;/p&gt;&lt;h3&gt;營收全在東南亞，馬來西亞最大、印尼監管風險最高。&lt;/h3&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;Grab 總部在新加坡，2025 年新加坡以外營收約占 78%&lt;span class=&quot;src&quot;&gt;（推導，20-F 2025-12-31 Item 5 ¶73）&lt;/span&gt;，東南亞各國貨幣走勢直接影響美元營收：Q3 固定匯率年增 30%、美元 27%。&lt;/p&gt;&lt;p&gt;平台沒有關鍵供應商依賴，主要投入是司機供給與獎勵金；叫車司機供給靠加碼獎勵金與電動車方案（6-K 2026-11-03#1 §16）。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;growth&quot;&gt;&lt;div class=&quot;qno&quot;&gt;問題 02&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;成長從哪裡來、能持續嗎？&lt;/div&gt;&lt;h2&gt;平台雙位數成長靠量，能延續但在減速；金融服務含併購。&lt;/h2&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;平台成長以內生為主：不含金融服務的平台近四季營收 3,429、年增 18.0%&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;，單季年增由 2026Q1 的 21.5% 降到 Q3 的 16.3%&lt;span class=&quot;src&quot;&gt;（6-K 季度新聞稿減金融服務，推導）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;成長靠量不靠價：叫車交易數年增 21%、快於 GMV 的 14%，外送 GMV 年增 21% 來自用戶與下單頻率（6-K 2026-11-03#1 §12、§15）；公司沒有價量拆解，印尼兩輪抽成又已下調，看不到定價能力。&lt;/p&gt;&lt;p&gt;2026 全年集團營收指引兩度上修到 41.5–42.0 億（6-K 2026-11-03#2 §3）；全年實際還沒出、更早年度指引未存檔，指引達成紀錄還不能評，本題不畫指引對照圖。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;反方是集團 27% 成長含金融服務併表：Superbank（印尼數位銀行，2026-06 併表）6 月併表、Stash（美國理財 App，2026-07 收購 100%、交割付 50.1%）本季起併表，兩者營收貢獻未單獨揭露（§18）。&lt;/strong&gt;匯率也有影響，Q3 固定匯率年增 30%、美元 27%。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;營業利益率&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 280&quot; role=&quot;img&quot; aria-label=&quot;利潤率&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;246.0&quot; y2=&quot;246.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;250.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;-100%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;201.2&quot; y2=&quot;201.2&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;205.2&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;-75%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;156.4&quot; y2=&quot;156.4&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;160.4&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;-50%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;111.6&quot; y2=&quot;111.6&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;115.6&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;-25%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;66.8&quot; y2=&quot;66.8&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;70.8&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;0%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;22.0&quot; y2=&quot;22.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;26.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;25%&lt;/text&gt;&lt;text x=&quot;72.0&quot; y=&quot;268&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY22&lt;/text&gt;&lt;text x=&quot;181.5&quot; y=&quot;268&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY23&lt;/text&gt;&lt;text x=&quot;291.0&quot; y=&quot;268&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY24&lt;/text&gt;&lt;text x=&quot;400.5&quot; y=&quot;268&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY25&lt;/text&gt;&lt;text x=&quot;510.0&quot; y=&quot;268&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;近四季&lt;/text&gt;&lt;polyline points=&quot;72.0,238.5 181.5,106.2 291.0,77.6 400.5,63.3 510.0,57.7&quot; fill=&quot;none&quot; stroke=&quot;var(--c2)&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;circle cx=&quot;72.0&quot; cy=&quot;238.5&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c2)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;營業利益率 FY22：-96%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;181.5&quot; cy=&quot;106.2&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c2)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;營業利益率 FY23：-22%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;291.0&quot; cy=&quot;77.6&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c2)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;營業利益率 FY24：-6%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;400.5&quot; cy=&quot;63.3&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c2)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;營業利益率 FY25：2%&lt;/title&gt;&lt;/circle&gt;&lt;circle cx=&quot;510.0&quot; cy=&quot;57.7&quot; r=&quot;4&quot; fill=&quot;var(--surface)&quot; stroke=&quot;var(--c2)&quot; stroke-width=&quot;2&quot;&gt;&lt;title&gt;營業利益率 近四季：5%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;518.0&quot; y=&quot;61.7&quot; class=&quot;val&quot; fill=&quot;var(--c2)&quot;&gt;5%&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c2)&quot;&gt;&lt;/i&gt;營業利益率&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;成長來源拆解（量、價、新產品、新市場、併購）&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;量是主力，價是限制：用戶、司機與交易數同步成長；價格面沒有拆解，叫車每筆 GMV 下降&lt;span class=&quot;src&quot;&gt;（交易數快於 GMV，推導）&lt;/span&gt;，代表平價服務在擴量。&lt;/strong&gt;新產品是廣告與金融服務，新市場未揭露，併購只在金融服務。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;figure&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt signals&quot;&gt;&lt;tr&gt;&lt;th&gt;來源&lt;/th&gt;&lt;th&gt;證據&lt;/th&gt;&lt;th&gt;判讀&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;量&lt;/td&gt;&lt;td&gt;月交易用戶 2025 年 4,720 萬、年增 14%（20-F Item 5 ¶148）；叫車交易數 Q3 年增 21%（§15）&lt;/td&gt;&lt;td&gt;主要來源&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;價&lt;/td&gt;&lt;td&gt;公司未揭露價量拆解與抽成率；印尼兩輪抽成 7 月起降到 8%（新聞 N1）&lt;/td&gt;&lt;td&gt;未揭露，偏負面&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;新產品&lt;/td&gt;&lt;td&gt;外送廣告變現改善（§12）；金融服務放款年增 200%（§17）&lt;/td&gt;&lt;td&gt;次要來源&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;新市場&lt;/td&gt;&lt;td&gt;「東南亞其他」營收 2025 年 30、年增 100%（Item 5 ¶73）&lt;/td&gt;&lt;td&gt;很小&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;併購&lt;/td&gt;&lt;td&gt;Superbank、Stash 併表進金融服務，營收貢獻未單獨揭露；foodpanda（Delivery Hero 旗下外送品牌）台灣遭否決（§18、§21）&lt;/td&gt;&lt;td&gt;只影響金融服務&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;投入與回報&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;投入資本報酬還不能用 &lt;a class=&quot;term&quot; href=&quot;#g10&quot;&gt;ROIC&lt;/a&gt; 衡量：營運投入資本約 −87 百萬美元（應付款大於營運資產），工具標不適用（財務指標.json，2026-06-30）。&lt;/strong&gt;營運槓桿已經出現：集團營業利益由 2025 財年 65 升到近四季 201，增量營業利益率約 23%&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;。計算底稿成長性四問的增量 ROIC +780.2% 因分母極小而失真，不當回報證據，判讀以本段「弱」為準。&lt;/p&gt;&lt;p&gt;投入資本報酬評為「弱」的理由是還沒有一段完整的獲利期可驗證；若平台營業利益率連兩季回落，見改判訊號。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;研發與設備投資（億美元），上方為研發占營收&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 300&quot; role=&quot;img&quot; aria-label=&quot;投入&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;266.0&quot; y2=&quot;266.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;270.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;0.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;185.3&quot; y2=&quot;185.3&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;189.3&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;2.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;104.7&quot; y2=&quot;104.7&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;108.7&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;4.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;24.0&quot; y2=&quot;24.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;28.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;6.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;266.0&quot; y2=&quot;266.0&quot; class=&quot;zero&quot;/&gt;&lt;rect x=&quot;70.3&quot; y=&quot;78.5&quot; width=&quot;40.7&quot; height=&quot;187.6&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;研發 FY22：4.7&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;113.0&quot; y=&quot;242.6&quot; width=&quot;40.7&quot; height=&quot;23.4&quot; rx=&quot;2&quot; fill=&quot;var(--c2)&quot;&gt;&lt;title&gt;資本支出 FY22：0.6&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;113.0&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY22&lt;/text&gt;&lt;text x=&quot;113.0&quot; y=&quot;16.0&quot; class=&quot;note&quot; text-anchor=&quot;middle&quot;&gt;32.4%&lt;/text&gt;&lt;rect x=&quot;192.3&quot; y=&quot;96.2&quot; width=&quot;40.7&quot; height=&quot;169.8&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;研發 FY23：4.2&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;235.0&quot; y=&quot;237.4&quot; width=&quot;40.7&quot; height=&quot;28.6&quot; rx=&quot;2&quot; fill=&quot;var(--c2)&quot;&gt;&lt;title&gt;資本支出 FY23：0.7&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;235.0&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY23&lt;/text&gt;&lt;text x=&quot;235.0&quot; y=&quot;16.0&quot; class=&quot;note&quot; text-anchor=&quot;middle&quot;&gt;17.8%&lt;/text&gt;&lt;rect x=&quot;314.3&quot; y=&quot;100.6&quot; width=&quot;40.7&quot; height=&quot;165.4&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;研發 FY24：4.1&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;357.0&quot; y=&quot;234.9&quot; width=&quot;40.7&quot; height=&quot;31.1&quot; rx=&quot;2&quot; fill=&quot;var(--c2)&quot;&gt;&lt;title&gt;資本支出 FY24：0.8&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;357.0&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY24&lt;/text&gt;&lt;text x=&quot;357.0&quot; y=&quot;16.0&quot; class=&quot;note&quot; text-anchor=&quot;middle&quot;&gt;14.7%&lt;/text&gt;&lt;rect x=&quot;436.3&quot; y=&quot;93.4&quot; width=&quot;40.7&quot; height=&quot;172.6&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;研發 FY25：4.3&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;479.0&quot; y=&quot;226.9&quot; width=&quot;40.7&quot; height=&quot;39.1&quot; rx=&quot;2&quot; fill=&quot;var(--c2)&quot;&gt;&lt;title&gt;資本支出 FY25：1.0&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;479.0&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY25&lt;/text&gt;&lt;text x=&quot;479.0&quot; y=&quot;16.0&quot; class=&quot;note&quot; text-anchor=&quot;middle&quot;&gt;12.7%&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c1)&quot;&gt;&lt;/i&gt;研發&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c2)&quot;&gt;&lt;/i&gt;資本支出&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;白話說&lt;/b&gt;平台近四季每 100 美元營收，一年前約 85 美元（2,906÷3,429，推導）。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;要留意&lt;/b&gt;集團成長率含併購與匯率，不能直接外推到平台，見改判訊號。首頁與本題的「歷史基準比率 41%」是同規模公司 10 年實質年增 5% 以上的比例（超額報酬期間檢查.json#/基準比率檢查/對照），模型基準 7.6% 高於該級距下緣，做到 7.6% 的比例低於 41%，原表未細分。&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;cash&quot;&gt;&lt;div class=&quot;qno&quot;&gt;問題 03・04&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;賺到的錢是真的現金嗎？股東拿到什麼回報？&lt;/div&gt;&lt;h2&gt;平台有現金，但申報營運現金流被銀行業務扭曲。&lt;/h2&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;要看公司&lt;a class=&quot;term&quot; href=&quot;#g2&quot;&gt;調整後自由現金流&lt;/a&gt;，不能看 &lt;a class=&quot;term&quot; href=&quot;#g8&quot;&gt;IFRS&lt;/a&gt; 營運現金流：近四季營運現金流只有 121，因為放款增加約 1,196、存款流入約 509 都算在營運活動&lt;span class=&quot;src&quot;&gt;（作者校正.json#/季度補值，推導）&lt;/span&gt;。&lt;/strong&gt;公司調整後自由現金流近四季 533（6-K 2026-11-03#1 §10），扣股權薪酬 234 後約 299&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;限制是調整後自由現金流是公司自定的非 IFRS 口徑，新聞稿只列定義、沒有完整排除項對帳；作者另剔除放款與存款流量推導約 575&lt;span class=&quot;src&quot;&gt;（營運現金流 121＋放款增加 1,196－存款流入 509－公司口徑資本支出 233，作者校正.json#/季度補值，推導）&lt;/span&gt;，兩者差異屬口徑不同。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;現價隱含年報酬（各情境成真時，非預期報酬）；紅色虛線為公債殖利率 5.15%。基準情境下，現價隱含的年報酬只比公債高 3.8 個百分點，模型的加權資本成本（基準）比公債高 3.9 個百分點，兩者的差距對應市價與合理價值的落差&lt;/p&gt;&lt;svg viewBox=&quot;0 0 500 182&quot; role=&quot;img&quot; aria-label=&quot;現價隱含年報酬對公債&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;168.0&quot; x2=&quot;168.0&quot; y1=&quot;6&quot; y2=&quot;176&quot; class=&quot;zero&quot;/&gt;&lt;line x1=&quot;266.7&quot; x2=&quot;266.7&quot; y1=&quot;4&quot; y2=&quot;178&quot; class=&quot;price&quot;/&gt;&lt;text x=&quot;158&quot; y=&quot;23&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;保守情境成真&lt;/text&gt;&lt;rect x=&quot;168.0&quot; y=&quot;9&quot; width=&quot;113.0&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c4)&quot;/&gt;&lt;text x=&quot;289.0&quot; y=&quot;23&quot; class=&quot;val&quot;&gt;5.89%&lt;/text&gt;&lt;text x=&quot;158&quot; y=&quot;63&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;基準情境成真&lt;/text&gt;&lt;rect x=&quot;168.0&quot; y=&quot;49&quot; width=&quot;172.0&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c1)&quot;/&gt;&lt;text x=&quot;348.0&quot; y=&quot;63&quot; class=&quot;val&quot;&gt;8.97%&lt;/text&gt;&lt;text x=&quot;158&quot; y=&quot;103&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;樂觀情境成真&lt;/text&gt;&lt;rect x=&quot;168.0&quot; y=&quot;89&quot; width=&quot;249.1&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;425.1&quot; y=&quot;103&quot; class=&quot;val&quot;&gt;12.99%&lt;/text&gt;&lt;text x=&quot;158&quot; y=&quot;143&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot; font-weight=&amp;quot;700&amp;quot;&gt;10 年期美國公債&lt;/text&gt;&lt;rect x=&quot;168.0&quot; y=&quot;129&quot; width=&quot;98.7&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--muted)&quot;/&gt;&lt;text x=&quot;274.7&quot; y=&quot;143&quot; class=&quot;val&quot;&gt;5.15%&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;淨利、營運現金流與自由現金流（億美元）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 300&quot; role=&quot;img&quot; aria-label=&quot;現金品質&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;266.0&quot; y2=&quot;266.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;270.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;-5.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;185.3&quot; y2=&quot;185.3&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;189.3&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;0.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;104.7&quot; y2=&quot;104.7&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;108.7&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;5.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;24.0&quot; y2=&quot;24.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;28.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;10.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;185.3&quot; y2=&quot;185.3&quot; class=&quot;zero&quot;/&gt;&lt;rect x=&quot;70.3&quot; y=&quot;185.3&quot; width=&quot;26.5&quot; height=&quot;70.0&quot; rx=&quot;2&quot; fill=&quot;var(--c4)&quot;&gt;&lt;title&gt;淨利 FY23：-4.3&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;98.8&quot; y=&quot;171.5&quot; width=&quot;26.5&quot; height=&quot;13.9&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;營運現金流 FY23：0.9&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;127.2&quot; y=&quot;182.9&quot; width=&quot;26.5&quot; height=&quot;2.4&quot; rx=&quot;2&quot; fill=&quot;var(--c2)&quot;&gt;&lt;title&gt;自由現金流 FY23：0.1&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;113.0&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY23&lt;/text&gt;&lt;rect x=&quot;192.3&quot; y=&quot;185.3&quot; width=&quot;26.5&quot; height=&quot;16.9&quot; rx=&quot;2&quot; fill=&quot;var(--c4)&quot;&gt;&lt;title&gt;淨利 FY24：-1.1&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;220.8&quot; y=&quot;47.9&quot; width=&quot;26.5&quot; height=&quot;137.5&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;營運現金流 FY24：8.5&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;249.2&quot; y=&quot;60.3&quot; width=&quot;26.5&quot; height=&quot;125.0&quot; rx=&quot;2&quot; fill=&quot;var(--c2)&quot;&gt;&lt;title&gt;自由現金流 FY24：7.8&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;235.0&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY24&lt;/text&gt;&lt;rect x=&quot;314.3&quot; y=&quot;142.1&quot; width=&quot;26.5&quot; height=&quot;43.2&quot; rx=&quot;2&quot; fill=&quot;var(--c4)&quot;&gt;&lt;title&gt;淨利 FY25：2.7&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;342.8&quot; y=&quot;172.6&quot; width=&quot;26.5&quot; height=&quot;12.7&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;營運現金流 FY25：0.8&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;371.2&quot; y=&quot;185.3&quot; width=&quot;26.5&quot; height=&quot;2.9&quot; rx=&quot;2&quot; fill=&quot;var(--c2)&quot;&gt;&lt;title&gt;自由現金流 FY25：-0.2&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;357.0&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY25&lt;/text&gt;&lt;rect x=&quot;436.3&quot; y=&quot;90.8&quot; width=&quot;26.5&quot; height=&quot;94.5&quot; rx=&quot;2&quot; fill=&quot;var(--c4)&quot;&gt;&lt;title&gt;淨利 近四季：5.9&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;464.8&quot; y=&quot;165.8&quot; width=&quot;26.5&quot; height=&quot;19.5&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;營運現金流 近四季：1.2&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;493.2&quot; y=&quot;185.3&quot; width=&quot;26.5&quot; height=&quot;18.2&quot; rx=&quot;2&quot; fill=&quot;var(--c2)&quot;&gt;&lt;title&gt;自由現金流 近四季：-1.1&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;479.0&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;近四季&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c4)&quot;&gt;&lt;/i&gt;淨利&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c1)&quot;&gt;&lt;/i&gt;營運現金流&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c2)&quot;&gt;&lt;/i&gt;自由現金流&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;錢從哪一層開始不夠：現金流分層&lt;/h3&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;現金流分層（近四季，至 2026-09-30）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;層次&lt;/th&gt;&lt;th&gt;金額&lt;/th&gt;&lt;th&gt;正負&lt;/th&gt;&lt;th&gt;完整度&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;一、營運現金流&lt;/td&gt;&lt;td&gt;1.2 億美元&lt;/td&gt;&lt;td&gt;正&lt;/td&gt;&lt;td&gt;完整&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;二、一般資本支出後&lt;/td&gt;&lt;td&gt;-1.1 億美元&lt;/td&gt;&lt;td&gt;負&lt;/td&gt;&lt;td&gt;完整&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;三、回購與股利後&lt;/td&gt;&lt;td&gt;-3.9 億美元&lt;/td&gt;&lt;td&gt;負&lt;/td&gt;&lt;td&gt;完整&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;延伸：再扣併購與員工代扣稅&lt;/td&gt;&lt;td&gt;已知部分 -4.9 億美元&lt;/td&gt;&lt;td&gt;無法判定&lt;/td&gt;&lt;td&gt;缺員工股票代扣稅&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;數值正負不等於安全或危險：第二層為負代表所列投入超過當期營運現金，不等於營業虧損；資本支出尚未區分維持與擴張。；股利：確認為零：近四季組成欄（20-F 欄 2025-12-31 (FY)、6-K 欄 2026-06-30 (YTD)、6-K 欄 2025-06-30 (YTD)）的融資活動逐項加總等於小計，且沒有股利列；另有未分類融資列，金額已列於報表對帳&lt;/p&gt;&lt;p class=&quot;cap&quot;&gt;（算法與完整表見&lt;a href=&quot;#wp-3-4&quot;&gt;計算底稿 3・4&lt;/a&gt;）&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;白話說&lt;/b&gt;近四季每 100 美元營收，扣股權薪酬後約剩 7.5 美元自由現金流（299÷3,970，推導）。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;要留意&lt;/b&gt;IFRS 現金流含銀行放款與存款流量，圖表數字要對照本題口徑，見改判訊號。&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;shareholders&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;股東拿到什麼回報？&lt;/p&gt;&lt;h3&gt;不發股利，回購主要在抵銷股權薪酬與併購稀釋。&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;回購是主要回報：2024 年起累計授權 17.5 億，2026 年 9–10 月再回購 4 億、計畫剩約 5 億；公司稱剩餘部分完成後、以目前股價計可累計註銷逾 10% 股數（6-K 2026-11-03#1 §6–§7）。&lt;/strong&gt;工具的回購殖利率 2.1%（收盤 2026-11-13）、淨回購殖利率 0.2%（回購扣股權薪酬；收盤 2026-11-13），以及首頁「近四季回購 2.7 億」與存活檢查的回購 274，實際是 2025 財年全年值&lt;span class=&quot;src&quot;&gt;（20-F 2025-12-31 Item 5 ¶196；外國發行人只申報半年度 XBRL，工具以最近財年代替近四季）&lt;/span&gt;，淨回購也用 2025 財年股權薪酬 241。真正近四季（2025Q4–2026Q3）回購現金流出至少 4 億：2025 下半年為 0（全年 274＝上半年 274，6-K 2026-08-13 新聞稿 §108），2026 上半年預付 4 億（同檔 §87），9 月部分未揭露；以此計回購殖利率至少約 3.0%、扣近四季股權薪酬 234 後淨回購至少約 1.2%&lt;span class=&quot;src&quot;&gt;（市值 13,342，推導）&lt;/span&gt;。存活檢查差額 387 改用近四季回購計至少約 5.1 億&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;，仍小於 9/30 現金 2,848（6-K 2026-11-03#1 §56）。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;反方是股數仍在增加：2025 財年稀釋股數對上一財年 +5.3%（近一財年；股數期間 2024–2025）；2025 財年回購均價約 4.68 美元，高於合理價值上緣 3.94 美元&lt;span class=&quot;src&quot;&gt;（20-F Item 16E，推導）&lt;/span&gt;。&lt;/strong&gt;Stash 剩餘 49.9% 可用 A 類股支付（6-K 2026-08-13 §174–§175）。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;股東回饋對自由現金流（億美元）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 300&quot; role=&quot;img&quot; aria-label=&quot;股東回饋&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;266.0&quot; y2=&quot;266.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;270.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;-2.5&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;217.6&quot; y2=&quot;217.6&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;221.6&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;0.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;169.2&quot; y2=&quot;169.2&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;173.2&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;2.5&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;120.8&quot; y2=&quot;120.8&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;124.8&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;5.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;72.4&quot; y2=&quot;72.4&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;76.4&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;7.5&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;24.0&quot; y2=&quot;24.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;28.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;10.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;217.6&quot; y2=&quot;217.6&quot; class=&quot;zero&quot;/&gt;&lt;rect x=&quot;70.3&quot; y=&quot;217.6&quot; width=&quot;26.5&quot; height=&quot;1.0&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;回購 FY23：0.0&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;98.8&quot; y=&quot;217.6&quot; width=&quot;26.5&quot; height=&quot;1.0&quot; rx=&quot;2&quot; fill=&quot;var(--c3)&quot;&gt;&lt;title&gt;股利 FY23：0.0&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;127.2&quot; y=&quot;214.7&quot; width=&quot;26.5&quot; height=&quot;2.9&quot; rx=&quot;2&quot; fill=&quot;var(--c2)&quot;&gt;&lt;title&gt;自由現金流 FY23：0.1&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;113.0&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY23&lt;/text&gt;&lt;rect x=&quot;192.3&quot; y=&quot;173.8&quot; width=&quot;26.5&quot; height=&quot;43.8&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;回購 FY24：2.3&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;220.8&quot; y=&quot;217.6&quot; width=&quot;26.5&quot; height=&quot;1.0&quot; rx=&quot;2&quot; fill=&quot;var(--c3)&quot;&gt;&lt;title&gt;股利 FY24：0.0&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;249.2&quot; y=&quot;67.6&quot; width=&quot;26.5&quot; height=&quot;150.0&quot; rx=&quot;2&quot; fill=&quot;var(--c2)&quot;&gt;&lt;title&gt;自由現金流 FY24：7.8&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;235.0&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY24&lt;/text&gt;&lt;rect x=&quot;314.3&quot; y=&quot;164.6&quot; width=&quot;26.5&quot; height=&quot;53.0&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;回購 FY25：2.7&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;342.8&quot; y=&quot;217.6&quot; width=&quot;26.5&quot; height=&quot;1.0&quot; rx=&quot;2&quot; fill=&quot;var(--c3)&quot;&gt;&lt;title&gt;股利 FY25：0.0&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;371.2&quot; y=&quot;217.6&quot; width=&quot;26.5&quot; height=&quot;3.5&quot; rx=&quot;2&quot; fill=&quot;var(--c2)&quot;&gt;&lt;title&gt;自由現金流 FY25：-0.2&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;357.0&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY25&lt;/text&gt;&lt;rect x=&quot;436.3&quot; y=&quot;164.6&quot; width=&quot;26.5&quot; height=&quot;53.0&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;回購 近四季：2.7&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;464.8&quot; y=&quot;217.6&quot; width=&quot;26.5&quot; height=&quot;1.0&quot; rx=&quot;2&quot; fill=&quot;var(--c3)&quot;&gt;&lt;title&gt;股利 近四季：0.0&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;493.2&quot; y=&quot;217.6&quot; width=&quot;26.5&quot; height=&quot;21.9&quot; rx=&quot;2&quot; fill=&quot;var(--c2)&quot;&gt;&lt;title&gt;自由現金流 近四季：-1.1&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;479.0&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;近四季&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c1)&quot;&gt;&lt;/i&gt;回購&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c3)&quot;&gt;&lt;/i&gt;股利&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c2)&quot;&gt;&lt;/i&gt;自由現金流&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;白話說&lt;/b&gt;以 2025 財年計，每 100 美元市值回購約 2 美元、扣股權薪酬後只剩約 0.2 美元；改用近四季（2026 上半年已付 4 億），回購至少約 3 美元、淨回購至少約 1.2 美元（推導）。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;要留意&lt;/b&gt;回購金額大不等於股數下降；看股數年變化，見改判訊號。&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;股東回報與市價隱含報酬拆解&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;現價隱含基準年報酬約 9.0%&lt;span class=&quot;src&quot;&gt;（基準情境成真時、以收盤 2026-11-13 股價買進的推算年報酬；條件式，非預期報酬、非買賣建議）&lt;/span&gt;＝股利 0%＋回購 2.1%&lt;span class=&quot;src&quot;&gt;（2025 財年口徑；近四季至少約 3.0%，見第四題）&lt;/span&gt;＋每股成長與其他 6.9%&lt;span class=&quot;src&quot;&gt;（推算，假設倍數不變）&lt;/span&gt;，高於 10 年期公債 5.15%；淨回購扣股權薪酬以 2025 財年計只剩約 0.2%&lt;span class=&quot;src&quot;&gt;（近四季至少約 1.2%，推導）&lt;/span&gt;，回報主要靠成長。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;現價隱含年報酬（基準情境，非預期報酬）從哪裡來：股利、回購是現在拿到的現金，其餘要靠每股成長（紅色虛線為 10 年期美國公債 5.15%）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 500 196&quot; role=&quot;img&quot; aria-label=&quot;市價隱含報酬拆解&quot; class=&quot;chart&quot; style=&quot;max-width:650px&quot;&gt;&lt;line x1=&quot;250.0&quot; x2=&quot;250.0&quot; y1=&quot;24&quot; y2=&quot;192&quot; class=&quot;zero&quot;/&gt;&lt;line x1=&quot;352.7&quot; x2=&quot;352.7&quot; y1=&quot;22&quot; y2=&quot;192&quot; class=&quot;price&quot;/&gt;&lt;text x=&quot;352.7&quot; y=&quot;16&quot; class=&quot;pricelab&quot; text-anchor=&quot;middle&quot;&gt;公債 5.15%&lt;/text&gt;&lt;text x=&quot;240&quot; y=&quot;55.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;股利殖利率&lt;/text&gt;&lt;rect x=&quot;250.0&quot; y=&quot;40.0&quot; width=&quot;2.0&quot; height=&quot;20&quot; rx=&quot;4&quot; fill=&quot;var(--c2)&quot;&gt;&lt;title&gt;股利殖利率：0.00%&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;258.0&quot; y=&quot;55.0&quot; class=&quot;val&quot;&gt;0.00%&lt;/text&gt;&lt;line x1=&quot;250.0&quot; x2=&quot;250.0&quot; y1=&quot;60.0&quot; y2=&quot;80.0&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;1&quot; stroke-dasharray=&quot;2 3&quot;/&gt;&lt;text x=&quot;240&quot; y=&quot;95.0&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;回購殖利率&lt;/text&gt;&lt;rect x=&quot;250.0&quot; y=&quot;80.0&quot; width=&quot;40.9&quot; height=&quot;20&quot; rx=&quot;4&quot; fill=&quot;var(--c6)&quot;&gt;&lt;title&gt;回購殖利率：+2.05%&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;298.9&quot; y=&quot;95.0&qu =&quot;312&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;2025-11&lt;/text&gt;&lt;text x=&quot;584.0&quot; y=&quot;312&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;2026-11&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--ink)&quot;&gt;&lt;/i&gt;收盤價&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c3)&quot;&gt;&lt;/i&gt;200 日均線&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--pos)&quot;&gt;&lt;/i&gt;合理價值區間&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c7)&quot;&gt;&lt;/i&gt;同業與歷史倍數（交叉核對，不進評等）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;流動性、空單與參考值的資料日期與存檔（算法與完整表見&lt;a href=&quot;#wp-mkt&quot;&gt;計算底稿 市場背景&lt;/a&gt;）。&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;valuation&quot;&gt;&lt;div class=&quot;qno&quot;&gt;問題 05&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;現在價格合理嗎？&lt;/div&gt;&lt;h2&gt;現價落在合理區、略低於中點，但對現金口徑很敏感。&lt;/h2&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;現價落在合理區：合理價值 2.88–3.94 美元（中點 3.41 美元），收盤 3.24 美元，價格位置 合理，&lt;a class=&quot;term&quot; href=&quot;#g7&quot;&gt;買入區上緣&lt;/a&gt; 2.39 美元。&lt;/strong&gt;估值只算叫車與外送平台的現金流，金融服務以帳面淨額計（作者判斷）。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;基準情境的故事是成長放慢、利潤率變厚：平台營收成長由 16% 逐年降到 9%，營業利益率靠規模攤薄區域費用，逐步升到穩態 19%。&lt;/strong&gt;市價隱含成長 12.1%&lt;span class=&quot;src&quot;&gt;（市價反推未來 5 年營收年增；市價 3.24 美元、收盤 2026-11-13；折現率 9.02%；推導）&lt;/span&gt;，和基準相當，市場已計入這個故事。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;反方是結論對口徑很敏感&lt;span class=&quot;src&quot;&gt;（計算核對，推導）&lt;/span&gt;：若只計現金、不計 46 億其他投資，中點約低 28.8%，位置變偏貴。&lt;/strong&gt;Atome 對價全扣約 −10.6%（只扣實際流出約 −8.8%），資料中心出資約 −5.3%；現行估值都沒扣。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;兩年股價走勢與估值區間（美元）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 680 320&quot; role=&quot;img&quot; aria-label=&quot;股價與估值區間&quot; clas b&gt;收盤股價 3.24 美元是合理價值中點 3.41 美元的 0.95 倍；現價隱含年報酬（基準情境，非預期報酬）9.0%。這兩個數字只描述現價與本報告合理價值的距離，不改價格位置與研究評等；現價隱含年報酬是基準情境成真時的條件式推算，不是預期報酬。非買賣建議。&lt;/p&gt;&lt;!--成長型價格參考--&gt;&lt;p id=&quot;growth-ref-plain&quot;&gt;&lt;b&gt;成長型價格參考（只描述）：&lt;/b&gt;下表是各情境成真時，年報酬要達到門檻所對應的每股價格（報酬門檻價），可與收盤 2026-11-13 股價 3.24 美元並排看；股價低於某一格，代表該情境成真時的推算年報酬高於那個門檻。五年報酬矩陣與林區比值（算法與完整表見&lt;a href=&quot;#wp-5&quot;&gt;計算底稿 5&lt;/a&gt;）。這一段只描述，不進研究評等、不改價格位置，也不是目標價；三種情境並列、不合成單一數字，數字是「該情境成真時」的條件式推算，不是預期報酬。非買賣建議。&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;報酬門檻價（三情境並列；條件式推算，非目標價、非買賣建議）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;年報酬 7% 的每股價格（美元）&lt;/th&gt;&lt;th&gt;年報酬 8% 的每股價格（美元）&lt;/th&gt;&lt;th&gt;年報酬 9% 的每股價格（美元）&lt;/th&gt;&lt;th&gt;年報酬 10% 的每股價格（美元）&lt;/th&gt;&lt;th&gt;現價隱含年報酬&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;2.62&lt;/td&gt;&lt;td&gt;2.29&lt;/td&gt;&lt;td&gt;2.07&lt;/td&gt;&lt;td&gt;1.91&lt;/td&gt;&lt;td&gt;5.9%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;4.56&lt;/td&gt;&lt;td&gt;3.75&lt;/td&gt;&lt;td&gt;3.23&lt;/td&gt;&lt;td&gt;2.87&lt;/td&gt;&lt;td&gt;9.0%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;7.98&lt;/td&gt;&lt;td&gt;6.21&lt;/td&gt;&lt;td&gt;5.15&lt;/td&gt;&lt;td&gt;4.44&lt;/td&gt;&lt;td&gt;13.0%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;!--/成長型價格參考--&gt;&lt;!--新圖表--&gt;&lt;div class=&quot;wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;報酬門檻價階梯（美元）：各情境成真時，要每年賺到 7%～10% 的買進價格；紅色虛線為收盤價 3.24（2026-11-13）。點在虛線右邊＝現價低於該門檻價。條件式推算，不是目標價、不是預期報酬，非買賣建議（估值結果.json#/成長型價格參考/報酬門檻價）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 620 304&quot; role=&quot;img&quot; aria-label=&quot;報酬門檻價階梯&quot; class=&quot;chart&quot; style=&quot;max-width:775px&quot;&gt;&lt;line x1=&quot;150.0&quot; x2=&quot;150.0&quot; y1=&quot;22&quot; y2=&quot;278&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;150.0 ot;var(--c1)&quot;&gt;基準 3&lt;/text&gt;&lt;circle cx=&quot;345.2&quot; cy=&quot;247.0&quot; r=&quot;7&quot; fill=&quot;var(--c2)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;1.5&quot;&gt;&lt;title&gt;樂觀：4&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;345.2&quot; y=&quot;233.0&quot; class=&quot;val&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--c2)&quot;&gt;樂觀 4&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;!--/新圖表--&gt;&lt;!--目標區間:正文--&gt;&lt;div class=&quot;block&quot; id=&quot;target-plain&quot;&gt;&lt;h3&gt;12 個月條件式目標區間（條件式、非買賣建議）&lt;/h3&gt;&lt;p&gt;如果三種情境各自成真，一年後（至 2027-11-13）每股價值大約落在：保守 2.03–2.48、基準 3.00–4.04、樂觀 4.59–6.68 美元。這是條件式區間，不是股價預測，三段不合成單一數字。&lt;/p&gt;&lt;h4 style=&quot;margin-top:14px&quot;&gt;下四季申報可以對照什麼&lt;/h4&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt&quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;近四季營收年增&lt;/th&gt;&lt;th&gt;近四季營業利益率&lt;/th&gt;&lt;th&gt;公司特定事件（原文位置）&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;&amp;lt; 12.5%&lt;/td&gt;&lt;td&gt;&amp;lt; 9.50%&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;叫車分部調整後 EBITDA 占 GMV 連兩季低於 8%（印尼兩輪抽成已自 2026-07-01 由 20% 降到 8%，據媒體報導），或印尼把抽成上限擴及四輪、司機改列準雇員的規定正式生效（20-F 2025-12-31 Item 3 ¶87；6-K 2026-11-03#1 新聞稿 §16）；金融服務逾 90 天不良貸款率由 2.6% 升破 4%，或預期信用損失準備對不良貸款覆蓋降到 1.5 倍以下（6-K 2026-11-03#1 新聞稿 §19–§20）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;12.5%–19.0%&lt;/td&gt;&lt;td&gt;9.50%–10.75%&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;2026 全年集團營收落在指引 41.5–42.0 億、調整後 EBITDA 7.9–8.0 億內，平台單季營收年增維持 14–18%（6-K 2026-11-03#2 新聞稿 §3、§16）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;&amp;gt; 19.0%&lt;/td&gt;&lt;td&gt;&amp;gt; 10.75%&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;2027 年度指引延續 2028 調整後 EBITDA 17 億、2025–2028 集團營收年複合 30% 以上的路徑（2026-09-15 上調、含 Atome；6-K 2026-09-15#3 附件 §0），且外送分部調整後 EBITDA 占 GMV 續升到 3% 以上（6-K 2026-02-11#2 新聞稿 §10；6-K 2026-11-03#1 新聞稿 §11–§12）&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;近四季營業利益率 5.1%，較接近保守情境。門檻以相鄰情境第 1 年假設的中線為界，只描述哪個情境比較接近，不改機率與研究評等；近四季是未調整的報表數字，作者訂第 1 年假設時若扣除不外推的項目（見本題正文），扣除後可能較接近別的情境；下四季申報後對照，不自動重算目標區間。&lt;/p&gt;&lt;p class=&quot;cap&quot;&gt;算法、關鍵假設、各段需要的市場條件與失效事件（算法與完整表見&lt;a href=&quot;#wp-5&quot;&gt;計算底稿 5&lt;/a&gt;）。&lt;/p&gt;&lt;/div&gt;&lt;!--/目標區間:正文--&gt;&lt;div class=&quot;block&quot; id=&quot;market-demand&quot;&gt;&lt;h3&gt;市價在要求什麼：成長端與倍數端，對照過去實績與模型假設&lt;/h3&gt;&lt;div class=&quot;grid2 wide&quot;&gt;&lt;figure class=figure&gt;&lt;p class=cap&gt;成長端：市價要成立，未來 5 年營收每年要成長多少（紅點基準折現率、線段高低折現率），對照過去實績與模型基準假設（成長推估底稿.json 六、成長性四問並列；推導，只描述）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 150&quot; role=&quot;img&quot; aria-label=&quot;市價要求的成長&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;230.0&quot; x2=&quot;230.0&quot; y1=&quot;8&quot; y2=&quot;128&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;230.0&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;0%&lt;/text&gt;&lt;line x1=&quot;316.7&quot; x2=&quot;316.7&quot; y1=&quot;8&quot; y2=&quot;128&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;316.7&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;20%&lt;/text&gt;&lt;line x1=&quot;403.3&quot; x2=&quot;403.3&quot; y1=&quot;8&quot; y2=&quot;128&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;403.3&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;40%&lt;/text&gt;&lt;line x1=&quot;490.0&quot; x2=&quot;490.0&quot; y1=&quot;8&quot; y2=&quot;128&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;490.0&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;60%&lt;/text&gt;&lt;text x=&quot;220&quot; y=&quot;27&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;過去實績（2020–2025 年複合）&lt;/text&gt;&lt;circle cx=&quot;439.5&quot; cy=&quot;22&quot; r=&quot;7&quot; fill=&quot;var(--c3)&quot;&gt;&lt;title&gt;過去實績（2020–2025 年複合）：48%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;451.5&quot; y=&quot;27&quot; class=&quot;val&quot;&gt;48%&lt;/text&gt;&lt;text x=&quot;220&quot; y=&quot;67&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;模型基準（未來 5 年平均）&lt;/text&gt;&lt;circle cx=&quot;283.3&quot; cy=&quot;62&quot; r=&quot;7&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;模型基準（未來 5 年平均）：12%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;295.3&quot; y=&quot;67&quot; class=&quot;val&quot;&gt;12%&lt;/text&gt;&lt;text x=&quot;220&quot; y=&quot;107&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;市價要求（未來 5 年年增）&lt;/text&gt;&lt;line x1=&quot;264.6&quot; x2=&quot;306.6&quot; y1=&quot;102&quot; y2=&quot;102&quot; stroke=&quot;var(--neg)&quot; stroke-width=&quot;3&quot; opacity=&quot;.55&quot;/&gt;&lt;circle cx=&quot;282.4&quot; cy=&quot;102&quot; r=&quot;7&quot; fill=&quot;var(--neg)&quot;&gt;&lt;title&gt;市價要求（未來 5 年年增）：12%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;318.6&quot; y=&quot;107&quot; class=&quot;val&quot;&gt;12%&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;figure class=figure&gt;&lt;p class=cap&gt;倍數端：市價要成立，第 10 年出場 EV/EBIT 要多少倍（紅點基準折現率、線段高低折現率），對照模型假設與分產業參考帶 p25–p75（灰帶，直線為中位；估值結果.json#/market_implied_terminal；只描述，不是目標價、不進評等）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 150&quot; role=&quot;img&quot; aria-label=&quot;市價隱含第 10 年倍數&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;172.0&quot; x2=&quot;172.0&quot; y1=&quot;8&quot; y2=&quot;128&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;172.0&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;0 倍&lt;/text&gt;&lt;line x1=&quot;251.5&quot; x2=&quot;251.5&quot; y1=&quot;8&quot; y2=&quot;128&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;251.5&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;10 倍&lt;/text&gt;&lt;line x1=&quot;331.0&quot; x2=&quot;331.0&quot; y1=&quot;8&quot; y2=&quot;128&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;331.0&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;20 倍&lt;/text&gt;&lt;line x1=&quot;410.5&quot; x2=&quot;410.5&quot; y1=&quot;8&quot; y2=&quot;128&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;410.5&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;30 倍&lt;/text&gt;&lt;line x1=&quot;490.0&quot; x2=&quot;490.0&quot; y1=&quot;8&quot; y2=&quot;128&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;490.0&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;40 倍&lt;/text&gt;&lt;rect x=&quot;206.2&quot; y=&quot;11&quot; width=&quot;202.7&quot; height=&quot;22&quot; rx=&quot;4&quot; fill=&quot;var(--line)&quot;&gt;&lt;title&gt;服務與教育 參考帶 p25–p75（機械回測樣本，非市場全體；分產業的筆數與公司數少，僅供參考）&lt;/title&gt;&lt;/rect&gt;&lt;line x1=&quot;327.0&quot; x2=&quot;327.0&quot; y1=&quot;11&quot; y2=&quot;33&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;162&quot; y=&quot;27&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;參考帶（服務與教育）&lt;/text&gt;&lt;text x=&quot;416.9&quot; y=&quot;27&quot; class=&quot;val&quot;&gt;4 倍–30 倍&lt;/text&gt;&lt;text x=&quot;162&quot; y=&quot;67&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;模型假設（第 10 年）&lt;/text&gt;&lt;circle cx=&quot;244.9&quot; cy=&quot;62&quot; r=&quot;7&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;模型假設（第 10 年）：9 倍&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;256.9&quot; y=&quot;67&quot; class=&quot;val&quot;&gt;9 倍&lt;/text&gt;&lt;text x=&quot;162&quot; y=&quot;107&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;市價隱含（第 10 年）&lt;/text&gt;&lt;line x1=&quot;239.4&quot; x2=&quot;256.5&quot; y1=&quot;102&quot; y2=&quot;102&quot; stroke=&quot;var(--neg)&quot; stroke-width=&quot;3&quot; opacity=&quot;.55&quot;/&gt;&lt;circle cx=&quot;245.8&quot; cy=&quot;102&quot; r=&quot;7&quot; fill=&quot;var(--neg)&quot;&gt;&lt;title&gt;市價隱含（第 10 年）：9 倍&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;268.5&quot; y=&quot;107&quot; class=&quot;val&quot;&gt;9 倍&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;p&gt;&lt;b&gt;成長端：&lt;/b&gt;市價要求未來 5 年營收年增約 12.1%（折現率高低 8.0%～17.7%），低於模型基準 5 年平均 12.3%、低於過去（2020–2025）實績 48.4%。&lt;/p&gt;&lt;p&gt;&lt;b&gt;倍數端：&lt;/b&gt;市價隱含第 10 年 &lt;a class=&quot;term&quot; href=&quot;#g9&quot;&gt;EV&lt;/a&gt;/EBIT 約 9.3 倍，高於模型 9.2 倍，在服務與教育參考帶 p25–p75（4.3–29.8 倍）內。&lt;/p&gt;&lt;p&gt;成功幾率（歷史基準比率）：模型基準 10 年實質年增 7.6%，同規模（營收 30–45 億美元）公司歷史上做到的比例 41%（歷史基準比率，非預測）。&lt;/p&gt;&lt;p class=&quot;cap&quot;&gt;兩端是同一條「模型價值＝市價」換不同未知數反解，方向必然一致，不是兩個獨立證據；幅度才有資訊。只描述，不進研究評等、不改價格位置與合理價值，不是目標價，非買賣建議。成長性四問細表、三視角反推、長期倍數條件（算法與完整表見&lt;a href=&quot;#wp-5&quot;&gt;計算底稿 5&lt;/a&gt;）。&lt;/p&gt;&lt;div class=&quot;note-box&quot;&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:14px&quot;&gt;市價要求的成長 vs 本報告與公司實績&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;營收年增&lt;/th&gt;&lt;th&gt;說明&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;市價反推（基準折現率 9.02%）&lt;/td&gt;&lt;td&gt;12.1%&lt;/td&gt;&lt;td&gt;未來 5 年平台營收每年，其他照基準（推導）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;市價反推（折現率 8.09%）&lt;/td&gt;&lt;td&gt;8.0%&lt;/td&gt;&lt;td&gt;折現率低一級&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;市價反推（折現率 10.44%）&lt;/td&gt;&lt;td&gt;17.7%&lt;/td&gt;&lt;td&gt;折現率高一級&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;本報告基準情境&lt;/td&gt;&lt;td&gt;12.3%&lt;/td&gt;&lt;td&gt;第 1–5 年平均（16／14／12／10.5／9%）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;平台近四季實績&lt;/td&gt;&lt;td&gt;18.0%&lt;/td&gt;&lt;td&gt;2025Q4–2026Q3（推導）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;平台最新一季&lt;/td&gt;&lt;td&gt;16.3%&lt;/td&gt;&lt;td&gt;2026Q3 年增（推導）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;公司 2026 指引（集團）&lt;/td&gt;&lt;td&gt;23–25%&lt;/td&gt;&lt;td&gt;含金融服務與併購&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p&gt;要撐住現價，市場等於要求未來 5 年營收每年成長約 12.1%（換折現率高低兩端約 8.0% 到 17.7%）。這個要求在同規模公司的歷史上屬「樂觀」。現價未高於合理價值上緣，下表只描述市場面，不代表有溢價。&lt;/p&gt;&lt;p class=&quot;cap&quot;&gt;三視角反推、假設對照實績、歷史基準比率與市價溢價來源（算法與完整表見&lt;a href=&quot;#wp-5&quot;&gt;計算底稿 5&lt;/a&gt;）。&lt;/p&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;作者的計算核對、方法限制與口徑說明：「缺口判斷的影響（計算核對，推導）」（算法與完整表見&lt;a href=&quot;#wp-5&quot;&gt;計算底稿 5&lt;/a&gt;）。&lt;/p&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;白話說&lt;/b&gt;現價隱含基準情境年報酬約 9.0%（基準情境成真時、以收盤 2026-11-13 股價買進的推算年報酬；條件式，非預期報酬、非買賣建議）（非預期報酬），比 10 年期公債 5.15% 多約 3.8 個百分點。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;要留意&lt;/b&gt;合理價值是區間不是目標價；口徑一改位置就可能跨界，見改判訊號。&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;value&quot;&gt;&lt;div class=&quot;qno&quot;&gt;價值判斷&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;價值判斷：用彼得林奇的方法再看一次&lt;/div&gt;&lt;h2&gt;快速成長兼轉機股，價格合理但不便宜。&lt;/h2&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;林區分類&lt;/b&gt;快速成長；兼具轉機（2025 年首度全年獲利）&lt;br&gt;成長能否持續、擴張是否有利可圖、資產負債表能否支撐&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;研究評等&lt;/b&gt;&lt;span style=&quot;font-size:20px;font-weight:700&quot;&gt;生意 B ／ 價格合理&lt;/span&gt;&lt;br&gt;生意品質依五項證據評定；價格位置三級（買入區、合理、偏貴），依買入上限與合理價值高端判斷，同業與歷史倍數只作交叉核對。非買賣建議。&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;林區分類是快速成長、兼具轉機：2024、2025 營收年增 18.6%、20.5%，2025 首度全年獲利（長期財務.json）。&lt;/strong&gt;這類股看成長能否延續、擴張是否賺錢、資產負債表能否撐住；後兩項過關，第一項在減速。&lt;/p&gt;&lt;p&gt;本益比 32.4 倍（扣非經常 EPS；收盤 2026-11-13）、近四季 PEG 0.49&lt;span class=&quot;src&quot;&gt;（成長口徑 近四季對上一財年、扣非經常 66.7%；收盤 2026-11-13）&lt;/span&gt;看似便宜，但工具標的「扣非經常」並未真的扣除：EPS 是申報稀釋 EPS 推導，含 2026 前九月財務收入 449、其中 Superbank 原持股重估利得 322（6-K 2026-08-13 §41；估值輸入 company_metrics.eps_note），本益比與近四季 PEG 的基期失真、不具參考性；改用基準情境 PEG 1.19&lt;span class=&quot;src&quot;&gt;（成長口徑 基準情境推估、稅後營業利益年增－股數年變化 27.3%；收盤 2026-11-13）&lt;/span&gt;，約等於合理。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;grid2 wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;現金與證券 vs 有息負債（億美元），上方為淨現金&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 300&quot; role=&quot;im
