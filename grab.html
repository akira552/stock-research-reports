&quot;9&quot; width=&quot;222.7&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c1)&quot;/&gt;&lt;text x=&quot;427.7&quot; y=&quot;23&quot; class=&quot;val&quot;&gt;30&lt;/text&gt;&lt;text x=&quot;187&quot; y=&quot;63&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;Hungate（買進）&lt;/text&gt;&lt;rect x=&quot;197.0&quot; y=&quot;49&quot; width=&quot;6.5&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c1)&quot;/&gt;&lt;text x=&quot;211.5&quot; y=&quot;63&quot; class=&quot;val&quot;&gt;0.9&lt;/text&gt;&lt;text x=&quot;187&quot; y=&quot;103&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;Tan（預設計畫賣出）&lt;/text&gt;&lt;rect x=&quot;197.0&quot; y=&quot;89&quot; width=&quot;53.9&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;258.9&quot; y=&quot;103&quot; class=&quot;val&quot;&gt;7.2&lt;/text&gt;&lt;text x=&quot;187&quot; y=&quot;143&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;Oey（預設計畫賣出）&lt;/text&gt;&lt;rect x=&quot;197.0&quot; y=&quot;129&quot; width=&quot;7.6&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;212.6&quot; y=&quot;143&quot; class=&quot;val&quot;&gt;1.0&lt;/text&gt;&lt;text x=&quot;187&quot; y=&quot;183&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;Hungate（預設計畫賣出）&lt;/text&gt;&lt;rect x=&quot;197.0&quot; y=&quot;169&quot; width=&quot;7.5&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;212.5&quot; y=&quot;183&quot; class=&quot;val&quot;&gt;1.0&lt;/text&gt;&lt;text x=&quot;187&quot; y=&quot;223&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;Ong（預設計畫賣出）&lt;/text&gt;&lt;rect x=&quot;197.0&quot; y=&quot;209&quot; width=&quot;5.9&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;210.9&quot; y=&quot;223&quot; class=&quot;val&quot;&gt;0.8&lt;/text&gt;&lt;text x=&quot;187&quot; y=&quot;263&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;Kandal（預設計畫賣出）&lt;/text&gt;&lt;rect x=&quot;197.0&quot; y=&quot;249&quot; width=&quot;5.2&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;210.2&quot; y=&quot;263&quot; class=&quot;val&quot;&gt;0.7&lt;/text&gt;&lt;text x=&quot;187&quot; y=&quot;303&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;Ong（非計畫賣出）&lt;/text&gt;&lt;rect x=&quot;197.0&quot; y=&quot;289&quot; width=&quot;2.0&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--neg)&quot;/&gt;&lt;text x=&quot;206.3&quot; y=&quot;303&quot; class=&quot;val&quot;&gt;0.2&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;生意品質：B（規則：無「弱」且至少三項「強」＝A）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;評等&lt;/th&gt;&lt;th&gt;理由&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;護城河&lt;/td&gt;&lt;td&gt;中&lt;/td&gt;&lt;td&gt;東南亞八國叫車與外送雙邊網路：2026Q3 月交易用戶 5,720 萬、外送 GMV 年增 21% 且分部調整後 EBITDA 占 GMV 由 2.1% 升到 2.7%、司機年增 20%，獎勵金占 GMV 季減 17 個基點、但年增約 65 個基點（推導：737÷6,835 對 585÷5,774；GRAB-C01；6-K 2026-11-03 §0、§3、§11–§16）；Uber、Ryde 申報把 Grab 列為主要競爭者（全文搜尋 Q1）。限制：叫車利潤率持平、無定價權證據，印尼抽成上限可能由 20% 降到 10%（GRAB-C02；20-F 2025-12-31 Item 3 ¶87）。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;投入資本報酬與增量回報&lt;/td&gt;&lt;td&gt;弱&lt;/td&gt;&lt;td&gt;2021–2024 營業利益皆為負，2025 首度全年營業利益 65（長期財務.json）；營運投入資本為負，ROIC 不適用，增量 ROIC 分母小而不穩定（GRAB-C08；財務指標.json#/最新/ROIC_不適用原因）；2026 年連續併購 Superbank、Stash、Atome，回報待驗證且 Stash 剩餘款未單獨揭露、Atome 對價為現金 14.9 億美元（GRAB-C12；6-K 2026-08-13 §174、6-K 2026-09-15 本文 §2）。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;自由現金流品質&lt;/td&gt;&lt;td&gt;中&lt;/td&gt;&lt;td&gt;IFRS 營運現金流近四季 121 受銀行存款流入與放款撥款扭曲（GRAB-C09；6-K 2026-11-03 §7）；公司調整後自由現金流近四季 533（§10，非 IFRS），作者剔除放款與存款流量推導約 575（121＋放款 1,196－存款 509－資本支出 233，作者校正.json#/季度補值）；股權薪酬近四季 234、約營收 6%（推導）是實際成本。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;資產負債表&lt;/td&gt;&lt;td&gt;強&lt;/td&gt;&lt;td&gt;2026-09-30 總現金流動性 71 億、公司口徑淨流動性 50 億（扣存款減放款 1.69 億後約 48 億，推導）（GRAB-C06、GRAB-C15；6-K 2026-11-03 §6、§56）；主要債務為 15 億零息可轉債、2030 年到期，帳列流動是因轉換權（6-K 2026-08-13 §91、20-F 2025-12-31 Item 19 ¶598）；銀行授信 5.29 億已用 3.75 億。銀行存款 27 億屬金融分部活期負債，以存款減放款淨額列其他請求權（作者判斷）。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;治理與資本配置&lt;/td&gt;&lt;td&gt;中&lt;/td&gt;&lt;td&gt;B 類股每股 45 票、創辦人控制（GRAB-C10；20-F 2025-12-31 Item 3 ¶420）；2024 年起累計授權回購 17.5 億（全部完成後公司稱可註銷逾 10% 股數），9–10 月再回購 4 億（GRAB-C11；6-K 2026-11-03#1 §6–§7），但 Stash 以約 2,100 萬股付款、剩餘款可付股票；2026 年連續併購、foodpanda 台灣遭否決須付分手費 6,000 萬（GRAB-C12；6-K 2026-11-03#1 §21）；原改判觸發「Stash 或 Atome 相關負債或承諾超過 5 億美元」已因 Atome 60% 現金對價 14.9 億美元成立（GRAB-C12；6-K 2026-09-15#1 附件 §9），作者判斷維持「中」、不下修：交割付款後公司口徑流動性淨額仍約 33–35 億（推導：9/30 約 48–50 億減 14.9 億；14.9 億含 2.6 億增資款留在集團內，按實際流出 12.3 億約 36–38 億，見第六題），交易金額與 2027Q3 前交割時程已揭露（附件 §9–§10），且第一階段以現金支付、不增加股數；第二階段約 2029 年依公式收購其餘 40%（股權估值 20–45 億美元，對應約 8–18 億，推導；至少 50% 付現金，其餘最多一半可能付股票而稀釋，作者判斷；6-K 2026-09-15#1 附件 §10），在 12 個月區間之外、金額隨 Atome 實際獲利變動且有上限，即使上限 18 億全付現金，以現有流動性推算仍約 15–17 億為正（推導，未計 2027–2029 年現金流），仍不下修（作者判斷）。2026-11-09 再承諾馬來西亞 AI 資料中心出資 7.5 億（GRAB-C12；6-K 2026-11-09#2 本文 §2–§3），資本配置延伸到本業以外的資本密集領域，但依開發與客戶合約里程碑分階段投入、合資條款待最終協議；Atome 與資料中心全額出資後公司口徑淨流動性約 27–30 億（推導，未計剩餘回購與期間自由現金流），仍為正，作者判斷維持「中」；最終協議若出資超過 7.5 億或提供擔保即下修（GRAB-C12 改判）。&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;PEG 三口徑、林區資產負債表檢查與 F 分數等交叉檢查（算法與完整表見&lt;a href=&quot;#wp-value&quot;&gt;計算底稿 價值判斷&lt;/a&gt;）。&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;capital&quot;&gt;&lt;div class=&quot;qno&quot;&gt;問題 06&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;財務體質與資本配置可靠嗎？&lt;/div&gt;&lt;h2&gt;現金充足、債務低，但出資承諾大、回報待驗證。&lt;/h2&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;償債沒有壓力：2026-09-30 借款 2,070（含租賃），遠低於&lt;a class=&quot;term&quot; href=&quot;#g3&quot;&gt;總現金流動性&lt;/a&gt;約 7,100（6-K 2026-11-03#1 §6、§56）。&lt;/strong&gt;主要債務是 15 億 2030 年到期零息可轉債，轉換價約 6.55 高於現價（6-K 2026-08-13 §92），因持有人可隨時轉換而帳列流動負債。&lt;/p&gt;&lt;p&gt;資本配置是主要疑問：2026 年連續買 &lt;a class=&quot;term&quot; href=&quot;#g13&quot;&gt;Superbank、Stash&lt;/a&gt;，9 月簽約以現金 14.9 億美元收購 Atome 60%，11 月又承諾馬來西亞 AI 資料中心出資 7.5 億（6-K 2026-09-15#1 附件 §9、6-K 2026-11-09#2 本文 §2）；兩項全額付出後，&lt;a class=&quot;term&quot; href=&quot;#g4&quot;&gt;公司口徑淨流動性&lt;/a&gt;由 9 月底 50 億（6-K 2026-11-03#2 §10）降到約 30 億&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;現金與證券 vs 有息負債（億美元），上方為淨現金&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 300&quot; role=&quot;img&quot; aria-label=&quot;資產負債&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;266.0&quot; y2=&quot;266.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;270.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;0.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;205.5&quot; y2=&quot;205.5&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;209.5&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;10.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;145.0&quot; y2=&quot;145.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;149.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;20.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;84.5&quot; y2=&quot;84.5&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;88.5&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;30.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;24.0&quot; y2=&quot;24.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;28.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;40.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;266.0&quot; y2=&quot;266.0&quot; class=&quot;zero&quot;/&gt;&lt;rect x=&quot;76.4&quot; y=&quot;76.2&quot; width=&quot;54.9& &gt;&lt;i style=&quot;background:var(--c5)&quot;&gt;&lt;/i&gt;有息負債&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;shareholder-equity&quot;&gt;&lt;h3&gt;股東回報與權益（逐年）&lt;/h3&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;財年&lt;/th&gt;&lt;th&gt;股東權益（億美元）&lt;/th&gt;&lt;th&gt;ROE&lt;/th&gt;&lt;th&gt;每股帳面（美元，推導）&lt;/th&gt;&lt;th&gt;股利（億美元）&lt;/th&gt;&lt;th&gt;回購（億美元）&lt;/th&gt;&lt;th&gt;（股利＋回購）÷ 自由現金流&lt;/th&gt;&lt;th&gt;稀釋股數年變化&lt;/th&gt;&lt;th&gt;註記&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2018&lt;/td&gt;&lt;td&gt;-10.7&lt;/td&gt;&lt;td&gt;不適用（股東權益 ≤ 0）&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2019&lt;/td&gt;&lt;td&gt;-42.2&lt;/td&gt;&lt;td&gt;不適用（股東權益 ≤ 0）&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2020&lt;/td&gt;&lt;td&gt;-64.0&lt;/td&gt;&lt;td&gt;不適用（股東權益 ≤ 0）&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2021&lt;/td&gt;&lt;td&gt;77.3&lt;/td&gt;&lt;td&gt;-517.1%&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2022&lt;/td&gt;&lt;td&gt;66.0&lt;/td&gt;&lt;td&gt;-23.5%&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;0.0&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2023&lt;/td&gt;&lt;td&gt;64.5&lt;/td&gt;&lt;td&gt;-6.7%&lt;/td&gt;&lt;td&gt;1.66&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;0.0&lt;/td&gt;&lt;td&gt;0%&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2024&lt;/td&gt;&lt;td&gt;64.0&lt;/td&gt;&lt;td&gt;-1.6%&lt;/td&gt;&lt;td&gt;1.60&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;2.3&lt;/td&gt;&lt;td&gt;29%&lt;/td&gt;&lt;td&gt;+2.6%&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2025&lt;/td&gt;&lt;td&gt;67.3&lt;/td&gt;&lt;td&gt;4.1%&lt;/td&gt;&lt;td&gt;1.60&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;2.7&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;+5.3%&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;長期財務.json（股東權益、稀釋股數〔分割調整〕、總資產；每股帳面＝股東權益 ÷ 稀釋股數，推導；股利支付、回購、營運現金流、資本支出在財務歷史.json 沒有該年時用）；產業指標.json 逐年（ROE）；財務歷史.json annual（股利、回購、營運現金流、資本支出）。用到：財務歷史。ROE 註記門檻：ROE 高於 60% 或股東權益 ÷ 總資產低於 10%；近三年回購合計達當年股東權益 50% 以上才歸因於回購。（股利＋回購）÷ 年底市值：專案沒有逐年年底市值資料，不列該欄。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;capital-plain&quot;&gt;&lt;h3&gt;融資與償債：還不還得起&lt;/h3&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;b&gt;信用評級&lt;/b&gt;　機構 未揭露（10-K、10-Q、8-K、SEC 全文搜尋 查無 S&amp;amp;P、Moody&amp;#x27;s、Fitch、KBRA 評級）／推導 AA（Damodaran 合成評等，利息保障 7.2 倍，推導）｜依推導：投資等級（BBB-／Baa3 以上）&lt;/p&gt;&lt;p&gt;&lt;b&gt;存活檢查（12～24 個月，推導，非違約預測）&lt;/b&gt;　資料不足（推導，非違約預測）：近四季回購加股利 274.0 百萬美元，超過自由現金流 -113.0 百萬美元，差額 387.0 百萬美元要靠現金或借款；會計師未提出繼續經營疑慮；利息保障 7.2 倍。&lt;/p&gt;&lt;p&gt;&lt;b&gt;利率壓力測試&lt;/b&gt;　未取得（缺 浮動利率債、兩年內到期本金，對應情境未取得（不補值））&lt;/p&gt;&lt;p&gt;&lt;b&gt;借款用途&lt;/b&gt;　混合&lt;/p&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;償債指標、融資活動表、存活檢查明細與利率壓力測試（算法與完整表見&lt;a href=&quot;#wp-6&quot;&gt;計算底稿 6&lt;/a&gt;）。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;財務管理&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;依 9/30 新聞稿，公司口徑淨流動性（總現金流動性減借款）50 億，扣存款減放款 1.69 億後約 48 億&lt;span class=&quot;src&quot;&gt;（6-K 2026-11-03#2 §10，推導）&lt;/span&gt;。&lt;/strong&gt;工具欄位現金與證券 2,848 百萬美元 只含現金、未含 46 億其他投資；有息負債 2,070 百萬美元（作者校正：原文 6-K 2026-11-03；6-K 2026-11-03#1 新聞稿 §56） 已依資產負債表流動與非流動借款合計作者校正（原工具只取非流動 452，§56）。&lt;/p&gt;&lt;p&gt;Atome 實際流出約 12.3 億、資料中心 7.5 億、foodpanda 分手費 0.6 億全額付出後，公司口徑淨流動性約 30 億&lt;span class=&quot;src&quot;&gt;（推導，未計期間自由現金流與回購）&lt;/span&gt;，貼近改判門檻 30 億，見改判訊號。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;資產變化&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;最大的資產變化是金融放款：組合 27.11 億、年增 200%，不含 Superbank 年增 115%；對應銀行存款約 27 億（6-K 2026-11-03#1 §17–§20）。&lt;/strong&gt;原因已解釋（併購與放款擴張），但信用品質尚未經過完整循環。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;逾 90 天不良貸款 2.6%、預期信用損失準備 6.5%、覆蓋約 2.4 倍，目前未見惡化（§19–§20）；改判門檻見改判訊號。&lt;/strong&gt;Superbank 商譽約 4.9 億（6-K 2026-08-13 §167），未計入估值。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;公司內部治理&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;雙重股權讓創辦人控制公司：B 類股每股 45 票，由創辦人等持有&lt;span class=&quot;src&quot;&gt;（20-F 2025-12-31 Item 3 ¶420）&lt;/span&gt;，外部股東對資本配置影響有限。&lt;/p&gt;&lt;p&gt;原改判觸發（併購承諾超過 5 億美元）已因 Atome 成立，作者判斷治理與資本配置仍維持「中」：兩項出資都換得資產或股權，交易金額與時程已揭露，第一階段以現金支付；Atome 其餘 40% 約 2029 年依公式收購（6-K 2026-09-15#1 附件 §10），在 12 個月區間之外。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;業務治理&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;最大的監管風險在印尼：草案可能把抽成上限降到 10%、司機改列準雇員&lt;span class=&quot;src&quot;&gt;（20-F 2025-12-31 Item 3 ¶87）&lt;/span&gt;；兩輪抽成已自 2026-07-01 由 20% 降到 8%（新聞 N1），Q3 叫車分部利潤率仍持平 8.9%（§16），影響公司未量化。&lt;/p&gt;&lt;p&gt;台灣公平會 2026-10 否決 foodpanda 台灣收購，分手費 6,000 萬記入 2026Q4（6-K 2026-11-03#1 §21），約每股 1.5 美分&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;，估值未扣。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;白話說&lt;/b&gt;每 100 美元總現金流動性，借款約 29 美元（2,070÷7,100，推導）。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;要留意&lt;/b&gt;工具的有息負債欄位與新聞稿借款口徑不同，見本題財務管理。&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;events&quot;&gt;&lt;div class=&quot;qno&quot;&gt;問題 07&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;最近發生什麼、接下來看什麼？&lt;/div&gt;&lt;h2&gt;Q3 年增 27%、上調全年指引；後看 Atome 與資料中心。&lt;/h2&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;2026Q3 集團營收年增 27%，公司第二度上調全年指引（6-K 2026-11-03#1 §0、§3）。&lt;/strong&gt;9 月以現金 14.9 億美元簽約收購 Atome 60%；11 月 9 日與軟銀、&lt;a class=&quot;term&quot; href=&quot;#g15&quot;&gt;PETROS&lt;/a&gt;（沙撈越州國營能源公司）簽馬來西亞 AI 資料中心協議，Grab 分階段出資 7.5 億（6-K 2026-11-09#2 本文 §1–§3、附件 §16）。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;未驗證事項：Stash 交割付 50.1%（現金 7,800 萬美元加約 2,100 萬股），剩餘 49.9% 三年內按公允價值支付、金額未單獨揭露（6-K 2026-08-13 §174–§175）。&lt;/strong&gt;10 月回購股數未揭露；兩者與 Atome、資料中心出資估值都未扣（見第五題）。印尼抽成下調對營收的影響公司未量化。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;最近 8 季營收（億美元），上方為比去年同季&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 300&quot; role=&quot;img&quot; aria-label=&quot;8 季營收&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;266.0&quot; y2=&quot;266.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;270.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;0.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;185.3&quot; y2=&quot;185.3&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;189.3&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;5.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;104.7&quot; y2=&quot;104.7&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;108.7&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;10.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;24.0&quot; y2=&quot;24.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;28.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;15.0&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;266.0&quot; y2=&quot;266.0&quot; class=&quot;zero&quot;/&gt;&lt;rect x=&quot;64.2&quot; y=&quot;133.9&quot; width=&quot;54.9&quot; height=&quot;132.1&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;單季營收 FY25 Q2：8.2&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;92.7&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY25 Q2&lt;/text&gt;&lt;rect x=&quot;145.5&quot; y=&quot;125.2&quot; width=&quot;54.9&quot; height=&quot;140.8&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;單季營收 FY25 Q3：8.7&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;174.0&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY25 Q3&lt;/text&gt;&lt;rect x=&quot;226.9&quot; y=&quot;119.8&quot; width=&quot;54.9&quot; height=&quot;146.2&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;單季營收 FY25 Q4：9.1&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;255.3&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY25 Q4&lt;/text&gt;&lt;rect x=&quot;308.2&quot; y=&quot;111.9&quot; width=&quot;54.9&quot; height=&quot;154.1&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;單季營收 FY26 Q1：9.6&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;336.7&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY26 Q1&lt;/text&gt;&lt;rect x=&quot;389.5&quot; y=&quot;105.2&quot; width=&quot;54.9&quot; height=&quot;160.8&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;單季營收 FY26 Q2：10.0&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;418.0&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY26 Q2&lt;/text&gt;&lt;text x=&quot;418.0&quot; y=&quot;16.0&quot; class=&quot;note&quot; text-anchor=&quot;middle&quot;&gt;+22%&lt;/text&gt;&lt;rect x=&quot;470.9&quot; y=&quot;86.6&quot; width=&quot;54.9&quot; height=&quot;179.4&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;單季營收 FY26 Q3：11.1&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;499.3&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;FY26 Q3&lt;/text&gt;&lt;text x=&quot;499.3&quot; y=&quot;16.0&quot; class=&quot;note&quot; text-anchor=&quot;middle&quot;&gt;+27%&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c1)&quot;&gt;&lt;/i&gt;單季營收&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;近期事件與後續觀察（存檔原文與已核對新聞）&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;下表列本報告用到的近期事件；交割與最終協議都還沒發生，發生時股權橋與目標區間要重算。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;figure&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt signals&quot;&gt;&lt;tr&gt;&lt;th&gt;日期&lt;/th&gt;&lt;th&gt;事件&lt;/th&gt;&lt;th&gt;對判斷的影響&lt;/th&gt;&lt;th&gt;出處&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2026-07-01&lt;/td&gt;&lt;td&gt;印尼兩輪叫車抽成由 20% 降到 8%&lt;/td&gt;&lt;td&gt;利潤率風險部分實現，叫車分部利潤率 Q3 仍持平&lt;/td&gt;&lt;td&gt;新聞 N1；6-K 2026-11-03#1 §16&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2026-09-15&lt;/td&gt;&lt;td&gt;簽約收購 Atome 60%，現金 14.9 億&lt;/td&gt;&lt;td&gt;交割後現金減少約 12.3 億（推導），估值未扣&lt;/td&gt;&lt;td&gt;6-K 2026-09-15#1 附件 §9–§10&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2026-10&lt;/td&gt;&lt;td&gt;台灣否決 foodpanda 台灣收購，分手費 6,000 萬&lt;/td&gt;&lt;td&gt;影響小，估值未扣&lt;/td&gt;&lt;td&gt;6-K 2026-11-03#1 §21；新聞 N4&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2026-11-03&lt;/td&gt;&lt;td&gt;Q3 營收年增 27%，全年指引第二度上修&lt;/td&gt;&lt;td&gt;支持基準情境&lt;/td&gt;&lt;td&gt;6-K 2026-11-03#1 §0、#2 §3&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2026-11-09&lt;/td&gt;&lt;td&gt;與軟銀、PETROS 簽馬來西亞 AI 資料中心協議，出資 7.5 億&lt;/td&gt;&lt;td&gt;資本配置延伸到新領域，估值未扣&lt;/td&gt;&lt;td&gt;6-K 2026-11-09#2 本文 §1–§3；新聞 N2&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;callouts&quot;&gt;&lt;div class=&quot;callout ex&quot;&gt;&lt;b&gt;白話說&lt;/b&gt;分手費 6,000 萬約等於每股 1.5 美分（推導），不到合理價值中點的 1%。&lt;/div&gt;&lt;div class=&quot;callout ca&quot;&gt;&lt;b&gt;要留意&lt;/b&gt;傳聞類事件沒有原文就不進估值，見改判訊號。&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;news&quot;&gt;&lt;p class=&quot;kicker&quot;&gt;近期新聞查證&lt;/p&gt;&lt;h3&gt;三則新聞都有原文核對，都支持既有風險判斷。&lt;/h3&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;新聞原文經擷取並逐句核對引句；Reuters 兩則付費牆、無法取得原文，不引用。&lt;/strong&gt;出資金額、分手費等事實以 6-K 原文為準，新聞只補公司申報沒提的事。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;新聞摘要（依日期排序）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;日期&lt;/th&gt;&lt;th&gt;來源&lt;/th&gt;&lt;th&gt;事件&lt;/th&gt;&lt;th&gt;我們的判讀&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2026-06-23&lt;/td&gt;&lt;td&gt;The Business Times（轉載 Reuters）&lt;/td&gt;&lt;td&gt;GoTo（印尼 Gojek 與 Tokopedia 母公司）與 Grab 印尼兩輪抽成 7 月起由 20% 降到 8%&lt;/td&gt;&lt;td&gt;利潤率風險部分實現，只限兩輪；公司申報未量化影響&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2026-10-21&lt;/td&gt;&lt;td&gt;Yahoo Finance 新加坡（The Edge）&lt;/td&gt;&lt;td&gt;台灣否決 Grab 收購 foodpanda 台灣&lt;/td&gt;&lt;td&gt;併購受反壟斷限制，分手費 6,000 萬由 6-K 證實，影響小&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2026-11-10&lt;/td&gt;&lt;td&gt;Yahoo Finance（GuruFocus）&lt;/td&gt;&lt;td&gt;Grab 宣布出資 7.5 億美元參與馬來西亞 AI 資料中心&lt;/td&gt;&lt;td&gt;資本配置延伸到資本密集新領域，回報待驗證&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;numbers&quot;&gt;&lt;div class=&quot;qno&quot;&gt;完整數字&lt;/div&gt;&lt;div class=&quot;qtitle&quot;&gt;三大報表摘要（年度與 8 季）&lt;/div&gt;&lt;h2&gt;營收、獲利、現金流與資產負債一次看&lt;/h2&gt;&lt;div class=&quot;grid2 wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;損益：年度與近四季（億美元）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 300&quot; role=&quot;img&quot; aria-label=&quot;損益（年度）&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;266.0&quot; y2=&quot;266.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;270.0&quot; class=&quot;ax&quot; text-anchor=& quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;2026-03-31&lt;/text&gt;&lt;rect x=&quot;239.1&quot; y=&quot;179.5&quot; width=&quot;36.0&quot; height=&quot;86.5&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;現金與短期投資 2026-06-30：28.6&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;277.0&quot; y=&quot;204.5&quot; width=&quot;36.0&quot; height=&quot;61.5&quot; rx=&quot;2&quot; fill=&quot;var(--neg)&quot;&gt;&lt;title&gt;借款（短期＋長期） 2026-06-30：20.3&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;315.0&quot; y=&quot;48.1&quot; width=&quot;36.0&quot; height=&quot;217.9&quot; rx=&quot;2&quot; fill=&quot;var(--c2)&quot;&gt;&lt;title&gt;股東權益 2026-06-30：72.0&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;296.0&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;2026-06-30&lt;/text&gt;&lt;rect x=&quot;401.7&quot; y=&quot;179.8&quot; width=&quot;36.0&quot; height=&quot;86.2&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;現金與短期投資 2026-09-30：28.5&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;439.7&quot; y=&quot;252.3&quot; width=&quot;36.0&quot; height=&quot;13.7&quot; rx=&quot;2&quot; fill=&quot;var(--neg)&quot;&gt;&lt;title&gt;借款（短期＋長期） 2026-09-30：4.5&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;477.6&quot; y=&quot;46.5&quot; width=&quot;36.0&quot; height=&quot;219.5&quot; rx=&quot;2&quot; fill=&quot;var(--c2)&quot;&gt;&lt;title&gt;股東權益 2026-09-30：72.5&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;458.7&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;2026-09-30&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c1)&quot;&gt;&lt;/i&gt;現金與短期投資&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--neg)&quot;&gt;&lt;/i&gt;借款（短期＋長期）&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c2)&quot;&gt;&lt;/i&gt;股東權益&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;數字取自 財務歷史.json（SEC 申報）；缺值不補、不畫。逐列表格見&lt;a h &lt;section class=&quot;q&quot; id=&quot;workpaper&quot; data-layer=&quot;計算底稿&quot;&gt;&lt;div class=&quot;qno&quot;&gt;計算底稿&lt;/div&gt;&lt;h2&gt;計算底稿：正文結果的算法與完整表（預設摺疊）&lt;/h2&gt;&lt;p class=&quot;wpnote&quot;&gt;正文每個估值、償債結果都從這裡算出；背景計算照做、送審照核。不讀也不影響理解結論；非買賣建議。&lt;/p&gt;&lt;details id=&quot;wp-3-4&quot;&gt;&lt;summary&gt;3・4 現金與股東：報表對帳與股東回報判讀&lt;/summary&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;現金流報表對帳&lt;/h3&gt;&lt;p&gt;報表對帳（6-K 2026-06-30，現金及約當現金（未含受限現金或公司未分列））：期初 3,433.0＋營運 -3.0＋投資 -222.0＋融資 -300.0＋其他 -49.0＝期末 2,859.0 百萬美元｜完整&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;股東回報判讀表&lt;/h3&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;股東回報（判讀依估值政策門檻，2026-10-14 核定；不影響估值與價格位置）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;數值&lt;/th&gt;&lt;th&gt;判讀&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股利殖利率&lt;/td&gt;&lt;td&gt;0.00%&lt;/td&gt;&lt;td&gt;不評好壞：近四季沒有配息（近十年未申報股利，以 0 計），股東回報全部來自回購&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;回購殖利率&lt;/td&gt;&lt;td&gt;2.05%&lt;/td&gt;&lt;td&gt;不評好壞：近四季回購約 2.7 億美元，是市值 133.4 億美元的 2.05%；划不划算看「股東收益率」「淨回購」「回購均價」&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股東收益率（股利＋回購）&lt;/td&gt;&lt;td&gt;2.05%（公債的 40%）&lt;/td&gt;&lt;td&gt;不評好壞：主要靠成長，2.05% 只有 10 年期公債 5.15% 的 40%；回饋低是成長型公司的常態，改看成長&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;淨回購殖利率&lt;/td&gt;&lt;td&gt;0.25%&lt;/td&gt;&lt;td&gt;好：回購 2.05% 裡約 1.8 個百分點用來抵銷發給員工的股票，扣掉後仍淨回購 0.25%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股數年變化（1／3／10 財年）&lt;/td&gt;&lt;td&gt;+5.3%／—／—&lt;/td&gt;&lt;td&gt;注意：2025 財年對上一財年 +5.3%（高於政策 2% 線）；3 財年資料不足；10 財年資料不足（只有 2024–2025）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;近 7 年（資料起 2019）有回購的年數&lt;/td&gt;&lt;td&gt;2／7（其中3年缺回購資料，不視為零）（資料只有 7 年，起 2019；不足十年，不判回購穩定度）&lt;/td&gt;&lt;td&gt;資料限制：資料只有 7 年（2 年有回購），不足十年，不判政策「穩定」（至少 8 年）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股利連續成長年數&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;不適用：公司沒有配息&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;最近財年回購均價（20-F Item 16E 財年截至 2025-12-31；近四季窗口內沒有 20-F 月份）&lt;/td&gt;&lt;td&gt;4.68&lt;/td&gt;&lt;td&gt;警示：均價 4.68 比合理價值上緣 3.94 高 19%，買得偏貴；依本報告估值，這段期間不是在低於內在價值時回購；依政策「治理與資本配置」最高只能評「中」；本次該項評「中」，評等不受影響&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;推定為零的項目&lt;/td&gt;&lt;td&gt;股利：近十年（2019–2025）均未申報，推定為零（推導值）&lt;/td&gt;&lt;td&gt;資料限制：公司近十年沒有這項申報，上表以 0 計算；屬推導值&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;details id=&quot;wp-mkt&quot;&gt;&lt;summary&gt;市場背景：大盤一句、流動性、空單與參考值的資料日期與存檔&lt;/summary&gt;&lt;p class=&quot;cap&quot;&gt;大盤狀態（市場總覽；只揭露，不進研究評等、價格位置與合理價值）：S&amp;amp;P 500（以 SPY 代表）前十大持股合計 37.3%，最大產業科技 38.2%；那斯達克 100（QQQ）科技占 58.0%；等權重 RSP 減市值加權 SPY 近3個月報酬差 1.7 個百分點，位在 2003 年以來第 79 分位（持平）。高收益債利差 3.30，位在 2023 年以來第 81 分位（偏高）；金融狀況指數 -0.46，位在 1971 年以來第 44 分位（中性）；VIX 18.70，位在 1990 年以來第 56 分位（中性）；融資推估（聯準會，推估）0.74 兆美元（2026-06-30），年增 46.6%（第 92 分位，偏高），占國內公司股權市值 0.68%（第 8 分位，偏低）。（市場總覽收盤日 2026-11-12，市場/市場總覽.json）。&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;流動性、空單與參考值（只列事實與資料日期，不判冷熱、不是買賣訊號；非買賣建議）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;類別&lt;/th&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;數值&lt;/th&gt;&lt;th&gt;資料日期&lt;/th&gt;&lt;th&gt;說明與存檔&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;流動性&lt;/td&gt;&lt;td&gt;20 日均成交量&lt;/td&gt;&lt;td&gt;73,879,955 股&lt;/td&gt;&lt;td&gt;2026-11-13 收盤&lt;/td&gt;&lt;td&gt;90 日均量 59,802,082 股（20 日 ÷ 90 日 1.24 倍）｜市場資料/市場溫度.json#/量能&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;流動性&lt;/td&gt;&lt;td&gt;20 日均成交金額&lt;/td&gt;&lt;td&gt;2.3 億美元&lt;/td&gt;&lt;td&gt;2026-11-13 收盤&lt;/td&gt;&lt;td&gt;市場資料/市場溫度.json#/流動性/20日均成交金額&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;流動性&lt;/td&gt;&lt;td&gt;20 日均周轉率（每日）&lt;/td&gt;&lt;td&gt;1.87%&lt;/td&gt;&lt;td&gt;2026-11-13 收盤&lt;/td&gt;&lt;td&gt;缺 SEC 封面股數，換手率用 yfinance 現行股數（推導）；自身近 5 年第 99% 百分位｜市場資料/市場溫度.json#/流動性/20日均換手率&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;空單&lt;/td&gt;&lt;td&gt;放空比率（空單占流通股）&lt;/td&gt;&lt;td&gt;4.40%&lt;/td&gt;&lt;td&gt;2026-10-30 結算&lt;/td&gt;&lt;td&gt;空單 173,630,452 股；前一期（2026-10-15）187,980,120 股，減少 7.6%；FINRA 每月兩次公布的合併空單，取得 2026-11-14｜市場資料/市場溫度.json#/流動性/空單&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;空單&lt;/td&gt;&lt;td&gt;回補天數&lt;/td&gt;&lt;td&gt;3.39 天&lt;/td&gt;&lt;td&gt;2026-10-30 結算&lt;/td&gt;&lt;td&gt;空單 ÷ 日均量（FINRA 自身日均量）；自算 ÷ 90 日均量 2.90 天｜市場資料/市場溫度.json#/流動性/空單&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;參考值&lt;/td&gt;&lt;td&gt;52 週區間位置&lt;/td&gt;&lt;td&gt;19%&lt;/td&gt;&lt;td&gt;2026-11-13 收盤&lt;/td&gt;&lt;td&gt;0%＝52 週低 2.71、100%＝52 週高 5.54（收盤，推算）｜市場資料/市場溫度.json#/趨勢&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;參考值&lt;/td&gt;&lt;td&gt;近 12 個月股價報酬&lt;/td&gt;&lt;td&gt;-44.0%&lt;/td&gt;&lt;td&gt;2026-11-13 收盤&lt;/td&gt;&lt;td&gt;同期 S&amp;amp;P 500 +11.6%｜市場資料/市場溫度.json#/動能&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;參考值&lt;/td&gt;&lt;td&gt;60 日歷史年化波動&lt;/td&gt;&lt;td&gt;48.2%&lt;/td&gt;&lt;td&gt;2026-11-13 收盤&lt;/td&gt;&lt;td&gt;日報酬標準差年化（收盤）｜市場資料/市場溫度.json#/波動&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;參考值&lt;/td&gt;&lt;td&gt;距 200 日均線&lt;/td&gt;&lt;td&gt;-9.2%&lt;/td&gt;&lt;td&gt;2026-11-13 收盤&lt;/td&gt;&lt;td&gt;200 日均線 3.57｜市場資料/市場溫度.json#/趨勢&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;wide&quot;&gt;&lt;/div&gt;&lt;/details&gt;&lt;details id=&quot;wp-5&quot;&gt;&lt;summary&gt;5 估值：情境算式、市價隱含第 10 年倍數、同業與歷史倍數交叉核對、條件式區間算法、市價反推、溢價來源與作者計算說明&lt;/summary&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;作者計算說明&lt;/h3&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;參數：自由現金流折現（FCFF），WACC 基準 9.02%（區間約 8.1%–10.4%）；beta 1.04＝2 年週報酬 Blume 1.19 與 Damodaran 產業 beta 重新加槓桿 0.89 的平均&lt;span class=&quot;src&quot;&gt;（負債權益比含租賃，與 WACC 債務權重同口徑）&lt;/span&gt;；無風險利率 5.15%、ERP 4.20%、稅率 20%、銷售對投入資本 4.0（估值輸入 evidence_notes.折現率）。&lt;/strong&gt;無護城河設定：衰退期 3 年、永續期 ROIC＝WACC 9.0%；改用衰退 5 年時中點 +5.5%，位置不變（超額報酬期間檢查.json）。基準情境約 67% 價值來自第 8 年之後（終值；DCF 為 8 年）。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;金融服務處理是作者判斷：它只占近四季營收 13.6%，DCF 只算平台營收 3,429 與營業利益 246&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;。&lt;/strong&gt;金融分部以帳面計：放款淨額 2,534 減銀行存款 2,703，差 169 連同少數股權 503 列為其他請求權（6-K 2026-11-03#1 §56）。股權橋用 9/30：債務 2,070、現金 2,848、其他流動性 4,252（總現金流動性 7,100 減現金，折 5%）、受限子公司現金 205（6-K 2026-08-13 §137）、股數 4,118&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;。10 月回購約 226 未反映，現金與股數高估大致抵銷&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;情境幅度：第 1–3 年平均成長保守 6.3%、基準 14%、樂觀 20.7%；穩態營業利益率保守 12.5%、基準 19%、樂觀 26.5%。&lt;/strong&gt;加權合理價值中點 ÷ 基準情境每股＝1.06&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;，未低於 0.97。成長帶較窄的理由是 2026 指引兩度上修且區間窄、平台單季年增穩定在 16–22%&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;。&lt;/p&gt;&lt;p&gt;成長跑道六項（估值輸入 evidence_notes.成長跑道）：①市場空間：公司未揭露市場規模與滲透率，只揭露月交易用戶 2025 年 4,720 萬、年增 14%&lt;span class=&quot;src&quot;&gt;（20-F Item 5 ¶148）&lt;/span&gt;；②定價能力：部分，沒有價量拆解，GMV 成長來自用戶與交易數（§12、§15）；③營運槓桿：有證據，增量營業利益率約 23%&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;，調整後 EBITDA 率由 15.6% 升到 21.3%（§5）；④指引紀錄：部分，2026 全年營收指引兩度上修，未逐季比對近八季；⑤成長資金：有證據，9 月底公司口徑淨流動性 50 億（6-K 2026-11-03#2 §10）；⑥新事業：金融服務近四季營收 541、分部調整後 EBITDA −45（Q3 首度轉正 12），不進 DCF。&lt;/p&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;計算核對&lt;span class=&quot;src&quot;&gt;（2026-11-14，一輪，逐項單獨還原、推導）&lt;/span&gt;：④證券計入總現金流動性減現金：只計現金時中點約 2.43（−28.8%），合理上緣 2.96 低於收盤，位置變偏貴；原文支持（§41、§56），保留。&lt;/strong&gt;③存款不列有息負債：存款當負債則 −18.0%、上緣 3.32 仍高於收盤，但只扣負債不計放款、口徑不一致，不採。②金融服務不進 DCF：改回集團口徑 +11.4%（上限估計）。⑧Atome 對價 14.9 億未扣：全扣中點 3.05（−10.6%），其中 2.6 億增資款留在被收購公司，只扣實際流出約 12.3 億為 −8.8%；未交割、以現金換資產，不扣（6-K 2026-09-15#1 附件 §9）。⑨非流動其他負債 684 未扣 −4.9%；⑩資料中心 7.5 億比照⑨約 −5.3%（未經核對代理）。情境差距 0.952 貼近不確定性「高」的分級線 1.0，股權橋再扣約 5 億以上，買入區上緣跌幅會遠大於中點。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;!--新圖表--&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;缺口判斷影響幅度&lt;/h3&gt;&lt;div class=&quot;wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;市價隱含第 10 年倍數（倍）：基準折現率下市價隱含 9.3 倍、模型 9.2 倍（約 1.0 倍差距）；參考帶 p25–p75 4.3–29.8 倍（機械回測樣本，非市場全體；分產業的筆數與公司數少，僅供參考）。只描述，不進評等、不是目標價（估值結果.json#/market_implied_terminal）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 620 242&quot; role=&quot;img&quot; aria-label=&quot;市價隱含第 10 年倍數&quot; class=&quot;chart&quot; style=&quot;max-width:775px&quot;&gt;&lt;line x1=&quot;252.0&quot; x2=&quot;252.0&quot; y1=&quot;22&quot; y2=&quot;216&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;252.0&quot; y=&quot;234&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;0&lt;/text&gt;&lt;line x1=&quot;300.3&quot; x2=&quot;300.3&quot; y1=&quot;22&quot; y2=&quot;216&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;300.3&quot; y=&quot;234&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;5&lt;/text&gt;&lt;line x1=&quot;348.6&quot; x2=&quot;348.6&quot; y1=&quot;22&quot; y2=&quot;216&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;348.6&quot; y=&quot;234&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;10&lt;/text&gt;&lt;line x1=&quot;396.9&quot; x2=&quot;396.9&quot; y1=&quot;22&quot; y2=&quot;216&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;396.9&quot; y=&quot;234&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;15&lt;/text&gt;&lt;line x1=&quot;445.1&quot; x2=&quot;445.1&quot; y1=&quot;22&quot; y2=&quot;216&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;445.1&quot; y=&quot;234&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;20&lt;/text&gt;&lt;line x1=&quot;493.4&quot; x2=&quot;493.4&quot; y1=&quot;22&quot; y2=&quot;216&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;493.4&quot; y=&quot;234&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;25&lt;/text&gt;&lt;line x1=&quot;541.7&quot; x2=&quot;541.7&quot; y1=&quot;22&quot; y2=&quot;216&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;541.7&quot; y=&quot;234&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;30&lt;/text&gt;&lt;line x1=&quot;590.0&quot; x2=&quot;590.0&quot; y1=&quot;22&quot; y2=&quot;216&quot; class=&quot quot;49&quot; width=&quot;51.2&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--neg)&quot;/&gt;&lt;text x=&quot;486.3&quot; y=&quot;63&quot; class=&quot;val&quot;&gt;+11.4%&lt;/text&gt;&lt;text x=&quot;266&quot; y=&quot;101&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;3. 銀行存款不列有息負債；放款淨額與…&lt;/text&gt;&lt;rect x=&quot;427.1&quot; y=&quot;87&quot; width=&quot;5.4&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--neg)&quot;/&gt;&lt;text x=&quot;440.5&quot; y=&quot;101&quot; class=&quot;val&quot;&gt;+1.2%&lt;/text&gt;&lt;text x=&quot;266&quot; y=&quot;139&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;4. 證券用非 IFRS 總現金流動性…&lt;/text&gt;&lt;rect x=&quot;297.7&quot; y=&quot;125&quot; width=&quot;129.4&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--neg)&quot;/&gt;&lt;text x=&quot;435.1&quot; y=&quot;139&quot; class=&quot;val&quot;&gt;-28.8%&lt;/text&gt;&lt;text x=&quot;266&quot; y=&quot;177&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;5. 資產負債表日改用 2026-09…&lt;/text&gt;&lt;rect x=&quot;424.8&quot; y=&quot;163&quot; width=&quot;2.2&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--neg)&quot;/&gt;&lt;text x=&quot;435.1&quot; y=&quot;177&quot; class=&quot;val&quot;&gt;-0.5%&lt;/text&gt;&lt;text x=&quot;266&quot; y=&quot;215&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;6. 扣少數股權帳面&lt;/text&gt;&lt;rect x=&quot;427.1&quot; y=&quot;201&quot; width=&quot;16.2&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;451.3&quot; y=&quot;215&quot; class=&quot;val&quot;&gt;+3.6%&lt;/text&gt;&lt;text x=&quot;266&quot; y=&quot;253&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;7. 股數改 A＋B 類加限制股稀釋&lt;/text&gt;&lt;rect x=&quot;427.1&quot; y=&quot;239&quot; width=&quot;20.2&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;455.3&quot; y=&quot;253&quot; class=&quot;val&quot;&gt;+4.5%&lt;/text&gt;&lt;text x=&quot;266&quot; y=&quot;291&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;8. Atome 60% 現金對價 1…&lt;/text&gt;&lt;rect x=&quot;379.5&quot; y=&quot;277&quot; width=&quot;47.6&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--neg)&quot;/&gt;&lt;text x=&quot;435.1&quot; y=&quot;291&quot; class=&quot;val&quot;&gt;-10.6%&lt;/text&gt;&lt;text x=&quot;266&quot; y=&quot;329&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;9. 非流動其他負債 684 未扣&lt;/text&gt;&lt;rect x=&quot;405.1&quot; y=&quot;315&quot; width=&quot;22.0&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;435.1&quot; y=&quot;329&quot; class=&quot;val&quot;&gt;-4.9%&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;/div&gt;&lt;!--/新圖表--&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;合理價值怎麼來：三個情境與權重&lt;/h3&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt&quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;每股價值（基準折現率 9.0%）&lt;/th&gt;&lt;th&gt;權重&lt;/th&gt;&lt;th&gt;折現率高端 10.4%&lt;/th&gt;&lt;th&gt;折現率低端 8.1%&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;2.07&lt;/td&gt;&lt;td&gt;25%&lt;/td&gt;&lt;td&gt;1.86&lt;/td&gt;&lt;td&gt;2.27&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;3.22&lt;/td&gt;&lt;td&gt;50%&lt;/td&gt;&lt;td&gt;2.74&lt;/td&gt;&lt;td&gt;3.69&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;5.14&lt;/td&gt;&lt;td&gt;25%&lt;/td&gt;&lt;td&gt;4.19&lt;/td&gt;&lt;td&gt;6.10&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;加權（合理價值）&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;b&gt;3.41&lt;/b&gt;&lt;/td&gt;&lt;td&gt;100%&lt;/td&gt;&lt;td&gt;&lt;b&gt;2.88&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;b&gt;3.94&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;中點是三個情境的加權：0.25×2.07＋0.5×3.22＋0.25×5.14≈3.41（一般權重組合）。區間上下緣是同樣三個情境、權重不變，只把折現率換成區間高端或低端重算後加權：高端約 10.4% → 2.88（下緣），低端約 8.1% → 3.94（上緣）。買入區上緣 2.39＝中點 × (1－安全邊際 30%，不確定性中)，股價在此以下才有 30% 安全邊際。情境表說明合理價值怎麼組成，不是單一目標價；非買賣建議。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;市價隱含第 10 年倍數（只描述，不進評等）&lt;/h3&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;基準情境：市價隱含 vs 模型假設的第 10 年 EV/EBIT（金額百萬美元）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;折現率&lt;/th&gt;&lt;th&gt;WACC&lt;/th&gt;&lt;th&gt;市場 EV&lt;/th&gt;&lt;th&gt;明示期現值&lt;/th&gt;&lt;th&gt;終值折現因子&lt;/th&gt;&lt;th&gt;第 10 年 EBIT&lt;/th&gt;&lt;th&gt;市價隱含倍數&lt;/th&gt;&lt;th&gt;模型終值倍數&lt;/th&gt;&lt;th&gt;隱含÷模型&lt;/th&gt;&lt;th&gt;現在 EV／次年 EBIT&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;低折現率&lt;/td&gt;&lt;td&gt;8.09%&lt;/td&gt;&lt;td&gt;9,402&lt;/td&gt;&lt;td&gt;3,221&lt;/td&gt;&lt;td&gt;0.537&lt;/td&gt;&lt;td&gt;1,358&lt;/td&gt;&lt;td&gt;8.5 倍&lt;/td&gt;&lt;td&gt;11.0 倍&lt;/td&gt;&lt;td&gt;0.77&lt;/td&gt;&lt;td&gt;23.6 倍&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;9.02%&lt;/td&gt;&lt;td&gt;9,402&lt;/td&gt;&lt;td&gt;3,081&lt;/td&gt;&lt;td&gt;0.501&lt;/td&gt;&lt;td&gt;1,358&lt;/td&gt;&lt;td&gt;9.3 倍&lt;/td&gt;&lt;td&gt;9.2 倍&lt;/td&gt;&lt;td&gt;1.01&lt;/td&gt;&lt;td&gt;23.6 倍&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;高折現率&lt;/td&gt;&lt;td&gt;10.44%&lt;/td&gt;&lt;td&gt;9,402&lt;/td&gt;&lt;td&gt;2,881&lt;/td&gt;&lt;td&gt;0.452&lt;/td&gt;&lt;td&gt;1,358&lt;/td&gt;&lt;td&gt;10.6 倍&lt;/td&gt;&lt;td&gt;7.3 倍&lt;/td&gt;&lt;td&gt;1.46&lt;/td&gt;&lt;td&gt;23.6 倍&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;算式：市場 EV＝模型 EV +（現價 − 模型每股價值）× 股數（股權橋與模型相同）；隱含倍數＝（市場 EV − 明示期現值）÷ 終值折現因子 ÷ 第 10 年 EBIT；模型終值倍數＝模型終值 ÷ 第 10 年 EBIT。參考帶：p25 4.3、中位 19.5、p75 29.8、p90 41.2 倍（機械回測樣本，非市場全體；分產業的筆數與公司數少，僅供參考；機械回測訓練期 2016–2021 全部回測日（審查工作區 回測資料/隱含倍數結果.json，1,810 筆中訓練期 1,046 筆；產業＝回測樣本的 Damodaran 產業）；重算：python3 程式/回測_隱含倍數參考帶.py &amp;lt;隱含倍數結果.json&amp;gt;）。只描述，不進價格位置、研究評等與合理價值。&lt;/p&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;&lt;b&gt;合理價值 vs 市價隱含倍數（作者判讀）：&lt;/b&gt;市價隱含第 10 年 EV/EBIT 約 9.3 倍，與模型終值倍數 9.2 倍 幾乎相同（比值 1.01），落在參考帶 p25 與中位之間；沒有特例，只描述，不當評等理由。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;如果 10 年後倍數是 19.5 倍，機率加權每股約 5 美元（條件式，非目標價、非買賣建議，不進評等）&lt;/h3&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;第 10 年 EV/EBIT 倍數對照（三情境各用自己的明示期 FCFF 與第 10 年 EBIT；權重 一般：保守 25%／基準 50%／樂觀 25%；基準 WACC 9.02%）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;第 10 年倍數&lt;/th&gt;&lt;th&gt;機率加權每股（美元）&lt;/th&gt;&lt;th&gt;折現率低高區間&lt;/th&gt;&lt;th&gt;白話換算&lt;/th&gt;&lt;th&gt;現價相對&lt;/th&gt;&lt;th&gt;說明&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;模型假設倍數&lt;/td&gt;&lt;td&gt;9.2 倍&lt;/td&gt;&lt;td&gt;3.41&lt;/td&gt;&lt;td&gt;2.88–3.94&lt;/td&gt;&lt;td&gt;等於折現率減永續成長約 5.5%（模型 5.5%）&lt;/td&gt;&lt;td&gt;現價在區間內&lt;/td&gt;&lt;td&gt;各情境用自己的模型終值倍數（表列為基準情境）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;穩態理論上限&lt;/td&gt;&lt;td&gt;15.0 倍&lt;/td&gt;&lt;td&gt;4.46&lt;/td&gt;&lt;td&gt;4.14–4.68&lt;/td&gt;&lt;td&gt;等於折現率減永續成長約 3.4%（模型 5.5%）&lt;/td&gt;&lt;td&gt;現價低於區間&lt;/td&gt;&lt;td&gt;（1−t）（1+g）÷（WACC−g）：再投資為零（ROIC 無限大）時的上限；t＝第 10 年 1−NOPAT÷EBIT&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;參考帶中位（服務與教育）&lt;/td&gt;&lt;td&gt;19.5 倍&lt;/td&gt;&lt;td&gt;5.26&lt;/td&gt;&lt;td&gt;4.86–5.55&lt;/td&gt;&lt;td&gt;等於折現率減永續成長約 2.6%（模型 5.5%）&lt;/td&gt;&lt;td&gt;現價低於區間&lt;/td&gt;&lt;td&gt;所選參考帶（大類）中位&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;同業今日 EV/EBIT 中位&lt;/td&gt;&lt;td&gt;21.8 倍&lt;/td&gt;&lt;td&gt;5.68&lt;/td&gt;&lt;td&gt;5.24–6.00&lt;/td&gt;&lt;td&gt;等於折現率減永續成長約 2.3%（模型 5.5%）&lt;/td&gt;&lt;td&gt;現價低於區間&lt;/td&gt;&lt;td&gt;估值結果 multiples.ev_ebit.peer_quartiles.p50（今天的倍數，不是 10 年後）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;參考帶 p75（服務與教育）&lt;/td&gt;&lt;td&gt;29.8 倍&lt;/td&gt;&lt;td&gt;7.11&lt;/td&gt;&lt;td&gt;6.53–7.52&lt;/td&gt;&lt;td&gt;等於折現率減永續成長約 1.7%（模型 5.5%）&lt;/td&gt;&lt;td&gt;現價低於區間&lt;/td&gt;&lt;td&gt;所選參考帶（大類）p75&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;市價隱含&lt;/td&gt;&lt;td&gt;9.3 倍&lt;/td&gt;&lt;td&gt;3.43&lt;/td&gt;&lt;td&gt;3.21–3.58&lt;/td&gt;&lt;td&gt;等於折現率減永續成長約 5.4%（模型 5.5%）&lt;/td&gt;&lt;td&gt;現價在區間內&lt;/td&gt;&lt;td&gt;基準情境、基準折現率反推（只用基準情境，套到三情境後加權不必等於現價）&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;如果 10 年後倍數是 X，三情境各用自己的明示期 FCFF 與第 10 年 EBIT、以基準折現率折現，依政策情境機率權重加權的每股價值；區間只換折現率（①模型列為合理價值區間）。「折現率減永續成長」＝(1+g)(1−t)(1−g/ROIC)÷倍數（基準情境永續參數）。條件式，非目標價、非買賣建議，不進評等。模型假設倍數那一列等於合理價值（中點 3.41）。&lt;/p&gt;&lt;/div&gt;&lt;!--成長型價格參考--&gt;&lt;div class=&quot;block&quot; id=&quot;growth-ref&quot;&gt;&lt;h3&gt;成長型價格參考：報酬門檻價、五年報酬矩陣、林區比值（只描述，不進評等，非買賣建議）&lt;/h3&gt;&lt;p class=&quot;cap&quot;&gt;這一段只描述，不進研究評等、不改價格位置，也不是目標價；三種情境並列、不合成單一數字，數字是「該情境成真時」的條件式推算，不是預期報酬。非買賣建議。&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;一、報酬門檻價：收盤 2026-11-13 股價 3.24 美元（三情境並列；條件式推算，非目標價）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;年報酬 7% 的每股價格（美元）&lt;/th&gt;&lt;th&gt;年報酬 8% 的每股價格（美元）&lt;/th&gt;&lt;th&gt;年報酬 9% 的每股價格（美元）&lt;/th&gt;&lt;th&gt;年報酬 10% 的每股價格（美元）&lt;/th&gt;&lt;th&gt;現價隱含年報酬&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;2.62&lt;/td&gt;&lt;td&gt;2.29&lt;/td&gt;&lt;td&gt;2.07&lt;/td&gt;&lt;td&gt;1.91&lt;/td&gt;&lt;td&gt;5.9%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;4.56&lt;/td&gt;&lt;td&gt;3.75&lt;/td&gt;&lt;td&gt;3.23&lt;/td&gt;&lt;td&gt;2.87&lt;/td&gt;&lt;td&gt;9.0%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;7.98&lt;/td&gt;&lt;td&gt;6.21&lt;/td&gt;&lt;td&gt;5.15&lt;/td&gt;&lt;td&gt;4.44&lt;/td&gt;&lt;td&gt;13.0%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;算法：各情境的 10 年現金流與終值改用門檻當折現率，經同一股權橋換成每股；股價等於這個價格時，該情境成真的現價隱含年報酬就等於門檻（兩者互為反函數）。&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;二、五年報酬矩陣：現價買進、持有 5 年的年化報酬（三情境 × 三種第 5 年倍數；推導，條件式，非預期報酬）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;第 5 年 EBIT（估值輸入單位，推導）&lt;/th&gt;&lt;th&gt;維持現在 38.2 倍&lt;/th&gt;&lt;th&gt;縮四分之一 28.7 倍&lt;/th&gt;&lt;th&gt;回到參考帶中位（服務與教育） 19.5 倍&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;534.8&lt;/td&gt;&lt;td&gt;19.0%&lt;/td&gt;&lt;td&gt;12.7%&lt;/td&gt;&lt;td&gt;5.0%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;1,009.3&lt;/td&gt;&lt;td&gt;35.0%&lt;/td&gt;&lt;td&gt;27.9%&lt;/td&gt;&lt;td&gt;19.1%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;1,776.6&lt;/td&gt;&lt;td&gt;51.4%&lt;/td&gt;&lt;td&gt;43.4%&lt;/td&gt;&lt;td&gt;33.6%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;算法：現價買進、持有 5 年：第 1–5 年自由現金流與第 5 年企業價值（倍數 × 該情境第 5 年 EBIT）折回今天、經今日股權橋與股數換成每股，解出使每股等於現價的年報酬（與現價隱含年報酬同一算法，只是第 5 年改用倍數計價）；不另估 5 年後的淨債務與股數。企業價值 ÷ 當年 EBIT 口徑與市價隱含第 10 年倍數、參考帶相同。推導。現在倍數＝市場企業價值 9,401.9 ÷ 近四季營業利益 246.0（估值輸入 company_metrics.ebit）＝38.2 倍；縮四分之一＝現在倍數 × 0.75。參考帶：大類層「服務與教育」中位 19.5 倍（機械回測樣本，非市場全體；分產業的筆數與公司數少，僅供參考）。&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;三、林區比值（只給比值與口徑；成長率與本益比的口徑同「PEG 與林區檢查」表的基準情境推估那一列）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;數值&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;林區分類&lt;/td&gt;&lt;td&gt;快速成長&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;成長率（基準情境推估（稅後營業利益年增－股數年變化））&lt;/td&gt;&lt;td&gt;27.3%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;本益比&lt;/td&gt;&lt;td&gt;32.4 倍&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股息殖利率&lt;/td&gt;&lt;td&gt;0.0%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;本益比 ÷ 成長率&lt;/td&gt;&lt;td&gt;1.19&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;（成長率＋股息殖利率）÷ 本益比&lt;/td&gt;&lt;td&gt;0.84&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;林區以本益比約等於成長率為參考（二手來源轉述）；本表不設門檻。只給比值與口徑，不作便宜或昂貴的判斷，不進研究評等與價格位置。非買賣建議。&lt;/p&gt;&lt;/div&gt;&lt;!--/成長型價格參考--&gt;&lt;div class=&quot;note-box&quot;&gt;&lt;b&gt;同業與歷史倍數交叉核對（不進評等）：2–4 美元&lt;/b&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;依同業的企業價值／營業利益倍數換算的每股價值，取 25–75 百分位；不是股價波動範圍，也不是合理價值。原稱「市場情緒區間」；2026-11-11 起只作交叉核對，不決定價格位置與研究評等（價格位置三級：買入區、合理、偏貴，只看買入區上緣與合理價值高端）。同業僅 3 家，分位僅供參考。&lt;/p&gt;&lt;/div&gt;&lt;!--目標區間:第五題--&gt;&lt;div class=&quot;block&quot; id=&quot;target-body&quot;&gt;&lt;h3&gt;12 個月條件式目標區間：三種情境各自成真時的價值（條件式、非買賣建議）&lt;/h3&gt;&lt;p class=&quot;cap&quot;&gt;條件式目標區間：三種情境各自成真時的每股價值區間，不是股價預測，三段不合成單一數字；非買賣建議。不影響合理價值、價格位置與研究評等。&lt;/p&gt;&lt;p&gt;算法：各情境每股價值（折現率高低兩端）×（1＋股權成本 9.52%）− 未來 12 個月每股股利 0.00 美元（近四季無股利（價值判斷.json 股利殖利率 0）；股利：近十年（2019–2025）均未申報，推定為零（推導值））；回購不加回。起點 2026-11-13 收盤，終點 2027-11-13。三段是各情境在折現率上下兩端的每股價值向前推 12 個月，不是價格機率分布的切片；段與段之間可能有空白，也可能重疊。區間主要寬度來自折現率不確定，不是 12 個月內的營運變化。&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt&quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;機率（政策權重，未經歷史校準）&lt;/th&gt;&lt;th&gt;目標區間（美元）&lt;/th&gt;&lt;th&gt;相對現價&lt;/th&gt;&lt;th&gt;關鍵假設（估值輸入）&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;25%&lt;/td&gt;&lt;td&gt;&lt;b&gt;2.03–2.48&lt;/b&gt;&lt;/td&gt;&lt;td&gt;−37%～−23%&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;第 1 年營收 +9.0%；營業利益率 9.0%；穩態 12.5%；永續成長 3.0%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;50%&lt;/td&gt;&lt;td&gt;&lt;b&gt;3.00–4.04&lt;/b&gt;&lt;/td&gt;&lt;td&gt;−7%～+25%&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;第 1 年營收 +16.0%；營業利益率 10.0%；穩態 19.0%；永續成長 3.5%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;25%&lt;/td&gt;&lt;td&gt;&lt;b&gt;4.59–6.68&lt;/b&gt;&lt;/td&gt;&lt;td&gt;+42%～+106%&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;第 1 年營收 +22.0%；營業利益率 11.5%；穩態 26.5%；永續成長 4.0%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;口徑：報告中「現價隱含年報酬（基準情境，非預期報酬）約 9.0%」是以現價買進、持有該情境全期現金流（含永續價值）的年化報酬；這裡的目標區間是 12 個月後各情境每股價值的前推，兩者口徑不同，不能互相換算（例如不能用前者推 12 個月後的價格）。&lt;/p&gt;&lt;h4 style=&quot;margin-top:14px&quot;&gt;每一段要成立，市場這一面需要什麼、正在顯示什麼&lt;/h4&gt;&lt;ul class=&quot;prose&quot;&gt;&lt;li&gt;以 2027-12-17 到期選擇權的價平隱含波動 54.2%（2026-11-14 16:58 UTC 取得；最近成交 2026-11-13，不在取得當天；取價時現價 3.24，起點價 3.24 為 2026-11-13 收盤）定價，12 個月後（2027-11-13）價格落在保守段 13%、基準段 21%、樂觀段 14%；低於最低端（2.03） 25%、高於最高端（6.68） 6.4%、段與段之間空白 21%、段與段重疊 0.0%。這是風險中立機率，不是真實機率；不改情境權重、不改估值與評等；選擇權定價含風險溢酬與波動偏態，與三段情境機率是兩回事。&lt;/li&gt;&lt;li&gt;公債殖利率下降 1 個百分點時，保守／基準／樂觀段代表值（基準折現率前推，不是區間兩端的平均）為 2.4／4.0／6.5；目前 2.3／3.5／5.6；上升 1 個百分點時為 2.1／3.2／5.0（美元，股權成本同幅變動，其他假設不變）。&lt;/li&gt;&lt;li&gt;分析師預估：本財年每股盈餘預估 0.14，較 30 天前 0.14 +1.7%（上修），近 30 天 1 家上修、1 家下修；下一財年每股盈餘預估 0.14，較 30 天前 0.14 −1.4%（下修），近 30 天 0 家上修、1 家下修。只描述預估修正的方向，不當證據，也不是目標區間的任一端。&lt;/li&gt;&lt;li&gt;券商目標價近 90 天有 2 家調整：上調 1、下調 1、持平 0（只揭露，不是本報告的目標價）。&lt;/li&gt;&lt;li&gt;上季（Sep 2026，11/3/2026 公布）每股盈餘 0.0，共識預估 0.02，驚奇 -100%（Nasdaq）；yfinance 另列 2026-09-30 實際 0.009、預估 0.02、驚奇 -55.00%；兩個來源口徑可能不同（可能是調整後或一般會計準則），公司申報的每股盈餘可對照存檔 6-K 2026-11-03 財報新聞稿（本句未逐項比對），只描述、不當證據。&lt;/li&gt;&lt;/ul&gt;&lt;p class=&quot;cap&quot;&gt;以上只引用已存檔的數字描述條件與現況，不是預測；選擇權機率是風險中立機率、不是真實機率，不改情境權重；分析師預估與券商目標價不當證據；細節表在附錄估值細節。&lt;/p&gt;&lt;p&gt;&lt;b&gt;需要重算區間的事件：&lt;/b&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;Atome Financial 60% 收購完成（現金 14.9 億美元，其中 2.6 億為增資款留在被收購公司，實際流出約 12.3 億，推導；公司預計 2027 年第三季前，可能落在 12 個月內）：現金減少、金融分部範圍與股權橋改變，區間需重算；現行估值未扣（全額扣且不計 Atome 價值時中點約 −10.6%，只扣實際流出約 −8.8%，推導）（6-K 2026-09-15#1 附件 §9–§10）&lt;/li&gt;&lt;li&gt;馬來西亞 AI 資料中心合資簽最終協議並開始出資（Grab 承諾 7.5 億，依開發與客戶合約里程碑分階段）：現金減少、新增合資權益，區間需重算；現行估值未扣（全額扣且不計合資價值時中點約 −5.3%，推導）（6-K 2026-11-09#2 本文 §2–§3）&lt;/li&gt;&lt;li&gt;20-F 2026 年報單獨揭露 Stash 剩餘 49.9% 權益的付款負債（三年內依公允價值、現金或 A 類股支付）：現行估值未扣（可能含在非流動其他負債 684；全額扣 684 時中點約 −4.9%，推導），揭露後股權橋需重算（6-K 2026-08-13 新聞稿 §174–§175；6-K 2026-11-03#1 新聞稿 §56）&lt;/li&gt;&lt;/ul&gt;&lt;ul class=&quot;cap&quot;&gt;&lt;li&gt;近四季公開市場回購均價 4.68 高於合理價值上緣 3.94；回購不加回、目標區間不調整。&lt;/li&gt;&lt;li&gt;不列倍數核對：市場資料/市場給價.json 只有 888 位元組，標示不適用（SEC 季資料或日線不足，無法計算自身倍數歷史）。&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;!--/目標區間:第五題--&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;市價要求的成長：三視角反推、假設對照實績、歷史基準比率與市價溢價來源&lt;/h3&gt;&lt;p&gt;這一節把現價代回估值模型反解「市場要求什麼」，再和公司實績、同規模公司的歷史比例、市場面的過熱訊號對照；只揭露，不改合理價值、價格位置與研究評等。&lt;/p&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;市價隱含什麼、我們假設什麼、公司做到什麼&lt;/h4&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;視角（其他假設照基準，三者擇一）&lt;/th&gt;&lt;th&gt;市價隱含&lt;/th&gt;&lt;th&gt;本報告基準&lt;/th&gt;&lt;th&gt;實績或對照&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;成長&lt;/td&gt;&lt;td&gt;第 1–5 年營收每年約 12.1%&lt;/td&gt;&lt;td&gt;第 1–5 年平均約 12.3%（推算）&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;利潤率&lt;/td&gt;&lt;td&gt;第 1 年起每年（含穩態）營業利益率約 17.6%&lt;/td&gt;&lt;td&gt;第 1 年 10.0%、穩態 19.0%&lt;/td&gt;&lt;td&gt;-276.8%–356.2%（近 7 年營業利益率）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;折現率&lt;/td&gt;&lt;td&gt;約 9.0%（使基準情境等於現價的折現率）&lt;/td&gt;&lt;td&gt;加權資本成本 9.0%&lt;/td&gt;&lt;td&gt;10 年期公債 5.15%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;市價隱含折現率約 9.0%，與加權資本成本 9.0% 相差不到 1 個百分點：照基準情境假設，現價大致反映本報告採用的資金成本。隱含折現率不是預期報酬；V3 回測（2016–2025，含倖存者偏誤）中，之後一年實際報酬中位多高於隱含值。只揭露，不改研究評等與價格位置；非買賣建議。&lt;/p&gt;&lt;div style=&quot;margin-top:12px&quot;&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;第 1 年營收成長&lt;/th&gt;&lt;th&gt;穩態營業利益率&lt;/th&gt;&lt;th&gt;終端投入資本報酬率（ROIC）&lt;/th&gt;&lt;th&gt;永續成長&lt;/th&gt;&lt;th&gt;對照實績&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;9.0%&lt;/td&gt;&lt;td&gt;12.5%&lt;/td&gt;&lt;td&gt;9.0%&lt;/td&gt;&lt;td&gt;3.0%&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;16.0%&lt;/td&gt;&lt;td&gt;19.0%&lt;/td&gt;&lt;td&gt;9.0%&lt;/td&gt;&lt;td&gt;3.5%&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;22.0%&lt;/td&gt;&lt;td&gt;26.5%&lt;/td&gt;&lt;td&gt;9.0%&lt;/td&gt;&lt;td&gt;4.0%&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;公司實績&lt;/td&gt;&lt;td&gt;未取得&lt;/td&gt;&lt;td&gt;近四季 5.06%；-276.8%–356.2%（近 7 年營業利益率）&lt;/td&gt;&lt;td&gt;近四季未取得（財務指標無 ROIC_TTM）&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;市價隱含三視角：把現價代回基準情境，一次只放開一個假設反解（成長、利潤率、折現率），三者擇一成立即可，不是同時需要；折現率視角就是第四題「現價隱含年報酬（基準情境，非預期報酬）」。假設對照：終端 ROIC 低於近四季一半時標「保守於實績」，括號寫原因：產業上限、公司近五年中位上限或等於資金成本是估值框架的上限設定（估值政策），作者選值的理由在估值輸入，都不是資料錯誤；穩態利潤率高於歷史上限標「高於歷史上限」；利潤率仍在改善中的公司（轉型、規模擴張期），歷史上限不一定是天花板，標記只提醒讀者對照，不代表假設錯誤。出處：估值結果.json（reverse_dcf、implied_return、discount）、估值輸入.json（scenarios）、財務指標.json（ROIC_TTM）、產業指標.json（景氣正常化）、成長推估底稿.json 與財務歷史.json（近四季）；推導，只揭露，不改合理價值、價格位置與研究評等。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;市價隱含的成長與歷史基準比率&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;市價隱含 GRAB 未來 10 年營收實質年增約 7.2%–7.7%（名目 9.7% 減通膨 2.0%–2.5% 的近似，推導）；1950–2015 年營收 30–45 億美元的公司中，10 年間做到實質年增 5% 以上的約 41.2%（Mauboussin 等，2016，表 4）。此為揭露，不是市價錯誤的證明。&lt;/p&gt;&lt;p&gt;現價要成立，需把基準情境第 1 年營收成長 16.0% 延續約 6 年（之後新投資報酬等於折現率，不再創造價值；推導，只揭露）。&lt;/p&gt;&lt;p&gt;&lt;b&gt;隱含假設罕見度：樂觀&lt;/b&gt;（同規模公司 10 年做到的歷史比例 ≥50% 一般、10%–50% 樂觀、&amp;lt;10% 歷史罕見；只揭露，不改研究評等與價格位置）&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;超額報酬期間&lt;/th&gt;&lt;th&gt;市價隱含營收年增（名目）&lt;/th&gt;&lt;th&gt;約實質（名目減通膨 2.0%–2.5% 的近似，推導）&lt;/th&gt;&lt;th&gt;歷史基準比率（1950–2015）&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;10 年&lt;/td&gt;&lt;td&gt;9.7%&lt;/td&gt;&lt;td&gt;7.2%–7.7%&lt;/td&gt;&lt;td&gt;營收 30–45 億美元：10 年實質年增 5% 以上約 41.2%（該組 10 年實質年增中位數 4.1%）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;15 年&lt;/td&gt;&lt;td&gt;7.4%&lt;/td&gt;&lt;td&gt;4.9%–5.4%&lt;/td&gt;&lt;td&gt;原文只有 10 年分布，15、20 年無對照&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;20 年&lt;/td&gt;&lt;td&gt;6.3%&lt;/td&gt;&lt;td&gt;3.8%–4.3%&lt;/td&gt;&lt;td&gt;原文只有 10 年分布，15、20 年無對照&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;做法：超額報酬期間內營收年增固定、利潤率與銷售對資本比取基準情境第 5 年；期間結束後新投資報酬等於折現率（不再創造價值）；永續成長照基準情境。折現率 9.02%、第 5 年利潤率 16.5%。來源：Mauboussin, Callahan &amp;amp; Majd（2016）〈The Base Rate Book〉表 4（第三方轉載，原表 1950–2015 年、實質成長、有存活偏差）。這張表只說明「市價需要多強、多久的成長才成立」，不改合理價值、買入區上緣與價格位置；歷史比例低代表市價需要少見的結果，不代表市價錯誤。通膨假設 2.0%–2.5% 依 Morningstar 2020-10 方法，實質年增為名目直接減通膨的近似。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;市價溢價來源&lt;/h4&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;現價未高於合理價值上緣，下表只描述市場面，不代表有溢價。溢價訊號集中在基本面預期（隱含假設罕見度）。資金與情緒無訊號。只揭露，不改研究評等與價格位置，也不代表市價錯誤。&lt;/p&gt;&lt;p&gt;EPS 預估：+1y（2027 財年，推導） 預估 90 天 -3.5%（下修；判斷窗口為 90 天，±2% 內視為持平），近 30 天上修減下修 -1 家；yfinance 預估是取得當下快照，股價 90 天變化以批次收盤日為終點，兩者日期可能差幾天；取得 2026-11-07。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;來源類別&lt;/th&gt;&lt;th&gt;數值&lt;/th&gt;&lt;th&gt;過熱訊號&lt;/th&gt;&lt;th&gt;說明／存檔位置&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;隱含假設罕見度&lt;/td&gt;&lt;td&gt;基本面預期&lt;/td&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;有&lt;/td&gt;&lt;td&gt;價值判斷.json#/市價隱含假設&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;倍數擴張&lt;/td&gt;&lt;td&gt;倍數重估&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;不適用&lt;/td&gt;&lt;td&gt;歷史本益比.json 沒有每日資料&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;預估背離&lt;/td&gt;&lt;td&gt;倍數重估&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;不適用&lt;/td&gt;&lt;td&gt;價值判斷.json#/預估修正&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;本益比水位&lt;/td&gt;&lt;td&gt;倍數重估&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;不適用&lt;/td&gt;&lt;td&gt;虧損或歷史不足，沒有本益比區間&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股債利差&lt;/td&gt;&lt;td&gt;總經與利率&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;不適用&lt;/td&gt;&lt;td&gt;市場資料/歷史本益比.json#/股債利差/近期百分位&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;整體市場風險溢價&lt;/td&gt;&lt;td&gt;總經與利率&lt;/td&gt;&lt;td&gt;Damodaran 隱含風險溢價 4.20%（2026-10-01）&lt;/td&gt;&lt;td&gt;不適用&lt;/td&gt;&lt;td&gt;只存當月值，沒有歷史序列可比中位數；要下載 Damodaran 歷史表需使用者同意&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;動能&lt;/td&gt;&lt;td&gt;資金與情緒&lt;/td&gt;&lt;td&gt;相對 200 日均線 -9%；12 個月（2025-11-12 起） -44% 對 S&amp;amp;P500 +12%&lt;/td&gt;&lt;td&gt;無&lt;/td&gt;&lt;td&gt;市場資料/市場溫度.json#/趨勢、#/動能&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;部位與衍生品&lt;/td&gt;&lt;td&gt;資金與情緒&lt;/td&gt;&lt;td&gt;選擇權賣權對買權量比 偏熱；空單分位 86%、回補天數分位 76%（有軋空條件）&lt;/td&gt;&lt;td&gt;無&lt;/td&gt;&lt;td&gt;股價在 200 日均線下且 12 個月下跌，熱度不視為溢價來源&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;擁擠度&lt;/td&gt;&lt;td&gt;資金與情緒&lt;/td&gt;&lt;td&gt;20 日均換手率在自身五年 99% 分位；被發現程度 一般&lt;/td&gt;&lt;td&gt;無&lt;/td&gt;&lt;td&gt;股價在 200 日均線下且 12 個月下跌，熱度不視為溢價來源&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;門檻：使用者 2026-11-04 照草案核定（程式/市場溢價來源.py 常數）。各列只描述市場面，不改合理價值、研究評等與價格位置，非買賣建議。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;multiple-conditions&quot;&gt;&lt;h3&gt;長期倍數條件：要漲 3／5／10 倍需要什麼&lt;/h3&gt;&lt;p&gt;反過來問：股價要在 5 年或 10 年內每股漲到 3、5、10 倍，期末營收、利潤率、估值倍數要做到多少，歷史上同規模公司有多少做到過。&lt;b&gt;條件反推，非預測、非機率、非目標價、非買賣建議&lt;/b&gt;；不改研究評等、價格位置與目標區間。&lt;/p&gt;&lt;p class=&quot;cap&quot;&gt;主列＝產業倍數＋基準穩態利潤率；括號是三種期末倍數口徑（不重估、產業、自身本益比 p25）的範圍。股數年稀釋率 0.0%（推導）。罕見度：5 年用自有 SEC 名目分布、10 年用 Base Rate Book（1950–2015，實質）。&lt;/p&gt;&lt;ul&gt;&lt;li&gt;3 倍／5 年：營收年增約 17.2%（2 種期末倍數口徑 0.5%–17.2%），歷史罕見（營收 30–45 億美元的公司 5 年約 9.7% 做到）；資金自足&lt;/li&gt;&lt;li&gt;3 倍／10 年：營收年增約 8.3%（2 種期末倍數口徑 0.2%–8.3%），樂觀（營收 30–45 億美元的公司 10 年約 41.2% 做到）；資金自足&lt;/li&gt;&lt;li&gt;5 倍／5 年：營收年增約 31.0%（2 種期末倍數口徑 12.2%–31.0%），歷史罕見（營收 30–45 億美元的公司 5 年約 1.6% 做到）；資金自足&lt;/li&gt;&lt;li&gt;5 倍／10 年：營收年增約 14.4%（2 種期末倍數口徑 5.9%–14.4%），樂觀（營收 30–45 億美元的公司 10 年約 13.1% 做到）；資金自足&lt;/li&gt;&lt;li&gt;10 倍／5 年：營收年增約 51.4%（2 種期末倍數口徑 29.7%–51.4%），歷史罕見（營收 30–45 億美元的公司 5 年約 0.6% 做到）；資金自足&lt;/li&gt;&lt;li&gt;10 倍／10 年：營收年增約 23.0%（2 種期末倍數口徑 13.9%–23.0%），歷史罕見（營收 30–45 億美元的公司 10 年約 1.2% 做到）；資金自足&
