&lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;div class=&quot;wrap&quot;&gt;&lt;div class=&quot;top&quot;&gt;&lt;span&gt;&lt;b&gt;Grab 控股（GRAB）&lt;/b&gt;｜商業評估&lt;/span&gt;&lt;span&gt;資料截止 2026-11-13｜基準季 2026-09-30｜&lt;a href=&quot;報告.html&quot;&gt;估值報告（另頁）&lt;/a&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;hero&quot;&gt;&lt;div&gt;&lt;div class=&quot;eyebrow&quot;&gt;商業評估｜數位平台／交易型&lt;/div&gt;&lt;h1&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;Grab 是東南亞八國叫車與外送的撮合平台，2025 年首度全年獲利，平台本身靠量維持雙位數成長但在減速，集團成長加速主要來自金融服務放款與併表；卡點在印尼抽成管制與放款信用品質。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src2&quot;&gt;[2]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src3&quot;&gt;[3]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src4&quot;&gt;[4]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src5&quot;&gt;[5]&lt;/a&gt;&lt;/sup&gt;&lt;/h1&gt;&lt;p class=&quot;lead&quot;&gt;本頁只用官方文件、財報與新聞，回答商業模式是否成立、成長點在哪、是否卡住、未來怎麼變、週期多久。&lt;b&gt;不含價格、估值或任何買賣建議&lt;/b&gt;，也不影響估值報告的研究評等。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;gradebox&quot;&gt;&lt;div class=&quot;lab&quot;&gt;商業評估等級（五級 A–E）&lt;span class=&quot;ruleok&quot;&gt;評分規則第一版，2026-11-07 使用者核定&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;g&quot;&gt;C&lt;small&gt;級&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;加權分 3.25／5｜相對同業：UBER、DASH、LYFT、CART&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;與同業相當，或有明顯卡點｜上限：卡住訊號超過一半資料未取得 → 最高 B（資料不足）&lt;/div&gt;&lt;div class=&quot;note&quot;&gt;商業評估等級（A–E 五級）只看商業模式是否成立、成長是否卡住、週期在哪，相對同產業卡同業評比；它不是估值報告研究評等裡的「生意品質 A／B／C」（那是看護城河、投入資本報酬、現金流品質、資產負債表與治理的絕對標準），不進研究評等、不影響估值、不涉任何價格。&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;nav class=&quot;qnav&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;&lt;a href=&quot;#s0&quot;&gt;重點&lt;/a&gt;&lt;a href=&quot;#s1&quot;&gt;1 商業輪廓&lt;/a&gt;&lt;a href=&quot;#s2&quot;&gt;2 說的 vs 做的&lt;/a&gt;&lt;a href=&quot;#s3&quot;&gt;3 成長與卡點&lt;/a&gt;&lt;a href=&quot;#sa&quot;&gt;4 優勢與持續期間&lt;/a&gt;&lt;a href=&quot;#s4&quot;&gt;5 生命週期&lt;/a&gt;&lt;a href=&quot;#s5&quot;&gt;6 週期&lt;/a&gt;&lt;a href=&quot;#s6&quot;&gt;7 觀察清單&lt;/a&gt;&lt;a href=&quot;#sg&quot;&gt;等級明細&lt;/a&gt;&lt;a href=&quot;#src&quot;&gt;出處&lt;/a&gt;&lt;/div&gt;&lt;/nav&gt;&lt;div class=&quot;wrap&quot;&gt;&lt;section id=&quot;s0&quot;&gt;&lt;h2&gt;一眼看重點&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;先看等級怎麼來、這頁的證據有多扎實；細節在下面各節。&lt;/p&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;等級怎麼來：五個面向&lt;/figcaption&gt;&lt;svg viewBox=&quot;0 0 640 260&quot; role=&quot;img&quot; aria-label=&quot;商業評估等級五面向：作者分與機械建議分&quot;&gt;&lt;line x1=&quot;150.0&quot; x2=&quot;150.0&quot; y1=&quot;20&quot; y2=&quot;232&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;150.0&quot; y=&quot;250&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;1 分&lt;/text&gt;&lt;line x1=&quot;255.0&quot; x2=&quot;255.0&quot; y1=&quot;20&quot; y2=&quot;232&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;255.0&quot; y=&quot;250&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;2 分&lt;/text&gt;&lt;line x1=&quot;360.0&quot; x2=&quot;360.0&quot; y1=&quot;20&quot; y2=&quot;232&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;360.0&quot; y=&quot;250&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;3 分&lt;/text&gt;&lt;line x1=&quot;465.0&quot; x2=&quot;465.0&quot; y1=&quot;20&quot; y2=&quot;232&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;465.0&quot; y=&quot;250&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;4 分&lt;/text&gt;&lt;line x1=&quot;570.0&quot; x2=&quot;570.0&quot; y1=&quot;20&quot; y2=&quot;232&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;570.0&quot; y=&quot;250&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;5 分&lt;/text&gt;&lt;text x=&quot;140&quot; y=&quot;55.0&quot; class=&quot;lb&quot; text-anchor=&quot;end&quot;&gt;模式穩固度&lt;tspan class=&quot;ax&quot;&gt; 25%&lt;/tspan&gt;&lt;/text&gt;&lt;rect x=&quot;150.0&quot; y=&quot;43.0&quot; width=&quot;210.0&quot; height=&quot;14&quot; rx=&quot;3&quot; fill=&quot;var(--biz)&quot; opacity=&quot;.85&quot;/&gt;&lt;path d=&quot;M255.0,38.0 l6,-8 h-12z&quot; fill=&quot;var(--accent)&quot;&gt;&lt;title&gt;機械建議 2&lt;/title&gt;&lt;/path&gt;&lt;text x=&quot;368.0&quot; y=&quot;55.0&quot; class=&quot;vl&quot;&gt;3&lt;tspan class=&quot;ax&quot;&gt;（機械 2）&lt;/tspan&gt;&lt;/text&gt;&lt;text x=&quot;140&quot; y=&quot;95.0&quot; class=&quot;lb&quot; text-anchor=&quot;end&quot;&gt;成長動能&lt;tspan class=&quot;ax&quot;&gt; 25%&lt;/tspan&gt;&lt;/text&gt;&lt;rect x=&quot;150.0&quot; y=&quot;83.0&quot; width=&quot;315.0&quot; height=&quot;14&quot; rx=&quot;3&quot; fill=&quot;var(--biz)&quot; opacity=&quot;.85&quot;/&gt;&lt;path d=&quot;M465.0,78.0 l6,-8 h-12z&quot; fill=&quot;var(--accent)&quot;&gt;&lt;title&gt;機械建議 4&lt;/title&gt;&lt;/path&gt;&lt;text x=&quot;473.0&quot; y=&quot;95.0&quot; class=&quot;vl&quot;&gt;4&lt;/text&gt;&lt;text x=&quot;140&quot; y=&quot;135.0&quot; class=&quot;lb&quot; text-anchor=&quot;end&quot;&gt;卡點風險&lt;tspan class=&quot;ax&quot;&gt; 20%&lt;/tspan&gt;&lt;/text&gt;&lt;rect x=&quot;150.0&quot; y=&quot;123.0&quot; width=&quot;210.0&quot; height=&quot;14&quot; rx=&quot;3&quot; fill=&quot;var(--biz)&quot; opacity=&quot;.85&quot;/&gt;&lt;path d=&quot;M465.0,118.0 l6,-8 h-12z&quot; fill=&quot;var(--accent)&quot;&gt;&lt;title&gt;機械建議 4&lt;/title&gt;&lt;/path&gt;&lt;text x=&quot;368.0&quot; y=&quot;135.0&quot; class=&quot;vl&quot;&gt;3&lt;tspan class=&quot;ax&quot;&gt;（機械 4）&lt;/tspan&gt;&lt;/text&gt;&lt;text x=&quot;140&quot; y=&quot;175.0&quot; class=&quot;lb&quot; text-anchor=&quot;end&quot;&gt;週期位置&lt;tspan class=&quot;ax&quot;&gt; 15%&lt;/tspan&gt;&lt;/text&gt;&lt;rect x=&quot;150.0&quot; y=&quot;163.0&quot; width=&quot;210.0&quot; height=&quot;14&quot; rx=&quot;3&quot; fill=&quot;var(--biz)&quot; opacity=&quot;.85&quot;/&gt;&lt;text x=&quot;368.0&quot; y=&quot;175.0&quot; class=&quot;vl&quot;&gt;3&lt;/text&gt;&lt;text x=&quot;140&quot; y=&quot;215.0&quot; class=&quot;lb&quot; text-anchor=&quot;end&quot;&gt;說法可信度&lt;tspan class=&quot;ax&quot;&gt; 15%&lt;/tspan&gt;&lt;/text&gt;&lt;rect x=&quot;150.0&quot; y=&quot;203.0&quot; width=&quot;210.0&quot; height=&quot;14&quot; rx=&quot;3&quot; fill=&quot;var(--biz)&quot; opacity=&quot;.85&quot;/&gt;&lt;path d=&quot;M465.0,198.0 l6,-8 h-12z&quot; fill=&quot;var(--accent)&quot;&gt;&lt;title&gt;機械建議 4&lt;/title&gt;&lt;/path&gt;&lt;text x=&quot;368.0&quot; y=&quot;215.0&quot; class=&quot;vl&quot;&gt;3&lt;tspan class=&quot;ax&quot;&gt;（機械 4）&lt;/tspan&gt;&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;lg&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--biz)&quot;&gt;&lt;/i&gt;作者分&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--accent)&quot;&gt;&lt;/i&gt;機械建議分&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;藍條是作者分（1–5），橘色三角是工具的機械建議分；兩者不同的面向在等級明細寫了偏離理由。加權分 3.25 → C 級（A ≥ 4.2、B ≥ 3.5、C ≥ 2.8、D ≥ 2.1）。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估.json#/評等/面向（作者分、權重、機械建議）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;這頁的句子有多少是事實&lt;/figcaption&gt;&lt;svg viewBox=&quot;0 0 640 58&quot; role=&quot;img&quot; aria-label=&quot;句子標記組成&quot;&gt;&lt;rect x=&quot;4.0&quot; y=&quot;6&quot; width=&quot;391.8&quot; height=&quot;26&quot; fill=&quot;var(--biz)&quot;&gt;&lt;title&gt;事實 62&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;199.9&quot; y=&quot;24&quot; class=&quot;inb&quot; text-anchor=&quot;middle&quot;&gt;事實 62&lt;/text&gt;&lt;rect x=&quot;395.8&quot; y=&quot;6&quot; width=&quot;139.0&quot; height=&quot;26&quot; fill=&quot;var(--accent)&quot;&gt;&lt;title&gt;推論 22&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;465.4&quot; y=&quot;24&quot; class=&quot;inb&quot; text-anchor=&quot;middle&quot;&gt;推論 22&lt;/text&gt;&lt;rect x=&quot;534.9&quot; y=&quot;6&quot; width=&quot;88.5&quot; height=&quot;26&quot; fill=&quot;var(--c6)&quot;&gt;&lt;title&gt;作者判斷 14&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;579.1&quot; y=&quot;24&quot; class=&quot;inb&quot; text-anchor=&quot;middle&quot;&gt;作者判斷 14&lt;/text&gt;&lt;rect x=&quot;623.4&quot; y=&quot;6&quot; width=&quot;12.6&quot; height=&quot;26&quot; fill=&quot;var(--neg)&quot;&gt;&lt;title&gt;待查 2&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;4&quot; y=&quot;52&quot; class=&quot;ax&quot;&gt;合計 100&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;lg&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--biz)&quot;&gt;&lt;/i&gt;事實 62&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--accent)&quot;&gt;&lt;/i&gt;推論 22&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c6)&quot;&gt;&lt;/i&gt;作者判斷 14&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--neg)&quot;&gt;&lt;/i&gt;待查 2&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;全頁句子依標記分類：事實（原文或財報直接寫的）占 62%；推論與作者判斷是從事實推出或取捨的結論，待查是找不到證據的地方。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估.json#/標記統計&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/section&gt;&lt;section id=&quot;s1&quot;&gt;&lt;h2&gt;1　商業輪廓：賣什麼、賣給誰、怎麼收錢&lt;/h2&gt;&lt;div&gt;&lt;span class=&quot;chip&quot;&gt;抽成（平台服務費）&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;廣告&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;支付手續費&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;放款利息與金融服務收入&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cards c3&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;賣什麼&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;公司自稱東南亞領先的超級 App，在八國 900 多個城市經營外送、叫車與數位金融服務，並經營新加坡 GXS Bank 與馬來西亞 GXBank 兩家數位銀行。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;金融服務包含數位支付、放款、應收帳款承購與保險，品牌有 GrabPay、GrabFin、GrabInsure 與印尼的 OVO。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src6&quot;&gt;[6]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;賣給誰&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;平台三邊：消費者叫車、點餐與付款，司機與商家透過平台接單；2025 年集團月交易用戶平均 4,720 萬、年增 14%，2026 年第三季 5,720 萬、年增 20%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src7&quot;&gt;[7]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src8&quot;&gt;[8]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src3&quot;&gt;[3]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;2026 年第三季外送月活躍商家年增 7%、自助廣告平台的季活躍廣告主年增 39%；活躍司機年增 20%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src9&quot;&gt;[9]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src10&quot;&gt;[10]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;怎麼收錢&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;叫車由消費者付車資與平台費，司機拿到扣除佣金或服務費後的金額；公司只把佣金認列為營收（淨額）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src7&quot;&gt;[7]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;簽約商家依交易量付 GrabPay 手續費；給消費者的獎勵金與回饋直接沖減營收，不列費用，所以金融服務過去曾出現負營收。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src11&quot;&gt;[11]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;2026 年第三季外送、叫車合計獎勵金占隨選 GMV 10.7%，年增 64 個基點，公司說是投入司機供給與推新產品。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src12&quot;&gt;[12]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;callout&quot;&gt;&lt;b&gt;解讀&lt;/b&gt;&lt;p class=&quot;s&quot;&gt;2025 年營收 3,370 百萬美元：外送 1,800、叫車 1,219、金融服務 347、其他 4（同一層分部，可加總）；外送約占 53%（推算）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src13&quot;&gt;[13]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;2025 年地區營收：馬來西亞 1,039（年增 27%）、新加坡 727（26%）、印尼 715（11%），三國約占 74%（推算）；地區軸與分部軸是兩種切法，不可互相加總。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src14&quot;&gt;[14]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;2026 年第三季營收 1,112：外送 561、叫車 349、金融服務 201；金融服務占比由一年前約 10% 升到約 18%（90÷873、201÷1,112，推算），組成正往金融服務移動，而這一段含併表。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src3&quot;&gt;[3]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src15&quot;&gt;[15]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src16&quot;&gt;[16]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src17&quot;&gt;[17]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;s2&quot;&gt;&lt;h2&gt;2　商業模式驗證：說的 vs 做的&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;管理層在 10-K、10-Q、8-K 的說法，對照財報數字。判定：已驗證／部分支持／說法未獲數字支持／待查。&lt;/p&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;說的 vs 做的：判定分布&lt;/figcaption&gt;&lt;svg viewBox=&quot;0 0 640 58&quot; role=&quot;img&quot; aria-label=&quot;說的vs做的判定&quot;&gt;&lt;rect x=&quot;4.0&quot; y=&quot;6&quot; width=&quot;158.0&quot; height=&quot;26&quot; fill=&quot;var(--pos)&quot;&gt;&lt;title&gt;已驗證 1&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;83.0&quot; y=&quot;24&quot; class=&quot;inb&quot; text-anchor=&quot;middle&quot;&gt;已驗證 1&lt;/text&gt;&lt;rect x=&quot;162.0&quot; y=&quot;6&quot; width=&quot;474.0&quot; height=&quot;26&quot; fill=&quot;var(--warn)&quot;&gt;&lt;title&gt;部分支持 3&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;399.0&quot; y=&quot;24&quot; class=&quot;inb&quot; text-anchor=&quot;middle&quot;&gt;部分支持 3&lt;/text&gt;&lt;text x=&quot;4&quot; y=&quot;52&quot; class=&quot;ax&quot;&gt;合計 4&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;lg&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--pos)&quot;&gt;&lt;/i&gt;已驗證 1&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--warn)&quot;&gt;&lt;/i&gt;部分支持 3&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;管理層 4 條說法對照財報數字的結果；3 條不是「已驗證」，下方用色框標出（有問題的證據）。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估.json#/內容/說的vs做的/判定&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;div class=&quot;callout warnc&quot;&gt;&lt;b&gt;有問題的證據（判定不是「已驗證」）&lt;/b&gt;&lt;ul class=&quot;badl&quot;&gt;&lt;li&gt;&lt;a href=&quot;#cl1&quot;&gt;2026 全年營收指引上修&lt;/a&gt; &lt;span class=&quot;v v-部分支持&quot;&gt;部分支持&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a href=&quot;#cl3&quot;&gt;2025–2028 集團營收年複合 30% 以上&lt;/a&gt; &lt;span class=&quot;v v-部分支持&quot;&gt;部分支持&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a href=&quot;#cl4&quot;&gt;放款規模擴大時密切控管信用品質&lt;/a&gt; &lt;span class=&quot;v v-部分支持&quot;&gt;部分支持&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;div class=&quot;cards&quot;&gt;&lt;div class=&quot;card claim cv-部分支持&quot; id=&quot;cl1&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;2026 全年營收指引上修&lt;/b&gt;&lt;span class=&quot;v v-部分支持&quot;&gt;部分支持&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;管理層說法&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;公司 2026-11-03 第二次上修 2026 年集團營收指引到 41.5–42.0 億美元（年增 23%–25%），2 月原指引是 40.4–41.0 億。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src18&quot;&gt;[18]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src19&quot;&gt;[19]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對照數字&lt;/div&gt;&lt;ul class=&quot;ev&quot;&gt;&lt;li class=&quot;s&quot;&gt;前九個月營收 3,064，第四季要做到 1,086–1,136 才落在區間（推算）；第三季單季已是 1,112。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src20&quot;&gt;[20]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;lbl&quot;&gt;說明&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;全年還沒結束，只能說前九個月的進度與區間一致；上修的一部分來自第三季 Superbank、Stash 併表，不全是原業務超前。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src4&quot;&gt;[4]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src20&quot;&gt;[20]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card claim cv-已驗證&quot; id=&quot;cl2&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;2025 年首度全年獲利&lt;/b&gt;&lt;span class=&quot;v v-已驗證&quot;&gt;已驗證&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;管理層說法&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;公司 2025 年第四季新聞稿標題寫 2025 年是首個全年淨利年度。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src21&quot;&gt;[21]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對照數字&lt;/div&gt;&lt;ul class=&quot;ev&quot;&gt;&lt;li class=&quot;s&quot;&gt;年報 2025 年本期淨利 200 百萬美元，2024 年虧損 158、2023 年虧損 485；營業利益 2025 年 65，2024 年 −168。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src2&quot;&gt;[2]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src22&quot;&gt;[22]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;li class=&quot;s&quot;&gt;2025 年稅前利益 269 中淨財務收入 203，營業利益只有 65，獲利有一大半來自財務收入。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src22&quot;&gt;[22]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;lbl&quot;&gt;說明&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;淨利轉正有申報數字；本業營業利益也已轉正，但幅度小，獲利結構仍倚重現金部位的利息。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src22&quot;&gt;[22]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card claim cv-部分支持&quot; id=&quot;cl3&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;2025–2028 集團營收年複合 30% 以上&lt;/b&gt;&lt;span class=&quot;v v-部分支持&quot;&gt;部分支持&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;管理層說法&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;財務長 2026-09-15 隨 Atome Financial 收購公告，把 2028 年調整後 EBITDA 目標上調到 17 億、2025–2028 集團營收年複合成長上調到 30% 以上；2 月原本是年複合 20%，並註明主要靠內生擴張。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src23&quot;&gt;[23]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src19&quot;&gt;[19]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對照數字&lt;/div&gt;&lt;ul class=&quot;ev&quot;&gt;&lt;li class=&quot;s&quot;&gt;2026 年第三季集團營收年增 27%，其中金融服務年增 124%，含 6 月 Superbank 併表與本季 Stash 併表；不含金融服務的平台營收由 783 到 911，年增約 16.3%（推算）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src3&quot;&gt;[3]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src17&quot;&gt;[17]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src4&quot;&gt;[4]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;li class=&quot;s&quot;&gt;Atome 60% 股權收購要到 2027 年第三季前才完成交割，仍待監管核准。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src24&quot;&gt;[24]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;lbl&quot;&gt;說明&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;上調後的 30% 含尚未交割的併購，與 2 月的內生 20% 口徑不同；目前內生的平台成長約 16%，靠原業務撐不到 30%，差距要由併購補。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src23&quot;&gt;[23]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src19&quot;&gt;[19]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src3&quot;&gt;[3]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card claim cv-部分支持&quot; id=&quot;cl4&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;放款規模擴大時密切控管信用品質&lt;/b&gt;&lt;span class=&quot;v v-部分支持&quot;&gt;部分支持&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;管理層說法&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;公司說放款組合擴大時密切管理信用品質，第三季逾期 90 天以上的不良放款占放款總額 2.6%，信用損失準備 6.5%、約為不良放款 2.4 倍。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src25&quot;&gt;[25]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src26&quot;&gt;[26]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對照數字&lt;/div&gt;&lt;ul class=&quot;ev&quot;&gt;&lt;li class=&quot;s&quot;&gt;放款總額 2,711 百萬美元、年增 200%（不含 Superbank 年增 115%）；前九個月金融資產淨減損損失 178，一年前 103，增加約 73%（推算）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src4&quot;&gt;[4]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src25&quot;&gt;[25]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src20&quot;&gt;[20]&lt;/a&gt;&lt;/sup&gt;&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;lbl&quot;&gt;說明&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;準備覆蓋率有數字，但放款兩年內大幅擴張、多數是新貸款，不良率還沒經過一次完整的信用循環；減損增速低於放款增速是因分母擴得快，不等於信用品質已驗證。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src4&quot;&gt;[4]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src20&quot;&gt;[20]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;s3&quot;&gt;&lt;h2&gt;3　成長引擎與卡點&lt;/h2&gt;&lt;h3&gt;成長從哪裡來（量、價、新產品、新市場、併購）&lt;/h3&gt;&lt;div class=&quot;cards&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;span class=&quot;chip&quot;&gt;量&lt;/span&gt;&lt;span class=&quot;qz&quot;&gt;能否量化：可量化&lt;/span&gt;&lt;/div&gt;&lt;b&gt;外送、叫車用戶與交易數擴張&lt;/b&gt;&lt;div class=&quot;lbl&quot;&gt;證據&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;第三季隨選 GMV 6,835 百萬美元、年增 18%（固定匯率 22%），由隨選月交易用戶年增 16% 與每用戶 GMV 年增 2% 組成；叫車交易數年增 21%，快於叫車 GMV 的 14%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src3&quot;&gt;[3]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src27&quot;&gt;[27]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;成長幾乎全靠用戶與交易數，每筆叫車金額在下降（交易數快於 GMV），代表平價產品在擴量。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src27&quot;&gt;[27]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;span class=&quot;chip&quot;&gt;新產品&lt;/span&gt;&lt;span class=&quot;qz&quot;&gt;能否量化：部分量化&lt;/span&gt;&lt;/div&gt;&lt;b&gt;外送廣告變現&lt;/b&gt;&lt;div class=&quot;lbl&quot;&gt;證據&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;外送營收年增 21% 的主因是食品雜貨 GMV 擴張與廣告變現提高；外送分部調整後 EBITDA 占 GMV 由 2.1% 升到 2.7%，自助廣告主年增 39%、平均支出年增 13%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src28&quot;&gt;[28]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src9&quot;&gt;[9]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;span class=&quot;chip&quot;&gt;新產品&lt;/span&gt;&lt;span class=&quot;qz&quot;&gt;能否量化：可量化&lt;/span&gt;&lt;/div&gt;&lt;b&gt;金融服務放款（內生部分）&lt;/b&gt;&lt;div class=&quot;lbl&quot;&gt;證據&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;第三季放款撥貸 19 億美元、年增 115%，不含 Superbank 的放款組合年增 115%；金融服務分部調整後 EBITDA 首度轉正為 12。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src4&quot;&gt;[4]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src25&quot;&gt;[25]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;span class=&quot;chip&quot;&gt;併購&lt;/span&gt;&lt;span class=&quot;qz&quot;&gt;能否量化：無法量化&lt;/span&gt;&lt;/div&gt;&lt;b&gt;Superbank、Stash 併表與 Atome 收購（非內生）&lt;/b&gt;&lt;div class=&quot;lbl&quot;&gt;證據&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;金融服務第三季營收年增 124%，含 Superbank 6 月併表與 Stash 本季併表，公司沒有單獨揭露兩者的營收貢獻。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src4&quot;&gt;[4]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;Atome Financial 60% 股權以現金 14.9 億美元收購，2027 年第三季前交割；台灣 foodpanda 收購遭否決，第四季認列 6,000 萬分手費。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src24&quot;&gt;[24]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src29&quot;&gt;[29]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;這一段是買來的成長，不是內生；集團成長率中這部分的大小目前無法拆開。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src4&quot;&gt;[4]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;span class=&quot;chip&quot;&gt;新市場&lt;/span&gt;&lt;span class=&quot;qz&quot;&gt;能否量化：可量化&lt;/span&gt;&lt;/div&gt;&lt;b&gt;東南亞其他國家&lt;/b&gt;&lt;div class=&quot;lbl&quot;&gt;證據&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;「東南亞其他」2025 年營收 30 百萬美元、年增 100%，占集團不到 1%（推算）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src14&quot;&gt;[14]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;h3 id=&quot;stuck&quot;&gt;卡住訊號（數位平台固定清單，同卡公司逐條相同）&lt;/h3&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;卡住訊號燈號&lt;/figcaption&gt;&lt;div class=&quot;board&quot;&gt;&lt;div class=&quot;bgrp&quot;&gt;&lt;div class=&quot;bgn&quot;&gt;機械訊號（財報數字算得出）&lt;/div&gt;&lt;div class=&quot;tiles&quot;&gt;&lt;a class=&quot;tile&quot; href=&quot;#sig-G1&quot; style=&quot;--tc:var(--muted)&quot;&gt;&lt;span class=&quot;dot&quot;&gt;&lt;/span&gt;&lt;b&gt;G1&lt;/b&gt; 營收增速連續放緩&lt;span class=&quot;tst&quot;&gt;資料未取得&lt;/span&gt;&lt;/a&gt;&lt;a class=&quot;tile&quot; href=&quot;#sig-G2&quot; style=&quot;--tc:var(--muted)&quot;&gt;&lt;span class=&quot;dot&quot;&gt;&lt;/span&gt;&lt;b&gt;G2&lt;/b&gt; 營業利益率走弱&lt;span class=&quot;tst&quot;&gt;資料未取得&lt;/span&gt;&lt;/a&gt;&lt;a class=&quot;tile&quot; href=&quot;#sig-G3&quot; style=&quot;--tc:var(--muted)&quot;&gt;&lt;span class=&quot;dot&quot;&gt;&lt;/span&gt;&lt;b&gt;G3&lt;/b&gt; 收款變慢&lt;span class=&quot;tst&quot;&gt;資料未取得&lt;/span&gt;&lt;/a&gt;&lt;a class=&quot;tile&quot; href=&quot;#sig-G4&quot; style=&quot;--tc:var(--muted)&quot;&gt;&lt;span class=&quot;dot&quot;&gt;&lt;/span&gt;&lt;b&gt;G4&lt;/b&gt; 投入換不到成長&lt;span class=&quot;tst&quot;&gt;資料未取得&lt;/span&gt;&lt;/a&gt;&lt;a class=&quot;tile&quot; href=&quot;#sig-T3&quot; style=&quot;--tc:var(--muted)&quot;&gt;&lt;span class=&quot;dot&quot;&gt;&lt;/span&gt;&lt;b&gt;T3&lt;/b&gt; 業務費用效率變差&lt;span class=&quot;tst&quot;&gt;資料未取得&lt;/span&gt;&lt;/a&gt;&lt;a class=&quot;tile&quot; href=&quot;#sig-T4&quot; style=&quot;--tc:var(--muted)&quot;&gt;&lt;span class=&quot;dot&quot;&gt;&lt;/span&gt;&lt;b&gt;T4&lt;/b&gt; 研發加重而成長沒跟上&lt;span class=&quot;tst&quot;&gt;資料未取得&lt;/span&gt;&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;bgrp&quot;&gt;&lt;div class=&quot;bgn&quot;&gt;作者訊號（財報數字看不出，作者讀原文判斷）&lt;/div&gt;&lt;div class=&quot;tiles&quot;&gt;&lt;a class=&quot;tile&quot; href=&quot;#sig-T1&quot; style=&quot;--tc:var(--neg)&quot;&gt;&lt;span class=&quot;dot&quot;&gt;&lt;/span&gt;&lt;b&gt;T1&lt;/b&gt; 抽成率下降&lt;span class=&quot;tst&quot;&gt;亮燈&lt;/span&gt;&lt;/a&gt;&lt;a class=&quot;tile&quot; href=&quot;#sig-T2&quot; style=&quot;--tc:var(--pos)&quot;&gt;&lt;span class=&quot;dot&quot;&gt;&lt;/span&gt;&lt;b&gt;T2&lt;/b&gt; 使用頻率下降&lt;span class=&quot;tst&quot;&gt;未亮&lt;/span&gt;&lt;/a&gt;&lt;a class=&quot;tile&quot; href=&quot;#sig-T5&quot; style=&quot;--tc:var(--pos)&quot;&gt;&lt;span class=&quot;dot&quot;&gt;&lt;/span&gt;&lt;b&gt;T5&lt;/b&gt; 夥伴或對手轉自營&lt;span class=&quot;tst&quot;&gt;未亮&lt;/span&gt;&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;9 條固定訊號（同產業卡逐條相同）：亮燈 1（其中不計分 0）、未亮 2、資料未取得 6。紅＝亮燈、綠＝未亮、灰＝資料未取得；點方塊跳到該條判讀。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估.json#/內容/卡住訊號（狀態、取得、計分採用）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;div class=&quot;sub-h&quot;&gt;機械訊號（財報數字算得出）&lt;/div&gt;&lt;div class=&quot;cards&quot;&gt;&lt;div class=&quot;card sig&quot; id=&quot;sig-G1&quot; style=&quot;--tc:var(--lt-資料未取得, var(--muted))&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;G1　營收增速連續放緩&lt;/b&gt;&lt;span class=&quot;light l-資料未取得&quot;&gt;資料未取得&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;成長是不是一季比一季慢？&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;值&lt;/div&gt;&lt;div class=&quot;sv&quot;&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;機械值，期末 ；門檻  &lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;判讀&lt;/div&gt;&lt;div&gt;機械值不存在&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;工具沒有 IFRS 季度序列，改用 6-K：集團單季營收年增 2025 年第四季 19%、2026 年第一季 24%、第二季 22%、第三季 27%，沒有連續放緩。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src21&quot;&gt;[21]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src30&quot;&gt;[30]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src31&quot;&gt;[31]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src3&quot;&gt;[3]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;但集團數字含金融服務併表；不含金融服務的平台單季年增由第一季 21.5% 降到第三季 16.3%，隨選 GMV 年增也由 24% 降到 18%，平台本身是在放緩。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src32&quot;&gt;[32]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src30&quot;&gt;[30]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src3&quot;&gt;[3]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card sig&quot; id=&quot;sig-G2&quot; style=&quot;--tc:var(--lt-資料未取得, var(--muted))&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;G2　營業利益率走弱&lt;/b&gt;&lt;span class=&quot;light l-資料未取得&quot;&gt;資料未取得&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;規模變大，利潤率有沒有跟著變好？&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;值&lt;/div&gt;&lt;div class=&quot;sv&quot;&gt;—&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;機械值，期末 ；門檻 &amp;lt; -1.0 個百分點&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;判讀&lt;/div&gt;&lt;div&gt;機械值不存在&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;近四季營業利益率：截至 2026 年第三季 201÷3,970 約 5.1%，一年前 15÷3,228 約 0.5%，上升約 4.6 個百分點（推算，第四季 2024、2025 加前九個月），沒有走弱。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src22&quot;&gt;[22]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src20&quot;&gt;[20]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card sig&quot; id=&quot;sig-G3&quot; style=&quot;--tc:var(--lt-資料未取得, var(--muted))&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;G3　收款變慢&lt;/b&gt;&lt;span class=&quot;light l-資料未取得&quot;&gt;資料未取得&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;營收成長是不是靠放寬收款條件？&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;值&lt;/div&gt;&lt;div class=&quot;sv&quot;&gt;—&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;機械值，期末 2026-09-30；門檻 &amp;gt; +10.0 個百分點&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;判讀&lt;/div&gt;&lt;div&gt;資產負債表沒有此科目（不當零）&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;應收帳款及其他應收款 2026-09-30 為 244，2025 年底 240，九個月增 1.7%（推算），遠低於營收成長；放款屬金融服務的放款應收，另列在 C 區觀察，不混入收款條件。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src33&quot;&gt;[33]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card sig&quot; id=&quot;sig-G4&quot; style=&quot;--tc:var(--lt-資料未取得, var(--muted))&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;G4　投入換不到成長&lt;/b&gt;&lt;span class=&quot;light l-資料未取得&quot;&gt;資料未取得&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;資本支出加大，營收增速有沒有跟上？&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;值&lt;/div&gt;&lt;div class=&quot;sv&quot;&gt;—&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;機械值，期末 ；門檻 &amp;gt; +1.0 個百分點；且 營收近四季年增低於一年前&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;判讀&lt;/div&gt;&lt;div&gt;季資本支出或營收不足 8 季&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;季資本支出 2025 年第四季 81、2026 年前三季 33、49、71，近四季合計 234、約占近四季營收 5.9%（推算），比 2025 全年 97 明顯升高。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src34&quot;&gt;[34]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src35&quot;&gt;[35]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;亮燈的第二個條件（近四季營收年增低於一年前）不成立：近四季營收年增約 23%（3,970÷3,228，推算），高於 2025 全年的 20%；資本支出增加未對應成長變慢，暫不亮燈，馬來西亞 AI 資料中心出資要看最終協議後是否另成一塊投入。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src20&quot;&gt;[20]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src14&quot;&gt;[14]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src36&quot;&gt;[36]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card sig&quot; id=&quot;sig-T3&quot; style=&quot;--tc:var(--lt-資料未取得, var(--muted))&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;T3　業務費用效率變差&lt;/b&gt;&lt;span class=&quot;light l-資料未取得&quot;&gt;資料未取得&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;買成長的成本有沒有變貴？&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;值&lt;/div&gt;&lt;div class=&quot;sv&quot;&gt;—&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;機械值，期末 ；門檻 &amp;gt; +1.0 個百分點&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;判讀&lt;/div&gt;&lt;div&gt;None 對 None&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;工具抓不到 IFRS 損益表費用率，改用 6-K：第三季行銷費用 107÷1,112 約 9.6%，去年同季 92÷873 約 10.5%，下降約 0.9 個百分點（推算），未亮燈；但多數獎勵金沖減營收、不在行銷費用裡，費用率看不到全部的買量成本。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src20&quot;&gt;[20]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src11&quot;&gt;[11]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card sig&quot; id=&quot;sig-T4&quot; style=&quot;--tc:var(--lt-資料未取得, var(--muted))&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;T4　研發加重而成長沒跟上&lt;/b&gt;&lt;span class=&quot;light l-資料未取得&quot;&gt;資料未取得&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;研發投入是否換到成長？&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;值&lt;/div&gt;&lt;div class=&quot;sv&quot;&gt;—&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;機械值，期末 ；門檻 &amp;gt; +1.0 個百分點；且 單季營收年增低於去年同期&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;判讀&lt;/div&gt;&lt;div&gt;None 對 None&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;第三季研發 98÷1,112 約 8.8%，去年同季 103÷873 約 11.8%，下降約 3.0 個百分點（推算），研發沒有加重，未亮燈。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src20&quot;&gt;[20]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub-h&quot;&gt;作者訊號（財報數字看不出，作者讀原文判斷）&lt;/div&gt;&lt;div class=&quot;cards&quot;&gt;&lt;div class=&quot;card sig&quot; id=&quot;sig-T1&quot; style=&quot;--tc:var(--lt-亮燈, var(--muted))&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;T1　抽成率下降&lt;/b&gt;&lt;span class=&quot;light l-亮燈&quot;&gt;亮燈&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;平台從每筆交易留下的比例是不是在變少？&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;值&lt;/div&gt;&lt;div class=&quot;sv&quot;&gt;叫車營收÷GMV 14.9%（去年同季 15.5%）；外送 12.5%（持平）；兩者合計 13.3%（去年 13.5%）&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;作者從原文填&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;判讀&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;叫車 349÷2,335 約 14.9%，去年 317÷2,041 約 15.5%；外送 561÷4,500 約 12.5%，去年 465÷3,733 約 12.5%；合計 910÷6,835 約 13.3%，去年 782÷5,774 約 13.5%（推算）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src15&quot;&gt;[15]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src16&quot;&gt;[16]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src3&quot;&gt;[3]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;叫車下降約 0.6 個百分點，時間上對得上印尼兩輪抽成 7 月 1 日起由 20% 降到 8%，加上獎勵金占 GMV 年增 64 個基點；營收是扣獎勵後的淨額，口徑沒改，判為亮燈。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src5&quot;&gt;[5]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src12&quot;&gt;[12]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card sig&quot; id=&quot;sig-T2&quot; style=&quot;--tc:var(--lt-未亮, var(--muted))&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;T2　使用頻率下降&lt;/b&gt;&lt;span class=&quot;light l-未亮&quot;&gt;未亮&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;活躍用戶還在用得更多嗎？&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;值&lt;/div&gt;&lt;div class=&quot;sv&quot;&gt;叫車交易數年增 21% vs 隨選月交易用戶年增 16%&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;作者從原文填&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;判讀&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;第三季叫車交易數年增 21%，隨選月交易用戶年增 16%、每用戶 GMV 年增 2%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src27&quot;&gt;[27]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src3&quot;&gt;[3]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;交易數長得比用戶快，使用頻率沒有下降；外送訂單數公司沒揭露，只能看叫車。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src27&quot;&gt;[27]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card sig&quot; id=&quot;sig-T5&quot; style=&quot;--tc:var(--lt-未亮, var(--muted))&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;T5　夥伴或對手轉自營&lt;/b&gt;&lt;span class=&quot;light l-未亮&quot;&gt;未亮&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;供給或技術夥伴是否開始繞過平台？&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;值&lt;/div&gt;&lt;div class=&quot;sv&quot;&gt;未見重要夥伴繞過平台；併購受反壟斷限制&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;作者從原文填&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;判讀&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;供給面是個別司機與商家，2025 年年報沒有列出依賴度高的單一夥伴；年報提到連鎖商家與披薩業者自建點餐與外送車隊，是長期存在的競爭，不是新變化。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src37&quot;&gt;[37]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;近期的外部事件是台灣公平會否決 foodpanda 台灣收購，屬擴張受阻而非夥伴轉自營，不亮燈。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src38&quot;&gt;[38]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src29&quot;&gt;[29]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;h3 id=&quot;ext&quot;&gt;外部驗證：競爭者、客戶、供應商怎麼描述這家公司&lt;/h3&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;外部驗證：誰支持、誰反駁&lt;/figcaption&gt;&lt;div class=&quot;emx&quot; style=&quot;grid-template-columns:repeat(3,1fr)&quot;&gt;&lt;div class=&quot;emc&quot; style=&quot;--tc:var(--pos)&quot;&gt;&lt;div class=&quot;emh&quot;&gt;支持 &lt;b&gt;1&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;emi&quot;&gt;&lt;b&gt;Uber&lt;/b&gt;&lt;span&gt;競爭者&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;emc&quot; style=&quot;--tc:var(--warn)&quot;&gt;&lt;div class=&quot;emh&quot;&gt;部分支持 &lt;b&gt;2&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;emi&quot;&gt;&lt;b&gt;Ryde Group&lt;/b&gt;&lt;span&gt;競爭者&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;emi&quot;&gt;&lt;b&gt;台灣公平會（經 The Edge 報導）&lt;/b&gt;&lt;span&gt;其他&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;emc&quot; style=&quot;--tc:var(--neg)&quot;&gt;&lt;div class=&quot;emh&quot;&gt;反駁 &lt;b&gt;1&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;emi&quot;&gt;&lt;b&gt;GoTo（經 Reuters 報導）&lt;/b&gt;&lt;span&gt;競爭者&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;4 個外部來源（競爭者、客戶、供應商、夥伴的申報或報導）怎麼描述本公司：支持 1、部分支持 2、反駁 1。依「對本公司說法」欄的開頭分類。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估.json#/內容/外部驗證（對方、關係、支持）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;div class=&quot;cards&quot;&gt;&lt;div class=&quot;card ext&quot; style=&quot;--tc:var(--pos)&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;Uber&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;競爭者&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;對方文件怎麼說&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;Uber 2025 年 10-K 寫，因出售事業，合約限制它在東南亞與 Grab 競爭，直到處分全部 Grab 持股後一年為止；Uber 也把 Grab 列為叫車競爭者。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src39&quot;&gt;[39]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src40&quot;&gt;[40]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對本公司說法&lt;/div&gt;&lt;div class=&quot;stc&quot;&gt;支持&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card ext&quot; style=&quot;--tc:var(--warn)&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;Ryde Group&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;競爭者&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;對方文件怎麼說&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;新加坡叫車業者 Ryde 的 20-F 把 Grab、Gojek、TADA 與計程車業者列為新加坡主要競爭者，Grab 排第一個。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src41&quot;&gt;[41]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對本公司說法&lt;/div&gt;&lt;div class=&quot;stc&quot;&gt;部分支持&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card ext&quot; style=&quot;--tc:var(--neg)&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;GoTo（經 Reuters 報導）&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;競爭者&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;對方文件怎麼說&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;Reuters 報導 GoTo 與 Grab 同步自 7 月 1 日把印尼兩輪司機抽成由 20% 降到 8%，回應總統宣布的上限；兩家都沒有用抽成差異搶司機。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src5&quot;&gt;[5]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src42&quot;&gt;[42]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對本公司說法&lt;/div&gt;&lt;div class=&quot;stc&quot;&gt;反駁&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card ext&quot; style=&quot;--tc:var(--warn)&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;台灣公平會（經 The Edge 報導）&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;其他&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;對方文件怎麼說&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;報導指台灣公平會以反壟斷理由否決 Grab 以 6 億美元收購 foodpanda 台灣，雙方提出的承諾不足以解決競爭疑慮。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src38&quot;&gt;[38]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src43&quot;&gt;[43]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;對本公司說法&lt;/div&gt;&lt;div class=&quot;stc&quot;&gt;部分支持&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;sa&quot;&gt;&lt;h2&gt;4　優勢來源與持續期間&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;每種優勢都要同時有「好處」與「屏障」證據（Helmer《7 Powers》的檢驗）：只有好處、沒有屏障的優勢只算&lt;b&gt;暫時領先&lt;/b&gt;。再分兩維：超額報酬有多大、能撐多久（Mauboussin《Measuring the Moat》的問法）；Morningstar 五種來源只當分類參考。本節只談商業面的屏障，不含價格或估值，也不是估值報告的護城河評分，不進商業評估等級。&lt;/p&gt;&lt;div class=&quot;callout&quot;&gt;&lt;b&gt;總結&lt;/b&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;Grab 的優勢主要是在地網路密度，加上 Uber 退出東南亞的合約限制；但這份優勢目前換到的利潤差小，印尼抽成管制顯示它沒有定價權。跨服務整合的成本優勢有數字，屏障還待證明。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src39&quot;&gt;[39]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src5&quot;&gt;[5]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src44&quot;&gt;[44]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;優勢地圖：多大、多久&lt;/figcaption&gt;&lt;div class=&quot;amx&quot;&gt;&lt;div class=&quot;amy&quot;&gt;持續期間 →&lt;/div&gt;&lt;div class=&quot;amg&quot;&gt;&lt;div class=&quot;amr&quot; style=&quot;grid-template-columns:80px repeat(3,1fr)&quot;&gt;&lt;div class=&quot;aml&quot;&gt;10年以上&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;amr&quot; style=&quot;grid-template-columns:80px repeat(3,1fr)&quot;&gt;&lt;div class=&quot;aml&quot;&gt;5–10年&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;span class=&quot;ab ab-有屏障證據&quot; title=&quot;東南亞多國叫車與外送的在地網路密度：有屏障證據&quot;&gt;1&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;amr&quot; style=&quot;grid-template-columns:80px repeat(3,1fr)&quot;&gt;&lt;div class=&quot;aml&quot;&gt;不足5年&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;span class=&quot;ab ab-暫時領先&quot; title=&quot;超級 App 跨服務共用用戶與總部成本：暫時領先&quot;&gt;2&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amc&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;amr&quot; style=&quot;grid-template-columns:80px repeat(3,1fr)&quot;&gt;&lt;div class=&quot;aml&quot;&gt;&lt;/div&gt;&lt;div class=&quot;amx-l&quot;&gt;小&lt;/div&gt;&lt;div class=&quot;amx-l&quot;&gt;中&lt;/div&gt;&lt;div class=&quot;amx-l&quot;&gt;大&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;amxt&quot;&gt;超額報酬大小 →&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;ol class=&quot;akey&quot;&gt;&lt;li&gt;&lt;span class=&quot;ab ab-有屏障證據&quot;&gt;1&lt;/span&gt;東南亞多國叫車與外送的在地網路密度（網路經濟；有屏障證據）&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;ab ab-暫時領先&quot;&gt;2&lt;/span&gt;超級 App 跨服務共用用戶與總部成本（規模經濟；暫時領先）&lt;/li&gt;&lt;/ol&gt;&lt;div class=&quot;lg&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--pos)&quot;&gt;&lt;/i&gt;有屏障證據&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--warn)&quot;&gt;&lt;/i&gt;暫時領先&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;每個圓圈是一項優勢：越往右超額報酬越大、越往上能撐越久。綠＝屏障有事實證據；橘＝只有好處或屏障只有推論（暫時領先，持續期間最多不足 5 年）。作者寫「不明」的維度放在虛線格，不補值。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估.json#/內容/優勢來源/優勢（超額報酬大小、持續期間、判定）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;每項優勢有多少證據&lt;/figcaption&gt;&lt;svg viewBox=&quot;0 0 680 128&quot; role=&quot;img&quot; aria-label=&quot;優勢的證據數：好處與屏障&quot;&gt;&lt;text x=&quot;254&quot; y=&quot;124&quot; class=&quot;ax&quot;&gt;好處句數&lt;/text&gt;&lt;text x=&quot;459.0&quot; y=&quot;124&quot; class=&quot;ax&quot;&gt;屏障句數（事實／推論）&lt;/text&gt;&lt;text x=&quot;242&quot; y=&quot;32&quot; class=&quot;lb s&quot; text-anchor=&quot;end&quot;&gt;1 東南亞多國叫車與外送的在地網路密度&lt;title&gt;1 東南亞多國叫車與外送的在地網路密度&lt;/title&gt;&lt;/text&gt;&lt;rect x=&quot;250&quot; y=&quot;20&quot; width=&quot;82.5&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;337.5&quot; y=&quot;33&quot; class=&quot;vl s&quot;&gt;2&lt;/text&gt;&lt;rect x=&quot;455.0&quot; y=&quot;20&quot; width=&quot;82.5&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;var(--pos)&quot;/&gt;&lt;rect x=&quot;537.5&quot; y=&quot;20&quot; width=&quot;82.5&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;var(--accent)&quot; opacity=&quot;.7&quot;/&gt;&lt;text x=&quot;625.0&quot; y=&quot;33&quot; class=&quot;vl s&quot;&gt;2／2&lt;/text&gt;&lt;text x=&quot;242&quot; y=&quot;78&quot; class=&quot;lb s&quot; text-anchor=&quot;end&quot;&gt;2 超級 App 跨服務共用用戶與總部成本&lt;title&gt;2 超級 App 跨服務共用用戶與總部成本&lt;/title&gt;&lt;/text&gt;&lt;rect x=&quot;250&quot; y=&quot;66&quot; width=&quot;82.5&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;337.5&quot; y=&quot;79&quot; class=&quot;vl s&quot;&gt;2&lt;/text&gt;&lt;rect x=&quot;455.0&quot; y=&quot;66&quot; width=&quot;0.0&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;var(--pos)&quot;/&gt;&lt;rect x=&quot;455.0&quot; y=&quot;66&quot; width=&quot;41.2&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;var(--accent)&quot; opacity=&quot;.7&quot;/&gt;&lt;text x=&quot;501.2&quot; y=&quot;79&quot; class=&quot;vl s&quot;&gt;0／1&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;lg&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c3)&quot;&gt;&lt;/i&gt;好處&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--pos)&quot;&gt;&lt;/i&gt;屏障：事實&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--accent)&quot;&gt;&lt;/i&gt;屏障：推論&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;左邊是「它帶來什麼」的句數，右邊是「為什麼對手拿不走」的句數；屏障至少一句是事實（綠）才算有屏障證據。句數多不等於優勢強，只表示證據量。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估.json#/內容/優勢來源/優勢（好處、屏障的標記）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;div class=&quot;card advc&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;&lt;span class=&quot;num-b 有屏障證據&quot;&gt;1&lt;/span&gt;東南亞多國叫車與外送的在地網路密度&lt;/b&gt;&lt;span class=&quot;vd vd-有屏障證據&quot;&gt;有屏障證據&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;網路經濟（Network Economies）｜晨星：網路效應&lt;/div&gt;&lt;div class=&quot;two&quot;&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;好處（它帶來什麼）&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;2025 年隨選 GMV 221 億美元、八國 900 多個城市，2026 年第三季活躍司機年增 20% 創新高；叫車分部調整後 EBITDA 占 GMV 8.9%，年比持平。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src45&quot;&gt;[45]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src10&quot;&gt;[10]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;司機多、等車短，用戶多、司機收入高，兩邊互相拉，讓同一個城市的後進者要先補貼兩邊才能追上密度。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src46&quot;&gt;[46]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src10&quot;&gt;[10]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;屏障（為什麼對手拿不走）&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;同業 Uber 依合約不得在東南亞與 Grab 競爭，直到處分全部 Grab 持股後一年。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src39&quot;&gt;[39]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;年報在叫車列的對手，有單一國家業者（越南 Be Group、泰國 Bolt、新加坡 Tada 與 Ryde），也有在東南亞數國經營的 Xanh SM、Bolt、Maxim、InDrive，以及在印尼與新加坡的 Gojek；年報沒有寫這些對手在幾個國家同時有叫車與外送兩邊網路。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src37&quot;&gt;[37]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;多國對手已經存在，所以「跨國同時補出兩邊密度」的成本只能算推論上的屏障；有事實證據的屏障主要是 Uber 的合約限制，而這項限制在 Uber 處分持股一年後就失效。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src37&quot;&gt;[37]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src39&quot;&gt;[39]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;屏障的弱點：印尼抽成由政府定上限，GoTo 同步跟進降抽成，網路密度沒有換成定價權。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src5&quot;&gt;[5]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src47&quot;&gt;[47]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;two&quot;&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;超額報酬大小&lt;/div&gt;&lt;span class=&quot;lv&quot;&gt;小&lt;/span&gt;&lt;div class=&quot;s&quot;&gt;近四季營業利益率約 5.1%（推算），在四家同業中只高於 LYFT，低於 UBER 12.4%、CART 14.4%，與 DASH 5.6% 相近（yfinance 口徑）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src20&quot;&gt;[20]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src48&quot;&gt;[48]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;持續期間&lt;/div&gt;&lt;span class=&quot;lv&quot;&gt;5–10年&lt;/span&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;有事實證據的屏障是 Uber 的不競爭限制，持股期間加一年都有效；多國對手（Xanh SM、Bolt、Maxim、InDrive）已存在，城市層級的兩邊密度只是推論上的屏障，支撐力較弱。兩者合起來作者判斷仍可撐 5 年以上，但 Uber 可自行處分持股、印尼抽成管制與 Gojek 的存在，使它到不了 10 年以上。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src39&quot;&gt;[39]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src37&quot;&gt;[37]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src47&quot;&gt;[47]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card advc&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;&lt;span class=&quot;num-b 暫時領先&quot;&gt;2&lt;/span&gt;超級 App 跨服務共用用戶與總部成本&lt;/b&gt;&lt;span class=&quot;vd vd-暫時領先&quot;&gt;暫時領先&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;規模經濟（Scale Economies）｜晨星：成本優勢&lt;/div&gt;&lt;div class=&quot;two&quot;&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;好處（它帶來什麼）&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;區域總部成本第三季 101 百萬美元、年增 7 百萬，但占營收由 10.8% 降到 9.2%；行銷與研發費用率也同步下降。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src44&quot;&gt;[44]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src20&quot;&gt;[20]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;公司在年報說，超級 App 整合多項服務、讓消費者一站取得日常所需，因此與許多對手有別（differentiating us from many of our competitors）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src49&quot;&gt;[49]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;屏障（為什麼對手拿不走）&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;對手要複製，得同時經營外送、叫車與金融服務並取得數位銀行牌照；但年報也承認只做少數業務或單一市場的對手可以把資源集中、做得更專精，這段屏障目前只有推論、沒有對手面的事實證據。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src50&quot;&gt;[50]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src1&quot;&gt;[1]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;two&quot;&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;超額報酬大小&lt;/div&gt;&lt;span class=&quot;lv&quot;&gt;小&lt;/span&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;總部成本占營收下降 1.6 個百分點，幅度可量化，但整體營業利益率仍只有約 5%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src44&quot;&gt;[44]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src20&quot;&gt;[20]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;持續期間&lt;/div&gt;&lt;span class=&quot;lv&quot;&gt;不足5年&lt;/span&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;屏障沒有對手面的事實證據，只能算暫時領先。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src50&quot;&gt;[50]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;note&quot;&gt;判定規則：屏障欄至少一句標「事實」並附出處才算「有屏障證據」；否則只算「暫時領先」，持續期間最多寫「不足5年」。&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;s4&quot;&gt;&lt;h2&gt;5　生命週期與未來變化&lt;/h2&gt;&lt;div class=&quot;stages&quot;&gt;&lt;div class=&quot;&quot;&gt;起步&lt;/div&gt;&lt;div class=&quot;on&quot;&gt;成長&lt;/div&gt;&lt;div class=&quot;&quot;&gt;成熟&lt;/div&gt;&lt;div class=&quot;&quot;&gt;衰退&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;lead&quot;&gt;估值報告的林區分類（引用，不重判）：快速成長&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;營收 2023–2025 年由 2,359 到 3,370、年增 19%–20%，營業利益由 −519 轉為 65，2025 年才首次全年營業獲利。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src2&quot;&gt;[2]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src51&quot;&gt;[51]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;公司在年報自述業務仍處成長階段，並認為東南亞外送、叫車與數位支付的普及率仍低。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src52&quot;&gt;[52]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src53&quot;&gt;[53]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;研究報告的林區分類是「快速成長」（兼具轉機），與本頁的「成長」一致；本頁補一點：平台內生成長已由 20% 以上降到約 16%，成長期後段的跡象比集團數字看起來明顯。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src54&quot;&gt;[54]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src32&quot;&gt;[32]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;callout&quot;&gt;&lt;b&gt;最可能的轉變：成長轉成熟&lt;/b&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;條件是平台（不含金融服務）單季營收年增連兩季低於 12%，而且獎勵金占隨選 GMV 不再下降、營業利益率提升主要靠費用壓縮。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src3&quot;&gt;[3]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src12&quot;&gt;[12]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lead&quot;&gt;怎麼檢驗&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;每季 6-K 新聞稿用集團營收減金融服務營收算平台年增，對照隨選 GMV 年增與獎勵金占 GMV。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src3&quot;&gt;[3]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src17&quot;&gt;[17]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;s5&quot;&gt;&lt;h2&gt;6　週期推論&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;三種證據都寫成「區間＋條件」，不給單一日期。&lt;/p&gt;&lt;div class=&quot;callout&quot;&gt;&lt;b&gt;綜合：目前成長期後段再延續約 4–8 季（2027 年至 2028 年上半年）&lt;/b&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;前提是平台單季營收年增維持 12% 以上、叫車營收占 GMV 不再年降超過 0.5 個百分點；若印尼司機改列準雇員落地，或抽成上限延伸到四輪，區間縮到 4 季以內。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src47&quot;&gt;[47]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src16&quot;&gt;[16]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;2027 年 Atome 併表會讓集團營收再跳一段，屆時要扣掉併購才看得出內生是否轉入成熟。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src24&quot;&gt;[24]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;沒有季度序列與完整循環可依，區間主要依平台增速的下滑斜率與公司特有事件推估，信心中低。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src55&quot;&gt;[55]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src32&quot;&gt;[32]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/div&gt;&lt;h3&gt;① 自身歷史循環&lt;/h3&gt;&lt;p class=&quot;s&quot;&gt;營收年增 2023 年約 65%（1,433→2,359），2024、2025 年降到 19%、20%（推算）；營業利益 2022 年 −1,373、2023 年 −519、2024 年 −168、2025 年 65，是一路改善、沒有起伏的單向路徑。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src56&quot;&gt;[56]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src51&quot;&gt;[51]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;2023 年的高成長來自 GMV 增加與壓低獎勵金，獎勵金占 GMV 2023–2025 年為 9.9%、10.0%、10.2%；這是補貼策略的一次性調整，不是景氣循環。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src45&quot;&gt;[45]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;工具抓不到 IFRS 季度序列，之字形轉折無法機械判定；上市以來沒有見過一次完整的需求循環，自身歷史不能判斷循環位置。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src55&quot;&gt;[55]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;h3&gt;② 訂單能見度&lt;/h3&gt;&lt;p class=&quot;s&quot;&gt;隨選交易沒有剩餘履約義務或積壓訂單可看，公司也沒揭露；能見度只有公司給的全年指引。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src57&quot;&gt;[57]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src18&quot;&gt;[18]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;h3&gt;③ 公司特有週期&lt;/h3&gt;&lt;p class=&quot;s&quot;&gt;印尼兩輪抽成自 2026-07-01 由 20% 降到 8%；年報提到媒體報導的總統令草案，會把現行 20% 上限降為統一 10%，並把司機改列準雇員、由平台負擔意外與死亡保險及健康、養老、退休金提撥。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src5&quot;&gt;[5]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src47&quot;&gt;[47]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;草案要調降的 20% 上限出自交通部 2022 年第 667 號令，那份規定管的是機車叫車平台，所以抽成部分已被 7 月的 8% 蓋過；上限會不會延伸到四輪，年報與新聞都沒有寫，待作者後續追蹤，尚未落地的是司機改列準雇員。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src47&quot;&gt;[47]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src58&quot;&gt;[58]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src5&quot;&gt;[5]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;公司在投資司機供給、加速電動車轉換：第三季電動車占四輪完成趟次 18%，第一季是 13%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src10&quot;&gt;[10]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;s&quot;&gt;Atome 收購 2027 年第三季前交割；馬來西亞 AI 基礎設施 Grab 出資 7.5 億美元、依里程碑分階段。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src24&quot;&gt;[24]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src36&quot;&gt;[36]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;/section&gt;&lt;section id=&quot;s6&quot;&gt;&lt;h2&gt;7　觀察清單：下季要看什麼&lt;/h2&gt;&lt;div class=&quot;cards&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;平台（不含金融服務）單季營收年增&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;人工對照&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;目前值&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;2026 年第三季約 16.3%（911÷783，推算）&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src3&quot;&gt;[3]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src17&quot;&gt;[17]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;看什麼&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;是否守住 12% 以上&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;改判方向&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;若連兩季低於 12%，則生命週期轉成熟，成長動能下修&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;叫車營收÷叫車 GMV&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;人工對照&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;目前值&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;2026 年第三季約 14.9%，去年同季 15.5%（推算）&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src16&quot;&gt;[16]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;看什麼&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;印尼抽成下調的影響是否擴大&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;改判方向&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;若年降超過 1 個百分點，或印尼司機改列準雇員落地、抽成上限延伸到四輪，則抽成卡點加重，卡點風險下修&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;隨選獎勵金占隨選 GMV&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;人工對照&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;目前值&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;2026 年第三季 10.7%，年增 64 個基點、季減 17 個基點&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src12&quot;&gt;[12]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src59&quot;&gt;[59]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;看什麼&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;量的成長是不是靠補貼買來&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;改判方向&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;若連兩季高於 11% 且 GMV 年增未回升，則成長品質下降，量的引擎要重估&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;金融服務不良放款率（逾期 90 天）&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;人工對照&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;目前值&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;2026 年第三季 2.6%，信用損失準備 6.5%、覆蓋約 2.4 倍&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src25&quot;&gt;[25]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src26&quot;&gt;[26]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;看什麼&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;放款年增 200% 之後信用品質是否跟上&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;改判方向&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;若不良率升破 4% 或覆蓋倍數低於 2 倍，則金融服務由第二引擎轉成卡點，說法可信度下修&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;近四季營業利益率&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;自動對照&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;目前值&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;截至 2026 年第三季約 5.1%（201÷3,970，推算）&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src20&quot;&gt;[20]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src22&quot;&gt;[22]&lt;/a&gt;&lt;/sup&gt;&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;看什麼&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;規模變大後利潤率是否持續提升&lt;/p&gt;&lt;div class=&quot;lbl&quot;&gt;改判方向&lt;/div&gt;&lt;p class=&quot;s&quot;&gt;若低於 4%，則營業槓桿停滯，模式穩固度下修&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;h3&gt;推論紀錄（下一季財報後自動對照）&lt;/h3&gt;&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;推論&lt;/th&gt;&lt;th&gt;方法&lt;/th&gt;&lt;th&gt;檢驗指標&lt;/th&gt;&lt;th&gt;條件&lt;/th&gt;&lt;th&gt;基準季&lt;/th&gt;&lt;th&gt;檢驗時點&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;P1&lt;/td&gt;&lt;td&gt;Atome 交割前，集團單季營收年增在 2027 年第二季仍維持 20% 以上（含 Superbank、Stash 滿一年後的基期墊高）&lt;/td&gt;&lt;td&gt;公司特有&lt;/td&gt;&lt;td&gt;營收單季年增&lt;/td&gt;&lt;td&gt;&amp;gt;= 0.2&lt;/td&gt;&lt;td&gt;2026-09-30&lt;/td&gt;&lt;td&gt;2027 年第二季 6-K 新聞稿（約 2027 年 8 月）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;P2&lt;/td&gt;&lt;td&gt;營業槓桿延續，近四季營業利益率到 2027 年第二季達 6% 以上&lt;/td&gt;&lt;td&gt;自身歷史&lt;/td&gt;&lt;td&gt;營業利益率_近四季&lt;/td&gt;&lt;td&gt;&amp;gt;= 0.06&lt;/td&gt;&lt;td&gt;2026-09-30&lt;/td&gt;&lt;td&gt;2027 年第二季 6-K 新聞稿（約 2027 年 8 月）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;P3&lt;/td&gt;&lt;td&gt;印尼兩輪抽成下調滿一年前，叫車營收占 GMV 在 2027 年第二季仍低於 15.5%（人工對照）&lt;/td&gt;&lt;td&gt;公司特有&lt;/td&gt;&lt;td&gt;人工&lt;/td&gt;&lt;td&gt; &lt;/td&gt;&lt;td&gt;2026-09-30&lt;/td&gt;&lt;td&gt;2027 年第二季 6-K 新聞稿（約 2027 年 8 月）&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;lead&quot;&gt;每條推論從檢驗期末起，每個新季度記一筆命中或落空（預測帳本，公司資料夾 商業評估檢驗.json）；方法準確度跨公司統計見 優化/商業評估預測帳本.json。&lt;/p&gt;&lt;/section&gt;&lt;section id=&quot;sg&quot;&gt;&lt;h2&gt;商業評估等級明細&lt;span class=&quot;ruleok&quot;&gt;評分規則第一版，2026-11-07 使用者核定&lt;/span&gt;&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;五個面向各 1–5 分，相對同產業卡同業評比；機械建議分由工具依同業位置、卡住訊號與驗證比例算出，作者可調整但要寫理由。加權分 3.25 → C 級，套用上限後 C 級。等級門檻：A ≥ 4.2、B ≥ 3.5、C ≥ 2.8、D ≥ 2.1、其餘 E。&lt;/p&gt;&lt;div class=&quot;cards&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;模式穩固度&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;權重 &lt;span class=&quot;num&quot;&gt;25%&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;fs&quot;&gt;&lt;span&gt;作者分 &lt;span class=&quot;num v&quot;&gt;3&lt;/span&gt;&lt;/span&gt;&lt;span&gt;機械建議 &lt;span class=&quot;num&quot;&gt;2&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;近四季營業利益率同業百分位 0.25&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;理由&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;撮合抽成的模式已證明能獲利：2025 年首度全年營業獲利 65，近四季營業利益 201、利益率約 5.1%（推算）；叫車分部調整後 EBITDA 占 GMV 8.9%，年比持平。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src22&quot;&gt;[22]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src20&quot;&gt;[20]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src10&quot;&gt;[10]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;機械建議 2 分只看營業利益率同業排名；集團利益率被金融服務的減損（前九個月 178）與擴張中的放款壓低，平台本身三個分部合計調整後 EBITDA 338，比機械排名反映的穩，故高 1 分。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src60&quot;&gt;[60]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src3&quot;&gt;[3]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src20&quot;&gt;[20]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;同業對照&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;營業利益率 GRAB 約 5.1%，UBER 12.4%、CART 14.4%、DASH 5.6%、LYFT −2.4%（yfinance 口徑，截至 2026-09-30）。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src48&quot;&gt;[48]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;成長動能&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;權重 &lt;span class=&quot;num&quot;&gt;25%&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;fs&quot;&gt;&lt;span&gt;作者分 &lt;span class=&quot;num v&quot;&gt;4&lt;/span&gt;&lt;/span&gt;&lt;span&gt;機械建議 &lt;span class=&quot;num&quot;&gt;4&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;最近一季營收年增同業百分位 0.75（yfinance 口徑）&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;理由&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;集團第三季營收年增 27%（固定匯率 30%），平台不含金融服務約 16.3%（推算），隨選 GMV 年增 18%；內生仍是雙位數，但平台在減速，集團加速的部分含併表。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src3&quot;&gt;[3]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src4&quot;&gt;[4]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;同業對照&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;最近一季營收年增 GRAB 27.4%，DASH 34.0%、CART 16.6%、UBER 9.6%、LYFT 8.1%（yfinance 口徑）；只用平台約 16% 比，仍高於 UBER、LYFT，與 CART 相近。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src61&quot;&gt;[61]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src17&quot;&gt;[17]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;卡點風險&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;權重 &lt;span class=&quot;num&quot;&gt;20%&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;fs&quot;&gt;&lt;span&gt;作者分 &lt;span class=&quot;num v&quot;&gt;3&lt;/span&gt;&lt;/span&gt;&lt;span&gt;機械建議 &lt;span class=&quot;num&quot;&gt;4&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;計分採用的亮燈 1 條（T1）；資料未取得 6 條&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;理由&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;九條卡住訊號只有 T1 抽成率下降亮燈；但六條機械訊號工具都沒有資料，是作者用 6-K 補算判讀的。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src62&quot;&gt;[62]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src16&quot;&gt;[16]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;比亮燈數多扣 1 分：印尼草案的司機改列準雇員尚未落地、抽成上限會不會延伸到四輪未揭露，放款一年擴大 3 倍、尚未經過信用循環，這兩個卡點不在固定訊號清單裡。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src47&quot;&gt;[47]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src4&quot;&gt;[4]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;同業對照&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-待查&quot;&gt;待查&lt;/span&gt;同業還沒做商業評估，卡住訊號無法逐條對照；待查：UBER、DASH 完成商業評估後比較亮燈數。叫車抽成受政府直接定上限的情況，Uber 的申報片段裡沒有找到可對照的說法。&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;週期位置&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;權重 &lt;span class=&quot;num&quot;&gt;15%&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;fs&quot;&gt;&lt;span&gt;作者分 &lt;span class=&quot;num v&quot;&gt;3&lt;/span&gt;&lt;/span&gt;&lt;span&gt;機械建議 &lt;span class=&quot;num&quot;&gt;—&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;未見完整循環（或季數不足）：作者判斷&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;理由&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;工具沒有季度序列，週期位置無機械建議分；營業利益仍在單向改善、平台增速在下滑，判為成長期後段、還沒到轉折。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src60&quot;&gt;[60]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src51&quot;&gt;[51]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src32&quot;&gt;[32]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;同業對照&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;同業的週期位置待查：DASH、CART、LYFT 尚未做商業評估；只能比較最近一季營收年增，GRAB 27.4% 高於 UBER 9.6%、LYFT 8.1%。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src61&quot;&gt;[61]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;&lt;b&gt;說法可信度&lt;/b&gt;&lt;span class=&quot;qz&quot;&gt;權重 &lt;span class=&quot;num&quot;&gt;15%&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;fs&quot;&gt;&lt;span&gt;作者分 &lt;span class=&quot;num v&quot;&gt;3&lt;/span&gt;&lt;/span&gt;&lt;span&gt;機械建議 &lt;span class=&quot;num&quot;&gt;4&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lead&quot;&gt;已判定 4 條，驗證比例 0.62&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;理由&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-推論&quot;&gt;推論&lt;/span&gt;四條說法一條已驗證（全年獲利）、三條部分支持（全年指引進度、30% 年複合、信用品質）；最大的落差是 2028 年 30% 年複合含尚未交割的併購，與 2 月內生 20% 的口徑不同。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src23&quot;&gt;[23]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src19&quot;&gt;[19]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src2&quot;&gt;[2]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;另外調整後自由現金流自第二季起排除金融服務的資金部位變動，口徑改過；第三季營業活動現金流 55、年改善 182，主因是數位銀行存款流入比去年多 4.04 億，部分被放款撥出多 2.94 億抵銷。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src63&quot;&gt;[63]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src64&quot;&gt;[64]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-作者判斷&quot;&gt;作者判斷&lt;/span&gt;機械建議 4 分只看判定的比例（0.62）；作者低 1 分，因為唯一「已驗證」的獲利說法大半靠財務收入，而最重要的成長目標在半年內換了口徑（內生 20% 改成含併購 30% 以上），現金流指標也改過定義。&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src65&quot;&gt;[65]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src22&quot;&gt;[22]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src23&quot;&gt;[23]&lt;/a&gt;&lt;/sup&gt;&lt;sup class=&quot;ref&quot;&gt;&lt;a href=&quot;#src63&quot;&gt;[63]&lt;/a&gt;&lt;/sup&gt;&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;同業對照&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;&lt;span class=&quot;tag t-待查&quot;&gt;待查&lt;/span&gt;同業說法可信度待查：UBER 以外的同業尚未做商業評估，沒有可比的驗證比例。&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;figure class=&quot;fig&quot;&gt;&lt;figcaption class=&quot;ft&quot;&gt;相對同業：成長與利潤率&lt;/figcaption&gt;&lt;svg viewBox=&quot;0 0 680 300&quot; role=&quot;img&quot; aria-label=&quot;同業位置：營收年增與營業利益率&quot;&gt;&lt;line x1=&quot;56.0&quot; x2=&quot;56.0&quot; y1=&quot;16&quot; y2=&quot;260&quot; class=&quot;zl&quot;/&gt;&lt;text x=&quot;56.0&quot; y=&quot;276&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;0%&lt;/text&gt;&lt;line x1=&quot;204.5&quot; x2=&quot;204.5&quot; y1=&quot;16&quot; y2=&quot;260&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;204.5&quot; y=&quot;276&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;10%&lt;/text&gt;&lt;line x1=&quot;353.0&quot; x2=&quot;353.0&quot; y1=&quot;16&quot; y2=&quot;260&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;353.0&quot; y=&quot;276&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;20%&lt;/text&gt;&lt;line x1=&quot;501.5&quot; x2=&quot;501.5&quot; y1=&quot;16&quot; y2=&quot;260&quot; class=&quot;gl&quot;/&gt;&lt;text x=&quot;501.5&quot; y=&quot;276&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;30%&lt;/text&gt;&lt;line x1=&quot;650.0&quot; x2=&quot;650. vl s&quot; text-anchor=&quot;start&quot;&gt;GRAB&lt;/text&gt;&lt;circle cx=&quot;198.6&quot; cy=&quot;89.8&quot; r=&quot;5.5&quot; fill=&quot;var(--muted)&quot; opacity=&quot;0.75&quot;&gt;&lt;title&gt;UBER：營收年增 9.6%、營業利益率 12.4%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;208.6&quot; y=&quot;93.8&quot; class=&quot;ax s&quot; text-anchor=&quot;start&quot;&gt;UBER&lt;/text&gt;&lt;circle cx=&quot;560.9&quot; cy=&quot;157.0&quot; r=&quot;5.5&quot; fill=&quot;var(--muted)&quot; opacity=&quot;0.75&quot;&gt;&lt;title&gt;DASH：營收年增 34.0%、營業利益率 5.5%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;570.9&quot; y=&quot;161.0&quot; class=&quot;ax s&quot; text-anchor=&quot;start&quot;&gt;DASH&lt;/text&gt;&lt;circle cx=&quot;176.3&quot; cy=&quot;234.1&quot; r=&quot;5.5&quot; fill=&quot;var(--muted)&quot; opacity=&quot;0.75&quot;&gt;&lt;title&gt;LYFT：營收年增 8.1%、營業利益率 -2.4%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;186.3&quot; y=&quot;238.1&quot; class=&quot;ax s&quot; text-anchor=&quot;start&quot;&gt;LYFT&lt;/text&gt;&lt;circle cx=&quot;302.5&quot; cy=&quot;70.6&quot; r=&quot;5.5&quot; fill=&quot;var(--muted)&quot; opacity=&quot;0.75&quot;&gt;&lt;title&gt;CART：營收年增 16.6%、營業利益率 14.4%&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;312.5&quot; y=&quot;74.6&quot; class=&quot;ax s&quot; text-anchor=&quot;start&quot;&gt;CART&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b&gt;怎麼看：&lt;/b&gt;右上角＝成長快又賺得多。藍點是本公司，灰點是同產業卡同業；營收年增百分位 0.75、營業利益率百分位 0.25（成長動能、模式穩固度的機械建議分依此）。營收年增是最近一季對去年同季（yfinance 口徑），不是近四季合計。&lt;br&gt;&lt;span class=&quot;srcl&quot;&gt;來源：商業評估底稿.json#/同業位置（市場資料/同業營運比較.json＋估值輸入.json#/peers）&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;div class=&quot;note&quot;&gt;商業評估等級（A–E 五級）只看商業模式是否成立、成長是否卡住、週期在哪，相對同產業卡同業評比；它不是估值報告研究評等裡的「生意品質 A／B／C」（那是看護城河、投入資本報酬、現金流品質、資產負債表與治理的絕對標準），不進研究評等、不影響估值、不涉任何價格。&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;src&quot;&gt;&lt;h2&gt;出處&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;標記統計：事實 62、推論 22、作者判斷 14、待查 2；原文位置可用 &lt;code&gt;python3 程式/原文索引.p
