;相對差距&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;保守&lt;/td&gt;&lt;td&gt;2.27&lt;/td&gt;&lt;td&gt;2.17&lt;/td&gt;&lt;td&gt;4.27%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準&lt;/td&gt;&lt;td&gt;3.53&lt;/td&gt;&lt;td&gt;3.42&lt;/td&gt;&lt;td&gt;2.90%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;樂觀&lt;/td&gt;&lt;td&gt;5.62&lt;/td&gt;&lt;td&gt;5.51&lt;/td&gt;&lt;td&gt;1.99%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;EV₀×（1＋WACC）−股權橋 與 每股價值×（1＋股權成本）的差；差距≥1% 只標註（槓桿較高時前者未計利息），不改目標區間。最大相對差距 4.27%（達 1% 以上，僅標註）。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;約 12 個月選擇權隱含分布下，各段的風險中立機率&lt;/h3&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt&quot;&gt;&lt;tr&gt;&lt;th&gt;保守段&lt;/th&gt;&lt;th&gt;基準段&lt;/th&gt;&lt;th&gt;樂觀段&lt;/th&gt;&lt;th&gt;低於最低端&lt;/th&gt;&lt;th&gt;高於最高端&lt;/th&gt;&lt;th&gt;段與段空白&lt;/th&gt;&lt;th&gt;段與段重疊&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;13%&lt;/td&gt;&lt;td&gt;21%&lt;/td&gt;&lt;td&gt;14%&lt;/td&gt;&lt;td&gt;25%&lt;/td&gt;&lt;td&gt;6.4%&lt;/td&gt;&lt;td&gt;21%&lt;/td&gt;&lt;td&gt;0.0%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;風險中立機率，不是真實機率；不改情境權重、不改估值與評等。到期日 2027-12-17（離終點日 34 天）價平隱含波動 54.2%（買權 58%、賣權 51%），最近成交 2026-11-13 20:48:21+00:00（最近成交 2026-11-13，不在取得當天；取價時現價 3.24，起點價 3.24 為 2026-11-13 收盤）；無風險利率 4.65%（FRED DGS1，2026-11-12 觀測 4.65%，資料庫/利率_FRED.json）、股利率 0.00%；起點價格 3.24（2026-11-13 收盤）。對數常態；漂移＝無風險利率（固定用 1 年期 DGS1，期間固定 1 年，不依到期日做期限插補）−股利率；波動＝價平隱含波動（不含波動微笑與偏態）；以批次收盤價為起點、12 個月為期間。各段機率是價格落在該段價值區間內的機率，段與段重疊處在各段機率中重複計入。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;預估修正趨勢（只描述，不當證據）&lt;/h3&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt&quot;&gt;&lt;tr&gt;&lt;th&gt;期間&lt;/th&gt;&lt;th&gt;每股盈餘預估&lt;/th&gt;&lt;th&gt;7 天前&lt;/th&gt;&lt;th&gt;30 天前&lt;/th&gt;&lt;th&gt;60 天前&lt;/th&gt;&lt;th&gt;90 天前&lt;/th&gt;&lt;th&gt;較 30 天前&lt;/th&gt;&lt;th&gt;近 7 天上修／下修家數&lt;/th&gt;&lt;th&gt;近 30 天上修／下修家數&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;本季&lt;/td&gt;&lt;td&gt;0.03&lt;/td&gt;&lt;td&gt;0.02&lt;/td&gt;&lt;td&gt;0.02&lt;/td&gt;&lt;td&gt;0.02&lt;/td&gt;&lt;td&gt;0.02&lt;/td&gt;&lt;td&gt;上修&lt;/td&gt;&lt;td&gt;0／0&lt;/td&gt;&lt;td&gt;0／0&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;下一季&lt;/td&gt;&lt;td&gt;0.03&lt;/td&gt;&lt;td&gt;0.00&lt;/td&gt;&lt;td&gt;0.00&lt;/td&gt;&lt;td&gt;0.00&lt;/td&gt;&lt;td&gt;0.00&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;0／0&lt;/td&gt;&lt;td&gt;0／0&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;本財年（2026 財年，推導）&lt;/td&gt;&lt;td&gt;0.14&lt;/td&gt;&lt;td&gt;0.14&lt;/td&gt;&lt;td&gt;0.14&lt;/td&gt;&lt;td&gt;0.14&lt;/td&gt;&lt;td&gt;0.13&lt;/td&gt;&lt;td&gt;上修&lt;/td&gt;&lt;td&gt;1／1&lt;/td&gt;&lt;td&gt;1／1&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;下一財年（2027 財年，推導）&lt;/td&gt;&lt;td&gt;0.14&lt;/td&gt;&lt;td&gt;0.14&lt;/td&gt;&lt;td&gt;0.14&lt;/td&gt;&lt;td&gt;0.14&lt;/td&gt;&lt;td&gt;0.14&lt;/td&gt;&lt;td&gt;下修&lt;/td&gt;&lt;td&gt;0／0&lt;/td&gt;&lt;td&gt;0／1&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;分析師預估與券商目標價只描述，不當證據，也不是目標區間任一端；上修／下修門檻為較 30 天前變動 ±1%（本工具設定；與「市價溢價來源」預估修正以 90 天 ±2% 判持平是兩個口徑）。資料取得 2026-11-07T14:31:28（台北時間）（yfinance eps_trend、eps_revisions）。券商目標價近 90 天 2 家調整：上調 1、下調 1、持平 0；上季財報驚奇（Nasdaq）：Sep 2026，11/3/2026 公布，每股盈餘 0.0、共識 0.02、驚奇 -100%；（yfinance）：2026-09-30，實際 0.009、預估 0.02。兩個來源口徑可能不同（可能是調整後或一般會計準則）；公司申報的每股盈餘可對照存檔 6-K 2026-11-03 財報新聞稿（事件/8K事件.json），本工具未逐項比對，只描述，不比較、不當證據。每批另存快照自建歷史：1 筆（2026-11-07 至 2026-11-07）。&lt;/p&gt;&lt;/div&gt;&lt;!--/目標區間:附錄--&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;成長性四問（細表）&lt;/h3&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;成長性四問：過去、品質、股價要求、模型假設&lt;/h4&gt;&lt;p&gt;&lt;b&gt;一句話：&lt;/b&gt;成長無法判斷；成長品質中；股價要求的成長不高；本報告的基準假設無法判斷。&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt&quot;&gt;&lt;tr&gt;&lt;th&gt;面向&lt;/th&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;數字&lt;/th&gt;&lt;th&gt;判讀&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;實績&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;長期營收年複合（2020～2025）&lt;/td&gt;&lt;td&gt;+48.4%&lt;/td&gt;&lt;td rowspan=&quot;2&quot; style=&quot;text-align:left;vertical-align:top&quot;&gt;&lt;span style=&quot;color:#7a7f7c;font-weight:700&quot;&gt;● 無法判斷&lt;/span&gt;&lt;br&gt;&lt;span style=&quot;font-size:12px;color:#7a7f7c&quot;&gt;單季資料不足 6 季&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;實績&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;近四季營收年增（一年前）&lt;/td&gt;&lt;td&gt;不適用（不適用）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;品質&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;新增投資的回報（增量 ROIC）&lt;/td&gt;&lt;td&gt;+780.2%&lt;/td&gt;&lt;td rowspan=&quot;3&quot; style=&quot;text-align:left;vertical-align:top&quot;&gt;&lt;span style=&quot;color:#8a6d1f;font-weight:700&quot;&gt;● 中：回報約在資金成本附近&lt;/span&gt;&lt;br&gt;&lt;span style=&quot;font-size:12px;color:#7a7f7c&quot;&gt;增量 ROIC +780.2%；近五年 ROIC 中位 +1.8%；資金成本 9.0%&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;品質&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;存貨、應收增速減營收增速&lt;/td&gt;&lt;td&gt;不適用、不適用&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;品質&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;再投資能支撐的成長&lt;/td&gt;&lt;td&gt;不適用&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股價要求&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;現價隱含的未來 5 年營收年增&lt;/td&gt;&lt;td&gt;+12.1%（折現率高低 +17.7%～+8.0%）&lt;/td&gt;&lt;td rowspan=&quot;2&quot; style=&quot;text-align:left;vertical-align:top&quot;&gt;&lt;span style=&quot;color:#2f6b4f;font-weight:700&quot;&gt;● 不高：過去的成長就做得到&lt;/span&gt;&lt;br&gt;&lt;span style=&quot;font-size:12px;color:#7a7f7c&quot;&gt;市價要求每年 +12.1%&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股價要求&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;本益比在自身歷史的位置&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;模型假設&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;基準情境第 1 年營收成長&lt;/td&gt;&lt;td&gt;+16.0%&lt;/td&gt;&lt;td rowspan=&quot;3&quot; style=&quot;text-align:left;vertical-align:top&quot;&gt;&lt;span style=&quot;color:#7a7f7c;font-weight:700&quot;&gt;● 無法判斷&lt;/span&gt;&lt;br&gt;&lt;span style=&quot;font-size:12px;color:#7a7f7c&quot;&gt;基準首年或同類區間未取得&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;模型假設&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;同類公司次年營收成長（中間一半）&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;模型假設&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;同規模公司十年實質營收年增中位&lt;/td&gt;&lt;td&gt;+4.1%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;判讀由固定規則從表內數字算出，不影響估值與研究評等：實績看近 8 季單季年增的波動（6 個百分點內為穩定、超過 12 為不穩定）與長期方向；品質看新增投入與近五年的回報是否高於資金成本（虧損或增量回報為負為弱）；股價要求看市價隱含的未來 5 年年增是否超過過去實績、是否超過同類公司次年的 p75；模型假設看基準第 1 年是否落在同類公司 p25–p75 或貼近最新單季年增；股價要求與模型假設的同類公司，用同成長組再依規模或產業細分、樣本至少 300 家的最細一組。「同類公司」是本工作流回溯 2014–2025 年約 2,000 家美股、近一年成長相近者次年的實際分布，只是參考，不是預測；存貨或應收增得比營收快不代表成長轉弱，不列入判讀。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;缺口判斷的影響（計算核對，推導）&lt;/h3&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;下表是各項作者判斷拿掉後合理價值中點的變化，逐項單獨還原、不加總（缺口判斷清單.json、計算核對/計算核對.md）。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;figure&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt signals&quot;&gt;&lt;tr&gt;&lt;th&gt;編號&lt;/th&gt;&lt;th&gt;作者判斷&lt;/th&gt;&lt;th&gt;若不這樣處理，中點約&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;④&lt;/td&gt;&lt;td&gt;證券計入總現金流動性減現金&lt;/td&gt;&lt;td&gt;−28.8%（位置變偏貴）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;③&lt;/td&gt;&lt;td&gt;銀行存款不列有息負債&lt;/td&gt;&lt;td&gt;+1.2%（存款當負債則 −18.0%，位置不變）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;②&lt;/td&gt;&lt;td&gt;金融服務不進 DCF&lt;/td&gt;&lt;td&gt;+11.4%（上限估計）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;①&lt;/td&gt;&lt;td&gt;近四季改用 6-K 季度新聞稿&lt;/td&gt;&lt;td&gt;−1.2%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;⑤&lt;/td&gt;&lt;td&gt;資產負債表日用 2026-09-30&lt;/td&gt;&lt;td&gt;−0.5%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;⑥&lt;/td&gt;&lt;td&gt;扣少數股權 503&lt;/td&gt;&lt;td&gt;+3.6%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;⑦&lt;/td&gt;&lt;td&gt;股數 4,118（含限制股）&lt;/td&gt;&lt;td&gt;+4.5%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;⑧&lt;/td&gt;&lt;td&gt;Atome 對價 14.9 億美元未扣（未交割）&lt;/td&gt;&lt;td&gt;−10.6%（只扣實際流出 −8.8%，位置不變）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;⑨&lt;/td&gt;&lt;td&gt;非流動其他負債 684 未扣&lt;/td&gt;&lt;td&gt;−4.9%（上限估計，位置不變）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;⑩&lt;/td&gt;&lt;td&gt;資料中心出資 7.5 億未扣&lt;/td&gt;&lt;td&gt;約 −5.3%（推導，未經核對代理）&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;估值方法與參數&lt;/h3&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;方法&lt;/th&gt;&lt;th&gt;低&lt;/th&gt;&lt;th&gt;中&lt;/th&gt;&lt;th&gt;高&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;DCF 保守&lt;/td&gt;&lt;td&gt;2&lt;/td&gt;&lt;td&gt;2&lt;/td&gt;&lt;td&gt;2&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;DCF 基準&lt;/td&gt;&lt;td&gt;3&lt;/td&gt;&lt;td&gt;3&lt;/td&gt;&lt;td&gt;4&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;DCF 樂觀&lt;/td&gt;&lt;td&gt;4&lt;/td&gt;&lt;td&gt;5&lt;/td&gt;&lt;td&gt;6&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;同業企業價值／營業利益&lt;/td&gt;&lt;td&gt;2&lt;/td&gt;&lt;td&gt;2&lt;/td&gt;&lt;td&gt;4&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p style=&quot;font-size:14px&quot;&gt;折現率基準 9.0%（區間 8.1%–10.4%）：無風險利率 5.15%、市場風險溢價 4.20%、beta 1.04。DCF 為 8 年：前 5 年依情境，後 3 年成長與利潤率逐步回到永續水準。&lt;/p&gt;&lt;p style=&quot;font-size:14px&quot;&gt;同業：UBER（全球叫車與外送平台，業務最接近；市值相差逾 10 倍，但抽成型雙邊平台的商業模式與利潤結構最接近）, DASH（外送平台，含雜貨與廣告）, LYFT（叫車平台；近四季營業利益異常（EV/EBIT 工具給 null），只列不進 EV/EBIT）, CART（雜貨外送平台）。排除：SE：F、H：電商與遊戲為主，業務組合不同, Delivery Hero：F：非美國掛牌，不在固定資料來源, GoTo（GOTO.JK）：F：印尼掛牌，不在固定資料來源。&lt;/p&gt;&lt;p style=&quot;font-size:14px&quot;&gt;產業公版：穩定現金流／數位平台／交易型；驗證狀態：已驗證三家（UBER、GOOGL 2026-11-06～07、GRAB 2026-11-08 通過審查；2026-11-08 使用者核定）；本公司是第 2 家實例。&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;details id=&quot;wp-value&quot;&gt;&lt;summary&gt;價值判斷：PEG、林區資產負債表檢查與交叉檢查&lt;/summary&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;PEG 與林區檢查&lt;/h3&gt;&lt;div class=&quot;wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;PEG：可計算的成長口徑（紅線為 1 與 2）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 500 102&quot; role=&quot;img&quot; aria-label=&quot;PEG&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;168.0&quot; x2=&quot;168.0&quot; y1=&quot;6&quot; y2=&quot;96&quot; class=&quot;zero&quot;/&gt;&lt;line x1=&quot;292.5&quot; x2=&quot;292.5&quot; y1=&quot;4&quot; y2=&quot;98&quot; class=&quot;price&quot;/&gt;&lt;line x1=&quot;417.1&quot; x2=&quot;417.1&quot; y1=&quot;4&quot; y2=&quot;98&quot; class=&quot;price&quot;/&gt;&lt;text x=&quot;158&quot; y=&quot;23&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;近四季對上一財年&lt;/text&gt;&lt;rect x=&quot;168.0&quot; y=&quot;9&quot; width=&quot;60.5&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;236.5&quot; y=&quot;23&quot; class=&quot;val&quot;&gt;0.5&lt;/text&gt;&lt;text x=&quot;158&quot; y=&quot;63&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;基準情境推估&lt;/text&gt;&lt;rect x=&quot;168.0&quot; y=&quot;49&quot; width=&quot;147.7&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;323.7&quot; y=&quot;63&quot; class=&quot;val&quot;&gt;1.2&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;PEG 與林區加股利比率（可計算的成長口徑）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;成長口徑&lt;/th&gt;&lt;th&gt;成長率&lt;/th&gt;&lt;th&gt;PEG&lt;/th&gt;&lt;th&gt;判讀&lt;/th&gt;&lt;th&gt;加股利比率&lt;/th&gt;&lt;th&gt;判讀&lt;/th&gt;&lt;th&gt;加股東收益率比率（現代延伸）&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;近四季對上一財年（扣非經常）&lt;/td&gt;&lt;td&gt;66.7%&lt;/td&gt;&lt;td&gt;0.5&lt;/td&gt;&lt;td&gt;基期失真，不具參考性&lt;/td&gt;&lt;td&gt;2.06&lt;/td&gt;&lt;td&gt;好&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;基準情境推估（稅後營業利益年增－股數年變化）&lt;/td&gt;&lt;td&gt;27.3%&lt;/td&gt;&lt;td&gt;1.2&lt;/td&gt;&lt;td&gt;合理&lt;/td&gt;&lt;td&gt;0.84&lt;/td&gt;&lt;td&gt;差&lt;/td&gt;&lt;td&gt;0.85&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;加股東收益率比率＝（成長率＋股利殖利率＋淨回購殖利率）÷本益比，把回購也算進股東回饋、並扣掉發給員工的股票；這是現代延伸，不是林區原版，也沒有政策門檻，只列數字。&lt;/p&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:4px&quot;&gt;PEG 的判讀標籤依估值政策門檻；高風險、成長極高或極低的公司，PEG 有系統性偏誤（同樣成長下風險越高 PEG 越低），不能只憑標籤判斷便宜或昂貴。&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;林區式資產負債表與市場檢查&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;數值&lt;/th&gt;&lt;th&gt;林區的看法&lt;/th&gt;&lt;th&gt;判讀&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;本益比&lt;/td&gt;&lt;td&gt;32.40&lt;/td&gt;&lt;td&gt;與自身歷史比較&lt;/td&gt;&lt;td&gt;資料限制：扣非經常 EPS 為 32.4 倍；可比的正值申報 EPS 歷史不足，不計算歷史百分位&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;每股淨現金&lt;/td&gt;&lt;td&gt;0.19&lt;/td&gt;&lt;td&gt;淨現金可提供下檔保護（林區 O31、LAK02）&lt;/td&gt;&lt;td&gt;好：有淨現金，可提供下檔保護；占股價 5.8%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;負債對權益&lt;/td&gt;&lt;td&gt;0.29&lt;/td&gt;&lt;td&gt;一般越低越好（林區 L25）&lt;/td&gt;&lt;td&gt;不評好壞：有息負債約為股東權益的 0.29 倍；沒有公認門檻，償債能力見收現段償債指標&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;每股自由現金流（近四季）&lt;/td&gt;&lt;td&gt;未取得&lt;/td&gt;&lt;td&gt;比每股盈餘更接近現金（林區 O37、修正10）&lt;/td&gt;&lt;td&gt;不評好壞：自由現金流殖利率 0.0%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股數年變化（近三財年）&lt;/td&gt;&lt;td&gt;5.3%&lt;/td&gt;&lt;td&gt;持續買回、且價格合理、資金來自本業現金時才是好訊號（林區 L16、O19）&lt;/td&gt;&lt;td&gt;注意：近三財年平均每年 +5.3%，高於政策 2% 線&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;存貨增速 vs 營收增速&lt;/td&gt;&lt;td&gt;16%&lt;/td&gt;&lt;td&gt;存貨增速高於營收是警訊（林區 O50）&lt;/td&gt;&lt;td&gt;不評好壞：存貨 +16%（2025-09-30→2026-09-30）；同期營收單季不齊，不比較&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;內部人公開市場買進&lt;/td&gt;&lt;td&gt;2&lt;/td&gt;&lt;td&gt;內部人自掏腰包買進是強訊號&lt;/td&gt;&lt;td&gt;好：近期有 2 人自掏腰包買進，依林區屬強訊號&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;林區以外的交叉檢查（只揭露，不改研究評等與價格位置）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;檢查&lt;/th&gt;&lt;th&gt;結果&lt;/th&gt;&lt;th&gt;判讀&lt;/th&gt;&lt;th&gt;依據與限制&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Piotroski F 分數（財報是否在改善）&lt;/td&gt;&lt;td&gt;5 ／ 7 項（2024-12-31→2025-12-31）&lt;/td&gt;&lt;td&gt;中&lt;/td&gt;&lt;td&gt;未通過：營運現金流＞淨利（應計少）、長期負債 ÷ 平均總資產比上年低。Piotroski（2000）研究文獻/Piotroski2000_財報訊號.json 第 9–11、15 頁；8–9 分高分組、0–2 分低分組&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Beneish M 分數（盈餘被美化的機率）&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;不適用&lt;/td&gt;&lt;td&gt;缺 流動資產、折舊攤銷、銷管費用、流動負債&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Greenblatt 盈餘殖利率與資本報酬率&lt;/td&gt;&lt;td&gt;盈餘殖利率 1.6%&lt;/td&gt;&lt;td&gt;低於 10 年公債 5.1%&lt;/td&gt;&lt;td&gt;盈餘殖利率＝近四季營業利益 ÷（市值＋有息負債－現金與證券），推導；ROIC 為本專案稅後口徑，非 Greenblatt 原式稅前；不做排名；ROIC 不適用：財務指標 ROIC_TTM 未取得&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;details id=&quot;wp-6&quot;&gt;&lt;summary&gt;6 財務：償債指標、融資活動、存活檢查與利率壓力測試（含判定規則與限制）&lt;/summary&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;融資活動與償債：錢還給誰、有沒有借錢、還不還得起&lt;/h3&gt;&lt;p class=&quot;cap&quot;&gt;利息保障改讀信用與存活的利息口徑（EBIT ÷ 近四季實付利息：融資償債底稿；實付口徑），底稿的利息費用科目未對應。&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;償債能力指標（利息保障依 Damodaran 合成評等對照；其他沒有公認門檻，只寫事實）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;指標&lt;/th&gt;&lt;th&gt;數值&lt;/th&gt;&lt;th&gt;判讀&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;EBIT ÷ 利息費用&lt;/td&gt;&lt;td&gt;7.18&lt;/td&gt;&lt;td&gt;相當於 AA 級：EBIT 是利息費用的 7.2 倍；依 Damodaran 合成評等大型公司對照表（2026 年 1 月；市值 133.4 億美元，在 50 億美元以上）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;（營運現金流＋實付利息）÷ 實付利息&lt;/td&gt;&lt;td&gt;5.32&lt;/td&gt;&lt;td&gt;不評好壞：實付利息 28.0 百萬美元，營運現金流加回利息後可付約 5 倍&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;有息負債 ÷ EBITDA&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;資料限制：EBITDA 為負或缺，不算倍數&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;淨負債 ÷ EBITDA&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;資料限制：EBITDA 為負或缺，不算倍數&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;營運現金流 ÷ 有息負債&lt;/td&gt;&lt;td&gt;5.8%&lt;/td&gt;&lt;td&gt;不評好壞：一年的營運現金流約可還掉 6% 的有息負債（約 17.1 年還清）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;現金與證券 ÷ 一年內到期債務&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;資料限制：未取得（未取得（短期借款與一年內到期長債科目皆無））&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;可用授信與到期（作者判讀，融資償債判讀.json）：可轉債 15 億因持有人可隨時轉換而列為流動負債（帳面一年內到期約 1,624），但現金面到期日為 2030 年；銀行授信 5.29 億已動用 3.75 億（2026-06-30）。&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;融資活動現金流：還給股東與借還款（本財年年初至 2026-06-30 累計，6-K 2026-06-30）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;對象｜分類&lt;/th&gt;&lt;th&gt;金額&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股東｜回購&lt;/td&gt;&lt;td&gt;-400.0 百萬美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股東小計&lt;/td&gt;&lt;td&gt;-400.0 百萬美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;債權人｜償還&lt;/td&gt;&lt;td&gt;-131.0 百萬美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;債權人｜借入&lt;/td&gt;&lt;td&gt;120.0 百萬美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;債權人小計&lt;/td&gt;&lt;td&gt;-11.0 百萬美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;其他｜租賃本金（IFRS 16）&lt;/td&gt;&lt;td&gt;-32.0 百萬美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;其他｜付息（IAS 7 列融資）&lt;/td&gt;&lt;td&gt;-15.0 百萬美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;其他｜其他（未歸類）&lt;/td&gt;&lt;td&gt;158.0 百萬美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;其他小計&lt;/td&gt;&lt;td&gt;111.0 百萬美元&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;對照：同期營運現金流&lt;/td&gt;&lt;td&gt;-3.0 百萬美元&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;融資活動是公司與出資人（股東、債權人）之間的現金往來，不等於借款：回購、股利是還給股東，借入、償還才是借款；負數＝現金流出。本表期間與下方借款用途、上方現金流分層（近四季）不同。&lt;/p&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;借款用途（研究判讀）：混合；期間 2025 年至 2026-09-30；依據：20-F 2025-12-31 Item 5 ¶198、6-K 2026-08-13 新聞稿 §112、20-F 2025-12-31 Item 5 ¶202、20-F 2025-12-31 Item 19 ¶582&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;survival-detail&quot;&gt;&lt;h3&gt;存活檢查：現金對債務（12～24 個月，推導，非違約預測）&lt;/h3&gt;&lt;p style=&quot;margin:0 0 6px&quot;&gt;&lt;b&gt;信用評級&lt;/b&gt;　機構 未揭露（10-K、10-Q、8-K、SEC 全文搜尋 查無 S&amp;amp;P、Moody&amp;#x27;s、Fitch、KBRA 評級）／推導 AA（Damodaran 合成評等，利息保障 7.2 倍，推導）｜依推導：投資等級（BBB-／Baa3 以上）&lt;/p&gt;&lt;p style=&quot;margin:0 0 6px&quot;&gt;&lt;b&gt;存活檢查（完整理由）&lt;/b&gt;　資料不足（推導，非違約預測）：近四季回購加股利 274.0 百萬美元，超過自由現金流 -113.0 百萬美元，差額 387.0 百萬美元要靠現金或借款；會計師未提出繼續經營疑慮；利息保障 7.2 倍。&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;燈號：資料不足（一般公司：現金對債務；資料截至 2026-09-30，收盤日 2026-11-13）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;判定&lt;/th&gt;&lt;th&gt;內容與出處&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;會計師繼續經營疑慮&lt;/td&gt;&lt;td&gt;無明顯警訊&lt;/td&gt;&lt;td&gt;會計師與管理層未提出繼續經營疑慮（掃描 20-F 2025-12-31、20-F 2024-12-31）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;流動性：12 個月&lt;/td&gt;&lt;td&gt;資料不足&lt;/td&gt;&lt;td&gt;12 個月到期本金或現金未取得，無法比較&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;流動性：24 個月&lt;/td&gt;&lt;td&gt;資料不足&lt;/td&gt;&lt;td&gt;24 個月到期本金或現金未取得，無法比較&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;現金還能燒幾個月&lt;/td&gt;&lt;td&gt;無明顯警訊&lt;/td&gt;&lt;td&gt;近四季自由現金流 -113.0（燒錢），扣一年內到期本金後的現金還能燒約 302 個月&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;利息保障&lt;/td&gt;&lt;td&gt;無明顯警訊&lt;/td&gt;&lt;td&gt;利息保障 7.2 倍&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;回饋股東對自由現金流&lt;/td&gt;&lt;td&gt;提示&lt;/td&gt;&lt;td&gt;近四季回購加股利 274.0 百萬美元，超過自由現金流 -113.0 百萬美元，差額 387.0 百萬美元要靠現金或借款&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;信用評級（機構）&lt;/td&gt;&lt;td&gt;未揭露&lt;/td&gt;&lt;td&gt;公司申報查無 S&amp;amp;P、Moody&amp;#x27;s、Fitch、KBRA 評級&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;信用評級（推導）&lt;/td&gt;&lt;td&gt;投資等級&lt;/td&gt;&lt;td&gt;AA：Damodaran 合成評等 2026 年 1 月（大型公司表），利息保障 7.2 倍（EBIT ÷ 近四季實付利息（融資償債底稿；實付口徑））&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;債券市場參考&lt;/td&gt;&lt;td&gt;AA 級&lt;/td&gt;&lt;td&gt;ICE BofA 公司債選擇權調整利差：投資等級整體 0.89 個百分點（2026-11-12，FRED BAMLC0A0CM）；BBB 級 1.11 個百分點（2026-11-12，FRED BAMLC0A4CBBB）；投機等級整體 3.20 個百分點（2026-11-12，FRED BAMLH0A0HYM2）；AA 級 0.64 個百分點（2026-11-12，FRED BAMLC0A2CAA）；個別債券殖利率與價格未取得（TRACE／FINRA 不在固定來源）&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;未取得；利息口徑：近四季實付利息（融資償債底稿；實付口徑）；未動用信貸：未取得（信用揭露.json 未填；不計入）&lt;/p&gt;&lt;h3 style=&quot;margin-top:14px&quot;&gt;利率壓力測試（固定情境：利率上升 1、2 個百分點與下降 1 個百分點，不預測聯準會；推導）&lt;/h3&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;單位百萬美元；狀態：未取得&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;情境&lt;/th&gt;&lt;th&gt;浮動利率債利息變動&lt;/th&gt;&lt;th&gt;再融資利息變動&lt;/th&gt;&lt;th&gt;壓力後一年利息&lt;/th&gt;&lt;th&gt;利息保障&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;目前利率（只算再融資）&lt;/td&gt;&lt;td&gt;0.0&lt;/td&gt;&lt;td&gt;未取得&lt;/td&gt;&lt;td&gt;未取得&lt;/td&gt;&lt;td&gt;未取得&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;+1 個百分點&lt;/td&gt;&lt;td&gt;未取得&lt;/td&gt;&lt;td&gt;未取得&lt;/td&gt;&lt;td&gt;未取得&lt;/td&gt;&lt;td&gt;未取得&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;+2 個百分點&lt;/td&gt;&lt;td&gt;未取得&lt;/td&gt;&lt;td&gt;未取得&lt;/td&gt;&lt;td&gt;未取得&lt;/td&gt;&lt;td&gt;未取得&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;−1 個百分點&lt;/td&gt;&lt;td&gt;未取得&lt;/td&gt;&lt;td&gt;未取得&lt;/td&gt;&lt;td&gt;未取得&lt;/td&gt;&lt;td&gt;未取得&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;目前利率：聯邦基金利率 3.88%（2026-11-12，FRED DFF）、SOFR 3.90%（2026-11-12，FRED SOFR）、十年期公債 5.10%（2026-11-12，FRED DGS10）；估值折現率用的 10 年期公債是 5.15%（2026-11-13，美國財政部），來源與日期不同；浮動利率債未取得（作者未填 信用揭露.json 利率結構：10-K 債務表與 Item 7A 利率敏感度；候選句見 原文候選/利率敏感度）；兩年內到期須再融資本金 未取得，原票面 未取得（兩年內到期本金未取得），再融資利率 5.74%（10 年期公債 5.10%（2026-11-12）＋ AA 級 OAS 0.64 個百分點（推導評級），推導）；利息保障基準：利息保障（EBIT÷一年利息），目前 7.2 倍；利率上升 2 個百分點（+200bp，bp＝基點，100bp＝1 個百分點）後低於 1.5 倍才在燈號理由加一條（不改燈號、不改研究評等）；通膨、物價、消費者等間接影響不在此表；缺 浮動利率債、兩年內到期本金，對應情境未取得（不補值）&lt;/p&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;&lt;a href=&quot;#survival-rules&quot;&gt;判定規則與限制見本節下方&lt;/a&gt;（寫死在程式，不改研究評等）。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot; id=&quot;survival-rules&quot;&gt;&lt;h3&gt;存活檢查與利率壓力測試：判定規則與限制&lt;/h3&gt;&lt;p class=&quot;cap&quot;&gt;規則版本：v1.1（2026-11-03 第二輪：加 KBRA、利率壓力測試、首頁精簡；仍只顯示提示、不改研究評等）&lt;/p&gt;&lt;ul class=&quot;cap&quot;&gt;&lt;li&gt;總燈號：各項取最嚴重：任一高風險→高風險；否則任一需留意→需留意；12 個月流動性或繼續經營無法判定→資料不足；其餘→無明顯警訊。Z 分數與推導評級只列理由、不改燈號。&lt;/li&gt;&lt;li&gt;繼續經營：最新年報或其後季報出現會計師或管理層「substantial doubt … going concern」肯定句 → 高風險（否定句、假設句只列出不計）；只出現在前一份年報 → 需留意&lt;/li&gt;&lt;li&gt;流動性_12個月：現金與證券＋未動用信貸 ≥ 一年內到期本金＋一年利息 → 無明顯警訊；不足但加近四季自由現金流（已扣實付利息）後 ≥ 一年內到期本金 → 需留意；仍不足 → 高風險&lt;/li&gt;&lt;li&gt;流動性_24個月：同上改兩年（本金、利息、自由現金流各計兩年）；不足但加兩年自由現金流 ≥ 本金的 50% → 需留意；更低 → 高風險&lt;/li&gt;&lt;li&gt;燒錢：近四季自由現金流為負：現金還能燒幾個月＝（現金與證券＋未動用信貸－一年內到期本金）÷ 每月燒錢；&amp;lt;12 個月 高風險、12～24 個月 需留意&lt;/li&gt;&lt;li&gt;利息保障：EBIT ÷ 利息費用 &amp;lt; 1.5 倍 → 需留意&lt;/li&gt;&lt;li&gt;契約：作者自 信用揭露.json 填公司揭露的契約門檻與實際值：已違反 → 高風險；餘裕 &amp;lt; 15% → 需留意；未揭露不判&lt;/li&gt;&lt;li&gt;信用評級：機構評級（S&amp;amp;P、Moody&amp;#x27;s、Fitch、KBRA，取各機構最新、以最低者判等級）低於 BBB-／Baa3 → 需留意；只有推導評級為投機等級 → 只列理由&lt;/li&gt;&lt;li&gt;利率壓力測試：固定情境 +100bp／+200bp／-100bp（不預測聯準會）：利息增加＝浮動利率債×利率變動（作者填 Item 7A 每 100bp 利息變動時改用該值）＋兩年內到期本金×（再融資利率＋利率變動－原票面利率）；再融資利率＝收盤日 10 年期公債殖利率＋該評級 ICE BofA OAS（推導）；壓力後利息保障＝EBIT÷（一年利息＋利息增加），EBIT 分母異常時改用現金利息保障。+200bp 後低於 1.5 倍 → 理由加一條、首頁也加（只列理由、不改燈號）；浮動利率債未揭露或未填 → 該情境未取得；金融業不套&lt;/li&gt;&lt;li&gt;金融業：銀行券商、保險不套現金對債務：研究評等輸入 監理紅線 低於門檻 → 高風險；高於門檻不到 20%（相對）→ 需留意；未填 → 資料不足&lt;/li&gt;&lt;/ul&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;使用限制&lt;/p&gt;&lt;ul class=&quot;cap&quot;&gt;&lt;li&gt;推導，非違約預測：燈號只看 12～24 個月付不付得出錢與已揭露的警訊，不是違約機率，也不改研究評等（第一版）。&lt;/li&gt;&lt;li&gt;Altman Z 分數會誤判兩類公司：權益為負（如舉債回購）與保留盈餘因長期回購或股利變負，所以只當輔助、不單獨下結論、不改燈號。&lt;/li&gt;&lt;li&gt;金融業（銀行券商、保險）的存款與保單負債是營業資金，改看監理資本（如 CET1），不套現金對債務。&lt;/li&gt;&lt;li&gt;超過 2～3 年的到期與再融資風險留在正文債務到期表，不進燈號。&lt;/li&gt;&lt;li&gt;到期年度桶以到期表資料日（年報）起算：桶的結束日落在窗口內才計入；跨窗口的桶另列，若作者在 信用揭露.json 填了近期到期明細就改用明細。&lt;/li&gt;&lt;li&gt;個別債券價格與殖利率（TRACE／FINRA）不在固定來源：未取得；市場參考只用 FRED 的 ICE BofA 各評級公司債利差（大盤層級）。&lt;/li&gt;&lt;li&gt;機構評級只認公司自己在 SEC 申報寫出的 S&amp;amp;P、Moody&amp;#x27;s、Fitch、KBRA 評級並附原句；沒揭露寫未揭露，不從新聞或記憶補。&lt;/li&gt;&lt;li&gt;利率壓力測試只用固定情境（+100bp、+200bp、−100bp），不預測聯準會；以 10 年期公債估再融資成本，實際年期與擔保結構不同會有誤差；浮動利率債若也在兩年內到期會重複計算（偏保守）；通膨、物價、消費者等間接影響不進燈號；金融業不套，維持看資本適足率。&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/details&gt;&lt;/section&gt;&lt;section class=&quot;q&quot; id=&quot;more&quot; data-layer=&quot;附錄&quot;&gt;&lt;div class=&quot;qno&quot;&gt;附錄&lt;/div&gt;&lt;h2&gt;附錄：估值細節、論點檢查、名詞、表格與資料來源（預設摺疊）&lt;/h2&gt;&lt;details id=&quot;valdetail&quot;&gt;&lt;summary&gt;估值細節：利率、同業與產業對照、券商目標價&lt;/summary&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;券商目標價&lt;/h3&gt;&lt;figure class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;券商目標價範圍對照本報告合理價值與收盤價（美元；yfinance，取得 2026-11-07；第三方看法，只揭露，不是本報告目標價、不進評等）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 150&quot; role=&quot;img&quot; aria-label=&quot;券商目標價&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;230.0&quot; x2=&quot;230.0&quot; y1=&quot;8&quot; y2=&quot;128&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;230.0&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;0&lt;/text&gt;&lt;line x1=&quot;295.0&quot; x2=&quot;295.0&quot; y1=&quot;8&quot; y2=&quot;128&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;295.0&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;2&lt;/text&gt;&lt;line x1=&quot;360.0&quot; x2=&quot;360.0&quot; y1=&quot;8&quot; y2=&quot;128&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;360.0&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;4&lt;/text&gt;&lt;line x1=&quot;425.0&quot; x2=&quot;425.0&quot; y1=&quot;8&quot; y2=&quot;128&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;425.0&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;6&lt;/text&gt;&lt;line x1=&quot;490.0&quot; x2=&quot;490.0&quot; y1=&quot;8&quot; y2=&quot;128&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;490.0&quot; y=&quot;144&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;8&lt;/text&gt;&lt;text x=&quot;220&quot; y=&quot;27&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;券商目標價（最低–最高，點＝平均）&lt;/text&gt;&lt;line x1=&quot;360.0&quot; x2=&quot;457.5&quot; y1=&quot;22&quot; y2=&quot;22&quot; stroke=&quot;var(--c6)&quot; stroke-width=&quot;3&quot; opacity=&quot;.55&quot;/&gt;&lt;circle cx=&quot;406.7&quot; cy=&quot;22&quot; r=&quot;7&quot; fill=&quot;var(--c6)&quot;&gt;&lt;title&gt;券商目標價（最低–最高，點＝平均）：5&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;469.5&quot; y=&quot;27&quot; class=&quot;val&quot;&gt;5&lt;/text&gt;&lt;text x=&quot;220&quot; y=&quot;67&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;本報告合理價值（只含折現率）&lt;/text&gt;&lt;line x1=&quot;323.7&quot; x2=&quot;358.0&quot; y1=&quot;62&quot; y2=&quot;62&quot; stroke=&quot;var(--c1)&quot; stroke-width=&quot;3&quot; opacity=&quot;.55&quot;/&gt;&lt;circle cx=&quot;340.9&quot; cy=&quot;62&quot; r=&quot;7&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;本報告合理價值（只含折現率）：3&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;370.0&quot; y=&quot;67&quot; class=&quot;val&quot;&gt;3&lt;/text&gt;&lt;text x=&quot;220&quot; y=&quot;107&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;收盤價&lt;/text&gt;&lt;circle cx=&quot;335.3&quot; cy=&quot;102&quot; r=&quot;7&quot; fill=&quot;var(--ink)&quot;&gt;&lt;title&gt;收盤價：3&lt;/title&gt;&lt;/circle&gt;&lt;text x=&quot;347.3&quot; y=&quot;107&quot; class=&quot;val&quot;&gt;3&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;市場怎麼看：券商目標價與它隱含的成長&lt;/h4&gt;&lt;p&gt;23 家券商的平均目標價 5.44 美元（中位 5.26，最低 4.00、最高 7.00）；比 2026-11-13 收盤價 3.24 高約 68%；換成本模型的語言，平均目標價要求未來 5 年營收每年成長約 28%；分析師自己預估明年每股盈餘成長 +1.0%；近 90 天有 2 家調整目標價：上調 1、下調 1、持平 0。&lt;/p&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;券商目標價與隱含成長（yfinance，取得 2026-11-07）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;目標價（美元）&lt;/th&gt;&lt;th&gt;折回今天（推導）&lt;/th&gt;&lt;th&gt;隱含未來 5 年營收年增&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;平均目標價&lt;/td&gt;&lt;td&gt;5.44&lt;/td&gt;&lt;td&gt;4.93&lt;/td&gt;&lt;td&gt;+27.5%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;中位目標價&lt;/td&gt;&lt;td&gt;5.26&lt;/td&gt;&lt;td&gt;4.77&lt;/td&gt;&lt;td&gt;+26.5%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;最低目標價&lt;/td&gt;&lt;td&gt;4.00&lt;/td&gt;&lt;td&gt;3.63&lt;/td&gt;&lt;td&gt;+18.3%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;最高目標價&lt;/td&gt;&lt;td&gt;7.00&lt;/td&gt;&lt;td&gt;6.35&lt;/td&gt;&lt;td&gt;+34.8%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;Nasdaq 共識目標價 5.18（最低 4.00、最高 7.00；買進 7、持有 0、賣出 0）。券商目標價是第三方對 12 個月後股價的看法，多用「預估盈餘 × 主觀本益比」，通常偏樂觀；本區只揭露，不是本報告的目標價、不當證據、不影響估值與研究評等。「折回今天」以股權成本折現（未加回期間股利），「隱含成長」以本報告基準情境的其他假設反推，是用本模型理解他們的價格，不是券商自己的假設（推導）。資料取得時間與本報告收盤日不同。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;利率的影響：公債殖利率變動與股債利差&lt;/h3&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;利率對合理價值的影響中等：10 年期公債殖利率下降 1 個百分點、其他不變，中點約 +14%；上升 1 個百分點約 −10%（估值結果.json#/利率敏感度）。&lt;/strong&gt;白話說，現價隱含基準年報酬約 9.0%&lt;span class=&quot;src&quot;&gt;（基準情境成真時、以收盤 2026-11-13 股價買進的推算年報酬；條件式，非預期報酬、非買賣建議）&lt;/span&gt;，比 10 年期公債 5.15% 多約 3.8 個百分點，是承擔東南亞平台股波動的補償，不是保證報酬。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;grid2 wide&quot;&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;公債殖利率每變動 1 個百分點，合理價值中點的變化（美元；紅色虛線為現價 3.24）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 500 142&quot; role=&quot;img&quot; aria-label=&quot;利率敏感度&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;168.0&quot; x2=&quot;168.0&quot; y1=&quot;6&quot; y2=&quot;136&quot; class=&quot;zero&quot;/&gt;&lt;line x1=&quot;375.2&quot; x2=&quot;375.2&quot; y1=&quot;4&quot; y2=&quot;138&quot; class=&quot;price&quot;/&gt;&lt;text x=&quot;158&quot; y=&quot;23&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;公債−1%（4.15%）&lt;/text&gt;&lt;rect x=&quot;168.0&quot; y=&quot;9&quot; width=&quot;249.1&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c1)&quot;/&gt;&lt;text x=&quot;425.1&quot; y=&quot;23&quot; class=&quot;val&quot;&gt;4&lt;/text&gt;&lt;text x=&quot;158&quot; y=&quot;63&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;目前公債（5.15%）&lt;/text&gt;&lt;rect x=&quot;168.0&quot; y=&quot;49&quot; width=&quot;218.2&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c3)&quot;/&gt;&lt;text x=&quot;394.2&quot; y=&quot;63&quot; class=&quot;val&quot;&gt;3&lt;/text&gt;&lt;text x=&quot;158&quot; y=&quot;103&quot; class=&quot;lab&quot; text-anchor=&quot;end&quot;&gt;公債＋1%（6.15%）&lt;/text&gt;&lt;rect x=&quot;168.0&quot; y=&quot;89&quot; width=&quot;195.8&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;var(--c2)&quot;/&gt;&lt;text x=&quot;371.8&quot; y=&quot;103&quot; class=&quot;val&quot;&gt;3&lt;/text&gt;&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:8px&quot;&gt;股債利差只作「相對自身歷史的位置」：名目利率對實質盈餘有方法限制，不影響估值與研究評等。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;block&quot;&gt;&lt;h3&gt;同業與產業對照&lt;/h3&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;與個別同業比較&lt;/h4&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;同業 EV/營業利益用 UBER、DASH、CART 三家（LYFT 營業利益為負不列），p25–p75 換算每股約 2.25–3.88 美元，只作交叉核對、不進評等（估值結果 同業倍數明細）。&lt;/p&gt;&lt;p&gt;Grab 營業利益率 5.1%（GRAB，資料商 yfinance，近四季截至 2026-09-30），低於 UBER 12.4%（UBER，資料商 yfinance，近四季截至 2026-09-30）&lt;span class=&quot;src&quot;&gt;（兩家都是 yfinance 口徑；Grab 的 IFRS 近四季為集團 5.1%、平台約 7.2%，推導）&lt;/span&gt;；以作者推導的企業價值 9,402 計，對平台營業利益約 38 倍&lt;span class=&quot;src&quot;&gt;（推導）&lt;/span&gt;，市場仍為成長付溢價。&lt;/p&gt;&lt;/div&gt;&lt;figure class=&quot;figure&quot;&gt;&lt;p class=&quot;cap&quot;&gt;與個別同業比較：利潤率與投入強度（近四季）。資料期間：本公司 SEC 近四季（截至 2026-09-30）；同業為資料商（yfinance 季報加總）近四季，截至 UBER 2026-09-30、DASH 2026-09-30、LYFT 2026-09-30、CART 2026-09-30、SE 2026-09-30、Delivery Hero 期間未記、GoTo（GOTO.JK） 期間未記；資料商查詢 2026-11-15（批次收盤 2026-11-13）&lt;/p&gt;&lt;svg viewBox=&quot;0 0 560 300&quot; role=&quot;img&quot; aria-label=&quot;同業比較&quot; class=&quot;chart&quot;&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;266.0&quot; y2=&quot;266.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;270.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;-10%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;185.3&quot; y2=&quot;185.3&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;189.3&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;0%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;104.7&quot; y2=&quot;104.7&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;108.7&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;10%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;24.0&quot; y2=&quot;24.0&quot; class=&quot;grid&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;28.0&quot; class=&quot;ax&quot; text-anchor=&quot;end&quot;&gt;20%&lt;/text&gt;&lt;line x1=&quot;52&quot; x2=&quot;550&quot; y1=&quot;185.3&quot; y2=&quot;185.3&quot; class=&quot;zero&quot;/&gt;&lt;rect x=&quot;61.1&quot; y=&quot;144.5&quot; width=&quot;12.2&quot; height=&quot;40.8&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;營業利益率 GRAB：5%&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;89.6&quot; y=&quot;137.8&quot; width=&quot;12.2&quot; height=&quot;47.5&quot; rx=&quot;2&quot; fill=&quot;var(--c3)&quot;&gt;&lt;title&gt;資本支出占營收 GRAB：6%&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;82.5&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;GRAB&lt;/text&gt;&lt;rect x=&quot;122.2&quot; y=&quot;85.0&quot; width=&quot;12.2&quot; height=&quot;100.4&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;營業利益率 UBER：12%&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;136.4&quot; y=&quot;126.1&quot; width=&quot;12.2&quot; height=&quot;59.3&quot; rx=&quot;2&quot; fill=&quot;var(--c2)&quot;&gt;&lt;title&gt;研發占營收 UBER：7%&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;150.6&quot; y=&quot;180.9&quot; width=&quot;12.2&quot; height=&quot;4.5&quot; rx=&quot;2&quot; fill=&quot;var(--c3)&quot;&gt;&lt;title&gt;資本支出占營收 UBER：1%&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;143.5&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;UBER&lt;/text&gt;&lt;rect x=&quot;183.2&quot; y=&quot;140.6&quot; width=&quot;12.2&quot; height=&quot;44.8&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;營業利益率 DASH：6%&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;197.4&quot; y=&quot;97.8&quot; width=&quot;12.2&quot; height=&quot;87.5&quot; rx=&quot;2&quot; fill=&quot;var(--c2)&quot;&gt;&lt;title&gt;研發占營收 DASH：11%&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;211.6&quot; y=&quot;149.9&quot; width=&quot;12.2&quot; height=&quot;35.5&quot; rx=&quot;2&quot; fill=&quot;var(--c3)&quot;&gt;&lt;title&gt;資本支出占營收 DASH：4%&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;204.5&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;DASH&lt;/text&gt;&lt;rect x=&quot;244.2&quot; y=&quot;185.3&quot; width=&quot;12.2&quot; height=&quot;18.9&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;營業利益率 LYFT：-2%&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;258.4&quot; y=&quot;130.2&quot; width=&quot;12.2&quot; height=&quot;55.2&quot; rx=&quot;2&quot; fill=&quot;var(--c2)&quot;&gt;&lt;title&gt;研發占營收 LYFT：7%&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;272.6&quot; y=&quot;173.3&quot; width=&quot;12.2&quot; height=&quot;12.0&quot; rx=&quot;2&quot; fill=&quot;var(--c3)&quot;&gt;&lt;title&gt;資本支出占營收 LYFT：1%&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;265.5&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;LYFT&lt;/text&gt;&lt;rect x=&quot;305.1&quot; y=&quot;69.1&quot; width=&quot;12.2&quot; height=&quot;116.3&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;營業利益率 CART：14%&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;319.4&quot; y=&quot;43.2&quot; width=&quot;12.2&quot; height=&quot;142.1&quot; rx=&quot;2&quot; fill=&quot;var(--c2)&quot;&gt;&lt;title&gt;研發占營收 CART：18%&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;333.6&quot; y=&quot;174.1&quot; width=&quot;12.2&quot; height=&quot;11.3&quot; rx=&quot;2&quot; fill=&quot;var(--c3)&quot;&gt;&lt;title&gt;資本支出占營收 CART：1%&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;326.5&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;CART&lt;/text&gt;&lt;rect x=&quot;366.1&quot; y=&quot;119.5&quot; width=&quot;12.2&quot; height=&quot;65.8&quot; rx=&quot;2&quot; fill=&quot;var(--c1)&quot;&gt;&lt;title&gt;營業利益率 SE：8%&lt;/title&gt;&lt;/rect&gt;&lt;rect x=&quot;380.4&quot; y=&quot;153.7&quot; width=&quot;12.2&quot; height=&quot;31.7&quot; rx=&quot;2&quot; fill=&quot;var(--c2)&quot;&gt;&lt;title&gt;研發占營收 SE：4%&lt;/title&gt;&lt;/rect&gt;&lt;text x=&quot;387.5&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;SE&lt;/text&gt;&lt;text x=&quot;448.5&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;Delivery Hero&lt;/text&gt;&lt;text x=&quot;509.5&quot; y=&quot;288&quot; class=&quot;ax&quot; text-anchor=&quot;middle&quot;&gt;GoTo（GOTO.JK）&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c1)&quot;&gt;&lt;/i&gt;營業利益率&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c2)&quot;&gt;&lt;/i&gt;研發占營收&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--c3)&quot;&gt;&lt;/i&gt;資本支出占營收&lt;/span&gt;&lt;/div&gt;&lt;/figure&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;h4&gt;我們的假設 vs 產業常見範圍&lt;/h4&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;p&gt;&lt;strong class=&quot;lead&quot;&gt;多數假設比產業保守或接近，偏樂觀的是銷售對投入資本與穩態利潤率（產業值為 Damodaran 同產業資料，產業基準對照.json）。&lt;/strong&gt;股權薪酬占營收遠高於產業，第三題已扣除後看現金流。&lt;/p&gt;&lt;p&gt;投資損益：2026 前九月財務收入含 Superbank 原持股重估利得 322（6-K 2026-08-13 §41），屬一次性，估值不計。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;figure&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt signals&quot;&gt;&lt;tr&gt;&lt;th&gt;項目&lt;/th&gt;&lt;th&gt;本報告&lt;/th&gt;&lt;th&gt;產業常見&lt;/th&gt;&lt;th&gt;說明&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;第 1 年營業利益率&lt;/td&gt;&lt;td&gt;10%&lt;/td&gt;&lt;td&gt;12.3%&lt;/td&gt;&lt;td&gt;穩態 19% 高於產業，理由見假設理由&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;銷售對投入資本&lt;/td&gt;&lt;td&gt;4.0&lt;/td&gt;&lt;td&gt;2.8&lt;/td&gt;&lt;td&gt;作者判斷（估值輸入再投資說明）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;期末資本報酬率&lt;/td&gt;&lt;td&gt;9.0%&lt;/td&gt;&lt;td&gt;28.3%&lt;/td&gt;&lt;td&gt;等於資金成本（無護城河設定）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Beta&lt;/td&gt;&lt;td&gt;1.04&lt;/td&gt;&lt;td&gt;0.89&lt;/td&gt;&lt;td&gt;2 年週報酬與產業重新加槓桿的平均&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;折現率&lt;/td&gt;&lt;td&gt;9.0%&lt;/td&gt;&lt;td&gt;7.2%&lt;/td&gt;&lt;td&gt;beta 與無風險利率較高&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;稅率&lt;/td&gt;&lt;td&gt;20%&lt;/td&gt;&lt;td&gt;24.7%&lt;/td&gt;&lt;td&gt;營運國法定約 17–25%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;股權薪酬占營收&lt;/td&gt;&lt;td&gt;5.9%（234÷3,970，推導）&lt;/td&gt;&lt;td&gt;1.4%&lt;/td&gt;&lt;td&gt;近四季&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;研發占營收&lt;/td&gt;&lt;td&gt;未揭露&lt;/td&gt;&lt;td&gt;1.2%&lt;/td&gt;&lt;td&gt;公司未申報研發科目&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;details id=&quot;claims&quot;&gt;&lt;summary&gt;論點檢查：每條判斷的證據狀態&lt;/summary&gt;&lt;div&gt;&lt;div class=&quot;figure wide&quot;&gt;&lt;p class=&quot;cap&quot;&gt;依風險分類的主張（證據狀態：支持／部分支持／提出反證／資料不足）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;txt &quot;&gt;&lt;tr&gt;&lt;th&gt;編號&lt;/th&gt;&lt;th&gt;風險類別&lt;/th&gt;&lt;th&gt;主張&lt;/th&gt;&lt;th&gt;角色&lt;/th&gt;&lt;th&gt;證據狀態&lt;/th&gt;&lt;th&gt;什麼會改變判斷&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;GRAB-C06&lt;/td&gt;&lt;td&gt;R1 資金與流動性&lt;/td&gt;&lt;td&gt;成長所需資金不是問題：公司口徑淨流動性 50 億，主要債務是 2030 年到期的零息可轉債。&lt;/td&gt;&lt;td&gt;支持論點&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;公司口徑淨流動性降到 30 億以下或可轉債被要求現金贖回&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;GRAB-C15&lt;/td&gt;&lt;td&gt;R2 償債負擔與永久損失&lt;/td&gt;&lt;td&gt;2026-09-30 借款 20.7 億（含租賃），遠低於總現金流動性 71 億；可轉債零息、無定期付息。&lt;/td&gt;&lt;td&gt;支持論點&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;借款扣租賃後超過總現金流動性的一半，或可轉債轉為以現金贖回&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;GRAB-C01&lt;/td&gt;&lt;td&gt;R3 成長退坡與競爭&lt;/td&gt;&lt;td&gt;Grab 在東南亞叫車與外送的雙邊網路有規模優勢：用戶、司機與 GMV 同時成長，獎勵金占 GMV 季減 17 個基點、但年增約 65 個基點（推導）。&lt;/td&gt;&lt;td&gt;支持論點&lt;/td&gt;&lt;td&gt;部分支持&lt;/td&gt;&lt;td&gt;On-Demand 獎勵金占 GMV 連兩季上升，且外送分部調整後 EBITDA 占 GMV 回落到 2.1% 以下&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;GRAB-C02&lt;/td&gt;&lt;td&gt;R3 成長退坡與競爭&lt;/td&gt;&lt;td&gt;印尼兩輪司機抽成已自 2026-07-01 由 20% 降到 8%（新聞），若擴及四輪或把司機改列準雇員，平台利潤率會再受壓。&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;部分支持&lt;/td&gt;&lt;td&gt;叫車分部調整後 EBITDA 占 GMV 連兩季低於 8%，或印尼把抽成上限擴及四輪、司機改列準雇員的規定正式生效&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;GRAB-C03&lt;/td&gt;&lt;td&gt;R3 成長退坡與競爭&lt;/td&gt;&lt;td&gt;平台營收成長主要來自內生：不含金融服務的平台近四季年增約 18%（推導），金融服務的高成長則含 Superbank、Stash 併表。&lt;/td&gt;&lt;td&gt;支持論點&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;平台單季營收年增連兩季低於 12%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;GRAB-C05&lt;/td&gt;&lt;td&gt;R3 成長退坡與競爭&lt;/td&gt;&lt;td&gt;金融服務已轉正，但放款一年成長 200%，信用品質還沒經過完整循環。&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;部分支持&lt;/td&gt;&lt;td&gt;逾 90 天不良貸款率升破 4% 或預期信用損失覆蓋降到 1.5 倍以下&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;GRAB-C16&lt;/td&gt;&lt;td&gt;R3 成長退坡與競爭&lt;/td&gt;&lt;td&gt;成長跑道的市場空間無法量化：公司未揭露目標市場規模與滲透率，只揭露月交易用戶 2025 年 4,720 萬、年增 14%。&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;資料不足&lt;/td&gt;&lt;td&gt;月交易用戶年增連兩季低於 5%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;GRAB-C17&lt;/td&gt;&lt;td&gt;R3 成長退坡與競爭&lt;/td&gt;&lt;td&gt;成長靠量不靠價：叫車交易數年增 21% 快於 GMV 14%，外送 GMV 年增 21% 來自用戶與頻率，公司沒有價量拆解，看不到定價能力。&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;部分支持&lt;/td&gt;&lt;td&gt;叫車 GMV 年增連兩季高於交易數年增且分部利潤率上升&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;GRAB-C18&lt;/td&gt;&lt;td&gt;R3 成長退坡與競爭&lt;/td&gt;&lt;td&gt;營運槓桿正在顯現：集團營業利益由 FY2025 65 升到近四季 201，增量營業利益率約 23%（推導），獎勵金占 GMV 季減但年增（推導）。&lt;/td&gt;&lt;td&gt;支持論點&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;近四季營業利益率連兩季下降&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;GRAB-C08&lt;/td&gt;&lt;td&gt;R4 投入回報不足&lt;/td&gt;&lt;td&gt;投入資本報酬還無法用 ROIC 衡量：營運投入資本為負，增量回報分母太小。&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;資料不足&lt;/td&gt;&lt;td&gt;連兩個財年營業利益率超過 8% 且營運投入資本轉正&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;GRAB-C12&lt;/td&gt;&lt;td&gt;R4 投入回報不足&lt;/td&gt;&lt;td&gt;2026 年連續併購與新投資（Superbank、Stash、Atome、馬來西亞 AI 資料中心；foodpanda 台灣遭否決）讓資本配置的回報待驗證，且後續付款大：Atome 需付現金 14.9 億美元、資料中心承諾出資 7.5 億，Stash 剩餘款金額未單獨揭露。&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;部分支持&lt;/td&gt;&lt;td&gt;原觸發「Stash 或 Atome 相關負債或承諾超過 5 億美元」已成立（Atome 60% 現金對價 14.9 億美元，6-K 2026-09-15#1 附件 §9），11-09 又承諾資料中心 7.5 億（6-K 2026-11-09#2 本文 §2）；作者判斷維持部分支持、治理與資本配置維持「中」：Atome 實際流出約 12.3 億、資料中心依客戶合約里程碑分階段投入，兩者都換得資產或股權，全額出資後公司口徑淨流動性約 30 億（50−12.3−7.5−0.6，推導；全扣 14.9 億約 27 億；未計剩餘回購與期間自由現金流）；第二階段約 2029 年依公式收購其餘 40%（40% 約 8–18 億，推導），在 12 個月區間外、有上限，仍維持；20-F 2026 年報揭露 Stash 剩餘付款負債超過 5 億美元、Atome 交割後公司口徑流動性淨額轉負，或 Atome 第二階段（約 2029 年）公告以股票支付為主或股權估值達上限 45 億美元（40% 約 18 億，推導）（Atome 第一階段見上一條）；資料中心最終協議顯示 Grab 出資超過 7.5 億、提供債務擔保，或 2027 年前未取得客戶合約仍持續投入&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;GRAB-C09&lt;/td&gt;&lt;td&gt;R5 收入與盈餘品質&lt;/td&gt;&lt;td&gt;IFRS 營運現金流被銀行存款與放款扭曲，自由現金流要看調整後口徑並扣股權薪酬。&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;調整後自由現金流近四季扣股權薪酬後轉負&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;GRAB-C10&lt;/td&gt;&lt;td&gt;R6 治理與資料可信度&lt;/td&gt;&lt;td&gt;雙重股權讓創辦人控制公司，外部股東對資本配置的影響有限。&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;B 類股每股投票權降低或 B 類股轉為 A 類股使創辦人投票權跌破過半&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;GRAB-C04&lt;/td&gt;&lt;td&gt;R7 估值與市場預期&lt;/td&gt;&lt;td&gt;現價隱含平台第 1–5 年營收年增約 12.1%，與本報告基準約 12.3% 相當：市場已計入基準成長，沒有額外的成長安全空間。&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;平台單季營收年增連兩季低於 12%；平台單季年增回升並維持在 20% 以上兩季&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;GRAB-C07&lt;/td&gt;&lt;td&gt;R7 估值與市場預期&lt;/td&gt;&lt;td&gt;樂觀情境的十年路徑有公司展望支撐，但只是管理層說法。&lt;/td&gt;&lt;td&gt;支持論點&lt;/td&gt;&lt;td&gt;部分支持&lt;/td&gt;&lt;td&gt;2027 年調整後 EBITDA 指引低於 10 億&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;GRAB-C14&lt;/td&gt;&lt;td&gt;R7 估值與市場預期&lt;/td&gt;&lt;td&gt;現價落在合理區，但結論對現金口徑敏感：若只計現金不計其他投資，合理價值中點約低 29%（推導），收盤會高於合理上緣。&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;公司改變總現金流動性定義或大額動用其他投資於併購&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;GRAB-C19&lt;/td&gt;&lt;td&gt;R7 估值與市場預期&lt;/td&gt;&lt;td&gt;2026 年營收指引兩度上修（40.4–41.0 億 → 41.0–41.5 億 → 41.5–42.0 億），短期執行紀錄良好，但更早年度的指引未存檔、未逐季比對。&lt;/td&gt;&lt;td&gt;支持論點&lt;/td&gt;&lt;td&gt;部分支持&lt;/td&gt;&lt;td&gt;2026 全年營收低於 41.5 億或 2027 年指引低於 2025–2028 年複合 20% 路徑&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;GRAB-C13&lt;/td&gt;&lt;td&gt;R8 宏觀與共同曝險&lt;/td&gt;&lt;td&gt;東南亞貨幣走勢影響美元營收：2026Q3 集團營收年增 27%，固定匯率為 30%。&lt;/td&gt;&lt;td&gt;可能出錯的地方&lt;/td&gt;&lt;td&gt;支持&lt;/td&gt;&lt;td&gt;固定匯率與報告幣別年增差距擴大到 5 個百分點以上&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;GRAB-C11&lt;/td&gt;&lt;td&gt;R9 稀釋與股東回饋&lt;/td&gt;&lt;td&gt;回購抵銷稀釋：2024 年起累計授權回購 17.5 億，公司稱全部完成後可註銷逾 10% 股數，但 Stash 剩餘款可用股票付款、股權薪酬也會增加股數。&lt;/td&gt;&lt;td&gt;支持論點&lt;/td&gt;&lt;td&gt;部分支持&lt;/td&gt;&lt;td&gt;20-F 2026 年報顯示流通股數年增超過 2%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:6px&quot;&gt;並列：研究評等 生意 B ／ 價格合理；價格位置 合理；現價隱含年報酬（基準情境，非預期報酬） 9.0%。各列狀態與價格分開呈現，不合成分數，狀態件數也不代表強弱（非買賣建議）。&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;details id=&quot;foreign&quot;&gt;&lt;summary&gt;外國發行人須知：準則與幣別、匯率、股類與 ADR、比較調整、揭露對照&lt;/summary&gt;&lt;div class=&quot;block&quot;&gt;&lt;p class=&quot;cap&quot;&gt;申報：20-F（年報）＋6-K（季度與事件）｜會計準則：IFRS｜報告幣別：USD｜財年結束：1231｜季度來源：6-K季度（6-K 附 XBRL 的只有半年度（期末 2025-06-30, 2026-06-30），不當季報；近 15 個月 6-K 期末為季末者 5 期（2025-06-30, 2025-09-30, 2026-03-31, 2026-06-30, 2026-09-30）；新聞稿表格由 取得6K季報.py 解析）&lt;/p&gt;&lt;h3&gt;股類與 ADR&lt;/h3&gt;&lt;p class=&quot;cap&quot;&gt;ADR 比例：不適用：普通股直接掛牌。&lt;/p&gt;&lt;h3&gt;與美國 GAAP 公司比較時的調整（只揭露，不全面轉 GAAP；不是公司優劣）&lt;/h3&gt;&lt;ul class=&quot;cap&quot;&gt;&lt;li&gt;租賃（IFRS 16）：沒有營業租賃費用，EBITDA 與營運現金流比美國 GAAP 公司高；自由現金流另列扣租賃本金版（近四季租賃本金 52 百萬美元）&lt;/li&gt;&lt;li&gt;利息分類（IAS 7）：實付利息列在融資活動：營運現金流偏高，另列再扣支付利息版&lt;/li&gt;&lt;li&gt;開發成本資本化（IAS 38）：研發費用可能偏低、無形資產偏高；資本化金額見附註&lt;/li&gt;&lt;li&gt;存貨（IAS 2）：禁用 LIFO；與用 LIFO 的美國同業毛利不可直接比&lt;/li&gt;&lt;li&gt;減損迴轉（IAS 36）：可能有迴轉利益，視為一次性項目&lt;/li&gt;&lt;li&gt;每股盈餘與類股（IAS 33）：多類股時不加總各類 EPS，依經濟權益配對&lt;/li&gt;&lt;/ul&gt;&lt;h3&gt;揭露對照（美國申報人文件 → 本公司對應）&lt;/h3&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;美國申報人&lt;/th&gt;&lt;th&gt;本公司&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;10-K 年報&lt;/td&gt;&lt;td&gt;20-F（Item 3 風險、4 業務、5 經營與財務檢討、18 財報）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;10-Q 季報&lt;/td&gt;&lt;td&gt;6-K 新聞稿表格（非 XBRL，程式解析，原文出處在 財報/6K季報索引.json）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;8-K 重大事件&lt;/td&gt;&lt;td&gt;6-K（沒有 Item 代碼；分類為關鍵字初篩）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;DEF 14A 委託書、Pay vs Performance&lt;/td&gt;&lt;td&gt;不適用：外國私人發行人；薪酬改引 20-F Item 6（只揭露合計時不拆個人）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Form 4 內部人&lt;/td&gt;&lt;td&gt;有申報&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;用語：未揭露＝公司應有但沒寫；不適用＝制度上沒有；未申報＝豁免而沒交。國家風險溢酬只揭露、未進折現率（決定 F4）；估值以美元進行（美國 10 年公債、Damodaran 美國風險溢酬，決定 F6）。&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;details id=&quot;risks-more&quot;&gt;&lt;summary&gt;其他風險與改判條件（超過首頁上限的部分）&lt;/summary&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;risk-tbl&quot; style=&quot;min-width:0;width:100%&quot;&gt;&lt;tr&gt;&lt;th style=&quot;white-space:normal;width:64%&quot;&gt;情況（看哪個指標、門檻多少）&lt;/th&gt;&lt;th style=&quot;white-space:normal;width:22%&quot;&gt;會改變什麼判斷&lt;/th&gt;&lt;th style=&quot;white-space:normal;width:14%&quot;&gt;歷史基準比率&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;創辦人以雙重股權控制，外部股東影響有限&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:left&quot;&gt;未設門檻：持續觀察&lt;/td&gt;&lt;td style=&quot;white-space:normal;text-align:right&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/details&gt;&lt;details id=&quot;glossary&quot;&gt;&lt;summary&gt;名詞小抄&lt;/summary&gt;&lt;dl class=&quot;gl&quot;&gt;&lt;dt id=&quot;g0&quot;&gt;GMV（Gross Merchandise Value）&lt;/dt&gt;&lt;dd&gt;平台上交易總額，含付給司機與商家的部分；營收是 Grab 抽成後淨額。&lt;/dd&gt;&lt;dt id=&quot;g1&quot;&gt;調整後 EBITDA（Adjusted EBITDA）&lt;/dt&gt;&lt;dd&gt;公司自定的非 IFRS 獲利口徑，排除股權薪酬、折舊等。&lt;/dd&gt;&lt;dt id=&quot;g2&quot;&gt;調整後自由現金流（Adjusted Free Cash Flow）&lt;/dt&gt;&lt;dd&gt;公司自定口徑，排除金融分部放款與存款等流動性變動。&lt;/dd&gt;&lt;dt id=&quot;g3&quot;&gt;總現金流動性（Gross cash liquidity）&lt;/dt&gt;&lt;dd&gt;現金、定存、有價證券與受限現金合計（6-K 2026-11-03 §41）。&lt;/dd&gt;&lt;dt id=&quot;g4&quot;&gt;公司口徑淨流動性（Net cash liquidity）&lt;/dt&gt;&lt;dd&gt;定義見 6-K 2026-11-03 §41：總現金流動性減借款（含租賃），含銀行以存款持有的流動性；和本報告的淨現金口徑不同。&lt;/dd&gt;&lt;dt id=&quot;g5&quot;&gt;其他請求權（other claims）&lt;/dt&gt;&lt;dd&gt;股權價值要先扣除的少數股權等項目。&lt;/dd&gt;&lt;dt id=&quot;g6&quot;&gt;市價反推&lt;/dt&gt;&lt;dd&gt;固定其他假設，倒算現價隱含的營收成長或利潤率；兩者各自單獨放開。&lt;/dd&gt;&lt;dt id=&quot;g7&quot;&gt;買入區上緣&lt;/dt&gt;&lt;dd&gt;合理價值中點再打安全邊際折扣後的價格：中點 ×（1－安全邊際 30%）。股價在它以下才算買入區；不是保守情境價值，也不是買賣建議。&lt;/dd&gt;&lt;dt id=&quot;g8&quot;&gt;IFRS&lt;/dt&gt;&lt;dd&gt;國際財務報導準則；Grab 以此編製財報，與美國公認會計原則口徑不同。&lt;/dd&gt;&lt;dt id=&quot;g9&quot;&gt;EV（企業價值）&lt;/dt&gt;&lt;dd&gt;市值加債務減現金等，代表買下整家公司的代價。&lt;/dd&gt;&lt;dt id=&quot;g10&quot;&gt;ROIC（投入資本報酬率）&lt;/dt&gt;&lt;dd&gt;稅後營業利益除以營運投入資本。&lt;/dd&gt;&lt;dt id=&quot;g11&quot;&gt;UBER／DASH／CART&lt;/dt&gt;&lt;dd&gt;同業代號：Uber、DoorDash、Instacart（Maplebear）。&lt;/dd&gt;&lt;dt id=&quot;g12&quot;&gt;Atome Financial&lt;/dt&gt;&lt;dd&gt;東南亞先買後付與消費放款業者，Grab 2026-09 簽約以現金 14.9 億美元收購 60%（6-K 2026-09-15）。&lt;/dd&gt;&lt;dt id=&quot;g13&quot;&gt;Superbank、Stash&lt;/dt&gt;&lt;dd&gt;Superbank 是印尼數位銀行（2026-06 併表）；Stash 是美國理財 App（2026-07 收購，交割付 50.1%）。&lt;/dd&gt;&lt;dt id=&quot;g14&quot;&gt;GXS Bank、GXBank、OVO&lt;/dt&gt;&lt;dd&gt;Grab 在新加坡、馬來西亞的數位銀行，與印尼電子支付 OVO（20-F Item 4 ¶116）。&lt;/dd&gt;&lt;dt id=&quot;g15&quot;&gt;PETROS&lt;/dt&gt;&lt;dd&gt;馬來西亞沙撈越州國營綜合能源公司，與軟銀、Grab 共同開發 AI 資料中心（6-K 2026-11-09#2 附件 §16）。&lt;/dd&gt;&lt;/dl&gt;&lt;/details&gt;&lt;details id=&quot;numbers-table&quot;&gt;&lt;summary&gt;完整數字表格：三大報表摘要（年度與 8 季，供查；圖在正文「完整數字」）&lt;/summary&gt;&lt;p class=&quot;cap&quot; style=&quot;margin-top:14px&quot;&gt;損益表（年度與近四季）&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;億美元&lt;/th&gt;&lt;th&gt;FY22&lt;/th&gt;&lt;th&gt;FY23&lt;/th&gt;&lt;th&gt;FY24&lt;/th&gt;&lt;th&gt;FY25&lt;/th&gt;&lt;th&gt;近四季&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;營收&lt;/td&gt;&lt;td&gt;14.3&lt;/td&gt;&lt;td&gt;23.6&lt;/td&gt;&lt;td&gt;28.0&lt;/td&gt;&lt;td&gt;33.7&lt;/td&gt;&lt;td&gt;39.7&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;毛利&lt;/td&gt;&lt;td&gt;0.8&lt;/td&gt;&lt;td&gt;8.6&lt;/td&gt;&lt;td&gt;11.7&lt;/td&gt;&lt;td&gt;14.6&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;研發費用&lt;/td&gt;&lt;td&gt;4.7&lt;/td&gt;&lt;td&gt;4.2&lt;/td&gt;&lt;td&gt;4.1&lt;/td&gt;&lt;td&gt;4.3&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;營業利益&lt;/td&gt;&lt;td&gt;-13.7&lt;/td&gt;&lt;td&gt;-5.2&lt;/td&gt;&lt;td&gt;-1.7&lt;/td&gt;&lt;td&gt;0.7&lt;/td&gt;&lt;td&gt;2.0&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;利息費用&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;稅前利益&lt;/td&gt;&lt;td&gt;-17.3&lt;/td&gt;&lt;td&gt;-4.7&lt;/td&gt;&lt;td&gt;-0.9&lt;/td&gt;&lt;td&gt;2.7&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;所得稅&lt;/td&gt;&lt;td&gt;0.1&lt;/td&gt;&lt;td&gt;0.2&lt;/td&gt;&lt;td&gt;0.6&lt;/td&gt;&lt;td&gt;0.7&lt;/t .stages{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0}

.callout{background:var(--surface);border-left:4px solid var(--biz);border-radius:8px;padding:12px 16px;margin:12px 0}

.chart{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
